  # ---------------------------------------------------------------
  # BACKLOG ITEM 2: CVE-2026-59310 VMware vCenter Syslog traversal
  # ---------------------------------------------------------------
  - title: "CVE-2026-59310 — VMware vCenter Syslog directory traversal to RCE: KEV-listed, 361 victims in 47 countries, and the China-nexus attribution plus the Babuk-ransomware claim both trace to the SAME single IR firm"
    sources:
      - { url: "https://www.infosecurity-magazine.com/news/vcenter-cve-2026-59310-exploited/", publisher: "Infosecurity Magazine", date: "2026-08-14", role: corroborating }
      - { url: "https://thehackernews.com/2026/08/suspected-china-nexus-actor-exploits.html", publisher: "The Hacker News", date: "2026-08-17", role: corroborating }
      - { url: "https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/38017", publisher: "Broadcom (VMSA-2026-0006)", date: "2026-07-29", role: primary }
    discovery_trace: "first seen at: coverage-backlog re-verification task (CISA KEV bridge, dateAdded 2026-08-18 confirmed) -> pivot: The Hacker News, URL https://thehackernews.com/2026/08/suspected-china-nexus-actor-exploits.html -> primary: QUIRSO GmbH Medium write-ups (unreachable this run — see note), corroborated via https://www.infosecurity-magazine.com/news/vcenter-cve-2026-59310-exploited/ -> vendor advisory: Broadcom VMSA-2026-0006, URL https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/38017"
    summary: |
      CISA added CVE-2026-59310 to KEV on 2026-08-18. It is a directory-traversal vulnerability
      (CWE-22, CVSS 9.8) in the vCenter Syslog server: an unauthenticated, network-adjacent
      attacker sends a crafted request containing path-traversal sequences that let a payload
      escape the Syslog service's intended directory scope and write an executable to a location
      the vCenter service account controls, yielding arbitrary code execution. Broadcom's advisory
      (VMSA-2026-0006, published 2026-07-29) covers vCenter 7.0/8.0/9.0.x/9.1.x, VMware Cloud
      Foundation, vSphere Foundation and Telco Cloud products; fixed in vCenter 9.1.0.0300,
      9.0.2.0100, 8.0 U3k/U2f (7.0 requires an extended-support contract). German IR firm QUIRSO
      GmbH reports the first victim connections to attacker infrastructure appeared 2026-08-03 —
      five calendar days after disclosure — reaching 361 unique victim IPs across 47 countries by
      2026-08-05 (95% of the eventual total), concentrated in Germany, the US, Turkey, Iran and
      France. Post-exploitation involved a custom "linuxFile" backdoor, persistence via cron/
      systemd, and reverse-SSH access; in at least one investigated case Babuk-derived ransomware
      (".babyk" extension) was deployed against ESXi hosts. QUIRSO assesses the actor is a
      suspected China-nexus, Chinese-speaking operator (UTC+08:00 activity pattern, Chinese-
      language code artifacts, reuse of a Chinese security publication) with moderate confidence,
      and separately assesses the ransomware deployment was "not necessarily the primary
      objective" but plausibly a smokescreen to encrypt ESXi log files and hinder forensics.
      Both the attribution assessment and the ransomware-deployment finding come from QUIRSO's
      own investigation of a single incident — no second, independent research team has
      corroborated either claim; every outlet surveyed in this run (The Hacker News, Infosecurity
      Magazine, SecurityWeek, Dark Reading-class coverage) cites the same QUIRSO Medium
      write-ups as its sole source. Treat both as a single assessor's finding, not
      cross-corroborated intelligence.
    region_nexus: "global; Germany is among the top-hit countries by IP count"
    primary_sector_nexus: "indirect"
    sector: "public-sector, technology, telco"
    cves: [CVE-2026-59310]
    techniques: [T1190, T1572, T1486]
    affected_products: ["VMware vCenter Server", "VMware Cloud Foundation", "VMware vSphere Foundation", "VMware Telco Cloud Platform"]
    entity_keys: []
    new_entities: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "The activity, which commenced five calendar days after public disclosure of the flaw, is estimated to have compromised 361 unique victim IP addresses across 47 countries."
        attribution: "The Hacker News, citing QUIRSO GmbH"
        source_url: "https://thehackernews.com/2026/08/suspected-china-nexus-actor-exploits.html"
      - quote: "The digital forensics company assessed a suspected advanced persistent threat (APT) actor was responsible, counting 361 victim IP addresses across 47 countries"
        attribution: "Infosecurity Magazine, citing QUIRSO"
        source_url: "https://www.infosecurity-magazine.com/news/vcenter-cve-2026-59310-exploited/"
      - quote: "The deployment [of Babuk-derived ransomware] may not have been the primary objective of the campaign"
        attribution: "The Hacker News, paraphrasing QUIRSO's assessment"
        source_url: "https://thehackernews.com/2026/08/suspected-china-nexus-actor-exploits.html"
    extended_notes: |
      Coverage-gap note: QUIRSO's own Medium write-ups (the two primary posts — the original
      exploitation report and the "Great Clean-Up Job" follow-up covering the ransomware finding)
      were unreachable in this run: medium.com returned a direct 403, trafilatura found no
      readable body, and the jina reader fallback failed because every credential in the pool
      reported HTTP 402 (balance exhausted) at fetch time. I relied on two independent news
      outlets (The Hacker News, Infosecurity Magazine) that each quote QUIRSO's findings at
      length, plus Broadcom's own VMSA for the patch/version data. The single-assessor caveat
      above is the analytically important finding here, not a caveat about my own sourcing.

  # ---------------------------------------------------------------
  # BACKLOG ITEM 3: Splunk SVD-2026-0801
  # ---------------------------------------------------------------
  - title: "Splunk Enterprise August 2026 hardening release (SVD-2026-0801): ~55 CVEs, three unauthenticated CVSS 9.4 embedded-report session-hijack flaws headline the batch"
    sources:
      - { url: "https://advisory.splunk.com/advisories/SVD-2026-0801", publisher: "Splunk (SVD-2026-0801)", date: "2026-08-19", role: primary }
    discovery_trace: "first seen at: coverage-backlog re-verification task, URL https://advisory.splunk.com/advisories/SVD-2026-0801 -> primary (no pivot needed; transcribed from Splunk's own CSAF-style advisory page)"
    summary: |
      Splunk's SVD-2026-0801 (published 2026-08-19, highest CVSS 9.4) fixes Splunk Enterprise
      10.4.0-10.4.1 -> 10.4.2, 10.2.0-10.2.5 -> 10.2.6, 10.0.0-10.0.8 -> 10.0.9, and
      9.4.0-9.4.13 -> 9.4.14, across roughly 55 CVEs. The confirmed headline is a trio of
      unauthenticated CVSS 9.4 embedded-report session-hijack flaws (CWE-284, Improper Access
      Control): CVE-2026-76310 (Embedded Report REST API Requests), CVE-2026-76311 (Embedded
      Report Dispatch Archives) and CVE-2026-76312 (Embedded Reports generally) all let an
      unauthenticated visitor who merely holds an embedded-report token — or, for -76312, who
      can read the HTML source of any page embedding a Splunk report — download the report's
      search-job dispatch archive and recover session material embedded in it, then reuse that
      material to act as the report owner, including as an admin-role owner. Splunk's stated
      mitigation is to set allowEmbedTokenAuth = false in server.conf if embedding is unused, or
      (for -76312) to turn off Splunk Web. I could not confirm a single CVE in this advisory that
      Splunk itself labels as reaching "the credential store" via privileged SPL escalation — the
      two closest candidates are CVE-2026-76350 (Improper Privilege Management through PDF
      Attachments for Email Alert Actions, CVSS 8.8: a user holding only the schedule_search
      capability can configure a PDF-attachment alert action that Splunk's scheduler then renders
      under a system-level authentication context rather than the action owner's, executing
      arbitrary SPL with system-level privileges and system-wide data exposure) and
      CVE-2026-76260 (Incorrect Permission Assignment for Critical Resource, CVSS 6.5 Medium: a
      role holding only rest_properties_get — rather than the correct list_storage_passwords
      capability — can read encrypted stored credentials through the properties REST endpoint).
      Neither is phrased by Splunk as "SPL escalation reaching the credential store" verbatim;
      report both facts rather than force a single CVE to match that framing. Other high-severity
      items in the batch: five distinct RCE-class CVEs (76313 REST API knowledge-bundle upload,
      76314/76335 Web Manager Configuration XML evaluation, 76319 Federated Search, 76345 lower
      severity variant), a stored-credential-exposing SPL injection via the geostats command
      (76339, requires phishing a higher-privileged user), and an SSRF in the Secure Gateway
      Report Notification REST API reachable with only schedule-level privilege (76351, CVSS
      8.8) that can mint a system-level session token with no password. No exploitation is
      reported for any CVE in the batch.
    region_nexus: "global"
    primary_sector_nexus: "indirect"
    sector: "public-sector, finance, telco, technology"
    cves: [CVE-2026-76310, CVE-2026-76311, CVE-2026-76312, CVE-2026-76313, CVE-2026-76314, CVE-2026-76335, CVE-2026-76319, CVE-2026-76339, CVE-2026-76350, CVE-2026-76351, CVE-2026-76260, CVE-2026-76338]
    techniques: [T1190, T1550.001]
    affected_products: ["Splunk Enterprise", "Splunk Secure Gateway", "Splunk App for Splunk Observability Cloud"]
    entity_keys: []
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "an unauthenticated user who has an embedded report token could download the associated search job dispatch archive, recover session material, and use it to access all relevant data available to the report owner and affect system integrity, including by performing administrative actions when the owner holds the \"admin\" Splunk role"
        attribution: "Splunk (SVD-2026-0801, CVE-2026-76310 description)"
        source_url: "https://advisory.splunk.com/advisories/SVD-2026-0801"
      - quote: "a user that holds a role with the schedule_search capability could configure Portable Document Format (PDF) attachments in the email alert action workflow. When the email alert action runs, it could execute arbitrary Search Processing Language (SPL) commands with system-level privileges"
        attribution: "Splunk (SVD-2026-0801, CVE-2026-76350 description)"
        source_url: "https://advisory.splunk.com/advisories/SVD-2026-0801"
    extended_notes: |
      Single-source by design: this is a same-day transcription of the vendor's own advisory per
      the coverage-backlog tasking, with no independent researcher write-up yet published. The
      cve_table below carries only the CVSS>=8.0 subset plus the two credential-adjacent
      candidates discussed above — the full ~55-CVE list is at the source URL and was read in
      full during this run (nothing below CVSS 8.0 was omitted for space reasons that changes the
      analytic picture; the omitted CVEs are XSS/CSRF/lower-severity SPL-safeguard-bypass items
      requiring social engineering or admin-adjacent privilege).

  # ---------------------------------------------------------------
  # BACKLOG ITEM 4a: YOOtheme ZOO
  # ---------------------------------------------------------------
  - title: "YOOtheme ZOO for Joomla: unauthenticated file-upload RCE (CVSS 10.0) plus a precondition-free SQL injection — three releases in three days, and a second security line (YOOtheme Pro) shipped the same week"
    sources:
      - { url: "https://mysites.guru/blog/zoo-unauthenticated-file-upload-rce/", publisher: "mySites.guru", date: "2026-08-25", role: primary }
    discovery_trace: "first seen at: coverage-backlog re-verification task (mysites.guru/rss.xml) -> primary: mySites.guru, URL https://mysites.guru/blog/zoo-unauthenticated-file-upload-rce/ (live post, updated through 2026-08-25)"
    summary: |
      mySites.guru (Phil Taylor) found and reported three unauthenticated flaws in YOOtheme ZOO
      (com_zoo), a Joomla content-construction extension, affecting every version 1.0.0-4.1.63.
      CVE-2026-74803 (CVSS 10.0, CWE-434) is an arbitrary-file-upload-to-RCE: the front-end
      submission form's Image element validates an upload solely by trusting the client-supplied
      Content-Type header — never inspecting file bytes or enforcing an extension allow-list — so
      an anonymous visitor uploads a .php file declared image/jpeg, Joomla's File::makeSafe()
      preserves the .php extension, and the file lands executable inside images/zoo/uploads/,
      a directory the web server executes PHP from. CVE-2026-74804 (CVSS 9.3, CWE-89) is a
      precondition-free unauthenticated SQL injection in ItemController::element() (two
      unescaped request values pasted into the query's string-comparison condition) reachable on
      any site running ZOO at all, submission form or not — proven to bypass access filters and
      extract the DB name/version via UNION. CVE-2026-75114 (5.1) is an open redirect in the
      Twitter comment callback. All three were fixed in ZOO 4.1.64 (2026-08-19); two follow-up
      releases inside three days closed five more issues 4.1.64 had missed or introduced,
      including CVE-2026-76612 (8.6, unauthenticated stored XSS via comments/field elements) —
      current guidance is 4.1.66 or later. No fix exists for the ZOO 3.x line at all (affected
      range starts at 1.0.0). The same week YOOtheme Pro for Joomla shipped its own fixes for
      CVE-2026-76613 (SQL injection, corrected 23 August from 9.2 CVSS with an erroneous PR:N
      vector to 8.6 with the accurate PR:H — YOOtheme confirmed the vector error to the CNA) and
      CVE-2026-75115 (arbitrary file read via glob patterns), backported to the Joomla-3-only
      4.5.x line in 4.5.34 (24 Aug) with a regression fix in 4.5.35 (25 Aug).
    region_nexus: "global; ZOO and YOOtheme Pro underpin a large share of long-lived European Joomla government/SME sites"
    primary_sector_nexus: "direct"
    sector: "public-sector, technology"
    cves: [CVE-2026-74803, CVE-2026-74804, CVE-2026-75114, CVE-2026-76610, CVE-2026-76611, CVE-2026-76612, CVE-2026-77028, CVE-2026-77029, CVE-2026-76613, CVE-2026-75115, CVE-2026-77996, CVE-2026-77997]
    techniques: [T1190, T1505.003]
    affected_products: ["YOOtheme ZOO (com_zoo)", "YOOtheme Pro for Joomla", "YOOtheme Pro WordPress theme"]
    entity_keys: [trend:joomla-extension-file-upload-rce-wave]
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "ZOO lets visitors submit content through a front-end submission form... The Image element validates that attachment. It builds a validator configured with a MIME type group of image and a maximum size... The problem is which value that validator inspects. It reads the Content-Type header the client attached to the upload."
        attribution: "mySites.guru"
        source_url: "https://mysites.guru/blog/zoo-unauthenticated-file-upload-rce/"
      - quote: "A site with no submission form at all is still fully exposed to this one."
        attribution: "mySites.guru (on CVE-2026-74804)"
        source_url: "https://mysites.guru/blog/zoo-unauthenticated-file-upload-rce/"
    extended_notes: |
      Single-source: mySites.guru is the discoverer and the sole publisher for the ZOO findings
      (their own CVE records, filed through the Joomla CNA, are the underlying authority for the
      identifiers themselves, so this is closer to a first-party disclosure than a media report).
      Triage: check images/zoo/uploads/ for any non-image file, especially .php; treat a 3.x
      install as permanently exposed (no fix line exists).

  # ---------------------------------------------------------------
  # BACKLOG ITEM 4b: iCagenda
  # ---------------------------------------------------------------
  - title: "iCagenda Calendar module for Joomla: unauthenticated SQL injection via com_ajax with no session, token or account (CVE-2026-67365, CVSS 9.2) — and the vulnerable module's version number does not track the package version"
    sources:
      - { url: "https://mysites.guru/blog/icagenda-calendar-module-sql-injection/", publisher: "mySites.guru", date: "2026-08-17", role: primary }
    discovery_trace: "first seen at: coverage-backlog re-verification task (mysites.guru/rss.xml) -> primary: mySites.guru, URL https://mysites.guru/blog/icagenda-calendar-module-sql-injection/"
    summary: |
      The Joomla project's CNA published CVE-2026-67365 on 2026-08-14: an unauthenticated SQL
      injection (CWE-89) in mod_icagenda_calendar, the Calendar module bundled with the iCagenda
      events extension, reachable via com_ajax — Joomla's generic anonymous front-end AJAX entry
      point — with no session, token or account required. CVSS 4.0 9.2 Critical
      (AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:L/VA:L/SC:H/SI:H/SA:H). Affected 4.0.0-4.0.11; fixed in
      4.0.12. Reported by Joep van Antwerpen of Onvio (not mySites.guru's own find). The
      operationally important detail: the vulnerable Calendar module's own version number stayed
      pinned at 4.0.7 through package releases 4.0.8-4.0.11 and only advanced to 4.0.12 with the
      fix, so a site's extension manager can show package version 4.0.11 (looking current) while
      the actually-vulnerable Calendar module still reports 4.0.7 — a naive version check against
      the package number, in either direction, gives a wrong answer. No vendor advisory or
      changelog entry exists for this fix at time of writing. This is the second security issue
      in iCagenda in two months and unrelated to the first: CVE-2026-48939 (an unauthenticated
      file-upload flaw, already CISA-KEV-listed) was fixed in 4.0.8/3.9.15 and does not cover this
      SQLi.
    region_nexus: "global"
    primary_sector_nexus: "direct"
    sector: "public-sector"
    cves: [CVE-2026-67365]
    techniques: [T1190]
    affected_products: ["iCagenda (mod_icagenda_calendar) for Joomla"]
    entity_keys: [trend:joomla-extension-file-upload-rce-wave]
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Joomla Extension - icagenda.com - Unauthenticated SQL injection in iCagenda < 4.0.0-4.0.11 - Unauthenticated SQL injection in mod_icagenda_calendar (iCagenda), reachable via com_ajax with no session, token or account."
        attribution: "Joomla CNA (CVE-2026-67365 record), quoted by mySites.guru"
        source_url: "https://mysites.guru/blog/icagenda-calendar-module-sql-injection/"
      - quote: "the Calendar module stayed at 4.0.7 through the 4.0.8, 4.0.9, 4.0.10 and 4.0.11 releases and only moved with 4.0.12, so a site can show iCagenda 4.0.11 while the vulnerable module reports 4.0.7"
        attribution: "mySites.guru"
        source_url: "https://mysites.guru/blog/icagenda-calendar-module-sql-injection/"
    extended_notes: |
      Triage: version-detection logic that checks the iCagenda package version rather than the
      Calendar module's own version will misclassify affected sites in both directions — hunt/
      inventory tooling should key on the module version specifically.

