      any account, including administrative ones. Red Hat's root-cause statement: "improper state
      validation within the reset-credentials authentication flow." Only prerequisite: the
      "Forgot password" feature enabled on the realm (a common default) and the target's user
      identifier known. Fixed in upstream Keycloak 26.7.2 (2026-08-19) and Red Hat build of
      Keycloak 26.4.15 / 26.6.6. Interim mitigation: disable "Forgot password" across all realms
      (Realm settings -> Login -> Forgot password -> Off in the admin console). No evidence of
      exploitation as of 2026-08-24 per the corroborating reporting, though France's CERT-FR
      separately notes a public proof of concept exists (CERTFR-2026-AVI-1078, 2026-08-25). The
      same 26.7.2 release also fixes several other credential/authorization-relevant CVEs worth an
      estate-wide review: CVE-2026-15571 (predictable account-linking hash enabling account
      takeover via a malicious OIDC client), CVE-2026-17048 (Admin REST API leaking vault-resolved
      rotated client secrets), CVE-2026-15945 (group-hierarchy search discloses hidden parent
      groups under fine-grained admin permissions v2), and CVE-2026-14613 (a fine-grained admin
      permissions bypass via the role-groups endpoint). Reported by James Paremain.
