  - title: "Sourcerer for Joomla: unauthenticated RCE exploited in the wild since before a working fix existed — the vendor's first two patches (14.0.0, 15.0.0) did not close it, and the CVE was re-scoped in place to widen the affected range"
    sources:
      - { url: "https://mysites.guru/blog/sourcerer-14-unverified-content-php-execution/", publisher: "mySites.guru", date: "2026-08-26", role: primary }
    discovery_trace: "first seen at: coverage-backlog re-verification task (mysites.guru/rss.xml) -> primary: mySites.guru, URL https://mysites.guru/blog/sourcerer-14-unverified-content-php-execution/ (updated 2026-08-26)"
    summary: |
      CVE-2026-74253 (Regular Labs' Sourcerer, the Joomla extension that renders PHP/JS/CSS
      embedded in content) is CWE-94 (Improper Control of Generation of Code), CVSS 4.0 10.0
      (AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H — every metric at its worst),
      credited to finder Lukasz Rybak. Before Sourcerer 14.0.0, only article-text content had its
      origin verified before Sourcerer would execute embedded PHP/JS/CSS; code reaching the page
      through a module, component, page head, or any other rendering position ran unconditionally.
      14.0.0 (17 Aug) added trust-marking for article content and unmodified custom-module output,
      but did not close every route by which untrusted content could reach the render (URL/form
      parameters, raw request bodies, uploads, cookies, headers) — the CVE record originally
      scoped the fix as "<14.0.0" / affected 1.0.0-13.1.1. The flaw has been under active
      exploitation since roughly 2026-08-19 per the Joomla Security Strike Team (JSST; David
      Jardin) — two days after the first "fix" shipped and seven days before a working one
      existed. 15.0.0 (still not tagged a security release) also failed to close it. Only 16.0.0
      (26 Aug) closes the untrusted-input-delivery routes and additionally blocks common
      filesystem-write PHP functions by default. On 2026-08-26 the Joomla CNA re-scoped
      CVE-2026-74253 IN PLACE, widening the affected range from 1.0.0-13.1.1 to 1.0.0-15.0.0 —
      meaning every site that updated to 14.0.0, 14.0.1 or 15.0.0 in good faith (told by its
      extension manager and the CVE record itself that it was patched) was exploitable the entire
      time. HTML-escaping input is explicitly NOT a mitigation: Sourcerer decodes HTML entities
      inside its own tags by design (so WYSIWYG-authored code still runs), and that decoding
      cannot distinguish administrator-typed code from attacker-supplied text. PHP execution is
      enabled by default; the default forbidden-function list blocks shell-exec functions but not
      file-write functions. A separate, earlier CVE (CVE-2026-64796, fixed in 13.0.0, affected
      1.0.0-12.2.8) closed only the article-content path and does not protect against this one.
