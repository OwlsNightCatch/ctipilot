  - title: "Zalktis (Latvian accounting software): unauthenticated SQL injection reachable by any PEPPOL/UBL e-invoice sender — no account, no network position, just a routine bookkeeping import (CVE-2026-59109)"
    sources:
      - { url: "https://offseq.com/en/research/zalktis-cve-2026-59109/", publisher: "OffSeq Cybersecurity", date: "2026-06-30", role: primary }
      - { url: "https://services.nvd.nist.gov/rest/json/cves/2.0?cveId=CVE-2026-59109", publisher: "NVD/MITRE CVE record (CNA: CERT.LV)", date: "2026-08-13", role: corroborating }
    discovery_trace: "first seen at: coverage-backlog re-verification task (cvd.cert.lv detail page returned \"Vulnerability not published yet\") -> pivot: NVD CVE API record, which lists a reference to the discoverer's own write-up -> primary: OffSeq, URL https://offseq.com/en/research/zalktis-cve-2026-59109/"
    summary: |
      CVE-2026-59109 (CERT.LV-coordinated, disclosed via Latvia's national CVD platform) is an
      unauthenticated SQL injection in Zalktis, a Windows accounting application used by Latvian
      businesses, reachable through the everyday act of importing a received electronic invoice
      over the PEPPOL/UBL e-address network. When Zalktis imports an invoice or e-commerce
      export, four validation lookups concatenate trading-partner-controlled fields directly into
      SQL string literals with no parameterization and no escaping: the buyer/seller registration
      number (DatuParbaude.cs:320), VAT number (DatuParbaude.cs:459), EAN/barcode
      (DatuParbaude.cs:763), and the invoice line's unit-of-measure code taken from the
      <cbc:InvoicedQuantity unitCode="..."> XML attribute (frmreksaraksti.cs:3381). The
      application's own escaping helper, Dazadi.sql_txt(), exists but is never invoked on these
      import code paths. The unit-of-measure path is the most dangerous: it fires automatically
      for every line of every imported invoice with no attacker targeting required. OffSeq
      demonstrated boolean-based ('1'='1' vs '1'='2') and UNION-based extraction, retrieving
      Lietotajs.Parole (user password) values from the accounting database in testing. CVSS 4.0
      8.7 High / CVSS 3.1 8.8 High (AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H) — the only "interaction"
      required is the victim's routine act of importing the invoice, not a security decision. The
      vulnerable pattern is shared across roughly 20 import channels in the application, so every
      installation that imports documents is affected. Fixed by parameterizing the affected
      queries in Zalktis 2026.1.586 (pre-1-July branch) / 2026.2.592 (post-1-July branch);
      reported 2026-06-30, vendor-confirmed fixed 2026-07-16, CVE reserved 2026-07-30, published
      2026-08-13.
    region_nexus: "Latvia; the PEPPOL e-invoicing network this flaw abuses is EU-wide, so the delivery mechanism generalizes to any EU jurisdiction running mandatory e-invoicing"
    primary_sector_nexus: "indirect"
    sector: "public-sector, finance"
    cves: [CVE-2026-59109]
    techniques: [T1190]
    affected_products: ["Zalktis accounting software"]
    entity_keys: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "OffSeq found that Zalktis built the SQL behind those imports by pasting fields taken straight from the incoming document into the query text... No account, prior relationship or network position is needed — on the PEPPOL network anyone can address an invoice to the victim, and the only step the victim takes is importing it."
        attribution: "OffSeq Cybersecurity"
        source_url: "https://offseq.com/en/research/zalktis-cve-2026-59109/"
      - quote: "The application ships an escaping helper, Dazadi.sql_txt(), that strips single quotes — but it is never called on these import paths."
        attribution: "OffSeq Cybersecurity"
        source_url: "https://offseq.com/en/research/zalktis-cve-2026-59109/"
    extended_notes: |
      Fetch note: cvd.cert.lv's disclosure detail page for this record (the exact URL named in
      the tasking) returned "Vulnerability not published yet!" on both the plain and
