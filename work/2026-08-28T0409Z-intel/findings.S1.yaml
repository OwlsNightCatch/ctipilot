candidate_sources:
  - id: offseq
    publisher: "OffSeq Cybersecurity (research blog)"
    url: "https://offseq.com/en/research/"
    category: research
    why: "Discoverer of CVE-2026-59109 (Zalktis) and other CERT.LV-coordinated CVDs; solid, technically detailed original vulnerability research write-ups in English covering a Baltic/EU vendor landscape underrepresented in the current source list."
  - id: anddone-git
    publisher: "AndDone (Gerjan Wemekamp) — independent security research blog"
    url: "https://anddone-git.github.io/"
    category: research
    why: "Discoverer of the Kaltura mwEmbed CVE-2026-19912/19913 chain; deep, exploit-verified technical write-ups with full disclosure timelines."

coverage_gaps:
  - source_id: cisa-advisories
    reason: "cisa.gov/news-events/ics-advisories/icsa-26-204-01 403'd on direct fetch and the jina reader fallback failed on every credential in the pool (HTTP 402 balance-exhausted throughout this run) — recovered via CISA's own CSAF JSON mirror on GitHub instead, so no net loss of primary data for this item."
  - source_id: ssd-disclosure
    reason: "ssd-disclosure.com (landing page and the two specific Unisoc post URLs named in the tasking) returned an anti-bot HTTP 202 shell with no extractable body on every direct/trafilatura attempt, and the jina reader fallback failed on all 7 pool credentials (HTTP 402 balance-exhausted) — covered instead via two independent secondary outlets (Infosecurity Magazine, Dark Reading) that quote the primary at length; flagged MEDIUM rather than HIGH confidence as a result."
  - source_id: wordfence-blog
    reason: "The specific Wordfence blog post URL named in the tasking (Elementor Pro arbitrary file upload) remains unreachable via WebFetch, trafilatura extract, and the jina reader fallback (credit-exhausted) — covered instead via Patchstack (the actual disclosure venue the finder reported to) and The Hacker News."
  - source_id: kb-cert-org
    reason: "kb.cert.org/vuls/id/308749 (the Kaltura CERT/CC vulnerability note) returned a corrupted/binary body via the extract transport (looks like an undecoded compressed response); recovered the substantive technical content from the discoverer's own write-up instead, with only a single load-bearing CERT/CC quote carried through an uncorroborated WebFetch summarization pass."
  - source_id: community-ui-com
    reason: "community.ui.com (Ubiquiti's own advisory-hosting community platform) is a JavaScript SPA that returns only a loading shell to every direct/trafilatura/WebFetch attempt — no structured API route was found this run. Covered via NCSC-CH's own transcription (which had already parsed the bulletin) plus Heise Security's independent reporting. Flagging for a future source-record recipe fix (candidate: jina-only fetch_method, or find the underlying JSON API the SPA calls)."
  - source_id: jina-reader-pool
    reason: "Every jina reader API key in the pool (7 credentials) reported HTTP 402 balance-exhausted throughout this entire run — this affected recovery on ssd-disclosure.com, github.com/api.github.com, medium.com, cisa.gov, and wordfence.com. This is a known, documented-as-normal condition per operator guidance, but is logged here because it affected an unusually large number of this run's fetch attempts; several items above (Unisoc VoLTE, isolated-vm's initial GHSA fetch, VMware vCenter's QUIRSO primaries) required secondary-source workarounds as a direct result."
