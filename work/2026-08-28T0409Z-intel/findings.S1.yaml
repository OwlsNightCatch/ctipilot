      hardening it" — this is confirmed incorrect for CVE-2026-44772/Note 3765948 specifically:
      that fix is a hardening control (an allowed-hosts allowlist that must be actively maintained
      going forward), not a removal. An operator who reads the current entry and concludes "just
      patch and the risky servlet is gone" for CVE-2026-44772 will miss the follow-up
