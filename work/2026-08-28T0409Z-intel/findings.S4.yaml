  - title: "Troy Hunt: a 24.8M-address ShinyHunters/Carhartt breach-claim collapses to ~13M real records once TPC-DS synthetic benchmark data mixed into the same Databricks schema is filtered out — a reusable methodology for verifying inflated breach-claim record counts"
    sources:
      - { url: "https://www.troyhunt.com/a-cautionary-tale-about-data-breach-claims-verification-and-carhartt/", publisher: "Troy Hunt (Have I Been Pwned)", date: "2026-08-25", role: "primary" }
    discovery_trace: "first seen at: troyhunt (RSS), URL https://feeds.feedburner.com/TroyHunt → primary: Troy Hunt's own blog post, URL https://www.troyhunt.com/a-cautionary-tale-about-data-breach-claims-verification-and-carhartt/ (no pivot needed)"
    summary: |
      Following ShinyHunters' 2026-08-13 claim to have stolen 50GB+ of Carhartt customer data, Troy Hunt's initial Have I Been Pwned processing run found 24,876,077 unique email addresses in the dump — but systematic verification (domain-frequency analysis, TLD pattern checks, birth-country and birth-year distribution analysis) showed the true figure was roughly 13.3M, with the remainder being TPC-DS retail-analytics-benchmark synthetic test data that had been sitting in the same Databricks schema ShinyHunters exfiltrated, and which the actor (and, per Hunt, "every aggregator after them") failed to distinguish from real customer records before publishing. The diagnostic signals, all independently conclusive: 97.6% of domains in the corpus appeared exactly once (a real retail breach shows a power-law distribution dominated by major freemail/corporate domains); ~32% of addresses used syntactically plausible names on gibberish .edu/.org domains (e.g. roy.griffin@mbfhz82d0vkpes4x.edu) — later found to extend across .com and every TLD (45% of the full corpus); birth-country data was perfectly uniform across all 211 ISO country codes (~380-420 records per country, with the US tied with Canada and dwarfed by e.g. Antigua and Barbuda) rather than concentrated in Carhartt's actual US/European customer base; and birth-year distribution was mathematically flat from 1924-1992 (~1,050-1,194 per year, every year, with no weighting toward a plausible customer-age curve) rather than resembling a real population. Corroborating evidence the real customer data IS present and genuinely breached: ~13.6M addresses sit on domains with 100+ occurrences (i.e., real freemail/corporate patterns), the corpus resolves 70% hit rate against HIBP's existing freemail dataset, and Carhartt-internal domains (carharttdonotship.com, carhartt.com, carhartt.onmicrosoft.com) appear as expected. Hunt's conclusion: this is a genuine Carhartt Databricks breach, but ShinyHunters' published record count is roughly double the real figure because they dumped an entire analytics workspace without separating production customer tables from co-located TPC-DS benchmark test tables.
    region_nexus: "methodology is region-agnostic and directly applicable to any breach-claim triage this constituency performs, regardless of victim (Carhartt is a US retailer, out-of-nexus as a victim)"
    primary_sector_nexus: "none direct — methodology/tradecraft item, not a sector-specific incident"
    sector: "retail"
    cves: []
    techniques: []
    affected_products: []
    entity_keys: ["actor:shinyhunters"]
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: "out-of-nexus victim (US retailer) and single-sourced to one (highly reputable, primary-position) author; included because the finding is a reusable defender/CTI-analyst verification methodology (detecting synthetic benchmark data inflating a breach-claim's headline record count) rather than a victim-specific disclosure, directly relevant to this pipeline's own fake-news-scrutiny duty and to any SOC/CTI team triaging leak-site record-count claims — not because Carhartt itself matters to this constituency."
    evidence:
      - quote: "97.6% of domains appear exactly once — that's not a long tail, that's a signature. Real breach data from a retail company would have thousands of addresses on corporate domains, hundreds on ISP domains, a natural power law. Instead you have 10.1M singleton domains. That's pure TPC-DS generation."
        attribution: "Troy Hunt / \"PwnedClaw\" analysis, quoting the AI-assisted analysis output he verified by hand"
        source_url: "https://www.troyhunt.com/a-cautionary-tale-about-data-breach-claims-verification-and-carhartt/"
      - quote: "Birth year stats are conclusive. The distribution runs 1924-1992 and is perfectly flat — roughly 1,050-1,194 per year, every single year without exception. That's not population data, that's a random number generator with a fixed range."
        attribution: "Troy Hunt / \"PwnedClaw\" analysis"
        source_url: "https://www.troyhunt.com/a-cautionary-tale-about-data-breach-claims-verification-and-carhartt/"
      - quote: "The conclusion is pretty solid: this is a real Carhartt Databricks breach, but the TPC-DS benchmark data was co-located in the same schema and ShinyHunters (and every aggregator after them) grabbed it all without knowing what they were looking at."
        attribution: "Troy Hunt"
        source_url: "https://www.troyhunt.com/a-cautionary-tale-about-data-breach-claims-verification-and-carhartt/"
    extended_notes: |
      Single-source by Admiralty terms (Troy Hunt / Have I Been Pwned, reliability B — no second outlet had independently replicated this specific verification analysis at fetch time), but the source is the person who directly did the primary verification work on the primary dataset, not a secondary report of someone else's claim, so this is closer to a primary technical disclosure than ordinary single-source news. No CVE, no ATT&CK-mappable attacker technique (the finding is about analyst tradecraft, not attacker tradecraft) — techniques[] intentionally left empty per the guidance that this is acceptable for a research-kind item carrying no attacker behavior.

