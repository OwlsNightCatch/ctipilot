    summary: |
      DOJ and the FBI announced court-authorized domain seizures on 2026-08-26 against "QScan" and "QTRouter", two complementary hacking platforms unsealed court documents attribute to "QTFY" (aka QT/QTCYBER), a PRC state-sponsored contractor run by Nanjing Xinjiuwei Network Technology Company that received payments from China's Ministry of State Security and counts former PLA members among its staff. QScan is a three-stage reconnaissance pipeline — a Celery/RabbitMQ task broker, a distributed scanner fleet that rotates across /24 subnet blocks on a 30-day cycle to dodge threshold detection, and a Redis results backend — that fingerprints IoT devices, OS kernels and exposed management interfaces worldwide. QTRouter (which Lumen's Black Lotus Labs, tracking the same infrastructure for over a year under the names "Fast Labyrinth" and "QTProxy", calls a "quartermaster" enablement layer) turns QScan-compromised IoT devices, leased VPS instances, and — most distinctively — bulk-purchased subscriptions to the Chinese "Airport" (机场) commercial GFW-circumvention proxy service fastlink.ws into an obfuscation/proxy-as-a-service network: because seized domains were hard-coded into both platforms for communication and authentication, the seizure makes them inoperable. Named victims since at least 2018 include NASA, the Federal Reserve, the Departments of Energy, Justice and Health and Human Services, NIH, and the U.S. Senate; Lumen's independent telemetry additionally shows sustained QScan/Fast-Labyrinth targeting of research universities, defense-supplier perimeters, and — explicitly — "European infrastructure and judicial nodes worldwide." Lumen found direct crossover between administrative check-in sessions from Nanjing (China Telecom/Unicom IP space) and the co-opted fastlink.ws proxy nodes, evidence the operators actively tested and calibrated the leased infrastructure before leasing it to downstream customers. The takedown follows the same court-authorized disruption playbook DOJ/FBI used against Flax Typhoon (2024) and Volt Typhoon (2023) ORB networks; Lumen cautions that because the proxy layer rides on dynamically-rotating legitimate commercial subscriptions rather than a static botnet, blocklisting alone will not be durable and recommends the CISA/NCSC ORB-mitigation guidance.
    region_nexus: "global; Lumen's own telemetry names \"European infrastructure and judicial nodes worldwide\" among the profiled sectors, and the hacking-as-a-service model (leased anonymization access sold to PRC state customers) is the same infrastructure class prior Volt Typhoon/Flax Typhoon disruptions showed reaching European routers and CI networks"
