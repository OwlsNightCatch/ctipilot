    discovery_trace: "first seen at: krebsonsecurity.com, URL https://krebsonsecurity.com/feed/ → primary: Australian Federal Police joint media release, URL https://www.afp.gov.au/news-centre/media-release/two-wa-men-charged-following-afp-fbi-wapf-disruption-alleged-global"
    summary: |
      The Australian Federal Police, FBI and Western Australia Police Force jointly announced on 2026-08-27 that two Western Australian men, aged 21 and 23, were charged with a combined 14 Commonwealth cybercrime offences (unauthorised data modification with intent to commit a serious offence, supplying data with intent to commit a computer offence, dealing with proceeds of crime over AUD 100,000, and — for one defendant — failing to comply with a section 3LA data-access order) following parallel AFP/FBI investigations that began in April 2026 after multiple threat-intelligence vendors reported a supply-chain-poisoning syndicate. AFP states the syndicate "allegedly inserted malicious code into software available on an open-source repository, which was then unwittingly used by other developers," with infected software subsequently distributed into "computer systems at other organisations across government, academia and the private sector," enabling theft of user credentials and authentication material; AFP's own estimate puts the compromise at more than 1,000 organisations globally, over 500,000 stolen credentials, at least 300 GB exfiltrated, and remediation costs in the hundreds of millions of dollars. FBI Cyber Division names the group as TeamPCP. KrebsOnSecurity, which had independently identified one of the defendants (the group's self-described spokesperson) in June and interviewed him extensively via Signal, corroborates and adds operational-model detail: TeamPCP's core tactic is cyclical — compromise a developer's credentials to insert malicious code into a widely-depended-upon open-source package, harvest the credentials of downstream developers who install it, and repeat against the next package — powered principally by the self-propagating "Shai-Hulud" worm (three iterations to date, the source of which TeamPCP itself open-sourced, spawning copycat variants such as PCPJack). Prior TeamPCP campaigns already tracked by named security vendors include the March 2026 compromise of the LiteLLM open-source AI gateway (CloudSEK: 2,500+ organisations' cloud-service keys and CI/CD secrets harvested) and a May 2026 claim of ~3,800 compromised GitHub repositories. Google's Threat Intelligence Group characterises TeamPCP as "not a structured criminal crew... a peer community of individually-skilled actors" rather than a hierarchical group, tracing its likely primary operator's residential/mobile internet connections to South Africa during at least some of its attacks. Investigators note further arrests are not ruled out; both defendants were held in custody pending a 18 September court date.
