  - title: >
      NCSC UK advisory: increased targeting of internet-exposed OT and edge devices globally,
      including the UK, by state and non-state actors, with "some limited real-world disruption"
    sources:
      - { url: "https://www.ncsc.gov.uk/news/disruptive-cyber-activity-highlights-risk-from-internet-exposed-systems-and-edge-devices", publisher: "NCSC UK", date: "2026-08-27", role: primary }
