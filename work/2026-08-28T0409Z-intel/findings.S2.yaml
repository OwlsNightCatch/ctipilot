    summary: |
      NCSC UK published an advisory on 2026-08-27 stating it has observed increased targeting of
      operational technology (OT) systems across multiple sectors globally, including in the UK,
      carried out by "a range of threat actors" and resulting in "some limited real-world disruption."
      The advisory names no specific actor, CVE or victim, and is framed as a national-resilience
      notice rather than an incident disclosure: it instructs organisations with internet-exposed OT
      not to assume their systems are inaccessible from the internet without verifying it, citing
      misconfiguration, legacy connections and unmanaged assets as the typical exposure paths. NCSC UK
      assesses that "the threat from state use of offensive cyber, including outside of conflict, has
      almost certainly increased" against a backdrop of technology-enabled capability uplift and
      geopolitical instability, and explicitly links this to its July 2026 joint advisory (with
      partners) on Russian state actors exploiting poorly configured routers. Concrete defensive
      guidance: build a definitive OT asset/connectivity inventory, ensure PLCs and HMIs are not
      directly internet-exposed, eliminate default/shared credentials and enable MFA or key-based auth
      on management interfaces, harden the OT boundary (vendor-supported, patched, EOL-replaced gateway
      devices managed only from a segregated network), migrate to secured protocol variants (DNP3-SAv5,
      CIP Security, Modbus Security, OPC UA) and disable telnet/SNMPv1/v2, and maintain ransomware-
      resistant, tested OT backups.
