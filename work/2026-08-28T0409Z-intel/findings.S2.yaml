      → pivot: Der Tagesspiegel (24 Aug CDO quote piece), URL https://www.tagesspiegel.de/berlin/ein-sehr-professioneller-angriff-hacker-wollten-berliner-geo-daten-die-offen-zuganglich-sind-15974498.html
      → corroborating: IT BOLTWISE, URL https://www.it-boltwise.de/berlin-korrigiert-cyberangriff-einschaetzung-datenabfluss-nun-nicht-mehr-ausgeschlossen.html
      (no authority statement on initial-access vector, exploited product or CVE found anywhere in this chain — the coverage-backlog question resolves negative again this run)
    summary: |
      This is a re-verification of the open coverage-backlog item on Berlin's Landesnetz compromise
      (entity incident:berlin-landesnetz-compromise-2026-08, currently covered only as the strategic
      synthesis entry 2026-08-23/weekly-w34-berlin-landesnetz-nine-days-no-vector). The single question
      the backlog set — has any named authority (Senate Chancellery, LKA, public prosecutor, BSI) now
      stated an initial-access vector, exploited product or CVE — is still NO. CDO/Staatssekretär
      Florian Hauer told the Innenausschuss on 2026-08-24 he "could not make a statement" on how the
      attackers gained access to the Landesnetz, and no subsequent authority statement fills that gap.
      What HAS changed, from named authorities, is the timeline and scope: the Senate Chancellery
      confirmed to Tagesspiegel that the Senatsverwaltung für Mobilität first reported a data leak on
      7 August — a full week before the 14 August isolation the earlier entry treated as the start —
      and that its ongoing forensic review (findings received 25 August, confirmed by the affected
      department 26 August) now cannot rule out personal or other non-public data exposure in that
      department, a materially wider claim than the "open geodata only" assessment CDO Hauer gave on
      24 August. Separately, RBB Abendschau reported on 27 August that extortionists sent a ransom
      demand to the Berlin Senate on Thursday; Tagesspiegel states this was NOT confirmed internally
      and it is unclear whether it is genuine or the work of copycats — carried here strictly as an
      unconfirmed press claim. Tagesspiegel also reports (unconfirmed by the Senate) that CrowdStrike
      is conducting the forensic investigation across all Senate administrations. Both previously
      isolated departments were reconnected on 23 August and are "grundsätzlich arbeitsfähig", though
      Tagesspiegel sources describe only partial normalisation with staff resorting to private internet
      connections for work — a new operational-risk detail.
