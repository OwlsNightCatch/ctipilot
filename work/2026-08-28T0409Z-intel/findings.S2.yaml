      Small-scale by itself, but directly on the home-region/sector-lens mission (Swiss communal
      administration) and part of a recognisable pattern this pipeline has not yet tracked as a trend:
      Vétroz (April 2026) and now Martigny-Combe (August 2026) are two Valais municipalities hit by
      account-compromise-class incidents in the same year. T1078 (Valid Accounts) is mapped for the
      unauthorised access to the mailbox itself; no technique is mapped for the onward fraudulent
      message since the source does not state whether recipients were internal or external, or what
      the message contained.

  - title: >
      La Protection Civile (France): eProtec volunteer-management platform breach, 525,000+ profiles
      including minors, intrusion dated to March 2026 discovered mid-August
    sources:
      - { url: "https://www.franceinfo.fr/internet/securite-sur-internet/cyberattaques/la-protection-civile-annonce-avoir-ete-visee-par-une-cyberattaque-en-mars_8156621.html", publisher: "Franceinfo (AFP)", date: "2026-08-21", role: primary }
      - { url: "https://frenchbreaches.com/alertes/protection-civile-mt27j64epv2smy5m0g", publisher: "FrenchBreaches (specialist breach tracker; discoverer)", date: "2026-08-21", role: corroborating }
      - { url: "https://christophemazzola.fr/en/articles/fuites-donnees-france-aout-2026", publisher: "Christophe Mazzola (independent security analyst)", date: "2026-08-22", role: corroborating }
    discovery_trace: >
      first seen at: WebSearch ("eProtec Protection Civile France fuite de données bénévoles")
      → primary: Franceinfo/AFP, URL https://www.franceinfo.fr/internet/securite-sur-internet/cyberattaques/la-protection-civile-annonce-avoir-ete-visee-par-une-cyberattaque-en-mars_8156621.html
      → corroborating: FrenchBreaches, URL https://frenchbreaches.com/alertes/protection-civile-mt27j64epv2smy5m0g
      → corroborating: Christophe Mazzola, URL https://christophemazzola.fr/en/articles/fuites-donnees-france-aout-2026
      (this is a re-verification of an open coverage-backlog item; publication date 2026-08-21 predates
      window_hours but is explicitly exempted by the backlog tasking)
    summary: |
      La Fédération Nationale de Protection Civile (FNPC) confirmed on 2026-08-21 — via a spokesperson
      statement to AFP and a written communiqué, both quoted directly by Franceinfo — that it was the
      victim of a hack and "violation de données à caractère personnel" in March 2026, on the eProtec
      platform used to manage the volunteers, schedules and training of this state-approved civil
      security association. The FNPC states the attack "s'inscrit dans un contexte d'attaques
      multiples menées au cours de la même période à l'encontre de structures comparables, notamment
      plusieurs fédérations sportives" (fits a pattern of contemporaneous attacks on comparable
      structures, including several sports federations) — i.e. it frames this as part of a wider
      wave rather than a targeted campaign against it specifically. Exposed data includes civil-status
      information, phone numbers and profile photographs of current volunteers, former volunteers and
      people external to the organisation, including minors; the FNPC explicitly states no data
      belonging to people the Protection Civile has rescued is involved, and that neither passwords
      nor banking details appear in the leak. The federation says it only became aware of the breach on
      Monday (2026-08-17/18) and that its investigation cannot yet determine whether the exposed data
      was actually consulted or extracted, nor whether it was sold, used or made public — it has filed
      a complaint with the Paris prosecutor's cybercrime unit. The commonly cited "525,000+ profiles /
      15,000 photographs" figure comes from FrenchBreaches, the specialist outlet that first surfaced
      the breach; the FNPC itself says it is still trying to establish the exact number of people
      affected, so that volume should be attributed to the tracker, not treated as an organisational
      confirmation.
