  - title: >
      Martigny-Combe (Valais) municipal email account compromised and used to send a fraudulent
      message to administration contacts — second Valais municipality hit in 2026
    sources:
      - { url: "https://www.swisscybersecurity.net/news/2026-08-24/cyberangriff-kompromittiert-e-mail-system-der-gemeinde-martigny-combe", publisher: "SwissCybersecurity.net", date: "2026-08-24", role: primary }
    discovery_trace: >
      first seen at: WebSearch ("Schweiz Cyberangriff Behörde Kanton Gemeinde August 2026")
      → primary: SwissCybersecurity.net, URL https://www.swisscybersecurity.net/news/2026-08-24/cyberangriff-kompromittiert-e-mail-system-der-gemeinde-martigny-combe
      (a second corroborating article, inside-it.ch "Erneuter Cyberangriff auf eine Walliser Gemeinde"
      (2026-08-21, https://www.inside-it.ch/erneuter-cyberangriff-auf-eine-walliser-gemeinde-20260821),
      returned HTTP 403 on direct fetch and the jina reader fallback failed on exhausted API credit —
      logged as a fetch failure below; this item is carried SINGLE-SOURCE as a result)
    summary: |
      The municipality of Martigny-Combe (canton Valais) detected unauthorised access to its
      administrative secretariat's business email system on 2026-08-18. Per the municipality's own
      statement (relayed by SwissCybersecurity.net), the access was used to send a fraudulent message
      to contacts of the administration, and personal data contained in that email may have been
      passed to an unauthorised third party — the municipality specifically flags phishing and
      identity-theft risk for recipients of the fraudulent message. The compromised access was blocked
      immediately on discovery, technical security measures were applied, and external specialists are
      now conducting a scoping analysis. The incident was reported to Switzerland's Bundesamt für
      Cybersicherheit (BACS) and to the cantonal data-protection and transparency commissioner, and a
      criminal complaint has been filed with the Valais cantonal police. The article notes this is the
      second Valais municipality hit in 2026: Vétroz was disabled by a cyberattack in April 2026 (a
      separate, already-dated incident not otherwise covered here).
