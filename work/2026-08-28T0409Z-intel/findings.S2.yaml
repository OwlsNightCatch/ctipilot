  - title: >
      SUEZ Eau France: customer data (identity, contracts, in some cases bank details and ID
      documents) exposed via a technical service provider's breach — still no A/B-grade source
    sources:
      - { url: "https://fuitesinfos.fr/article/2026-08-20-suez-eau-france", publisher: "Fuites Infos (specialist breach tracker)", date: "2026-08-20", role: primary }
      - { url: "https://www.cyberattaque.org/suez-les-donnees-clients-en-fuite-apres-une-cyberattaque-chez-un-prestataire/", publisher: "Cyberattaque.org (specialist breach tracker)", date: "2026-08-20", role: corroborating }
      - { url: "https://christophemazzola.fr/en/articles/fuites-donnees-france-aout-2026", publisher: "Christophe Mazzola (independent security analyst)", date: "2026-08-22", role: corroborating }
    discovery_trace: >
      first seen at: WebSearch ("SUEZ Eau France données clients prestataire fuite août 2026")
      → primary: Fuites Infos, URL https://fuitesinfos.fr/article/2026-08-20-suez-eau-france
      → corroborating: Cyberattaque.org, URL https://www.cyberattaque.org/suez-les-donnees-clients-en-fuite-apres-une-cyberattaque-chez-un-prestataire/
      → corroborating: Christophe Mazzola, URL https://christophemazzola.fr/en/articles/fuites-donnees-france-aout-2026
      Additional targeted searches for an A/B-grade source (Le Monde, AFP, Reuters, France24, 20
      Minutes, BFMTV, Le Parisien) and for a SUEZ press statement or CNIL filing found none — every
      hit traces to the same three specialist trackers, each of which states it obtained the customer
      notification letter directly.
    summary: |
      SUEZ Eau France (serving 10M+ users in France, per its own figures) is notifying customers of a
      security incident at one of its technical service providers, which was compromised by a
      cyberattack that allowed data access and extraction, with part of the exfiltrated data
      subsequently made accessible online. Per the notification (quoted/paraphrased independently by
      three specialist trackers who each state they obtained a copy), affected data may include name,
      contact details, contract/billing administrative documents, and — for some customers — identity
      documents, photographs and bank details (RIB/IBAN). SUEZ states it cannot yet confirm that every
      notified person's data was actually stolen, and no total affected-count or exact period has been
      disclosed. This is a re-verification of an open coverage-backlog item that explicitly required an
      A/B-grade source or SUEZ's own public statement before publication. Despite a fair-attempt search
      across major French and international outlets, none has covered this incident — the only
      available sourcing remains three independent specialist breach-tracking sites, each relaying the
      same underlying customer notification letter. That is three independent relays of a first-party
      document, but none of the relaying outlets itself carries an established reliability track record
      at Admiralty B or above.
