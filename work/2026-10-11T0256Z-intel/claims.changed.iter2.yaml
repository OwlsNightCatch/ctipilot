    entry: 2026-10-06/denmark-cpr-population-register-third-party-access-breach
    surface: "summary"
    kind: frontmatter
    text: "Denmark's CPR administration says unauthorised parties used a private Danish company's lawful right to search the Central Person Register to obtain names, addresses and CPR numbers of about 8.8 million of its roughly 11 million records (living, deceased and emigrated persons); the ministry says the access does not cover the names and addresses of people with name-and-address protection. The company, Pays ApS of Odense, confirmed to TV 2 that its lawful access was abused, and Politiken reports that at least three of its accounts, including the administrator account, used the password 123456; Ritzau puts the access at 21 days and 17 hours from 10 September, where the minister had described about ten days. An anonymous hacker told Politiken the access began with a leaked former employee's password, which is the hacker's claim, and Datatilsynet describes a very large number of automated lookups made to identify valid CPR numbers."
