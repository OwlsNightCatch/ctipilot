  - claim_id: eabeefe880
    entry: 2026-10-11/cctld-registry-hijacks-gh-sl-as-certificates-for-google
    surface: "summary"
    kind: frontmatter
    text: "Google's Chrome team reported on 2026-10-06 that attackers compromised the .gh, .sl and .as country-code registries, changed authoritative DNS records and obtained unauthorized HTTPS certificates for Google domains and for domains of other organizations; Chrome blocked them and the issuing authorities revoked them. Google names no attacker or entry vector and says it cannot guarantee it found every affected domain; The Hacker News found 12 certificates for Google and YouTube names in public logs, 11 issued by Let's Encrypt and one by ZeroSSL, first logged between 2026-09-22 and 2026-09-27."
