  discovery_trace: 'first seen at: bsi-de, URL https://wid.cert-bund.de/content/public/securityAdvisory/rss (bsi-rss: ''[UPDATE] [hoch] IBM Security Verify Access:
    Mehrere Schwachstellen'', WID-SEC-2026-3813, 2026-10-09 08:39Z) -> pivot: bsi-csaf WID-SEC-2026-3813 (bridge) -> pivot: heise online, URL https://www.heise.de/news/Angreifer-koennen-Systeme-mit-IBM-Verify-Identity-Access-uebernehmen-11482296.html
    (heise feed https://www.heise.de/security/feed.xml) -> primary: IBM bulletin, URL https://www.ibm.com/support/pages/security-bulletin-security-vulnerabilities-have-been-found-ibm-verify-identity-access-and-ibm-security-verify-access-11
    (link from the heise article; read with extract). Rotational source ibm-support-security-bulletins (120 h lookback): bulletin dated 2026-10-07 is inside its lookback.'
  summary: 'IBM''s bulletin of 2026-10-07 covers 22 CVEs in IBM Verify Identity Access (IVIA) and IBM Security Verify Access (ISVA, formerly Security Access Manager),
    the access-management product that handles authentication and access rules for the applications behind it. IBM rates four flaws critical and network-reachable
    without credentials: CVE-2026-78401 and CVE-2026-78406 (IVIA, ''remote unauthenticated attacker to execute arbitrary code ... due to the deserialization of untrusted
    data'', CVSS 3.1 9.8, vector AV:N/AC:L/PR:N/UI:N) and CVE-2026-16823 and CVE-2026-19491 (ISVA appliance, ''bypass authentication due to improper authentication'',
    9.1). IBM also lists an authenticated code-execution flaw (CVE-2026-16916, 9.1), two authenticated command/argument-injection flaws (CVE-2026-18740 and CVE-2026-19482,
    8.8) and a path-traversal arbitrary file write reachable by a remote attacker (CVE-2026-19493, 7.5). Affected: ISVA 10.0 to 10.0.9.2 and IVIA 11.0 to 11.0.3,
    appliance and container editions. Fixed: ISVA 10.0.9.3 and IVIA 11.0.3.1 for the appliance, separate updated downloads for containers; IBM lists no workaround.
    The bulletin does not say which functions or data the two bypasses reach, and neither IBM nor heise reports exploitation; heise states that IBM''s bulletin gives
    no sign of attacks. The BSI (WID-SEC-2026-3813, rated ''hoch'', first published 2026-10-07 and revised 2026-10-08) summarises the ISVA entry as a remote anonymous
    attacker able to execute code, bypass security mechanisms, read and manipulate data and cause denial of service. No public PoC repository was found on GitHub
    for CVE-2026-78401 as of 2026-10-11, none of the CVEs is in CISA KEV, and FIRST EPSS is 0.003 to 0.006 (2026-10-10). Assessment (ours): the exposure is the network
    listener of the access-management gateway, so a patched-or-not inventory of ISVA/IVIA appliances is the decision; no Swiss public-sector deployment is established.'
