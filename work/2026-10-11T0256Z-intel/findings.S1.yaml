    date: '2026-10-09'
    role: corroborating
  discovery_trace: 'first seen at: backlog row 2026-09-27 (IBM MQ + Langflow OSS, hold condition ''exploitation report, public PoC or KEV listing'') -> WebSearch
    ("CVE-2026-10747 IBM MQ exploit proof-of-concept") and previdian.com/CVE-2026-93674 (https://previdian.com/CVE-2026-93674, title ''PoC and Scanner Context'')
    -> pivot: GitHub repository search (https://api.github.com/search/repositories?q=CVE-2026-93674, 1 hit) -> primary artifact: https://github.com/rmhowe425/POC-CVE-2026-93674
    (README + poc.py read as text, not run) -> vendor: IBM bulletin https://www.ibm.com/support/pages/node/7290694 (link from the Previdian page).'
  summary: 'IBM''s Langflow OSS bulletin of 2026-10-02 lists 26 CVEs for Langflow OSS 1.0.0 to 1.12.2 and tells customers to upgrade to 1.12.3. Two are rated 9.8
    with PR:N in IBM''s vector: CVE-2026-104334 (''improper control of code generation'') and CVE-2026-93674 (''improper neutralization of special elements used in
    an OS command''); CVE-2026-93675 (8.8, ''expected dependency confusion'') is PR:N but needs user interaction, and the remaining 23 carry PR:L (authenticated RCE,
    file read and write, information disclosure, DoS). New since the 2026-09-27 hold: a public GitHub repository, created 2026-09-22 by a researcher, ships a Python
    script labelled ''POC-CVE-2026-93674 Authenticated Blind command injection proof of concept exploit code''. The script logs in with a username and password, then
    POSTs a `command` and `args` JSON body to /api/v2/mcp/servers/{server_name}, the MCP server configuration endpoint that the upstream Langflow advisory for CVE-2026-105697
    (GHSA-w794-rj3p-xv45, fixed in Langflow 1.10.3) also describes. That the IBM CVE and the upstream CVE are the same bug is our inference from the shared endpoint.
    Previdian classes CVE-2026-93674 as ''PoC available'' and explicitly says it has not added it as a known exploited vulnerability. None of the six held CVEs (CVE-2026-79724,
    81204, 85025, 104334, 93674, 8505) is in CISA KEV, and no source reports exploitation of them; FIRST EPSS is 0.006 to 0.009. Context from the store and elsewhere:
    Langflow already has covered entries for exploited flaws (CVE-2026-0769, CVE-2026-55255 KEV), and VulnCheck-based reporting counts twelve exploited Langflow CVEs
    in 2026, so weaponisation of a fresh unauthenticated or default-config route is plausible; that is an assessment, not a report.'
