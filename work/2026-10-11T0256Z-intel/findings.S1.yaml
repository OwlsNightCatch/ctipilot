- title: 'IBM Verify Identity Access and Security Verify Access: 2026-10-07 bulletin fixes four critical unauthenticated flaws (two deserialization RCEs at CVSS 9.8,
    two authentication bypasses at 9.1); no workaround, no exploitation reported'
  sources:
  - url: https://www.ibm.com/support/pages/security-bulletin-security-vulnerabilities-have-been-found-ibm-verify-identity-access-and-ibm-security-verify-access-11
