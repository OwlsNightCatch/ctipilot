  borderline_reason: 'Hold condition ''public PoC'' is met narrowly for CVE-2026-93674 (authenticated PoC, public since 2026-09-22 and missed by the 2026-10-10 re-gate),
    but nothing is exploited, nothing is in KEV and there is no Swiss public-sector nexus. The row expires today: publish one consolidated Langflow entry or strike
