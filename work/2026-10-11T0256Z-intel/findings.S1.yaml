  evidence:
  - quote: POC-CVE-2026-93674 Authenticated Blind command injection proof of concept exploit code
    attribution: GitHub (rmhowe425, PoC repository)
    source_url: https://github.com/rmhowe425/POC-CVE-2026-93674
  - quote: Langflow OSS could allow a remote attacker to execute arbitrary code due to improper neutralization of special elements used in an OS command.
    attribution: IBM PSIRT (Langflow OSS bulletin)
    source_url: https://www.ibm.com/support/pages/node/7290694
  - quote: This CVE has not been added as a known exploited vulnerability.
    attribution: Previdian
    source_url: https://previdian.com/CVE-2026-93674
  extended_notes: 'IBM bulletin 7290694: affected ''Langflow OSS 1.0.0-1.12.2''; remediation ''upgrading Langflow OSS to version 1.12.3''; initial publication 02
    Oct 2026, no revision. CVE-2026-104334: CVSS 3.1 9.8 AV:N/AC:L/PR:N/UI:N. PoC mechanics from the repository (read, not executed): authenticate against /api/v1/login
    with username and password, then POST to /api/v2/mcp/servers/{server_name} with `command` and `args`; header says versions 1.5.0 - 1.9.0, tested on Ubuntu 22.04,
    4 stars. Upstream GHSA-w794-rj3p-xv45 / CVE-2026-105697 (critical, published 2026-10-05, updated 2026-10-09) says the MCP stdio transport launched whatever command
    a user put in an MCP server configuration; with the default LANGFLOW_AUTO_LOGIN=true an exposed instance hands out a token without credentials (as relayed in
    the Previdian record of CVE-2026-105697), which is why ''authenticated'' is weak protection on a default install. Detection concept (derived from the mechanism,
    not stated by a source): POST or PATCH requests to /api/v2/mcp/servers/* in the Langflow access log, followed by child processes of the Langflow Python process
    that are not the configured MCP servers. Related flaw CVE-2026-8505 (unauthenticated flow execution via webhook when WEBHOOK_AUTH_ENABLE is off, the default):
    no exploitation reported; fix 1.10.1 per secondary summaries of IBM''s advisory (IBM page itself not fetched this run).'
- title: 'Avada (Fusion) Builder up to 7.16.1: unauthenticated arbitrary WordPress action-hook invocation (CVE-2026-97670, CVSS 9.1) reachable through any default
    AJAX form; fixed in 7.16.2'
  sources:
  - url: https://www.wordfence.com/threat-intel/vulnerabilities/id/e2c00795-c49b-4b0a-8f0a-4ed18c966c6b?source=cve
    publisher: Wordfence Intelligence
    date: '2026-10-09'
    role: primary
  - url: https://avada.com/blog/version-7-16-2-security-update/
    publisher: Avada (ThemeFusion) vendor post
    date: '2026-09-30'
    role: corroborating
  discovery_trace: 'first seen at: enisa-euvd, URL https://euvdservices.enisa.europa.eu/api/search?fromScore=9&toScore=10&fromDate=2026-10-10&size=100&page=0 (EUVD-2026-96051,
    published 2026-10-10 04:26Z, 9.1, Wordfence as assigner) -> primary: Wordfence Intelligence record, URL https://www.wordfence.com/threat-intel/vulnerabilities/id/e2c00795-c49b-4b0a-8f0a-4ed18c966c6b?source=cve
    (read with extract, served via the reader) -> vendor: https://avada.com/blog/version-7-16-2-security-update/ (the record''s own reference).'
  summary: 'Wordfence published CVE-2026-97670 on 2026-10-09 (updated 2026-10-10): in the Avada (Fusion) Builder plugin up to and including 7.16.1, the public form-submit
    endpoint parses a `formData` value and dispatches a WordPress action hook whose name comes from an attacker-supplied form-field value (the `{action_hook,...}`
    dynamic-data token in a notification''s email_message placeholder); the plugin''s trust gate only inspects `args`, never `formData`. An unauthenticated request
    can therefore invoke arbitrary action hooks, several per request. Wordfence states a verified request permanently deleted trashed posts, pages and comments through
    the core wp_scheduled_delete action, that other hooks cause denial of service (wp_maybe_auto_update) and, where vulnerable third-party handlers are installed,
    further privileged writes, and that a blind arbitrary user/post-meta read exists whose result goes only to the site owner. Exploitation requires a published Avada
    form with AJAX submission and a notification template that includes an [all_fields] or explicit [field] placeholder, which Wordfence calls the default form configuration.
    Fixed in Avada 7.16.2; the vendor''s post of 2026-09-30 announces fixes for six security issues, thanks Wordfence and Patchstack, and does not describe this flaw
    by name (mapping it to the ''XSS and injection vulnerability in Avada Forms submissions/notification emails'' line is our inference). No source reports exploitation;
    FIRST EPSS is 0.004 (2026-10-10). Avada is among the most widely deployed commercial WordPress themes, and Wordfence''s records list repeated unauthenticated
    Avada Builder flaws earlier in 2026, so municipal or institutional WordPress sites built on it are plausible targets, though no Swiss deployment is established.'
