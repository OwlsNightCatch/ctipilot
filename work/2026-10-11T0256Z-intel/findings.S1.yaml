recipe_notes:
- 'ssd-disclosure: `python3 tools/fetch_source.py url --direct "https://ssd-disclosure.com/wp-json/wp/v2/posts?per_page=12&_fields=date,link,title"` returns dated
  JSON for the newest advisories (newest 2026-09-10); /feed/ serves the homepage HTML (feed parse fails), `extract` of /advisories/ lists only the first href. Use
  the wp-json call as the record''s recipe.'
- '''Public PoC'' gating: `python3 tools/fetch_source.py url --direct "https://api.github.com/search/repositories?q=<CVE-ID>&per_page=10"` lists repositories naming
  the CVE with creation dates; then read the repository''s contents listing (api.github.com/repos/<owner>/<repo>/contents) before treating it as an exploit: README-only
  repositories (NetScaler CVE-2026-107406, MikroTik CVE-2026-84411) are lures. This route found a genuine PoC the 2026-10-10 re-gate missed (CVE-2026-93674).'
- 'IBM bulletins: the IBM security-bulletin listing is JS-only, but any bulletin page reads with `extract https://www.ibm.com/support/pages/node/<id>` (trafilatura-direct,
  full CVE table, version table, change history). Enumerate node ids from CERT-FR avis references (CERTFR-2026-AVI-1291 lists ten) or from BSI/NCSC-NL, never by guessing.'
- 'enisa-euvd: beyond `recent {lastvulnerabilities,exploited,criticals}` (4 items each), `url --direct "https://euvdservices.enisa.europa.eu/api/search?fromScore=9&toScore=10&fromDate=YYYY-MM-DD&size=100&page=0"`
  returns the full dated critical list (74 records for 2026-10-10 onward); EUVD''s `epss` field is a percent value, not a probability (FIRST gives 0.0037 where EUVD
  shows 0.37).'
- 'EPSS: `url --direct "https://api.first.org/data/v1/epss?cve=CVE-A,CVE-B,..."` returns probabilities for up to ~20 CVEs per call; fine for cve_table.'
- bsi-rss returns raw RSS XML, not JSON; parse with a regex or the feed tool. The BSI CSAF document carries the portal URL and the vendor bulletin reference (IBM
  node 7291628 for WID-SEC-2026-3813).
- 'Reader credit spent by `extract` this run on: psirt.global.sonicwall.com (SNWLID-2026-0017), wordfence.com threat-intel record, source.android.com bulletin, and
  an api.github.com query with an invalid date filter; the first three are known reader-only hosts. fortinet-psirt `feed` also falls back to the reader (titles only,
  no dates).'
- 'cisa-advisories: WebFetch of the cybersecurity-advisories listing returned 10 dated items with hrefs; `cisa csaf-recent` covered ICS. No KEV alert after 2026-10-04.'
- 'sap-security-notes and atlassian-security-advisories: `extract` works but the pages carry only the patch-day calendar and cadence text; the per-CVE Atlassian advisory
  page (read with `extract`) is the data.'
