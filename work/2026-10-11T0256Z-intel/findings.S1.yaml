  - quote: fixes for six security issues, and ongoing security hardening across multiple areas of Avada
    attribution: Avada (ThemeFusion) vendor post
    source_url: https://avada.com/blog/version-7-16-2-security-update/
  extended_notes: 'Wordfence record: software slug fusion-builder, affected <= 7.16.1, patched 7.16.2, remediation ''Update to version 7.16.2, or a newer patched
    version''; CVSS 3.1 vector (EUVD) AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:H. Exposure check the mechanism supports: Fusion Builder plugin version below 7.16.2 and at
    least one published Avada form with AJAX submission whose notification template uses [all_fields] or [field]. Detection concept (derived, not source-stated):
    POST requests to the Avada form-submit AJAX handler whose form-field values contain the literal ''{action_hook'' token; post-incident, unexplained removal of
    trashed posts, pages and comments. Hardening: update to 7.16.2; Wordfence does not name a workaround.'
