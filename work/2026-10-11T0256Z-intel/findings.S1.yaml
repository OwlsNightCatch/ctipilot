    attribution: IBM PSIRT (security bulletin)
    source_url: https://www.ibm.com/support/pages/security-bulletin-security-vulnerabilities-have-been-found-ibm-verify-identity-access-and-ibm-security-verify-access-11
  - quote: Bislang nennt IBM in der Sicherheitswarnung keine Hinweise darauf, dass Angreifer die Lücken bereits ausnutzen.
    attribution: heise online
    source_url: https://www.heise.de/news/Angreifer-koennen-Systeme-mit-IBM-Verify-Identity-Access-uebernehmen-11482296.html
  extended_notes: 'Version table from the bulletin: IBM Security Verify Access 10.0 - 10.0.9.2; IBM Verify Identity Access 11.0 - 11.0.3; IBM Security Verify Access
    Container 10.0 - 10.0.9.2; IBM Verify Identity Access Container 11.0 - 11.0.3. Appliance fixes: IVIA 11.0.3.1 (fix pack 11.0.3-ISS-IVIA-FP0001), ISVA 10.0.9.3
    (10.0.9-ISS-ISVA-FP0003). Workarounds and Mitigations: ''None''. Change history: 07 Oct 2026 initial publication only. CVSS 3.1 vector for the 9.8 flaws: AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H.
    Hardening lever the sources support: the fix packs; the bulletin names no configuration switch. Detection: sources give none; the web/reverse-proxy access logs
    of the appliance and authentication-event logs are the telemetry classes a hunter would review, but that is our inference, not a source statement. Triage: no
    behavioural description exists in any source, so no benign-lookalike discriminator is offered.'
- title: 'Langflow OSS: a public Python PoC now exists for CVE-2026-93674 (MCP-server command injection, IBM CVSS 9.8) beside the unauthenticated CVE-2026-104334;
    still no exploitation report or KEV listing (backlog row 1 re-gate)'
  sources:
  - url: https://www.ibm.com/support/pages/node/7290694
    publisher: IBM PSIRT (Langflow OSS bulletin)
    date: '2026-10-02'
    role: primary
  - url: https://github.com/rmhowe425/POC-CVE-2026-93674
    publisher: GitHub (rmhowe425, PoC repository)
    date: '2026-09-22'
    role: primary
  - url: https://previdian.com/CVE-2026-93674
