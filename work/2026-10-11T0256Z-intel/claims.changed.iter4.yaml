    text: "Lumen's Black Lotus Labs tracks PoeLLM, a financially motivated botnet active since at least April 2026 that Lumen says has impacted more than 3,400 servers, mostly in the United States and Western Europe, among them exposed LiteLLM, Ollama, Gotenberg and Gitea servers, with Ivanti Sentry possibly targeted. The malware derives its command-and-control address from words in a poem in a GitHub repository, runs XMRig and Iron miners and turns victims into scanners and exploit launchers that Lumen says likely abuse the LiteLLM CVE-2026-42271 path."
