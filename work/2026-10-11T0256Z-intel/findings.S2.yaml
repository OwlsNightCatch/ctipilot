  - title: "PK Softech / Publica: SRF explainer on why a pension-software supplier held sensitive insured-person data at all (expert commentary, no new scope facts)"
    sources:
      - { url: "https://www.srf.ch/news/schweiz/pensionskasse-des-bundes-wie-konnten-heikle-daten-bei-externer-softwarefirma-landen", publisher: "SRF (Schweizer Radio und Fernsehen)", date: "2026-10-10", role: "primary" }
      - { url: "https://www.cash.ch/news/angriff-auf-publica-lieferanten-lohndaten-konnten-betroffen-sein-975247", publisher: "cash.ch (AWP)", date: "2026-10-08", role: "corroborating" }
    discovery_trace: "first seen at: srf-news RSS, URL https://www.srf.ch/news/bnf/rss/1646 (feed, item 'Pensionskasse des Bundes - Wie konnten heikle Daten bei externer Softwarefirma landen?', 2026-10-10 12:11 CEST) → primary: SRF article, URL https://www.srf.ch/news/schweiz/pensionskasse-des-bundes-wie-konnten-heikle-daten-bei-externer-softwarefirma-landen (extract) → cross-check: WebSearch ('PK Softech Cyberangriff Pensionskasse Publica Datenabfluss') → cash.ch, URL https://www.cash.ch/news/angriff-auf-publica-lieferanten-lohndaten-konnten-betroffen-sein-975247 (WebFetch); store entry already carries the Inside IT / AWP customer list, BPK, BLVK and Pensionskasse Post notices, and the admin.ch release"
    summary: |
      SRF (2026-10-10) asks how sensitive insured-person data came to sit with the external software supplier at all. It restates that the attack targeted
      PK Softech AG rather than Publica directly, that names, addresses, AHV numbers and salary and pension-capital data may be affected and that
      it is still unclear how large the leak is and which insured persons it touches (nothing new on scope versus the existing entry). The new element is
      analysis: SRF's expert Marc Ruef (cybersecurity) names two generic routes by which production-grade personal data ends up at a software
      supplier: the supplier runs the application for the customer on its own systems, so the data lives there, or the supplier receives real data from live operation for tests
      and maintenance, where anonymised or pseudonymised data would be the alternative but is costly and error-prone, so firms sometimes choose economy over security.
      Ruef adds that clients can contractually reserve the right to audit how a supplier handles their data (document review or on-site checks).
      Both routes are SRF's expert's general observations, not findings about PK Softech: no source says which route applies, and PK Softech's own notice
      (already in the entry) says only that part of its IT infrastructure was reached with malware and that data must be assumed to have left. cash.ch (AWP, 2026-10-08) reports that the data
      outflow occurred from PK Softech's own IT infrastructure and not from the customers' systems (a point the pension funds' own notices also imply).
    region_nexus: "Switzerland: Publica (federal administration, ETH domain) and cantonal funds BPK/BLVK (canton of Bern staff and teachers)"
    primary_sector_nexus: "direct (federal and cantonal public-sector employees' pension data)"
    sector: "public-sector"
