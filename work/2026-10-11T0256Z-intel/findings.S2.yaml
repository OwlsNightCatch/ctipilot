  - title: "quitt.ch (Swiss household-employment payroll platform): data-sale claim by 'ChimeraZ' for 29,435 people including about 24,500 AHV numbers and 13,500 IBANs, not confirmed by the platform"
    sources:
      - { url: "https://www.cyberattaque.org/quitt-ch-pirate-les-donnees-sensibles-de-pres-de-30-000-personnes-mises-en-vente/", publisher: "Cyberattaque.org", date: "2026-10-10", role: "primary" }
      - { url: "https://www.cyberattaque.org/asp-frappe-par-une-nouvelle-cyberattaque-29-611-personnes-exposees/", publisher: "Cyberattaque.org", date: "2026-10-09", role: "context" }
    discovery_trace: "first seen at: cyberattaque-org RSS, URL https://www.cyberattaque.org/feed/ (feed, 2026-10-10 05:45 item 'quitt.ch piraté ...') → primary (the only source): Cyberattaque.org article, URL https://www.cyberattaque.org/quitt-ch-pirate-les-donnees-sensibles-de-pres-de-30-000-personnes-mises-en-vente/ (extract, served via jina) → victim check: extract of https://quitt.ch/ (no statement), WebSearch ('quitt.ch Datenleck Hacker ChimeraZ AHV-Nummern Haushaltsangestellte' and French variant) found no second source and no victim statement"
    summary: |
      Cyberattaque.org reports that a seller using the alias ChimeraZ is offering for sale a database it attributes to quitt.ch, a Swiss payroll and administration platform for private households that employ domestic workers:
      29,691 rows for 29,435 distinct people, about 197 MB as JSONL, with 29,680 email addresses, 24,919 phone numbers, 24,513 AHV (social-insurance) numbers and 13,516 IBANs claimed.
      The outlet says it obtained the 1,000-profile sample released with the claim and found AHV numbers in 811 and IBANs in 493 of the 1,000 profiles, plus residence-permit, marital-status, children (names and birth dates in at least 174 entries) and withholding-tax fields and references to the cantonal administrations used for filings,
      with some fields modified in 2026. How the data was obtained is not stated by the seller and no source determines it; the outlet states that quitt.ch has not publicly confirmed the leak. The same outlet attributes a 2026-10-09 data-sale claim for the French payment agency ASP (29,611 people, 24,065 social-security numbers) to the same alias.
      This is an unconfirmed criminal claim relayed by one outlet (Admiralty C); the sample check supports that the categories exist but not that the data came from quitt.ch's systems or when.
    region_nexus: "Switzerland (private platform; its data is used for filings with cantonal administrations and social-insurance funds); same alias also claims French public bodies"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
