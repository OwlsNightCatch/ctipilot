    summary: |
      Keystone-SDA/AWP report that Beyond Gravity, the aerospace supplier owned by the Swiss Confederation and spun off from the defence group Ruag in 2022, announced on
      Friday 2026-10-02 that it received the first indications of malicious activity in its IT environment on 2026-08-12 and has been the victim of a targeted
      cyberattack. The company believes a highly professional actor is behind it but, as of the statement, no one is identified. It is investigating with the Federal
      Office for Cybersecurity (BACS) and the IT security firm Mandiant, has stepped up its security measures, has filed a criminal complaint and says experts
      specifically searched for the attackers' activity and ran forensic analysis of the affected devices. A spokesperson told AWP that announcing nearly two months after the first indications was deliberate
      because thoroughness beats speed and an early statement would have jeopardised the forensic investigation. No source names an initial-access vector, whether data was taken, the
      scope or an actor; the 'highly professional actor' wording is the company's own belief, not an attribution. All four articles trace to the same wire report, and the company's own statement was not retrievable.
