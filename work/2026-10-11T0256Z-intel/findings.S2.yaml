    discovery_trace: "first seen at: inside-it-ch RSS, URL https://www.inside-it.ch/rss.xml (feed, 2026-10-09 13:20Z item 'Cybervorfall bei Online-Auktionshaus Ricardo') → extract of https://www.inside-it.ch/cybervorfall-bei-online-auktionshaus-ricardo-20261009 → pivot: swisscybersecurity-net listing (WebFetch of https://www.swisscybersecurity.net/) → URL https://www.swisscybersecurity.net/news/2026-10-09/ricardo-meldet-datenabfluss-bei-890000-userkonten → company statement (SMG/Ricardo) not located: WebSearch ('Ricardo Swiss Marketplace Group Datenabfluss 890'000 Nutzerkonten Mitteilung') empty, ricardo.ch/de/c/sicherheitsvorfall/ returned 404"
    summary: |
      Swiss Marketplace Group (SMG), which operates the online marketplace Ricardo, says that on 2026-10-07 it found unauthorised access to personal data on the platform and
      that, after investigation, personal data of about 890,000 user accounts was exposed. According to SMG the data is limited to names, postal addresses and phone numbers (plus company names for business accounts);
      e-mail addresses and passwords were not affected. SMG says the vulnerability that allowed the access has been fully closed, affected users are being informed directly, the Federal Data Protection and Information Commissioner (EDÖB) has been notified and a criminal complaint and a report
      to the BACS are planned. The access path (which flaw), the dwell time and the actor are not stated; the three articles carry the same company communication. Inference (mine, not stated by any source): contact data of this kind is useful for the callback and impersonation fraud the BACS weekly reviews have been describing.
    region_nexus: "Switzerland (national consumer platform; affects residents including public-sector staff)"
