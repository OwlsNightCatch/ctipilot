        translation: "It happens that the vendor receives data from live operation, i.e. details of real insured persons."
        attribution: "SRF (Schweizer Radio und Fernsehen)"
        source_url: "https://www.srf.ch/news/schweiz/pensionskasse-des-bundes-wie-konnten-heikle-daten-bei-externer-softwarefirma-landen"
