  - title: "Zenity Labs 'AgentCorruption': a single prompt to any exposed Amazon Bedrock AgentCore agent could extract IMDS credentials of an over-broad default role, reaching every AgentCore agent, session memory and stored secrets in the account and region"
    sources:
      - { url: "https://labs.zenity.io/post/agentcorruption-how-a-single-prompt-collapsed-the-entire-cloud-security-model", publisher: "Zenity Labs", date: "2026-10-08", role: "primary" }
      - { url: "https://www.theregister.com/security/2026/10/09/aws-agentcore-security-undone-by-prompt-requesting-credentials/5302436", publisher: "The Register", date: "2026-10-09", role: "secondary" }
    discovery_trace: "first seen at: theregister-security-feed, URL https://www.theregister.com/security/headlines.atom -> article https://www.theregister.com/security/2026/10/09/aws-agentcore-security-undone-by-prompt-requesting-credentials/5302436 (WebFetch) -> primary: Zenity Labs https://labs.zenity.io/post/agentcorruption-how-a-single-prompt-collapsed-the-entire-cloud-security-model"
    summary: |
      Zenity Labs (Tamir Ishay Sharbat, Lana Salameh) found that agents deployed on Amazon Bedrock AgentCore run in
      Firecracker MicroVMs without sufficient network isolation, so any agent tool that can make an HTTP request
      becomes an SSRF primitive to the instance metadata service; with chat access alone an attacker could prompt an
      exposed agent to return its IMDS credentials. The default AgentCore execution role was not scoped to the agent
      but to all AgentCore resources in the account and region (including InvokeAgentRuntime, ListEvents, CreateEvent
      for memory, DescribeLogGroups, ECR pull and, via the gateway path, GetResourceApiKey and
      secretsmanager:GetSecretValue), enabling takeover of other agents, reading private conversations, planting
      persistent memories that hijack agent goals, and credential theft. Timeline per Zenity: reported 2025-12-25 and
      2026-01-12; AWS closed the first report as informative on 2026-04-12 noting AgentCore moved to IMDSv2-only on
      2026-02-14; Zenity saw the default role unchanged on 2026-06-22 and substantially restricted on 2026-09-29. AWS
      told Zenity (statement reproduced in its post) that the behaviour is 'documented and expected' and that customers
      should grant least privilege; the Register reports Amazon characterising the research as documented behaviour
      that would need developer error. Zenity states all described issues are patched.
    region_nexus: "global; AWS Bedrock AgentCore customers"
    primary_sector_nexus: "indirect"
    sector: "cloud"
    cves: []
    techniques: [T1190, T1552.005, T1078.004]
    affected_products: ["Amazon Bedrock AgentCore"]
    entity_keys: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    lookback: true
    borderline: true
    borderline_reason: "Disclosed-and-fixed cloud-platform design weakness with AWS disputing it is a vulnerability; relevance to the constituency depends on AgentCore use, which nothing indicates; the transferable defender point (agent runtimes expose IMDS and default roles span all agents in an account) is generic."
    admiralty_hint: "B2 (original research; AWS statement and the fix timeline corroborate the behaviour, not the severity framing)"
    evidence:
      - quote: "Unfortunately, these MicroVMs do not provide sufficient network isolation."
        attribution: "Zenity Labs"
        source_url: "https://labs.zenity.io/post/agentcorruption-how-a-single-prompt-collapsed-the-entire-cloud-security-model"
      - quote: "The behavior described is documented and expected."
        attribution: "Zenity Labs"
        source_url: "https://labs.zenity.io/post/agentcorruption-how-a-single-prompt-collapsed-the-entire-cloud-security-model"
    extended_notes: |
      Exposure: AgentCore agents deployed before the 2026-02-14 IMDSv2-only change (per Zenity) and before the
      September 2026 default-role restriction; custom roles created from the old default keep their breadth.
      Detection (telemetry class): cloud control-plane audit logs (CloudTrail) for AgentCore execution-role
      credentials used from outside the agent runtime and for InvokeAgentRuntime/ListEvents/CreateEvent calls spanning
      agents; agent tool-call traces with requests to the link-local metadata address.
      Hardening: scope each agent's execution role to its own resources, restrict agent tools' egress to the
      metadata endpoint, and review roles created from the old default.
