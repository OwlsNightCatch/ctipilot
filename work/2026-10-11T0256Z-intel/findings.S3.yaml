  - title: "PoeLLM: a cryptomining botnet that hides its C2 address in a GitHub poem is compromising exposed LiteLLM, Ollama, Gotenberg and Gitea servers, and turns victims into scanners and exploit launchers"
    sources:
      - { url: "https://www.lumen.com/blog/en-us/canto-incognito-tracking-the-poellm-malware", publisher: "Lumen Black Lotus Labs", date: "2026-10-07", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/poellm-malware-infects-exposed-ai-servers-in-cryptomining-attacks/", publisher: "BleepingComputer", date: "2026-10-07", role: "secondary" }
      - { url: "https://www.theregister.com/security/2026/10/07/poetry-is-the-new-ai-security-threat-as-poellm-malware-infects-3k-servers/5301672", publisher: "The Register", date: "2026-10-07", role: "secondary" }
    discovery_trace: "first seen at: theregister-security-feed, URL https://www.theregister.com/security/headlines.atom -> article https://www.theregister.com/security/2026/10/07/poetry-is-the-new-ai-security-threat-as-poellm-malware-infects-3k-servers/5301672 (WebFetch) -> primary: Lumen Black Lotus Labs https://www.lumen.com/blog/en-us/canto-incognito-tracking-the-poellm-malware -> WebSearch (\"PoeLLM malware poem GitHub C2 Black Lotus Labs LiteLLM Ollama Gotenberg cryptominer botnet\") -> https://www.bleepingcomputer.com/news/security/poellm-malware-infects-exposed-ai-servers-in-cryptomining-attacks/"
    summary: |
      Lumen's Black Lotus Labs tracks PoeLLM (campaign name Canto Incognito), a financially motivated botnet active
      since at least April 2026 that Lumen says has impacted more than 3,400 servers, mostly in the United States and
      Western Europe, with a mid-June peak of nearly 800 active servers per day. Victims are overwhelmingly exposed
      open-source AI and developer services: LiteLLM and Ollama, the Gotenberg PDF converter and Gitea, with possible
      targeting of Ivanti Sentry; Lumen first met the infrastructure while investigating an Ivanti Sentry
      vulnerability (CVE-2026-10520) when a compromised Sentry victim contacted a PoeLLM C2 in early June. Infected
      hosts run XMRig and Iron miners against Kryptex pools and are conscripted as scanner and exploit workers that
      sweep ports 3000 (Gotenberg) and 4000 (LiteLLM) and, for LiteLLM, send a crafted POST that Lumen says most likely
      abuses the /mcp-rest/test/connection endpoint tied to CVE-2026-42271 (BleepingComputer adds that Horizon3 showed
      this can be chained with CVE-2026-48710 for unauthenticated RCE); victims then fetch the payload from the C2 on port 81 and
      beacon on ports 3778, 5001, 5002 or 9999. The C2 address is derived by a function that extracts four words from a
      poem committed to a GitHub fork of the nodejs.org source (a dash.css file by one GitHub user), maps them through
      a hard-coded dictionary to an IPv4 address and so lets the operator rotate C2 by editing the poem (11 edits since
      2026-04-13); several C2s were compromised routers with exposed admin pages. Lumen assesses with moderate
      confidence an Italian-speaking actor (Italian code comments) and sees early experiments with distributed SSH
      brute forcing. All attribution and victim counts are Lumen's own telemetry-based claims.
    region_nexus: "global; US and Western Europe predominate among victims (Lumen); no Swiss victim reported"
    primary_sector_nexus: "indirect (exposed AI gateways, Gitea and Ivanti Sentry appear in public-sector estates)"
    sector: "cross-sector"
    cves: [CVE-2026-42271, CVE-2026-10520]
    techniques: [T1190, T1496.001, T1102.001, T1584.008, T1595.002, T1105]
    affected_products: ["LiteLLM", "Ollama", "Gotenberg", "Gitea", "Ivanti Sentry"]
    entity_keys: ["product:litellm", "product:ollama", "product:gitea", "product:ivanti-sentry"]
    references_hint: ["2026-06-09/cve-2026-42271-berriai-litellm-low-privilege-command-injecti", "2026-06-10/cve-2026-10520-cve-2026-10523-ivanti-sentry-pre-auth-os-comm", "2026-08-31/ai-infrastructure-litellm-ragflow-kestra-intrusions"]
    new_entities:
      - { key: "malware:poellm", type: malware, name: "PoeLLM", aliases: [], summary: "Linux cryptomining and scanning malware (an ELF named libgcrypt) that derives its C2 IPv4 address from keywords in a poem hosted in a GitHub repository, with XMRig and Iron miners, remote shell, HTTP/S scanning and exploit deployment; tracked by Lumen Black Lotus Labs since April 2026 (Lumen, 2026-10-07)." }
      - { key: "campaign:canto-incognito-2026", type: campaign, name: "Canto Incognito", aliases: [], summary: "Lumen Black Lotus Labs' name for the PoeLLM botnet campaign against exposed AI/LLM and developer services (LiteLLM, Ollama, Gotenberg, Gitea, possibly Ivanti Sentry), assessed financially motivated and Italian-speaking, active since April 2026 (Lumen, 2026-10-07)." }
    relation_suggestions:
      - { subject: "campaign:canto-incognito-2026", object: "malware:poellm", basis: "Lumen: Canto Incognito is the campaign in which the PoeLLM malware is deployed (Lumen, 2026-10-07)" }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    lookback: true
    admiralty_hint: "B2 (Lumen first-hand netflow telemetry; media re-report one research origin; CVE-2026-42271 chain independently shown by Horizon3 per BleepingComputer)"
    evidence:
      - quote: "a malware campaign that uses a poem hosted on GitHub to direct infected systems to command-and-control servers"
        attribution: "Lumen Black Lotus Labs"
        source_url: "https://www.lumen.com/blog/en-us/canto-incognito-tracking-the-poellm-malware"
      - quote: "The malware has impacted more than 3,400 victim servers, with peak activity exceeding 800 active servers per day."
        attribution: "Lumen Black Lotus Labs"
        source_url: "https://www.lumen.com/blog/en-us/canto-incognito-tracking-the-poellm-malware"
      - quote: "Notably, the Gotenberg installation guidance includes an explicit warning not to expose the service to the internet"
        attribution: "Lumen Black Lotus Labs"
        source_url: "https://www.lumen.com/blog/en-us/canto-incognito-tracking-the-poellm-malware"
      - quote: "Once a server is compromised, it becomes a springboard to spread the malware further, using scanning on ports 3000 and 4000, associated with Gotenberg and LiteLLM, and attempting to exploit CVE-2026-42271."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/poellm-malware-infects-exposed-ai-servers-in-cryptomining-attacks/"
    extended_notes: |
      Publication-date caveat: the Lumen page's own metadata reads 2026-03-16 although its content runs to
      September 2026; BleepingComputer, the Register and other outlets all date the Lumen report 2026-10-07.
      Exposure: internet-reachable LiteLLM (default 4000), Gotenberg (3000), Ollama, Gitea; Ivanti Sentry on a
      vulnerable build; tell by external attack-surface scan plus patch level of LiteLLM (CVE-2026-42271 /
      CVE-2026-48710) and Sentry (CVE-2026-10520).
      Detection (telemetry class): egress from AI/PDF/Git servers to mining-pool infrastructure and to unusual high
      ports (81, 3778, 5001, 5002, 9999); servers originating scans toward 3000/4000; servers fetching content from a
      GitHub repository they have no business with (poem-in-CSS dead drop); an ELF executable presenting as a
      libgcrypt library running as a long-lived process; sustained GPU/CPU saturation on inference hosts.
      Post-patch check: patching LiteLLM or Sentry does not remove an implant already running; hunt for miners,
      the dropped ELF and scan traffic on hosts that were exposed before patching.
      Triage: legitimate libgcrypt is a shared library, not a standalone process with network connections; a PDF
      converter or LLM proxy has no legitimate reason to speak to Kryptex pools.
      Defender takeaway: bring AI gateways and utility services (Gotenberg explicitly warns against exposure) into
      the same exposure and patch inventory as other internet-facing software.
