  # ------------------------------------------------------------------ 5
  - title: "Chromium IDN display checks still let Cyrillic and Latin-with-hook lookalikes render in Unicode: Have I Been Squatted registered 20 proof-of-concept lookalike .com domains"
    sources:
      - { url: "https://haveibeensquatted.com/blog/turning-idn-edge-cases-into-typosquats", publisher: "Have I Been Squatted", date: "2026-10-03", role: "primary" }
      - { url: "https://www.theregister.com/security/2026/10/10/two-characters-open-up-a-world-of-typosquatting-opportunities-in-chromium-browsers/5302383", publisher: "The Register", date: "2026-10-10", role: "secondary" }
    discovery_trace: "first seen at: theregister-security-feed, URL https://www.theregister.com/security/headlines.atom -> article https://www.theregister.com/security/2026/10/10/two-characters-open-up-a-world-of-typosquatting-opportunities-in-chromium-browsers/5302383 (WebFetch) -> primary: Have I Been Squatted https://haveibeensquatted.com/blog/turning-idn-edge-cases-into-typosquats"
    summary: |
      Researchers Ian Muscat and Leanne Briffa of Have I Been Squatted (primary dated 2026-10-03, reported by the
      Register on 2026-10-10) show that Chromium's two-stage lookalike defence can be bypassed for registerable .com
      names. Stage 1 (SafeToDisplayAsUnicode) applies a whole-script-confusable rule that only fires when every
      Cyrillic character is on a hard-coded lookalike list, so a single off-list 'breaker' letter (U+04AF, U+04E9,
      U+0457 are still allowed from Chrome 148; two further breakers were rejected from Chrome 148 on, and Chrome 147
      and earlier accept all five) keeps the name in Unicode. Stage 2 (GetSimilarTopDomain) compares skeletons against
      a bundled list of 8,462 popular domains (836 in a top bucket); Latin letters with a hook or stroke keep a
      combining mark in the skeleton and so escape the match, and most domains are not on the list at all. The
      navigation-time LookalikeUrlNavigationThrottle skips near-match checks for targets shorter than five characters
      and relies on the visitor's browsing history, so a new visitor gets no warning. The researchers registered 20
      lookalikes, shown in Unicode in Chrome 154 with valid certificates; the Register adds that email clients are even
      less strict than the browser, that Google made no statement and that Chrome 148 and 154 fixed related breakers.
      The researchers also counted 161,894 IDN/ASCII lookalike pairs in the .com zone (October 2026 snapshot), noting
      that lookalike does not imply malicious.
    region_nexus: "global; any organisation whose domain is not on Chromium's bundled popular-domain list"
    primary_sector_nexus: "indirect (brand and citizen-facing domains of public-sector bodies)"
    sector: "cross-sector"
    cves: []
    techniques: [T1583.001, T1566.002]
    affected_products: ["Google Chrome", "Microsoft Edge"]
    entity_keys: ["product:google-chrome"]
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: "Proof-of-concept display bypass with no observed abuse and no vendor response; the transferable value is that Chromium's stage-2 protection covers only about 8,500 bundled domains plus the user's frequented sites, which leaves most organisation domains (public-sector ones included) to their own brand monitoring."
    admiralty_hint: "B3 (original research by a domain-security firm; Chromium behaviour reproduced by its authors only)"
    evidence:
      - quote: "Stage 2 stops only a name whose skeleton exactly matches one on its list, so anything that keeps a mark, or targets a name off the list, gets through."
        attribution: "Have I Been Squatted"
        source_url: "https://haveibeensquatted.com/blog/turning-idn-edge-cases-into-typosquats"
      - quote: "Chromium skips this step for targets shorter than five characters before the TLD."
        attribution: "Have I Been Squatted"
        source_url: "https://haveibeensquatted.com/blog/turning-idn-edge-cases-into-typosquats"
      - quote: "Chrome 147 and earlier accept all five."
        attribution: "Have I Been Squatted"
        source_url: "https://haveibeensquatted.com/blog/turning-idn-edge-cases-into-typosquats"
    extended_notes: |
      Exposure: staff and citizens using Chromium-based browsers (Chrome, Edge) and webmail; the researchers say the
      address bar can show the lookalike in Unicode with a valid certificate and no Safety Tip for first-time visitors.
      Detection (telemetry class): web proxy and DNS logs for xn-- labels, newly registered or newly seen domains whose
      ASCII skeleton resembles own and supplier domains; mail-gateway sender-domain checks for mixed or off-list
      Cyrillic/Latin-extended characters; registrar-side zone-file monitoring for lookalikes of owned names.
      Hardening: do not rely on the address bar for authenticity; flag or block IDN (xn--) hostnames to high-trust
      destinations at the secure web gateway; register or monitor permutations of citizen-facing domains.
      Contradiction to surface: the Register says Chrome 148 and 154 added fixes for related breakers, while the
      researchers show Chrome 154 still displaying their proof of concept.
