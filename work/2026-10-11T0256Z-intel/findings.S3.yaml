  - title: "Attackers compromised the operators of the .gh, .sl and .as country-code registries, rewrote authoritative DNS and obtained domain-validated certificates for Google and other organisations' names"
    sources:
      - { url: "https://blog.google/security/chromes-response-to-recent-cctld-registry-hijacks/", publisher: "Google Chrome Secure Web and Networking Team", date: "2026-10-06", role: "primary" }
      - { url: "https://community.letsencrypt.org/t/chromes-response-to-recent-cctld-registry-hijacks/251941/2", publisher: "Let's Encrypt community forum (Matthew McPherrin)", date: "2026-10-07", role: "corroborating" }
      - { url: "https://thehackernews.com/2026/10/attackers-hijack-gh-sl-and-as.html", publisher: "The Hacker News", date: "2026-10-08", role: "corroborating" }
      - { url: "https://www.bleepingcomputer.com/news/security/hackers-hijack-google-domains-after-breaching-cctld-registries/", publisher: "BleepingComputer", date: "2026-10-07", role: "secondary" }
      - { url: "https://www.theregister.com/security/2026/10/07/attackers-hijacked-top-level-domains-minted-fake-security-certs-for-google-and-other-orgs/5301718", publisher: "The Register", date: "2026-10-07", role: "secondary" }
      - { url: "https://www.infosecurity-magazine.com/news/attackers-hijack-cctlds-obtain/", publisher: "Infosecurity Magazine", date: "2026-10-08", role: "secondary" }
    discovery_trace: "first seen at: theregister-security-feed, URL https://www.theregister.com/security/headlines.atom -> article https://www.theregister.com/security/2026/10/07/attackers-hijacked-top-level-domains-minted-fake-security-certs-for-google-and-other-orgs/5301718 (WebFetch) -> primary: Google Chrome blog https://blog.google/security/chromes-response-to-recent-cctld-registry-hijacks/ -> WebSearch (\".gh .sl .as ccTLD registry hijack unauthorized certificates Google Chrome CRLSet registry statement\") -> The Hacker News CT-log review https://thehackernews.com/2026/10/attackers-hijack-gh-sl-and-as.html -> Let's Encrypt forum https://community.letsencrypt.org/t/chromes-response-to-recent-cctld-registry-hijacks/251941/2; also seen at infosec-magazine https://www.infosecurity-magazine.com/news/attackers-hijack-cctlds-obtain/ and malwarebytes https://www.malwarebytes.com/blog/news/2026/10/attackers-hijack-country-code-domains-to-impersonate-google-and-other-services; blog.google/security/rss/ (google-tag record) also carries the post"
    summary: |
      Google's Chrome Secure Web and Networking Team reports (2026-10-06) that attackers compromised the third-party
      operators of the .gh (Ghana), .sl (Sierra Leone) and .as (American Samoa) country-code namespaces, modified
      authoritative DNS records and, because certificate authorities validate domain control through DNS, obtained
      unauthorized HTTPS certificates covering several Google domains and domains of other organisations. Google says
      its own systems were not compromised and it has no reason to believe the issuing CAs erred. Chrome blocked the
      Google certificates through CRLSets and Google had the CAs revoke them; Certificate Transparency data then
      surfaced further affected organisations (Google names none), whose certificates Chrome also blocked. Google
      states it cannot guarantee it found every affected domain and that Chrome interventions do not reliably protect
      non-Chrome clients. The Hacker News' own CT-log review (via ctlogs.dev and Cert Spotter) found 12 certificates
      for seven Google/YouTube names, 11 issued by Let's Encrypt and one by ZeroSSL, logged on 2026-09-22 (.gh),
      2026-09-25 (.sl) and 2026-09-27 (.as) and revoked between 2026-09-26 and 2026-10-01, i.e. 1.5 days to nearly a
      week after first logging; a Let's Encrypt staff member confirmed on 2026-10-07 that certificates for Google
      and YouTube names were issued and revoked. Neither Google nor the press identify the attackers, the registry
      compromise vector or the hijack dates, and Google did not say whether the certificates were used to intercept
      traffic. The transferable lesson is that registry-level DNS control defeats DNS-based domain validation
      regardless of CA conduct, so detection rests on Certificate Transparency monitoring of every owned name, and
      CAA records bound to ACME accounts and validation methods are what stops cached validation being reused after
      control is restored (they do not stop issuance while the hijack is live).
    region_nexus: "global; any organisation holding names under .gh, .sl or .as (including parked or regional brand variants); mechanism transfers to any ccTLD whose operator is compromised; no .ch impact reported"
    primary_sector_nexus: "indirect"
    sector: "cross-sector"
    cves: []
    techniques: [T1584.002, T1649]
    affected_products: ["Google Chrome"]
    entity_keys: ["product:google-chrome"]
    new_entities:
      - { key: "incident:cctld-registry-hijacks-gh-sl-as-2026-09", type: incident, name: "ccTLD registry hijacks (.gh, .sl, .as) with fraudulent Google certificates", aliases: [], summary: "Attackers compromised the operators of the .gh, .sl and .as registries in late September 2026, modified authoritative DNS records and obtained unauthorized domain-validated certificates for Google and other organisations' names; disclosed by Google Chrome on 2026-10-06, with a Certificate Transparency review by The Hacker News finding 12 certificates logged 2026-09-22 to 2026-09-27." }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    lookback: true
    admiralty_hint: "A1 (Google first-party for its own browser response; Let's Encrypt statement and an independent CT-log review corroborate the core facts)"
    evidence:
      - quote: "attackers modified authoritative DNS records and obtained unauthorized HTTPS certificates covering several Google domains"
        attribution: "Google Chrome Secure Web and Networking Team"
        source_url: "https://blog.google/security/chromes-response-to-recent-cctld-registry-hijacks/"
      - quote: "Due to the complexity of DNS hijacks, we cannot guarantee that our analysis identified every affected domain, nor do Chrome interventions reliably protect non-Chrome users."
        attribution: "Google Chrome Secure Web and Networking Team"
        source_url: "https://blog.google/security/chromes-response-to-recent-cctld-registry-hijacks/"
      - quote: "CAs are permitted to cache and reuse completed domain control validation (DCV) checks for subsequent issuance"
        attribution: "Google Chrome Secure Web and Networking Team"
        source_url: "https://blog.google/security/chromes-response-to-recent-cctld-registry-hijacks/"
      - quote: "The 12 certificates are for seven domains. Let's Encrypt issued 11 of them and ZeroSSL issued one."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/10/attackers-hijack-gh-sl-and-as.html"
      - quote: "Yes, certificates for Google and Youtube were issued, and have been revoked."
        attribution: "Let's Encrypt community forum (Matthew McPherrin)"
        source_url: "https://community.letsencrypt.org/t/chromes-response-to-recent-cctld-registry-hijacks/251941/2"
    extended_notes: |
      Exposure: owners of any name under .gh, .sl or .as; more generally any organisation whose registrar/registry
      path can be compromised. Tell by querying CT logs (ctlogs.dev, Cert Spotter, crt.sh class services) for your
      names and comparing issuing CA and ACME account against your certificate inventory.
      Detection (telemetry class first): Certificate Transparency issuance feed for every owned name including
      wildcards and parked/regional variants; DNS delegation (NS/A) change monitoring via passive DNS or zone data;
      CAA record state. Post-recovery check: confirm restrictive CAA with accounturi and validationmethods (RFC 8657)
      is republished so cached domain-control validation cannot mint new certificates after the registry is restored
      (Google's own recommendation); CAA cannot prevent issuance during an active hijack and browser-side blocking
      does not cover non-Chrome clients.
      Triage (derived mechanically from the stated mechanism): a valid, correctly chained certificate is no longer
      evidence of authenticity; discriminators are issuing CA / ACME account not in inventory, issuance burst on a
      single ccTLD, and a coincident delegation change.
      Defender takeaway: add every domain, including defensive and foreign ccTLD registrations, to CT monitoring and
      pin issuance with CAA + ACME account binding; treat registry-operator compromise as a DNS-trust failure no
      CA-side control prevents.
      Caveats: dates of the hijacks and the registry compromise vector are not disclosed by Google; the Hacker News
      names (google.com.gh, google.sl, google.as, youtube.*) are its own CT findings and the total may be higher.
