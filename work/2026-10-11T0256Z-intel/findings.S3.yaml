  - title: "Barracuda: phishing emails now carry hidden prompt injection aimed at the recipient's AI mail assistant alongside a password-protected-attachment lure, with the sample sent from a public-sector domain"
    sources:
      - { url: "https://blog.barracuda.com/2026/10/07/email-attacks-target-both-humans-ai-assistants", publisher: "Barracuda", date: "2026-10-07", role: "primary" }
      - { url: "https://www.infosecurity-magazine.com/news/attackers-hide-ai-prompt/", publisher: "Infosecurity Magazine", date: "2026-10-07", role: "secondary" }
    discovery_trace: "first seen at: infosec-magazine, URL https://www.infosecurity-magazine.com/rss/news/ -> https://www.infosecurity-magazine.com/news/attackers-hide-ai-prompt/ -> primary: Barracuda https://blog.barracuda.com/2026/10/07/email-attacks-target-both-humans-ai-assistants"
    summary: |
      Barracuda Research analysed a campaign email that looks like internal correspondence (From and To the same
      mailbox, a trusted spam-confidence score, originating from a public-sector domain) and targets two readers: the
      human, with a password-protected attachment whose password sits in the body (a blind spot for scanners), and the
      AI assistant that summarises or triages the mailbox, with hidden instructions meant to make the summary present
      the message as legitimate or urgent, or to inject a fake priority action such as changing vendor payment details.
      Barracuda lists four hiding techniques: HTML comments, CSS-invisible text (zero font size, white or hidden),
      Base64-encoded blocks, and zero-width Unicode characters. Barracuda does not say how widespread the campaign is,
      and its recommendations are input sanitisation, injection detection, AI sandboxing, output validation, human
      approval of payment changes and monitoring for repeated attempts.
    region_nexus: "global; the sample came from a public-sector sender domain (not named)"
    primary_sector_nexus: "direct-adjacent (public-sector sender domain; organisations rolling out AI mail assistants)"
    sector: "cross-sector"
    cves: []
    techniques: [T1566.001, T1204.002]
    affected_products: []
    entity_keys: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    lookback: true
    borderline: true
    borderline_reason: "Single-vendor observation with no prevalence data; the transferable detection hook (hidden-content parsing before mail reaches an AI assistant) is concrete, and the public-sector sender domain suggests a compromised government mailbox, but nothing ties it to the constituency."
    admiralty_hint: "C3"
    evidence:
      - quote: "and it originates from a public sector domain, all of which lend it perceived legitimacy and help it pass reputation-based filtering."
        attribution: "Barracuda"
        source_url: "https://blog.barracuda.com/2026/10/07/email-attacks-target-both-humans-ai-assistants"
      - quote: "Instructions are tucked inside comment tags that never render in a mail client but remain in the raw source code an AI parses."
        attribution: "Barracuda"
        source_url: "https://blog.barracuda.com/2026/10/07/email-attacks-target-both-humans-ai-assistants"
    extended_notes: |
      Detection (telemetry class): mail-gateway HTML parsing for comment blocks, zero-size/white-on-white text,
      Base64 data blocks and zero-width characters in the message body; correlate with password-protected archive
      attachments whose password is in the body and with messages whose From and To are identical.
      Triage: identical From/To is also produced by some legitimate system notifications; the discriminator is the
      combination with hidden instruction-like text and an encrypted attachment.
