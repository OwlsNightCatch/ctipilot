  - title: "Shai-Hulud/ChainDrop-pattern worm hits the tensorlake npm SDK: a release with valid build provenance carries a credential stealer with a dead-man switch that wipes the home directory when the stolen GitHub token is revoked"
    sources:
      - { url: "https://www.socket.dev/blog/tensorlake-compromise", publisher: "Socket", date: "2026-10-08", role: "primary" }
      - { url: "https://www.endorlabs.com/learn/tensorlake-npm-package-compromised-by-shai-hulud-in-latest-software-supply-chain-attack", publisher: "Endor Labs", date: "2026-10-08", role: "primary" }
      - { url: "https://www.ox.security/blog/shai-hulud-here-we-go-again-tensorlake-npm-package-hit-with-malware/", publisher: "OX Security", date: "2026-10-08", role: "corroborating" }
    discovery_trace: "first seen at: ox-security, URL https://www.ox.security/blog/ (raw listing) -> https://www.ox.security/blog/shai-hulud-here-we-go-again-tensorlake-npm-package-hit-with-malware/ (also surfaced in theregister-security-feed https://www.theregister.com/security/headlines.atom, 2026-10-08 'Shai-Hulud worm makes jump to AI infrastructure with Tensorlake compromise', not fetched) -> WebSearch (\"tensorlake npm 0.5.144 Shai-Hulud malicious version compromise\") -> primary: Socket https://www.socket.dev/blog/tensorlake-compromise and Endor Labs https://www.endorlabs.com/learn/tensorlake-npm-package-compromised-by-shai-hulud-in-latest-software-supply-chain-attack"
    summary: |
      Socket, Endor Labs and OX Security report that tensorlake@0.5.144, the npm SDK of an AI-agent sandbox platform
      (about 12K weekly downloads), was published on 2026-10-08 at 01:12 UTC carrying a Shai-Hulud-family worm; Socket
      flagged it about 11 minutes after publication and it has since been removed (0.5.143 is clean; six
      tensorlake-native-*@0.5.144 binary packages carry no payload but should be avoided). A preinstall hook runs an
      obfuscated loader (lib/setup.mjs) that launches a large payload (lib/Math_Symbol.js) under Bun; the payload
      harvests npm and GitHub tokens, AWS credentials (IMDS, ECS, Secrets Manager, SSM), local HashiCorp Vault,
      Kubernetes service-account tokens and kubeconfig, SSH keys, .env files, wallets and AI-tool configuration, then
      republishes itself with Sigstore provenance to packages the victim can publish. Endor Labs reports the release
      went out through the project's normal GitHub Actions pipeline with valid build provenance after the main
      branch was modified (first malicious commit 2026-10-07 01:20 UTC), most likely via a compromised maintainer
      account. The endpoint is resolved from an Ethereum contract via about 30 public RPC endpoints with a GitHub
      fallback. The operationally critical detail, in Socket's and OX's accounts, is a dead-man switch: a PowerShell
      monitor persisted through an ONLOGON scheduled task polls the GitHub API with the stolen token and, when the
      token is revoked, runs an attacker handler (the payload carries the same revoke-wipe string as earlier waves),
      so revoking before removing the monitor wipes the owner's home directory. Attribution is split: Socket frames
      it as part of the ChainDrop/Shai-Hulud campaign, matching filenames and structure of the August keyv wave,
      while OX notes new public keys that may indicate an independent actor reusing the Shai-Hulud name.
    region_nexus: "global; developer and CI environments in any organisation that installed the release"
    primary_sector_nexus: "indirect (software supply chain of public-sector development and cloud teams)"
    sector: "technology"
    cves: []
    techniques: [T1195.002, T1059.007, T1552.001, T1552.005, T1053.005, T1485, T1102.001, T1195.001]
    affected_products: ["npm", "tensorlake (npm SDK)"]
    entity_keys: ["campaign:shai-hulud-chaindrop-2026-08", "product:npm"]
    new_entities:
      - { key: "incident:tensorlake-npm-compromise-2026-10", type: incident, name: "tensorlake npm SDK compromise (0.5.144)", aliases: [], summary: "Malicious tensorlake@0.5.144 published to npm on 2026-10-08 with a Shai-Hulud-family credential-stealing worm and a revoke-triggered wipe; published with valid build provenance after a main-branch compromise (Socket, Endor Labs, OX Security, 2026-10-08)." }
    relation_suggestions:
      - { subject: "incident:tensorlake-npm-compromise-2026-10", object: "campaign:shai-hulud-chaindrop-2026-08", basis: "Socket: payload filenames and structure match the August ChainDrop/Shai-Hulud compromises of keyv and cacheable; OX Security cautions that new public keys may mean an independent actor (overlap, not attribution)" }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-of:2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver"
    novelty_note: "The tensorlake release is a new victim package of the same worm family, so it fits as a dated update on the CHAINDROP deep-dive entry; the existing entry already tells readers to isolate before revoking, and the delta is the dead-man wipe mechanics, valid build provenance via a poisoned main branch, and the AI-agent-sandbox target. The main agent may instead judge it a distinct incident."
    lookback: true
    admiralty_hint: "B1 (three independent lab write-ups of the same artefact)"
    evidence:
      - quote: "Revoking the stolen GitHub token while the monitor is still running triggers the dead-man switch to wipe the user's home directory, regardless of where the revocation is done."
        attribution: "Socket"
        source_url: "https://www.socket.dev/blog/tensorlake-compromise"
      - quote: "The payload has no hardcoded command-and-control domain."
        attribution: "Socket"
        source_url: "https://www.socket.dev/blog/tensorlake-compromise"
      - quote: "The malicious release shipped through the project's normal GitHub Actions pipeline and even carried valid build provenance."
        attribution: "Endor Labs"
        source_url: "https://www.endorlabs.com/learn/tensorlake-npm-package-compromised-by-shai-hulud-in-latest-software-supply-chain-attack"
      - quote: "Threat actors used new public keys that differ from other attacks. This may indicate an independent threat actor or a new group using the Shai-Hulud name and malicious code."
        attribution: "OX Security"
        source_url: "https://www.ox.security/blog/shai-hulud-here-we-go-again-tensorlake-npm-package-hit-with-malware/"
    extended_notes: |
      Exposure: any host or CI runner that ran npm install for tensorlake@0.5.144 with lifecycle scripts permitted
      (preinstall runs without importing the SDK); check manifests, lockfiles, build logs and deployed artifacts.
      Detection (telemetry class): package-manager install events and process-creation lineage (node under npm
      launching Bun); outbound calls from build hosts to public Ethereum RPC endpoints; new GitHub repositories,
      workflow files and tokens created by developer identities; per-user scheduled tasks / systemd user units /
      LaunchAgents named like a token monitor (gh-token-monitor per Socket and OX).
      Post-patch check: removing the dependency does not remove the persistent monitor; remove the monitor first on
      Linux (systemctl --user), macOS (LaunchAgent) and Windows (ONLOGON task) and only then revoke and rotate.
      Triage: a build tool legitimately fetches from npm and GitHub; the discriminators are a preinstall hook that
      starts Bun, Ethereum RPC egress from a build host and a user-level persistence unit created during install.
      Defender takeaway: valid provenance only shows where a build ran; gate on lifecycle-script policy
      (--ignore-scripts where practical) and rehearse the revoke-after-containment ordering.
      Dating caveats: Endor gives publication 2026-10-08 01:12 UTC and first malicious commit 2026-10-07 01:20 UTC.
