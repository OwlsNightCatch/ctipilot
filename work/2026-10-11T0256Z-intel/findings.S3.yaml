        attribution: "Adversa AI"
        source_url: "https://adversa.ai/blog/cryptographic-context-injection-github-copilot/"
      - quote: "executed the full chain in 50% of our runs."
        attribution: "Adversa AI"
        source_url: "https://adversa.ai/blog/cryptographic-context-injection-github-copilot/"
    extended_notes: |
      Detection (telemetry class): agent session traces / shell-tool audit logs showing untrusted fetch, then local
      code execution, then reads of .env or credential files, then an outbound request to a host outside the task.
      Hardening named by Adversa: do not run autopilot with credentials in reach; gate new network destinations and
