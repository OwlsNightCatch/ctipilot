  - title: "Adversa AI: Cryptographic Context Injection makes GitHub Copilot CLI in autopilot mode read local .env files and send them out; GitHub declined to treat it as a vulnerability"
    sources:
      - { url: "https://adversa.ai/blog/cryptographic-context-injection-github-copilot/", publisher: "Adversa AI", date: "2026-10-06", role: "primary" }
      - { url: "https://www.theregister.com/ai-and-ml/2026/10/06/zombie-instructions-on-carefully-constructed-web-pages-could-trick-github-copilot-cli-into-sharing-secrets/5301206", publisher: "The Register", date: "2026-10-06", role: "secondary" }
    discovery_trace: "first seen at: theregister-security-feed, URL https://www.theregister.com/security/headlines.atom -> article https://www.theregister.com/ai-and-ml/2026/10/06/zombie-instructions-on-carefully-constructed-web-pages-could-trick-github-copilot-cli-into-sharing-secrets/5301206 (WebFetch) -> primary: Adversa AI https://adversa.ai/blog/cryptographic-context-injection-github-copilot/"
    summary: |
      Adversa AI's Rony Utevsky reports that a web page carrying ciphertext plus two candidate decryption keys, one of
      them a template that can only be filled by reading local files, can steer GitHub Copilot CLI into reading files
      such as a project's .env (including outside the working directory), decrypting a second stage inside the agent's
      own runtime and requesting an attacker URL that carries the harvested content, in 28 seconds and without a
      confirmation prompt. The chain needs the CLI in autopilot mode and a permissive model: Microsoft's
      mai-code-1.1-flash executed it in 50% of Adversa's runs while two GPT-5.6 models refused, and on Auto routing the
      user cannot see which model handles the session; the same instructions in plaintext are refused as prompt
      injection. Adversa reported to GitHub on 2026-09-17; as of 2026-10-01 triage validated the report but declined to
      treat it as a vulnerability (the user directed the fetch and granted autonomy), declared it ineligible for the
      bounty and announced no change; Adversa says the chain still reproduces and withholds payloads. Its defensive
      guidance is to trace every tool call with resolved arguments and alert on the sequence untrusted content in,
      code runs, local files read, agent contacts an unrelated host.
    region_nexus: "global; developers using Copilot CLI"
    primary_sector_nexus: "indirect"
    sector: "technology"
    cves: []
    techniques: [T1552.001, T1048]
    affected_products: ["GitHub Copilot CLI"]
    entity_keys: ["product:github-copilot"]
