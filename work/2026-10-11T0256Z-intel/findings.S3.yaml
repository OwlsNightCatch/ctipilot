  - title: "CrowdStrike: an unattributed, likely Chinese-speaking financially motivated actor used the open-source agentic pentesting tool ARTEX with Claude Code and several LLM backends to breach South Korean financial organisations"
    sources:
      - { url: "https://www.crowdstrike.com/en-us/blog/unknown-threat-actor-uses-artex-to-target-south-korean-finance/", publisher: "CrowdStrike", date: "2026-10-07", role: "primary" }
      - { url: "https://www.infosecurity-magazine.com/news/chinese-hacker-ai-korean-banks/", publisher: "Infosecurity Magazine", date: "2026-10-08", role: "secondary" }
    discovery_trace: "first seen at: infosec-magazine, URL https://www.infosecurity-magazine.com/rss/news/ -> https://www.infosecurity-magazine.com/news/chinese-hacker-ai-korean-banks/ -> primary: CrowdStrike https://www.crowdstrike.com/en-us/blog/unknown-threat-actor-uses-artex-to-target-south-korean-finance/"
    summary: |
      CrowdStrike Intelligence reports a campaign from late September to early October 2026 against South Korean
      financial organisations that resulted in exfiltrated data, in which the actor used ARTEX, a recently released
      open-source agentic penetration-testing tool developed in China, together with LLMs. Threat-actor-controlled open
      directories exposed Claude Code session histories, ARTEX configuration and Claude memory files, showing a two-server
      architecture (a Hong Kong-hosted primary server and a separate ARTEX instance), an ARTEX backend using DeepSeek
      with Zhipu GLM and Grok supplementing Claude Code sessions, a likely LLM API proxy/reseller, and rotating proxy
      IPs. The actor also asked Claude where Korean breach data is sold. CrowdStrike assesses with moderate confidence
