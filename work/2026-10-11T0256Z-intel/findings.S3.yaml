coverage_gaps:
  - source_id: risky-biz-news
    reason: "Both https://news.risky.biz/rss/ and the homepage show the newest issue as 2026-10-02 (Risky Bulletin, KillSec); no issue dated 2026-10-05 to 2026-10-10 was visible on either transport. Recipe still works; the gap is publisher silence or a stale feed, not a transport failure."
  - source_id: ahnlab-asec
    reason: "extract on asec.ahnlab.com (listing and posts) was served via the jina reader, not trafilatura-direct, and the log showed a reader key balance exhausted (HTTP 402) with automatic rotation; recipe works but spends reader credit. WebFetch per the record note remains the credit-free path; direct transports appear to fail on this host."
  - source_id: theregister-security-feed
    reason: "Recipe note: extract on theregister.com article URLs returns only the site navigation boilerplate (trafilatura picks up the menu), so no body. WebFetch with the outbound-links template returns the full body, outbound links and quotes; raw `url` fetch was not tried. Use WebFetch for Register bodies."
  - source_id: cloudflare-cf1
    reason: "Recipe fix: https://blog.cloudflare.com/tag/cloudforce-one/rss/ returns 8 dated items on the direct feed transport (newest 2026-10-07), so fetch_method could move webfetch -> rss with that rss_url. The threat-report cards at https://www.cloudflare.com/threat-intelligence/research/ carry no dates; per-card extract metadata carries them (Aisuru card is a 2025 report)."
  - source_id: sentinellabs
    reason: "Recipe improvement: raw `python3 tools/fetch_source.py url https://www.sentinelone.com/labs/` returns embedded JSON with title, author and published_date (epoch ms) and /labs/<slug>/ hrefs, so no WebFetch is needed; newest post 2026-09-18, none in lookback."
  - source_id: google-tag
