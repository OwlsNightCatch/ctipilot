  extended_notes: 'Gate: PD-11(a) national-scale event with a multi-agency government response, and (b) an evolved, API-centred TTP mix that a Tier 2/3 team can hunt without a CVE. No source attributes the wave to one actor; do not carry an actor. The AI-agent reading is the observing vendor''s hypothesis only (CyberSecurity Cloud) and Macnica found no AI trace - label it as an assessment owned by CyberSecurity Cloud. Telemetry hooks stated by the sources: access logs of public apps and APIs for a skew in HTTP response codes (4xx, 5xx, 429 bursts) and response sizes that differ from the normal success size of an authentication API; many source addresses with a reused request identifier; use of internal or admin API endpoints by non-admin callers; creation of accounts nobody provisioned and re-enabling of disabled ones; new .war or .jsp files on application servers and repeated GET and POST to them; exposed environment or backup files. IPA''s order of work: logs of the last month, then three months, of externally exposed apps and of every external service in use, then account inventory. JPCERT/CC and Macnica publish source addresses and user-agent strings; this entry should carry none. Why it matters to a Swiss public-sector reader: cantonal and communal citizen portals, library and facility-booking systems, mobile apps with back-end APIs and BI tools sit in the same exposure class, and Macnica''s finding that unusual systems (library catalogue, train booking) were hit shows the targeting is indiscriminate. Related but separate: the South Korea bank intrusions attributed by CrowdStrike to an unnamed ARTEX user (separate item in this return); no source links the two. The Japan Digital Agency GSS breach already in the store is a separate VPN-flaw incident. Suggested priority: notable.'
