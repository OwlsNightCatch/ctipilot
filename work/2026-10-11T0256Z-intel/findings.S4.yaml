  summary: 'IDC Frontier, a SoftBank subsidiary, says IDCF Cloud suffered a ransomware attack from about 03:40 JST on 2026-10-07 in East Japan Region 1, affecting 495 contracted companies and local governments; the virtual servers in four zones (tesla, henry, pascal, joule) stopped and cannot be restarted. In its third report (2026-10-08) it says customer data in those four zones is expected to be difficult to retrieve or restore and that, in its present view, recovery is possible only from customers'' own backups; those customers are told to rebuild in a new environment. The remaining zones and regions show no confirmed unauthorised access, but customer-facing management consoles are suspended in every region while safety is verified, and IDC Frontier is operating customers'' virtual servers on request; the intrusion route is not public and an outside security firm is investigating. BleepingComputer reports, from customer screenshots of a message the attacker displayed, the actor''s claim that it took seven minutes to breach the region and encrypted 225 databases (3.6 PB), reached 239 hypervisors, sealed 16,000 VM disks and wiped 554,153 snapshots; that is the attacker''s claim, not IDC Frontier''s finding. Downstream effects reported by customers and compiled by Piyolog: municipal and prefectural websites down (Shiga prefecture''s three sites, a Kosai city library site), Kodaira and Yaizu cities warning that contact-form entries might have leaked, Nissui Logistics unable to ship or receive at 17 sites, and JR East and View Card stating that mailing-list data at an external mail-delivery service hosted there might have been viewed; several SaaS vendors rebuilt from backups held at other providers (Six Apart restored 31 servers from backups kept at another IaaS).'
