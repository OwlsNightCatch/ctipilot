  extended_notes: 'Gate: PD-11(a) global significance and a supplier-to-public-bodies incident (495 customers including local governments, a SoftBank-owned national provider) plus a transferable provider-side lesson. Window note: IDC Frontier''s reports are 2026-10-07 to 2026-10-09 and BleepingComputer is 2026-10-08; the item entered S4 through the 50-hour DataBreaches.net lookback (Asahi relay, 2026-10-09) and Piyolog''s running compilation. It is not in prior_coverage. Fact versus claim: ransomware, region, zones, 495 customers, stopped and non-restartable servers, data hard to restore, console shutdown and the ''only customer backups'' statement are IDC Frontier''s own; the 7-minute breach, 225 databases, 239 hypervisors, 16,000 VM disks and 554,153 snapshots are the attacker''s message as seen in customer screenshots (BleepingComputer). T1490 (inhibit system recovery) and T1485 (data destruction) would rest on that claim only, so only T1486 is mapped. No intrusion vector, actor name or ransom group is public as of 2026-10-09. Transferable angle for a Swiss reader (assessment from the mechanism, not a source statement): provider-held backups and snapshots shared a fault domain with production, so recovery depended on copies the customer held elsewhere; customers holding backups at other providers rebuilt within days (Six Apart moved 31 servers to another cloud within about two days; Greenwich restored from a 2026-08-30 backup) while the provider itself said only customer copies could restore; a provider disabling every region''s console to contain a management-plane compromise removes customers'' own ability to act. Post-incident check for customers of any hosting provider: inventory what runs there (websites, mail-delivery or newsletter services, forms) and what personal data those hold. Same-week Japan context, not merged and not read in depth: Piyolog also compiled a ransomware-suspected system outage at Osaka Public University (2026-10-07).'
