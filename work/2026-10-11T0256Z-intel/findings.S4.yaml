  extended_notes: 'What changes in the existing entry: its summary says the company and how access was obtained are not public; now the company is named by its own confirmation and a weak-credential cause is reported by the press (not by the authorities). It also says about ten days; Ritzau''s 21 days 17 hours should be added as a discrepancy, attributed. T1078 (valid accounts) is added by the claimed use of a leaked or weak password on a legitimate account; T1110 (brute force) is not mapped because the sources say a known password was used, not guessed at scale. Defender takeaways follow mechanically: delegated lookup accounts at small suppliers need MFA, a per-account lookup quota with an alert and a spend alarm at the register operator (the incident surfaced through an invoice, not an alarm, per the earlier entry); a register''s access terms should require supplier credential hygiene checks. The earlier entry''s own caveat applies: the investigation is early and details may change. Politiken''s body is paywalled; the claim is carried through three independent relays (TT/TV4, Ritzau/Copenhagen Post, DataBreaches.net) that all trace to one Politiken reporting origin plus a TV 2 confirmation from the company.'
