  summary: CrowdStrike Intelligence says, with moderate confidence and without attributing to a named adversary, that the actor behind data breaches at South Korean financial organisations from late September to early October 2026 is likely a Chinese speaker and financially motivated, judging from use of the Chinese-developed open-source agentic penetration-testing tool ARTEX and Chinese-language prompts. It found open directories on attacker infrastructure holding Claude Code session histories, ARTEX configuration files and Claude memory files, showing a two-server set-up in which an ARTEX instance used DeepSeek v4.1-flash as its main model with other models (GLM-5.3, Grok 4.6) supplementing Claude Code sessions, and the actor asked the assistant where Korean breach data is sold. Industry reporting cited by CrowdStrike says one bank's loan-progress inquiry service used by brokers and another bank's employee mobile work-support system were breached; the number of affected organisations is unconfirmed. South Korea's Financial Services Commission held an emergency meeting (BleepingComputer, 2026-10-05), confirmed a Shinhan Bank breach and told financial companies to inspect all externally accessible systems. The ARTEX developer has since closed the source; derivatives remain.
