  summary: FBI Director Patel announced on 2026-10-09 that agents arrested 'another suspected co-conspirator of the ShinyHunters group', saying the FBIjobs.gov incident occurred on a platform managed by a third-party vendor. The New York Times, per BleepingComputer, reported the suspect is a Canadian citizen arrested in Pennsylvania; KrebsOnSecurity and Politico identified him as Edward Dubrovsky, 54, a Canadian ransomware-negotiation executive (a former managing director of Cypfer, per Cypfer, now with CyberSteward) arrested on 2026-10-08 while attending a cyber-insurance conference. Court records indexed by CourtListener list conspiracy to threaten to impair confidentiality of information with intent to extort and Hobbs Act extortion charges; the complaint is sealed, the case moved to the Eastern District of Texas, and the FBI has not confirmed that he is the suspected ShinyHunters co-conspirator or what he is accused of doing. Krebs's sources add that the FBI is examining devices seized in the 2026-09-15 Dutch arrest and that charges against principals at other negotiation firms may follow. These are allegations only.
