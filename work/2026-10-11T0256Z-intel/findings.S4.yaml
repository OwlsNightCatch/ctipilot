candidate_sources:
- id: macnica-security-blog
  publisher: Macnica Security Research Center blog (Japan)
  url: https://security.macnica.co.jp/blog/2026/10/web-incidents2026.html
  category: research
  why: Primary Japanese tracker of web-system personal-data leaks (62/84/119 disclosures for 2024/2025/2026) and source of the 'priority IP addresses' that JPCERT/CC and CyberSecurity Cloud built on; extract reads the blog cleanly. Language ja.
- id: ipa-security-alert
  publisher: IPA Japan security alerts
  url: https://www.ipa.go.jp/security/security-alert/2026/alert20261009.html
  category: advisories
  why: Japanese national-authority alerts (Admiralty A for its jurisdiction); extract reads the page cleanly. JPCERT/CC is already in the list; IPA and the National Cyber Directorate are not.
coverage_gaps:
- source_id: ransomware-live
  reason: 'RECIPE UPDATE: `www.ransomware.live/api/countryvictims/CH` returns 404; the working host is api.ransomware.live. Verified commands: `python3 tools/fetch_source.py url --direct "https://api.ransomware.live/v2/countryvictims/CH"` (253 leak-site listings), `.../v2/countrycyberattacks/CH` (79 press-confirmed incidents with the source link per row), `.../v2/countrycyberattacks/{DE,AT,FR,IT,LI}` (LI works for cyberattacks, 404 for victims), `.../v2/searchvictims/<term>` (404 means no match).'
- source_id: backlog-row:ara-lyss.ch (not a source record)
  reason: 'RECIPE UPDATE for the Lyss backlog row: `extract https://ara-lyss.ch/` now returns the page through the reader transport (the earlier ''every transport 403'' note no longer holds); no incident notice on it.'
- source_id: cyberinsider
  reason: '`extract https://cyberinsider.com` reads the homepage list (titles and hrefs) via trafilatura-direct, though its date metadata is stale (2026-09-13); WebFetch on the homepage returns dated items. Nothing S4-relevant in the 50 h lookback.'
- source_id: zaufana-trzecia-strona
  reason: The Weekendowa Lektura roundup (odcinek 697, 2026-10-10) extracts with its link lists stripped, so it cannot be used for discovery; the English mirror is badcyber.com 'IT Security Weekend Catch Up'. The homepage lists post slugs; the dated hrefs sit at /post/<slug>/.
- source_id: bitdefender-threat-debrief
  reason: WebFetch lists the posts with dates (newest Threat Debrief 2026-10-06, newest post 2026-10-08, none an incident report); no in-window item.
- source_id: venarix
  reason: '`url https://venarix.com/blog` lists slugs, dates come from `extract` per post; newest dated post 2026-08-11, so cadence is roughly monthly; nothing in the lookback.'
- source_id: piyolog
  reason: 'RECIPE NOTE: `url <entry>` returns raw HTML whose body links are the numbered source list (出典) of the compilation - the cheapest way to reach JPCERT/CC, IPA, PPC and company notices; `extract` drops those links.'
- source_id: cyber.go.jp
  reason: 'https://www.cyber.go.jp/pdf/press/taiou.pdf (National Cyber Directorate alert of 2026-10-09) is an encrypted PDF: `pdf` reports it as not extractable; its content is known only through Piyolog. Not a failure of a slice record.'
- source_id: ictjournal-ch
  reason: '`feed https://www.ictjournal.ch/rss` and `/feed` return 404 (the registry''s /rss.xml was not retried this run); swisscybersecurity.net has no working feed path via `feed` (/rss 404) - the homepage `extract` lists dated titles.'
- source_id: publica
  reason: publica.ch/de/news is 404; the live notice is https://www.publica.ch/en/about-us/news/cyber-attack-publica-software-supplier-data-leak-confirmed and reads with `extract`.
- source_id: sec-disclosures-edgar
  reason: 'Quiet result, not a failure: `sec-edgar 8k 2026-09-27 2026-10-11 1.05` returns 0 hits (the last Item 1.05 filing in the store''s note is Astrana Health, 2026-09-23); Item 8.01 for 2026-10-09 to 2026-10-11 returns 48 generic filings, none obviously cyber from the filer names.'
