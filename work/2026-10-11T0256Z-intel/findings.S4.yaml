  verdict: 'HOLD, condition unmet. Read this run: ara-lyss.ch (now readable through the reader transport; homepage and menu show no incident notice), DeXpose and the Ransomware.live CH listing (tracker claim only; ARA Lyss is absent from Ransomware.live''s press-confirmed CH list of 79 incidents), plus two WebSearch passes: no victim statement and no Swiss press. Expires 2026-10-14.'
  sources_read:
  - https://ara-lyss.ch/
  - https://www.dexpose.io/safepay-ransomware-attack-on-ara-lyss-in-switzerland/
  - https://api.ransomware.live/v2/countryvictims/CH
  - https://api.ransomware.live/v2/countrycyberattacks/CH
- row: Payload on Netech / Neeser Technik AG (listed 2026-09-28)
  verdict: HOLD, condition unmet. netech.ch news page (latest post 2026-10-07, a staff outing) carries no incident notice and the site is up; Ransomware.live lists the claim in the leak-site list only, not in the press-confirmed CH list; no Swiss press found in two searches. Expires 2026-10-14.
  sources_read:
  - https://www.netech.ch/news.php
  - https://api.ransomware.live/v2/countryvictims/CH
- row: Beyond Gravity (detected 2026-08-12, BACS and Mandiant)
  verdict: 'HOLD, condition unmet. Re-read Swissinfo (2026-10-03) and Netzwoche (2026-10-06): still no vector, no actor (the company ''suspects a highly professional actor''), no data named; nothing newer found. Expires 2026-10-20.'
  sources_read:
  - https://www.swissinfo.ch/eng/space-research/space-company-beyond-gravity-was-the-target-of-a-cyberattack/92160616
  - https://www.netzwoche.ch/news/2026-10-06/beyond-gravity-wird-opfer-eines-cyberangriffs
followups:
- incident: PK Softech / Publica
  result: No delta after 2026-10-09. Publica's English notice, PK Softech's notice, Netzwoche's update (Bernese funds, 2026-10-09) and Inside IT's 'further funds are checking' (2026-10-09) are all already in the entry; two searches found nothing newer; no other federal entity does business with the supplier (Publica).
- incident: Ixa Systems (Vaud)
  result: No delta. Searches return only trackers and the Le Temps/cash.ch pieces already cited; no Vaud authority or customer statement found.
- incident: Manno (TI)
  result: No delta. manno.ch homepage (2026-10-07) shows no incident notice; trackers (SOCRadar, BreachSense) only repeat the SafePay listing; no data publication reported.
- incident: Belnet
  result: No delta. Belnet's notice is still the 2026-10-02 11:00 update (Fortinet zero-day, FG-IR-26-175 named; mail copied 2026-07-22 to 2026-09-25).
- incident: FTAPI
  result: No delta. heise (2026-09-29) remains the freshest; Ransomware.live search shows only the Gentlemen listing and the heise press link; no leak publication or new FTAPI statement found.
