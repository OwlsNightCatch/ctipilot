  summary: 'JPCERT/CC says (2026-10-08, updated 2026-10-09) that around September 2026 Japanese organisations have been reporting a run of unauthorised-access incidents that leak large volumes of personal data, distinct from the sporadic ransomware cases, and that it holds only ''limited and fragmentary'' technical information. It lists four observed attack cases, explicitly not one common method: (A) scanning each target for known vulnerabilities and for management lapses such as exposed configuration and backup files; (B) abuse of application management APIs - decompiling a public smartphone app to extract API endpoints and keys, calling internal APIs the UI never exposes to change user privileges or create accounts, probing responses with missing or malformed authentication tokens, blind NoSQL injection to identify accounts, and API keys stolen from other compromised systems; (C) the Metabase SQL injection CVE-2026-72898, already in this store as exploited; (D, added 2026-10-09) a .war file dropped on an application server reachable from the public web server, carrying a JSP web shell that executes a query parameter as a shell command. IPA (2026-10-09) says the incidents are not attributed to one product or service vulnerability and that the pattern points to compromise of externally exposed applications and services or of accounts as the starting point. Macnica counts publicly disclosed web-system personal-data leaks by Japanese corporations at 62 in 2024, 84 in 2025 and 119 in 2026 to 6 October, 81 of them since July, hitting libraries'' catalogue search, a sightseeing-train seat reservation, a university seminar-house booking and a performance-ticket refund system as well as shops; in 65 of those 81 the victim''s disclosure gives no cause. CyberSecurity Cloud''s own traffic shows one apparent actor using 326 source addresses in about 40 minutes for over 1,200 requests against one site: SQL injection to bypass login, then login with a pre-created account, further SQL injection after login, then probing for other users'' loyalty points, then withdrawal without returning. It speculates this adaptive behaviour could be an AI agent, but states this is inference from behaviour with no direct trace of AI use; Macnica likewise reports no AI trace. Government response: the Personal Information Protection Commission, National Police Agency, National Cyber Directorate, MIC, METI, IPA and the Financial Services Agency each issued alerts between 2026-10-07 and 2026-10-09.'
  region_nexus: Japan (apac); no Swiss entity named. Transferable to any public body running citizen-facing web systems, mobile-app back-ends, BI tools or Java application servers.
