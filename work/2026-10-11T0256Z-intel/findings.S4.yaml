  summary: Ritzau, via The Copenhagen Post on 2026-10-10, reports Politiken's finding that at least three user accounts at the Funen-based IT company Pays, one of them the administrator account, used the password '123456' when the CPR register was accessed. Pays ApS of Odense, which the Central Business Register lists with two employees as of July 2026, confirmed to TV 2 that it is the company whose lawful CPR search access was abused. Ritzau states the hacker had access from 10 September for a total of 21 days and 17 hours, whereas the minister and the 2026-10-06 press briefing described about ten days of lookups; both figures can be true if the account access was longer than the lookup run, but no source reconciles them. An anonymous person who gave Politiken a file of about 8.7 million CPR numbers says access began with a leaked password of a former employee of a small Danish company, then two purpose-written programs fetched data from the register and stored it externally, and that nothing will be sold or published; Politiken's experts judge the person likely involved. This is the claimant's account, relayed by TT (2026-10-08) and Ritzau, and the authorities have not confirmed it; the ministry describes the access as a small company's lawful register access abused, with well over 14 million lookup attempts of which 8.8 million returned a record (TNW citing the TV 2 press-briefing report, 2026-10-06).
