    surface: "section 2026-10-11T03:39:00Z"
    kind: cited
    text: "Socket says the hook and payload file names match the structure documented in the August wave ("
    urls: ["https://www.socket.dev/blog/tensorlake-compromise"]
  - claim_id: 88e0bef7bb
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "section 2026-10-11T03:39:00Z"
    kind: cited
    text: "Endor Labs reports that the release shipped through the project's normal GitHub Actions pipeline with valid build provenance after the attacker modified the main branch first, most likely through a compromised maintainer account, and notes that provenance confirms where a build came from, not that the source was clean ("
    urls: ["https://www.endorlabs.com/learn/tensorlake-npm-package-compromised-by-shai-hulud-in-latest-software-supply-chain-attack"]
  - claim_id: 7edf5fb3cb
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "section 2026-10-11T03:39:00Z"
    kind: cited
    text: "Socket reports that the payload harvests npm and GitHub tokens, AWS credentials (instance metadata, ECS, Secrets Manager and Parameter Store), a local HashiCorp Vault, Kubernetes service-account tokens and kubeconfig files, SSH keys, environment files and AI-tool configuration, resolves its endpoint from an Ethereum contract through about 30 public RPC endpoints with a GitHub fallback, and republishes itself with Sigstore provenance to packages the victim can publish ("
    urls: ["https://www.socket.dev/blog/tensorlake-compromise"]
  - claim_id: 2339727c22
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "section 2026-10-11T03:39:00Z"
    kind: cited
    text: "A PowerShell monitor persisted through a scheduled task that runs at logon polls the GitHub API with the stolen token and, when the token is revoked, runs an attacker-supplied handler; Socket says the revoke-wipe string in the code appeared in earlier waves ("
    urls: ["https://www.socket.dev/blog/tensorlake-compromise"]
  - claim_id: 357b2df36f
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "section 2026-10-11T03:39:00Z"
    kind: cited
    text: "Socket and OX Security both tell responders to isolate the host and remove the gh-token-monitor persistence first (a systemd user unit on Linux, a LaunchAgent on macOS, a scheduled task on Windows) and only then revoke and rotate, because revoking while the monitor runs wipes the user's home directory; removing the npm dependency alone does not remove that persistence ("
    urls: ["https://www.socket.dev/blog/tensorlake-compromise", "https://www.ox.security/blog/shai-hulud-here-we-go-again-tensorlake-npm-package-hit-with-malware/"]
  - claim_id: 50594a2946
