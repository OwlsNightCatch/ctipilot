    surface: "section 2026-10-11T03:39:00Z"
    kind: cited
    text: "Attribution is split: Socket frames the release as part of this wave ("
    urls: ["https://www.socket.dev/blog/tensorlake-compromise"]
  - claim_id: bf493cd732
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "section 2026-10-11T03:39:00Z"
    kind: cited
    text: "), while OX Security reports new public keys that may indicate an independent actor or a new group using the Shai-Hulud name ("
    urls: ["https://www.ox.security/blog/shai-hulud-here-we-go-again-tensorlake-npm-package-hit-with-malware/"]
  - claim_id: 79093d2d66
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
