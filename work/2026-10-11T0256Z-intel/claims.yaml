claims:
  - claim_id: 0df2331dbe
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "summary"
    kind: frontmatter
    text: "Elastic Security Labs identified CHAINDROP on 2026-08-04, a new wave of the Shai-Hulud npm worm that began with the compromise of the keyv maintainer and has backdoored over 400 npm packages whose combined reach Elastic puts at more than 1.3 billion monthly downloads, keyv alone at over 600 million. Execution comes from a package.json preinstall hook that downloads the Bun runtime to run an obfuscated 711 KB payload, which harvests over 300 credential patterns — AI-assistant tokens, AWS/GCP/Azure/Alibaba credentials, GitHub tokens, Vault tokens, SSH keys and Kubernetes service-account tokens — and self-propagates only when it finds an npm token that both carries package-write permission and can publish without two-factor authentication. Rather than hardcoding a command-and-control domain, CHAINDROP queries an Ethereum smart contract at runtime to resolve where to send the stolen material, so the operator rotates infrastructure without shipping a new payload. On 2026-10-08 a release of the tensorlake npm SDK carried the same payload family with valid build provenance, and Socket and OX Security describe a dead-man switch that wipes the owner's home directory if the stolen GitHub token is revoked before its persistence is removed."
  - claim_id: 9593a6b924
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "actions[0]"
    kind: frontmatter
    text: "Audit every npm publish token your organisation and its maintainers hold and revoke any that can publish without two-factor authentication — that exact token property, not package popularity, is what decides whether the worm spreads from a compromised developer to your packages."
  - claim_id: 418c0d2a3b
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "actions[1]"
    kind: frontmatter
    text: "On any developer workstation or build agent that installed a package from the keyv family since 2026-08-04, or tensorlake@0.5.144 since 2026-10-08, treat the AI-assistant, cloud, GitHub, Vault, SSH and Kubernetes credentials present on that host as disclosed and rotate them; the collector sweeps over 300 credential patterns in one pass, so partial rotation leaves the operator a working set. Isolate the host before revoking its GitHub token, because OX Security reports a switch that wipes the machine when the token is revoked; on a host that ran tensorlake@0.5.144, Socket and OX Security also name the gh-token-monitor persistence (a systemd user unit on Linux, a LaunchAgent on macOS, a scheduled task on Windows), which has to be removed before the token is revoked."
  - claim_id: bbe1dd3c36
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "actions[2]"
    kind: frontmatter
    text: "Stop treating a valid npm provenance attestation as evidence a package is clean; where release pipelines gate on provenance, change the check to pin on the workflow identity inside the Fulcio certificate and the Rekor log index, which is what Unit 42 says still discriminates."
  - claim_id: 699a3e4fdb
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: cited
    text: "Elastic Security Labs identified a new Shai-Hulud campaign on 2026-08-04 that began by trojanising the monorepo of `keyv`, a widely used key-value storage library, and embedding a self-propagating worm it names CHAINDROP ("
    urls: ["https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain"]
  - claim_id: 07b3a4ea4f
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: cited
    text: "Elastic reports over 400 unique npm packages compromised at the time of writing, and quantifies the blast radius through download volume: keyv alone received over 600 million downloads in the preceding month, with flat-cache near 580 million, cacheable-request over 137 million, cacheable over 30 million and cache-manager over 16 million ("
    urls: ["https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain"]
  - claim_id: ceb148a762
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: cited
    text: "OX Security published its own first-hand analysis two days earlier and describes a massive Shai-Hulud campaign against npm on its own larger package and download counts ("
    urls: ["https://www.ox.security/blog/a-new-infostealer-worm-hits-npm-affecting-keyv-and-cacheable/"]
  - claim_id: a5740f68fc
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: cited
    text: "Elastic frames the wave explicitly as the return of Shai-Hulud rather than a new family, and points to the Dune-derived naming the payload reuses as the similarity to previous Shai-Hulud campaigns ("
    urls: ["https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain"]
  - claim_id: 063cddd912
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: cited
    text: "The chain starts at a `preinstall` hook in `package.json`, abusing a legitimate npm feature that runs arbitrary commands before a package is installed and therefore needs no interaction from the victim beyond the install itself ("
    urls: ["https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain"]
  - claim_id: 1fbd94bf77
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: cited
    text: "Every subpackage in the keyv repository was backdoored with a dropper that checks whether the Bun JavaScript runtime is present and, if not, detects the host platform and architecture and downloads Bun directly from its official release page before using it to execute the payload; the temporary Bun directory is deleted afterwards ("
    urls: ["https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain"]
  - claim_id: e29edf8a65
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: cited
    text: "The payload is cross-platform across Linux, macOS and Windows, and is heavily obfuscated at 711 kilobytes using control-flow flattening ("
    urls: ["https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain"]
  - claim_id: 409bc93359
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: cited
    text: "It appears under two filenames — one in packages compromised directly from the keyv monorepo, another in packages trojanised during worm propagation — which share the same hash, so the filename indicates which generation of the infection a defender is looking at ("
    urls: ["https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain"]
  - claim_id: bde652b869
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: cited
    text: "In Visual Studio Code a `folderOpen` task under `tasks.json` runs the dropper when an infected repository is merely opened, and where the stolen credential set includes a GitHub App token the worm commits malicious hooks to up to 50 branches per accessible repository, injecting both a `.claude/settings.json` and a `.vscode/tasks.json` into each — so a developer can be infected by opening the repository ("
    urls: ["https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain"]
  - claim_id: 78cb79cdb5
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: cited
    text: "A collector component scans over 300 unique patterns across credential stores on a developer machine, with notable targeting of AI-tooling credentials for Anthropic, Claude, Codex, Cursor, OpenAI and Gemini, alongside AWS, GCP, Azure and Alibaba Cloud credentials, GitHub personal-access tokens, JWTs and session tokens, HashiCorp Vault tokens, SSH private keys, Kubernetes service-account tokens and npm tokens ("
    urls: ["https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain"]
  - claim_id: dc61dfa32f
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: cited
    text: "Harvested material is gzip-compressed, encrypted under a randomly generated AES-256-GCM key, and that key is in turn RSA-encrypted to the attacker's hardcoded public key ("
    urls: ["https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain"]
  - claim_id: 02a425867d
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: cited
    text: "For delivery, CHAINDROP does not hardcode a command-and-control domain: it queries an Ethereum smart contract at runtime to retrieve the current exfiltration endpoint, using multiple RPC providers as fallbacks, so the operator can rotate infrastructure by updating the contract rather than by shipping a new payload ("
    urls: ["https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain"]
  - claim_id: 3d675a4740
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: cited
    text: "If that path and its successor fail, it falls back to exfiltrating through a public GitHub repository created under the victim's own account with a fixed Shai-Hulud description string ("
    urls: ["https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain"]
  - claim_id: 1e767f8fc3
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: cited
    text: "OX Security states the malware carries a dead man's switch that deletes the current machine if the stolen GitHub token is revoked ("
    urls: ["https://www.ox.security/blog/a-new-infostealer-worm-hits-npm-affecting-keyv-and-cacheable/"]
  - claim_id: 4eded06f75
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: cited
    text: "Elastic's own guidance is to revoke all GitHub tokens for impacted machines and does not mention any such trigger ("
    urls: ["https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain"]
  - claim_id: a94f90500f
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: cited
    text: "Socket's later analysis of a release that it matches to this wave's file structure describes the mechanism in detail, and tells responders to remove the token monitor before revoking anything (see the update of 2026-10-11 below) ("
    urls: ["https://www.socket.dev/blog/tensorlake-compromise"]
  - claim_id: 2312bb3e34
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: cited
    text: "The worm activates only when the credential sweep turns up an npm token meeting two conditions together: package-write permission, and the ability to publish without two-factor authentication ("
    urls: ["https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain"]
  - claim_id: d6d16cb0b8
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: cited
    text: "Given a qualifying token it enumerates every package the victim can publish to, downloads each latest tarball from the registry, and republishes it trojanised ("
    urls: ["https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain"]
  - claim_id: 08e4f825c8
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: cited
    text: "Elastic ships detection rules for the trojanised-install and pre/post-install script-execution patterns ("
    urls: ["https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain"]
  - claim_id: f5627dc298
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: uncited
    text: "That is the operationally important departure: an organisation that responds to a supply-chain wave purely by pinning or freezing dependency installs has not closed the path that fires when an engineer clones and opens the repository, and the AI-assistant configuration file is a trust surface most repository review does not read."
  - claim_id: 11955a8f5f
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: uncited
    text: "Sequence the response around it: isolating and imaging a suspected host and removing any token-monitor persistence before revoking its GitHub token loses nothing if the switch does not fire, while revoking first loses the host and its evidence if it does."
  - claim_id: 4240cc4c15
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: uncited
    text: "That gate is the single most useful fact in the report for a defender, because it converts an unbounded ecosystem-wide risk into a property you can audit on your own accounts."
  - claim_id: acc4293be4
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** hunt on the execution shape rather than on package names, because the package list is a moving target and the payload hash is stable across two filenames."
  - claim_id: c002df625d
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: derived
    text: "In process-execution telemetry with parent lineage, the signal is a package-manager install spawning a script interpreter, and specifically a newly downloaded runtime binary being fetched and executed from a temporary directory during an install and then deleted."
  - claim_id: 5b71c22186
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: derived
    text: "In file-creation telemetry, look for `.vscode/tasks.json` and `.claude/settings.json` appearing or changing in repositories that no engineer edited, across many branches — the 50-branch injection is noisy in commit history in a way the install-time compromise is not."
  - claim_id: 3a79a18e24
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: derived
    text: "In egress telemetry, connections from build agents and developer endpoints to Ethereum RPC providers are the anomaly worth surfacing; blockchain RPC is not normal build traffic in most enterprise estates, and because it is the resolution step it happens before any exfiltration does."
  - claim_id: 00afbe5057
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: derived
    text: "**Triage:** developer and CI hosts legitimately run script interpreters from package-manager parents on every build, and legitimately download toolchains, so neither alone discriminates."
  - claim_id: 1c0f176526
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: derived
    text: "The separating features are that the runtime is fetched mid-install rather than during provisioning and its directory is removed immediately afterwards; that the process reads credential stores belonging to unrelated tools — cloud CLIs, SSH, Kubernetes, AI assistants — in one burst, which no ordinary build step does; and that outbound blockchain RPC follows the credential reads in the same process tree."
  - claim_id: 8f3070c8aa
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: derived
    text: "Any one of these is weak on its own; the sequence is the signal."
  - claim_id: 494ebc37d0
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "section 2026-10-11T03:39:00Z"
    kind: cited
    text: "A further package carrying this payload family was published on 2026-10-08: tensorlake@0.5.144, the npm SDK of an AI-agent sandbox platform, went out at 01:12 UTC with a preinstall hook that runs an obfuscated loader, which in turn launches a large payload under Bun; Socket flagged it about 11 minutes later, the release has since been removed and 0.5.143 is clean ("
    urls: ["https://www.socket.dev/blog/tensorlake-compromise", "https://www.endorlabs.com/learn/tensorlake-npm-package-compromised-by-shai-hulud-in-latest-software-supply-chain-attack"]
  - claim_id: 95ac094767
