    entry: 2026-10-11/cctld-registry-hijacks-gh-sl-as-certificates-for-google
    surface: "headline"
    kind: frontmatter
    text: "Registry-level DNS hijacks of .gh, .sl and .as produced valid HTTPS certificates for Google names"
  - claim_id: 77ddae6a8f
    entry: 2026-10-11/cctld-registry-hijacks-gh-sl-as-certificates-for-google
    surface: "summary"
    kind: frontmatter
    text: "Google's Chrome team reported on 2026-10-06 that attackers compromised the .gh, .sl and .as country-code registries, changed authoritative DNS records and obtained unauthorized HTTPS certificates for Google domains and for domains of other organizations; Chrome blocked them and Google had the issuing authorities revoke the Google certificates. Google names no attacker or entry vector and says it cannot guarantee it found every affected domain; The Hacker News found 12 certificates for Google and YouTube names in public logs, 11 issued by Let's Encrypt and one by ZeroSSL, first logged between 2026-09-22 and 2026-09-27."
  - claim_id: 732d8cd567
    entry: 2026-10-11/cctld-registry-hijacks-gh-sl-as-certificates-for-google
    surface: "body"
    kind: cited
    text: "Google's Chrome Secure Web and Networking Team says attackers compromised the third-party .gh (Ghana), .sl (Sierra Leone) and .as (American Samoa) country-code top-level domains, modified authoritative DNS records and obtained unauthorized HTTPS certificates covering several Google domains and domains of other organizations ("
    urls: ["https://blog.google/security/chromes-response-to-recent-cctld-registry-hijacks/"]
  - claim_id: 6551269573
    entry: 2026-10-11/cctld-registry-hijacks-gh-sl-as-certificates-for-google
    surface: "body"
    kind: cited
    text: "A certificate authority issues a domain-validated certificate once the applicant shows control of the domain, for example by adding a record to its DNS, so control of the registry's DNS passes that check; Google has no reason to believe the issuing authorities did anything wrong ("
    urls: ["https://thehackernews.com/2026/10/attackers-hijack-gh-sl-and-as.html", "https://blog.google/security/chromes-response-to-recent-cctld-registry-hijacks/"]
  - claim_id: 2f69129e60
    entry: 2026-10-11/cctld-registry-hijacks-gh-sl-as-certificates-for-google
    surface: "body"
    kind: cited
    text: "Chrome blocked the Google certificates through its CRLSets mechanism and Google had the authorities revoke them; Certificate Transparency data then surfaced further organizations, among them leading global brands, whose certificates Chrome also blocked ("
    urls: ["https://blog.google/security/chromes-response-to-recent-cctld-registry-hijacks/"]
  - claim_id: d33935bd96
    entry: 2026-10-11/cctld-registry-hijacks-gh-sl-as-certificates-for-google
    surface: "body"
    kind: cited
    text: "The Hacker News' own review of public logs found 12 certificates for seven Google and YouTube names, 11 issued by Let's Encrypt and one by ZeroSSL, first logged on 2026-09-22 (.gh), 2026-09-25 (.sl) and 2026-09-27 (.as) and revoked between 2026-09-26 and 2026-10-01 ("
    urls: ["https://thehackernews.com/2026/10/attackers-hijack-gh-sl-and-as.html"]
  - claim_id: b7b94b512b
    entry: 2026-10-11/cctld-registry-hijacks-gh-sl-as-certificates-for-google
    surface: "body"
    kind: cited
    text: "), and a Let's Encrypt staff member confirmed that certificates for Google and YouTube were issued and revoked ("
    urls: ["https://community.letsencrypt.org/t/chromes-response-to-recent-cctld-registry-hijacks/251941/2"]
  - claim_id: 11e7f1ca0f
    entry: 2026-10-11/cctld-registry-hijacks-gh-sl-as-certificates-for-google
    surface: "body"
    kind: cited
    text: "Google's post does not name the attackers, say how the registries were compromised, or say whether any certificate was used to pose as a Google site or read users' data ("
    urls: ["https://thehackernews.com/2026/10/attackers-hijack-gh-sl-and-as.html"]
  - claim_id: d0b0562b2f
    entry: 2026-10-11/cctld-registry-hijacks-gh-sl-as-certificates-for-google
    surface: "body"
    kind: cited
    text: "), and it names only these three registries ("
    urls: ["https://blog.google/security/chromes-response-to-recent-cctld-registry-hijacks/"]
  - claim_id: 35202993ca
    entry: 2026-10-11/cctld-registry-hijacks-gh-sl-as-certificates-for-google
    surface: "body"
    kind: cited
    text: "Google tells owners of such names to review recent Certificate Transparency entries for unexpected issuance ("
    urls: ["https://blog.google/security/chromes-response-to-recent-cctld-registry-hijacks/"]
  - claim_id: f0175f83b4
    entry: 2026-10-11/cctld-registry-hijacks-gh-sl-as-certificates-for-google
    surface: "body"
    kind: cited
    text: "**Detection:** Certificate Transparency monitoring of every owned name, parked and foreign registrations included, is the near-real-time signal, because every certificate Chrome trusts by default must be disclosed in public logs ("
    urls: ["https://blog.google/security/chromes-response-to-recent-cctld-registry-hijacks/"]
  - claim_id: 0607923cc0
    entry: 2026-10-11/cctld-registry-hijacks-gh-sl-as-certificates-for-google
    surface: "body"
    kind: cited
    text: "After DNS control returns, restrictive CAA records bound to specific ACME accounts and validation methods stop an attacker from reusing a cached domain-control check to mint further certificates; CAA cannot prevent issuance while the hijack is live ("
    urls: ["https://blog.google/security/chromes-response-to-recent-cctld-registry-hijacks/"]
  - claim_id: fbd9d11491
    entry: 2026-10-11/cctld-registry-hijacks-gh-sl-as-certificates-for-google
    surface: "body"
    kind: cited
    text: "In the logs The Hacker News reviewed, every other certificate for google.com.gh, google.sl and google.as came from Google's own authority, while the 12 unauthorized ones came from Let's Encrypt and ZeroSSL, so an issuing authority or account outside your inventory, especially several certificates for one registry's names logged within hours, is the discriminator ("
    urls: ["https://thehackernews.com/2026/10/attackers-hijack-gh-sl-and-as.html"]
  - claim_id: 75c31ef239
    entry: 2026-10-11/cctld-registry-hijacks-gh-sl-as-certificates-for-google
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** put every domain you hold, including defensive and foreign registrations, under Certificate Transparency monitoring and bind issuance with CAA to your own ACME account and validation methods; Google says browser-side blocking should not be relied on to protect users and does not reliably protect clients other than Chrome ("
    urls: ["https://blog.google/security/chromes-response-to-recent-cctld-registry-hijacks/"]
  - claim_id: e26ffff239
    entry: 2026-10-11/cctld-registry-hijacks-gh-sl-as-certificates-for-google
    surface: "body"
    kind: derived
    text: "**Exposure:** any organization holding a name under .gh, .sl or .as, including parked or regional variants of a brand name, and in principle any name whose registry or DNS operator an attacker can reach, because domain-validated issuance trusts whoever controls the DNS."
  - claim_id: 45efc42bef
    entry: 2026-10-11/cctld-registry-hijacks-gh-sl-as-certificates-for-google
    surface: "body"
    kind: derived
    text: "Because the hijacks worked by changing authoritative DNS records, unexpected changes to a name's delegation or records are the second signal."
  - claim_id: 4081fd03d8
    entry: 2026-10-11/cctld-registry-hijacks-gh-sl-as-certificates-for-google
    surface: "body"
    kind: derived
    text: "**Triage:** a valid, correctly chained certificate is no longer evidence that a site is genuine once registry DNS can be changed."
