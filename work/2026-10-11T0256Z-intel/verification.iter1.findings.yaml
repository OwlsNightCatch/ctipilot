  section: 2026-10-11/poellm-botnet-github-poem-c2-exposed-ai-and-gitea-servers
  item: "file-name and port indicators"
  url_or_quote: "'the payload is an ELF file entitled libgcrypt ... beacons to ports 3778, 5001, 5002 or 9999' and Detection 'process telemetry for a process running an ELF named libgcrypt'"
  summary: "Style rule 12 bans file-name indicators; 'libgcrypt' (a legitimate library name, so also a noisy hunt key) and the beacon port list read as indicators. Describe the behaviour (unfamiliar ELF fetched from a C2 port, outbound scanning of 3000/4000) instead."
