        attribution: "SecurityWeek"
        source_url: "https://www.securityweek.com/supermarket-refrigeration-attack-widens-to-copeland-dixell-controllers/"
    extended_notes: |
      Single-source caveats: the defrost-duration/alarm-delay detail is Le Monde alone (SecurityWeek relays it); the other-country claim is Sekoia via Reuters via SecurityWeek and unverified. Detection angle if folded in: controller configuration/audit log entries changing the defrost duration, defrost interval and alarm delay parameters (not only the setpoint) outside a maintenance window, and a defrost-active state lasting hours. Not an alert-worthy delta on its own: the covered entry already holds the actionable CERT-FR guidance (revision 3 of 2026-10-16 is already in its 2026-10-18 update).
