    summary: |
      NO in-window source: every source below is dated 2026-10-12 to 2026-10-15 (outside the 26 h window and the 72 h developing window), so this is returned borderline for the main agent to fold in as an `improvement` (or drop). What the covered entry (2026-10-13/danfoss-...) lacks, all cited to named makers:
      Le Monde (2026-10-12) reports that, besides raising the defrost temperature of freezers and cold rooms to 50 degrees C, the attackers extended the defrost operation from one hour to eight hours "so that alarms trigger late", which delayed interventions and amplified the damage (an Intermarché store recorded 80 degrees C and melted equipment). The entry carries only the 50-degree setpoint (BFMTV); the duration parameter is the detection-relevant behavioural change (defrost duration and alarm delay, on top of setpoint). SecurityWeek (2026-10-15) relays the same Le Monde detail and adds: the Paris prosecutor's office said the attack caused fires as well as food losses; Finance Minister Roland Lescure told lawmakers about 700 of France's roughly 10,000 supermarkets were affected (earlier reports 300-350); investigators are reportedly puzzled by the absence of a claim of responsibility or a ransom demand (Reuters, via SecurityWeek; Reuters page not readable, captcha); Sekoia's Felix Aime told Reuters that stores in Spain, Portugal, Poland, Germany and Belgium were also affected without giving details (single-source relay, unverified). Copeland, which first declined to confirm CERT-FR's finding, has since acknowledged a vulnerability and, per Cybersecurity Dive, a spokesperson confirmed it was found in discontinued end-of-life controllers (two independent outlets quote Copeland). Cybersecurity Dive, citing the Shadowserver Foundation, counts about 350 exposed Danfoss AK-SM 800A units on Wednesday 2026-10-14 (down from more than 550 earlier in the week) and 1,173 Copeland XWEB Pro and Evo units still internet-reachable on Thursday 2026-10-15. Still unknown (nothing new): the entry vector, the actor, and whether any Swiss estate runs an affected controller; NCSC.ch's hub advisory (post 13054) is unedited since 2026-10-13 and no BACS follow-up exists.
    region_nexus: "France primary; neighbouring-country stores reportedly affected (Sekoia claim, unverified); no Swiss victim reported (Migros: no indication, per Blick in the entry)"
