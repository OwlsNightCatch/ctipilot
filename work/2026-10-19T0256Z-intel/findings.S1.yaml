    attribution: JVN#88474777 (JPCERT/CC, English)
    source_url: https://jvn.jp/en/jp/JVN88474777/index.html
  - quote: An attacker may be able to execute arbitrary OS commands with root or SYSTEM privileges on the system running the affected product.
