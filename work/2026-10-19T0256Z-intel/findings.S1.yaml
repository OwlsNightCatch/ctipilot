  discovery_trace: >-
    first seen at: news feed sweep bleepingcomputer.com feed (fetch_source.py feed https://www.bleepingcomputer.com/feed/), item of 2026-10-18 10:23, URL https://www.bleepingcomputer.com/news/security/hackers-exploit-siteguard-waf-flaw-to-run-commands-as-system-root/ -> primary: vendor alert URL https://www.eg-secure.co.jp/siteguard/news/alert-202610-1 -> JVN URL https://jvn.jp/en/jp/JVN88474777/index.html -> JPCERT alert URL https://www.jpcert.or.jp/at/2026/at260032.html; EUVD record EUVD-2026-100814 read via euvdservices.enisa.europa.eu API (not cited)
  summary: >-
    EG Secure Solutions disclosed on 2026-10-14 an OS command injection (CWE-78) in the statistics function of SiteGuard Server Edition, a host-based WAF that runs inside Apache httpd, Nginx and IIS, and says abuse has already been confirmed; JPCERT/CC's JVN#88474777 and alert JPCERT-AT-2026-0032 repeat it and note the product is widely used in Japan. Exploitation executes arbitrary OS commands as root or SYSTEM on the host; the statistics function is enabled by default. Affected: Apache/Nginx/IIS editions from Ver2.20 before Ver8.00 Update 5 (IIS Ver3.10 to Ver4.00 Update 4 not affected) and the FreeBSD Apache/Nginx editions before Ver7.00 Update 6; fixes are those updates, plus a file-replacement patch that also covers end-of-life versions, and disabling the statistics function avoids the flaw (JPCERT/CC). The vendor warns that patching can erase attack traces and tells administrators to download the diagnostic information from the web management screen first; customers with support contracts
    were told individually on 2026-09-29, so the exploitation window predates the public notice (first-exploitation date not published). Scoring is lower than the 'critical' label: vendor and JVN give CVSS 4.0 8.5 / 3.0 7.8 with AV:L/PR:L, while the vendor alert is headed 'urgent/critical'; BleepingComputer (2026-10-18) gave the first widely read English report and says attacker, victims, scale and methods are unknown. BleepingComputer's '500,000 sites' figure is the separate SiteGuard WordPress plugin's install count, not this product. Not in CISA KEV (catalogue 2026.10.16). Primary sources are four days old; the in-window item is the English-language pickup.
  region_nexus: 'Japan-centric (JPCERT/CC: widely used domestically); no Swiss deployment or nexus identified'
