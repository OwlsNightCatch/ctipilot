- title: >-
    Broadcom 802.11/WPS EAP reassembly overflow in router SDK, no CVE assigned: unauthenticated over-the-air RCE on ISP gateways, "forever day" on eCos platforms, disclosed at Hexacon 2026-10-16
  sources:
  - url: https://quentinkaiser.be/security/2026/10/16/one-parser-two-bugs/
    publisher: Quentin Kaiser (researcher write-up, Hexacon talk)
    date: '2026-10-16'
    role: primary
