coverage_gaps:
- source_id: ibm-support-security-bulletins
  reason: >-
    No listing transport: https://www.ibm.com/blogs/psirt/feed/ returns the Security Bulletins HTML page (not RSS) and WebSearch finds only August bulletins; nothing in horizon. IBM changes only surfaced via NCSC-NL relays (NCSC-2026-0431 DataPower, -0433 Guardium, 2026-10-16, probability medium). Recipe gap: a discoverable IBM bulletin listing.
- source_id: connectwise-trust-center
  reason: >-
    Recipe: WebFetch 403, url --direct 403; `extract https://www.connectwise.com/company/trust/advisories` is served through the metered reader and returns the full stacked page (116 KB) with the dated updates. Keep `extract`; WebFetch no longer works.
- source_id: sonicwall-psirt
  reason: >-
    Recipe confirmed: url --direct returns a 729-byte JS shell; `jina https://psirt.global.sonicwall.com/vuln-list` returns all 218 rows (severity, id, title, CVEs, published, updated) parseable by regex; rows are ordered by severity, so sort by date.
- source_id: oracle-cpu
  reason: >-
    Recipe: WebFetch 403; `extract https://www.oracle.com/security-alerts/` and `extract https://www.oracle.com/security-alerts/cpuoct2026.html` read direct with trafilatura (the pre-release page exists from the Thursday before the CPU). Do not probe `cpuoct2026verbose.html` (404, burns reader credit).
- source_id: fortinet-psirt
  reason: >-
    Recipe: `url --direct https://fortiguard.fortinet.com/psirt/FG-IR-26-NNN` fails (connection errors) when ten are fetched in parallel (5 of 10 failed); serial with a 4 s pause worked. Fields "Known Exploited", "Attack Type", "CVSSv3 Score" parse from the stripped HTML.
- source_id: ivanti-psirt
  reason: >-
    Rotation-priority record named in the spawn message as ivanti-advisory-hub (that id is not in sources.json and not in the slice). RSS https://www.ivanti.com/blog/topics/security-advisory/rss and `extract` of the October post work; the post lists no CVEs (links dropped) and the advisory hub stays JS-only, so Neurons Patch for Intune and Xtraction tables were not read.
- source_id: juniper support portal
  reason: >-
    supportportal.juniper.net bulletins are a JS app (direct and extract return the community shell, jina returns "Loading ... CSS Error"). Working route: `python3 tools/fetch_source.py ncsc-nl csaf NCSC-2026-0430` (per-CVE descriptions and scores; product tree unversioned) plus CCCS AV26-1043 for affected trains. Juniper is absent from sources.json and from the whole entry store; a record for it would help.
- source_id: cisa-advisories
  reason: >-
    Recipe note: `feed https://www.cisa.gov/cybersecurity-advisories/all.xml` falls through to the metered reader (method jina) from the container; the listing https://www.cisa.gov/news-events/cybersecurity-advisories?f%5B0%5D=advisory_type%3A93 reads with WebFetch (10 items, titles, dates and hrefs).
- source_id: chrome releases
  reason: >-
    https://chromereleases.googleblog.com/feeds/posts/default answers 302 and fails as a feed; `extract https://chromereleases.googleblog.com/` returns the current posts with the security-fix lists.
- source_id: mikrotik-routeros-changelog
  reason: >-
    Recipe: NEWESTa7.stable works (7.24.5, 2026-09-29); the NEWEST7.* channels return stale 2023 values (7.12.1); the 7.24 CHANGELOG at https://upgrade.mikrotik.com/routeros/7.24/CHANGELOG reads direct.
- source_id: znuny-advisories
  reason: >-
    Recovered: `url --direct https://www.znuny.org/en/advisories` returned 19 KB (the 2026-10-18 HTTP 503 has cleared); newest ZSA-2026-16 (2026-10-14, medium); ZSA-2026-13/-14 (SQL injection in agent login, unauthenticated login via HTTP Basic modules, both high) date from 2026-09-16.
- source_id: jpcert
  reason: >-
    Recipe: https://www.jpcert.or.jp/rss/jpcert.rdf (Japanese) reads direct; alerts at https://www.jpcert.or.jp/at/2026/atNNNNNN.html and JVN (https://jvn.jp/en/jp/JVNnnnnnnnn/index.html, feed https://jvn.jp/en/rss/jvn.rdf) read with extract; JPCERT-AT-2026-0032 and JVN#88474777 were the SiteGuard primaries.
- source_id: jetbrains issues-fixed
  reason: https://www.jetbrains.com/privacy-security/issues-fixed/ is JS-rendered on extract; `jina` reads it (254 KB) with per-fix severity, fixed builds and CVE ids.
