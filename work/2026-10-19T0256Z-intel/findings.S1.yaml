    role: corroborating
  discovery_trace: >-
    first seen at: news feed sweep securityaffairs.com feed (fetch_source.py feed https://securityaffairs.com/feed), item of 2026-10-19 00:36, URL https://securityaffairs.com/201268/iot/16-year-old-broadcom-wi-fi-bug-lets-attackers-take-over-routers-without-a-password.html -> primary: researcher blog, URL https://quentinkaiser.be/security/2026/10/16/one-parser-two-bugs/
  summary: >-
    Researcher Quentin Kaiser disclosed at Hexacon on 2026-10-16 a flaw in Broadcom's proprietary 802.11/WPS EAP reassembly code, present in its SDK since at least 2010 and only partly patched in 2018, that gives an attacker within Wi-Fi range unauthenticated information disclosure and arbitrary code execution on the access point without the network key or a completed WPS enrollment. He demonstrated working exploits on an Orange Belgium ASKEY TCG3000 and a Proximus Sagemcom F@st/BBOX3V+ (credential theft from NVRAM and a reverse shell carried over 802.11 frames) and says the bug is exploitable on three of four Belgian ISPs' fleets (Proximus BBOX 3/3V+, VOO Netgear CG3100/CG3700, Technicolor TC7210 and CGA4233, Orange ASKEY TCG3000); chipsets named are BCM3380, BCM3383 and BCM33834 (eCos, an unfixable 'forever day') and BCM3390, BCM65xx and BCM68xx (Linux, dependent on OEM migration to hostapd). Broadcom answered in July that a patch exists, told him to ask the manufacturers to contact it,
    and refused to assign a CVE or share the OEM notification; CERT/CC opened and closed a VINCE case the same day. As of 2026-10-15 none of the tested devices were patched, and the researcher publishes a fingerprinting script and a YARA rule to map affected devices. His estimate of more than 1.5 million Belgian gateways is a medium-confidence napkin figure. No source shows exploitation in the wild; Swiss exposure is unknown (the affected Belgian cable devices share chipset families with cable gateways sold elsewhere, which no source confirms for Switzerland).
