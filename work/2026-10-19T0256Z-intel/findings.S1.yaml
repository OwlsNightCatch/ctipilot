  - quote: Version 26.2 prior to 26.2R1-S2
    attribution: Canadian Centre for Cyber Security AV26-1043 (affected Junos trains)
    source_url: https://cyber.gc.ca/en/alerts-advisories/juniper-networks-security-advisory-av26-1043
  extended_notes: >-
    Exposure: J-Web enabled and reachable (CVE-2026-101956, -101954, -101986); MX Series with certificate-based IKE/IPsec terminating on the box (CVE-2026-102182); Extended Echo enabled (CVE-2026-101980). Management-plane reachability is the discriminator: an interface restricted to a management VRF/jump host is a very different exposure from J-Web on an Internet-facing address. NCSC-NL's CSAF product tree is unversioned, so per-CVE fixed releases were not read; the CCCS list is bundle-wide (the vendor's affected-train cutoffs). Detection concepts (derived from mechanism): HTTP(S) requests to the J-Web service from non-administrative sources; unexpected root-level command execution or configuration commits not tied to an administrator login; kmd/IKE process crashes or core files on MX; Routing Engine reboots. No post-patch compromise guidance exists because nothing is reported exploited. Sources disagree on scoring style (3.1 9.8 in the NCSC-NL CSAF vs 4.0 9.3 on the aggregator for the same
    flaws); both are Juniper CNA values.
- title: >-
    SiteGuard Server Edition WAF (CVE-2026-106931): OS command injection in the default-on statistics function runs commands as root/SYSTEM, exploitation confirmed by the vendor and JPCERT/CC
  sources:
  - url: https://www.eg-secure.co.jp/siteguard/news/alert-202610-1
