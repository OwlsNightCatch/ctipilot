- title: >-
    PwnEscape (CVE-2026-99999): guest-controlled virtio-net checksum metadata corrupts the host Linux kernel IPv4 path, a KVM/Firecracker guest-to-host escape with lab-demonstrated host root; mainline fix 2026-10-14, RHEL/Ubuntu/SUSE fixes still pending
  sources:
