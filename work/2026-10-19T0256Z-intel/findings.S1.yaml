  - quote: EGセキュアソリューションズ株式会社は、本脆弱性の悪用を確認しているとのことです。
    attribution: JPCERT-AT-2026-0032 (Japanese)
    source_url: https://www.jpcert.or.jp/at/2026/at260032.html
  - quote: すでに悪用が確認されています。
    attribution: EG Secure Solutions (SiteGuard vendor alert, Japanese)
    source_url: https://www.eg-secure.co.jp/siteguard/news/alert-202610-1
  - quote: the victims, the scale of the attacks, and the methods used remain unclear, as neither security advisory provides these details
    attribution: BleepingComputer
    source_url: https://www.bleepingcomputer.com/news/security/hackers-exploit-siteguard-waf-flaw-to-run-commands-as-system-root/
  extended_notes: >-
    Exposure: any host running SiteGuard Server Edition Ver2.20+ below the fixed update with the statistics function on; read the version and statistics setting in the web management screen (vendor). Prerequisites per CVSS: local vector, low privileges; how the exploited requests reach the function is not described by any source, so the mapping to T1190 (public-facing application) is an assumption pending vendor detail. Detection concept (derived from the mechanism): child-process creation by the web server or SiteGuard statistics component (httpd/nginx/w3wp parent) running shells or interpreters at root/SYSTEM, plus new outbound connections from the WAF host. Post-patch check: the vendor says patching can wipe traces, so preserve the diagnostic bundle before updating and review for persistence created as root/SYSTEM. Contradictions: BleepingComputer 'critical' / '500,000 sites' conflates the WordPress plugin; vendor/JVN numeric score is 8.5/7.8.
