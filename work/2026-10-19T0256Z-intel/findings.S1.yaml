    first seen at: WebSearch ("unauthenticated remote code execution proof-of-concept released this weekend CVE-2026 patch now") -> news feed sweep: theregister.com security feed (fetch_source.py feed https://www.theregister.com/security/headlines.atom) item of 2026-10-19 02:33 CEST, URL https://www.theregister.com/virtualization/2026/10/19/linux-kvm-guest-host-escape-rated-critical-may-represent-a-new-way-to-attack-penguin-powered-networking/5303744 -> pivot: The Hacker News, URL https://thehackernews.com/2026/10/critical-pwnescape-linux-kernel.html -> primary: pwn.ai write-up, URL https://pwn.ai/blog/pwnescape (dated 2026-10-19) and Vercel, URL https://vercel.com/blog/findings-from-the-1-million-dollar-vercel-sandbox-challenge -> distro status: Red Hat https://access.redhat.com/security/cve/CVE-2026-99999, Debian https://security-tracker.debian.org/tracker/CVE-2026-99999, SUSE https://www.suse.com/security/cve/CVE-2026-99999.html, Ubuntu https://ubuntu.com/security/CVE-2026-99999; CVE
    record read via https://cveawg.mitre.org/api/cve/CVE-2026-99999 (data only, not cited)
  summary: >-
    The researcher (Paulos Yibelo, pwn.ai) who found the flaw in Vercel's $1 million Sandbox challenge published the full technical write-up on 2026-10-19; the Linux kernel CNA record (published 2026-10-15) rates CVE-2026-99999 CVSS 3.1 9.3 (AV:L/AC:L/PR:N/UI:N/S:C), Red Hat 8.8 (PR:L). The bug is in the host's IPv4 stack, not in KVM or one VMM: a guest sends an outbound virtio-net frame with crafted checksum metadata (checksum start and offset), the VMM writes it to the host TAP, tun_get_user() hands the skb to IPv4, and skb_checksum_help(), reached from ip_do_fragment() and four other consumers, writes at the guest-chosen offset inside an already-validated IPv4 header; ip_frag_next() then trusts the changed header length and copies beyond the linear head into transmitted IPv4 options. Vercel and pwn.ai demonstrated a repeatable host-memory disclosure (about 32 bytes per guest packet) against Vercel production sandboxes and, on researcher-owned KVM and Firecracker hosts built to match Vercel's,
    a two-packet host crash and command execution as host root; Vercel says no report in the challenge showed access to customer data. The upstream fix (commit 6785011f8b16, mainline 2026-10-14, 7.3-rc7) adds an IPv4 check that the checksum start cannot point into the header before completion at five consumers; its author calls it defence in depth with fuller input validation still to come. Stable kernels fixed: 5.10.272, 5.15.223, 6.1.190, 6.6.159, 6.12.113, 6.18.57, 7.2.11. Distro state at fetch (2026-10-19): Debian lists fixed kernels (bookworm 6.1.190-1, trixie 6.12.113-1, unstable 7.2.11-1); Red Hat marks every tracked stream affected, fixes pending, no mitigation, severity Important; SUSE state 'Pending' (important); Ubuntu 'Needs evaluation' on all releases (page dated 2026-10-15). Exploitation: no source reports in-the-wild use and CISA's KEV catalogue (2026.10.16) does not list it, but Red Hat's own CVE page says it 'tracks this flaw as a KEV active-exploit case' without explanation
    (unresolved contradiction; treat exploitation as unconfirmed). pwn.ai states it expects exploits for weaker configurations within weeks and for default hypervisor configurations within a month (researcher forecast, not telemetry).
  region_nexus: >-
    global; any Swiss organisation running Linux/KVM virtualisation, microVM or sandbox hosts (private cloud, hosting, CI runners, shared platforms) that carry untrusted or semi-trusted guests
