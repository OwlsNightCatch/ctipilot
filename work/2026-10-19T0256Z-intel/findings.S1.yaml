    attribution: Red Hat CVE page
    source_url: https://access.redhat.com/security/cve/CVE-2026-99999
  - quote: a guest-host escape possible with a few malformed IPv4 packets
    attribution: The Register
    source_url: >-
      https://www.theregister.com/virtualization/2026/10/19/linux-kvm-guest-host-escape-rated-critical-may-represent-a-new-way-to-attack-penguin-powered-networking/5303744
  extended_notes: >-
    Exposure (what a source states): host kernels that forward guest virtio-net traffic through a TAP device (CNA scenario: VMM writes the guest frame to the host TAP, tun_get_user() feeds the skb to IPv4); pwn.ai says the same primitive reaches 'many many other Hypervisor environments' and that TUN/AF_PACKET cases without a VM were discussed upstream. Other attach paths (vhost-net, macvtap, Open vSwitch) are not itemised in anything I read. Vector is local/guest: not reachable from the internet, so exposure is a function of who can run code in a guest. Fixed-version check: read the HOST kernel (uname -r is not enough on distro kernels that backport; use the distro advisory), and reboot into it; patching only the guest kernel does nothing (THN). Red Hat says no mitigation meets its criteria; Vercel's hardening (nested virtualisation off, Firecracker jailer) narrows blast radius only. Detection concepts (derived from the CNA scenario text, not vendor guidance): host kernel log WARN/panic
    output from skb_checksum_help on virtualisation hosts and unexplained host crashes (the CNA text says malformed offsets can trip WARN_ONCE/panic paths); packet capture on guest TAP/vnet egress for IPv4 packets with abnormal header length/options, since Vercel says host memory appears in packets the guest sends. Post-patch check: none stated by any source. Severity discrepancy to carry: CNA 9.3 (PR:N) vs Red Hat 8.8 (PR:L); NVD analysis pending. Dates: Vercel's 2026-10-14 post disclosed existence before the CVE; CVE published 2026-10-15; pwn.ai write-up and Register article are 2026-10-19.
