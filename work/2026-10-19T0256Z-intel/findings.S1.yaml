  summary: >-
    Juniper published 17 advisories this week covering more than 150 defects in Junos OS and Junos OS Evolved plus four in Cloud-Native Router; SecurityWeek counts about two dozen critical-severity issues and says Juniper makes no mention of in-the-wild exploitation. NCSC-NL's advisory NCSC-2026-0430 (2026-10-16, probability medium, damage high) lists three CVSS 3.1 9.8 flaws reachable over the network without authentication: CVE-2026-101956, improper authentication in the J-Web management interface that lets an unauthenticated remote attacker run arbitrary commands as root; CVE-2026-102182, a stack-based buffer overflow in kmd on MX Series reachable with crafted certificate-based IKE packets (unauthenticated root code execution); and CVE-2026-101980, an Extended Echo integer underflow in the kernel that reboots the Routing Engine (description names DoS only). An aggregator (OpenCVE; Juniper's bulletin text could not be read) lists two more J-Web flaws from the same bulletin at CVSS 4.0
    9.3: CVE-2026-101954 (NETCONF session handling, root-level control) and CVE-2026-101986 (pre-auth CGI execution through a crafted HTTP request). The Canadian Cyber Centre gives the affected Junos OS trains as those before 23.2R2-S7.7, 23.4R2-S8.13, 24.2R2-S5.5, 24.4R2-S5, 25.2R2-S2, 25.4R1-S3 and 26.2R1-S2 (Evolved: the same trains with -EVO fixed builds). Other NCSC-NL entries: CVE-2026-103994 (vgd, OVSDB messages, RCE, 8.8 adjacent), CVE-2026-102062 (ipfd on SRX, 8.1, needs a compromised HTTPS feed server) and CVE-2026-101955 (UTM Anti-Spam on SRX, 8.1, malformed DNS packets, unauthenticated RCE). The release is dated 2026-10-14, outside the 26 h window, and Juniper has no prior coverage in the store.
  region_nexus: global; Junos routers, switches and SRX firewalls are common in carrier, campus and government networks
