    (extract) -> pivot: todyl, URL https://www.todyl.com/blog/investigation-unauthorized-access-through-the-connectwise-cloud-backup-microsoft-365-app
    (extract) -> pivot: huntress (majors sweep, feed https://www.huntress.com/blog/rss.xml), URL https://www.huntress.com/blog/vendor-credential-enables-unauthorized-access
    (extract) -> primary: ConnectWise Trust Center, URL https://www.connectwise.com/company/trust/advisories (extract;
    latest update 2026-10-19 01:15 UTC) -> corroboration: https://thehackernews.com/2026/10/connectwise-suspends-cloud-backup-after.html
    (extract). The advisory links a technical investigation and remediation guide PDF; pdf bridge, jina and WebFetch
    all returned 403/blocked, so it was not read.'
  summary: 'Developments since the 2026-10-18 entry (discovered 03:30 UTC, last ConnectWise update cited 2026-10-18
    01:00 UTC). FACTS stated by ConnectWise in three further advisory updates (2026-10-18 16:00 and 18:45 UTC, 2026-10-19
    01:15 UTC): Cloud Backup, SaaS Security and Cloud Management all remain suspended, so scheduled backups, archive
    access, restores, SaaS Security alerting and Cloud Management user and license management are unavailable, and
    there is no confirmed restoration time; the entry so far records only Cloud Backup as suspended. CLAIMS by ConnectWise:
    existing backup archives remain encrypted and isolated with no indication of compromise (a statement about stored
    archives that, in ConnectWise''s words, does not establish whether individual live Microsoft 365 environments
    were affected), and since mitigations it has not observed successful threat activity in the environments it
    monitors, a finding it says does not establish the status of downstream customer environments. ConnectWise also
    published additional IP indicators (not reproduced here) and a Cloud Backup technical investigation and remediation
    guide (PDF, unreachable from our egress, contents not summarised). OPERATIONAL DETAIL not yet in the entry,
    from two independent monitoring vendors: Todyl and SpecterOps each state that disabling the app stops new tokens
    but tokens already issued stay valid for up to 90 minutes, and Todyl adds that revoking user sessions does not
    end the access, so a tenant''s log review after it disables the app should run at least 90 minutes past the
    disable time. Todyl says all SkyKick apps are published from one vendor tenant; SpecterOps hunts by that application-owner
    tenant rather than by display name (older tenants may list the apps under SkyKick names) and maps each vendor
    service principal''s reach to Tier Zero with AzureHound and BloodHound path queries, which finds inherited or
    dormant vendor apps that a client-ID list alone can miss. NOT PUBLIC: how the credential was obtained, who is
    behind it, and what data was read; ConnectWise says it is still unknown whether a product vulnerability contributed.'
