- title: 'WP2Shell on WordPress core: Seqrite''s lab write-up and SOCRadar''s in-the-wild tooling describe the same
    post-exploitation sequence (unauthenticated REST batch request, administrator account, plugin-install file writes,
    web-shell plugin)'
  sources:
  - url: https://www.seqrite.com/blog/wp2shell-exploit-chain-anatomy-of-a-sophisticated-wordpress-attack/
    publisher: Seqrite Labs
    date: '2026-10-16'
    role: primary
  - url: https://socradar.io/blog/cyberxero-ai-iab-ukraine-critical-infrastructure/
    publisher: SOCRadar Threat Research Unit
    date: '2026-10-06'
    role: corroborating
  discovery_trace: 'first seen at: seqrite-labs (S3 slice record, rss_url https://www.seqrite.com/blog/feed/), URL
    https://www.seqrite.com/blog/wp2shell-exploit-chain-anatomy-of-a-sophisticated-wordpress-attack/ (extract; page
    date 2026-10-16) -> pivot: prior-coverage check found the 2026-07-18 WP2Shell entry carries no host-side artifacts
    -> corroboration: SOCRadar CyberXero report, URL https://socradar.io/blog/cyberxero-ai-iab-ukraine-critical-infrastructure/
    (extract; first surfaced in the 2026-10-15 S3 findings, never published as an entry)'
  summary: 'Seqrite Labs (2026-10-16) walks through the public WP2Shell chain on WordPress core: CVE-2026-63030,
    route confusion in the REST batch controller at /wp-json/batch/v1 (an inner batch nested in an outer batch reaches
    handlers that normally require authentication), reaching CVE-2026-60137, an SQL injection through the posts
    endpoint''s author_exclude parameter (author__not_in in WP_Query). It records a host-side sequence the 2026-07-18
    entry does not carry: the SQL injection first yields an administrator-level foothold (an unexpected administrator
    account); transient writability-test files are created and deleted under wp-content; a ZIP archive is written
    to the uploads directory and unpacked into wp-content/upgrade; and the extracted directory is renamed into wp-content/plugins
    as a web-shell plugin that gives command execution. Seqrite shows the writes coming from the web-server process
    (httpd.exe in its lab) and says that file activity is the same kind a legitimate plugin upload produces, so
    the suspicious part is the unusual volume, the tool-specific filenames and the absence of an administrator action;
    it says the writability-test files were observed during lab testing, so that artifact is lab-derived rather
    than field telemetry. SOCRadar''s 2026-10-06 CyberXero report independently describes the same chain run in
    the wild by a Russian-speaking initial access broker (SOCRadar''s claim, from an exposed operator workstation):
    a rogue WordPress administrator with a fixed username pattern and a web shell registered as an active plugin,
    which SOCRadar calls ''the single most actionable indicator from this campaign''. Assessment for hunters: the
    naming patterns (administrator username and plugin directory prefix) are attacker-chosen and easily changed,
    so they are weak anchors; the stable signals are an unauthenticated POST with nested batch bodies to the REST
    batch endpoint, followed by administrator creation and a plugin-install file-write sequence from the web-server
    worker with no authenticated administrator session behind it. Versions per Seqrite, consistent with the covered
    entry: WordPress 6.9.0 to 6.9.4 and 7.0.0 to 7.0.1 are exposed to the full chain, 6.8.0 to 6.8.5 are listed
    as affected by CVE-2026-60137, fixed in 6.8.6, 6.9.5 and 7.0.2. No new exploitation scale or attribution comes
    from Seqrite; the exploitation and KEV facts are already in the entry.'
  region_nexus: global; Swiss municipal, cantonal and school WordPress sites are the same technology class
  primary_sector_nexus: indirect (public-sector WordPress hosting)
  sector: public-sector
