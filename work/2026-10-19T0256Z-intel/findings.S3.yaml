    attribution: SpecterOps
    source_url: https://specterops.io/blog/2026/10/17/connectwise-skykick-breach-microsoft-365/
  - quote: Older tenants may list them under SkyKick names.
    attribution: SpecterOps
    source_url: https://specterops.io/blog/2026/10/17/connectwise-skykick-breach-microsoft-365/
  - quote: tokens already issued stay valid for up to 90 minutes
    attribution: Todyl
    source_url: https://www.todyl.com/blog/investigation-unauthorized-access-through-the-connectwise-cloud-backup-microsoft-365-app
  extended_notes: 'Suggested treatment: one non-internal ''update'' record on the covered entry (Cloud Management
    and SaaS Security now also suspended, no restoration time, ConnectWise''s archive and no-successful-activity
    claims attributed with their stated limits) plus the 90-minute token tail in Detection. S4 almost certainly
    surfaces the same incident; the main agent should fold the two returns into one record. The entry''s existing
    facts (162 tenants, nearly 1,000 tenants with sign-in activity of which over 300 succeeded, the October 13-14
    spray, the 16-tenant targeted wave) already match the Huntress update of 2026-10-17 21:15 UTC; nothing in the
    Huntress post is newer than that apart from its IOC table repeating ConnectWise''s 2026-10-18 18:45 UTC additional-IP
    update. Detection hook for the entry: Entra service-principal sign-in logs filtered on the application-owner
    tenant (all vendor apps, including renamed or dormant ones) rather than only the seven client IDs, extended
    90 minutes past the tenant''s disable time. Hardening lever: disable (do not delete) the vendor service principals
    and keep them disabled until ConnectWise confirms credential rotation (Todyl, Huntress).'
  classification_hint: A1 (vendor first-party advisory for its own incident, corroborated by Todyl, Huntress and
    SpecterOps telemetry)
