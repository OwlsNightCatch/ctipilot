  evidence:
  - quote: Unexpected WordPress administrator accounts may be created as part of the attack chain.
    attribution: Seqrite Labs
    source_url: https://www.seqrite.com/blog/wp2shell-exploit-chain-anatomy-of-a-sophisticated-wordpress-attack/
  - quote: Following privilege escalation, the attack chain proceeds to the deployment of a plugin-based web shell,
      which provides an interface for executing commands on the compromised WordPress server.
    attribution: Seqrite Labs
    source_url: https://www.seqrite.com/blog/wp2shell-exploit-chain-anatomy-of-a-sophisticated-wordpress-attack/
  - quote: However, the unusual volume and WP2Shell-specific filenames make this activity suspicious on a system.
    attribution: Seqrite Labs
    source_url: https://www.seqrite.com/blog/wp2shell-exploit-chain-anatomy-of-a-sophisticated-wordpress-attack/
  - quote: which is the single most actionable indicator from this campaign
    attribution: SOCRadar Threat Research Unit
    source_url: https://socradar.io/blog/cyberxero-ai-iab-ukraine-critical-infrastructure/
  extended_notes: 'Suggested treatment: one non-internal ''improvement'' or ''update'' record on the covered WP2Shell
    entry adding a Detection line (telemetry classes: web access logs for the batch endpoint with nested bodies,
    which need WAF or body logging because default access logs do not record POST bodies; file-creation events from
    the web-server worker under uploads, upgrade and plugins; CMS user-creation audit events) and a Triage line
    (legitimate plugin installs write the same directories; the discriminator is the missing authenticated administrator
    session and the preceding unauthenticated batch request). The covered entry''s Correction of 2026-09-29 already
    treats any unpatched, internet-reachable 6.9.0 to 6.9.4 or 7.0.0 to 7.0.1 instance as a compromise-assessment
    target; this adds the concrete post-compromise check. SOCRadar''s primary is nine days old and single-vendor
    (its wp2shell tool attribution to the CyberXero broker is SOCRadar''s claim); it is used here only to corroborate
    the artifact class, not to add the AI-agent or Ukrainian-energy storyline, which the 2026-10-15 run returned
    and the store dropped.'
  classification_hint: B2 (Seqrite lab write-up of public PoC behaviour, partly lab-derived; SOCRadar independently
    describes the same footprint from field infrastructure)
  borderline: true
  borderline_reason: 'Update-of on a covered, KEV-listed core flaw: adds only host-side hunting detail; Seqrite''s
    staging artifacts are partly lab-derived and the name patterns are weak anchors.'
