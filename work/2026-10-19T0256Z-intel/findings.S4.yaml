    novelty: "update-of:2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse"
    evidence:
      - quote: "During this pause, SaaS Security monitoring and alerting and Cloud Management user and license management are unavailable."
        attribution: "ConnectWise Trust Center (advisory)"
        source_url: "https://www.connectwise.com/company/trust/advisories"
      - quote: "Cloud Backup, SaaS Security, and Cloud Management remain suspended while remediation and security validation continue."
        attribution: "ConnectWise Trust Center (advisory)"
        source_url: "https://www.connectwise.com/company/trust/advisories"
      - quote: "Since implementing our mitigations, we have not observed successful threat activity in the environments we monitor."
        attribution: "ConnectWise Trust Center (advisory)"
        source_url: "https://www.connectwise.com/company/trust/advisories"
      - quote: "We do not have a restoration time to share yet."
        attribution: "ConnectWise Trust Center (advisory)"
        source_url: "https://www.connectwise.com/company/trust/advisories"
    extended_notes: |
      Recommended handling: at most an `improvement` record (the SaaS Security / Cloud Management suspension is a detection-coverage
      fact for customers of those services) or no record at all; the delta does not change the entry's actions or priority. The vendor
      page is a living advisory (next update due 2026-10-19 13:00 UTC), so a later fire may find a restoration notice or
      re-authorisation instructions, which would be the next material development. Sourcing: the vendor is first-party for its own
      incident; Huntress and BleepingComputer predate the 2026-10-18 updates and corroborate only the earlier state.
    borderline: true
    borderline_reason: "update-of with a small delta: one fact missing from the entry (SaaS Security and Cloud Management offline, so monitoring and alerting unavailable) plus 'no new findings'; no change to actions, priority or the entry's picture of the incident"

  - title: "IDC Frontier: sixth report of 2026-10-18 resumes the IDCF Cloud backup service for customers whose virtual servers still run; snapshot function stays suspended"
    sources:
      - { url: "https://idcf.jp/news/topics/20261018001/", publisher: "IDC Frontier (sixth report, Japanese)", date: "2026-10-18", role: "primary" }
    discovery_trace: "first seen at: WebSearch (\"IDC Frontier IDCFクラウド ランサムウェア 復旧 続報\") -> pivot: WebFetch of https://www.idcf.jp/ (latest-notice banner names the sixth report, updated 2026-10-19 12:00 JST) -> primary: IDC Frontier sixth report, URL https://idcf.jp/news/topics/20261018001/ (read with extract)"
    summary: |
      Delta against entry 2026-10-11/idc-frontier-idcf-cloud-ransomware-495-customers-backups (last updated on the fifth report of
      2026-10-14). IDC Frontier's sixth report of 2026-10-18 says the IDCF Cloud Backup service, which it had suspended after the
      unauthorized access, is available again because its safety check is complete. For customers whose virtual servers still run
      (East Japan Region 1 radian and newton zones, East Japan Regions 2 and 3, West Japan Region 1), whom it had earlier asked to take
      preventive backups, the resumed service lets them retrieve backup data quickly and restore it to other cloud environments or on-premises.
      The snapshot function remains suspended pending safety checks, and IDCF Cloud TypeS (formerly White Cloud ASPIRE) and IDCF private
      cloud are outside the incident. The company's status banner of 2026-10-19 12:00 JST says response is continuing and that there are no
      new material facts since the previous notice. No intrusion route, actor or data-exfiltration finding changed.
    region_nexus: "APAC (Japan); no Swiss nexus; transferable lesson (a cloud provider's ransomware outage reaching public-sector customer sites) is already in the entry"
    primary_sector_nexus: "indirect"
