items:
  - title: "ConnectWise Cloud Backup (SkyKick): vendor advisory updates of 2026-10-18 18:45 UTC and 2026-10-19 01:15 UTC (service suspension scope, no restoration time, no new findings)"
    sources:
      - { url: "https://www.connectwise.com/company/trust/advisories", publisher: "ConnectWise Trust Center (advisory)", date: "2026-10-19", role: "primary" }
      - { url: "https://www.huntress.com/blog/vendor-credential-enables-unauthorized-access", publisher: "Huntress", date: "2026-10-17", role: "corroborating" }
      - { url: "https://www.bleepingcomputer.com/news/security/hackers-breach-microsoft-365-tenants-via-connectwise-supply-chain-attack/", publisher: "BleepingComputer", date: "2026-10-17", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/news/security/hackers-breach-microsoft-365-tenants-via-connectwise-supply-chain-attack/ (feed https://www.bleepingcomputer.com/feed/) -> primary: ConnectWise Trust Center advisory, URL https://www.connectwise.com/company/trust/advisories (fetched with extract; carries the dated updates through 2026-10-19 01:15 UTC) -> corroborating: Huntress living post, URL https://www.huntress.com/blog/vendor-credential-enables-unauthorized-access (update of 2026-10-17 17:15 ET). The advisory's technical remediation guide PDF returned HTTP 403 on both the pdf subcommand and WebFetch, but the advisory page reproduces the same technical workflow in HTML."
    summary: |
      Delta against entry 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse (composed on the advisory state of
      2026-10-18 01:00 UTC). Facts, all from the vendor's own advisory page: (1) the 2026-10-18 01:00 UTC update, already public when
      the entry was written but absent from it, says ConnectWise temporarily took SaaS Security and Cloud Management offline, so
      SaaS Security monitoring and alerting and Cloud Management user and license management are unavailable, which means a
      customer or MSP that relied on ConnectWise SaaS Security for Microsoft 365 alerting has lost that monitoring until restoration.
      (2) The 2026-10-18 18:45 UTC update adds two more source addresses shared by downstream monitoring (indicators, not entry content)
      and points to a Cloud Backup technical investigation and remediation guide. (3) The 2026-10-19 01:15 UTC update says containment
      measures remain in place, that Cloud Backup, SaaS Security and Cloud Management remain suspended, that scheduled backups, archive
      access and restores are unavailable, that there is still no confirmed restoration time, and that since mitigations ConnectWise has
      not observed successful threat activity in the environments it monitors; the next vendor update was promised by 13:00 UTC on
      2026-10-19. ConnectWise separately states that existing backup archives are encrypted, isolated and preserved and that it has no
      evidence they were accessed; it also says those findings concern stored archives and do not establish whether live Microsoft 365
      environments were affected. No new victim, actor, vector or credential-theft explanation is published. The Huntress counts already in
      the entry (162 confirmed tenants, almost 1,000 tenants with sign-in activity) are unchanged.
    region_nexus: "global; Swiss MSPs and public bodies that consented a ConnectWise or SkyKick app in Entra are in scope, but no Swiss victim or Swiss authority statement was found"
    primary_sector_nexus: "indirect (managed-service-provider supply chain into Microsoft 365 tenants)"
    sector: "technology"
    cves: []
    techniques: [T1199, T1078.004, T1098.003, T1098.001]
    affected_products: ["ConnectWise Cloud Backup", "ConnectWise Cloud Management", "Microsoft Entra ID"]
    entity_keys: ["incident:connectwise-cloud-backup-skykick-app-credential-abuse-2026-10", "product:connectwise-cloud-backup", "product:connectwise-cloud-management"]
    new_entities: []
