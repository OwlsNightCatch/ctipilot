    surface: "body"
    kind: cited
    text: "For a controller that may have been taken over, CERT-FR's current text is to remove the internet exposure, restart the Danfoss unit or otherwise restore it with a factory reset, restore access only through a secure VPN or protected network, reconfigure it and apply the maker's practices, which for Danfoss means updating the firmware, setting the security level to Strict and confirming the default passwords were changed ("
