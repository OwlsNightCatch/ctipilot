  - claim_id: a155cfd603
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "actions[0]"
    kind: frontmatter
    text: "In every Entra tenant you or your MSP administer, disable without deleting the seven ConnectWise application identities that ConnectWise lists by client ID (Cloud Backup is 506e08f9-6e9a-4da4-942b-a099a03644ae; the other six are in ConnectWise's advisory), dormant connections included, and keep them disabled until ConnectWise gives restoration instructions; review the Graph activity logs for these apps until at least 90 minutes after you disabled them, because a token issued before the disable stays valid for up to 90 minutes, and preserve the sign-in and audit logs promptly without delaying containment, because Entra ID Free keeps only 7 days."
  - claim_id: d26ae085db
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "actions[1]"
    kind: frontmatter
    text: "In the same tenants list the apps owned by the ConnectWise S-K LLC tenant (3f9cd7a0-127a-4ed4-bf06-2f830d5616b7), which also finds inherited ones, and disable each that you do not use or cannot verify as safe."
  - claim_id: 0b6717f1b5
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "actions[2]"
    kind: frontmatter
    text: "In the same tenants review every enterprise application and app registration, MSP management and security tools first, for client secrets, certificates and federated credentials added since 2026-10-13 and remove any you did not create; also check the directory roles, owners and consent grants held by ConnectWise and SkyKick service principals, Conditional Access exclusions for them, and mailbox forwarding, inbox and transport rules and delegated access, because disabling the vendor applications does not remove access planted through them."
