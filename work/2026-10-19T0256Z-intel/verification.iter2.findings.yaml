- code: F18
  category: action-item-discipline
  section: entries/2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
  item: (low confidence) actions[0] Graph-activity-log review
  url_or_quote: review the Graph activity logs for these apps until at least 90 minutes after you disabled them
  summary: 'Todyl: ''Enable Microsoft Graph activity logs (Entra ID P1/P2, not retroactive)'' and the Graph activity records ''was not being collected for these tenants''; the body Detection itself says ''Entra ID P1 or P2, not retroactive''. The action orders a review of logs a tenant may never have enabled, and still bundles three tasks (disable the seven IDs, review Graph logs, preserve sign-in and audit logs) in one 150-word item. Suggest ''where Graph activity logs were enabled'' on the review, or move the review to Detection.'
