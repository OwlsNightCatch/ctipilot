- code: F3
  category: claim-not-supported
  section: entries/2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
  item: 'Danfoss entry: Dixell France operator guide citations (frontmatter summary, body Exposure, Update 2026-10-18T03:33:00Z section, evidence[] quote, sources[] date, sourcing_note)'
  url_or_quote: https://dixell.fr/wp-content/uploads/2026/10/Recommandations-pour-une-utilisation-securisee-des-superviseurs-XWEB-v1.0.pdf
  summary: 'The PDF at the cited URL was replaced after the entry cited it (HTTP Last-Modified Sun, 18 Oct 2026 16:39:40 GMT; PDF CreationDate 2026-10-18 16:38:11 UTC; first page dated ''14 octobre 2026''; pdftotext of all 5 pages). The current text has no ''1.12.1'', no ''sans délai'', no ICSA-26-057-10, no ''mars 2024'', no one-trusted-source-address stop-gap. Entry says ''which says any XWEB PRO on firmware 1.12.1 or earlier must be updated without delay'' (Exposure; frontmatter summary says the same); evidence quote ''Any XWEB PRO whose firmware is version 1.12.1 or earlier must be updated without delay.'' (original ''Tout XWEB PRO dont le firmware est en version 1.12.1 ou antérieure doit être mis à jour sans délai.'') is not on the page (the gate machine-checked only 7 of 26 quotes and did not reach this PDF); the Update 2026-10-18 section says ''It repeats Copeland''s March 2024 bulletin'' (the guide now says ''Compléments au bulletin Copeland d''octobre 2026''), ''the guide cites CISA''s February 2026 advisory ICSA-26-057-10'' and ''a port forward limited to one trusted source address acceptable only as a temporary, degraded stop-gap'' (all gone), and ''its file was last modified on 2026-10-13'' (the same date is in sources[] and the sourcing_note says ''undated, so the date given for it is the file''s last modification''); the file is now dated 2026-10-18 and its text carries 14 October 2026. Still on the page: same factory Admin account for XWEB PRO and EVO, named accounts with expiry for contractors, VPN, no AnyDesk/TeamViewer, back up first. The underlying fact (XWEB PRO 1.12.1 and prior vulnerable) is in CISA ICSA-26-057-10, which I read via ''fetch_source.py cisa csaf ICSA-26-057-10'' (initial release 2026-02-26; XWEB 300D PRO, 500D PRO, 500B PRO <=1.12.1): cite that for the version scope, or drop the claim. Fix through a changelog correction or improvement with fields summary, sources, evidence, sourcing_note, body.'
- code: F10
  category: missed-angle
  section: entries/2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
  item: Copeland's own bulletin of 14 October 2026, now carried by the revised Dixell France guide, names the affected generation
  url_or_quote: https://dixell.fr/wp-content/uploads/2026/10/Recommandations-pour-une-utilisation-securisee-des-superviseurs-XWEB-v1.0.pdf
  summary: 'The revised guide opens with Copeland''s bulletin (''14 octobre 2026''): ''Nous reconnaissons l''existence de la vulnérabilité identifiée sur une génération de contrôleurs XWEB EVO dont la commercialisation est arrêtée et qui est parvenue en fin de vie.'' and ''Retirez immédiatement toutes les unités XWEB EVO de l''Internet public, puis recherchez toute activité suspecte depuis le réseau local et restaurez les appareils si nécessaire'', then a 10-step restore procedure for a possibly compromised XWEB EVO, ''Le XWEB EVO a atteint sa fin de service et ne reçoit plus de correctifs de sécurité'' and migration to XWEB PRO. This is the vendor primary for the Copeland acknowledgement that the Improvement section carries through SecurityWeek and Cybersecurity Dive; it names the model (XWEB EVO, end of service) and changes the Exposure (EVO: remove from the internet now, no patch; PRO: keep off the internet). Neither the Danfoss entry nor the run record carries it, and S2''s finding and the borderline-drop lines do not mention the revised guide. Web search for a separate Copeland bulletin returned nothing, so the guide itself is the source.'
- code: F3
  category: claim-not-supported
  section: entries/2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
  item: '(low confidence) updates[] record 2026-10-19T03:47:00Z summary and run-record notes: ConnectWise credited with saying a token issued before an app is disabled stays usable'
  url_or_quote: 'ConnectWise, Todyl and SpecterOps say a token issued before an app is disabled stays usable afterwards (Todyl and SpecterOps: up to 90 minutes)'
  summary: 'ConnectWise''s advisory (update of Sunday, October 18, 2026 at 01:00 UTC) says: ''We also suspended Cloud Backup service by revoking certificates used for affected application connections. The affected shared Cloud Backup credentials are no longer valid. Previously issued access tokens may remain usable until they expire or are otherwise invalidated.'' That concerns tokens after the vendor''s certificate revocation, not a tenant disabling an app; only Todyl (''Disabling the app in a tenant stops new tokens from being issued there, though tokens already issued stay valid for up to 90 minutes'') and SpecterOps (''Tokens that were already issued can stay valid for up to 90 minutes after you disable an app'') say it of disabling. The body and the section word the ConnectWise statement correctly (''previously issued tokens may remain usable until they expire''); the record summary and the run-record note (''ConnectWise itself state that tokens already issued outlast an app''s disabling'') over-attribute it.'
- code: F13
  category: analytical-link-as-fact
  section: entries/2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
  item: '(low confidence) actions[1] and record summary: owner-tenant listing ''also finds inherited ones'''
  url_or_quote: 'list the apps owned by the ConnectWise S-K LLC tenant (3f9cd7a0-127a-4ed4-bf06-2f830d5616b7), which also finds inherited ones; record summary: Todyl and SpecterOps point to the apps owned by ConnectWise''s vendor tenant, inherited ones included'
  summary: 'Todyl step 4 says ''Find every SkyKick/ConnectWise app in your tenants, including inherited ones. All SkyKick apps are published from tenant 3f9cd7a0-127a-4ed4-bf06-2f830d5616b7 ("ConnectWise S-K LLC"). Disable any you don''t use.'' Two adjacent statements with no stated link between an owner-tenant listing and the inherited apps; SpecterOps says nothing about inherited apps (it says ''The queries hunt for applications owned by the ConnectWise tenant ... Older tenants may list them under SkyKick names''). The body paragraph keeps the two statements apart; actions[1] and the record summary join them. This is the residue of iteration-1 finding 4. Fix: drop ''which also finds inherited ones'' and ''inherited ones included'' from the owner-tenant clause, or state them as Todyl''s separate instruction.'
