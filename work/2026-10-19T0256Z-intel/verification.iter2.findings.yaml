  item: (low confidence) 'took SaaS Security and Cloud Management offline together with Cloud Backup' (Improvement section, record summary, run notes)
  url_or_quote: ConnectWise's update of 2026-10-18 01:00 UTC took SaaS Security and Cloud Management offline together with Cloud Backup
  summary: The 2026-10-18 01:00 UTC update says 'As an additional precaution, we have temporarily taken SaaS Security and Cloud Management offline' while Cloud Backup had been suspended since 2026-10-17 (05:01 UTC update; 07:00 UTC disablement); the 2026-10-17 17:00 UTC update says 'no indication that any other ConnectWise product, service, or offering is impacted'. 'Together with' can read as simultaneous. Consider 'in addition to Cloud Backup, which had been suspended since 2026-10-17'. The date of the first mention (2026-10-18 01:00 UTC) is right; a Wayback snapshot of the page as of that update confirms it is the first dated mention.
