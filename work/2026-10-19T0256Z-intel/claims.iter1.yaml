claims:
  - claim_id: 1a9716e470
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "actions[0]"
    kind: frontmatter
    text: "In every Entra tenant you or your MSP administer, find every ConnectWise and SkyKick application, the seven client IDs ConnectWise lists (Cloud Backup is 506e08f9-6e9a-4da4-942b-a099a03644ae; the other six are in ConnectWise's advisory) and any other app owned by the ConnectWise S-K LLC tenant (3f9cd7a0-127a-4ed4-bf06-2f830d5616b7), since older tenants may list them under SkyKick names and dormant connections count, and disable them without deleting, then keep them disabled until ConnectWise gives restoration instructions; read each app's sign-in log until at least 90 minutes after you disabled it, because tokens already issued stay valid for up to 90 minutes; preserve the sign-in and audit logs promptly without delaying containment, because Entra ID Free keeps only 7 days."
  - claim_id: 4a2751945d
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "actions[1]"
    kind: frontmatter
    text: "In the same tenants review every enterprise application and app registration, MSP management and security tools first, for client secrets, certificates and federated credentials added since 2026-10-13 and remove any you did not create; also check the directory roles, owners and consent grants held by ConnectWise and SkyKick service principals, Conditional Access exclusions for them, and mailbox forwarding, inbox and transport rules and delegated access, because disabling the vendor applications does not remove access planted through them."
  - claim_id: 00652d1a93
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "body"
    kind: cited
    text: "ConnectWise says it identified unauthorized access to application identities within its Cloud Backup (formerly SkyKick) environment; on 2026-10-17 it disabled seven application identities, suspended the service, says the shared Cloud Backup credentials are no longer valid, and warns that disabling does not reverse changes already made in a tenant ("
    urls: ["https://www.connectwise.com/company/trust/advisories"]
  - claim_id: ca4a6da517
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "body"
    kind: cited
    text: "Cloud Backup, SaaS Security and Cloud Management remain suspended with no confirmed restoration time, which also takes ConnectWise's SaaS Security monitoring and alerting out of service; ConnectWise reports no successful threat activity in the environments it monitors since it implemented mitigations, and says it cannot independently determine whether a given partner or customer tenant was affected ("
    urls: ["https://www.connectwise.com/company/trust/advisories"]
  - claim_id: f3529886c2
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "body"
    kind: cited
    text: "Huntress and Todyl report that on 2026-10-15 the app's identity signed in to customer Microsoft 365 tenants from one hosting-provider address and received app-only Microsoft Graph tokens; the credential sits in the vendor's own tenant, so no user, MFA prompt or user Conditional Access was involved, and the app's consent covers read and write access to mail, files and Teams chats ("
    urls: ["https://www.huntress.com/blog/vendor-credential-enables-unauthorized-access", "https://www.todyl.com/blog/investigation-unauthorized-access-through-the-connectwise-cloud-backup-microsoft-365-app"]
