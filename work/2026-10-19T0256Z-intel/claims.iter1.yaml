    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "body"
    kind: cited
    text: "Huntress confirmed unauthorized sign-ins in 162 tenants by 2026-10-16 and later counted almost 1,000 tenants with sign-in activity from that address, over 300 successful, after password spraying against four law-firm tenants on 13 and 14 October, and a separate failed wave targeted 16 tenants in policy and national-security sectors ("
    urls: ["https://www.huntress.com/blog/vendor-credential-enables-unauthorized-access"]
