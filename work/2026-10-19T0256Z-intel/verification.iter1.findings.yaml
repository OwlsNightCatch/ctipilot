- code: F4
  category: hallucinated-fact
  section: improvement-section; run-record notes
  item: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
  url_or_quote: 'Improvement section: "ConnectWise''s advisory has listed SaaS Security and Cloud Management as suspended together with Cloud Backup since its first version"; run record notes: "SaaS Security and Cloud Management were suspended together with Cloud Backup in the advisory''s first version (2026-10-16 17:47 UTC)"'
  summary: 'False. A Wayback snapshot of https://www.connectwise.com/company/trust/advisories taken 2026-10-17 07:32 UTC shows the Oct 16 17:47 UTC version and the Oct 17 05:01 UTC update naming only Cloud Backup, and the live page''s Oct 17 17:00 UTC update says ''we have no indication that any other ConnectWise product, service, or offering is impacted''. The first dated mention of SaaS Security and Cloud Management being taken offline is the Oct 18 01:00 UTC update (''we have temporarily taken SaaS Security and Cloud Management offline''). The undated FAQ block (which does carry the suspension) was added later. Fix: say the advisory''s update of 2026-10-18 01:00 UTC took them offline (cite that date) and drop ''since its first version'' from the section and the run-record notes.'
- code: F4
  category: hallucinated-fact
  section: body Detection; actions[0]
  item: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
  url_or_quote: 'Detection: "tokens already issued stay valid for up to 90 minutes, so a disabled app can still sign in for that long and the review has to cover that period"; actions[0]: "read each app''s sign-in log until at least 90 minutes after you disabled it, because tokens already issued stay valid for up to 90 minutes"'
  summary: 'Todyl (the cited source): ''Disabling the app in a tenant stops new tokens from being issued there, though tokens already issued stay valid for up to 90 minutes'' and ''Disabling blocks new tokens immediately''. In the sources'' own terms a sign-in is a token issuance (Todyl: ''successful application sign-ins, one per tenant''), so a disabled app cannot sign in; only tokens already minted stay usable. The use of such tokens does not appear in the service-principal sign-in log (ConnectWise: that tab ''is where the application''s authentication activity is recorded''); Todyl says per-request source IPs are in MicrosoftGraphActivityLogs. The sentence misstates the mechanism and the action points the reader at the wrong telemetry. Fix: ''a token issued before the disable can still be used for up to 90 minutes'' and direct the review of that period to Graph activity / unified audit records (where enabled).'
- code: F4
  category: hallucinated-fact
  section: improvement-section
  item: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
  url_or_quote: '"ConnectWise now says it has not observed successful threat activity in the environments it monitors since implementing mitigations"'
  summary: '''now'' is wrong: the same sentence is on the advisory since the Oct 17 17:00 UTC update (''Since implementing the mitigations described below, we have not observed successful threat activity in the environments we monitor'') and again in the Oct 18 01:00 UTC update, both of which pre-date the entry''s first version (sourcing_note: latest 2026-10-18 01:00 UTC). The archive sentence in the same clause is from the Oct 18 16:00 UTC update (''These findings concern stored backup archives and do not establish whether individual live Microsoft 365 environments were affected''), not the 2026-10-19 01:15 UTC update the citation is dated. Fix: drop ''now'', or state when ConnectWise first said it.'
- code: F4
  category: hallucinated-fact
  section: body Exposure; improvement-section; update record summary
  item: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
  url_or_quote: '"so an owner-tenant search finds inherited or renamed apps that a client-ID list can miss"; record summary: "an owner-tenant search that finds renamed or inherited ConnectWise and SkyKick apps beyond the seven client IDs"'
  summary: '(low confidence) No cited source says a client-ID list misses renamed apps. ConnectWise: ''Match on Application ID rather than display name'', so a SkyKick display name does not evade an ID match. SpecterOps runs its owner-tenant query for the same seven known application IDs and only notes ''Older tenants may list them under SkyKick names''; it states no causal ''because''. Todyl supports only ''Find every SkyKick/ConnectWise app in your tenants, including inherited ones. All SkyKick apps are published from tenant 3f9cd7a0-...''. Fix: keep the ''inherited ones beyond the seven IDs'' point attributed to Todyl, drop ''renamed ... can miss'' and the ''because'' link.'
- code: F4
  category: hallucinated-fact
  section: run-record borderline-drop (SiteGuard)
  item: runs/2026-10-19/2026-10-19T0256Z-intel.md
  url_or_quote: '"BleepingComputer''s "critical" and its 500,000-site figure conflate the separate SiteGuard WordPress plugin"'
  summary: 'Only the 500,000-site figure is the WordPress plugin''s install count (BleepingComputer links wordpress.org/plugins/siteguard). The word ''critical'' is the vendor''s and JPCERT/CC''s own label: the JVN#88474777 page title reads ''SiteGuard Server Edition vulnerable to OS command injection Critical'', and BleepingComputer writes ''According to the vendor''s bulletin and a warning from Japan''s CERT agency, CVE-2026-106931 has critical severity''. Fix: say the vendor and JVN label it Critical while scoring it 8.5 (v4.0) / 7.8 (v3.0), and only the site count is conflated.'
- code: F18
  category: action-item-discipline
  section: actions[0]
  item: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
  url_or_quote: '"find every ConnectWise and SkyKick application, the seven client IDs ConnectWise lists ... and any other app owned by the ConnectWise S-K LLC tenant (...), ... and disable them without deleting"'
  summary: 'Fails the ''derived from the cited mechanics'' and ''executable without re-reading'' tests: one ~170-word action bundles four tasks (find, disable, extended log review, evidence preservation) and orders every ConnectWise-named and owner-tenant app disabled. The sources condition that: Huntress ''If you cannot verify one is safe, disable it as well''; Todyl ''Disable any you don''t use''; ConnectWise ''do not infer compromise from a name alone'' and ''assess business impact before removing unrelated legitimate integrations''. ''Every ConnectWise ... application'' also reaches products outside the incident (the body scopes it to Cloud Backup and Cloud Management). Fix: keep the seven listed IDs as the disable list, make other ConnectWise/SkyKick/owner-tenant apps ''disable if unused or unverified'', and split or trim the clauses.'
- code: F10
  category: missed-angle
  section: coverage (Danfoss entry 2026-10-13, priority high)
  item: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
  url_or_quote: 'Run record: "Danfoss, Copeland and Dixell scope details (S2) ... Copeland acknowledging a flaw in discontinued controllers ... All sources are dated 2026-10-12 to 2026-10-15, outside both windows"'
  summary: 'Judgement call on a high-priority entry. SecurityWeek (2026-10-15) says Copeland ''has since acknowledged a vulnerability'' and ''According to Le Monde, the attackers lengthened defrost cycles from one hour to as many as eight, which delayed alarms''; Cybersecurity Dive (2026-10-15): ''A spokesperson for Copeland confirmed that a vulnerability was found in discontinued end-of-life controllers.'' The covered entry carries neither: its Exposure says CERT-FR ''names no models, flaw or entry vector for the Copeland and Dixell units'', its Detection watches ''defrost, setpoint and account changes'' but not defrost duration or alarm-delay parameters, and its replacement advice names only AK-SM800/AK-SC355. The ''outside the windows'' reason does not apply to a delta on a covered entry; the facts are two-outlet, decision-relevant (EOL xweb means replace, alarm-delay change is a tamper signal). Suggest an improvement record on the Danfoss entry. Query: ''Copeland xweb end-of-life vulnerability
    acknowledged supermarket defrost alarm delay''.'
