items:
  - title: "THORChain GG20 Threshold Signature Scheme vault compromise — $11M drained across nine chains; Chainalysis traces pre-attack infrastructure; recovery portal live (Switzerland)"
    sources:
      - url: "https://therecord.media/more-than-10-million-stolen-crypto-platform-thorchain"
        publisher: "The Record (Recorded Future News)"
        date: "2026-05-15"
        role: "primary"
      - url: "https://www.trmlabs.com/resources/blog/thorchain-exploit-drains-usd-11m-across-at-least-nine-chains-what-trm-knows-now"
        publisher: "TRM Labs"
        date: "2026-05-15"
        role: "primary"
      - url: "https://www.cryptotimes.io/2026/05/17/10-8-million-drained-inside-the-thorchain-exploit-that-froze-cross-chain-defi-for-13-hours/"
        publisher: "CryptoTimes"
        date: "2026-05-17"
        role: "corroborating"
    discovery_trace: "first seen at: therecord (RSS feed scrape) → The Record article https://therecord.media/more-than-10-million-stolen-crypto-platform-thorchain → corroborated by TRM Labs https://www.trmlabs.com/resources/blog/thorchain-exploit-drains-usd-11m-across-at-least-nine-chains-what-trm-knows-now → fresh Chainalysis analysis referenced in CryptoTimes May 17 https://www.cryptotimes.io/2026/05/17/10-8-million-drained-inside-the-thorchain-exploit-that-froze-cross-chain-defi-for-13-hours/"
    summary: |
      On May 15, 2026, a malicious validator node drained approximately $11 million in protocol-owned funds from THORChain, a Switzerland-based decentralised cross-chain liquidity protocol, across nine blockchains (Bitcoin, Ethereum, BSC, Base, Avalanche, DOGE, LTC, BCH, XRP). The leading technical hypothesis is a GG20 Threshold Signature Scheme (TSS) exploit: the attacker ran a node (identified as thor16ucjv3v695mq283me7esh0wdhajjalengcn84q) that joined the active validator set days before the attack, gradually leaked vault key shards during keygen/signing rounds, reconstructed sufficient key material offline, and then forged outbound vault signatures without triggering quorum checks. Chainalysis published a five-part on-chain thread on May 16 linking attacker-controlled wallets to weeks of preparatory infrastructure staging through Monero and Hyperliquid before the vault drain. TRM Labs traced fund flows to a two-address cluster within hours and noted that cross-chain movement shortened traditional attribution timelines; as of May 15, TRM has not attributed the exploit to any specific actor. The THORChain treasury launched a recovery portal on May 16 (claims deadline June 4, 2026) backed by a treasury-funded refund pool; protocol-owned assets were the target, with 12,847 user wallets reporting affected swap positions. North Korean actors (Lazarus Group) are historically the primary launderers on THORChain—including the $1.5B Bybit and ~$300M KelpDAO thefts—but no confirmed attribution for this exploit. The TSSHOCK class of MPC-TSS vulnerabilities (GG20/cggmp21/cggmp24) provides the theoretical framework for key-material leakage during distributed signing rounds; defenders operating MPC-custody or cross-chain bridge infrastructure should audit node-admission controls and keygen/signing quorum integrity.
    ch_eu_nexus: "Direct: THORChain incorporated in Switzerland. Protocol-owned losses; user funds reported unaffected but recovery portal necessary for 12,847 affected swap positions. European DeFi infrastructure and custody providers using THORChain cross-chain routing are in scope."
    public_sector_nexus: "indirect — financial-infrastructure / digital-asset custody; relevant to Swiss FINMA-supervised entities and EU MiCA-regulated DeFi platforms"
    sector: "finance, fintech, digital-assets"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "One of THORChain's six vaults was compromised, though the platform's automated systems detected abnormal behavior and halted signing activity, preventing further losses. User funds were reportedly unaffected, with only protocol-owned assets impacted."
        attribution: "The Record (Recorded Future News)"
        source_url: "https://therecord.media/more-than-10-million-stolen-crypto-platform-thorchain"
      - quote: "At the time of writing, TRM has not attributed the May 15 exploit to any specific actor."
        attribution: "TRM Labs"
        source_url: "https://www.trmlabs.com/resources/blog/thorchain-exploit-drains-usd-11m-across-at-least-nine-chains-what-trm-knows-now"
      - quote: "the operator (or a compromised machine acting as the operator) exploited a vulnerability in the GG20 Threshold Signature Scheme implementation. Rather than a single dramatic key compromise, the attack appears to have involved the gradual leakage of vault key material during keygen or signing rounds — the kind of malformed-proof exploitation that the TSSHOCK class of CVEs first put on the industry's radar a few years ago."
        attribution: "CryptoTimes (citing Chainalysis, PeckShield, Cyvers)"
        source_url: "https://www.cryptotimes.io/2026/05/17/10-8-million-drained-inside-the-thorchain-exploit-that-froze-cross-chain-defi-for-13-hours/"
    extended_notes: |
      Defender angle: Organisations running MPC (multi-party computation) custody or cross-chain bridge validator infrastructure should audit node-admission controls — specifically the mechanism by which new nodes join signing quorums, how key shards are distributed during keygen, and whether any node can participate in signing rounds before completing a full security review. The TSSHOCK vulnerability class (CVE-2023-33242 and related GG20/ECDSA-MPC research) showed that malformed zero-knowledge proof submissions during GG20 keygen can leak private key shards across multiple rounds. Detection signal: anomalous outbound vault transactions (large, multi-chain, near-simultaneous) combined with a newly-churned validator node joining the signing set within days of the event. Chainalysis on-chain trace (Monero → Hyperliquid → THORChain) shows attacker pre-staged exit infrastructure across multiple chains to complicate attribution. THORChain has had six significant exploits since 2021; cumulative losses approximately $25M before this event.

  - title: "Tycoon2FA PhaaS survives March 2026 takedown, pivots to OAuth device-code flow to bypass MFA on Microsoft 365 — infrastructure migrated to BunnyCDN (awareness item; no named breach victims in window)"
    sources:
      - url: "https://www.bleepingcomputer.com/news/security/tycoon2fa-hijacks-microsoft-365-accounts-via-device-code-phishing/"
        publisher: "BleepingComputer"
        date: "2026-05-17"
        role: "primary"
      - url: "https://www.esentire.com/blog/tycoon-2fa-operators-adopt-oauth-device-code-phishing"
        publisher: "eSentire Threat Response Unit"
        date: "2026-05-12"
        role: "corroborating"
    discovery_trace: "first seen at: bleepingcomputer RSS feed https://www.bleepingcomputer.com/feed/ (May 17 entry) → article https://www.bleepingcomputer.com/news/security/tycoon2fa-hijacks-microsoft-365-accounts-via-device-code-phishing/ → eSentire primary research https://www.esentire.com/blog/tycoon-2fa-operators-adopt-oauth-device-code-phishing"
    summary: |
      Tycoon2FA — the Phishing-as-a-Service kit disrupted by a Microsoft/Europol coalition in March 2026 (330+ domains seized, Cloudflare Workers infrastructure disabled) — has rebuilt its infrastructure within weeks and pivoted from credential-relay (AiTM) phishing to OAuth 2.0 Device Authorization Grant flow abuse targeting Microsoft 365 accounts. eSentire's TRU documented a late-April 2026 campaign delivering a four-layer browser chain (Trustifi click-tracking → Cloudflare Workers → AES-GCM-encrypted JavaScript → fake Microsoft CAPTCHA) that culminates in the victim pasting an attacker-supplied device code into legitimate microsoft.com/devicelogin infrastructure. Because the victim completes MFA on the genuine Microsoft endpoint, MFA triggers and succeeds — but the token is issued to an attacker-registered device rather than the victim's. The attacker gains access tokens for the full Microsoft 365 surface (Exchange Online, SharePoint, OneDrive, Teams, Graph API) while Entra ID logs the event as a normal application sign-in. New infrastructure migrated from Cloudflare to BunnyCDN, directly responding to the takedown's targeting of Cloudflare-hosted C2. Kit retains fingerprints: CryptoJS AES-CBC with hardcoded key "1234567890123456"; Microsoft Authentication Broker AppId 29d9ed98-a469-4536-ade2-f981bc1d605e used to broker cross-service tokens. MITRE ATT&CK: T1566 (Phishing), T1528 (Steal Application Access Token), T1550.001 (Use Alternate Authentication Material — Application Access Token), T1078.004 (Cloud Accounts). Detection: Entra sign-in logs for Device Code flow (AuthenticationProtocol = "deviceCode") from unfamiliar device; Continuous Access Evaluation (CAE) revocation on sign-in anomalies; Entra Conditional Access policy to block device-code flows from untrusted networks. No named victim organisations disclosed in the window.
    ch_eu_nexus: "global; EU Microsoft 365 tenants across all sectors in scope; post-takedown resilience demonstrates that coordinated disruption has not eliminated the operational capability"
    public_sector_nexus: "indirect — Microsoft 365 is the dominant platform for EU public-sector email and document collaboration; device-code phishing bypasses MFA for all MFA methods except FIDO2 phishing-resistant"
    sector: "all sectors (Microsoft 365 tenants)"
    cves: []
    actors_campaigns_malware: ["Tycoon2FA"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Doing so authorizes the attacker to register a rogue device with the victim's Microsoft 365 account, giving them unrestricted access to the victim's data and services, including email, calendar, and cloud file storage."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/tycoon2fa-hijacks-microsoft-365-accounts-via-device-code-phishing/"
      - quote: "the user's MFA worked exactly as designed — yet attackers obtained tokens because victims unknowingly authorized an attacker-controlled device rather than authenticating themselves"
        attribution: "eSentire Threat Response Unit"
        source_url: "https://www.esentire.com/blog/tycoon-2fa-operators-adopt-oauth-device-code-phishing"

