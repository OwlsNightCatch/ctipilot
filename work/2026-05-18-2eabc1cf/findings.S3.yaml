  - title: "DFIR Report Flash Alert: EtherRAT blockchain-C2 + TukTuk SaaS-C2 chain ends in Gentleman ransomware — novel multi-stage C2 evasion via EtherHiding and dead-drop resolver over Arweave"
    sources:
      - url: "https://thedfirreport.com/2026/05/11/flash-alert-etherrat-and-tuktuk-c2-end-in-the-gentleman-ransomware/"
        publisher: "The DFIR Report"
        date: "2026-05-11"
        role: "primary"
      - url: "https://www.sysdig.com/blog/etherrat-dprk-uses-novel-ethereum-implant-in-react2shell-attacks"
        publisher: "Sysdig"
        date: "2025-12-01"
        role: "background — initial EtherRAT disclosure"
      - url: "https://atos.net/en/lp/cybershield/etherrat-distribution-spoofing-administrative-tools-via-github-facades"
        publisher: "Atos"
        date: "2026-03-01"
        role: "background — Windows EtherRAT campaign"
    discovery_trace: "first seen at: dfirreport, URL https://thedfirreport.com/feed/ → primary: DFIR Report, URL https://thedfirreport.com/2026/05/11/flash-alert-etherrat-and-tuktuk-c2-end-in-the-gentleman-ransomware/ → corroborating: WebSearch confirmed Sysdig and Atos prior coverage of EtherRAT"
    summary: |
      In April 2026, DFIR Report observed a complete intrusion chain beginning with a malicious MSI masquerading as Sysinternals RAMMap (T1204.002 User Execution — Malicious File) that installed EtherRAT. EtherRAT uses EtherHiding — the Ethereum blockchain — to dynamically update its C2 configuration, making traditional network-layer C2 blocking ineffective; defenders cannot sinkhole a blockchain address. The threat actor then deployed TukTuk (a modular AI-generated implant framework, first disclosed by researcher Evangelos G.) via DLL sideloading of legitimately signed Greenshot, SyncTrayzor, DocFX, and Cake binaries (T1574.002). TukTuk establishes primary C2 over ClickHouse and Supabase SaaS APIs, with fallback channels via Ably, Dropbox, GitHub Issues, Slack, and Neon; and uses Arweave (a blockchain storage network) as a dead-drop resolver to retrieve an encrypted configuration blob containing the full C2 credential pool — allowing operators to rotate all C2 channels without touching the implant. Lateral movement proceeded via Kerberoasting, LSASS credential dumping (Mimikatz), NetExec, and GoTo Resolve RMM deployment via GPO (T1021.002, T1003.001, T1072). Data was exfiltrated to Wasabi S3 via Rclone before Gentleman ransomware was deployed domain-wide, preceded by Defender disablement, shadow copy deletion (vssadmin), and event log clearing (T1490, T1562.001, T1070.001). Detection opportunities: monitor for MSI installs that spawn processes making Ethereum RPC calls (eth_call to smart contract addresses), unexpected TLS connections to *.supabase.co, *.clickhouse.cloud, or arweave.net from non-browser parent processes; Sysmon EID 1 chains where Greenshot.exe or SyncTrayzor.exe load unexpected DLLs; and GoTo Resolve (GoToResolve.exe) or RMM beacons deployed outside normal IT change windows.
    ch_eu_nexus: "Gentleman RaaS has claimed ~332 victims in first five months of 2026 (second most active RaaS); Sysdig initial disclosure linked to DPRK-adjacent React2Shell exploitation — EU targets plausible given multi-sector scope"
    public_sector_nexus: "indirect — Gentleman RaaS targets broad verticals; EtherHiding/SaaS C2 evasion bypasses traditional proxy/firewall C2 detection commonly used in public sector environments"
    sector: "multi-sector"
    cves: [CVE-2025-55182]
    actors_campaigns_malware: ["The Gentleman", "EtherRAT", "TukTuk", "Gentleman RaaS"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    recency_note: "SOURCE PUBLISHED 2026-05-11 — outside 36h window. Included because: (a) not in prior_coverage.json despite Gentleman RaaS being in weekly W21 as a different facet; (b) unique detection engineering content for EtherHiding/SaaS C2/Arweave dead-drop; (c) this specific DFIR flash-alert has not been previously surfaced."
