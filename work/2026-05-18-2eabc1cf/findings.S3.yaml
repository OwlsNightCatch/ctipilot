  - title: "Microsoft IR: 123-day MSP-mediated intrusion via HPOM VBScript delivery, malicious Windows Network Provider (NPLogonNotify) and LSA password filter for persistent cleartext credential harvesting"
    sources:
      - url: "https://www.microsoft.com/en-us/security/blog/2026/05/12/undermining-the-trust-boundary-investigating-a-stealthy-intrusion-through-third-party-compromise/"
        publisher: "Microsoft Security Blog / Microsoft Incident Response"
        date: "2026-05-12"
        role: "primary"
    discovery_trace: "first seen at: msft-secblog RSS, URL https://www.microsoft.com/en-us/security/blog/feed/ → primary: Microsoft Security Blog, URL https://www.microsoft.com/en-us/security/blog/2026/05/12/undermining-the-trust-boundary-investigating-a-stealthy-intrusion-through-third-party-compromise/ (no pivot needed)"
    summary: |
      Microsoft Incident Response documented a 123-day intrusion in which the threat actor operated entirely through a compromised third-party IT services provider (MSP) running HPE Operations Manager (HPOM), blending attack commands into the legitimate HPOM/HPE-OA monitoring framework (T1199 Trusted Relationship). Initial foothold: two internet-facing web servers (WEB-01, WEB-02) had webshells (Errors.aspx) with no identifiable exploit path; the actor then used the trusted HPOM console to push VBScript (abc003.vbs) to domain controllers performing system discovery (T1016, T1082, T1087). Credential access phase (Days 9–14): the actor registered a malicious Windows Network Provider DLL (mslogon.dll) on DC01 via the HPOM channel, abusing NPLogonNotify and NPPasswordChangeNotify APIs to intercept cleartext credentials at every interactive logon and password change; credentials stored to C:\Users\Public\Music\abc123c.d (T1556 Modify Authentication Process). Days 24–32: persistent web shells deployed on IIS-facing servers. Days 54–55: a malicious LSA password filter (passms.dll) registered into the LSSASS authentication stack via LSA notification packages configuration on DC01/DC02, capturing credentials during password resets even after detection (T1556.002). The attack re-established persistence on Day 106 after initial detection. Detection: monitor for unknown DLLs in HKLM\SYSTEM\CurrentControlSet\Control\NetworkProvider\Order (unexpected Network Providers); LSA notification packages registry key (HKLM\SYSTEM\CurrentControlSet\Control\Lsa\Notification Packages) for unexpected entries; Event IDs 4624 (logon) sourced from HPOM/monitoring-agent parent processes; and any process writing cleartext files to Public\Music or similar low-visibility public paths. Hardening: restrict HPOM/RMM agent to least-privilege accounts, require signed DLLs in Network Provider and LSA filter registration, enforce LSA Protection (Credential Guard) to block arbitrary LSASS extension loading.
    ch_eu_nexus: "MSP/third-party trust-boundary attacks are particularly relevant to Swiss federal and cantonal IT environments that commonly outsource infrastructure monitoring; HPOM is deployed across European public-sector and critical-infrastructure environments"
    public_sector_nexus: "direct — intrusion via trusted MSP monitoring agent is a primary attack path against outsourced public-sector IT"
    sector: "public-sector, managed-services"
    cves: []
    actors_campaigns_malware: []
    verification: SINGLE-SOURCE
    confidence: HIGH
    novelty: new
    recency_note: "SOURCE PUBLISHED 2026-05-12 — outside strict 36h window. Included because: (a) not in prior_coverage.json; (b) high detection engineering value for MSP/HPOM abuse pattern; (c) SINGLE-SOURCE with high-reliability national-CERT-equivalent publisher (Microsoft IR official blog)."
    evidence:
      - quote: "The threat actor registered a legitimate network provider named mslogon on the domain controller DC01 through the same HP OA to hijack the authentication process. Network providers integrate into the Windows authentication mechanism, allowing the threat actor to capture cleartext user credentials during user sign-in and password changes."
        attribution: "Microsoft Incident Response"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/05/12/undermining-the-trust-boundary-investigating-a-stealthy-intrusion-through-third-party-compromise/"
      - quote: "The threat actor registered a malicious password filter, passms.dll, into the Windows authentication process by adding it to the Local Security Authority (LSA) notification package configuration. Password filters are loaded by the Local Security Authority Subsystem Service (LSASS) on domain controllers and are invoked whenever a password is set or changed."
        attribution: "Microsoft Incident Response"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/05/12/undermining-the-trust-boundary-investigating-a-stealthy-intrusion-through-third-party-compromise/"

  - title: "Unit 42: Active Directory Certificate Services ESC1 + shadow credentials — Fighting Ursa (APT28/Fancy Bear) real-world TTPs, ADExplorer + Certipy enumeration fingerprints"
    sources:
      - url: "https://unit42.paloaltonetworks.com/active-directory-certificate-services-exploitation/"
        publisher: "Unit 42 / Palo Alto Networks"
        date: "2026-05-11"
        role: "primary"
      - url: "https://techjacksolutions.com/scc-intel/ad-cs-exploitation-persists-esc1-shadow-credentials-and-detection-gaps-enable-domain-compromise/"
        publisher: "Cybersecurity Intelligence (aggregator)"
        date: "2026-05-11"
        role: "corroborating — summary of Unit 42 findings"
    discovery_trace: "first seen at: unit42 RSS feed, URL https://unit42.paloaltonetworks.com/feed/ → primary: Unit 42, URL https://unit42.paloaltonetworks.com/active-directory-certificate-services-exploitation/ → corroborating: WebSearch query 'Unit42 AD CS Escalation Fighting Ursa shadow credentials ESC1 Certipy May 2026'"
    summary: |
      Unit 42 (authors Stav Setty, Tom Fakterman, Shachar Roitman) published an operational analysis of AD CS exploitation anchored in Fighting Ursa (APT28/GRU Unit 26165) intrusions, covering two complementary privilege-escalation paths. ESC1 (template misconfiguration): attackers enumerate available certificate templates using Certify or Certipy via LDAP queries against the Active Directory configuration naming context (CN=Enrollment Services); a template marked with ENROLLEE_SUPPLIES_SUBJECT + Client Authentication EKU allows requesting a certificate for any principal, including domain admins — the resulting cert is used for Kerberos PKINIT authentication or pass-the-hash via S4U2Self (T1649 Steal or Forge Authentication Certificates, T1558 Steal or Forge Kerberos Tickets). Shadow credentials: attackers write an attacker-controlled key credential attribute (msDS-KeyCredentialLink) to a target user or computer object via LDAP (requires write access to the object or WriteDACL/GenericWrite); the Certipy shadow auto command performs the full ESC14/key-credential chain. ADExplorer was observed during reconnaissance to dump full AD structure before template exploitation. Detection: alert on repeated LDAP queries to CN=Certificate Templates (especially from non-PKI-admin accounts); Sysmon EID 4768/4769 (Kerberos TGT/service requests) using certificate-based pre-authentication; 5136 (directory service object modification) on msDS-KeyCredentialLink attribute; Certify/Certipy process names or SHA hashes; ADExplorer.exe with output file flag (-snapshot). Hardening: remove ENROLLEE_SUPPLIES_SUBJECT from all certificate templates that grant Client Authentication EKU; enforce Certificate Manager approval for sensitive templates; restrict WriteDACL/GenericWrite on computer objects to Tier-0 accounts only; enable CA audit logging for certificate requests (Event ID 4870).
    ch_eu_nexus: "AD CS misconfigurations are endemic in enterprise Active Directory environments; Fighting Ursa/APT28 is actively targeting European government and critical infrastructure; ESC1 exploitation requires no pre-existing Domain Admin foothold — makes it a high-priority hunt for any AD forest"
    public_sector_nexus: "direct — Swiss federal and cantonal AD forests frequently inherit legacy ADCS configurations; Fighting Ursa attribution makes this high-priority for government threat hunters"
    sector: "public-sector, government, defense"
    cves: [CVE-2022-26923]
    actors_campaigns_malware: ["Fighting Ursa", "APT28", "Fancy Bear"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    recency_note: "SOURCE PUBLISHED 2026-05-11 — outside strict 36h window. Included because: (a) not in prior_coverage.json; (b) Fighting Ursa attribution makes it high-priority for EU/CH public sector; (c) actionable detection engineering content for ADCS — a pervasive attack surface."
    evidence:
      - quote: "The threat actor used tools such as ADExplorer and Certipy to collect certificate services and Active Directory data from target environments prior to further exploitation."
        attribution: "Unit 42 (via WebSearch extraction)"
        source_url: "https://unit42.paloaltonetworks.com/active-directory-certificate-services-exploitation/"
      - quote: "A typical ESC1 attack begins with an adversary enumerating available certificate templates using tools such as Certify or Certipy to identify misconfigurations, and once a vulnerable template is discovered, the attacker submits a certificate request impersonating a high-privileged account"
        attribution: "Unit 42 (via WebSearch extraction)"
        source_url: "https://unit42.paloaltonetworks.com/active-directory-certificate-services-exploitation/"

