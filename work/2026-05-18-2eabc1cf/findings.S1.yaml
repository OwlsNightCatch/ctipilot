  - title: "UPDATE: CVE-2026-42897 Exchange OWA XSS — Exchange Team Blog (2026-05-17) clarifies EM Service requires active connectivity to officemitigations.microsoft.com; permanent patch still pending"
    sources:
      - url: "https://techcommunity.microsoft.com/blog/exchange/addressing-exchange-server-may-2026-vulnerability-cve-2026-42897/4518498"
        publisher: "Microsoft Exchange Team Blog"
        date: "2026-05-17"
        role: "primary"
      - url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-42897"
        publisher: "Microsoft MSRC"
        date: "2026-05-14"
        role: "corroborating"
    discovery_trace: "first seen at: MSRC bridge `msrc cve CVE-2026-42897` returning `articles` FAQ section citing Exchange Team Blog URL → primary: Exchange Team Blog post at https://techcommunity.microsoft.com/blog/exchange/addressing-exchange-server-may-2026-vulnerability-cve-2026-42897/4518498 (page modified 2026-05-17T13:57:13-07:00) → corroborating: MSRC advisory https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-42897"
    summary: |
      The Microsoft Exchange Team Blog post for CVE-2026-42897 (OWA stored-XSS, exploited in the wild, CVSS 8.1, CWE-79) was last modified 2026-05-17, confirming an operational dependency that defenders must account for: the Exchange Emergency Mitigation Service (EM Service) which deploys the automatic URL Rewrite mitigation requires active outbound HTTPS connectivity from the Exchange server to `officemitigations.microsoft.com`. On-premises Exchange servers in segmented or fully air-gapped network configurations that block this outbound path will NOT have received the automatic mitigation and remain exposed. The vulnerability affects Exchange Server 2016, 2019, and the Subscription Edition (SE); Exchange Online is unaffected. Microsoft has not yet released a permanent cumulative update fix. Exploitation path: attacker sends a crafted email; if the recipient opens it in OWA and meets interaction conditions, arbitrary JavaScript executes in the browser context of the signed-in user — session hijacking / privilege escalation within Exchange.
    ch_eu_nexus: "direct — Exchange Server is deployed by a significant share of EU and Swiss public-sector organisations for sovereign on-premises email"
    public_sector_nexus: "high"
    sector: "government, healthcare, education, finance"
    cves: [CVE-2026-42897]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: update-to-prior:2026-05-17
    evidence:
      - quote: "The Exchange Emergency Mitigation Service will provide mitigation automatically, and is on by default. If it is not already enabled on your Exchange Server, you need to enable Exchange Emergency Mitigation Service."
        attribution: "Microsoft Exchange Team Blog (CVE-2026-42897 FAQ)"
        source_url: "https://techcommunity.microsoft.com/blog/exchange/addressing-exchange-server-may-2026-vulnerability-cve-2026-42897/4518498"
      - quote: "We are working on developing and testing a more permanent fix which we will provide when it meets our quality standards."
        attribution: "Microsoft Exchange Team Blog (CVE-2026-42897 FAQ)"
        source_url: "https://techcommunity.microsoft.com/blog/exchange/addressing-exchange-server-may-2026-vulnerability-cve-2026-42897/4518498"
    extended_notes: |
      Detection and hunt: (1) Confirm EM Service health on each Exchange server via `Get-ExchangeDiagnosticInfo -Server <server> -Process EdgeTransport -Component EmergencyMitigation` — look for Status: Active and the URL Rewrite rule applied. (2) Check Windows Event Log (Microsoft-Windows-IIS-W3SVC-WP / Application) for failed outbound calls to officemitigations.microsoft.com. (3) In OWA access logs, hunt for responses containing `<script>` tags to `GET /owa/` endpoints — anomalous for a mail platform. Hardening: on segmented Exchange environments, verify direct HTTPS access to officemitigations.microsoft.com is permitted or apply the manual URL Rewrite mitigation documented in the blog. Exchange 2016 and 2019 without ESU enrollment become permanently exposed once Mainstream Support ends.

