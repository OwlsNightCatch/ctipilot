items:
  - title: "UPDATE: CVE-2026-42945 NGINX Rift — in-the-wild exploitation confirmed by VulnCheck honeypot network"
    sources:
      - url: "https://thehackernews.com/2026/05/nginx-cve-2026-42945-exploited-in-wild.html"
        publisher: "The Hacker News"
        date: "2026-05-17"
        role: "primary"
      - url: "https://securityaffairs.com/192132/hacking/nginx-rift-an-18-year-old-flaw-in-the-worlds-most-deployed-web-server-just-came-to-light.html"
        publisher: "Security Affairs"
        date: "2026-05-17"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('May 17 18 2026 cybersecurity breach vulnerability exploited new') → primary: The Hacker News article on NGINX exploitation confirmed May 17 2026, URL https://thehackernews.com/2026/05/nginx-cve-2026-42945-exploited-in-wild.html → corroborating: Security Affairs, URL https://securityaffairs.com/192132/hacking/nginx-rift-an-18-year-old-flaw-in-the-worlds-most-deployed-web-server-just-came-to-light.html"
    summary: |
      CVE-2026-42945 ("NGINX Rift"), the 18-year-old heap buffer overflow in ngx_http_rewrite_module (present since NGINX 0.6.27 from 2008, affecting all versions through 1.30.0), has now been confirmed as actively exploited in the wild as of 2026-05-17 per VulnCheck honeypot telemetry. The flaw was publicly disclosed by DepthFirst AI researchers earlier in W21. The overflow is reachable via a crafted HTTP request targeting the rewrite-rule parser at the `ngx_http_script_compile()` function in `src/http/ngx_http_script.c`; exploitation reliably triggers worker-process crashes (DoS), with RCE possible on systems where ASLR is disabled. The vulnerability requires no authentication and no prior foothold — any HTTP-accessible NGINX instance with a rewrite rule in the applicable code path is in scope. Patched in NGINX 1.30.1 (open source) and NGINX Plus R34 P2. The weekly brief (2026-W21) already noted exploitation was confirmed on 2026-05-17; this is the first daily appearance with VulnCheck telemetry as primary evidence.
    ch_eu_nexus: "global; NGINX is deployed at high density in Swiss/EU public-sector web infrastructure, reverse proxies, and WAF configurations"
    public_sector_nexus: "high — NGINX is the dominant reverse proxy and web server in EU government and cantonal IT"
    sector: "all sectors"
    cves: [CVE-2026-42945]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: update-to-prior:2026-W21
    evidence:
      - quote: "CVE-2026-42945 is exploited after disclosure, impacting NGINX 0.6.27–1.30.0 and enabling crashes or RCE"
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/05/nginx-cve-2026-42945-exploited-in-wild.html"
      - quote: "VulnCheck has detected exploitation attempts against its honeypot networks"
        attribution: "The Hacker News (citing VulnCheck)"
        source_url: "https://thehackernews.com/2026/05/nginx-cve-2026-42945-exploited-in-wild.html"
    extended_notes: |
      Detection anchor: NGINX worker crash events (SIGSEGV / SIGABRT from master process respawning workers) in system logs, correlated with inbound HTTP requests carrying unusually long or deeply nested rewrite-rule match strings. Hunt query: `nginx[*]: signal 11 (SIGSEGV) received` in syslog / journald, or equivalent EDR crash-telemetry on the nginx worker process tree. Hardening: upgrade to NGINX 1.30.1 / Plus R34 P2; where immediate upgrade is impossible, review deployed rewrite rules and apply WAF rules to reject requests with pathological rewrite-match patterns. RCE only on ASLR-off configurations; ASLR-on systems face reliable DoS only.

