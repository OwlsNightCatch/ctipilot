        role: "corroborating"
      - url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0159"
        publisher: "NCSC-NL"
        date: "2026-05-15"
        role: "corroborating"
      - url: "https://www.helpnetsecurity.com/2026/05/15/exchange-server-cve-2026-42897-exploited/"
        publisher: "Help Net Security"
        date: "2026-05-15"
        role: "corroborating"
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12577 (bridge ncsc-csh recent 20) → primary: Microsoft MSRC, URL https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-42897 → pivot: Microsoft Exchange Team Blog, URL https://techcommunity.microsoft.com/blog/exchange/addressing-exchange-server-may-2026-vulnerability-cve-2026-42897/4518498 → corroborating: NCSC-NL advisory NCSC-2026-0159"
    summary: |
      CVE-2026-42897 (CVSS 3.1: 8.1 High; MSRC severity: Critical; Microsoft vectorString CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:N) is a stored cross-site scripting flaw (CWE-79) in Microsoft Exchange Server's Outlook Web Access (OWA) component. An unauthenticated attacker sends a specially crafted email; if the recipient opens it in OWA (Exchange Mailbox server HTTP handler for the OWA virtual directory), arbitrary JavaScript executes in the victim's browser context — enabling session-token theft, credential phishing within the authenticated OWA session, or further lateral movement via OWA API calls. Exploitation requires only the victim to open the email in OWA; no additional interaction beyond that user action is documented. Exchange Online is unaffected; only on-premises Exchange Server 2016, 2019, and Subscription Edition (SE) are in scope. Microsoft has confirmed active exploitation in the wild ("Exploitation Detected") and added CVE-2026-42897 to the CISA KEV catalog on 2026-05-15, requiring FCEB agencies to remediate by 2026-05-29. No permanent patch exists as of 2026-05-18; Exchange 2016/2019 without Period 2 ESU enrolment will not receive the permanent fix. Temporary mitigation: the Exchange Emergency Mitigation Service (EEMS) automatically deploys a URL-rewrite mitigation (labelled M2.1.x) if the Windows service is enabled (default). Manual application: run .\EOMT.ps1 -CVE "CVE-2026-42897" from an elevated Exchange Management Shell — single server or Get-ExchangeServer pipeline for all servers. A cosmetic status display bug ("Mitigation invalid for this exchange version") does not affect actual mitigation application if status shows "Applied".
    ch_eu_nexus: "Direct: on-premises Exchange Server remains common in Swiss federal offices, cantonal governments, and EU member-state public-sector organisations. NCSC-CH and NCSC-NL both published advisories within 24 h of Microsoft disclosure."
    public_sector_nexus: "direct — on-premises Exchange still prevalent in Swiss Bundesverwaltung and EU public-sector mail infrastructure"
    sector: "government, public-sector, education, critical infrastructure"
    cves: [CVE-2026-42897]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "An attacker could exploit this issue by sending a specially crafted email to a user. If the user opens the email in Outlook Web Access and certain interaction conditions are met, arbitrary JavaScript can be executed in the browser context."
        attribution: "Microsoft MSRC (FAQ for CVE-2026-42897)"
        source_url: "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-42897"
      - quote: "The U.S. Cybersecurity and Infrastructure Security Agency (CISA), on May 15, 2026, added CVE-2026-42897 to its Known Exploited Vulnerabilities (KEV) catalog, requiring Federal Civilian Executive Branch (FCEB) agencies to apply the necessary mitigations by May 29, 2026."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/05/on-prem-microsoft-exchange-server-cve.html"
      - quote: "Microsoft, which tagged the vulnerability with an 'Exploitation Detected' assessment, said an attacker could weaponize it by sending a crafted email to a user."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/05/on-prem-microsoft-exchange-server-cve.html"
    extended_notes: |
      Detection: monitor Exchange mailbox server HTTP logs (IIS W3C) and Exchange audit logs for anomalous POST requests to the OWA virtual directory, particularly to /owa/auth/ and /owa/ev.owa2 endpoints. EDR telemetry: look for w3wp.exe spawning unexpected child processes. EEMS mitigation adds a URL-rewrite rule — confirm presence by checking \Exchange Server\V15\Bin\EEMS\ logs for M2.1.x application. Hardening: organisations on Exchange 2016/2019 without ESU should evaluate urgent migration to Exchange SE or Exchange Online given the absence of a permanent fix path.

  - title: "NGINX Rift CVE-2026-42945 — 18-year-old heap buffer overflow in ngx_http_rewrite_module; public PoC, DoS/RCE, no ITW exploitation confirmed"
    sources:
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12575"
        publisher: "NCSC-CH Security Hub"
        date: "2026-05-15"
        role: "primary"
      - url: "https://depthfirst.com/nginx-rift"
        publisher: "depthfirst.com (AI-assisted vulnerability researcher who found the bug)"
        date: "2026-05-15"
        role: "primary"
      - url: "https://my.f5.com/manage/s/article/K000161019"
        publisher: "F5 (vendor advisory)"
        date: "2026-05-13"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/security/18-year-old-nginx-vulnerability-allows-dos-potential-rce/"
        publisher: "BleepingComputer"
        date: "2026-05-15"
        role: "corroborating"
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12575 (bridge ncsc-csh recent 20) → primary: F5 vendor advisory, URL https://my.f5.com/manage/s/article/K000161019 → primary: depthfirst.com technical writeup, URL https://depthfirst.com/nginx-rift → corroborating: BleepingComputer"
    summary: |
      CVE-2026-42945 ("NGINX Rift") is a heap buffer overflow in the ngx_http_rewrite_module — the component that handles rewrite/return/set directives. The root cause is a two-pass architecture: a size-estimation pass and a subsequent write pass handle named vs. unnamed PCRE capture groups differently under specific rewrite directive patterns (configurations using unnamed captures $1, $2 etc.). Under the miscounting condition, the allocated heap buffer is smaller than the write pass requires, producing a heap overflow. Exploitation by an unauthenticated remote attacker via a single crafted HTTP request can reliably crash the NGINX worker process (DoS). RCE has been demonstrated by researchers only when ASLR is disabled on the host — production Linux deployments with ASLR enabled are not currently demonstrated to be RCE-reachable. A public proof-of-concept is available on GitHub (depthfirstdisclosures/nginx-rift). Affected: NGINX Open Source 0.6.27 through 1.30.0 and NGINX Plus R32 through R36, plus F5 NGINX Instance Manager, NGINX Ingress Controller, NGINX Gateway Fabric, NGINX App Protect WAF, F5 WAF for NGINX, and NGINX App Protect DoS. Patched: NGINX Open Source 1.30.1 / 1.31.0; NGINX Plus R32 P6, R36 P4, 37.0.0. Interim mitigation: replace unnamed PCRE captures ($1, $2) with named captures in all rewrite configurations. Exploitation status: unknown in-the-wild as of 2026-05-18; PoC is public which raises exploitation-attempt risk.
    ch_eu_nexus: "NGINX is the most widely deployed web server / reverse-proxy in Swiss and EU public-sector and government web infrastructure. The NCSC-CH published this advisory within hours of disclosure."
    public_sector_nexus: "indirect — NGINX widely used in government web portals, API gateways, and reverse-proxy tiers across CH/EU public sector"
    sector: "cross-sector (web infrastructure)"
    cves: [CVE-2026-42945]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Successful exploitation allows unauthenticated remote attackers to degrade service availability or potentially gain system control via crafted HTTP requests. Prerequisites: Requires specific rewrite directive patterns with unnamed PCRE captures. Achieving RCE additionally requires the host system to have Address Space Layout Randomization (ASLR) disabled."
        attribution: "NCSC-CH Security Hub post #12575"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12575"
      - quote: "CVE-2026-42945 CVSS 4.0: 9.2 (CRITICAL) - Heap buffer overflow enabling unauthenticated RCE or DoS"
        attribution: "NCSC-CH Security Hub post #12575"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12575"
    extended_notes: |
      Detection: NGINX access logs showing repeated 502/workers restart events from the same source IP with unusual URL patterns in rewrite-heavy configurations. Check error.log for "worker process exited on signal" patterns. Hardening: verify all rewrite configurations do not use unnamed captures — convert to named captures (?P<name>...) syntax. Upgrade to 1.30.1/1.31.0 or NGINX Plus R32 P6/R36 P4. MITRE ATT&CK: T1190 (Exploit Public-Facing Application).

  - title: "Windows YellowKey + GreenPlasma zero-days (no CVE) — BitLocker bypass via WinRE FsTx files and CTFMON LPE; no patch, partial PoC public"
    sources:
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12574"
        publisher: "NCSC-CH Security Hub"
        date: "2026-05-14"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/security/windows-bitlocker-zero-day-gives-access-to-protected-drives-poc-released/"
        publisher: "BleepingComputer"
        date: "2026-05-13"
        role: "primary"
      - url: "https://www.theregister.com/security/2026/05/13/disgruntled-researcher-releases-two-more-microsoft-zero-days/5239758"
        publisher: "The Register"
        date: "2026-05-13"
        role: "corroborating"
      - url: "https://github.com/Nightmare-Eclipse/YellowKey"
        publisher: "GitHub / Nightmare-Eclipse (researcher)"
        date: "2026-05-13"
        role: "corroborating"
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12574 (bridge ncsc-csh recent 20) → primary: BleepingComputer article, URL https://www.bleepingcomputer.com/news/security/windows-bitlocker-zero-day-gives-access-to-protected-drives-poc-released/ → corroborating: The Register, URL https://www.theregister.com/security/2026/05/13/disgruntled-researcher-releases-two-more-microsoft-zero-days/5239758"
    summary: |
      Researcher Nightmare-Eclipse (also Chaotic Eclipse) publicly released two unpatched Windows vulnerabilities on 2026-05-13, directly after the May 2026 Patch Tuesday. YellowKey is a BitLocker bypass affecting Windows 11 (24H2) and Windows Server 2022/2025: the attacker places crafted 'FsTx' files on a USB drive or the EFI partition of the target drive, boots into the Windows Recovery Environment (WinRE), and triggers a shell by holding CTRL during a specific WinRE code path. WinRE's log-replay mechanism processes the FsTx files and removes the file that normally locks down the recovery shell, dropping the attacker into a command prompt with the BitLocker-protected volume already mounted and readable. Physical access to the device is required; no BitLocker recovery key is needed for the current public PoC (which targets TPM-only configurations). GreenPlasma targets the CTFMON.EXE component (Windows text services framework) for local privilege escalation to SYSTEM; the researcher published partial exploit code — weaponization requires additional development effort and triggers a UAC consent prompt in default configurations, making a silent exploit not yet production-ready. No CVE identifiers have been assigned; Microsoft did not include patches in the May 2026 Patch Tuesday. Mitigation for YellowKey: implement a pre-boot BitLocker PIN (not TPM-only) and set a BIOS/UEFI boot password to prevent WinRE access from an external drive. This is the fourth and fifth zero-day disclosures from the same researcher since April 2026 (previous: BlueHammer CVE-2026-33825, RedSun, UnDefend); the prior LPE vulnerabilities (BlueHammer, RedSun) were exploited in the wild shortly after disclosure.
    ch_eu_nexus: "Direct: Windows fleet management policy and BitLocker implementation are core Swiss federal IT controls; stolen government laptops with TPM-only BitLocker configuration are now a higher-priority breach notification risk. NCSC-CH published this as advisory #12574."
    public_sector_nexus: "direct — government device management; BitLocker-protected endpoint devices in public-sector environments"
    sector: "government, public-sector, enterprise"
    cves: []
    actors_campaigns_malware: ["Nightmare-Eclipse / Chaotic Eclipse (independent researcher)"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "A cybersecurity researcher has published proof-of-concept (PoC) exploits for two unpatched Microsoft Windows vulnerabilities named YellowKey and GreenPlasma, which are a BitLocker bypass and a privilege-escalation flaw."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/windows-bitlocker-zero-day-gives-access-to-protected-drives-poc-released/"
      - quote: "If [the researcher's claim] holds up, a stolen laptop stops being a hardware problem and becomes a breach notification."
        attribution: "The Register (quoting Rik Ferguson, Forescout)"
        source_url: "https://www.theregister.com/security/2026/05/13/disgruntled-researcher-releases-two-more-microsoft-zero-days/5239758"
      - quote: "Physical access, capability to boot into Windows Recovery Environment, and a TPM-only BitLocker configuration (for the currently public PoC). No official vendor patches are currently available. Temporary: Implement BIOS passwords and setting a BitLocker PIN mitigates the current public PoC."
        attribution: "NCSC-CH Security Hub post #12574"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12574"
    extended_notes: |
      Detection: WinRE invocations outside documented IT maintenance windows; Sysmon EID 13 changes to HKLM\BCD00000000 or EFI partition write activity; USB storage device connect events (EID 2100 in Windows Storage). Hardening: Group Policy to require pre-boot authentication (Computer Configuration > Administrative Templates > Windows Components > BitLocker Drive Encryption > Operating System Drives: "Require additional authentication at startup" with "Configure TPM startup PIN" set to "Require startup PIN with TPM"). MITRE ATT&CK: T1600 (Weaken Encryption), T1068 (Exploitation for Privilege Escalation) for GreenPlasma.

  - title: "CERT-PL discloses DHTMLX Gantt/Scheduler/Diagram vulnerabilities (CVE-2026-41553 unauthenticated RCE via Node.js JS injection, CVE-2026-7182 path traversal) — public sector scheduling/project tools at risk"
    sources:
      - url: "https://cert.pl/en/posts/2026/05/CVE-2026-7182/"
        publisher: "CERT Polska (CERT-PL)"
        date: "2026-05-15"
        role: "primary"
      - url: "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-30537"
        publisher: "ENISA EUVD"
        date: "2026-05-15"
        role: "corroborating"
    discovery_trace: "first seen at: enisa-euvd bridge (enisa-euvd recent lastvulnerabilities) → three DHTMLX entries with CERT-PL assigner → primary: CERT-PL advisory, URL https://cert.pl/en/posts/2026/05/CVE-2026-7182/ → corroborating: ENISA EUVD entries EUVD-2026-30537 / EUVD-2026-30538 / EUVD-2026-30539"
    summary: |
      CERT Polska disclosed three vulnerabilities in DHTMLX software on 2026-05-15 following coordinated disclosure. CVE-2026-41553 (CVSS 4.0: 10.0 Critical; ENISA EPSS 0.39) is an unauthenticated remote code execution vulnerability in DHTMLX's PDF Export Module (versions 0.3.3 through 0.7.5) affecting Gantt and Scheduler. The attack surface is the `data` parameter in the PDF export endpoint: the parameter value is processed by a Node.js server-side renderer without sanitisation, enabling an attacker to inject arbitrary JavaScript that Node.js executes server-side. Full server compromise is achievable. CVE-2026-41552 (CVSS 4.0: 9.2 Critical) is a path traversal in the same PDF Export Module's HTML processor: an unauthenticated attacker sets the `src` attribute in a crafted HTML payload to reference local server files, which are then included and rendered in the generated PDF — enabling arbitrary file read. CVE-2026-7182 (CVSS 4.0: 9.2 Critical) is the same path traversal pattern in DHTMLX Diagram's export module (versions 1.0.0 through 1.1.0). Fixed: Diagram 1.1.1; PDF Export Module 0.7.6. DHTMLX Gantt is widely used in project management and scheduling applications in public sector and government environments, particularly across European institutions.
    ch_eu_nexus: "DHTMLX Gantt/Scheduler components are embedded in government project-management portals and intranet applications across EU public-sector organisations. CERT-PL coordinated disclosure and ENISA EUVD both list these as EU-originating advisories."
    public_sector_nexus: "indirect — DHTMLX Gantt/Scheduler widely embedded in public-sector intranet and project-tracking tools"
    sector: "government, public-sector, enterprise"
    cves: [CVE-2026-41553, CVE-2026-41552, CVE-2026-7182]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "CVE-2026-41553: PDF Export Module used in DHTMLX's products Gantt and Scheduler is vulnerable to Remote Code Execution due to lack of data parameter sanitization. An unauthenticated attacker can inject the malicious JavaScript code to the parameter whose value is processed by Node.js and subsequently executed. This can lead to server compromise."
        attribution: "CERT Polska advisory"
        source_url: "https://cert.pl/en/posts/2026/05/CVE-2026-7182/"
      - quote: "CVE-2026-41553 baseScore: 10.0 / CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H"
        attribution: "ENISA EUVD"
        source_url: "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-30537"
    extended_notes: |
      Detection: web application firewall logs for POST requests to DHTMLX PDF export endpoints (/pdf or /export/pdf) with unusual `data` parameter content including `<script>` tags, JS function calls, or `src` attribute values pointing to local filesystem paths. Hunt for Node.js process spawning unusual child processes. Hardening: update to PDF Export Module 0.7.6 and Diagram 1.1.1 immediately; if immediate update is not possible, disable or restrict network access to the PDF export endpoint by IP allowlist. MITRE ATT&CK: T1190 (Exploit Public-Facing Application), T1059.007 (JavaScript).

  - title: "SEPPmail Secure Email Gateway — cluster of 6 CVEs including unauthenticated RCE (CVE-2026-44128 CVSS 9.3), insecure deserialization, LFI; Swiss-headquartered email gateway product"
    sources:
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12551"
        publisher: "NCSC-CH Security Hub"
        date: "2026-05-08"
        role: "primary"
      - url: "https://downloads.seppmail.com/extrelnotes/150/ERN15.0.html#security"
        publisher: "SEPPmail (vendor release notes)"
        date: "2026-04-24"
        role: "primary"
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12551 (bridge ncsc-csh recent 20, post published 2026-05-08 — within 36h developing_window_hours:72) → primary: SEPPmail vendor release notes, URL https://downloads.seppmail.com/extrelnotes/150/ERN15.0.html#security"
    summary: |
      NCSC-CH published advisory #12551 on 2026-05-08 covering six vulnerabilities fixed in SEPPmail Secure Email Gateway version 15.0.4. SEPPmail is a Swiss-headquartered company (Neuenhof AG / Schindellegi SZ) with a major deployment base in Swiss enterprises, Bundesverwaltung, and German-speaking EU public sector. CVE-2026-44128 (CVSS 9.3 Critical) is unauthenticated remote code execution — exposed test endpoints in GINAv2 (the on-premises email encryption/signing gateway component) allow unauthenticated attackers to execute arbitrary code, manipulate files, and gain unauthorised system access. CVE-2026-44126 (CVSS 9.2 Critical) is insecure deserialization in the GINAv2 component. CVE-2026-44125 (CVSS 9.3 Critical) is a missing authorization flaw in GINAv2. CVE-2026-44127 (CVSS 8.8 High) is local file inclusion and arbitrary file deletion. CVE-2026-44129 (CVSS 8.3 High) is server-side template injection. CVE-2026-7864 (CVSS 6.9 Medium) is sensitive information exposure to an unauthorized actor. Patches were available from 2026-04-24; fixed in SEPPmail version 15.0.2.1 (for CVE-2026-44128) and 15.0.4 for the full cluster. No confirmed exploitation at time of NCSC-CH advisory.
    ch_eu_nexus: "Direct: SEPPmail is headquartered in Switzerland and its email gateway product is deployed across Swiss federal and cantonal government email security infrastructure, as well as German and Austrian public-sector environments."
    public_sector_nexus: "direct — SEPPmail is a Swiss-origin product deployed in Swiss Bundesverwaltung and cantonal government email systems"
    sector: "government, public-sector, finance, healthcare"
    cves: [CVE-2026-44128, CVE-2026-44126, CVE-2026-44125, CVE-2026-44127, CVE-2026-44129, CVE-2026-7864]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Successful exploitation of these exposed test endpoints allows unauthenticated attackers to execute arbitrary code, manipulate files, and gain unauthorized system access. CVE-2026-44128 CVSS 9.3 CRITICAL Fixed in v15.0.2.1 - Unauthenticated Remote Code Execution"
        attribution: "NCSC-CH Security Hub post #12551"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12551"
    extended_notes: |
      Detection: network logs for anomalous POST requests to SEPPmail management/GINA endpoints, especially from non-administrative source IPs. Check for GINAv2 test-endpoint paths in access logs. Hardening: upgrade to SEPPmail 15.0.4 immediately; restrict network access to management interfaces to known-good IP ranges. For installations still on 15.0.2.x (which has only the RCE fix), apply full 15.0.4 update. MITRE ATT&CK: T1190 (Exploit Public-Facing Application), T1059 (Command and Scripting Interpreter).

  - title: "NCSC-CH Week 19 review: advance-fee scams using geopolitical lures (Iran/Gulf) surging; double phishing (parcel delivery + live card-auth bypass) remains active in Switzerland"
    sources:
      - url: "https://www.ncsc.admin.ch/ncsc/en/home/aktuell/im-fokus/2026/wochenrueckblick_19.html"
        publisher: "NCSC-CH"
        date: "2026-05-12"
        role: "primary"
    discovery_trace: "first seen at: ncsc-ch weekly review URL https://www.ncsc.admin.ch/ncsc/en/home/aktuell/im-fokus/2026/wochenrueckblick_19.html (bridge url fetch) → primary (no pivot needed)"
    summary: |
      NCSC-CH's Week 19 review (published 2026-05-12, covering 2026-05-05 to 2026-05-11) identifies two sustained social-engineering trends relevant to Swiss public-sector staff. First: advance-fee scams leveraging geopolitical crisis framing — scammers pose as wealthy business contacts from Iran and Gulf states, claim urgent need to transfer money abroad due to political instability, and use professionally worded, personalised messages. The NCSC notes these messages are coherent, contain no spelling errors, and exploit sunk-cost psychology to extract sequential advance payments. Second (from Week 18, 2026-05-05): "double phishing" against Swiss residents — an initial parcel-phishing message (spoofing Swiss Post, DHL, DPD) harvests card credentials; scammers then place a real transaction against the stolen card details and immediately phone the victim to extract the 3-D Secure OTP under the guise of confirming a customs payment, allowing the OTP to be used to authorise the fraudulent transaction. These are relevant awareness items for Swiss federal office and cantonal staff awareness programmes.
    ch_eu_nexus: "Direct: NCSC-CH domestic threat reporting for Switzerland."
    public_sector_nexus: "indirect — staff awareness relevant for Swiss federal and cantonal government employees"
    sector: "government, public-sector, financial"
    cves: []
    actors_campaigns_malware: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The NCSC has received reports of scammers posing as wealthy businesspeople from crisis regions – currently including Iran and the Gulf states – who claim to urgently need to transfer money abroad. The messages are personalised and written in a professional and serious tone. They contain no obvious spelling mistakes."
        attribution: "NCSC-CH Week 19 review"
        source_url: "https://www.ncsc.admin.ch/ncsc/en/home/aktuell/im-fokus/2026/wochenrueckblick_19.html"
    extended_notes: |
      Detection for double phishing: user education focus — train helpdesk/treasury staff to recognise that OTP requests by inbound callers claiming to be payment processors or delivery companies are always fraudulent. Hardening: card issuers should be notified if staff report these calls; report incidents to NCSC at ncsc.admin.ch/report.

