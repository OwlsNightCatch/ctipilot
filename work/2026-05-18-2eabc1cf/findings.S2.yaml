  - title: "Microsoft Exchange Server CVE-2026-42897 OWA XSS zero-day actively exploited — no permanent patch, CISA KEV-listed"
    sources:
      - url: "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-42897"
        publisher: "Microsoft MSRC"
        date: "2026-05-14"
