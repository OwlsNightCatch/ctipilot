    extended_notes: |
      Detection concept: since the vulnerable path is pre-auth, hunt in web-access/application logs for the
      Roundcube login/authentication endpoint for anomalous or successful authentications with no matching
      credential-verification event, and for malformed/escaped characters (backslash sequences) in fields that
      feed virtuser_query lookups; correlate against database-query logs for the Roundcube service account
      issuing queries structurally inconsistent with the configured virtuser_query template. Hardening: apply
      1.6.16/1.7.1; where immediate patching isn't possible, disable or remove the virtuser_query plugin entirely
      (removes the attack surface without needing the patch); restrict/monitor external exposure of the webmail
      login endpoint, since virtuser_query is opt-in and mainly used by hosting/ISP-style deployments (cPanel
      bundles Roundcube) rather than single-tenant installs — administrators should first confirm whether the
      plugin is even in use before deciding on an interim mitigation.
    priority_hint: high

