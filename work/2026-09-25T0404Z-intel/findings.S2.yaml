    discovery_trace: "first seen at: inside-it-ch, URL https://www.inside-it.ch/bundesrat-muss-sich-um-digitale-souveraenitaet-kuemmern-20260924 (RSS feed https://www.inside-it.ch/rss.xml, published 2026-09-24T14:10:20Z) → pivot: WebSearch (\"nationalrat souveräne digitale infrastruktur KI Zeitalter 2026 angenommen\") → pivot: Laux Lawyers AG session roundup, URL https://www.lauxlawyers.ch/it-recht-in-der-herbstsession-2026/ → primary: Swiss Federal Assembly Curia Vista official record, URL https://www.parlament.ch/de/ratsbetrieb/suche-curia-vista/geschaeft?AffairId=20243209 (confirmed via the parliament's own OData service: BusinessStatus 'Überwiesen an den Bundesrat' recorded 2026-09-23T18:22:12Z, vote record ID 38773 closing 2026-09-23T12:35:29Z, session 'Herbstsession 2026')"
    summary: |
      On 2026-09-23 the National Council (Nationalrat) adopted motion 24.3209, "Für eine souveräne digitale
      Infrastruktur in der Schweiz im Zeitalter der künstlichen Intelligenz" (submitted by Council of States
      member Charles Juillard), following the Council of States' own approval in March 2026 — meaning both
      chambers have now passed it despite the Federal Council formally recommending rejection (a minority
      proposal from National Councillor Tuena aligned with the Federal Council's position was defeated). The
      motion instructs the Federal Council to submit a legal revision enabling the federal government, together
      with cantons, research institutions and the private sector, to advance, co-finance, steer and monitor the
      build-out of a sovereign digital infrastructure — specifically naming an independent cloud service and an
      independent data-exchange platform intended to host data from companies, public administration and
      critical infrastructure inside Switzerland. The stated goals are strengthening digital sovereignty and
      cybersecurity in the age of AI, safeguarding Switzerland's competitiveness, and protecting democratic
      processes from external interference; the Federal Council's own rejection cited existing legal bases
      (EMBAG), ongoing work on the Swiss Government Cloud and AI regulation as already covering the ask, but
      parliament decided further legislative action is required. Switzerland's official parliamentary record
      confirms the motion's status now reads "Überwiesen an den Bundesrat" (referred to the Federal Council),
      obliging the executive to bring forward the requested legal revision — a strategic-level policy signal, not
      yet an operational obligation, but the trigger event for a forthcoming Swiss Government Cloud/exchange-
      platform legislative process directly affecting how federal, cantonal and critical-infrastructure data may
      be hosted and by whom.
