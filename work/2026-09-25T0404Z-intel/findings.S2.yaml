items:
  - title: "CVE-2026-48842 — Roundcube Webmail: pre-auth SQL injection in the virtuser_query plugin confirmed under active exploitation, four months after the patch"
    sources:
      - { url: "https://roundcube.net/news/2026/05/24/security-updates-1.6.16-and-1.7.1", publisher: "Roundcube Webmail Dev Team", date: "2026-05-24", role: "primary" }
      - { url: "https://www.cyber.gc.ca/en/alerts-advisories/roundcube-security-advisory-av26-503", publisher: "Canadian Centre for Cyber Security (CCCS)", date: "2026-09-21", role: "primary" }
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12596", publisher: "NCSC Switzerland — Cyber Security Hub (GovCERT.ch)", date: "2026-09-24", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/critical-roundcube-flaw-now-actively-exploited-in-code-injection-attacks/", publisher: "BleepingComputer", date: "2026-09-24", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12596 (fetched via bridge ncsc-csh recent 15, post lastModified 2026-09-24T14:45:53Z) → primary: Canadian Centre for Cyber Security, URL https://www.cyber.gc.ca/en/alerts-advisories/roundcube-security-advisory-av26-503 → primary: Roundcube vendor advisory, URL https://roundcube.net/news/2026/05/24/security-updates-1.6.16-and-1.7.1 → corroborating: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/critical-roundcube-flaw-now-actively-exploited-in-code-injection-attacks/"
    summary: |
      Roundcube fixed CVE-2026-48842 (CVSS 3.1 8.1) on 2026-05-24 in versions 1.6.16 and 1.7.1: a pre-authentication
      SQL injection in the built-in virtuser_query plugin, which substitutes a user-supplied email address into a
      configured SQL lookup query used for database-driven virtual-user-to-mailbox resolution. The flaw is a
      preg_replace() backslash-escape bypass that lets an unauthenticated attacker manipulate the resulting query,
      bypass authentication and inject/execute arbitrary SQL against Roundcube's backend database — potentially
      exposing mail-account credentials and stored messages, with no user interaction required. Four months after
      the patch, Canada's Cyber Centre updated advisory AV26-503 on 2026-09-21 to record in-the-wild exploitation;
      NCSC Switzerland's Cyber Security Hub updated its own advisory (open since 2026-05-27) on 2026-09-24, adding
      "Current exploitation status: Actively exploited" and citing the same CCCS update. Shadowserver tracks over
      523,000 internet-exposed Roundcube instances (patch/honeypot ratio unknown). Roundcube webmail has a
      documented history of exploitation against European government email systems — Winter Vivern/TA473's
      CVE-2023-5631 XSS zero-day and APT28's chained abuse of CVE-2020-35730/CVE-2020-12641/CVE-2021-44026 both
      targeted government mail servers specifically. Roundcube also ships pre-installed with cPanel, extending
      exposure into hosting-provider-run mail for smaller public-sector bodies and their suppliers. Administrators
      unable to patch immediately are advised to disable/remove the virtuser_query plugin as an interim mitigation.
    region_nexus: "Switzerland (NCSC-CH advisory update) + global; Roundcube webmail has a documented history of targeted exploitation against European government email systems (Winter Vivern/TA473, APT28)"
