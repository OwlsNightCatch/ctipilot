notes_for_main_agent: |
  Two additional leads noted but NOT returned as items (below the inclusion bar as researched):
  - Aeroclub de l'AIA (Clermont-Ferrand) data leak, claimed by hacker "Sophia" 2026-09-24: members' PII, pilot licences, and in some cases cleartext-looking passwords exposed; some profiles carry Defense-industrial-site (AIA) professional addresses. Only C-reliability leak trackers (Cyberattaque.org, Fuitesinfos.fr) repeat the criminal's own claim; no victim statement from Acaia/AIA/Ministere des Armees found despite a targeted search. Small scale (fuitesinfos.fr cites ~196 members), civilian aeroclub rather than a defense entity itself. Does not clear PD-6's fake-news guard for a full entry; not worth a backlog row given low severity and weak Defense nexus (most affected are civilian/retired members, not active Defense personnel) -- flagging only for completeness.
  - "Angreifer der LMU hat sich bisher nicht bei Universitaet gemeldet" (heise, 2026-09-21) -- follow-up on the LMU Munich student-data breach (~52,000 students potentially affected, disclosed ~2026-09-19/20). Publication date (2026-09-21) falls OUTSIDE this run's 26h window, and the underlying breach itself is a German university (not Swiss public-sector, not a novel TTP as reported -- no access vector named). Not returned per the recency gate; noting in case a fresher in-window development on LMU surfaces for a future S2/S4 run.
