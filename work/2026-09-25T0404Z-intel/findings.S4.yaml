items:
  - title: "ASP (France's public benefits-payment agency): a hacker's claimed IDOR against a sequential payment-notice endpoint exposes 143,518 lines of energy-subsidy beneficiaries' IBANs — the agency's second breach this year"
    sources:
      - { url: "https://www.clubic.com/actualite-631219-cyberattaque-de-l-asp-les-donnees-de-143-000-beneficiaires-d-aides-exposees.html", publisher: "Clubic", date: "2026-09-24", role: "primary" }
      - { url: "https://www.cyberattaque.org/asp-une-cyberattaque-expose-143-000-lignes-de-beneficiaires-daides-publiques/", publisher: "Cyberattaque.org", date: "2026-09-24", role: "primary" }
      - { url: "https://frenchbreaches.com/blog/fuite-de-donnees-a-lagence-de-services-et-de-paiement-un-service-de-letat-touche-par-un-incident-critique", publisher: "FrenchBreaches", date: "2026-04-24", role: "corroborating" }
      - { url: "https://www.cyberattaque.org/agence-de-services-et-de-paiement-asp-fuite-de-donnees-sensibles-nir-et-iban-exposes/", publisher: "Cyberattaque.org", date: "2026-04-24", role: "corroborating" }
    discovery_trace: "first seen at: cyberattaque.org (S4 rotation source), URL https://www.cyberattaque.org/feed/ -> article URL https://www.cyberattaque.org/asp-une-cyberattaque-expose-143-000-lignes-de-beneficiaires-daides-publiques/ -> corroboration via WebSearch (\"ASP Agence de services et de paiement cyberattaque Coup de pouce energie fuite donnees\") -> primary: Clubic, URL https://www.clubic.com/actualite-631219-cyberattaque-de-l-asp-les-donnees-de-143-000-beneficiaires-d-aides-exposees.html -> corroborating: FrenchBreaches's own blog analysis of ASP's first 2026 breach (April), URL https://frenchbreaches.com/blog/fuite-de-donnees-a-lagence-de-services-et-de-paiement-un-service-de-letat-touche-par-un-incident-critique"
    summary: |
      France's Agence de services et de paiement (ASP) — a public establishment that administers and disburses state, regional and EU-funded aid programmes on behalf of French public bodies — confirmed in a notification letter to affected beneficiaries (quoted by Clubic and Cyberattaque.org, both 2026-09-24) that it detected fraudulent access to a user account on 2026-08-28, one day after a security incident on 2026-08-27 targeting the portal for the Île-de-France region's "Coup de pouce énergie" scheme (a EUR 250 subsidy paid to roughly 160,000 low-income households in 2023, funded by a EUR 45M EU envelope). The account was used to exfiltrate payment notices ("avis de paiement") from 2023-2024. A criminal-forum post seen by both outlets claims 143,518 lines of data and, separately from ASP's own account, states the access method was an Insecure Direct Object Reference (IDOR): incrementing a sequential payment-notice ID in a request returns another beneficiary's document with no ownership check, letting the actor walk the ID space to harvest thousands of records — the identical vulnerability class Clubic notes was behind France's 2025 ANTS breach (identity-document data of ~19 million French citizens, already tracked in this store as incident:france-ants-breach-2026). ASP's letter confirms only "un accès frauduleux à un compte utilisateur" and states the underlying vulnerability has been "identifiée et corrigée" without naming its type — so the IDOR mechanism is the attacker's claim, not ASP's confirmation. Exposed fields include beneficiary name, postal address, beneficiary reference number, bank name, IBAN/BIC and the aid amount paid — sufficient, per ASP's own warning, for highly credible phishing/vishing impersonating the agency or the region citing real payment details. This is ASP's second confirmed breach of 2026: FrenchBreaches's own April 2026 reporting (re-linked by Clubic) describes an earlier, still-unquantified incident exposing French social-security numbers (NIR) and IBANs of vocational-training trainees via the same "fraudulent account access" pattern.
    region_nexus: "France (neighbouring EU jurisdiction); part of the store's tracked 2026 wave of French public-administration breaches (ANTS, DGFiP, AFPA, Éducation nationale)"
    primary_sector_nexus: "direct"
    sector: "public-sector"
    cves: []
    techniques: [T1190, T1213]
    affected_products: []
    entity_keys: ["trend:france-public-sector-breach-wave-2026", "incident:france-ants-breach-2026"]
    new_entities:
      - { key: "incident:france-asp-coup-de-pouce-energie-breach-2026-08", type: incident, name: "ASP Coup de pouce énergie payment-notice breach (France, 2026-08)",
          aliases: ["ASP breach 2026-09", "Agence de services et de paiement IDOR breach"],
          summary: "France's Agence de services et de paiement confirmed unauthorized account access on 2026-08-28 leading to exfiltration of Île-de-France 'Coup de pouce énergie' payment notices (names, addresses, IBAN/BIC, aid amounts); an attacker separately claims 143,518 lines were taken via an IDOR flaw in the sequential payment-notice endpoint, unconfirmed by ASP (Clubic, Cyberattaque.org, 2026-09-24). ASP's second confirmed breach of 2026 after an April incident exposing trainees' NIR/IBAN data." }
    relation_suggestions:
      - { subject: "incident:france-asp-coup-de-pouce-energie-breach-2026-08", object: "incident:france-ants-breach-2026",
          basis: "Clubic (2026-09-24): the attacker's claimed IDOR against ASP's payment-notice endpoint is \"la même faille que celle de l'ANTS\" — the same vulnerability class as the 2025 ANTS breach affecting ~19 million French citizens" }
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "un incident de sécurité est survenu le 27 août 2026 sur le portail associé au dispositif d'aide « Coup de pouce énergie »"
        attribution: "ASP's own notification letter, quoted by Cyberattaque.org"
        source_url: "https://www.cyberattaque.org/asp-une-cyberattaque-expose-143-000-lignes-de-beneficiaires-daides-publiques/"
      - quote: "un accès frauduleux à un compte utilisateur ayant permis l'exfiltration de documents contenant des données personnelles"
        attribution: "ASP's own notification letter, quoted by Cyberattaque.org"
        source_url: "https://www.cyberattaque.org/asp-une-cyberattaque-expose-143-000-lignes-de-beneficiaires-daides-publiques/"
      - quote: "il affirme avoir exploité une faille IDOR, pour Insecure Direct Object Reference. Dans ce type de faille, il suffit de remplacer, dans une requête envoyée au site, le numéro d'un avis de paiement par un autre pour obtenir le document d'un autre bénéficiaire, sans aucun contrôle des droits d'accès du compte connecté."
        attribution: "Clubic"
        source_url: "https://www.clubic.com/actualite-631219-cyberattaque-de-l-asp-les-donnees-de-143-000-beneficiaires-d-aides-exposees.html"
      - quote: "à l'heure où on écrit ces lignes, seul le pirate mentionne une faille IDOR"
        attribution: "Clubic"
        source_url: "https://www.clubic.com/actualite-631219-cyberattaque-de-l-asp-les-donnees-de-143-000-beneficiaires-d-aides-exposees.html"
      - quote: "Oui, c'est la même faille que celle de l'ANTS, par laquelle les données de près de 19 millions de Français avaient été récupérées."
        attribution: "Clubic"
        source_url: "https://www.clubic.com/actualite-631219-cyberattaque-de-l-asp-les-donnees-de-143-000-beneficiaires-d-aides-exposees.html"
    extended_notes: |
      Defender takeaway: any public-facing portal that serves individually-numbered documents (payment notices, benefit decisions, case files) to authenticated users is a candidate for this exact IDOR class unless every retrieval path re-checks that the numbered object belongs to the authenticated session's own beneficiary/case record — not just that a session exists. Swiss cantonal/communal benefits and social-assistance portals with sequential or otherwise guessable document/case identifiers are the direct analogue. Hunt/detection angle: high-volume, sequential-ID GET/POST requests against a single authenticated session on a benefits-payment or document-retrieval endpoint (a session enumerating hundreds-to-thousands of distinct object IDs in a short window) is the generic IDOR-harvesting signature, independent of the specific application. classification: {reliability: B, credibility: 2} — Clubic is a B-reliability outlet with editorial standards that independently contextualised the claim (ANTS comparison, Observatoire fraud-loss figures) rather than merely repeating a leak-site post, but the underlying evidence (both outlets' account of the incident) traces to the same ASP notification letter quoted by FrenchBreaches, so credibility is held at 2 (probably true, not independently re-verified beyond that one letter) rather than 1, mirroring the SUEZ Eau France precedent in this store.
    borderline: false

  - title: "Gambit's AI-agent retail-skimmer campaign (STRIX/CAIRN/HERMES): Anthropic banned the account behind it and Cloudflare took down its infrastructure — the attacker rebuilt within hours and kept going"
    sources:
      - { url: "https://www.heise.de/news/Angriff-mit-KI-Agenten-auf-hunderte-Shops-600-000-Kreditkartendaten-geklaut-11464492.html", publisher: "heise online", date: "2026-09-24", role: "primary" }
      - { url: "https://www.computing.co.uk/news/2026/security/ai-agents-used-to-steal-credit-card-records", publisher: "Computing (UK)", date: "2026-09-23", role: "corroborating" }
      - { url: "https://gambit.security/blog-posts/autonomous-ai-agents-online-retailers-25-a-company", publisher: "Gambit Security", date: "2026-09-22", role: "primary" }
    discovery_trace: "first seen at: heise-sec (S4/S2 essential source), URL https://www.heise.de/security/feed.xml -> article URL https://www.heise.de/news/Angriff-mit-KI-Agenten-auf-hunderte-Shops-600-000-Kreditkartendaten-geklaut-11464492.html (cites Gambit Security and Forbes) -> primary re-read: Gambit Security's own report, URL https://gambit.security/blog-posts/autonomous-ai-agents-online-retailers-25-a-company (already the primary source cited by the existing store entry 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes) -> corroboration for the Anthropic-ban/Cloudflare-takedown claim (not stated by name in Gambit's own post): WebSearch (\"Forbes Anthropic Deepseek AI cyberattack 100 companies account banned Cloudflare infrastructure\") -> Computing (UK), URL https://www.computing.co.uk/news/2026/security/ai-agents-used-to-steal-credit-card-records"
    summary: |
      This is a material, in-window (2026-09-24) update to the store's existing entry on Gambit Security's AI-agent retail-skimmer campaign (2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes). Re-reading Gambit's own primary report in full surfaces concrete facts the existing entry's summary omitted: the operator exfiltrated 600,000+ unexpired credit-card records from two of the compromised retailers, and the "some level of access" the existing entry mentions in general terms extended to a Fortune 500 hospitality company, a major US airline, a large private US industrial-supplies distributor and a US online fashion retailer. The operator's instructions to the Hermes orchestration agent were typed in Chinese (1,951 prompts across 260 sessions); total AI-model spend via OpenRouter ran USD 12,000-18,000 (an initial four-week period billed at USD 7,005.71), averaging USD 25.46 per target. Separately, heise (citing Forbes, 2026-09-22/24) and Computing (UK, 2026-09-23) report that Anthropic identified and banned the account associated with the campaign after the operator's harness (Hermes) was found using an earlier Claude model (Opus 4.6) — newer Claude releases refused the same requests — and that Cloudflare confirmed taking down the attacker's staging/C2 infrastructure. Both actions had only marginal disruptive effect: the attacker rebuilt new servers quickly and the campaign continued past the takedown, per both outlets.
    region_nexus: "global; no confirmed Swiss/EU public-sector victim named, but the technique class (autonomous AI-agent-driven end-to-end web-app exploitation against payment/checkout infrastructure) is directly transferable to any organisation running custom e-commerce or payment-processing code"
    primary_sector_nexus: "indirect"
    sector: "retail/e-commerce"
    cves: []
    techniques: [T1190, T1505.003, T1657]
    affected_products: []
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-of:2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes"
    evidence:
      - quote: "Anthropic said it had identified and banned the account linked to the attacks."
        attribution: "Computing (UK), relaying Forbes"
        source_url: "https://www.computing.co.uk/news/2026/security/ai-agents-used-to-steal-credit-card-records"
      - quote: "Cloudflare confirmed it had shut down servers connected to the operation, but researchers said the attacker repeatedly rebuilt the infrastructure and continued the attacks."
        attribution: "Computing (UK), relaying Forbes/Gambit Security"
        source_url: "https://www.computing.co.uk/news/2026/security/ai-agents-used-to-steal-credit-card-records"
      - quote: "The threat actor exfiltrated more than 600,000 credit card records from two victim companies."
        attribution: "Gambit Security"
        source_url: "https://gambit.security/blog-posts/autonomous-ai-agents-online-retailers-25-a-company"
      - quote: "some level of access to the assets of companies including a Fortune 500 hospitality company, a major US airline, a large private US industrial supplies distributor and a US online fashion retailer"
        attribution: "Gambit Security"
        source_url: "https://gambit.security/blog-posts/autonomous-ai-agents-online-retailers-25-a-company"
    extended_notes: |
      Defender takeaway for the update specifically: model-provider account bans and infrastructure takedowns (Cloudflare) are shown here to be reactive controls with a short disruption window against an autonomous, low-marginal-cost AI-agent campaign — the operator's own cost accounting (~USD 25/target) means rebuilding after a takedown is cheap. This reinforces the existing entry's resilience-over-prevention framing rather than adding a new technique class, hence returned as an update rather than a new entry.
    borderline: false

  - title: "Maileva (Docaposte/La Poste mail-dispatch service): unauthorized account-access attempts to send fraudulent letters force a full service shutdown, no mechanism or data-leak confirmed"
    sources:
      - { url: "https://www.cyberattaque.org/maileva-filiale-de-la-poste-victime-dune-cyberattaque/", publisher: "Cyberattaque.org", date: "2026-09-24", role: "primary" }
    discovery_trace: "first seen at: cyberattaque.org (S4 rotation source), URL https://www.cyberattaque.org/feed/ -> article URL https://www.cyberattaque.org/maileva-filiale-de-la-poste-victime-dune-cyberattaque/ -> WebSearch (\"Maileva La Poste Docaposte cyberattaque courrier septembre 2026\") found only the same underlying facts repeated (FrenchBreaches, X/social posts, a lawyer's client-advisory blog) -> no victim-side additional disclosure found"
    summary: |
      Maileva, the Docaposte (La Poste group) brand for dematerialised business mail dispatch, has had its services offline since 2026-09-23 07:00 after detecting unauthorized access attempts on certain customer accounts, aimed at triggering illegitimate mailings (e.g. fraudulent invoices or payment-detail-change letters sent through a service recipients would trust). Maileva blocked the affected accounts, halted the service as a precaution, filed a criminal complaint, and states it has found no evidence of any fraudulent mailing having actually gone out via the client portal or API. No access vector, actor, or customer-data exfiltration is stated by any party as of 2026-09-24.
    region_nexus: "France (state-linked postal operator, not Swiss); no data-theft or mechanism confirmed"
