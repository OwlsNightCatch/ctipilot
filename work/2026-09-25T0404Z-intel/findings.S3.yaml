  - title: "Recorded Future Insikt Group: Russia's hybrid-warfare tempo against Europe has escalated since 2022 and is likely to intensify into a full-scale campaign within two years"
    sources:
      - { url: "https://www.recordedfuture.com/blog/russia-new-generation-warfare", publisher: "Recorded Future (Insikt Group)", date: "2026-09-24", role: "primary" }
    discovery_trace: "first seen at: recordedfuture-insikt (rotation source), URL https://www.recordedfuture.com/feed → primary (no pivot needed): https://www.recordedfuture.com/blog/russia-new-generation-warfare"
    summary: |
      Insikt Group published a follow-up assessment (2026-09-24) to its February 2026 in-depth report on Russian "New Generation Warfare" (NGW), the doctrine Chief of the General Staff Valeriy Gerasimov set out in 2013 combining influence operations, airspace incursions, territorial-waters/undersea-cable violations, physical sabotage and access-oriented cyber intrusions to test NATO defenses without triggering Article 5. Insikt assesses Russian hybrid activity has escalated markedly since the 2022 full-scale invasion of Ukraine, moving beyond the former Soviet sphere. Quantified indicators: 30 suspected/confirmed NATO-airspace drone or jet incursions between September 2025 and January 2026 versus 23 between March 2022 and August 2025 (Poland and Romania most targeted, but also Germany, UK, Denmark, Norway); a four-fold rise in physical sabotage operations between 2023 and 2024, holding steady into 2025 (Germany, Estonia, Latvia, Lithuania and Poland most targeted January 2018–June 2025). Named recent incidents: an Estonian southeastern-border drone incursion triggering NATO F-16 scrambles from Ämari Air Base (2026-09-01); a German government public attribution to Russia of an explosive-drone sabotage plot at Leipzig/Halle Airport, a Ukraine-support military-logistics hub, with hexogen-laden drones recovered by German police (2026-09-01); Romanian interception/destruction of an explosive-laden Russian maritime drone near the Neptun Deep offshore gas field in the Black Sea (2026-08-20); and coordinated Russia-nexus DDoS/access operations against Norwegian public-sector government portals, forcing key services offline, which Norwegian authorities termed retaliation for military support to Ukraine (2026-08-30). On the cyber axis specifically, Insikt describes Russian activity as "access-oriented" — targeting internet-facing firewalls, VPNs, email services and web portals for intelligence collection and long-term access rather than immediate disruption — plus continuing influence-operation expansion (the CopyCop network impersonating localized news/fact-checking outlets in France and Norway using AI-generated text and voice clones, late August 2026). Insikt assesses the current campaign is largely opportunistic but that Putin is likely to escalate toward a full-scale, concurrent-tactic NGW campaign within the next two years, motivated by a perceived window before the 2028 US presidential election. Indicators to watch: lower-altitude airspace incursions with transponders off; non-compliance with vessel hails/escorts near cables; sabotage against civilian sites timed to coincide with airspace violations; and intrusion/DDoS spikes around politically significant events. Recommendations for public-sector defenders explicitly include coordinating with the national CERT/NCSC, joint civil-military air-incident protocols, port-state coordination and physical hardening of cable landing sites, and anti-drone perimeter measures for critical-infrastructure sites.
    region_nexus: "Europe-wide (Poland, Romania, Germany, Estonia, Norway, France named); Switzerland not itself named as a target but shares the same hybrid-threat exposure class (public-sector DDoS, sabotage against dual-use/critical infrastructure) as other non-frontline European states, and the report's own recommendation is to coordinate with the national CERT/NCSC"
