  - title: "IBM MQ / MQ Appliance + Langflow OSS: unauthenticated pre-auth heap overflow (CVSS 10.0) and multiple unauthenticated code-injection flaws (CVSS 9.8) fixed, no exploitation reported"
    sources:
      - { url: "https://www.ibm.com/support/pages/security-bulletin-ibm-mq-vulnerable-unauthenticated-remote-code-execution-cve-2026-10747", publisher: "IBM (Security Bulletin)", date: "2026-09-14", role: "primary" }
      - { url: "https://www.ibm.com/support/pages/security-bulletin-langflow-vulnerable-arbitrary-code-execution-due-multiple-incomplete-code-security-controls-and-missing-execution-guards", publisher: "IBM (Security Bulletin)", date: "2026-09-08", role: "primary" }
      - { url: "https://advisories.ncsc.nl/2026/ncsc-2026-0392.html", publisher: "NCSC Netherlands (NCSC-2026-0392)", date: "2026-09-23", role: "corroborating" }
    discovery_trace: "first seen at: advisories-ncsc-nl RSS feed (essential source), URL https://advisories.ncsc.nl/rss/advisories (item NCSC-2026-0392) → pivot: NCSC-NL advisory detail page (References section), URL https://advisories.ncsc.nl/2026/ncsc-2026-0392.html → primary: IBM Security Bulletin for CVE-2026-10747, URL https://www.ibm.com/support/pages/security-bulletin-ibm-mq-vulnerable-unauthenticated-remote-code-execution-cve-2026-10747 → primary: IBM Security Bulletin for the Langflow OSS CVEs, URL https://www.ibm.com/support/pages/security-bulletin-langflow-vulnerable-arbitrary-code-execution-due-multiple-incomplete-code-security-controls-and-missing-execution-guards"
    summary: |
      IBM published two security bulletins in September 2026 that NCSC Netherlands rolled into one
      advisory (NCSC-2026-0392, 2026-09-23; 12 CVEs total, 4 rated critical and remotely exploitable
      without authentication). First: CVE-2026-10747 (CVSS 3.1 10.0, CWE-122 Heap-based Buffer
      Overflow) — "IBM MQ has addressed a heap buffer overflow vulnerability in the queue manager's
      protocol handling that could allow an unauthenticated remote attacker with network access to
      the listener port to execute arbitrary code." Affected: IBM MQ 9.1.0.0–9.1.0.37 LTS,
      9.2.0.0–9.2.0.43 LTS, 9.3.0.0–9.3.0.41 LTS, 9.3 CD through 9.3.5.1, 9.4.0.0–9.4.0.25 LTS, 9.4 CD
      through 9.4.5.1, and 10.0.0.0 (Server component); fixed at 9.2.0.44 / 9.3.0.42 / 9.4.0.26 (MQ
      Appliance fixes similarly at 9.4.0.26). No workaround exists. Second: Langflow OSS (the
      open-source visual builder for AI agent/RAG flows) 1.0.0 through 1.11.5 carries eleven further
      CVEs, three of them CVSS 9.8 and unauthenticated: CVE-2026-79724 (OS command injection via
      graph construction — CWE-78), CVE-2026-85025 (incorrect authorization letting an unauthenticated
      attacker "execute arbitrary code and access or modify chat sessions through publicly shared MCP
      project endpoints" — public flows and shared MCP transports skip the code-execution guard and
      session-namespace scoping enforced on every other anonymous-execution surface), and
      CVE-2026-81204 (code injection during graph construction). Eight further CVEs (CVSS 8.8) need
      an authenticated, sometimes non-admin, attacker and cover an incomplete security-scanner
      denylist that alias-tracking can defeat, an unguarded eval() on attacker-controlled input, an
      MCP-stdio Windows command-switch bypass, and a missing OPENSSL_CONF environment-variable
      blocklist entry permitting native code execution via OpenSSL engine loading. Fixed in Langflow
      OSS 1.11.6. Neither IBM bulletin nor NCSC-NL reports active exploitation for any of the 12
      CVEs.
    region_nexus: "global; IBM MQ is common enterprise messaging middleware in government back-office system integration, and Langflow OSS is an increasingly adopted open-source platform for building AI agent/RAG pipelines, including in early public-sector AI pilots"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: [CVE-2026-10747, CVE-2026-79724, CVE-2026-85025, CVE-2026-81204, CVE-2026-81941, CVE-2026-81211, CVE-2026-81940, CVE-2026-78569, CVE-2026-78575, CVE-2026-76059, CVE-2026-79742, CVE-2026-78571]
    techniques: [T1190, T1059]
    affected_products: ["IBM MQ", "IBM MQ Appliance", "Langflow OSS"]
    entity_keys: ["product:ibm-langflow-oss"]
    new_entities:
      - { key: "product:ibm-mq", type: product, name: "IBM MQ", aliases: ["IBM MQ Appliance"],
          summary: "Enterprise message-queuing middleware. IBM's own September 2026 security bulletin fixed a pre-auth CVSS 10.0 heap-based buffer overflow in queue-manager protocol handling reachable by an unauthenticated attacker with network access to the listener port (CVE-2026-10747, IBM Security Bulletin, 2026-09-14)." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "IBM MQ has addressed a heap buffer overflow vulnerability in the queue manager's protocol handling that could allow an unauthenticated remote attacker with network access to the listener port to execute arbitrary code"
        attribution: "IBM Security Bulletin"
        source_url: "https://www.ibm.com/support/pages/security-bulletin-ibm-mq-vulnerable-unauthenticated-remote-code-execution-cve-2026-10747"
      - quote: "Langflow could allow an unauthenticated attacker to execute arbitrary code and access or modify chat sessions through publicly shared MCP project endpoints due to improper enforcement of public-flow security restrictions and session isolation controls."
        attribution: "IBM Security Bulletin (CVE-2026-85025)"
        source_url: "https://www.ibm.com/support/pages/security-bulletin-langflow-vulnerable-arbitrary-code-execution-due-multiple-incomplete-code-security-controls-and-missing-execution-guards"
    extended_notes: |
      Detection angle for defenders running Langflow: the public-flow/shared-MCP bypass (CVE-2026-85025)
      is the one unauthenticated path among the three CVSS-9.8 flaws — any Langflow instance exposing
      publicly shared flows or MCP project transports to the internet is the highest-priority check.
      For IBM MQ, the flaw is in protocol message processing before authentication on the listener
      port, so network-level exposure of the MQ listener (typically TCP/1414 or configured channel
      ports) to untrusted networks is the key exposure question, not application-level configuration.
    watchlist: null
    borderline: false
