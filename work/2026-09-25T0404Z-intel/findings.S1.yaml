      Same APSB26-92 release also fixed CVE-2026-48413/48414 (authenticated stored XSS reaching
      code execution), CVE-2026-48415/48416 (incorrect-authorization security-feature bypass) and
      CVE-2026-48411/48412 (privilege escalation) — none reported exploited; all should be applied
      in the same maintenance window since they share the isolated-patch delivery mechanism.
    watchlist: null
