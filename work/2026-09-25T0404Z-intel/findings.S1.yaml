      - quote: "JWT authentication can be bypassed when a token is signed using an unsupported algorithm, allowing unauthorized access."
        attribution: "WSO2 (Security Advisory WSO2-2026-5328)"
        source_url: "https://security.docs.wso2.com/en/latest/security-announcements/security-advisories/2026/WSO2-2026-5328/"
      - quote: "The forged token yields access to every API backend endpoint and its credentials, consumer keys and secrets for every registered application"
        attribution: "watchTowr's Yordan Ganchev, quoted by SecurityWeek"
        source_url: "https://www.securityweek.com/enterprises-warned-of-attacks-exploiting-wso2-vulnerability/"
      - quote: "CISA has added two new vulnerabilities to its Known Exploited Vulnerabilities (KEV) Catalog, based on evidence of active exploitation."
        attribution: "CISA"
        source_url: "https://www.cisa.gov/news-events/alerts/2026/09/24/cisa-adds-two-known-exploited-vulnerabilities-catalog"
    extended_notes: |
      Detection: Inception Security's write-up gives concrete telemetry-class hunt guidance —
      gateway/Carbon HTTP access and auth logs for admin-scoped sessions with no matching IdP login,
      WAF/proxy logs decoding JWT `alg` headers for values that should have been rejected, and
      consumer-key/application audit trails for reuse or mass export after an anomalous auth event.
      Start any hunt at 2026-09-13 (first observed exploitation). False-positive discriminator: an
      admin session that traces to a genuine, logged IdP login is benign; one with no matching login
      event is the signal. This detection guidance is itself downstream of the vendor+researcher
      facts above and carries lower source reliability (Admiralty C) than the primary/KEV chain.
    watchlist: null
    borderline: false

  - title: "CVE-2026-71362 — Adobe Commerce/Commerce B2B/Magento Open Source: unauthenticated customer-session-switching account takeover, exploited within a day of disclosure, now CISA KEV-listed (CVSS 9.1)"
    sources:
      - { url: "https://helpx.adobe.com/security/products/magento/apsb26-92.html", publisher: "Adobe (Security Bulletin APSB26-92)", date: "2026-08-11", role: "primary" }
