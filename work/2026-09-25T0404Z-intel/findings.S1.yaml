      - { url: "https://euvd.enisa.europa.eu/enisa/EUVD-2026-56844", publisher: "ENISA EUVD", date: "2026-09-24", role: "corroborating" }
    discovery_trace: "first seen at: CISA KEV additions sweep (tools/fetch_source.py cisa-kev, 2026-09-24 catalogVersion) → primary: Adobe Security Bulletin APSB26-92, URL https://helpx.adobe.com/security/products/magento/apsb26-92.html → primary: Sansec's own patch analysis, URL https://sansec.io/research/adobe-commerce-account-takeover-apsb26-92 → corroborating: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/hackers-exploit-critical-adobe-commerce-flaw-to-hijack-customer-accounts/ → corroborating: SecurityWeek, URL https://www.securityweek.com/adobe-commerce-bug-targeted-immediately-after-disclosure/ → corroborating: CISA KEV alert, URL https://www.cisa.gov/news-events/alerts/2026/09/24/cisa-adds-two-known-exploited-vulnerabilities-catalog"
    summary: |
      Adobe's August 2026 security bulletin (APSB26-92, published 2026-08-11) fixed CVE-2026-71362,
      an Incorrect Authorization flaw (CWE-863, CVSS 9.1: AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N) in
      Adobe Commerce, Adobe Commerce B2B and Magento Open Source. Sansec's Forensics Team reviewed
      Adobe's patch and "confirmed that the vulnerability lets attackers switch a customer session to
      another customer account. This gives them access to the victim's account and private customer
      data" — exploitable by a remote, unauthenticated attacker requiring "no existing account,
      administrator privileges or user interaction." Adobe fixed the flaw by changing how Magento
      handles customer identity in the account session. Affected versions run through the July 2026
      patch level on Commerce, Commerce B2B and Magento Open Source; the fix ships as an isolated
      patch file (not a new Composer release) that requires first being on the latest `-p` release
      for the supported branch. Adobe's advisory states it was "not aware of any exploits in the wild"
      at publication, but Sansec's own Shield WAF began blocking exploitation attempts against
      CVE-2026-71362 almost immediately after disclosure — the first hostile requests were observed
      within roughly a day, per BleepingComputer and SecurityWeek's reporting of Sansec's findings.
      CISA added the CVE to its Known Exploited Vulnerabilities catalog on 2026-09-24 (remediation
      due 2026-09-27), six weeks after the patch and the near-immediate exploitation attempts — the
      formal confirmation lagged the practical exploitation window considerably.
    region_nexus: "global e-commerce/customer-account platform; relevant wherever a public-sector body operates a citizen- or customer-facing Commerce/Magento storefront (e.g. cantonal utilities, transit-ticket shops, public-service webshops)"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
