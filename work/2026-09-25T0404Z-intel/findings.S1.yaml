  - title: "Adobe Campaign Classic (APSB26-142, revised): eight unauthenticated CVSS 10.0 code-injection/OS-command-injection flaws reach arbitrary code execution, no exploitation reported"
    sources:
      - { url: "https://helpx.adobe.com/security/products/campaign/apsb26-142.html", publisher: "Adobe (Security Bulletin APSB26-142)", date: "2026-09-22", role: "primary" }
    discovery_trace: "first seen at: advisories-ncsc-nl RSS feed (essential source), URL https://advisories.ncsc.nl/rss/advisories (item NCSC-2026-0393, published 2026-09-24) → primary: Adobe Security Bulletin APSB26-142 (revised 2026-09-22), URL https://helpx.adobe.com/security/products/campaign/apsb26-142.html"
    summary: |
      Adobe's Security Bulletin APSB26-142, originally published 2026-09-08 for Adobe Campaign
      Classic (ACC v7.4.4 build 9401 and earlier, Windows/Linux), was revised on 2026-09-22 to add
      17 further CVEs discovered internally. Eight of the added CVEs carry the maximum CVSS 3.1 score
      of 10.0 (AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H) and are all remotely exploitable without
      authentication or user interaction: CVE-2026-82004 (OS Command Injection, CWE-78), and
      CVE-2026-73369, CVE-2026-84412, CVE-2026-89275, CVE-2026-75699 and CVE-2026-75721 (all Code
      Injection, CWE-94, arbitrary code execution), CVE-2026-75703 (Code Injection reaching
      denial-of-service rather than RCE), and CVE-2026-75723 (Incorrect Authorization, CWE-863,
      arbitrary code execution). A further nine CVEs added in the same revision score 9.1–9.9 and
      cover SSRF, SQL injection and improper input validation, several also reaching arbitrary code
      execution. Adobe's own advisory states plainly it "is not aware of any exploits in the wild for
      any of the issues addressed in this update." The fix ships as ACC v7 build 9402; Adobe-hosted
      instances were already remediated server-side (and may still display build 9401 in their
      version string despite carrying the fix). Netherlands' NCSC-NL flagged the revision in its own
      advisory (NCSC-2026-0393, 2026-09-24), which is how this run's sweep surfaced it — no other
      outlet's coverage of this specific September revision was found in this window.
    region_nexus: "global; Adobe Campaign Classic is an on-premise/hybrid marketing-automation platform occasionally used by public administrations for citizen newsletters and outreach communications"
