      - { url: "https://euvd.enisa.europa.eu/enisa/EUVD-2026-53822", publisher: "ENISA EUVD", date: "2026-09-24", role: "corroborating" }
    discovery_trace: "first seen at: mandatory KEV-diff tasking (tools/kev_window_diff.py flagged CVE-2026-5430 as an uncovered 2026-09-24 CISA KEV addition) → primary: WSO2 vendor advisory, URL https://security.docs.wso2.com/en/latest/security-announcements/security-advisories/2026/WSO2-2026-5328/ → corroborating exploitation account: SecurityWeek, URL https://www.securityweek.com/enterprises-warned-of-attacks-exploiting-wso2-vulnerability/ → corroborating: CISA KEV alert, URL https://www.cisa.gov/news-events/alerts/2026/09/24/cisa-adds-two-known-exploited-vulnerabilities-catalog → corroborating detection guidance: Inception Security, URL https://www.inceptionsecurity.com/post/hunt-wso2-jwt-auth-bypass → corroborating: ENISA EUVD record, URL https://euvd.enisa.europa.eu/enisa/EUVD-2026-53822"
    summary: |
      WSO2's own advisory (WSO2-2026-5328, published 2026-05-03) describes CVE-2026-5430 as an
      "Account takeover via authentication bypass": "JWT authentication can be bypassed when a
      token is signed using an unsupported algorithm, allowing unauthorized access." Affected are
      WSO2 API Control Plane 4.6.0/4.5.0, WSO2 API Manager 4.6.0/4.5.0/4.4.0/4.3.0/4.2.0/4.1.0, WSO2
      Traffic Manager 4.6.0/4.5.0 and WSO2 Universal Gateway 4.6.0/4.5.0 — fixed at update levels
      API Control Plane 4.6.0.22/4.5.0.58, API Manager 4.6.0.21/4.5.0.57/4.4.0.72/4.3.0.108/4.2.0.197/
      4.1.0.257, Traffic Manager 4.6.0.21/4.5.0.56, Universal Gateway 4.6.0.21/4.5.0.57 (public
      open-source fixes also linked from the advisory). WSO2 rates it CVSS 10.0 (multi-tenant) /
      9.8 (single-tenant, since impact is then contained within one security-authority boundary).
      watchTowr told SecurityWeek its honeypot network caught the first forged-JWT exploitation
      attempt on 2026-09-13 — four months after the fix shipped — and reproduced the flaw itself by
      diffing WSO2's patch against the vulnerable code. The forged admin-scoped token "yields access
      to every API backend endpoint and its credentials, consumer keys and secrets for every
      registered application" (watchTowr's Yordan Ganchev, via SecurityWeek), turning a compromised
      gateway into what the researcher called a "Lateral Movement-as-a-Service" product for reaching
      everything the API gateway fronts. CISA added the CVE to its KEV catalog on 2026-09-24 with a
      2026-09-27 remediation deadline. NOTE: CISA's own KEV entry titles this "WSO2 Multiple Products
      Path Traversal Vulnerability" and describes it as enabling "unrestricted file upload" and RCE —
      that title/description does not match the mechanism any other source (WSO2's own advisory, the
      assigned CWE-347 Improper Verification of Cryptographic Signature, watchTowr/SecurityWeek,
      ENISA EUVD) describes, which is a JWT signature-verification/algorithm-confusion authentication
      bypass reaching admin-level API-gateway access, not a path-traversal file-upload RCE. Readers
      searching only on "path traversal" may miss that this is the flaw meant.
    region_nexus: "global; WSO2's API management stack (API Manager/Gateway) is commonly deployed as e-government and inter-agency API infrastructure, including in EU public-sector integration projects"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
