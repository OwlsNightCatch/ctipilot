  - title: "CVE-2026-5430 — WSO2 API Manager/Control Plane/Traffic Manager/Universal Gateway: JWT algorithm-confusion authentication bypass to full admin account takeover, actively exploited since 13 September (CVSS 10.0/9.8)"
    sources:
      - { url: "https://security.docs.wso2.com/en/latest/security-announcements/security-advisories/2026/WSO2-2026-5328/", publisher: "WSO2 (vendor advisory WSO2-2026-5328)", date: "2026-05-03", role: "primary" }
      - { url: "https://www.securityweek.com/enterprises-warned-of-attacks-exploiting-wso2-vulnerability/", publisher: "SecurityWeek (quoting watchTowr)", date: "2026-09-16", role: "primary" }
      - { url: "https://www.cisa.gov/news-events/alerts/2026/09/24/cisa-adds-two-known-exploited-vulnerabilities-catalog", publisher: "CISA", date: "2026-09-24", role: "primary" }
