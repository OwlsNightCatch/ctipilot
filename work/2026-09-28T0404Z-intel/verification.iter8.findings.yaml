  item: "state/cves_seen.json — CVE-2025-6543 record"
  url_or_quote: "\"Historical CitrixBleed 2-lineage NetScaler ADC/Gateway memory-overflow flaw referenced only as background lineage context by the 2026-09-28 CVE-2026-88771/88772 entry; not an in-window disclosure and not this run's finding.\""
