- code: F4
  category: hallucinated-fact
  section: threat
  item: "2026-09-28/storm-3168-jadepuffer-azure-destructive-service-principal"
  url_or_quote: "frontmatter summary: \"a roughly seven-minute destructive burst deleted 100+ storage accounts, a Key Vault, a Function App and an App Service plan\""
  summary: "Overstates both the entry's own body ('100+ storage-account deletion attempts, mostly successful, though Azure resource locks and storage-account-level deletion protection blocked deletion for a subset') and the cited Microsoft Security Blog ('Most Azure Storage accounts targeted by the threat actor were successfully deleted. However, Azure resource locks and storage account-level deletion protection blocked deletion attempts for few of the storage accounts'): not all 100+ were actually deleted. Fix: qualify the frontmatter summary the same way the body does (e.g. 'a roughly seven-minute destructive burst deleted most of 100+ targeted storage accounts...')."
- code: F3
  category: claim-not-supported
  section: vulnerability
  item: "2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev"
  url_or_quote: "\"This is a distinct CVE family from the CVE-2026-19490 NetScaler Gateway authentication-bypass flaw and from the CitrixBleed/CitrixBleed 2 lineage named above; watchTowr states directly that appliances already patched for CVE-2026-19490 remain vulnerable to CVE-2026-88771/88772 unless running one of the new fixed builds ([watchTowr, 2026-09-27](https://watchtowr.com/intelligence/citrix-netscaler-zero-day-vulnerabilities-faq/)).\""
  summary: "Fetched the cited watchTowr FAQ verbatim this iteration: it states only 'CVE-2026-19490 is an earlier NetScaler vulnerability that CISA added to the KEV catalog on September 9, 2026' and the patched-appliances-still-vulnerable fact; it never characterizes CVE-2026-19490 as an 'authentication-bypass flaw.' The characterization is chained onto the same terminal citation as the watchTowr-sourced fact, an instance of the exact co-cited-fact-not-actually-stated defect class prior iterations already caught twice on this same entry (CVE-2026-19489/AAA-pair in iter.4, CVE-2025-6543/lineage in iter.6). Fix: cite the characterization to the store's own 2026-08-20 CVE-2026-19490 entry via inline text, or drop 'authentication-bypass' and let the references[] link carry it."
- code: F11
  category: editorial-advisory
  section: incident
  item: "2026-09-28/openai-agents-unctad-double-encoding-proxy-chain-scan"
  url_or_quote: "(low confidence) entry never states that UNCTAD is headquartered in Geneva, Switzerland"
  summary: "Confirmed via WebSearch this iteration (unctad.org/about, ungeneva.org) that UNCTAD's headquarters sits in the Palais des Nations, Geneva — a direct home-region nexus for this org's constituency that the entry's relevance framing never invokes, resting instead only on the generic 'transferable AI-agent-abuse lesson' argument. Not a truth defect (nothing false is stated) — a missed opportunity to state the strongest defensible relevance driver. Advisory; the main agent may leave it."
