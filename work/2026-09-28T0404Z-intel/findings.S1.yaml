    extended_notes: >
      Cross-reference candidates for the composer: entries/2026-08-20/cve-2026-19490-netscaler-gateway-aaa-auth-bypass.md
      (CVE-2026-19490/19489, same product, KEV-listed 2026-09-09, distinct CVE family — watchTowr states explicitly that
      patching for CVE-2026-19490 does not remediate CVE-2026-88771/88772) and
      entries/2026-07-01/cve-2026-8451-citrix-netscaler-adc-gateway-pre-auth-saml-mem.md (earlier 2026 NetScaler
      pre-auth memory CVE). No CVE overlap with either existing entry, so this clears as a new entry per the
      dedup/overlap gate, but a `references[]` link to both would situate it in the ongoing NetScaler pattern for
      readers. Citrix's acknowledgments section on CTX697096 credits "Michael Tucker, Chew Keong Tan and Alex Bernier of
      the JPMorgan Chase XOR Team, and Maxim Suhanov" for working with Citrix to protect customers — suggesting at least
      one of the two zero-days may have been surfaced via a named enterprise security team's own incident/forensic work
      rather than pure external research, though Citrix's bulletin does not state this explicitly and no source confirms
      JPMorgan Chase itself was a victim; flagging as color only, not a claim to carry into the entry without further
      corroboration. BleepingComputer additionally reports (attributing to a leaked, NCSC-NL-authored pre-notification
      that NCSC-NL itself declined to confirm publicly) that Citrix "discovered the vulnerabilities while investigating
      incidents in customer environments" and "submitted a notification under the European Union's Cyber Resilience Act
      after discovering the attacks" — both claims trace only to the unconfirmed leaked document via BleepingComputer,
      so they should be attributed as "a notification NCSC-NL reportedly sent, per BleepingComputer" rather than stated
      as fact if carried into the entry body.
