    summary: >
      Citrix published security bulletin CTX697096 on 2026-09-27 fixing eight NetScaler ADC / NetScaler Gateway
      vulnerabilities, two of which were exploited as zero-days before any fix existed: CVE-2026-88771 (CVSS v4.0 9.5,
      CWE-20 improper input validation) lets an unauthenticated remote attacker execute arbitrary commands on every
      NetScaler ADC / Gateway deployment in its default configuration — no feature needs to be enabled — and
      CVE-2026-88772 (CVSS v4.0 9.5, CWE-119 improper restriction of operations within a memory buffer) is a memory
      overflow reaching RCE or DoS, reachable wherever DTLS is enabled, which Citrix states is the default state on any
      VPN virtual server (so most NetScaler Gateway deployments meet the precondition unless DTLS was explicitly
      disabled). Citrix's own bulletin states plainly: "Exploits of CVE-2026-88771 and CVE-2026-88772 on unmitigated
      NetScaler deployments have been observed." CISA added both to its KEV catalog on 2026-09-27 with a three-day
      remediation deadline (2026-09-30) and forensic-triage guidance under BOD 26-04; CERT-EU issued advisory 2026-014
      the same day confirming active exploitation and recommending a compromise assessment on every internet-exposed
      appliance. The disclosure path is notable for defenders: NetScaler administrators were privately warned by IT
      suppliers and security teams to shut appliances down over the weekend of 2026-09-26, tracing to a pre-notification
      the Dutch NCSC-NL reportedly sent to its constituency (NCSC-NL would not confirm the leaked notice's contents to
      BleepingComputer, but did publish its own public advisory NCSC-2026-0394 the next day once Citrix's bulletin
      shipped); watchTowr independently and publicly flagged credible rumors of unpatched, in-the-wild NetScaler RCEs on
      2026-09-26, a day before Citrix's own bulletin and before the CVE identifiers existed. Fixed builds are
      14.1-73.37, 13.1-64.23, 14.1-73.37 FIPS and 13.1-37.279 (FIPS/NDcPP); watchTowr flags an upgrade caveat on 13.1 —
      run `show ns variable` first, and if it returns any variables, upgrade to 13.1-64.24 instead to avoid a known
      reboot loop. The same bulletin fixes six configuration-dependent companion flaws not reported exploited: an
      HTTP request-smuggling flaw (CVE-2026-88773, CVSS 9.3), a policy-bypass flaw via HTTP URL-based expressions
      (CVE-2026-88774, CVSS 7.0), three further memory-overflow DoS/undefined-behavior flaws gated respectively on a
      Gateway/AAA virtual server, an Oracle-type load-balancing virtual server, or a non-HTTP Layer-7 protocol on an
      LB/CS/CGNAT-LSN/NAT64 device (CVE-2026-88775/88776/88777, each CVSS 8.8), and a predictable-TCP-ISN flaw
      (CVE-2026-88778, CVSS 8.8) that the version upgrade alone does NOT remediate — it additionally requires enabling
      Enhanced ISN Generation. No public attribution of the exploitation activity exists as of this writing; watchTowr's
      FAQ states explicitly "No attribution has been made public," while noting NetScaler perimeter appliances have
      historically been exploited by both state-sponsored and ransomware-affiliated actors. This is a distinct CVE
      family from the CVE-2026-19490/19489 NetScaler auth-bypass pair CISA KEV-listed on 2026-09-09 and from the
      2025-era CitrixBleed/CitrixBleed2 lineage (CVE-2023-4966, CVE-2025-5777, CVE-2025-6543, CVE-2025-7775,
      CVE-2026-3055, CVE-2026-8452) — watchTowr's FAQ states directly that appliances already patched for
      CVE-2026-19490 remain vulnerable to CVE-2026-88771/88772 unless running one of the new fixed builds — but it
      confirms the same underlying pattern of near-annual, pre-authentication, internet-facing NetScaler zero-day
      exploitation that this constituency has now seen repeatedly through 2025-2026.
    region_nexus: "global; CERT-EU and NCSC-NL both issued jurisdiction-specific advisories the same day, confirming direct EU/European relevance; NetScaler Gateway is a common internet-facing remote-access layer in European government and critical-infrastructure networks"
    primary_sector_nexus: "direct — NetScaler ADC/Gateway is widely deployed as perimeter VPN/remote-access infrastructure across Swiss and European public-sector networks; no NetScaler-specific advisory had yet appeared on NCSC-CH's Cyber Security Hub as of this fetch (most recent CH post predates this disclosure), which is itself a coverage-timing gap worth flagging to the Swiss constituency"
