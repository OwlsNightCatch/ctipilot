    discovery_trace: "first seen at: advisories-ncsc-nl, URL https://advisories.ncsc.nl/advisory?id=NCSC-2026-0394 → pivot: cert-eu, URL https://cert.europa.eu/publications/security-advisories/2026-014/ → primary: Citrix PSIRT bulletin, URL https://support.citrix.com/external/article/CTX697096 → corroboration: watchTowr FAQ, URL https://watchtowr.com/intelligence/citrix-netscaler-zero-day-vulnerabilities-faq/ → corroboration: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/citrix-admins-warned-to-shut-down-netscalers-over-2-exploited-zero-days/ → corroboration: CERT.at meldungen listing (Austrian national CERT, Sep 27 entry), URL https://www.cert.at/de/meldungen → corroboration: heise online, URL https://www.heise.de/news/Sicherheitsforscher-warnen-Neue-Zero-Day-Exploits-in-Citrix-Netscaler-11467200.html"
    summary: |
      Citrix published security bulletin CTX697096 on 2026-09-27, fixing eight vulnerabilities in customer-managed
      Citrix NetScaler ADC and NetScaler Gateway and confirming that two of them — CVE-2026-88771 and CVE-2026-88772,
      both CVSS 4.0 9.5 Critical — were already being exploited as zero-days against unmitigated appliances.
      CVE-2026-88771 (CWE-20, improper input validation) lets an unauthenticated remote attacker execute arbitrary
      commands on every NetScaler ADC/Gateway deployment in its default configuration — no additional feature needs
      to be enabled. CVE-2026-88772 (CWE-119, memory overflow) reaches RCE or denial-of-service on any deployment
      with DTLS enabled, which Citrix states is the default state for VPN virtual servers (i.e. most VPN-fronting
      NetScaler Gateways are exposed out of the box). Six companion CVEs in the same bulletin (CVE-2026-88773
      through CVE-2026-88778, CVSS 7.0–9.3) cover HTTP request smuggling, further memory-overflow conditions
      (Gateway/AAA virtual servers, Oracle-type LB virtual servers, non-HTTP L7 features on LB/CS or CGNAT-LSN/NAT64)
      and a predictable-TCP-ISN weakness; none of these six are reported exploited. Fixed builds: NetScaler ADC and
      Gateway 14.1-73.37+ (14.1-FIPS 14.1-73.37 FIPS+), and 13.1-64.23+ (13.1-FIPS/NDcPP 13.1-37.279+). Secure Private
      Access Hybrid deployments using NetScaler instances are also affected and must be upgraded. No workaround
      exists for CVE-2026-88771/88772; only CVE-2026-88778 has a configuration-only fix (enable Enhanced ISN
      Generation). The disclosure chain itself is notable: before Citrix published anything, NCSC-NL privately
      pre-notified Dutch organisations over the weekend of 26–27 September that a partner European CERT had shared
      intelligence on two unpatched, actively-exploited NetScaler RCEs, and multiple NetScaler administrators
      reported on Reddit being told by IT suppliers and security teams to shut appliances down before any CVE ID or
      vendor advisory existed. CISA added both exploited CVEs to its Known Exploited Vulnerabilities catalog the
      same day Citrix published (2026-09-27). Per BleepingComputer's account of the NCSC-NL pre-notification, Citrix
      also filed a notification under the EU Cyber Resilience Act after discovering the exploitation — a concrete,
      in-window instance of the CRA's incident-reporting obligation being exercised by a vendor for actively
      exploited flaws in software widely used as perimeter VPN/remote-access infrastructure, including in European
      public-sector networks. No threat-actor attribution has been made public; watchTowr notes NetScaler flaws
      have historically been exploited by both state-sponsored groups and ransomware operators (citing the
      CitrixBleed/CitrixBleed 2 lineage already tracked in this store).
    region_nexus: "European CERTs (NCSC-NL, CERT-EU, CERT.at) issued same-day advisories/pre-notifications; NetScaler ADC/Gateway is a widely deployed perimeter VPN and remote-access appliance across European public-sector and critical-infrastructure networks, making this directly relevant to Swiss federal/cantonal/communal exposure even though no Swiss-specific advisory had yet appeared as of this fetch."
