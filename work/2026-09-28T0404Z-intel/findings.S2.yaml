    extended_notes: |
      Practical remediation caveat from watchTowr's FAQ (sourced to Citrix guidance): before upgrading a 13.1-branch
      appliance, run `show ns variable` first — if it returns any variables, install 13.1-64.24 instead of the
      bulletin's headline 13.1-64.23 to avoid a known reboot loop during the upgrade. CISA also advises capturing
      logs, a configuration snapshot, a support bundle and a core dump from each exposed appliance BEFORE patching,
      since the upgrade can destroy forensic evidence of prior compromise; an IOC scan is available via the
      NetScaler Console Security Advisory page (14.1-73.36+ with telemetry enabled) or through Citrix Support, but
      Citrix itself warns the IOCs do not cover every technique, so a clean scan is not proof an appliance was not
      already compromised. This is the same NetScaler ADC/Gateway product line already tracked in this store via
      CVE-2025-5777 ("CitrixBleed 2") and the STAC3725 initial-access-broker chain into DragonForce ransomware
      (2026-07-10 entry) — a recurring high-value perimeter target.
    actions:
      - "Upgrade every internet-facing Citrix NetScaler ADC/NetScaler Gateway appliance to 14.1-73.37+ (14.1-FIPS 14.1-73.37 FIPS+) or 13.1-64.23+ (13.1-FIPS/NDcPP 13.1-37.279+) now; before upgrading a 13.1-branch appliance run `show ns variable` — if it returns any variables, install 13.1-64.24 instead to avoid a known reboot loop. Capture logs, a config snapshot, a support bundle and a core dump from each exposed appliance BEFORE patching, since the upgrade removes forensic evidence of prior exploitation."

