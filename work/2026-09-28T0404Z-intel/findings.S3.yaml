  - title: "A patched 2019 Telerik UI for ASP.NET AJAX deserialization RCE (CVE-2019-18935) is still being actively exploited against unpatched IIS servers: one intrusion installs a memory-resident Godzilla-style web shell via ASP.NET's VirtualPathProvider and a modified SweetPotato privilege-escalation tool, a second drops only a Rust-based external scanner"
    sources:
      - { url: "https://asec.ahnlab.com/en/95561/", publisher: "AhnLab ASEC", date: "2026-09-27", role: "primary" }
    discovery_trace: "first seen at: ahnlab-asec, URL https://asec.ahnlab.com/en/ -> primary: AhnLab ASEC, URL https://asec.ahnlab.com/en/95561/ (no pivot needed)"
    summary: |
      AhnLab's ASEC documents two separate, unrelated intrusions in Korea that both exploit CVE-2019-18935, a .NET deserialization vulnerability in the RadAsyncUpload file-upload feature of Telerik UI for ASP.NET AJAX, patched by the vendor since version 2020.1.114 but still reachable on unpatched IIS deployments; successful exploitation executes code with the privileges of the w3wp.exe worker-process account. In the first case, the attacker used the flaw to launch a reverse shell (a raw Windows-socket payload that redirects cmd.exe's stdin/stdout/stderr to a remote TCP connection), ran basic reconnaissance (hostname, privileges, running processes), and deployed modified Potato-family token-impersonation tools — including a web-shell-adapted build of SweetPotato — to escalate to SYSTEM. The intrusion culminated in a memory-resident, file-less web shell: a payload DLL locates the IIS worker thread that has already loaded Telerik.Web.UI, loads an embedded module into that process's memory, and registers a malicious request handler directly with ASP.NET's VirtualPathProvider extensibility point — meaning the web shell runs entirely in server memory with no .aspx file ever written to disk. The installed shell follows the Godzilla web-shell protocol: it distinguishes actions via an HTTP request's Type header, decrypts the request body, on first contact loads and caches an attacker-supplied .NET payload in a cookie-bound session, and on each later request re-invokes that cached payload and returns re-encrypted results — giving the operator an arbitrary, extensible in-memory .NET execution primitive that leaves minimal on-disk forensic trace. The second, unrelated intrusion used the same CVE purely to launch a Rust-based reconnaissance scanner: it pulls a target list from an operator-controlled server, asynchronously probes each target across 53 candidate URL paths for exposed WordPress installer/config pages (/wp-admin/setup-config.php, /wp-admin/install.php), and reports any hit — target URL plus the server's public IP — back to the operator over the Telegram Bot API as a text attachment, entirely without dropping a reverse shell or web shell on the compromised Telerik host itself. ASEC notes CVE-2019-18935 has a long exploitation history (Blue Mockingbird's 2020 Monero-mining campaign; a 2023 CISA/FBI/MS-ISAC advisory covering US federal-agency IIS servers), underscoring that legacy, patched-since-2020 vulnerabilities in still-deployed enterprise .NET web components remain a live, low-cost initial-access vector years after disclosure.
    region_nexus: "global; South Korea telemetry, directly transferable to any organization — including government bodies, per the CISA/FBI/MS-ISAC 2023 advisory this report cites — still running an unpatched pre-2020.1.114 Telerik UI for ASP.NET AJAX component on internet-facing IIS"
