      Single-source as of this run (only Microsoft has published on this specific Storm-3168/JADEPUFFER Azure activity; Sysdig's July 2026 original JADEPUFFER disclosure is a distinct, separate report on the actor's initial identification, not corroboration of this cloud-destruction wave). Recommend the composer add "Storm-3168" as an alias on the existing actor:jadepuffer registry record (currently only carries the Sysdig-assigned name). This is a backlog re-check item per this run's spawn instructions (work/2026-09-27T1308Z-audit/gap-G3.yaml flagged it as clearing PD-11(d) on its face); re-verified against a fresh fetch of the msft-ti listing today, which shows no newer post and no retraction. Age note: published 2026-09-25, ~3 days before this run — right at the edge of the 72h developing-window allowance; included because it independently re-ccleared as still the most current, uncontradicted primary. Two companion backlog items were also re-checked and DROPPED for recency: Microsoft's Storm-2570 ransomware-affiliate-tradecraft post (published 2026-09-24, ~4 days old, outside the 72h developing window, no fresher msft-ti post found today) and Kaspersky Securelist's PAYLOAD binary-free Group-Policy-extortion piece (published 2026-09-21, ~7 days old, well outside the developing window; securelist.com's own feed shows no newer post on this or any related incident as of this run). Both remain genuinely valuable but stale; recommend the quality audit route, not a fresh daily entry, if they are to be recovered at all.

