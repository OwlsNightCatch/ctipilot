  - title: "Microsoft ties JADEPUFFER (tracked as Storm-3168), the actor behind July 2026's first documented agentic-ransomware operation, to a coordinated, sub-eight-minute Azure resource-destruction campaign launched from a credential exposed in a GitHub issue's public edit history even after the issue text itself was redacted"
    sources:
      - { url: "https://www.microsoft.com/en-us/security/blog/2026/09/25/storm-3168-agentic-driven-cloud-attacks-using-compromised-service-principals/", publisher: "Microsoft Security Blog / Microsoft Security Research", date: "2026-09-25", role: "primary" }
    discovery_trace: "first seen at: msft-ti, URL https://www.microsoft.com/en-us/security/blog/topic/threat-intelligence/ -> primary: Microsoft Security Blog, URL https://www.microsoft.com/en-us/security/blog/2026/09/25/storm-3168-agentic-driven-cloud-attacks-using-compromised-service-principals/ (no pivot needed). Re-checked per this run's backlog duty (work/2026-09-27T1308Z-audit/gap-G3.yaml) against today's msft-ti listing, which surfaces no newer post superseding it; carried under the pipeline's 72-hour developing-window allowance (published 2026-09-25, this run 2026-09-28T04:04Z) as no fresher primary exists and the finding independently re-cleared on a fresh read of the listing."
    summary: |
      Microsoft Security Research identified destructive Azure activity it attributes to JADEPUFFER — the actor Sysdig disclosed in July 2026 as the first documented agentic-ransomware operation — and tracks under the designation Storm-3168, giving the first detailed view into the actor's cloud-native operations. Using two compromised service principals from one tenant, the first spent roughly 15.5 hours performing 300+ read-only enumeration calls across virtual machines, subscriptions and resource groups; a second principal, activated 90 minutes later, ran rapid parallel enumeration (including unsuccessful probes against App Service configuration stores and Azure OpenSearch resources, apparently hunting for exposed credentials), then — within one second of a failed key-retrieval attempt against a non-existent storage account — began a roughly seven-minute destructive sequence: 100+ storage-account deletion attempts (mostly successful, though Azure resource locks and storage-account-level deletion protection blocked a subset), plus deletion of a Key Vault, Function App and App Service plan belonging to the same resource group, and parallel (ultimately failed, due to an unsupported API version) attempts to delete Azure SQL databases. The actor also made repeated, unsuccessful attempts against Azure Site Recovery locks and Azure Backup protection locks — an explicit effort to impair recovery — before pivoting, roughly 30 minutes after the destructive burst, to 30+ successful Storage-Account ListKeys credential-collection calls, including against Site-Recovery-related accounts, for possible future exfiltration. Microsoft traces likely initial access to a service principal's client ID, client secret and tenant ID that an employee of the affected organization had posted in plaintext in a public GitHub issue; the issue was later edited to remove the visible secret, but the value remained retrievable through the issue's public edit history — Microsoft states plainly that redacting a disclosed secret does not invalidate it. Timing evidence — five distinct OAuth tokens issued for the destructive/collection work, with two active during the same 70-second window performing different resource-type deletions in parallel — leads Microsoft to assess the operation as automated or scripted rather than manually driven, consistent with JADEPUFFER's original LLM-orchestrated design. No ransom note or confirmed data exfiltration was observed in this specific activity, but Microsoft assesses the destruction, recovery-mechanism targeting and credential harvesting together as consistent with a ransomware/extortion-aligned objective.
