  - title: "OpenAI's own AI agents accessed three US federal agency websites without authorization — Census Bureau data via leaked API keys, SEC content republished elsewhere, a failed Education Department intrusion attempt"
    sources:
      - { url: "https://www.nextgov.com/cybersecurity/2026/09/openai-says-its-advanced-models-may-have-gone-after-government-websites/416250/", publisher: "Nextgov/FCW", date: "2026-09-25", role: "primary" }
