  - title: "Scattered Spider members plead guilty over £39M TfL cyberattack (Computer Misuse Act, Woolwich Crown Court)"
    sources:
      - url: "https://www.nationalcrimeagency.gov.uk/news/cyber-criminals-who-hacked-into-transport-for-londons-computer-network-are-convicted"
        publisher: "National Crime Agency (UK)"
        date: "2026-06-22"
        role: "primary"
      - url: "https://www.itv.com/news/london/2026-06-22/two-young-men-admit-carrying-out-cyber-attack-on-transport-for-london"
        publisher: "ITV News"
        date: "2026-06-22"
        role: "corroborating"
      - url: "https://ca.news.yahoo.com/two-men-plead-guilty-over-143055796.html"
        publisher: "Yahoo News / BBC"
        date: "2026-06-22"
        role: "corroborating"
    discovery_trace: "first seen at: databreaches-net feed (https://databreaches.net/feed/ - bridge feed subcommand), URL https://databreaches.net/2026/06/22/two-men-believed-to-part-of-scattered-spiders-plead-guilty-over-39m-tfl-cyber-attack/ (403 on per-article drill) → WebSearch 'Scattered Spider TfL Transport for London guilty plea 2026' → primary: NCA press release https://www.nationalcrimeagency.gov.uk/news/cyber-criminals-who-hacked-into-transport-for-londons-computer-network-are-convicted → corroborating: ITV News and Yahoo/BBC"
    summary: |
      On June 22, 2026, two members of the Scattered Spider cybercriminal collective — Thalha Jubair (20, east London) and Owen Flowers (18, Walsall) — changed their pleas to guilty on the first day of proceedings at Woolwich Crown Court, avoiding a six-week trial. Both admitted conspiring to commit unauthorised acts against Transport for London (TfL) under the Computer Misuse Act. The August 31 through September 3, 2024 intrusion disrupted TfL services for three months, forced all 28,000 TfL employees to attend in-person password resets, affected approximately 10 million customers including disruption to Oyster card systems, and cost the operator £39 million in loss and recovery costs. Flowers additionally pleaded guilty to attempted intrusions against California healthcare providers Sutter Health and SSM Healthcare Corporation. Sentencing is scheduled at Woolwich Crown Court on July 16, 2026. The NCA attributed the intrusion to the Scattered Spider collective (UNC3944 / Storm-0875). The kill-chain relied on social engineering and Scattered Spider's signature SIM-swapping and MFA-fatigue techniques rather than a software vulnerability; the entry vector was credential theft via social engineering of TfL's helpdesk, consistent with Scattered Spider's documented initial-access playbook (T1566 / T1078 / T1621 MFA fatigue).
    ch_eu_nexus: "EU/UK adjacent — TfL is UK public transport; broader Scattered Spider collective remains active against EU targets. Identity-attack pattern directly relevant to EU public-sector defenders."
    public_sector_nexus: "direct — Transport for London is a UK public-sector operator"
    sector: "transport, public-sector"
    cves: []
    actors_campaigns_malware: ["Scattered Spider", "UNC3944", "Storm-0875"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Two young men have admitted mounting a cyber attack on Transport for London (TfL), which cost tens of millions of pounds"
        attribution: "National Crime Agency (UK)"
        source_url: "https://www.nationalcrimeagency.gov.uk/news/cyber-criminals-who-hacked-into-transport-for-londons-computer-network-are-convicted"
      - quote: "Prosecutors said the cyber attack resulted in a £39 million loss for TfL as well as a 'loss of livelihood' for people dependent on TfL licences."
        attribution: "ITV News"
        source_url: "https://www.itv.com/news/london/2026-06-22/two-young-men-admit-carrying-out-cyber-attack-on-transport-for-london"
      - quote: "Both admitted to charges of conspiring to commit unauthorised acts against TfL under the Computer Misuse Act. Flowers also pleaded guilty to attempted hacks against California healthcare providers Sutter Health and SSM Healthcare Corporation."
        attribution: "Yahoo News / BBC"
        source_url: "https://ca.news.yahoo.com/two-men-plead-guilty-over-143055796.html"
    extended_notes: |
      Defender lesson: TfL's intrusion is the textbook Scattered Spider playbook — social engineering the IT helpdesk, SIM-swapping for MFA bypass, then lateral movement through the corporate network. Detection target is anomalous helpdesk-initiated password resets and MFA changes from call-centre agents followed by immediate privileged-account activity (T1078 Valid Accounts, T1621 MFA Request Generation). EU public-sector operators running on-premise or hybrid identity (AD + Azure AD) should audit helpdesk procedures: require secondary out-of-band verification for any MFA device swap, and alert on >N MFA push rejections from a single user within a short window.

  - title: "UPDATE: FortiBleed — SOCRadar/BleepingComputer expose FortigateSniffer Golang tool, SNIFTRAN, and GPU cracking cluster behind 86,644-device compromise"
    sources:
      - url: "https://www.bleepingcomputer.com/news/security/fortibleed-campaign-used-custom-fortigate-sniffer-to-steal-credentials/"
        publisher: "BleepingComputer"
        date: "2026-06-22"
        role: "primary"
      - url: "https://securityaffairs.com/194004/hacking/fortibleed-the-most-detailed-breakdown-yet-of-an-active-russian-credential-harvesting-operation.html"
        publisher: "Security Affairs"
        date: "2026-06-22"
        role: "primary"
      - url: "https://www.securityweek.com/fortinet-responds-to-fortibleed-campaign/"
        publisher: "SecurityWeek"
        date: "2026-06-22"
        role: "corroborating"
      - url: "https://www.fortinet.com/blog/psirt-blogs/analysis-of-reported-credential-compromise-of-fortigate-devices"
        publisher: "Fortinet PSIRT Blog"
        date: "2026-06-19"
        role: "corroborating"
      - url: "https://socradar.io/blog/fortibleed-fortinet-firewalls-compromised/"
        publisher: "SOCRadar"
        date: "2026-06-16"
        role: "corroborating"
    discovery_trace: "first seen at: BleepingComputer feed (https://www.bleepingcomputer.com/feed/), URL https://www.bleepingcomputer.com/news/security/fortibleed-campaign-used-custom-fortigate-sniffer-to-steal-credentials/ → WebFetch confirmed June 22 article date → SecurityWeek https://www.securityweek.com/fortinet-responds-to-fortibleed-campaign/ → Fortinet PSIRT blog https://www.fortinet.com/blog/psirt-blogs/analysis-of-reported-credential-compromise-of-fortigate-devices → SOCRadar deep dive https://socradar.io/blog/fortibleed-fortinet-firewalls-compromised/"
    summary: |
      New technical analysis published June 22 by BleepingComputer / SOCRadar provides the first full tool-chain disclosure for the FortiBleed credential-harvesting campaign. The threat actors deployed a purpose-built Golang tool named "FortigateSniffer" that abuses FortiOS's native `diagnose sniffer packet` diagnostic command to intercept authentication traffic from a compromised FortiGate appliance. A separate tool, SNIFTRAN, converts raw captured traffic into PCAP files, which are then fed to a Python-based "PCAP Deep Analysis Toolkit" that extracts cleartext credentials, NTLM hashes, Kerberos tickets, LDAP bind credentials, and SQL server authentication material from 24 monitored protocols (RADIUS, NTLM, Kerberos, LDAP, RDP, WinRM, SMB, SSH, SMTP, IMAP, POP3, FTP, MySQL, MSSQL and others). The FortigateSniffer operates only between 07:00 and 18:00 Moscow Time — a deliberate evasion choice. Extracted hashes are cracked through a distributed GPU cluster of 36 enterprise-class GPUs managed via Hashtopolis/Hashcat with a Telegram bot providing live telemetry. Fortinet confirmed the campaign uses credential reuse from three prior CVEs (CVE-2026-24858, CVE-2025-59718, CVE-2025-59719) and brute-force against systems lacking strong passwords and MFA, rather than any new vulnerability. Fortinet recommends: terminate all active sessions, rotate all credentials (including AD credentials harvested downstream), enable MFA, upgrade to firmware supporting PBKDF2 password hashing (which makes offline cracking computationally expensive), and disable external management access.
    ch_eu_nexus: "global campaign; EU public-sector and critical infrastructure FortiGate deployments directly affected — FortiGate is the dominant perimeter firewall in Swiss and EU government networks. SOCRadar noted 194 countries affected."
    public_sector_nexus: "indirect — FortiGate widely deployed in public sector; CISA guidance issued June 20"
    sector: "cross-sector, government, critical infrastructure"
    cves: ["CVE-2026-24858", "CVE-2025-59718", "CVE-2025-59719"]
    actors_campaigns_malware: ["FortiBleed", "FortigateSniffer", "SNIFTRAN"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-to-prior:2026-06-20"
    evidence:
      - quote: "Threat actors deployed a Golang-based tool called 'FortigateSniffer' that abused FortiOS's built-in diagnose sniffer packet functionality to harvest authentication credentials from network traffic"
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/fortibleed-campaign-used-custom-fortigate-sniffer-to-steal-credentials/"
      - quote: "The sniffer only runs between 07:00 and 18:00 Moscow Time, a deliberate evasion choice to blend in with normal business-hours traffic"
        attribution: "BleepingComputer / SOCRadar"
        source_url: "https://www.bleepingcomputer.com/news/security/fortibleed-campaign-used-custom-fortigate-sniffer-to-steal-credentials/"
      - quote: "Fortinet states the attack does not exploit new vulnerabilities, but rather reuses credentials from prior incidents (CVE-2026-24858, CVE-2025-59718, CVE-2025-59719) combined with brute-force techniques against systems lacking strong passwords and MFA"
        attribution: "SecurityWeek"
        source_url: "https://www.securityweek.com/fortinet-responds-to-fortibleed-campaign/"
    extended_notes: |
      Defender vantage: The key detection opportunity is the diagnostic sniffer's presence — FortiOS has audit logging for `diagnose sniffer packet` execution. SOC/DFIR teams with FortiGate in scope should search for abnormal CLI activity via `get system session status`, `diagnose sniffer packet`, and look for unexpected PCAP files under /tmp or any writeable path on the device. EDR telemetry on domain controllers will show Kerberos ticket requests for accounts whose plaintext or NTLM creds may have been harvested — anomalous 4769 Kerberos service-ticket-request events from accounts normally not accessing those services, and 4624 Logon Type 3 events for new source IPs against domain admin accounts, are hunt targets. Any org with FortiGate in the FortiBleed corpus should treat all AD credentials as compromised and run a forced domain-wide password rotation.

  - title: "UPDATE: Klue/Icarus OAuth breach — 9 named cybersecurity firms disclose Salesforce data exfiltration (HackerOne, Huntress, Jamf, OneTrust, Recorded Future, Snyk, Tanium, Insurity, Sprout Social)"
    sources:
      - url: "https://www.securityweek.com/more-cybersecurity-firms-disclose-impact-from-klue-hack/"
        publisher: "SecurityWeek"
        date: "2026-06-22"
        role: "primary"
      - url: "https://klue.com/blog/an-update-on-recent-klue-security-incident"
        publisher: "Klue (victim statement)"
        date: "2026-06-19"
        role: "corroborating"
    discovery_trace: "first seen at: SecurityWeek feed (https://www.securityweek.com/feed/) published 2026-06-22, URL https://www.securityweek.com/more-cybersecurity-firms-disclose-impact-from-klue-hack/ → primary: SecurityWeek article → corroborating: Klue incident update blog"
    summary: |
      A material expansion in disclosed victims from the Klue/Icarus OAuth breach: SecurityWeek reported on June 22 that at least nine organizations confirmed impact from the June 11-12 attack on market intelligence platform Klue. The newly-named victims are HackerOne, Huntress, Jamf, OneTrust, Recorded Future, Snyk, Tanium, Insurity, and Sprout Social — all cybersecurity or security-adjacent technology vendors. The attacker group Icarus obtained legacy Klue credentials to steal OAuth tokens and connect to customer Salesforce CRM environments, exfiltrating sales account information, contact details (names, emails, job titles, phone numbers, business addresses), and internal user data. Icarus set a June 22 deadline threatening to publish data unless negotiations occurred. The victim list concentrating on cybersecurity firms is significant: exfiltrated Salesforce CRM data from HackerOne could expose bug-bounty researcher identities and pending vulnerability reports; data from Recorded Future and Huntress could contain intelligence on tracked threat actors. The attack vector was a dormant, unused integration credential — not compromised perimeter infrastructure.
    ch_eu_nexus: "global; vendors operating in the EU market. Huntress, OneTrust, Snyk have EU customer bases and EU offices, making the leaked CRM data likely to include EU-resident contact information (GDPR Art. 33/34 notification obligation for those entities)."
    public_sector_nexus: "indirect — cybersecurity vendors used by EU public-sector organizations"
    sector: "technology, cybersecurity"
    cves: []
    actors_campaigns_malware: ["Icarus"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-to-prior:2026-06-21"
    evidence:
      - quote: "At least nine organizations disclosed impact: HackerOne, Huntress, Jamf, OneTrust, Recorded Future, Snyk, Tanium, Insurity, and Sprout Social. Exposed data included sales account information, contact details (names, emails, job titles, phone numbers, business addresses), and internal user data."
        attribution: "SecurityWeek"
        source_url: "https://www.securityweek.com/more-cybersecurity-firms-disclose-impact-from-klue-hack/"
      - quote: "Threat actor 'Icarus' claimed responsibility and threatened data publication on June 22 unless negotiations occurred."
        attribution: "SecurityWeek"
        source_url: "https://www.securityweek.com/more-cybersecurity-firms-disclose-impact-from-klue-hack/"
    extended_notes: |
      Structural lesson for defenders: the dormant-credential pattern. Klue held OAuth tokens that maintained live access to customer Salesforce orgs long after integration was deprioritised. Defenders should enumerate all third-party OAuth grants in Salesforce via Setup > Identity > OAuth Usage, revoke any integration not actively in use, and scope active grants to minimum-necessary objects (never whole-org read). Detection: Salesforce Event Monitoring logs (EventType=`LoginAs` or `ApiTotalUsage`) will surface abnormal API query volumes from third-party connected apps; an integration that queries thousands of account records in a single session is a hunt signal.

