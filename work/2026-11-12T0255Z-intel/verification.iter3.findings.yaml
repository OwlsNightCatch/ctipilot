- code: F4
  category: hallucinated-fact
  section: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
  item: "summary, body para 2 and sourcing_note (claims ec90421781, bfafd5e3e6): initial access stated as unknown and 'not a flaw'"
  url_or_quote: "\"How the panels were reached is unknown\" (summary); \"How the panels were reached is not known: Huntress's telemetry points to compromised credentials or hijacked operator sessions and it calls this abuse of legitimate functionality, not a flaw\" (body); \"No source says how the panels were reached ... or reconciles ConnectWise's suspicion of third-party extensions with the Run Command activity Huntress observed\" (sourcing_note)"
  summary: "The entry's own primary, https://www.huntress.com/blog/sckit-worm-rogue-screenconnect, now opens with 'Update: 11/11/26 @ 11:34pm ET': 'Huntress has learned that the activity seems to be related to one of the specific extensions that had already been disabled by ConnectWise, RMM+' ... 'versions 1.0.31 and 1.0.32 contained a serious authentication flaw: if an administrator had never configured the extension's access key, RMM+ would accept a blank one' ... 'There was no corresponding login activity and the commands appeared in the logs reviewed linked to RMM+.' The gate's cached copy (fetched 04:35Z) predates the update, which went up at about 04:34Z; my fetch at ~05:58Z carries it (page datePublished 2026-11-12T02:00Z). The summary, the body sentence and the sourcing_note now contradict the primary: Huntress itself names an extension authentication flaw as the likely path. Rewrite those three places: the page's own update reconciles ConnectWise's extension suspicion with the Run Command activity; keep the BleepingComputer 'compromised credentials or hijacked sessions' sentence only as the earlier Huntress position."
- code: F8
  category: needs-more-research
  section: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
  item: "Exposure, Detection, Defender takeaway and actions[0] omit the RMM+ detail"
  url_or_quote: "actions[0]: \"... and disable the five named extensions (on-premises instances by hand) ...\""
  summary: "Same Huntress update gives the discriminator an on-prem or MSP operator needs: RMM+ 1.0.31 and 1.0.32 accept a blank access key when 'RMMPlus.AccessKey' was never set, and RMM+ 'bypasses ScreenConnect's user accounts, roles, and MFA'; Huntress says most RMM+ installs were legitimate and that the commands showed no login activity. Exposure should say which extension versions and which unset setting matter and that the commands show up linked to RMM+ rather than to a login; the action should include checking whether RMM+ was installed with an empty access key (and rotating it) beside disabling the five extensions. Only the Huntress page carries this (the ConnectWise advisory returns 403 on every transport, BleepingComputer has not picked it up), so state it as Huntress's finding."
- code: F3
