- code: F3
  category: claim-not-supported
  section: 2026-11-12/falcon-c2-browser-implant-government-webmail-script-tag
  item: "body para 2, claim 2877dffa08"
  url_or_quote: "\"Against a justice-department entity in another country, a Chrome extension named PDF Viewer, like Jewelbug's extension, which the sources read do not tie to this one, sideloaded in developer mode, checked in every 3 to 4 minutes for over three weeks ...\" ([Unit 42, 2026-11-11])"
