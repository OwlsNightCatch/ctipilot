- code: F4
  category: hallucinated-fact
  section: 2026-11-11/cve-2026-125350-chrome-xml-use-after-free-exploited-kev
  item: "update section, last sentence, claim 7b563e4d3a (also 61f8d56cd4 and the record summary wording 'no longer lists a second XML bug')"
  url_or_quote: "\"Google's pages disagree about whether a second XML bug was fixed.\""
  summary: "Both Google pages list the second bug as fixed. Stable 157.0.8103.50 (https://chromereleases.googleblog.com/2026/11/stable-channel-update-for-desktop_018223192.html) has one row '[TBD][572578603][582442907] High CVE-2026-125350: Use after free in XML. Reported by Arni Hardarson ... on 2026-10-12 and anonymous on 2026-11-06' and says 'This update includes 9 security fixes' while listing 8 CVE rows, so the second bug is still counted and listed, folded into the same CVE. Extended Stable 156.0.8078.96 lists '[572578603] High CVE-2026-125346' and '[582442907] High CVE-2026-125350' separately. The pages disagree on whether bug 572578603 has its own CVE id, not on whether it was fixed. Reword to: Google's Stable page lists bug 572578603 under CVE-2026-125350, while the Extended Stable page lists it as CVE-2026-125346; and 'no longer lists a second XML use-after-free' should read 'no longer lists CVE-2026-125346 as a separate row'."
- code: F14
  category: quantifier-without-source
  section: 2026-10-23/fortinet-hardening-release-fortios-fortimanager-fortimail
  item: "(low confidence) summary tail and body para 1: 'no Fortinet page states exploitation'"
  url_or_quote: "\"The advisories withheld until Patch Tuesday were published on 2026-11-10; no Fortinet page states exploitation, and NCSC.ch listed the status as unknown\""
  summary: "The entry cites FG-IR-26-175 (https://fortiguard.fortinet.com/psirt/FG-IR-26-175), which says 'This has been reported to be exploited in the wild, customers are urged to apply the workaround below' for CVE-2026-104286, and the body's own last sentence of that paragraph block says the FortiMail builds 'also fix the exploited CVE-2026-104286'. Each of the 19 advisories of 2026-11-10 shows 'Known Exploited: No', so the intended claim is true for those pages; scope the quantifier ('none of the 2026-11-10 advisories for these rows states exploitation') in the summary and body."
- code: F4
  category: hallucinated-fact
  section: 2026-10-23/fortinet-hardening-release-fortios-fortimanager-fortimail
  item: "(low confidence) Detection line, new BGP clause"
  url_or_quote: "\"... and OSPF or BGP events from routers that are not configured neighbours.\""
  summary: "FG-IR-26-268 (https://fortiguard.fortinet.com/psirt/FG-IR-26-268, CVE-2026-126254, Attack Type Authenticated) says the bgp daemon flaw 'may allow a configured ibgp neighbor to send malicious/malformed attributes to all connected routers', so the sender is a configured iBGP peer; watching for events from routers that are not configured neighbours fits the OSPF row (FG-IR-26-267, unauthenticated LSA broadcast) but not the BGP row. The line is the composer's inference and is not labelled as one. Split it: unconfigured OSPF speakers; malformed BGP attributes or session resets from an existing iBGP peer (and the entry's own cves record already says post-auth)."
