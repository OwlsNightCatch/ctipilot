  section: 2026-11-07/cve-2026-111497-brotli-desigo-cc-mitel-openscape-cisco-duo
  item: "body para 4, claim 7c20326e6a"
  url_or_quote: "\"Its single fix table, with no per-CVE column, lists Duo Network Gateway (3.4.2), Spaces (24.22.1), RoomOS on Board, Desk and Room Series devices (on-premises 11.41.2.3 and 26.7.4.3) and a longer list whose fixes are dated November 2026 to July 2027\" ([Cisco PSIRT, 2026-10-27]) in a paragraph that cites version 1.11 of 2026-11-10"
