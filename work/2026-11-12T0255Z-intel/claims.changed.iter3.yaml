claims:
  - claim_id: 652507a60b
    entry: 2026-07-25/certighost-cve-2026-54121-ad-cs-dc-impersonation-poc
    surface: "summary"
    kind: frontmatter
    text: "Researchers published exploitation details and a public PoC (2026-07-24) for \"Certighost\" (CVE-2026-54121), an Active Directory Certificate Services flaw Microsoft patched on 2026-07-14: a low-privileged domain user can make an Enterprise CA issue a certificate carrying a Domain Controller's identity, authenticate as that DC via PKINIT, and DCSync the krbtgt hash. Kaspersky reported on 2026-11-11 that the Citrus ransomware group attempted the exploit in intrusions that began with stolen contractor credentials, without saying any attempt succeeded, while Microsoft's record still lists no confirmed exploitation; any AD CS estate without the July 2026 cumulative update should treat it as weaponizable now."
  - claim_id: 24f08ea08a
    entry: 2026-07-25/certighost-cve-2026-54121-ad-cs-dc-impersonation-poc
    surface: "actions[0]"
    kind: frontmatter
    text: "Confirm the July 2026 cumulative update (2026-07-14) is applied to every Enterprise CA; on any CA where it is not, clear the chase-fallback flag with certutil -setreg policy\\\\EditFlags -EDITF_ENABLECHASECLIENTDC and restart the service with Restart-Service CertSvc -Force, after testing in staging because legitimate workflows that rely on the chase fallback will break."
