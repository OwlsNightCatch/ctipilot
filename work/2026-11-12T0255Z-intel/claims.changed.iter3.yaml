  - claim_id: e81c215bb5
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "summary"
    kind: frontmatter
    text: "The private keys of eight eMudhra intermediate CA certificates were so weak that anyone could recover them and forge trusted HTTPS certificates for any site, and eMudhra's incident report of 2026-11-10 adds eight RSA intermediates revoked on 2026-11-07 because it cannot show their keys were handled as its policy requires. Browsers and the Apple, Microsoft and Google trust stores block the intermediates, and Microsoft removes the remaining eMudhra roots from Windows, Edge and WebView2 from 2026-11-16. Software with its own trust store or no revocation checking stays exposed until updated (Go, GitLab, Python, Java, macOS command-line tools, SonicWall DPI-SSL, Cisco IOS XE and ISE), and no exploitation is reported."
