claims:
  - claim_id: 3f8850d3c7
    entry: 2026-07-25/certighost-cve-2026-54121-ad-cs-dc-impersonation-poc
    surface: "actions[0]"
    kind: frontmatter
    text: "Confirm the July 2026 cumulative update (2026-07-14) is applied to every Enterprise CA; on any CA where it is not, enable AD CS auditing (Certification Services subcategory and CA AuditFilter 127) and search the directory for computer accounts named GHOST followed by eight random letters and the CA log for a domain-controller-identity certificate requested through the Machine template by a low-privileged account, because Kaspersky reports a ransomware group attempting the public exploit; if the update cannot be applied at once, clear the EDITF_ENABLECHASECLIENTDC flag on the CA as a temporary step, which CybersecurityNews gives as certutil -setreg policy\\\\EditFlags -EDITF_ENABLECHASECLIENTDC (re-enabling the flag restores the exposure)."
  - claim_id: b1f3198325
    entry: 2026-07-25/certighost-cve-2026-54121-ad-cs-dc-impersonation-poc
    surface: "body"
    kind: cited
    text: "Researchers H0j3n and aniqfakhrul published a write-up and a working proof-of-concept for \"Certighost\" ("
    urls: ["https://cybersecuritynews.com/certighost-active-directory-cs-flaw/", "https://techcommunity.microsoft.com/blog/microsoftthreatprotectionblog/detecting-cve-2026-54121-certighost-with-microsoft-defender/4542861"]
  - claim_id: 834a9d9324
    entry: 2026-07-25/certighost-cve-2026-54121-ad-cs-dc-impersonation-poc
    surface: "body"
    kind: cited
    text: "); the flaw, CVE-2026-54121 (CVSS 8.8), is an Active Directory Certificate Services flaw Microsoft describes as \"improper authorization in Active Directory Certificate Services (AD CS) [that] allows an authorized attacker to elevate privileges over a network\" and fixed in the July 2026 Patch Tuesday cycle ("
    urls: ["https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-54121"]
  - claim_id: c11ffbfdab
    entry: 2026-07-25/certighost-cve-2026-54121-ad-cs-dc-impersonation-poc
    surface: "body"
    kind: cited
    text: "A low-privileged domain user, using a machine account it can self-register under the default `ms-DS-MachineAccountQuota` or one it controls, stands up rogue LDAP/LSA services, points the chase at itself and receives a certificate carrying a target Domain Controller's identity; that certificate authenticates via PKINIT as the DC, which the reporting says enabled a DCSync of the krbtgt account hash, a single hop from an ordinary domain foothold to full domain compromise ("
    urls: ["https://cybersecuritynews.com/certighost-active-directory-cs-flaw/"]
  - claim_id: f194738765
    entry: 2026-07-25/certighost-cve-2026-54121-ad-cs-dc-impersonation-poc
    surface: "body"
    kind: cited
    text: "); where it is missing, treat the flaw as weaponizable and as already attempted by a ransomware group, enable the auditing above, clear the EDITF_ENABLECHASECLIENTDC flag as a temporary step until the update is applied, which removes the chase fallback and is undone by re-enabling it ("
    urls: ["https://cybersecuritynews.com/certighost-active-directory-cs-flaw/"]
  - claim_id: abf2c5db36
    entry: 2026-07-25/certighost-cve-2026-54121-ad-cs-dc-impersonation-poc
    surface: "section 2026-11-12T04:17:00Z"
    kind: cited
    text: "Kaspersky says that if exploitation succeeds the CA issues the certificate and the domain controller name in it lets the attackers authenticate as the domain controller account, and it never says an attempt succeeded ("
    urls: ["https://securelist.com/citrus-ransomware/121879/"]
  - claim_id: 5b6cde1d7f
    entry: 2026-07-25/certighost-cve-2026-54121-ad-cs-dc-impersonation-poc
    surface: "record 2026-11-12T04:17:00Z"
    kind: record-summary
    text: "Kaspersky reported on 2026-11-11 that the Citrus ransomware group attempted Certighost in intrusions that began with stolen contractor VPN and RDP credentials, leaving machine accounts named GHOST plus eight random letters; it does not say an attempt succeeded and Microsoft's record still lists no confirmed exploitation."
  - claim_id: bad16c4df4
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "summary"
    kind: frontmatter
    text: "PK Softech AG, the software supplier of Publica and other Swiss pension funds, says unknown attackers used malware to reach part of its IT and that data must be assumed to have left; the Federal Prosecutor's Office is investigating and has added the case to its criminal proceeding against Akira. Tamedia reports that Akira holds about 100 GB and demands ransom, while PK Softech and the federal bodies say no concrete ransom demand reached them; Publica and several other funds say their insured persons' personal data has presumably left. Cantonal police warn that criminals could use leaked personal and financial data for investment-fraud calls."
