  - claim_id: d86f30464a
    entry: 2026-10-29/php2shell-trend-micro-apex-quest-kace-netapp-ontap
    surface: "summary"
    kind: frontmatter
    text: "Trend Micro posted Critical Patch build 7351 for Apex Central and build 20113 for Apex One Service Pack 1 on 2026-11-11, each upgrading PHP to 8.2.35 (the Apex One readme does not name the flaw), while its advisory, last updated 2026-11-04, still shows both as awaiting patches and lists Mobile Security for Enterprise (due on 2026-11-17) and Deep Discovery Analyzer (due on 2026-11-12) as impacted, with critical patches for Deep Discovery Inspector and Email Inspector; Quest says all KACE SMA and SDA versions are affected, with SMA 15.0 CU5 and 15.1 CU2 and the SDA 9.3 hotfix out and advice to block ports 80, 443 and 52230 until applied; and NetApp's advisory lists ONTAP 9 as affected only by CVE-2026-109618, with attacker access as the www user restricted to the PHP jail and hotfix builds from 9.12.1P20HF1 to 9.19.1P4. NetApp says it is aware of public discussion of the vulnerability and none of the three vendors reports an exploited case in what was read, although CISA lists both flaws as exploited."
