  - claim_id: 7afc3822ef
    entry: 2026-11-07/cve-2026-111497-brotli-desigo-cc-mitel-openscape-cisco-duo
    surface: "actions[1]"
    kind: frontmatter
    text: "On the SSA-242944 products with no fix, SIMATIC WinCC V7/V8, WinCC Unified, WinCC OA V3.21, WinCC Runtime Professional, User Management Component and TIA Administrator, disable Brotli compression and decompression at the application or proxy layer where it is not required and add the IIS request-filtering rule that denies br in the Content-Encoding header on UMC (on TIA Administrator when UMC authentication is enabled); on Teamcenter and the Opcenter family apply the mitigations in the Siemens knowledge-base articles SSA-678870 links, and on HyperLynx, PADS and Xpedition block Brotli compression at the network firewall; on every Industrial Edge Management instance running Common Configurator, uninstall all Management Applications and put the instance behind a firewall or WAF, and stop Common Configurator on Edge devices; update WinCC OA V3.20 to V3.20 P17.1 and BRAUMAT and SISTAR to V8.2 Update 5."
