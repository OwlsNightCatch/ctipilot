    entry: 2026-10-29/php2shell-trend-micro-apex-quest-kace-netapp-ontap
    surface: "actions[0]"
    kind: frontmatter
    text: "Install Trend Micro's Apex Central Critical Patch build 7351 and Apex One Service Pack 1 Critical Patch build 20113 (both released 2026-11-11; the Apex One readme updates PHP to 8.2.35 without naming the flaw) on every server now, without waiting for the advisory page to change, and keep their consoles on administrator networks until done; for Mobile Security for Enterprise (patch due 2026-11-17, mitigation from Trend Micro support) and Deep Discovery Analyzer (due 2026-11-12) keep the interim mitigation until the patch ships; install the critical patches the table lists for Deep Discovery Inspector and Email Inspector."
