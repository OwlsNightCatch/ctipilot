    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "actions[0]"
    kind: frontmatter
    text: "On every ScreenConnect instance your organisation or its IT providers run, review Run Command and Toolbox history and the instance audit logs for executions nobody started, including before 2026-11-11, check managed endpoints for a second ScreenConnect client service, and disable the five named extensions (on-premises instances by hand); open no interactive session to a suspect host, use EDR live response or WinRM, because a session can trigger the toolkit to spread to the technician's workstation."
  - claim_id: fa16e63bbf
    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "body"
    kind: cited
    text: "Each host checked for a ScreenConnect client, silently installed an attacker-controlled one, wrote a base64 dropper and fetched SCKit, a 16-file toolkit delivered encrypted whose decryption values the server issues against the requesting machine's UUID ("
    urls: ["https://www.huntress.com/blog/sckit-worm-rogue-screenconnect"]
