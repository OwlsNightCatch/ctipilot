    discovery_trace: "first seen at: cash-ch-awp, URL https://www.cash.ch/sitemap-news.xml (dated titles; 'Iran weist Verantwortung fuer Cyberangriffe auf Kuehlanlagen zurueck', 2026-11-10 14:39 UTC) → pivot: cash.ch article https://www.cash.ch/news/iran-weist-verantwortung-fur-cyberangriffe-auf-kuhlanlagen-zuruck-984149 → WebSearch (\"Iran rejects France attribution refrigeration cyberattacks Shahid Kaveh sanctions Barrot\" and \"Shahid Kaveh refrigeration attacks Iran denies France Araghchi ...\") → pivot: Anadolu https://www.aa.com.tr/en/middle-east/iran-denies-french-accusations-of-cyberattacks-on-supermarket-refrigeration-systems/4119026 and Al Jazeera explainer → primary: French foreign ministry statement https://www.diplomatie.gouv.fr/fr/presse-et-ressources/decouvrir-et-informer/actualites/declaration-d-attribution-a-l-iran-de-cyberattaques-visant-la-france (already cited in the host entry for the attribution itself; the ambassador and sanctions paragraph is not yet carried)."
    summary: |
      Delta on the entry that already carries the French attribution of 2026-11-09 (Shahid Kaveh, the Revolutionary Guard's electronic and
      cyber centre, campaign of 11 to 12 October). Two facts are not yet in that entry. First, the French statement itself announces the
      response: France "va convoquer" Iran's ambassador, and "proposera à ses partenaires européens l'adoption de nouvelles sanctions contre
      des entités et des individus iraniens" implicated in this attack and in other malicious cyber activity, reserving the right to further
      public and non-public measures; it also recalls that the EU adopted sanctions in March 2026 against the Iranian entity it names as
      having contributed to earlier attacks. Second, on 2026-11-10 Iran's Foreign Ministry rejected the accusation: Anadolu reports it "denied
      any involvement" and called the allegations baseless; per the AWP/dpa wire (translated from German) Iran's foreign ministry called the charge an irresponsible
      and ridiculous step meant to damage its standing and its relations with other states, and its minister mocked the French government on X;
      Al Jazeera quotes the ministry as calling the accusations "baseless and biased" and a "highly irresponsible and contemptible action". The
      wordings differ between outlets (translations of the same Persian statement), so only the denial itself is carried as fact; none of the
      outlets reports Iranian evidence. Defender-side reading: the attribution stays a state claim that the accused rejects, so detection and
      hardening decisions must continue to rest on the exposed-controller mechanics and not on the actor; a coordinated EU sanctions proposal
      is announced, not adopted, and no formal listing exists in the sources. BACS's public warning of 2026-11-10, already in the entry, remains
      the Swiss-side action text.
