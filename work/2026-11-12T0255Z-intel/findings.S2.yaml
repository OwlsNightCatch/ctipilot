items:
  - title: "Belgian CCB: attackers abuse Microsoft Entra ID SMS sign-in (phone number plus one-time code, no password) against multiple organisations; disable SMS as a first factor, hunt, and plan for Microsoft's 1 February 2027 SMS and voice retirement"
    sources:
      - { url: "https://ccb.belgium.be/advisories/warning-multiple-belgian-organisations-compromised-through-sms-sign-disable-sms-first", publisher: "Centre for Cybersecurity Belgium (CCB)", date: "2026-11-10", role: "primary" }
      - { url: "https://learn.microsoft.com/en-us/entra/identity/authentication/concept-sms-voice-retirement", publisher: "Microsoft Learn (Entra ID: passkeys by default, retirement of Microsoft-provided SMS and voice authentication)", date: "2026-09-23", role: "corroborating" }
    discovery_trace: "first seen at: ccb-belgium, URL https://ccb.belgium.be/advisories (raw `url` fetch exposed /advisories/<slug> hrefs, newest first) → primary (no pivot needed): https://ccb.belgium.be/advisories/warning-multiple-belgian-organisations-compromised-through-sms-sign-disable-sms-first (read with `extract`) → pivot via the advisory's own link: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-sms-voice-retirement (read with `extract`; vendor timeline). WebSearch (\"CCB Belgium warning SMS sign-in Entra ID organisations compromised\", extended) surfaced no independent press or lab coverage of the attacks themselves."
    summary: |
      The Belgian national cybersecurity authority (CCB) published a warning on 2026-11-10 that "a trusted partner" observed
      successful attacks against multiple Belgian organisations in which attackers abused Microsoft authentication with SMS as
      the first factor, that is sign-in with a phone number and a one-time code and no password. The CCB gives no victim count,
      sector, actor, intrusion chain or date range, and does not name how the attackers obtained or intercepted the code;
      it only states that SMS and voice "can be phished, intercepted or SIM-swapped, whether used as a first or a second factor".
      The advisory covers Microsoft Entra ID (SMS and voice for sign-in, MFA and self-service password reset) and any other
      identity platform that allows SMS or voice as a first factor; the CCB types it as "Misconfiguration".
      The remediation it prescribes, in order: assess dependency first (SMS sign-in, MFA, self-service password reset,
      break-glass accounts, frontline or shared-device workers, external users, third-party systems) with Microsoft's
      Entra SMS and voice usage analyzer and the Authentication methods activity report; treat SMS as first factor as the
      priority, turning off "Use for sign-in" under Authentication methods, SMS, or restricting it to the smallest possible
      group with close monitoring until then; remove SMS and voice from privileged accounts once a phishing-resistant method
      works; roll out passkeys / FIDO2 with a pilot group; and hunt back through sign-in and audit logs as far as retention
      allows for successful SMS-based sign-ins, phone-number or authentication-method changes, unusual locations or devices
      and follow-on activity such as mailbox rules or app consents. It warns against switching SMS off blindly, because users
      can be locked out or left with password-only sign-in.
      Microsoft's own documentation (fetched separately) fixes the vendor clock: from 2026-09-01 passkeys become the default
      sign-in experience and are auto-enabled for users enabled for SMS or voice; from 2027-02-01 Microsoft-provided
      telephony delivery for SMS and voice is retired for all users except Global Administrators and external users, who
      follow on 2027-07-01 (internal guest users stay on the February date); after those dates users whose only MFA method is
      SMS or voice are forced to register a passkey at sign-in, with no opt-out, and customers who still need telephony can
      configure a provider (Soprano, Telesign in private preview) through Microsoft Security Store from 2026-10-30.
      Assessment boundary: the attack observation is the CCB's single-source claim relayed from an unnamed partner; the
      Microsoft timeline is vendor-stated fact. No Swiss case is reported in the sources.
    region_nexus: "Belgian observation by the national authority; the exposure is a tenant configuration, so Swiss public administrations on Microsoft Entra ID / Microsoft 365 hold the same exposure. No Swiss victim is reported in the fetched sources."
    primary_sector_nexus: "direct (technology-class): federal, cantonal and communal administrations, emergency services, armed forces and civil-protection organisations running Entra ID / Microsoft 365 tenants; shared-device and frontline staff are the groups the CCB names as legitimate SMS users"
    sector: "public-sector"
