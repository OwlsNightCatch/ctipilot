        attribution: "Microsoft Learn"
        source_url: "https://learn.microsoft.com/en-us/entra/identity/authentication/concept-sms-voice-retirement"
    extended_notes: |
      Exposure (vendor-documented lever): Microsoft Entra admin center, Authentication methods policy, SMS, the "Use for sign-in" toggle
      and the targeted groups; Microsoft's PowerShell analyzer (github.com/microsoft/entra-sms-voice-usage-analyzer, linked by both the
      CCB and Microsoft) lists users enabled for SMS or voice. The exposure needs no network position: the sign-in portal is internet-facing
      by design; what matters is whether SMS is enabled as a sign-in method and for whom.
      Detection concept (telemetry class first): identity-provider sign-in logs filtered to successful sign-ins whose authentication method
      is SMS (first-factor), joined to identity-provider audit logs for phone-number and authentication-method registration or change
      events shortly before the sign-in, then mailbox-rule creation and OAuth app-consent events in the same session window (CCB's own
      follow-on list). Post-patch style check: this is a configuration fix, so the compromise check is the retroactive log review the CCB prescribes.
      Triage discriminator (only what the sources support): legitimate SMS sign-in exists for frontline / shared-device workers, break-glass
      accounts and external users (CCB's dependency list), so the baseline population from the usage analyzer is the first discriminator;
      a first-ever SMS sign-in for a user who normally authenticates another way, or a phone-number change followed by an SMS sign-in from an
      unusual location or device, is the pattern the CCB names as worth hunting.
      Candidate do-now action for the composer to weigh under the do-now bar: run the usage analyzer / Authentication methods activity
      report to learn who still signs in with SMS and turn off "Use for sign-in" for everyone who has an alternative. The retirement dates
      (2027-02-01 / 2027-07-01) are vendor-fixed and make the migration unavoidable regardless of the attack reporting.
      Context the store already carries: Vaud's device-code phishing warning against Microsoft 365 accounts (entry 2026-11-05/vaud-m365-device-code-phishing-campaign-romandie) is a different technique (OAuth device flow); this item is the first-factor weakness, not a token or consent attack.
