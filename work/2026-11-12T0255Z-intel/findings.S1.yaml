  summary: 'FACTS (Mitel, first issue 2026-11-11, revision 1.0): three flaws in MiVoice MX-ONE, tracked by internal ids because CVE ids were requested but are not yet assigned. MTLVULN-1860 is an authentication
    bypass in the Service Node Manager component: an unauthenticated attacker with LAN network access can gain unauthorized administrative access and view and modify PBX telephony routing and service configuration
    (critical, CVSS 3.1 9.4, AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:H/A:H). MTLVULN-1859 is a command injection in the Service Node Manager that needs administrative privileges and runs operating-system commands
    as the management service account (high, 8.2). MTLVULN-1858 is an improper-authorization information disclosure in the Provisioning Manager that gives any authenticated user with internal LAN access
    the system configuration (medium, 6.5). Mitel says exploiting them together can amplify the impact to critical. Affected: MiVoice MX-ONE 8.0 (8.0.0.33) to 8.2 SP1 (8.2.1.0.14). Fix: Mitel hot fixes
    MX-ONE PM/SNM 8.2 SP0 HF5 and 8.2 SP1 HF2 or later, described in knowledge-base articles KB000127971, KB000128772 and KB000129185 (the KB articles sit behind Mitel''s portal); the issues are corrected
    in MX-ONE 8.3, not yet released. The advisory states no exploitation. The same MX-ONE product is listed ''Not Affected'' by Mitel''s PHP2Shell and Brotli advisories, so this is a separate item.'
