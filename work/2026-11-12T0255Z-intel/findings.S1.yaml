    linux-hwe-6.17 and linux-hwe-7.0 (24.04), linux-azure-7.0 and linux-azure-nvidia (24.04), linux-oem-6.17 (24.04), linux-fips for 24.04, 22.04, 20.04, 18.04 and 16.04, linux-raspi 26.04, linux-xilinx
    and linux-xilinx-zynqmp, and everything for 20.04 and older except the HWE-5.15 and cloud variants named above. The tracker repeats the nftables rule that drops IPv4 TCP packets carrying IP options
