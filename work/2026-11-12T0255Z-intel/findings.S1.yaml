  summary: 'FACTS (Ubuntu tracker, last updated 2026-11-11): the generic kernels are fixed in 7.3.0-10.10 (26.10), 7.0.0-43.43 (26.04), 6.8.0-149.149 (24.04) and 5.15.0-203.213 (22.04), and 20.04 and older
