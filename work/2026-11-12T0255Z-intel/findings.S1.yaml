  extended_notes: 'Single-source reason: the Node.js project is the first-hand disclosing party (reliability A); no independent write-up exists yet. Version numbers come from the project''s dist manifest,
    which I fetched but do not list as a source because it is a machine-readable index. Exposure check: node --version on every host and container image that runs a server; HTTPS and HTTP/2 servers written
    directly on node:http2 or node:https are in scope, frameworks that sit behind a reverse proxy terminating TLS are largely out of scope for the TLS items. Detection concept: process-crash and restart
    telemetry for node server processes (exit on assertion, uncaught exception) correlated with unauthenticated HTTP/2 peers; heap-disclosure flaws leave no crash, so the post-patch step is to treat TLS
    private keys of exposed node HTTPS servers as possibly read where the handler pattern in CVE-2026-123864 exists and rotate them. Vendor products bundling Node.js (Cisco, Splunk, Siemens, Palo Alto published
    inventories for the October Brotli release) will follow with their own advisories.'
- title: 'Mitel MiVoice MX-ONE 8.0 to 8.2 SP1 (MISA-2026-0011): an unauthenticated authentication bypass in Service Node Manager gives administrative access to the PBX (rated critical, 9.4), chained with
