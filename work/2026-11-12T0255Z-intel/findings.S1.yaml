  summary: 'FACTS (Git project, relayed 2026-11-11): ''The Git project released new versions on November 10th, 2026, addressing six vulnerabilities.'' All Git versions back to v2.27.0 are affected; fixed
    in v2.50.2, v2.51.3, v2.52.1, v2.53.1, v2.54.1, v2.55.1 and v2.56.1 (older ones are no longer serviced). CVE-2026-111760: a crafted tree makes the 32-bit ce_namelen wrap so that a validated path is
    written as .git; for a freshly cloned submodule whose .git is a gitfile the symlink is written and its target can hold hooks or config that run attacker-specified code; trigger is an attacker-controlled
    repository cloned with git clone --recurse-submodules (such repositories fail fsck checks so cannot easily be pushed to major forges, but an innocuous .gitmodules pointing at one suffices). CVE-2026-113408:
