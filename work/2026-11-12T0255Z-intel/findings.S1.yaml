  reason: 'recipe note: search?fromScore=9 hides records without a CVSS score (baseScore 0.0), which includes Apache httpd CVE-2026-119618 and all 2026-11-11 Chrome CVEs; page the unfiltered date search
    (search?fromDate=D&toDate=D2&size=100&page=0..n, 671 rows for two days) and filter baseScore 0 with a text read. Also vendor=<name> works (Fortinet 98 rows, Adobe 110) and recovers rows past an RSS
    cap.'
- source_id: fortinet-psirt
  reason: 'recipe note: the RSS holds 50 items and the 2026-11-10 batch has about 98, so advisories such as FG-IR-26-219, -276, -273, -268, -209, -202 are absent from the feed; per-advisory extract of https://fortiguard.fortinet.com/psirt/FG-IR-26-<n>
    reads them with the affected/fixed tables, and EUVD vendor=Fortinet gives the CVE mapping.'
- source_id: siemens-productcert
  reason: 'recipe note (record not in slice): extract of an SSA HTML page drops the product column of the affected table; `url --direct https://cert-portal.siemens.com/productcert/csaf/ssa-<id>.json` returns
    the CSAF with product names, product_status and per-product remediations (vendor_fix, none_available, no_fix_planned, mitigation).'
- source_id: ivanti hub advisories (not a slice record)
  reason: still a JavaScript shell on extract and WebFetch; working substitute is the CNA JSON `url --direct https://cveawg.mitre.org/api/cve/<CVE>` (affected block with fixed version, description, CVSS),
    with the caveat that Ivanti's structured block and description can disagree (CVE-2026-121683).
- source_id: ptc.com advisories (not a slice record)
  reason: https://www.ptc.com/en/support/article/CS483249 returned 403 on WebFetch, 302 on url --direct and an empty body on extract; the CVE JSON from cveawg.mitre.org carries the affected-version list
    but no fixed releases.
- source_id: trendmicro downloads (not a slice record)
  reason: 'recipe note: KA-0024802 lagged the Download Center by at least a day; `url --direct https://downloadcenter.trendmicro.com/index.php?regs=nabu&prodid=<1746 Apex Central | 1745 Apex One>` lists
    critical patches with dates and readme links, and the readmes read with extract (percent-encode the space in ''Apex One'' paths).'
- source_id: bsi-rss
  reason: 'recipe note: `bridge bsi-rss` returns XML, not JSON; parse the item titles ([NEU]/[UPDATE] [kritisch|hoch|mittel]) with ElementTree. Cached snapshot ended 2026-11-11 14:24 UTC although the channel
