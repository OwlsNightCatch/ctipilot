  summary: 'FACTS (Apache HTTP Server project): CVE-2026-119618 is rated critical by the project and is a CWE-362 race (''Concurrent Execution using Shared Resource with Improper Synchronization'') in mod_http2''s
    assign_headers() that ''can lead to RCE''. Affected: Apache HTTP Server 2.4.55 through 2.4.70, and mod_h2 releases from GitHub 2.0.8 through 2.0.42. Fixed in Apache HTTP Server 2.4.71, released 2026-11-11
    (fix commit 824beab9b9424d6cfb29595248fdbf6c3dddeab1). Credit: Anthropic''s OSS Scanner (vulnerability ANT-2026-MAPKT6MZ, reported 2026-10-26) and Anthony Weems and Simon Scannell of Google Cloud Vulnerability
    Research (reported 2026-11-03). The same release fixes CVE-2026-106023 (important; mod_md NULL dereference crashes the child process, 2.4.30 through 2.4.70) and CVE-2026-109163 (low; mod_vhost_alias
    one-byte stack overwrite, 2.4.69 and 2.4.70). WHAT THE SOURCES DO NOT SAY: no CVSS vector or score exists yet (the CVE record carries only a textual severity, and ENISA EUVD lists base score 0.0), no
    source states exploitation or a public proof of concept, and the project names no workaround or mitigation. Whether a given server is reachable depends on mod_http2 being loaded and HTTP/2 negotiated
    (inference from the component name, not stated by the project). DISTRO STATE (Debian tracker, read 2026-11-12): bookworm 2.4.68-1~deb12u1 and 2.4.67-1~deb12u3 (security), trixie 2.4.68-1~deb13u1 and
    2.4.69-1~deb13u1 (security) and forky 2.4.69-1 are listed vulnerable; only sid 2.4.71-1 is fixed. Distribution packages that backport fixes will show a different build string, so the check is the vendor
    advisory, not the upstream version number.'
