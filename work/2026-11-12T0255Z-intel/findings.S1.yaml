  summary: 'FACTS (Siemens ProductCERT, both V1.0 of 2026-11-10, CVSS 3.1 9.8 and 4.0 9.2 for the Brotli decoder out-of-bounds write CVE-2026-111497): SSA-242944 lists 15 affected industrial products: SIMATIC
    WinCC V7/V8, WinCC Unified PC Runtime, WinCC Unified for Industrial Edge, WinCC Unified SIQENCE, WinCC Runtime Professional, WinCC Companion, WinCC OA V3.21 and V3.20 (before V3.20 P17.1), SIMATIC BRAUMAT
    and SISTAR (V8.2 Update 1 up to before V8.2 Update 5), SIMATIC Profiling Tool, TIA Administrator, User Management Component (UMC), COMOS Walkinside and Project Server Web Administration Tool (gDAP is
    listed as not affected). ''Currently no fix is available'' for WinCC V7/V8, WinCC Unified, WinCC Runtime Professional, WinCC Companion, WinCC OA V3.21, TIA Administrator, UMC and others, and no fix
    is planned for the Profiling Tool; fixes exist only for WinCC OA V3.20 (V3.20 P17.1) and BRAUMAT/SISTAR (V8.2 Update 5). Siemens'' interim control for all of them is to ''Temporarily disable Brotli
    compression and decompression at the application or proxy layer if it is not strictly required'', and for UMC and TIA Administrator an IIS Manager request-filtering rule on the Content-Encoding header
    with the deny string br. SSA-678870 lists 28 affected Siemens software products (Teamcenter V2412, V2506, V2512 and V2606; Opcenter Execution Core, Discrete, Foundation, Pharma and Process, Opcenter
    Intelligence, Quality, RDnL, X and Connect; Polarion; Solid Edge; Simcenter; Calibre ICE; Capital; HyperLynx; Xpedition and PADS; Insights Hub; PAVE360) with ''Currently no fix is available'', Teamcenter
    and IIS reverse-proxy mitigations in Siemens knowledge-base articles PL8869204 and PL8869211, and a firewall block of Brotli for the EDA tools. The Brotli flaw is exploited per CISA; Siemens states
    no exploitation against these products. Relevance for the constituency is mainly SIMATIC WinCC, UMC and TIA Administrator in communal water, energy and building-automation OT, where no fix exists and
    the mitigation is a proxy or IIS filter.'
