  summary: 'FACTS (Node.js project): the 2026-11-11 security release covers the 26.x, 24.x and 22.x lines and says ''The highest severity issue fixed in this release is HIGH.'' High: CVE-2026-123863 (HTTP/2
    teardown assertion lets any unauthenticated client abort a default http2 server; 24.x, 26.x), CVE-2026-123864 (a zero-length TLS write re-enters llhttp_execute(); an unauthenticated client can read
    memory belonging to other connections, including TLS private keys and other users'' requests; needs a handler that calls res.flushHeaders() before the request body ends and later res.end() with a non-empty
    chunk, and a route that echoes or stores a request body; cleartext node:http is not affected; 22.x, 24.x, 26.x), CVE-2026-123865 (HTTP/2 sessions never cleaned up after a protocol error during shutdown,
    memory and file-descriptor leak; incomplete fix of CVE-2026-48937), CVE-2026-123866 (HTTP/2 stream teardown can send freed response memory, including other connections'' response buffers, to a peer),
    CVE-2026-126051 (deferred TLS handshake callbacks give a remotely triggerable uncaught exception when SNICallback, OCSPRequest, newSession, resumeSession or server.addContext() are used; 24.x, 26.x),
    CVE-2026-123872 (TLS 1.2 renegotiation lets a client change the servername to bypass per-host client-certificate policy) and CVE-2026-123874 (HTTP/2 use-after-free of Http2Stream when a respondWithFile()
    or respondWithFD() stream is reset during a pending write, unauthenticated memory corruption; 24.x, 26.x). Medium: CVE-2026-123828 (HTTP/2 altsvc() one-byte heap overflow when an attacker-controlled
    :authority is passed to it), CVE-2026-123867 (CA-only SNI context fails open to the default CA, bypassing per-host mTLS), CVE-2026-123868 (HTTP/2 inbound data not charged to maxSessionMemory, memory
    exhaustion), CVE-2026-123871 (proxy credentials in ERR_PROXY_INVALID_CONFIG messages), CVE-2026-123877 (https.Agent cross-policy TLS session reuse bypasses certificate validation) and CVE-2026-123875
    (respondWithFile() cancel NULL dereference crash). Low: CVE-2026-123829, CVE-2026-123862, CVE-2026-106071. Dependency updates: llhttp, undici and sqlite. Several reports credit Chris Rohlf in collaboration
    with Claude and Anthropic Research. FIXED BUILDS (project release manifest, security flag set): 26.13.1 and 24.22.3 (2026-11-10) and 22.23.5 (2026-11-11); the blog post itself says releases are ''available
    on, or shortly after, Wednesday, November 11, 2026'' and names no numbers. No source states exploitation.'
