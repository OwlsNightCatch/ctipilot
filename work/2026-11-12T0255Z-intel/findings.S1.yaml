    (links the desktop post) -> https://chromereleases.googleblog.com/2026/11/stable-channel-update-for-desktop_01744469280.html and https://chromereleases.googleblog.com/2026/11/extended-stable-update-for-desktop_01570615041.html;
    cross-check from the Palo Alto feed https://security.paloaltonetworks.com/rss.xml (PAN-SA-2026-0014)'
  summary: 'FACTS (Google): the Stable channel was updated on 2026-11-11 to 157.0.8103.78/.79 for Windows and Mac and 157.0.8103.78 for Linux, with 83 security fixes. Five are Critical use-after-free bugs:
    CVE-2026-126885 (ServiceWorker), CVE-2026-126895 (CSS), CVE-2026-126879 (Layout), CVE-2026-126846 (Skia) and CVE-2026-126911 (Accessibility); the rest are High, for example V8 type confusion and use-after-free
    (CVE-2026-126864, -126847, -126910), Skia and ANGLE flaws. Several are credited to Anthropic researchers assisted by Claude and to OpenAI Codex Security. The post makes no exploited-in-the-wild statement
    for these. The Extended Stable channel went to 156.0.8078.100 (Windows and Mac) with 72 security fixes, four of them Critical (CVE-2026-126879, -126885, -126895, -126911). The exploited CVE-2026-125350
    was fixed earlier in 157.0.8103.50, so .78/.79 is the build to move to. FACTS (Microsoft): the Edge security release notes, section of 2026-11-11, say ''Microsoft released the latest Microsoft Edge
    for Android (Version 157.0.4341.53)'' and that ''The Chromium team reported that CVE-2026-125350 has an exploit in the wild, and this update contains a fix for it''. The 2026-11-09 section still says
    ''Microsoft is aware of the recent exploits existing in the wild. We are actively working on releasing a security fix.'' The newest Edge Stable (desktop) release listed is 157.0.4341.42 of 2026-11-05,
    which predates the Chrome fix, so no Edge desktop build naming CVE-2026-125350 appeared on that page when read on 2026-11-12. Palo Alto lists a Chromium monthly update (PAN-SA-2026-0014) for the same
    month. Delta for the entry: it said Edge and other Chromium browsers were still preparing patches; Edge for Android now has the fix, Edge desktop does not yet, and Chrome itself has moved on to .78/.79.'
