    -> primary: https://access.redhat.com/security/cve/CVE-2026-123710 and https://access.redhat.com/security/cve/CVE-2026-110697'
  summary: 'FACTS (Red Hat, pages dated 2026-11-11, scores marked preliminary): CVE-2026-123710 (CVSS 3.1 9.8, AV:N/AC:L/PR:N/UI:N): the Quay service key server authenticates a key-rotation call only by
    checking that the JWT is signed by an already approved service key with the expected audience and issuer; an anonymous token minted by /v2/auth satisfies that check, so an unauthenticated client can
    install its own approved signing key with no expiry and forge registry tokens accepted for any repository, giving read and write access to private images and replacement of repository tags. Deployments
    where /keys is reachable by untrusted clients are affected. Red Hat''s mitigation: restrict /keys at the proxy or load balancer to trusted internal components, review audit logs for service_key_rotate
    and service_key_delete events with a null expiration_date, and remove unrecognised approved service keys, noting that ''Deleting a rogue key is not durable until a fixed build is deployed, because the
    anonymous request can install a new key.'' No fixed build is named on the page. CVE-2026-110697 (CVSS 3.1 9.9, authenticated, scope changed): the robot-account listing builds a SQL LIKE pattern from
    user-controlled namespace names without escaping wildcards, so a namespace containing an underscore can match another tenant''s namespace and return robot accounts with decrypted tokens; in OpenShift
    environments where Quay is the integrated registry the stolen credentials can inject images into CI/CD pipelines. Fixed Quay releases: 3.9.28, 3.10.28, 3.12.24, 3.14.10, 3.15.9, 3.16.7, 3.17.7 and 3.18.3;
    Quay.io is already fixed; interim steps are to restrict who can create namespaces containing an underscore and rotate robot tokens of colliding namespaces. Neither page states exploitation.'
