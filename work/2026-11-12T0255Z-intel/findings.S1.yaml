  summary: 'FACTS (Plone/Zope Security Team, 2026-11-10): the fixes address a remote code execution vulnerability affecting all supported Plone versions 6.0, 6.1 and 6.2 and, per the team, older versions
    ''back to at least Plone 4.3''. It is ''a chain of several issues'' that let an anonymous visitor run code on the server: the conditional modifiers in portal_modifier (Products.CMFEditions) had no security
    declarations, so an anonymous visitor could change the TALES condition of a modifier and then run it (the condition is also evaluated when an editor saves versioned content); Products.CMFPlone, Products.MimetypesRegistry
