- title: 'Chrome 157.0.8103.78/.79 (2026-11-11) supersedes the build that fixed the exploited CVE-2026-125350: 83 security fixes including five Critical use-after-free bugs, Extended Stable 156.0.8078.100
    with 72 fixes; Edge for Android 157.0.4341.53 carries the exploited fix while no Edge desktop release naming it is listed'
  sources:
  - url: https://chromereleases.googleblog.com/2026/11/stable-channel-update-for-desktop_01744469280.html
    publisher: Google Chrome Releases (Stable Channel Update for Desktop, 157.0.8103.78/.79)
