  extended_notes: 'Detection concept (mine, not from the project): web-server and reverse-proxy telemetry for abnormal HTTP/2 request bursts followed by httpd worker crashes in the error log, and process-creation
    events with an httpd worker as parent, which is how a memory-corruption RCE in a worker would show. The project names no indicators of compromise and no workaround; the lever is the 2.4.71 update (or
    the distribution''s backport) plus a worker restart. Anthropic reporting appears again as finder (as with the kernel and Node.js items), consistent with AI-assisted discovery producing batches of memory-safety
    fixes.'
- title: 'Node.js security releases of 2026-11-11 (26.13.1, 24.22.3, 22.23.5): seven high-severity flaws including unauthenticated TLS heap disclosure (CVE-2026-123864) and HTTP/2 use-after-free memory
    corruption (CVE-2026-123874), plus six medium and three low'
  sources:
  - url: https://nodejs.org/en/blog/vulnerability/november-2026-security-releases
    publisher: Node.js project (security releases, 2026-11-11)
    date: '2026-11-11'
