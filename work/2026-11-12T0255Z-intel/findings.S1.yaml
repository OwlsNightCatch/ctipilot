  discovery_trace: 'first seen at: nodejs-security-releases (slice record), URL https://nodejs.org/en/feed/vulnerability.xml (newest item ''Wednesday, November 11, 2026 Security Releases'') -> primary:
    https://nodejs.org/en/blog/vulnerability/november-2026-security-releases (read with extract); fixed version numbers from the project''s release manifest https://nodejs.org/dist/index.json (security
