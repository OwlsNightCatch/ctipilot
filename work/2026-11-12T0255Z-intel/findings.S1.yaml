    json module so protected methods could be called without permission. Four GitHub advisories are rated critical (CMFEditions, CMFPlone, MimetypesRegistry, plone.batching) and one medium (plone.restapi);
    CVE numbers have been requested. FIX: update to Products.CMFPlone 6.2.3 / CMFEditions 5.0.2 / MimetypesRegistry 4.0.2 / plone.batching 3.0.3 / plone.restapi 10.2.1 (Plone 6.2), CMFPlone 6.1.6 / CMFEditions
    4.0.7 / MimetypesRegistry 3.0.2 / plone.batching 2.0.8 / plone.restapi 9.15.8 (6.1), CMFPlone 6.0.16 with the 4.0.7, 3.0.2 and 2.0.8 packages (6.0), or install the hotfix package Products.PloneHotfix20261110
    on any version from 4.3 to 6.2 and restart all Zope instances. The earlier workaround, blocking every URL that contains portal_modifier at the web server, remains advised and can stay in place. The
