  discovery_trace: 'first seen at: enisa-euvd (slice record), URL https://euvdservices.enisa.europa.eu/api/search?vendor=Arista&fromDate=2026-11-10&toDate=2026-11-12&size=100 (26 Arista rows, five scored
    8.9 to 9.4) -> per-record https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-122810 -> primary: https://www.arista.com/en/support/advisories-notices/security-advisory/25030-security-advisory-0208
    and https://www.arista.com/en/support/advisories-notices/security-advisory/25040-security-advisory-0218 (extract); BSI WID-SEC-2026-4509 ''Arista EOS'' (hoch) in the https://wid.cert-bund.de feed'
  summary: 'FACTS (Arista, advisories dated 2026-11-10, revision 1.0): CVE-2026-121289 is a stack-based buffer overflow (CWE-121) in the BGP agent, CVSS 3.1 9.8 and CVSS 4.0 9.3: ''a specially crafted packet
    can cause the BGP agent to crash'', which ends all BGP sessions on the device, and ''it may also be possible for a sophisticated attacker to achieve arbitrary code execution''. Exposure requires BGP
    configured and the multi-agent routing protocol model in use (service routing protocols model multi-agent), and the vulnerable path is active whenever a BGP peering session is established. Affected:
    EOS 4.36.2F and below, 4.35.6M and below, 4.34.8M and below, 4.33.10M and below, and all end-of-support trains from 4.25.1F, on the EOS 7xxx/7xxxR, AWE, ZTX, CloudEOS, cEOS-lab, vEOS-lab and CloudVision
    eXchange platforms the advisory lists. Arista''s mitigation is to discard received BGP Tunnel Encapsulation attributes (''neighbor default received attribute discard 23'') for sessions that do not rely
    on them, or BGP peer authentication with TCP-AO. The indicator is the log message that the Bgp process terminated, status -11. Reported by Joshua Foote of JP Morgan Chase. CVE-2026-121371 is a path
    traversal (CWE-22), CVSS 3.1 7.5 and CVSS 4.0 8.7: with eAPI enabled and default-service enabled, which the advisory says reflects default configurations, ''a specially crafted HTTP request can allow
    an unauthenticated, remote attacker to read arbitrary files, including sensitive credentials from the switch filesystem''; affected 4.36.3M and earlier, 4.35.7M and earlier, 4.34.9M and earlier, 4.33.11M
    and earlier, all of 4.32.x and the end-of-support trains; mitigation is ''no default-services'' under management http-server and management api http-commands; the indicator is irregular requests with
