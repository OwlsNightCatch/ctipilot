  - claim_id: 7e07176c17
    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "headline"
    kind: frontmatter
    text: "ScreenConnect: rogue clients pushed to 288+ endpoints; Huntress ties it to RMM+ extension with blank access key"
  - claim_id: eb85532cfe
    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "summary"
    kind: frontmatter
    text: "Huntress saw an operator use access to several cloud-hosted ScreenConnect panels on 2026-11-11 to run Run Command as SYSTEM on groups of managed endpoints, installing an attacker-controlled second ScreenConnect client and the SCKit toolkit on at least 288 hosts at 48 organisations within 90 minutes; Sophos independently saw the same client deployments. Huntress later said the activity seems related to the third-party RMM+ extension, whose versions 1.0.31 and 1.0.32 accepted a blank access key and bypass ScreenConnect's accounts and MFA, while ConnectWise had not identified an initial access vector and disabled five third-party extensions in about 400 partner environments, a containment step that removes nothing already installed."
  - claim_id: 2eb78f83a7
    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "actions[0]"
    kind: frontmatter
    text: "On every ScreenConnect instance your organisation or its IT providers run, review Run Command and Toolbox history and the instance audit logs for executions nobody started, including before 2026-11-11, check managed endpoints for a second ScreenConnect client service, and disable the five named extensions starting with RMM+ versions 1.0.31 and 1.0.32, which accept a blank access key (on-premises instances by hand); open no interactive session to a suspect host, use EDR live response or WinRM, because a session can trigger the toolkit to spread to the technician's workstation."
  - claim_id: 4d9aac4e4d
    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "body"
    kind: cited
    text: "On 2026-11-11 Huntress observed an operator using access to several cloud-hosted ScreenConnect panels to run commands as SYSTEM on groups of managed endpoints through the Run Command feature, hitting at least 288 hosts at 48 organisations that use Huntress within 90 minutes ("
    urls: ["https://www.huntress.com/blog/sckit-worm-rogue-screenconnect"]
  - claim_id: f09404adb5
    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "body"
    kind: cited
    text: "Huntress's later update says the activity seems related to RMM+, a third-party extension that bypasses ScreenConnect's user accounts, roles and MFA and authenticates requests with a shared access key: versions 1.0.31 and 1.0.32 accepted a blank key when an administrator had never set one, commands reached endpoints across several instances within minutes with no corresponding login activity and were linked in the logs to RMM+; most RMM+ installations it saw were legitimate ("
    urls: ["https://www.huntress.com/blog/sckit-worm-rogue-screenconnect"]
  - claim_id: 8a38f15ec2
    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "body"
    kind: cited
    text: "ConnectWise had not identified an initial access vector, suspects the actor used independent third-party extensions that partners may have added, and disabled five (Labtech Plus, RMM Plus, RMM+, RMM Plus Password Link and RMM+ Password Link) in about 400 partner environments; on-premises customers must disable them by hand ("
    urls: ["https://www.bleepingcomputer.com/news/security/active-screenconnect-attacks-breach-msps-impact-dozens-of-organizations/"]
  - claim_id: fc50b96107
    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "body"
    kind: cited
    text: "Huntress reconstructs a second stage meant to spread through the connecting technician's panel but saw no successful jump ("
    urls: ["https://www.huntress.com/blog/sckit-worm-rogue-screenconnect"]
  - claim_id: 8e80d5e01f
    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "body"
    kind: cited
    text: "**Detection:** ScreenConnect instance audit logs, Run Command and Toolbox history for mass executions nobody started, and RMM+ requests with no matching login; process-creation telemetry with the ScreenConnect client service as parent of cmd, PowerShell or msiexec; curl or PowerShell downloads followed by a silent msiexec install, the pattern Sophos describes; a second client service installed, Defender exclusions added, the legitimate client's start type changed to manual, and a new scheduled task running as SYSTEM ("
    urls: ["https://www.huntress.com/blog/sckit-worm-rogue-screenconnect", "https://www.sophos.com/en-us/blog/malicious-screenconnect-deployments-observed"]
  - claim_id: e2ea05602d
    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "body"
    kind: cited
    text: "Isolation does not remove the persistence; hosts reinfected afterwards ("
    urls: ["https://www.huntress.com/blog/sckit-worm-rogue-screenconnect"]
  - claim_id: 18bf4575e7
    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** treat Run Command or Toolbox executions you did not start as a compromise, not a misconfiguration; remove or disable RMM+ and the other four extensions, verify the legitimate client before removing anything, rotate ScreenConnect credentials and revoke active sessions from a clean device, revoke the browser and identity-provider sessions the toolkit could steal, and keep hosts out of service until the rogue client and persistence are gone ("
    urls: ["https://www.huntress.com/blog/sckit-worm-rogue-screenconnect"]
  - claim_id: ab8512008f
    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "body"
    kind: derived
    text: "**Exposure:** a ScreenConnect instance whose panel can run commands on managed endpoints, run by the organisation or an IT provider; an RMM+ extension at version 1.0.31 or 1.0.32 with RMMPlus.AccessKey left blank is the condition Huntress describes, and the Extensions list shows which of the five named extensions are installed; an endpoint shows a second ScreenConnect client service pointing at a relay that is not your own."
