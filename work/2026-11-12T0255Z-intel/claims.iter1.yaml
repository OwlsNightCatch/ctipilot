  - claim_id: d7ca19c366
    entry: 2026-08-13/cve-2026-58115-simatic-iot2050-node-red-unauth-root
    surface: "headline"
    kind: frontmatter
    text: "VulnCheck saw Node-RED exploitation on Siemens IoT2050; V4.3.4-1 fixes Industrial OS, Example Image has no fix"
  - claim_id: 9867d66c02
    entry: 2026-08-13/cve-2026-58115-simatic-iot2050-node-red-unauth-root
    surface: "summary"
    kind: frontmatter
    text: "Siemens ProductCERT advisory SSA-834709 of 2026-08-11 discloses CVE-2026-58115, rated 10.0 on both CVSS 3.1 and 4.0: SIMATIC IoT2050 devices with Node-RED installed do not enforce authentication on the Node-RED HTTP interface, so an unauthenticated attacker with network reach can create a flow and run code with maximum privileges. Siemens' advisory, revised on 2026-11-10, lists the Advanced, Basic, M.2 and SM variants in two configurations: all versions below V4.3.4-1 running Industrial OS, fixed in V4.3.4-1, and all versions running Example Image versions, for which no fix is available; Siemens offers uninstalling or hardening Node-RED as interim mitigations. VulnCheck reports that on 2026-10-30 one of its canaries caught exploitation, a single request that deployed a flow downloading and running a Linux bot, with web-shell flows from the same address since; the target was a canary and the activity looks like opportunistic mass scanning."
  - claim_id: 64a39b8493
    entry: 2026-08-13/cve-2026-58115-simatic-iot2050-node-red-unauth-root
    surface: "actions[0]"
    kind: frontmatter
    text: "Update every SIMATIC IoT2050 running Industrial OS (Advanced, Basic, M.2 and SM) to V4.3.4-1 or later now; on units running Example Image versions, for which Siemens has no fix, and wherever the update cannot happen at once, uninstall Node-RED if it is unused or harden it as Siemens' Node-RED User Guide describes and take its HTTP interface off networks that untrusted hosts can reach, since exploitation takes a single unauthenticated request."
  - claim_id: ae95b1ed1c
    entry: 2026-08-13/cve-2026-58115-simatic-iot2050-node-red-unauth-root
    surface: "actions[1]"
    kind: frontmatter
    text: "On every Node-RED instance that was reachable from an untrusted network, review the deployed flows for exec nodes and http-in endpoints that nobody built, and the access logs for POST requests to /flows from non-engineering addresses."
  - claim_id: 6186cdc297
