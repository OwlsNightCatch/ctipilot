    kind: cited
    text: "); Apple says the curl, git, python3, ruby, perl and openssl that ship with macOS or the Xcode command-line tools read /etc/ssl/cert.pem, check neither Apple's block nor revocation and keep trusting them until macOS 27.2.1, 26.7.3 or 15.8.3 ("
