    text: "Kaspersky says that if exploitation succeeds the CA issues the certificate and the domain controller name in it lets the attackers authenticate as that account, and it never says an attempt succeeded ("
    urls: ["https://securelist.com/citrus-ransomware/121879/"]
  - claim_id: 3ccd1717a8
    entry: 2026-07-25/certighost-cve-2026-54121-ad-cs-dc-impersonation-poc
    surface: "section 2026-11-12T04:17:00Z"
    kind: cited
    text: "); Microsoft's record has not been revised since 2026-07-14 ("
