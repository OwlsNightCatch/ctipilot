  - claim_id: bca59f7383
    entry: 2026-11-12/plone-security-hotfix-20261110-anonymous-rce-chain
    surface: "summary"
    kind: frontmatter
    text: "The Plone and Zope security team released fixes on 2026-11-10 for a chain of issues that together let an anonymous visitor run code on the server in Plone 6.0, 6.1 and 6.2 and, per the team, back to at least 4.3; the entry point is a CMFEditions flaw rated 9.8 with no privileges required, and its advisory says a working proof of concept exists. The team's fixes are the updated packages or the hotfix package Products.PloneHotfix20261110, a workaround that blocks URLs containing portal_modifier has applied since the 2026-11-02 pre-announcement, CVE ids are requested and no source reports exploitation."
  - claim_id: e305f69e58
    entry: 2026-11-12/plone-security-hotfix-20261110-anonymous-rce-chain
    surface: "actions[0]"
    kind: frontmatter
    text: "On every Plone site, update to CMFPlone 6.2.3, 6.1.6 or 6.0.16 with the helper packages the Plone team lists, or install Products.PloneHotfix20261110 on any version from 4.3 to 6.2, restart all Zope instances, keep blocking URLs that contain portal_modifier at the front web server, and then check the modifier conditions with @@check-modifier-conditions or the hotfix's startup warning, because an anonymous request can already have stored a malicious condition that survives the fix."
