  - claim_id: ecb6a834d2
    entry: 2026-11-12/falcon-c2-browser-implant-government-webmail-script-tag
    surface: "summary"
    kind: frontmatter
    text: "Unit 42 describes Falcon, a NodeJS command-and-control framework whose JavaScript implant runs inside the victim's browser and leaves no file on the endpoint, planted by a script tag in government webmail portals and web applications, among them the Roundcube webmail of a Middle Eastern foreign ministry (39 instances in that country), and by a sideloaded Chrome extension disguised as a PDF viewer. Unit 42 saw it against government bodies in one Middle Eastern and four Southeast Asian countries between March and May 2026, names no actor, does not know how the operator reaches the pages or the extension installs, and assesses with high confidence that Falcon and PeckBirdy are variants of one core framework."
