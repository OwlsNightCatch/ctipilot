  - claim_id: d39c91121f
    entry: 2026-08-13/cve-2026-58115-simatic-iot2050-node-red-unauth-root
    surface: "body"
    kind: cited
    text: "**Detection:** in web or reverse-proxy access logs, POST requests to the Node-RED /flows endpoint from sources that are not engineering workstations, above all bodies that deploy an exec node carrying a base64 string piped into sh, which a filter matching only wget or curl misses; on the host, hidden files started from /dev/shm or /tmp and detached with setsid or nohup by the Node-RED process, and deployed flows with exec nodes or http-in endpoints that nobody built, since the web-shell flows survive the loss of the memory-resident implant ("
    urls: ["https://www.vulncheck.com/blog/exploitation-targeting-node-red"]
  - claim_id: 34628088ac
    entry: 2026-08-13/cve-2026-58115-simatic-iot2050-node-red-unauth-root
    surface: "body"
    kind: uncited
    text: "Siemens ProductCERT published SSA-834709 on 2026-08-11 for CVE-2026-58115 in SIMATIC IoT2050 devices with Node-RED installed (the current advisory, V1.2 of 2026-11-10, lists the Advanced, Basic, M.2 and SM variants running Industrial OS or Example Image versions): affected devices \"do not enforce authentication on the Node-RED HTTP interface, allowing unauthenticated access to programming nodes that are capable of executing system commands on the server\", so an unauthenticated remote attacker can create malicious flows and run code with maximum privileges."
  - claim_id: f6c217c7e3
    entry: 2026-08-13/cve-2026-58115-simatic-iot2050-node-red-unauth-root
    surface: "body"
    kind: derived
    text: "**Triage:** legitimate engineering deployments also POST to /flows; the signal is a deployment from a non-engineering address whose exec node carries encoded shell or a download-and-execute chain (an inference from the described mechanism)."
  - claim_id: d2a321b630
    entry: 2026-08-13/cve-2026-58115-simatic-iot2050-node-red-unauth-root
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** update every Industrial OS IoT2050 to V4.3.4-1 or later and, for Example Image units that have no fix, uninstall or harden Node-RED, and take the Node-RED interface of any device off networks that untrusted hosts can reach, because exploitation takes one request and is now observed; on any exposed Node-RED, review the deployed flows for planted exec nodes and http-in endpoints."
