  - claim_id: ec90421781
    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "summary"
    kind: frontmatter
    text: "Huntress saw an operator use access to several cloud-hosted ScreenConnect panels on 2026-11-11 to run Run Command as SYSTEM on groups of managed endpoints, installing an attacker-controlled second ScreenConnect client and the SCKit toolkit on at least 288 hosts at 48 organisations within 90 minutes; Sophos independently saw the same client deployments. How the panels were reached is unknown, and ConnectWise, which suspects third-party extensions, disabled five of them in about 400 partner environments, a containment step that removes nothing already installed."
