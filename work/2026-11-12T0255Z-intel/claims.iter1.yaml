    text: "The client is then disguised with kernel-thread-like process names (bash exec -a), persisted through cron, systemd units, shell profiles, watchdogs and redundant copies, and the staging files are removed ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/11/11/global-socket-how-threat-actors-weaponizing-gsocket-stealthy-c2/"]
  - claim_id: 60d847642e
    entry: 2026-11-12/gsocket-relay-client-keeps-access-after-linux-web-patch
    surface: "body"
    kind: cited
    text: "In a few incidents the actors afterwards attempted the Linux kernel flaw CVE-2026-43284, known as Dirty Frag, to reach root; Microsoft gives no success statement and no affected or fixed versions ("
