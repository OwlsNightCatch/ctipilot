    surface: "body"
    kind: cited
    text: "The fixed packages are CMFPlone 6.2.3, 6.1.6 and 6.0.16 with the helper package versions the announcement lists, or the hotfix Products.PloneHotfix20261110, which covers Plone 4.3 to 6.2, and all Zope instances must be restarted afterwards ("
    urls: ["https://community.plone.org/t/plone-security-hotfix-20261110/23313"]
  - claim_id: 656f9f7852
    entry: 2026-11-12/plone-security-hotfix-20261110-anonymous-rce-chain
    surface: "body"
    kind: cited
    text: "The team's pre-announcement of 2026-11-02 already gave the workaround, to block any URL containing portal_modifier at the web server at any path depth, which only helps if Zope's own port cannot be reached directly; the team advises keeping it after updating ("
    urls: ["https://community.plone.org/t/pre-announcement-plone-security-fix-20261110/23303"]
  - claim_id: a0353eacc3
    entry: 2026-11-12/plone-security-hotfix-20261110-anonymous-rce-chain
    surface: "body"
    kind: cited
    text: "After the fix, restricted code can import only the names Plone itself needs from the closed modules, so custom scripts that import others now get an Unauthorized error ("
    urls: ["https://community.plone.org/t/plone-security-hotfix-20261110/23313"]
  - claim_id: 3afb6e64be
    entry: 2026-11-12/plone-security-hotfix-20261110-anonymous-rce-chain
    surface: "body"
    kind: cited
    text: "**Detection:** web-server access logs for anonymous requests whose path contains portal_modifier; and the stored state, which survives the update: a changed modifier condition stays in the database, so as Manager open @@check-modifier-conditions on the site root, or read the hotfix's startup log line that reports modified versioning conditions, and treat the server as compromised if a condition is not recognised, although defaults have changed over time so a difference alone is not an attack ("
    urls: ["https://community.plone.org/t/plone-security-hotfix-20261110/23313"]
  - claim_id: f02bc05067
    entry: 2026-11-12/plone-security-hotfix-20261110-anonymous-rce-chain
    surface: "body"
    kind: derived
    text: "**Exposure:** any Plone site reachable by anonymous visitors, on a version below the fixed packages; no source states a non-default setting that the anonymous path needs, and Plone 5.2 and older are out of security support, with the fix released as an exception."
  - claim_id: e8dc49b284
    entry: 2026-11-12/plone-security-hotfix-20261110-anonymous-rce-chain
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** update or install the hotfix and restart now on every internet-facing Plone site, keep the portal_modifier block in place, and run the modifier-condition check afterwards, because the fix does not remove a condition an anonymous request already stored."
