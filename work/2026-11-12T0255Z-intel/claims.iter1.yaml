    surface: "body"
    kind: cited
    text: "SonicOS firewalls with Client DPI-SSL enabled re-signed the chains with their own DPI-SSL CA, so client browsers could not reject a forged one, until SonicOS 7.3.4-7015 (Gen7) and 8.2.3-8015 (Gen8) ("
    urls: ["https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0021", "https://psirtapi.global.sonicwall.com/api/v1/vulndetail/?advisory_id=SNWLID-2026-0021"]
  - claim_id: c74f416257
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "body"
    kind: cited
    text: "**Detection:** eMudhra says it found no evidence that the intermediates were used to issue end-user certificates ("
    urls: ["https://www.bleepingcomputer.com/news/security/mozilla-google-apple-block-compromised-emudhra-ca-certificates/"]
