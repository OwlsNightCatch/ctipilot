    text: "Brotli flaw: Siemens adds WinCC, UMC, Teamcenter and Opcenter, mostly with no fix; Desigo CC, Mitel, Cisco listed"
  - claim_id: dfd4a032e3
    entry: 2026-11-07/cve-2026-111497-brotli-desigo-cc-mitel-openscape-cisco-duo
    surface: "summary"
    kind: frontmatter
    text: "Between 2026-10-27 and 2026-11-10 Siemens, Mitel and Cisco listed affected products in advisories that cover the Brotli decoder flaw CVE-2026-111497: Siemens names Desigo CC V8 and V9 (remedy: the latest .NET security updates), Gridscale X DSA V5.3 and Gridscale X PSS®E below V36.8.0 (fixed in V5.4 and V36.8.0), Industrial Edge, where Common Configurator has no fix, and, in two interim advisories of 2026-11-10, 15 industrial products including SIMATIC WinCC V7/V8, WinCC Unified, the User Management Component and TIA Administrator and 28 software products including Teamcenter and the Opcenter family, nearly all with no fix; Mitel names MiVoice Business and five OpenScape products with updates planned and workaround articles for three; Cisco's combined advisory lists Duo Network Gateway (3.4.2) and RoomOS among its products with fixes, a longer list of which is dated up to 2027, without saying which of its CVEs each fix addresses. Cisco says it is not aware of malicious use against any Cisco product, and CISA lists the flaw as exploited."
  - claim_id: e060e0d2eb
    entry: 2026-11-07/cve-2026-111497-brotli-desigo-cc-mitel-openscape-cisco-duo
    surface: "actions[0]"
    kind: frontmatter
    text: "Install the latest .NET security updates through Windows Update on every Siemens Desigo CC V8 and V9 host, and update Siemens Gridscale X DSA V5.3 to V5.4 and Gridscale X PSS®E to V36.8.0."
  - claim_id: 37d21ddce8
    entry: 2026-11-07/cve-2026-111497-brotli-desigo-cc-mitel-openscape-cisco-duo
    surface: "actions[1]"
    kind: frontmatter
    text: "On every Siemens product that the advisories list with no fix, SIMATIC WinCC V7/V8, WinCC Unified, WinCC OA V3.21, WinCC Runtime Professional, User Management Component, TIA Administrator, Teamcenter and the Opcenter family, disable Brotli compression and decompression at the application or proxy layer where it is not required and add the IIS request-filtering rule that denies br in the Content-Encoding header on UMC (on TIA Administrator when UMC authentication is enabled); on every Industrial Edge Management instance running Common Configurator, uninstall all Management Applications and put the instance behind a firewall or WAF, and stop Common Configurator on Edge devices; update WinCC OA V3.20 to V3.20 P17.1 and BRAUMAT and SISTAR to V8.2 Update 5, because Siemens lists no fix for the rest."
  - claim_id: 2d45f61f41
