    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "actions[0]"
    kind: frontmatter
    text: "On every ScreenConnect instance your organisation or its IT providers run, review Run Command and Toolbox history and the instance audit logs for executions nobody started since 2026-11-11, check managed endpoints for a second ScreenConnect client service, and disable the five named extensions (on-premises instances by hand); open no interactive session to a suspect host, use EDR live response or WinRM, because a session can trigger the toolkit to spread to the technician's workstation."
