  - claim_id: 34c8ebac31
    entry: 2026-11-12/ccb-entra-id-sms-sign-in-abused-belgian-organisations
    surface: "summary"
    kind: frontmatter
    text: "Belgium's Centre for Cybersecurity warned on 2026-11-10 that a trusted partner observed successful attacks against multiple Belgian organisations in which attackers abused Microsoft Entra ID SMS first-factor sign-in, where a phone number and a one-time code replace the password. The warning gives no victim count, actor, date range or attack chain and says nothing on how the codes were obtained; the CCB's priority step is to find who uses SMS sign-in, give them an alternative and disable it."
  - claim_id: 712cc48fb7
    entry: 2026-11-12/ccb-entra-id-sms-sign-in-abused-belgian-organisations
    surface: "actions[0]"
    kind: frontmatter
    text: "In every Microsoft Entra tenant you run or manage for others, open the Authentication methods policy for SMS, list who is enabled and who actually signs in with SMS using the Authentication methods activity report, and turn off 'Use for sign-in' (labelled 'Enable first factor sign-in' in Microsoft's how-to) for everyone who has an alternative; where it must stay for frontline workers, restrict it to that group and monitor it, because the CCB reports successful attacks against it."
  - claim_id: 6ab8fdd808
