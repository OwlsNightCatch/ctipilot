  - claim_id: 2f8861b2c6
    entry: 2026-11-12/gsocket-relay-client-keeps-access-after-linux-web-patch
    surface: "summary"
    kind: frontmatter
    text: "Microsoft Defender telemetry shows multiple unrelated threat actors deploying GSocket, an open-source remote access tool that connects both ends outbound through a public relay, on Linux servers after exploiting an internet-facing web application, with kernel-thread-like process names and layered persistence through cron, systemd and shell profiles. Because the client runs independently of the exploited application, patching does not remove it, and blocking an address or domain is unlikely to cut off access."
