  - claim_id: c887390892
    entry: 2026-10-23/fortinet-hardening-release-fortios-fortimanager-fortimail
    surface: "summary"
    kind: frontmatter
    text: "Fortinet's coordinated hardening release of 2026-10-22 fixed critical and high-severity flaws in FortiOS, FortiManager, FortiAnalyzer, FortiMail and FortiAuthenticator, and the advisories withheld until Patch Tuesday were published on 2026-11-10 with critical rows in FortiMail (unauthenticated code execution, SQL injection and IBE account takeover, CVSS up to 9.8), FortiAnalyzer and FortiManager (an unauthenticated JSON API flaw at 9.8, oftp port flaws, FGFM code execution), FortiOS, FortiAuthenticator and FortiClient. The October builds fix most rows, but FortiAnalyzer and FortiManager 8.0.0 through 8.0.2 have no fixed build for CVE-2026-126170 until the upcoming 8.0.3 (workaround: set rpc-permit none), and FortiOS 7.0, FortiMail 7.2 and FortiAnalyzer and FortiManager 7.2 and 7.0 are left to migrate or wait; no Fortinet page states exploitation."
  - claim_id: 1fc69e497f
    entry: 2026-10-23/fortinet-hardening-release-fortios-fortimanager-fortimail
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every FortiMail to 8.0.2, 7.6.7 or 7.4.9 (a 7.2 unit moves to a fixed release; 7.2.10 for CVE-2026-126150 is not released), every FortiAuthenticator to 8.0.4 or 6.6.11, every FortiOS to 8.0.2, 7.6.8, 7.4.13 or 7.2.14 (a 7.0 unit migrates), and every FortiManager and FortiAnalyzer on 7.6 or 7.4 to 7.6.8 or 7.4.12 (7.2 and 7.0 migrate), internet-facing units and FortiMail first, because the advisories describe unauthenticated code execution and account takeover and Fortinet warns that patch differences show attackers where the weakness sits; keep the FGFM and oftp ports and every administrative interface off untrusted networks."
  - claim_id: e5ba43a286
    entry: 2026-10-23/fortinet-hardening-release-fortios-fortimanager-fortimail
    surface: "actions[1]"
    kind: frontmatter
    text: "On every FortiAnalyzer and FortiManager (Cloud variants included) on 8.0.0 through 8.0.2, set rpc-permit none on every administrator profile that has the JSON API enabled until Fortinet releases 8.0.3, because no 8.0 build fixes the unauthenticated 9.8 flaw CVE-2026-126170 and 8.0.2 is affected."
