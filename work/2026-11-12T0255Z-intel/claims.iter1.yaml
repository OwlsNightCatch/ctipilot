    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "body"
    kind: cited
    text: "), so a server certificate chain seen in TLS session metadata, proxy or EDR network telemetry that contains one of the eight intermediates or their Sectigo cross-signs, which the tracker lists, is worth treating as a possible forged certificate ("
    urls: ["https://emudhra.we-have-a-problem.com/"]
  - claim_id: 0c0c4fda79
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "body"
    kind: cited
    text: "CT monitoring will not show one, because Google found no certificate chaining to the six TLS intermediates logged before it blocked them ("
    urls: ["https://blog.google/security/protecting-chrome-and-android-users-from-compromised-emudhra-intermediate-ca-certificates/"]
  - claim_id: f07e46171b
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "body"
    kind: cited
    text: "**Triage:** a site that still chains to emSign ECC Root CA - G3 failing in Chrome after 2026-10-27, or a certificate that chains to one of the seven certificates Microsoft removed failing in Windows or Edge once the change reaches the device, is the announced root removal, not an attack ("
    urls: ["https://blog.google/security/protecting-chrome-and-android-users-from-compromised-emudhra-intermediate-ca-certificates/", "https://www.microsoft.com/en-us/msrc/blog/2026/10/microsoft-response-to-compromised-emudhra-certificate-authority-keys"]
  - claim_id: 0d962f4067
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** update trust bundles and toolchains on every non-browser client, rebuild container images that embed an old bundle, and do not rely on revocation or CT for those clients; website operators with certificates chaining to emSign ECC Root CA - G3 need one from another hierarchy now ("
    urls: ["https://blog.google/security/protecting-chrome-and-android-users-from-compromised-emudhra-intermediate-ca-certificates/"]
  - claim_id: 4b0636988a
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "body"
    kind: cited
    text: "), and so does anything issued under emSign Root CA - G1 after 2026-11-16, because Chrome 153 and higher will not trust such a certificate by default when its earliest SCT is later ("
    urls: ["https://blog.google/security/protecting-chrome-and-android-users-from-compromised-emudhra-intermediate-ca-certificates/"]
  - claim_id: 6e58162629
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "body"
    kind: cited
    text: "On Macs, update to macOS 27.2.1, 26.7.3 or 15.8.3, which block them in the command-line tools; where that is not possible, remove emSign ECC Root CA - G3 from that file as Apple describes (removing AAA Certificate Services as well is optional and can stop tools that read only that file from verifying some unaffected sites) ("
    urls: ["https://support.apple.com/de-de/149555"]
  - claim_id: 0912ec450c
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "body"
    kind: cited
    text: "From 2026-11-16 Microsoft removes the remaining eMudhra roots from Windows, Edge and WebView2, so a certificate under emSign Root CA - G1 stops validating there too ("
    urls: ["https://www.microsoft.com/en-us/msrc/blog/2026/10/microsoft-response-to-compromised-emudhra-certificate-authority-keys"]
  - claim_id: 929351cfad
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "body"
    kind: derived
    text: "Certificates from the eight revoked RSA G2B and G2C issuers are revoked and eMudhra says its subscribers were migrated, so check inventories for any holder still on them."
  - claim_id: 091edafa0b
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "section 2026-11-12T04:26:05Z"
    kind: cited
    text: "eMudhra posted its full incident report in the Mozilla bug on 2026-11-10 ("
    urls: ["https://bugzilla.mozilla.org/show_bug.cgi?id=2083449"]
  - claim_id: b0f27fac44
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "section 2026-11-12T04:26:05Z"
    kind: cited
    text: "For the eight RSA-4096 issuers (G2B and G2C) it says the key integrity is intact, all signatures verifying, but that during re-import the private-key material was handled in the volatile memory of a Python process on the ceremony host, which is not consistent with its certification practice statement, so the RSA issuers are treated as not meeting it; it adds that logs cannot reliably establish or exclude how that material was handled ("
    urls: ["https://bugzilla.mozilla.org/show_bug.cgi?id=2083449"]
  - claim_id: e057c99cfd
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "section 2026-11-12T04:26:05Z"
    kind: cited
    text: "It identified this in early November after a root-program discussion, revoked the eight issuers on 2026-11-07 with the reason cessationOfOperation, not the compromise reason used for the ECDSA set, and had written on 2026-10-19 that the RSA issuers were not impacted ("
    urls: ["https://bugzilla.mozilla.org/show_bug.cgi?id=2083449", "https://bugzilla.mozilla.org/show_bug.cgi?id=2083449#c11"]
  - claim_id: d0368d51a8
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "section 2026-11-12T04:26:05Z"
    kind: cited
    text: "The G2C issuers were put into production in May 2026 and issued end-entity certificates, the last on 2026-11-03, after which issuance from them stopped; BleepingComputer reports that eMudhra says the affected customer certificates were replaced or migrated, and that the company has not detected malicious use of the keys ("
    urls: ["https://bugzilla.mozilla.org/show_bug.cgi?id=2083449", "https://www.bleepingcomputer.com/news/security/emudhra-revokes-8-more-ca-certificates-after-private-key-mishap/"]
  - claim_id: f1ae6d7242
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "section 2026-11-12T04:26:05Z"
    kind: cited
    text: "). eMudhra also decided to exit public TLS, with all issuance from its emSign Root CA - G1 hierarchy to stop before 2026-11-16 and an independent review due 2026-12-04 ("
    urls: ["https://bugzilla.mozilla.org/show_bug.cgi?id=2083449"]
  - claim_id: 9354651f3a
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "section 2026-11-12T04:26:05Z"
    kind: uncited
    text: "No page read from Google, Microsoft, Apple, Mozilla or the incident tracker names the G2B or G2C issuers or says a vendor blocked them."
  - claim_id: 1155a3a08f
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "record 2026-11-12T04:26:05Z"
    kind: record-summary
    text: "eMudhra's full incident report of 2026-11-10 says eight RSA-4096 issuers (G2B and G2C) were revoked on 2026-11-07 with the reason cessationOfOperation because their keys were handled in the memory of a Python script, so eMudhra cannot show compliance with its policy; it had said on 2026-10-19 that they were not impacted, no source says the keys leaked, and the G2C issuers had issued end-entity certificates."
