claims:
  - claim_id: 5ba9387ded
    entry: 2026-07-25/certighost-cve-2026-54121-ad-cs-dc-impersonation-poc
    surface: "headline"
    kind: frontmatter
    text: "Certighost AD CS flaw: Kaspersky sees a ransomware group attempting the public exploit; patch every Enterprise CA"
  - claim_id: 8e801445fe
    entry: 2026-07-25/certighost-cve-2026-54121-ad-cs-dc-impersonation-poc
    surface: "summary"
    kind: frontmatter
    text: "Researchers published full exploitation mechanics and a working PoC (2026-07-24) for \"Certighost\" (CVE-2026-54121), an Active Directory Certificate Services flaw Microsoft patched on 2026-07-14: a low-privileged domain user can make an Enterprise CA issue a certificate carrying a Domain Controller's identity, authenticate as that DC via PKINIT, and DCSync the krbtgt hash. Kaspersky reported on 2026-11-11 that the Citrus ransomware group attempted the exploit in intrusions that began with stolen contractor credentials, without saying any attempt succeeded, while Microsoft's record still lists no confirmed exploitation; any AD CS estate without the July 2026 cumulative update should treat it as weaponizable now."
  - claim_id: 2d0ebcc368
    entry: 2026-07-25/certighost-cve-2026-54121-ad-cs-dc-impersonation-poc
    surface: "actions[0]"
    kind: frontmatter
    text: "Confirm the July 2026 cumulative update (2026-07-14) is applied to every Enterprise CA; on any CA where it is not, enable AD CS auditing (Certification Services subcategory and CA AuditFilter 127) and search the directory for computer accounts named GHOST followed by eight random letters and the CA log for a domain-controller-identity certificate requested through the Machine template by a low-privileged account, because Kaspersky reports a ransomware group attempting the public exploit."
  - claim_id: ad14d62950
    entry: 2026-07-25/certighost-cve-2026-54121-ad-cs-dc-impersonation-poc
    surface: "cves[CVE-2026-54121]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-54121\", \"cvss\": \"8.8\", \"status\": [\"poc-public\", \"patch-available\"], \"affected\": \"Windows Server 2012 through Windows Server 2025 (AD CS Enterprise CA role), exploitable only where the conditions in the body hold; also serviced for Windows 10 1607/1809\", \"fixed\": \"July 2026 cumulative update (released 2026-07-14)\", \"auth\": \"post-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 0b31f0838f
    entry: 2026-07-25/certighost-cve-2026-54121-ad-cs-dc-impersonation-poc
    surface: "body"
    kind: cited
    text: "Researchers H0j3n and aniqfakhrul published a full write-up and working proof-of-concept on 2026-07-24 for \"Certighost\" (CVE-2026-54121, CVSS 8.8), an Active Directory Certificate Services flaw Microsoft describes as \"improper authorization in Active Directory Certificate Services (AD CS) [that] allows an authorized attacker to elevate privileges over a network\" and fixed in the July 2026 Patch Tuesday cycle ("
    urls: ["https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-54121"]
  - claim_id: d3cb925847
    entry: 2026-07-25/certighost-cve-2026-54121-ad-cs-dc-impersonation-poc
    surface: "body"
    kind: cited
    text: "The vulnerable logic sits in the Enterprise CA's enrollment \"chase\" fallback: when a request carries the `cdc` (client DC) and `rmd` (remote domain) attributes, the CA contacted the requester-supplied `cdc` host and trusted the identity data it returned without proving that host was a Domain Controller ("
    urls: ["https://cybersecuritynews.com/certighost-active-directory-cs-flaw/"]
  - claim_id: a5ec747404
    entry: 2026-07-25/certighost-cve-2026-54121-ad-cs-dc-impersonation-poc
    surface: "body"
    kind: cited
    text: "A low-privileged domain user, using a machine account it can self-register under the default `ms-DS-MachineAccountQuota` or one it controls, stands up rogue LDAP/LSA services, points the chase at itself and receives a certificate carrying a target Domain Controller's identity; that certificate authenticates via PKINIT as the DC, so the PoC demonstrates a DCSync of the krbtgt secret, a single hop from an ordinary domain foothold to full domain compromise ("
    urls: ["https://cybersecuritynews.com/certighost-active-directory-cs-flaw/"]
  - claim_id: 4bba088a41
    entry: 2026-07-25/certighost-cve-2026-54121-ad-cs-dc-impersonation-poc
    surface: "body"
    kind: cited
    text: "Microsoft rated it \"Exploitation Less Likely\" with no in-the-wild exploitation at patch time ("
    urls: ["https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-54121"]
  - claim_id: 1d2f8801f9
    entry: 2026-07-25/certighost-cve-2026-54121-ad-cs-dc-impersonation-poc
    surface: "body"
    kind: cited
    text: ") and said on 2026-07-31 that it had not observed confirmed threat-actor exploitation ("
    urls: ["https://techcommunity.microsoft.com/blog/microsoftthreatprotectionblog/detecting-cve-2026-54121-certighost-with-microsoft-defender/4542861"]
  - claim_id: fe00d7269d
    entry: 2026-07-25/certighost-cve-2026-54121-ad-cs-dc-impersonation-poc
    surface: "body"
    kind: cited
    text: "Kaspersky then reported that the Citrus ransomware group attempted the flaw in real intrusions that began with credentials stolen from contractors' employees and used against VPNs or RDP; it says the victims are Russian companies only and does not say any attempt succeeded ("
    urls: ["https://securelist.com/citrus-ransomware/121879/"]
  - claim_id: afe0fc7e45
    entry: 2026-07-25/certighost-cve-2026-54121-ad-cs-dc-impersonation-poc
    surface: "body"
    kind: cited
    text: "**Exposure:** Microsoft lists conditions that must all hold: an Enterprise CA integrated with Active Directory, enrollment through the machine template, a default `ms-DS-MachineAccountQuota` or an attacker-controlled machine account, SMB and LDAP reachability from the CA to the attacker's host, and any valid domain account; the fallback occurs only for templates that require a DNS name and on CAs with the EDITF_ENABLECHASECLIENTDC flag ("
    urls: ["https://techcommunity.microsoft.com/blog/microsoftthreatprotectionblog/detecting-cve-2026-54121-certighost-with-microsoft-defender/4542861"]
  - claim_id: 07998e6f4d
    entry: 2026-07-25/certighost-cve-2026-54121-ad-cs-dc-impersonation-poc
    surface: "body"
    kind: cited
    text: "**Detection:** AD CS auditing is off by default; with the Certification Services subcategory and CA AuditFilter 127 enabled, events 4886 and 4887 show requester, template and outcome, and a certificate for a Domain Controller identity requested through a machine template by a low-privileged principal never occurs normally ("
    urls: ["https://techcommunity.microsoft.com/blog/microsoftthreatprotectionblog/detecting-cve-2026-54121-certighost-with-microsoft-defender/4542861"]
  - claim_id: 60ee933862
    entry: 2026-07-25/certighost-cve-2026-54121-ad-cs-dc-impersonation-poc
    surface: "body"
    kind: cited
    text: "Kaspersky's attempts left computer accounts named GHOST plus eight random letters and Machine-template requests whose `cdc` attribute named an attacker-controlled system ("
    urls: ["https://securelist.com/citrus-ransomware/121879/"]
  - claim_id: 204de07f6d
    entry: 2026-07-25/certighost-cve-2026-54121-ad-cs-dc-impersonation-poc
    surface: "body"
    kind: cited
    text: "**Triage:** legitimate cross-domain chase traffic terminates at an address that exists in AD as a real DC computer object; the `SERVER_TRUST_ACCOUNT` and resolved-SID check the patch enforces is the discriminator a hunt should apply ("
    urls: ["https://cybersecuritynews.com/certighost-active-directory-cs-flaw/"]
  - claim_id: 73381b2b1b
    entry: 2026-07-25/certighost-cve-2026-54121-ad-cs-dc-impersonation-poc
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** confirm the July 2026 cumulative update on every AD CS host that runs an Enterprise CA, the durable fix per Microsoft ("
    urls: ["https://techcommunity.microsoft.com/blog/microsoftthreatprotectionblog/detecting-cve-2026-54121-certighost-with-microsoft-defender/4542861"]
  - claim_id: 748f6e315e
    entry: 2026-07-25/certighost-cve-2026-54121-ad-cs-dc-impersonation-poc
