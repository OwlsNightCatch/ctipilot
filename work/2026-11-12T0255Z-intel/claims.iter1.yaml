  - claim_id: a398c75d99
    entry: 2026-11-12/cve-2026-119618-apache-httpd-mod-http2-assign-headers-rce
    surface: "summary"
    kind: frontmatter
    text: "The Apache HTTP Server project released 2.4.71 on 2026-11-11 to fix CVE-2026-119618, a race in mod_http2 that it rates critical and says can lead to remote code execution in versions 2.4.55 through 2.4.70; Red Hat adds that it is unauthenticated, affects only servers with HTTP/2 enabled through the Protocols directive, and that public research has demonstrated a reliable exploit, while no source reports exploitation. Red Hat has fixed RHEL 9 and 10, whereas Debian bookworm, trixie and forky are still listed vulnerable."
  - claim_id: c7652c8f28
    entry: 2026-11-12/cve-2026-119618-apache-httpd-mod-http2-assign-headers-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "On every internet-facing Apache HTTP Server that loads mod_http2, update to 2.4.71 or to your distribution's fixed package (RHEL 9 mod_http2 2.0.26-7.el9_9.1, RHEL 10 mod_http2 2.0.29-5.el10_3.1) and restart it; where no fixed package exists yet, as on Debian bookworm and trixie, remove h2 and h2c from the Protocols directive until one does, because Red Hat reports an unauthenticated code-execution path and a public exploit."
