  - claim_id: 1a4cbea2f4
    entry: 2026-11-12/gsocket-relay-client-keeps-access-after-linux-web-patch
    surface: "body"
    kind: cited
    text: "After patching, remove the client, its persistence and staged files, and verify that the outbound relay connections stopped, because persistence is layered and stopping the process alone does not remove access ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/11/11/global-socket-how-threat-actors-weaponizing-gsocket-stealthy-c2/"]
  - claim_id: 8dfaadd026
    entry: 2026-11-12/gsocket-relay-client-keeps-access-after-linux-web-patch
    surface: "body"
    kind: cited
    text: "**Triage:** Microsoft notes that the same relay model also serves legitimate remote administration, and says a match must be judged on process ancestry, execution context, persistence changes and related network activity; a client started from a web-service process tree, from a writable or memory-backed path and under a kernel-thread-like name is the pattern it describes ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/11/11/global-socket-how-threat-actors-weaponizing-gsocket-stealthy-c2/"]
  - claim_id: f6cb84c5e7
    entry: 2026-11-12/gsocket-relay-client-keeps-access-after-linux-web-patch
    surface: "body"
    kind: derived
    text: "**Exposure:** any Linux web, CMS or hosting server whose internet-facing application was exploited, patched or not, in the months before the patch; Microsoft says the same persistence problem applies when initial access came through remote access services or cloud shell sessions."
  - claim_id: d3d470dd34
    entry: 2026-11-12/gsocket-relay-client-keeps-access-after-linux-web-patch
    surface: "body"
    kind: derived
    text: "**Detection:** process-creation telemetry with parent lineage, where a web-server or application-runtime process starts curl and then bash, followed by a long-lived process whose name imitates a kernel thread but whose executable sits in a hidden or memory-backed path; file events in /dev/shm and /tmp; new cron entries and systemd units with plausible service names created in the same window as the download; shell startup file changes; and long-lived outbound sessions to a public relay from servers that have no reason to initiate them."
  - claim_id: 2a6c9da4a6
    entry: 2026-11-12/gsocket-relay-client-keeps-access-after-linux-web-patch
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** treat every Linux web server whose application was exploited as possibly holding a relay client, not only web shells, and hunt it on the host after patching; Microsoft's hardening steps are deny-by-default egress with monitoring of relay connections, non-executable mounts for temporary and memory-backed directories, and a review of cron entries, systemd units and shell startup files."
