    kind: cited
    text: "Kaspersky's Citrus report of 2026-11-11 says the group attempted to exploit Certighost with an exploit published on GitHub, requesting a Machine-template certificate on behalf of a newly created account with the `cdc` attribute pointing the CA at a system it controlled, and that the group later deploys its Go ransomware domain-wide through a malicious Group Policy Object ("
    urls: ["https://securelist.com/citrus-ransomware/121879/"]
  - claim_id: 6638af9ca4
    entry: 2026-07-25/certighost-cve-2026-54121-ad-cs-dc-impersonation-poc
    surface: "section 2026-11-12T04:17:00Z"
