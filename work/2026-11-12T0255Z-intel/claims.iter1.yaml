    entry: 2026-11-12/gsocket-relay-client-keeps-access-after-linux-web-patch
    surface: "body"
    kind: cited
    text: "Both the compromised host and the operator connect outbound to the public relay, so the host needs no inbound listener, inbound firewall rules do not see the traffic and a shared secret, not an address, pairs the endpoints, which lets the operator reconnect later from any compatible client; Microsoft therefore says that blocking an address or domain is unlikely to cut off access, while egress filtering and outbound monitoring can see it ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/11/11/global-socket-how-threat-actors-weaponizing-gsocket-stealthy-c2/"]
  - claim_id: 87d038d36a
    entry: 2026-11-12/gsocket-relay-client-keeps-access-after-linux-web-patch
    surface: "body"
    kind: cited
    text: "Microsoft's telemetry is concentrated on web applications and hosting; education and research and technology and telecommunications were the largest shares of affected organisations, which Microsoft attributes to exposure, not deliberate sector selection ("
