  - claim_id: 839d1de425
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "summary"
    kind: frontmatter
    text: "PK Softech AG, the software supplier of Publica and other Swiss pension funds, says unknown attackers used malware to reach part of its IT and that data must be assumed to have left; the Confederation headlined its 2026-10-08 release \"data outflow confirmed\", and the Federal Prosecutor's Office is investigating. Tamedia reports that PK Softech had confirmed in writing in January 2026 that it deleted Publica's 2019 migration data, which apparently stayed on its servers, and that Akira holds about 100 GB and demands ransom; Inside IT relays this and adds that the Federal Prosecutor's Office confirmed Akira took data, and Netzwoche relays that the authorities assume data on practically all current and former federal and federally affiliated staff left. Publica says personal data of insured persons has presumably left; the Pensionskasse Stadt Zürich says its insured persons' test data was stolen, the Pensionskasse Post says personal data left, the Bernische Pensionskasse assumes more data left the supplier than first thought but can neither confirm nor rule out that its insured persons' data is among it, the Ticino fund IPCT says data of about 1,800 of its insured persons sat on the attacked server and writes to all its insured because it cannot exclude more, and other funds are still checking. The Federal Data Protection Commissioner, who opened a formal investigation against PK Softech on 2026-10-22, states that data of several pension funds, Publica among them, was exfiltrated. Publica's own newsletter of 2026-10-22 says the Akira group is being associated with the attack; Publica's own page of 2026-11-10 says the supplier received general extortion letters immediately after the attack, never made concrete with an amount or a payment deadline, while a concrete demand rests on press reports, and on 2026-11-10 PK Softech and the State Secretariat for Security Policy said that no concrete ransom demand reached them, that PK Softech never contacted the attackers and that the Confederation paid nothing. The Pensionskasse Stadt Zürich has suspended its planned 2027 move to PK Softech's system, PK Softech cannot rule out that non-pseudonymised data was temporarily present in project work, and the Federal Prosecutor's Office has added the case to its criminal proceeding against Akira. The Pensionskasse der Stadt Zug, administered by Libera AG, said on 2026-11-09 that there is an elevated risk, not yet confirmed, that its insured persons' data left the supplier."
