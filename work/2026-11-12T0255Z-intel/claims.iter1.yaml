    kind: derived
    text: "**Exposure:** an Apache HTTP Server 2.4.55 to 2.4.70, or a distribution mod_http2 build without the vendor's fix, that has the mod_http2 module loaded and h2 or h2c in a Protocols directive for the server or a virtual host; the loaded modules and the Protocols directives of the configuration show it, and the distribution advisory, not the upstream version string, shows whether a backported fix is installed."
