    text: "{\"id\": \"CVE-2026-58115\", \"cvss\": \"10.0\", \"status\": [\"exploited\", \"patch-available\", \"mitigation-only\"], \"affected\": \"SIMATIC IoT2050 Advanced (6ES7647-0BA00-1YA2), Basic (6ES7647-0BA00-0YA2), M.2 (6ES7647-0BB00-1YA2) and SM (6ES7647-0CA00-1AA2), all versions < V4.3.4-1 running Industrial OS with Node-RED installed, and all versions running Example Image versions with Node-RED installed\", \"fixed\": \"V4.3.4-1 or later for the Industrial OS configurations; no fix available for the Example Image configurations (harden or uninstall Node-RED)\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
