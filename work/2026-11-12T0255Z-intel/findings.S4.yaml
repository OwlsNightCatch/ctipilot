    discovery_trace: "first seen at: tio-ch-attacco-informatico, url --direct https://www.tio.ch/temi/attacco-informatico → https://www.tio.ch/svizzera/cronaca/1962152/riscatto-attacco-publica-fornitore-richiesta-hacker (2026-11-10, already in the store) → Swiss sweep: url --direct https://www.watson.ch/digital (listing) → https://www.watson.ch/schweiz/digital/929554930-bund-verschwieg-details-zu-ransomware-attacke-von-akira-das-wissen-wir (2026-11-11) → primary: Publica incident page https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten (extract) and PK Softech https://www.pksoftech.ch/de/newsreader/Information-zum-Cyberangriff-auf-die-PKSoftechAG (extract)."
    summary: |
      Fresh facts on the entry's open question about the ransom demand. Publica's incident page, in a correction headed 'Stand 10.11.2026',
      says the federal bodies know of no concrete ransom demand addressed to them, that the supplier "received general extortion letters
      immediately after the attack" according to current knowledge, and that these have not since been made concrete with an amount or a
      payment deadline; Publica says it is not in contact with the attackers and has itself received no demand. PK Softech's page of the same
      day says no concrete ransom demand reached it and that it never contacted the attackers. watson.ch adds, from its own enquiry, that
      PK Softech confirms it is ignoring the prompt the attackers left in its network to join an anonymous chat, that the company and the
      Confederation therefore knew soon after the attack that Akira was behind it and that crisis communication omitted that a general
      extortion note existed, and it reads the denials as meaning only that nobody opened the attackers' darknet link (watson's inference;
      it also cites a 2025 FBI/CISA bulletin on Akira's practice of naming no sum in the first note, which was not checked here). The
      day's media confusion is documented by watson: SRF reported at 05:58 on 2026-11-10 from anonymous sources that Akira demanded
      ransom and that the Defence Department knew; Keystone-SDA first wrote of a demand to the supplier, then corrected itself after the
      State Secretariat for Security Policy said no concrete demand was known; SRF's evening bulletins repeated the morning line without
      the denials. Still open and press-sourced: the Akira attribution (per the store entry, Publica's own 2026-10-22 newsletter associates Akira), the data volume
      and whether data of covert federal staff is included; no darknet publication is known (Publica, SEPOS).
