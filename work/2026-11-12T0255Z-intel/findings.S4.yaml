    summary: |
      Two destination-marketing bodies in two countries report the same upstream event. Zermatt Tourismus's letter, quoted by Blick, says that on
      2026-11-05 INCERT, the Austrian third party that runs its destination-voucher online shop, established that an attacker had gained
      unauthorised access to a web server; INCERT says the flaw was closed at once and further measures taken, and confirmed that data was
      copied from that server. Zermatt Tourismus cannot yet say whether its guests are among the copied records but cannot exclude it; data
      named is name, date of birth, address, e-mail, phone, names and birth dates of gift recipients and voucher codes; card data is not
      affected because payments go through external payment providers; vouchers stay valid and Zermatt Tourismus will monitor redemptions for
      unusual activity and has informed the data protection authorities; its own systems are not affected. Zell am See-Kaprun (Austria),
      per Borns IT-Blog's reading of its notice, says an unknown attacker accessed a web server of INCERT eTourismus GmbH & Co KG that also
      hosts its online voucher shop and event-ticket sales; INCERT reported to the Austrian data protection authority and the police, secured
      the server and cannot yet say whether that client's system was affected. Both notices warn that the order data makes fraudulent messages
      credible. INCERT's own statement, the number of destinations it serves and the intrusion method are not public in the sources.
