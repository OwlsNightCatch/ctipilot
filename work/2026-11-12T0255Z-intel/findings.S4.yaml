    extended_notes: |
      Technique T1078 is inferred from 'unauthorised access attempts on accounts' (the first report); the notices do not state how the platform
      was entered. If kept, the defender angle is supplier hygiene: an outsourced print and mail provider retains years of correspondence and
      its tracking database is a data store of its own; ask such providers for retention periods and access logging. Suggested Admiralty: C3.
