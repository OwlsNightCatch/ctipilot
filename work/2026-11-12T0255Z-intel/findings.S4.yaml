  - title: "Fireworks AI breaches expose Notion AI chat transcripts: a vendor-held inference dataset kept customer conversations, some with pasted credentials"
    sources:
      - { url: "https://www.notion.com/security/advisories/security-incident-involving-a-third-party-ai-vendor-nov9", publisher: "Notion (security advisory, first published 2026-11-09)", date: "2026-11-09", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/notion-says-fireworks-breach-exposed-customer-ai-chat-transcripts/", publisher: "BleepingComputer (Bill Toulas)", date: "2026-11-11", role: "corroborating" }
      - { url: "https://www.bleepingcomputer.com/news/security/fireworks-ai-discloses-new-breach-after-cloud-provider-hack/", publisher: "BleepingComputer (Sergiu Gatlan; relays Fireworks' own bulletins)", date: "2026-11-10", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer, feed https://www.bleepingcomputer.com/feed/ (item 'Notion says Fireworks breach exposed customer AI chat transcripts') → https://www.bleepingcomputer.com/news/security/notion-says-fireworks-breach-exposed-customer-ai-chat-transcripts/ (extract) → primary: Notion advisory https://www.notion.com/security/advisories/security-incident-involving-a-third-party-ai-vendor-nov9 (extract) → pivot: https://www.bleepingcomputer.com/news/security/fireworks-ai-discloses-new-breach-after-cloud-provider-hack/ (extract); Fireworks' own bulletins (fireworks.ai/security/bulletins) were not fetched."
    summary: |
      Fireworks AI, an inference platform that Notion uses as a general provider for open-weight models and for the Insights usage-analytics
      feature, disclosed two incidents (via BleepingComputer, quoting its bulletins). In early October, environment variables holding API keys and
      tokens were reached for a limited number of accounts; Fireworks says the evidence indicates a financially motivated group selling
      unauthorised access to language models to illicit routing gateways (LLMjacking). On 2026-10-23 a third-party cloud provider that
      hosted Fireworks R&D machines had an incident, on 2026-10-24 the unauthorised party used it to reach development machines and run an
      unauthorised workload, exposing for some customers resource metadata, billing data and incomplete model weights and datasets; Palo Alto
      Networks Unit 42 is helping. Notion's timeline: Fireworks alerted it on 2026-11-02 to a dataset of synthetic test data; Notion cut
      traffic and deleted its data at Fireworks by 2026-11-03; on 2026-11-06 Fireworks said customer data may have been reached and on
      2026-11-08 confirmed a dataset holding Notion AI chat transcripts used for Insights, mostly unattributable to a user or workspace and
      without tool-call results; fewer than 1% of workspaces are involved, Insights is switched off, Notion no longer serves open-weight
      models through Fireworks, and it advises affected workspaces to treat the data as exposed and rotate credentials pasted into chats.
      BleepingComputer adds that Fireworks had contractually committed to zero retention of Notion data. No Swiss or public-sector victim is
      named.
    region_nexus: "global (US vendors); no Swiss nexus stated"
    primary_sector_nexus: "indirect: a workspace tool and an AI inference supplier; relevant to any body that lets staff use hosted AI assistants"
    sector: "technology (AI inference and workspace software)"
    cves: []
    techniques: [T1199, T1078.004]
    affected_products: ["Notion AI", "Fireworks AI"]
    entity_keys: []
    new_entities:
      - { key: "incident:fireworks-ai-security-incidents-2026-10", type: incident, name: "Fireworks AI security incidents and Notion AI transcript exposure (2026-10/11)", aliases: [], summary: "Two Fireworks AI incidents in October 2026 (API keys and tokens in environment variables; development machines reached through a third-party cloud provider) ended in exposure of Notion AI chat transcripts, confirmed 2026-11-08 (Notion advisory, BleepingComputer)." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    borderline: true
    borderline_reason: "no Swiss or public-sector victim and no new technique class; kept for the transferable point that an AI vendor's retained prompts and transcripts become the exposure even under a zero-retention contract, and for its link to the LLMjacking theme already in the store"
    evidence:
      - quote: "Upon analysis of the new data, we discovered that it included Notion AI chat transcripts used for the Insights feature, which for the vast majority of impacted workspaces were unattributable."
        attribution: "Notion"
        source_url: "https://www.notion.com/security/advisories/security-incident-involving-a-third-party-ai-vendor-nov9"
      - quote: "We also recommend that affected customers treat this data as if it were exposed."
        attribution: "Notion"
        source_url: "https://www.notion.com/security/advisories/security-incident-involving-a-third-party-ai-vendor-nov9"
      - quote: "A third-party cloud provider that hosted Fireworks R&D machines experienced a security incident on October 23."
        attribution: "Fireworks AI (bulletin quoted by BleepingComputer)"
        source_url: "https://www.bleepingcomputer.com/news/security/fireworks-ai-discloses-new-breach-after-cloud-provider-hack/"
    extended_notes: |
      Technique ids are inferred: T1199 from the third-party cloud provider as the route to Fireworks' development machines, T1078.004 from
      the misuse of exposed API keys by a group selling model access; Notion's own exposure is a vendor-side data store, not a technique.
      The Notion advisory page states 'most current version' elsewhere; the fetched page is the 2026-11-09 first publication. Suggested
      Admiralty: Notion A for its own incident, Fireworks claims relayed by B; credibility 2.
