    discovery_trace: "first seen at: borncity, feed https://borncity.com/blog/feed/ (item 'Sicherheitsvorfall beim Anbieter PowerFolder Drive') → https://borncity.com/blog/2026/11/09/sicherheitsvorfall-beim-anbieter-powerfolder-drive/ (extract) → WebSearch (\"PowerFolder Drive Sicherheitsvorfall Cloud abgeschaltet Schwachstellen 6. November 2026\", no on-point hit) → pivot: extract https://www.powerfolder.com/news (vendor news list, newest item the 2026-11-11 security update) → primary: the vendor's own notices of 2026-11-06, -07, -08, -09 and -11 listed in sources."
    summary: |
      Vendor statements (PowerFolder is the first-party source; its wording was corrected twice, so treat each point as the vendor's
      claim as of its date). On 2026-11-06 PowerFolder shut its cloud after its monitoring flagged anomalies, blocked the attacker's
      access at about 14:30, exchanged affected credentials, filed a criminal complaint and informed the data protection
      authority; Borns IT-Blog, relaying the customer mailing, adds that LDI NRW and the BSI were notified and that the attacker
      reportedly went for server configuration files. The vendor says the intruder reached parts of the cloud systems but not control of
      the servers, through "a chain of several causes in our own operating infrastructure", and cannot exclude that names, e-mail
      addresses and passwords (stored in encrypted form) were copied; on restart (planned 2026-11-10) all passwords, sessions and tokens
      were invalidated. On 2026-11-07 the vendor reversed its earlier statement that self-operated servers were unaffected: the flaw
      the attacker used affects all PowerFolder Server products in all versions, including installations where online document
      editing is not set up or is switched off, and switching it off in the settings does not protect; the interim control is to block
      every request to the path /wopi/ and its subpaths at the reverse proxy or firewall, or to take the server off the network.
      On 2026-11-09 the vendor withdrew its earlier line that the attacker had downloaded no files as untenable. On 2026-11-11 it
      released security updates 28.2.100 (line 28.2) and 26.4.100 (line 26.4) that close the exploited flaws plus further ones found in
      a code review and add mandatory two-factor login for server administrators, shorter login-token lifetimes and logging of
      administrator logins and configuration changes; the cloud already runs that state, and the /wopi/ block may be lifted after
      installing. No CVE identifier is given and the vendor withholds vulnerability details until operators have had time to update.
      Context from the vendor's own 2026-10-21 post: it is in talks with ZenDiS about fitting PowerFolder into the openDesk sovereign
      workplace, lists WOPI among its integration interfaces and is in STACKIT ISV onboarding, i.e. it is positioned for public-administration
      deployments; no source says a Swiss public body uses it.
    region_nexus: "Germany (vendor in Monheim am Rhein; BSI and LDI NRW notified); DACH operators of on-premises servers; Swiss use not established"
    primary_sector_nexus: "indirect: vendor positions the product for public-administration sovereign workplaces (openDesk/ZenDiS talks, Smart Country Convention); no public-sector victim named"
