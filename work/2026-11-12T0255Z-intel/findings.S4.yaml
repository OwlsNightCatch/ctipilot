    confidence: LOW
    novelty: new
    borderline: true
    borderline_reason: "ongoing French supplier incident with fresh victim disclosures (supplier-held correspondence history is a transferable lesson), but no Swiss nexus, all sources are community trackers (Admiralty C), and the primary notices and vector are missing"
    evidence:
      - quote: "Altéal reconnaît qu’un incident de sécurité informatique est survenu chez Maileva"
        attribution: "Cyberattaque.org (summarising Altéal's notice)"
        source_url: "https://www.cyberattaque.org/le-bailleur-social-alteal-confirme-une-exposition-des-donnees-de-ses-locataires-apres-la-cyberattaque-de-maileva/"
