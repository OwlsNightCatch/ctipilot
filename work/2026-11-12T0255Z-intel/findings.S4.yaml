      - { url: "https://www.bleepingcomputer.com/news/security/maersk-confirms-data-breach-as-whitearmor-ransomware-demands-5-million/", publisher: "BleepingComputer (Bill Toulas)", date: "2026-11-11", role: "corroborating" }
