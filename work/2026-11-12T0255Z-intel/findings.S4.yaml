    summary: |
      Maersk says it identified unauthorised access and data extraction from one of its local legacy systems from a previous acquisition, that
      its findings so far strongly suggest no sensitive data was disclosed, that the incident is isolated to that local system with no
      indication of impact on other Maersk systems or on customer and partner systems connected through APIs and EDI, and that it expects no
      operational disruption. It does not name the system, the data types or the intrusion date. Per BleepingComputer, the ransomware group
      WhiteArmor listed Maersk on its leak site over the weekend, says it holds about 100 GB from the former LF Logistics OCF platform
      (acquired in 2022), among it about 30,000 driver records, plaintext passwords and 33 super-administrator accounts, and gives Maersk 30
      days to pay USD 5 million; those contents are the group's claims, not confirmed by Maersk. Both sides name the same inherited
      platform as the affected system; my assessment, not stated by either, is that a platform kept from an acquisition and run outside
      the group's main perimeter is the transferable lesson.
