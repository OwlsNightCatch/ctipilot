    discovery_trace: "first seen at: next-ink, feed https://next.ink/feed (item '[brief] Manquements relatifs à la cybersécurité : des services publics sanctionnés par la CNIL') → https://next.ink/brief-article/manquements-relatifs-a-la-cybersecurite-des-services-publics-sanctionnes-par-la-cnil/ (extract) → primary: CNIL, https://www.cnil.fr/fr/sanctions-cybersecurite-collectivites-territoriales (extract); second read: ZATAZ feed https://www.zataz.com/feed/ → https://www.zataz.com/cybersecurite-la-cnil-sanctionne-dix-collectivites/ (extract)."
    summary: |
      CNIL announced on 2026-11-09 that in November it issued ten simplified-procedure fines, between EUR 3,000 and 20,000 (the legal
      maximum for that procedure), against territorial authorities (communes, departments, regions) and one public establishment, whom it
      does not name, after the cybersecurity-of-local-authorities inspection theme it set for 2025. Failings it lists under GDPR Article 32:
      remote-access authentication that was not robust, notably no multi-factor authentication for administrators; external providers such
      as software vendors with permanent network access, not authorised case by case, or reaching the network through accounts shared by
      several staff; ineffective detection of abnormal behaviour (incomplete logging or no short-term analysis of logs); insufficient network
      segmentation, which could spread a breach across segments; servers on operating systems no longer maintained by the vendor; and weak
      passwords, passwords sent in clear to users or stored without confidentiality guarantees. CNIL adds that some inspected authorities
      suffered one or more data breaches that adequate measures could have prevented, that several online-service information systems went live
      without the security accreditation the RGS requires, and that several authorities were also fined for missing impact assessments
      (school and after-school parent portals, public-road video systems). Further procedures are open, and CNIL ties the work to the
      transposition of NIS2, which will put new obligations on territorial authorities. Relevance: a regulator's concrete list of what
      fails at local-government level, which maps one-to-one onto the controls Swiss communal and cantonal IT is audited against.
    region_nexus: "France; home-region analogue for Swiss communes and cantons (same failure classes, different law)"
