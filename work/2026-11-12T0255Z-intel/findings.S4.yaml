      employees: first and last names, dates of birth, work e-mail addresses, user names and department details; students are not affected and
      no passwords left. Its stated cause is that several settings recommended by a software vendor together produced a security hole that
      gave the attackers access to functions meant for internal use only, through which personal data could be retrieved as long as the
      user name was known. The university does not name the software. Its central computing centre logged the attackers' access and, on
      that evidence, currently assumes no further data was touched; the investigation continues. The university informed its own data
      protection officer and the Baden-Württemberg state data protection commissioner and files a criminal complaint. heise places it in
      a run of German university incidents (TU München shut its campus system the week before, Universität Leipzig went offline in
      October, LMU München lost data of 600,000 students in September); no source links them.
