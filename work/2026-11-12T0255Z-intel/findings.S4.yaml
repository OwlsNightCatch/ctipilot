    relation_suggestions:
      - { subject: "incident:sckit-screenconnect-msp-compromise-2026-11", object: "malware:sckit", basis: "Huntress: the operator pushed the SCKit toolkit to managed endpoints through compromised ScreenConnect panels (Huntress, 2026-11-11)" }
      - { subject: "malware:sckit", object: "product:connectwise-screenconnect", basis: "Huntress: SCKit installs rogue ScreenConnect clients and is built to abuse technician sessions and the panel's Shared Toolbox to spread (Huntress, 2026-11-11)" }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "On November 11, 2026, Huntress observed an operator using access to multiple cloud-hosted ScreenConnect panels to push commands to groups of managed endpoints."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/sckit-worm-rogue-screenconnect"
      - quote: "An interactive session can trigger the malware to spread to the technician's workstation and then to other ScreenConnect panels available to that technician."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/sckit-worm-rogue-screenconnect"
      - quote: "Isolation alone does not remove the persistence, and affected systems have been observed reinfecting shortly after isolation was lifted."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/sckit-worm-rogue-screenconnect"
      - quote: "ConnectWise confirmed unauthorized access to ScreenConnect partner accounts and the installation of unauthorized remote-access software in customer environments."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/active-screenconnect-attacks-breach-msps-impact-dozens-of-organizations/"
      - quote: "Huntress has not determined how the attackers are gaining access to affected MSP environments, but says its current telemetry points to compromised credentials or hijacked operator sessions."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/active-screenconnect-attacks-breach-msps-impact-dozens-of-organizations/"
    extended_notes: |
      Exposure (vendor/Huntress-documented checks): in the ScreenConnect administration interface list the installed extensions and look
      for the five named above (ConnectWise says having one does not by itself mean compromise; on-premises instances must disable them
      manually); read Run Command history, Toolbox records, extension-installation records and administrator activity for entries your
      staff did not make; on endpoints look for a second ScreenConnect client service pointing at a relay that is not your instance.
      Detection concept (telemetry class first): ScreenConnect instance audit logs; endpoint process-creation events with the
      ScreenConnect client service as parent spawning cmd, PowerShell or msiexec; MSI-install and service-install events for a second
      client; scheduled-task creation (task named TrapWatch), Defender exclusion changes, start-type change of the legitimate client
      service, new Run-key value; egress from endpoints to a ScreenConnect relay outside your own instance.
      Triage lookalike (follows from the documented chain): ordinary MSP Run Command use is one technician, one named endpoint or group,
      and does not install a second ScreenConnect client or stop the legitimate one; here one operator action reached hundreds of
      endpoints within minutes and left a silent sc.msi install plus a scheduled task.
      Post-patch/containment: Huntress and ConnectWise both say disabling the extensions or isolating a host does not remove planted
      clients or persistence; Huntress advises not opening interactive ScreenConnect sessions to suspect hosts, using EDR live response
      or WinRM instead, treating a technician workstation that already connected as exposed, terminating web sessions, rotating
      ScreenConnect credentials and revoking browser/IdP sessions.
      Developing: the ConnectWise advisory text is only second-hand here; BleepingComputer's figures (six MSPs, 286+ endpoints) are the
      earlier counts, Huntress's page later says 288 hosts / 48 organisations. BleepingComputer also found an earlier batch script
      (VirusTotal first upload 2026-07-25) that references one of the rogue client IDs; Huntress declined to comment and the link is unclear.
      Huntress's blog metadata date is 2026-11-12 (updated), the listing date is 2026-11-11. Suggested Admiralty: Huntress B, BleepingComputer B; credibility 2 until ConnectWise's advisory text is read.
