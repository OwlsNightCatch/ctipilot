  - title: "ScreenConnect MSP compromise: an operator used cloud-hosted ScreenConnect panels to push a rogue second client and the SCKit worm kit to 288 managed endpoints at 48 organisations on 2026-11-11"
    sources:
      - { url: "https://www.huntress.com/blog/sckit-worm-rogue-screenconnect", publisher: "Huntress (Ben Nahorney, Susannah Matt)", date: "2026-11-11", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/active-screenconnect-attacks-breach-msps-impact-dozens-of-organizations/", publisher: "BleepingComputer (Lawrence Abrams; relays the ConnectWise advisory and Huntress statements)", date: "2026-11-11", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer, feed https://www.bleepingcomputer.com/feed/ (item 'Active ScreenConnect attacks breach MSPs, impact dozens of organizations') → https://www.bleepingcomputer.com/news/security/active-screenconnect-attacks-breach-msps-impact-dozens-of-organizations/ (extract) → pivot: WebFetch https://www.huntress.com/blog (listing, newest post 'SCKit Worm Installs Rogue ScreenConnect Clients and Session Cookie Relays Across Hundreds of Endpoints') → primary: Huntress, https://www.huntress.com/blog/sckit-worm-rogue-screenconnect (extract). The ConnectWise advisory (posted 22:45 UTC on 2026-11-11, https://www.connectwise.com/company/trust/advisories) answered 403 on extract, jina and WebFetch, so its content is taken only as relayed by Huntress and BleepingComputer."
    summary: |
      Facts as Huntress states them: from about 17:47 UTC on 2026-11-11 an operator used access to several cloud-hosted ScreenConnect
      panels to push the panels' Run Command, executed as SYSTEM, to groups of managed endpoints; 288 hosts at 48 Huntress-protected
      organisations were hit within about 90 minutes, a third of them in the first ten. The pushed command checks for an existing
      ScreenConnect client, downloads an attacker-controlled installer to C:\Windows\TEMP\sc.msi and installs it silently, writes a
      base64 dropper (sckit-run.bat) and then fetches a host-keyed, encrypted 16-file toolkit, SCKit, whose decryption values the
      server returns against the machine's UUID. On each host the kit unpacks to C:\ProgramData\RelayTrap, adds Microsoft Defender
      exclusions, installs a second attacker ScreenConnect client, compiles a per-host RelayTrap.exe under a scheduled task named
      TrapWatch, stops the legitimate ScreenConnect service and sets it to manual start so the attacker's copy replaces it, and sets a
      Run-key value. Huntress reconstructed, from the code and not from observed cases, a second stage meant to spread from an infected
      endpoint to a technician who connects through the relay: a file transfer retrieves a dropper, the technician workstation's
      .aspxauth ScreenConnect session cookie is stolen and replayed against the panel, and a payload is uploaded to the panel's Shared
      Toolbox and broadcast to every reachable session. Huntress says that console-takeover attempt failed in every recovered host log
      it has checked, and that isolation alone does not remove the persistence (hosts were seen reinfecting after isolation was lifted).
      ConnectWise, as relayed by Huntress and BleepingComputer: it confirmed unauthorised access to ScreenConnect partner accounts and
      installation of unauthorised remote-access software in customer environments, disabled five third-party extensions (Labtech Plus,
      RMM Plus, RMM+, RMM Plus Password Link, RMM+ Password Link) across about 400 cloud partner environments as a precaution, says
      on-premises customers must disable them by hand, says disabling does not remove software or access already planted, has found
      no initial access vector and is confirming reports of technician workstations compromised during interactive sessions.
      Huntress told BleepingComputer it looks like abuse of legitimate functionality rather than a software flaw, with its telemetry
      pointing to compromised credentials or hijacked operator sessions (Huntress's assessment; patient zero unknown), and that
      sequential attacker tags suggest more MSPs were compromised earlier. No source names an actor. Indicators are published by
      Huntress and deliberately omitted here.
    region_nexus: "global; Huntress telemetry is US-centred, no Swiss victim is named"
    primary_sector_nexus: "indirect: public bodies that outsource IT operations to an MSP running ScreenConnect are the exposed class; no public-sector victim is named in the sources"
    sector: "technology (managed service providers)"
    cves: []
    techniques: [T1199, T1072, T1219, T1078, T1059.001, T1059.003, T1053.005, T1547.001, T1685, T1539, T1550.004, T1105, T1570, T1027.013]
