    extended_notes: |
      Lookback item (swept via the 74 h Borns IT-Blog record): the vendor's first notice is 2026-11-06, but the in-window delta is the
      2026-11-11 patch release, so the actionable news (fixed builds, block-then-patch) is fresh. Single source family: every fact is the
      vendor's own, Borns IT-Blog only relays the customer mailing (its reader tip, not independent telemetry). Gaps: no CVE, no technical
      detail of the /wopi/ flaw, no count of affected on-premises servers, and the vendor has changed its account twice (server
      products first declared unaffected; "no files downloaded" withdrawn), so the data-loss scope is unsettled.
      Exposure: PowerFolder Server (28.2.x and 26.4.x lines named for the fix; the vendor says all versions are affected) reachable from
      the internet, or accounts on PowerFolder Cloud (drive.powerfolder.com, my.powerfolder.com, hosted customer systems). The vendor's
      check: is /wopi/ blocked in front of the server, and is the server on 28.2.100 or 26.4.100.
      Detection concept: reverse-proxy and web-server access logs for requests to /wopi/ paths on PowerFolder hosts before the block went
      in; administrator-login and configuration-change records exist only from the fixed release on, so older servers carry no such
      trail. My assessment, not stated by the vendor: because Borns IT-Blog relays that the attacker targeted server configuration files
      and the vendor rotated every credential and key on its own side, an operator whose server was reachable on /wopi/ should treat
      the configuration, keys and database credentials under ~/.PowerFolder as exposed and rotate them after updating.
      Suggested Admiralty: vendor first-party A for its own incident, B for completeness given the reversals; credibility 2.
