  # ------------------------------------------------------------------ 9
  - title: "Maileva (La Poste / Docaposte mailing platform): the September account-takeover attempt now surfaces as correspondence history exposed at social landlords and a hospital"
    sources:
      - { url: "https://www.cyberattaque.org/le-bailleur-social-alteal-confirme-une-exposition-des-donnees-de-ses-locataires-apres-la-cyberattaque-de-maileva/", publisher: "Cyberattaque.org (Thomas Lazzaroni; relays Altéal's notice of 2026-11-09)", date: "2026-11-10", role: "primary" }
      - { url: "https://frenchbreaches.com/alertes/h-pital-foch-mwc2c69j52j9n2rnqb6", publisher: "FrenchBreaches (Sébastien Forte; relays the Hôpital Foch notice)", date: "2026-11-11", role: "corroborating" }
      - { url: "https://www.cyberattaque.org/maileva-filiale-de-la-poste-victime-dune-cyberattaque/", publisher: "Cyberattaque.org (first report, from Maileva's customer notice)", date: "2026-09-24", role: "context" }
    discovery_trace: "first seen at: cyberattaque-org, feed https://www.cyberattaque.org/feed/ (item 'Le bailleur social Altéal confirme une exposition des données de ses locataires après la cyberattaque de Maileva') → https://www.cyberattaque.org/le-bailleur-social-alteal-confirme-une-exposition-des-donnees-de-ses-locataires-apres-la-cyberattaque-de-maileva/ (extract) → pivot: https://www.cyberattaque.org/maileva-filiale-de-la-poste-victime-dune-cyberattaque/ (2026-09-24) → pivot: frenchbreaches, feed https://frenchbreaches.com/feed.xml → https://frenchbreaches.com/alertes/h-pital-foch-mwc2c69j52j9n2rnqb6 (extract). Neither Maileva/Docaposte's own statement nor the victims' notices could be fetched (WebSearch for the Foch and Maileva notices found only unrelated pages)."
    summary: |
      Maileva, a Docaposte (La Poste group) service for printing and dispatching business and administrative letters, stopped its service on
      2026-09-23 at 07:00 after detecting unauthorised access attempts on some customer accounts that aimed at sending letters in customers'
      names; at that point it reported no data extraction (customer notice seen by Cyberattaque.org on 2026-09-24). Later victim notices show
      that correspondence data was reached: the occupational-health service SPST Cornouaille said on 2026-10-09 that an unauthorised third
      party accessed a Maileva mail-tracking database holding recipient details and shipment information; the social landlord Flandre Opale
      Habitat said on 2026-11-03 that information in letters sent over the last ten years may have been viewed; Altéal (14,159 homes in
      Occitanie) published a notice on 2026-11-09 without a count; and the Hôpital Foch (private non-profit hospital) told patients that
      payment-reminder letters with names, postal addresses, invoice numbers, care dates and amounts due may have been consulted, without bank
      details or the nature of the care. Laboratories of the Inovie group are also said to have reported consequences. Vector and scope are not
      stated in the notices that were read. A separate October incident at the providers Atexo and Docaposte hit the Hauts-de-France region's
      aid platforms; no source read links the two events. Reliability is low: all three read documents are relays by two community breach
      trackers (Admiralty C) of victim notices that were not fetched.
    region_nexus: "France (Docaposte customers: social housing, occupational health, hospitals, laboratories); no Swiss customer named"
    primary_sector_nexus: "indirect: French public-interest bodies (social landlords, hospital) affected through an outsourced mail-dispatch provider; no Swiss public body named"
    sector: "public-sector (social housing) and healthcare, via a postal-services supplier"
    cves: []
    techniques: [T1078]
    affected_products: ["Maileva"]
