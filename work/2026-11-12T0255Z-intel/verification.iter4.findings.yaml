# Findings summary (machine-readable)
- code: F3
  category: claim-not-supported
  section: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
  item: "body para 2, claim 8a38f15ec2: 'ConnectWise had not identified an initial access vector' cited to BleepingComputer"
  url_or_quote: "\"ConnectWise had not identified an initial access vector, suspects the actor used independent third-party extensions that partners may have added, and disabled five (Labtech Plus, RMM Plus, RMM+, RMM Plus Password Link and RMM+ Password Link) in about 400 partner environments; on-premises customers must disable them by hand\" ([BleepingComputer, 2026-11-11])"
  summary: "The cited BleepingComputer page (https://www.bleepingcomputer.com/news/security/active-screenconnect-attacks-breach-msps-impact-dozens-of-organizations/, read as extract and raw HTML) carries the extensions, the 400 partner environments, the 'suspect the threat actor deployed additional remote-access software through independent 3rd party extensions' sentence and the on-premises note, but never says ConnectWise had not identified an initial access vector: its only access-vector statements are Huntress's ('Huntress has not determined how the attackers are gaining access', Brandt: 'We have no information about how a patient zero computer ... would have initiated this attack'). The clause is Huntress's relay of the ConnectWise advisory: Huntress's Background paragraph says 'ConnectWise shared that they had identified five independent third-party extensions ...; they said that they had not yet identified an initial access vector and full scope of the attack.' Move that clause to a Huntress citation (or split the sentence), and fix the sourcing_note sentence that says ConnectWise's statements all come from BleepingComputer's quotes."
- code: F14
  category: quantifier-without-source
  section: 2026-10-23/fortinet-hardening-release-fortios-fortimanager-fortimail
  item: "summary tail and body para 1 (claims c887390892, f8becb1af9): unscoped 'no Fortinet page states exploitation' (iteration 3 F14 left unfixed in these two places)"
  url_or_quote: "summary: \"... FortiAnalyzer and FortiManager 7.2 and 7.0 are left to migrate or wait; no Fortinet page states exploitation.\"; body: \"The advisories withheld until Patch Tuesday were published on 2026-11-10; no Fortinet page states exploitation, and NCSC.ch listed the status as unknown\""
  summary: "The entry cites Fortinet's own FG-IR-26-175 (https://fortiguard.fortinet.com/psirt/FG-IR-26-175, 'Known Exploited: Yes', CVE-2026-104286), which says 'This has been reported to be exploited in the wild, customers are urged to apply the workaround below', and the same body says the FortiMail builds 'also fix the exploited CVE-2026-104286'. Each of the 19 advisories of 2026-11-10 shows 'Known Exploited: No', so the true statement is the scoped one; iteration 3's remediation ('none of the 2026-11-10 advisories states exploitation') went into the 2026-11-11 update section only, while the summary and the first body paragraph still carry the absolute form. Scope both: 'none of the 2026-11-10 advisories states exploitation'."
