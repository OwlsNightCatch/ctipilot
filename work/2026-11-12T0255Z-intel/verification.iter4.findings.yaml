- code: F11
  category: editorial-advisory
  section: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
  item: "(low confidence) fetch-transport wording in sourcing_note and an ambiguous clause in actions[0]"
  url_or_quote: "sourcing_note: \"The ConnectWise advisory could not be read on any transport\"; actions[0]: \"... and disable the five named extensions starting with RMM+ versions 1.0.31 and 1.0.32, which accept a blank access key (on-premises instances by hand) ...\""
  summary: "'transport' is fetch-pipeline vocabulary (say 'The ConnectWise advisory page was not retrievable, so its statements are taken from BleepingComputer's quotes and Huntress's summary'). In actions[0] the clause 'starting with RMM+ versions 1.0.31 and 1.0.32' reads as if the five extensions begin with those versions; word it 'disable the five named extensions (RMM+ 1.0.31 and 1.0.32 accept a blank access key; on-premises instances by hand)'."
