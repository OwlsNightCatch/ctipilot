  - title: "Build Card ClickFix kit: a fake Cloudflare check whose operator notes list which Win+R command forms Defender detects, and a beacon that confirms the victim ran the paste"
    sources:
      - { url: "https://blog.report-uri.com/inside-a-clickfix-malware-kit-the-attacker-left-their-notes-behind/", publisher: "Report URI (Scott Helme)", date: "2026-11-11", role: "primary" }
    discovery_trace: "first seen at: report-uri-blog (rss), URL https://blog.report-uri.com/rss/ → primary (no pivot needed; extract returns raw HTML for this post, body read from the gh-content block): https://blog.report-uri.com/inside-a-clickfix-malware-kit-the-attacker-left-their-notes-behind/"
    summary: |
      Report URI analysed a ClickFix page it names the Build Card kit, found on a typosquat of a news site and still carrying the author's Russian-language comments, which read as an operations manual. The page imitates a Cloudflare challenge ('Just a moment', error code, then three steps: Win+R, Ctrl+V, Enter) while it has already put a command on the clipboard: cmd /c curl downloading an MSI into %TEMP% followed by msiexec /i with the quiet switch, with a per-visitor id in the URL. The operator comments record which command forms current Microsoft Defender signatures catch: PowerShell with iwr and msiexec, a bare msiexec with an HTTP URL, a net use WebDAV form, rundll32 on a UNC path (breaks on the Run dialog's comma parsing), and curl or certutil with a URL on an interactive command line (detected only on machines already flagged as suspicious); the curl-then-msiexec form was live because the operator's testing showed it undetected on fresh machines. The page polls the operator panel every 2.5 seconds and shows success only when the panel has logged the MSI download for that visitor id, so the kit only advances on confirmed execution; the clipboard is rewritten every 8 seconds. A newer template of the same operator uses execCommand to avoid Chrome's clipboard permission prompt, skips visitors with language codes from Russia and former Soviet states, shows a clean site to reviewers, and offers a fake Windows security error in 17 languages. The kit is designed to be pasted into any site before the closing body tag, so compromised legitimate sites would serve it. The MSI is described as claiming Microsoft authorship and unpacking an update.exe into a KBUpdate directory under LOCALAPPDATA that beacons for a next stage Report URI did not see and does not name; the panel sat on a Proton66 address and the domains were registered in September 2026. This is the vendor's own research of a CSP product maker; read the remediation (script-src without unsafe-inline plus nonces, connect-src, report-only first) as partly promotional but technically sound.
    region_nexus: "Global; no Swiss victim named. The Win+R/curl/msiexec execution chain is the generic ClickFix endpoint pattern."
