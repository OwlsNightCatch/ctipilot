  - title: "Unit 42: Falcon, a browser-resident C2 framework injected into government webmail and web applications in five countries, shares its core with PeckBirdy and delivers the OneDrive-C2 Antino implant"
    sources:
      - { url: "https://unit42.paloaltonetworks.com/falcon-c2-browser-compromise/", publisher: "Unit 42 (Palo Alto Networks)", date: "2026-11-11", role: "primary" }
      - { url: "https://www.trendaisecurity.com/en-us/resources-insights/trendai-security-blog/peckbirdy-script-framework", publisher: "TrendAI (Trend Micro)", date: "2026-01-26", role: "corroborating" }
    discovery_trace: "first seen at: unit42 (rss), URL https://unit42.paloaltonetworks.com/feed/ → primary (no pivot needed): https://unit42.paloaltonetworks.com/falcon-c2-browser-compromise/ → pivot: Unit 42 'Additional resources' (Symantec Jewelbug dossier, Talos UAT-11587 Antino post, both already in the store) and its PeckBirdy comparison → https://www.trendaisecurity.com/en-us/resources-insights/trendai-security-blog/peckbirdy-script-framework (fetched via the trendmicro.com URL, redirect to trendaisecurity.com)"
    summary: |
      Unit 42 describes Falcon (also XG, Xiàng Gē), a NodeJS command-and-control framework that runs inside the victim's browser: an operator-controlled JavaScript implant, uniquely obfuscated per session, is loaded from a script tag placed in a trusted site and holds a TLS WebSocket to the server (AES-256-CBC session key negotiated under an RSA key), so there is no file artefact on the endpoint. Unit 42 observed it in government webmail portals and web applications: in April 2026 a script tag in the header of a Middle Eastern ministry of foreign affairs' Roundcube webmail (39 Roundcube instances affected in that country, none seen elsewhere), in May 2026 a police web application in a Southeast Asian country that first harvested usernames and then showed a fake Adobe Flash update to pre-selected users to deliver Antino, and in early 2026 a justice-department entity in another Southeast Asian country reached through a sideloaded Chrome extension named PDF Viewer. Unit 42 counts government victims in one Middle Eastern and four Southeast Asian countries between March and May 2026 (foreign, defence, interior and justice bodies, police). The Chrome/Firefox extension (14 files, 40 permissions, installed in developer mode; how it reaches the victim is unknown to Unit 42) adds a web proxy through the victim's authenticated session, replacement of executable downloads by operator-chosen URLs, fetch/XHR hooking, clipboard rewriting and collection of credentials, cookies, history, Gmail, X, Discord and Zalo data. Antino is a Rust implant (earliest sample 2025-10-06) that stores OneDrive tenant credentials in its configuration, uses OneDrive files as heartbeat/command channel and persists through a diagnostic answer file run by sdiagnhost.exe that writes a Run key. Unit 42 assesses with high confidence that Falcon and Trend Micro's PeckBirdy (January 2026, attributed there to China-aligned APT groups) are variants of one framework, and notes that the code likely had AI assistance. Unit 42 names no threat actor; it lists Symantec's Jewelbug dossier and Talos' UAT-11587 report as further reading without stating a link, and the 'XG' alias matches the name of Symantec's XG-Web panel (name overlap only, which neither source states as an identity). Unit 42 does not say how the script tag reached the webmail pages, and says it does not know how the browser extension is deployed to victims.
    region_nexus: "No Swiss victim named; victims are government bodies in the Middle East and Southeast Asia. The technique (script tag in a self-hosted webmail or case-management portal header, sideloaded extension) transfers to any self-hosted webmail used by public bodies."
    primary_sector_nexus: "direct (technique targets ministries, police, justice and government webmail)"
    sector: "public-sector"
