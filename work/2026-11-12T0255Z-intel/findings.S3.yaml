      - quote: "As of October 2026, Unit 42 identified 1,323 internet-facing hosts running CyberStrikeAI and 609 running ARTEX."
        attribution: "Unit 42 (Palo Alto Networks)"
        source_url: "https://unit42.paloaltonetworks.com/artex-and-ai-powered-red-teaming-tools/"
      - quote: "Any one of these traits could come from an unusually configured tool or a person testing an API by hand. Seen together, they point to autonomous tooling."
        attribution: "Unit 42 (Palo Alto Networks)"
        source_url: "https://unit42.paloaltonetworks.com/artex-and-ai-powered-red-teaming-tools/"
      - quote: "Sophos has identified activity at a small number of customers that is consistent with ARTEX or other AI-assisted offensive tooling"
        attribution: "Sophos X-Ops"
        source_url: "https://www.sophos.com/en-us/blog/artex-attackers-apply-agentic-ai"
      - quote: "In several recently observed intrusions, Alibaba Cloud systems hosting AntiFox interfaces were associated with confirmed malicious actions against internet-facing web services and associated AWS environments."
        attribution: "Arctic Wolf Labs"
        source_url: "https://github.com/rtkwlf/wolf-tools/tree/main/pack_alerts/202611-antifox-alibaba-hosted-platforms-facilitate-web-cloud-intrusions"
    extended_notes: |
      Triage-relevant: Unit 42 stresses no single hallmark is conclusive (a mis-tuned tool or a human testing an API produces the same); the combination of cadence, canary values, write-then-verify and parallel multi-asset probing is the discriminator. Telemetry classes the sources support: identity-provider logs (canary usernames, first use of a cloud key from a new IP), cloud control-plane audit (service principal credentials added or roles assigned by an application, application sign-ins with a scripted user agent per Sophos; GetSecretValue after wide AccessDenied enumeration per Arctic Wolf), web-server process lineage (w3wp.exe creating an .aspx file then spawning commands), storage-bucket write-then-delete tests, edge access logs. Hardening levers named: remove public OpenAPI specs, source maps and config files with tokens or client ids from internet-facing apps; require authentication on every write endpoint including dev and staging; rate-limit and bot-protect registration, password-reset and verification endpoints; replace long-lived cloud keys with role-based access. GitGuardian (via The Hacker News) lists about 45 open-source agentic attack frameworks in five categories; that count is a secondary claim not independently checked. Candidate source: Arctic Wolf Labs publishes adversary-research alerts as pack_alerts in github.com/rtkwlf/wolf-tools.
