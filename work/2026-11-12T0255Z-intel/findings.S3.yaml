    discovery_trace: "first seen at: report-uri-blog (rss), URL https://blog.report-uri.com/rss/ (lookback sweep, item dated 2026-11-09) → primary (no pivot needed): https://blog.report-uri.com/one-hijacked-analytics-script-and-russian-iphone-exploits-on-thousands-of-websites/ → store check: entries/2026-11-05/apt29-watering-hole-ios-android-n-day-chains-kev already covers Sekoia's report including the Plerdy week"
    summary: |
      Report URI looked for the campaign Sekoia attributes with moderate to high confidence to APT29 in its own crawler data. It reports 33 sites that loaded the attackers' fingerprinting script during 27 August to 3 September 2026, every one of them also loading the Plerdy analytics script (mostly Ukrainian sites, some in the US, UK, Australia and Sweden); it says these are only the sites its scans happened to see during that week. It also found a loader appended to a script file of a WordPress plugin on a small Polish site, pointing at a domain absent from Sekoia's published list and since cleaned up, and says the US chemical-industry organisation site Sekoia described without naming was still serving the loader on 2026-11-05, the day after Sekoia's report, with the loader pasted into a block of CMS content rather than the code; Report URI says it reported the site to CISA. It also notes that the DarkSword iOS chain, which Google documented earlier this year, is the same chain it saw used by crypto thieves in October, with a different payload (a long-running wallet-draining backdoor versus a one-shot data grab). Defender value: a hijacked third-party script leaves the site's own code unchanged, so the signal is a new script domain appearing on pages (CSP with explicit script-src and reporting, monitoring of loaded script domains, integrity monitoring of existing scripts); a policy relying only on strict-dynamic lets scripts added by a trusted script through. Single vendor with first-hand scan data, which sells a client-side security product.
    region_nexus: "No Swiss victim named; sites in several countries loaded the script, and any public-sector site using third-party analytics or tag scripts shares the exposure class."
