  - title: "SpecterOps on multi-tenant Entra apps: one stolen vendor app credential reaches every consenting tenant, and how to audit the third-party service principals in your own tenant"
    lookback: true
    sources:
      - { url: "https://specterops.io/blog/2026/11/06/app-registrations-vs-service-principals/", publisher: "SpecterOps (Lee Robinson)", date: "2026-11-06", role: "primary" }
    discovery_trace: "first seen at: specterops (rss), URL https://specterops.io/feed/ (lookback sweep, item dated 2026-11-06) → primary (no pivot needed): https://specterops.io/blog/2026/11/06/app-registrations-vs-service-principals/"
    summary: |
      SpecterOps explains why the ConnectWise Cloud Backup incident reached more than 100 tenants and turns it into an audit procedure. An app registration holds the credentials (client secrets, certificates, federated credentials) in the vendor's home tenant; every customer that consents gets a service principal that holds the permissions, so a credential taken from the vendor tenant authenticates as that app in every customer tenant just by changing the directory id, with tenant-wide application permissions (mail, files, sites, and in this case Application.ReadWrite.All and AppRoleAssignment.ReadWrite.All) and without Conditional Access in the default case. SpecterOps says it does not know how the ConnectWise credential material was obtained. Defender steps in the post: list every service principal whose appOwnerOrganizationId is neither your tenant nor Microsoft's (the portal's Enterprise applications default view hides some, so use Microsoft Graph or BloodHound and group by owning tenant); review the granted permissions per service principal, prioritising tenant-wide application permissions and anything that can hand out access, and disable rather than delete unused ones; check passwordCredentials and keyCredentials on service principals (a secret added directly to a service principal does not show in the admin centre); restrict user consent and enable the admin consent workflow; collect service-principal sign-in logs and MicrosoftGraphActivityLogs, and alert on a service principal signing in from a new IP, new credentials added to an app registration or service principal (two different audit activity names) and new consent grants. It also states that Conditional Access for workload identities (separate Workload ID Premium licence) applies only to single-tenant service principals registered in your own tenant and therefore would not have stopped a vendor-side compromise. This is an explainer built on a covered incident rather than a new finding; its value is the audit method.
    region_nexus: "Global; applies to every Microsoft 365 / Entra tenant that has consented to third-party backup, security or compliance apps, including cantonal and communal tenants."
