  - title: "Certighost (CVE-2026-54121) attempted in real intrusions: Kaspersky ties exploitation attempts to the new Citrus ransomware group, which gets in through contractor VPN and RDP credentials and deploys encryption by Group Policy"
    sources:
      - { url: "https://securelist.com/citrus-ransomware/121879/", publisher: "Kaspersky Securelist (GReAT)", date: "2026-11-11", role: "primary" }
      - { url: "https://techcommunity.microsoft.com/blog/microsoftthreatprotectionblog/detecting-cve-2026-54121-certighost-with-microsoft-defender/4542861", publisher: "Microsoft Defender blog", date: "2026-07-31", role: "corroborating" }
    discovery_trace: "first seen at: kaspersky-securelist (rss), URL https://securelist.com/feed/ → primary (no pivot needed): https://securelist.com/citrus-ransomware/121879/ → store check: CVE-2026-54121 already covered by entries/2026-07-25/certighost-cve-2026-54121-ad-cs-dc-impersonation-poc (states 'not seen exploited in the wild') → pivot: Microsoft Defender guidance https://techcommunity.microsoft.com/blog/microsoftthreatprotectionblog/detecting-cve-2026-54121-certighost-with-microsoft-defender/4542861 for prior exploitation status, exposure conditions and audit settings"
    summary: |
      Kaspersky's GReAT analyses Citrus, a previously undocumented group that encrypts with a Go ransomware Trojan from the Sn00py RaaS family (RSA-2048 and ChaCha20, .citrus extension). Initial access is through credentials stolen from employees of compromised contractors, used against corporate VPNs or directly against internet-facing terminal servers over RDP. Because the contractor domain accounts had very limited privileges, Kaspersky says the actors attempted to exploit the AD CS authentication-bypass Certighost (CVE-2026-54121) with an exploit published on GitHub: the attempts left machine accounts in Active Directory with names of the form GHOST plus eight random letters and certificate requests on the Machine template whose attributes name an attacker-controlled system for the CA's chase lookup, which, if it succeeds, yields a certificate usable to authenticate as a domain controller account. Kaspersky does not say whether any attempt succeeded. This changes the status in the store's July entry: Microsoft's 2026-07-31 Defender guidance said it had observed no confirmed threat-actor exploitation and that activity looked like security testing; a ransomware group's attempts in real intrusions are now reported by a telemetry-holding lab. The same intrusions used CVE-2020-1337 (exploit from the Metasploit repository), insecure 1C:Enterprise servers (external data processors to run commands), PowerShell and cmd with LLM-written commands and scripts (commented in the style of LLM output), Impacket atexec scheduled tasks, mimikatz, a modified open-source keylogger, Snaffler share crawling, fscan, ADRecon and SharpHound, Telegram Desktop tdata archives uploaded to an external web service, reverse VLESS tunnels through Xray on port 443 (REALITY configured to look like requests to a Russian mirror site) and AnyDesk; defences were weakened by clearing event logs, disabling antivirus (including through central security-console access and a Group Policy Object that switches Defender off) and adding exclusions. Encryption is pushed by a malicious Group Policy Object created with Import-GPO and New-GPLink from a script on SYSVOL, with files and tasks named after Kaspersky, a scheduled task, WinRM enabled and Volume Shadow Copy disabled; domain controllers are excluded from encryption so the policy keeps propagating. Kaspersky sees similarities with Toy Ghouls (shared TTPs and tools stored in the same directories, no direct infrastructure overlap, the same infrastructure compromised by both in several incidents) and says both groups are Russian-speaking and attack Russian companies only.
    region_nexus: "Victims are Russian companies only per Kaspersky; no Swiss exposure indicated. Transferable to any AD estate: contractor-account initial access, AD CS abuse by a low-privileged domain account, GPO-delivered ransomware."
    primary_sector_nexus: "indirect"
