    extended_notes: |
      Detection concepts the source supports: (1) web-server and template integrity for webmail, ticketing and case-management portals: a new script tag in a header or template that loads an external resource returning a long integer array plus a small decoder loop; (2) browser telemetry: extensions installed in developer mode that imitate utilities (PDF viewer) and request broad permissions (all URLs, debugger, tabCapture, nativeMessaging, webRequest); (3) Hm_lvt_ cookies or local-storage keys on internal or government web applications where Baidu Analytics has no legitimate reason to appear (Unit 42's discriminator: Baidu Analytics cookies are normal on sites that use that service, anomalous on internal government portals); (4) OAuth sign-ins or traffic to Microsoft OneDrive tenants outside the organisation's own tenancy with repeated small JSON writes. Hardening lever named by the source: block side-loading of unauthorised browser extensions. Registry hygiene: the store carries Jewelbug (Symantec 2026-08-13) and UAT-11587 (Talos 2026-09-30) on the same Antino implant; this is a third lab's independent telemetry on the same ecosystem and the first to document the Roundcube script-tag cases and the PeckBirdy lineage; indicators (domains, extension id, hashes) exist in the source and are deliberately not carried.
