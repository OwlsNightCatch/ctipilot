        source_url: "https://techcommunity.microsoft.com/blog/microsoftthreatprotectionblog/detecting-cve-2026-54121-certighost-with-microsoft-defender/4542861"
    extended_notes: |
      Exposure per Microsoft: an Enterprise CA integrated with AD, enrolment through the machine certificate template, the CA flag EDITF_ENABLECHASECLIENTDC set, default ms-DS-MachineAccountQuota or an attacker-controlled machine account, network reach from the CA to the attacker host over SMB and LDAP, any valid domain account; fixed by the 2026-07-14 update on Enterprise CA hosts. Detection (telemetry class first): AD certificate-services audit records (Microsoft: enable the Certification Services audit subcategory and CA AuditFilter 127; event 4886 request received and 4887 certificate issued show requester, template and disposition: a certificate for a domain-controller identity requested through the machine template by a low-privileged principal never occurs normally), directory object-creation events for computer accounts named GHOST plus eight random letters, PKINIT and DCSync follow-on, Defender for Identity alert 'Potential Certighost (CVE-2026-54121) AD CS abuse'. Triage: unexpected Kaspersky-named GPOs, scheduled tasks (KasperskyAgentInstallTask, Sysvc) or self-extracting archives are attacker masquerade, not the vendor's product (Kaspersky says the names are used for masquerade; whether the vendor's own tooling legitimately uses a similarly named GPO is not stated, so verify against software-deployment records). Citrus could be a standalone actor entry if the main agent judges the Swiss-relevance bar met by the transferable TTPs; Kaspersky's own scope is Russian victims only. IOCs exist in the source and are not carried.
