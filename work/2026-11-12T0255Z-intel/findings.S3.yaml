  - title: "eMudhra: the CA now says eight RSA issuing CAs it had called unaffected were also revoked, on 2026-11-07 with reason cessationOfOperation, after it could not show compliant key handling; it exits public TLS"
    sources:
      - { url: "https://bugzilla.mozilla.org/show_bug.cgi?id=2083449", publisher: "Mozilla CA Program incident bug 2083449 (eMudhra full incident report, comment 82)", date: "2026-11-11", role: "primary" }
      - { url: "https://thehackernews.com/2026/11/emudhra-revokes-8-more-cas-it.html", publisher: "The Hacker News", date: "2026-11-11", role: "corroborating" }
    discovery_trace: "first seen at: hackernews (rss), URL https://feeds.feedburner.com/TheHackersNews → pivot: https://thehackernews.com/2026/11/emudhra-revokes-8-more-cas-it.html → primary: eMudhra's full incident report in the Mozilla CA Program bug, https://bugzilla.mozilla.org/show_bug.cgi?id=2083449 (comment 82, read through extract; the bug page is last updated 2026-11-11) → store check: entries/2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates carries seven updates, the newest (2026-11-11) on SonicWall, Apple, Microsoft and Cisco, none on the RSA issuers"
    summary: |
      eMudhra's full incident report to the Mozilla CA Program, posted this week, extends the October key-compromise incident. The eight ECDSA P-384 intermediates (G3B/G3C) were revoked on 2026-10-18 after a one-line fault in a host-side Python script truncated each private key to its first byte during a wrap/unwrap round trip at the 2025-04-30 key ceremony. The report now states that the eight RSA-4096 issuers (G2B/G2C) generated at the same ceremony went through the same read-back pattern: their keys were not truncated and signatures verify against the certified moduli, but the private exponent and a prime were handled in the memory of a Python process on the ceremony host, so eMudhra says it cannot positively demonstrate compliance with its own CPS section 6.2.6 and with the Baseline Requirements on key transfer. It reached that view in early November after root-program discussion and revoked the eight RSA issuers on 2026-11-07 with reason cessationOfOperation, not key compromise (participants have asked why). It had told Mozilla on 2026-10-19 that the RSA issuers took a different path and were not impacted. Of the eight RSA issuers, six issue TLS and two code-signing certificates; four G2C TLS issuers were in production from May 2026 and The Hacker News counts 195 end-entity certificates from them (130, 63 and 2 across three issuers), which eMudhra says were migrated. eMudhra also states it has decided to exit public TLS issuance and will stop all issuance from the emSign Root G1 hierarchy, which mainly serves a North American university federation, before 2026-11-16. The sources do not say whether browser root programs will take further action on the RSA hierarchy beyond the revocations; the store's entry already tracks the trust-store changes for the ECC G3 chain.
