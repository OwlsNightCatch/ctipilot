    techniques: [T1595.002, T1190, T1505.003, T1059.001, T1078.004, T1110.003, T1552, T1526, T1530]
    affected_products: ["Microsoft IIS", "Amazon Web Services IAM", "AWS Secrets Manager", "Amazon S3"]
    entity_keys: ["tool:artex", "actor:storm-0940"]
    new_entities:
      - { key: "tool:antifox", type: tool, name: "AntiFox", aliases: [], summary: "Open-source, Chinese-language agentic penetration-testing platform (planner, worker and main-agent system over a global asset graph) whose Alibaba Cloud-hosted interfaces Arctic Wolf Labs associates with web-to-AWS intrusions (Arctic Wolf Labs, 2026-11-10)." }
    relation_suggestions: []
