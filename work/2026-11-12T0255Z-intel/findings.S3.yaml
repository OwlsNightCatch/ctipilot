  # ------------------------------------------------------------------ 10
  - title: "CVE-2026-118383, MongoDB Server: a critical pre-authentication use-after-free in replica-set primary catch-up; Datadog reproduces the crash, MongoDB knows of no exploitation"
    sources:
      - { url: "https://securitylabs.datadoghq.com/articles/cve-2026-118383-mongodb-server-use-after-free/", publisher: "Datadog Security Labs", date: "2026-11-11", role: "primary" }
      - { url: "https://www.mongodb.com/community/forums/t/important-mongodb-security-update-available-action-required-november-10-2026/344843", publisher: "MongoDB (vendor announcement)", date: "2026-11-10", role: "primary" }
      - { url: "https://github.com/advisories/GHSA-fjxh-6vgh-cx2c", publisher: "GitHub Advisory Database", date: "2026-11-10", role: "corroborating" }
    discovery_trace: "first seen at: datadog-security-labs (rss), URL https://securitylabs.datadoghq.com/rss/feed.xml → primary: https://securitylabs.datadoghq.com/articles/cve-2026-118383-mongodb-server-use-after-free/ → vendor pivot: MongoDB announcement https://www.mongodb.com/community/forums/t/important-mongodb-security-update-available-action-required-november-10-2026/344843 → CVE record cross-check through the CVE Program JSON API for CVE-2026-118383 (fixed versions and CVSS read from the CNA record; API call not cited)"
    summary: |
      MongoDB announced on 2026-11-10 that it found and fixed CVE-2026-118383 internally (CVSS 4.0 9.5, CVSS 3.1 9.0 in the CNA record) and is not aware of exploitation attempts. The flaw is a use-after-free in the replication component: when a newly elected replica-set primary finishes catch-up, cleanup can run twice on state that unauthenticated requests created, which can terminate the server or, under certain conditions, execute code in the server process. Replica-set members are affected, including shard and config-server members; standalone mongod is not. Datadog Security Labs reproduced a crash on MongoDB 8.0.34 and explains the mechanism: an unauthenticated client sends two ping requests carrying a readConcern.afterOpTime that leave stale waiters on a reachable member (vulnerable servers accept ping before login, so enabling authentication does not prevent planting); the waiters persist until restart, rollback or step-down; the crash fires only when that member later wins an election while lagging, which the attacker cannot cause and which happens during maintenance or outages. Datadog demonstrates a crash and a lost primary in its lab (with lab-created lag and failover), not code execution. Fixed releases per the CNA record, matching Datadog's table: 9.0.7, 8.3.16, 8.0.37, 7.0.48, 6.0.30, 5.0.35 and 4.4.32; Atlas clusters are upgraded during maintenance. Until upgrade, restrict network access to the members to the systems that need it (this limits who can plant the waiters but is not a fix). Not on the CISA KEV list as of 2026-11-10 (KEV feed read this run).
    region_nexus: "Global; MongoDB replica sets back many public-sector applications. Exposure is any replica-set member reachable from untrusted networks."
    primary_sector_nexus: "indirect"
    sector: "cross-sector"
    cves: [CVE-2026-118383]
    techniques: [T1190, T1499.004]
    affected_products: ["MongoDB Server"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    classification_suggestion: { reliability: A, credibility: 1 }
    evidence:
      - quote: "we are not aware of any attempts to take advantage of this vulnerability"
        attribution: "MongoDB"
        source_url: "https://www.mongodb.com/community/forums/t/important-mongodb-security-update-available-action-required-november-10-2026/344843"
      - quote: "Remote unauthenticated exploitation is possible, but only during a specific window that the attacker does not have visibility into."
        attribution: "Datadog Security Labs"
        source_url: "https://securitylabs.datadoghq.com/articles/cve-2026-118383-mongodb-server-use-after-free/"
      - quote: "Turning on authentication does not prevent this."
        attribution: "Datadog Security Labs"
        source_url: "https://securitylabs.datadoghq.com/articles/cve-2026-118383-mongodb-server-use-after-free/"
    extended_notes: |
      Cross-domain lead for S1 (vulnerability); returned here because the discovering-adjacent research lab is in the S3 majors list. Exposure check: version of every replica-set member (including members offline during maintenance and members in containers); whether the mongod port is reachable from outside the application tier. Detection concept (telemetry class): MongoDB server logs showing ping commands with readConcern afterOpTime from unauthenticated connections, and mongod crashes with SIGSEGV after an election; Datadog's article names the backtrace entry CatchupState abort. Triage: an unexpected primary crash after failover on an unpatched member is the observable; a crash on a standalone is not this bug.
