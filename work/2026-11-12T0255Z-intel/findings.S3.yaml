  - title: "CVE-2026-119618, Apache HTTP Server mod_http2: critical race in assign_headers() can lead to RCE; 2.4.71 released 2026-11-11 (2.4.55 through 2.4.70 affected)"
    sources:
      - { url: "https://httpd.apache.org/security/vulnerabilities_24.html", publisher: "Apache HTTP Server Project (security advisory)", date: "2026-11-11", role: "primary" }
      - { url: "https://www.wiz.io/blog/cve-2026-119618-rce-apache-http-server-vulnerability", publisher: "Wiz Research", date: "2026-11-11", role: "corroborating" }
    discovery_trace: "first seen at: wiz-blog, URL https://www.wiz.io/blog (WebFetch listing, item dated 2026-11-11) → pivot: https://www.wiz.io/blog/cve-2026-119618-rce-apache-http-server-vulnerability → primary: https://httpd.apache.org/security/vulnerabilities_24.html (CVE-2026-119618, 2.4.71) → CVE record cross-check through the CVE Program JSON API (CNA Apache, published 2026-11-11; not cited)"
    summary: |
      The Apache HTTP Server Project lists CVE-2026-119618 as critical: a concurrent-execution race with improper synchronisation in mod_http2's assign_headers() that can lead to remote code execution; it affects 2.4.55 through 2.4.70 and the standalone mod_h2 from GitHub 2.0.8 through 2.0.42, is fixed in 2.4.71 (released 2026-11-11), and was found by Anthropic's OSS Scanner (reported 2026-10-26) and by Google Cloud's Vulnerability Research team (reported 2026-11-03). The same release fixes a mod_md NULL-pointer crash (CVE-2026-106023, important) and a mod_vhost_alias one-byte stack overwrite (CVE-2026-109163, low). Wiz Research adds that the flaw lets a remote unauthenticated attacker corrupt heap memory to execute code with the web server's privileges, that it saw no exploit and no exploitation in the wild at publication, and that 64% of the cloud environments in its data have resources running a vulnerable version and 51% have publicly exposed instances (configuration not considered). Mitigation if patching is delayed: disable HTTP/2 by restricting the Protocols directive to http/1.1, removing h2 and h2c. Two caveats on the corroborating source: Wiz's page heading cites CVE-2026-111497 (the Node.js Brotli identifier) where its body uses CVE-2026-119618, and its table gives the fixed mod_h2 as 2.0.24 and newer while the affected range runs to 2.0.42, so the standalone mod_h2 fixed version is unverified; Apache's page does not name a fixed mod_h2 release in the text read. Apache's advisory carries no CVSS score and no statement on authentication; 'unauthenticated' is Wiz's wording.
    region_nexus: "Global; Apache httpd is widely deployed on public-sector web estates. Exposure is any httpd 2.4.55 to 2.4.70 with mod_http2 loaded and HTTP/2 enabled (h2 or h2c in the Protocols directive)."
    primary_sector_nexus: "direct (ubiquitous web server)"
    sector: "cross-sector"
    cves: [CVE-2026-119618, CVE-2026-106023, CVE-2026-109163]
    techniques: [T1190]
    affected_products: ["Apache HTTP Server", "mod_h2 (standalone, GitHub)"]
    entity_keys: ["product:apache-http-server"]
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    classification_suggestion: { reliability: A, credibility: 2 }
    evidence:
      - quote: "This issue affects Apache HTTP Server: from 2.4.55 through 2.4.70."
        attribution: "Apache HTTP Server Project"
        source_url: "https://httpd.apache.org/security/vulnerabilities_24.html"
      - quote: "As of the time of this blog’s publication, no exploit is available and there are no reports of exploitation in the wild."
        attribution: "Wiz Research"
        source_url: "https://www.wiz.io/blog/cve-2026-119618-rce-apache-http-server-vulnerability"
      - quote: "According to Wiz data 64% of cloud environments have resources vulnerable to CVE-2026-119618, and 51% of cloud environments have publicly exposed instances."
        attribution: "Wiz Research"
        source_url: "https://www.wiz.io/blog/cve-2026-119618-rce-apache-http-server-vulnerability"
    extended_notes: |
      Cross-domain lead for S1: the Apache advisory is the primary; the CVE is not in prior_coverage or the store. Exposure check: httpd -v and the loaded modules (mod_http2 or a standalone mod_h2), the Protocols line in the server or virtual-host configuration (h2, h2c); distribution packages may backport the fix without changing the upstream version string, so use the vendor's advisory for the distro build. Detection concept (telemetry class): web-server crash or child-process restarts under HTTP/2 load in error logs and access logs showing malformed or concurrent header activity from a single client; no source provides signatures.
