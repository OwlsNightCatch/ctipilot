      Triage: legitimate multi-tenant vendor service principals are expected in every tenant; the hunting signal is a vendor-owned service principal signing in from a new IP or an unexpected scripted user agent, or credentials added to it, not its mere presence. The source gives the BloodHound property (appownerorganizationid on AZServicePrincipal) and the Graph property (appOwnerOrganizationId).
