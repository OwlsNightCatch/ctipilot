      - { url: "https://github.com/rtkwlf/wolf-tools/tree/main/pack_alerts/202611-antifox-alibaba-hosted-platforms-facilitate-web-cloud-intrusions", publisher: "Arctic Wolf Labs", date: "2026-11-10", role: "primary" }
      - { url: "https://thehackernews.com/2026/11/antifox-ai-pentesting-platform-linked.html", publisher: "The Hacker News", date: "2026-11-11", role: "corroborating" }
    discovery_trace: "first seen at: unit42 (rss), URL https://unit42.paloaltonetworks.com/feed/ → primary: https://unit42.paloaltonetworks.com/artex-and-ai-powered-red-teaming-tools/ ; second lead: sophos-xops (rss), URL https://www.sophos.com/en-us/blog/feed?id=blt6f15f4f7deaf4242 → primary: https://www.sophos.com/en-us/blog/artex-attackers-apply-agentic-ai ; third lead: hackernews (rss), URL https://feeds.feedburner.com/TheHackersNews → pivot: https://thehackernews.com/2026/11/antifox-ai-pentesting-platform-linked.html → primary: Arctic Wolf pack_alerts page https://github.com/rtkwlf/wolf-tools/tree/main/pack_alerts/202611-antifox-alibaba-hosted-platforms-facilitate-web-cloud-intrusions"
    summary: |
      Three labs add detection-relevant behaviour to the existing ARTEX entry and widen it from one tool to a framework class. Unit 42 (Incident Response and Managed Threat Hunting) reports ARTEX consoles on attacker servers in several intrusions and a coordinated ARTEX campaign against customer cloud environments in retail and consulting that turned public password-reset pages and exposed APIs into cloud access, sometimes in under a day, without exploiting a software vulnerability; as of October 2026 it counted 1,323 internet-facing hosts running CyberStrikeAI and 609 running ARTEX (21 running both). Its behavioural hallmarks, offered because indicators rotate with every fork: bursts of one to 14 requests about a second apart followed by a 25 to 31 second pause (an agent waiting on a model call), more than 200 client secrets validated in about three minutes, pivots within about a minute of a credential download, routes taken from downloaded OpenAPI specifications and source maps, failed requests (HTTP 422) corrected and retried, a GET to the same path after nearly every successful write, write-then-delete tests on storage buckets, canary usernames and placeholder values, an application delivery controller, a dozen VPN appliances, a NAS and cloud ports hit within one hour, and 48-second polling loops lasting three days; in one engagement the attacker switched from scripted clients to a desktop browser for the password reset and first token request, which Unit 42 reads as a human in the loop or browser automation. Sophos reports a small number of customer cases consistent with ARTEX or other AI-assisted tooling (web shell and SQL Server command execution, credential theft, lateral-movement attempts, rapid command sequences and structured output markers) and notes that a backdoored copy of the ARTEX Docker image exists, so copies from unofficial mirrors after the original project went offline should be treated as untrusted. Arctic Wolf Labs reports a different open-source Chinese-language framework, AntiFox, whose interfaces on Alibaba Cloud systems were associated with intrusions in which the IIS worker process created an ASPX web shell that read web.config files and connection strings and copied configuration and log files to a web-accessible upload directory (the vulnerability used was not identified), and in which valid AWS IAM users or an assumed EC2 role were used to enumerate dozens of services, reach a successful GetSecretValue on a production secret and perform S3 GetObject, CopyObject and DeleteObject calls. Unit 42's assessment is that AI-driven tooling is not inventing new attacks but raising pace and persistence.
    region_nexus: "Global; the targeted weak points (self-service reset flows, exposed OpenAPI specs and source maps, IIS-hosted apps, long-lived cloud keys) apply to cantonal and communal web estates and cloud tenants."
    primary_sector_nexus: "indirect"
    sector: "cross-sector"
