  - title: "Agentic pentest frameworks beyond ARTEX: Unit 42's behavioural hallmarks and exposure census, Sophos customer telemetry, and Arctic Wolf's AntiFox intrusions (IIS web shell, valid AWS credentials, GetSecretValue)"
    sources:
      - { url: "https://unit42.paloaltonetworks.com/artex-and-ai-powered-red-teaming-tools/", publisher: "Unit 42 (Palo Alto Networks)", date: "2026-11-11", role: "primary" }
