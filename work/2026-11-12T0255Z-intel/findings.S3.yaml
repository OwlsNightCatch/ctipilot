  - title: "GSocket on compromised Linux web servers: Microsoft sees the open-source relay client used to keep encrypted access after the exploited application is patched"
    sources:
      - { url: "https://www.microsoft.com/en-us/security/blog/2026/11/11/global-socket-how-threat-actors-weaponizing-gsocket-stealthy-c2/", publisher: "Microsoft Security Research (Defender)", date: "2026-11-11", role: "primary" }
    discovery_trace: "first seen at: msft-ti, URL https://www.microsoft.com/en-us/security/blog/topic/threat-intelligence/ (WebFetch of the topic listing, newest item dated 2026-11-11) → primary (no pivot needed): https://www.microsoft.com/en-us/security/blog/2026/11/11/global-socket-how-threat-actors-weaponizing-gsocket-stealthy-c2/"
    summary: |
      Microsoft Defender telemetry shows multiple unrelated actors deploying GSocket (gs-netcat, an open-source remote-access tool) on Linux servers after exploiting an internet-facing web application, so that access outlives the patch. Microsoft's analysed telemetry covers March to August 2026: devices with GSocket-related detections rose 356.2% (not consistently month to month); web applications and hosting made up 87.1% of attributable incidents (PHP web applications and cPanel hosting 63.9%, Apache 24.3%); education and research was the largest affected sector at 30.7%, followed by technology and telecommunications at 22.9%; Microsoft says this reflects exposure (large decentralised web estates outside central IT), not deliberate sector selection. The observed chain: command execution as a child of the web server or application runtime, curl fetching a script that profiles the host, picks a client for the architecture and stages it in a hidden directory under /dev/shm (or /tmp), a kernel-thread-style process name set with exec -a or a binary renamed like a system service, persistence by cron, systemd units, shell profiles and watchdogs, timestomping and deletion of staging files, and in a few incidents attempts to reach root with the Dirty Frag kernel flaw CVE-2026-43284. The relay model is the point: the host and the operator both connect outbound to the public Global Socket Relay Network and are paired by a shared secret (delivered to the operator through the console, a temp file, Telegram, Discord or a webhook), so there is no actor-owned IP address or domain to block and no inbound listener to find. Microsoft's remediation guidance is to treat host cleanup as part of fixing the application: remove the client and its persistence, restore deny-by-default egress, mount temporary and memory-backed directories non-executable, audit cron, systemd and shell start-up files, and prioritise local privilege-escalation patching on internet-facing servers.
    region_nexus: "Global; Microsoft names education and research and hosting estates (PHP, cPanel, Apache) as the main victims, which matches cantonal, communal and university web estates. No Swiss victim named."
    primary_sector_nexus: "indirect (education/research and shared-hosting web estates)"
