- code: F4
  category: hallucinated-fact
  section: 2026-11-07/cve-2026-111497-brotli-desigo-cc-mitel-openscape-cisco-duo
  item: "actions[1] (claim 37d21ddce8), main body para 1 (claim 38269a9c56), record summary (claim af10ee1418), Defender takeaway last sentence (claim 69ef13c706)"
  url_or_quote: "\"On every Siemens product that the advisories list with no fix, ... Teamcenter and the Opcenter family, disable Brotli compression and decompression at the application or proxy layer where it is not required and add the IIS request-filtering rule ...\"; body: \"a fix only for WinCC OA V3.20 and BRAUMAT and SISTAR and a Brotli-disable or IIS request-filter mitigation for the rest\"; record: \"the rest take a Brotli-disable or request-filter mitigation\""
  summary: "SSA-678870 (the 28 software products) gives Teamcenter 'For Teamcenter manual mitigation instructions can be found here: .../PL8869204' and the Opcenter rows 'The vulnerability can be mitigated on the IIS Reverse Proxy. Please see .../PL8869211' (both login-gated, not read); HyperLynx/PADS/Xpedition say 'Disable brotli compression and block brotli compression at the network firewall'; Innexis Architecture Native Acceleration, Insights Hub, PAVE360 Automotive and Simcenter Executable Digital Twin/Studio list only 'Currently no fix is available' with no mitigation at all. The 'application or proxy layer' wording and the UMC IIS rule belong to SSA-242944 (the 15 industrial products), so the action tells readers to apply a mitigation to Teamcenter and Opcenter that Siemens does not name for them, and 'a mitigation for the rest' is wrong for at least six software products. Scope the Brotli-disable/IIS rule to the SSA-242944 products, point Teamcenter/Opcenter at the vendor KB articles, and say plainly that no mitigation is listed for the products that carry none."
