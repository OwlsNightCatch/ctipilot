items:
  - title: "Certighost (CVE-2026-54121): full AD CS certificate-forgery exploitation mechanics published for a patched Domain-Controller-impersonation flaw"
    sources:
      - { url: "https://gist.githubusercontent.com/H0j3n/a5ef2609b5f2944ac2390a191a534c26/raw", publisher: "H0j3n & aniqfakhrul (independent researchers, GitHub Gist write-up)", date: "2026-07-24", role: "primary" }
      - { url: "https://cybersecuritynews.com/certighost-active-directory-cs-flaw/", publisher: "CybersecurityNews", date: "2026-07-24", role: "corroborating" }
      - { url: "https://github.com/aniqfakhrul/CVE-2026-54121", publisher: "aniqfakhrul (GitHub PoC repository)", date: "2026-07-24", role: "corroborating" }
      - { url: "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-54121", publisher: "Microsoft MSRC", date: "2026-07-14", role: "primary" }
    discovery_trace: "first seen at: WebSearch (\"vulncheck advisory July 24 2026\") → pivot: WebSearch (\"Certighost CVE-2026-54121 Active Directory Certificate Services\") → pivot: CybersecurityNews, URL https://cybersecuritynews.com/certighost-active-directory-cs-flaw/ → primary: raw research write-up, URL https://gist.githubusercontent.com/H0j3n/a5ef2609b5f2944ac2390a191a534c26/raw → primary: Microsoft MSRC CVE page (fetched via `msrc cve CVE-2026-54121` bridge subcommand), URL https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-54121"
    summary: |
      Researchers H0j3n and aniqfakhrul published (2026-07-24) a full technical write-up and working PoC for "Certighost"
      (CVE-2026-54121, CVSS 3.1 8.8, CWE-285 Improper Authorization), an Active Directory Certificate Services (AD CS)
      elevation-of-privilege flaw Microsoft patched in the July 2026 Patch Tuesday cycle (2026-07-14). The vulnerable
      path is the enrollment "chase" fallback in `certpdef.dll` (loaded by `certsrv.exe`): when a certificate request
      carries the `cdc` (Client DC) and `rmd` (Remote Domain) attributes, the CA's `CRequestInstance::_LoadPrincipalObject`
      opened SMB and LDAP connections to the attacker-supplied `cdc` host and trusted the identity data (objectSid,
      dNSHostName) it returned — without first verifying that host was an actual Domain Controller. A low-privileged
      domain user (using only the default `ms-DS-MachineAccountQuota`-created machine account) can stand up rogue
      LDAP/LSA services, direct the chase at itself, and receive a CA-issued certificate carrying a target Domain
      Controller's identity; that certificate authenticates via PKINIT as the DC, and the resulting Kerberos ticket
      grants directory-replication rights — the PoC demonstrates a DCSync pull of the krbtgt hash. Microsoft's fix
      adds `CRequestInstance::_ValidateChaseTargetIsDC` (gated behind servicing flag `Feature_3185813818`), which
      rejects the chase target unless it resolves to a real computer object with `userAccountControl` bit
      `SERVER_TRUST_ACCOUNT` (8192), plus a follow-on SID comparison. Microsoft's own advisory listed the flaw as
      "Exploitation Less Likely" and not publicly disclosed at patch time; the July 24 write-up (with a full
      June-vs-July decompiled-function diff of `certpdef.dll`) now makes both the exploitation chain and the exact
      patch gate public, which meaningfully drops the weaponization bar for any AD CS deployment that has not yet
      applied the July 2026 cumulative update. No in-the-wild exploitation has been reported for either the pre- or
      post-disclosure window.
    region_nexus: "global; Windows Server AD CS is near-ubiquitous across Swiss/EU federal, cantonal and critical-infrastructure Active Directory estates"
    primary_sector_nexus: "direct"
    sector: "public-sector, energy, water, transport, healthcare, finance, telco"
    cves: ["CVE-2026-54121"]
    techniques: ["T1649", "T1003.006", "T1078.002"]
    affected_products: ["Windows Server (Active Directory Certificate Services role) — Windows Server 2012 through Windows Server 2025; also listed against Windows 10 1607/1809"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Certighost is an Active Directory Certificate Services (AD CS) vulnerability that allowed a low-privileged domain user to impersonate a Domain Controller and achieve domain compromise in the tested AD CS configuration."
        attribution: "H0j3n & aniqfakhrul (research write-up)"
        source_url: "https://gist.githubusercontent.com/H0j3n/a5ef2609b5f2944ac2390a191a534c26/raw"
      - quote: "The CA accepted the requester-supplied chase target without first proving that it was the Domain Controller it claimed to be."
        attribution: "H0j3n & aniqfakhrul (research write-up)"
        source_url: "https://gist.githubusercontent.com/H0j3n/a5ef2609b5f2944ac2390a191a534c26/raw"
      - quote: "An authenticated attacker could manipulate attributes associated with a machine account and obtain a certificate from Active Directory Certificate Services that allows authentication as that machine via PKINIT. If a Domain Controller account can be targeted, the attacker could authenticate as the Domain Controller and gain the ability to perform privileged Active Directory operations."
        attribution: "Microsoft MSRC"
        source_url: "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-54121"
    extended_notes: |
      Detection concept (from the source's own control-flow diagram, not IOC-based): AD CS servers log certificate
      requests; a hunt can look for enrollment requests carrying non-empty `cdc`/`rmd` attributes originating from
      workstation/user accounts rather than legitimate cross-domain replication partners, and for anomalous outbound
      SMB/LDAP connections initiated *by the CA host itself* toward client-segment IP ranges immediately after a
      certificate-request event (the PoC's Wireshark capture shows exactly this CA-initiated LSA/LDAP chase to an
      attacker host). Hardening: apply the July 2026 cumulative update (which ships the validation gate) to every
      Enterprise CA; where AD CS supports "chase"-eligible cross-domain enrollment scenarios, review whether that
      functionality is actually required, and audit `ms-DS-MachineAccountQuota` (default 10) since the PoC relies on
      an attacker being able to self-register a machine account. Benign lookalike / triage note: legitimate
      cross-forest or cross-domain certificate chase traffic will originate the CA→target connection toward an
      address that already appears as a real DC in AD; the discriminator the patch itself enforces (SERVER_TRUST_ACCOUNT
      bit + resolved-SID match) is the same one a detection rule should check.
    borderline: false

  - title: "Check Point Security Management: two more CVEs in the same disclosure bundle as the actively-exploited SmartConsole bypass — Gaia Portal root escalation (CVE-2026-62145) and unauthenticated management RCE (CVE-2026-62144)"
    sources:
      - { url: "https://advisories.ncsc.nl/2026/ncsc-2026-0264.html", publisher: "NCSC-NL (Dutch national CERT)", date: "2026-07-24", role: "primary" }
      - { url: "https://support.checkpoint.com/results/sk/sk185152", publisher: "Check Point PSIRT (sk185152)", date: "2026-07-22", role: "primary" }
      - { url: "https://support.checkpoint.com/results/sk/sk185153", publisher: "Check Point PSIRT (sk185153)", date: "2026-07-22", role: "primary" }
      - { url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0912/", publisher: "CERT-FR / ANSSI (CERTFR-2026-AVI-0912)", date: "2026-07-23", role: "corroborating" }
    discovery_trace: "first seen at: advisories-ncsc-nl, URL https://advisories.ncsc.nl/rss/advisories → advisory detail, URL https://advisories.ncsc.nl/2026/ncsc-2026-0264.html → primary: Check Point PSIRT sk185152, URL https://support.checkpoint.com/results/sk/sk185152 → primary: Check Point PSIRT sk185153, URL https://support.checkpoint.com/results/sk/sk185153 → corroborating: CERT-FR CERTFR-2026-AVI-0912, URL https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0912/"
    summary: |
      NCSC-NL's advisory NCSC-2026-0264 (published 2026-07-24) and CERT-FR's CERTFR-2026-AVI-0912 (2026-07-23) both
      bundle the already-tracked, actively-exploited Check Point SmartConsole authentication bypass (CVE-2026-16232,
      covered previously) together with two sibling CVEs from the same Check Point patch release that this pipeline
      had not yet surfaced individually. CVE-2026-62144 (CVSS 3.1 9.3; Check Point calls it "Management Authentication
      Bypass and Privilege Escalation") lets an unauthenticated network attacker run arbitrary commands on a Security
      Management or Multi-Domain Security Management (MDS) server — including `run-script` and `exec-command` against
      managed Security Gateways — whenever the Management is reachable without firewall protection or with an
      unrestricted Trusted Clients (GUI clients) list. CVE-2026-62145 (CVSS 3.1 7.5, AV:N/AC:H/PR:L) is a Gaia Portal
      local-privilege-escalation flaw: an authenticated attacker holding only read-only Gaia Portal access can run
      commands as root through the portal's OS-authentication interface, affecting Security Gateways and Security
      Management alike (Spark Gateways are not affected). Both flaws span the same version range as the exploited
      CVE-2026-16232 — R77.30 through R81.10/R81.20/R82/R82.10 prior to the fix — and both are closed by the same
      Jumbo Hotfix Accumulator releases (R82.10 Take 36+, R82 Take 118+, R81.20 Take 158+). Check Point has stated
      only CVE-2026-16232 has been observed exploited (against a small number of customers who left the Management
      interface internet-exposed with a permissive Trusted Clients configuration); neither CVE-2026-62144 nor
      CVE-2026-62145 is reported as exploited, but they sit on the exact same attack surface — an internet-reachable
      or loosely-restricted Check Point Management Server — that is already under active attack.
    region_nexus: "global; Check Point Security Management / MDS is a common network-edge and firewall-management platform in Swiss/EU government and critical-infrastructure networks"
