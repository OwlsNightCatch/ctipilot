notes: |
  Several promising leads were investigated and dropped as stale, already-fixed-with-no-action, or already covered:
  - ManageEngine ADAudit Plus unauthenticated RCE (CVE-2026-6516, NCSC-NL NCSC-2026-0263, published 2026-07-24) —
    the underlying ZohoCorp vendor advisory is dated April 17, 2026 (confirmed via page source); NCSC-NL was simply
    cataloguing a 3-month-old, already-patched flaw today. No fresh exploitation or development. Dropped per
    recency discipline (recycled-news trap).
  - Bing Images ImageMagick-delegate SVG command-injection RCE (CVE-2026-32194/32191, XBOW research write-up,
    covered by TheHackerNews 2026-07-24) — both CVEs were fixed server-side by Microsoft in March 2026 with
    "customerActionRequired: false"; XBOW published exploitation mechanics on already-remediated Microsoft-hosted
    infrastructure. No action for any reader to take on this specific CVE; the transferable ImageMagick-delegate
    hardening lesson (disable delegates in policy.xml) is real but the item itself carries no urgency/action for a
    self-hosted deployment beyond generic ImageMagick hardening already known. Dropped as not clearing the
    action-required bar for S1; better suited to S3 research framing if picked up there.
  - CVE-2026-62835 (Azure Portal information disclosure, CVSS 9.3, ENISA EUVD-2026-48737, published 2026-07-24) —
    confirmed via MSRC: "This vulnerability has already been fully mitigated by Microsoft. There is no action for
    users of this service to take." Cloud-CVE transparency disclosure only. Dropped.
  - CISA ICSA-26-204-01 (Johnson Controls C-CURE 9000 / Victor application server, CVSS 9.6, unauthenticated
    adjacent-network RCE against physical-access-control servers) — genuinely severe and OT/critical-infrastructure
    relevant, but CISA's Initial Release Date is 2026-07-23, and the sibling advisories from the same 204-XX batch
    (MZ Automation libIEC61850/lib60870) were already surfaced by an earlier run on 2026-07-24. No fresh delta on
    this specific advisory since; dropped per strict recency discipline rather than surfaced as a late catch.
  - Synacktiv's unpatched, unauthenticated Argo CD repo-server RCE (no CVE assigned, published 2026-07-01, still
    unpatched as of 2026-07-24 per WebSearch corroboration) — severe (full Kubernetes cluster takeover via an
    unauthenticated gRPC GenerateManifest call) but the disclosure is 24 days old with no fresh in-window development
    (no patch, no CVE, no new exploitation confirmed today); does not clear the recency gate for a daily S1 return.
    Flagging here so a weekly (W1) sweep can pick it up as a still-open, high-severity unpatched issue if it remains
    unpatched.
  - CISA KEV catalog: `catalogVersion: 2026.07.24` / `dateReleased: 2026-07-24T17:40:56Z`, but the newest individual
    `dateAdded` entries are still 2026-07-22 (Check Point CVE-2026-16232, Microsoft SharePoint CVE-2026-50522) —
    no new KEV entries actually added in the 26h window.
  - Cisco PSIRT RSS newest item (CVE-2026-20245, SD-WAN authenticated privesc with observed limited exploitation)
