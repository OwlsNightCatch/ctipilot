        attribution: "Check Point PSIRT (sk185152, CVE-2026-62144)"
        source_url: "https://support.checkpoint.com/results/sk/sk185152"
      - quote: "A vulnerability in Gaia Portal allows an authenticated attacker with read-only access to run commands as root."
        attribution: "Check Point PSIRT (sk185153, CVE-2026-62145)"
        source_url: "https://support.checkpoint.com/results/sk/sk185153"
      - quote: "De multiples vulnérabilités ont été découvertes dans les produits Check Point. Elles permettent à un attaquant de provoquer une élévation de privilèges et un contournement de la politique de sécurité."
        attribution: "CERT-FR / ANSSI (CERTFR-2026-AVI-0912)"
        source_url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0912/"
    extended_notes: |
      Detection concept: for CVE-2026-62144, monitor Management-server authentication/session logs for administrative
      API/token issuance events with no preceding interactive admin login, and for `run-script`/`exec-command`
      invocations against Security Gateways sourced from the Management's own automation context rather than a
      known SmartConsole GUI client session. For CVE-2026-62145, monitor Gaia Portal command-execution audit logs
      for root-context command execution associated with a session that authenticated at read-only privilege level —
      any such pairing is definitionally the abuse condition Check Point's advisory describes. Hardening for all
      three CVEs in this bundle: restrict Trusted Clients (GUI client) configuration to specific management IPs,
      place the Management Server behind firewall rules that block internet reach entirely, and apply the Jumbo
      Hotfix Accumulator (R82.10 Take 36+ / R82 Take 118+ / R81.20 Take 158+) — the same update line already
      mandatory for the exploited CVE-2026-16232.
