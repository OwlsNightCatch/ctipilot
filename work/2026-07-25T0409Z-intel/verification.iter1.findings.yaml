- code: F4
  category: hallucinated-fact
  section: trending-vulnerabilities
  item: "CVE-2026-54121 — AD CS 'Certighost' (certighost-cve-2026-54121-ad-cs-dc-impersonation-poc)"
  url_or_quote: "the vulnerable logic sits in the Enterprise CA's enrollment \"chase\" fallback (`certpdef.dll`, the `_LoadPrincipalObject` path in `certsrv.exe`)"
  summary: >
    The specific implementation names `certpdef.dll`, `_LoadPrincipalObject`, and `certsrv.exe` as the vulnerable
    code path appear in NEITHER cited source. MSRC (fetched via bridge) gives only the AD CS EoP description /
    CWE-285 / CVSS 8.8, no binary names. The CybersecurityNews article (fetched in full via jina) confirms the
    chase / cdc / rmd mechanics, the DCSync-krbtgt outcome, the SERVER_TRUST_ACCOUNT 8192 + SID-comparison patch,
    and names the patch function as `_ValidateChaseTargetIsDC` (gated behind Feature_3185813818) — but never
    mentions certpdef.dll, _LoadPrincipalObject, or certsrv.exe. These names likely come from the H0j3n gist that
    was deliberately dropped as a source; attributing them to CybersecurityNews is unsupported. Remediation:
    remove the parenthetical binary/function names, or source them to the researcher gist.
- code: F5
  category: missing-citation
  section: active-threats
  item: "Stiftung Autismuslink / INC Ransom (stiftung-autismuslink-bern-inc-ransom-breach)"
  url_or_quote: "its assessed operational overlap with the Lynx rebrand and FortiGate credential-theft infrastructure mean any organisation with unpatched or credential-exposed FortiGate edge should treat this cluster as a live access vector"
  summary: >
    Low-severity. The INC Ransom<->Lynx-rebrand and INC<->FortiGate/FortiBleed credential-theft-infrastructure
    overlap is asserted as an "assessed" attribution that drives a concrete FortiGate-edge recommendation, but
    carries no inline citation; neither cited source (the victim PDF, ransomware.live) supports it. The claim is
    NOT hallucinated — it is registry-documented (actor:inc-ransom + incident:fortibleed-fortigate-credential-exposure,
    sourced to SOCRadar 2026-07-01 / weekly-w27-fortibleed-inc-lynx-attribution) and correct. Optional strengthening:
    add an inline citation to the SOCRadar FortiBleed attribution (or the weekly-w27 entry), or soften to
    reference prior coverage. Not a truth defect; a reader-verifiability gap on a load-bearing attribution.
