        attribution: "Help Net Security, relaying Flare Research (Assaf Morag)"
        source_url: "https://www.helpnetsecurity.com/2026/07/24/emea-healthcare-ransomware-activity/"
      - quote: "Kazu ... emerged in mid-2025 ... Flare spotted it through an attack on an Italian telemedicine provider, then found a string of new victim postings, all healthcare, all outside the original EMEA dataset, located in Latin America instead."
        attribution: "Help Net Security, relaying Flare Research (Assaf Morag)"
        source_url: "https://www.helpnetsecurity.com/2026/07/24/emea-healthcare-ransomware-activity/"
    extended_notes: |
      Sourcing note: the item is single-source because the underlying Flare blog post could not be located
      after a fair pivot attempt (flare.io's blog-archive listing is JS-driven and returned no drillable
      article URLs to a direct fetch; two targeted WebSearch queries for the specific post came back empty).
      Help Net Security is treated as B-reliability (established, consistent editorial standard, mostly
      re-reports vendor/researcher findings) and the claim itself as credibility 2 (not independently
      confirmed, internally consistent, matches known EMEA ransomware landscape) — Admiralty B2.
      Defender takeaway for a Swiss/European hospital or cantonal health authority: treat every healthcare
      software vendor, diagnostics lab, staffing agency and equipment supplier in your supply chain as a
      credible initial-access vector into your own environment, not just a business-continuity dependency —
      vendor-risk review and third-party access scoping deserve the same priority as perimeter patching.
    borderline: false

