items:
  - title: "Flare: ransomware groups have moved from EMEA hospitals to the full healthcare supply chain — 14 named groups, a new actor (Kazu) spotted via an Italian telemedicine victim"
    sources:
      - { url: "https://www.helpnetsecurity.com/2026/07/24/emea-healthcare-ransomware-activity/", publisher: "Help Net Security (relaying Flare Research, analyst Assaf Morag)", date: "2026-07-24", role: "primary" }
    discovery_trace: >
      first seen at: WebSearch ("europe hospital data breach ransomware \"24 July 2026\" OR \"23 July 2026\"")
      → Help Net Security article, URL https://www.helpnetsecurity.com/2026/07/24/emea-healthcare-ransomware-activity/
      → attempted pivot to Flare's own blog (flare.io/learn/resources/blog) to find the underlying report;
      the archive listing rendered no drillable per-post URLs via direct fetch and the specific EMEA-healthcare
      post could not be located by WebSearch (queries: "flare.io blog EMEA healthcare ransomware supply chain
      Kazu Italian telemedicine"; "flare.io EMEA healthcare ransomware Assaf Morag site:flare.io"), so Help Net
      Security (Admiralty B, established outlet, names the firm/analyst/methodology/quotes) is cited as the
      reachable primary per the source-discipline fallback rule.
    summary: |
      Flare researcher Assaf Morag analysed ransomware leak-site postings against EMEA healthcare organisations
      from 2024-2026 and found the targeting has broadened from hospitals to the entire healthcare supply
      chain: telemedicine providers, diagnostic laboratories, pharmacies, rehabilitation services, healthcare
      software vendors, staffing agencies, medical-equipment suppliers and public health agencies. Fourteen
      distinct ransomware/extortion groups are active against EMEA healthcare targets, including Qilin, LockBit
      3.0, RansomHub, DragonForce, Gunra, NightSpire and 3AM. Some suppliers are hit directly for the
      patient-safety leverage disruption gives; others are used as a stepping stone toward better-defended
      downstream targets (hospitals) that depend on them for records, equipment or connected systems — a
      software vendor or diagnostics lab breach is frequently the initial-access route into a hospital's
      environment, not merely a standalone incident. The research flags a newly observed smaller group, Kazu
      (emerged mid-2025, initially targeting government/public-sector victims before pivoting to healthcare),
      first identified via an attack on an Italian telemedicine provider, with further victim postings
      subsequently found outside the EMEA dataset in Latin America. The piece frames Europe's continuing
      structural exposure — legacy systems, fragmented IT environments, delayed security-regulation
      implementation and workforce shortages that slow patching and recovery — as the reason the healthcare
      supply chain remains a preferred target. No specific CVE or intrusion-vector detail is given in this
      landscape piece; it is a leak-site-derived victimology and actor census, not a technical intrusion
      analysis.
    region_nexus: "EMEA (explicitly includes Europe); named example victim is an Italian telemedicine provider"
    primary_sector_nexus: "direct"
    sector: "healthcare"
    cves: []
    techniques: [T1486]
    affected_products: []
