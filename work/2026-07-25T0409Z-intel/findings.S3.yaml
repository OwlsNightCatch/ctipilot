items:
  - title: "Operation RoundPress escalates: TA458 (GRU-aligned) runs a live half-click zero-day supply across five webmail platforms, including a new unpatched SOGo flaw"
    sources:
      - { url: "https://www.proofpoint.com/us/blog/threat-insight/ta458-roundpress-exploits", publisher: "Proofpoint Threat Research", date: "2026-07-23", role: "primary" }
      - { url: "https://www.welivesecurity.com/en/eset-research/operation-roundpress/", publisher: "ESET Research (Operation RoundPress, original naming)", date: "2025", role: "corroborating" }
      - { url: "https://media.defense.gov/2026/Jul/22/2003965244/-1/-1/1/CSA_RUSSIA_PHISHING_TARGET_ZIMBRA.PDF", publisher: "NSA/CISA/FBI joint Cybersecurity Advisory", date: "2026-07-22", role: "corroborating" }
      - { url: "https://github.com/Alinto/sogo/releases/tag/SOGo-5.12.8", publisher: "Alinto (SOGo vendor release notes)", date: "2026", role: "corroborating" }
    discovery_trace: "first seen at: proofpoint, URL https://www.proofpoint.com/us/blog/threat-insight/ta458-roundpress-exploits (drilled from listing https://www.proofpoint.com/us/blog/threat-insight) -> primary: Proofpoint Threat Research, same URL -> corroboration: ESET's original Operation RoundPress naming, URL https://www.welivesecurity.com/en/eset-research/operation-roundpress/ -> corroboration: NSA/CISA/FBI joint advisory PDF, URL https://media.defense.gov/2026/Jul/22/2003965244/-1/-1/1/CSA_RUSSIA_PHISHING_TARGET_ZIMBRA.PDF"
    summary: |
      Proofpoint documents TA458 (its designation for the actor behind ESET's "Operation RoundPress"), a Russia-aligned, GRU-assessed espionage group that has maintained a running supply of "half-click" webmail zero-days since 2023 -- exploits that fire the instant a victim opens/previews a malicious email, with no click, attachment, or link needed. The current active set spans five webmail platforms: Zimbra (CVE-2025-27915), mDaemon (CVE-2025-3929), Roundcube (n-day CVE-2023-43770 and CVE-2024-42009), Kerio, and -- newly disclosed here -- SOGo, where Proofpoint found and responsibly disclosed a zero-day (CVE-2026-8496) that Alinto patched in version 5.12.8. Each intrusion drops SpyPress, an obfuscated JavaScript payload customised per targeted webmail client, that harvests credentials, contacts and mail. On Roundcube targets since July 2025 TA458 shifted from immediate data theft to durable access: SpyPress abuses Roundcube's file-upload handler to trigger unsafe PHP deserialization (CVE-2025-49113), planting a persistent backdoor rather than just exfiltrating. Targeting concentrates on Ukrainian government and Eastern-European military/government entities (Albania, Greece, Moldova, Türkiye), with occasional hits on chemical, telecom and technology-sector targets. Proofpoint assesses no telemetry overlap between TA458 and TA422 (APT28/Forest Blizzard/Sofacy) -- a distinct GRU-linked cluster -- despite both exploiting webmail XSS chains, and flags attribution to a specific GRU unit as unconfirmed.
    region_nexus: "direct; Eastern-European (Albania, Greece, Moldova, Türkiye) and Ukrainian government targeting; self-hosted Zimbra/Roundcube/SOGo/mDaemon/Kerio webmail is common among EU/CH public-sector bodies and SMEs"
    primary_sector_nexus: "direct"
    sector: "public-sector, government, telco"
    cves: ["CVE-2026-8496", "CVE-2025-27915", "CVE-2025-3929", "CVE-2023-43770", "CVE-2024-42009", "CVE-2025-49113"]
    techniques: [T1566, T1203, T1190, T1539, "T1114.002"]
    affected_products: ["Zimbra Collaboration Suite", "mDaemon Email Server", "Roundcube Webmail", "Kerio Connect", "SOGo"]
    entity_keys: []
    new_entities:
      - { key: "actor:ta458-roundpress", type: actor, name: "TA458", aliases: ["Operation RoundPress"],
          summary: "Proofpoint's designation for the Russia-aligned, GRU-assessed actor behind ESET's Operation RoundPress -- a running supply of half-click webmail-client zero-days (Zimbra, mDaemon, Roundcube, Kerio, SOGo) deploying the SpyPress stealer/backdoor against Ukrainian and Eastern-European government/military targets (Proofpoint, 2026-07-23)." }
      - { key: "malware:spypress", type: malware, name: "SpyPress", aliases: [],
          summary: "Obfuscated JavaScript payload, customised per targeted webmail client, deployed by TA458/RoundPress to steal credentials/contacts/mail and, on Roundcube, to trigger a PHP-deserialization backdoor via CVE-2025-49113 (Proofpoint, 2026-07-23)." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "A 'half-click exploit' requires no social engineering, nor does it require a user to click a link or open an attachment. The targeted user must only open the malicious email in their webmail viewer to be compromised."
        attribution: "Proofpoint Threat Research"
        source_url: "https://www.proofpoint.com/us/blog/threat-insight/ta458-roundpress-exploits"
      - quote: "SOGo webmail platform, which we reported to the vendor, Alinto; it was patched as CVE-2026-8496 in version 5.12.8"
        attribution: "Proofpoint Threat Research"
        source_url: "https://www.proofpoint.com/us/blog/threat-insight/ta458-roundpress-exploits"
      - quote: "SpyPress uses a second Roundcube exploit (CVE-2025-49113) that abuses Roundcube's file upload handler to trigger unsafe PHP deserialization."
        attribution: "Proofpoint Threat Research"
        source_url: "https://www.proofpoint.com/us/blog/threat-insight/ta458-roundpress-exploits"
      - quote: "Proofpoint assesses that TA458 is likely a Russian military intelligence operation directed by the Russian GRU. At the time of writing, there is no indication of targeting overlap in Proofpoint telemetry between TA458 and TA422."
        attribution: "Proofpoint Threat Research"
        source_url: "https://www.proofpoint.com/us/blog/threat-insight/ta458-roundpress-exploits"
    extended_notes: |
      Detection concept (telemetry-class first): webmail-server application logs / mod_security-style WAF logs for HTTP requests to the mail client's message-render endpoint carrying HTML with split/obfuscated @import or similar CSS-directive fragments -- the same sanitizer-bypass class documented for the sibling TA488/ZimReaper item below; browser-side, an SVG element with an onload handler decoding+eval'ing a Base64 payload inside a rendered email body is the durable signal, not any single domain/IP. For Roundcube specifically, hunt file-upload-handler POSTs immediately followed by anomalous PHP session/object deserialization errors in webmail server logs. Hardening: disable/monitor unauthenticated HTML rendering features in self-hosted webmail (image/script sanitizer strictness), patch SOGo to 5.12.8+, and treat any self-hosted Zimbra/Roundcube/SOGo/mDaemon/Kerio instance reachable from the internet as a standing exposure requiring compensating WAF rules pending patch cycles.
    borderline: false

  - title: "TA488/LAUNDRY BEAR's Zimbra zero-click chain, unpacked: ZimReaper's CSS-@import sanitizer bypass, DNS-tunnelled exfil, and a persistence trick that survives password resets"
    sources:
      - { url: "https://www.proofpoint.com/us/blog/threat-insight/ta488-targets-zimbra-mailservers-half-click-exploits", publisher: "Proofpoint Threat Research", date: "2026-07-23", role: "primary" }
      - { url: "https://media.defense.gov/2026/Jul/22/2003965244/-1/-1/1/CSA_RUSSIA_PHISHING_TARGET_ZIMBRA.PDF", publisher: "NSA/CISA/FBI joint Cybersecurity Advisory (AA26-204A source PDF)", date: "2026-07-22", role: "corroborating" }
      - { url: "https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-204a", publisher: "CISA", date: "2026-07-24", role: "corroborating" }
    discovery_trace: "first seen at: proofpoint, URL https://www.proofpoint.com/us/blog/threat-insight/ta488-targets-zimbra-mailservers-half-click-exploits (drilled from listing https://www.proofpoint.com/us/blog/threat-insight) -> primary: Proofpoint Threat Research, same URL -> corroboration: NSA/CISA/FBI joint advisory PDF, URL https://media.defense.gov/2026/Jul/22/2003965244/-1/-1/1/CSA_RUSSIA_PHISHING_TARGET_ZIMBRA.PDF"
    summary: |
      This is a technical-mechanics delta on the LAUNDRY BEAR/Void Blizzard Zimbra campaign this pipeline already covered as a 16-nation joint advisory (entry 2026-07-24/laundry-bear-zimbra-zero-click-cve-2025-66376). Proofpoint's own writeup -- part 1 of a 2-part series alongside the TA458/RoundPress item above -- adds mechanics the joint advisory did not spell out. The CVE-2025-66376 exploit works by splitting a fake CSS @import directive across multiple HTML tags: Zimbra's sanitizer strips or alters each @import fragment individually, but the surviving characters rejoin into a valid `<svg onload=eval(atob(...))>` construct that the browser then executes -- a sanitizer-bypass-by-reassembly technique. The payload, which Proofpoint names ZimReaper, steals CSRF tokens, browser-autofill credentials and 2FA codes, and exfiltrates stolen mail via DNS tunneling. For persistence, TA488 creates a Zimbra application-specific password labelled "ZimbraWeb" through the Zimbra REST/SOAP API -- a credential that survives both a user password reset and the CVE-2025-66376 patch. Campaigns ran for at least five months in 2025 against Ukrainian government and US defense, nuclear and science-sector targets. Proofpoint notes it has not observed TA458 (the sibling actor above) using this specific CVE despite TA458's own regular access to webmail XSS zero-days, and assesses TA488 was likely handed the exploit by "upstream Russian intelligence taskmasters" -- and that TA488 has shown no activity since February 2026, following a prior Seqrite disclosure and TA488's own infrastructure teardown.
    region_nexus: "direct; joint advisory covers 16 NATO/EU-member nations; Zimbra is common self-hosted webmail for CH/EU public-sector bodies and SMEs"
    primary_sector_nexus: "direct"
    sector: "public-sector, government, energy"
    cves: ["CVE-2025-66376"]
    techniques: [T1566, T1203, T1539, T1098, "T1071.004", "T1114.002"]
    affected_products: ["Zimbra Collaboration Suite"]
    entity_keys: ["actor:laundry-bear"]
    new_entities:
      - { key: "malware:zimreaper", type: malware, name: "ZimReaper", aliases: [],
          summary: "TA488/LAUNDRY BEAR's JavaScript payload for the CVE-2025-66376 Zimbra zero-click chain: steals CSRF tokens, autofill credentials and 2FA codes, exfiltrates mail via DNS tunneling, and creates a persistent 'ZimbraWeb'-labelled application-specific password (Proofpoint, 2026-07-23)." }
    relation_suggestions:
      - { subject: "actor:laundry-bear", object: "malware:zimreaper",
          basis: "Proofpoint: TA488 (LAUNDRY BEAR)'s ZimReaper payload steals CSRF tokens, credentials, 2FA codes and exfiltrates emails via DNS tunneling in the CVE-2025-66376 Zimbra campaign (Proofpoint, 2026-07-23)." }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-of:2026-07-24/laundry-bear-zimbra-zero-click-cve-2025-66376"
    evidence:
      - quote: "The sanitizer/rewriter strips or alters @import sequences, and the remaining characters are joined together into a valid construct: <svg onload=eval(atob(...))>."
        attribution: "Proofpoint Threat Research"
        source_url: "https://www.proofpoint.com/us/blog/threat-insight/ta488-targets-zimbra-mailservers-half-click-exploits"
      - quote: "Proofpoint has not observed TA458 using CVE-2025-66376, despite the group's regular access to webmail XSS zero-days...it is possible TA488 was given this exploit for its operations from upstream Russian intelligence taskmasters."
        attribution: "Proofpoint Threat Research"
        source_url: "https://www.proofpoint.com/us/blog/threat-insight/ta488-targets-zimbra-mailservers-half-click-exploits"
      - quote: "Proofpoint has not observed any activity from TA488 since February 2026, following Seqrite's blog and TA488's takedown of its infrastructure."
        attribution: "Proofpoint Threat Research"
        source_url: "https://www.proofpoint.com/us/blog/threat-insight/ta488-targets-zimbra-mailservers-half-click-exploits"
    extended_notes: |
      Detection concept: hunt for Zimbra REST/SOAP API calls that create a new application-specific password shortly after an anomalous webmail-session-render event on the same account -- app-password creation immediately following an unexplained mailbox-view is the discriminating sequence versus benign app-password provisioning (which is user-initiated via the account settings UI, not API-driven right after a message open). DNS query volume/entropy anomalies from the mail-server host (DNS tunneling exfil) are a second independent hook. Hardening: this specific persistence mechanism means a password reset alone is NOT sufficient remediation -- responders must also audit and revoke Zimbra application-specific passwords tied to affected accounts, not just rotate the primary credential.
    borderline: false

  - title: "Google Threat Intelligence Group retires UNC/APT-style ad hoc actor names for a unified cryptonym naming taxonomy"
    sources:
      - { url: "https://cloud.google.com/blog/topics/threat-intelligence/updated-cyber-threat-actor-naming-system/", publisher: "Google Threat Intelligence Group (GTIG)", date: "2026-07-24", role: "primary" }
    discovery_trace: "first seen at: mandiant-gtig, URL https://feeds.feedburner.com/threatintelligence/pvexyqv7v0v (RSS) -> primary: Google Threat Intelligence Group, URL https://cloud.google.com/blog/topics/threat-intelligence/updated-cyber-threat-actor-naming-system/ (no pivot needed)"
    summary: |
      GTIG (the fused Mandiant + Google Threat Analysis Group tracking function) announced a unified, rolling-basis retirement of its legacy naming systems (Mandiant's APT#/UNC#/TEMP# and TAG's separate scheme) in favour of a single cryptonym taxonomy: memorable two-word combinations where the first word is either a term already used in prior public reporting or a randomly-generated, bias-vetted term, and the second word encodes a category (e.g. CASTLE for China-nexus, ION for Iran-nexus, NEPTUNE for North Korea-nexus, RELIC for Russia-nexus, COMET for cybercrime). GTIG states legacy names remain indexed, searchable, and cross-referenced with MITRE ATT&CK mappings inside the Google Threat Intelligence platform, and that UNC ("uncategorized") designations continue for clusters still under early investigation. This is an operational-methodology change with a direct CTI-practitioner implication: any GTIG report published from now on may surface a new cryptonym for an actor a reader already tracks under an old UNC/APT number, and cross-report correlation now depends on checking the alias mapping rather than assuming name stability.
    region_nexus: "global; affects how every GTIG report on Swiss/EU-relevant actors will be named going forward"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: []
    techniques: []
    affected_products: []
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Our new schema utilizes a cryptonym-based approach, employing memorable two-word combinations for each distinct threat actor"
        attribution: "Google Threat Intelligence Group"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/updated-cyber-threat-actor-naming-system/"
      - quote: "We will continue to use UNC, or 'uncategorized' designations for threat clusters that are still in the early stages of investigation"
        attribution: "Google Threat Intelligence Group"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/updated-cyber-threat-actor-naming-system/"
    extended_notes: |
      No attacker technique to map -- this is a taxonomy/methodology announcement, not tradecraft. Flagged here primarily because it changes how future GTIG reporting cross-references against entity trackers (including this pipeline's own registry); worth a short awareness note rather than a full technical entry. Main agent should judge fit against S3's technique/tradecraft bar.
    borderline: true
    borderline_reason: "first-party methodology/taxonomy announcement, not attack technique or tradecraft research; included for CTI-practitioner operational relevance (actor-name cross-referencing) rather than detection/hunt value."

  - title: "ANNUAL REPORT — Microsoft Email Threat Landscape Q2 2026: Tycoon2FA takedown cuts AiTM volume 74%, but Teams-based vishing surges 10x"
    sources:
      - { url: "https://www.microsoft.com/en-us/security/blog/2026/07/23/email-threat-landscape-q2-2026-trends-and-insights/", publisher: "Microsoft Threat Intelligence", date: "2026-07-23", role: "primary" }
    discovery_trace: "first seen at: msft-ti, URL https://www.microsoft.com/en-us/security/blog/topic/threat-intelligence/ -> primary: Microsoft Threat Intelligence, URL https://www.microsoft.com/en-us/security/blog/2026/07/23/email-threat-landscape-q2-2026-trends-and-insights/ (no pivot needed)"
    summary: |
      Microsoft's quarterly email-threat report, drawn from analysis of 7.6 billion phishing threats across Q2 2026, quantifies the operational effect of its own March 2026 Tycoon2FA AiTM-phishing-kit disruption: Tycoon2FA-linked volume fell 15% in March, 22% in April, then 74% in May to 1.5 million messages and a further 20% in June to 1.2 million -- the lowest monthly volume observed in at least a year -- with no replacement PhaaS service emerging at comparable scale. QR-code phishing fell 92% post-disruption as delivery shifted from PDF (79% share in April) to DOC/DOCX (40% by June); CAPTCHA-gated phishing landing pages fell 81% from March peaks. Credential theft remained the dominant payload objective (94-96% of observed attacks). The report's most operationally distinct finding is a sustained shift beyond email into trusted workplace platforms: Microsoft Teams-based voice-phishing (vishing) attempts reached roughly 10x their mid-2025 weekly baseline by quarter-end, exploiting the trust users place in an internal collaboration tool. Illustrative campaigns include an automated BEC operation reaching 67,000 users across 42,000 organizations via Python-scripted Amazon SES delivery, and a multi-stage campaign nesting EML files with OAuth-redirect chains to deliver a BAT-file dropper.
    region_nexus: "global; email/Teams-vishing volumes affect any M365 tenant, including Swiss/EU public-sector and enterprise tenants"
    primary_sector_nexus: "indirect"
    sector: "public-sector, finance, telco"
    cves: []
    techniques: [T1566, "T1566.004", T1621]
    affected_products: ["Microsoft Teams", "Microsoft Defender for Office 365", "Microsoft 365"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "After falling 15% in March and another 22% in April, Tycoon2FA-linked phishing volume dropped 74% in May to just 1.5 million messages, then fell another 20% in June to 1.2 million, by far the lowest monthly volumes observed in at least a year."
        attribution: "Microsoft Threat Intelligence"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/07/23/email-threat-landscape-q2-2026-trends-and-insights/"
      - quote: "Microsoft Threat Intelligence observed continued growth in Teams-based social engineering, particularly voice phishing (vishing), with weekly malicious call attempts reaching nearly ten times the mid-2025 baseline by the end of the quarter."
        attribution: "Microsoft Threat Intelligence"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/07/23/email-threat-landscape-q2-2026-trends-and-insights/"
      - quote: "Enable Zero-hour auto purge (ZAP) in Defender for Office 365 to quarantine sent mail in response to newly acquired threat intelligence and retroactively neutralize malicious phishing, spam, or malware messages that have already been delivered to mailboxes."
        attribution: "Microsoft Threat Intelligence"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/07/23/email-threat-landscape-q2-2026-trends-and-insights/"
    extended_notes: |
      Detection concept: the durable signal is delivery-mechanism drift, not any single indicator -- track the ratio of PDF- vs DOC/DOCX-attachment phishing month over month (a swing toward DOC/DOCX after a PDF-heavy baseline is itself a detection-evasion tell), and instrument Teams call-log / calling-activity telemetry for spikes in inbound calls from external or newly-provisioned tenants targeting the same user cohort in a short window (vishing at volume leaves a call-frequency anomaly even though the call content itself is unlogged). Hardening: ZAP plus phish-resistant MFA (FIDO2/Windows Hello) directly close the credential-theft payload objective that 94-96% of these campaigns still rely on.
    borderline: false

