  - title: "Autonomous AI agent in unattended 'YOLO mode' automated post-exploitation against Thailand's Finance Ministry — Hades Go implant staged via exposed operator infrastructure"
    sources:
      - { url: "https://hunt.io/blog/thailand-ministry-finance-targeted-with-hermes-ai-agent", publisher: "Hunt.io / Bob Diachenko", date: "2026-07-23", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/hermes-ai-agent-used-to-automate-attack-on-thai-finance-ministry/", publisher: "BleepingComputer", date: "2026-07-24", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/news/security/ (listing) → drill: https://www.bleepingcomputer.com/news/security/hermes-ai-agent-used-to-automate-attack-on-thai-finance-ministry/ → primary: Hunt.io research post, URL https://hunt.io/blog/thailand-ministry-finance-targeted-with-hermes-ai-agent"
    summary: |
      Hunt.io (with researcher Bob Diachenko) discovered three simultaneous open (unauthenticated) directories on
      a Hong Kong-hosted server (AS132883/TOPIDC) holding 585 files (~470 MB) of exploit code, webshells, stolen
      credentials, and operator logs from an intrusion against Thailand's Ministry of Finance, published
      2026-07-23. The operator ran Hermes — an open-source autonomous AI agent released Feb 2026 by Nous Research
      (github.com/nousresearch/hermes-agent) that persists as a service with memory across task sessions — in its
      "YOLO mode," which strips the approval prompts normally required before executing dangerous commands.
      Recovered Hermes logs show the agent autonomously enumerating ministry hosts, traversing the file system,
      running a custom LinPEAS privilege-escalation script that specifically probed three 2026 Linux kernel
      LPE CVEs (DirtyClone CVE-2026-43503, CopyFail CVE-2026-31431, Dirty Frag CVE-2026-43284/43500) alongside
      older sudo/polkit flaws (CVE-2021-3156, CVE-2021-4034), and capturing SUID/SGID and running-service
      enumeration from an adjacent host — all without a human approving each step. Custom Python/Java tooling
      exploited default-authentication misconfigurations in Apache HiveServer2 (SASL PLAIN on port 10000) and
      the Apache Ambari REST API to run arbitrary commands against Hadoop/HDFS DataNodes, and a GlassFish admin
      console was used to deploy JSP webshells via WAR-file upload. A previously unreported Go-based implant,
      "Hades," was recovered providing cross-platform (Windows/Linux) persistence — Registry Run key and
      scheduled-task persistence on Windows, cron on Linux — with HTTPS beaconing disguised as static JS asset
      requests (/assets/app.min.js, /assets/vendor.js, /assets/main.js) and AES-256-GCM-encrypted payloads inside
      HTTP response bodies. Thailand's national CERT (ThaiCERT) and NCSA were notified 2026-07-15 and acknowledged
      receipt the same day; the Ministry of Finance has not publicly confirmed compromise, and the initial access
      vector into the ministry network remains undetermined. The exposed operator infrastructure also carried a
      FOFA (Chinese internet-asset reconnaissance platform) API key and a Hermes web-UI password using the
      Chinese term "Leishen" ("Thunder God"), which Hunt.io cites as a possible nationality/language signal without
      formal attribution.
    region_nexus: "global — Thailand victim, but the tradecraft (unattended AI-agent post-exploitation against a national Finance Ministry) is directly transferable to any government/finance-ministry network, including Swiss federal and European public-sector estates"
    primary_sector_nexus: "indirect but structurally identical: national government finance ministry — same organizational class as the profiled constituency's federal/cantonal government and finance sector"
    sector: "public-sector, finance"
    cves: ["CVE-2026-43503", "CVE-2026-31431", "CVE-2026-43284", "CVE-2021-3156", "CVE-2021-4034", "CVE-2017-7269"]
    techniques: [T1190, T1068, T1505.003, T1071.001, T1547.001, T1053.005]
