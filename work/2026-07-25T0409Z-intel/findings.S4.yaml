      - { key: "tool:hades-implant", type: tool, name: "Hades", aliases: [],
          summary: "Previously unreported Go-based cross-platform (Windows/Linux) implant providing persistent access with HTTPS C2 disguised as static JS asset requests and AES-256-GCM-encrypted payloads; recovered alongside Hermes AI-agent logs from exposed operator infrastructure targeting Thailand's Ministry of Finance (Hunt.io, 2026-07-23)." }
      - { key: "incident:thailand-finance-ministry-hermes-ai-agent-2026", type: incident, name: "Thailand Ministry of Finance — Hermes AI-agent-automated intrusion (2026-07)",
          summary: "Unattended AI-agent (Hermes, 'YOLO mode') post-exploitation activity and a Go-based 'Hades' implant discovered via exposed operator infrastructure targeting Thailand's Ministry of Finance; ThaiCERT/NCSA notified 2026-07-15, Ministry has not confirmed compromise (Hunt.io, 2026-07-23)." }
    relation_suggestions:
