        attribution: "Stiftung Autismuslink (victim statement)"
        source_url: "https://autismuslink.ch/wp-content/uploads/2026_07_Informationsschreiben_zum_Serverausfall_Extern.pdf"
      - quote: "Am Montagmorgen, 29.06.2026, nach Erkennen einer Unregelmässigkeit auf dem System wurde dieses umgehend von Internet getrennt und unser externer IT-Dienstleister aufgeboten."
        attribution: "Stiftung Autismuslink (victim statement)"
