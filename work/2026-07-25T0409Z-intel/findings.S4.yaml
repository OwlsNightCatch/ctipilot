    extended_notes: |
      Timeline note: intrusion detected 2026-06-29; the victim notice (filename dated "2026_07") appears to have
      been published to the foundation's own site around the same window as the INC Ransom leak-site post
      (discovered by ransomware.live 2026-07-24T01:25:48Z) — the disclosure event itself (site notice + leak
      claim converging) is what falls in-window, not the underlying June intrusion date. Data categories
      affected (IV disability-insurance agreements, cantonal BKD contracts, minors'/young-adults' case dossiers)
      make this directly relevant to Swiss cantonal/communal social-services and education-sector defenders
      running comparable case-management archives. INC Ransom's sector focus (per prior pipeline tracking:
      healthcare, manufacturing, government, education) and its assessed operational overlap with Lynx and
      FortiBleed/FortiGate credential-theft infrastructure (SOCRadar, 2026-07-01, already in the registry) means
      any Swiss/EU org with an unpatched or credential-compromised FortiGate exposure should treat this as a
      live threat vector, not just a historical leak-site entry.
