  - title: "Swiss autism-support foundation confirms cyberattack — INC Ransom claims data theft from Stiftung Autismuslink"
    sources:
      - { url: "https://autismuslink.ch/wp-content/uploads/2026_07_Informationsschreiben_zum_Serverausfall_Extern.pdf", publisher: "Stiftung Autismuslink (victim statement)", date: "2026-07", role: "primary" }
      - { url: "https://autismuslink.ch/", publisher: "Stiftung Autismuslink", date: "2026-07-25", role: "primary" }
      - { url: "https://www.ransomware.live/id/YXV0aXNtdXNsaW5rLmNoQGluY3JhbnNvbQ==", publisher: "Ransomware.live (INC Ransom leak-site listing)", date: "2026-07-24", role: "corroborating" }
    discovery_trace: "first seen at: ransomware-live, URL https://api.ransomware.live/v2/recentvictims (INC Ransom claim against autismuslink.ch, discovered 2026-07-24T01:25:48Z, CH/Healthcare) → pivot: WebSearch (\"autismuslink.ch ransomware Incransom\") → primary: victim's own homepage notice, URL https://autismuslink.ch/ (banner 'Vorfall bei unserer IT-Infrastruktur' linking to the PDF) → primary: victim statement PDF, URL https://autismuslink.ch/wp-content/uploads/2026_07_Informationsschreiben_zum_Serverausfall_Extern.pdf"
    summary: |
      Stiftung Autismuslink, a Bern-based Swiss foundation providing school, coaching and vocational-integration
      services to adolescents and young adults with autism spectrum disorder, published a signed victim notice
      confirming a cyberattack detected Monday 2026-06-29: an "irregularity" on the system triggered immediate
      network isolation and engagement of an external IT provider; Infoguard was retained the same day for
      forensic investigation; federal authorities (NCSC) were notified and a criminal complaint filed with police.
      The foundation states backup systems were verified unaffected by the attack. Per the victim's own account,
      "larger volumes of data" were exfiltrated by the attackers and the server was temporarily encrypted before
      being taken offline. Data categories confirmed affected: employee work/interim references, conversation
      protocols, doctor's certificates, teacher contracts, service agreements with the Swiss disability insurance
      (IV) and a cantonal education/culture directorate (BKD), school SAV reports, and the complete client dossier
      archive 2016–2023 (reports, decisions, goal agreements). The INC Ransom (Incransom) ransomware-as-a-service
      group posted a leak-site claim against autismuslink.ch on 2026-07-24, consistent in victim identity and
      timeline with the foundation's own notice — a rare case of same-day victim self-disclosure plus leak-site
      claim corroboration. Initial access vector and specific ransomware payload are not disclosed by the victim
      statement; INC Ransom (assessed by other researchers as operationally linked to the Lynx rebrand and to
      FortiBleed/FortiGate credential-theft infrastructure) is a double-extortion RaaS active since 2023 with a
      documented healthcare/education/government sector focus.
    region_nexus: "Switzerland (Bern) — direct home-region nexus"
    primary_sector_nexus: "direct (public-sector-adjacent: cantonal education/culture directorate contracts, disability-insurance (IV) service agreements) and healthcare-adjacent (therapeutic/social-care services)"
    sector: "public-sector, healthcare"
