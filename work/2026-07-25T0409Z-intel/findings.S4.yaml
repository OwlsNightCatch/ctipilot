      - { subject: "incident:thailand-finance-ministry-hermes-ai-agent-2026", object: "tool:hades-implant",
          basis: "Hunt.io: a previously unreported Go-based implant 'Hades' was recovered from the same exposed directories, providing cross-platform persistent access" }
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Hunt.io Attack Capture™ identified three simultaneous open directories on 43.246.208[.]207, hosted on AS132883 (TOPIDC) in Hong Kong. The directories contained exploit code for multiple CVEs, webshells, suo5 HTTP tunnels, custom scripts with hardcoded stolen credentials targeting mail infrastructure and Apache Hadoop."
        attribution: "Hunt.io"
        source_url: "https://hunt.io/blog/thailand-ministry-finance-targeted-with-hermes-ai-agent"
      - quote: "Hermes logs found within the three directories capture the agent enumerating ministry hosts, traversing files, and capturing LinPEAS output from an adjacent host."
        attribution: "Hunt.io"
        source_url: "https://hunt.io/blog/thailand-ministry-finance-targeted-with-hermes-ai-agent"
      - quote: "The software includes a setting known as YOLO mode, which removes prompts that would require a person to approve dangerous commands."
        attribution: "BleepingComputer, citing Hunt.io"
        source_url: "https://www.bleepingcomputer.com/news/security/hermes-ai-agent-used-to-automate-attack-on-thai-finance-ministry/"
      - quote: "However, the Ministry of Finance has not confirmed that its systems were breached, and some of the recovered artifacts only show that particular systems were targeted rather than successfully compromised."
        attribution: "BleepingComputer, citing Hunt.io"
        source_url: "https://www.bleepingcomputer.com/news/security/hermes-ai-agent-used-to-automate-attack-on-thai-finance-ministry/"
    extended_notes: |
      Confidence set to MEDIUM rather than HIGH because the Ministry of Finance itself has not confirmed
      compromise — Hunt.io's own language is that recovered artifacts are "indicators of compromise" (active
      session cookies, deployed webshells, internal network access) rather than a confirmed breach; ThaiCERT/NCSA
      acknowledged notification but did not publish a confirming advisory as of the primary's 2026-07-23
      publication. This is the second AI-agent-driven autonomous-attack disclosure this pipeline has tracked in
      roughly a week (cf. JADEPUFFER/ENCFORGE, actor:jadepuffer, already registered) — together they mark a
      shift from AI-assisted to AI-unattended post-exploitation, where an open-source agent framework with a
      documented "remove human approval" mode is the automation layer rather than bespoke attacker code. Detection
      concept (no IOCs): unattended service-account processes generating unusually broad and sequential
      enumeration (kernel version checks, SUID/SGID sweeps, service listing, recursive document harvesting of
      PDF/DOC/XLS files dated from a specific year onward) within a short time window from a single host is a
      behavioral signature of agent-driven reconnaissance regardless of the specific tool; benign lookalike is a
      legitimate vulnerability-scanning or patch-compliance sweep, distinguished by scope (targeted ministry
      subnets vs. enterprise-wide inventory) and by the absence of a corresponding change-management ticket.
      Hardening lever: disable default/blank SASL PLAIN authentication on HiveServer2, restrict Ambari REST API
      to management-plane networks only, and remove public reachability of GlassFish admin consoles — all three
      were abused here via default-configuration weaknesses, not zero-days.
    borderline: true
    borderline_reason: "Victim is a non-European government body (Thailand) and compromise is unconfirmed by the Ministry itself; included under nexus criterion (b) — the AI-agent 'YOLO mode' unattended post-exploitation tradecraft against a national finance ministry is a materially new and directly transferable TTP for any government/finance-sector defender, including the profiled Swiss/EU constituency."

