  section: softwareok-q-dir-desktopok-tampered-installers-python-rat (title, headline, actions[0], Defender takeaway)
  item: "Q-Dir / DesktopOK tampered installers"
  url_or_quote: "\"SoftwareOK Q-Dir and DesktopOK installers carried a Python RAT; check hashes, reinstalling does not remove it\"; action: \"because ASEC says reinstalling does not remove the remote-access tool\"; takeaway: \"uninstalling and reinstalling the utility does not remove the remote-access tool\""
