  - claim_id: 3682a489ad
    entry: 2026-11-26/juniper-session-smart-cve-2026-103406-unauth-root-rce
    surface: "summary"
    kind: frontmatter
    text: "CISA added CVE-2026-103406 to its Known Exploited Vulnerabilities catalogue on 2026-11-25, after BSI revised its advisory to say the flaw is being exploited. ENISA's record, which carries Juniper's own description, calls it an OS command injection in the AutomatedProvisioner of Session Smart Conductor that lets a remote attacker run commands as root through a crafted salt minion ID (CVSS 3.1 9.8, no privileges or user interaction), with the affected ranges ending at 7.0.5, 7.1.7 and 7.2.3. Juniper's bulletin JSA112183 was updated on 2026-11-24 to say at least one malicious exploitation was reported to its security response team, as SecurityWeek quotes it (the bulletin page itself could not be read); no source names an actor, victim or scale."
  - claim_id: 41cd5e3ad8
    entry: 2026-11-26/juniper-session-smart-cve-2026-103406-unauth-root-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every Juniper Session Smart Conductor, and every Session Smart Router that CISA's record and NCSC.ch also list, to 7.0.5, 7.1.7 or 7.2.3 (by branch) and, until then, keep its management and provisioning interfaces off untrusted network segments, because Juniper has had at least one malicious exploitation reported to it."
