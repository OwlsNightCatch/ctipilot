claims:
  - claim_id: b8864cabad
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "body"
    kind: cited
    text: "Improper handling of shared page fragments during skb coalescing lets an unprivileged local user modify read-only file contents in the kernel page cache and gain root ("
    urls: ["https://www.wiz.io/blog/fragnesia-linux-kernel-local-privilege-escalation-via-esp-in-tcp"]
  - claim_id: 4edbe191a7
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "body"
    kind: cited
    text: "The public exploit uses user and network namespaces to obtain CAP_NET_ADMIN inside an isolated namespace, installs a crafted ESP security association over NETLINK_XFRM and overwrites the start of `/usr/bin/su` in the page cache only, so the on-disk binary never changes ("
    urls: ["https://www.wiz.io/blog/fragnesia-linux-kernel-local-privilege-escalation-via-esp-in-tcp"]
  - claim_id: 25c6b38d25
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "body"
    kind: cited
    text: "Dirty Frag discoverer Hyunwoo Kim says the flaw was accidentally activated by the patch for CVE-2026-43284 ("
    urls: ["https://www.helpnetsecurity.com/2026/05/14/fragnesia-cve-2026-46300-linux-lpe-vulnerability/"]
  - claim_id: f5ba0f40b2
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "body"
    kind: cited
    text: "William Bowling of Zellic.io found it with the company's AI-agentic auditing tool, and a technical explainer and proof-of-concept exploit are public ("
    urls: ["https://www.helpnetsecurity.com/2026/05/14/fragnesia-cve-2026-46300-linux-lpe-vulnerability/"]
  - claim_id: b44fc786af
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "body"
    kind: cited
    text: "The flaw is exploitable by unprivileged local attackers ("
    urls: ["https://www.wiz.io/blog/fragnesia-linux-kernel-local-privilege-escalation-via-esp-in-tcp"]
  - claim_id: 420a517fc9
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "body"
    kind: cited
    text: "), and CISA's catalog entry says it can be chained with the PHP2Shell flaws to implant PHP webshells and run commands as root ("
    urls: ["https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: e6722822e7
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "body"
    kind: cited
    text: "Risk is highest on shared Linux hosts, container clusters where the page cache is shared across the host, CI runners and build farms, and cloud services running user code ("
    urls: ["https://www.helpnetsecurity.com/2026/05/14/fragnesia-cve-2026-46300-linux-lpe-vulnerability/"]
  - claim_id: 3291117f9d
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "body"
    kind: cited
    text: "Ubuntu's default AppArmor restriction on unprivileged user namespaces is a partial mitigation that forces an extra bypass ("
    urls: ["https://www.wiz.io/blog/fragnesia-linux-kernel-local-privilege-escalation-via-esp-in-tcp"]
  - claim_id: 3128e8e707
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "body"
    kind: cited
    text: "**Exposure:** any multi-user Linux host, container node or CI runner whose kernel lacks the distribution's fix for CVE-2026-46300 ("
    urls: ["https://www.helpnetsecurity.com/2026/05/14/fragnesia-cve-2026-46300-linux-lpe-vulnerability/"]
  - claim_id: 874ea4ba5b
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "body"
    kind: cited
    text: "In the exploited chain the host is a PAN-OS management interface exposed to the internet, and Unit 42 says customers who have applied the available PAN-OS fixes are not affected ("
    urls: ["https://unit42.paloaltonetworks.com/cve-2026-109618-cve-2026-109619/"]
  - claim_id: b5eb44e91f
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "body"
    kind: cited
    text: "Until the kernel update is deployed, Wiz and Help Net Security advise blocking and unloading the `esp4`, `esp6` and `rxrpc` modules where they are not required ("
    urls: ["https://www.wiz.io/blog/fragnesia-linux-kernel-local-privilege-escalation-via-esp-in-tcp"]
  - claim_id: 271c6ad612
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "body"
    kind: cited
    text: "Where IPsec must stay up, Red Hat's alternative is disabling unprivileged user namespaces, which can affect rootless containers, sandboxed browsers and Flatpak ("
    urls: ["https://access.redhat.com/security/vulnerabilities/RHSB-2026-003"]
  - claim_id: 17b88308c3
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "body"
    kind: cited
    text: "**Detection:** process and syscall telemetry on Linux hosts (for example auditd or an EDR's Linux sensor): an unprivileged process that creates user and network namespaces and installs an ESP security association over NETLINK_XFRM, followed by `su` starting a root shell with no authentication step, because the exploit's overwritten `su` calls `setresuid(0,0,0)` and executes `/bin/sh` ("
    urls: ["https://www.wiz.io/blog/fragnesia-linux-kernel-local-privilege-escalation-via-esp-in-tcp"]
  - claim_id: c62c234d11
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "body"
    kind: cited
    text: "The primitive can rewrite any file the user can read, so a check limited to `su` misses variants ("
    urls: ["https://www.helpnetsecurity.com/2026/05/14/fragnesia-cve-2026-46300-linux-lpe-vulnerability/"]
  - claim_id: 0bcaf082d9
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "body"
    kind: cited
    text: "); Dream's chain overwrote /etc/pam.d/su instead of the binary ("
    urls: ["https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers"]
  - claim_id: e353a35986
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "body"
    kind: cited
    text: "**Triage:** unprivileged user namespaces are routine for rootless containers, sandboxed browsers and Flatpak, and IPsec is commonly used for VPNs and site-to-site tunnels ("
    urls: ["https://access.redhat.com/security/vulnerabilities/RHSB-2026-003"]
  - claim_id: 2485fdbd2f
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "body"
    kind: cited
    text: "), so either alone is weak; the exploit's signature is one unprivileged process tree that sets up its own ESP security association inside a fresh network namespace and then runs `su` ("
    urls: ["https://www.wiz.io/blog/fragnesia-linux-kernel-local-privilege-escalation-via-esp-in-tcp"]
  - claim_id: 10a3d48f35
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "body"
    kind: cited
    text: "After any interim mitigation, drop the page cache, because a binary already modified in memory stays modified until it is reloaded from disk ("
    urls: ["https://www.helpnetsecurity.com/2026/05/14/fragnesia-cve-2026-46300-linux-lpe-vulnerability/"]
  - claim_id: 974bfc35bd
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "body"
    kind: uncited
    text: "CVE-2026-46300 (\"Fragnesia\") is a local privilege escalation flaw in the Linux kernel's XFRM ESP-in-TCP subsystem."
