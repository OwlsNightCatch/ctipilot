- id: A
  entry: entries/2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws.md
  finding_ref: work/2026-11-27T0355Z-intel/findings.S1.yaml item 5
  verdict: 'Verified delta worth an update record on the nginx2root entry: new flaw CVE-2026-132779 (client-triggered CPU exhaustion with ssl_early_data, nginx 1.31.10 and 1.30.8 of 2026-11-23, NGINX Plus PLS.37.3.1.1 and PLS.37.0.9.1 of the same day), Veeam appliances affected by two of the five flaws with a fix since 2026-11-25, GitLab bundling nginx 1.31.9; severity score not obtainable (F5 K000163947 unreadable on every transport).'
  delta_vs_entry:
  - 'Entry (updated_at 2026-11-26T05:07:20Z) names nginx 1.31.9 and 1.30.7 as the fixed releases and carries ten CVEs; CVE-2026-132779 appears nowhere in the store (grep entries/ and state/: no hit). New: nginx 1.31.10 (mainline) and 1.30.8 (stable), both dated 23 Nov 2026 in CHANGES and CHANGES-1.30, fix one security flaw: "when using the ssl_early_data directive a client might cause excessive CPU usage (CVE-2026-132779)", plus a separate unrelated bugfix (nginx hogging CPU when SSL connections to backends were used). nginx.org advisory title: "Excessive CPU usage in TLS 1.3 with ssl_early_data"; Vulnerable 1.21.4-1.31.9; Not vulnerable 1.31.10+, 1.30.8+. So a host on 1.31.9 or 1.30.7 has the fixes for the entry''s flaws (where they apply to its branch) but is inside the vulnerable range of this one; the entry''s "update to 1.31.9 or 1.30.7" target is one patch behind wherever ssl_early_data is configured.'
  - 'Class and precondition: availability (CPU pinning), not memory corruption; precondition is TLS 1.3 early data configured (nginx wording: the ssl_early_data directive; Plus notes: "ssl_early_data on"). Mechanism per the Plus release notes: a specially crafted TLS 1.3 connection drives a worker into a tight loop retrying the same send; the worker keeps accepting and serving other connections but one core stays at 100% for as long as the attacker holds the connection open. The sources do not state whether the directive is on by default; no source read gives a CVSS score.'
  - 'NGINX Plus has a counterpart (docs.nginx.com release notes, fetched 2026-11-27): PLS.37.0.9.1 LTS (based on NGINX Open Source 1.29.8) and PLS.37.3.1.1 CR (based on 1.31.8), both dated 23 Nov 2026, each "a security release" whose only listed fix is CVE-2026-132779. The entry''s Plus fixed builds (37.3.0.1 and 37.0.8.1, 18 Nov) do not carry it. The page names R36 P8 (22 Jul 2026) as the latest R36, so no R-release build carries any of the November fixes on that page; whether R33 to R36 are affected by CVE-2026-132779 is not stated anywhere readable (K000163947 is a JavaScript shell for extract and for WebFetch). Note for the composer: Plus build numbers, not the Open Source version string a build is "based on", decide fix status (37.3.1.1 is based on 1.31.8 yet carries the fix).'
  - 'Veeam KB4976 (published 2026-11-20, last modified 2026-11-25; not in the entry, which covers no Veeam product): Veeam Software Appliance 13.1 and Veeam Infrastructure Appliance 13.1 are affected by CVE-2026-123007 and CVE-2026-123633 only (their nginx build has HTTP/2 enabled on a listener that proxies to a backend; the other three of the five "do not apply to the appliance configuration"). Veeam Plug-In for AWS, for Google Cloud and for Microsoft Azure appliances (Ubuntu 22.04 LTS, Ubuntu nginx package) and Veeam Backup for Salesforce 3.2.1 are also affected; Windows-based Backup & Replication, Backup Enterprise Manager on Windows (no nginx) and on Linux (HTTP/2 not enabled) and workers deployed by the hypervisor plug-ins are not; Veeam Data Cloud services are managed by Veeam (no customer action). The KB does not mention CVE-2026-132779 or ssl_early_data and still says Veeam "is investigating ... and will update this article".'
  - 'Veeam fix delivery: since 2026-11-25 an update with the fix is in the Veeam repository for the two appliances, delivered through Veeam Updater as an Enterprise-Linux-9 backport package build (the page names nginx-1.20.1-22.8.el9_6_ciq.3, so the version string cannot be read as an upstream version, which matches the entry''s existing point about distribution backports). Veeam Updater checks the repository every 12 hours; with the default update configuration "mandatory updates are installed automatically on the nearest Sunday at 14:00, based on the time zone of the backup server" (2026-11-25 was a Wednesday, so for an appliance that had not installed it earlier the nearest Sunday is 2026-11-29; that date is my computation, not on the page); if the update is not on the Updates tab it may already be installed, check the History tab in the Veeam Host Management console; appliances behind a local mirror get it after the mirror syncs; manual path is Updates, Check for updates, Install Updates Now, repeated per component that has a custom update configuration. Workaround stated: restrict TCP 443 on the appliances to trusted networks; "HTTP/2 cannot be disabled on these appliances because Veeam components depend on it". Plug-in appliances: install all security updates through Veeam Updater (patched Ubuntu package 1.18.0-6ubuntu14.23). Veeam Backup for Salesforce 3.2.1: Veeam does not manage the customer-deployed OS or nginx package, so install the OS vendor update, or until then remove the http2 parameter from the port-443 listen directive in the nginx site file for the frontend, check the configuration and restart nginx.'
  - 'CERT-FR CERTFR-2026-AVI-1629 (first and only version 2026-11-26) relays KB4976 of 2026-11-20 and adds nothing technical: risk "Exécution de code arbitraire à distance", systems Veeam Backup for Salesforce 3.2.1, Infrastructure Appliance 13.1, Software Appliance 13.1 and the three public-cloud plug-in appliances without the latest security update, and "L''éditeur fournit également une mesure de contournement provisoire". It lists the five nginx2root CVEs only, not CVE-2026-132779. Its value is as an independent authority signal that Veeam impact is being rated code execution (inherited from the nginx2root rating, not Veeam-specific analysis).'
  - 'GitLab patch release 19.6.2, 19.5.9, 19.4.11 (page intro) and eight versions in its title, released 2026-11-25: nginx updated to 1.31.9 in the Linux package (Omnibus) and Docker images built from it in 19.6.2, 19.5.9 and 19.4.11 only (the page has no nginx line for 19.3 and older); GitLab Helm Chart and Operator installations using the deprecated NGINX Ingress controller are also affected, the controller has been disabled by default since 19.0, upstream no longer patches it, GitLab recommends Envoy Gateway or an external ingress controller, and "an updated NGINX controller will ship in an upcoming chart release". GitLab bundles 1.31.9, which is inside the vulnerable range of CVE-2026-132779; the page does not say whether Omnibus ever sets ssl_early_data, so no exposure may be asserted.'
  - 'Action delta only (do not restate entry actions): move nginx to 1.31.10 or 1.30.8 (Plus 37.3.1.1 or 37.0.9.1) where ssl_early_data is on; Veeam appliance operators confirm the Veeam Updater package landed (History tab) rather than waiting for the Sunday window and restrict 443; GitLab Omnibus on 19.6.2/19.5.9/19.4.11 is on 1.31.9, Helm users on the deprecated NGINX Ingress need the next chart release.'
  gaps:
  - 'F5 K000163947 (the advisory every nginx.org line points to) cannot be read: extract served a 737 KB JavaScript shell (transport direct-raw), WebFetch answered "no advisory content". No severity, no NGINX Plus R-release statement for this CVE.'
  - Veeam KB4976 and nginx.org advisories are living pages; KB4976 says it will be updated. Veeam does not itemise CVE-2026-132779 at all.
  - No readable nginx announcement mail or blog for 1.31.10 was found (a search for it returned an nginx.org news page whose newest mainline entry was 1.31.8 of 2026-10-21 and the search summary said 1.31.10 was not found, which the live CHANGES files dated 2026-11-23 contradict, so that index was stale); CHANGES and CHANGES-1.30 carry the release lines and dates.
