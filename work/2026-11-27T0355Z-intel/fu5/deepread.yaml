  verdict: 'Verified: GitHub Enterprise Server is fixed since 2026-11-22 on all four current lines (3.22.6, 3.21.11, 3.20.13, 3.19.17), GitLab carries the Ruby fix on five more branches since 2026-11-25, and Veria Labs'' table is frozen at 2026-11-21 03:52 UTC (stale for both); Veria''s Rails exploit is NOT found published as of 2026-11-27 (page, feed, GitHub org and two searches), and a new co-discoverer primary (Durendal) adds the Rails reach path and a timeline that contests Veria''s "first RCE" claim.'
  delta_vs_entry:
  - 'GHES: the entry (Update 2026-11-22 and main text) says Veria lists GHES 3.22.5 and earlier as the one product without a fixed release. GitHub''s release notes for 3.22.6, 3.21.11, 3.20.13 and 3.19.17, each dated November 22, 2026, carry the line "**CRITICAL**: GitHub has updated Ruby to fix several announced vulnerabilities. Where an update was not immediately possible, mitigations were introduced at the application level." (link target: the Ruby 2026-11-18 advisory). So GHES has had a fixed build on every supported line since 2026-11-22. The notes name no CVE, no Ruby version and do not say which of the seven flaws are covered or what the "application level" mitigations are; GHES 3.18 and earlier were not read.'
  - 'Veria Labs'' page, fetched 2026-11-27 (extract + raw HTML): dateModified 2026-11-21T03:52:00Z, "Updated 21 November 2026 at 03:52 UTC"; row still "GitHub Enterprise Server | 3.22.5 and earlier | None | Vulnerable"; GitLab row still lists only 19.6.1, 19.5.8, 19.4.10. The table therefore predates the GHES releases by about a day and the GitLab backports by four days; the entry should stop treating GHES as unfixed. Other rows unchanged from the entry (Chatwoot 4.20.1, Mastodon 4.7.6/4.6.12/4.5.22/4.4.29, OpenProject 17.9.8/17.8.3, Discourse base image 2.0.20261119-0203).'
  - 'GitLab patch release of 2026-11-25 (page title lists 19.6.2, 19.5.9, 19.4.11, 19.3.10, 19.2.11, 19.1.11, 19.0.12, 18.11.15): "Ruby ... backported to GitLab versions 19.3.10, 19.2.11, 19.1.11, 19.0.12, and 18.11.15 (previously included in 19.6.1, 19.5.8, and 19.4.10)"; each of those five branch sections lists "Bump Ruby to 3.3.14 and 3.4.13" (Omnibus). The entry''s action names only 19.6.1, 19.5.8 and 19.4.10, so self-managed GitLab on 19.3 down to 18.11 now has fixed builds too; GitLab states "Extended backports are an exception and do not reflect our standard maintenance policy". The same page carries other fixes (GPGME double free CVE-2026-129975, Git backport, nginx 1.31.9) that belong to other findings.'
  - 'Veria''s Rails proof of concept: NOT FOUND published. Page paragraph (raw HTML) still reads, in future tense on 2026-11-27, "We''ll be publishing a proof of concept demonstrating remote code execution on stock Rails on 25 November 2026, or later if major vendors have not shipped a fix by then", with no link to a repository or post (apart from site chrome and social links, the page''s only outbound links are cve.org, the GHSA, the Ruby advisory, the upstream fix commit and the Durendal post); verialabs.com/rss.xml has 11 items, newest 2026-10-15, none on Ruby; github.com/verialabs lists 4 repositories per the GitHub API (mcp-auth-exploit-pocs, ctf-agent, Jolt-PoC, and a docker-py fork pushed 2026-11-23), none Ruby-related. Searches used: (1) "Ruby2Shell exploit released", (2) "Ruby2Shell CVE-2026-132825 Rails proof of concept published Veria Labs exploit": neither returned any Ruby2Shell item dated after 2026-11-19 (hits were vendor explainers and one anonymous Pastebin "RUBY2SHELL.txt" of 2026-11-19, not fetched and not verifiable). The "or later if major vendors have not shipped" clause means the page gives no new date; absence of a post is not proof none exists.'
  - 'New primary not in the entry: Durendal (Moritz Sanft, 2026-11-19, "Yet another ẞug"), a co-discoverer named on Veria''s own credits line. It documents the Rails reach path: Rack''s method override lets a client send a multipart "_method" field and Rack upcases it; Rack lets a multipart field declare a charset, so a field declared in a vulnerable single-byte encoding and carrying a long run of sharp-s characters reaches the overflow; "A plain `rails new` app is enough to be exploitable". Behaviour-level detection hook (no payload): multipart/form-data POST whose method-override field declares a legacy charset such as ISO-8859-1 and holds a long repeated non-ASCII character run; worker crash or restart in the Rails app. CrowdSec (2026-11-19, independence from Veria not established) corroborates the path from its own rule write-up: "Rails'' default middleware changes the case of one form field on every POST, and a multipart part declared as ISO-8859-1 carries the crafted value straight into the vulnerable code, before your application code even runs", and ships a free WAF rule (name given in its post; vendor claim, untested by us). Whether an app that disables Rack method override is safe is not stated by any source; do not claim it.'
  - 'Durendal''s timeline, which dates working exploitation before disclosure: toy-Rails end-to-end exploit 2026-10-26 (hash posted on X, no code), RCE against a plain jemalloc rails new app 2026-11-05 and with the default glibc allocator 2026-11-06 by an OpenAI researcher, "working exploit proofs" sent to the Ruby maintainers 2026-11-07, disclosure 2026-11-19 CET (2026-11-18 PST). This is a plausible basis (my inference, not stated by either source) for the Ruby project''s "We are aware of PoCs" statement. It also competes with the entry''s sourcing_note that Veria Labs "says it ... was the first to demonstrate remote code execution" (Veria''s own claim, no date on its page): the entry already attributes it to Veria, but Durendal''s dated timeline puts RCE demonstrations by OpenAI/Sanft at 2026-11-05 and a toy-app exploit at 2026-10-26, so two parties claim priority and neither claim should be adopted. Private exploits therefore exist at OpenAI/Sanft and Ruby maintainers; none is published.'
  - 'Second flaw named by Durendal and CrowdSec: GHSA-87fm-7w84-j2px, integer overflow in rb_str_casemap reachable the same multipart way; Durendal says its impact is limited to Rack <= 3.2.1 because Rack 3.2.2 added multipart field size limits; CrowdSec says its WAF rule does not cover it. OpenAI coordinated with WAF vendors before disclosure (Durendal), consistent with vendor virtual patches (CrowdSec) being public from 2026-11-19.'
  - 'Same GHES releases also carry (separate findings, for the composer''s cross-reference): CVE-2026-114938, "a vulnerability in the Java runtime bundled with Elasticsearch", mitigated by starting Elasticsearch with -XX:UseAVX=2 on x86-64 appliances (rated HIGH; the notes never use the name Java4Shell, which other outlets use for CVE-2026-114938; the store already has entries/2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce.md) and HAProxy 2.8.32 for an unauthenticated crafted-HTTP/2 crash (HIGH); 3.22.6 and 3.21.11 add Grafana 12.4.15, 3.20.13 and 3.19.17 do not list it.'
  - 'Action delta only: GHES administrators move to 3.22.6, 3.21.11, 3.20.13 or 3.19.17 (not just 3.22); self-managed GitLab on 19.3, 19.2, 19.1, 19.0 or 18.11 takes 19.3.10, 19.2.11, 19.1.11, 19.0.12 or 18.11.15; the entry''s other actions (interpreter update, self-compiled GitLab rebuild) are unchanged.'
  gaps:
  - OX Security's and Cloudflare Radar zero-wire's Ruby2Shell pages returned HTTP 403 on every transport (direct, trafilatura, jina); the search-snippet claim that OX Security found "no working exploit against real-world applications" is unverified and must not be used.
  - GHES 3.18 and earlier not checked; GHES notes do not say which Ruby version or CVEs.
  - No source states the Veria PoC was published; no source states it was not (absence from page, feed, GitHub org and two searches only).
