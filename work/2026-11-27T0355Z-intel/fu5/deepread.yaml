- id: C
  entry: entries/2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce.md
  finding_ref: work/2026-11-27T0355Z-intel/findings.S3.yaml item 3
  verdict: 'Genuine, single-source delta: Huntback''s decoy is the first behaviour-level telemetry for the KEV flaw (an autosign-dependent three-request chain in 1.47 s on 2026-11-19, a probe-style payload that proves execution without writing or downloading anything), so the entry''s "CISA is the only source for exploitation" no longer holds, but the capture is a vulnerability check by a scanning pool, not an intrusion, and is uncorroborated: ship as an update record with Huntback attributed and the caveats stated.'
  delta_vs_entry:
  - 'Exploitation evidence: entry sourcing_note says "CISA is the only source for exploitation and gives no actor, victim or telemetry" and the body has no in-the-wild behaviour. Huntback (2026-11-20, honeypot telemetry, single source) reports one of its Puppet Server decoys received the whole chain on the morning of 2026-11-19 UTC, two days after the 2026-11-17 KEV listing and 16 days after the 2026-11-03 CVE record, in 1.47 seconds from one address. Huntback calls it "a check for vulnerable servers"; it does not tie the capture to the exploitation CISA holds evidence for, and it did not see a real command, a victim or post-exploitation. The decoy "signed the certificate, accepted the report with a 200, and returned no marker", so it was not a vulnerable server and shows nothing of server-side effects.'
  - 'Observed request sequence (behaviour level, three requests): (1) PUT of a certificate request to the CA v1 certificate-request path for a freshly generated node name, a new 2048-bit key and no attributes or extensions, which only a CA that asks for no shared secret or other proof will accept; (2) 1.4 seconds later, GET of the signed certificate for the same name, with no polling or retry, which is the autosign test ("a 200 means the door is open, a 404 means an administrator still has to approve the name"); (3) PUT to the v3 report path of an agent report whose wrapper is ordinary (a run that changed one Notify resource, fixed fields) and whose single event carries the payload; the whole chain took 1.47 s and used a plain Python HTTP client user agent.'
  - 'Autosign dependence, made concrete: the attacker mints its own node identity, so no stolen certificate or compromised host is needed, and step 2 is a built-in autosign probe; on a server that does not autosign the chain stops at a 404 (reading of the page''s own explanation). The entry says only "where the CA autosigns"; the new fact is that scanners test this as a first step and that a CA demanding any proof in the request refuses step 1. Huntback''s definition: autosigning in its simplest forms approves every name or every name matching a pattern.'
  - 'Payload class: an inline type definition (an object type with one function) whose function carries a Ruby-method annotation; the annotation supplies Ruby source that Puppet places inside a generated method, and the captured body closes that method early so the next statement runs when the generated code is evaluated, with nobody calling the function, then opens a second method so the syntax still balances. This specimen only raised an error whose message carried a marker and the target''s address, which the tool reads from the HTTP reply (it proves execution and labels the host); "Nothing is written to disk and nothing is downloaded", and "a real command needs one line changed". The entry says only "a crafted rich-data type" in a PUT. No payload body, address or marker string is carried here, per the no-IOC rule.'
  - 'What an operator sees (Huntback''s guidance; the page shows no captured server-log lines because the decoy was not vulnerable): reverse-proxy or access log: PUT to the CA certificate-request path from an address that is not one of the fleet''s agents, a GET for the same name within a second or two, then a PUT to the report path; server log: errors raised while processing a report (and, for this probe class, an error message carrying the scanner''s marker); CA inventory: a signed certificate for a node name nobody enrolled, random-looking with a fixed tool prefix per Huntback; report body: any report carrying a type definition ("No agent sends a type definition in a report"). Discriminator for a benign lookalike: legitimate enrolment signs a request and uploads a report too, but from a known address, after a first catalog run, with a plausible host name; here the report followed the certificate fetch by about a second with no catalog fetch, and the report claims a run time of exactly 12:00:00 more than three hours after it was sent (fixed synthetic fields).'
  - 'Correction of the entry''s Detection emphasis: the entry''s hook is "child processes of the server''s service account" and PUTs from recently enrolled hosts; the observed probe variant spawns no process (error raised, nothing written or downloaded), so a child-process-only hunt would miss it; a real-command variant would add one. The signed-name audit Huntback gives (list every signed certificate and account for every name) differs from the entry''s audit for names colliding with an existing node.'
  - 'Precursor from a different address in the same hosting pool, 2 h 35 min before the chain (its first requests) and 2 h 15 min before it (its last request at 06:24 UTC): three requests within half a second with a self-labelled scanner user agent: status service with level=debug (403 on the decoy), the Puppet 3 style CA path (404) and the v1 CA path (200), repeated twice more over the next 20 minutes, never requesting a certificate. Huntback''s inference (its own multi-decoy logs): the pool splits labour, volume addresses fingerprint and spray, one "test bench" address takes each new flaw for a first pass (it had tried other products'' flaws on the decoys over the prior ten days); Puppet reached that address two days after the KEV listing.'
  - 'Hardening levers beyond the entry''s (upgrade, stop autosigning, audit colliding names): policy-based autosigning that verifies something the requester cannot guess or manual signing; a reverse-proxy rule refusing any report whose body carries a type definition (Huntback claims it stops this payload and variants; untested by us); closing the agent port 8140 to everything but known agent networks; reconcile the signed-certificate list with inventory and revoke what cannot be explained. Fixed releases restated by Huntback match the entry.'
  - 'Suggested metadata (composer''s call): the scout supports T1595.002 (active scanning, vulnerability scanning; check against the ATT&CK pin), alongside the entry''s T1190 and T1552.004. Notability: first reported in-the-wild behaviour (single source) for a KEV flaw on a privileged management server whose CA key is reachable by code execution.'
  - 'What the page does not say: no actor attribution beyond "a cluster across three hosting prefixes", no victim, no capture from a vulnerable server, no real command, no second honeypot or vendor corroboration (one search for corroborating telemetry returned only KEV/aggregator coverage and no independent capture). All addresses, prefixes, user agents, the certificate-name pattern, the marker string and the report fixed-field values on the page are indicators and are withheld from this file.'
  gaps:
  - Single source; the Huntback blog is the only place the capture is described; the page lists its own indicators table (withheld).
  - Huntback does not show what a vulnerable server logs; operator-visible effects on a real server are Huntback's guidance, not an observation.
  evidence:
  - claim: 'Capture: whole chain on a decoy, 19 Nov, three requests in 1.47 s'
    source_url: https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured
    file: work/2026-11-27T0355Z-intel/fu5/C_huntback.txt
    passage: 'On the morning of 19 November one of our Puppet Server decoys received the whole chain from start to finish: an address asked the server to sign a certificate, collected it, and submitted a report with a Ruby method hidden inside a type definition. The three requests took 1.47 seconds.'
  - claim: 'Autosign dependence: the certificate is the first request of the chain'
    source_url: https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured
    file: work/2026-11-27T0355Z-intel/fu5/C_huntback.txt
    passage: The flaw needs a certificate. Where the certificate authority **signs requests automatically**, the attacker gets one by asking. That was the first request of the chain.
  - claim: Request 1 is a bare certificate request, no attributes; a server demanding a shared secret would refuse it
    source_url: https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured
    file: work/2026-11-27T0355Z-intel/fu5/C_huntback.txt
    passage: 'The request is as plain as one can be: a fresh 2048-bit RSA key, the subject'
  - claim: Request 1 refusal condition
    source_url: https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured
    file: work/2026-11-27T0355Z-intel/fu5/C_huntback.txt
    passage: A server that asked for a shared secret or any other proof in the request would refuse it.
  - claim: 'Request 2: fetch of the signed certificate 1.4 s later, no polling; this is the autosign test'
    source_url: https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured
    file: work/2026-11-27T0355Z-intel/fu5/C_huntback.txt
    passage: 'Sent 1.4 seconds after the first, with no polling and no retry. The client assumes the signature is already there, which is only true on a server that signs automatically. This one request is the test for autosigning: a 200 means the door is open, a 404 means an administrator still has to approve the name.'
  - claim: 'Request 3: ordinary-looking report wrapper; event carries the payload'
    source_url: https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured
    file: work/2026-11-27T0355Z-intel/fu5/C_huntback.txt
    passage: Everything around the event is an ordinary report for a run that changed one `Notify` resource. The event is where the payload sits.
  - claim: 'Payload class: inline type definition whose function carries a RubyMethod annotation'
    source_url: https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured
    file: work/2026-11-27T0355Z-intel/fu5/C_huntback.txt
    passage: The function carries a `RubyMethod` annotation. That annotation exists so that a type can supply the Ruby source of a method when Puppet generates a class for it, and its `body` is placed inside a generated `def ... end`.
  - claim: 'Payload class: closes the generated method early so the statement runs on evaluation, no call needed'
    source_url: https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured
    file: work/2026-11-27T0355Z-intel/fu5/C_huntback.txt
    passage: The third line now sits outside any method, so it runs the moment the generated code is evaluated, without anyone calling `test`.
  - claim: 'Payload class: verification probe, no write to disk, no download'
    source_url: https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured
    file: work/2026-11-27T0355Z-intel/fu5/C_huntback.txt
    passage: 'A check built this way only has to look for its marker in the reply: one request both proves code execution and labels the result. Nothing is written to disk and nothing is downloaded.'
  - claim: Probe built so a real command needs one line changed
    source_url: https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured
    file: work/2026-11-27T0355Z-intel/fu5/C_huntback.txt
    passage: This was a check for vulnerable servers, built so that a real command needs one line changed.
  - claim: 'Benign-lookalike discriminator: synthetic report fields (run time 12:00:00 hours after sending)'
    source_url: https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured
    file: work/2026-11-27T0355Z-intel/fu5/C_huntback.txt
    passage: 'One detail gives it away in a log: the report states a run time of exactly `12:00:00`, more than three hours after it was sent.'
  - claim: 'Decoy outcome: signed, accepted with 200, returned no marker, address did not return'
    source_url: https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured
    file: work/2026-11-27T0355Z-intel/fu5/C_huntback.txt
    passage: Our decoy signed the certificate, accepted the report with a 200, and returned no marker. The address did not come back to that decoy.
  - claim: 'Precursor 1: status-service probe of the Puppet Server (403 on the decoy)'
    source_url: https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured
    file: work/2026-11-27T0355Z-intel/fu5/C_huntback.txt
    passage: '| `GET /status/v1/services?level=debug` | 403 | The status service of a Puppet Server exists here. An open one returns the service versions. |'
  - claim: 'Precursor 2: Puppet 3 and v1 CA path probes (200 on v1)'
    source_url: https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured
    file: work/2026-11-27T0355Z-intel/fu5/C_huntback.txt
    passage: '| `GET /puppet-ca/v1/certificate/ca` | 200 | The CA certificate. This server runs its own certificate authority and talks to strangers. |'
  - claim: Precursor never asked for a certificate
    source_url: https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured
    file: work/2026-11-27T0355Z-intel/fu5/C_huntback.txt
    passage: It repeated the status request at 06:23:52 and 06:24:46 and did nothing else. It never asked for a certificate.
  - claim: Gap between scout and chain
    source_url: https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured
    file: work/2026-11-27T0355Z-intel/fu5/C_huntback.txt
    passage: Two hours and fifteen minutes later
  - claim: 'Pool context: exploiting address is the cluster test bench, tried four other products in the prior ten days'
    source_url: https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured
    file: work/2026-11-27T0355Z-intel/fu5/C_huntback.txt
    passage: 'The exploiting address is the cluster''s test bench: in the ten days before, it tried exploits for four other products on our decoys.'
  - claim: Division of labour; Puppet reached the first-pass address two days after KEV listing
    source_url: https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured
    file: work/2026-11-27T0355Z-intel/fu5/C_huntback.txt
    passage: 'The division of labour is consistent. The other addresses in the pool do volume: password guessing and fingerprinting. One address takes each new flaw for a first pass, mostly with plain Python clients. Puppet reached that address two days after the flaw was listed as exploited.'
  - claim: 'Operator log guidance: access-log sequence'
    source_url: https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured
    file: work/2026-11-27T0355Z-intel/fu5/C_huntback.txt
    passage: '**Read the access log.** The sequence is distinctive: a `PUT` to `/puppet-ca/v1/certificate_request/` from an address that is not one of your agents, a `GET` for the same name within a second or two, then a `PUT` to `/puppet/v3/report/`.'
  - claim: 'Operator log guidance: server log errors while processing a report'
    source_url: https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured
    file: work/2026-11-27T0355Z-intel/fu5/C_huntback.txt
    passage: and for errors raised while processing a report.
  - claim: 'Operator hunt: list signed certificates and account for every name'
    source_url: https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured
    file: work/2026-11-27T0355Z-intel/fu5/C_huntback.txt
    passage: '**List the certificates you have signed.** Run `puppetserver ca list --all` and account for every name.'
  - claim: 'Operator remediation: revoke and clean unexplained names'
    source_url: https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured
    file: work/2026-11-27T0355Z-intel/fu5/C_huntback.txt
    passage: Revoke and clean anything you cannot explain with `puppetserver ca clean --certname <name>`.
  - claim: Autosign configuration guidance (autosign = true; autosign.conf with * or broad pattern; policy-based autosign)
    source_url: https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured
    file: work/2026-11-27T0355Z-intel/fu5/C_huntback.txt
    passage: '**Look at autosigning.** In `puppet.conf`, `autosign = true` signs everything. An `autosign.conf` containing `*` or a broad pattern does nearly the same. Switch to policy-based autosigning that verifies something the requester cannot guess, or sign by hand'
  - claim: 'Autosign definition: simplest forms approve every name or every name matching a pattern'
    source_url: https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured
    file: work/2026-11-27T0355Z-intel/fu5/C_huntback.txt
    passage: Autosigning is a convenience setting. It lets new machines join without an administrator approving each certificate request, and in its simplest forms it approves every name or every name that matches a pattern
  - claim: 'Filtering lever: reverse-proxy rule refusing any report containing a type definition'
    source_url: https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured
    file: work/2026-11-27T0355Z-intel/fu5/C_huntback.txt
    passage: '**Filter the report body.** No agent sends a type definition in a report. A reverse proxy rule that refuses any report containing `RubyMethod` stops this payload and its variants.'
  - claim: 'Network lever: close port 8140 to the internet'
    source_url: https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured
    file: work/2026-11-27T0355Z-intel/fu5/C_huntback.txt
    passage: '**Close port 8140 to the internet.** Agents reach the server from networks you know.'
  - claim: Record dates and fixed releases restated
    source_url: https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured
    file: work/2026-11-27T0355Z-intel/fu5/C_huntback.txt
    passage: The record was published on 3 November with a score of 9.4. Fixed releases are Puppet Enterprise 2023.8.13, 2025.12.1 and 2026.0.1.
  - claim: Page publication date 2026-11-20 (extract metadata)
    source_url: https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured
    file: work/2026-11-27T0355Z-intel/fu5/C_huntback.txt
    passage: 'date: "2026-11-20"'
