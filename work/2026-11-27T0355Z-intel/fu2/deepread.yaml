    versions_and_files: 'ASEC (single source): Q-Dir 12.83.0.0, 12.84.0.0, 12.85.0.0 and DesktopOK 12.82.0.0, 12.85.0.0 installers; DesktopOK 12.84 is not on ASEC''s list; ASEC widens to ''other versions installed in that period''. ASEC gives no file names (placeholder ''[file name]''); vendor page lists Q-Dir_Installer/_x64/_Win98 and Portable ZIPs (EXEs inside) and DesktopOK ZIPs; which of these carried tampering is not stated. ASEC''s table has several tampered variants per version (2 to 5), i.e. more than one file per version was replaced.'
    served_from: 'Both, in ASEC''s words: direct download from the official download page (''Evidence indicates...'') and ''the update process of previously installed legitimate programs'' (later hedged: users of the update feature ''may have been affected''). ASEC does not show the update-path logs and does not say whether the update server is the same host as the download page.'
    behaviour: 'Wrapper installer embeds the genuine, correctly signed Q-Dir/DesktopOK EXE, writes and runs it from C:\Users\Public so the app looks normal; downloads (HTTPS inferred from defanged scheme) the legitimate 7-Zip console extractor and a 7z package holding a Python 3.9 runtime plus a custom Python RAT; extracts to ProgramData\Microsoft\DeviceSync\b2 (fallback ProgramData\DeviceSync\b2); persists with scheduled task \UPnp\MicrosoftEdge_dcntel launching py39\pythonw.exe on agent\py_client_dsv2.py; RAT: shell commands, Python code, file transfer, screenshots, system info; compares running processes with 1,206 AV/EDR process names and sends matches to the C2. C2: ASEC names an address:port in its indicator section and does not describe protocol, encryption or beaconing. No DLL side-loading, UAC bypass, registry autorun or startup-folder persistence is described (script check 5.A1 = 0 matches). No malware-family name is given beyond ASEC tags ''PythonRAT'' / ''Downloader'' / ''SupplyChain''. Artefact names above are path/task names, not hashes/IPs/domains; composer decides which to carry.'
    dating: 'ASEC gives NO distribution window or first/last-seen dates; page timestamp 2026-11-25T15:00Z, wording ''recently confirmed'' and ''At the time of analysis''. Vendor release dates (vendor-fact) bound the earliest possible exposure per version: DesktopOK 12.82 on 2026-10-28, Q-Dir 12.83 on 2026-11-04, Q-Dir 12.84 on 2026-11-13, DesktopOK 12.85 on 2026-11-19, Q-Dir 12.85 on 2026-11-21. That bound is collector arithmetic on vendor dates, not an ASEC claim, and tampering could be shorter than release-to-report.'
    vendor_statement: 'None found as of 2026-11-27 ~04:35 UTC: home page, News page (latest entry 26 Nov Is.My.Pong.OK), both download pages, both version-history pages and softwareok.de carry no notice, clean-version announcement or removal. Vendor changelogs do not mention tampering: Q-Dir 12.84 (13 Nov) and 12.85 (21 Nov) both say ''Update necessitated by a false-positive virus alert on the MS Windows''; DesktopOK 12.85 (19 Nov) says ''Minor fixes ... and an auto-update issue''; DesktopOK 12.88 (26 Nov, day after ASEC) says nothing about it. These are vendor statements about its releases; there is no link to ASEC''s report and none should be inferred. The vendor''s download page currently still lists Q-Dir 12.85 as current.'
    malware_news_page: 'Automated relay (poster ''MalBot'') of ASEC''s post: first paragraph plus ''Article Link'' back to ASEC, an affiliate banner; no independent observation. Counts as ONE source with ASEC.'
    own_observations_not_quotable:
    - Vendor Q-Dir download page (raw HTML, 2026-11-27) posts nine SHA-256 values for its files; exactly one of them equals the value ASEC lists as the 'legitimate' hash for Q-Dir 12.85.0.0; the other eight do not appear in ASEC's table (ASEC lists a subset of files). So the vendor page is consistent with ASEC's baseline for at least one file but this cannot show the currently served files are clean. Hash values deliberately not reproduced.
    - The vendor's Q-Dir download page lists Q-Dir_Installer.zip with a size of '0 K' while the other archives show 600 to 1250 K. Unexplained display quirk or upload artefact; no inference drawn.
    hunt_exposure_statement_sources_support: 'From ASEC only: (a) exposure test = compare installer SHA-256 with the vendor download page; (b) post-removal checks = Python runtime outside a normal install location, scheduled tasks, related files, external network traces; (c) path/task artefacts as in ''behaviour''. ASEC states no parent-process lineage. Mechanically implied (collector inference, label as concept): installer process as parent of the genuine app run from the public folder and of a child that downloads and runs the 7-Zip console tool; Task Scheduler as parent of a windowless Python interpreter under ProgramData.'
    corrections_to_S3_draft:
    - 'S3 Triage line says ''unsigned or different-hash wrapper'': ASEC verifies the signature of the EMBEDDED genuine EXE only and does not say whether the outer installer is signed. Drop ''unsigned''.'
    - 'S3 Detection line says EDR enumeration is ''a one-shot burst of process-list reads'': not in ASEC; remove or label as speculation.'
    - 'S3 title/summary ''in-app update'': ASEC says ''update process'' / ''update features of their existing installations'' and hedges (''may have been affected''); keep the hedge and say the logs are not shown.'
    - 'S3 notes ''Swiss use not stated'': correct; ASEC is Korean and names Korean products first.'
    verdict: 'CLEARS the ''do something different within 7 days'' bar from facts only (single source, ASEC, B2): any team can, within a week, list endpoints and software-distribution repositories that installed or updated Q-Dir or DesktopOK since 2026-10-28, compare installers against the vendor hashes, and hunt for a scheduled task under the UPnP folder, a windowless Python interpreter under ProgramData, and a Python runtime beside a freeware utility; reinstalling alone is not remediation. Limits to state: single source, no dating, vendor silent, no Swiss use shown. Suggested priority: notable, not critical.'
item4_specterops:
  claims:
  - id: '4.01'
    kind: researcher-claim
    claim: 'Occasion: the post responds to online discussion after the 1Password incident.'
    source_url: https://specterops.io/blog/2026/11/25/beyond-branch-protection-understanding-github-attack-paths/
    file: work/2026-11-27T0355Z-intel/fu2/specterops_branch.md
    passage: In the aftermath of the [1Password security incident](https://1password.com/blog/update-on-nov-2026-security-incident), I’ve seen a considerable amount of discussion questioning how the compromise of a single employee’s GitHub account could have such significant consequences
    passage_verified_substring: true
  - id: '4.02'
    kind: researcher-claim
    claim: 'The author explicitly declines to speculate about 1Password''s specifics: the only link between the post and the incident is the occasion.'
    source_url: https://specterops.io/blog/2026/11/25/beyond-branch-protection-understanding-github-attack-paths/
    file: work/2026-11-27T0355Z-intel/fu2/specterops_branch.md
    passage: Rather than speculate about the specifics of the 1Password incident, I want to demonstrate how similar consequences could arise in an enterprise environment that has implemented many of the security practices we actively encourage organizations to adopt.
    passage_verified_substring: true
  - id: '4.03'
    kind: vendor-fact
    claim: 1Password's own post (the linked page) says nothing about Entra, federated credentials or branch protection; it states a GitHub account was used to push malicious code to backend services. Absence verified by script (see counts).
    source_url: https://1password.com/blog/update-on-nov-2026-security-incident
    file: work/2026-11-27T0355Z-intel/fu2/1password_incident.md
    passage: The actor used the account to access source code and push malicious code to backend services, which downloaded administrative data pertaining to our customers.
    passage_verified_substring: true
  - id: '4.04'
    kind: researcher-claim
    claim: 'Evidence class: a lab environment (fictional enterprise), ''modeled after'' production configurations the author says it has encountered; not an incident report and no real victim.'
    source_url: https://specterops.io/blog/2026/11/25/beyond-branch-protection-understanding-github-attack-paths/
    file: work/2026-11-27T0355Z-intel/fu2/specterops_branch.md
    passage: K-Nexus Global, a fictional enterprise that we maintain at SpecterOps for research, product development, testing, and demonstrations.
    passage_verified_substring: true
  - id: '4.05'
    kind: researcher-claim
    claim: 'Starting assumption: the adversary already controls an employee''s GitHub identity (initial access is out of scope of the demonstration).'
    source_url: https://specterops.io/blog/2026/11/25/beyond-branch-protection-understanding-github-attack-paths/
    file: work/2026-11-27T0355Z-intel/fu2/specterops_branch.md
    passage: For the purposes of this article, we will assume that an adversary has obtained control of an employee’s GitHub identity.
    passage_verified_substring: true
  - id: '4.06'
    kind: researcher-claim
    claim: 'Identity chain in the lab: AD -> Okta (password sync) -> GitHub (EMU); a workstation compromise is the example origin.'
    source_url: https://specterops.io/blog/2026/11/25/beyond-branch-protection-understanding-github-attack-paths/
    file: work/2026-11-27T0355Z-intel/fu2/specterops_branch.md
    passage: In K-Nexus Global, employees have identities in Active Directory, which are integrated with Okta through mechanisms including password synchronization. Okta, in turn, facilitates authentication to other applications, including GitHub.
    passage_verified_substring: true
  - id: '4.07'
    kind: researcher-claim
    claim: 'CONDITION 1: org default repository permission is ''write'', so every member has effective write to applicable repositories without an explicit role.'
    source_url: https://specterops.io/blog/2026/11/25/beyond-branch-protection-understanding-github-attack-paths/
    file: work/2026-11-27T0355Z-intel/fu2/specterops_branch.md
    passage: In K-Nexus Global, the k-nexus-global-infra GitHub organization has its default repository permission configured as write.
    passage_verified_substring: true
  - id: '4.08'
    kind: researcher-claim
    claim: 'Condition 1 consequence: effective writers far outnumber explicit role assignments an administrator would review.'
    source_url: https://specterops.io/blog/2026/11/25/beyond-branch-protection-understanding-github-attack-paths/
    file: work/2026-11-27T0355Z-intel/fu2/specterops_branch.md
    passage: An administrator reviewing the role assignments associated with a particular repository might see a relatively small number of teams and users. However, when we account for the organization’s default repository permission, we discover a substantially larger population of users with effective write access.
    passage_verified_substring: true
  - id: '4.09'
    kind: researcher-claim
    claim: 'CONDITION 2: the Entra federated identity credential trusts a repository-wide subject with a wildcard (subject pattern ends in '':*''), via ''flexible claims matching''.'
    source_url: https://specterops.io/blog/2026/11/25/beyond-branch-protection-understanding-github-attack-paths/
    file: work/2026-11-27T0355Z-intel/fu2/specterops_branch.md
    passage: However, in this example, the federated identity credential uses flexible claims matching with a wildcard (\*), meaning that trust is not restricted to a particular branch or environment within the repository.
    passage_verified_substring: true
  - id: '4.10'
    kind: researcher-claim
    claim: The subject pattern shown for condition 2 (org/repo then ':*').
    source_url: https://specterops.io/blog/2026/11/25/beyond-branch-protection-understanding-github-attack-paths/
    file: work/2026-11-27T0355Z-intel/fu2/specterops_branch.md
    passage: repo:k-nexus-global-infra/k-nexus-global-infra:\*
    passage_verified_substring: true
  - id: '4.11'
    kind: researcher-claim
    claim: 'CONDITION 3 (the post''s wording; not listed by S3): the organization has not restricted creation of arbitrary branches, so a non-protected context can satisfy the repository-wide trust.'
    source_url: https://specterops.io/blog/2026/11/25/beyond-branch-protection-understanding-github-attack-paths/
    file: work/2026-11-27T0355Z-intel/fu2/specterops_branch.md
    passage: Because the organization has not restricted the creation of arbitrary branches, the protection of the main branch does not prevent other repository contexts from satisfying the federated trust conditions.
    passage_verified_substring: true
  - id: '4.12'
    kind: researcher-claim
    claim: 'CONDITION 4: the federated Entra service principal can grant Microsoft Graph application roles (BloodHound edge AZMGGrantAppRoles); the post does not name which Graph permission or role.'
    source_url: https://specterops.io/blog/2026/11/25/beyond-branch-protection-understanding-github-attack-paths/
    file: work/2026-11-27T0355Z-intel/fu2/specterops_branch.md
    passage: In our K-Nexus Global examples, the corresponding Entra service principals possess the ability to grant Microsoft Graph application roles.
    passage_verified_substring: true
  - id: '4.13'
    kind: researcher-claim
    claim: 'Headline result (graph-derived, not a demonstrated exploit run): every org member has an attack path to Entra Tier Zero; branch protection stays intact.'
    source_url: https://specterops.io/blog/2026/11/25/beyond-branch-protection-understanding-github-attack-paths/
    file: work/2026-11-27T0355Z-intel/fu2/specterops_branch.md
    passage: When we combine these relationships with the privileges of the corresponding Entra service principal, we discover that every member of the GitHub organization has an attack path to Tier Zero in Entra.
    passage_verified_substring: true
  - id: '4.14'
    kind: researcher-claim
    claim: Branch protection need not be defeated; scope mismatch is the problem.
    source_url: https://specterops.io/blog/2026/11/25/beyond-branch-protection-understanding-github-attack-paths/
    file: work/2026-11-27T0355Z-intel/fu2/specterops_branch.md
    passage: Notice that branch protection does not need to be defeated for this exposure to exist.
    passage_verified_substring: true
  - id: '4.15'
    kind: researcher-claim
    claim: Repository-level secrets and repo-wide FIC are not restricted to protected branches.
    source_url: https://specterops.io/blog/2026/11/25/beyond-branch-protection-understanding-github-attack-paths/
    file: work/2026-11-27T0355Z-intel/fu2/specterops_branch.md
    passage: Repository-level secrets, for example, are not inherently restricted to protected branches. Similarly, a federated identity credential configured to trust an entire repository is not inherently restricted to its protected branches.
    passage_verified_substring: true
  - id: '4.16'
    kind: researcher-claim
    claim: 'Second pattern: one FIC per branch (development, staging, production), all authenticating to the same Entra application, so privileges are shared.'
    source_url: https://specterops.io/blog/2026/11/25/beyond-branch-protection-understanding-github-attack-paths/
    file: work/2026-11-27T0355Z-intel/fu2/specterops_branch.md
    passage: All three federated identity credentials facilitate authentication to the same Entra application.
    passage_verified_substring: true
  - id: '4.17'
    kind: researcher-claim
    claim: Branch protection exists for production and staging but not development, yet all three reach the same identity.
    source_url: https://specterops.io/blog/2026/11/25/beyond-branch-protection-understanding-github-attack-paths/
    file: work/2026-11-27T0355Z-intel/fu2/specterops_branch.md
    passage: The organization has implemented branch protection for production and staging, but not for development.
    passage_verified_substring: true
  - id: '4.18'
    kind: researcher-claim
    claim: 'Hardening lever the post names: distinct workload identities per environment with least privilege.'
    source_url: https://specterops.io/blog/2026/11/25/beyond-branch-protection-understanding-github-attack-paths/
    file: work/2026-11-27T0355Z-intel/fu2/specterops_branch.md
    passage: A more appropriate configuration would establish distinct workload identities for development, staging, and production, with the privileges of each identity restricted to the resources it is intended to manage.
    passage_verified_substring: true
  - id: '4.19'
    kind: researcher-claim
    claim: 'Visibility argument (and product pitch): cross-platform paths are invisible to each platform''s admins; the post positions BloodHound as the remedy (SpecterOps product marketing).'
    source_url: https://specterops.io/blog/2026/11/25/beyond-branch-protection-understanding-github-attack-paths/
    file: work/2026-11-27T0355Z-intel/fu2/specterops_branch.md
    passage: This is precisely the problem we are addressing with BloodHound.
    passage_verified_substring: true
  - id: '4.20'
    kind: researcher-claim
    claim: 'Scale anecdote (unverified): tens of thousands of GitHub-related federated credentials in customer environments; enumerating them is ''relatively straightforward''.'
    source_url: https://specterops.io/blog/2026/11/25/beyond-branch-protection-understanding-github-attack-paths/
    file: work/2026-11-27T0355Z-intel/fu2/specterops_branch.md
    passage: We have encountered customer environments containing tens of thousands of federated identity credentials associated with GitHub alone.
    passage_verified_substring: true
  - id: '4.21'
    kind: context-vendor-doc
    claim: 'Vendor doc (not from the post): wildcard subject matching in an Entra FIC is the preview ''flexible federated identity credential'' feature (restricted expression language); classic FICs require explicit matching of subject/issuer/audience.'
    source_url: https://learn.microsoft.com/en-us/entra/workload-id/workload-identities-flexible-federated-identity-credentials
    file: work/2026-11-27T0355Z-intel/fu2/msl_flexible_fic.md
    passage: Flexible federated identity credentials allow the use of a restricted expression language for matching incoming `subject` claims
    passage_verified_substring: true
  - id: '4.22'
    kind: context-vendor-doc
    claim: 'Vendor doc: for GitHub, a flexible FIC expression must match sub plus at least one immutable claim (repository_id and/or repository_owner_id); a wildcard sub bound to repository_id still trusts every branch/environment of that repository.'
    source_url: https://learn.microsoft.com/en-us/entra/workload-id/workload-identities-flexible-federated-identity-credentials
    file: work/2026-11-27T0355Z-intel/fu2/msl_flexible_fic.md
    passage: GitHub expressions must match `sub` and at least one immutable claim
    passage_verified_substring: true
  - id: '4.23'
    kind: context-vendor-doc
    claim: 'Vendor doc: the Microsoft page itself lists a wildcard-over-branches use case as the intended convenience.'
    source_url: https://learn.microsoft.com/en-us/entra/workload-id/workload-identities-flexible-federated-identity-credentials
    file: work/2026-11-27T0355Z-intel/fu2/msl_flexible_fic.md
    passage: With flexible federated identity credentials, this scenario can be managed under a single federated identity credential.
    passage_verified_substring: true
  - id: '4.24'
    kind: context-vendor-doc
    claim: 'GitHub doc: a workflow job can request an OIDC token and present it to the cloud provider; the claims (sub etc.) are what the cloud provider''s trust definition checks.'
    source_url: https://docs.github.com/en/actions/concepts/security/openid-connect
    file: work/2026-11-27T0355Z-intel/fu2/gh_oidc_concepts.md
    passage: A step or action in the workflow job can request a token from GitHub’s OIDC provider, which can then be presented to the cloud provider as proof of the workflow’s identity.
    passage_verified_substring: true
  absence_checks:
  - id: 4.A1
    claim: SpecterOps post contains no detection guidance (no audit-log, sign-in-log or detection wording), no CVE/vulnerability, no mention of the OIDC issuer, audience or id-token permission
    files:
    - work/2026-11-27T0355Z-intel/fu2/specterops_branch.md
    pattern_match_counts:
      detect: 0
      audit: 0
      sign-in: 0
      issuer: 0
      audience: 0
      id-token: 0
      \bCVE\b: 0
      vulnerab: 0
      mitigat: 0
      recommend: 0
    all_zero: true
  - id: 4.A2
    claim: 1Password's incident post does not mention Entra, federated credentials, branch protection or workload identity
    files:
    - work/2026-11-27T0355Z-intel/fu2/1password_incident.md
    pattern_match_counts:
      Entra: 0
      federat: 0
      branch protection: 0
      workload identity: 0
      OIDC: 0
    all_zero: true
  findings_for_composer:
    what_the_post_is: 'SpecterOps (Jared Atkinson, blog category BloodHound), 2026-11-25. A lab walkthrough in a fictional enterprise (''K-Nexus Global'') of how GitHub permissions, branch protection and Entra workload identity federation compose into attack paths, rendered with BloodHound edges GH_CanAssumeIdentity and AZMGGrantAppRoles. It is a configuration-exposure argument and a BloodHound pitch; no exploitation observed, no CVE, no product flaw (script check 4.A1: no CVE/vulnerab hits), no real victim.'
    conditions_exact:
    - 'The post does not number its conditions. Its text carries FOUR elements, not the three S3 listed (S3 omitted the branch-creation element and folded repository secrets into the FIC point):'
    - 1. Organization default repository permission = write (claim 4.07), so every member has effective write to applicable repositories.
    - 2. An Entra federated identity credential trusts a repository-wide subject with a wildcard ('repo:<org>/<repo>:*', 'flexible claims matching with a wildcard'), so trust is not restricted to a branch or environment (claims 4.09, 4.10). Repository-level Actions secrets are likewise not restricted to protected branches (4.15).
    - 3. The organization 'has not restricted the creation of arbitrary branches' (4.11), so a branch outside the protection rule can satisfy the trust.
    - 4. The federated Entra service principal can grant Microsoft Graph application roles (4.12; edge AZMGGrantAppRoles; the post does not name the Graph permission).
    - 'Starting assumption (not a condition of the environment): the adversary already controls a member''s GitHub identity (4.05).'
    attack_path: 'Stated only as a graph of relationships, not as exploit steps: compromised workstation -> AD identity -> Okta -> GitHub identity (EMU) -> write access via default permission -> GitHub Actions context on a branch that satisfies the repository-wide FIC -> Entra service principal -> ability to grant Graph application roles -> Tier Zero. The post never narrates creating a branch, pushing a workflow, requesting an OIDC token or exchanging it; those intermediate steps are collector inference from the mechanics (GitHub: a job can request an OIDC token and present it to the cloud provider, 4.24). The ''every member ... has an attack path to Tier Zero'' result is the author''s graph-derived claim about the lab (4.13), not a demonstrated run.'
    entra_and_github_settings: 'Entra: federated identity credential subject pattern with wildcard; the post says ''flexible claims matching''. It does not mention the issuer, audience or the immutable-claim requirement (script check). Vendor docs (context, not from the post): wildcard subject matching is Microsoft''s ''flexible federated identity credential'' (marked preview), created via Graph beta / ARM preview API with a claimsMatchingExpression; for GitHub the expression must match sub plus at least one immutable claim (repository_id and/or repository_owner_id), so a repo-bound wildcard still trusts every branch and environment of that repository (4.21, 4.22). GitHub: organization default repository permission; whether members can create arbitrary branches (the post names no specific ruleset or setting for this); branch protection scope; repository-level Actions secrets. Second pattern: one FIC per branch all mapped to one Entra application, so privileges are shared and the unprotected development branch equals production (4.16, 4.17).'
    detect: The post gives NO detection content (no Entra sign-in or audit log, no GitHub audit-log field, no hunt logic; script check 4.A1). The only enumeration hint is that listing federated credentials is 'relatively straightforward' (4.20 text). Any telemetry statements in the entry must be labelled collector-derived concepts, as S3 already flagged.
    harden: 'From the post: distinct workload identities per environment with privileges limited to what each manages (4.18); do not treat branch protection as a boundary for repository-level secrets or repository-wide federated trust (4.15); evaluate GitHub, Okta, AD and Entra relationships as one path (4.19, product pitch). Vendor-doc context: bind wildcard flexible FICs to repository_id and avoid wildcard where branch or environment scoping is possible (inference from 4.22, label as such).'
    cve_or_product_flaw: 'None. Script check 4.A1: zero matches for CVE and vulnerab. It is a design/configuration finding.'
    link_to_1password: 'The post links 1Password''s incident page once, in its opening paragraph, as the occasion for online discussion about branch protection and MFA (4.01), and says it will not speculate about the incident''s specifics (4.02). 1Password''s own post never mentions Entra, federation, branch protection or workload identity (script check 4.A2: 0 matches); it says an attacker used an employee''s GitHub account to push malicious code to backend services (4.03). So: no stated causal link; composer must not imply the 1Password intrusion used this path. The existing store entry is entries/2026-11-26/1password-employee-github-account-backend-compromise.md (its sourcing_note already says the account-compromise route is not disclosed).'
    corrections_to_S3_draft:
    - S3 summary says 'Three conditions combine' with default-write, wildcard FIC and Graph-role-granting SP; the post's text also carries unrestricted branch creation (4.11) as a distinct element and lists repository secrets alongside the FIC. Use the four elements above or say 'several conditions'.
    - S3 techniques [T1078.004, T1528, T1098.003, T1199] are not stated by the post (it names no ATT&CK ids); they are collector mappings. T1098.003 fits Graph role grant and T1078.004 fits cloud-account/workload-identity use; T1528 and T1199 are weaker. Composer should keep only what the described behavior supports.
    - S3 extended_notes Detection (Entra audit/sign-in logs, GitHub audit log) are collector-derived; the post names none. Keep labelled as concepts.
    - S3 'region_nexus/primary_sector_nexus' are collector judgements; the post says nothing about public-sector or Swiss use and does not name GitHub Enterprise Managed Users as required for the FIC issue (EMU appears only as the lab's identity integration).
    verdict: 'MARGINAL: clears the ''do something different within 7 days'' bar only for organizations that run GitHub Actions federated to Entra, where a defender can within a week list FICs with wildcard subjects and their service principals'' Graph app-role grants and check the GitHub organization default repository permission and branch-creation rules. For everyone else it is awareness of a design pattern. Weakening facts: lab scenario, graph-derived claim not a demonstrated exploit, no detection content, no CVE, vendor-marketing context (BloodHound), single source, wildcard FICs rest on a Microsoft preview feature. Recommend at most a short notable-low configuration-exposure entry (2 to 4 sentences, researcher claim attributed, 1Password only as the occasion) or drop if the relevance gate does not admit configuration-research items for this constituency; mark borderline.'
