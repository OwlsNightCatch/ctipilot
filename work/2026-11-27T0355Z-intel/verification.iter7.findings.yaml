  item: "Zammad: Contradiction paragraph, claim 538f7f103c / ledger tail of the sentence"
  url_or_quote: "entry: \"neither source reconciles the two, so the entry quotes both\" | https://csirt.divd.nl/cases/DIVD-2026-00014/ metrics table: \"Mean Time to Acknowledge (MTTA) | 07:20:51 | Time between first alert and SOC pickup\" and \"Mean Time to Respond (MTTR) | 19:16:51 | Time between first attack and formal response\""
  summary: "The cited DIVD case page itself separates the two events: its metrics table lists 07:20:51 to SOC pickup (the report's 03:04 first look) and 19:16:51 to formal response (alert 19:43:09 plus 19:16:51 is 15:00 UTC, the report's CISO-notification time of 15:06). So the sentence 'neither source reconciles the two' misstates the case page, which supplies the distinction. Fix: say the case page's table gives 7 h 21 min to acknowledgement and about 19 h to formal response, matching the report's 03:04 pickup and 15:06 CISO notification, and keep the Contradiction line only for the shared term 'first response'."
