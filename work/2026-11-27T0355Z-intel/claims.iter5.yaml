    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "body"
    kind: cited
    text: "CERT.at lists NGINX Plus 37.3.0.1 and 37.0.8.1 as fixing four of the five (CVE-2026-123007, CVE-2026-121810, CVE-2026-123633 and CVE-2026-113425); it also says 37.2.0.1 and 37.0.7.1 already carry the fix for CVE-2026-123633 but stay affected by CVE-2026-123007 and CVE-2026-121810, and NGINX Plus R33 to R36 have no update (translated from German) ("
    urls: ["https://www.cert.at/de/warnungen/2026/11/kritische-sicherheitslucken-in-nginx-plus-und-nginx-open-source-updates-verfugbar"]
  - claim_id: 8ebf218fed
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "body"
    kind: cited
    text: "**Exposure:** an nginx build from the first affected release of each flaw (1.9.5, 1.19.7, 0.6.18, 1.25.0 and 0.5.33) up to 1.31.8 whose configuration uses the feature: an HTTP/2 or HTTP/3 listener, the resolver with variable proxy_pass destinations plus mirror or SSI, or the mail proxy with auth_http ("
    urls: ["https://nginx.org/en/security_advisories.html", "https://xint.io/blog/nginx2root-remote-code-execution"]
  - claim_id: 673b9baa5e
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "body"
    kind: cited
    text: "A distribution backport can fix a flaw without changing the version nginx -v reports ("
    urls: ["https://xint.io/blog/nginx2root-remote-code-execution"]
  - claim_id: ece39016e2
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "body"
    kind: cited
    text: "Veeam Software Appliance and Infrastructure Appliance 13.1 are affected by the two HTTP/2 flaws and cannot disable HTTP/2; Veeam ships the fix through Veeam Updater ("
    urls: ["https://www.veeam.com/kb4976"]
  - claim_id: b5fca44a8a
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "body"
    kind: cited
    text: "GitLab's Linux package and Docker images carry nginx 1.31.9 from 19.6.2, 19.5.9 and 19.4.11 ("
    urls: ["https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-6-2-released/"]
  - claim_id: 62589ae8d5
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "body"
    kind: cited
    text: "**Detection:** process-creation or audit telemetry for any program started by the worker's user, since a normal nginx worker runs no external programs and that is the clearest sign of success; worker exits and core dumps in the error log mark attempts, not successes ("
    urls: ["https://xint.io/blog/nginx2root-remote-code-execution", "https://cert.europa.eu/publications/security-advisories/2026-022/"]
  - claim_id: b68ef3030d
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "body"
    kind: cited
    text: "**Triage:** a large upload is a legitimate cause of an inbound-heavy connection and workers crash for unrelated reasons, so a program started by the worker is the discriminator, not the traffic shape alone ("
    urls: ["https://xint.io/blog/nginx2root-remote-code-execution"]
  - claim_id: e30638e785
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** update and restart nginx, because a configuration reload does not replace the running executable; disabling HTTP/2 on exposed listeners blocks only the two HTTP/2 flaws and, if it stays on elsewhere, leaves connection pressure ("
    urls: ["https://unit42.paloaltonetworks.com/cve-2026-123633-nginx-http2-vulnerability/"]
  - claim_id: ac878a8e81
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "body"
    kind: cited
    text: "), and Xint gives interim measures for the others: a fixed upstream group in place of request-time DNS lookups for CVE-2026-123634, no QUIC listeners for CVE-2026-121810 and bound or firewalled mail listeners for CVE-2026-113425 ("
    urls: ["https://xint.io/blog/nginx2root-remote-code-execution"]
  - claim_id: 629d272dc8
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "body"
    kind: cited
    text: "An empty execution-audit result after the update cannot rule out an earlier compromise, and Xint chained CVE-2026-123007 with a separate Linux kernel SCTP flaw, unpatched when it published, to reach root on the host and escape a Docker container; hosts that do not use SCTP can block the module from loading ("
    urls: ["https://xint.io/blog/nginx2root-remote-code-execution"]
