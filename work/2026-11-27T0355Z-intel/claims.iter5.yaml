    surface: "section 2026-11-27T04:55:00Z"
    kind: cited
    text: "A fix has been in the Veeam repository since 2026-11-25, Veeam Updater checks every 12 hours and installs mandatory updates automatically on the nearest Sunday at 14:00, and until it is installed Veeam says to restrict TCP 443 on the appliances to trusted networks, because HTTP/2 cannot be disabled on them ("
