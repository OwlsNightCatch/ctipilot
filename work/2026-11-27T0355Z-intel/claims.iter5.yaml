  - claim_id: e50d4954a8
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every Puppet Enterprise server to 2023.8.13, 2025.12.1 or 2026.0.1 (Puppet Core to 9.1.3 or 8.22.2, OpenVox Agent to 9.3.0 or 8.32.0 and OpenVox Server to 9.2.0 or 8.18.0; open-source Puppet gets no fix) and, until the upgrade is in, stop the CA from autosigning certificate requests without strong verification and audit the certificates it issued for names nobody enrolled or that collide with an existing node name, because CISA lists the deserialization flaw as exploited, any holder of a CA-signed agent certificate reaches code execution on the server and a colliding name authenticates as another host."
  - claim_id: fbdfbb9224
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "body"
    kind: cited
    text: "CISA added CVE-2026-115731 to its Known Exploited Vulnerabilities catalog on 2026-11-17 on evidence of active exploitation, naming no actor or victim ("
    urls: ["https://www.cisa.gov/news-events/alerts/2026/11/17/cisa-adds-one-known-exploited-vulnerability-catalog"]
  - claim_id: f5f2af9b61
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "body"
    kind: cited
    text: "The flaw sits in Puppet's report-processing code as used by Puppet Server: a client that holds any CA-signed agent certificate can run arbitrary code on the server as its service user by sending a report with a crafted rich-data type in a PUT request, and where the certificate authority autosigns requests without strong verification an unauthenticated network attacker can first obtain such a certificate ("
