    surface: "section 2026-11-27T04:54:00Z"
    kind: cited
    text: "ARTEX draws intents, facts, findings, hints and digests from one counter per installation that is never reset by default, so intent numbers climb across runs and targets and consecutive ones are rare, and it puts the number in its working directory, its session name and its prompt; Cairn formats zero-padded counters per object type and resets them for every project ("
    urls: ["https://www.wiz.io/blog/agentic-offensive-frameworks-intent-ids-artex-cairn"]
