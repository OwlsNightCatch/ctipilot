    surface: "body"
    kind: cited
    text: "**Triage:** Python and curl user agents match common legitimate automation, so Expel treats them as supporting evidence only, and on the two ConnectWise applications Huntress reviewed, which call Graph with a .NET SDK, a Python user agent is the anomaly ("
    urls: ["https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/"]
