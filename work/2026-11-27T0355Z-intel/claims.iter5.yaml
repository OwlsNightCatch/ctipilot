    surface: "section 2026-11-27T04:54:00Z"
    kind: cited
    text: "The numbers surface wherever an API takes a name or comment: AWS role session names, SSM command comments, KMS key descriptions and aliases, security-group rule descriptions, Azure run-command, VM and app-registration names, and the error message of a denied call ("
    urls: ["https://www.wiz.io/blog/agentic-offensive-frameworks-intent-ids-artex-cairn"]
  - claim_id: 91a0ba3ca7
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-27T04:54:00Z"
    kind: cited
    text: "Wiz uses them to link activity across rotating residential-proxy addresses and victims, to separate installations and to read scope from a jump far larger than the activity in one victim's logs, and cautions that hits are tool markers and pacing clues, not operator fingerprints: unrelated installations collide in the same ranges and operators reset or parallelise ("
    urls: ["https://www.wiz.io/blog/agentic-offensive-frameworks-intent-ids-artex-cairn"]
