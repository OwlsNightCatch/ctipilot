    text: "Huntback, which runs decoy servers, reports that on 2026-11-19 one decoy received the whole chain from one address in 1.47 seconds: a certificate request for a generated node name, a fetch of the signed certificate 1.4 seconds later that tests whether the CA autosigns, and a report upload carrying a type definition with a Ruby method annotation."
  - claim_id: e4be46e452
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "section 2026-11-27T04:58:00Z"
    kind: cited
    text: "Huntback, a research firm that runs decoy servers, captured the whole exploit chain on one Puppet Server decoy on the morning of 2026-11-19, in 1.47 seconds from one address ("
    urls: ["https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured"]
  - claim_id: 34b381fc30
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "section 2026-11-27T04:58:00Z"
    kind: cited
    text: "The chain is a bare certificate request for a generated node name, which a CA that asks for a shared secret or other proof would refuse, a fetch of the signed certificate 1.4 seconds later without polling, which answers 200 only where the CA signs automatically, and a report upload whose wrapper is ordinary and whose event carries a type definition with a Ruby method annotation ("
    urls: ["https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured"]
  - claim_id: 668e2800d3
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "section 2026-11-27T04:58:00Z"
    kind: cited
    text: "Huntback reads it as a check for vulnerable servers: the decoy signed the certificate, accepted the report with a 200 and returned no marker, and the same address had tried exploits for four other products in the previous ten days ("
    urls: ["https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured"]
  - claim_id: 1096cd85c5
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "section 2026-11-27T04:58:00Z"
    kind: cited
    text: "Huntback's advice is to list the signed certificates (`puppetserver ca list --all`) and account for every name, to refuse at a reverse proxy any report that contains a type definition, which no agent sends, and to keep TCP 8140 closed to networks that are not agents'; none of this is vendor guidance ("
    urls: ["https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured"]
  - claim_id: 3b22fade11
