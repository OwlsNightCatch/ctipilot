    urls: ["https://docs.nginx.com/nginx/releases/"]
  - claim_id: 397cc1944c
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "section 2026-11-27T04:55:00Z"
    kind: cited
    text: "Veeam's KB4976 lists Veeam Software Appliance 13.1 and Veeam Infrastructure Appliance 13.1 as affected by CVE-2026-123007 and CVE-2026-123633, because their nginx has HTTP/2 enabled on a listener that proxies requests to a backend; the other three flaws do not apply ("
