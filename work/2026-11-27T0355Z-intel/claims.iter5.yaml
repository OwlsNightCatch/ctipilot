    text: "The Ruby project released 4.0.10, 3.4.13 and 3.3.14 on 2026-11-18 for seven memory-corruption flaws in the regexp engine and in string case conversion, three rated Critical, and says it knows of proofs of concept that reach remote code execution. Veria Labs, which found the case-conversion flaw independently (CVE-2026-132825, a one-byte heap overflow), says Rails and classic-style Sinatra are exposed without authentication in their default configuration and announced a code-execution proof of concept on stock Rails for 25 November 2026, which its page, blog feed and GitHub organisation did not show as released on 2026-11-27; no exploitation is reported. GitHub Enterprise Server and older GitLab branches now carry the fix. Ruby 3.2 and earlier are end of life, and the interpreter itself, not a gem, must be updated."
