  - claim_id: 95fa3c020e
    entry: 2026-11-27/cve-2026-99362-nfs2root-linux-nfsd-unauth-heap-overflow-root
    surface: "headline"
    kind: frontmatter
    text: "NFS2ROOT: Linux nfsd pre-auth heap overflow, root shell claimed; limit TCP 2049, Ubuntu and RHEL 9/10 not fixed"
  - claim_id: e11f0f5d49
    entry: 2026-11-27/cve-2026-99362-nfs2root-linux-nfsd-unauth-heap-overflow-root
    surface: "summary"
    kind: frontmatter
    text: "CVE-2026-99362 is an unauthenticated heap overflow in the Linux kernel NFS server (nfsd) over NFSv4.1 or 4.2, scored CVSS 3.1 9.8 in the CVE record, that OpenSec says it turned into a root shell with one TCP connection to port 2049. It is fixed upstream in 6.12.117, 6.18.61, 7.3.2 and 7.4-rc1 (later also 5.10.275, 5.15.226, 6.1.193 and 6.6.163), but on 2026-11-27 Ubuntu and RHEL 9 and 10 list no fixed kernel; the exploit is private and no exploitation is reported."
  - claim_id: 7b55d41baf
    entry: 2026-11-27/cve-2026-99362-nfs2root-linux-nfsd-unauth-heap-overflow-root
    surface: "actions[0]"
    kind: frontmatter
    text: "On every Linux host that serves NFS (nfsd loaded, NFSv4.1 or 4.2 on, TCP 2049 listening on a non-loopback address), limit TCP 2049 to the storage network now, where clients do not need NFSv4.1 and 4.2 set vers4.1=n and vers4.2=n in /etc/nfs.conf and restart nfs-server, then install the first kernel your distribution ships for CVE-2026-99362 and reboot, because Ubuntu and RHEL 9 and 10 list no fixed kernel on 2026-11-27 and OpenSec says one unauthenticated connection reaches a root shell."
  - claim_id: f222f0b544
    entry: 2026-11-27/cve-2026-99362-nfs2root-linux-nfsd-unauth-heap-overflow-root
    surface: "cves[CVE-2026-99362]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-99362\", \"cvss\": \"9.8\", \"status\": [\"patch-available\"], \"affected\": \"Linux kernel from 3.16 to before 6.12.117, 6.18.61, 7.3.2 and 7.4-rc1 (and 5.10.275, 5.15.226, 6.1.193, 6.6.163 on those branches), on hosts that serve NFSv4.1 or 4.2 through nfsd\", \"fixed\": \"6.12.117, 6.18.61, 7.3.2, 7.4-rc1; 5.10.275, 5.15.226, 6.1.193, 6.6.163 in the updated CVE record; distribution kernels per vendor\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 6c2d56f937
    entry: 2026-11-27/cve-2026-99362-nfs2root-linux-nfsd-unauth-heap-overflow-root
    surface: "body"
    kind: cited
    text: "CVE-2026-99362 is a heap out-of-bounds write in the Linux kernel's NFS server: nfsd4_sequence() narrows the reply buffer to the session's cached-reply limit before it accepts the slot sequence id, a client can negotiate that limit down so every slot has a zero-length buffer, and the server then caches a whole reply into a buffer with no room; the flaw has been present since Linux 3.16 ("
    urls: ["https://lore.kernel.org/linux-cve-announce/2026111950-CVE-2026-99362-c6f2@gregkh/"]
  - claim_id: 2d3971ad4f
    entry: 2026-11-27/cve-2026-99362-nfs2root-linux-nfsd-unauth-heap-overflow-root
    surface: "body"
    kind: cited
    text: "The announcement lists fixes in 6.12.117, 6.18.61, 7.3.2 and 7.4-rc1, and the record was later updated with 5.10.275, 5.15.226, 6.1.193 and 6.6.163 ("
    urls: ["https://euvdservices.enisa.europa.eu/api/search?text=CVE-2026-99362"]
  - claim_id: 87ffec15a9
    entry: 2026-11-27/cve-2026-99362-nfs2root-linux-nfsd-unauth-heap-overflow-root
    surface: "body"
    kind: cited
    text: "OpenSec, which reported it, says an unauthenticated client reaches a root shell with one TCP connection to port 2049 over NFSv4.1 or 4.2, shows this in its own recording and says its exploit stays private ("
    urls: ["https://opensec.in/blog/nfs2root-cve-2026-99362"]
  - claim_id: 87b9ab7104
    entry: 2026-11-27/cve-2026-99362-nfs2root-linux-nfsd-unauth-heap-overflow-root
    surface: "body"
    kind: cited
    text: "). watchTowr reports no exploitation in the wild as of 2026-11-26 ("
    urls: ["https://watchtowr.com/intelligence/nfs2root-linux-nfs-cve-2026-99362-faq/"]
  - claim_id: cb45aff710
    entry: 2026-11-27/cve-2026-99362-nfs2root-linux-nfsd-unauth-heap-overflow-root
    surface: "body"
    kind: cited
    text: "), and the fix with its root-cause text has been public on the linux-nfs list since 2026-08-17 ("
    urls: ["https://lore.kernel.org/linux-nfs/20260817-jean-v1-1-9e356596ab85@kernel.org/"]
  - claim_id: 32aeed02f5
    entry: 2026-11-27/cve-2026-99362-nfs2root-linux-nfsd-unauth-heap-overflow-root
