    text: "Inventory every Windows endpoint that installed or updated Q-Dir or DesktopOK since 2026-10-28, compare each installer's SHA-256 with the value on SoftwareOK's download page, and isolate any host with a bundled Python interpreter under ProgramData or a scheduled task that runs one, treating its credentials as stolen, because ASEC says simply uninstalling and reinstalling the program may not remove a Python RAT already installed."
