    text: "); treat any internet-reachable instance on 6.3.0 to 6.5.4 since 2026-09-21 as possibly compromised, including the ticket data and anything the host can reach, since NCSC-NL says an attacker can take over the system, read, change or delete data and use it for further attacks ("
