    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "Wiz also reports that ARTEX and Cairn write a numeric intent ID into names the agent creates (ARTEX `i<N>`, a per-installation counter unreset by default; Cairn `i001`, reset per project), visible in AWS role session names, SSM comments, tags and Azure resource names; pair it with an anchor ("
