  - claim_id: 766f17e3f5
    entry: 2026-11-18/mitel-micollab-misa-2026-0012-awv-unauth-command-injection
    surface: "summary"
    kind: frontmatter
    text: "Mitel's advisory MISA-2026-0012 of 2026-11-16, revised on 2026-11-24 to list the CVE ids, covers five flaws in the Audio, Web and Video Conferencing (AWV) component of MiCollab 10.3 (10.3.0.18) and earlier, led by an unauthenticated blind command injection scored CVSS 3.1 10.0 (CVE-2026-133323) and an unauthenticated XML injection scored 9.0 that could run commands (CVE-2026-133303). CISA added all five to its Known Exploited Vulnerabilities catalogue on 2026-11-25 without naming an actor, victim or technique, while Mitel's own page says nothing on attacks; Accenture APEX Labs reports exploitation before Mitel's 2026-11-16 advisory, with web-shell activity at one victim before 23:00 UTC on 2026-11-15 and root within about 30 minutes, so a server patched now cannot be assumed clean. Mitel offers a patch through its portal (KB000129195) and says restricting external access to the AWV component reduces the risk; the 10.3.0.18 release that Mitel named as the fix for its July advisory is itself in the affected range."
  - claim_id: 3317fa057a
    entry: 2026-11-18/mitel-micollab-misa-2026-0012-awv-unauth-command-injection
    surface: "actions[0]"
    kind: frontmatter
    text: "On every MiCollab on 10.3 (10.3.0.18) or earlier whose AWV component was reachable from outside, including through a MiVoice Border Gateway web proxy, take a forensic image first, then apply Mitel's patch KB000129195 (after moving to 10.3.0.18 where needed) and restrict external access to the Audio, Web and Video Conferencing component, then reset the LDAP connector account and any Kerberoastable service accounts and rotate administrator, SIP trunk and file-share credentials, because APEX Labs found exploitation before Mitel's advisory, root within about 30 minutes and directory credentials taken from the LDAP configuration."
