    entry: 2026-11-27/cve-2026-99362-nfs2root-linux-nfsd-unauth-heap-overflow-root
    surface: "body"
    kind: cited
    text: "Red Hat says default RHEL does not run nfsd, which limits the attack surface to systems configured to export NFSv4.1 or 4.2 shares ("
    urls: ["https://access.redhat.com/security/cve/cve-2026-99362"]
  - claim_id: 561d54d935
    entry: 2026-11-27/cve-2026-99362-nfs2root-linux-nfsd-unauth-heap-overflow-root
    surface: "body"
    kind: cited
    text: "OpenSec's test is nfsd loaded, `/proc/fs/nfsd/versions` showing +4.1 or +4.2 and a listener on port 2049 on a non-loopback address, with a kernel older than the fixed one and no distribution backport ("
    urls: ["https://opensec.in/blog/nfs2root-cve-2026-99362"]
  - claim_id: ad3e1f07ac
    entry: 2026-11-27/cve-2026-99362-nfs2root-linux-nfsd-unauth-heap-overflow-root
    surface: "body"
    kind: cited
    text: "**Detection:** OpenSec says the traffic is valid NFS with no network signature and names kernel warnings from nfsd4_check_resp_size, oopses with nfsd4, svc or call_usermodehelper frames, shells spawned by kernel workers on a file server and bursts of short NFSv4.1 sessions from one source; no vendor confirms these ("
    urls: ["https://opensec.in/blog/nfs2root-cve-2026-99362"]
  - claim_id: 24254a675c
    entry: 2026-11-27/cve-2026-99362-nfs2root-linux-nfsd-unauth-heap-overflow-root
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** on NFS servers, restrict TCP 2049 to trusted networks, the step OpenSec, watchTowr and Red Hat all name, or stop nfs-server where it is not needed ("
    urls: ["https://access.redhat.com/security/cve/cve-2026-99362"]
  - claim_id: f70649f4a0
