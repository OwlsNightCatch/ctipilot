  - claim_id: aa6e40d519
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "summary"
    kind: frontmatter
    text: "DIVD, the Dutch vulnerability-disclosure CSIRT, says attackers entered its network on 2026-09-21 through two Zammad flaws it calls previously unknown: CVE-2026-102489, a session hijack leading to code execution as the zammad user in versions 6.3.0 to 6.5.4, and CVE-2026-102490, a local escalation from that user to root. NCSC-NL states both have been exploited since 21 September and CISA listed both in KEV on 2026-10-02; Zammad says the code-execution flaw is exploitable only on 6.5 and older, and Horizon3 published the root cause and a working exploit for it on 2026-10-07. Zammad 7.2.2 (2026-10-08) fixes the root escalation, which affects only DEB and RPM (packager.io) installations, Zammad 7.2.3 of 2026-11-11, a critical security update, supersedes it, and 6.5.5 (2026-10-15) is an emergency fix for the code-execution flaw in the otherwise unsupported 6.5 series; 7.2.1 (2026-10-06) had fixed 27 newly published advisories in 7.2.0 and earlier, two rated critical, none with a CVE id and none reported exploited. DIVD's forensic report of 2026-11-25 says the attacker likely used ARTEX and moved from the Zammad host to Jira and Confluence by ARP poisoning and forged administrator session tokens."
  - claim_id: 83a282c27a
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "actions[0]"
    kind: frontmatter
    text: "Copy the application and network logs of every self-hosted Zammad instance, then upgrade it to Zammad 7.2.3, the critical security update of 2026-11-11 that supersedes 7.2.2, and add the Remote-User header-clearing line next to X-Forwarded-User in its nginx or Apache2 configuration (the Docker images apply it automatically); a 6.5 instance that cannot be upgraded yet gets the 6.5.5 emergency fix from Zammad's new 6.5 package repository, and an older instance that cannot be upgraded goes offline."
  - claim_id: dbb8ef912b
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "actions[1]"
    kind: frontmatter
    text: "On every instance that was internet-reachable on 6.3.0 to 6.5.4 since 2026-09-21, run DIVD's log-check script, and treat a hit, or any DEB or RPM host where code ran as the zammad account, as compromised, rotating every credential its database held (mail-channel passwords, OAuth client secrets and refresh tokens, API tokens) and revoking cloud OAuth tokens as well as isolating the host, because DIVD's forensic report shows the attacker read those tables and network isolation does not revoke tokens."
