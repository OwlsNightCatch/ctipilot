  - claim_id: c66db95a41
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "section 2026-11-27T04:56:00Z"
    kind: cited
    text: "DIVD published the forensic report on its September breach on 2026-11-25 ("
    urls: ["https://csirt.divd.nl/2026/11/25/full-disclosure-our-hack/"]
  - claim_id: 9449bd212e
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "section 2026-11-27T04:56:00Z"
    kind: cited
    text: "It says the attacker likely used ARTEX, on the basis of 990 scripts and 3,259 output files, scripts commented in an LLM style, a Zammad administrator account and API token named with an artex- prefix and a number, ARTEX strings in an e-mail subject and the numeric job IDs that ARTEX's intents use; it names no actor ("
    urls: ["https://csirt.divd.nl/downloads/DIVD-2026-00014/DIVD-2026-00014-forensics-report.pdf"]
  - claim_id: 4ccf19453f
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "section 2026-11-27T04:56:00Z"
    kind: cited
    text: "Root followed through the second flaw: a service that runs as root read configuration from a directory the zammad account owned, and a dropped file plus a kill of the web worker, which the supervisor restarted, gave root by 19:46 and left a setuid copy of bash ("
    urls: ["https://csirt.divd.nl/downloads/DIVD-2026-00014/DIVD-2026-00014-forensics-report.pdf"]
  - claim_id: c27697d634
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "section 2026-11-27T04:56:00Z"
    kind: cited
    text: "The report says TLS on the database links would have stopped the injection, asks for deny-by-default micro-segmentation inside the VLAN and says a containerised Zammad would have prevented the root step ("
    urls: ["https://csirt.divd.nl/downloads/DIVD-2026-00014/DIVD-2026-00014-forensics-report.pdf"]
  - claim_id: 5a69188689
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "section 2026-11-27T04:56:00Z"
    kind: cited
    text: "NVISO says the content of the two shared mailboxes up to the credential and session resets must be considered potentially compromised, and that tokens were re-issued after the network isolation, so network isolation alone does not revoke cloud OAuth access ("
    urls: ["https://csirt.divd.nl/downloads/DIVD-2026-00014/DIVD-2026-00014-forensics-report.pdf"]
  - claim_id: dabc61bde3
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "section 2026-11-27T04:56:00Z"
    kind: cited
    text: "A volunteer first looked at it at 03:04 on 09-22, 7 h 21 min later; the CISO was informed at 15:06, 19 h 23 min after the alert; and isolation completed at 23:24, 27 h 41 min after it ("
    urls: ["https://csirt.divd.nl/downloads/DIVD-2026-00014/DIVD-2026-00014-forensics-report.pdf"]
  - claim_id: 47ff5f9c39
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "section 2026-11-27T04:56:00Z"
    kind: cited
    text: "Contradiction: DIVD's case page says \"it took us 19 hours to initiate our first response on 22 September 2026\" ("
    urls: ["https://csirt.divd.nl/cases/DIVD-2026-00014/"]
  - claim_id: 538f7f103c
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "section 2026-11-27T04:56:00Z"
    kind: cited
    text: "), while the report says \"The first response to these alerts was observed on Sep 22nd 2026 at 03:04 UTC\", 7 h 21 min after the alert, and puts the CISO notification at 15:06 ("
    urls: ["https://csirt.divd.nl/downloads/DIVD-2026-00014/DIVD-2026-00014-forensics-report.pdf"]
  - claim_id: c21471e5e3
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "section 2026-11-27T04:56:00Z"
    kind: cited
    text: "The report counts about 39 hours of actor interaction in the cloud, to 08:33 on 2026-09-23 ("
    urls: ["https://csirt.divd.nl/downloads/DIVD-2026-00014/DIVD-2026-00014-forensics-report.pdf"]
  - claim_id: 6f75f7b459
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "section 2026-11-27T04:56:00Z"
    kind: uncited
    text: "The chain at behaviour level: the attacker probed the perimeter from 07:40 UTC on 2026-09-21; an administrator logged in to Zammad at 18:53 and the WebSocket flaw yielded that session cookie 1.3 seconds later; the replayed session wrote a file through the package-upload endpoint at 19:06 and a malicious Ruby mail template as an override of a mailer view at 19:27, which a user-creation request rendered, giving code execution as the zammad user at 19:27:58."
  - claim_id: bb7aacd8fa
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "section 2026-11-27T04:56:00Z"
    kind: uncited
    text: "Command and control ran through a Zammad API endpoint, with files staged in the web-served directory and fetched back through the egress proxy because direct outbound traffic was blocked."
  - claim_id: e76da99f43
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "section 2026-11-27T04:56:00Z"
    kind: uncited
    text: "From the Zammad host, in the same web-application VLAN as Jira and Confluence, the attacker sniffed passively from 21:19 and from about 01:37 on 2026-09-22 ran ARP-poisoning scripts, reaching a man-in-the-middle position between Confluence and its PostgreSQL database at 02:27."
  - claim_id: 612e0e8f3f
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "section 2026-11-27T04:56:00Z"
    kind: uncited
    text: "The link was unencrypted, so it read the database protocol, learned the schema from captured traffic and injected its own SQL into live connections, writing a remember-me session token of its choosing for an administrator into Confluence's token table and presenting it at 08:49; Jira followed through its OAuth tables and a replay of remember-me tokens at 14:08."
  - claim_id: 7e04c547ac
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "section 2026-11-27T04:56:00Z"
    kind: uncited
    text: "Persistence was a new Zammad administrator account and API tokens, a root-run systemd loop with Restart=always and cron entries that run text files dropped in the web-served directory, and an edit of Zammad's Google sign-in initializer that switched the access type to offline and added the Gmail scope, which captured nothing because no user signed in while it was live."
  - claim_id: f0fed32eae
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "section 2026-11-27T04:56:00Z"
    kind: uncited
    text: "Credentials taken included the hosting provider's mailbox password in cleartext, OAuth tokens for the two shared mailboxes, the database password, an Elastic credential and Jira's OAuth consumer key and password hashes."
  - claim_id: 116b59561f
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "section 2026-11-27T04:56:00Z"
    kind: uncited
    text: "The alert fired at 19:43 UTC on 2026-09-21."
  - claim_id: a96770f148
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "record 2026-11-27T04:56:00Z"
    kind: record-summary
    text: "DIVD's forensic report of 2026-11-25 says the attacker likely used ARTEX and moved from the Zammad host to Jira and Confluence by ARP poisoning an unencrypted database link and forging administrator session tokens, took credentials from Zammad's database, and kept cloud OAuth access after network isolation. The alert fired 7 h 21 min before a volunteer looked at it and 19 h 23 min before the CISO was informed; containment finished 27 h 41 min after it."
  - claim_id: 0d514a5ac2
    entry: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
    surface: "headline"
    kind: frontmatter
    text: "PAN-OS management interfaces rooted via PHP2Shell and a kernel flaw, both exploited per Palo Alto: hotfix, then check"
  - claim_id: 2fa0eedeef
    entry: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
    surface: "summary"
    kind: frontmatter
    text: "Palo Alto Networks' advisory, first published on 2026-10-21 and revised since, says active exploitation has been observed against PAN-OS management interfaces exposed to the internet, and Dream Research, with Unit 42's verification, reports a custom PHP2Shell build chained with a Linux kernel flaw that rooted 25 PAN-OS firewall and management servers in the United States, Japan, Taiwan and South Korea and went on to attack a US government-affiliated Active Directory. The advisory lists every release below the hotfix for its train, of PAN-OS 12.2, 12.1, 11.2, 11.1 and 10.2 and of Panorama, as affected through the management web interface by CVE-2026-109618 and CVE-2026-109619 (CVSS-B 9.2); all twenty hotfixes are released, and GlobalProtect and the captive portal are not affected. Palo Alto's bulletin PAN-SA-2026-0015 of 2026-11-24 says exploitation of that kernel flaw has been observed against internet-exposed management interfaces and lists a later hotfix per train that fixes it. A device that was exposed and unpatched needs a compromise check as well as the hotfix, and CISA added both PHP flaws to its Known Exploited Vulnerabilities catalog on 2026-10-26."
  - claim_id: 325ef6a85b
    entry: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
    surface: "actions[0]"
    kind: frontmatter
    text: "Take the management interface of every PA-Series and VM-Series firewall and Panorama off the internet now by restricting it to a jump box or trusted internal addresses, because Palo Alto reports active exploitation against internet-exposed management interfaces, and install the hotfix PAN-SA-2026-0015 lists for your maintenance release (12.2.4-h3; 12.1.4-h15, 12.1.7-h15, 12.1.10-h6; 11.2.4-h25, 11.2.7-h25, 11.2.10-h19, 11.2.13-h6, 11.2.16-h3; 11.1.4-h40, 11.1.6-h42, 11.1.7-h14, 11.1.10-h38, 11.1.13-h18, 11.1.16-h6; 10.2.7-h41, 10.2.10-h45, 10.2.13-h29, 10.2.16-h14, 10.2.18-h15), which includes the PHP2Shell fix and fixes the kernel flaw as well."
  - claim_id: 3a346a84b1
    entry: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
    surface: "actions[1]"
    kind: frontmatter
    text: "Rotate the directory bind account, HA replication keys, certificate private keys and device authentication keys of every PAN-OS firewall and Panorama that was reachable from the internet while unpatched and shows a PHP web shell or a tunnel, because the chain Dream Research recovered harvested exactly those from rooted firewalls, and the hotfix does not remove a web shell or tunnel already in place."
