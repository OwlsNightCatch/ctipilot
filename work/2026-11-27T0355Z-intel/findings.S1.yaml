  extended_notes: 'Detection concepts from the report (no indicators carried): web or proxy access logs showing POSTs to the AWV CGI directory (/awcuser/cgi-bin/) from unfamiliar sources followed by requests for new script
    files in a web-accessible pictures directory; round-the-clock HTTPS from a MiCollab or Border Gateway server to an unfamiliar internet host; bursts of hundreds of short HTTPS uploads from any egress address; requests from
    a MiCollab server to IP-echo services and temporary-tunnel services; JDBC drivers downloaded from a public Maven repository onto a MiCollab server; scripts and .tgz archives in /tmp and tools such as smbclient, ldapsearch,
    expect, sshpass or Impacket running on a MiCollab host; system logs that suddenly shrink. Identity: the MiCollab LDAP connector account authenticating to many domain controllers within minutes, and bursts of RC4 Kerberos
    service-ticket requests (identity-protection alerts on the connector account fired within about three hours at the victim). Triage: the connector account binding to a domain controller is normal from the MiCollab host
    itself; the discriminators are many domain controllers across the forest within about two minutes, ticket-request bursts, and use from any other source host. Post-patch compromise check (APEX): patching does not evict
    an intrusion that started earlier; image MiCollab and Border Gateway servers before patching or rebuilding, compare MiCollab logs with gateway, proxy and WAF logs (the actor edited local logs), treat a suspected compromise
    as a directory compromise (reset the LDAP connector account and Kerberoastable service accounts, review the connector''s authentications on every domain controller, rotate administrator, SIP trunk and file-share credentials
    reachable from the server), restrict external access to AWV including any path a Border Gateway web proxy publishes, and patch older MiCollab flaws (MISA-2026-0006) on servers that fell behind. Dating note: the report''s
    page metadata reads 2026-11-27 while SecurityWeek, dated 2026-11-26, already links it. The report names no ATT&CK id for the privilege-escalation method and withholds it; it lists T1070.002, which the pinned ATT&CK v20.1
    dataset has revoked in favour of T1685.006. Suggested classification B2 for the pre-disclosure and intrusion detail (single first-hand observer), exploitation itself corroborated by CISA''s KEV listing.'
