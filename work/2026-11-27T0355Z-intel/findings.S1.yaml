    (still revision 2.0 of 2026-11-24, no exploitation statement)'
  summary: 'Delta against the 2026-11-18 entry, which says no source names an exploiter, victim, scale or technique and reports CISA''s listing of all five CVEs on 2026-11-25. Accenture APEX Labs reports, from incident-response
    evidence at one victim organisation and network telemetry on a second, that the MISA-2026-0012 flaws were exploited before Mitel published its advisory and patch on 2026-11-16: web-shell activity at the first victim is
    placed before 23:00 UTC on 2026-11-15, which APEX judges with high confidence, so servers patched now cannot be assumed clean. Timeline at that victim, from APEX: the actor fingerprinted the MiCollab version, bypassed
    AWV authentication with an unauthenticated request one minute in, had two file uploads accepted at nine minutes, ran its first command through a web shell at 12 minutes, reached root between 15 and 30 minutes (system logs
    were reset as a side effect), and at 32 minutes used the directory credentials that MiCollab stores for its LDAP connector to bind to a domain controller over LDAPS; web-shell requests were then filtered out of the web-server,
    error and admin logs. It went on to authenticate to several domain controllers across the forest in about two minutes, export directory user records, Kerberoast service accounts, take plaintext credentials from internal
    file shares and test service-account credentials in bulk, and about 20 hours after the first request pivoted to an internal backup server and a line-of-business database server where custom Java tooling dumped database
    contents, which left as hundreds of short HTTPS uploads over several hours, some routed through the internal backup server. At the victim the exploitation requests passed through an internet-facing reverse proxy, so a
    proxy in front of MiCollab, including a MiVoice Border Gateway web proxy, did not protect the AWV component. A second organisation''s MiCollab server, a 10.0-series release exposed to both MISA-2026-0006 and MISA-2026-0012,
    has held a persistent HTTPS channel to the same actor infrastructure since 2026-11-09; APEX could not determine how it was compromised, so the second case does not by itself prove exploitation more than a week before disclosure.
    APEX assesses AI-assisted tooling drove parts of the intrusion because sampled traffic from the actor''s server to two commercial AI API services (7 to 17 November, 155 hours combined) restarted in the same second as the
    authentication-bypass request and commands ran during a window with no sampled operator traffic; this is an inference from sampled telemetry (moderate confidence for the AI-service use, provider names withheld), not a
    finding. APEX names no group, judges the pattern consistent with a data-theft extortion operation against MiCollab generally, and expects wider exploitation now the advisory is public. CISA''s KEV listing of 2026-11-25
    independently confirms exploitation; the pre-disclosure timing and the intrusion detail rest on Accenture alone.'
