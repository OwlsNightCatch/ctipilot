  summary: 'CVE-2026-99362 (NFS2ROOT) is a heap out-of-bounds write in the Linux kernel''s in-kernel NFS server, nfsd, reachable by an unauthenticated client over TCP 2049 when NFSv4.1 or 4.2 is served. The kernel CVE text
    says nfsd4_sequence() narrows the reply buffer to the session''s cached-reply limit before it accepts the slot sequence id, a client can negotiate that limit down to the protocol minimum so every slot gets a zero-length
    buffer, and a COMPOUND tag that fills the narrowed buffer right after the SEQUENCE opcode makes the encoder return without flagging an error; the server then caches the whole reply into a buffer with no room (the upstream
    KASAN report shows 80 bytes written, 61 past the heap object, 40 of them chosen by the client). The flaw dates from March 2014 (Linux 3.16); Jérémy Jean of ANSSI sent the upstream fix on 2026-08-17, OpenSec reports it
    flagged and exploited the bug with its Antara harness on 2026-09-21 and reported it to the NFSD maintainers on 2026-09-22, and the CVE was published with fixes on 2026-11-19 or 2026-11-20 (the sources differ by a day).
    OpenSec says its exploit chain stays private and describes it as an ordinary sequence of NFS requests: the overflow corrupts the neighbouring slot''s bookkeeping, a replay request returns 3.8 KB of kernel heap and with
    it the KASLR slide, a forged pointer frees an object of the attacker''s choice, the memory is refilled with a fake callback built from NFS client names, and hanging up makes nfsd run the callback as root; it adds that
    kernel hardening does not remove the overflow. This is the researcher''s claim, shown in a recorded demonstration; no independent reproduction is cited. Fixed kernels per watchTowr''s table are 5.10.275, 5.15.226, 6.1.193,
    6.6.163, 6.12.117, 6.18.61, 7.3.2 and mainline 7.4-rc1 (OpenSec lists 6.12.117, 6.18.61, 7.3.2 and 7.4-rc1); watchTowr says no exploitation in the wild is reported as of 2026-11-26 and no other fetched source reports any.
    Scores: CVSS 3.1 9.8 (cve.org record, EUVD, OpenSec, watchTowr), Red Hat 9.4 with its own vector and Critical rating; EUVD''s EPSS field reads 0.76. Distribution status when read: Red Hat rates it Critical and notes that
    default RHEL does not run or enable nfsd, which limits the exposure to systems configured to export NFSv4.1 or 4.2 shares; Debian lists trixie 6.12.117-1 and the bookworm linux-6.12 package (DLA-4927-1) as fixed while
    bookworm''s 6.1 kernel 6.1.192-3 is still vulnerable; Ubuntu lists every supported release from 16.04 LTS to 24.04 LTS as vulnerable and 26.04 LTS and 26.10 as work in progress (page updated 2026-11-25), trusty is not
    affected.'
  region_nexus: global; any Linux host serving NFS (file servers, NAS appliances, build farms, Kubernetes storage nodes per OpenSec); ANSSI (France) researcher credited for the upstream fix
