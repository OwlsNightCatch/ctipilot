- source_id: watchtowr
  reason: 'RECIPE CHANGE: the labs RSS (newest 2026-11-05) under-collects; `python3 tools/fetch_source.py extract https://watchtowr.com/intelligence/` lists the Vulnerability FAQ and Rapid Reaction pages newest-first, and
    `url --direct` of the same page yields the per-page hrefs; this run found the NFS2ROOT and 4HTTP2ROOT (Cacti) FAQs there that no other slice record surfaced. Suggest pinning the intelligence index as the watchtowr record''s
    working listing.'
- source_id: znuny-advisories
  reason: https://www.znuny.org/en/advisories stops at ZSA-2026-16 and every per-advisory page ZSA-2026-17 to -43 (named by BSI WID-SEC-2026-4810) answers HTTP 500 on direct fetch and on the reader fallback (jina pool exhausted,
    ten keys at HTTP 402 during this run); the 27 Znuny flaws cannot be described beyond BSI's summary
- source_id: juniper-support-portal
  reason: Juniper JSA112183 on supportportal.juniper.net returns a Salesforce JavaScript shell on extract and on WebFetch; the vendor wording comes only from SecurityWeek's quotation and NCSC Switzerland's post. ENISA EUVD's
    record carries the same bulletin reference
