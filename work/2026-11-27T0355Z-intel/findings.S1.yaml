  extended_notes: 'Mitigations the reporter gives: apply the upstream patch first; otherwise disable SYN cookies (sysctl net.ipv4.tcp_syncookies=0, per network namespace, so each container namespace needs it; it weakens SYN-flood
    protection) or serialise the internet-facing interface to a single receive queue with RPS and RFS disabled. Telemetry hooks for a hunt or an outage review (inference from the mechanism, not a source statement): unexplained
    kernel panics or host reboots with a NULL-dereference in the TCP receive path on multi-queue servers, visible in kdump or hypervisor consoles, and bursts of fragmented plus regular TCP traffic to one listener before the
    crash. Gaps: the fixed stable releases are known only from the Debian tracker (6.12.117-1, 6.12.118-1, 7.3.4-1 and 7.3.5-1 shown as fixed), longterm 6.6, 6.1, 5.15 and 5.10 upstream status was not read, and no source reports
