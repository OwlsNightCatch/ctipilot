    → distro status: Red Hat https://access.redhat.com/security/cve/cve-2026-99288, Debian https://security-tracker.debian.org/tracker/CVE-2026-99288, Ubuntu https://ubuntu.com/security/CVE-2026-99288'
  summary: 'NoisyTCP (CVE-2026-99288) is a race in the Linux kernel''s lockless lookup of established TCP sockets, disclosed on oss-security by its reporter Hyunwoo Kim on 2026-11-15 (his message is stamped 2026-11-16 01:00
    +0900) after the linux-distros embargo lapsed. A stale ehash lookup finds a request socket that another receive context frees and reallocates as a SYN-cookie request at the same slab address; the stale lookup takes a reference
    and passes the tuple recheck, but the new request has no listener, and the receive path dereferences the null listener and panics the kernel. The reporter says the race can be triggered pre-authentication and remotely
    against ''plain'' TCP listeners such as nginx, Apache and SSH in their default configurations, needs a server with two or more receive queues or RPS spreading packets across CPUs, and takes about 5 seconds to 2 minutes
    on virtual machines where vCPU preemption occurs but about 14 hours against nginx on a quiet 8-queue bare-metal server, even with a proof of concept tuned to the target (the reporter used such a proof of concept; whether
    its code is public is not stated). A container host goes down with its workload. A second trigger flow gives a remote use-after-free but is described as hard to trigger without special techniques; the reporter claims no
    code execution. The code was introduced on 2015-10-03 and fixed upstream on 2026-11-03, so the reporter says almost all Linux distributions are affected; Red Hat rates it Important (CVSS 3.1 7.5 with its own vector, 5.9
    in the cve.org record) because an unauthenticated remote sender can crash the operating system. Distribution status when read: Debian lists trixie (6.12.117-1 and 6.12.118-1), bookworm''s 6.1.192-3 security build and linux-6.12
    on bookworm as fixed through DSA-6628-1, DLA-4906-1 and DLA-4927-1; Ubuntu''s page, last updated 2026-11-23, shows 26.10, 26.04, 24.04, 22.04, 20.04, 18.04 and 16.04 as vulnerable with fixes in progress; Vates published
    VSA-2026-069 on 2026-11-25 rating it Moderate for XCP-ng 8.3 and the Xen Orchestra Appliance, saying a reboot is needed after the kernel update and that privilege escalation cannot be ruled out. '
