  reason: the bsi-rss feed is capped at 250 items and this run's read spanned 2026-11-25 11:51 to 2026-11-26 12:52 UTC; changes.csv uses day-granular stamps (max 2026-11-25T23:00Z, highest id WID-SEC-2026-4826), so per-id
