  extended_notes: 'Exposure test the discoverer publishes (all four must hold): kernel older than the fixed build for its branch with no distribution backport (uname -r); nfsd loaded (lsmod | grep -w nfsd); NFSv4.1 or 4.2
    enabled (cat /proc/fs/nfsd/versions shows +4.1 or +4.2); a listener on a non-loopback address (ss -ltn ''sport = :2049''). Detection (OpenSec): the attack is valid NFS so there is no network signature; look for kernel
    log warnings from nfsd4_check_resp_size on every attempt, successful or not; kernel oopses with nfsd4_*, svc_* or call_usermodehelper* frames; shells spawned by kernel workers on a file server; bursts of short NFSv4.1
    sessions from one source. A host that was reachable and unpatched needs the kernel-worker-spawned-shell check as the post-patch compromise review, because the exploit ends in a root shell. Hardening: patch and reboot;
    until then allow TCP 2049 only from the storage network, or switch off NFSv4.1 and 4.2 (vers4.1=n and vers4.2=n in /etc/nfs.conf, then restart nfs-server), which OpenSec says turns off pNFS and some 4.2 features. Timing:
    the CVE record is dated 2026-11-19; OpenSec''s post is 2026-11-25 19:52 UTC and watchTowr''s FAQ is dated 2026-11-26, so the in-window source is the FAQ. Gaps: no independent exploit reproduction; the discoverer says its
    exploit is private; internet exposure of port 2049 is not quantified in any source. No ATT&CK mapping is stated by the sources; T1190/T1210 are the mapping for a network-reachable service flaw.'
- title: 'Cacti Core 1.2.31, ''4HTTP2ROOT'': a researcher''s public four-request chain turns the anonymous guest session into operating-system command execution (a value written into a per-user display setting is later injected
    into a database query, which sets a poller command that a guest-reachable page runs); no fixed release and no CVE id in the cited source, no exploitation reported'
  sources:
  - url: https://watchtowr.com/intelligence/4http2root-cacti-zero-day-faq/
    publisher: watchTowr (4HTTP2ROOT FAQ)
    date: '2026-11-26'
    role: primary
  discovery_trace: 'first seen at: watchtowr, URL https://watchtowr.com/intelligence/ (the labs RSS does not carry the FAQ pages; the record''s 2026-10-23 note names this index) → primary (no pivot needed): https://watchtowr.com/intelligence/4http2root-cacti-zero-day-faq/
    ; the researcher''s GitHub repository and any Cacti advisory were searched for (WebSearch ''4HTTP2ROOT Cacti'' and a Cacti 1.2.31 query) and not found, so the item rests on watchTowr''s reading alone'
  summary: 'watchTowr''s FAQ of 2026-11-26 reports that a researcher using the handle ''ek0ms savi0r'' published on GitHub on 2026-11-26 a chain of four unauthenticated HTTP requests that reaches command execution on a lab
    instance of Cacti Core 1.2.31, the open-source network-monitoring tool. As watchTowr describes it, an attacker with no account starts as the anonymous guest, writes an unvalidated value into a per-user display setting,
    that value is later inserted into a database query that the server treats as more than one statement, one of the added statements changes a poller setting to a shell command, and a separate page that the guest session
    can reach then runs it. Preconditions stated by watchTowr: the guest account must be enabled, because the whole chain runs through the unauthenticated guest session, and the Cacti web interface must be reachable; the command
    runs as the account that runs the web server and poller, often a low-privileged web user rather than root. Cacti Core 1.2.31 is listed as affected with no fixed version yet available, no CVE id appears in the FAQ, watchTowr
    says no exploitation in the wild is reported as of 2026-11-27 and no attribution exists. Cacti stores SNMP community strings and device logins for the routers, switches and servers it monitors, so a foothold on the monitoring
    server reaches well beyond it (watchTowr''s assessment). watchTowr''s mitigations: disable the guest account in user administration, restrict the web interface to trusted internal networks, review poller configuration
    entries for command values that do not match normal polling set-up, and watch application logs for warnings about non-numeric values in display settings, which the chain produces even though the request succeeds.'
