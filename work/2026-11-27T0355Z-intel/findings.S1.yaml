    and its JSON https://security.paloaltonetworks.com/json/PAN-SA-2026-0015 (carries the ''exploits'' statement and the timeline; the earlier run''s work/2026-11-25T0356Z-intel/findings.S1.yaml dropped this bulletin as informational
    and not actionable)'
  summary: 'Delta against the 2026-10-22 entry, which cites Palo Alto''s PHP2Shell advisory and Dream Research for the chained kernel flaw but not this bulletin. PAN-SA-2026-0015, first published 2026-11-24 23:10 UTC and labelled
    Informational under the title ''OSS CVEs Fixed in PAN-OS'', lists CVE-2026-46300, the Linux kernel local privilege escalation known as Fragnesia (XFRM ESP-in-TCP), and carries an Exploitation Status block that reads ''Exploitation
    of CVE-2026-46300 has been observed targeting the Palo Alto Networks management interface exposed to the internet.'' CISA has listed the CVE as exploited since 2026-10-28. Palo Alto''s FAQ says all observed exploitation
    targeted PAN-OS devices whose management interface is exposed to the internet, that the only known way to exploit the flaw is to first exploit PHP2Shell through such an interface, that a device on a fixed release from
    the CVE-2026-109618 advisory is protected, and that it still recommends upgrading to a Fragnesia-fixed release at the next maintenance interval. The Fragnesia fixes are a later hotfix than the PHP2Shell fix in every train:
