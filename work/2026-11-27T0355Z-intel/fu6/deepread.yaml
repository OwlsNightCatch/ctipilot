    passage: Only about one in six ARTEX servers we observed was present continuously for 30 days, and roughly 90 new ones appear on a typical day.
    verbatim_ok: true
  - claim: 'Recorded Future: no confirmed misuse by GreenJuliett of the AI infrastructure it found'
    source_url: https://www.recordedfuture.com/blog/ai-industrial-attack-workflow
    file: work/2026-11-27T0355Z-intel/fu6/rf.md
    passage: While we have not confirmed specific instances of misuse in this research
    verbatim_ok: true
  delta_vs_entry:
  - 'NEW (core): the self-labelling numbering is absent from the entry. Mechanism and formats (Wiz, per-installation never-reset BIGSERIAL for ARTEX; per-project i%03d for Cairn), the victim-side surfaces (AWS session names, SSM comments, tags, KMS aliases, rule descriptions; Azure run-command, VM and app-registration names; error text of denied calls), three defender uses (link across proxies, deconflict installations, gauge scope), and Wiz''s caveats are all new to the entry.'
  - 'NEW (provenance): GTIG already reported "somewhat-incremental" five-digit markers in file names, account names, passwords and e-mail subjects on 2026-10-31 and said it could not explain them; that page is already cited by the entry but the observation was not carried. Wiz supplies the mechanism; so the numbering is a GTIG observation (Oct) explained by Wiz (Nov), not a Wiz first.'
  - 'NEW (cross-source, from item B sources): the DIVD forensic report ties the i<number> artefacts to ARTEX "intents" explicitly and shows them in API-token and account names, a ticket marker, mail subjects, web-served-directory file names and MITM script names; a compiled series rises about 70 numbers per hour over 20.5 hours (my compilation, flagged as such). Two low-number groups coexist with the high series, which Wiz''s logic would read as a second sequence (low confidence).'
  - 'NEW: Huntback''s Entra Global Administrator takeover (chain above) is a concrete identity-tier case: stored-hash SSO, a password-reset bridge that ignores the old password, ROPC token without MFA, standing Global Administrator on a daily-use account, then bulk student-account creation and a second Global Administrator. Controls and detections named by Huntback are above. The chain is a South Korean university; no Swiss victim in any source read.'
  - 'NEW: Wiz named ARTEX-Harvester (one of about a dozen campaigns it tracks; "more than a dozen organizations", "at varying confidence", late October to mid-November), 220+ rotating proxy exits against one target, CI-trust and Kubernetes escalation chain, and a both-sides case (CyberStrikeAI beside an ARTEX checkout, AI keys and AI-assistant histories targeted). Wiz explicitly says ARTEX-labelled activity comes from multiple unrelated operators and that disclosed incidents cannot all be linked to one actor or even to these frameworks.'
  - 'NEW but small: Talos adds the reasoning that agents need persistent result stores (webhooks, beacons) and that allow-listed public services make this egress harder to block; and the GTIG figures 27 events in 23 seconds and 15 minutes to deep access (verified on the GTIG page, not carried by the entry).'
  - 'QUALIFIES S3: Talos is not an independent ARTEX observation (its artex-probe example is GTIG''s, and it says "can''t easily", not "cannot"); S3 otherwise matches Wiz and Huntback on every checked detail.'
  - 'QUALIFIES the entry''s Wiz coverage: the 2026-11-23 and 2026-11-25 Wiz posts never mention Storm-0940; ARTEX-Harvester is a separate cluster from the Storm-0940-overlap actor in the 2026-10-22 post. Do not merge them.'
  - 'RF page: nothing on numbering; only trend and churn figures.'
  - NO contradiction with the entry found in the A sources; the entry's multi-actor framing is consistent with Wiz's warning.
  verdict: 'Worth a changelog record (type update, ARTEX entry): the numbering finding is new to the entry, supported by Wiz''s code reading, GTIG''s earlier observation, Huntback''s workspace and the DIVD/NVISO victim-side artefacts, with Wiz''s caveats; keep Huntback to a two-sentence identity-case paragraph and Talos to its egress/persistence rationale; Recorded Future adds nothing to it.'
