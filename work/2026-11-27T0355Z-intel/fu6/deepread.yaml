  what_the_entry_already_carries:
  - Exploit chain, KEV, patch cadence (7.2.2/7.2.3/6.5.5); DIVD completed forensics 2026-11-18; AI agents after root; credentials rotated (GitLab token without reach, Slack key without read, OAuth tokens of two shared mailboxes used for test mails, no mailbox-content compromise observed); about 41,000 ticket titles and limited older conversations; Jira and Confluence compromised with 207 e-mail addresses, 2 phone numbers, 7 profile photos; "19 hours to initiate the first response"; detection paragraph saying DIVD "lists no process or network indicators".
  timeline_resolution:
    verdict: The two figures measure different things. "About 7 hours" (7:20:51) is alert to the first volunteer looking at it; "19 hours" is alert to the formal response / CISO escalation; containment came 27:40:51 after the alert. The entry's sentence is accurate to DIVD's prose but conflates acknowledgement with response; the "about 26 hours" foothold is Merlon's executive-summary phrase and does not reproduce from the report's own timestamps.
    exact_lines_and_times_UTC_all_from_the_saved_sources:
      first_breach (RCE as zammad): 2026-09-21 19:27:58 (report); DIVD metric "MTTD 00:15:11 = first breach to first alert"
      IDS alert (reverse shell, Elastic): 2026-09-21 19:43:09 (report 5.2 and 11.1)
      first response observed: 2026-09-22 03:04:00 - "observed by one of the volunteers at DIVD and a short investigation started" (report 11.1); DIVD metric "Mean Time to Acknowledge 07:20:51 = time between first alert and SOC pickup" (19:43:09 to 03:04:00 = 7:20:51)
      member asks someone to investigate the alert: 2026-09-22 07:34:00 (report Figure 1)
      CISO informed / crisis team: 2026-09-22 15:06:00 (report 11.1 and Figure 1) = 19:22:51 after the alert
      DIVD "MTTR" 19:16:51: labelled "Time between first attack and formal response" but 19:43:09 + 19:16:51 = 15:00:00 next day, i.e. alert to formal response about six minutes before the CISO contact; the "first attack" label does not match the arithmetic
      decision to isolate: 2026-09-22 17:30:00 (report)
      isolation started / completed: 2026-09-22 23:15:00 / 23:24:00 (report)
      DIVD "MTTC" 27:40:51: alert 19:43:09 to containment 23:24:00 = 27:40:51 (labelled "first attack" on the case page again)
      breach to containment: 19:27:58 to 23:24:00 next day = 27:56:02 (report says "around 26 hours")
      NVISO window: '"observed threat actor interaction spanned ~39 hours" from the first probe mails at 17:05 on 2026-09-21 to the last token request at 08:33 on 2026-09-23 (39:28), with the potential compromise window running to 2026-09-24 when cloud-side containment finished'
    case_page_prose: Although the alert arrived quickly, it took us 19 hours to initiate our first response on 22 September 2026; executing the plan took a further nine hours (15:06 to 23:24 is 8:18).
    recommended_wording_for_the_changelog: IDS alert 19:43 UTC on 21 Sep; a volunteer first looked at it 7 h 21 min later (03:04); the CISO was informed and the crisis team formed 19 h 23 min after the alert (15:06); containment completed 27 h 41 min after the alert (23:24); NVISO sees actor activity in the cloud until 08:33 on 23 Sep.
  extracted:
    ARTEX_use_wording_and_basis:
      wording: 'Executive summary and Conclusions: "an attacker likely using the open-source agentic attack framework ARTEX" and "Observations point towards the attacker likely having made use of ARTEX". Section title: "Possible Use of the ARTEX Framework". Merlon leaves attribution of the attacker to law enforcement. NVISO is firmer in tone: ARTEX strings in message subjects "indicate the use of this specific AI framework", but also says the volume suggests "AI-assisted tooling such as" ARTEX.'
      basis_in_the_report:
      - 'volume: 990 custom Python, Ruby and Bash scripts, 3,259 output files and 228 output directories in the temp and web-root folders, "practically infeasible for a human attacker" in the time frame;'
      - scripts are fully documented with LLM-style inner monologue, "quite atypical for human attackers";
      - 'artefacts carrying the framework name: a Zammad admin account and an API token (artex- prefix plus a number), further strings with "artex" in scripts, and an e-mail subject with ARTEX- plus a number (NVISO); Merlon calls the account and token "the strongest indicators";'
      - the account did not exist in the Google Workspace; OSINT led to the public ARTEX repository; Merlon secured copies of the repository (2026-09-26) and forks (2026-10-08) and found the inner workings "closely match" the observed behaviour;
      - 'the intent numbering: ARTEX intents are numeric job IDs included in all input and output, and many attacker files start with i plus a number (this basis is not in S4''s summary);'
      - 'caveat: Merlon says one search ("zammad-websocket") "alone cannot be used to derive any form of intent" and offers an LLM-reasoning artefact as one possible theory.'
      difference_between_DIVD_pages_and_report: 'The DIVD blog says without hedge "the Agentic Offensive Framework (ARTEX) the attacker used"; the report says "likely". The report also says the repository "has since been taken down by GitHub", whereas GTIG says its creator took it down and Macau Business says it was converted to closed source: three characterisations in the store.'
      first_dated_victim_side_sighting: the DIVD intrusion (2026-09-21) predates the late-September CrowdStrike sighting and Microsoft's "as early as September" statement carried in the ARTEX entry; it is a dated victim-side sighting with named artefacts, on a victim that is a Dutch vulnerability-disclosure CSIRT.
    attack_chain_behaviour_level:
      initial_access: 'probe of the perimeter from 07:40 on 2026-09-21; an administrator logged into Zammad at 18:53:50 and the WebSocket header-leak bug (CVE-2026-102489, "heartbleed-like") yielded that session cookie 1.3 seconds later; the cookie was replayed from 19:01:00; at 19:06:31 a file was written through the package upload endpoint; at 19:27:53 a malicious Ruby mail template was written as a .custom override of a Zammad mailer view and at 19:27:58 a user-creation POST triggered an e-mail login flow that rendered it: code execution as the zammad user. A command-and-control channel then ran through a Zammad API endpoint (text_modules) and files were staged in the web-served directory and fetched back through the egress proxy because direct outbound was blocked.'
      root: 'CVE-2026-102490 per the report: /etc/zammad owned by the zammad user, the root-run unit sources /etc/zammad/conf.d before dropping privileges, and the zammad process can force a restart by killing its web worker; a dropped file plus a kill gave root at 19:45:59-19:46:59 and a setuid copy of bash was left in a temp directory. Report footnote: every DEB and RPM package back to 1.5.0 (2017) appears affected.'
      post_root_collection: mass searches of the Zammad API and PostgreSQL for key, password and token terms (including one search for tickets about the Zammad WebSocket, which Merlon says may be an LLM-reasoning artefact and not proof of intent); reads of the external_credentials, channels, authorizations and settings tables; unauthenticated local Elasticsearch ticket index searched for private keys and deploy keys; IMAP password for the hosting-provider mailbox found in the mail-channel configuration and used to log in over IMAP at 23:24:00 and search the abuse and csirt mailboxes; Google OAuth refresh tokens and client secret read from the database and used from attacker infrastructure (NVISO).
      arp_poisoning_to_forged_admin_sessions:
      - From the compromised Zammad host (same web-application VLAN as Jira and Confluence) the attacker first sniffed passively (about 90 seconds from 21:19:53 on 09-21), then from about 01:15 on 09-22 tried ARP-poisoning scripts; the first working run was at 01:37:48 and the Confluence server's ARP cache for the gateway was poisoned at 02:27:43, giving a man-in-the-middle position between the application hosts and the gateway.
      - 'The link from Confluence (and Jira) to the shared PostgreSQL server was unencrypted, so the attacker could read the database protocol, download the raw capture files through the proxy for about six hours to learn the schema, and then inject its own SQL statements into live database connections by spoofing TCP sequence and acknowledgment numbers and dropping the original statement (first successful injected query at 03:34:25: current user, database and version).'
      - 'Confluence: after several hours the attacker worked out how the product stores "remember-me" session tokens, wrote a token it chose for an administrator account (selected by group membership) directly into the token table at 08:46:35, and presented it at 08:49:00; the response header showed the login accepted. Confluence was then scraped (pages, 208 attachments, secret searches).'
      - 'Jira: a similar poisoning began 03:08:29; first successful injection 10:43:43 (OAuth consumer and token tables read); replay of dumped remember-me tokens failed at 14:04:10 because Jira clears old tokens, succeeded at 14:08:58 (full dump at 14:05:58); the product''s own support-zip export (troubleshooting REST endpoint) was used to pull data, exfiltrated 14:43-14:50.'
      - A later scheduler script self-reports that poisoning runs only in Dutch working hours (NL 05:00-16:00 UTC, i.e. 07:00-18:00 CEST), in reversible windows that restore the real MAC addresses at the end of each window (the first working poisoning, at 02:27, predates that window); the MITM degraded the firewall and broke the out-of-band VPN, which delayed isolation.
      - 'Parallel failed attempts: forged SAML responses to Jira, SSH to Jira and Confluence, AD-integrated DNS update probes against the legacy domain controllers, probes toward GitLab, vSphere and Proxmox through an internal proxy that a firewall rule left over from a migration made reachable.'
      persistence:
      - a new Zammad admin account created from the hijacked admin session and API tokens (one with the framework name); a second Zammad account created indirectly through a ticket carrying a content marker;
      - 'the Google OAuth-scope item: at 11:43 on 09-22 the Zammad omniauth initializer was edited to change the Google access type from online to offline and to add the full Gmail scope; Zammad stores tokens in its authorizations table, so every later login would have logged an offline token; a poller read new tokens and tried the Gmail API, the stated aim being password resets read through Gmail and account takeover; the edit was live from 11:43:37 and a token-poller script followed about 45 minutes later; it needed user consent and captured nothing (NVISO: no individual-user token captured because no user logged in during its active period);'
      - a root-run loop under systemd with Restart=always and two cron.d entries that execute any .txt file dropped in the web-served directory through the setuid bash copy; Merlon notes many scripts had persistence elements so labelling backdoors was hard.
    exfiltration_counts_as_the_report_states_them:
      files: 2,806 files exfiltrated through the reverse proxy; about 41 thousand Zammad CSIRT ticket titles through the Zammad API; two files with older CNA-related mail chains (past the 90-day disclosure limit); a Confluence export containing 3 TLP:RED and 33 TLP:AMBER or AMBER+STRICT pages.
      PII_report_table (source to filtered): e-mail addresses 48,928 to 4,121; phone numbers 316 to 34; street addresses 39 to 3; BSN 0.
      DIVD_corrections_on_the_overview_page_2026-11-24: 'unique e-mail addresses are 15,409 not 48,928 (duplicates), 4,121 personal; street addresses: none of the 39 personal after review (report said 3); phone numbers 316/34 unchanged.'
      members: 207 member e-mail addresses (200 with full name; DIVD says incl. aliases and functional addresses, volunteers and former volunteers), 7 identifiable profile photos, 2 phone numbers.
      high_impact_table_items_not_in_the_entry: full Zammad users-table dumps with Argon2id password hashes (listed as 28,952 e-mail addresses and as 14,342 user records), mail-channel configurations with the IMAP password and Google OAuth tokens, an external-credential store with the Google client ID and secret, Zammad database configuration revealing the PostgreSQL password, Confluence database rows (OAuth token stores, application secrets, user directory), Jira user list (133 staff addresses) and Jira OAuth consumer key; DIVD's overview page says the attacker was "selective" and does not mention password hashes of Zammad users.
      credential_material_beyond_the_entry: cleartext IMAP password of the hosting-provider mailbox account (used to log in), Google OAuth refresh tokens and client secret for the two shared mailboxes (used from attacker infrastructure), PostgreSQL password from application configuration, an Elastic basic-auth credential verified against Fleet, Jira OAuth consumer private key, Jira/Confluence password hashes, remember-me and reset tokens, a GitLab personal access token and a send-only Slack bot key. Slack gave no logs, so Slack was not examined further.
      attacker_volume: 990 payloads (Python, Ruby, Bash), 3,259 output files, 228 output directories in the temp folder and web root; attacker cleanup was sporadic.
    recommendations_the_report_gives:
      prevention:
      - Patch internet-facing services (both Zammad instances ran 6.5.2 of 2025-09-10, which Merlon calls outdated; note the zero-day affected all 6.5.x, so only 7.x would have avoided it).
      - 'Take sensitive services off the internet behind a VPN; where exposure is required, WAF or reverse proxy exposing only the needed routes (example: only the OIDC public-key route of a private SSO).'
      - 'TLS 1.3 (at least 1.2) on internal links, mTLS optional; Merlon: "Had the communications between these servers not been unencrypted, the attacker would not have been able to inject a custom session token".'
      - Deny-by-default micro-segmentation even within one VLAN (a ticketing host does not need Jira, Confluence, their database or domain controllers; domain controllers used only for DNS should allow only DNS), private VLANs, client isolation, ARP proxying, DNS allow-listing.
      - 'Containers or microVMs (Firecracker, Kata, gVisor): a containerised Zammad would have prevented the root step because killing the init process kills the container; container hardening list (non-root, drop capabilities, no privileged mode, read-only filesystem, Kubernetes deny-by-default network policy, no automatic service-account token mount, admission policies, pod-security labels).'
      detection:
      - Honeypots (one network honeypot per subnet) and honeytokens such as a fake ticket created every 24 hours holding a fake password-reset link for a fake tier-1 system, wired to a P1 alert and optionally automatic isolation; do not label honeypots as such.
      - Network IDS inside the internal network (Suricata, Zeek), IPS considered against automated attacks; encryption reduces visibility so retain or decrypt traffic.
      - Third-party or member-employer SOC cover for working hours because DIVD relies on volunteers.
      response:
      - Do not run the incident on possibly compromised tools (Slack, Google Workspace, hosts on the network) until proven clean.
      - Have IR tooling ready (Velociraptor deployed by hand and Dissect Acquire not ready cost time); securing disk and memory images was done well; run incident exercises focusing on ingress/egress, evidence acquisition, detection blind spots and concrete research questions.
      NVISO_additions:
      - rotate Google OAuth client secrets and verify identity-level remediation (password and session resets) for all affected shared mailboxes;
      - restrict third-party OAuth app permissions instead of the default "No app configuration" (the app had a full-mailbox scope and no policy);
      - rebuild the Firezone VPN hosts (two to three years behind the release line) and keep management interfaces off the internet;
      - central application logging for GitLab, Passbolt and Firezone and 90-day minimum log retention (those application logs did not exist, so lateral movement could not be fully excluded);
      - decommission unauthorised hosting-provider accounts created during the intrusion.
      lesson_from_NVISO_for_containment: 'network isolation at 23:24 on 09-22 did not revoke cloud OAuth access: the attacker obtained fresh tokens at 09:44 on 09-22 and again at 08:33 on 09-23 from its own infrastructure with previously stolen secrets; the credential reset for 174 accounts (24 Sep 18:55 per NVISO) and session revocation for 199 accounts (20:15) ended it.'
