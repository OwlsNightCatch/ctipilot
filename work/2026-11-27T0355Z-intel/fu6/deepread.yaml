  delta_vs_entry:
  - 'CONTRADICTS/QUALIFIES (timing): entry says the first response started 19 hours after the alert. Report and case page: first human pickup 7:20:51 after the alert (03:04:00), CISO/crisis escalation 19:22:51 after the alert (15:06), DIVD''s "MTTR" 19:16:51 (alert to about 15:00), containment 27:40:51 after the alert. Entry should state both.'
  - 'CONTRADICTS (S4 summary): "foothold of about 26 hours" is Merlon''s executive-summary phrase; breach (19:27:58) to containment (23:24 next day) is 27:56:02 and alert to containment is 27:40:51 (DIVD''s own MTTC); NVISO measures about 39 hours of actor interaction in the cloud (to 08:33 on 09-23). Use the measured intervals or cite the 26 h as Merlon''s claim.'
  - 'CONTRADICTS/QUALIFIES (AI scope): entry (from DIVD''s case page) says AI agents continued the attack after obtaining root. The report calls the whole intrusion agentic and its own artefacts show automation earlier: marker-tagged probe mails 17:05-18:21 UTC, an OAuth token request at 18:33, the session cookie taken 1.3 s after the admin logged in, all before root at 19:46:59.'
  - 'CONTRADICTS (mailbox content): entry carries DIVD''s "no mailbox-content compromise observed"; NVISO (embedded in the same PDF) says the attacker used full-mailbox-scope tokens from its own infrastructure, deleted one message, sent spoofing tests, and that mailbox content "must be considered as potentially compromised" (content review was out of scope); tokens were re-minted after network isolation (until 08:33 on 09-23).'
  - 'CONTRADICTS (S4 summary figures): "3 home addresses" is superseded by DIVD''s overview page (none of the 39 street addresses personal); the report''s 48,928 e-mail addresses are 15,409 unique; "207" includes aliases and functional addresses per DIVD.'
  - 'QUALIFIES (entry''s credential list): the report lists much more material taken than the GitLab token, Slack key and two OAuth tokens (hosting-provider IMAP password used to log in, Google client secret, PostgreSQL password, Elastic credential, Jira OAuth consumer key, password hashes, session and reset tokens, Zammad users table with password hashes).'
