  - 'QUALIFIES ("segmentation stopped them"): the report credits segmentation for the limited blast radius but its own chain moved between Zammad, Confluence and Jira inside one web-application VLAN by ARP poisoning, over an unencrypted database link; Merlon asks for intra-VLAN micro-segmentation, and a leftover firewall rule exposed an internal proxy.'
  - 'NEW (AI numbering link for item A): the report ties the i<number> artefacts to ARTEX intents; NVISO shows the same marker pattern in mail subjects and treats one as an "internal ticket format".'
  - 'NEW: victim patch level 6.5.2 (2025-09-10); the zero-day affected all 6.5.x so patching 6.5 would not have helped; DEB/RPM affected back to 1.5.0 (2017).'
  - 'NEW: containment lesson (network isolation does not revoke OAuth refresh tokens), NVISO''s OAuth recommendations, Merlon''s recommendation list (TLS on database links, micro-segmentation, containers/microVMs, honeytokens, internal IDS, working-hours SOC).'
  - 'NEW (source updates): DIVD case page last modified 2026-11-25 14:10 CET; overview page 2026-11-24 (says it is the last update); report v1.5 dated 2026-11-24 (NVISO final 2026-11-18); entry cites the 2026-11-18 versions.'
  report_internal_inconsistencies_to_avoid_repeating:
  - 'Conclusions section 1a says CVE-2026-102490 "abused intended functionality to obtain remote code execution"; sections 6.2 and 11.1-11.2 (and the entry) have it right: CVE-2026-102489 session hijack leads to RCE as zammad, CVE-2026-102490 gives root.'
  - Executive summary says the attacker "failed to laterally move to any other system" while Jira and Confluence were compromised at application level (not OS level) and a hosting-provider mailbox was logged into.
  - Figure 1 dates the hosting-provider IMAP breach at 21:19:53; the body and Conclusions say 23:24:00.
  - 'Appendix exfiltration-table timestamps are local time labelled Z (two hours ahead of UTC): the web-root test upload is 19:06:31 UTC in the body and 21:06:29 "Z" in the table; the proxy log shows +0200. Do not build timelines from the appendix without subtracting two hours.'
  - Root time is 19:45:59 (attacker log), 19:46:58 (stager) and 19:46:59 (summary and DIVD metric) in different places.
  - Section 11.2 calls the root bug one in the "Debian package distribution" of Zammad while the compromised hosts run Rocky Linux 8.5 (RPM family); Zammad's advisory covers both DEB and RPM packages, so read it as the packaged builds, not Debian specifically.
  - NVISO says the last token was minted "around six hours after the client disconnected the network"; its own timeline gives about nine (23:24 to 08:33).
  - NVISO dates the first token issuance 18:33 on 09-21, before Merlon's session theft (18:53:50) and RCE (19:27:58); the document set does not reconcile this, and NVISO itself notes Google logs cannot separate attacker from legitimate Zammad requests.
  - Merlon dates the Google password reset 2026-09-25 19:00; NVISO says the client enforced it on 2026-09-24 18:55 and revoked sessions at 20:15.
  - Merlon says Zammad API keys were revoked in Google Cloud on 09-22 at 21:49, yet NVISO sees token issuance on 09-23 08:33 with previously exfiltrated secrets.
  - Merlon's closing words call detect and respond medians "excellent"; DIVD's case page says "plenty of room for improvement"; Merlon's own recommendation 13.2.3 says volunteer response time is not always at the desired level.
  verdict: 'Worth a changelog record on the Zammad entry: replace the single "19 hours" sentence with the measured intervals (7 h 21 min to first look, 19 h 23 min to CISO/crisis escalation, 27 h 41 min to containment), do not carry "about 26 hours" or "3 home addresses", add the behaviour-level chain and persistence (including the offline-Gmail-scope change that captured nothing), qualify the mailbox-content statement with NVISO and add the OAuth-survives-isolation lesson; the ARTEX basis (volume, documentation, artefact names, intent numbering) belongs there and as a one-line cross-reference on the ARTEX entry.'
