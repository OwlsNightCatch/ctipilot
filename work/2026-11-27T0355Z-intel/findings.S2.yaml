    discovery_trace: "first seen at: inside-it-ch, feed https://www.inside-it.ch/rss.xml (item 'Basler Datenschutzbeauftragte verhindert Datenauslagerung', 2026-11-25T14:20Z, outside the 26 h window) → url --direct https://www.inside-it.ch/basler-datenschutzbeauftragte-verhindert-datenauslagerung-20261125 → pivot: Netzwoche listing https://www.netzwoche.ch/ surfaced the in-window follow-up https://www.netzwoche.ch/news/2026-11-26/basler-datenschutzbeauftragte-untersagt-vpn-auslagerung-an-us-amerikanischen → pivot: Steiger Legal https://steigerlegal.ch/2026/11/21/datenschutzbeauftragte-basel-stadt-auslagerung-cloud-dienst/ and DNIP https://dnip.ch/2026/11/25/basler-datenschuetzerin-stoppt-cloud-plaene-fuer-das-kantonsnetz-wegen-prisma-access-von-palo-alto-networks/ (both link the primary) → primary: https://www.bs.ch/news/2026-weisung-zur-auslagerung-der-kantonalen-vpn-und-web-proxy-loesungen-die-cloud"
    summary: |
      The data protection commissioner of the canton of Basel-Stadt (DSB, Danielle Kaufmann) issued a binding directive (Weisung) to stop the cantonal administration from moving its remote-access/VPN and web-proxy services, today run locally, into the cloud of an unnamed US provider (DSB communication; the bs.ch page metadata reads 2026-11-18, Steiger cites 19 November). The DSB's stated reasons: most cantonal traffic would flow through the provider, the provider would break the encryption and could in effect read most of it, including health and tax data, files, case records and passwords; the administration did not submit the project for the legally required prior consultation before contracting and the DSB learned of it from concerned employees; its negative recommendation was ignored; no urgency was shown, the local solution can be extended, and as far as known other cantons keep local VPN and proxy solutions. The addressee can challenge the directive with a Rekurs to the cantonal Appellationsgericht (Steiger, Netzwoche); the Basel finance department told DNIP it is examining the objection and gave no further information. Context from the tender (Inside IT, DNIP): project Infra21+ replaces VPN-based remote access and the secure web gateway with a zero-trust network access solution; the contract of CHF 11.3 million went in April 2025 to BNC (now Axians BNC). Claims, not facts: Steiger infers from the public award, and DNIP says several cantonal IT sources confirm, that the product is Palo Alto Networks Prisma Access, with traffic ending in the vendor's cloud (DNIP adds the vendor's Zurich point of presence runs on hyperscaler infrastructure); neither the DSB nor the canton has named the provider. Steiger rates it an unusual step because Swiss data protection authorities have so far added no binding measures to their critical statements on US cloud use (including privatim's November 2025 resolution). The page carries no vulnerability or attack; the relevance is an architecture and procurement constraint for Swiss public bodies planning TLS-inspecting SSE/ZTNA services.
    region_nexus: "Switzerland, canton Basel-Stadt; precedent for other cantonal and communal administrations choosing secure-access and web-proxy architecture"
