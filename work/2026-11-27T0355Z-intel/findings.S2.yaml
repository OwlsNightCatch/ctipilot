    discovery_trace: "first seen at: heise-sec, feed https://www.heise.de/security/feed.xml (item 'Autonome KI-Angriffe: BSI warnt vor Bedrohung durch AOF', 2026-11-26T16:02Z) → extract https://www.heise.de/news/Kuenstliche-Intelligenz-als-Angreifer-Eine-neue-Aera-hat-begonnen-11539545.html (links the BSI PDF) → primary: BSI landing page https://www.bsi.bund.de/SharedDocs/Downloads/DE/BSI/KI/Offensive-agentische-KI_261115.html (page date 26.11.2026; the bare .pdf URL answers with this HTML page) → BSI PDF https://www.bsi.bund.de/SharedDocs/Downloads/DE/BSI/KI/Offensive-agentische-KI_261115.pdf?__blob=publicationFile&v=6 read with `fetch_source.py pdf`"
    summary: |
      On 2026-11-26 Germany's BSI published a short warning, "Hoher Reifegrad von Agentic Offensive Frameworks verschärft Bedrohungslage", labelled "Ein Beitrag des BSI im Rahmen des AISI Deutschland". Facts the BSI states: frameworks such as ARTEX, CAIRN and PentAGI orchestrate AI agents, are delivered without AI models and can be run with models of the operator's choice, including freely available open-weight models, so access to frontier models is not required; they automate several attack phases from reconnaissance through exploitation, privilege escalation and spread in the network to data exfiltration; such attacks work best where basic IT-security measures are missing and are marked by machine-speed trial of many different but known techniques; forensic analysis of an affected system is hard because of the mass of actions in a short time unless AI is used for the analysis as well. The BSI says reports of security incidents in which use of such tools is suspected, and in part proven, are accumulating, and that it can confirm the high maturity of these frameworks from its own findings; it also points to the FBI and CERT-EU warnings on ARTEX. Its assessment (an expectation, not an observation): quality and quantity of attacks will rise markedly, and internet-reachable technical infrastructure will be compromised in the medium term unless vulnerabilities are acted on. Advice: weak or default passwords and unprotected interfaces raise the risk of a successful attack significantly; operators of internet-reachable infrastructure should prepare now, using the DIVA catalogue of the Stand-der-Technik-Bibliothek and the June 2026 BSI IT-Sicherheitsinformation (BITS) as orientation; organisations still working on the basics should start an immediate programme of quick wins, first incident-response readiness (emergency plan) and closing the simplest attack paths promptly. The text names no victims, case counts, sectors or entry points. The heise report adds an expert's remark at its own event (attributed to Nextron Systems' Florian Roth, not the BSI) that attribution and IoC assignment are very hard because the agent loops invent new strategies and rotate source addresses via VPN or Tor. For Swiss defenders this is an independent neighbouring-authority confirmation of the tool class that BACS reported against Swiss targets on 2026-11-24 (already an entry), with the same advice at the root: basics, speed of patching, a rehearsed incident plan.
    region_nexus: "Germany (BSI warning); transferable to Switzerland: same tool class and advice as BACS 2026-11-24; no Swiss-specific content"
