  - title: "Planzer, a Swiss logistics company, reports theft of shipment data and encrypted customer-portal credentials, informed BACS and the EDÖB; customer Digitec Galaxus confirms names, delivery addresses and parcel numbers of its orders are among the data"
    sources:
      - { url: "https://www.inside-it.ch/planzer-meldet-datendiebstahl-20261126", publisher: "Inside IT", date: "2026-11-26", role: "primary" }
      - { url: "https://www.netzwoche.ch/news/2026-11-26/cyberkriminelle-greifen-daten-von-planzer-ab", publisher: "Netzwoche", date: "2026-11-26", role: "corroborating" }
    discovery_trace: "first seen at: inside-it-ch, feed https://www.inside-it.ch/rss.xml (item 'Planzer meldet Datendiebstahl', 2026-11-26T10:24Z) → url --direct https://www.inside-it.ch/planzer-meldet-datendiebstahl-20261126 → corroboration: Netzwoche listing https://www.netzwoche.ch/ → url --direct https://www.netzwoche.ch/news/2026-11-26/cyberkriminelle-greifen-daten-von-planzer-ab; Planzer's and Digitec Galaxus's own statements not reachable (planzer.ch answers 403 on direct fetch and WebFetch; neither article links the statements); WebSearch found no further coverage"
    summary: |
      On 2026-11-26 the Swiss family-owned logistics company Planzer disclosed a data theft (both Swiss trade outlets relay Planzer's and Digitec Galaxus's statements; the primary statements were not reachable). Planzer says the attackers took shipment data that customers transmit through interfaces or its customer portal, and also customer-portal credentials, which were stolen in encrypted form; the parcel-recipient portal credentials and financial and payment data are not affected. The incident was found through unusual activity in the IT systems; internal and external forensics are examining it; Planzer informed the BACS and the EDÖB and intends to file a criminal complaint. Customer Digitec Galaxus says order data of its two shops is included (parcel numbers, names, delivery addresses, e-mail addresses, partly phone numbers), that the newest affected records date from early 2023, that its own systems were not hit, and that it keeps Planzer as carrier. Both firms warn of phishing built on the data; Netzwoche notes that Planzer-branded phishing was already reported by the Kantonspolizei Zürich in August 2026. No actor, entry vector, leak-site claim or record count has been named. The transferable point for Swiss public-sector defenders is the data class: real parcel numbers with names and addresses make staff-directed parcel and customs-fee phishing credible, and logistics-provider portals and partner interfaces are a third-party exposure; whether any public body's shipments are included is not stated.
