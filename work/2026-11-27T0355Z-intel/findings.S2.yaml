    summary: |
      FIFA, the football world governing body headquartered in Zurich (about 700 employees, per The Record), confirmed on 2026-11-25/26 that it was the victim of a criminal cyberattack that led to unauthorised access to a limited number of personal and business data; it says it works with the competent authorities including law enforcement and condemns the acquisition and publication of information. FIFA gave neither the type of data nor whether systems were encrypted (Inside IT) and did not answer The Record's follow-up questions. Reuters, via a person with knowledge and relayed by heise, says less than 0.1 percent of FIFA's data was affected and that no files on the abandoned "FIFA Forward Enterprise" investor plan were taken; dpa (via swissinfo) reports the attack was unrelated to that plan. Claims, attributed to the criminals: The Record says the group Handsome Boy Hacking Club (HBHC), which emerged last week and about which little is known, claimed more than 12 GB, said it tried to extort FIFA and failed, published the data on a cybercrime forum and claimed access to FIFA's Microsoft environment; the alleged content is identity and immigration documents, financial, legal and governance records. Inside IT calls HBHC a ransomware gang and headlines a confirmed ransomware attack, but the FIFA statement it quotes mentions neither ransomware nor encryption, so the ransomware label is the outlet's. No entry point is known. Transferable points for Swiss defenders: a new extortion-and-leak group has hit a Swiss-based international body, the claimed foothold is a Microsoft cloud tenant (a claim only), and the victim's public line is minimisation; treat as an awareness item until an access vector or further Swiss victims surface.
