    evidence:
      - quote: "Auch Zugangsdaten zum Kundenportal selbst seien entwendet worden, allerdings in verschlüsselter Form."
        attribution: "Inside IT"
        source_url: "https://www.inside-it.ch/planzer-meldet-datendiebstahl-20261126"
      - quote: "Das Unternehmen informierte das Bundesamt für Cybersicherheit (BACS) sowie den Eidgenössischen Datenschutz- und Öffentlichkeitsbeauftragten (EDÖB) und erstattete Strafanzeige."
        attribution: "SwissCybersecurity.net"
        source_url: "https://www.swisscybersecurity.net/news/2026-11-26/cyberkriminelle-greifen-daten-von-planzer-ab"
    extended_notes: |
      Transferable behaviour: a logistics provider holds delivery records its customers push via API or portal, so a theft at the provider exposes the customer's recipients without touching the customer; the customer notice says so explicitly. A public body that ships through a logistics provider (evidence, medical goods, ballot material) should ask the provider the same scoping question. Not covered elsewhere in the store (grep of entries and runs for Planzer is empty).

  # ------------------------------------------------------------------ 6
  - title: "Tokyo Metropolitan Government's 'Akachan First' voucher site and Nakano ward's first-birthday programme: contractor Linbell's online store breached on 11 November, digital QUO Card Pay codes unusable or drained for about 12,000 people, a sub-contractor's exchange codes leaked in Nakano"
    sources:
      - { url: "https://www.metro.tokyo.lg.jp/information/press/2026/11/2026112507", publisher: "Tokyo Metropolitan Government (Bureau of Social Welfare press release)", date: "2026-11-25", role: "primary" }
      - { url: "https://www.city.tokyo-nakano.lg.jp/kusei/public/houdou/2026/press261126.html", publisher: "Nakano City", date: "2026-11-26", role: "primary" }
      - { url: "https://piyolog.hatenadiary.jp/entry/2026/11/27/004031", publisher: "Piyolog (timeline compiled from the Tokyo, Nakano and Linbell notices and press, in Japanese)", date: "2026-11-27", role: "corroborating" }
    discovery_trace: "first seen at: piyolog, URL https://piyolog.hatenadiary.jp/ (entry 2026-11-27 'Tokyo QUO Card Pay unusable after Akachan First') → pivot: entry URL https://piyolog.hatenadiary.jp/entry/2026/11/27/004031 → primary: Tokyo press release, URL https://www.metro.tokyo.lg.jp/information/press/2026/11/2026112507 → primary: Nakano City notice, URL https://www.city.tokyo-nakano.lg.jp/kusei/public/houdou/2026/press261126.html (Linbell's own release PDFs returned HTTP 403 on every transport tried)"
    summary: |
      Tokyo's welfare bureau says it stopped the exchange site of its 'Akachan First' childbirth and childcare support programme at 21:00 on 2026-11-17 after learning of external unauthorised access to the server of its contractor Linbell, and announced the closure on 2026-11-19. On 2026-11-25 it reported that digital QUO Card Pay gift codes obtained through the programme since 2025-12-01 could not be used or had lost balance, found after call-centre complaints and confirmed by the contractor; it says personal-data viewing or leakage and other digital gifts are not confirmed, that the cause is not in the card issuer's system, and that the effect of the 2026-11-19 server intrusion is still under investigation. Piyolog's compilation of press reports adds about 12,000 people and about 90 million yen of codes reduced or unusable, 994 phone complaints by 2026-11-24 starting 2026-11-13, and Linbell's own 2026-11-20 release that its online store was accessed without authorisation on 2026-11-11 with up to about 720,000 member and 1.77 million non-member records possibly leaked; those figures could not be read from Linbell's PDF and rest on that compilation. Separately Nakano ward said on 2026-11-26 that exchange codes for its 'Nakapay' points in its first-birthday support programme leaked (found 2026-11-16) from Linbell, which the programme contractor had sub-contracted, that 5,134 applications since 2024-04 could have exposed applicant and child names, birth dates, addresses, phone numbers, e-mail addresses, survey answers and exchange history, and that Linbell is checking whether this is linked to the 2026-11-11 intrusion. Tokyo and Nakano both say a link between the intrusion and the drained codes is not established.
    region_nexus: "japan (no Swiss nexus); transferable to Swiss cantonal and communal benefit or voucher programmes run by contractors"
    primary_sector_nexus: "indirect (municipal programmes outsourced to a contractor and sub-contractor)"
    sector: "public-sector"
    cves: []
    techniques: [T1199]
    affected_products: []
    entity_keys: []
    new_entities:
      - { key: "incident:linbell-tokyo-nakano-voucher-platform-2026-11", type: incident, name: "Linbell voucher-platform breach affecting Tokyo and Nakano programmes (November 2026)", aliases: ["リンベル不正アクセス", "Akachan First QUO Card Pay incident"], summary: "Contractor Linbell's online store was accessed without authorisation on 2026-11-11; Tokyo's Akachan First exchange site was closed from 2026-11-17 and QUO Card Pay gift codes became unusable or lost balance for about 12,000 people; Nakano ward reported leaked exchange codes and a possible leak of 5,134 applications on 2026-11-26 (Tokyo Metropolitan Government, 2026-11-25; Nakano City, 2026-11-26)." }
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: "Two municipal-government primaries on a contractor and sub-contractor chain, but Japan, no Swiss nexus, and the cause of the drained gift codes is explicitly not yet tied to the intrusion; the Hokkaido municipal-subcontractor entry was published as routine on the same transferable lesson."
    evidence:
      - quote: "QUOカードPayが使用ができない事象や残高が減った事象が発生していることを確認しました。"
        attribution: "Tokyo Metropolitan Government (Bureau of Social Welfare press release)"
        source_url: "https://www.metro.tokyo.lg.jp/information/press/2026/11/2026112507"
      - quote: "2026年11月16日（月曜）、本事業における電子ギフトの一つであるナカペイポイントの交換用コードの流出が判明しました。"
        attribution: "Nakano City"
        source_url: "https://www.city.tokyo-nakano.lg.jp/kusei/public/houdou/2026/press261126.html"
    extended_notes: |
      Gloss: Tokyo says QUO Card Pay could not be used or balances fell (confirmed by the contractor after call-centre complaints); Nakano says exchange codes for its Nakapay points were found leaked on 2026-11-16. Transferable behaviour: digital gift or voucher codes issued by a contractor on behalf of a public body are bearer instruments, so a contractor-side compromise converts directly into money loss without personal-data theft; detection sits with the contractor (code-issuance and redemption logs, redemption before first delivery) and with call-centre complaint trends, which was how Tokyo found it (complaints began 2026-11-13, five days before the site was stopped). Not asserting causality: both governments say it is not established.

