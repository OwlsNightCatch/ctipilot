    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-of:2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach"
    evidence:
      - quote: "The attack was contained on Sep 22nd 2026 at 23:24 UTC, meaning the attacker had a foothold in the network for around 26 hours."
        attribution: "Merlon Security (forensic report for DIVD, v1.5)"
        source_url: "https://csirt.divd.nl/downloads/DIVD-2026-00014/DIVD-2026-00014-forensics-report.pdf"
      - quote: "The breach involved the use of two separate zero-day exploits, exploited by an attacker likely using the open-source agentic attack framework ARTEX"
        attribution: "Merlon Security (forensic report for DIVD, v1.5)"
        source_url: "https://csirt.divd.nl/downloads/DIVD-2026-00014/DIVD-2026-00014-forensics-report.pdf"
