  # ------------------------------------------------------------------ 5
  - title: "Planzer (Swiss logistics) reports a data theft: shipment data submitted by customers through interfaces and the customer portal, encrypted portal credentials, BACS and FDPIC informed; Digitec Galaxus confirms its order shipment data is among it"
    sources:
      - { url: "https://www.inside-it.ch/planzer-meldet-datendiebstahl-20261126", publisher: "Inside IT", date: "2026-11-26", role: "primary" }
      - { url: "https://www.swisscybersecurity.net/news/2026-11-26/cyberkriminelle-greifen-daten-von-planzer-ab", publisher: "SwissCybersecurity.net", date: "2026-11-26", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"Schweiz Cyberangriff Datenabfluss Ransomware Gemeinde Spital Verwaltung diese Woche\") → pivot: Inside IT, URL https://www.inside-it.ch/planzer-meldet-datendiebstahl-20261126 → pivot: SwissCybersecurity.net, URL https://www.swisscybersecurity.net/news/2026-11-26/cyberkriminelle-greifen-daten-von-planzer-ab; Planzer's own notice and Digitec Galaxus's own notice were not reachable by search or listed with a URL in either article, so both outlets relay the same two company statements"
    summary: |
      Planzer, a Swiss family-owned transport company, says cybercriminals took data on its customers' transport orders: shipment data that customers transmitted through interfaces or the Planzer customer portal, plus access credentials to the customer portal in encrypted form; the parcel-recipient portal's credentials and finance and payment data were not affected. The company says unusual activity in its IT systems led to the discovery, internal and external forensic specialists are examining it, it informed the BACS and the FDPIC and will file a criminal complaint. Digitec Galaxus (Migros) confirms in its own notice that shipment data for its orders was taken, naming parcel numbers, names, delivery addresses, e-mail addresses and in part phone numbers, the newest dating from early 2023, and says its own systems were not affected. No vector, actor or extortion claim is stated in either article. Both outlets rewrite the same two company statements, so this is effectively one source with a second outlet's confirmation of the Digitec Galaxus notice; both warn of phishing built from the data.
    region_nexus: "switzerland"
    primary_sector_nexus: "indirect (private logistics supplier; its customers may include public bodies, not stated)"
    sector: "transport-logistics"
