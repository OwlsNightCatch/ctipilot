    summary: |
      FIFA, headquartered in Zurich and therefore under Swiss data-protection law, told The Record on 2026-11-25 and inside-it.ch on 2026-11-26 that it was the victim of a criminal cyberattack that resulted in unauthorised access to a limited set of personal and business information, and that it is working with the authorities including law enforcement; it declined to say what data left or whether any systems were encrypted. A group calling itself the Handsome Boy Hacking Club (HBHC), which The Record says emerged the week before and about which little is known, claimed more than 12 GB of FIFA data, says it tried to extort FIFA first, and published the files on a cybercrime forum, saying they came from FIFA's Microsoft environment; Cyber Security News dates the X post that relays the claim to 2026-11-21, puts the archive at 12.2 GB, lists claimed contents of identity and immigration documents, executive information, financial and legal records and governance files, and says FIFA has not verified the claim, while a vendor blog (Secure.com) says HBHC added FIFA to its leak site on 2026-11-20 and that a reviewer counted 2,460 files. Inside World Football reports that sources say the intruders got in by impersonating FIFA staff rather than through a failure of systems, and that the material amounts to under 0.1% of FIFA's data; a researcher it quotes says HBHC is not a well-known group and may be a rebrand, and that countdown timers on its other leaks suggest an unpaid ransom. Inside IT's headline calls the group a ransomware gang and the event a ransomware attack, but its own text records that the spokesperson would not comment on encryption, and no source read reports encrypted systems, so this is data theft and extortion unless FIFA says otherwise.
