  - title: "DIVD publishes the forensic report on its own September breach: two Zammad zero-days, ARP-poisoning lateral movement to Jira and Confluence, 990 attacker scripts, about 26 hours of foothold"
    sources:
      - { url: "https://csirt.divd.nl/2026/11/25/full-disclosure-our-hack/", publisher: "DIVD CSIRT", date: "2026-11-25", role: "primary" }
      - { url: "https://csirt.divd.nl/cases/DIVD-2026-00014/full_disclosure/", publisher: "DIVD CSIRT", date: "2026-11-25", role: "primary" }
      - { url: "https://csirt.divd.nl/downloads/DIVD-2026-00014/DIVD-2026-00014-forensics-report.pdf", publisher: "Merlon Security (forensic report for DIVD, v1.5)", date: "2026-11-24", role: "primary" }
    discovery_trace: "first seen at: divd-csirt, URL https://csirt.divd.nl/feed.xml (2026-11-25 post 'Full disclosure, especially when it is us') → primary: DIVD case page, URL https://csirt.divd.nl/cases/DIVD-2026-00014/full_disclosure/ → primary: Merlon Security forensic report PDF, URL https://csirt.divd.nl/downloads/DIVD-2026-00014/DIVD-2026-00014-forensics-report.pdf (read in full with tools/fetch_source.py pdf, 209 pages)"
    summary: |
      On 2026-11-25 DIVD published the full forensic report (Merlon Security, v1.5 dated 2026-11-24, with NVISO covering Google Workspace) on the breach it first announced on 2026-09-24. The report says the attacker, likely using the open-source agentic framework ARTEX (an assessment resting on tool-name artefacts and the volume of documented scripts, not on attribution to a named actor), first probed the perimeter on 2026-09-21 at 07:40 UTC, stole an administrator's Zammad session at 18:53 UTC through CVE-2026-102489, reached remote code execution by uploading a crafted Zammad package that wrote a malicious Ruby e-mail template which an e-mail login-link request then executed, and became root through CVE-2026-102490 (Merlon says the root step relies on killing the zammad process through systemd, so a containerised Zammad would not have been exposed). Both Zammad servers ran 6.5.2 of 2025-09-10, which Merlon calls outdated for an internet-facing service. From the helpdesk host the attacker sniffed traffic, then ran scheduled ARP poisoning (inside Dutch working hours, with real MACs restored at the end of each window) to sit between Confluence and its unencrypted PostgreSQL link, learned the schema for about six hours, and injected a forged remember-me style session token for the Confluence administrator straight into the database; the same technique then opened Jira. Probes from the helpdesk host through an internal HTTP proxy toward GitLab, vSphere and Proxmox failed; a firewall rule left from an earlier migration had allowed that proxy path. Persistence was an extra admin account and API tokens inside Zammad, a systemd unit and a cron.d entry, and a change to Zammad's Google OAuth settings to request offline Gmail scope, which depended on user consent and captured no token; Zammad-held OAuth tokens for two shared mailboxes were used to send test mails, and cleartext IMAP credentials at the hosting provider, one GitLab personal access token and one send-only Slack bot key were also taken. The attacker dropped 990 custom Python, Ruby and Bash scripts (3,259 output files) into the temp directory and the Zammad public web root, scripts that carry LLM-style commentary. DIVD's IDS flagged the reverse shell at 19:43 UTC on 2026-09-21, a volunteer first responded at 03:04 UTC the next day, the CISO was informed at 15:06 UTC, and the network was isolated at 23:24 UTC, a foothold the report puts at about 26 hours; ARP spoofing also broke the out-of-band VPN the team tried to use. Exfiltration was 2,806 files through the reverse proxy and about 41,000 ticket titles through the Zammad API: 4,121 e-mail addresses, 34 phone numbers and 3 home addresses, 207 of the addresses belonging to DIVD members, no Dutch citizen service numbers, and only old CNA-related mail threads, none inside the 90-day disclosure window. Merlon's recommendations are patching internet-facing services, VPN or WAF in front of them, TLS on internal database links, micro-segmentation, containers or microVMs, honeytokens such as fake tickets with password-reset links, internal network IDS, third-party SOC coverage for working hours, and not running the incident on possibly compromised tools such as Slack.
    region_nexus: "netherlands (DIVD); transferable to DACH: Zammad is widely deployed as a public-sector helpdesk, and the lateral-movement and detection-latency lessons are platform-neutral"
    primary_sector_nexus: "indirect"
    sector: "technology"
    cves: [CVE-2026-102489, CVE-2026-102490]
    techniques: [T1190, T1068, T1539, T1550.004, T1557.002, T1040, T1543.002, T1053.003, T1528, T1098, T1136, T1078, T1213, T1059.004, T1059.006, T1070.004]
