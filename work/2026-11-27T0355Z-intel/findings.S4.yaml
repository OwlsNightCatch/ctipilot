    summary: |
      Planet IC GmbH, a Schwerin IT systems house and data-centre operator that hosts websites for municipalities in Mecklenburg-Vorpommern, says (per dpa and its own notice) that on the evening of Saturday 2026-11-21 an unauthorised party accessed servers of its data centre; it took several web servers and services off the network and the hosted sites offline as a precaution, engaged external forensic specialists and the state criminal police (LKA MV), and informed the state data-protection officer and the BSI. The visible effect started on Wednesday 2026-11-25: the websites of the state capital Schwerin, Greifswald, Waren an der Müritz, the Amt Rostocker Heide, the municipality of Züssow and the Amt Neustrelitz-Land were unreachable and still were on Thursday morning (Schwerin kept its service portal and appointment booking; Neustrelitz says its own operational applications run undisturbed). The utility WEMAG, a customer of the hosting provider, calls it a cyberattack on a hosting service provider, took its customer portals for residential and small-business customers offline and says the attackers potentially had access to customer data in those portals; the NRW.Bank, the North Rhine-Westphalian development bank, took its website offline as a precaution and says it has no indication of its own involvement or a data outflow. Planet IC gives no access vector, no actor, no duration and no statement on data outflow; no ransomware group has claimed it in the sources read. The transferable point for communal and cantonal administrations is concentration risk: one hosting/CMS provider compromise took down the public web presence of several unrelated administrations and a utility at once, while the administrations' own networks reportedly were not touched.
