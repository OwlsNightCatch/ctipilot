        attribution: "Merlon Security (forensic report for DIVD, v1.5)"
        source_url: "https://csirt.divd.nl/downloads/DIVD-2026-00014/DIVD-2026-00014-forensics-report.pdf"
      - quote: "Had the communications between these servers not been unencrypted, the attacker would not have been able to inject a custom session token"
        attribution: "Merlon Security (forensic report for DIVD, v1.5)"
        source_url: "https://csirt.divd.nl/downloads/DIVD-2026-00014/DIVD-2026-00014-forensics-report.pdf"
      - quote: "a total of 990 custom written Python, Ruby and Bash scripts were dropped to disk"
        attribution: "Merlon Security (forensic report for DIVD, v1.5)"
        source_url: "https://csirt.divd.nl/downloads/DIVD-2026-00014/DIVD-2026-00014-forensics-report.pdf"
    extended_notes: |
      Delta against the covered entry (which carries the exploit chain, KEV listing and patch cadence): the forensic report is new, in-window (published 2026-11-25) and first-party. What it adds that a defender can use: (1) the post-exploitation chain after the Zammad root shell is entirely intra-subnet L2 abuse, so a patched Zammad does not protect a flat or lightly segmented network; (2) detection latency, not detection, was the failure (IDS alert at 19:43 UTC, first human response 03:04 UTC next day, CISO about 19 hours after the alert; DIVD relies on volunteers without out-of-hours cover); (3) hunt hooks by telemetry class: Zammad access/audit logs (admin session used from a second source right after an admin sign-in, package upload, e-mail-based login-link request, new API tokens, new admin accounts, edits to the OAuth/SSO initializer), host process lineage and file integrity (zammad-owned shell/Ruby/Python spawned from the temp directory or the web root, new systemd units and /etc/cron.d files), L2 telemetry (gratuitous or duplicate ARP replies for gateway and database addresses, ARP bursts in fixed daily windows, DAI / port-security / IDS such as Suricata or Zeek on east-west traffic), unencrypted database sessions from unexpected clients, helpdesk-host connections to the internal proxy and to vSphere, Proxmox, GitLab; (4) identity: OAuth/XOAUTH2 token use for service mailboxes from unexpected source IPs, IMAP logins to the hosting provider from unexpected IPs; (5) hardening levers: TLS (or mTLS) on Confluence/Jira-to-PostgreSQL links, deny-by-default micro-segmentation even inside one VLAN, containerised or microVM deployment, honey tickets with fake reset links. The report itself discusses AI use: Merlon used a privately hosted GLM-5.3 for parsing attacker output inside sandboxes and says the models hallucinated and mixed up sources, so every claim was human-verified. No IOCs carried here by design (the report publishes account names, paths and addresses; they stay in the primary).
      Entry-routing note for the composer: this finding is an incident, but the covered entry is typed vulnerability and already describes the DIVD breach; a changelog record there (title/headline unchanged, summary + body + sources + evidence + sourcing_note) is the routing the dedup rule implies. If the composer prefers a standalone incident entry it would need a `references[]` link to the Zammad entry because of the shared CVEs. The ARTEX entry (2026-10-22) could also take a one-line cross-reference. Suggested Admiralty: A1 for the breach facts (victim plus independent forensic firm plus NCSC-NL's earlier advisory), with the ARTEX attribution carried as the report's assessment.

