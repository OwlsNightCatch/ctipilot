exploitation_status:
  exactly_what_sources_say: 'watchTowr: ''As of November 26, 2026, no exploitation in the wild has been reported.'' table cell ''Not reported''; ''No attribution has been made public.'' OpenSec: ''The exploit stays private.''; exploit is a five-step sequence of ordinary NFS requests (overflow, KASLR leak via replay, forged-pointer free, refill with a fake callback built from NFS client names, hang up so nfsd runs the callback as root); shown in a recording (victim console plus OpenSec''s client on another machine, talking over tcp/2049). Red Hat only says RCE is ''potentially'' achievable, DoS/kernel panic is the sure outcome. EUVD and the kernel announcement carry no exploitation flag.'
  discoverer_claims: root-shell chain, 'no human in the loop' autonomous build by Antara, 'kernel hardening does not remove the overflow', kernel warning in nfsd4_check_resp_size 'on every attempt' (the last two are OpenSec observations no other source corroborates).
  vendor_facts: 'Red Hat: RCE or DoS, nfsd not on by default in RHEL; CNA text: heap OOB write, KASAN report from a KUnit task (kunit_try_catch) in the fix text; commit text describes the full mechanism.'
  not_independently_reproduced: true
discoverers_and_fix_timeline:
  fix: 'Mainline commit 35ff1a7a7e3835c3e974bc5c45d335897564ceae (7.4-rc1), author Jérémy Jean <Jeremy.Jean@oss.cyber.gouv.fr>, author date Mon, 17 Aug 2026 20:57:14 -0400 (.patch header), trailers ''Assisted-by: Codex:gpt-5'', ''Tested-by: Mayank Jangid (OpenSec Intelligence)'', Signed-off-by Chuck Lever. Merge date into mainline is not stated by any source read.'
  public_patch: Posted by the NFSD maintainer to the public linux-nfs list as [PATCH 1/2], Date 2026-08-17 20:57:14 -0400 (= 2026-08-18 00:57Z) with the complete root-cause + KASAN text; 2/2 is the 'guard'. So the mechanism was public ~13 weeks before the CVE (2026-11-19).
  opensec: 'Antara flagged/exploited 2026-09-21 (OpenSec timeline); reported to NFSD maintainers and security@kernel.org 2026-09-22 with full exploit and a patch (OpenSec); own patch posted to linux-nfs 2026-09-22 11:26:08 +0000 (''Assisted-by: LLM''); OpenSec credits Jean as having found it independently.'
  cve: Kernel CNA announcement Thu, 19 Nov 2026 15:24:20 +0100 (Greg Kroah-Hartman, linux-cve-announce); Red Hat public_date 2026-11-19T14:22:44Z; Ubuntu 'Publication date 19 November 2026'; EUVD datePublished Nov 19, 2026 2:22:44 PM.
  attribution_of_credit_note: The CNA announcement carries no credit line; credit comes from the commit trailers and OpenSec's post. ANSSI affiliation of Jean is OpenSec's statement; the commit shows only an oss.cyber.gouv.fr address.
exposure_test_and_detection:
  discoverer_exposure_test: 'OpenSec ''Am I exposed?'' (all four must hold): kernel older than 6.12.117 / 6.18.61 / 7.3.2 / 7.4-rc1 with no distribution backport (uname -r); nfsd loaded (lsmod | grep -w nfsd); NFSv4.1/4.2 on (cat /proc/fs/nfsd/versions shows +4.1 or +4.2); listener on a non-loopback address (ss -ltn ''sport = :2049''). Caveats: the version line names only four branches (5.10/5.15/6.1/6.6 later fixes exist); ''nfsd loaded'' alone does not mean it is serving (the listener check is what matters).'
  discoverer_hunt_signals: No network signature (valid NFS). Kernel warnings from nfsd4_check_resp_size on every attempt; oopses with nfsd4_*, svc_* or call_usermodehelper* frames; shells spawned by kernel workers on a file server; bursts of short NFSv4.1 sessions from one source. All from OpenSec only, no vendor corroboration.
  post_patch_check: OpenSec's chain ends in a root shell spawned by nfsd's callback, so on a host that was reachable while unpatched the kernel-worker-spawned-shell check is the compromise review; OpenSec says nothing about persistence beyond that.
mitigation_short_of_patching:
  firewall: 'OpenSec, watchTowr, Red Hat all name restricting TCP 2049 to trusted/storage networks (Red Hat: firewalld rich rule; OpenSec: nft drop for sources outside the storage prefix).'
  disable_nfs_server: 'Red Hat: systemctl stop/disable nfs-server where NFS is not needed (terminates active NFS sessions).'
  disable_nfsv41_42: 'OpenSec: [nfsd] vers4.1=n and vers4.2=n in /etc/nfs.conf, restart nfs-server, turns off pNFS and some 4.2 features; watchTowr repeats ''turn off NFSv4.1 and 4.2''. This is the researchers'' stated mitigation; the kernel CNA text names no mitigation and says to update (cherry-picking not recommended). No vendor tracker read endorses it.'
discrepancies:
- topic: CVE publication date
  detail: 'OpenSec says 20 Nov 2026 (timeline and disclosure paragraph); kernel announcement mail (Thu, 19 Nov 2026 15:24:20 +0100), Red Hat public_date 2026-11-19T14:22:44Z, EUVD, Ubuntu and watchTowr say 19 Nov. Verdict: 19 Nov 2026; OpenSec is the outlier.'
- topic: Fixed-version list
  detail: 'Original CNA announcement and OpenSec: 4 branches; EUVD (updated 2026-11-23) and watchTowr: 8. Not a conflict, a record update (see fixed_per_branch).'
- topic: Report date to kernel
  detail: 'OpenSec: reported 22 Sep 2026 (flagged 21 Sep). watchTowr: ''reported as a security issue by OpenSec on September 21, 2026''. OpenSec''s own patch mail is dated 22 Sep 2026 11:26:08 +0000. Verdict: 22 Sep for the report; 21 Sep is OpenSec''s internal discovery date.'
- topic: Fix commit ids
  detail: 'OpenSec cites 5d5a72e965c8 and 241848cc774e (GitHub shows both under torvalds/linux with the same subject/author date, 5d5a72e''s parent 5cd1a33); the kernel CNA lists mainline 35ff1a7a7e3835c3e974bc5c45d335897564ceae. The 35ff1a7a copy carries a ''Tested-by: Mayank Jangid (OpenSec Intelligence)'' trailer that the 5d5a72e copy lacks, i.e. 5d5a72e looks like a pre-merge hash. Cite 35ff1a7a (CNA/Debian) as the mainline fix; the relationship between the two hashes is my inference from the trailers, not a source statement.'
- topic: CVSS
  detail: 9.8 (CNA, SUSE, EUVD, OpenSec own score) vs Red Hat 9.4 (I:L) vs Ubuntu CVSS4 9.3 vs SUSE CVSS4 9.0. Different scorers, not a factual conflict.
- topic: Who is exposed
  detail: 'OpenSec: any host serving NFSv4.1/4.2 on reachable 2049; watchTowr: hosts accepting connections ''from outside networks''/''internet exposed''; Red Hat: only systems configured to export NFSv4.1/4.2. All share the same precondition; differ in how narrowly they word reach.'
- topic: Debian internal
  detail: 'Fixed-version table says unstable 7.3.3-1; status table shows sid 7.3.6-1 fixed (consistent: fixed at 7.3.3-1).'
- topic: Credit
  detail: OpenSec credits Jean for both commits; the .patch header of 241848c shows Chuck Lever as author (message Link still jean-v1-2).
