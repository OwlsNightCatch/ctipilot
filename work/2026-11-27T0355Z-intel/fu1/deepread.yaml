fixed_per_branch:
  original_kernel_cna_announcement_2026_11_19: 6.12.117 (1a5a227bca6a8a9f9d31230697aeb84c62a21da6), 6.18.61 (37fc2ec211630360e9aefcaaec8730db964645f2), 7.3.2 (ed98b0c57e5e84290c5b35428144ab26778905f3), 7.4-rc1 (35ff1a7a7e3835c3e974bc5c45d335897564ceae) - the announcement writes 'fixed in 6.12.117', 'fixed in 6.18.61', 'fixed in 7.3.2', 'fixed in 7.4-rc1', each 'Issue introduced in 3.16 with commit 47ee52986472dba068e8223cbaf1b65d74238781'.
  later_record_versions: EUVD (dateUpdated 2026-11-23) and watchTowr (2026-11-26) additionally carry 5.10.275, 5.15.226, 6.1.193, 6.6.163. EUVD lists eight stable commits but does not map commit to branch, so no commit-to-branch mapping is claimed here for the four older branches.
  why_they_differ: The announcement says the CVE record 'will be updated if fixes are backported'; the later branches came in via record updates (EUVD updated 2026-11-23). OpenSec's post lists only the four announced branches. Source of the extra four = the kernel CNA's updated record (EUVD and watchTowr read the same record), so they are one lineage, not two independent confirmations.
  guard_commit: 241848cc774e (Chuck Lever) is described by its own text as 'a guard rather than a fix' ('Whether a COMPOUND reaches that boundary is unproven') and is not in the CNA fixed-version list.
