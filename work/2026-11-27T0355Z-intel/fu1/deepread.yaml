  passage_miss_count: 0
  method: 'script: slice by start/end anchor from the saved body, then re-read the written YAML and re-test containment'
one_line_verdict: 'Out-of-band action is warranted only for hosts that actually serve NFS (nfsd running with NFSv4.1/4.2 and TCP 2049 reachable beyond a storage segment): there the vendors'' own mitigation (restrict 2049 / stop nfs-server, or OpenSec/watchTowr''s switch-off of NFSv4.1+4.2) is the only protection today for Ubuntu (all releases still ''Vulnerable''), RHEL 9/10 and Debian bookworm''s 6.1 kernel (no fix listed); hosts that do not run nfsd need nothing beyond the normal kernel cycle (Red Hat: not exposed). Facts do not support a stop-everything call: no exploitation in the wild reported (watchTowr, 2026-11-26), not in CISA KEV (catalogue 2026.11.25), the exploit chain is described but private (OpenSec); what raises urgency is that the fix with the full root-cause text has been on the public linux-nfs list since 2026-08-17 and OpenSec claims a working unauthenticated root chain.'
default_state_answer:
  question: Is the NFS server only reachable when an operator exports shares?
  stated_by_sources: 'Red Hat (vendor statement for RHEL only): default RHEL does not run or enable nfsd, so the attack surface is ''systems specifically configured to export NFSv4.1 or NFSv4.2 shares'' and non-NFS-server hosts are ''not exposed''. OpenSec: ''any Linux host serving NFSv4.1 or 4.2 (the default) on a reachable tcp/2049'' - here ''the default'' qualifies the NFS versions served by nfsd, not nfsd being on. watchTowr: must run the in-kernel NFS server with 4.1+ sessions.'
  not_stated_anywhere: No fetched source says whether an nfsd with ZERO exports (or one that restricts exports by client address in /etc/exports) still answers EXCHANGE_ID / CREATE_SESSION / SEQUENCE from an arbitrary client, i.e. whether export ACLs reduce reach. OpenSec only says one unauthenticated TCP connection to 2049 suffices. Do not state that an export is required.
  trap: watchTowr's sentence 'The CVE record marks the Linux kernel as affected by default ... with no additional configuration needed' is a statement about the record's version-range status, not about nfsd running by default; it must not be quoted as 'enabled by default'.
