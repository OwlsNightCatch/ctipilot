    verbatim_passage: Es besteht keine Gefahr für Kundendaten. Unsere betrieblichen Anwendungen laufen weiterhin ohne Störung
    translation: There is no danger to customer data. Our operational applications continue to run without disruption
    verbatim_verified: true
  - id: A16
    kind: fact
    claim: 'Greifswald (city spokesperson to Nordkurier, 25 Nov): interim solution being prepared; own IT infrastructure unaffected; Schwerin: service portal and appointment booking stay reachable; whether all outages share one cause was ''not officially confirmed'' as of 25 Nov'
    source_url: https://www.nordkurier.de/regional/schwerin/schwerin/cybervorfall-in-mv-internetseiten-nicht-erreichbar-kundendaten-in-gefahr-5038094
    file: work/2026-11-27T0355Z-intel/fu3/a5_nk_schwerin.md
    verbatim_passage: Es wird eine Übergangslösung vorbereitet, damit das veröffentlicht werden kann, was veröffentlicht werden muss“, sagte ein Sprecher der Stadt. Die eigene IT-Infrastruktur sei von der Störung nicht betroffen.
    translation: An interim solution is being prepared so that what has to be published can be published," said a city spokesman. The city's own IT infrastructure was not affected by the disruption.
    verbatim_verified: true
  - id: A17
    kind: fact
    claim: 'Schwerin placeholder page as fetched in this run on 2026-11-27 (about 04:36Z): site still offline, service portal reachable, no cause stated'
    source_url: https://www.schwerin.de/
    file: work/2026-11-27T0355Z-intel/fu3/s1_schwerin.md
    verbatim_passage: Aus technischen Gründen kann www.schwerin.de derzeit nicht aufgerufen werden.
    translation: For technical reasons www.schwerin.de cannot currently be accessed.
    verbatim_verified: true
  - id: A18
    kind: fact
    claim: 'WEMAG (own notice, 25 Nov): an external hosting provider of the WEMAG group is affected by a cyber security incident; compromised systems taken off the network. WEMAG does NOT name Planet IC in its notice (absence verified, see absence_checks)'
    source_url: https://www.wemag.com/aktuelles-presse/wemag-unternehmensgruppe-informiert-ueber-cyberangriff-auf-hosting-dienstleister
    file: work/2026-11-27T0355Z-intel/fu3/a1_wemag.md
    verbatim_passage: Ein externer Hosting-Dienstleister der WEMAG-Unternehmensgruppe ist von einem Cybersicherheitsvorfall betroffen. Die kompromittierten Systeme wurden vom Netz genommen.
    translation: An external hosting service provider of the WEMAG group is affected by a cyber security incident. The compromised systems were taken off the network.
    verbatim_verified: true
  - id: A19
    kind: fact
    claim: 'WEMAG effects: several websites and the customer portals for private and small-business customers of WEMAG and WEMACOM unreachable; online tariff sign-up impossible; outsourced sales-system services affected'
    source_url: https://www.wemag.com/aktuelles-presse/wemag-unternehmensgruppe-informiert-ueber-cyberangriff-auf-hosting-dienstleister
    file: work/2026-11-27T0355Z-intel/fu3/a1_wemag.md
    verbatim_passage: Seitdem sind mehrere Websites sowie die Kundenportale für Privat- und Kleingewerbekunden der WEMAG und der WEMACOM nicht erreichbar. Tarife können derzeit online nicht abgeschlossen werden. Weiterhin sind ausgelagerte Dienste des Vertriebssystems betroffen.
    translation: Since then, several websites as well as the customer portals for private and small-business customers of WEMAG and WEMACOM have been unreachable. Tariffs cannot currently be concluded online. Outsourced services of the sales system are also affected.
    verbatim_verified: true
  - id: A20
    kind: fact
    claim: 'WEMAG data statement (the load-bearing fact for data reached): potential access, analysis ongoing; supervisory authorities notified'
    source_url: https://www.wemag.com/aktuelles-presse/wemag-unternehmensgruppe-informiert-ueber-cyberangriff-auf-hosting-dienstleister
    file: work/2026-11-27T0355Z-intel/fu3/a1_wemag.md
    verbatim_passage: Nach aktuellem Kenntnisstand hatten die Angreifer potenziell Zugriff auf Kundendaten in den Kundenportalen. Die technische Analyse durch den Dienstleister und die Bewertung möglicher Auswirkungen dauern an.
    translation: According to current knowledge, the attackers potentially had access to customer data in the customer portals. The technical analysis by the service provider and the assessment of possible effects are ongoing.
    verbatim_verified: true
  - id: A21
    kind: fact
    claim: 'WEMAG: notifications to the competent supervisory authorities have been made (authorities not named)'
    source_url: https://www.wemag.com/aktuelles-presse/wemag-unternehmensgruppe-informiert-ueber-cyberangriff-auf-hosting-dienstleister
    file: work/2026-11-27T0355Z-intel/fu3/a1_wemag.md
    verbatim_passage: Die Meldungen bei den zuständigen Aufsichtsbehörden sind erfolgt.
    translation: The notifications to the competent supervisory authorities have been made.
    verbatim_verified: true
  - id: A22
    kind: fact
    claim: 'WEMAG: electricity and grid supply, internet and telephone services unaffected'
    source_url: https://www.wemag.com/aktuelles-presse/wemag-unternehmensgruppe-informiert-ueber-cyberangriff-auf-hosting-dienstleister
    file: work/2026-11-27T0355Z-intel/fu3/a1_wemag.md
    verbatim_passage: Die Strom- und Netzversorgung sowie die Internet- und Telefondienste der WEMAG-Unternehmensgruppe funktionieren uneingeschränkt.
    translation: The electricity and grid supply and the internet and telephone services of the WEMAG group work without restriction.
    verbatim_verified: true
  - id: A23
    kind: fact
    claim: 'WEMAG customer advice: change the portal password if reused elsewhere; phishing caution'
    source_url: https://www.wemag.com/aktuelles-presse/wemag-unternehmensgruppe-informiert-ueber-cyberangriff-auf-hosting-dienstleister
    file: work/2026-11-27T0355Z-intel/fu3/a1_wemag.md
    verbatim_passage: Sollten Sie das Passwort Ihres Kundenportals auch für andere Dienste nutzen, empfehlen wir, es vorsorglich zu ändern.
    translation: If you also use the password of your customer portal for other services, we recommend changing it as a precaution.
    verbatim_verified: true
  - id: A24
    kind: claim
    claim: 'NDR (original of the ''data outflow'' reports) states as its own inference: customer data ''vermutlich ... gestohlen'' - stronger than WEMAG''s ''potenziell Zugriff'''
    source_url: https://www.ndr.de/nachrichten/mecklenburg-vorpommern/cyberangriff-auf-schweriner-it-dienstleister,cyberangriff-170.html
    file: work/2026-11-27T0355Z-intel/fu3/a14_ndr.md
    verbatim_passage: Nach jetzigem Kenntnisstand sind nach einem Cyberangriff auf ein IT-Unternehmen in Schwerin vermutlich Kundendaten des Energieversorgers WEMAG gestohlen worden.
    translation: According to current knowledge, after a cyberattack on an IT company in Schwerin, customer data of the energy supplier WEMAG has presumably been stolen.
    verbatim_verified: true
  - id: A25
    kind: press-paraphrase
    claim: ad-hoc-news (rewrite) states a data outflow as established - contradicted by WEMAG's own wording and by the Rostock prosecutor; do not carry
    source_url: https://www.ad-hoc-news.de/wissenschaft/hackerangriff-in-schwerin-auch-drei-stadtverwaltungen-offline/70558574
    file: work/2026-11-27T0355Z-intel/fu3/a6_adhoc.md
    verbatim_passage: Bei dem Versorger kam es nach derzeitigem Kenntnisstand zu einem Datenabfluss, bei dem Kundendaten nach außen gelangt sind.
    translation: At the utility there was, according to current knowledge, a data outflow in which customer data reached the outside.
    verbatim_verified: true
  - id: A26
    kind: fact
    claim: 'Local outlet schwerin.news itself flags the press escalation: WEMAG''s official notice is more cautious, an actual outflow is not conclusively confirmed; bank details mentioned in reporting are unconfirmed'
    source_url: https://schwerin.news/2026/11/26/ein-gezielter-cyber-angriff-was-ueber-den-hackerangriff-auf-planet-ic-bisher-bekannt-ist/
    file: work/2026-11-27T0355Z-intel/fu3/a8_schwerinnews.md
    verbatim_passage: Die offizielle Mitteilung der WEMAG ist vorsichtiger formuliert. Ein tatsächlicher Datenabfluss ist bislang nicht abschließend bestätigt.
    translation: WEMAG's official notice is worded more cautiously. An actual data outflow has so far not been conclusively confirmed.
    verbatim_verified: true
  - id: A27
    kind: claim
    claim: Bank details as a possibly affected data field appear only in press reporting, unconfirmed
    source_url: https://schwerin.news/2026/11/26/ein-gezielter-cyber-angriff-was-ueber-den-hackerangriff-auf-planet-ic-bisher-bekannt-ist/
    file: work/2026-11-27T0355Z-intel/fu3/a8_schwerinnews.md
    verbatim_passage: In der Berichterstattung wurden auch mögliche Bankverbindungen als betroffenes Datenfeld genannt. Eine Bestätigung dafür liegt bislang nicht vor.
    translation: Reporting also named possible bank details as an affected data field. There is so far no confirmation of this.
    verbatim_verified: true
  - id: A28
    kind: fact
    claim: WEMAG website back online by Thursday morning 26 Nov (dpa); status of the customer portals after 25 Nov is not stated in any source read
    source_url: https://www.nordkurier.de/regional/mecklenburg-vorpommern/hacker-legen-stadt-webseiten-lahm-was-steckt-hinter-dem-cyberangriff-5039267
    file: work/2026-11-27T0355Z-intel/fu3/a2_nk_lahm.md
    verbatim_passage: Der Energieversorger Wemag, dessen Webseite zunächst ebenfalls abgeschaltet war, ist derweil wieder online.
    translation: The energy supplier Wemag, whose website had initially also been switched off, is meanwhile back online.
    verbatim_verified: true
  - id: A29
    kind: fact
    claim: 'NRW.Bank statement (dpa): no indication of own involvement and therefore none of data outflow; website offline as precaution, substitute page keeps customer portals reachable; site holds no bank data'
    source_url: https://www.nordkurier.de/regional/mecklenburg-vorpommern/hackerangriff-seite-von-nrwbank-vorsorglich-abgeschaltet-5040197
    file: work/2026-11-27T0355Z-intel/fu3/a3_nk_nrwbank.md
    verbatim_passage: Für eine Betroffenheit der NRW.Bank gibt es keinerlei Hinweise, insofern auch nicht für einen Datenabfluss“, betonte die Bank. Die Internetseite stelle in erster Linie Informationen zur Verfügung und beinhalte keine Bankdaten.
    translation: There is no indication whatsoever of the NRW.Bank being affected, and therefore none of a data outflow," the bank stressed. The website primarily provides information and contains no bank data.
    verbatim_verified: true
  - id: A30
    kind: fact
    claim: 'dpa: NRW.Bank link to the Schwerin provider; Planet IC informed LKA MV, the state data-protection officer and BSI'
    source_url: https://www.nordkurier.de/regional/mecklenburg-vorpommern/hackerangriff-seite-von-nrwbank-vorsorglich-abgeschaltet-5040197
    file: work/2026-11-27T0355Z-intel/fu3/a3_nk_nrwbank.md
    verbatim_passage: Informiert worden seien auch der Datenschutzbeauftragte des Landes Mecklenburg-Vorpommern und das Bundesamt für Sicherheit in der Informationstechnik (BSI).
    translation: The data-protection officer of the state of Mecklenburg-Vorpommern and the Federal Office for Information Security (BSI) had also been informed.
    verbatim_verified: true
  - id: A31
    kind: fact
    claim: 'Nordkurier 25 Nov (before Planet IC''s confirmation): WEMAG had classified it as a cyberattack on a service provider; municipalities spoke of a disruption at an external provider; common cause ''not officially confirmed'''
    source_url: https://www.nordkurier.de/regional/schwerin/schwerin/cybervorfall-in-mv-internetseiten-nicht-erreichbar-kundendaten-in-gefahr-5038094
    file: work/2026-11-27T0355Z-intel/fu3/a5_nk_schwerin.md
    verbatim_passage: Während die Kommunen zunächst von einer Störung bei einem externen Anbieter sprechen, hat die Wemag den Vorfall bereits als Cyberangriff auf einen Dienstleister eingeordnet.
    translation: While the municipalities initially speak of a disruption at an external provider, Wemag has already classified the incident as a cyberattack on a service provider.
    verbatim_verified: true
  - id: A32
    kind: fact
    claim: 'NDR: what the investigators still need to establish - how the access happened, whether it is completed, whether the vulnerability is closed (i.e. the vector is not publicly known; ''Sicherheitslücke'' here is generic, not a named flaw)'
    source_url: https://www.ndr.de/nachrichten/mecklenburg-vorpommern/cyberangriff-auf-schweriner-it-dienstleister,cyberangriff-170.html
    file: work/2026-11-27T0355Z-intel/fu3/a14_ndr.md
    verbatim_passage: Wichtig für die Ermittler sei es herauszubekommen, wie der Zugriff erfolgen konnten, ob er abgeschlossen ist und ob die Sicherheitslücke geschlossen werden konnte.
    translation: It is important for the investigators to find out how the access was able to occur, whether it is complete and whether the security hole could be closed.
    verbatim_verified: true
  - id: A33
    kind: press-paraphrase
    claim: dpa/Boersen-Zeitung characterisation of the takedown as common industry practice is the outlet's remark, not NRW.Bank's or Planet IC's
    source_url: https://www.boersen-zeitung.de/banken-finanzen/it-dienstleister-der-nrw-bank-angegriffen
    file: work/2026-11-27T0355Z-intel/fu3/a11_boersenzeitung.md
    verbatim_passage: Ein in der Branche übliches Vorgehen.
    translation: A procedure that is usual in the industry.
    verbatim_verified: true
  - id: A34
    kind: claim
    claim: 'Unsourced local-press claim about an earlier Schwerin portal outage (22 Oct, ''security holes in software in use''): not attributed, not linked to Planet IC by any source; do not carry'
    source_url: https://schwerin-lokal.de/cyberangriff-schwerin-stadtportal-wemag/
    file: work/2026-11-27T0355Z-intel/fu3/a9_schwerinlokal.md
    verbatim_passage: Erst am 22. Oktober war das Stadtportal nach einer vorübergehenden Abschaltung wieder vollständig erreichbar gewesen. Hintergrund waren damals Sicherheitslücken in einer eingesetzten Software.
    translation: Only on 22 October had the city portal been fully reachable again after a temporary shutdown. The background at the time was security holes in software in use.
    verbatim_verified: true
  - id: A35
    kind: press-paraphrase
    claim: ad-hoc-news says Greifswald and Waren confirmed Planet IC; NDR (original) says Schwerin and Waren confirmed - the two outlets disagree, ad-hoc-news is the rewrite; no source read has Greifswald confirming Planet IC by name
    source_url: https://www.ad-hoc-news.de/wissenschaft/hackerangriff-in-schwerin-auch-drei-stadtverwaltungen-offline/70558574
    file: work/2026-11-27T0355Z-intel/fu3/a6_adhoc.md
    verbatim_passage: Beide letztgenannten Städte bestätigten Planet IC offiziell als ihren IT-Dienstleister.
    translation: Both of the last-named cities officially confirmed Planet IC as their IT service provider.
    verbatim_verified: true
  - id: A36
    kind: fact
    claim: dpa descriptor 'kommunaler IT-Dienstleister' (ownership not stated by any source read); Planet IC describes itself as digital agency with IT systems house and data centre, 50 employees, since 1992
    source_url: https://www.planet-ic.de/
    file: work/2026-11-27T0355Z-intel/fu3/a7_planetic_home.md
    verbatim_passage: PLANET IC ist ein Unternehmen für digitale Kommunikation – mit 50 Mitarbeitern, seit 1992.
    translation: PLANET IC is a company for digital communication, with 50 employees, since 1992.
    verbatim_verified: true
  one_line_verdict: 'Marginal: from facts alone a Swiss Tier 2/3 responder or SOC manager would change nothing within 7 days - no vector, actor, technique, product or Swiss party is stated, so there is nothing to hunt, patch or block; the only fact-derived prompt is a supplier-notification and fallback-page check on Swiss bodies that outsource public web hosting, which is generic and rests on inference, not on anything the sources establish.'
item_b_basel_stadt_dsb:
  title: Basel-Stadt data protection commissioner's binding directive on moving cantonal VPN and web proxy into a US provider's cloud
  sources_read_in_full:
  - role: S2-listed primary
    publisher: Kanton Basel-Stadt, Datenschutzbeauftragte (bs.ch news page)
    date: first published Wed 2026-11-18 17:58; page shows 19.11.2026 06:08; modified 2026-11-19T08:31+0100
    url: https://www.bs.ch/news/2026-weisung-zur-auslagerung-der-kantonalen-vpn-und-web-proxy-loesungen-die-cloud
    file: b1_bsch.md (+ b1_bsch_raw.html for the dates)
    transport: extract + url --direct
    adds: the DSB's communication in full (about 480 words). It is a communication ABOUT the directive, not the directive (Verfuegung) itself; the directive text was not published or seen by DNIP
  - role: S2-listed
    publisher: Steiger Legal (RA Martin Steiger)
    date: '2026-11-21'
    url: https://steigerlegal.ch/2026/11/21/datenschutzbeauftragte-basel-stadt-auslagerung-cloud-dienst/
    file: b2_steiger.md
    transport: extract
    adds: commentary; quotes IDG BS sections 13 and 47; product inference with tender facts; assessment 'ungewoehnliche Massnahme'
  - role: S2-listed
    publisher: Inside IT (Hans Joerg Maron)
    date: 2026-11-25 15:20
    url: https://www.inside-it.ch/basler-datenschutzbeauftragte-verhindert-datenauslagerung-20261125
    file: b3_insideit.md (+ b3_insideit_raw.html)
    transport: extract + url --direct
    adds: 'PAYWALLED: only the two-paragraph lead is readable and repeats the DSB communication; nothing else can be verified from it'
  - role: S2-listed
    publisher: Das Netz ist politisch (DNIP; author Adrienne Fichter)
    date: '2026-11-25'
    url: https://dnip.ch/2026/11/25/basler-datenschuetzerin-stoppt-cloud-plaene-fuer-das-kantonsnetz-wegen-prisma-access-von-palo-alto-networks/
    file: b4_dnip.md
    transport: extract
    adds: finance-department reply; anonymous-source product claim; author's explanation of TLS decryption and of the M365 background; not the directive text
  - role: S2-listed
    publisher: Netzwoche (René Jaun)
    date: '2026-11-26'
    url: https://www.netzwoche.ch/news/2026-11-26/basler-datenschutzbeauftragte-untersagt-vpn-auslagerung-an-us-amerikanischen
    file: b5_netzwoche.md
    transport: extract
    adds: relays DSB, Steiger, DNIP; Rekurs route; no independent reporting beyond its paraphrases
  - role: added
    publisher: Inside IT tender report (paywalled; lead readable)
    date: '2025-09-24'
    url: https://www.inside-it.ch/basel-stadt-loest-vpn-infrastruktur-fuer-11-millionen-ab-20250924
    file: b7_insideit_tender.md
    transport: extract
    adds: dates the award coverage to September 2025 (not April 2025), CHF 11.3 million, ZTNA, finance department
  - role: attempted, not readable
    publisher: simap.ch award page (linked by Steiger and Netzwoche)
    date: '-'
    url: https://www.simap.ch/de/project-detail/25f11bd5-fb92-49a0-a788-1bb75ff8dc7b
    file: b8_simap.md
    transport: extract (jina) -> cookie-check error page
    adds: nothing; award facts rest on Steiger's relay
  - role: attempted, not readable
    publisher: 'Gesetzessammlung BS: IDG SG 153.260'
    date: '-'
    url: https://www.gesetzessammlung.bs.ch/app/de/texts_of_law/153.260
    file: b6_idg.md
    transport: extract (raw SPA shell), WebFetch (shell, no legal text)
    adds: nothing; the legal text in the claim table is Steiger's quotation only
  answers:
    bs_ch_communication:
      date_on_page: First published Wednesday 18 November 2026, 17:58; the page displays 19.11.2026 - 06:08 as its date and its HTML metadata gives a modification time of 2026-11-19T08:31:19+0100. Steiger dates 'the communication' 19 November 2026; DNIP (25 Nov) says 'letzte Woche'. The date of the directive (Verfuegung) itself is not stated anywhere. The DSB's contact-hours line on the page is unrelated.
      exact_content: The DSB (Danielle Kaufmann, per Inside IT/Netzwoche) issued a binding directive to stop the cantonal administration's planned move of its previously local remote access (VPN) and web proxy into the cloud of a US provider, whose planned role includes breaking the encryption. Claims B01 to B07.
      reasons_given: (1) provider would in fact be able to read most cantonal traffic incl. health and tax data, files, case files, passwords, state-security-relevant information; (2) prior consultation (Vorabkonsultation) not submitted before contracting - DSB learned from concerned employees; (3) negative recommendation given and ignored; (4) no urgency shown, local solution extendable, other cantons keep local solutions; (5) loss of control and independence, high fundamental-rights and critical-infrastructure risk, disproportionate given alternatives.
      legal_basis_cited_on_the_page: No statute section is cited. Only 'gesetzlicher Auftrag als unabhaengige Datenschutzaufsichtsbehoerde' and the Vorabkonsultation duty (B04b, B08). The IDG BS section 13 (prior consultation) and section 47 (directive after a refused recommendation; direct issue if refusal foreseeable; Rekurs to the Appellationsgericht) come from Steiger's annex, which I could not check against the statute (B10 to B12).
      what_the_administration_must_do: 'The page states only that the DSB ''stopped the planned outsourcing with a binding directive'' (B01). It states no operative wording, no deadline, no reporting duty and says nothing about the existing contract or the CHF 11.3 million award. Steiger says only that the public organ addressed can contest by Rekurs (B13). Whether a Rekurs is filed or has suspensive effect: not stated anywhere.'
      did_the_canton_respond: 'Only via DNIP (relayed by Netzwoche): the finance department, which runs cantonal IT, says it is examining the DSB''s objection (''Einsprache'') legally and in substance, gives no further information because of the ''laufendes Verfahren'', and declined to answer which provider/product (B20 to B22). The DSB was not reachable for DNIP. No Regierungsrat statement and no report of a filed Rekurs in any source read or in a further search (a Grosser-Rat document surfaced is an older appeal-model paper, not a response).'
    what_steiger_inside_it_netzwoche_add:
      Steiger: The only source with the statute text (via quotation), the tender facts (award 17 Sep 2025, CHF 11'323'822.60 gross to BNC AG, now Axians BNC), the product inference with hedged wording ('moeglicherweise', 'koennte') and the assessment that binding measures against US-cloud use by a cantonal DPA are unusual 'soweit ersichtlich'. Claims B09 to B17.
      Inside_IT: 'Nothing verifiable: the article is paywalled (lead only, B27). S2''s attribution of the Infra21+ / CHF 11.3 million tender context to Inside IT is therefore only supported by Inside IT''s separate 2025-09-24 tender report lead (B28) and by Steiger/DNIP.'
      Netzwoche: Relays the DSB, Steiger and DNIP; adds Kaufmann in office since August 2024 (B26), the Rekurs route (B22), and its own gloss 'teils unverschluesselt' (B25, not what the DSB text says). No independent reporting.
    DNIP_anonymous_claim: UNATTRIBUTED. 'Mehrere Quellen aus der kantonalen IT' (and 'mehrere IT-Mitarbeitende') say the product is Palo Alto Networks, a Prisma Access licence (B18). DNIP states it did not see the directive and could not reach the DSB (B19); the finance department declined the question (B21). Netzwoche describes this as 'anonyme Quellen aus der Verwaltung' (B24). The explanatory material in DNIP about SSL inspection, hyperscaler hosting of Zurich nodes and Cloud Act exposure is the author's framing or her relay of vendor claims (B30, B32), not a statement of the DSB.
    provider_named_on_the_record: 'No. The DSB does not name it (absence check: zero hits for Palo, Prisma, Axians, BNC, Microsoft in the bs.ch text; Netzwoche and Steiger both say the DSB does not name it). The finance department declined to answer. The only on-the-record procurement fact is the public award to BNC AG for a ZTNA solution whose technology the tender text does not name (B16, B29). The product identification therefore rests on Steiger''s inference and DNIP''s anonymous sources.'
    binding_scope_per_the_text: The directive concerns the cantonal administration's own planned outsourcing and is addressed to the responsible office of that administration ('gegenueber der verantwortlichen Amtsstelle', B05); per Steiger's IDG quotation it binds 'das oeffentliche Organ, an welches die Weisung gerichtet ist', who may contest it by Rekurs to the Appellationsgericht (B10, B13). The text says nothing about any other canton, commune or body; other cantons appear only as a comparison ('setzen auch die anderen Kantone ... weiterhin auf klassische, lokale Loesungen', B06). It is not framed as a general ban on cloud VPN/proxy.
    wording_discrepancies_versus_S2:
    - 'S2 summary says the CHF 11.3 million contract ''went in April 2025 to BNC''. No source read says April 2025: Steiger gives the award as 17 September 2025 and Inside IT''s tender report is dated 2025-09-24 (B16, B28). Use September 2025.'
    - S2 title says the DSB cites 'TLS inspection by the provider'. The bs.ch text says 'die Verschluesselung aufbricht' and contains neither 'TLS' nor 'SSL' (absence check; the 'ssl' hits are inside 'einschliesslich'). 'SSL-Inspection/TLS-Decryption' is DNIP's explanation (B30). The entry should quote the DSB's wording.
    - 'S2 says the bs.ch page metadata reads 2026-11-18 while Steiger cites 19 November: both are right (first published 18 Nov 17:58, displayed/updated 19 Nov 06:08, B09).'
    - S2 says Inside IT and DNIP carry the tender context; Inside IT's text is paywalled (above).
