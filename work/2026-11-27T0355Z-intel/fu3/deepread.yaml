  answers:
    what_each_party_states_with_dates:
      Planet_IC_own_notice: 'Unauthorised access to servers of its data centre on Saturday evening 21 Nov (''nach derzeitigem Kenntnisstand''); external forensics and LKA engaged; state data-protection officer and BSI informed; restoring step by step; no date and no scope of data stated (homepage news box read 2026-11-27; reproduced in dpa/Nordkurier 2026-11-26). To NDR (26 Nov): cannot yet say whether customer data was stolen; will not name customers (confidentiality); goal a controlled, safe restart; no interview. Claims A01 to A08.'
      WEMAG_2026-11-25: An external hosting provider of the group is affected by a cyber security incident; compromised systems taken off the network; several websites and the private/small-business customer portals of WEMAG and WEMACOM offline; online tariff sign-up impossible; outsourced sales-system services affected; supply, grid, internet and telephone unaffected; attackers 'potenziell Zugriff auf Kundendaten in den Kundenportalen'; analysis ongoing; supervisory authorities notified; customers to be informed; password-reuse and phishing advice. Does not name Planet IC. Claims A18 to A23.
      dpa_2026-11-26: Relays Planet IC's e-mail (21 Nov; servers and sites offline; LKA); no figures on outage length, consequences, data outflow; Schwerin, Greifswald, Waren pages unreachable Thursday morning; WEMAG site back online; NRW.Bank statement. Claims A02, A05, A28 to A30.
      NDR_2026-11-25_and_26: 'Waren and Schwerin confirmed Planet IC as their provider; state digital ministry confirmed Greifswald, Amt Rostocker Heide, Amt Crivitz, Amt Zuessow unreachable; NDR research adds WOBAU Wismar, Diakoniegesellschaft, DKB Grund, Ehrenamtsstiftung; Staatsanwaltschaft Rostock investigating (Ausspaehen von Daten) - spokesperson Harald Nowack: no findings yet that data was actually spied out. Claims A06 to A14.'
    municipalities_and_bodies_named:
      Planet_IC_confirmed_provider_on_record:
      - Stadt Waren (Mueritz) (city spokesperson, NDR 25 Nov)
      - Landeshauptstadt Schwerin (NDR 26 Nov)
      unreachable_confirmed_by_state_digital_ministry_to_NDR:
      - Greifswald
      - Amt Rostocker Heide
      - Amt Crivitz
      - Amt Zuessow
      self_reported_by_the_body:
      - 'Amt Neustrelitz-Land (office head Daniela Boess: server among those taken off the network; website only)'
      - Greifswald (interim solution; own IT infrastructure not affected)
      - Schwerin (provisional page; service portal and appointment booking reachable)
      - NRW.Bank (website offline as precaution; no indication of own involvement or data outflow)
      - WEMAG / WEMACOM
      NDR_research_unconfirmed_by_the_bodies_or_Planet_IC:
      - WOBAU Wismar
      - Diakoniegesellschaft
      - DKB Grund
      - Ehrenamtsstiftung
      naming_discrepancies: S4 listed 'municipality of Zuessow' (from ad-hoc-news); NDR/state ministry say 'Amt Zuessow'. ad-hoc-news says Greifswald and Waren confirmed Planet IC; NDR says Schwerin and Waren did. No source read has Greifswald naming Planet IC. Amt Crivitz is new versus S4.
    data_reached_vs_only_outages:
      WEMAG_customer_portals: 'WEMAG (fact): attackers ''potenziell Zugriff'' on customer data in the portals; analysis ongoing; no confirmation that data left. NDR (inference, its lead): ''vermutlich ... gestohlen''. ad-hoc-news (paraphrase): outflow stated as fact - unsupported. Rostock prosecutor: no findings that data was actually spied out. Bank details: press mention only, unconfirmed (schwerin.news). Number of customers: not stated.'
      NRW_Bank: 'Bank (fact): no indication of its own involvement and therefore none of data outflow; website holds no bank data; substitute page keeps customer portals reachable. Outage/precaution only.'
      municipal_sites: Only outages and precautionary shutdowns are stated. Neustrelitz-Land says 'keine Gefahr fuer Kundendaten' (the body's statement about itself). Planet IC gives no statement on data for any customer.
    restoration_status_as_of_2026-11-27_morning: 'Not restored in any source read. schwerin.de answered with the ''vorübergehend nicht erreichbar'' placeholder (service portal reachable) when fetched in this run (~04:36Z 2026-11-27); Planet IC''s homepage still carries the same notice (''schrittweise ... wieder in Betrieb''), unchanged; the newest dated reporting is 2026-11-26 (NDR, schwerin.news, ad-hoc 15:43). Three WebSearch passes (including German 27-Nov and NDR-specific queries) found no 26/27-Nov update, no restoration notice and no prosecutor or Planet IC update. Only restoration reported anywhere: WEMAG''s main website back online by Thursday morning 26 Nov (dpa). Greifswald''s site could not be read (TLS ''unrecognized name'' on every transport); Waren returned a stale 2026-11-06 jina cache (unusable as status).'
    vector_actor_ransomware_encryption: 'None stated by Planet IC, WEMAG, the bodies, NRW.Bank, dpa, NDR or the prosecutor. Term check over those texts: zero hits for ransom, Loesegeld, erpress, verschluessel (as encryption of systems), zero-day, phishing, Schwachstelle; one generic ''Sicherheitsluecke'' in NDR in a sentence saying investigators must still establish how the access happened and whether the hole is closed. No claiming group in the sources read (I did not search leak sites). Say so plainly: vector, actor, ransomware and encryption are all unknown.'
    authorities_informed: 'Planet IC: LKA Mecklenburg-Vorpommern (engaged), Datenschutzbeauftragter des Landes MV, BSI (informed). Staatsanwaltschaft Rostock (Schwerpunkt-Staatsanwaltschaft; opened a Ausspaehen-von-Daten investigation, NDR 26 Nov; not stated that Planet IC informed it). WEMAG: ''die zustaendigen Aufsichtsbehoerden'' (not named). NRW.Bank: none stated.'
    swiss_mention: None. Zero hits for Schweiz/Swiss/BACS/Kanton/Zuerich/Bern across all bodies read (one 'bern' was inside 'uebernehmen'). No Swiss provider or body is named.
    timeline_note: 'Dates do not reconcile across outlets and Planet IC states none for the takedown: intrusion Saturday 21 Nov (Planet IC); Waren city says it switched its site off after irregularities found on several web servers ''am vergangenen Sonnabend'' (NDR 25 Nov, no switch-off time); NDR 26 Nov says the Waren and Schwerin pages are unreachable ''seit Mittwoch'' (25 Nov) while also saying specialists have worked on getting the site back ''seit Montag'' (23 Nov); dpa/ad-hoc say ''seit Mittwoch''. S4''s ''visible effect started 25 Nov'' is the press reading; Planet IC''s takedown date is not public. Hosting for the sites was therefore probably down earlier than 25 Nov for at least Waren, but no source says so outright.'
    provider_attribution_provenance_note: WEMAG's own notice and the NRW.Bank statement (as dpa quotes it) do not themselves name Planet IC; the Planet IC link comes from dpa/NDR/Boersen-Zeitung and from Waren and Schwerin on the record. 'Kommunaler IT-Dienstleister' is dpa's descriptor; no ownership source was read.
