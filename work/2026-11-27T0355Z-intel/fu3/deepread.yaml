  - id: B04
    kind: fact
    claim: 'Reason 1: effective provider access to most cantonal traffic including special-category and secrecy-bound data'
    source_url: https://www.bs.ch/news/2026-weisung-zur-auslagerung-der-kantonalen-vpn-und-web-proxy-loesungen-die-cloud
    file: work/2026-11-27T0355Z-intel/fu3/b1_bsch.md
    verbatim_passage: Der Anbieter hätte somit faktisch die Möglichkeit, auf einen Grossteil der Informationen im kantonalen Datenverkehr zuzugreifen, einschliesslich besonderer Personendaten (z.B. Gesundheitsdaten) und Daten, die einer besonderer Geheimhaltungspflicht unterstehen (z.B. Steuerdaten). Betroffen wären etwa jegliche Word-Dateien, Verfahrensakten, Passwörter, staatssicherheitsrelevante Informationen etc.
    translation: The provider would thus in fact have the possibility of accessing a large part of the information in cantonal data traffic, including special categories of personal data (e.g. health data) and data subject to a special duty of confidentiality (e.g. tax data). Affected would be, for example, any Word files, case files, passwords, information relevant to state security, etc.
    verbatim_verified: true
  - id: B04b
    kind: fact
    claim: 'Reason 2: the prior consultation (Vorabkonsultation) was not submitted before contracting; DSB learned of the plan late, from concerned employees'
    source_url: https://www.bs.ch/news/2026-weisung-zur-auslagerung-der-kantonalen-vpn-und-web-proxy-loesungen-die-cloud
    file: work/2026-11-27T0355Z-intel/fu3/b1_bsch.md
    verbatim_passage: Die geplante Auslagerung hätte der DSB eigentlich im Rahmen einer Vorabkonsultation frühzeitig und vor der vertraglichen Bindung mit dem Anbieter zur Prüfung vorgelegt werden müssen. Dies ist leider nicht geschehen. Dementsprechend erfuhr die DSB erst sehr spät von der geplanten Auslagerung, weil sich besorgte Mitarbeitende an sie gewendet hatten.
    translation: The planned outsourcing should actually have been submitted to the DSB for review within a prior consultation early on and before contractual commitment to the provider. Unfortunately this did not happen. Accordingly the DSB learned of the planned outsourcing only very late, because concerned employees had turned to it.
    verbatim_verified: true
  - id: B05
    kind: fact
    claim: 'Reason 3: DSB gave a negative recommendation to the responsible office; the outsourcing was to proceed regardless -> directive'
    source_url: https://www.bs.ch/news/2026-weisung-zur-auslagerung-der-kantonalen-vpn-und-web-proxy-loesungen-die-cloud
    file: work/2026-11-27T0355Z-intel/fu3/b1_bsch.md
    verbatim_passage: Sie hat gegenüber der verantwortlichen Amtsstelle eine ablehnende Empfehlung abgegeben. Die Auslagerung soll aktuell jedoch trotz ihrer Empfehlung erfolgen.
    translation: It gave the responsible office a negative recommendation. The outsourcing is, however, currently to take place despite its recommendation.
    verbatim_verified: true
  - id: B06
    kind: fact
    claim: 'Reason 4: no urgency shown, local solution can be extended, other cantons (as far as known) keep local VPN/proxy'
    source_url: https://www.bs.ch/news/2026-weisung-zur-auslagerung-der-kantonalen-vpn-und-web-proxy-loesungen-die-cloud
    file: work/2026-11-27T0355Z-intel/fu3/b1_bsch.md
    verbatim_passage: Es ist für die geplante Auslagerung keine besondere Dringlichkeit nachgewiesen worden. Die bestehende, lokal-betriebene Lösung kann verlängert werden. Soweit bekannt, setzen auch die anderen Kantone für ihre VPN und Web Proxys weiterhin auf klassische, lokale Lösungen.
    translation: No particular urgency has been demonstrated for the planned outsourcing. The existing locally operated solution can be extended. As far as is known, the other cantons also continue to rely on classic local solutions for their VPNs and web proxies.
    verbatim_verified: true
  - id: B07
    kind: fact
    claim: 'Reason 5 (proportionality): significant loss of control and independence; high risks to fundamental rights of potentially all customers and all employees and to critical state infrastructure; disproportionate given available alternatives'
    source_url: https://www.bs.ch/news/2026-weisung-zur-auslagerung-der-kantonalen-vpn-und-web-proxy-loesungen-die-cloud
    file: work/2026-11-27T0355Z-intel/fu3/b1_bsch.md
    verbatim_passage: Zusammengefasst wäre mit der geplanten Auslagerung ein bedeutender Kontroll- und Unabhängigkeitsverlust verbunden. Das Vorhaben würde zu hohen Risiken für die Grundrechte der betroffenen Personen (d.h. potenziell alle Kund:innen und alle Mitarbeitenden der Kantonsverwaltung) und für kritische staatliche Infrastruktur führen.
    translation: In summary, the planned outsourcing would involve a significant loss of control and independence. The project would lead to high risks to the fundamental rights of the persons concerned (i.e. potentially all customers and all employees of the cantonal administration) and to critical state infrastructure.
    verbatim_verified: true
