    verbatim_passage: Wir arbeiten mit Hochdruck daran, alle Systeme schrittweise und sicher wieder in Betrieb zu nehmen. Über den weiteren Fortschritt informieren wir, sobald neue Erkenntnisse vorliegen.
    translation: We are working flat out to put all systems back into operation step by step and safely. We will report on further progress as soon as new findings are available.
