    verbatim_passage: Nach Bekanntwerden der unbefugten Zugriffe haben wir mehrere Webserver bzw. Dienste sicherheitshalber vom Netz genommen und die darauf gehosteten Webseiten vorsorglich offline gestellt, um Risiken zu minimieren
    translation: After the unauthorised accesses became known, we took several web servers and services off the network as a safety measure and switched the websites hosted on them offline as a precaution, to minimise risks
    verbatim_verified: true
  - id: A03
