  - id: B02
    kind: fact
    claim: 'What is planned: previously locally operated remote access (VPN) and web proxy of the cantonal administration to move into a US provider''s cloud'
    source_url: https://www.bs.ch/news/2026-weisung-zur-auslagerung-der-kantonalen-vpn-und-web-proxy-loesungen-die-cloud
    file: work/2026-11-27T0355Z-intel/fu3/b1_bsch.md
    verbatim_passage: Die Kantonsverwaltung plant, ihre bis jetzt lokal-betriebenen IT-Lösungen für den sicheren Zugriff auf das kantonale Netzwerk, den «Remote Access» oder «VPN», und die Steuerung des Internetzugriffs, den «Web Proxy», in eine Cloud-Lösung eines US-amerikanischen Anbieters auszulagern.
    translation: The cantonal administration plans to outsource its previously locally operated IT solutions for secure access to the cantonal network, the 'remote access' or 'VPN', and the control of internet access, the 'web proxy', to a cloud solution of a US provider.
    verbatim_verified: true
