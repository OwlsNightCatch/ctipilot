    verbatim_passage: Zur lückenlosen Aufklärung und schnellstmöglichen Wiederherstellung des Normalbetriebs sind externe Forensik-Experten sowie das Landeskriminalamt (LKA) bereits eingebunden. Der Datenschutzbeauftragte des Landes Mecklenburg-Vorpommern und das Bundesamt für Sicherheit in der Informationstechnik (BSI) sind ebenfalls informiert.
    translation: To clarify the incident completely and restore normal operation as quickly as possible, external forensic experts and the State Criminal Police Office (LKA) are already involved. The data-protection officer of the state of Mecklenburg-Vorpommern and the Federal Office for Information Security (BSI) have also been informed.
    verbatim_verified: true
  - id: A04
