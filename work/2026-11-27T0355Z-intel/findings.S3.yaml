      The Huntback intrusion chain is a Windows-and-identity path the composer can use selectively: the single sign-on accepting a stored hash gave the Global Administrator token, and Microsoft 365 role-assignment and user-creation audit events in a burst (accounts with student-style numbers) are the tenant-side signal. Hardening levers named by the sources: patching the 2019 CMS flaw, removing the web service account from local Administrators, unsalted SHA-256 password storage in the single sign-on, backup tables with plaintext passwords.
      Composer note: the ARTEX entry already carries Microsoft's 2026-11-25 defender guide and Wiz's 2026-10 ARTEX report; keep this update to the self-labelling anchors and at most two sentences on the case studies.
