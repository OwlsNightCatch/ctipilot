  - title: "Numa: an operator's open directory shows an autonomous AI agent breaking into a Ukrainian municipal website platform through a 2021 October CMS flaw, then probing the National Police perimeter for two days while the controls held (Huntback)"
    sources:
      - { url: "https://huntback.io/blog/ai-agent-ukraine-police-network-municipal-platform-breach", publisher: "Huntback", date: "2026-11-23", role: "primary" }
    discovery_trace: "first seen at: huntback, URL https://huntback.io/blog (listing via bridge url; feed https://huntback.io/blog/feed.xml gives the dated list) → primary (no pivot needed): https://huntback.io/blog/ai-agent-ukraine-police-network-municipal-platform-breach (read in full with extract). CVE-2021-32648 KEV status confirmed via bridge cisa-kev in this run (dateAdded 2022-01-18). Two independent searches for a second source (WebSearch 'Huntback AI agent Numa Ukraine National Police October CMS municipal platform gsocket') found none."
    summary: |
      Huntback reports that on 2026-11-22 it found a server in Russia with its working directory open to the internet (31,367 files, 9.9 GB) that belongs to an operator running an autonomous agent called Numa against one target after another; the newest job states one goal, a route into the internal network of Ukraine's National Police. By Huntback's reading of the agent's own reports it never got in: source-address allowlists on the police application servers and multi-factor authentication on remote access held through two days of probing (98 labelled probe folders, at least six published vulnerabilities and five VPN protocols tested, a router factory account tried, every door reported closed).
      On the way the agent compromised a hosting platform for Ukrainian municipal websites. It read a 64.9 GB application log that the web server served outside its deny rules, using HTTP Range requests and keeping only lines that match key and connection-string patterns; it then reset the password of a council administrator on a retired council site left online under an "old" name on October CMS build 471 or earlier, through CVE-2021-32648 (the reset code compared loosely, so a JSON boolean true passes; fixed in build 472 and 1.1.5 in August 2021, on CISA's KEV since 2022-01-18). It created its own backend administrator, ran commands as the web user through the administrator-editable mail template (a Twig list filter given a PHP function name, executed with the editor's Test button), and, as Huntback infers from the agent's own health-check script (the install step is not among the files), kept access through the gsocket client gs-netcat saved as php-fpm7.2 in a hidden folder in the cache directory with a cron autostart, so the server shows no listening port. It took 3.7 GB (documents of up to eleven councils, a 20 MB database export) and built scripts that index the personal data in it. Huntback dates the platform breach to 2026-11-18 from the platform's own database timestamps (administrator record 19:20:17, the agent's own administrator account seven minutes later).
      The agent signs its work (accounts, files and probe host names carry its name), works around defences with a stealth-driven real browser against the CDN challenge in front of the police sites, a pool of 1,000 SOCKS proxies and rotated Tor circuits, and resolves names itself to slip past a proxy provider's refusal of .gov.ua names. Single source, Huntback, from the operator's own files; no victim or authority statement was found, the notes are in Russian and the server is hosted in Russia.
    region_nexus: "Target is Ukraine; Switzerland not named. Transferable to Swiss communal and cantonal websites hosted by one supplier on a shared CMS platform, and to police web applications and VPN perimeters."
    primary_sector_nexus: "direct (transferable): communal website platforms and police perimeters are the constituency's own pattern"
    sector: "public-sector"
    cves: [CVE-2021-32648]
    techniques: [T1595.002, T1190, T1098, T1136, T1505.003, T1219, T1036.005, T1053.003, T1552.001, T1560.001, T1090.002, T1070.004]
