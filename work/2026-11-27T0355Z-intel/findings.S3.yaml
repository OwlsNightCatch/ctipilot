    lookback: true
    evidence:
      - quote: "On the morning of 19 November one of our Puppet Server decoys received the whole chain from start to finish"
        attribution: "Huntback"
        source_url: "https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured"
      - quote: "The three requests took 1.47 seconds."
        attribution: "Huntback"
        source_url: "https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured"
      - quote: "This was a check for vulnerable servers, built so that a real command needs one line changed."
        attribution: "Huntback"
        source_url: "https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured"
    extended_notes: |
      Delta for the existing entry: first reported in-the-wild exploitation shape, and the autosign dependency made concrete. Detection concept (telemetry classes): Puppet Server and CA logs: a certificate request for an unknown, random-looking node name that is signed automatically, followed within seconds by a certificate fetch and a report upload from the same source address; report payloads whose events carry a __ptype type definition with a RubyMethod annotation; web or reverse-proxy logs for status-service probes (level=debug) and requests to both /puppet-ca/v1 and the legacy /production/certificate/ca path from one client with a scanner user agent. Exposure check: whether the CA autosigns (policy-based or glob autosign) and whether the server's CA and report ports are reachable from untrusted networks. Hardening levers: fixed releases already in the entry (Puppet Enterprise 2023.8.13, 2025.12.1, 2026.0.1), disable open autosigning, restrict the CA and report endpoints to agent networks.
      Benign lookalikes: legitimate new-node enrolment also signs a request and uploads a report, but from a known address range, after the node's first catalog run and with a plausible host name; here the report upload came 1.4 seconds after the request with no catalog fetch.
