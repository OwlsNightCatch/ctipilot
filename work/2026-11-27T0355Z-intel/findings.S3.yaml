    confidence: MEDIUM
    suggested_classification: "B2"
    suggested_priority: notable
    novelty: new
    lookback: true
    evidence:
      - quote: "Evidence indicates that malicious files were generated not only when users downloaded the programs directly from the official download page but also during the update process of previously installed legitimate programs."
        attribution: "AhnLab ASEC"
        source_url: "https://asec.ahnlab.com/en/96827/"
      - quote: "The specific cause and path of the legitimate installation files being replaced with Malicious Files have not been identified."
        attribution: "AhnLab ASEC"
        source_url: "https://asec.ahnlab.com/en/96827/"
      - quote: "This list contains a total of 1,206 process names and includes various Korean & Global antivirus and EDR products."
        attribution: "AhnLab ASEC"
        source_url: "https://asec.ahnlab.com/en/96827/"
    extended_notes: |
      Exposure: any host that installed or updated Q-Dir (12.83 to 12.85) or DesktopOK (12.82, 12.85) from the SoftwareOK site, or ran their update function, while tampered files were served; ASEC cautions other versions installed in that period may also be affected. The check ASEC gives: compare the installer's SHA-256 with the value on the download page.
      Detection (telemetry classes): process-creation events with parent lineage: an installer that launches the genuine application from the public user folder and, in the same tree, a download of the 7-Zip console tool followed by extraction of an archive into ProgramData\Microsoft; scheduled-task creation events (task name resembling Microsoft Edge in a UPnP task folder) running pythonw.exe from ProgramData, with outbound connections from that interpreter; file-integrity comparison of installers against vendor-published hashes; EDR process enumeration is visible as a one-shot burst of process-list reads by an interpreter. Post-removal: reinstalling does not clear the tool, so look for the interpreter folder, the task and network traces.
      Triage: a legitimate Python install does not live under ProgramData\Microsoft\DeviceSync and a legitimate Q-Dir or DesktopOK installer does not download archives or create tasks; the discriminators are the unsigned or different-hash wrapper, the Python runtime next to a freeware utility, and a pythonw.exe task.
      No indicators carried in the entry (hashes, server address and domain are in the ASEC post).
