      - quote: "The newest job in the directory has one stated goal: a way into the internal network of Ukraine's National Police."
        attribution: "Huntback"
        source_url: "https://huntback.io/blog/ai-agent-ukraine-police-network-municipal-platform-breach"
      - quote: "That is a result worth stating plainly for the defenders involved: the controls held."
        attribution: "Huntback"
        source_url: "https://huntback.io/blog/ai-agent-ukraine-police-network-municipal-platform-breach"
      - quote: "The reset step sends one to the real administrator before anything else happens. In this case it was the only warning a person could have seen."
        attribution: "Huntback"
        source_url: "https://huntback.io/blog/ai-agent-ukraine-police-network-municipal-platform-breach"
    extended_notes: |
      Exposure (source-stated): October CMS installations older than build 472 / 1.1.5, including retired sites kept online; web servers that hand out application logs or framework folders from the storage path; shared platforms where one deployment user reads every tenant's files and one database account reads every tenant's rows; mail and template editors reachable by backend administrators.
      Detection concepts the post derives from the operator's scripts (telemetry classes): web access log (a password-restore request followed by resets across several user ids; sequential Range reads with status 206 of one large log file under storage; bursts of saves to one mail template followed by fetches of short text files from public storage); mail flow (an unrequested password-reset email delivered to a real administrator is the only human-visible warning); stored templates whose HTML calls a list filter (reduce, map, filter, sort) with a PHP function name; process and persistence telemetry on the web host (a long-lived process whose executable sits in a cache or storage folder and is named like php-fpm, a user crontab line starting it, a long-lived outbound connection from a web server to a public relay network). Egress rules on web servers cost little and cut the gsocket channel.
      Benign lookalikes the mechanism implies: administrators legitimately edit mail templates and download managers legitimately issue Range requests; the discriminators are the burst plus Test-button rendering plus a function name in a filter, and one client reading a log file in fixed slices.
      Defender takeaway: the controls that held were source-address allowlists on application servers and MFA on remote access; what leaked was the shared supplier platform and old sites left online. Inventory retired websites on shared platforms, treat administrator-editable templates as code, and ask which other customers of the same web supplier run the same code.
      Related: the store's gsocket entry (2026-11-12) documents the same relay client persisting after web patching.
    borderline: false
