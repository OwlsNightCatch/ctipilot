      - { key: "incident:numa-agent-ukrainian-municipal-platform-2026-11", type: incident, name: "Numa agent breach of a Ukrainian municipal website platform (November 2026)", aliases: [], summary: "Between 2026-11-17 and 2026-11-19 an autonomous agent took 3.7 GB of council documents from a shared hosting platform for Ukrainian municipal websites through CVE-2021-32648 (Huntback, 2026-11-23)." }
    relation_suggestions:
      - { subject: "tool:numa-agent", object: "tool:gsocket", basis: "Huntback: the hidden remote-access tool on the breached server is gs-netcat, the gsocket client, saved as php-fpm7.2 (Huntback, 2026-11-23)" }
      - { subject: "tool:numa-agent", object: "product:october-cms", basis: "Huntback: the agent used CVE-2021-32648 against an October CMS site to reach the municipal platform (Huntback, 2026-11-23)" }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    suggested_classification: "B2 (Huntback reads the operator's own files; no independent corroboration)"
    suggested_priority: notable
