      - quote: "Hits are useful tool markers and pacing clues, but not operator fingerprints."
        attribution: "Wiz Research"
        source_url: "https://www.wiz.io/blog/agentic-offensive-frameworks-intent-ids-artex-cairn"
      - quote: "They may be useful for fingerprinting agent swarms, because they can't easily alter or remove the labeling scheme without breaking the agent's own state tracking."
        attribution: "Cisco Talos"
        source_url: "https://blog.talosintelligence.com/the-great-escape-tradecraft-insights-from-an-agentic-swarm/"
