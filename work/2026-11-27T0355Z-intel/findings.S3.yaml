      - { key: "product:q-dir", type: product, name: "Q-Dir", aliases: ["Q-Dir (Quad Explorer)"], summary: "Free multi-pane Windows file manager from SoftwareOK (developer Nenad Hrg per the signature ASEC verified)." }
      - { key: "product:desktopok", type: product, name: "DesktopOK", aliases: [], summary: "Free Windows utility from SoftwareOK that saves and restores desktop icon positions." }
