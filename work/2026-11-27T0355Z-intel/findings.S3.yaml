  - title: "SoftwareOK: tampered Q-Dir and DesktopOK installers on the vendor's official download path, also reached through the in-app update, install a Python remote-access tool that inventories 1,206 security-product processes (ASEC)"
    sources:
      - { url: "https://asec.ahnlab.com/en/96827/", publisher: "AhnLab ASEC", date: "2026-11-25", role: "primary" }
      - { url: "https://malware.news/t/software-supply-chain-attack-via-the-official-softwareok-website-tampering-with-q-dir-and-desktopok-installation-files/127689", publisher: "malware.news (discovery relay of the ASEC post)", date: "2026-11-26", role: "corroborating" }
    discovery_trace: "first seen at: malware-news, URL https://malware.news/latest.rss (feed page 0, 2026-11-26 23:51 UTC 'Software Supply Chain Attack via the Official SoftwareOK Website') → pivot: https://malware.news/t/software-supply-chain-attack-via-the-official-softwareok-website-tampering-with-q-dir-and-desktopok-installation-files/127689 → primary: https://asec.ahnlab.com/en/96827/ (extract; ASEC published 2026-11-25T15:00Z). Corroboration attempted twice (WebSearch 'SoftwareOK Q-Dir DesktopOK installer tampered supply chain Python RAT' and 'Q-Dir DesktopOK trojanized installer ASEC AhnLab SoftwareOK supply chain 2026'): nothing independent. WebFetch of https://www.softwareok.com/ on 2026-11-27 returned no security notice and listed DesktopOK 12.88 (2026-11-26) and Q-Dir 12.85 (2026-11-21) as newest."
    summary: |
      AhnLab's ASEC reports that Q-Dir 12.83.0.0, 12.84.0.0 and 12.85.0.0 and DesktopOK 12.82.0.0 and 12.85.0.0 installers distributed from the official SoftwareOK website carried tampered files whose SHA-256 values differ from those posted on the vendor's download page, and that tampered files were also produced during the update process of already installed legitimate copies. The tampered installer embeds the genuine, correctly signed Q-Dir or DesktopOK executable and runs it from the public user folder so the program appears to work, while it downloads the standalone 7-Zip console tool and an archive holding a Python runtime and a remote-access tool from an external server, unpacks it under a Microsoft-looking folder in ProgramData (with a fallback path), and persists through a scheduled task with a Microsoft Edge-style name in a UPnP task folder that runs pythonw.exe on the agent script. The tool executes shell commands and Python code, transfers files, takes screenshots and collects system information, and compares running processes with a list of 1,206 process names of Korean and international antivirus and EDR products and reports the matches to its server; ASEC notes Chinese-language comments in the code and says this may indicate a Chinese-speaking developer environment. ASEC states the cause and path by which the legitimate files were replaced have not been identified and gives no dates for the distribution window.
      ASEC's advice: uninstall and reinstall a verified current version after checking the SHA-256 against the vendor page, but also look for the Python environment, the scheduled task, related files and network traces because reinstalling does not remove an installed tool; isolate and scope any infected host. Single source; no vendor statement was found.
    region_nexus: "global; ASEC is Korean and lists Korean and international security products; Q-Dir and DesktopOK are free Windows administration utilities of the kind IT staff install; Swiss use not stated"
    primary_sector_nexus: "indirect: administrator workstations in any organization that installed or updated either tool"
    sector: "technology"
    cves: []
    techniques: [T1195.002, T1204.002, T1105, T1059.006, T1053.005, T1036.004, T1518.001, T1113]
    affected_products: ["Q-Dir", "DesktopOK"]
    entity_keys: []
    new_entities:
