  - title: "SpecterOps: branch protection does not bound repository-scoped trust; a GitHub organization with write as its default repository permission and a wildcard Entra federated identity credential puts every member on an attack path to Entra Tier Zero"
    sources:
      - { url: "https://specterops.io/blog/2026/11/25/beyond-branch-protection-understanding-github-attack-paths/", publisher: "SpecterOps", date: "2026-11-25", role: "primary" }
    discovery_trace: "first seen at: specterops, URL https://specterops.io/feed/ (feed, 2026-11-25 23:26 UTC 'Beyond Branch Protection: Understanding GitHub Attack Paths') → primary (no pivot needed): https://specterops.io/blog/2026/11/25/beyond-branch-protection-understanding-github-attack-paths/ (extract, read in full). The post links the 1Password incident (https://1password.com/blog/update-on-nov-2026-security-incident) but states it does not speculate about its specifics."
    summary: |
      SpecterOps (Jared Atkinson, 2026-11-25) answers the question raised after the 1Password incident (a single employee's GitHub account with large consequences) without speculating about that case: in a lab enterprise modelled on production configurations (Active Directory synchronised to Okta, Okta to GitHub through Enterprise Managed Users, GitHub to Entra by workload identity federation) it shows that branch protection and mandatory review can stay intact while every member of the GitHub organization has an attack path to Tier Zero in Entra. Three conditions combine: the organization's default repository permission is write, so effective write access is far wider than the explicit role assignments an administrator reviews; an Entra federated identity credential trusts a repository-wide subject with a wildcard (repo:<org>/<repo>:*), so any branch or environment satisfies the trust, and repository-level Actions secrets are likewise not tied to protected branches; and the federated service principal can grant Microsoft Graph application roles. A second pattern is one federated credential per branch (development, staging, production) that all authenticate to the same Entra application, so the separation lives in deployment code, not in the authorization model, and the unprotected development branch holds the same privileges as production.
      The source's stated lever is distinct workload identities per environment with privileges limited to what each manages, which turns a convention into an enforced boundary, plus reading the Active Directory, Okta, GitHub and Entra relationships as one path (the post draws it in BloodHound) because each platform's administrators see only their part. The scenario is a lab, not a reported intrusion. Single source.
    region_nexus: "global; applies to any organization, including public-sector development teams, that federates GitHub Actions to Entra"
    primary_sector_nexus: "indirect: applies to administrations running GitHub organizations with Entra workload identities"
    sector: "technology"
    cves: []
    techniques: [T1078.004, T1528, T1098.003, T1199]
    affected_products: ["GitHub", "GitHub Actions", "Microsoft Entra ID"]
    entity_keys: ["product:github", "product:github-actions", "product:microsoft-entra-id"]
    new_entities: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    suggested_classification: "B2 (original lab analysis from a reputable research lab, uncorroborated; not an incident report)"
    suggested_priority: routine-notable
    novelty: new
    lookback: true
    references_hint: ["2026-11-26/1password-employee-github-account-backend-compromise"]
    evidence:
      - quote: "The problem is that the scope of the protection does not match the scope of the trust."
        attribution: "SpecterOps"
        source_url: "https://specterops.io/blog/2026/11/25/beyond-branch-protection-understanding-github-attack-paths/"
      - quote: "Repository-level secrets, for example, are not inherently restricted to protected branches."
        attribution: "SpecterOps"
        source_url: "https://specterops.io/blog/2026/11/25/beyond-branch-protection-understanding-github-attack-paths/"
      - quote: "every member of the GitHub organization has an attack path to Tier Zero in Entra."
        attribution: "SpecterOps"
        source_url: "https://specterops.io/blog/2026/11/25/beyond-branch-protection-understanding-github-attack-paths/"
    extended_notes: |
      Exposure (how a defender checks, from the mechanism the post describes): in GitHub, the organization's default repository permission and whether members may create arbitrary branches; in Entra, the federated credentials on each application or managed identity and whether their subject uses a wildcard or names only a repository, and which Graph application roles the service principal can grant. Which interface: GitHub organization settings and Entra app registration federated credentials, both administrator-only.
      Detection: the post gives no detection events. Telemetry classes that follow from the stated mechanism, for the composer to label as concepts: Entra audit logs for creation or change of federated identity credentials and for app-role grants to workload identities; Entra service-principal sign-in logs showing federated authentication from GitHub-issued tokens at unusual times or for unexpected branch or environment contexts; GitHub audit log entries for branch creation and workflow-file changes on unprotected branches by members who do not normally touch infrastructure repositories.
      Hardening levers named by the post: separate workload identities and privileges per environment; do not rely on branch protection to scope repository-level secrets or repository-wide federated trust.
      Composer note: do not link this to the 1Password cause; SpecterOps explicitly declines to. Reference the 1Password entry only as the occasion.
    borderline: false
