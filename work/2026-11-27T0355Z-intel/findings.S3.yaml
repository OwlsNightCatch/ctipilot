  - title: "GPGME before 2.3.1 (CVE-2026-129975): a crafted OpenPGP key with a very long user ID triggers a double free in the library behind Gpg4win, GnuPG Desktop and VS-Desktop, most mail clients, XMPP clients, Samba and Flatpak; remote code execution cannot be ruled out"
    sources:
      - { url: "https://lists.gnupg.org/pipermail/gnupg-announce/2026q4/000517.html", publisher: "GnuPG project (gnupg-announce)", date: "2026-11-20", role: "primary" }
      - { url: "https://www.openwall.com/lists/oss-security/2026/11/20/13", publisher: "oss-security (forward of the advisory)", date: "2026-11-20", role: "corroborating" }
      - { url: "https://www.openwall.com/lists/oss-security/2026/11/21/1", publisher: "oss-security (Red Hat downstream-patch note)", date: "2026-11-21", role: "corroborating" }
    discovery_trace: "first seen at: oss-security, URL https://www.openwall.com/lists/oss-security/ (listing, 2026/11/20 #13 'Fwd: GnuPG Security Advisory for GPGME (T8557,CVE-2026-129975)') → https://www.openwall.com/lists/oss-security/2026/11/20/13 (extract) → primary: https://lists.gnupg.org/pipermail/gnupg-announce/2026q4/date.html → https://lists.gnupg.org/pipermail/gnupg-announce/2026q4/000517.html (WebFetch). EPSS from https://api.first.org/data/v1/epss (bridge, score date 2026-11-26). NVD page is a JavaScript shell and OSV returned 404 for the id (too fresh); the identifier is vendor-stated."
    summary: |
      The GnuPG project published a security advisory on 2026-11-20 for GPGME, the library most OpenPGP-using applications call: an OpenPGP key with a crafted very long user ID triggers a double free in the two internal functions that read status lines and key listings from gpg (a reallocated buffer's pointer is stored back into the context only at the end, so an early return on a read error leaves a stale pointer that is freed again when the context is released). The project calls it a critical bug that can be used to exfiltrate data from applications, for example by sending signed data, and says remote code execution cannot be ruled out; it does not report exploitation. All software using a GPGME version prior to 2.3.0 is affected, as a shared library, DLL or statically linked (2.3.0 was never public); fixed in GPGME 2.3.1 (2026-11-19), Gpg4win 5.1.2 and new GnuPG Desktop and GnuPG VS-Desktop releases (version numbers not given on the page), with a patch attached for older versions, a rebuild required for statically linked binaries, and no update needed for GPGMEPP and GPGMEQT. The project lists Gpg4win, GnuPG Desktop, GnuPG VS-Desktop, most mail clients, many XMPP clients, Samba and Flatpak as examples of affected software.
      Johan Carlsson found it and GitLab informed GnuPG on 2026-11-12; the planned 2026-11-25 disclosure was moved to 2026-11-20 because GitLab had to update earlier for a separate Ruby bug (the advisory calls it Ruby2Shell). An oss-security follow-up relays a claim that Red Hat carried a downstream patch for years (GnuPG says it does not remember receiving it), so Red Hat family distributions may already be fixed; check the distribution advisory. FIRST gives EPSS 0.0476 (92.7th percentile) as of 2026-11-26.
    region_nexus: "global; mail-encryption clients and Gpg4win are used in administrations; no source states Swiss deployment"
    primary_sector_nexus: "indirect: OpenPGP mail and file encryption on administration endpoints"
    sector: "public-sector"
    cves: [CVE-2026-129975]
    techniques: [T1203, T1566]
    affected_products: ["GPGME", "Gpg4win", "GnuPG Desktop", "GnuPG VS-Desktop"]
    entity_keys: []
    new_entities:
      - { key: "product:gpgme", type: product, name: "GPGME", aliases: ["GnuPG Made Easy"], summary: "GnuPG's C library through which mail clients, Gpg4win/Kleopatra, XMPP clients, Samba and others call gpg; CVE-2026-129975 (double free, fixed in 2.3.1) affects all earlier versions (GnuPG, 2026-11-20)." }
      - { key: "product:gpg4win", type: product, name: "Gpg4win", aliases: [], summary: "GnuPG's Windows installer bundle including GPGME and the Kleopatra GUI; 5.1.2 carries the GPGME fix for CVE-2026-129975." }
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    suggested_classification: "A2 (vendor advisory for its own product; the same text relayed on oss-security is not independent; no exploitation report)"
    suggested_priority: notable
    novelty: new
    lookback: true
    evidence:
      - quote: "Please update your GPGME shared library to version 2.3.1."
        attribution: "GnuPG project"
        source_url: "https://lists.gnupg.org/pipermail/gnupg-announce/2026q4/000517.html"
      - quote: "Exploiting this bug to mount an Remote Code Execution attack (RCE) can't be ruled out."
        attribution: "GnuPG project"
        source_url: "https://lists.gnupg.org/pipermail/gnupg-announce/2026q4/000517.html"
      - quote: "All software using a GPGME version prior to 2.3.0 either as shared libary, DLL, or statically linked is affected."
        attribution: "GnuPG project"
        source_url: "https://lists.gnupg.org/pipermail/gnupg-announce/2026q4/000517.html"
    extended_notes: |
      Exposure: how a defender tells: which GPGME build an application loads (system shared library, a DLL shipped inside Gpg4win, or a statically linked copy, which the vendor says must be rebuilt) and whether the host's Gpg4win is below 5.1.2. Reachability: the trigger is a key (or signed data carrying one) processed by an application that calls GPGME, so mail clients verifying signed messages and key-import or key-search paths are the exposed interface; the advisory does not give attacker prerequisites beyond supplying the crafted key.
      Detection: no exploit indicators exist in the advisory; the only telemetry concept is application crash or abnormal termination of a GPGME-using client or Kleopatra while handling a signed message or key listing (crash-dump and application-event telemetry), plus inventory of GPGME versions. Post-patch check: none stated; a double free that exfiltrates data would leave no persistence artifact the advisory names.
      Composer note: this advisory is S1-class content found through oss-security; dedupe against the S1 return. The CVE id could not be confirmed on NVD (SPA) or OSV (404); only the vendor states it.
    borderline: false
