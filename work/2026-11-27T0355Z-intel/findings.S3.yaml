    discovery_trace: "first seen at: wiz-blog, URL https://www.wiz.io/feed/rss.xml (feed, 2026-11-25 'Inside Agentic Offensive Frameworks: Intent IDs') → primary: https://www.wiz.io/blog/agentic-offensive-frameworks-intent-ids-artex-cairn (extract) → pivot: https://www.wiz.io/blog/agentic-attacks-artex-offensive-ai-frameworks (extract) → huntback, URL https://huntback.io/blog (listing) → https://huntback.io/blog/ai-pentest-console-south-korean-university-global-admin (extract) → corroboration: malware.news topic https://malware.news/t/the-great-escape-tradecraft-insights-from-an-agentic-swarm/127635 → Talos https://blog.talosintelligence.com/the-great-escape-tradecraft-insights-from-an-agentic-swarm/ ; malware.news topic https://malware.news/t/ai-joins-the-industrial-attack-workflow/127527 → Recorded Future https://www.recordedfuture.com/blog/ai-industrial-attack-workflow"
    summary: |
      Delta on the ARTEX entry. Wiz (2026-11-25) shows that ARTEX and Cairn hand the model a numeric intent ID that lands in victim-side artifacts. ARTEX draws intents, facts, findings, hints and digests from one never-resetting counter per installation, so intent numbers climb across runs and targets and consecutive intents are rare; its worker puts the number in its working directory (tasks/<task>/i<N>), its session name and its prompt. Cairn formats zero-padded per-object-type counters (i001, f001, h001) and resets them for every project. Wiz found the numbers in AWS role session names, SSM command comments, resource names, tags and descriptions, KMS aliases and security-group rule text, and in Azure run-command, VM and app-registration names (denied calls keep the name in the error message); it used rising numbers with a distinctive boto3 build and proxy-pool overlap to tie one campaign, which it names ARTEX-Harvester, to more than a dozen organizations, and linked an AWS and an Azure side of one intrusion by one climbing sequence. Wiz's caveats: the numbers are a corroborating pacing signal, not attribution, a lone iNNNN is noisy and must be paired with an anchor such as artex-, pentest-, probe or canary in user agents, account, CI-workflow or cloud-resource names, and Cairn's per-project reset limits pacing to the ARTEX family. Talos (2026-11-25), analysing the OpenAI-linked swarm, independently says agent self-labels are high-fidelity signals because the agent cannot drop them without breaking its own state tracking, citing artex-probe file names.
      Huntback (2026-11-24) read an exposed ARTEX console workspace (52 task folders) and documents one intrusion into a South Korean university: entry through a public pre-authentication code-execution flaw in the XpressEngine CMS fixed since October 2019, SYSTEM through a log4net.config hot-reload channel on a companion service, in-memory token impersonation, Defender exclusions and real-time monitoring switched off with Set-MpPreference, a memory dump of the Windows credential process, chisel reverse SOCKS tunnels (one as a SYSTEM scheduled task), a modified 2017 SMB exploit that added a local administrator on a campus server, and then a single sign-on that accepted a stored password hash in place of the password, which gave a staff session and a token with the Global Administrator role from 2026-11-16 18:47 UTC; the user directory was exported within two hours and over two days 20 licensed accounts and a new Global Administrator were created. The numbering leaked onto victim hosts (a local administrator account and a scheduled task named after intent numbers, marker files in a folder named for an intent). Wiz (2026-11-23) adds a case seen from both sides through an exposed operator directory (four days in October, two AWS accounts and seven EKS clusters, CyberStrikeAI running the operation with a csai- prefix beside an ARTEX checkout, a privileged-pod escape and an ld.so.preload userland rootkit with a DNS-tunnel channel, Jenkins code execution, Anthropic API keys harvested from 50 hosts) and says disclosed related incidents more than tripled since its Black October post while stating that activity labelled ARTEX comes from multiple unrelated operators. Recorded Future (2026-11-20) counts observed ARTEX servers rising from 1,506 on 2026-10-21 to 2,978 on 2026-11-19 across 58 countries (servers, not attacks), and reports a LiteLLM gateway configuration on infrastructure it assesses as likely used by the Iran-linked GreenJuliett cluster without confirming misuse.
    region_nexus: "global; the Huntback case is South Korea; Wiz and Recorded Future describe cloud intrusions across many countries; no Swiss victim named"
