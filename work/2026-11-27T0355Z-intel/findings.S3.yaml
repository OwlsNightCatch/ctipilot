  - title: "Puppet Server CVE-2026-115731: Huntback's decoy captured the whole exploit chain from an address that first had its own certificate request auto-signed (2026-11-19)"
    sources:
      - { url: "https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured", publisher: "Huntback", date: "2026-11-20", role: "primary" }
    discovery_trace: "first seen at: huntback, URL https://huntback.io/blog/feed.xml (feed, 2026-11-20 'Attackers are checking Puppet Servers for CVE-2026-115731') → primary (no pivot needed): https://huntback.io/blog/puppet-server-cve-2026-115731-exploit-chain-captured (extract). KEV status re-verified with bridge cisa-kev (CVE-2026-115731 dateAdded 2026-11-17, due 2026-12-01, knownRansomwareCampaignUse Unknown)."
    summary: |
      Huntback reports that on the morning of 2026-11-19 one of its Puppet Server decoys received the complete exploit chain for CVE-2026-115731 in 1.47 seconds from one address: a certificate request for a generated node name (fresh 2048-bit key, no attributes), a request for the signed certificate 1.4 seconds later without polling, which only succeeds where the CA autosigns, and a report upload to the report endpoint whose rich-data type definition carries a Ruby method body. The captured body closed the generated method early, raised an error carrying a marker and the server's address, and opened a second method so the syntax balanced, so it was a vulnerability check built so that a real command needs one line changed. Two and a half hours earlier a different address in the same hosting cluster fingerprinted the server with a client that calls itself puppet-scan/1.0 (status service and both CA path variants) and never asked for a certificate; Huntback says the exploiting address is that cluster's test bench and had tried exploits for four other products against its decoys in the ten days before. Huntback restates the record: the flaw needs any CA-signed agent certificate, which an unauthenticated attacker obtains where the CA signs requests without strong verification; the CVE record was published on 2026-11-03 and CISA listed it on 2026-11-17. Single source (Huntback honeypot telemetry); the store's entry already carries the KEV listing and fixed releases.
