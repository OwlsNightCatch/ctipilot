    extended_notes: |
      Detection concept (telemetry class first): cloud control-plane audit records and identity-provider logs, hunting free-text fields that an operator or agent names (role session names, SSM comments, resource and tag names, app-registration names, run-command names, CI workflow and branch names, user agents) for an iNNNN-style token adjacent to an agent label (artex-, pentest-, probe, canary, csai-); on endpoints, process-creation and command-line telemetry for working-directory paths of the form tasks/<task>/i<N> and for locally created accounts, scheduled tasks and marker files named after an intent number. Wiz and Talos both warn the anchors are perishable and not operator fingerprints; Wiz notes denied API calls keep the chosen name in the error text, so failed-call logs are a place to look.
