  section: nginx2root (entries/2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws.md), Defender takeaway, ledger claim e30638e785
  item: "disabling HTTP/2 on exposed listeners blocks only the two HTTP/2 flaws and, if it stays on elsewhere, leaves connection pressure ([Unit 42, 2026-11-24](https://unit42.paloaltonetworks.com/cve-2026-123633-nginx-http2-vulnerability/))"
  url_or_quote: "https://unit42.paloaltonetworks.com/cve-2026-123633-nginx-http2-vulnerability/"
  summary: "(low confidence) Unit 42's Mitigations section covers CVE-2026-123633 only: 'Where the service allows it, disable HTTP/2 on exposed listeners ... If HTTP/2 stays enabled on other listeners, the extra HTTP/1.1 connections can push the same worker closer to its worker_connections limit.' It does not say the step 'blocks only the two HTTP/2 flaws'; that statement is Xint's ('disabling HTTP/2 on affected listening ports blocks CVE-2026-123007 and CVE-2026-123633. It does not block the other three nginx vulnerabilities'), cited only after the following clause. Older text (not in this run's diff). Fix: end the first clause with the Xint citation, keep Unit 42 for the connection-pressure caveat."
