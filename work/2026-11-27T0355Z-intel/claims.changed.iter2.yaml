  - claim_id: f676653967
    entry: 2026-11-27/softwareok-q-dir-desktopok-tampered-installers-python-rat
    surface: "headline"
    kind: frontmatter
    text: "SoftwareOK Q-Dir and DesktopOK installers carried a Python RAT; check hashes, reinstalling may not remove it"
  - claim_id: 22660af102
    entry: 2026-11-27/softwareok-q-dir-desktopok-tampered-installers-python-rat
    surface: "actions[0]"
    kind: frontmatter
    text: "Inventory every Windows endpoint that installed or updated Q-Dir or DesktopOK since 2026-10-28, compare each installer's SHA-256 with the value on SoftwareOK's download page, and isolate any host with a bundled Python interpreter under ProgramData or a scheduled task that runs one, treating its credentials as stolen, because ASEC says simply uninstalling and reinstalling the program may not remove a Python RAT already installed."
  - claim_id: f6a92624f9
    entry: 2026-11-27/softwareok-q-dir-desktopok-tampered-installers-python-rat
    surface: "body"
    kind: uncited
    text: "It then downloads the legitimate 7-Zip console extractor and a package holding a Python 3.9 runtime and a custom remote-access tool, unpacks it under a Microsoft-looking folder in ProgramData and persists through a scheduled task, named to look like Edge, that runs the windowless Python interpreter."
  - claim_id: c883dcec43
    entry: 2026-11-27/softwareok-q-dir-desktopok-tampered-installers-python-rat
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** treat every host that ran an affected installer or updater as compromised: isolate it, remove the tool and rotate the credentials used on it, because ASEC says uninstalling and reinstalling the utility may not remove the remote-access tool."
