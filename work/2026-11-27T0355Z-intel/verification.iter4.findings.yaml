  item: "ARTEX: Wiz intent-ID clause"
  url_or_quote: "summary: \"Wiz shows that ARTEX and Cairn write a per-run numeric intent ID into names they create in victim environments\"; record summary: \"ARTEX writes a per-run numeric intent ID from a never-reset counter, and Cairn a per-project one\"; body: \"ARTEX `i<N>`, a counter never reset\" (https://www.wiz.io/blog/agentic-offensive-frameworks-intent-ids-artex-cairn)"
  summary: "(low confidence) Wiz says an ARTEX installation \"runs its own counter and never resets it by default\", that numbers \"climb across runs and targets\", and that only Cairn resets per project; \"per-run\" contradicts that and is self-contradictory beside \"never-reset\", and the body's bare \"never reset\" drops Wiz's \"by default\" (operators reset or parallelise). Write \"a numeric intent ID drawn from a per-installation counter that ARTEX does not reset by default (Cairn: per project)\"."
