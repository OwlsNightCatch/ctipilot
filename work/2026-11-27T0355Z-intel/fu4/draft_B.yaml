delta_vs_entry:
  - "The entry (updated_at null, no changelog yet) says Juniper's bulletin 'could not be read' and that exploitation rests on CISA and BSI. Juniper's own exploitation statement is now READ (CNA record) and matches SecurityWeek's quotation word for word apart from the CVE id; it is citable only through SecurityWeek (secondary) and NCSC.ch, because cveawg is barred as a source by check_run."
  - "Sequence for the title: Juniper's CNA container shows a last-update stamp of 2026-11-24 11:55 UTC (consistent with SecurityWeek's 'On Tuesday'; the record does not say which field changed), BSI revised at 23:00 UTC the same day, CISA listed on 2026-11-25. The entry's title says CISA listed 'after BSI reported exploitation'; the earliest signal read is Juniper's own update, which preceded BSI (BSI states no basis; that BSI relied on Juniper is our inference, not stated)."
  - "Scale and attribution unchanged: 'At least one instance' reported to the Juniper SIRT, no actor, victim, date or technique; SecurityWeek's 'threat actors have been exploiting' is its own gloss."
  - "Workaround: Juniper's record says 'No available workarounds exist' while its exploitation text says 'take steps to mitigate'; neither names a step. The entry's defender takeaway ('limit which hosts can reach the Conductor') is NCSC.ch's temporary advice in substance, not Juniper's, and should be attributed to NCSC.ch."
  - "Mechanism detail the entry lacks: Juniper's CNA title puts the flaw in 'key management'; NCSC.ch says the router ID a joining device presents is passed unsanitized into a shell command during provisioning key setup and runs as root (NCSC's mechanism statement, not attributed to Juniper). SecurityWeek: the Salt minion ID is the router's unique ID when it registers with the Conductor (the Salt master)."
  - "Exposure detail the entry lacks (it says no source names the interface): NCSC.ch names the Conductor's provisioning service (AutomatedProvisioner) as the network-reachable surface, no authentication or user interaction; still no port and no statement whether it is on by default."
  - "Post-patch compromise check the entry lacks: NCSC.ch advises auditing the Conductor's fleet list for router names the team did not create (the only source with such a check; NCSC's own advice). It also states root on the Conductor exposes every managed router and its provisioning keys (NCSC assessment)."
  - "Affected-product contradiction persists and is now sharper: Juniper's own CNA record and the fix statement name Session Smart Conductor only; CISA KEV and NCSC.ch name Router as well; SecurityWeek says patched 'in Session Smart Router and Session Smart Conductor versions'. The entry already carries the caveat; the CNA record lets it say Juniper's own text names Conductor only."
  - "New CISA ADP SSVC values inside the CVE record (2026-11-25): Exploitation active, Automatable yes, Technical Impact total; the entry carries none."
  - "NCSC.ch is a new Swiss-authority source for the entry (post 13244, created 2026-11-26 07:25 UTC, Admiralty A for its jurisdiction); it is English-only: the hub API returns a single English text with no German field, so no German original exists to quote and no translation is needed."
  - "Juniper's bulletin page is STILL unreadable on every transport (extract, jina, url --direct on the portal, JSA112183 and kb.juniper.net paths all return the Salesforce shell), so the 18-CVE table and any bulletin-only wording remain unread; the entry's 'could not be read' caveat stays true for the bulletin page itself."
verdict: "WORTHWHILE UPDATE (type update, medium-high confidence): Juniper's own exploitation confirmation, no-workaround statement, Conductor-only affected product and the NCSC.ch post (fleet-list audit, provisioning-service prerequisite) are all new to the entry; cite SecurityWeek and NCSC.ch for Juniper's wording, use the CNA record to verify only."
