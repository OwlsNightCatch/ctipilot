claims:
  - id: B01
    claim: "JUNIPER'S OWN WORDS (CNA record 'exploits' block, container updated by Juniper 2026-11-24 11:55 UTC): at least one instance of malicious exploitation reported to the Juniper SIRT; upgrade as soon as possible and take steps to mitigate in the meantime"
    source_url: "https://cveawg.mitre.org/api/cve/CVE-2026-103406"
    file: B_cverecord_raw.json
    passage: |-
      At least one instance of malicious exploitation has been reported to the Juniper SIRT. Customers are encouraged to upgrade to a fixed release as soon as possible and in the meantime take steps to mitigate this vulnerability.
  - id: B02
    claim: "JUNIPER'S OWN WORDS: no workaround exists (the 'steps to mitigate' in B01 are not specified anywhere Juniper's text was readable)"
    source_url: "https://cveawg.mitre.org/api/cve/CVE-2026-103406"
    file: B_cverecord_raw.json
    passage: |-
      No available workarounds exist for this issue.
  - id: B03
    claim: "JUNIPER'S OWN WORDS: the CNA title places the flaw in key management (unauthenticated arbitrary command execution)"
    source_url: "https://cveawg.mitre.org/api/cve/CVE-2026-103406"
    file: B_cverecord_raw.json
    passage: |-
      Session Smart Conductor: An unauthenticated attacker causes arbitrary command execution during key management.
  - id: B04
    claim: "JUNIPER'S OWN WORDS: description (OS command injection in the AutomatedProvisioner, as root, via a crafted salt minion ID)"
    source_url: "https://cveawg.mitre.org/api/cve/CVE-2026-103406"
    file: B_cverecord_raw.json
    passage: |-
      An Improper Neutralization of Special Elements used in an OS Command vulnerability in the AutomatedProvisioner in Juniper Networks Session Smart Conductor allows a remote attacker to execute arbitrary commands as root via a specially crafted salt minion ID.
  - id: B05
    claim: "JUNIPER'S OWN WORDS: the fixed releases are named for Session Smart Conductor only (7.0.5, 7.1.7, 7.2.3 and all subsequent releases)"
    source_url: "https://cveawg.mitre.org/api/cve/CVE-2026-103406"
    file: B_cverecord_raw.json
    passage: |-
      The following software releases of Session Smart Conductor have been updated to resolve these specific issues:
