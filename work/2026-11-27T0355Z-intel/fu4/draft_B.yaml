  - id: B13
    claim: "SecurityWeek: Juniper updated its advisory 'on Tuesday' (2026-11-24) to flag the defect as exploited (relay; the portal page itself unreadable)"
    source_url: "https://www.securityweek.com/critical-juniper-session-smart-conductor-flaw-exploited-in-attacks/"
    file: B_securityweek.txt
    passage: |-
      On Tuesday, Juniper updated its [advisory](https://supportportal.juniper.net/s/article/2026-10-On-Demand-Security-Bulletin-Session-Smart-Router-and-Session-Smart-Conductor-Multiple-internally-discovered-vulnerabilities-resolved) to flag the security defect as exploited.
  - id: B14
    claim: "SecurityWeek's quotation of Juniper's update (carries 'of CVE-2026-103406', which the per-CVE CNA text omits because the bulletin covers 18 CVEs; otherwise identical)"
    source_url: "https://www.securityweek.com/critical-juniper-session-smart-conductor-flaw-exploited-in-attacks/"
    file: B_securityweek.txt
    passage: |-
      “At least one instance of malicious exploitation of CVE-2026-103406 has been reported to the Juniper SIRT. Customers are encouraged to upgrade to a fixed release as soon as possible and in the meantime take steps to mitigate this vulnerability,” reads Juniper’s update.
  - id: B15
    claim: "SecurityWeek's own gloss (not Juniper's): 'threat actors have been exploiting', attributed jointly to Juniper and CISA"
    source_url: "https://www.securityweek.com/critical-juniper-session-smart-conductor-flaw-exploited-in-attacks/"
    file: B_securityweek.txt
    passage: |-
      Juniper Networks and the US cybersecurity agency CISA this week warned that threat actors have been exploiting a critical vulnerability in Session Smart Conductor.
  - id: B16
    claim: "SecurityWeek: patched 2026-10-28 with 17 other flaws; fixed versions stated as 'Session Smart Router and Session Smart Conductor versions 7.2.3, 7.1.7, and 7.0.5' (looser than Juniper's CNA record, which names Conductor only)"
    source_url: "https://www.securityweek.com/critical-juniper-session-smart-conductor-flaw-exploited-in-attacks/"
    file: B_securityweek.txt
    passage: |-
      Juniper patched CVE-2026-103406 in Session Smart Router and Session Smart Conductor versions 7.2.3, 7.1.7, and 7.0.5.
  - id: B17
    claim: "SecurityWeek: what the Salt minion ID is (router's unique ID when registering with the Conductor acting as Salt master)"
    source_url: "https://www.securityweek.com/critical-juniper-session-smart-conductor-flaw-exploited-in-attacks/"
    file: B_securityweek.txt
    passage: |-
      The Salt minion ID is a router’s unique ID when registering with the Salt master (Session Smart Conductor).
  - id: B18
    claim: "SecurityWeek: CISA KEV listing on Wednesday with a three-day deadline under BOD 26-04 (KEV record read in this run: dueDate 2026-11-28)"
    source_url: "https://www.securityweek.com/critical-juniper-session-smart-conductor-flaw-exploited-in-attacks/"
    file: B_securityweek.txt
    passage: |-
      urging federal agencies to patch it within three days, as mandated by BOD 26-04.
  - id: B19
    claim: "NCSC.ch (own assessment): exploitation status 'Actively Exploited'"
    source_url: "https://security-hub.ncsc.admin.ch/#/posts/13244"
    file: B_ncsc_post13244.json
    passage: |-
      **Current exploitation status**: Actively Exploited
  - id: B20
    claim: "NCSC.ch severity/impact statement: root on the Conductor exposes every managed router in the fleet and its provisioning keys (NCSC's assessment, not attributed to Juniper)"
    source_url: "https://security-hub.ncsc.admin.ch/#/posts/13244"
    file: B_ncsc_post13244.json
    passage: |-
      Successful exploitation allows unauthenticated attackers with network access to gain root control of the Conductor, which exposes every managed router in the fleet and its provisioning keys.
  - id: B21
    claim: "NCSC.ch prerequisite: network access to the Conductor's provisioning service (AutomatedProvisioner); no authentication or user interaction (no port or default state given)"
    source_url: "https://security-hub.ncsc.admin.ch/#/posts/13244"
    file: B_ncsc_post13244.json
    passage: |-
      **Prerequisites:** Network access to the Conductor's provisioning service (AutomatedProvisioner). No authentication or user interaction is required.
  - id: B22
    claim: "NCSC.ch mechanism: the router ID a joining device supplies is passed unsanitized into a shell command during provisioning key setup"
    source_url: "https://security-hub.ncsc.admin.ch/#/posts/13244"
    file: B_ncsc_post13244.json
    passage: |-
      **Impact Details:** The router ID supplied by a joining device is passed unsanitized into a shell command during provisioning key setup. The ID, crafted as a command executes as root.
  - id: B23
    claim: "NCSC.ch mitigation advice, part 1 (vendor patches for Conductor and Router; Juniper lists no official workaround)"
    source_url: "https://security-hub.ncsc.admin.ch/#/posts/13244"
    file: B_ncsc_post13244.json
    passage: |-
      Vendor patches are available for both Session Smart Conductor and Session Smart Router. Juniper lists no official workaround.
  - id: B24
    claim: "NCSC.ch mitigation advice, part 2 (its own temporary measure and the post-patch compromise check)"
    source_url: "https://security-hub.ncsc.admin.ch/#/posts/13244"
    file: B_ncsc_post13244.json
    passage: |-
      **Temporary:** Keep the Conductor's management and provisioning interfaces off untrusted network segments. Audit the fleet list for router names your team did not create.
  - id: B25
    claim: "NCSC.ch affected-products list names Session Smart Router as well as Conductor and defers versions to the references (Juniper's CNA record names Conductor only)"
    source_url: "https://security-hub.ncsc.admin.ch/#/posts/13244"
    file: B_ncsc_post13244.json
    passage: |-
