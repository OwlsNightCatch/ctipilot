delta_vs_entry:
  - "The entry has no Accenture/APEX content at all (grep: Accenture 0, APEX 0, LDAP 0, Kerberos 0, reverse proxy 0, Border Gateway 0, web shell 0, 15 November 0, 9 November 0); its last record says 'No source read names an exploiting actor, a victim or the number of systems hit' and that CISA's catalogue is the only exploitation source."
  - "NEW: pre-disclosure exploitation. APEX judges with high confidence, from one victim, that web shell activity predates 23:00 UTC on 2026-11-15, before Mitel's advisory dated 2026-11-16. The report's only absolute time is that bound; every other victim time is an offset from an unpublished first request (derived, ours: the first command at T+12 min implies the first request was earlier than about 22:48 UTC if the 23:00 UTC bound refers to the first command)."
  - "NEW: victim intrusion sequence with offsets: version check T+0, unauthenticated auth-bypass request T+1 min, two uploads accepted T+9, first web-shell command T+12 (web service account), root T+15 to T+30 (method withheld, system logs reset as a side effect), LDAP-connector directory credentials recovered and bound to a DC over LDAPS T+32, web-shell requests filtered from web/error/admin logs T+36, hundreds of short HTTPS uploads from T+40 for about seven hours, first network logon with the directory account T+53, Kerberoasting script T+1.5 h, multi-DC authentication in just over two minutes T+2 h, credentials from file shares and bulk credential tests T+2.5 to 4.5 h, backup and line-of-business database servers dumped T+20 to 23 h."
  - "NEW: identity pivot. The MiCollab LDAP connector stores directory credentials that the actor recovered; APEX says nothing on that account's privilege level or on whether the stored secret was encrypted, so neither is stated here. The identity-side detections were identity-protection alerts on the connector account within about three hours, and RC4 Kerberos service-ticket bursts."
  - "NEW: log tampering. Root step reset system logs; the actor then filtered its web-shell requests out of web server, error and admin logs. APEX names upstream proxy/WAF logs and disk images as more reliable, and tells defenders to hunt for system logs that suddenly shrink; the report does not say which source its own timeline was rebuilt from, so what was recoverable locally is NOT stated."
  - "NEW: reverse proxy and MiVoice Border Gateway web proxy did not stop exploitation at the victim; the entry's Exposure and Defender-takeaway lines assume restricting external access to AWV is enough and do not say a fronting proxy gives no protection."
  - "NEW: second organisation (10.0-series, exposed to MISA-2026-0006 and MISA-2026-0012): persistent HTTPS to the same actor server since 2026-11-09, large volumes returned, consistent with an implant or tunnel (moderate confidence), payload not confirmed, initial access undetermined; APEX itself says that if MISA-2026-0012 was the vector it would mean an exploit at least a week before disclosure. APEX's closing section still states 'This actor was active against MiCollab servers from 9 November 2026, before a patch was available' as fact, which is firmer than its own body (flag for the composer: use the hedged body wording)."
  - "NEW: AI-assisted wording is APEX's assessment from SAMPLED network telemetry: two commercial AI API services (names withheld), 155 hours combined 7 to 17 November, same-second restart with the auth-bypass request after more than eight hours of silence, ~2.5 h of web-shell commands with no sampled operator traffic, ~10 percent of AI traffic in hours with no operator traffic; APEX labels AI-service use 'moderate confidence', says it 'cannot determine precisely how the threat actor used the services', and states server-side tooling 'probably' drove portions. It is an inference, not a finding; SecurityWeek softens it to 'may have been driven' / 'Suspected'."
  - "NEW: APEX does not map the steps to MTLVULN or CVE ids (which of the five were used remains unstated), asserts all five are unauthenticated although Mitel conditions MTLVULN-1863 and MTLVULN-1862 on an identifier or pre-staged content, and names no group (data-theft extortion pattern is APEX's assessment)."
  - "NEW: APEX post-patch guidance the entry lacks: image MiCollab and Border Gateway servers before patching or rebuilding; compare MiCollab logs with gateway/proxy/WAF logs; treat a suspected compromise as a directory compromise (reset the LDAP connector account and Kerberoastable service accounts, review the connector's authentications on every DC, rotate administrator, SIP trunk and file-share credentials reachable from the server); also fix MISA-2026-0006 and the listed older KEV flaws on servers that lag. The entry's action and Detection line speak only of AWV child processes and upload-path files."
  - "NEW (KEV): due dates read from the catalogue in this run: CVE-2026-133311 2026-12-09, the other four 2026-11-28 (BOD 26-04); the entry carries no due dates (SecurityWeek's sentence verified)."
  - "UNCHANGED: Mitel's page is still revision 2.0 of 2026-11-24, 'Updated the CVE Numbers', with no exploitation statement and the same patch and AWV-access mitigation; the 10.0 flaw text is still garbled. The entry's 2026-11-26 record is accurate on this."
  - "CAVEATS on provenance: single first-hand observer for the pre-disclosure timing and intrusion detail (Accenture; credibility 2 stands); CISA KEV independently confirms exploitation but names no flaw or actor; the page's own metadata date is 2026-11-27 while SecurityWeek (2026-11-26) links it, so the report existed by 2026-11-26. APEX's page also carries an IOC table (IPs, domain, hashes, URLs, file names); none of that belongs in the entry."
verdict: "WORTHWHILE UPDATE (type update, high confidence): first vendor-independent report of pre-disclosure exploitation, with a concrete intrusion sequence, a directory-compromise lesson, a log-tampering/proxy lesson and post-patch guidance the entry lacks; compose from APEX with the AI claim attributed and hedged and the second server stated as undetermined."
