  - { id: securityweek, url: "https://www.securityweek.com/mitel-micollab-zero-days-exploited-in-suspected-ai-assisted-attacks/", file: A_securityweek.txt, transport: "extract (trafilatura-direct)", note: "dated 2026-11-26, author Eduard Kovacs" }
  - { id: mitel, url: "https://www.mitel.com/support/security-advisories/mitel-product-security-advisory-misa-2026-0012", file: A_mitel.txt, transport: "extract (trafilatura-direct)", note: "Revision 2.0, Last Updated 2026-11-24" }
  - { id: cisa-kev, url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json", file: A_kev_excerpt.json, transport: "bridge cisa-kev (excerpt of the 7 relevant records kept; full 1.7 MB catalogue not stored)", note: "catalogVersion 2026.11.25; used only to verify SecurityWeek's due-date sentence" }
claims:
  - id: A01
    claim: "Accenture APEX Labs' pre-disclosure judgment and its evidence class (one victim, web shell activity before 23:00 UTC on 2026-11-15, high confidence)"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      We have high confidence in this judgment based on evidence from one victim organization showing web shell activity before 23:00 UTC on 15 November 2026.
  - id: A02
    claim: "Why 23:00 UTC on 15 November precedes Mitel's advisory date: it was still 15 November in every time zone from UTC-12 to UTC+1; Mitel's page gives only a date, no time of day"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      Evidence from one victim placed web shell activity before 23:00 UTC on 15 November 2026, when it was still 15 November in every time zone from UTC−12 to UTC+1; Mitel dated its advisory 16 November.
  - id: A03
    claim: "The report gives the victim timeline only as offsets from the first observed request; no absolute clock time for the first request is published (the only absolute anchor is the 23:00 UTC bound)"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      Exhibit 1: Intrusion timeline at the confirmed victim (UTC offsets from the first observed request)
  - id: A04
    claim: "Timeline T+0 first request is a version check"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      | T+0 | First observed request: the actor checks the MiCollab version. |
  - id: A05
    claim: "Timeline T+1 minute authentication bypass: an unauthenticated request returns content without a session"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      | T+1 minute | Authentication bypass: an unauthenticated request returns content without a session. |
  - id: A06
    claim: "Timeline T+9 minutes two uploads to the AWV component accepted"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      | T+9 minutes | Two file uploads to the AWV component are accepted. |
  - id: A07
    claim: "Timeline T+12 minutes first command through the web shell as the web service account"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      | T+12 minutes | First command through the web shell, running as the web service account. |
  - id: A08
    claim: "Timeline T+15 to T+30 minutes escalation to root; system logs reset as a side effect"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      | T+15 to T+30 minutes | The actor escalates to root. System logs are reset as a side effect. |
  - id: A09
    claim: "How root was obtained is withheld: the report lists server-manager administrator sessions not matching known administrators as a mitigation item and says the mechanism is not described"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      | Server-manager administrator sessions that do not match known administrators | Mitigation item. The mechanism is not described because privilege-escalation details are not published here. |
  - id: A10
    claim: "Root and a working directory account came roughly 20 minutes after web-shell access; APEX's conclusion for defenders"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      At the confirmed victim, the threat actor required roughly 20 minutes to progress from web-shell access to root privileges and a working Active Directory account.
  - id: A11
    claim: "Timeline T+32 minutes: LDAP connector directory credentials recovered, bind to a domain controller over LDAPS"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      | T+32 minutes | The actor recovers the directory credentials of MiCollab’s LDAP connector and binds to a domain controller over LDAPS. |
  - id: A12
    claim: "APEX's wording of the credential source: credentials recovered from MiCollab's LDAP configuration (the report does not say the stored secret was encrypted or how it was decrypted)"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      The key step in this broader compromise occurred 32 minutes after the first observed request, when the threat actor used credentials recovered from MiCollab's LDAP configuration to authenticate to a domain controller over LDAPS.
  - id: A13
    claim: "What the connector-account credential enabled: domain-controller authentication, directory collection, Kerberoasting, plaintext credentials from file shares, bulk credential testing"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      The compromised directory account enabled the threat actor to rapidly expand access across the enterprise. The threat actor authenticated to domain controllers, collected directory information, Kerberoasted service accounts—obtaining service tickets to conduct password cracking offline—harvested plaintext credentials from internal file shares, and tested service-account credentials at scale.
  - id: A14
    claim: "Timeline T+53 minutes first network logon with the directory account"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      | T+53 minutes | First network logon with the directory account. |
  - id: A15
    claim: "Timeline T+2 hours: authentication to multiple domain controllers across the forest in just over two minutes, directory user records exported"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      | T+2 hours | The actor authenticates to multiple domain controllers across the forest in just over two minutes and exports directory user records. |
  - id: A16
    claim: "Identity-protection alerts on the connector account fired within about three hours (the identity-side detection that existed at the victim)"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      Identity-protection alerts on the compromised connector account began firing within approximately three hours of the initial activity.
  - id: A17
    claim: "Identity telemetry cue: bursts of RC4 Kerberos service-ticket requests (Kerberoasting) and the connector account authenticating to many domain controllers"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      | Bursts of RC4 Kerberos service-ticket requests | Kerberoasting of service accounts. Identity-protection alerts fired on the connector account within about three hours at the confirmed victim. |
  - id: A18
    claim: "Timeline T+36 minutes: web-shell requests filtered out of the web server, error and admin logs (after system logs were reset at the root step)"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      | T+36 minutes | Web-shell requests are filtered out of the web server, error, and admin logs. |
  - id: A19
    claim: "Log editing, in APEX's words: system logs reset as a side effect of privilege escalation, web-shell requests then filtered from web server, error and admin logs; upstream proxy/WAF logs and disk images named as the more reliable evidence"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      System logs were reset as a side effect of privilege escalation, and the threat actor then filtered its web-shell requests out of the web server, error, and admin logs. Missing entries in local MiCollab logs are therefore not reassuring. Upstream proxy or web application firewall (WAF) logs and disk images are likely to be more reliable.
  - id: A20
    claim: "APEX's consequence for ruling out compromise: a clean MiCollab log and an uncompromised perimeter proxy do not demonstrate the server was unaffected (the report does not say which log source its own timeline was rebuilt from)"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      A clean MiCollab log and an uncompromised perimeter proxy, on their own, do not demonstrate that a MiCollab server was unaffected.
  - id: A21
    claim: "Reverse proxy and MiVoice Border Gateway web proxy did not protect the AWV component at the victim"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      At the victim, the exploitation requests passed through an internet-facing reverse proxy. Organizations that publish MiCollab through a reverse proxy, including a MiVoice Border Gateway web proxy, should not assume that the proxy protects the AWV component.
  - id: A22
    claim: "Second organisation: persistent HTTPS channel to the same actor server since 2026-11-09, initial access undetermined (headline statement)"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      A second organization’s MiCollab server has held a persistent HTTPS channel to the same actor server since 9 November 2026, although APEX Labs has not determined how that server was compromised.
  - id: A23
    claim: "Second organisation: what the traffic is and is not known to be (consistent with an implant or tunnel; tasking, tooling or payload not confirmed; substantial data returned to the server)"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      Beginning 9 November 2026, the server established persistent HTTPS connections to the threat actor-controlled system, which returned substantial volumes of data. This activity is consistent with an implant or tunneling mechanism maintaining command-and-control (C2) communications, although APEX Labs has not confirmed whether the traffic contained tasking, tooling, or other malicious payloads.
  - id: A24
    claim: "Second organisation: release 10.0-series exposed to both MISA-2026-0006 and MISA-2026-0012, so the initial-access flaw cannot be determined; APEX's own caveat on what the case would mean"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      The system was running a MiCollab 10.0-series release vulnerable to both previously disclosed and newly disclosed flaws, including those addressed in MISA-2026-0006 and MISA-2026-0012. As a result, APEX Labs cannot determine which vulnerability the threat actor used for initial access. If the threat actor exploited the MISA-2026-0012 vulnerabilities, the activity would indicate possession of an exploit at least one week before public disclosure.
  - id: A25
    claim: "INTERNAL INCONSISTENCY in the report: the closing section states 9 November as the start of actor activity against MiCollab 'before a patch was available' as fact, while the body says the second server's initial access is undetermined"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      This actor was active against MiCollab servers from 9 November 2026, before a patch was available, so a server that is patched now might already be compromised.
  - id: A26
    claim: "Actor server rebuilt shortly before use (6-7 November) and TLS certificate issued 8 November, i.e. the infrastructure was ready before the first confirmed intrusion"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      was rebuilt on 6 and 7 November 2026, just before use, and a Let’s Encrypt certificate for a wildcard-DNS name was issued for it on 8 November.
  - id: A27
    claim: "Headline AI statement as APEX words it: an assessment that AI-assisted tooling drove parts of the intrusion"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      APEX Labs assesses that AI-assisted tooling operating on the threat actor’s server drove parts of the intrusion.
  - id: A28
    claim: "Basis of the AI inference: sampled traffic to two commercial AI API services over 155 hours combined, 7 to 17 November; APEX states it cannot determine how the actor used them and lists consistent uses"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      Between 7 and 17 November 2026, sampled network traffic showed the server communicating with two commercial AI API services over a combined period of 155 hours. Because the telemetry is sampled, APEX Labs cannot determine precisely how the threat actor used the services. However, the observed activity is consistent with potential uses such as data triage, operational support for exploitation or web-shell activity, and preparation of extortion material.
  - id: A29
    claim: "Observation 1 of 3: AI API traffic restarted in the same second as the authentication-bypass request after more than eight hours of silence"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      The AI API traffic restarted in the same second as the actor’s authentication-bypass request to the victim, after more than eight hours of silence.
  - id: A30
    claim: "Observation 2 of 3: no sampled operator traffic for about 2.5 hours despite sustained web-shell activity; a commercial-VPN browser had opened the server-manager login page one minute before the first request"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      Sampled telemetry showed no operator traffic reaching the threat actor’s server for approximately 2.5 hours after the intrusion began, despite sustained web-shell activity at the victim. A browser using a commercial VPN exit had accessed the victim’s server-manager login page one minute before the first observed request, but the activity that followed included a steady sequence of web-shell commands and rapid iterations of the same scripts.
  - id: A31
    claim: "Observation 3 of 3: about 10 percent of sampled AI API traffic fell in hours with no sampled operator traffic"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      About 10 percent of the sampled AI API traffic fell in hours with no sampled operator traffic.
  - id: A32
    claim: "APEX's own confidence label for AI-service use: moderate; endpoints are shared and legitimate; provider names withheld"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      Used by the actor: moderate confidence. Shared, legitimate endpoints; not indicators. Provider names are withheld.
  - id: A33
    claim: "APEX frames the three observations as indicating server-side tooling 'probably' drove portions of the intrusion (hedged inference, not a finding)"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      Three observations further indicate that server-side tooling, rather than continuous hands-on-keyboard activity, probably drove portions of the intrusion:
  - id: A34
    claim: "No named group; campaign and extortion framing is APEX's assessment from bulk theft, credential harvesting, disposable infrastructure and more than one victim"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      Though APEX Labs has not linked the activity to a named group, the confluence of factors—bulk data theft, credential harvesting at scale, disposable infrastructure, and more than one MiCollab victim—is consistent with a data-theft extortion operation.
  - id: A35
    claim: "Exfiltration behaviour: archives staged and sent with HTTP PUT, at times through an internal backup server; many short HTTPS sessions leaving by addresses other than the MiCollab server"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      The threat actor staged stolen data in archives and transferred it to threat actor-controlled infrastructure using HTTP PUT requests, at times routing traffic through an internal backup server. The exfiltration appeared as hundreds of short HTTPS sessions over several hours and exited through addresses other than the MiCollab server.
  - id: A36
    claim: "Timeline T+20 to T+23 hours: pivot to a backup server and a line-of-business database server, databases dumped and uploaded in automated loops"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      | T+20 to T+23 hours | The actor pivots to a backup server and a line-of-business database server, dumps databases, and uploads the data in automated loops. |
  - id: A37
    claim: "Which of the five flaws were used is not mapped by APEX: it states all five are unauthenticated and narrates the steps (version check, authentication bypass, uploads, web shell) without MTLVULN or CVE ids"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      The intrusion progressed rapidly, as the threat actor fingerprinted the MiCollab version, bypassed AWV authentication, uploaded files, and achieved command execution through a web shell just 12 minutes after the first observed request.
  - id: A38
    claim: "APEX asserts all five flaws are exploitable without authentication; Mitel's own text conditions MTLVULN-1863 on knowledge of an identifier or pre-staged content and MTLVULN-1862 on pre-staged content"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      Attackers can exploit all five vulnerabilities without authentication, including the most severe, MTLVULN-1864, a blind command injection with a CVSS score of 10.0.
  - id: A39
    claim: "Mitel's text for the conditioned flaws (unchanged in revision 2.0): MTLVULN-1863 needs a system-generated random identifier or pre-staged content"
    source_url: "https://www.mitel.com/support/security-advisories/mitel-product-security-advisory-misa-2026-0012"
    file: A_mitel.txt
    passage: |-
      could allow an unauthenticated attacker, with knowledge of a specific system-generated random identifier or pre-staged content, to conduct an unauthorized access attack due to improper authentication mechanisms.
  - id: A40
    claim: "APEX: wider exploitation expected now the advisory is public; patching does not close an intrusion that started earlier; any internet-facing MiCollab on 10.3.0.18 or earlier was exploitable by this actor"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      APEX Labs assesses patching alone will not close an intrusion that started earlier and so, any internet-facing MiCollab server on version 10.3.0.18 or earlier was exploitable by this actor.
  - id: A41
    claim: "APEX guidance 1: patch order (upgrade to 10.3.0.18 first where needed, then KB000129195)"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      Upgrade to MiCollab 10.3 (10.3.0.18) first where needed, then apply the patch described in Mitel Knowledge Base article KB000129195, because the actor exploited these flaws before the patch existed.
  - id: A42
    claim: "APEX guidance 2: restrict external access to AWV, including any path a MiVoice Border Gateway web proxy publishes"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      Include any path that a MiVoice Border Gateway web proxy publishes, because a proxy in front of MiCollab did not stop the exploitation.
  - id: A43
    claim: "APEX guidance 3 (post-patch compromise check): image MiCollab and Border Gateway servers before patching or rebuilding"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      Take forensic images of MiCollab and Border Gateway servers before patching or rebuilding them, because patching or rebuilding can overwrite evidence of an intrusion.
  - id: A44
    claim: "APEX guidance 4: hunt in upstream logs; look for system logs that suddenly shrink"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      Compare MiCollab logs against gateway, proxy, and WAF logs and look for system logs that suddenly shrink, because the actor filtered local logs.
  - id: A45
    claim: "APEX guidance 5: outbound-traffic alerting from MiCollab and gateway servers"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      Watch for HTTPS sessions that recur around the clock, bursts of hundreds of short HTTPS uploads from any egress address, and requests to IP-echo or temporary tunnel services, because the actor’s uploads and egress checks showed up this way.
  - id: A46
    claim: "APEX guidance 6: alert on the LDAP connector account authenticating to many domain controllers or requesting RC4 service-ticket bursts"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      Alert when it authenticates to many domain controllers or requests bursts of RC4 Kerberos service tickets, because identity-protection alerts on this account fired within about three hours at the victim.
  - id: A47
    claim: "APEX guidance 7: treat a suspected compromise as a directory compromise; what to reset and rotate"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      Reset the LDAP connector account and any Kerberoastable service accounts, review that account’s authentications on every domain controller, and rotate administrator, SIP trunk, and file-share credentials reachable from the server.
  - id: A48
    claim: "APEX guidance 8: older MiCollab flaws (MISA-2026-0006 and listed KEV entries) on servers that fell behind"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      Apply the fixes for MISA-2026-0006 and the Known Exploited Vulnerabilities listed above, because the second victim’s release was exploitable through both the older and newer flaws.
  - id: A49
    claim: "Host-side behavioural cue: web shell script planted under a pictures directory (path class only; filenames are IOCs and not to be carried)"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      | Unexpected scripts in web-accessible directories, for example shell.asp under a pictures directory | Web shell planted through the exploitation. |
  - id: A50
    claim: "Web-log exploitation pattern: POSTs to AWV CGI scripts under /awcuser/cgi-bin/ from unfamiliar sources, then requests for new files under /pictures/; exact endpoints withheld"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      Requests to AWV CGIs under /awcuser/cgi-bin/ from unfamiliar sources, especially POSTs, followed by requests for new files under /pictures/
  - id: A51
    claim: "Host-side behavioural cues: directory-access, relaying and scanning tools run from the MiCollab server, and JDBC drivers fetched from a public repository for custom Java dump tooling"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      | MiCollab servers running smbclient, ldapsearch, expect, sshpass, Impacket, bash /dev/tcp port probes, or nohup loop scripts | Tools the actor ran from the MiCollab server for directory access, relaying, and scanning. |
  - id: A52
    claim: "APEX's ATT&CK mapping lists T1070.002 for log reset and filtering (verified in this run: attack/enterprise-attack.json v20.1 marks T1070.002 revoked, revoked_by T1685.006)"
    source_url: "https://accenture.github.io/cyber-intelligence/micollab-exploitation/"
    file: A_accenture.txt
    passage: |-
      | T1070.002 | Indicator Removal: Clear Linux or Mac System Logs | System logs reset; web-shell requests filtered from local logs |
  - id: A53
    claim: "SecurityWeek relay: web shell on 'a victim's systems on November 15' (drops APEX's 'before 23:00 UTC' bound and the 'one victim' scoping)"
    source_url: "https://www.securityweek.com/mitel-micollab-zero-days-exploited-in-suspected-ai-assisted-attacks/"
    file: A_securityweek.txt
    passage: |-
      The company determined that threat actors deployed a web shell on a victim’s systems on November 15.
  - id: A54
    claim: "SecurityWeek relay: 12 minutes to command execution, root within half an hour"
    source_url: "https://www.securityweek.com/mitel-micollab-zero-days-exploited-in-suspected-ai-assisted-attacks/"
    file: A_securityweek.txt
    passage: |-
      According to Accenture, the attackers executed commands on a MiCollab server just 12 minutes after the first request, and gained root privileges within half an hour.
  - id: A55
    claim: "SecurityWeek relay of the AI statement is softer than APEX's 'assesses ... drove': 'may have been driven by AI tools'; its headline says 'Suspected AI-Assisted Attacks'"
    source_url: "https://www.securityweek.com/mitel-micollab-zero-days-exploited-in-suspected-ai-assisted-attacks/"
    file: A_securityweek.txt
    passage: |-
      The investigation uncovered evidence that some of the malicious activity may have been driven by AI tools, with the attacker’s infrastructure communicating with two unnamed commercial AI API services.
  - id: A56
