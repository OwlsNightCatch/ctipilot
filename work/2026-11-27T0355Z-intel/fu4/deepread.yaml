      verbatim_passage: Sampled telemetry showed no operator traffic reaching the threat actor’s server for approximately 2.5 hours after the intrusion began, despite sustained web-shell activity at the victim. A browser using a commercial VPN exit had accessed the victim’s server-manager login page one minute before the first observed request, but the activity that followed included a steady sequence of web-shell commands and rapid iterations of the same scripts.
