      verbatim_passage: Between 7 and 17 November 2026, sampled network traffic showed the server communicating with two commercial AI API services over a combined period of 155 hours. Because the telemetry is sampled, APEX Labs cannot determine precisely how the threat actor used the services. However, the observed activity is consistent with potential uses such as data triage, operational support for exploitation or web-shell activity, and preparation of extortion material.
