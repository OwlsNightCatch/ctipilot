      file: work/2026-11-27T0355Z-intel/fu4/A_accenture.txt
      verbatim_passage: The compromised directory account enabled the threat actor to rapidly expand access across the enterprise. The threat actor authenticated to domain controllers, collected directory information, Kerberoasted service accounts—obtaining service tickets to conduct password cracking offline—harvested plaintext credentials from internal file shares, and tested service-account credentials at scale.
