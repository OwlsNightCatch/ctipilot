      file: work/2026-11-27T0355Z-intel/fu4/A_accenture.txt
      verbatim_passage: The system was running a MiCollab 10.0-series release vulnerable to both previously disclosed and newly disclosed flaws, including those addressed in MISA-2026-0006 and MISA-2026-0012. As a result, APEX Labs cannot determine which vulnerability the threat actor used for initial access. If the threat actor exploited the MISA-2026-0012 vulnerabilities, the activity would indicate possession of an exploit at least one week before public disclosure.
