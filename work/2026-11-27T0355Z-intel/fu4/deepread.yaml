      claim: 'Log editing, in APEX''s words: system logs reset as a side effect of privilege escalation, web-shell requests then filtered from web server, error and admin logs; upstream proxy/WAF logs and disk images named as the more reliable evidence'
      source_url: https://accenture.github.io/cyber-intelligence/micollab-exploitation/
      file: work/2026-11-27T0355Z-intel/fu4/A_accenture.txt
      verbatim_passage: System logs were reset as a side effect of privilege escalation, and the threat actor then filtered its web-shell requests out of the web server, error, and admin logs. Missing entries in local MiCollab logs are therefore not reassuring. Upstream proxy or web application firewall (WAF) logs and disk images are likely to be more reliable.
