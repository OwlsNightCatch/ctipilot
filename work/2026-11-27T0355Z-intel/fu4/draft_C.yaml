  - id: C07
    claim: "Scope of the bulletin: OSS CVEs that affect PAN-OS, fixed in PAN-OS, version varies by CVE and release (no product table; no Panorama, Cloud NGFW or Prisma wording)"
    source_url: "https://security.paloaltonetworks.com/PAN-SA-2026-0015"
    file: C_pansa_page.txt
    passage: |-
      The Palo Alto Networks Product Security Assurance team has evaluated the following open source software (OSS) CVEs that affect PAN-OS and has fixed them in PAN-OS. The fixed version varies by CVE and by PAN-OS release, as shown in the table below.
  - id: C08
    claim: "FIXED BUILDS for CVE-2026-46300 (Fragnesia), the 20 PAN-OS builds, 'and all later versions'"
    source_url: "https://security.paloaltonetworks.com/PAN-SA-2026-0015"
    file: C_pansa_page.txt
    passage: |-
      Linux Kernel Local Privilege Escalation Vulnerability (Fragnesia). This CVE is fixed in PAN-OS versions 10.2.7-h41, 10.2.10-h45, 10.2.13-h29, 10.2.16-h14, 10.2.18-h15, 11.1.4-h40, 11.1.6-h42, 11.1.7-h14, 11.1.10-h38, 11.1.13-h18, 11.1.16-h6, 11.2.4-h25, 11.2.7-h25, 11.2.10-h19, 11.2.13-h6, 11.2.16-h3, 12.1.4-h15, 12.1.7-h15, 12.1.10-h6, 12.2.4-h3 and all later versions.
  - id: C09
    claim: "Solution text: fixed in the versions listed in the table; no separate workaround section exists on the page"
    source_url: "https://security.paloaltonetworks.com/PAN-SA-2026-0015"
    file: C_pansa_page.txt
    passage: |-
      The OSS CVEs are fixed in the respective PAN-OS versions listed in the above table.
