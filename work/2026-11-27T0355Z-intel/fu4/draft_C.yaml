delta_vs_entry:
  - "The entry has NO trace of PAN-SA-2026-0015 (snapshot greps: PAN-SA 0, Exploitation Status 0, maintenance interval 0, Cloud NGFW 0, Prisma 0, any Fragnesia-fixed build 0, Informational 0, BleepingComputer 0). Its only CVE-2026-46300 content is Dream Research's chain (kernel step) and a reference to the 2026-05-15 Fragnesia entry."
  - "NEW (vendor statement): Palo Alto itself now states 'Exploitation of CVE-2026-46300 has been observed targeting the Palo Alto Networks management interface exposed to the internet', in a bulletin first published 2026-11-24 23:10 UTC (timeline) under the title 'OSS CVEs Fixed in PAN-OS', labelled Informational, CVSS block zero. This puts the vendor's own confirmation behind the kernel (root) step that the entry sources only to Dream Research and Unit 42's verification."
  - "NEW (stated precondition): the only known way to exploit CVE-2026-46300 on PAN-OS is to first exploit PHP2Shell through an internet-exposed management interface; no other method known (FAQ). All observed exploitation targeted internet-exposed management interfaces."
  - "NEW (second, later build per train): the kernel fix ships in a LATER hotfix than the PHP2Shell fix in every one of the 20 builds (see side_by_side: e.g. 12.2.4-h1 -> 12.2.4-h3, 12.1.7-h11 -> 12.1.7-h15, 11.2.10-h16/h17 -> 11.2.10-h19, 10.2.18-h13 -> 10.2.18-h15). The entry's 'fixed' string, its title ('all twenty hotfixes are out') and its first action tell readers to install the PHP2Shell hotfix only; a device on those builds still carries the unfixed kernel flaw."
  - "NEW (vendor guidance, with an ambiguity to carry as-is): a build from the PHP2Shell advisory 'protects' (FAQ bullet 1); with management restricted to trusted internal addresses risk is 'significantly reduced' and upgrading to a Fragnesia-fixed build can wait for the next maintenance interval (bullet 2); with management (or a management-profile dataplane interface) reachable from the internet, 'upgrade immediately and restrict access' (bullet 3, which does not say whether the PHP2Shell build or the Fragnesia build). BleepingComputer's 'should be safe' is its own inference, not Palo Alto's wording."
  - "PANORAMA / PRISMA / CLOUD NGFW: PAN-SA-2026-0015 is silent. It says only 'CVEs that affect PAN-OS ... fixed in PAN-OS', has no product table, and neither it, its JSON, BleepingComputer nor SecurityWeek mentions Panorama, Prisma Access, Prisma Cloud or Cloud NGFW (script-verified zero hits). Whether Panorama (PAN-OS software on virtual and M-Series appliances) carries the unfixed kernel flaw and takes the same builds is therefore NOT stated; do not extrapolate. For the PHP flaws the PHP2Shell advisory (unchanged since 2026-10-29 23:54 UTC) puts Panorama in scope and lists Cloud NGFW, Prisma Access and Prisma Cloud as unaffected; the entry already carries the Panorama part and does not carry the Cloud NGFW / Prisma 'None' rows."
  - "WORKAROUND: the bulletin has no workaround section; the only mitigation is restricting management access to trusted internal IP addresses (FAQ) plus the fixed builds. The PHP2Shell advisory's Threat Prevention signatures (entry already carries) address the PHP stage, not the kernel flaw."
  - "Date handling: page header says Published 2026-11-25 / Updated 2026-11-24, JSON datePublic is 2026-11-25 00:10 UTC, the timeline says Initial Publication 2026-11-24 23:10 UTC and SecurityWeek says 'on Tuesday' (2026-11-24); cite 2026-11-24. The bulletin is an in-window-edge item (first published roughly 29 hours before this fire); the in-window carriers are BleepingComputer and SecurityWeek, both 2026-11-25."
  - "Unit 42's brief (cited by the entry as of 2026-10-29) now carries 'Updated November 19' (18 further PHP flaws; not about PAN-OS builds) and, from its 2026-10-29 update, a scale statement the entry lacks: about 0.02 percent of the global installed base had internet-facing management interfaces configured and were impacted, each customer individually contacted. The brief does not mention Fragnesia or the bulletin."
  - "UNCHANGED: PHP2Shell advisory is as the entry last read it (all twenty hotfixes released, 'Active exploitation has been observed targeting the Palo Alto Networks management interface exposed to the internet'); the entry's hotfix list matches the advisory exactly, so no correction is needed there."
  - "Placement note: the Fragnesia entry 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x also lacks PAN-SA-2026-0015 (it cites Unit 42 for 'customers who applied fixes are not affected'); the build lists belong on the PAN-OS entry, the exploitation statement could be mirrored there."
verdict: "WORTHWHILE UPDATE (type update, high confidence, Admiralty A for the vendor's own statement): Palo Alto's own exploitation confirmation for CVE-2026-46300, its precondition and the 20 later Fragnesia builds change the entry's patching advice (the PHP2Shell hotfix does not fix the kernel flaw); Panorama/Prisma/Cloud NGFW status for the kernel flaw is unstated and must be reported as such."
