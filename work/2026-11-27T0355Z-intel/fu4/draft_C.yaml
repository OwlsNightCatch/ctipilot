    file: C_pansa_page.txt
    passage: |-
      All observed exploitation of this vulnerability has targeted PAN-OS devices whose management interface is exposed to the internet, a configuration our
  - id: C12
    claim: "FAQ: a build listed in the CVE-2026-109618 (PHP2Shell) advisory protects (the page text carries non-breaking spaces after 'the' and 'advisory,'; passage reproduced with them)"
    source_url: "https://security.paloaltonetworks.com/PAN-SA-2026-0015"
    file: C_pansa_page.txt
    passage: |-
      If you are running a fixed PAN-OS listed in the [CVE-2026-109618](https://security.paloaltonetworks.com/CVE-2026-109618) advisory, you are protected.
  - id: C13
    claim: "FAQ: STATED PRECONDITION (PHP2Shell first, via an internet-exposed management interface), no other method known, and the maintenance-interval upgrade advice"
    source_url: "https://security.paloaltonetworks.com/PAN-SA-2026-0015"
    file: C_pansa_page.txt
    passage: |-
      If your management interface is restricted to trusted internal IP addresses, as we recommend, the risk is significantly reduced. The only known way to exploit this vulnerability requires an attacker to first exploit the PHP2Shell vulnerability through an internet-exposed management interface, and we are not aware of any other exploitation method. We still recommend upgrading to a fixed release at your next maintenance interval.
  - id: C14
    claim: "FAQ: management interface or management-profile dataplane interface reachable from the internet means upgrade immediately and restrict access (does not say which fixed release)"
    source_url: "https://security.paloaltonetworks.com/PAN-SA-2026-0015"
    file: C_pansa_page.txt
    passage: |-
      If your management interface (or a dataplane interface with a management profile attached) is reachable from the internet, upgrade immediately and restrict access to trusted internal IP addresses.
