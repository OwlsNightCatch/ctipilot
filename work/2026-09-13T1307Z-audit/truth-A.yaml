- entry: entries/2026-07-24/laundry-bear-zimbra-zero-click-cve-2025-66376.md
  verdict: factual-error
  defect: >
    The corrected EPSS value for CVE-2025-66376 (0.1201) does not match FIRST.org's actual
    contemporaneous score. The original entry (created 2026-07-24, updated 2026-07-25) recorded
    "12.01%"; the 2026-09-06 audit correction only fixed the unit (percent sign to decimal),
    yielding 0.1201, "the same value expressed as the FIRST.org probability" — but FIRST.org's
    EPSS API queried for that exact date (2026-07-24 and 2026-07-25) returns epss=0.21621
    (21.62%), not 0.1201 (12.01%), a roughly 1.8x discrepancy. The underlying magnitude was
    wrong from the entry's original publication and the audit's unit-only fix did not catch it.
  ground_truth: >
    FIRST.org EPSS API for CVE-2025-66376, date=2026-07-24: epss="0.216210000"; date=2026-07-25:
    epss="0.216210000". Neither matches the entry's corrected value of 0.1201.
  ground_truth_url: "https://api.first.org/data/v1/epss?cve=CVE-2025-66376&date=2026-07-24"

