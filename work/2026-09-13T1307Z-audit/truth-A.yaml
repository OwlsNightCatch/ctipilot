  defect: >
    CVE-2026-48710's cves[] status carries "exploited" and "cisa-kev", but neither of the
    entry's two cited sources (GitHub Advisory GHSA-v4p8-mg3p-g94g, which covers
    CVE-2026-42271, and Horizon3.ai's analysis dated 2026-06-01) states that CVE-2026-48710
    was added to CISA KEV or was independently confirmed exploited — Horizon3's analysis
    predates the real KEV addition by three months. CISA's KEV catalog shows CVE-2026-48710
    was added on 2026-09-02, so the claim is now true, but the entry has carried it uncited
    since its original June 2026 migration (three months before it became true), and the
    2026-09-06 audit correction fixed CVSS/vector/auth/type for this same record without
    adding a citation for the status claim or flagging the gap.
  ground_truth: >
    CISA KEV catalog: CVE-2026-48710 dateAdded "2026-09-02" (fetched via
    tools/fetch_source.py cisa-kev). The entry's two sources.json-listed sources
    (GHSA-v4p8-mg3p-g94g and Horizon3.ai, 2026-06-01) do not mention CVE-2026-48710's KEV
    status; Horizon3's report predates the KEV addition.
  ground_truth_url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"

