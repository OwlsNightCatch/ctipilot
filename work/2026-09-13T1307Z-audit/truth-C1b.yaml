- entry: entries/2026-09-10/checkpoint-quantum-vpn-cert-preauth-rce-cvss98.md
  verdict: clean
  defect: null
  ground_truth: "Check Point sk1000118 and sk1000117 confirm CVE-2026-85103 and CVE-2026-85102 both CVSS 9.8, affected/not-affected version lists, fix via LivePatch Take 24 / Jumbo HFA (R82.10 T44+, R82 T126+, R81.20 T166+) and dedicated Spark builds match entry frontmatter verbatim. Neither CVE is on CISA KEV (confirmed via cisa-kev fetch). Forkast News quote verified verbatim. CVE-2026-50751 confirmed on KEV, dateAdded 2026-06-08, IKEv1 issue as described. EPSS null is consistent with FIRST.org API returning no score for either CVE as of 2026-09-09/07 (score only appears from 2026-09-10). T1190 valid/non-revoked in attack/enterprise-attack.json."
  ground_truth_url: "https://support.checkpoint.com/results/sk/sk1000118/ ; https://support.checkpoint.com/results/sk/sk1000117/ ; https://forkast.news/check-point-quantum-vpn-drops-two-cvss-9-8-cves-in-the-same-certificate-path-vpn-infrastructure-joins-the-auth-gap/"
- entry: entries/2026-09-10/cve-2026-87491-chrome-v8-oob-write-seventh-2026-zero-day.md
  verdict: clean
  defect: null
  ground_truth: "Chrome 153 release notes (googleblog) list CVE-2026-87491 as Medium/OOB write in V8; NVD record confirms CVSS 3.1 8.8 (AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H), affected <153.0.8010.36, matching frontmatter. CISA KEV entry confirms dateAdded 2026-09-09, dueDate 2026-09-23, description text matches quoted NVD line. Help Net Security and Hacker News quotes verified verbatim. NCSC-NL Dutch original quote verified verbatim against advisories.ncsc.nl page; translation faithful. CERT-FR advisory (2026-09-09) confirms 'Google indique que la vulnérabilité CVE-2026-87491 est activement exploitée.' ENISA EUVD confirms baseScore 8.8/same vector. FIRST.org EPSS historical query confirms epss=0.00291 on 2026-09-09 (rounds to entry's 0.0029) -- correctly captured as of discovery date, later drift (0.0076-0.0086) is normal EPSS movement. T1189/T1203 valid, non-revoked."
  ground_truth_url: "https://chromereleases.googleblog.com/2026/09/stable-channel-update-for-desktop_0808145027.html ; https://www.helpnetsecurity.com/2026/09/09/google-chrome-cve-2026-87491-zero-day-flaw/ ; https://thehackernews.com/2026/09/chrome-v8-zero-day-exploited-in-wild.html ; https://advisories.ncsc.nl/2026/ncsc-2026-0354.html ; https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1139/ ; https://euvdservices.enisa.europa.eu/api/search?text=CVE-2026-87491 ; https://www.cisa.gov/news-events/alerts/2026/09/09/cisa-adds-four-known-exploited-vulnerabilities-catalog"
- entry: entries/2026-09-11/canton-bern-icsg-cybersecurity-law-2026-11-01.md
  verdict: clean
  defect: null
  ground_truth: "KAIO's own ICSG page confirms Grand Council passage 12 June 2025, ICSG and IDSV both in force 1 November 2026, SIVE DIR/Amt accountability quote verbatim, PSP rules, new Beratungsstelle IDS running the ISMS, ICSG satisfying federal ISG cooperation requirements, municipal-body scope-limitation language, not-yet-published incident-reporting platform, and KDSG/KDSV in force since 1 September 2026 -- all match the entry's body and quotes verbatim. headtopics.com (dated 2026-09-10, a Thursday, matching the cited 'Regierungsrat am Donnerstag' statement) confirms the 24h/72h reporting-clock quote verbatim, the graduated ICT classification language verbatim, the 'intern/vertraulich/geheim' classification threshold verbatim, and the two-to-three-year transition period. No discrepancy found."
  ground_truth_url: "https://www.kaio.fin.be.ch/de/start/themen/rechtliche-grundlagen/ICSG.html ; https://ch.headtopics.com/news/kanton-bern-verscharft-cyberschutz-bei-angriffen-gilt-ab-87600698"
- entry: entries/2026-09-12/japan-digital-agency-gss-vpn-breach-maintenance-account.md
  verdict: imprecision
  defect: >
    classification.credibility is 1 ("confirmed by other sources"), but all three cited sources
    (Jiji Press, Piyolog, Rocket Boys Security Measures Lab) report on the SAME single disclosure
    event -- the Digital Agency's own 2026-09-11 press release and Minister Matsumoto's/Chief
    Cabinet Secretary Kihara's press-conference statements -- rather than independently verifying
    the incident themselves. Piyolog's own writeup states the VPN-vendor/CVE identification is
    piyokango's own unconfirmed speculation, and Rocket Boys' "現時点で公表されていない内容" section
    lists as-yet-undisclosed items (VPN vendor, CVE, whether the flaw was known/patched pre-intrusion
    in full detail), underscoring that these are restatements of one government announcement, not
    independent corroboration. Per house convention ("a vendor advisory plus national-CERT
    restatements is one assessor, so credibility 2 rather than 1"), this is the same pattern and
    credibility should be 2, not 1. The sourcing_note's claim that Jiji Press and the
    Piyolog-relayed Digital Agency statements "are independent of each other" does not hold --
    both report the same single government disclosure.
  ground_truth: >
    Piyolog: "今回悪用された脆弱性について大臣が説明した内容などから...piyokangoは推測" (explicitly
    flags the CVE-2026-0257 identification as its own speculation, not an official confirmation).
    Rocket Boys: "現時点で公表されていない内容" lists VPN maker/product/version, the CVE number, and
    whether the flaw was public/patched before intrusion as still undisclosed -- confirming all
    three outlets are relaying the single 2026-09-11 Digital Agency announcement and press
    conference, not independently assessing the incident.
  ground_truth_url: "https://piyolog.hatenadiary.jp/entry/2026/09/11/220855 ; https://rocket-boys.co.jp/security-measures-lab/digital-agency-privacy-data-incident/ ; https://www.nippon.com/en/news/yjj2026091100453/"
- entry: entries/2026-09-13/revolut-fake-government-request-kyc-breach.md
  verdict: imprecision
  defect: >
    Body-text quotation splices Revolut's notification with an inserted ellipsis that drops words
    from the middle of the sentence: the entry renders '"an unauthorised email account...using the
    official government agency's email domain"' as if verbatim, but the cited source's actual
    sentence is "The request came from an unauthorised email account sent directly using the
    official government agency's email domain." -- the words "sent directly" are elided without
    materially changing the meaning, but this is exactly the inserted-ellipsis/splice pattern the
    house verbatim-quote rule forbids. The evidence[] block itself quotes the same sentence
    correctly in full ("The request came from an unauthorised email account sent directly using the
    official government agency's email domain."), so the defect is confined to the body paraphrase-as-quote.
  ground_truth: >
    Security Affairs, quoting Revolut's customer notification: "Revolut received a request for
    customer information that appeared to come from a legitimate government agency. The request
    came from an unauthorised email account sent directly using the official government agency's
    email domain." All other quotes (the "valid domain authentication credentials" line, the
    TechCrunch spokesperson quote, the exposed-data list, the discovery-via-independent-contact
    narrative, and the notification/blocking/regulator-contact facts) verified as accurate against
    TechCrunch and Security Affairs.
  ground_truth_url: "https://securityaffairs.com/198922/data-breach/revolut-exposed-kyc-data-after-fraudulent-government-email-passed-security-checks.html ; https://techcrunch.com/2026/09/12/revolut-confirms-customer-data-breach-through-fake-government-requests/"
