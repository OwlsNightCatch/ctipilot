- code: F4
  category: hallucinated-fact
  section: docs/audits/2026-09-13-quality-audit.md — Verdict / Method
  item: "Verification-loop telemetry self-description (systemic finding 1)"
  url_or_quote: >
    Verdict: "Three of the eight verifier spawns this fire attempted were killed
    by the content-safety classifier, and the three entries they carried were
    verified by the main agent instead". Method: "Five `cti-verification`
    retrospective truth passes covering 47 entries".
  summary: >
    The run record's sub_agents block lists exactly SEVEN cti-verification
    spawns this fire attempted (truth-A, truth-B, truth-C, truth-C1, truth-C1a,
    truth-C1b, truth-C2) -- not eight. Of those, three were blocked
    (truth-C, truth-C1, truth-C1a) and FOUR returned (truth-A: 17 items,
    truth-B: 17, truth-C1b: 5, truth-C2: 8, summing to the claimed 47), not
    five. Separately, the blocked batch that was never successfully verified
    by any spawn and had to be checked by hand was truth-C1a, whose own scope
    line reads "the 2 never-verified 2026-09-09 entries alone" -- matching the
    report's own later, more detailed sentence ("The main agent verified the
    two entries itself and found a factual error in one of them") -- so the
    opening Verdict's "three entries" contradicts both the run record and the
    report's own Finding-1 narrative two paragraphs later. Fix: correct
    "eight" to "seven", "three entries they carried" to "two entries", and
    "Five cti-verification retrospective truth passes" to "Four" in the
    Verdict and Method paragraphs.
