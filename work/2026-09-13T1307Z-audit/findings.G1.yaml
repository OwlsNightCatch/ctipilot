recheck_duties:
  - subject: "CrowdStrike Falcon (FalconFlank) / Avast (PrettyPrague) patch status"
    finding: |
      Avast/Gen Digital: CONFIRMED patched (26.7.11086 Fix 992 / 26.8.11125 Fix 993,
      released 2026-09-04) -- this matches what the existing entry already records via
      TheHackerNews. No change needed there.
      CrowdStrike/FalconFlank: every source I could independently fetch or search
      through this window (esecurityplanet.com 2026-09-07, igorslab.de 2026-09-08,
      techzine.eu 2026-09-04, and repeated WebSearch passes turning up no reporting
      dated after ~2026-09-08) states CrowdStrike has NOT assigned a CVE, NOT issued a
      CVSS score, and NOT shipped a fixed Falcon Sensor build -- only interim guidance
      (disable the "Microsoft Office File Suspicious Macro Removal" policy, rely on
      Cloud Anti-malware for Microsoft Office Files) plus enhanced cloud-ML/behavioral
      detection since 2026-09-04. This appears in tension with the existing entry's
      2026-09-10 changelog record, which states (attributing to LevelBlue's 2026-09-09
      analysis) that "both FalconFlank and PrettyPrague have since received vendor
      remediation." I could not independently retrieve the LevelBlue SpiderLabs
      article's full body (levelblue.com/blogs/security-essentials/... returned only
      nav-shell content via extract/jina, no article text) to check its exact wording,
      so I cannot confirm whether LevelBlue actually made that claim for CrowdStrike
      specifically, mischaracterized detection/behavioral mitigation as "remediation,"
      or whether a CrowdStrike fix shipped after the last dated source I could reach
      (2026-09-08). FLAGGING AS A VERIFICATION LEAD, not asserting a firm correction:
      the main agent/audit should re-fetch the LevelBlue post directly and check
      CrowdStrike's own (auth-gated) support-portal Tech Alert before deciding whether
      the entry's "vendor remediation" framing for FalconFlank needs a correction
      changelog record.
    sources_checked:
      - https://www.esecurityplanet.com/news/news-crowdstrike-falconflank-zero-day/
      - https://www.igorslab.de/en/nightmare-eclipse-releases-pocs-against-nvidia-crowdstrike-avast-patch-status-varies/
      - https://www.techzine.eu/news/security/144053/falconflank-exposes-crowdstrike-falcon-privilege-flaw/
    resolution: "no new item filed -- flagged as a lead only; entry 2026-09-06/chaotic-eclipse-falconflank-prettyprague-edr-av-lpe-drops unchanged by this run"

  - subject: "Apereo CAS embargoed RCE (7.3.8.3)"
    finding: |
      No CVE, CVSS score, or technical detail has been published as of this audit.
      Apereo's own blog (apereo.github.io/2026/09/08/vuln/) still reads "Additional
      details will be provided once the security grace window passes." Apereo
      shortened its disclosure grace window from four weeks to two weeks in a
      2026-06-23 policy change (apereo.github.io/2026/06/23/sec-grace-window/), so
      the window on this 2026-09-08 disclosure runs to approximately 2026-09-22 --
      after this audit's window closes. Separately found CVE-2026-59099, an unrelated,
      earlier Apereo CAS AES-GCM IV-reuse flaw (fixed in 8.0.0-RC6) -- distinct
      vulnerability, not a development on the embargoed 7.3.8.3 issue, and not
      in-window.
    resolution: "no update -- entry unchanged, nothing new to report"

