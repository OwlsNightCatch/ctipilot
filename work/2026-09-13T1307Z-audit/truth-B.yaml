- entry: entries/2026-09-06/dell-secure-connect-gateway-dsa-2026-382-token-replay-rce.md
  verdict: imprecision
  defect: >
    Body states the advisory was "released 2026-08-31 in its only revision to date," but Dell's
    own advisory page's Revision History table lists a second revision, "2.0 | 2026-09-07 |
    Formatting changes without any updates to data" — so as of the cited fetch date there were
    two revisions, not one. No CVE/CVSS/version/workaround content changed between the two
    revisions, so the substantive claims in the entry are unaffected.
  ground_truth: >
    Dell's KB000503426 Revisionsverlauf (revision history) table: "1.0 | 2026-08-31 | Initial
    release" followed by "2.0 | 2026-09-07 | Formatting changes without any updates to data."
  ground_truth_url: https://www.dell.com/support/kbdoc/de-de/000503426/dsa-2026-382-security-update-for-dell-secure-connect-gateway-application-and-appliance-multiple-vulnerabilities

