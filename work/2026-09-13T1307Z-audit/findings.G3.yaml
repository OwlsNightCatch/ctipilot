      basic LLM prompting to agentic, multi-agent workflows that collapse the human-in-the-loop attack timeline.
      GTIG states that in Q2 2026 it observed threat actors compromise a cloud resource, then plan, build and
      execute an agent-enabled mass credential-harvesting campaign in under six hours end-to-end. Separately,
