          summary: "Open-source Unit 42 tool that tests whether an attacker with node root can spoof SPIFFE/SPIRE cgroup attestation to harvest co-located workload SVIDs (Unit 42, 2026-09-10)." }
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Our research shows how an attacker with root can spoof the Linux control group (cgroup) information the SPIRE agent uses during workload attestation. This tricks the agent into issuing a co-located workload's SVID to an attacker-controlled process."
        attribution: "Palo Alto Networks Unit 42"
        source_url: "https://unit42.paloaltonetworks.com/kubernetes-spiffe-spire-identity-spoofing/"
      - quote: "Unit 42 has not observed this technique exploited in the wild."
