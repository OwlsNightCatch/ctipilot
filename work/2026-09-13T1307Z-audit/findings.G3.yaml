      drive) as a data-exposure surface equivalent to an OAuth app-consent grant, not merely a convenience toggle.

  - title: "The Machine With Many Faces: root access on one Kubernetes node lets an attacker spoof SPIFFE/SPIRE cgroup attestation and harvest every co-located workload's cryptographic identity"
    sources:
      - { url: "https://unit42.paloaltonetworks.com/kubernetes-spiffe-spire-identity-spoofing/", publisher: "Palo Alto Networks Unit 42", date: "2026-09-10", role: "primary" }
    discovery_trace: "first seen at: unit42, URL https://unit42.paloaltonetworks.com/feed/ (RSS listing) → primary: Unit 42, URL https://unit42.paloaltonetworks.com/kubernetes-spiffe-spire-identity-spoofing/ (no pivot needed)"
    summary: |
      Unit 42 demonstrates a post-exploitation technique against SPIFFE/SPIRE, the open standard and reference
      implementation widely deployed in Kubernetes and cloud-native environments to replace long-lived secrets
      with short-lived, cryptographically verifiable workload identities (SVIDs). An attacker who has already
      obtained root on a Kubernetes node can spoof the Linux control-group (cgroup) metadata the SPIRE agent
      relies on during workload attestation, tricking the agent into issuing a co-located workload's SVID to an
      attacker-controlled process — collapsing the core trust assumption of every machine-identity system, that
      the node itself is trusted. Unit 42 built and released Spooffe (github.com/PaloAltoNetworks/spooffe), an
      open-source tool defenders can use to test whether an attacker with administrative node access could
      manipulate cgroup metadata to harvest co-located workload identities and scope the resulting blast radius.
      Unit 42 states it has not observed this technique exploited in the wild. Recommended hardening: harden
      nodes, restrict root access, prohibit privileged containers and host access, and minimize reliance on weak
      SPIRE selectors when scoping identity issuance.
    region_nexus: "global; applies to any Kubernetes/cloud-native environment running SPIFFE/SPIRE"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: []
    techniques: [T1550.001, T1611]
