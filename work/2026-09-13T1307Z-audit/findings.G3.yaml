  - title: "PuzzleMask: a plain-English prose wrapper defeats fast LLM policy-check filters, letting a jailbreak payload reach the target model undetected"
    sources:
      - { url: "https://research.checkpoint.com/2026/puzzlemask-abusing-plain-prose-as-a-covert-ai-attack-vector/", publisher: "Check Point Research", date: "2026-09-10", role: "primary" }
    discovery_trace: "first seen at: checkpoint-research, URL https://research.checkpoint.com/feed/ (RSS listing) → primary: Check Point Research, URL https://research.checkpoint.com/2026/puzzlemask-abusing-plain-prose-as-a-covert-ai-attack-vector/ (no pivot needed)"
    summary: |
      Check Point Research introduces PuzzleMask, a prompt-crafting technique that defeats fast/cheap LLM-based
      policy-check filters (the lightweight classifier many AI pipelines run before handing a prompt to the full
      target model) using only plain English — no emojis, base64, or invisible-Unicode tricks, which existing
      guardrail research already anticipates. A policy-violating payload is embedded in a specially crafted prose
      wrapper; the resource-constrained checking LLM classifies the whole prompt as benign and passes it to the
      target model, which then notices, extracts and acts on the embedded payload. Tested against four models
      running the quick check (gpt-4o-mini-2024-07-18, gpt-oss-safeguard:20b, claude-3-haiku-20240307,
      llama-guard3) with policies independently verified to correctly block the unwrapped versions of the same
      prompts, all 23 automated-pipeline-generated test prompts were misclassified as safe. Submitted to a strong
      target model (gpt-5-thinking-high with Python code-interpreter access), the target extracted and acted on
      the payload in over 90% of trials. PuzzleMask is not itself a jailbreak — it is a delivery/evasion layer
      that can be combined with one. Check Point names three mitigation directions: paraphrasing incoming input
      before the check, hardening the gatekeeper policy with a specifically worded clause, and monitoring LLM
      behavior/output rather than only input.
    region_nexus: "global; applicable to any organization operating a multi-tier LLM content-moderation pipeline"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: []
    techniques: []
    affected_products: []
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "In all trials we ran, LLMs running the quick policy check classified the input as `safe` and did not notice the payload existed."
        attribution: "Check Point Research"
        source_url: "https://research.checkpoint.com/2026/puzzlemask-abusing-plain-prose-as-a-covert-ai-attack-vector/"
      - quote: "For target testing, we submitted these prompts to a strong target model (`gpt-5-thinking-high` with access to a Python code interpreter); in >90% of trials, the target model successfully extracted the payload, processed it as further input and acted on it."
        attribution: "Check Point Research"
        source_url: "https://research.checkpoint.com/2026/puzzlemask-abusing-plain-prose-as-a-covert-ai-attack-vector/"
    extended_notes: |
      Adversarial-ML research rather than an observed in-the-wild campaign; no classic ATT&CK technique applies
      cleanly (pre-exploitation research against LLM guardrail architecture). Relevant to any Swiss public-sector
      deployment building an internal LLM-based content-moderation or agent-guardrail layer.
    borderline: true
    borderline_reason: "AI-safety research, not an observed campaign against an org network — relevance rests on the constituency's own growing LLM/agent deployments rather than a direct intrusion technique."

  - title: "The Shared Clipboard Inside the Sandbox: a covert cross-account channel in ChatGPT's code-execution containers relayed a victim's Gmail data to an attacker"
    sources:
      - { url: "https://research.checkpoint.com/2026/the-shared-clipboard-inside-the-sandbox-cross-account-data-leakage-in-chatgpt/", publisher: "Check Point Research", date: "2026-09-08", role: "primary" }
    discovery_trace: "first seen at: checkpoint-research, URL https://research.checkpoint.com/feed/ (RSS listing) → primary: Check Point Research, URL https://research.checkpoint.com/2026/the-shared-clipboard-inside-the-sandbox-cross-account-data-leakage-in-chatgpt/ (no pivot needed)"
    summary: |
      Check Point Research (Alexey Bukhteyev) discovered a covert command channel that let an attacker use a
      victim's live ChatGPT session to execute hidden tasks with whatever tools, data and connected apps
      (e.g. Gmail) that session already had access to — while the victim received a normal, unrelated answer to
      their own visible request. The channel operates through ChatGPT's per-account, isolated code-execution
      containers: although containers cannot reach the public internet or talk to each other directly, Check
      Point found they could all reach the same internal package-delivery service, which became the covert
      cross-account relay. In the proof of concept, ChatGPT retrieved email data from the victim's connected
      Gmail account and relayed it to the attacker's account. The hidden instruction could be seeded via a
      malicious prompt, a shared ChatGPT conversation link, or a custom GPT; once present in the victim's
      conversation context, an ordinary subsequent message from the victim could trigger the attacker's task
      without it appearing in the victim's visible response. The same channel could exfiltrate conversation
      history and any files present in the affected chat's code-execution environment — scope bounded only by
      whatever data/tools/connected-app permissions the victim's session already held.
    region_nexus: "global; any organization whose staff use ChatGPT with connected apps (email, file tools)"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
