        attribution: "Check Point Research"
        source_url: "https://research.checkpoint.com/2026/the-shared-clipboard-inside-the-sandbox-cross-account-data-leakage-in-chatgpt/"
      - quote: "In our proof of concept, ChatGPT retrieved email data from the victim's connected Gmail account and relayed it to the attacker."
        attribution: "Check Point Research"
