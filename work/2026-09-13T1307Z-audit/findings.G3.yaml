  - title: "ClickFix moves into the browser: a Google Sheets/Visualization-API C2 channel drives a cryptocurrency-theft web-skimmer via Tampermonkey"
    sources:
      - { url: "https://blog.talosintelligence.com/clickfix-moves-into-the-browser/", publisher: "Cisco Talos", date: "2026-09-08", role: "primary" }
      - { url: "https://siliconangle.com/2026/09/08/clickfix-moves-into-the-browser-and-onto-webdav-cisco-talos-finds/", publisher: "SiliconANGLE", date: "2026-09-08", role: "corroborating" }
    discovery_trace: "first seen at: talos, URL https://blog.talosintelligence.com/ (listing) → primary: Cisco Talos, URL https://blog.talosintelligence.com/clickfix-moves-into-the-browser/; corroborated via WebSearch (\"Cisco Talos ClickFix moves into the browser Google Sheets cryptocurrency\") → SiliconANGLE, URL https://siliconangle.com/2026/09/08/clickfix-moves-into-the-browser-and-onto-webdav-cisco-talos-finds/"
    summary: |
      Cisco Talos documents a monthslong campaign that evolves ClickFix social engineering into a browser-native
      attack: rather than convincing victims to paste PowerShell into a Windows Run dialog, the lure (posing as a
      leaked API-flaw report at crypto swap services) convinces victims to paste JavaScript into the Chrome
      address bar or install it via the Tampermonkey extension, which also supplies persistence. The injected
      script uses the Google Visualization API — free, unauthenticated read access to any public Google Sheets
      document — to retrieve obfuscated JavaScript hidden via white-on-white cell formatting; because requests
      originate from the victim's own browser to Google's domain, they resemble ordinary traffic and evade
      domain-reputation and network-layer controls. The payload hooks the browser's fetch API, rewrites
      cryptocurrency deposit addresses in server responses and the clipboard, and injects counterfeit "bonus"
      UI elements. Talos alerted Google and the targeted sites in April 2026; replacement spreadsheets returned
      within a week and were still live as of August 11, 2026. Campaign began October 2025, added the
      Visualization API in March 2026, and added the Tampermonkey delivery step from mid-April 2026.
    region_nexus: "global; lures distributed via Telegram, DarkForums and paste sites"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
