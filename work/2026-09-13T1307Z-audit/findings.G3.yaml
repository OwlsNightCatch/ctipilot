  - title: "0patch back-ports \"ResetNightmare\" (CVE-2026-27912) Kerberos Change-Password domain-takeover fix to unsupported Windows — and has to revoke and reissue its own first patch after it broke legitimate password resets"
    sources:
      - { url: "https://0patch.com/blog/micropatches-released-for-resetnightmare-windows-kerberos-elevation-of-privilege", publisher: "ACROS Security / 0patch", date: "2026-09-06", role: "primary" }
    discovery_trace: "first seen at: 0patch-blog, URL https://blog.0patch.com/feeds/posts/default (RSS listing) → primary: 0patch, URL https://0patch.com/blog/micropatches-released-for-resetnightmare-windows-kerberos-elevation-of-privilege (no pivot needed)"
    summary: |
      0patch released free micropatches, for legacy/unsupported Windows versions it still protects, against
      CVE-2026-27912 ("ResetNightmare"), a Kerberos Change-Password-service elevation-of-privilege vulnerability
      Microsoft originally patched for supported Windows in its April 2026 updates. Security researcher Shai
      Laron (Semperis) found and published the flaw with a proof-of-concept tool: a domain user who can modify
      their own userPrincipalName attribute can abuse the Kerberos Change Password service on a domain
      controller to change any other account's password, including a domain administrator's — a direct path to
      full domain takeover from an ordinary authenticated user. 0patch's first micropatch, issued 2026-09-07,
      introduced a regression that blocked administrators from changing passwords for OTHER users via Kerberos
      (impact limited to that path; normal admin password resets and "net use" password resets were unaffected);
      0patch revoked those patches and issued corrected ones on 2026-09-09.
