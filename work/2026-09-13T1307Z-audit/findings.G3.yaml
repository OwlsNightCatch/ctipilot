  - title: "GuardBreaker: a Russia-aligned actor (UAC-0099) embeds a decoy nuclear-weapon request in a VBScript comment to trip an LLM-powered code scanner's safety refusal before it inspects the malicious payload"
    sources:
      - { url: "https://www.welivesecurity.com/en/business-security/guardbreaker-derailing-ai-assisted-malware-analysis-code-comment/", publisher: "ESET WeLiveSecurity", date: "2026-09-10", role: "primary" }
    discovery_trace: "first seen at: eset, URL https://www.welivesecurity.com/en/rss/feed/ (RSS listing) → primary: ESET WeLiveSecurity, URL https://www.welivesecurity.com/en/business-security/guardbreaker-derailing-ai-assisted-malware-analysis-code-comment/ (no pivot needed)"
    summary: |
      ESET researchers spotted a VBScript used in the early stages of an attack against a Ukrainian target,
      attributed to the Russia-aligned group UAC-0099, that contains a decoy comment requesting guidance on
      building a nuclear weapon — a request LLMs are trained to refuse. The comment has zero effect on the
      script's runtime behavior; its only purpose is to trip the safety guardrails of an LLM-powered code
      scanner used in the target's defenses, causing that model to halt inspection at the refusal before ever
      reaching the malicious code further down the file. ESET names this technique GuardBreaker: an
      indirect-prompt-injection variant where the attacker's input reaches the LLM at inference time through the
      file under analysis rather than through a user-supplied prompt, exploiting the architectural weakness that
      current LLMs process untrusted content and trusted instructions without a dependable boundary between
      them. The script's actual purpose was to download and install MATCHBOIL, a loader used exclusively by
      UAC-0099 to deliver further payloads. ESET notes this fits a broader pattern from the same group, which in
      other recent attacks checked for processes associated with established analysis tools (IDA, Wireshark) —
      i.e., UAC-0099 explicitly accounts for both human and AI-assisted analysis in its operational tradecraft.
      ESET also cites a prior Socket finding of fabricated warnings used to interfere with LLM-powered scanners
