  - title: "AD Rights Management Service: a Service Group member's export rights let an attacker extract the RMS root Server Licensor Certificate private key, giving total, permanent, offline decryption of every document the deployment ever protected"
    sources:
      - { url: "https://www.huntress.com/blog/ad-rms-slc-encryption-key", publisher: "Huntress Labs", date: "2026-09-10", role: "primary" }
      - { url: "https://www.huntress.com/blog/ad-rms-architecture-and-recon", publisher: "Huntress Labs", date: "2026-09-08", role: "primary" }
    discovery_trace: "first seen at: huntress, URL https://www.huntress.com/blog/rss.xml (RSS listing) → primary: Huntress, URL https://www.huntress.com/blog/ad-rms-slc-encryption-key (Part 2, no pivot needed); companion article URL https://www.huntress.com/blog/ad-rms-architecture-and-recon (Part 1)"
    summary: |
      Huntress's two-part series on Active Directory Rights Management Service (AD RMS) shows that every document
      an AD RMS deployment protects is bound to one root key — the Server Licensor Certificate (SLC) private key
      — whose certificate carries a 255-year validity period while the key itself has no expiry and no rotation
      mechanism. Part 1 (2026-09-08) covers the AD RMS architecture, certificate/license trust model, and how any
      ordinary domain user can fingerprint which files are RMS-protected purely through reconnaissance. Part 2
      (2026-09-10) demonstrates that a member of the RMS Service Group — the account class that operates the
      admin surface — can export that SLC private key; once extracted, the 1,172-byte key decrypts every
      document the deployment ever protected, offline, with no further access to the RMS infrastructure required,
      and continues to work even after the RMS deployment itself is rebuilt (since the key is never rotated).
      Huntress explicitly distinguishes this from a DCSync-equivalent attack: it is not AD credential theft or
      domain compromise, but a total and permanent compromise of everything the RMS service protects for every
      user. The author built and released SharpRMS, a unified tool combining the previously known client-side
      RMS-protection-stripping attacks (from Grothe/Mainka/Rösler/Schwenk's 2016 WOOT "DisARMS" research) with the
      new server-side key-extraction capability in one binary.
    region_nexus: "global; applies to any organization using on-premises AD RMS for document rights protection"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: []
    techniques: [T1552.004]
    affected_products: ["Active Directory Rights Management Services (AD RMS)"]
    entity_keys: []
    new_entities:
      - { key: "tool:sharprms", type: tool, name: "SharpRMS", aliases: [],
          summary: "Huntress-authored unified tool combining known client-side AD RMS protection-stripping attacks with new server-side Server Licensor Certificate private-key extraction (Huntress, 2026-09-10)." }
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "every document an AD RMS deployment protects is bound to one root key, the Server Licensor Certificate (SLC) private key, whose certificate carries a 255-year validity period while the key itself has no expiry and no rotation mechanism."
        attribution: "Huntress Labs"
        source_url: "https://www.huntress.com/blog/ad-rms-slc-encryption-key"
      - quote: "This attack is not a DCSync equivalent. The SLC key is not AD credentials, and this is not domain compromise. It is a total, permanent compromise of everything the RMS service protects, for every user."
        attribution: "Huntress Labs"
        source_url: "https://www.huntress.com/blog/ad-rms-slc-encryption-key"
    extended_notes: |
      High-value hardening lever for any public-sector deployment using AD RMS for sensitive document protection:
      the finding argues for treating RMS Service Group membership as Tier-0-equivalent privileged access, and for
      planning key-rotation/decommissioning procedures the product does not natively support. No CVE — this is an
      architectural/design finding, not a patchable software bug.

  - title: "A browser-in-the-browser (BiTB) phishing chain impersonating Adobe delivers rogue ScreenConnect installers and defense-evasion binaries across unrelated victim environments"
    sources:
      - { url: "https://www.huntress.com/blog/phishing-bitb-rmm-attacks", publisher: "Huntress Labs", date: "2026-09-09", role: "primary" }
    discovery_trace: "first seen at: huntress, URL https://www.huntress.com/blog/rss.xml (RSS listing) → primary: Huntress, URL https://www.huntress.com/blog/phishing-bitb-rmm-attacks (no pivot needed)"
    summary: |
      Huntress's SOC documents two August 2026 incidents sharing a browser-in-the-browser (BiTB) phishing
      technique: attackers render an entire fake browser window — address bar, URL, padlock icon, favicon
      included — inside the actual webpage's HTML/CSS/JavaScript, defeating the address-bar check users are
      trained to rely on. Both incidents began with a phishing message leading to an attacker-controlled landing
      page that prompted the target to "View Files" via a spoofed Adobe Acrobat interface (showing what looked
      like a legitimate Adobe subdomain in the fake address bar); following the BiTB page's instructions caused
      the target to download a ScreenConnect installer, leading to deployment of multiple rogue ScreenConnect
      instances plus additional defense-evasion binaries on the endpoint. This is a social-engineering delivery
      chain distinct from the CVE-2026-84869 ScreenConnect file-transfer vulnerability (also Huntress-documented,
      already tracked in this store): here the attacker abuses legitimate ScreenConnect installation via social
      engineering rather than an authorization-check flaw in an active session.
    region_nexus: "global"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: []
    techniques: [T1566, T1204.001, T1219]
    affected_products: ["ConnectWise ScreenConnect"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "BiTB is a tactic where an attacker spins up an entire fake browser window (including the address bar, URL, padlock icon, favicon, and more) inside the actual webpage content itself, usually using HTML/CSS/JavaScript."
        attribution: "Huntress Labs"
        source_url: "https://www.huntress.com/blog/phishing-bitb-rmm-attacks"
      - quote: "This fake page looked like it was the official Adobe website (showing a legitimate, official Adobe subdomain in the URL). Through following the instructions on the BiTB page, the targets unknowingly downloaded a ScreenConnect installer – leading to the deployment of multiple rogue ScreenConnect instances on their endpoints and defense-evasion binaries."
        attribution: "Huntress Labs"
        source_url: "https://www.huntress.com/blog/phishing-bitb-rmm-attacks"
    extended_notes: |
      Triage discriminator: legitimate ScreenConnect deployment by IT is normally initiated by a known
      administrator account/process lineage; a ScreenConnect installer arriving as a browser download
      immediately following a "View Files"-style prompt on an unfamiliar domain, with no corresponding change
      ticket, is the discriminating signal from this report.

