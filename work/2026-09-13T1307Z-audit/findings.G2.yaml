watch_item_recheck:
  - item: "Zurich District Court verdict — LockerGoga/MegaCortex/Nefilim trial"
    outcome: resolved
    detail: |
      Already fully captured in the store: entry 2026-08-18/zurich-trial-lockergoga-megacortex-nefilim-swiss-victims carries a 2026-09-11T04:38:00Z update recording the 2026-09-10 verdict (12 years 9 months' unconditional imprisonment, 10-year expulsion order, CHF 300,000 forfeiture — 9 months more than the prosecution's own demand; guilty on extortion, attempted extortion, serious data damage and CSAM possession; defense's "unwitting IT consultant" argument and evidence-inadmissibility bid both rejected; no finding of the defendant's own intelligence-service ties despite the prosecutor repeating the contested FSB-cover-identity claim about the group's Moscow-based principal; verdict not final, open to appeal). Re-researched this window via SRF, watson.ch, cash.ch, inside-it.ch and NZZ coverage (all dated 2026-09-10/09-11) — no material fact beyond what the existing changelog record already carries. NZZ's "die Spur führt zum Kreml" framing (Kremlin-connection angle) is consistent with, not additive to, the FSB-cover-identity point already recorded. No further development (e.g. an appeal filing) surfaced inside the 2026-09-06→09-13 window.
    sources_checked:
      - "https://www.srf.ch/news/schweiz/zuercher-bezirksgericht-hackerangriff-auf-stadler-rail-taeter-zu-langer-haft-verurteilt"
      - "https://www.inside-it.ch/zuercher-gericht-verurteilt-ransomware-erpresser-20260911"
      - "https://www.cash.ch/news/hacker-von-stadler-rail-und-meier-tobler-zu-langer-haft-verurteilt-967811"
    action_needed: none — already correctly reflected in the existing entry's changelog.

  - item: "Boston Scientific — attacker/vector/mechanism naming"
    outcome: unchanged
    detail: |
      Resolution condition (any source naming attacker behaviour) NOT met. Fetched Boston Scientific's own follow-up Form 8-K (Item 1.05, filed 2026-09-08, in-window) directly from SEC EDGAR: it confirms the incident "is likely to have a material impact" on Q3/FY2026 results (net-sales-growth and adjusted-EPS guidance from 2026-07-29 will not be met), reports substantial restoration of distribution/sterilization/manufacturing operations, and states "the Company has not identified evidence of ongoing unauthorized access to its systems" — but uses only generic language ("unauthorized activity on certain of the Company's systems") throughout; no attacker, ransomware family, extortion group, or initial-access vector is named anywhere in the filing. WebSearch across HIPAA Journal, The Register, Cybersecurity Dive and Medical Economics likewise found no attacker claim as of the window's close. No Swiss nexus identified.
    sources_checked:
      - "https://www.sec.gov/Archives/edgar/data/885725/000088572526000059/bsx-20260907.htm"
      - "https://www.cybersecuritydive.com/news/boston-scientific-cyberattack-disrupted-order-processing-shipping/828816/"
    action_needed: continue to watch; do not include as an entry until an attacker/vector is named or a Swiss nexus surfaces.

  - item: "NovoCure — Swiss public-sector nexus or transferable TTP"
    outcome: unchanged
    detail: |
      No concrete Swiss public-sector nexus found, and the 09-09 fire's finding is reconfirmed from NovoCure's own SEC filings: NovoCure Ltd's Form 8-K cover pages (filed 2026-09-01 and 2026-09-02) state its principal executive offices are "No. 4 The Forum, Grenville Street, St. Helier, Jersey, JE2 4UF" — Jersey, Channel Islands, not Switzerland. (NovoCure does operate a Swiss office, commonly cited elsewhere as "Root, Switzerland" or "Baar/Zug," but this is not the company's legal/principal seat per its own primary filings, and no source ties the ShinyHunters/Salesforce-adjacent breach to that Swiss office or to any Swiss public-sector system.) No new transferable TTP beyond the already-documented ShinyHunters pattern of targeting cloud/SaaS platforms and third-party integrations rather than direct network intrusion.
    sources_checked:
      - "https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&company=novocure&type=8-K"
      - "https://www.bleepingcomputer.com/news/security/novocure-data-breach-affects-more-than-1-400-cancer-patients/"
    action_needed: none — remains correctly excluded per the 09-09 fire's determination.

  - item: "Afpa, Ixa Systems SA, UICC, Ville de Libercourt — bare leak-site claims"
    outcome: unchanged
    detail: |
      All four remain uncorroborated leak-site claims; no victim statement or Admiralty A/B journalism found for any of them this window.
      - Afpa (French vocational-training agency, AFPABox platform): claim by actor "Cybernox" (~101 accounts, an admin-access credential), reported only by leak-tracking aggregators (cyberattaque.org, frenchbreaches.com) — no AFPA statement found.
      - Ixa Systems SA (Crissier, canton Vaud — Swiss physical-security integrator whose clients include police, prisons, hospitals, banks, museums and railways): claimed by "Thegentlemen" ransomware group, first listed ~2026-08-28/30 (outside this window) per ransomware.live; targeted Swiss-press search (24 heures/RTS/Blick, French-language queries) returned no coverage at all — only business-directory listings. Genuinely Swiss public-sector-adjacent supplier (police/prison clients) if confirmed, which raises the stakes, but the claim itself is still bare.
      - UICC (Union for International Cancer Control, Geneva-headquartered international NGO): claimed by "Krybit" ransomware group (~2026-09-01) per ransomware.live/brinztech; no victim statement, no independent journalism found.
      - Ville de Libercourt (Pas-de-Calais, France): claimed by "Kairos" ransomware group (~817 GB, added 2026-09-02) per cyberattaque.org/frenchbreaches.com/ransomware.live; no municipal statement found.
      None of these claim dates fall inside this run's 2026-09-06→09-13 window (all predate it), and none has moved to victim confirmation or Admiralty A/B-grade reporting since.
    action_needed: continue to watch each; Ixa Systems SA in particular should be re-checked with Swiss trade/security press (netzwoche, inside-it.ch) given its police/prison/hospital client base.

  - item: "Insel Gruppe — independent Swiss press coverage"
    outcome: unchanged / coverage gap persists
    detail: |
      No independent Swiss press coverage found this window. inside-it.ch continues to return HTTP 429 ("Vercel Security Checkpoint") on every transport tried this run (WebFetch, tools/fetch_source.py extract, tools/fetch_source.py url with jina fallback) — confirmed on two unrelated inside-it.ch URLs (an Insel-Gruppe-adjacent search hit and a separate Uri-canton article), indicating this is a site-wide rate-limiting/edge-protection issue on inside-it.ch rather than an article-specific block. Targeted German-language WebSearch queries ("Insel Gruppe" Hackerangriff/Cyberangriff/Datenpanne/Cybervorfall, 2026) surfaced only unrelated or stale results (a February 2018 outage, a 2019 "gross deficiencies" IT-security audit finding, and a May 2026 "one year later" radiology-network cyberattack story on a different, unnamed hospital network — all outside this window and none confirmed as Insel Gruppe specifically). No Bern cantonal, national, or trade-press statement about an Insel Gruppe incident was found.
    action_needed: |
      Recipe fix candidate for sources.json: if inside-it.ch keeps 429ing the bridge/jina/WebFetch alike, treat it as a rotating rate-limit and retry later in the day rather than immediately re-attempting; consider adding a direct WebSearch-only fallback note for this source in sources.json until the block is confirmed resolved.

ncsc_ch_spotcheck:
  duty: "named carry-forward duty — establish whether ncsc-ch-focus (im-fokus) and ncsc-ch-incidents (aktuelle-vorfaelle) carried publishable in-window content, and fix the recipe if broken"
  recipe_status: |
    BROKEN as recorded (plain `python3 tools/fetch_source.py url <URL>` / direct WebFetch): both pages are Nuxt SPAs — the raw HTML response is an empty client-side shell (confirmed this run: the raw `url` fetch of https://www.bacs.admin.ch/de/aktuelle-vorfaelle returned only `<div id="__nuxt">` boilerplate with zero article content).
    FIX FOUND AND VERIFIED THIS RUN: `python3 tools/fetch_source.py jina <URL>` hydrates both pages correctly and returns full, dated post listings in clean markdown. Recommend recording this verbatim in sources/sources.json notes for both ncsc-ch-focus and ncsc-ch-incidents: "Nuxt SPA — raw/direct fetch returns an empty client shell; use `python3 tools/fetch_source.py jina <URL>` to hydrate and read the dated post list (verified 2026-09-13)."
  aktuelle_vorfaelle_result: |
    Genuinely quiet in-window: the newest post on https://www.bacs.admin.ch/de/aktuelle-vorfaelle as of 2026-09-13 is dated 18 August 2026 ("Update zur Meldung zu SwissNovaChat", a consumer-fraud collection-agency warning) — nothing published in the 2026-09-06→09-13 window. Not a coverage gap; the page is simply quiet this week.
  im_fokus_result: |
    NOT quiet — one in-window post exists: "Woche 36: Analoges Skimming – Psychologie statt Technik" (8 September 2026), describing telephone social-engineering fraud where callers impersonate bank staff to obtain a victim's physical bank-card chip for fraudulent cash withdrawals. This is genuine in-window NCSC-CH content the recorded (broken) recipe would have missed entirely. However, on review it does NOT clear this deployment's relevance bar: it is consumer/retail-banking fraud awareness with no technical depth (no vulnerable component, no attacker infrastructure, no detection/hardening lever) and no nexus to Swiss public-sector/critical-infrastructure defenders — it reads as a citizen-awareness bulletin, not a defender-facing advisory. Excluded from findings on relevance grounds, not on reachability grounds.
  conclusion: |
    The prior "zero cited content across seven fires" pattern is explained by BOTH a broken recipe (fixed this run via the jina reader) AND genuinely low defender-relevant output from these two specific pages, which function as a public/consumer fraud-awareness bulletin rather than a technical-advisory channel (NCSC-CH's separate CSH — Cyber Security Hub — feed, already an essential source, carries the actual technical advisories). Recommend the main agent update the sources.json note per the recipe fix above so future runs stop hitting the empty SPA shell, while setting the expectation that these two specific NCSC-CH pages will rarely clear this deployment's technical-depth bar even when reachable.

