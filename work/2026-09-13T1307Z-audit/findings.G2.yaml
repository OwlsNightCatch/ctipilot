items:
  - title: "Oomnium (Zurich crowdfunding/investment platform) discloses a breach of an external analytics tool exposing investor contact data and hashed passwords"
    sources:
      - { url: "https://www.swisscybersecurity.net/news/2026-09-10/oomnium-wird-opfer-eines-cyberangriffs", publisher: "SwissCybersecurity.net", date: "2026-09-10", role: "primary" }
      - { url: "https://insideparadeplatz.ch/2026/09/09/riesen-cyber-bei-startup-finanziererin-oomnium/", publisher: "Inside Paradeplatz", date: "2026-09-09", role: "corroborating" }
      - { url: "https://www.tippinpoint.ch/crowdfunding-plattform-oomnium-gehackt-kundendaten-betroffen/", publisher: "tippinpoint.ch", date: "2026-09-09", role: "corroborating (found via search, not independently fetched this run)" }
    discovery_trace: "first seen at: WebSearch (\"netzwoche.ch Cyberangriff Schweiz September 2026\") → pivot: swisscybersecurity.net site enumeration (python3 tools/fetch_source.py url listing) → primary: SwissCybersecurity.net, URL https://www.swisscybersecurity.net/news/2026-09-10/oomnium-wird-opfer-eines-cyberangriffs → corroboration: Inside Paradeplatz, URL https://insideparadeplatz.ch/2026/09/09/riesen-cyber-bei-startup-finanziererin-oomnium/"
    summary: |
      Oomnium, a Zurich-based crowdfunding/investment platform that has raised money for several Swiss startups (Ellexx, Bakery Bakery, Tradoo, noii and others), disclosed to affected users in the first week of September 2026 that an "external analysis tool" it uses was compromised by unknown attackers. Exposed data includes investor/customer names, email addresses, account information, verification data, profile data, platform-usage information and hashed passwords; identity documents/ID scans are stated as not accessed. No customer funds, investments, financing-round data or transactions were affected, and the investment platform itself continued operating normally. Oomnium states it does not believe it was specifically targeted and links the intrusion to "a series of similar cyberattacks" affecting companies and organizations worldwide (consistent with the pattern of third-party SaaS/analytics-tool compromises seen elsewhere in 2026, e.g. Salesloft Drift/Salesforce-linked campaigns), though no vendor or CVE is named by either source. No ransom or extortion demand has been made and no phishing follow-up has been observed as of disclosure. Oomnium engaged external IT forensics, legal counsel and Swiss data-protection authorities.
    region_nexus: "Switzerland (Zurich) — home region, private fintech/crowdfunding sector, no public-sector nexus identified"
    primary_sector_nexus: "none (private fintech/crowdfunding platform; not a public-sector or critical-infrastructure entity)"
    sector: "financial-services"
