      Flagged borderline: this is a private fintech/crowdfunding platform with no public-sector or critical-infrastructure nexus, and severity is low (no ransom, no confirmed targeting, ID documents excluded, platform availability unaffected). Included only because it is a fresh (in-window), Swiss home-region, victim-confirmed disclosure that fits the general "home-region incident" collection mission; the main agent should weigh it against the strict inclusion gate given its modest severity and lack of public-sector nexus. Neither source names the compromised "external analysis tool" vendor or a mechanism, so no CVE/technique beyond a generic T1199 (Trusted Relationship / third-party service compromise) inference is supportable — flagged as inferred, not source-stated.
