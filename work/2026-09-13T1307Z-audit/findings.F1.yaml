  - id: item2-shieldcrash
    title: "ShieldCrash — Nightmare Eclipse publishes a partial bypass of Microsoft's fix for the ShieldBreak Microsoft Defender/Malware Protection Engine EoP flaw (CVE-2026-69414); no new CVE assigned, no Microsoft confirmation"
    cves: ["CVE-2026-69414"]
    sources:
      - { url: "https://socradar.io/blog/shieldcrash-poc-microsoft-defender-fix-bypass/", publisher: "SOCRadar", date: "2026-09-10", role: "primary — reporting outlet; per-article date verified (listing-page date metadata for this publisher is known-unreliable per prior G3 finding, this fetch drilled the specific article)" }
