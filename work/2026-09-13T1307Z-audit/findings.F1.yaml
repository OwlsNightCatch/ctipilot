      URL https://github.com/MSNightmare/ShieldCrash (direct fetch returned a JS shell; `tools/fetch_source.py url`
      auto-fell back to the jina reader, which hydrated the full README) → pivoted to Microsoft's own MSRC record
      for the underlying CVE, URL https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-69414 (bridge
      `msrc cve` subcommand), to check for any Microsoft acknowledgment of the bypass and to independently confirm
      the remediation-boundary engine version SOCRadar cites.
    summary: |
      SOCRadar (2026-09-10 article) reports that Nightmare Eclipse — the same pseudonymous researcher this store
      tracks as actor:nightmare-eclipse (aliases Chaotic Eclipse, INFINITE NIGHTMARE, MSNightmare), previously
      covered for the 2026-09-06 FalconFlank/PrettyPrague EDR/AV LPE PoC drops — has published "ShieldCrash", a
      public PoC on GitHub (github.com/MSNightmare/ShieldCrash) claiming to bypass Microsoft's own fix for
      CVE-2026-69414 ("ShieldBreak", CVSS 7.8), an elevation-of-privilege flaw in the Microsoft Malware Protection
      Engine (mpengine.dll, used by Windows Defender and related Microsoft antimalware products).

      What is actually claimed, and by whom, matters here: the researcher's OWN GitHub README (last updated
      2026-09-08, release tag 1.0) states plainly: "Microsoft has failed to properly patch ShieldBreak
      CVE-2026-69414, under specific conditions it is still possible to trigger the exact same problem that was
      caused by ShieldBreak. While Microsoft fixed several things to prevent re-exploiting the issue, they missed
      a spot where ShieldBreak can still be exploited." This is a PARTIAL bypass claim, not a full defeat of the
      fix — the researcher's own words describe "specific conditions" and "a spot" Microsoft missed, not a wholesale
      failure of the remediation. The researcher's PoC is explicitly self-described as unfinished: "This PoC
      demonstrates an arbitrary file read as SYSTEM with September 2026, all supported windows versions are
      affected" and "I might rework this later into a full SYSTEM PoC but for now I'm dropping this skeleton PoC
      because I'm feeling a bit lazy." SOCRadar's own characterization is consistent and appropriately hedged:
      "ShieldCrash does not currently have a separate CVE. Nightmare Eclipse describes the public release as a
      skeleton PoC that demonstrates privileged file reads. It does not establish arbitrary file writes or
      SYSTEM-level code execution." SOCRadar frames the bypass claim itself as the researcher's own assertion, not
      as vendor-confirmed fact: "Now, Nightmare Eclipse has released ShieldCrash, a Proof-of-Concept (PoC) that
      reportedly bypasses Microsoft's remediation and enables arbitrary file reads with SYSTEM privileges on
      updated Windows systems. Microsoft has not publicly confirmed the reported bypass."

      No new CVE has been assigned to ShieldCrash (both the researcher's README and SOCRadar's article state this).
      No Microsoft-published fix for the bypass exists as of this research: Microsoft's own MSRC record for the
      underlying CVE-2026-69414 shows its latest revision dated 2026-09-03 — five days BEFORE the ShieldCrash
      GitHub release (2026-09-08) — with no acknowledgment of a bypass; nothing in that record post-dates the
