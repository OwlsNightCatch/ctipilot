    discovery_trace: >
      first seen at: recorded lead in spawn brief (registry actor:nightmare-eclipse) → fetched SOCRadar's specific
      article, URL https://socradar.io/blog/shieldcrash-poc-microsoft-defender-fix-bypass/ (trafilatura extract,
