    summary: |
      Semperis researcher Shai Laron's write-up ("Identity Crisis") documents two DISTINCT Active Directory
      vulnerabilities discovered via abuse of "invisible"/unfilterable Unicode characters in AD object attributes,
      each with its own CVE, unambiguously stated by the source (never inferred by list position):

      KerberLoss = CVE-2026-25177 (patched by Microsoft in March 2026, on Patch Tuesday 2026-03-10, "Important"
      Elevation of Privilege). Mechanism: unfilterable Unicode characters let a low-privileged user holding the
      WriteSPN permission on ANY computer or user account bypass Active Directory's SPN-alias uniqueness check
      (added by the 2021 CVE-2021-42282 fix) and create a conflicting servicePrincipalName. Because explicit-SPN
      lookup takes precedence over the alias mapping, this can (a) redirect Kerberos service tickets for a
      HOST-mapped service to an attacker-controlled account, causing a denial-of-service on that service
      (KRB_AP_ERR_MODIFIED at the real target), and (b) when the conflict is an exact SPN duplicate, cause the KDC
      to return KDC_ERR_S_PRINCIPAL_UNKNOWN, forcing Kerberos authentication to fail and the client to silently
      fall back to NTLM for that service (an authentication downgrade). MSRC's own record independently confirms:
      title "Active Directory Domain Services Elevation of Privilege Vulnerability", released 2026-03-10, CVSS 8.8
      (CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H/E:U/RL:O/RC:C).

      ResetNightmare = CVE-2026-27912 (patched by Microsoft in April 2026, Patch Tuesday 2026-04-14, "Important"
      Elevation of Privilege) — the more severe of the two, enabling immediate full domain takeover. Mechanism:
      the attacker (any domain user who can write their own userPrincipalName, or who has generic Write on any
      user/computer object, or who can create user/computer objects) sets their own UPN to a string matching the
      target's SamAccountName (e.g. "DemoAdmin1") — this does not require bypassing UPN uniqueness verification,
      since the string differs from the target's actual UPN. The attacker then requests, directly via an AS-REQ
      (not a normal TGS-REQ), a Kerberos ticket scoped to the `kadmin/changepw` SPN — which the source establishes
      is not a distinct service account but "just a TGT with the SPN (sname) changed", using the krbtgt key —
      specifying the target's SamAccountName as principal with the NT-ENTERPRISE name-type and the attacker's own
      (UPNUser) password. The KDC authenticates the request against UPNUser's real key (per PAC_REQUESTOR_SID) but
      returns a ticket displaying the target's name. The critical flaw: the Kerberos Change Password protocol
      (RFC 3244, port 464/kpasswd) goes directly from ticket issuance to an AP-REQ, with NO intervening TGS-REQ —
      and the PAC_REQUESTOR_SID identity-confusion fix Microsoft shipped for the 2021 Dollar Ticket/noPac flaw
      (CVE-2021-42287) is enforced ONLY at TGS exchange, so it never fires on this path. After clearing/changing
      their own UPN attribute (orphaning the name binding), the attacker submits the password-change request using
      the cached ticket; the change-password service resolves the ticket's displayed principal name and, because
      the UPN mapping to the attacker's own account no longer exists, the reset lands on the real target account
      (e.g. Domain Admin). The attacker then requests a fresh, genuinely-privileged TGT for that account. Only
      precondition beyond the write permission: the target's password must be "sufficiently aged" — trivially met,
      since AD's default Minimum password age is 1 day. 0patch's own (simpler) characterization of the root cause:
      the change-password code "blindly trust[s] the user ID (SID) to change the password for (provided by the
      attacker) and not validat[es] the requestor's identity."

      CVSS: Semperis's post does not state a CVSS score for either CVE. Microsoft's own MSRC record (the assigning
      authority) is the only score available for CVE-2026-27912: Base 8.0, Temporal 7.0, vector
      CVSS:3.1/AV:A/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H/E:U/RL:O/RC:C — attack vector is Adjacent (MSRC's own FAQ
      explains this reflects that "exploitation of this vulnerability requires that an attacker needs to be in the
      same restricted Active Directory domain as the target system"). MSRC records "exploited": "No" and
      "publiclyDisclosed": "No" for CVE-2026-27912, and its exploitability assessment is "Exploitation Less Likely"
      (structured MSRC field, not free-text prose) — i.e. Microsoft itself does not report any observed
      exploitation. CVE-2026-27912 is NOT present in the CISA KEV catalog (checked 2026-09-13 via the bridge).

      Affected/patched versions, from Microsoft's own structured CVRF data (April 2026 release) rather than prose:
      the vulnerability affects the Windows Kerberos component on domain-controller-role Windows Server builds
      only (no client-OS entries in the CVRF ProductTree for this CVE) — Windows Server 2012 (KB5082127), Windows
      Server 2012 R2 (KB5082126), Windows Server 2016 (KB5082198), Windows Server 2019 (KB5082123), Windows Server
      2022 (KB5082142), Windows Server 2022 23H2 Server Core (KB5082060), Windows Server 2025 incl. Server Core
      (KB5082063) — all with severity "Important" / Impact "Elevation of Privilege", released 2026-04-14.

      0patch (ACROS Security) subsequently back-ported the fix as a free micropatch for Windows versions Microsoft
      no longer patches by default: Windows Server 2008 R2 (fully updated with no ESU, ESU1, ESU3 or ESU4 — 0patch
      notes ESU2 is, "for some reason", NOT vulnerable), Windows Server 2012 (no ESU/ESU1/ESU2), and Windows Server
      2012 R2 (no ESU/ESU1/ESU2). Its first micropatch (issued 2026-09-07) had a functional regression — it
      "blocked administrators from changing passwords for other users" via the legitimate Kerberos change-password
      path (normal admin resets and "net use" password resets were unaffected) — and 0patch revoked and reissued
      corrected micropatches on 2026-09-09.

      Detection/hardening (from the two sources; no rule code): Semperis recommends SACL auditing of AD object
      modifications, specifically Security Event ID 5136 ("A directory service object was modified") on domain
      controllers — for ResetNightmare, watch for a userPrincipalName addition/change that matches an existing
      account's SamAccountName; for KerberLoss, watch for a servicePrincipalName addition that conflicts with an
      existing SPN. Semperis's own commercial product (Directory Services Protector) ships purpose-built indicators
      for both (disabled UPN/SPN uniqueness verification, hidden-Unicode-character objects, non-privileged
      SPN/UPN writes). Both sources converge on patching as the primary mitigation; Semperis additionally
      recommends least-privilege review of WriteSPN/generic-Write grants on user and computer objects, since both
      vulnerabilities require only those (very commonly over-granted) permissions plus password-age default.
