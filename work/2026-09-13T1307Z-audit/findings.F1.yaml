    title: "ResetNightmare (CVE-2026-27912) — Kerberos Change Password protocol flaw enabling full domain takeover from a low-privileged user; recovering an unpublished CVE already in the pipeline's CVE index since 2026-08-09"
    cves: ["CVE-2026-27912"]
    related_cve_context: ["CVE-2026-25177"]   # KerberLoss — the second, DISTINCT vulnerability from the same research; see cve_mapping below
    sources:
