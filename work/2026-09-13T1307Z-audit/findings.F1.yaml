      admin rights (the practical mitigation given the local-foothold prerequisite); hunt for unexpected sensitive-
      file reads by MsMpEng.exe or related Defender processes, low-privilege activity immediately followed by
      unusual Defender file operations, and unexpected access to credential stores/security databases/protected
      configuration files — SOCRadar is explicit these are general hunting signals correlated with process
      ancestry and subsequent activity, "not ShieldCrash-specific indicators."
