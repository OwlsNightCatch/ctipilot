        attribution: "ANSA (English), 2026-07-16"
        source_url: "https://www.ansa.it/english/news/business/2026/07/16/privacy-watchdog-fines-wind-tre-1.7-million_43961a24-11d7-4652-9659-f09f4cd78659.html"
    extended_notes: |
      Root-cause detail worth carrying into the entry body: Wind Tre argued in its defense that its API design already followed OWASP API Security Top 10 practices and that the events were unavoidable human error, not a systemic flaw; the Garante rejected this, finding the secondary/enumeration-reachable endpoints were "reasonably identifiable" by a properly scoped vulnerability assessment and penetration test aimed specifically at the API surface (not just the primary/protected endpoints) — a good detection/hardening talking point: security testing that only exercises a web app's primary documented interfaces will miss the secondary endpoints an attacker discovers by probing the app's own client behaviour. Wind Tre's post-incident hardening (rate-limiting on at-risk APIs, lowered CAPTCHA thresholds, WAF blocking of automation user-agents, mandatory OTP second factor) is a usable hardening checklist for any org running a similar retail/field-access model.

  - title: "Scattered Spider duo sentenced to 5.5 years each for the 2024 Transport for London intrusion — helpdesk vishing and MFA-reset social engineering detailed in court"
    sources:
      - { url: "https://www.nationalcrimeagency.gov.uk/news/two-sentenced-for-hacking-transport-for-london-in-uk-s-biggest-ever-cyber-crime-case", publisher: "UK National Crime Agency (NCA)", date: "2026-07-16", role: "primary" }
      - { url: "https://www.cps.gov.uk/national-news/news/cyberhackers-who-targeted-tfl-jailed-more-five-years-each", publisher: "UK Crown Prosecution Service (CPS)", date: "2026-07-16", role: "primary" }
      - { url: "https://www.theregister.com/cyber-crime/2026/07/16/brit-scattered-spider-duo-handed-tickets-to-prison-over-transport-for-london-attack/5272446", publisher: "The Register", date: "2026-07-16", role: "corroborating" }
    discovery_trace: >
      first seen at: WebSearch ("Thalha Jubair Owen Flowers sentenced Transport for London hacking prison")
      → primary: National Crime Agency, URL https://www.nationalcrimeagency.gov.uk/news/two-sentenced-for-hacking-transport-for-london-in-uk-s-biggest-ever-cyber-crime-case
      → primary: Crown Prosecution Service, URL https://www.cps.gov.uk/national-news/news/cyberhackers-who-targeted-tfl-jailed-more-five-years-each
      → corroborating: The Register, URL https://www.theregister.com/cyber-crime/2026/07/16/brit-scattered-spider-duo-handed-tickets-to-prison-over-transport-for-london-attack/5272446
    summary: |
      Owen Flowers (18) and Thalha Jubair (20), both identified by the NCA and CPS as leading Scattered Spider members, were sentenced at Woolwich Crown Court on 16 July 2026 to five years and six months' imprisonment each for the August-September 2024 intrusion into Transport for London (TfL), the largest cybercrime prosecution in UK legal history. Both pleaded guilty under Computer Misuse Act 1990 Section 3ZA (reckless conduct causing significant risk of serious damage) — only the second conviction ever under that section. Court evidence (per The Register and CPS) laid out the intrusion chain in detail: the pair purchased partial TfL employee credentials from criminal forums (T1589.001 Gather Victim Identity Information: Credentials), then impersonated a TfL employee and vished a TfL helpdesk worker into resetting the target account's password and, over multiple attempts, its 2FA (T1566.004 Spearphishing Voice; T1098 Account Manipulation), before using the reset credentials for initial and sustained access (T1078 Valid Accounts). The pair held network access from 31 August to 3 September 2024, using that window to escalate privileges and reach internal systems, ultimately accessing data on what TfL initially believed was ~5,000 people but which TfL confirmed in March 2026 was actually ~7 million users. Business impact: 148 systems rendered inoperable, ~27,000-28,000 employees forced to reset passwords, Dial-a-Ride booking/Oyster refunds/contactless journey-history/photo-travelcard issuance disrupted for months (photocard issuance was not restored until 4 December 2024), and GBP 29 million in remediation cost — while core train/bus operations were not affected. The NCA and CPS state the group intended or was reckless as to risk of serious harm to critical UK infrastructure; CPS quotes prosecutors as noting Flowers threatened to "lock the systems down" despite awareness of potential fatalities, the basis for the Section 3ZA "significant risk of serious damage" charge. Jubair separately faces unsealed US federal charges alleging Scattered Spider-role compromise of 120 networks across 47 US entities (2022-2025), including critical national infrastructure and the federal court system, tied to over USD 115 million in ransom payments; both defendants have prior convictions (Jubair: 22 priors including Lapsus$-era BT/EE and Nvidia intrusions). NCA states the arrests "materially degraded" Scattered Spider's operational capability but declines to confirm any link between the two convicted individuals and other Scattered Spider-attributed attacks (e.g. MGM Resorts 2023, 2025 UK retail wave).
    region_nexus: "United Kingdom — Transport for London is core public transport critical infrastructure; the helpdesk-vishing/MFA-reset TTP chain is a live, globally recurring Scattered Spider signature directly transferable to any Swiss/EU public-sector or CI operator running an internal IT helpdesk with password/MFA-reset authority."
    primary_sector_nexus: "indirect"
    sector: "transport, public-sector"
