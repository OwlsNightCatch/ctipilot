      - { url: "https://www.ansa.it/english/news/business/2026/07/16/privacy-watchdog-fines-wind-tre-1.7-million_43961a24-11d7-4652-9659-f09f4cd78659.html", publisher: "ANSA (English)", date: "2026-07-16", role: "corroborating" }
    discovery_trace: >
      first seen at: databreaches-net, URL https://databreaches.net/feed/ (RSS item "Italy fines WINDTRE €1.7 million over data breaches", link https://wkzo.com/2026/07/16/italy-fines-windtre-e1-7-million-over-data-breaches/)
      → WebSearch ("Garante privacy WINDTRE multa 1.7 milioni violazione dati luglio 2026")
      → pivot: Garante Privacy Newsletter listing page, URL https://www.garanteprivacy.it/home/stampa-comunicazione/newsletter (confirmed the 16/07/2026 newsletter entry)
      → primary: Garante Privacy Newsletter n.549, URL https://www.garanteprivacy.it/home/docweb/-/docweb-display/docweb/10272004
      → primary decision text: Garante Privacy Provvedimento n.348 del 14 maggio 2026, URL https://www.garanteprivacy.it/home/docweb/-/docweb-display/docweb/10263796
      → corroborating: ANSA English, URL https://www.ansa.it/english/news/business/2026/07/16/privacy-watchdog-fines-wind-tre-1.7-million_43961a24-11d7-4652-9659-f09f4cd78659.html
    summary: |
      Italy's Garante per la protezione dei dati personali published (16 July 2026, Newsletter n.549) its 14 May 2026 decision (Provvedimento n.348, doc. web n.10263796) fining Wind Tre S.p.A. EUR 1,715,600 over two 2025 breaches of a customer-facing "Web Application XX." The decision's fact section gives an unusually complete technical account for a DPA order. Initial access was voice social engineering (T1566.004): attackers phoned staff at two retail points-of-sale, posed as internal technical-support technicians, and talked the operators into granting remote access to the POS device. This let the attackers obtain the device's installed client digital certificate plus login credentials — reportedly stored in cleartext on the desktop or recoverable from the browser rather than held in the OS certificate store (T1552 Unsecured Credentials) — and use them as valid multi-factor-authenticated access to the web application (T1078 Valid Accounts). In the first incident the stolen access was used for 66 targeted lookups against the customer base, exposing ~23 customers. In the second, days later, the attackers pivoted from the primary (protected) search API to an unprotected secondary API invoked by the same search function, and ran ~2,000,000 requests sequentially incrementing the customerId parameter — an IDOR/BOLA-style enumeration with no rate-limiting or CAPTCHA on that endpoint (T1213 Data from Information Repositories) — exfiltrating names and contact details for 365,048 customers, and for a 41,359-customer subset also payment-instrument data (postal payment-slip references, IBANs, and credit-card PAN with only the last digits and expiry unmasked). The Garante's legal finding cites GDPR Art. 5(1)(f) (integrity/confidentiality) and Art. 32(1)(b) (security of processing), specifically calling out inadequate digital-certificate/key custody (certs should live in encrypted stores, KMS or HSM, not exportable cleartext) and an incomplete API-security posture — Wind Tre's own vulnerability-assessment/pen-test program had not covered the secondary, enumeration-vulnerable endpoints, a gap the order maps explicitly to OWASP API Security Top 10 categories (missing object-level authorization limits / missing resource-consumption limits). Remediation ordered: encrypted/HSM-backed certificate custody, mandatory password-manager use for POS credential storage, and formalized certificate/credential lifecycle management (issue/distribute/revoke/renew). No named threat actor/cluster — the perpetrators remain unidentified ("ignoti").
    region_nexus: "Italy (EU) — GDPR enforcement by a national DPA under the deployment's coverage focus; the attack technique (helpdesk/retail-staff vishing to obtain a client cert, then enumeration abuse of an unprotected secondary API) is directly transferable to any Swiss/EU telco, utility or public-sector organization with a POS/field-agent access model and a customer-lookup web application."
