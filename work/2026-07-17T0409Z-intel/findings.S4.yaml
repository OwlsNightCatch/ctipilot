  - title: "Garante Privacy fines Wind Tre EUR 1.7M over a vishing-enabled API-enumeration breach that exposed 365,048 Italian telco customers"
    sources:
      - { url: "https://www.garanteprivacy.it/home/docweb/-/docweb-display/docweb/10272004", publisher: "Garante per la protezione dei dati personali (Italian DPA) — Newsletter n.549", date: "2026-07-16", role: "primary" }
