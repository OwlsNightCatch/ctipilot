        attribution: "Garante Privacy decision text — \"the attackers managed to execute about 2 million total requests following an enumeration logic, i.e. progressively incrementing the customer code identifier ('customerId'), compromising the personal data of 365,048 customers\""
        source_url: "https://www.garanteprivacy.it/home/docweb/-/docweb-display/docweb/10263796"
