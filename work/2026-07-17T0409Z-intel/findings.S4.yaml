    novelty: "update-of:2026-06-23/two-scattered-spider-members-plead-guilty-over-the-2024-tran"
    evidence:
      - quote: "148 systems became inoperable, including critical ones that required significant manual workarounds."
        attribution: "National Crime Agency, 2026-07-16"
        source_url: "https://www.nationalcrimeagency.gov.uk/news/two-sentenced-for-hacking-transport-for-london-in-uk-s-biggest-ever-cyber-crime-case"
      - quote: "The attack on Transport for London caused significant financial harm and disruption to a vital part of the UK's critical infrastructure."
        attribution: "NCA Deputy Director Paul Foster, National Cyber Crime Unit, 2026-07-16"
        source_url: "https://www.nationalcrimeagency.gov.uk/news/two-sentenced-for-hacking-transport-for-london-in-uk-s-biggest-ever-cyber-crime-case"
      - quote: "Flowers and Jubair purchased partial TfL credentials from \"well-known criminal forums\" and used those to reset the 2FA on employee accounts, a process that took multiple attempts. Woolwich Crown Court heard that the pair impersonated an employee and socially engineered a TfL helpdesk worker into resetting the password for their account."
        attribution: "The Register, 2026-07-16"
        source_url: "https://www.theregister.com/cyber-crime/2026/07/16/brit-scattered-spider-duo-handed-tickets-to-prison-over-transport-for-london-attack/5272446"
    extended_notes: |
      This is a materially richer follow-up to the 2026-06-23 guilty-plea entry (entities/registry.yaml key incident:tfl-scattered-spider-2024, actor:scattered-spider) — the guilty-plea coverage did not carry the helpdesk-vishing/credential-purchase mechanics; this sentencing coverage does, sourced to on-the-record court evidence via CPS/NCA/Register. Recommend the composer treat this as the technical-detail delta rather than a bare re-report of "they were sentenced." Detection/hardening angle for the brief: the compromise chain never touched a technical vulnerability — the single control point was the helpdesk's password/MFA-reset process. Defenders should treat helpdesk-initiated credential and MFA resets as a distinct, monitorable event class (who requested it, what verification was performed, time-to-privileged-action afterward) rather than an implicitly trusted administrative action.

