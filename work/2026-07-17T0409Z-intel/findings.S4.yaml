    techniques: [T1589.001, T1566.004, T1098, T1078]
    affected_products: []
    entity_keys: ["actor:scattered-spider", "incident:tfl-scattered-spider-2024"]
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
