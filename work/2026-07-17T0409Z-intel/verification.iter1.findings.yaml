- code: F3
  category: claim-not-supported
  section: active-incidents
  item: "Scattered Spider duo sentenced over the 2024 TfL intrusion (scattered-spider-tfl-sentencing-helpdesk-vishing)"
  url_or_quote: "\"TfL later established that data on roughly 7 million users had been accessible — far beyond the ~5,000 initially believed ([NCA, 2026-07-16](https://www.nationalcrimeagency.gov.uk/news/two-sentenced-for-hacking-transport-for-london-in-uk-s-biggest-ever-cyber-crime-case); [CPS, 2026-07-16](https://www.cps.gov.uk/national-news/news/cyberhackers-who-targeted-tfl-jailed-more-five-years-each))\""
  summary: "The 7 million / ~5,000 figures are inline-cited to NCA and CPS, but neither page contains them (verified: NCA page has no occurrence of 'million' at all; CPS page carries only '£29 million' and '140 systems'). Both figures are actually in The Register (a corroborating source already on the entry): 'originally thought to be only around 5,000 people' and 'gained access to around 7 million users' data'. Re-attribute the clause to the Register source (or add it as the citation) so the cited link supports the claim."
- code: F4
  category: hallucinated-fact
  section: active-incidents
  item: "Scattered Spider duo sentenced over the 2024 TfL intrusion (scattered-spider-tfl-sentencing-helpdesk-vishing)"
  url_or_quote: "evidence[] quote attributed to The Register: \"Flowers and Jubair purchased partial TfL credentials from \\\"well-known criminal forums\\\" and used those to reset the 2FA on employee accounts, a process that took multiple attempts. Woolwich Crown Court heard that the pair impersonated an employee and socially engineered a TfL helpdesk worker into resetting the password for their account.\""
  summary: "Minor / adjacent-paragraph splice. The two sentences are verbatim but come from two SEPARATE consecutive paragraphs in the Register article (line 58 and line 60, with a paragraph break between), joined here into one quote with '. '. Meaning is preserved and the order is unchanged, but the string is not a contiguous copyable substring per the evidence-quote contiguity rule. Fix by splitting into two evidence records or inserting an ellipsis at the paragraph boundary."
