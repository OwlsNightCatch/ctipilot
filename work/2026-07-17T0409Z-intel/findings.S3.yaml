  - title: "Cisco Talos: UAT-11795 deploys a novel Python RAT (\"Starland\") and a bespoke in-memory PowerShell C2 implant (\"WLDR\"), with blockchain dead-drop C2 resolution"
    sources:
      - { url: "https://blog.talosintelligence.com/uat-11795-deploys-novel-starland-rat-and-bespoke-wldr-c2-implant-in-financially-motivated-campaign/", publisher: "Cisco Talos", date: "2026-07-16", role: "primary" }
    discovery_trace: "first seen at: direct sweep of blog.talosintelligence.com, URL https://blog.talosintelligence.com/ → primary: Cisco Talos, URL https://blog.talosintelligence.com/uat-11795-deploys-novel-starland-rat-and-bespoke-wldr-c2-implant-in-financially-motivated-campaign/ (no pivot needed; full body confirmed via jina reader, Published Time 2026-07-16T10:00:01Z)"
    summary: |
      Cisco Talos disclosed UAT-11795, a Russian-speaking, financially motivated actor active since at least June 2025 against victims chiefly in the U.S., with lesser impact in Germany, Romania and Venezuela. Initial access is a ClickFix lure that runs a clipboard-pasted command invoking mshta.exe to fetch a weaponized HTA; the HTA's embedded VBScript drops a batch file that stages a trojanized installer (observed disguising MobaXterm, Cisco WebEx, Zoom, DBeaver Community Edition and the FACEIT gaming client) and sets HKCU\Software\Microsoft\Windows\CurrentVersion\Run\MyApp -> mshta.exe for re-execution at logon. The NSIS-packaged installer bundles pythonw.exe plus a compiled Python loader disguised as LICENSE.txt; the loader XOR-decrypts (key 0xC6) and executes "Starland RAT" entirely in memory. Starland pre-declares Win32 API signatures via ctypes (VirtualAllocEx, WriteProcessMemory, CreateRemoteThread, QueueUserAPC), checks for sandbox usernames/hostnames (incl. WDAGUtilityAccount, Cuckoo, Any.Run) and a Downloads Zone.Identifier ADS before proceeding, persists via a scheduled task named PythonLauncher-{3 random chars} (AtLogOn, RunLevel Highest) plus a Startup-folder LNK, harvests host recon (HWID from the C: volume serial, RAM, AV product, AD domain membership via whoami/systeminfo/net user/nltest), enumerates 40+ desktop and browser-extension cryptocurrency wallets, and beacons a Telegram bot with victim fingerprint/wallet inventory before registering to its primary C2. If primary C2 registration fails, Starland calls the Polygon smart contract 0x6ae382ed2154cc84c6672e4e908cd2c69c1b35ba via eth_call/JSON-RPC and XOR-decrypts (key "$m7*rYpry3") the returned string to recover a fallback C2 domain — a blockchain dead-drop resolver pattern. Starland's C2 can direct it to run shell/PowerShell commands, or fetch 32/64-bit shellcode via APC-based process injection that AMSI/ETW-patches (hash-resolved AmsiScanBuffer/EtwEventWrite overwritten in memory, with a VirtualProtect fallback) before reflectively loading one of two named secondary implants: CastleStealer (.NET credential/crypto/Telegram/Discord stealer, DPAPI + AES-GCM browser-credential decryption) via the x64 path, or a Remcos RAT variant via the x32 path. Separately, Starland has also been observed shell-executing a curl download of an undocumented, bespoke PowerShell C2 framework the actor's own scripts label "WLDR": a multi-stage PowerShell stager/downloader/agent chain, HWID-bound to the C: volume serial number, deriving a 64-byte AES key via a hardcoded password and a server-supplied salt, running encrypted HTTP beaconing (Chrome-124 User-Agent spoofing) every 10 seconds, and executing operator PowerShell through a 10-thread RunspacePool that streams stdout/stderr/warning back to the C2 in real time (with a background-job fallback for short batch tasks). A Russian-language VBScript developer comment confirms the actor's likely origin.
    region_nexus: "primary victimology United States; secondary impact in Germany (EU) and Romania (EU) per passive-DNS C2 resolution data — direct EU footprint"
