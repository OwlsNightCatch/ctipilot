  - title: "Kaspersky: \"HelloNet\" campaign persists inside the ViPNet secure-network update system via DLL sideloading, hindering security tools through raw AFD IOCTL interception"
    sources:
      - { url: "https://securelist.com/hellonet-vipnet/120700/", publisher: "Kaspersky Securelist (GReAT)", date: "2026-07-16", role: "primary" }
    discovery_trace: "first seen at: direct sweep of securelist.com, URL https://securelist.com/ → primary: Kaspersky Securelist, URL https://securelist.com/hellonet-vipnet/120700/ (no pivot needed; full body confirmed via jina reader, page carries a 2026-07-16 update log for SIEM/MDR/KEDR/KATA detection additions)"
    summary: |
      Kaspersky's GReAT team disclosed "HelloNet", an active APT campaign (started at least May 2026, ongoing at publication) that abuses the update mechanism of ViPNet — a Russian GOST-certified secure-networking software suite — to persist inside targeted Russian government, energy, transport, education, logistics and industrial organizations. The attackers drop a malicious wtsapi32.dll into C:\Program Files (x86)\InfoTeCS\VIPNet Update System, a directory the legitimate, auto-launched update executable itcsrvup64.exe is susceptible to loading via DLL sideloading. This loader ("HelloInjector") injects into svchost.exe via NtWriteVirtualMemory/NtCreateThreadEx after verifying the target process both matches the svchost.exe name and carries "netsvcs" on its command line, then loads a second-stage payload ("HelloProxy") stored in plaintext in its own body. HelloProxy uses the Microsoft Detours library to hook NtDeviceIoControlFile, closesocket and shutdown, intercepting the raw Ancillary Function Driver IOCTL codes AFD_RECV (0x12017, incoming-traffic processing) and AFD_GET_TDI_HANDLES (0x12037, socket registration) — a technique Kaspersky states "allows the malware to hinder security solutions operating in user mode for filtering network connections" — while listening on ports 5003/5060 and gating command traffic behind a two-byte (0x0502) plus fixed-string ("ASDFASFSAFASDF") handshake, then acting as either a raw traffic proxy or a loader for further in-memory modules. Two such modules were recovered from svchost.exe: "HelloExecutor" (arbitrary shell-command execution, used to run recon commands including query user, ipconfig /all, net user/group /do, and directory listings of ViPNet Administrator/Client export paths) and "HelloCleaner" (deletes ViPNet log files to hide attacker activity). On at least one host the operators launched a renamed, legitimate PuTTY/Plink binary (as C:\users\public\music\frontpage.exe) to open an SSH-based reverse tunnel (-R 8443:<redacted>:5003) to their C2 at 5.39.253[.]206. A separate, Rust-written backdoor ("HelloBackdoor") was also found, listening on TCP/443 and gated by the string "47c6235b4d2611184" (the second half of the MD5 hash of "hello\n"), supporting file upload/download and self-stop commands. Attribution is low-confidence to an unknown Chinese-speaking APT group, based only on an unused HTTP request string referencing news.sina.com and Rust crates fetched from the mirrors.ustc.edu.cn mirror during compilation — Kaspersky explicitly flags both as potentially unintentional artifacts or false flags. Kaspersky notes this is not the first time ViPNet-connected systems have been targeted, citing its own 2025 report on a backdoor mimicking ViPNet updates.
    region_nexus: "Russia (direct victimology: government, energy, transport, education, logistics, industry); no direct Swiss/EU victim named — carried for the transferable technique class (DLL sideloading of a security/VPN product's own auto-update component, plus raw AFD-IOCTL interception to blind user-mode network-filtering security tools), which applies to any organization running third-party secure-network/VPN client software with an automatic update mechanism"
    primary_sector_nexus: "indirect"
    sector: "energy, transport, education (out-of-nexus direct victim: Russian government/critical-infrastructure sectors)"
    cves: []
    techniques: [T1574.001, T1055, T1685, T1572, T1105, T1070, T1082, T1016, T1518, T1087.002]
    affected_products: ["InfoTeCS ViPNet"]
    entity_keys: []
    new_entities:
      - { key: "campaign:hellonet-vipnet-supply-chain", type: campaign, name: "HelloNet", aliases: [],
          summary: "APT campaign (active since at least May 2026) persisting via DLL-sideloading into the ViPNet secure-network software's own update component, targeting Russian government, energy, transport, education, logistics and industrial organizations; attributed with low confidence to an unknown Chinese-speaking APT group (Kaspersky Securelist/GReAT, 2026-07-16)." }
      - { key: "tool:hellonet-malware-suite", type: tool, name: "HelloNet toolkit", aliases: ["HelloInjector", "HelloProxy", "HelloExecutor", "HelloCleaner", "HelloBackdoor"],
          summary: "Multi-component malware suite used in the HelloNet campaign: HelloInjector (DLL-sideload loader that injects into svchost.exe), HelloProxy (traffic proxy/loader hooking AFD IOCTLs via Microsoft Detours), HelloExecutor (shell-command backdoor), HelloCleaner (ViPNet log eraser) and HelloBackdoor (Rust file-transfer backdoor on TCP/443) (Kaspersky Securelist/GReAT, 2026-07-16)." }
    relation_suggestions:
      - { subject: "campaign:hellonet-vipnet-supply-chain", object: "tool:hellonet-malware-suite", basis: "Kaspersky: the campaign deploys the named HelloInjector/HelloProxy/HelloExecutor/HelloCleaner/HelloBackdoor component chain (Kaspersky Securelist, 2026-07-16)" }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "By placing the file in this directory, the attackers implement the DLL Sideloading technique — the ViPNet update system executable file itcsrvup64.exe, which is launched at OS startup, is susceptible to it."
        attribution: "Kaspersky Securelist (GReAT)"
        source_url: "https://securelist.com/hellonet-vipnet/120700/"
      - quote: "These codes are used during socket operations — their interception allows the malware to hinder security solutions operating in user mode for filtering network connections."
        attribution: "Kaspersky Securelist (GReAT)"
        source_url: "https://securelist.com/hellonet-vipnet/120700/"
      - quote: "At present, we link this campaign to the activities of an unknown Chinese-speaking APT group with a low degree of confidence."
        attribution: "Kaspersky Securelist (GReAT)"
        source_url: "https://securelist.com/hellonet-vipnet/120700/"
    borderline: true
    borderline_reason: "direct victimology is Russian government/CI with no named Swiss/EU victim; included for the transferable DLL-sideloading-via-trusted-updater and AFD-IOCTL-interception technique classes applicable to any org running third-party secure-network/VPN client software with auto-update, and because Kaspersky's own detection guidance (KEDR hunt rules, SIEM correlation logic, specific IOCTL codes) is directly reusable hunt content"
    extended_notes: |
      Triage-relevant discriminator (from Kaspersky's own detection guidance): monitor for wtsapi32.dll creation specifically inside \InfoTeCS\VIPNet Update System\ (this DLL name/path combination has no legitimate reason to be written there); monitor itcsrvup64.exe/itcsrvup.exe launching any child process other than wmail/monitor/itcsrvup64, or loading a DLL whose signature does not carry the InfoTeCS publisher name; and monitor PuTTY/Plink usage by original PE metadata (product/version/hash) rather than filename, since the tool was renamed to frontpage.exe — Kaspersky's own KEDR rule for this is "using_plink_or_putty_for_port_forwarding". Telemetry class: file-creation/module-load events scoped to a named vendor-update directory, process-creation events for the vendor's own update binary, and command-line pattern matching for renamed remote-tunnel binaries (ssh/plink argument shape port:address:port) independent of executable name.

  - title: "Microsoft: two parallel ACR Stealer intrusion chains — WebDAV/Python/blockchain-dead-drop C2 and fileless MSHTA/steganography — both rooted in ClickFix"
    sources:
      - { url: "https://www.microsoft.com/en-us/security/blog/2026/07/16/acr-stealer-two-observed-intrusion-chains-amid-increased-threat-activity/", publisher: "Microsoft Threat Intelligence (Defender Experts)", date: "2026-07-16", role: "primary" }
    discovery_trace: "first seen at: direct sweep of microsoft.com/en-us/security/blog/, URL https://www.microsoft.com/en-us/security/blog/ → primary: Microsoft Security Blog, URL https://www.microsoft.com/en-us/security/blog/2026/07/16/acr-stealer-two-observed-intrusion-chains-amid-increased-threat-activity/ (no pivot needed; full body confirmed via jina reader, Published Time 2026-07-16T23:12:02Z)"
    summary: |
      Microsoft Defender Experts documented two distinct ACR Stealer delivery campaigns observed across customer environments from late April to mid-June 2026. ACR Stealer is a malware-as-a-service infostealer Microsoft states is "reportedly...associated with the rebranding of Amatera Stealer." Both campaigns begin with an identical ClickFix lure (via malvertising/SEO poisoning) but diverge sharply downstream. Campaign 1: the ClickFix command spawns cmd.exe, which invokes rundll32.exe to load a DLL from a remote WebDAV share over HTTPS, using a GUID-based directory structure disguised as legitimate resources (e.g. "google.ct"); in two of three observed variants the WebDAV share is mounted as a temporary local drive via pushd, and the most evasive variant launches through conhost.exe --headless with delayed-expansion environment-variable obfuscation to hide the pushd/rundll32/hostname strings. Once loaded, the DLL runs a heavily obfuscated PowerShell stage (arithmetic no-ops, dead loops, randomized variable names) that downloads a ZIP payload into a masqueraded %LocalAppData%\Temp directory (e.g. "LogiOptionsPlus"), launches a bundled pythonw.exe, establishes persistence via a hidden scheduled task disguised as a software update, timestomps dropped files against notepad.exe, and clears PowerShell history. The obfuscated Python loader (dynamic API resolution, string reversal/shifting, Base64+zlib) decodes an in-memory shellcode stage that allocates executable memory via VirtualAlloc and transfers execution through the Windows Fiber API (ConvertThreadToFiber/CreateFiber/SwitchToFiber) rather than a thread-based injection primitive. A subset of Campaign 1 intrusions add a secondary Python loader implementing "EtherHiding" — querying public blockchain RPC endpoints/Web3 node infrastructure as a dead-drop resolver for follow-up payloads or a C2 address, letting the operators rotate infrastructure without redeploying malware. Campaign 2 is fileless throughout: the ClickFix command spawns mshta.exe to fetch remote HTA content whose embedded VBScript uses COM objects to decode and launch PowerShell in memory (similarly obfuscated, plus certificate-validation disabling and a victim-specific identifier); its distinguishing technique is steganographic payload delivery — the script downloads a JPEG from an image-hosting service and extracts an encrypted payload from the pixel data before decrypting, decompressing and executing it entirely in memory via runtime-resolved LoadLibrary/GetProcAddress/VirtualAlloc/CreateThread. Both chains converge on the same objective: DPAPI-based decryption of Chromium/Firefox browser credential stores (cookies, saved passwords, auth tokens) plus targeted enumeration of PDFs, Microsoft 365 documents and OneDrive/SharePoint-synced enterprise data, archived for exfiltration. Microsoft published its own MITRE ATT&CK mapping table for both chains alongside concrete KQL advanced-hunting queries (RunMRU registry-key detection for the WebDAV/rundll32 pattern, scheduled-task-creation detection for the disguised "Autoupdate" persistence task, and MSHTA-launched-via-PowerShell detection).
    region_nexus: "global; Microsoft Defender Experts telemetry across customer environments, no region singled out — directly relevant to any Windows enterprise fleet, including Swiss/EU public-sector and critical-infrastructure endpoints"
    primary_sector_nexus: "indirect"
    sector: "cross-sector (enterprise Windows endpoints generally)"
    cves: []
    techniques: [T1189, T1204.004, T1059.003, T1059.001, T1059.006, T1218.011, T1218.005, T1053.005, T1027, T1036, T1070.003, T1027.003, T1620, T1055, T1555.003, T1005, T1074.001, T1102.001]
    affected_products: []
    entity_keys: ["tool:amatera"]
    new_entities:
      - { key: "tool:acr-stealer", type: tool, name: "ACR Stealer", aliases: [],
          summary: "Malware-as-a-service information-stealing malware family, reportedly tied to the rebranding of Amatera Stealer; observed by Microsoft Defender Experts (late Apr-mid Jun 2026) in two distinct ClickFix-rooted intrusion chains — WebDAV/Python/blockchain-dead-drop C2, and fileless MSHTA/steganography — both ending in DPAPI-based browser-credential theft (Microsoft Threat Intelligence, 2026-07-16)." }
    relation_suggestions:
      - { subject: "tool:acr-stealer", object: "tool:amatera", basis: "Microsoft: \"ACR Stealer is an information-stealing malware family reportedly offered through a malware-as-a-service (MaaS) model and associated with the rebranding of Amatera Stealer\" (Microsoft Security Blog, 2026-07-16)" }
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "ACR Stealer is an information-stealing malware family reportedly offered through a malware-as-a-service (MaaS) model and associated with the rebranding of Amatera Stealer."
        attribution: "Microsoft Threat Intelligence"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/07/16/acr-stealer-two-observed-intrusion-chains-amid-increased-threat-activity/"
      - quote: "A notable variation in this campaign is the use of blockchain services for C2 resolution, utilizing a technique known as EtherHiding."
        attribution: "Microsoft Threat Intelligence"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/07/16/acr-stealer-two-observed-intrusion-chains-amid-increased-threat-activity/"
      - quote: "The malware (injected code) aggressively harvests information from browser credential stores. It invokes Windows Data Protection API (DPAPI) routines to decrypt locally stored browser passwords, cookies, and authentication tokens."
        attribution: "Microsoft Threat Intelligence"
