    extended_notes: |
      Triage-relevant discriminator: Campaign 1's RunMRU registry pattern is highly specific — an "@ssl" WebDAV path combined with a GUID (8-4-4-4-12 hex) directory segment invoked through rundll32 or pushd is not a pattern legitimate WebDAV usage produces; Microsoft's own advanced-hunting query keys on exactly this shape. Campaign 2's MSHTA-via-PowerShell chain (PowerShell.exe launched directly from explorer.exe, itself launching mshta.exe against a URL with a 7-digit path segment) is a second, independent low-false-positive anchor. Telemetry class: registry-modification events (RunMRU keys) for the WebDAV/rundll32 discriminator, scheduled-task-creation events for the disguised "Autoupdate" persistence task, and process-creation events with full command-line/parent-lineage capture for the MSHTA-via-PowerShell chain — all three map directly to Microsoft's published KQL, but the underlying artifacts (RunMRU entries, scheduled-task names matching an 8-digit numeric suffix, mshta.exe spawned from a non-interactive PowerShell parent) are vendor-neutral and portable to any EDR/SIEM capturing registry and process-creation telemetry.

  - title: "Unit 42 revisits its 2026 Global Incident Response Report through an AI lens — force multiplier, not yet a new attack class"
    sources:
      - { url: "https://unit42.paloaltonetworks.com/ai-incident-response-report/", publisher: "Palo Alto Networks Unit 42", date: "2026-07-16", role: "primary" }
      - { url: "https://www.paloaltonetworks.com/resources/research/unit-42-incident-response-report", publisher: "Palo Alto Networks Unit 42", date: "2026-02", role: "corroborating" }
    discovery_trace: "first seen at: direct sweep of unit42.paloaltonetworks.com, URL https://unit42.paloaltonetworks.com/ → primary: Unit 42, URL https://unit42.paloaltonetworks.com/ai-incident-response-report/ (no pivot needed; underlying '2026 Global Incident Response Report' confirmed via https://www.paloaltonetworks.com/resources/research/unit-42-incident-response-report to have originally published February 2026 — this is a fresh AI-focused revisit of that report's dataset, not a new annual report release)"
    summary: |
      Unit 42 published a fresh (2026-07-16) analysis piece revisiting its 2026 Global Incident Response Report (originally published February 2026, covering incidents Oct 2024-Sep 2025) specifically through the lens of AI's role in intrusions. The core assessment: AI is "acting as a force multiplier to increase the speed and efficiency of attacks, but is not significantly redefining methods of compromise" — credential theft, phishing, known-vulnerability exploitation and ransomware deployment remain the dominant initial-access and impact categories, but AI compresses attack timelines (the underlying report found the fastest quartile of intrusions reached data exfiltration in 1.2 hours, down from 4.8 hours the prior year) through automated reconnaissance, content generation and malware development. The piece names emerging AI-enabled threat classes — agentic ransomware managing multi-stage extortion (citing Sysdig's JADEPUFFER, already covered in prior-run coverage) and "token jacking" targeting exposed cloud AI credentials/API keys — while reiterating that over 90% of the underlying report's breaches were enabled by preventable security gaps rather than novel exploits. This is a low-technical-depth trend synthesis rather than a new technical disclosure; included for completeness given its in-window publication date but carries limited new detection/hunt content beyond what prior JADEPUFFER and LLM-jacking coverage already surfaced.
    region_nexus: "global; no region-specific data in this piece"
