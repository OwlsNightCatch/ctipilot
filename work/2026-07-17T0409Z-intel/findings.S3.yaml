    reason: "WebFetch and the bridge (tools/fetch_source.py url) both returned only the WordPress page head/meta (Weglot i18n config, GTM tags) with no rendered article-listing HTML captured — the blog's post list appears to be client-side rendered and not present in either fetch's static body. WebSearch found no group-ib.com article dated 2026-07-16/17 (most recent identified: 2026-07-09 RedHook Android RAT update, out of window). No in-window Group-IB item found; treat as unconfirmed rather than a confirmed empty result."
  - source_id: mandiant-direct
    reason: "https://www.mandiant.com/resources/blog redirects (301) to https://cloud.google.com/security/consulting/mandiant-services (a services page, not a blog listing) — Mandiant research is now folded into the Google Cloud/GTIG threat-intelligence blog, which was swept directly and returned no confirmed in-window items (the one candidate, a Cisco Catalyst SD-WAN CVE-2026-20245 zero-day post, was verified via WebSearch to be a stale May/June 2026 item resurfacing in the listing, not fresh)."
  - source_id: sophos-threat-research
    reason: "news.sophos.com/en-us/category/threat-research/ 301-redirects to www.sophos.com/en-us/blog?taxonomy_blog_category=Threat+Research/, which WebFetch rendered as only 4 featured/pinned items with no publication dates — could not confirm presence or absence of an in-window post. Recommend the operator add an RSS-feed recipe for this host in a future run."
  - source_id: nozominetworks-blog
    reason: "WebFetch returned post titles with no visible publication dates on the listing page; could not confirm in-window status for any Nozomi post from the listing alone, and none of the visible titles matched an obviously time-sensitive topic. No dedicated RSS/API recipe attempted this run."

watchlist_sweep:
