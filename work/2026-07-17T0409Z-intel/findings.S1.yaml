  - title: "CVE-2026-58644 — Microsoft SharePoint Server deserialization RCE confirmed exploited, added to CISA KEV (CVSS 9.8)"
    sources:
      - { url: "https://www.cisa.gov/news-events/alerts/2026/07/14/cisa-urges-sharepoint-hardening-after-new-exploitations", publisher: "CISA", date: "2026-07-16", role: "primary" }
      - { url: "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-58644", publisher: "Microsoft MSRC", date: "2026-07-16", role: "primary" }
      - { url: "https://www.theregister.com/security/2026/07/15/cisa-sounds-alarm-over-trio-of-exploited-sharepoint-flaws/5271814", publisher: "The Register", date: "2026-07-15", role: "corroborating" }
    discovery_trace: "first seen at: cisa-kev bridge fetch, URL https://www.cisa.gov/known-exploited-vulnerabilities-catalog (live JSON, catalogVersion 2026.07.16, CVE-2026-58644 dateAdded 2026-07-16) → primary: CISA alert AA (update banner), URL https://www.cisa.gov/news-events/alerts/2026/07/14/cisa-urges-sharepoint-hardening-after-new-exploitations → corroborating: MSRC vulnerability page, URL https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-58644 → corroborating: The Register (2026-07-15, pre-KEV-listing status), URL https://www.theregister.com/security/2026/07/15/cisa-sounds-alarm-over-trio-of-exploited-sharepoint-flaws/5271814"
    summary: |
      CISA's own alert now carries an "Update July 16, 2026" banner confirming CVE-2026-58644 — a deserialization-of-untrusted-data RCE (CWE-502, CVSS 9.8) in on-prem Microsoft SharePoint Server 2016/2019/Subscription Edition — was added to the Known Exploited Vulnerabilities catalog that day, with a 3-day federal remediation deadline (2026-07-19). This is a genuine status delta on the 2026-07-15 coverage of the same CVE (then only "Exploitation More Likely," not confirmed): Microsoft updated its own advisory to confirm in-the-wild exploitation, and CISA folded CVE-2026-58644 into its existing SharePoint alert alongside three other actively-exploited on-prem CVEs (CVE-2026-32201, CVE-2026-45659, CVE-2026-56164). The exploitation chain requires no authentication and delivers RCE by sending a crafted serialized object to a vulnerable SharePoint endpoint; CISA's alert states attackers use the access to steal IIS machine keys (ASP.NET view-state signing/encryption keys) for durable, re-forgeable persistence and deploy deserialization-based web shells, independent of any single CVE in the cluster. All four exploited CVEs affect every supported on-prem SharePoint Server version — Subscription Edition, 2019, 2016; SharePoint Online/cloud is not in scope. Patches shipped as part of the July 2026 Patch Tuesday cumulative updates.
    region_nexus: "global; on-prem SharePoint is common in Swiss/European public-sector and enterprise intranets"
    primary_sector_nexus: "direct"
    sector: "public-sector, cross-sector"
    cves: [CVE-2026-58644, CVE-2026-32201, CVE-2026-45659, CVE-2026-56164]
    techniques: [T1190, T1552.004]
    affected_products: ["Microsoft SharePoint Server 2016", "Microsoft SharePoint Server 2019", "Microsoft SharePoint Server Subscription Edition"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-of:2026-07-15/microsoft-july-patch-tuesday-sharepoint-dynamics-followup"
    evidence:
      - quote: "CISA has updated this Alert to reflect the addition of CVE-2026-58644 to its Known Exploited Vulnerabilities (KEV) Catalog on July 16, 2026."
        attribution: "CISA"
        source_url: "https://www.cisa.gov/news-events/alerts/2026/07/14/cisa-urges-sharepoint-hardening-after-new-exploitations"
      - quote: "These vulnerabilities affect all supported on-premises SharePoint Server versions (Subscription Edition, 2019, and 2016) and involve establishing remote code execution (RCE) and post-exploitation activities, such as stealing Internet Information Services (IIS) machine keys and performing deserialization techniques, to gain persistence and deploy malware."
        attribution: "CISA"
        source_url: "https://www.cisa.gov/news-events/alerts/2026/07/14/cisa-urges-sharepoint-hardening-after-new-exploitations"
    extended_notes: |
      Detection: hunt for the AMSI/MDAV signatures CISA names for this cluster — Exploit:Script/SuspSignoutReqBody.A (request-body scanning, SharePoint Subscription only), Exploit:Script/ToolPaneAuthBypass.A/.C (request-header scanning and RCE coverage, all three versions), and Backdoor:MSIL/LeakFang.A!dha (post-exploitation IIS-secret-harvesting alert). Hardening: rotate IIS machine keys only AFTER hunting for and removing any machine-key harvester already planted (rotating first lets a live implant re-harvest the new key); avoid exposing SharePoint directly to the internet — front it with an authenticating Layer 7 reverse proxy; block external access to SharePoint Central Administration.

  - title: "CISA formalizes federal KEV mandate for two of three actively-exploited Fortinet FortiSandbox pre-auth OS-command-injection flaws (CVE-2026-25089, CVE-2026-39808)"
    sources:
      - { url: "https://www.cisa.gov/known-exploited-vulnerabilities-catalog", publisher: "CISA KEV Catalog", date: "2026-07-16", role: "primary" }
      - { url: "https://nvd.nist.gov/vuln/detail/CVE-2026-25089", publisher: "NVD / Fortinet CNA", date: "2026-06-09", role: "primary" }
      - { url: "https://nvd.nist.gov/vuln/detail/CVE-2026-39808", publisher: "NVD / Fortinet CNA", date: "2026-04-14", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/critical-fortinet-fortisandbox-flaws-now-exploited-in-attacks/", publisher: "BleepingComputer", date: "2026-06-16", role: "corroborating" }
      - { url: "https://github.com/error-inside/CVE-2026-39808", publisher: "GitHub (error-inside)", date: "2026-04-2026", role: "corroborating" }
    discovery_trace: "first seen at: cisa-kev bridge fetch, URL https://www.cisa.gov/known-exploited-vulnerabilities-catalog (live JSON, catalogVersion 2026.07.16, both CVEs dateAdded 2026-07-16, dueDate 2026-07-19) → pivot: WebSearch (\"CVE-2026-25089 FortiSandbox OS command injection Fortinet advisory\") → pivot: BleepingComputer (2026-06-16, original Defused exploitation report), URL https://www.bleepingcomputer.com/news/security/critical-fortinet-fortisandbox-flaws-now-exploited-in-attacks/ → primary: NVD/Fortinet CNA records, URL https://nvd.nist.gov/vuln/detail/CVE-2026-25089 and https://nvd.nist.gov/vuln/detail/CVE-2026-39808 → corroborating: GitHub PoC repo naming the exact endpoint, URL https://github.com/error-inside/CVE-2026-39808"
    summary: |
      CISA added two of the three actively-exploited Fortinet FortiSandbox OS-command-injection flaws to the KEV catalog on 2026-07-16 (dueDate 2026-07-19), converting a month-old exploitation report into a binding federal remediation mandate. Both are unauthenticated, pre-auth command injection (CWE-78) reachable over the appliance's HTTPS web UI: CVE-2026-25089 (CVSS 9.8 NVD / 9.1 Fortinet PSIRT) is injected through the "start VNC" web-UI feature; CVE-2026-39808 (CVSS 9.8/9.1) is injected via the `jid` parameter of the job-detail tracer-behavior endpoint (`/fortisandbox/job-detail/tracer-behavior`), where an attacker pipes shell commands into the job-id value to gain root code execution. Threat-intel firm Defused first reported opportunistic exploitation of both, plus a third sibling flaw (CVE-2026-39813, a path-traversal-to-privilege-escalation bug, CVSS 9.8, CWE-24) that CISA has NOT yet added to KEV, on 2026-06-16 — this campaign is the same one registered in the entity store as "FortiSandbox triple exploitation" (first_seen 2026-06-17); today's KEV addition is the first formal, dated federal confirmation rather than new exploitation activity. Affected: FortiSandbox 4.4.0-4.4.8 (both CVEs), 5.0.0-5.0.5 and Cloud/PaaS 5.0.4-5.0.5 (CVE-2026-25089 only). Fixed: 4.4.9+/5.0.6+. FortiSandbox is deployed at the network perimeter as a detonation/threat-analysis appliance — compromise gives an attacker a foothold with visibility into an org's malware submissions, integration credentials and internal network reachability.
    region_nexus: "global; internet/perimeter-facing appliance relevant to any Swiss/European org running Fortinet Security Fabric sandboxing"
    primary_sector_nexus: "indirect"
    sector: "cross-sector, energy, finance, telco"
    cves: [CVE-2026-25089, CVE-2026-39808, CVE-2026-39813]
    techniques: [T1190]
    affected_products: ["Fortinet FortiSandbox", "FortiSandbox Cloud", "FortiSandbox PaaS"]
    entity_keys: ["campaign:fortisandbox-triple-active-exploitation"]
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "may allow an unauthenticated attacker to execute unauthorized commands via specifically crafted HTTP requests"
        attribution: "NVD / Fortinet CNA (CVE-2026-25089 record)"
        source_url: "https://nvd.nist.gov/vuln/detail/CVE-2026-25089"
      - quote: "OS Command Injection via tracer-behavior Endpoint\" with the `jid` parameter susceptible to pipe injection attacks"
        attribution: "GitHub PoC (error-inside/CVE-2026-39808)"
        source_url: "https://github.com/error-inside/CVE-2026-39808"
      - quote: "We are observing exploitation of multiple Fortinet FortiSandbox vulnerabilities during the past 24 hours, including: CVE-2026-39813."
        attribution: "Defused (via BleepingComputer)"
        source_url: "https://www.bleepingcomputer.com/news/security/critical-fortinet-fortisandbox-flaws-now-exploited-in-attacks/"
    extended_notes: |
      Detection: monitor FortiSandbox web-UI access logs (port 443) for requests to job-detail/tracer-behavior and start-VNC-related handlers carrying shell metacharacters (`|`, `;`, backticks) in the jid or related parameters; alert on FortiSandbox process trees spawning shells or unexpected child processes as root. Hardening: FortiSandbox management interfaces should never be internet-exposed — restrict to a trusted management VLAN/jump host regardless of patch status, since perimeter sandboxing appliances are a repeat exploitation target class (26 Fortinet CVEs on KEV to date per BleepingComputer, 13 tied to ransomware).

  - title: "Abacus ERP: unauthenticated RCE (CVSS 9.8) and authenticated path traversal in a widely-used Swiss ERP/accounting platform"
    sources:
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12766", publisher: "NCSC Switzerland (Cyber Security Hub)", date: "2026-07-16", role: "primary" }
      - { url: "https://security.abacus.ch/en/2026-84b5ca67-a46f-639c-5784-ce3c72065a34", publisher: "Abacus Research AG (vendor advisory)", date: "2026-07-15", role: "primary" }
      - { url: "https://security.abacus.ch/en/2026-8b29ce3e-c211-1f4d-9e50-a94d4d6659d1", publisher: "Abacus Research AG (vendor advisory)", date: "2026-07-15", role: "primary" }
    discovery_trace: "first seen at: ncsc-csh recent posts bridge fetch, URL https://security-hub.ncsc.admin.ch/#/posts/12766 → primary: Abacus vendor advisory (RCE), URL https://security.abacus.ch/en/2026-84b5ca67-a46f-639c-5784-ce3c72065a34 → primary: Abacus vendor advisory (path traversal), URL https://security.abacus.ch/en/2026-8b29ce3e-c211-1f4d-9e50-a94d4d6659d1"
    summary: |
      NCSC Switzerland flagged two vulnerabilities Abacus Research AG (a major Swiss ERP/accounting/HR software vendor used across Swiss SMEs, associations and parapublic organizations) patched on 2026-07-15. The critical flaw (vendor-rated CVSS 9.8, no CVE assigned) is in the server side of the proprietary Abacus client-server communication protocol: "reachable Abacus endpoints are the only prerequisite for an attack" — no authentication is required, and successful exploitation gives the attacker remote code execution on the Abacus application server. A second, high-severity flaw (CVSS 7.7) is a path traversal in two APIs reachable externally via the AbaClik and AbaClik.ai mobile-app integrations, letting an authenticated user or service account with app access rights read files outside the intended security realm. Both were found through Abacus's own bug-bounty program; the vendor states it has "no indications of a successful attack in the wild" for either. Affected: all on-premises Abacus ERP installations on V2026 ≤2026.201.17178, V2025 ≤2025.203.17014, V2024 ≤2024.204.16741, and all EOL V2023 builds; WebPortal/cloud-hosted deployments are explicitly NOT affected. Fixed: V2026 2026.201.17211, V2025 2025.203.17044, V2024 2024.204.16772 (all released 2026-07-15).
    region_nexus: "Switzerland (direct) — Abacus is a Swiss-headquartered vendor with deep penetration in Swiss SME, association and parapublic-sector back-office deployments"
    primary_sector_nexus: "indirect"
    sector: "public-sector, finance"
    cves: []
    techniques: [T1190]
    affected_products: ["Abacus ERP", "Abacus AbaClik", "Abacus AbaClik.ai"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The error is in the server part of the client-server-communication to Abacus. If successfully exploited, the vulnerability allows remote code execution on the abacus server without user authentication."
        attribution: "Abacus Research AG"
        source_url: "https://security.abacus.ch/en/2026-84b5ca67-a46f-639c-5784-ce3c72065a34"
      - quote: "Reachable Abacus Endpoints are the only prerequisite for an attack."
        attribution: "Abacus Research AG"
        source_url: "https://security.abacus.ch/en/2026-84b5ca67-a46f-639c-5784-ce3c72065a34"
      - quote: "No, the vulnerability was found in our bugbounty program. We have no indications of a successful attack in the wild."
        attribution: "Abacus Research AG"
        source_url: "https://security.abacus.ch/en/2026-8b29ce3e-c211-1f4d-9e50-a94d4d6659d1"
    extended_notes: |
      Single-sourced to the vendor advisory itself plus NCSC-CH's relay (carve-out: NCSC-CH acting as primary disclosing relay for a Swiss vendor advisory). No CVE has been assigned by Abacus/MITRE at time of writing — track by vendor advisory ID, not a CVE. Detection is limited since the vendor did not publish IOCs or a technical root-cause writeup beyond "server part of client-server communication" — organizations running on-prem Abacus should prioritise patching over hunting given the absence of published exploitation indicators. Hardening: verify AbaClik/AbaClik.ai external-facing endpoints are not exposed beyond what's operationally required, since the path-traversal flaw's default-exposed condition is what NCSC-CH called out explicitly ("which is the case by default" for orgs with no mobile apps in use).

  - title: "Firefox 152.0.6 patches two chained WebAssembly/site-isolation flaws with public exploit code (CVE-2026-15718, CVE-2026-15719)"
    sources:
      - { url: "https://www.mozilla.org/en-US/security/advisories/mfsa2026-67/", publisher: "Mozilla Foundation Security Advisory", date: "2026-07-14", role: "primary" }
      - { url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0242", publisher: "NCSC-NL", date: "2026-07-16", role: "primary" }
    discovery_trace: "first seen at: advisories-ncsc-nl RSS feed, URL https://advisories.ncsc.nl/rss/advisories (NCSC-2026-0242, published 2026-07-16T14:56Z) → primary: Mozilla Foundation Security Advisory mfsa2026-67, URL https://www.mozilla.org/en-US/security/advisories/mfsa2026-67/"
    summary: |
      Mozilla shipped Firefox 152.0.6 on 2026-07-14 fixing two critical-impact flaws that NCSC-NL flagged fresh on 2026-07-16 because "exploit code for the vulnerabilities is public," raising exploitation likelihood even though no in-the-wild attacks are confirmed. CVE-2026-15718 is an invalid-pointer memory-safety bug in the JavaScript WebAssembly engine (reported by Christian Holler); CVE-2026-15719 is a site-isolation bypass in the DOM Navigation component (reported by Atsushi Sada). NCSC-NL's advisory frames the combined risk: "door een combinatie van twee kwetsbaarheden is het mogelijk voor kwaadwillenden op afstand malafide code uit te voeren" (through a combination of the two flaws it is possible for a remote attacker to execute malicious code) — consistent with a classic browser exploit-chain shape where a site-isolation bypass turns a WebAssembly memory bug into cross-origin/sandbox-relevant code execution, requiring only that a victim visit a malicious site or a legitimate site serving a malicious ad. Note: some aggregator coverage (e.g. a Qualys ThreatPROTECT post titled "Zero-day Vulnerabilities Exploited in Attacks") over-states this as confirmed active exploitation — Mozilla's own advisory text for both CVEs is explicit and identical: exploit code is public, but Mozilla is "not aware of any attacks in the wild abusing this flaw." Fixed in Firefox 152.0.6; all earlier 152.x builds are affected.
    region_nexus: "global; any Firefox/Firefox-ESR deployment, including Swiss/EU government desktop fleets"
    primary_sector_nexus: "indirect"
    sector: "cross-sector"
    cves: [CVE-2026-15718, CVE-2026-15719]
    techniques: [T1189, T1203]
    affected_products: ["Mozilla Firefox"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "We are aware that exploit code for this is public however we are not aware of any attacks in the wild abusing this flaw."
        attribution: "Mozilla Foundation Security Advisory mfsa2026-67 (both CVE-2026-15718 and CVE-2026-15719)"
        source_url: "https://www.mozilla.org/en-US/security/advisories/mfsa2026-67/"
      - quote: "Mozilla geeft aan dat exploitcode voor de kwetsbaarheden publiek beschikbaar is. Dit vergroot de kans op misbruik."
        attribution: "NCSC-NL (NCSC-2026-0242)"
        source_url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0242"
    extended_notes: |
      Flag for the brief composer: at least one aggregator (Qualys ThreatPROTECT) published a headline asserting active ITW exploitation that contradicts Mozilla's own advisory text; do not carry the "zero-day exploited in attacks" framing — Mozilla's primary-source statement (public exploit code, no confirmed ITW abuse) is the load-bearing fact. Detection: browser-crash telemetry / EDR alerts for Firefox process crashes preceded by anomalous WebAssembly compilation or unusual cross-origin navigation sequences are the only generic hunt surface available; no public technical root-cause writeup exists yet to derive a more specific signature. Hardening: standard "update Firefox to ≥152.0.6" — restarting the browser completes the update.

  - title: "CISA ICS batch (16 Jul): Siemens SICAM 8 substation-automation firmware — signature-validation bypass and unverified-password-change privilege escalation (energy sector)"
    sources:
      - { url: "https://www.cisa.gov/news-events/ics-advisories/icsa-26-197-05", publisher: "CISA (ICS Advisory ICSA-26-197-05)", date: "2026-07-16", role: "primary" }
    discovery_trace: "first seen at: WebSearch (\"CISA ICS advisory July 16 2026 critical infrastructure\") → primary: CISA ICS advisory bridge fetch, URL https://www.cisa.gov/news-events/ics-advisories/icsa-26-197-05"
    summary: |
      CISA published a batch of five ICS advisories on 2026-07-16 (ICSA-26-197-01 through -05: Rockwell Arena, Rockwell 1756-EN2/EN3/ENBT, NASA cFS, AutomationDirect Productivity Suite, Siemens SICAM 8); the energy-sector-relevant entry is Siemens SICAM 8 (SICAM A8000 CPCI85/SICORE firmware for CP-8010/8012/8031/8050 substation RTUs, and SICAM EGS/S8000), reported to CISA by Siemens itself with no confirmed exploitation. Four CVEs: CVE-2026-54798 (CVSS 6.5, active/debug HTTP interface reachable without full auth, crashable to DoS); CVE-2026-54799 (CVSS 6.7, firmware-update signature-validation flaw permitting installation of malicious firmware for persistent compromise, requires local/high-privilege access); CVE-2026-54800 (CVSS 4.8, OPC UA security mechanisms disabled by default, high attack complexity); CVE-2026-54801 (CVSS 7.2, insufficient credential validation on administrative-account-modification web API calls, letting an authenticated attacker bypass controls and elevate privileges). None is rated critical individually and none is reported exploited, but the combination — a default-insecure OPC UA posture plus a privilege-escalation path via the admin API plus a firmware-signing weakness — gives an authenticated low-privilege attacker a path to full device compromise on grid-protection hardware. Fixed in CPCI85 ≥V26.20 and SICORE ≥V26.20.0.
    region_nexus: "global; Siemens SICAM 8 is deployed in European TSO/DSO substation-automation environments, energy sector relevance"
    primary_sector_nexus: "indirect"
    sector: "energy"
    cves: [CVE-2026-54798, CVE-2026-54799, CVE-2026-54800, CVE-2026-54801]
    techniques: [T1190, T1601.001]
    affected_products: ["Siemens SICAM A8000 CP-8010", "Siemens SICAM A8000 CP-8012", "Siemens SICAM A8000 CP-8031", "Siemens SICAM A8000 CP-8050", "Siemens SICAM EGS", "Siemens SICAM S8000"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: "moderate CVSS (max 7.2), no confirmed exploitation, and most paths require existing authentication/privilege — carried for energy-sector OT relevance and the combined-weakness pattern, not individual severity."
    evidence:
      - quote: "The affected application contains a vulnerability in its firmware update mechanism's signature validation process. This could allow an attacker to install malicious firmware, leading to persistent code execution and system compromise."
        attribution: "CISA (ICSA-26-197-05, CVE-2026-54799)"
        source_url: "https://www.cisa.gov/news-events/ics-advisories/icsa-26-197-05"
      - quote: "The affected application contains insufficient validation of authentication credentials when processing administrative account modifications through the web API. This could allow an authenticated attacker to bypass security controls and gain unauthorized elevated privileges."
        attribution: "CISA (ICSA-26-197-05, CVE-2026-54801)"
        source_url: "https://www.cisa.gov/news-events/ics-advisories/icsa-26-197-05"
    extended_notes: |
      Detection: OT-network monitoring for anomalous administrative-account-modification calls to the SICAM 8 web API, and for OPC UA sessions negotiated without security policy (Sign/Encrypt) enabled where policy is expected. Hardening: explicitly enable OPC UA security mechanisms (not default), segment SICAM 8 management interfaces from general OT/IT network access, and validate firmware update provenance out-of-band given the signature-validation weakness. Siemens's own general recommendation for grid operators: verify redundant secondary-protection schemes are in place so a single compromised RTU does not threaten grid reliability.

