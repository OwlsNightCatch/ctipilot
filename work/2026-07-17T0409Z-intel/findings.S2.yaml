items:
  - title: "Abacus ERP: unauthenticated critical RCE (CVSS 9.8) plus authenticated path traversal — NCSC-CH flags Swiss ERP vendor's silent hotfix"
    sources:
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12766", publisher: "NCSC Switzerland (Cyber Security Hub / GovCERT.ch)", date: "2026-07-16", role: "primary" }
      - { url: "https://security.abacus.ch/en/2026-84b5ca67-a46f-639c-5784-ce3c72065a34", publisher: "Abacus Research AG (vendor PSIRT)", date: "2026-07-15", role: "primary" }
      - { url: "https://security.abacus.ch/en/2026-8b29ce3e-c211-1f4d-9e50-a94d4d6659d1", publisher: "Abacus Research AG (vendor PSIRT)", date: "2026-07-15", role: "primary" }
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12766 → primary: Abacus Research AG vendor advisory (RCE), URL https://security.abacus.ch/en/2026-84b5ca67-a46f-639c-5784-ce3c72065a34 → primary: Abacus Research AG vendor advisory (path traversal), URL https://security.abacus.ch/en/2026-8b29ce3e-c211-1f4d-9e50-a94d4d6659d1"
    summary: |
      Abacus Research AG (Wittenbach, SG) — one of the most widely-deployed ERP/accounting
      platforms among Swiss SMEs, municipal utilities and public-sector-adjacent
      organizations — shipped a hotfix on 2026-07-15 for two vulnerabilities NCSC-CH flagged
      the following day. The critical flaw (vendor-rated CVSS 9.8, no CVE assigned) is an
      unauthenticated remote code execution in the server-side component that handles the
      proprietary Abacus client-server communication protocol: any attacker who can reach an
      Abacus server endpoint over the network can execute arbitrary code with no
      authentication and no user interaction. WebPortal and cloud-hosted Abacus deployments
      are NOT affected — only on-premises server installations running the native
      client-server protocol. A second, unrelated flaw (vendor-rated CVSS 7.7, high) is a
      path traversal in two APIs tied to the AbaClik / AbaClik.ai mobile companion apps that
      lets an authenticated attacker read files outside the application's security realm;
      NCSC-CH notes these APIs are exposed externally by default even for customers who do
      not use the mobile apps. All supported branches are affected — V2026 <=
      2026.201.17178, V2025 <= 2025.203.17014, V2024 <= 2024.204.16741 — as well as every
      End-of-Life V2023-and-earlier release, which Abacus confirms remains vulnerable with no
      fix forthcoming. Fixed versions are V2026 2026.201.17211, V2025 2025.203.17044 and
      V2024 2024.204.16772; Abacus also offers a ServiceManager-deployable "silent hotfix"
      that requires AbaClient >= 4.2 (older AbaClient versions will fail to start Abacus
      after the silent hotfix and need a manual revert or client upgrade). Both flaws were
      found through Abacus's bug-bounty program; the vendor states it has no indication of
      in-the-wild exploitation and no current indicators of compromise. Internal-only
      deployments remain vulnerable but with the attack surface reduced to the internal
      network.
    region_nexus: "Switzerland — vendor headquartered in Wittenbach (SG); product widely deployed across Swiss SMEs and public-sector-adjacent organizations (utilities, municipal-linked entities, accounting/HR back-offices) that rely on on-premises Abacus ERP installations"
    primary_sector_nexus: "direct"
    sector: "public-sector, finance"
