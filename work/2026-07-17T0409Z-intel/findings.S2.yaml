      - quote: "If successfully exploited, the vulnerability allows remote code execution on the abacus server without user authentication."
        attribution: "Abacus Research AG (vendor advisory)"
        source_url: "https://security.abacus.ch/en/2026-84b5ca67-a46f-639c-5784-ce3c72065a34"
      - quote: "There was a path traversal vulnerability in two apis which allowed an authenticated attacker to read a subset of files on the server which reside outside of the security realm."
        attribution: "Abacus Research AG (vendor advisory)"
        source_url: "https://security.abacus.ch/en/2026-8b29ce3e-c211-1f4d-9e50-a94d4d6659d1"
      - quote: "customers with no Mobile Apps in use can be affected if the affected apis are exposed to extern, which is the case by default"
        attribution: "NCSC Switzerland (Cyber Security Hub post 12766)"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12766"
      - quote: "No, the vulnerability was found in our bugbounty program. We have no indications of a successful attack in the wild."
        attribution: "Abacus Research AG (vendor advisory FAQ)"
        source_url: "https://security.abacus.ch/en/2026-84b5ca67-a46f-639c-5784-ce3c72065a34"
    extended_notes: |
      No CVE has been assigned to either flaw — Abacus rates severity itself (CVSS 9.8 / 7.7)
      and both advisories explicitly withhold deeper technical detail "for security reasons,"
      so hunt guidance is limited to the vendor's own recommendation: patch/hotfix now, and
      if IOCs are later published, review logs for anomalous client-server protocol traffic
      and unexpected file reads via the AbaClik/AbaClik.ai API paths. Operationally notable
      for patch teams: the silent-hotfix delivery path has a version dependency
      (AbaClient >= 4.2) that can itself cause an outage if skipped — the vendor's FAQ
      explicitly documents a revert procedure for exactly this failure mode, which is worth
      flagging to change-management before a scheduled rollout.
