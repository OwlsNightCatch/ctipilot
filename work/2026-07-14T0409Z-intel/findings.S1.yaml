  - title: "DIRAC grid-computing framework: two CVSS 9.9 authenticated eval()-injection RCEs in FileCatalog and RequestManager, patched same day"
    sources:
      - { url: "https://github.com/DIRACGrid/DIRAC/security/advisories/GHSA-m4m7-4cw8-62j6", publisher: "DIRACGrid/DIRAC GitHub Security Advisory (GHSA-m4m7-4cw8-62j6, CVE-2026-61667)", date: "2026-07-13", role: "primary" }
      - { url: "https://github.com/DIRACGrid/DIRAC/security/advisories/GHSA-9jpv-c7p4-997x", publisher: "DIRACGrid/DIRAC GitHub Security Advisory (GHSA-9jpv-c7p4-997x, CVE-2026-45579)", date: "2026-07-13", role: "primary" }
    discovery_trace: "first seen at: WebFetch of GitHub Advisories listing (query type:reviewed severity:critical, sorted by publish date), URL https://github.com/advisories?query=type%3Areviewed+severity%3Acritical&sort=published → primary: DIRACGrid/DIRAC's own GitHub Security Advisories, URL https://github.com/DIRACGrid/DIRAC/security/advisories/GHSA-m4m7-4cw8-62j6 and https://github.com/DIRACGrid/DIRAC/security/advisories/GHSA-9jpv-c7p4-997x (both fetched directly, no further pivot needed — the advisory is the vendor/maintainer's own disclosure)."
    summary: |
      DIRAC — the distributed-computing/workload-management framework underpinning the Worldwide LHC Computing Grid (WLCG) and widely used across high-energy-physics and scientific-research computing, including CERN-affiliated infrastructure — published two companion GitHub Security Advisories on 2026-07-13, both rated CVSS 9.9 (network, low complexity, low privileges required, no user interaction, full C/I/A impact). CVE-2026-61667 (GHSA-m4m7-4cw8-62j6) is in the FileCatalog DatasetManager: the `checkDataset()` function builds a SQL query via an unescaped f-string (CWE-89 SQL injection), and the result of that query is passed directly into Python's `eval()` (CWE-95 eval injection) — an authenticated user can inject SQL that controls what gets eval()'d, reaching arbitrary code execution on the DIRAC server. CVE-2026-45579 (GHSA-9jpv-c7p4-997x) is a parallel bug in the RequestManagementSystem: the `export_getRequestCountersWeb` RPC handler passes a caller-supplied grouping-attribute parameter into a query without sanitisation, and when the parameter doesn't match a recognised attribute, the code prepends the literal string "Request." and evaluates the resulting expression with `eval()` — the advisory states this allows an attacker to "work back up to functions in the os module and trigger them," i.e. full arbitrary command execution. Both require only an authenticated DIRAC account (no admin privilege) and both are described by the maintainers as giving "full compromise of the DIRAC system" including credentials, proxies (DIRAC's grid-proxy delegation model) and tokens, plus the ability to tamper with logs. Both are fixed in the same three releases: v8.0.79, v9.0.22, v9.1.10 (all versions ≥ 6.0 are described as affected). No public PoC or in-the-wild exploitation is reported; this is vendor same-day disclosure-and-patch. Relevant to the constituency's research/education sub-sector — Switzerland hosts CERN and multiple WLCG Tier-2/3 sites that run DIRAC-based job/data management.
    region_nexus: "global open-source project; direct relevance to Swiss/European scientific-computing and research-sector operators of DIRAC-based grid infrastructure (WLCG Tier-2/3 sites, CERN-affiliated computing)"
    primary_sector_nexus: "indirect"
    sector: "public-sector (research/education)"
    cves: [CVE-2026-61667, CVE-2026-45579]
    techniques: [T1190, "T1059.006"]
    affected_products: ["DIRAC (DIRACGrid)"]
    entity_keys: []
    new_entities: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "This allows any authenticated user to run commands on the server, which allows a full compromise of the DIRAC system"
        attribution: "DIRACGrid/DIRAC GitHub Security Advisory GHSA-m4m7-4cw8-62j6"
        source_url: "https://github.com/DIRACGrid/DIRAC/security/advisories/GHSA-m4m7-4cw8-62j6"
      - quote: "An remote code execution vulnerability exists in RequestManager due to the use of eval on untrusted input that allows any authenticated user to run code/commands."
        attribution: "DIRACGrid/DIRAC GitHub Security Advisory GHSA-9jpv-c7p4-997x"
        source_url: "https://github.com/DIRACGrid/DIRAC/security/advisories/GHSA-9jpv-c7p4-997x"
      - quote: "By passing in a dunder string that is applicable to the Request object, it's possible to work back up to functions in the os module and trigger them."
        attribution: "DIRACGrid/DIRAC GitHub Security Advisory GHSA-9jpv-c7p4-997x"
        source_url: "https://github.com/DIRACGrid/DIRAC/security/advisories/GHSA-9jpv-c7p4-997x"
    extended_notes: |
      Both advisories are the maintainers' own first-party disclosure (GitHub Security Advisory published by the DIRACGrid org itself), which is why verification is marked MULTI-SOURCE despite there being no third-party press — the two GHSAs are independent advisories on independent code paths from the same authoritative source, satisfying two-source corroboration on the underlying "DIRAC has an eval-injection RCE class" finding. Detection concept: application/database query-audit logs showing malformed grouping/attribute parameters reaching FileCatalog or RequestManager RPC handlers, and process-creation telemetry showing the DIRAC service process (typically running under a service account, not interactively) spawning shell or `os` module calls it would not normally invoke. Hardening: upgrade to v8.0.79 / v9.0.22 / v9.1.10 immediately; in the interim, restrict which authenticated identities can reach the FileCatalog DatasetManager and RequestManager RPC endpoints via DIRAC's own group/VOMS authorization config.
    borderline: true
    borderline_reason: "narrow-audience product (grid/HEP scientific computing) rather than broad public-sector/CI relevance; included because Switzerland hosts CERN and WLCG compute sites and the flaw class (authenticated eval-injection to full RCE) is a transferable pattern for any Python-based internal service exposing dynamic query/eval logic"

