items:
  - title: "SAP July 2026 Security Patch Day ships three CVSS 9+ critical flaws — NetWeaver AS ABAP memory corruption, Commerce Cloud sample OAuth2 credentials, Approuter request smuggling"
    sources:
      - { url: "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-43586", publisher: "ENISA EU Vulnerability Database (EUVD-2026-43586, CVE-2026-44747)", date: "2026-07-14", role: "primary" }
      - { url: "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-43591", publisher: "ENISA EU Vulnerability Database (EUVD-2026-43591, CVE-2026-44761)", date: "2026-07-14", role: "primary" }
      - { url: "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-43584", publisher: "ENISA EU Vulnerability Database (EUVD-2026-43584, CVE-2026-27690)", date: "2026-07-14", role: "primary" }
    discovery_trace: "first seen at: enisa-euvd bridge (`enisa-euvd recent criticals`), URL https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-43586 → corroboration attempted at SAP's own portal (me.sap.com Notes 3747367/3753495/3720138 — cited in EUVD's references field but not independently fetched: the page sits behind SAP SSO auth) and at support.sap.com/…/security-notes-news/july-2026.html (404 — page not yet published) and cloud.securitybridge.com/advisory/2026/07 (SPA returned no July content yet) — no press coverage found as of this run (WebSearch \"SAP Security Patch Day July 2026\", \"SAP Patch Day July 14 2026 CVE-2026-44747\" both returned only June-2026-and-earlier hits), confirming this is breaking, pre-press-coverage signal. ENISA EUVD is the run's essential-tier, reliability-A source and is used here as primary under the single-source carve-out (it mirrors SAP's own PSIRT data, assigner field = \"sap\")."
    summary: |
      SAP's monthly Security Patch Day (second Tuesday of the month) landed within this run's window — ENISA EUVD ingested three new CVSS 9+ SAP Security Notes at 2026-07-14 00:17-00:20 UTC, several hours before any vendor blog, aggregator (Onapsis, SecurityBridge, SAPinsider) or news outlet had published analysis. CVE-2026-44747 (CVSS 9.9, CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H) is a memory-corruption flaw in SAP NetWeaver Application Server ABAP: an authenticated attacker can trigger "logical errors in memory management" leading to memory corruption, with confidentiality, integrity AND availability impact and a scope change (S:C) — i.e. the flaw crosses a trust boundary from the exploiting session into broader system state. Affected component versions listed by SAP include KRNL64NUC 7.22, NetWeaver AS ABAP 7.22EXT/9.16/9.18, per SAP Note 3747367. CVE-2026-44761 (CVSS 9.1) affects SAP Commerce Cloud (versions COM_CLOUD 2211, 2211-JDK21, HY_COM 2205): the product can retain a sample OAuth2 client whose credentials are the exact sample values published in SAP's own Help Portal documentation — if an operator never rotates them, an unauthenticated attacker who has read that public documentation can obtain a valid OAuth2 access token and invoke APIs to read/modify data (high confidentiality+integrity impact, no availability impact per the CVSS vector). CVE-2026-27690 (CVSS 9.1, S:U) is an HTTP Request Smuggling flaw in the SAP Approuter Node.js package (fixed at ≥ 20.10.0): an unauthenticated attacker sends a specially crafted HTTP request that desynchronizes the request/response stream on a connection shared with other clients, exposing another user's response body and/or causing denial of service. All three are dated to this exact Patch Day (SAP Note references end in the generic `url.sap/sapsecuritypatchday` landing link) with EPSS still at 0.0 and no exploitation reported — this is a same-day disclosure, not a KEV/ITW item. Given SAP's footprint across European public-sector ERP/finance back-ends and e-commerce (Commerce Cloud) and BTP/Cloud-Foundry app routing (Approuter), operators running any of the three affected components should prioritise the July Notes in the normal SAP Patch Day cycle; NetWeaver AS ABAP in particular has a long history of becoming a fast KEV addition once public write-ups appear (cf. this pipeline's June 2026 SAP NetWeaver coverage).
    region_nexus: "global vendor patch cycle; direct relevance to Swiss/EU public-sector and finance-sector SAP ERP and Commerce Cloud estates"
    primary_sector_nexus: "direct"
    sector: "public-sector, finance, cross-sector (SAP ERP is broadly deployed across all constituency sectors)"
