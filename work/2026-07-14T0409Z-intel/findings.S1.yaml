        attribution: "ENISA EU Vulnerability Database (EUVD-2026-43586, sourced from SAP's own CVE assignment)"
        source_url: "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-43586"
      - quote: "SAP Commerce Cloud could retain a sample OAuth2 client with publicly documented sample credentials originating from sample configuration provided in SAP Help Portal documentation. If left unchanged, an unauthenticated attacker could use these well-known credentials to obtain a valid access token and invoke certain APIs to read and modify data."
        attribution: "ENISA EU Vulnerability Database (EUVD-2026-43591)"
        source_url: "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-43591"
      - quote: "Due to an HTTP Request Smuggling vulnerability in SAP Approuter, an unauthenticated attacker could send a specially crafted HTTP request that leads to request-response desynchronization. This could result in the exposure of user responses and cause the system to become unavailable."
        attribution: "ENISA EU Vulnerability Database (EUVD-2026-43584)"
        source_url: "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-43584"
    extended_notes: |
      No independent vendor-blog or press corroboration exists yet (checked support.sap.com's july-2026 news page — 404 not-yet-published; SecurityBridge's /advisory/2026/07 — SPA shell with no July content loaded yet; Onapsis blog category and WebSearch for both generic and CVE-specific queries — only June-2026-and-earlier results). This is being carried single-source on the ENISA EUVD carve-out (essential-tier, reliability A, sourced directly from SAP's own PSIRT CVE assignment — assigner field literally "sap") per the national-CERT/EU-authority single-source policy. Flagging for the main agent: confidence set to MEDIUM rather than HIGH specifically because of the absence of a second independent source at time of writing; a same-day or next-day Onapsis/SecurityBridge/heise write-up should be sought by the next run to upgrade this if it becomes an update-of candidate, or the item can stand as-is under the EUVD carve-out.
