- title: 'Jamf Threat Labs: CrashStealer — a notarized, native-C++ macOS infostealer impersonating Apple''s crash-reporter with anti-debug and dscl-validated credential harvesting'
  sources:
  - url: https://www.jamf.com/blog/crashstealer-macos-infostealer-analysis/
    publisher: Jamf Threat Labs
    date: '2026-07-13'
    role: primary
  - url: https://www.bleepingcomputer.com/news/security/new-crashstealer-malware-poses-as-apple-crash-reporting-tool/
    publisher: BleepingComputer
    date: '2026-07-13'
    role: corroborating
  discovery_trace: 'first seen at: WebSearch ("new malware campaign disclosed ''July 13, 2026'' OR ''July 14, 2026'' researchers") -> pivot: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/new-crashstealer-malware-poses-as-apple-crash-reporting-tool/ -> primary: Jamf Threat Labs, URL https://www.jamf.com/blog/crashstealer-macos-infostealer-analysis/'
  summary: 'Jamf Threat Labs (author Thijs Xhaflaire) documented CrashStealer, a macOS infostealer written entirely in native C++ (unlike the AppleScript/thin-Objective-C wrappers typical of commodity macOS stealers). Jamf first saw a sample on VirusTotal in early May 2026; by early July the malware had matured into active in-the-wild deployment. Delivery: a signed and Apple-notarized dropper app (Developer ID since revoked by Apple) mounts a disk image and instructs the user via social engineering to right-click-launch the bundled app, which then queries a GitHub-hosted repository for a Base64-encoded shell script that in turn downloads the payload disk image and copies the app bundle into a hidden cache directory — a legitimately-signed-dropper pattern that clears Gatekeeper on first launch (T1553.001) before staging an ad-hoc-signed payload. Persistence is a LaunchAgent (T1543.001) registered as a fake Apple-named service with RunAtLoad plus a KeepAlive/SuccessfulExit:false combination that forces relaunch on exit. The credential-theft mechanic is notable: the malware pops a spoofed macOS authorization prompt and validates the entered password locally via dscl -authonly before accepting it, re-prompting on failure — meaning the operator only ever receives passwords that actually authenticate (T1555.001 Keychain access via the validated credential). Anti-analysis layering includes dual-stage anti-debugging via sysctl/KERN_PROC/P_TRACED checks at two separate points in initialization (T1622) plus control-flow flattening and encrypted/runtime-decoded strings for the C2 address and collection targets (T1027). Target scope: Chromium-family browser profiles (T1555.003), ~80 cryptocurrency-wallet browser extensions across Solana/Cosmos/TON/Sui/Aptos/NEO ecosystems, 14 password managers, and the unlocked system Keychain. Collected data is written to hidden dot-prefixed staging files (T1564.001), AES-256-GCM encrypted via CommonCrypto (PBKDF2-HMAC-SHA256 key derivation), then zip-archived (T1560.001) before upload via libcurl multipart POST to a hardcoded C2 endpoint permitted to use cleartext HTTP/TLS 1.0 via an ATS exception in Info.plist (T1041).'
  region_nexus: global; any Mac fleet in EU/CH public-sector or enterprise environments is exposed — CrashStealer targets consumer/enterprise crypto-wallet and password-manager extensions regardless of region
