  - title: "D1R extortion gang claims a Synopsys client-registration logic flaw exposed 40,000 corporate accounts, then leverages that data to threaten Bosch and ARM — unconfirmed by any named vendor"
    sources:
      - { url: "https://cybernews.com/security/bosch-synopsys-data-breach-claim/", publisher: "Cybernews", date: "2026-07-13", role: "primary" }
      - { url: "https://api.ransomware.live/v2/recentvictims", publisher: "ransomware.live (leak-site aggregator)", date: "2026-07-13", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"D1R\" ransomware Bosch claim July 2026) → pivot: ransomware.live leak-site listing API, URL https://api.ransomware.live/v2/recentvictims → primary: Cybernews investigative write-up, URL https://cybernews.com/security/bosch-synopsys-data-breach-claim/ → corroboration attempt: WebSearch (\"Synopsys D1R ransomware breach statement response\") surfaced only further aggregator restatements of the same unverified claim (SOCRadar, CTIWatch, hendryadrian.com, darkwebinformer) — no independent verification or vendor statement found from Synopsys, Bosch or ARM."
    summary: |
      A previously little-known extortion gang calling itself D1R listed Synopsys, Bosch and ARM on its dark-web leak site on 2026-07-13, giving Bosch an 11-day countdown to negotiate. D1R claims it obtained Bosch engineering data (including a screenshot of a CAN — Controller Area Network — user-manual page, plus a directory listing containing .vhd/VHDL hardware-design project files) not via direct intrusion into Bosch, but through an alleged prior breach of Synopsys, the US semiconductor/electronic-design-automation (EDA) software vendor whose tools are used across the chip-design and embedded-systems supply chain. D1R's own claimed mechanism for the Synopsys compromise: "a flawed logic in their registration form" that let them "pull an entire 40,000 corporate client database without internal access" (i.e., an unauthenticated/under-authorized business-logic flaw in a public-facing customer-registration workflow enabling bulk enumeration of a client database — an IDOR/BOLA-class weakness rather than a credential- or malware-based intrusion). D1R separately claims to have used the leaked Synopsys client data to pivot into ARM, stating "one of the leaked companies gave our team access to ARM cen[tral]." Neither Synopsys, Bosch, nor ARM has confirmed or denied any of this as of publication; D1R is a new, largely untracked name with only three listed victims. A separate, similarly-worded "Arkana" claim against Synopsys (~41,000 corporate clients, surfaced mid-2026) raises the possibility that D1R is recycling or rebranding data from an earlier, also-unconfirmed extortion claim rather than reporting a fresh compromise — treat this entire chain as an unverified claim, not a confirmed breach.
    region_nexus: "global supply-chain exposure — Synopsys EDA tooling underpins semiconductor and embedded-systems design used by automotive, industrial and CI-component manufacturers including Bosch (Germany) and ARM (UK)"
    primary_sector_nexus: "indirect — energy, transport and industrial-automation supply chains depend on Synopsys-designed silicon and embedded components"
    sector: "technology / semiconductor EDA; automotive and industrial-electronics manufacturing"
    cves: []
    techniques: [T1190, T1199]
    affected_products: []
    entity_keys: []
    new_entities:
      - { key: "actor:d1r", type: actor, name: "D1R", aliases: [], summary: "Newly-surfaced data-extortion gang (three listed victims as of 2026-07-13) claiming a business-logic flaw in Synopsys's client-registration form allowed bulk exfiltration of a 40,000-corporate-client database, then using that data to threaten downstream Synopsys customers Bosch and ARM; unconfirmed by any named vendor (Cybernews, 2026-07-13)." }
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: LOW
    novelty: new
    evidence:
      - quote: "A flawed logic in their registration form has allowed our team to pull an entire 40,000 corporate client database without internal access"
        attribution: "D1R extortion gang (relayed by Cybernews)"
        source_url: "https://cybernews.com/security/bosch-synopsys-data-breach-claim/"
      - quote: "Rather than claiming a direct intrusion into Bosch's systems, D1R says the data was obtained through an alleged breach of Synopsys"
        attribution: "Cybernews"
        source_url: "https://cybernews.com/security/bosch-synopsys-data-breach-claim/"
      - quote: "D1R is a new name in ransomware field, with not much known about these attackers. So far, the gang has only three victims listed on their leak site."
        attribution: "Cybernews"
        source_url: "https://cybernews.com/security/bosch-synopsys-data-breach-claim/"
    extended_notes: |
      Flagging explicitly for the composer: this is an unconfirmed extortion-gang claim, not a verified breach. No vendor (Synopsys, Bosch, ARM) has confirmed. Include only with clear "claim, unconfirmed" framing per the pipeline's fake-news guard, similar to the precedent set by the 2026-07-02 MedusaLocker/Zürich-Baudirektion entry. The technical mechanism described (public-facing registration-form business-logic flaw enabling bulk client-database enumeration) is the one concrete, transferable, actionable detail regardless of whether the specific Synopsys/Bosch/ARM claims hold up — it is a live IDOR/BOLA-class risk pattern in any B2B self-service registration/onboarding flow.
    borderline: true
    borderline_reason: "Single-source, vendor-unconfirmed leak-site extortion claim; included for the transferable business-logic-flaw TTP and the scale of the potential EDA supply-chain exposure, not as a confirmed breach."

