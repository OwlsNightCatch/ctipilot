  - title: "Compass Security publishes a practical Cyber Resilience Act compliance-assessment walkthrough — IP-camera hardware/firmware testing against IEC 62443-4-2"
    sources:
      - { url: "https://blog.compass-security.com/2026/07/cyber-resilience-act-part-ii/", publisher: "Compass Security (Switzerland)", date: "2026-07-14", role: "primary" }
      - { url: "https://blog.compass-security.com/2026/06/cyber-resilience-act-part-i/", publisher: "Compass Security (Switzerland)", date: "2026-06", role: "corroborating (Part I — legal/CRA landscape background)" }
    discovery_trace: "first seen at: compass-security, URL https://blog.compass-security.com/ (blog listing) → primary: https://blog.compass-security.com/2026/07/cyber-resilience-act-part-ii/ (published 2026-07-14, within window)"
    summary: |
      Swiss penetration-testing firm Compass Security published Part II of its Cyber Resilience
      Act (CRA) series, walking through a full practical compliance assessment on a low-cost
      consumer IP camera to illustrate the methodology manufacturers/importers now need for EU
      market access. The workflow: STRIDE threat modelling to scope the device/network/cloud
      attack surface; classification under CRA Annex III (this camera lands as "Important Class I");
      mapping the resulting obligations to IEC 62443-4-2 technical requirements at a target Security
      Level 2 (defense-in-depth against intentional, non-targeted attacks and commonly available
      exploitation techniques); then hands-on validation combining non-invasive network-traffic
      analysis with hardware-level teardown (flash-memory dumping, debug-pin signal capture,
      UART/serial boot-sequence observation for low-level system access). The tested device failed
      to satisfy any recognized IEC 62443-4-2 security level: it missed all 7 mandatory Security
      Level 1 test cases and an additional 5 required for Security Level 2, with concrete findings
      including device-enumeration weaknesses, unauthenticated access to the video stream over the
      local network, unauthenticated UART-based shell access via a physical debug interface, and
      absent firmware-integrity protection — the only fully-passing control category was Data
      Confidentiality (FR 4). Compass Security published a full sample assessment report alongside
      the post. Defender relevance: this is a concrete, reusable technical template for CRA-driven
      hardware/firmware security assessment of IoT and OT-adjacent devices — directly applicable to
      public-sector and critical-infrastructure procurement teams (energy, water, healthcare) that
      will increasingly need to demand or perform this class of assessment on connected devices
      entering EU-regulated environments.
    region_nexus: "europe (EU Cyber Resilience Act); publisher is Swiss (Compass Security)"
