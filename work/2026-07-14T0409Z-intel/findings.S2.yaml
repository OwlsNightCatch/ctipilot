  - title: "US Treasury and UK sanction the ransomware-enabling VPN service First VPN Service (1VPNS) and a cryptor seller; May-2026 takedown had Swiss law-enforcement support"
    sources:
      - { url: "https://ofac.treasury.gov/recent-actions/20260713", publisher: "US Treasury OFAC", date: "2026-07-13", role: "primary" }
      - { url: "https://home.treasury.gov/news/press-releases/sb0559", publisher: "US Department of the Treasury", date: "2026-07-13", role: "primary" }
      - { url: "https://www.ic3.gov/CSA/2026/260521.pdf", publisher: "FBI (IC3 FLASH-20260521-001)", date: "2026-05-21", role: "corroborating (TTP detail + confirms Swiss law-enforcement participation in the May 2026 takedown)" }
    discovery_trace: "first seen at: us-treasury-ofac, URL https://ofac.treasury.gov/recent-actions (listing) → drill: https://ofac.treasury.gov/recent-actions/20260713 → primary: Treasury press release, URL https://home.treasury.gov/news/press-releases/sb0559 → corroboration: FBI FLASH advisory, URL https://www.ic3.gov/CSA/2026/260521.pdf"
    summary: |
      On 2026-07-13, US Treasury OFAC designated First VPN Service (1VPNS) and its administrator
      Dmytro Rashevskyi (aliases "Maksim Sorin", "Roman Chabanenko", "Johny Walker"), plus Belarusian
      national Yevgeniy Vladimirovich Silayev, a seller of "cryptors" (malware-obfuscation/packing
      tools that disguise ransomware payloads to defeat security-product detection). The action was
      coordinated with the UK's Foreign, Commonwealth & Development Office. 1VPNS has operated since
      approximately 2014, advertising almost exclusively on the Russian-language cybercrime forums
      Exploit[.]in and XSS[.]is; per the FBI's FLASH-20260521-001, at least 25 ransomware groups
      (including Avaddon) used its ~32 exit nodes across 27 countries for reconnaissance, C2
      anonymization and exfiltrated-data hosting, offering VLESS/Reality-protocol traffic disguised
      as HTTPS specifically to frustrate network-level VPN detection, alongside OpenVPN, WireGuard,
      Outline, L2TP/IPSec and PPTP options. 1VPNS's infrastructure was already taken down in May 2026
      by France's BL2C and the Dutch NHTCU, with support from Ukraine, the UK, Luxembourg — and
      Switzerland. Today's sanctions freeze designated persons' US-reachable assets and criminalize
      US-person transactions with them; OFAC's designation basis is E.O. 13694 as amended (malicious
      cyber-enabled activity), issued in furtherance of E.O. 14390 on combatting cybercrime against
      Americans. Defender relevance: this is a named, forum-advertised commercial VPN/cryptor
      service model that several ransomware affiliates rely on for both traffic anonymization and
      payload obfuscation — organizations hunting ransomware precursor activity should treat
      VLESS/Reality-style HTTPS-masquerading VPN egress and known cryptor-packed-executable
      behavior classes as correlated risk signals, and the Swiss law-enforcement role in the
      underlying takedown is a direct home-region operational nexus.
    region_nexus: "global cybercrime infrastructure; May-2026 takedown operation explicitly included Switzerland among the supporting law-enforcement partners (with France, Netherlands, Ukraine, UK, Luxembourg)"
