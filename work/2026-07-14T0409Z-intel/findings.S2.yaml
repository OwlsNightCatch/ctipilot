    discovery_trace: "first seen at: inside-it-ch, URL https://www.inside-it.ch/rss.xml (RSS feed item dated 2026-07-13; direct article fetch 403'd on both WebFetch and jina reader, title+summary retrieved via feed) → pivot: Netzwoche, URL https://www.netzwoche.ch/news/2026-07-13/kommando-cyber-steigt-aus-microsoft-office-aus (independent in-window write-up, same day) → primary: Republik investigative report, URL https://www.republik.ch/2026/07/09/die-cyber-spezialisten-des-bundes-kehren-microsoft-den-ruecken (originating disclosure, named officials quoted) → corroboration: Swiss Federal Chancellery official project page, URL https://www.bk.admin.ch/de/machbarkeitsstudie-poc-boss (first-party confirmation of the parallel federal-administration-wide PoC BOSS exit-strategy project) → English corroboration: heise online, URL https://www.heise.de/en/news/Swiss-Army-breaks-with-Microsoft-Cyber-Command-relies-on-Open-Source-11361516.html"
    summary: |
      Switzerland's military Cyber Command (Kommando Cyber) and its Cyber and Electromagnetic
      Actions service (CEA) will have equipped all employee workstations with OpenDesk — the
      German Centre for Digital Sovereignty (ZenDiS)'s open-source Microsoft 365 alternative
      (Collabora Online, Open-Xchange mail/calendar, Nextcloud, OpenProject, XWiki, Jitsi/Nordesk,
      Element chat, Univention IAM) — by October 2026. Kommando Cyber commander Simon Müller
      stated the rationale explicitly: "Solange Unternehmen Gesetzen wie dem US-Cloud-Act
      unterliegen, sind sie für gewisse militärische Kontexte nicht mehr nutzbar" (as long as
      companies are subject to laws like the US Cloud Act, they are no longer usable for certain
      military contexts) — the concern being covert "call-home" data flows to US authorities under
      the CLOUD Act regardless of EU/CH data-residency claims. In parallel, the Swiss Federal
      Chancellery confirmed via its own official project page that it is running "PoC BOSS"
      (Büroautomation mit Open-Source-Software), a proof-of-concept evaluating the same OpenDesk
      stack as a feasibility study for a federal-administration-wide Microsoft 365 exit strategy,
      with representatives from every federal department participating as requirements-gatherers
      and test users; the current status snapshot is dated April 2026 and a follow-on implementation
      project depends on the PoC's conclusions and funding. Kommando Cyber additionally develops and
      open-sources its own tooling (the "Loom" search/analysis engine) on GitLab, framing the
      migration as contributing back to the digital-sovereignty commons rather than pure consumption.
      Direct relevance for the Swiss federal SOC constituency: this is the constituency's own core
      (Armee/VBS and Bundeskanzlei) actively re-architecting its office-productivity supply chain
      away from a hyperscaler dependency on data-sovereignty grounds — a decision other Swiss
      cantonal/communal administrations and EU public-sector bodies (Austria's Bundesheer already
      moved to LibreOffice; the German Bundeswehr has a framework contract for OpenDesk) are
      independently converging on.
    region_nexus: "switzerland (home-region core: federal military Cyber Command + Federal Chancellery); comparable moves cited in Austria (Bundesheer/LibreOffice) and Germany (Bundeswehr/OpenDesk)"
