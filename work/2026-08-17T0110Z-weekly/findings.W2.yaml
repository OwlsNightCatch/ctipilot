    summary: |
      Two laws implementing EU directives — the Cyberbeveiligingswet (Cbw, transposing NIS2, replacing the Wet beveiliging netwerk- en informatiesystemen) and the Wet weerbaarheid kritieke entiteiten (Wwke, transposing the CER Directive) — entered into force in the Netherlands on 15 August 2026, per same-day confirmation from both NCTV and NCSC-NL. The Cbw covers essential and important entities across 18 sectors and applies immediately (no transition period) to three core duties: a registration duty in the national entity register that NCSC-NL manages via the mijn.ncsc.nl portal; a duty of care (zorgplicht) to take appropriate risk-management measures for network and information systems; and an incident-notification duty (meldplicht) requiring significant incidents to be reported to the sector CSIRT/NCSC within statutory deadlines (24 hours for an initial notification per NCTV's own wording). Company directors additionally carry a personal duty to hold sufficient knowledge to assess cyber risk and security measures, backed by a training obligation. RDI (Rijksinspectie Digitale Infrastructuur) is the designated supervisor for nine of the Cbw's sectors — energy, digital infrastructure, ICT-service management, government (excluding water boards), aerospace, postal/courier services, non-medical manufacturing, digital providers, and Ministry-of-EZK-affiliated research organisations — covering, in RDI's own words, "duizenden organisaties" (thousands of organisations); other sectors have their own designated supervisory authorities. Maximum administrative fines are differentiated by entity class: up to EUR 10,000,000 or 2% of global annual turnover (whichever is higher) for essential entities, and up to EUR 7,000,000 or 1.4% for important entities, with orders subject to a penalty payment (last onder dwangsom) available against individual board members. The companion Wwke applies in parallel to roughly 500 government-designated critical entities in energy, digital infrastructure and aerospace, imposing risk assessments, physical- and cyber-resilience measures, and a 24-hour incident-notification duty, under the same supervisory and enforcement architecture. Germany's parallel NIS2 track shows no material in-window development: BSI's own NIS-2-regulated-companies page, re-checked this run, still states only that "die gesetzliche Registrierungsfrist ist bereits abgelaufen" (the statutory registration deadline has already expired) and directs unregistered entities to the BSI-Portal immediately — the same status this pipeline reported for BSI last week (2026-08-09), with no dated BSI press release inside this window surfacing sector-audit or fine-proceeding specifics.
