  - title: "Research synthesis: defenders' and administrators' own tooling is this week's recurring intrusion and anti-forensics surface — five independent labs, one ISO week"
    sources:
      - { url: "https://www.sophos.com/en-us/blog/2608-volatility-interlock/", publisher: "Sophos X-Ops", date: "2026-08-10", role: "primary" }
      - { url: "https://www.crowdstrike.com/en-us/blog/crowdstrike-hunts-for-shell-command-obfuscation-vmware-esx/", publisher: "CrowdStrike", date: "2026-08-07", role: "primary" }
      - { url: "https://www.group-ib.com/blog/xmrig-covert-linux-pam-abuse/", publisher: "Group-IB", date: "2026-07-30", role: "primary" }
      - { url: "https://securelist.com/honeymyte-coolclient-driver-rootkit/121028/", publisher: "Kaspersky Securelist (GReAT)", date: "2026-08-14", role: "primary" }
      - { url: "https://socradar.io/blog/litellm-supply-chain-attack/", publisher: "SOCRadar", date: "2026-08-13", role: "primary" }
    discovery_trace: "first seen at: this pipeline's own operational entries for 2026-08-10/interlock-volatility3-winpmem-credential-theft, 2026-08-10/esxi-busybox-ash-command-obfuscation-21-techniques, 2026-08-10/pam-rootok-identity-shuffle-as-anti-forensics-xmrig, 2026-08-15/mustang-panda-coolclient-signed-kernel-driver-rootkit and 2026-08-15/trivy-not-litellm-behind-2500-org-credential-collection → this run re-fetched each underlying primary directly to source the cross-entry synthesis: Sophos URL https://www.sophos.com/en-us/blog/2608-volatility-interlock/ ; CrowdStrike URL https://www.crowdstrike.com/en-us/blog/crowdstrike-hunts-for-shell-command-obfuscation-vmware-esx/ ; Group-IB URL https://www.group-ib.com/blog/xmrig-covert-linux-pam-abuse/ ; Kaspersky URL https://securelist.com/honeymyte-coolclient-driver-rootkit/121028/ ; SOCRadar URL https://socradar.io/blog/litellm-supply-chain-attack/"
    summary: |
      This directly answers draft research theme (a): the week's own evidence supports it strongly. Five independent labs published, inside or immediately adjacent to ISO week 2026-W33, disclosures that converge on the same pattern — an intruder's or forensic smokescreen's raw material is the defender's or administrator's own legitimate tooling, not bespoke malware. Sophos documents Interlock (GOLD EMBRACE) capturing a full physical-memory image with WinPmem and then running Volatility3's hashdump/cachedump plugins offline against it in place of a commodity credential dumper — chain: ClickFix paste-and-run lure to domain-controller compromise in roughly 26 hours; Sophos's own discriminator from a real DFIR engagement was customer knowledge of no legitimate use, nothing in the artefact itself. CrowdStrike catalogued 21 working command-obfuscation techniques inside ESXi's minimal BusyBox ash shell across six classes (escape-sequence encoding, character generation, invisible-Unicode injection, cryptographic encoding, infrastructure-keyed obfuscation, Morse/binary/scientific-notation encoding), built almost entirely from awk rather than the shell itself, and shows ESXi shell logs capture commands during the parsing stage before expansion — so literal-string detections such as "esxcli" miss an obfuscated invocation outright; CrowdStrike names Akira and SCATTERED SPIDER-lineage actors (BlackBasta, Royal/BlackSuit, shinysp1d3r, CARBON/SPRITE/ALPHA SPIDER) among those it hunts this against. Group-IB documents an intruder abusing the pam_rootok PAM policy to move between low-privileged Linux identities as a deliberate anti-forensics act after already holding root — inverting the normal inference that root-level activity is what to watch for — while stopping logging services and tampering with authentication logs, deployed alongside a self-unlinking, memory-resident XMRig 6.25.0 miner. Kaspersky's newest Mustang Panda (HoneyMyte) CoolClient variant adds a kernel-mode driver, signed with a certificate issued to a Nanjing company, that hooks the Nsiproxy driver Windows itself uses to report network-connection state to user-mode tools — stripping the implant's own C2 addresses from what any monitoring tool sees, deployed only once the implant already holds Service Control Manager access and SeTcbPrivilege. And SOCRadar's row-level re-analysis of the widely reported "2,500-organisation LiteLLM breach" found 95% of victims' credential collection had already concluded via the compromised Trivy security scanner before the poisoned LiteLLM PyPI releases (1.82.7/1.82.8) ever existed — the estate that only checked its LiteLLM version audited the wrong artefact; TeamPCP's compromised trivy-action GitHub repository is the actual entry point, propagated by tag mutability rather than a pinned SHA. None of the five reports found in-window contradicts theme (a); if anything the range of tooling classes involved (memory-forensics framework, hypervisor administrative shell, PAM authentication policy, CI security scanner, OS network-state reporting API) in a single week argues this is a genuine convergent pattern rather than isolated incidents.
    region_nexus: "global — the underlying technique classes (offline memory-forensics credential extraction, hypervisor shell obfuscation, PAM abuse, CI/CD supply-chain trust, kernel-driver network-state hooking) are directly relevant to any Windows/Linux/ESXi/CI estate, including Swiss and EU public-sector and critical-infrastructure environments running the same administrative and DFIR tooling"
    primary_sector_nexus: "indirect"
    sector: "cross-sector"
    cves: []
