    discovery_trace: "first seen at: WebSearch (\"annual threat report published August 2026 quarterly\") → Bitdefender Threat Debrief August 2026, URL https://www.bitdefender.com/en-us/blog/businessinsights/bitdefender-threat-debrief-august-2026 → corroboration: Aryaka Threat Research Lab, URL https://www.aryaka.com/reports-and-guides/crpx0-ransomware-operations-report/"
    summary: |
      Answers the mission's periodic/annual-report gap-check: no annual or quarterly threat report was found published inside ISO week 2026-W33 (checked Sophos Active Adversary Report — published February 2026; Darktrace Annual Threat Report 2026 and Recorded Future/Insikt "State of Security" — no in-window publication date found; Gen H1 2026 Threat Report — published 2026-07-15, out of window; Huntress 2026 Cyber Threat Report — published 2026-02-17). The closest qualifying periodic item is Bitdefender's own monthly Threat Debrief, published 2026-08-12, analysing July 2026 ransomware activity (873 claimed victims store-wide) and profiling CRPx0 as its featured emerging group. First seen June 2026 with fewer than 10 victims, CRPx0 claimed 46 victims in July — a sudden jump Bitdefender explicitly flags as possibly inorganic: "a surge of victims within a couple of weeks with near synchronous ransom countdowns may be attributed to scam behavior." Distinctively, CRPx0 combines a conventional RaaS encryption/double-extortion offering with a hacking-as-a-service arm (letting a buyer run campaigns under their own name on a 100%-profit-share model) and a cryptocurrency-theft capability (clipboard-hijacking and wallet-seed-phrase harvesting) layered onto the same intrusion — Bitdefender frames the crypto-theft option as a hedge against the common ransomware-operator problem of delayed or unmet ransom payment. Aryaka's separate operations report corroborates the dual monetisation (encryption plus clipboard/wallet-seed theft) and cross-platform (Windows/macOS) targeting via a Python-based framework, without independently addressing the scam-recruitment question. Not yet in the entity registry.
