    entity_keys: ["actor:interlock", "malware:nodesnake", "actor:akira", "actor:scattered-spider", "campaign:groupib-xmrig-pam-forensic-smokescreen", "actor:teampcp", "actor:mustang-panda", "malware:coolclient", "malware:plugx"]
    new_entities:
      - { key: "trend:admin-forensic-tooling-as-intrusion-toolkit-2026-08", type: trend, name: "Administrator/forensic tooling as the intrusion and anti-forensics toolkit (2026-08)", aliases: [],
          summary: "Analytical cluster surfaced by this pipeline (not an attribution claim by any cited source) spanning five independent disclosures inside or immediately adjacent to ISO week 2026-W33: Sophos on Interlock's offline Volatility3/WinPmem credential extraction, CrowdStrike on ESXi BusyBox ash command obfuscation and its pre-expansion logging blind spot, Group-IB on pam_rootok abuse as a deliberate anti-forensics smokescreen, Kaspersky on Mustang Panda's CoolClient kernel driver hooking the Windows network-state-reporting API, and SOCRadar's re-analysis of the Trivy/LiteLLM supply-chain incident. All five converge on defenders' or administrators' own legitimate tooling (memory-forensics frameworks, hypervisor shells, PAM policy, CI security scanners, OS network APIs) as the exploitation or concealment surface rather than bespoke attacker malware." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "In a legitimate use scenario, use of this command could be expected as part of a DFIR investigation, a security assessment, or malware analysis. However, adversarial use of Volatility3 would leave similar traces."
        attribution: "Sophos X-Ops"
        source_url: "https://www.sophos.com/en-us/blog/2608-volatility-interlock/"
      - quote: "ESX shell logs capture commands during the parsing stage, before expansions occur."
        attribution: "CrowdStrike"
        source_url: "https://www.crowdstrike.com/en-us/blog/crowdstrike-hunts-for-shell-command-obfuscation-vmware-esx/"
      - quote: "By abusing the pam_rootok policy, the attacker utilized the su command to seamlessly assume the identities of multiple low-privileged users across the system without requiring their passwords."
        attribution: "Group-IB"
        source_url: "https://www.group-ib.com/blog/xmrig-covert-linux-pam-abuse/"
      - quote: "The driver also hooks the Nsiproxy driver to filter network-related data returned to user mode ... Matching IP addresses are removed before the data is returned to user mode, preventing applications that rely on Nsiproxy-provided network information from seeing the malware's C2 addresses."
        attribution: "Kaspersky Securelist (GReAT)"
        source_url: "https://securelist.com/honeymyte-coolclient-driver-rootkit/121028/"
      - quote: "95% of affected organizations were already exposed before March 24, when the packages went live. The 40 minutes on PyPI closed a collection run that had already been going for five days."
        attribution: "SOCRadar"
        source_url: "https://socradar.io/blog/litellm-supply-chain-attack/"
    extended_notes: |
      Background note for the composer, not an in-window claim: the actor:teampcp Trivy compromise this SOCRadar reanalysis concerns is the same supply-chain incident that breached the European Commission's own AWS-hosted europa.eu platform in March 2026 (CERT-EU blog, published 2026-04-02, https://cert.europa.eu/blog/european-commission-cloud-breach-trivy-supply-chain — fetched this run for context only, well outside this week's window, NOT cited as an in-window source): ~91.7 GB compressed exfiltrated across 71 EU-institution clients, later dumped by ShinyHunters. That gives the actor:teampcp entity direct, already-historical relevance to this organisation's EU-government mission, strengthening why SOCRadar's in-window scope-correction on the same actor's later LiteLLM/Trivy fallout matters here.
