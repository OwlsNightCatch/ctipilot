  - title: "Research synthesis: trust bridges between a browser/OS surface and a privileged local component keep failing on the same missing check — origin, caller identity, or write-scope"
    sources:
      - { url: "https://amibeingpwned.com/blog/8-in-10-banks-in-belgium", publisher: "Bay Area Labs", date: "2026-08-07", role: "primary" }
      - { url: "https://www.security.com/threat-intelligence/jewelbug-crypto-fraud-espionage", publisher: "Symantec Threat Hunter Team (Broadcom)", date: "2026-08-13", role: "primary" }
      - { url: "https://novee.security/blog/critical-flaws-in-anthropic-google-and-openais-coding-agents/", publisher: "Novee Security", date: "2026-08-06", role: "primary" }
    discovery_trace: "first seen at: this pipeline's own operational entries for 2026-08-11/belgian-eid-connective-extension-pin-recovery-driveby-rce, 2026-08-16/jewelbug-pdf-viewer-extension-native-messaging-webmail-hole and 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout → this run re-fetched each underlying primary directly: Bay Area Labs URL https://amibeingpwned.com/blog/8-in-10-banks-in-belgium ; Symantec URL https://www.security.com/threat-intelligence/jewelbug-crypto-fraud-espionage ; Novee Security URL https://novee.security/blog/critical-flaws-in-anthropic-google-and-openais-coding-agents/"
    summary: |
      This directly answers draft research theme (b), with a moderate-strength result: the pattern holds, but the three disclosures found in-window support it as a shared FAILURE CLASS rather than one identical mechanism, and the evidentiary base is thinner (3 items vs. theme (a)'s 5). In each case a semi-trusted intermediary component that bridges a lower-privilege caller to a higher-privilege local action skips the one check that would have enforced the trust boundary. Bay Area Labs' disclosure on Belgium's Connective signing extension (used by 8 of the country's 10 largest banks and 60+ government agencies, 2M+ install base, an eIDAS Qualified Trust Service Provider's own browser bridge) found the native host never validated which page was calling it, so any site or hidden iframe could replay a signed activation token to drive the eID/Maestro card; separately, the PIN token handed back to the page carried both its own ciphertext and the AES key (with a hardcoded IV) needed to decrypt it, and a reader-enumeration command accepted an attacker-supplied relative library path, turning a single page visit into arbitrary DLL execution — full remediation took the vendor 146 days from first report. Symantec's Jewelbug (aka Earth Alux / REF7707 / CL-STA-0049) profile documents a malicious "PDF Viewer" Chrome/Firefox extension that escapes the browser sandbox through a native-messaging host deliberately registered under the name com.microsoft.runedge — masquerading as a Microsoft Edge component so the bridge itself hides in plain sight — which runs operator commands through the Windows command interpreter and returns output to the group's XG-Web panel; Jewelbug reached this stage on 15+ government webmail tenants at once by planting one script tag in a shared hosting platform's common template rather than compromising each ministry individually. Novee Security's Black Hat write-up on AI coding-agent CI harnesses found OpenAI Codex workflows in which two agent passes shared one checkout, so the first pass could rewrite the AGENTS.md instruction file the second pass treats as authoritative configuration — the persistence "went through the filesystem, underneath" the data-validation path the harness actually checked; this specific finding, unlike the CVE-2026-54316-carrying Claude Code Action flaw already covered operationally, ships no CVE and was fixed only in the vendor's own repository. The common thread across all three: a bridge component (browser-extension native host, browser extension itself, or CI checkout) that mediates between two trust levels does not re-verify the caller's origin, identity or write-scope at the point where privilege actually changes hands.
    region_nexus: "Switzerland/EU nexus is direct for the Belgian eID case (eIDAS Qualified Trust Service Provider, national government and 8/10 largest banks) and for Jewelbug's demonstrated capability against shared government webmail hosting platforms, which is directly transferable to Swiss/EU e-government portal architectures; the CI-harness finding is cross-sector wherever AI coding agents run in a shared CI/CD checkout"
    primary_sector_nexus: "direct"
    sector: "public-sector, finance"
    cves: ["CVE-2026-54316", "CVE-2026-12537"]
    techniques: [T1189, T1176, T1059.003]
    affected_products: ["Connective Signing Extension", "Claude Code Action", "Gemini CLI", "OpenAI Codex"]
    entity_keys: ["actor:jewelbug", "trend:coding-agent-ci-harness-trust-boundary-2026-08"]
    new_entities:
      - { key: "trend:browser-os-trust-bridge-failures-2026-08", type: trend, name: "Browser/OS trust-bridge failures (2026-08)", aliases: [],
          summary: "Analytical cluster surfaced by this pipeline (not an attribution claim by any cited source) spanning three independent disclosures inside ISO week 2026-W33: Bay Area Labs on the Belgian Connective eID browser extension's missing origin check, Symantec on Jewelbug's native-messaging host deliberately named after a Microsoft Edge component, and Novee Security's Black Hat research on AI coding-agent CI harnesses sharing one checkout across trust levels. All three fail on the same class of check — a bridge component mediating between a lower-privilege caller and a higher-privilege local surface does not re-verify the caller's origin, identity or write-scope at the point privilege actually changes hands." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "any site or iframe could read the user's eID and Maestro card data, and recover their eID PIN, which the binary handed back to the page inside a token that carried both the ciphertext and the key to decrypt it"
        attribution: "Bay Area Labs"
        source_url: "https://amibeingpwned.com/blog/8-in-10-banks-in-belgium"
      - quote: "The extension talked to a Windows helper registered as a native-messaging host under the misleading name com.microsoft.runedge, which ran operator commands through the Windows command interpreter and returned the output to the panel."
        attribution: "Symantec Threat Hunter Team"
        source_url: "https://www.security.com/threat-intelligence/jewelbug-crypto-fraud-espionage"
      - quote: "The workflow validated the output. The attacker wrote the instructions. The persistence never travelled through the data path at all; it went through the filesystem, underneath it."
        attribution: "Novee Security"
        source_url: "https://novee.security/blog/critical-flaws-in-anthropic-google-and-openais-coding-agents/"
    extended_notes: |
      Weaker cluster than theme (a): three items rather than five, and the "trust bridge" framing spans genuinely different component types (a signed browser extension's native-messaging bridge, a malicious extension's own native-messaging escape, and a CI/CD shared-checkout file) rather than one repeated mechanism. Composer should present this as a named failure class, not a single technique.
    borderline: false

  - title: "CRPx0 pairs ransomware-as-a-service with hacking-as-a-service and cryptocurrency-theft capability — Bitdefender's August debrief flags apparent victim-count inflation consistent with an affiliate-recruitment scam"
    sources:
