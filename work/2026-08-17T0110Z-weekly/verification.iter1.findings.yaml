- code: F3
  category: claim-not-supported
  section: verification-notes / "Why the stand-down came late"
  item: "run record — root-cause diagnosis and operator recommendation"
  url_or_quote: "The remaining exposure is the propagation interval between a primary completing and its record appearing on `main`, which no guard positioned before the work can close."
  summary: >
    The artefacts support a different cause. Propagation was about two minutes (commit 01:46:29 ->
    caught by the pre-verifier guard before main.ended_at 01:53:38). The interval this run actually ran
    inside was the primary's execution interval: the primary's `completed: 00:07:59Z` field precedes its
    own seven verification iterations (00:09:11-01:44:10). The related sentence "The primary's promotion
    to `main` landed during this run's research and composition phases" is also off — research ended
    01:31:15, the promotion landed 01:46:29, i.e. during composition only. As written the account
    attributes the late stand-down to a mechanism the evidence contradicts and is the load-bearing
    premise of the operator-facing scheduling recommendation; the honest framing is that the backup fired
    while the primary was still running.
