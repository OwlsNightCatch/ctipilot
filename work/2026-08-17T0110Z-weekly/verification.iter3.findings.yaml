- code: F2
  category: quantifier-without-source
  section: verification-notes-body
  item: "Diagnosis paragraph — W33 primary's verification loop generalised onto the W32 primary"
  url_or_quote: "\"...never revised after the verification loop, which for these fires ran a further seven iterations.\" and \"Firing the backup at 01:10 puts it in the middle of the primary's verification loop every time.\""
  summary: >
    Both clauses describe the W33 primary only. origin/main:runs/2026-08-09/2026-08-09T2315Z-weekly.md records
    verification_iterations: 2, with iteration 1 at 00:12:13-00:46:40Z and iteration 2 at 00:54:33-01:05:25Z — so
    the W32 primary ran two iterations, not seven, and its loop had ended about five minutes BEFORE the W32 backup
    started at 01:10:28Z (the remaining 41 minutes to its first commit 1e04b24 at 01:46:56Z were remediation, gate
    and publishing). The record's central thesis is unaffected — both primaries were still working at 01:10 — but
    the two quantifiers are false. Fix: attribute the seven iterations to the W33 primary, note W32's two plus its
    post-loop remediation and publishing chain, and replace "in the middle of the primary's verification loop every
    time" with the claim the artefacts support (inside the primary's real runtime every time).
- code: F3
  category: claim-not-supported
  section: verification-notes-body
  item: "Operator recommendation — the two levers and the rationale for the second"
  url_or_quote: "\"Two things would each independently prevent a fifth occurrence: moving the backup's schedule to clear the primary's true end, and correcting the `completed` field so that it records when the run actually finished — the second matters beyond scheduling, because every consumer of that field, including the next fire's state digest, currently reads a completion time that has not happened yet.\""
  summary: >
    Two defects in one sentence. (a) Correcting the `completed` field cannot prevent a recurrence: the duplicate-week
    guard reads origin/main and the remote claude/** branches, and at 01:10 the primary's record (with its `completed`
    value) is not visible on either surface — the field's accuracy changes the diagnosis, not the collision, so only
    the schedule move is preventive. (b) "reads a completion time that has not happened yet" is the inverted framing
    iteration 2 already flagged: both primaries' fields UNDERSHOOT (W33 00:07:59Z vs first commit 01:46:29Z; W32
    00:06:31Z vs 01:46:56Z), which the same paragraph states three sentences earlier. Fix: make the schedule move the
    single preventive lever, and restate the second as a data-integrity item whose failure mode is a completion time
    recorded ~1 h 40 min before the run's true end.
