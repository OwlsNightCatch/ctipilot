        attribution: "Konstantin von Notz, via t3n/dpa"
        source_url: "https://t3n.de/news/gruenen-politiker-kritisiert-bsi-unterstuetzung-bei-hackerangriffen-durch-grundgesetz-ausgebremst-1761258/"
    extended_notes: |
      Comparative framing for the Swiss constituency (own analysis, not stated by the sources):
      BACS/NCSC-CH's support to cantons and communes is likewise organised around voluntary
      requests for cooperation rather than a compulsory intervention mandate — Switzerland's
      federal structure creates the same category of gap Germany's BMI has just confirmed it will
      leave open. Cantonal and communal IT-security functions should treat pre-negotiated
      cooperation/escalation arrangements with BACS (equivalent to Germany's bilateral
      Amtshilfe agreements, which the German reporting states are still incomplete with several
      Länder years after they were called for) as something to have in place *before* an incident,
      not something to start negotiating during one. No source states BACS's current cooperation
      agreement coverage across all 26 cantons; that would be a useful fact for a future NCSC-CH-
      sourced item to confirm or refute.
    borderline: true
    borderline_reason: "German domestic constitutional/legislative policy, not a Swiss regulatory change; included for its direct structural-federalism parallel to the Swiss BACS-cantons relationship named in the standing policy watch, but it does not itself change any obligation on a Swiss defender."

