items:
  - title: "Germany abandons the constitutional amendment that would have let BSI act as a central cyber-defence authority over the Länder without a formal aid request first"
    sources:
      - { url: "https://www.heise.de/news/Kehrtwende-bei-Cybersicherheit-Bund-gibt-Plan-fuer-BSI-Grundgesetzaenderung-auf-11440646.html", publisher: "heise online", date: "2026-09-03", role: "primary" }
      - { url: "https://t3n.de/news/gruenen-politiker-kritisiert-bsi-unterstuetzung-bei-hackerangriffen-durch-grundgesetz-ausgebremst-1761258/", publisher: "t3n (dpa wire)", date: "2026-09-03", role: "corroborating" }
    discovery_trace: >
      first seen at: heise-sec (essential source), URL
      https://www.heise.de/security/feed.xml → drilled to
      https://www.heise.de/news/Kehrtwende-bei-Cybersicherheit-Bund-gibt-Plan-fuer-BSI-Grundgesetzaenderung-auf-11440646.html
      (primary: heise's own reporting quoting the Interior Ministry's written
      answer to a parliamentary inquiry) → corroboration via WebSearch
      ("Bundesregierung BSI Grundgesetzänderung verzichtet Zentralstelle") →
      independent second acquisition of the same BMI document via dpa wire,
      URL https://t3n.de/news/gruenen-politiker-kritisiert-bsi-unterstuetzung-bei-hackerangriffen-durch-grundgesetz-ausgebremst-1761258/
    summary: |
      Germany's federal government has told the Bundestag it will not pursue the constitutional
      amendment ("Grundgesetzänderung") that the previous coalition had agreed to build the
      Federal Office for Information Security (BSI) into a "Zentralstelle" — a central authority
      empowered to support Länder and municipalities against cyberattacks on its own initiative.
      The disclosure comes from the Interior Ministry's written answer to a parliamentary inquiry
      by Green party deputy faction leader Konstantin von Notz, obtained independently by heise
      online and (via the dpa wire) by t3n, both published 2026-09-03. Under the current
      constitutional framework, BSI may only assist a Land in defending against even severe
      cyberattacks after that Land has formally requested "Amtshilfe" (administrative assistance)
      — a bilateral-agreement-based process that, per von Notz, is not concluded with all 16
      federal states even now, and costs time exactly when rapid action matters most. The Ministry
      states it will instead "exhaust the existing constitutional framework" and points to already-
      expanded BSI powers from the NIS2 transposition law plus planned staffing and funding
      increases as sufficient. This reversal follows, without being formally tied to, the ongoing
      fallout from the Berlin Landesnetz/Rhysida compromise (disclosed 2026-08-17, extortion
      confirmed 2026-08-28) that heise's own reporting cites as the latest illustration of how
      exposed German Länder and municipal IT is against professional, often state-linked attackers.
      No new legislative timeline is given; the government treats the matter as closed for now.
    region_nexus: "Germany (EU); the specific federal/cantonal/communal authority-and-cooperation problem is structurally the same one Switzerland's BACS/NCSC-CH faces vis-à-vis cantons and communes"
