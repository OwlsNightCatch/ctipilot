  - title: "CVE-2026-85046 — Google patches a Chrome V8 type-confusion flaw under active exploitation, delivered via a crafted HTML page"
    sources:
      - { url: "https://chromereleases.googleblog.com/2026/09/stable-channel-update-for-desktop_01882797386.html", publisher: "Google Chrome Releases (vendor blog)", date: "2026-09-03", role: "primary" }
      - { url: "https://cveawg.mitre.org/api/cve/CVE-2026-85046", publisher: "MITRE CVE Program (Chrome as CNA)", date: "2026-09-03", role: "primary" }
      - { url: "https://securityonline.info/chrome-zero-day-vulnerability/", publisher: "Daily CyberSecurity (securityonline.info)", date: "2026-09-03", role: "corroborating" }
    discovery_trace: "first seen at: chrome-releases, URL https://chromereleases.googleblog.com/2026/09/ (dated archive listing, direct transport since the Atom feed returned count=0 as in prior runs) → primary: Google Chrome Releases blog, URL https://chromereleases.googleblog.com/2026/09/stable-channel-update-for-desktop_01882797386.html → corroboration: MITRE CVE record, URL https://cveawg.mitre.org/api/cve/CVE-2026-85046 → corroboration: WebSearch (\"CVE-2026-85046 Chrome V8 type confusion exploit wild\") → securityonline.info, URL https://securityonline.info/chrome-zero-day-vulnerability/. Note: a Field Effect article surfaced by the same search (fieldeffect.com/blog/vulnerability-in-chromes-v8-engine-actively-exploited) was checked and discarded — it covers a different, unrelated CVE (CVE-2025-13223, dated November 2025); flagging per the recycled-news trap discipline. Neither NCSC-NL's advisory feed nor CERT-FR's avis feed carried a dedicated bulletin for this release as of this run — the fix shipped only hours before the run window closed."
    summary: |
      Google shipped Chrome Stable 152.0.7977.82/.83 (Windows/Mac) and 152.0.7977.82 (Linux) on
      2026-09-03, fixing 12 security bugs including CVE-2026-85046 — a type-confusion flaw in V8
      (CWE-843) that lets a remote attacker execute arbitrary code inside the Chrome sandbox via a
      crafted HTML page, CVSS 3.1 8.8 (AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H — network vector, low
      complexity, no privileges, but requires the victim to open the malicious page). Google's own
      release notes state plainly: "Google is aware that an exploit for CVE-2026-85046 exists in the
      wild." The bug (Chromium issue 542403045) was reported by external researcher Salvatore Gulizia
      ("Serotav") on 2026-08-04 and earned a $1,000 bounty; Google is withholding further technical
      detail and the bug-tracker link pending majority-user patch uptake, per its standard restricted-
      disclosure practice. The same release closes 11 other flaws (mostly High-severity use-after-free /
      out-of-bounds issues in Compositing, WebGL, Skia, DevTools, CacheStorage and Network, one further
      V8 race condition CVE-2026-85045 reported by Brendan Dolan-Gavitt/XBOW), none of which Google lists
      as exploited. As with prior V8 zero-days, this is a sandbox-escape primitive rather than a
      full chain by itself — attacker code executes inside the renderer sandbox, so combined exploitation
      (a second bug to escape the sandbox, or targeting a Chromium-based app that runs with reduced
      sandboxing) would be needed for full host compromise, though no source describes such chaining for
      this specific CVE as of publication. Update applies to Chrome on Windows, Mac and Linux; other
      Chromium-based browsers (Edge, Brave, Vivaldi, etc.) typically ship their own updates on a short lag
      once the underlying Chromium patch lands — check each browser's own release notes rather than
      assuming parity with Chrome's version number.
    region_nexus: "global — Chrome is the dominant desktop/laptop browser across Swiss federal, cantonal and communal administration endpoints"
    primary_sector_nexus: "indirect"
