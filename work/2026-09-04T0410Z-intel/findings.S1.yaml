      - quote: "Type confusion in V8 in Google Chrome prior to 152.0.7977.82 allowed a remote attacker to execute arbitrary code inside the sandbox via a crafted HTML page."
        attribution: "MITRE CVE record (Chrome CNA)"
        source_url: "https://cveawg.mitre.org/api/cve/CVE-2026-85046"
    extended_notes: |
      Prioritise fleet-wide Chrome update verification over the next 24-48h — this is the highest-priority
      item in this run given confirmed in-the-wild exploitation and the browser's ubiquity on
      administrative endpoints. Detection angle: EDR/browser-crash telemetry for anomalous Chrome renderer
      process crashes or unexpected child-process spawns from a Chrome renderer shortly after visiting an
      untrusted URL is the generic V8-exploitation tell; Google withholds exploit specifics so no
      more concrete IOC-free hunt hook is available yet. Hardening: enforce Chrome auto-update policy
      (or push 152.0.7977.82+ via enterprise management) fleet-wide; extend the same check to any
      Chromium-based browser in use (Edge, Brave, Vivaldi) since they inherit the same V8 codebase and
      typically patch on a short lag.

  - title: "CVE-2026-20212 — Cisco Nexus 9000 Series switches: unauthenticated root RCE via the Silicon One hardware-abstraction layer on TCP 43210/43211"
    sources:
      - { url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-n9k-s1-rce-EH8dEtr", publisher: "Cisco PSIRT", date: "2026-09-02", role: "primary" }
      - { url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0338", publisher: "NCSC-NL", date: "2026-09-03", role: "corroborating" }
      - { url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1110/", publisher: "CERT-FR / ANSSI", date: "2026-09-03", role: "corroborating" }
      - { url: "https://cveawg.mitre.org/api/cve/CVE-2026-20212", publisher: "MITRE CVE Program", date: "2026-09-02", role: "corroborating" }
    discovery_trace: "first seen at: advisories-ncsc-nl, URL https://advisories.ncsc.nl/advisory?id=NCSC-2026-0338 (NCSC-2026-0338, published 2026-09-03T13:09Z, bundling three Cisco advisories) → pivot: NCSC-NL CSAF body via ncsc-nl csaf NCSC-2026-0338 → primary: Cisco PSIRT, URL https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-n9k-s1-rce-EH8dEtr → corroboration: CERT-FR, URL https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1110/ → corroboration: MITRE CVE record, URL https://cveawg.mitre.org/api/cve/CVE-2026-20212"
    summary: |
      Cisco published cisco-sa-n9k-s1-rce-EH8dEtr on 2026-09-02 (16:00 GMT), disclosing CVE-2026-20212
      (CVSS 3.1 9.8, CWE-1327 Binding to an Unrestricted IP Address), a flaw in the Silicon One ASIC
      integration on Cisco Nexus 9000 Series switches. TCP ports 43210 and 43211 used by the S1HAL
      (Silicon One Hardware Abstraction Layer) process are reachable in the default Layer 3 VRF; an
      unauthenticated remote attacker who can reach either port can send crafted input that executes as
      code with root privileges, or crash S1HAL and force the device to reload. Only switches carrying a
      Silicon One ASIC are affected — Cisco names ten specific product IDs (N9324C-SE1U, N9348Y2C6D-SE1U,
      N9364E-SG2-O, N9364E-SG2-Q, N9396T12C-SE1, N9348Y12C-SE1, N9396Y12C-SE1, N9336C-SE1, N9K-C9804,
      N9K-C9808), determinable via `show module`. Cisco's own "Products Confirmed Not Vulnerable" section
      explicitly excludes the Nexus 3000 and 7000 Series and all other Nexus 9000 models — a detail worth
      flagging because MITRE's CVE record carries the title "Cisco Nexus 3000 and 9000 Series Switches
      Silicon One Hardware Abstraction Layer Remote Code Execution Vulnerability," which conflicts with
      the advisory body; the advisory's affected-products list, not the CVE title, is authoritative. The
      flaw was found during a TAC support case (internal/non-malicious discovery, not external report),
      and Cisco PSIRT states it is not aware of any public announcement or malicious use. Fixed NX-OS
      software is available via Cisco's Software Checker; until upgraded, Cisco recommends infrastructure
      ACLs (iACLs) that deny TCP destined to 43210/43211, or a temporary NX-OS "Live Protect" shield for
      CVE-2026-20212. The same NCSC-NL bulletin (and the same CERT-FR advisory day) also carried two
      lower-severity companion Cisco advisories from the same release cycle: an IOS XR hardening advisory
      covering several configuration-dependent weaknesses, and a Cisco Secure Email S/MIME advisory that
      only allows decryption/tampering of mail between gateways to an attacker already holding a
      man-in-the-middle position.
    region_nexus: "global — NX-OS data-center switches are deployed across European and Swiss public-sector and critical-infrastructure networks"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: [CVE-2026-20212]
    techniques: [T1190]
    affected_products: ["Cisco Nexus 9000 Series Switches (Silicon One ASIC models: N9324C-SE1U, N9348Y2C6D-SE1U, N9364E-SG2-O, N9364E-SG2-Q, N9396T12C-SE1, N9348Y12C-SE1, N9396Y12C-SE1, N9336C-SE1, N9K-C9804, N9K-C9808)"]
    entity_keys: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "This vulnerability exists because TCP ports 43210 and 43211 are accessible in the default Layer 3 (L3) virtual routing and forwarding (VRF). A successful exploit could allow the attacker to connect to an affected device and send crafted input that could be executed as code with root privileges."
        attribution: "Cisco PSIRT"
        source_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-n9k-s1-rce-EH8dEtr"
      - quote: "The Cisco Product Security Incident Response Team (PSIRT) is not aware of any public announcements or malicious use of the vulnerability that is described in this advisory."
        attribution: "Cisco PSIRT"
        source_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-n9k-s1-rce-EH8dEtr"
    extended_notes: |
      Detection angle: monitor for any inbound TCP SYN/connection attempts to 43210/43211 on
      management/control-plane VRF interfaces of Nexus 9000 switches from unexpected sources — these
      ports have no legitimate business reason to be reached from outside the switch's own internal S1HAL
      control path. Hardening: the iACL approach (deny destination TCP 43210/43211) is the durable fix
      until firmware is upgraded; NX-OS "Live Protect" is described by Cisco as a bridging mitigation, not
      a substitute for patching.

  - title: "HPE Aruba Networking's September bundle: two CVSS 10.0 unauthenticated RCEs in Networking Fabric Composer (52-CVE bulletin) plus an unauthenticated buffer-overflow RCE in ArubaOS-CX switches"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/security/hpe-patches-critical-arubaos-cx-remote-code-execution-flaw/", publisher: "BleepingComputer", date: "2026-09-03", role: "primary" }
      - { url: "https://cveawg.mitre.org/api/cve/CVE-2026-73749", publisher: "MITRE CVE Program (HPE CNA)", date: "2026-09-01", role: "primary" }
      - { url: "https://cveawg.mitre.org/api/cve/CVE-2026-76658", publisher: "MITRE CVE Program (HPE CNA)", date: "2026-09-01", role: "primary" }
      - { url: "https://cveawg.mitre.org/api/cve/CVE-2026-76657", publisher: "MITRE CVE Program (HPE CNA)", date: "2026-09-01", role: "primary" }
      - { url: "https://gbhackers.com/critical-hpe-fabric-composer-flaw/", publisher: "GBHackers", date: "2026-09-02", role: "corroborating" }
      - { url: "https://securityonline.info/hpe-fabric-composer-vulnerabilities/", publisher: "Daily CyberSecurity (securityonline.info)", date: "2026-09-01", role: "corroborating" }
      - { url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0340", publisher: "NCSC-NL", date: "2026-09-03", role: "corroborating" }
      - { url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0339", publisher: "NCSC-NL", date: "2026-09-03", role: "corroborating" }
      - { url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1104/", publisher: "CERT-FR / ANSSI", date: "2026-09-02", role: "corroborating" }
    discovery_trace: "first seen at: advisories-ncsc-nl, URL https://advisories.ncsc.nl/advisory?id=NCSC-2026-0340 (ArubaOS-CX) and https://advisories.ncsc.nl/advisory?id=NCSC-2026-0339 (Fabric Composer), both published 2026-09-03 → pivot: WebSearch (\"HPE Networking Fabric Composer hpesbnw05133 vulnerabilities September 2026\") → pivot: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/hpe-patches-critical-arubaos-cx-remote-code-execution-flaw/ → pivot: GBHackers, URL https://gbhackers.com/critical-hpe-fabric-composer-flaw/ → pivot: securityonline.info, URL https://securityonline.info/hpe-fabric-composer-vulnerabilities/ → primary: MITRE CVE records (HPE as CNA), URL https://cveawg.mitre.org/api/cve/CVE-2026-73749 and https://cveawg.mitre.org/api/cve/CVE-2026-76658 and https://cveawg.mitre.org/api/cve/CVE-2026-76657 → corroboration: CERT-FR, URL https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1104/. Note: HPE's own bulletin pages (support.hpe.com hpesbnw05133en_us / hpesbnw05134en_us) sit behind an HPE support-portal login wall and could not be fetched directly; MITRE's CVE records (HPE as the assigning CNA) served as the vendor-authoritative primary instead."
    summary: |
      HPE published two Aruba-Networking security bulletins in the same release window (Fabric Composer
      bulletin HPESBNW05133 on 2026-09-01; ArubaOS-CX bulletin HPESBNW05134 on/around 2026-09-01-02), both
      picked up by NCSC-NL (advisories NCSC-2026-0339 and NCSC-2026-0340) and CERT-FR (CERTFR-2026-AVI-1104)
      on 2026-09-02/03. HPE Networking Fabric Composer (AFC, the controller managing Aruba CX switch
      fabrics) carries 52 CVEs in one bulletin, two of them CVSS 3.1 10.0: CVE-2026-76658 is an
      authentication weakness in AFC's SSH daemon — an unauthenticated remote attacker connects with no
      credentials, user interaction or preparation and executes arbitrary commands as a privileged OS
      user, per MITRE's CVE record (CWE-287 Improper Authentication). CVE-2026-76657 is an API
      authentication-bypass flaw letting an unauthenticated remote attacker circumvent AFC's API auth
      controls and obtain administrative privileges, leading to complete host compromise. Three more rank
      Critical: CVE-2026-19766 (9.6, adjacent-network auth bypass to privileged code execution in the
      underlying OS), CVE-2026-73701 (9.0, unauthenticated privileged RCE with unspecified preconditions)
      and CVE-2026-73700 (9.0, authenticated stored XSS reachable by a low-privilege operator against an
      admin). Fixed in Fabric Composer 7.4.0 (or 7.3.4 for the 7.3 branch); versions 7.3.3 and earlier are
      affected, discovered entirely by HPE's internal Networking security research team. Separately,
      ArubaOS-CX — the network OS on Aruba's CX-series campus and data-center switches — carries
      CVE-2026-73749 (CVSS 9.8): a buffer overflow in an unnamed AOS-CX daemon that an unauthenticated
      remote attacker triggers by sending specially crafted packets, reaching remote code execution with
      elevated privileges. Affected release branches and fixes per HPE's bulletin (via BleepingComputer):
      10.18.0001→10.18.1002+, 10.17.1021 and earlier→10.17.1030+, 10.16.1051 and earlier→10.16.1060+,
      10.13.1180 and earlier→10.13.1190+, 10.10.1180 and earlier→10.10.1181+ (this last branch is already
      past HPE's End of Maintenance and receives only critical-severity fixes, a category CVE-2026-73749
      qualifies for). The same ArubaOS-CX bulletin lists 23 further CVEs rated 8.1-8.8 High, including an
      unauthenticated adjacent-network arbitrary file write via an API endpoint (CVE-2026-73752), an
      unauthenticated format-string flaw in the CLI reachable from an adjacent network (CVE-2026-73782),
      and an unauthenticated predictable factory-default password granting full admin control before an
      administrator sets credentials post-ZTP (CVE-2026-73778). HPE states it is not aware of active
      exploitation or public PoC code for either bulletin's flaws as of publication.
    region_nexus: "global — HPE Aruba Networking switches and the Fabric Composer fabric controller are widely deployed in European and Swiss public-sector and enterprise data centers"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: [CVE-2026-76657, CVE-2026-76658, CVE-2026-19766, CVE-2026-73700, CVE-2026-73701, CVE-2026-73749, CVE-2026-73752, CVE-2026-73778, CVE-2026-73782]
    techniques: [T1190]
