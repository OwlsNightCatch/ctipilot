    evidence:
      - quote: "A vulnerability has been identified in the SSH daemon of HPE Networking Fabric Composer that could allow an unauthenticated remote attacker to gain administrative access to vulnerable AFC hosts. Successful exploitation could allow an attacker to execute arbitrary commands as a privileged user on the underlying operating system leading to complete system compromise."
        attribution: "HPE (MITRE CVE record for CVE-2026-76658)"
        source_url: "https://cveawg.mitre.org/api/cve/CVE-2026-76658"
      - quote: "Multiple vulnerabilities exist in a daemon of AOS-CX that may allow for improper processing of malformed input. An unauthenticated remote attacker could exploit these vulnerabilities by sending specially crafted packets to the affected service."
        attribution: "HPE (MITRE CVE record for CVE-2026-73749)"
        source_url: "https://cveawg.mitre.org/api/cve/CVE-2026-73749"
      - quote: "HPE mentions that, at the time of the bulletin's publication, it was not aware of any public discussions or exploit code targeting these issues."
        attribution: "GBHackers, relaying HPE's advisory"
        source_url: "https://gbhackers.com/critical-hpe-fabric-composer-flaw/"
    extended_notes: |
      Detection angle: Fabric Composer sits in the network-management plane rather than on a single
      application host — compromise grants control over the whole switch-fabric configuration
      (segmentation, routing, persistence below typical EDR visibility). Recommended compensating
      controls before patching (from vendor guidance relayed by nFlo/GBHackers): remove the AFC API and
      web management interface from general-purpose networks onto a dedicated out-of-band management
      segment; restrict SSH access to the AFC host by source address (CVE-2026-76658 has no
      authentication factor to fall back on); review AFC operator accounts and host authentication logs
      for administrative logins originating outside the management network; and diff the live fabric
      configuration (VLANs, ACLs, routes) against an approved baseline as the most likely evidence of
      exploitation. For ArubaOS-CX, note the CVE-2026-73778 factory-default-password issue specifically —
      any switch left in factory-default or immediate post-Zero-Touch-Provisioning state before an
      administrator sets credentials is fully exposed to a predictable-password admin takeover.

  - title: "CVE-2026-67402 — ConfigServer Security & Firewall's Messenger v3 maps /usr/bin as CGI, giving a blocked visitor unauthenticated code execution as the Apache user"
    sources:
      - { url: "https://support.cpanel.net/hc/en-us/articles/43171958716439-Security-CSF-Security-Release-September-3rd-2026", publisher: "cPanel Support (WebPros)", date: "2026-09-03", role: "primary" }
      - { url: "https://cveawg.mitre.org/api/cve/CVE-2026-67402", publisher: "MITRE CVE Program", date: "2026-09-03", role: "primary" }
      - { url: "https://github.com/advisories/GHSA-88ch-qhvf-3vfj", publisher: "GitHub Advisory Database", date: "2026-09-03", role: "corroborating" }
    discovery_trace: "first seen at: enisa-euvd API (recent criticals listing), record EUVD-2026-70850 (published 2026-09-03T23:57Z) → pivot: cPanel Support advisory, URL https://support.cpanel.net/hc/en-us/articles/43171958716439-Security-CSF-Security-Release-September-3rd-2026 → corroboration: MITRE CVE record, URL https://cveawg.mitre.org/api/cve/CVE-2026-67402 → corroboration: GitHub Advisory Database, URL https://github.com/advisories/GHSA-88ch-qhvf-3vfj → corroboration: WebSearch (\"CVE-2026-67402 ConfigServer Firewall CSF Messenger RCE\")"
    summary: |
      cPanel/WebPros published a security release on 2026-09-03 for CVE-2026-67402 (CVSS 4.0 9.2 Critical,
      CWE-552 Files or Directories Accessible to External Parties) in ConfigServer Security & Firewall
      (CSF), the widely-deployed Linux iptables/nftables firewall and intrusion-detection add-on used
      heavily on cPanel/WHM shared-hosting servers. The flaw is an insecure Apache virtual-host
      configuration: CSF's Messenger v3 HTTPS virtual host — the component that serves a "you have been
      blocked" notice page to visitors CSF/LFD has blocked — maps the /usr/bin directory as CGI programs.
      A remote unauthenticated attacker whose own address CSF has already blocked can request one of the
      mapped executables and have it run as an arbitrary command with the privileges of the Apache user.
      Two preconditions narrow the exposure: Messenger v3 and its HTTPS mode must be enabled (cPanel
      states the MESSENGER service is disabled by default), and CVSS4's Attack Requirements sub-score is
      marked Present, reflecting that the requesting IP must already be in a blocked state for the
      vulnerable code path to serve the request. Affected versions run 14.02 through 16.30-1; fixed in
      16.31, obtainable via the standard cPanel `/scripts/update-packages` update path. Where immediate
      updating is not possible, cPanel's documented interim mitigation is to set `MESSENGERV3 = 0` in
      /etc/csf/csf.conf and restart csf/lfd. No source reports observed exploitation or public
      proof-of-concept as of publication; the CVE was assigned via HackerOne.
    region_nexus: "global — CSF is deployed on a large population of cPanel/WHM-based Linux web-hosting servers, including shared hosting that may serve smaller Swiss public-sector or municipal web properties"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: [CVE-2026-67402]
    techniques: [T1190]
    affected_products: ["ConfigServer Security & Firewall (CSF)"]
    entity_keys: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "An insecure Apache configuration in ConfigServer Security & Firewall maps /usr/bin as CGI programs through the Messenger v3 HTTPS virtual host. A remote unauthenticated attacker whose address is blocked can request a mapped executable and run arbitrary commands as the Apache user."
        attribution: "MITRE CVE record (CVE-2026-67402), sourced from cPanel/WebPros"
        source_url: "https://cveawg.mitre.org/api/cve/CVE-2026-67402"
      - quote: "Note: By default, the MESSENGER service is disabled."
        attribution: "cPanel Support"
        source_url: "https://support.cpanel.net/hc/en-us/articles/43171958716439-Security-CSF-Security-Release-September-3rd-2026"
    extended_notes: |
      Hunt angle: Apache access logs on CSF-protected hosts showing requests to Messenger's HTTPS virtual
      host resolving to paths under /usr/bin (or any /cgi-bin/-style mapping outside the expected web
      root) are the discriminator; legitimate Messenger traffic only ever serves the static block-notice
      page, never an executable path. Hardening: audit any host running CSF for MESSENGERV3 enablement
      before assuming this doesn't apply — cPanel's hosting customers who enabled the friendlier
      HTTPS block-page feature are the population actually exposed.
    borderline: true
    borderline_reason: "CVSS 9.2 unauthenticated RCE, but two stacked preconditions (feature disabled by default; attacker's own IP must already be CSF-blocked to reach the vulnerable code path) meaningfully narrow real-world exposure versus a straightforward pre-auth RCE"

