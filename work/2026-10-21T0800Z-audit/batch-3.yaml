- entry: 2026-07-13/servicenow-ai-platform-sandbox-escape-cve-2026-6875
  rows:
  - W1-B
  findings:
  - where: 2026-07-21 section, second paragraph
    claim: ServiceNow's hosted/SaaS estate is already remediated, so exposure concentrates in on-prem and MSP-run deployments, which should be
      inventoried first.
    defect: 'Uncited, and partly contradicted: ServiceNow''s spokesperson still encourages ServiceNow-hosted customers to apply the patches, and
      ''MSP-run'' appears in no source (KB says ''self-hosted customers and partners'').'
    ground_truth: 'BleepingComputer quotes ServiceNow: "we encourage our self-hosted and ServiceNow-hosted customers to apply the relevant patches
      if they have not already done so"; KB3137947: "Relevant security updates have also been provided to ServiceNow self-hosted customers and
      partners."'
    ground_truth_url: https://www.bleepingcomputer.com/news/security/critical-servicenow-code-execution-flaw-now-exploited-in-attacks/
    fix: Say ServiceNow states it deployed a security update to hosted instances (KB3137947), that self-hosted customers and partners received
      updates, and drop 'MSP-run' / 'already remediated'.
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T6a
  - where: 'headline, cves[].affected, actions[0], takeaway: ''partner-managed'''
    claim: self-hosted and partner-managed instances are the residual exposure
    defect: '''Partner-managed instances'' is the entry''s own gloss; the vendor says updates were provided to ''self-hosted customers and partners''
      and the spokesperson still urges ServiceNow-hosted customers to patch.'
    ground_truth: '"Relevant security updates have also been provided to ServiceNow self-hosted customers and partners."'
    ground_truth_url: https://support.servicenow.com/kb?id=kb_article_view&sysparm_article=KB3137947
    fix: Use 'self-hosted instances and partners that received updates' or attribute the partner framing; keep hosted customers in the patch-if-not-done
      line.
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T6a
  - where: updates[0] record summary (2026-07-21)
    claim: NCSC-CH updated its advisory on 2026-07-20 to flag CVE-2026-6875 ... as actively exploited, with in-the-wild activity reported from
      2026-07-18 ... self-hosted and partner-managed deployments that have not applied hotfix KB3137947
    defect: 'The record summary keeps three statements the 2026-09-30 Correction says were wrong: NCSC-CH hub post 12778 shows a single ''Published''
