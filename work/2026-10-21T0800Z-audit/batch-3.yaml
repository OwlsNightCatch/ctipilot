- entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
  rows:
  - W1-B
  findings:
  - where: summary, headline
    claim: VulnCheck reported on 2026-07-28 that it has observed attackers gaining initial access to Langflow through CVE-2026-0769, harvesting
      credentials, deploying cryptominers and attempting lateral movement
    defect: VulnCheck states the observed initial-access exploits target both CVE-2026-0769 and CVE-2026-5027; the summary attributes the whole
      chain to CVE-2026-0769 alone (the body discloses the second CVE, the summary and headline do not).
    ground_truth: '"With LangFlow, we''ve seen attackers gain initial access using exploits targeting both CVE-2026-0769 and CVE-2026-5027, harvest
      credentials, likely for services such as OpenAI and Claude, deploy cryptominers, and attempt lateral movement."'
    ground_truth_url: https://www.vulncheck.com/blog/state-of-exploitation-1h-2026
    fix: Say VulnCheck observed exploits targeting both CVE-2026-0769 and CVE-2026-5027, and that the post-exploitation behaviour is not split
      per CVE.
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T6a
  - where: cves[0].affected; body 'ZDI names no affected or fixed version'; Correction section
    claim: No affected version range published (ZDI names none)
    defect: True of ZDI's advisory page, but ZDI is also the CNA and its CVE record lists Langflow 1.3.2 as an affected version (OSV derives the
      same single-version range). The correction removed 1.3.2 on the ground that the advisory names none, leaving 'names no affected version'
      unqualified.
    ground_truth: 'CVE-2026-0769 CNA (zdi) container: affected: [{vendor: Langflow, product: Langflow, versions: [{version: ''1.3.2'', status:
      ''affected''}], defaultStatus: ''unknown''}]'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-0769
    fix: State that the ZDI advisory page names no version while ZDI's CVE record lists only 1.3.2 as affected (a single listed version, not a
      range); the 'every self-hosted instance' exposure sentence should say the affected range is undefined, not that none exists.
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T6a
