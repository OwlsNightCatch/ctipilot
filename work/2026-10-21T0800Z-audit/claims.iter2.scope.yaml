    entry: 2026-09-21/conference-phishing-rogue-root-ca-mitm-persistence
    surface: "summary"
    kind: frontmatter
    text: "A Huntress researcher was targeted post-conference by a fake CoinDesk executive persona over a legitimate Google Doc carrying a zero-click reconnaissance sidebar, in a chain that abused three code-signing certificates. The payload Huntress's recap calls the most interesting hollows MsBuild.exe, generates its own self-signed certificate authority impersonating Google Trust Services, installs it into the system root store, and adds a hosts-file entry plus a firewall rule so a local proxy can answer the machine's VirusTotal lookups over fully validating HTTPS with fabricated results. The CA's private key sits on disk, so a trusted certificate can be minted for any domain."
