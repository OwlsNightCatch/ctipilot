  - claim_id: a5d5747358
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "body"
    kind: cited
    text: "The reason a local privilege-escalation PoC from this particular persona deserves more than a backlog ticket is the track record the same reporting sets out: of the previously disclosed flaws in the series, three (BlueHammer, CVE-2026-33825; RedSun, CVE-2026-41091; UnDefend, CVE-2026-45498) were exploited in real-world intrusions before fixes landed and all three ended up in CISA's Known Exploited Vulnerabilities catalog ("
    urls: ["https://www.cyberkendra.com/2026/08/shieldbreak-poc-bypasses-microsofts.html"]
  - claim_id: 547a5e5d4f
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "body"
    kind: cited
    text: "The one the reporting names as strongest for this bug class is application allowlisting: ThreatLocker found it blocked RoguePlanet by default ("
    urls: ["https://www.cyberkendra.com/2026/08/shieldbreak-poc-bypasses-microsofts.html"]
  - claim_id: 43fda777ba
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "body"
    kind: uncited
    text: "RoguePlanet was a race condition whose reliability varied sharply between machines (the researcher called it hit or miss in June), while \"ShieldBreak is listed with a 100 percent success rate\"."
  - claim_id: b42bdbb1cf
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "body"
    kind: uncited
    text: "Both of those are the researcher's own claims: Cyber Kendra states that \"No patch exists for ShieldBreak, and no vendor has reproduced it publicly yet\", and that Microsoft had not commented at publication; both true when written on 2026-08-12 and both since overtaken: Microsoft acknowledged the flaw as CVE-2026-69414 two days later and has since shipped an engine fix (2026-09-13 update below)."
  - claim_id: 54635afe3f
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "body"
    kind: uncited
    text: "Treat the reliability figure and the server coverage as unverified until someone reproduces them, but treat the existence of working exploit code as established, because that is what the release consists of."
  - claim_id: a14c2beb40
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "body"
    kind: uncited
    text: "**This paragraph describes the position at disclosure, when no fix existed; Microsoft has since shipped one: see the 2026-09-13 update below, and patch first.** At the time, compensating controls rather than patching were the available lever."
  - claim_id: d8e5dd1705
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "body"
    kind: uncited
    text: "LevelBlue's mechanism, in the 2026-08-24 update below, replaces these hypotheses."
  - claim_id: 34604e247b
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-18T04:45:00Z"
    kind: cited
    text: "Microsoft published an advisory on 2026-08-14 that names the technique directly (the vulnerability is described as an elevation of privilege in the Microsoft Malware Protection Engine in Microsoft Defender publicly referred to as \"ShieldBreak\") and assigned it CVE-2026-69414 ("
    urls: ["https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-69414"]
  - claim_id: ae34f09760
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-18T04:45:00Z"
    kind: cited
    text: "LevelBlue's mechanism, in the 2026-08-24 update below, later showed that the SYSTEM stage does not run as a child of the engine: the chain \"triggers the QueueReporting task, causing wermgr.exe to execute phoneinfo.dll as SYSTEM\" ("
    urls: ["https://www.levelblue.com/blogs/spiderlabs-blog/cloud-sync-root-registrationshieldbreak-hunting-windows-defender-remediation-abuse-and-cloud-files-hijacking"]
  - claim_id: a85a44fdce
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-18T04:45:00Z"
    kind: uncited
    text: "That combination (publicly available exploit code, a vendor expectation of exploitation, and no update) is the shape that justifies attention outside the normal patch cycle, and it is a materially different footing from a researcher's unverified GitHub claim."
  - claim_id: 2324aab065
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-18T04:45:00Z"
    kind: uncited
    text: "**Detection, telemetry class first.** No new behavioural detail was published with the CVE."
  - claim_id: 3f8ab62269
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-18T04:45:00Z"
    kind: derived
    text: "An estate now has an identifier to track this against, which means it can be carried in a vulnerability register, matched by a scanner once detection logic exists, and closed out when the update ships, none of which was possible against an unnumbered proof-of-concept."
  - claim_id: d673924e50
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-21T06:20:00Z"
    kind: uncited
    text: "LevelBlue reconstructs it in seven stages, and the elegant part is that the attacker never writes to System32; Defender does."
  - claim_id: 2d62541811
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-21T06:20:00Z"
    kind: uncited
    text: "Next it resolves native object-manager routines out of `ntdll.dll` and builds a shadow namespace containing two conflicting symbolic links under the same name (one pointing at the working directory, one at a transaction-log path), giving it a redirection layer that sits above the filesystem."
  - claim_id: 050b8ab570
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-21T06:20:00Z"
    kind: uncited
    text: "It then loads Defender's own management library directly and resolves that library's scan and clean functions to open Defender's RPC interface, scan the placeholder through the shadow path, and, once Defender has flagged the bait archive, start Defender's **own remediation operation** against it."
  - claim_id: c6dedc8249
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-21T06:20:00Z"
    kind: derived
    text: "**Triage:** LevelBlue's own framing is the right instruction: \"ShieldBreak is best detected through behavioral correlation rather than any single static indicator\", because every component is a legitimate Windows capability."
  - claim_id: d2583d8b3e
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-21T06:20:00Z"
    kind: derived
    text: "Each is weak alone (legitimate sync agents register sync roots, and Defender's own processes load its library all day), so the sequence and the identity of the calling process are what separate them."
  - claim_id: 309473542e
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-21T06:20:00Z"
    kind: derived
    text: "**Defender takeaway:** there was still nothing to patch at this point (Microsoft has since shipped an engine fix; see the 2026-09-13 update below), so the change for a defender is that detection content is now writable against a documented chain, and that content should key on the Defender-library load by an unexpected process, not on the exploit's filenames, which are proof-of-concept artefacts."
  - claim_id: f4676322a9
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-24T09:11:00Z"
    kind: uncited
    text: "By then Microsoft had acknowledged ShieldBreak as CVE-2026-69414, rated it 7.8, assessed it \"Exploitation More Likely\", and stated a security update was still being worked on, with no published mechanism and therefore nothing to detect on."
  - claim_id: afbd397efd
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-24T09:11:00Z"
    kind: uncited
    text: "(Microsoft has since shipped an engine fix; see the 2026-09-13 update below.)"
  - claim_id: 4d180b209f
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-24T09:11:00Z"
    kind: uncited
    text: "It then creates two directories beneath the object manager's `\\BaseNamedObjects\\Restricted\\` namespace and, inside them, **two conflicting symbolic links both named `WD_SCAN`**: one initially resolving to the working directory holding the placeholder, the other to a path used by the Common Log File System."
  - claim_id: 294cf5f6ae
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-24T09:11:00Z"
    kind: uncited
    text: "A background thread watches for the CLFS transaction log that Defender's clean operation creates, and the instant it appears takes an **exclusive lock** on it, freezing Defender mid-transaction."
  - claim_id: d9df54d20a
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-24T09:11:00Z"
    kind: uncited
    text: "Because `MsMpEng.exe` is the process that writes the file, the write itself looks expected, which LevelBlue flags as a triage detail that must be correlated rather than dismissed."
  - claim_id: 648f019750
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-24T09:11:00Z"
    kind: uncited
    text: "The proof-of-concept then maps the resulting DLL as an executable image to stop remediation removing it, crafts a Windows Error Report into the report queue, and triggers the **built-in `QueueReporting` scheduled task through the Task Scheduler COM interface method `ITaskService::Run()`**; that task runs as SYSTEM, so the signed Windows error-reporting binary `wermgr.exe` processes the report and loads `phoneinfo.dll` with SYSTEM privileges: a trusted system binary acting as the proxy that executes the attacker's code, which is how the payload runs without the attacker ever launching a process of their own."
  - claim_id: 39a02beb04
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-24T09:11:00Z"
    kind: uncited
    text: "Detection, in the report's own framing, \"is best detected through behavioral correlation rather than any single static indicator\", but one static indicator is close to free."
  - claim_id: 059de931e6
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-24T09:11:00Z"
    kind: uncited
    text: "LevelBlue identifies **`C:\\Windows\\System32\\phoneinfo.dll`** as the strongest single indicator in the chain and states the file **is not expected to exist natively on supported Windows versions**, so its creation warrants a high-priority look regardless of the process that wrote it."
  - claim_id: afab9ab05f
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-24T09:11:00Z"
    kind: uncited
    text: "(The hedge is the source's own and is worth keeping: \"not expected on supported versions\" is what it will bear, not a guarantee about every Windows build ever shipped.) Beyond that, and led by telemetry class: in image- and module-load telemetry, `MpClient.dll` loaded by a process that is not one of Defender's own small set of expected consumers (the report names `MsMpEng.exe`, `MpCmdRun.exe`, `NisSrv.exe`, `ConfigSecurityPolicy.exe` and `MpSigStub.exe`) is the compound signal, and LevelBlue is specific about what makes it load-bearing: \"The set of expected MpClient.dll consumers is small."
  - claim_id: 9c70bae28b
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-24T09:11:00Z"
    kind: uncited
    text: "And in named-pipe telemetry this specific proof-of-concept creates a pipe with a hardcoded name, with a SYSTEM-integrity process then connecting to a pipe a normal user created, though that name is an artefact of this build rather than of the technique."
  - claim_id: 45c30a26f3
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-24T09:11:00Z"
    kind: derived
    text: "The discriminators are the process identities and the ordering: a sync-root registration from something that is not a sync client, `MpClient.dll` resolved by a non-Defender process followed by that specific clean-function set, and a `QueueReporting` run driven through COM rather than by the ordinary error-reporting trigger, with the whole chain completing in roughly eight to twelve seconds."
  - claim_id: 59137dc18b
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-24T09:11:00Z"
    kind: derived
    text: "Microsoft has since shipped an engine fix, so updating the Defender engine is now the primary control (see the 2026-09-13 update below)."
  - claim_id: 47ccf17b1d
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-09-13T15:10:00Z"
    kind: uncited
    text: "**The same researcher now claims the fix is incomplete, as their own claim, not a confirmed one.** On 2026-09-08 Nightmare Eclipse published ShieldCrash, described in the researcher's own repository as a partial rather than total bypass: \"Microsoft has failed to properly patch ShieldBreak CVE-2026-69414, under specific conditions it is still possible to trigger the exact same problem that was caused by ShieldBreak."
  - claim_id: af32dce167
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-09-13T15:10:00Z"
    kind: derived
    text: "**Defender takeaway:** patch to engine 1.1.26080.3 or later and verify it as an engine version, not an OS build; that is now a real control where previously there was none."
  - claim_id: 1a899ee4e0
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-10-21T08:11:58Z"
    kind: cited
    text: "The 2026-08-18 update's advice to treat a process tree rooted at the Malware Protection Engine as the signal does not fit this chain: \"ShieldBreak then triggers the QueueReporting task, causing wermgr.exe to execute phoneinfo.dll as SYSTEM\" ("
    urls: ["https://www.levelblue.com/blogs/spiderlabs-blog/cloud-sync-root-registrationshieldbreak-hunting-windows-defender-remediation-abuse-and-cloud-files-hijacking"]
  - claim_id: 15c8223ac3
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-10-21T08:11:58Z"
    kind: uncited
    text: "The SYSTEM stage surfaces under the Windows Error Reporting host, not as a child of the engine, so hunting follows the sequence in the 2026-08-24 update."
  - claim_id: 895ea7c34d
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "record 2026-10-21T08:11:58Z"
    kind: record-summary
    text: "The 2026-08-18 update's hunting advice treated a process tree rooted at the Malware Protection Engine as the signal, with an unsourced triage claim; LevelBlue's mechanism shows the SYSTEM stage runs under wermgr.exe from the QueueReporting task, so that advice now points to the 2026-08-24 detection sequence, and the disclosure-day paragraph drops the same premise. The 2026-08-21 and 2026-09-13 updates no longer read MSRC's temporal CVSS metrics as recording the fix, since the vector carried the official-fix value before the fix shipped."
