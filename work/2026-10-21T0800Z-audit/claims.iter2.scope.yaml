    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "headline"
    kind: frontmatter
    text: "Two JFrog Artifactory bugs patched weeks ago are confirmed chained into full admin takeover"
  - claim_id: d5251c03df
    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "summary"
    kind: frontmatter
    text: "Wiz Research documents in-the-wild exploitation, running 15 August–8 September 2026, of two distinct JFrog Artifactory flaws, CVE-2026-42018 (an unauthenticated caller can obtain an internal anonymous-user token) and CVE-2026-42016 (that token's scope is not validated when exchanged for a new one), chained into an unauthenticated-to-admin escalation in two HTTP requests, in some cases reaching a created administrator account in under five minutes. Both CVEs were disclosed and patched by JFrog in July and August, weeks before this exploitation was reported; six weeks after disclosure, 59% of organizations running Artifactory remained vulnerable to CVE-2026-42016, and CVE-2026-42018 fell only from 69% to 62% over four weeks."
  - claim_id: 91e34886ba
    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "immediate_action"
    kind: frontmatter
    text: "Patch and hunt JFrog Artifactory now: confirmed admin-takeover chain, backdoors already dropped: Wiz Research confirms active, ongoing exploitation of this two-CVE chain against self-hosted JFrog Artifactory since 15 August 2026, reaching full administrative control and, in multiple cases, a dropped Rust-based backdoor with C2 capability. Six weeks after disclosure, most organizations running Artifactory still have at least one vulnerable instance. Upgrade every instance to 7.133.11 or later, JFrog's only fixed build for CVE-2026-42016, on a build that also carries the CVE-2026-42018 fix for its branch. Wiz lists 7.133.29, 7.146.38 and 7.161.20 for those branches, above JFrog's own table. Wiz's lower-branch builds 7.111.21, 7.117.28 and 7.125.20 stay inside JFrog's affected range for CVE-2026-42016. Then search access logs for the chain's own signature: an unauthenticated POST to /access/api/v1/aws/token/ followed by a POST to /access/api/v1/tokens from the same client (in some cases Wiz saw an admin account created within five minutes of the first request). A hit where both requests returned HTTP 200 is a successful exploitation: treat the instance as compromised. Revoke all tokens, reset the Access token signing key and certificate, audit for administrator accounts you did not create, remove unauthorized Groovy plugins and restart the JVM to clear any in-memory implant."
  - claim_id: 6d53655d76
    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "actions[1]"
    kind: frontmatter
    text: "On any Artifactory instance that was internet-reachable and unpatched since 15 August 2026, search access logs for an unauthenticated POST to /access/api/v1/aws/token/ followed by a POST to /access/api/v1/tokens from the same client (in some cases Wiz saw an admin account created within five minutes of the first request); on a hit with both answered HTTP 200, treat the instance as compromised and reset the Access token signing key and certificate before relying on the upgrade."
