    kind: cited
    text: "**Detection:** for a hotel, booking-system login records and the messages its account sends to guests, since the takeover variant logs in with stolen credentials and messages guests with urgent card-verification or advance-payment demands; for any organisation, web-proxy or DNS records of visits to pages imitating TWINT or a bank, the path the refund variant uses to collect card data ("
