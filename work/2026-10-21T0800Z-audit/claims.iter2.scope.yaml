    text: "The infostealer tag is removed because Sophos describes Beagle as a simple backdoor with remote-shell and file-management commands, and the technology sector because no source names a targeted sector. Exposure and triage lines are added from Malwarebytes' host checks: a misspelled lookalike install directory, and WScript.exe writing the signed G DATA updater, its DLL and an encrypted data file into the Startup folder and starting the updater with a hidden window. The ATT&CK mapping gains the VBScript dropper, payload decryption, in-memory loading, the self-deleting dropper and the hidden window the main text describes."
