    text: "{\"id\": \"CVE-2026-50656\", \"cvss\": \"7.8\", \"status\": [\"poc-public\", \"patch-available\"], \"affected\": \"Microsoft Malware Protection Engine builds before 1.1.26060.3008 (RoguePlanet, the flaw ShieldBreak is described as bypassing)\", \"fixed\": \"Engine build 1.1.26060.3008, released 2026-07-08 per Microsoft; reported as bypassed by ShieldBreak\", \"auth\": \"post-auth\", \"vector\": \"local\"}"
  - claim_id: c7728bf425
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "body"
    kind: cited
    text: "Rapid7, covering the same release in its Patch Tuesday analysis, records the researcher describing ShieldBreak as a full patch bypass for RoguePlanet (the entry in the same series that Microsoft patched as CVE-2026-50656 in July, a month after its public disclosure) and notes that both are elevation-of-privilege-to-SYSTEM vulnerabilities in Defender ("
