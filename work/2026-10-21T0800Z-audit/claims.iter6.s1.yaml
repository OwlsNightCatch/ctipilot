  - claim_id: 13c4f6ee6f
    entry: 2026-05-29/cve-2026-9170-ibm-http-server-websphere-application-server-p
    surface: "summary"
    kind: frontmatter
    text: "IBM HTTP Server 9.0 and 8.5, the component shipped with all editions of WebSphere Application Server, is vulnerable to CVE-2026-9170 (CVSS 9.8), improper input validation that IBM says can cause denial of service and potential remote code execution. IBM rates configurations using the SSLEnable directive as the common exposure. Fix Packs 8.5.5.30 and 9.0.5.29, released on 2026-07-27 and 2026-09-08, carry the fix, and IBM's current cumulative interim fix, IFDT503301 of 2026-10-13, carries the APAR PH71265 fix. NCSC-CH gives the exploitation status as unknown."
  - claim_id: 4b9f6cd207
