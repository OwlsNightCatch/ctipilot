    entry: 2026-06-09/cve-2026-50751-check-point-security-gateway-ikev1-vpn-authen
    surface: "immediate_action"
    kind: frontmatter
    text: "Patch Check Point IKEv1 VPN gateways (CVE-2026-50751): An unauthenticated attacker can forge a Remote Access / Mobile Access VPN session without a valid password on gateways running the deprecated IKEv1 key exchange, and the flaw has been exploited in the wild since 7 May 2026, a month before disclosure, against a few dozen targeted organizations. Check Point confirmed Qilin-affiliate post-compromise activity in one case and assesses with medium confidence that the exploiting actor uses Qilin ransomware. NCSC-CH has issued an advisory flagging the CVE as actively exploited. Apply hotfix sk185033 now, disable legacy IKEv1 remote-access client support, and review gateway logs from 7 May for completed IKEv1 Quick Mode (\"Key Install\") events before the fix that come from unrecognised users or source IP addresses, as Check Point's sk185033 advises."
