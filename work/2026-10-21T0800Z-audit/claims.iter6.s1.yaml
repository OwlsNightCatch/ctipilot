  - claim_id: ce33ae9968
    entry: 2026-07-13/servicenow-ai-platform-sandbox-escape-cve-2026-6875
    surface: "summary"
    kind: frontmatter
    text: "ServiceNow disclosed CVE-2026-6875 (CVSS 9.5), a sandbox escape in the ServiceNow AI Platform that, in certain circumstances, lets an unauthenticated user execute code within the platform. ServiceNow addressed its hosted instances starting in April and released updates for self-hosted instances on 2026-07-13. Defused reports exploitation attempts in the wild from 2026-07-17, and NCSC-CH flagged the CVE as actively exploited on 2026-07-20, citing that reporting. ServiceNow's advisory says it is not aware of exploitation against ServiceNow instances, and its spokesperson says it has seen no evidence that the activity relates to instances it hosts. Self-hosted customers and partners must apply the fixed release for their family now, and ServiceNow also encourages hosted customers to apply the patches if they have not already done so."
  - claim_id: 1eca28a8c1
    entry: 2026-07-13/servicenow-ai-platform-sandbox-escape-cve-2026-6875
    surface: "actions[0]"
    kind: frontmatter
    text: "Apply the fixed release for your family listed in ServiceNow security bulletin KB3137947 (Zurich Patch 7b or 9, Yokohama Patch 12 Hot Fix 1b or Patch 13, Australia Patch 2, Brazil EA or GA) to every self-hosted ServiceNow AI Platform instance now; ServiceNow provided these updates to self-hosted customers and partners. Exploitation attempts have been reported since 2026-07-17, and self-hosted instances are the ones ServiceNow did not update itself."
