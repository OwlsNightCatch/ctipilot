    entry: 2026-05-08/qilin-ransomware-hits-die-linke-germany-1-5-tb-claimed-dpa-n
    surface: "summary"
    kind: frontmatter
    text: "Die Linke disclosed on 2026-03-27 that it had taken parts of its IT infrastructure offline after a suspected ransomware attack it attributes to Qilin. Qilin listed the party on its leak site on 2026-04-01 without publishing samples. The party says its member database was not affected and that it cannot assess whether the attackers' aim of publishing internal data will succeed or has already occurred, and Heise reported that which internal data was compromised had not yet been definitively clarified."
