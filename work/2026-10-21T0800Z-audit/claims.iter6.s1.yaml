  - claim_id: ab9dbff5d5
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "headline"
    kind: frontmatter
    text: "CVE-2026-46300, Linux kernel: local privilege escalation via xfrm ESP-in-TCP (\"Fragnesia\"), PoC public"
  - claim_id: 21c3584416
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "summary"
    kind: frontmatter
    text: "CVE-2026-46300 (\"Fragnesia\", CVSS 7.8) is a local privilege escalation vulnerability in the Linux kernel's xfrm ESP-in-TCP path, one of three CVEs Red Hat collectively groups as \"Dirty Frag\", and Red Hat confirms RHEL kernels are affected. Its public proof-of-concept exploit overwrites /usr/bin/su in the page cache, and Aikido says working Kubernetes exploits have been published for the Dirty Frag family as a whole (Wiz Research, 2026-05-13 · Red Hat RHSB-2026-003 · Aikido Security, 2026-09-04)."
  - claim_id: 17b88308c3
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "body"
    kind: cited
    text: "**Detection:** process and syscall telemetry on Linux hosts (for example auditd or an EDR's Linux sensor): an unprivileged process that creates user and network namespaces and installs an ESP security association over NETLINK_XFRM, followed by `su` starting a root shell with no authentication step, because the exploit's overwritten `su` calls `setresuid(0,0,0)` and executes `/bin/sh` ("
    urls: ["https://www.wiz.io/blog/fragnesia-linux-kernel-local-privilege-escalation-via-esp-in-tcp"]
  - claim_id: c62c234d11
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "body"
    kind: cited
    text: "The primitive can rewrite any file the user can read, so a check limited to `su` misses variants ("
    urls: ["https://www.helpnetsecurity.com/2026/05/14/fragnesia-cve-2026-46300-linux-lpe-vulnerability/"]
  - claim_id: e353a35986
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "body"
    kind: cited
    text: "**Triage:** unprivileged user namespaces are routine for rootless containers, sandboxed browsers and Flatpak, and IPsec is commonly used for VPNs and site-to-site tunnels ("
    urls: ["https://access.redhat.com/security/vulnerabilities/RHSB-2026-003"]
  - claim_id: 2485fdbd2f
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "body"
    kind: cited
    text: "), so either alone is weak; the exploit's signature is one unprivileged process tree that sets up its own ESP security association inside a fresh network namespace and then runs `su` ("
    urls: ["https://www.wiz.io/blog/fragnesia-linux-kernel-local-privilege-escalation-via-esp-in-tcp"]
  - claim_id: 23a5d5c9c4
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "section 2026-09-05T05:10:00Z"
    kind: cited
    text: "For the Dirty Frag family as a whole (CVE-2026-43284, CVE-2026-43500 and CVE-2026-46300), Aikido writes: \"Researchers have already published working proof-of-concept exploits for Kubernetes, and Ubuntu spells out the risk of a container escape\"; it names no Kubernetes exploit for CVE-2026-46300 itself ("
    urls: ["https://www.aikido.dev/blog/dirty-frag"]
  - claim_id: bf748b72c8
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "section 2026-10-21T08:18:40Z"
    kind: cited
    text: "Aikido's statement that working Kubernetes proof-of-concept exploits have been published concerns the Dirty Frag family as a whole, which it defines as CVE-2026-43284, CVE-2026-43500 and CVE-2026-46300, and its link for the container-escape risk is Ubuntu's page for CVE-2026-43284 ("
    urls: ["https://www.aikido.dev/blog/dirty-frag"]
  - claim_id: efc6d3532f
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "section 2026-10-21T08:18:40Z"
    kind: cited
    text: "No cited source describes a Kubernetes exploit for CVE-2026-46300 itself; its public exploit overwrites `/usr/bin/su` in the page cache ("
    urls: ["https://www.helpnetsecurity.com/2026/05/14/fragnesia-cve-2026-46300-linux-lpe-vulnerability/"]
  - claim_id: 9423790226
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "section 2026-10-21T08:18:40Z"
    kind: cited
    text: "On a host, that exploit shows as an unprivileged process creating user and network namespaces and installing an ESP security association over NETLINK_XFRM before `su` starts a root shell ("
    urls: ["https://www.wiz.io/blog/fragnesia-linux-kernel-local-privilege-escalation-via-esp-in-tcp"]
  - claim_id: 00dd2c3c98
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "record 2026-10-21T08:18:40Z"
