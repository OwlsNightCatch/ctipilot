- entry: 2026-06-30/cve-2026-8037-progress-kemp-loadmaster-pre-auth-rce-via-unin
  rows:
  - W1-B
  findings:
  - where: frontmatter cves[CVE-2026-8037].cvss / affected, affected_products; summary; body paragraph 1; Correction sentence 'the 9.8 score is
      ZDI's, while eSentire gives 9.6'
    claim: 'cvss: "9.8"; affected: "Kemp LoadMaster GA 7.2.63.1 and older; LTSF 7.2.54.17 and older, when the API is enabled"; affected_products:
      [Progress Kemp LoadMaster]; summary: "CVSS 9.8 per ZDI, 9.6 per eSentire"'
    defect: The per-CVE authority (Progress, the CNA) scores CVE-2026-8037 at 9.6 with an Adjacent-network vector, not 9.8; eSentire's 9.6 is
      simply the vendor's score, while 9.8 (network vector) is ZDI's. The vendor's structured affected ranges start at 7.2.60.0 (GA) and 7.2.54.12
      (LTSF), so '7.2.63.1 and older' overstates the lower bound, and the same record lists three further affected Progress products (ECS Connections
      Manager, Object Scale Connection Manager, MOVEit WAF) that affected_products omits.
    ground_truth: 'CVE-2026-8037 CNA (ProgressSoftware, published 2026-06-04): cvssV3_1 baseScore 9.6, vectorString CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H,
      CWE-77; affected LoadMaster V7.2.60.0 to <V7.2.63.2 and V7.2.54.12 to <V7.2.54.18; also ECS Connections Manager, Object Scale Connection
      Manager and MOVEit WAF V7.2.60.0 to <V7.2.63.2. ZDI-26-342: ''CVSS Score 9.8 AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H''.'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-8037
    fix: Give the vendor score (9.6, AV:A) as the vendor's and 9.8 as ZDI's, state the vendor's affected ranges (GA 7.2.60.0 to 7.2.63.1, LTSF
      7.2.54.12 to 7.2.54.17) and add the three other affected Progress products to affected_products; keep watchTowr's 'and older' only as watchTowr's
      wording.
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T5
  - where: Correction — 2026-09-30T06:43:48Z, sentences 3-4, record summary ('no longer names OWASP CRS'), and body paragraph 1 (CVE-2026-33691
      clause)
    claim: The earlier main text also said the second bulletin CVE, CVE-2026-33691, bypasses file-upload extension checks via OWASP CRS whitespace
      padding. The Hacker News describes it as a WAF bypass in which whitespace padding in filenames can get around file-upload extension checks,
      without naming OWASP CRS
    defect: The correction treats the OWASP CRS attribution as unsupported and removes it, but the CVE record for CVE-2026-33691 (GitHub CNA,
      published 2026-04-02) is exactly a coreruleset/OWASP CRS bypass by whitespace padding in the filename, so the earlier wording was right
      and the current text drops the real root cause (an upstream CRS flaw fixed in CRS 3.3.9 / 4.25.0 and shipped in LoadMaster's WAF); the same
      record scores it CVSS 6.8 (Medium) while the entry repeats THN's 'high-severity' without noting the CNA score.
    ground_truth: 'CVE-2026-33691: ''The OWASP core rule set (CRS) ... Prior to versions 3.3.9 and 4.25.0, a bypass was identified in OWASP CRS
      that allows uploading files with dangerous extensions (.php, .phar, .jsp, .jspx) by inserting whitespace padding in the filename ... patched
      in versions 3.3.9 and 4.25.0''; affected coreruleset < 3.3.9 and >= 4.0.0-rc1 < 4.25.0; cvssV3_1 baseScore 6.8 MEDIUM.'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-33691
    fix: Restore the OWASP CRS attribution (an upstream CoreRuleSet flaw, CVE published 2026-04-02) and cite the CVE record or Progress bulletin;
      reword the Correction so it no longer calls the OWASP CRS statement an error, and give the CNA's 6.8 beside THN's 'high-severity'.
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T5
  - where: Update — 2026-08-08T04:45:00Z, paragraph 1, sentence 2
    claim: The catalog record describes the flaw as a command injection that "allows an un-authenticated attacker to execute arbitrary commands
      on the LoadMaster appliance by exploiting unsanitized input in multiple command endpoints," classes it CWE-77, and records known ransomware-campaign
      use as unknown ([CISA, 2026-08-07](https://www.cisa.gov/news-events/alerts/2026/08/07/cisa-adds-one-known-exploited-vulnerability-catalog))
    defect: The cited CISA alert page lists only the CVE id and the name 'Progress LoadMaster Command Injection Vulnerability'; the quoted description,
      CWE-77 and the ransomware flag are fields of the KEV JSON record, which the clause does not cite (true fact, mis-attributed citation).
    ground_truth: 'KEV record CVE-2026-8037: shortDescription ''Progress LoadMaster contains a command injection vulnerability that allows an
      un-authenticated attacker to execute arbitrary commands on the LoadMaster appliance by exploiting unsanitized input in multiple command
      endpoints.''; cwes [''CWE-77'']; knownRansomwareCampaignUse ''Unknown''. The alert page: ''CVE-2026-8037 Progress LoadMaster Command Injection
      Vulnerability'' and ''...based on evidence of active exploitation.'''
    ground_truth_url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    fix: Cite the KEV JSON feed (already in sources[]) for the description, CWE and ransomware field, and keep the alert page for the 'based on
      evidence of active exploitation' sentence.
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T5
  - where: Update — 2026-07-02T04:55:25Z, paragraph 2, sentence 1
    claim: eSentire assesses that public PoC availability plus detailed technical write-ups will drive continued and likely more successful attacks
      near-term ([The Hacker News, 2026-07-01](https://thehackernews.com/2026/07/latest-progress-kemp-loadmaster-pre.html))
    defect: 'Neither THN nor eSentire predicts ''more successful'' attacks: eSentire assesses it is ''highly probable exploitation attempts ...
      will increase in the immediate future'', and THN says the PoC ''is expected to drive malicious activity''.'
    ground_truth: 'eSentire: ''Due to the availability of PoC exploit code and the potential value for initial access, the eSentire Threat Intelligence
      team assesses that it is highly probably exploitation attempts targeting CVE-2026-8037 will increase in the immediate future.'' THN: ''the
      availability of a proof-of-concept (PoC) exploit and detailed technical specifics is expected to drive malicious activity against CVE-2026-8037
      in the immediate future.'''
    ground_truth_url: https://www.esentire.com/security-advisories/progress-kemp-loadmaster-vulnerability-targeted-cve-2026-8037
    fix: Say eSentire expects exploitation attempts to increase in the immediate future.
