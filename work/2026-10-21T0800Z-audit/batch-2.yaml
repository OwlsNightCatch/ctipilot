  - where: cves[CVE-2026-25089].affected / body paragraph 1 (listed source NCSC-NL NCSC-2026-0189)
    claim: Affected are FortiSandbox 5.0.0 through 5.0.5 and 4.4.0 through 4.4.8 plus FortiSandbox Cloud and PaaS 5.0.4 through 5.0.5
    defect: (low confidence) The entry matches Fortinet's table, but its listed corroborating source NCSC-NL states a wider range (4.2 through
