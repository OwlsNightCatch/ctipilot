    ground_truth_url: https://advisories.ncsc.nl/advisory?id=NCSC-2026-0189
    fix: Add a Contradiction clause or say Fortinet's table lists no 4.2 builds (NCSC-NL includes 4.2), keep the vendor range as authoritative.
