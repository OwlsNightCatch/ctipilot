- entry: 2026-06-18/fortibleed-73-932-internet-facing-fortigate-devices-exposed
  rows:
  - W1-B
  findings:
  - where: body paragraph 1, first sentence
    claim: A dataset branded "FortiBleed" was reported on 2026-06-18, containing 73,932 unique FortiGate management URLs, roughly 75,000 devices
      across 194 countries and 21,632 domains, paired with valid VPN and administrative credentials
    defect: (low confidence) BleepingComputer says the leak 'appears to be a collection of Fortinet and FortiGate VPN credentials for 73,932 firewall
      URLs' and that Diachenko saw 'what appeared to be valid' credentials, with Beaumont confirming only 'some' as authentic; the entry states
      'management URLs' and 'valid' credentials flatly, and gives 73,932, 75,000 and 21,632 as one dataset although they come from three different
      researchers (BleepingComputer/Hudson Rock count, Beaumont estimate, Hudson Rock domain count).
    ground_truth: '''A newly discovered data leak dubbed "FortiBleed" has exposed what appears to be a collection of Fortinet and FortiGate VPN
      credentials for 73,932 firewall URLs''; ''I have been able to confirm the authenticity of some of the admin logins and passwords''; ''According
      to Hudson Rock, the dataset contains 73,932 unique firewall URLs across 194 countries and impacts 21,632 unique domains''; Beaumont: ''credentials
      for roughly 75,000 Fortinet devices''.'
    ground_truth_url: https://www.bleepingcomputer.com/news/security/fortibleed-leak-exposes-fortinet-vpn-credentials-for-73-000-devices/
    fix: Say 'firewall URLs' (not management URLs), 'apparently valid credentials, some confirmed authentic by Beaumont', and attribute the 21,632
      domains and the 194 countries to Hudson Rock and the ~75,000 devices to Beaumont.
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T5
  - where: Update — 2026-10-08T04:58:53Z, paragraph 2, last sentence
    claim: SOCRadar had linked FortiBleed to INC and Lynx in July after reaching both groups' negotiation panels on a server used in the campaign
    defect: (low confidence) The entry repeats BleepingComputer's October wording 'In July', but SOCRadar's own page dates its attribution to
      the Lynx / INC group to an update on June 29 and BleepingComputer reported it on 2026-07-01.
    ground_truth: 'SOCRadar page header: ''[Updated: June 29th 9 AM EST] SOCRadar has attributed FortiBleed to the Lynx / INC ransomware group'';
      BleepingComputer ''FortiBleed credential-theft campaign linked to Lynx ransomware'' dated 2026-07-01.'
    ground_truth_url: https://socradar.io/blog/fortibleed-fortinet-firewalls-compromised/
    fix: Say 'at the end of June (reported by BleepingComputer on 2026-07-01)' or drop the month.
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T5
