- entry: 2026-06-09/cve-2026-50751-check-point-security-gateway-ikev1-vpn-authen
  rows:
  - W1-B
  findings:
  - where: Update — 2026-06-17T05:14:34Z, paragraph 2
    claim: the public PoC follows watchTowr's earlier technical analysis ([Help Net Security, 2026-06-12](https://www.helpnetsecurity.com/2026/06/12/cve-2026-50751-poc-exploit/))
    defect: Help Net Security reports that watchTowr published the technical breakdown and the proof-of-concept client together on 2026-06-12;
      it names no earlier analysis, so the 'earlier ... analysis' sequencing is not in the cited page.
    ground_truth: '''WatchTowr Labs researcher McCaulay Hudson published today a technical breakdown of the flaw ... He also built and published
      a proof-of-concept IKEv1 client'' (Help Net Security, 2026-06-12)'
    ground_truth_url: https://www.helpnetsecurity.com/2026/06/12/cve-2026-50751-poc-exploit/
    fix: Say watchTowr published its technical analysis and a PoC client on 2026-06-12.
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T5
  - where: immediate_action.action and actions[0]
    claim: 'begin forensic lookback from 7 May for VPN sessions established without a matching MFA/password event || actions[0]: "run a forensic
      lookback from 7 May 2026 for VPN sessions established without a matching MFA event"'
    defect: (low confidence) Check Point and NCSC-CH say only to run forensic log audits and configuration reviews from 7 May; Check Point's own
      hunt (sk185033) searches IKEv1 Quick Mode completion ('Key Install') events and the observed attacker infrastructure for 2026-05-07 to 2026-06-05.
      A certificate-authentication bypass leaves no 'password/MFA event' to be missing, so the stated lookback criterion is the entry's own and
      not what the vendor describes.
    ground_truth: 'sk185033: ''Use this query to find a completed IKEv1 Quick Mode exchange: action:"Key Install" AND "Quick Mode completion"
      Any found events prior to the patch installation or mitigation implementation should be treated as suspicious and inspected for unrecognized
      users or source IP addresses.''; recommended range ''at least this period: 2026-05-07 through 2026-06-05''; Check Point blog: ''forensic
      log audits and configuration reviews starting from the earliest observed exploitation date of May 7, 2026''.'
    ground_truth_url: https://support.checkpoint.com/results/sk/sk185033
    fix: 'Replace the criterion with Check Point''s: review gateway logs from 7 May for completed IKEv1 Quick Mode (''Key Install'') events from
      unrecognised users or source IPs.'
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T5
  - where: frontmatter sectors
    claim: 'sectors: [public-sector, finance, telco]'
    defect: (low confidence) No cited source names victim sectors; Check Point says only 'a few dozen targeted organizations globally' and gives
      Taiwan as a geography example.
    ground_truth: '''To date, the observed exploitation has been limited to a few dozen targeted organizations globally.'''
    ground_truth_url: https://blog.checkpoint.com/security/check-point-releases-important-hotfix-for-vulnerabilities-in-deprecated-ikev1-vpn-protocol/
    fix: Treat sectors as exposure context or drop the field values the sources do not name.
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T5
