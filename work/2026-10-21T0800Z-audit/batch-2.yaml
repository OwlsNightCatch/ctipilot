- entry: 2026-06-16/cve-2026-48611-cve-2026-48612-phpbb-unauthenticated-authenti
  rows:
  - W1-B
  findings:
  - where: frontmatter cves[].cvss; summary; body paragraphs 1 and 2; Correction section sentence 1
    claim: 'CVE-2026-48611 (CVSS 9.4 per its discoverer Pentest-Tools.com, 9.8 per heise) ... CVE-2026-48612 (CVSS 8.3), ... 8.0 per heise; Correction:
      ''The main text above scored CVE-2026-48611 at 9.8 via NVD only and described it as an OAuth-implementation flaw'''
    defect: The 9.8 and 8.0 scores heise reports are the CNA's own (phpBB via HackerOne, CVSS 3.0) scores on the CVE record, not an NVD or heise
      assessment; the frontmatter nonetheless carries the discoverer's 9.4 and 8.3 without saying the vendor-side CNA scores differ, and the Correction
      presents 'OAuth-implementation flaw' as a wrong description although the CNA's own description of CVE-2026-48611 uses exactly that wording
      (the flaw sits in the OAuth login-link controller path, reachable 'even when OAuth is not configured').
    ground_truth: 'CVE-2026-48611 CNA (HackerOne): ''Improper authentication checks in the OAuth implementation allow account hijacking even when
      OAuth is not configured or enabled leading to unauthorized access in default installations.'' cvssV3_0 baseScore 9.8 (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H);
      affected 3.3.0 to 3.3.16. CVE-2026-48612 CNA: cvssV3_0 baseScore 8.0 (AV:N/AC:H/PR:L/UI:R/S:C/C:H/I:H/A:H). Pentest-Tools page: ''CVSS v3.1:
      9.4 Critical AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:L''; 8.3 for CVE-2026-48612.'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-48611
    fix: Attribute 9.8 and 8.0 to the CVE record's CNA (phpBB via HackerOne) alongside the discoverer's 9.4 and 8.3, choose one score for the
      machine-read cvss and say which, and reword the Correction so it does not call the CNA's 'OAuth implementation' description wrong (the error
      was the OAuth-disable workaround and the missing exploit detail).
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T5
  legacy_queue_now: pending
  legacy_duty: true
  em_dashes_in_reader_text: none
- entry: 2026-06-16/cve-2026-54420-litespeed-cpanel-whm-plugin-symlink-following
  rows:
  - W1-B
  findings:
  - where: Correction — 2026-09-30T07:18:21Z, sentence 3 (and record summary 'without an exploitation start in May')
    claim: It says only its user-end cPanel plugin is affected, not its WHM plugin, and gives 2026-05-31 as the date it was alerted rather than
      a start of exploitation in May.
    defect: The CVE record's own description (the authority the entry itself references) states the flaw was 'exploited in the wild in May 2026',
      and LiteSpeed's blog thanks cPanel for 'preventing further exploitation on additional servers' after the 2026-05-31 uninstall push; the
      correction frames May exploitation as unsupported and the entry drops it, although the vendor and CVE text imply exploitation began before
      2026-05-31.
    ground_truth: 'CVE-2026-54420 CNA description: ''LiteSpeed cPanel plugin before 2.4.8 (as distributed in LiteSpeed WHM PlugIn before 5.3.2.0)
      mishandles symlinks provided by a user with FTP or web shell access on a shared hosting server running CloudLinux/CageFS, as exploited in
      the wild in May 2026.'' LiteSpeed: ''May 31, 2026: cPanel pushed an uninstall command for the user-end plugin'' and ''preventing further
      exploitation on additional servers''.'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-54420
    fix: Say exploitation is dated to May 2026 by the CVE record and that LiteSpeed gives 2026-05-31 only as the alert date; do not frame May
      exploitation as unsupported.
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T5
  - where: frontmatter cves[CVE-2026-54420].vector / affected / fixed
    claim: 'vector: local; affected: null; fixed: null'
    defect: (low confidence) The CNA CVSS 3.1 vector is AV:N/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H (network), so 'local' contradicts the scored vector
      (the practical precondition is FTP or web-shell access); and the machine-read record leaves affected/fixed null although LiteSpeed gives
      'all user-end plugin versions prior to 2.4.8' and the fix 'WHM Plugin v5.3.2.1 (bundled w/ cPanel plugin v2.4.8)'.
    ground_truth: 'CVE record metrics: ''attackVector: NETWORK ... baseScore: 8.5 ... vectorString: CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H'';
      LiteSpeed: ''poses a risk for all user-end plugin versions prior to 2.4.8''.'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-54420
    fix: Fill affected (user-end plugin < 2.4.8) and fixed (WHM PlugIn 5.3.2.1 / cPanel plugin 2.4.8); set the vector to match the scored vector
      or note that the precondition is authenticated shell/FTP access.
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T5
  - where: body paragraph 1 / actions[0] (fix version)
    claim: fixed in WHM PlugIn version 5.3.2.1 ... upgrading to LiteSpeed WHM PlugIn version 5.3.2.1
    defect: '(low confidence) Minor source divergence not surfaced: the CVE record''s solution says ''Upgrade to the LiteSpeed WHM PlugIn v5.3.2.0
      or higher (which includes the cPanel PlugIn v2.4.8)'' while LiteSpeed''s blog says 5.3.2.1 bundles 2.4.8; the entry correctly follows the
      vendor blog but never notes the 5.3.2.0 figure in the CVE record.'
    ground_truth: 'LiteSpeed blog: ''Jun 1, 2026: We released cPanel plugin v2.4.8 and WHM plugin v5.3.2.1''; CVE record solution: ''v5.3.2.0
      or higher (which includes the cPanel PlugIn v2.4.8)''.'
    ground_truth_url: https://blog.litespeedtech.com/2026/06/01/security-update-for-litespeed-cpanel-plugin-2/
    fix: 'Optional: note the 5.3.2.0 figure in the CVE record, keep 5.3.2.1 as the vendor''s stated version.'
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T5
