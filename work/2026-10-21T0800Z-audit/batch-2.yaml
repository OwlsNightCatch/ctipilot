    claim: 'sectors: [public-sector, technology, defense, healthcare]'
    defect: '(low confidence) None of the cited sources (Fortinet PSIRTs, Defused reporting via Help Net Security / Security Affairs, CCB, NCSC-NL,
      CISA KEV) names victim or exposed sectors; Defused gave no victim details (Help Net Security: ''Additional details about the attacks are
      not available'').'
    ground_truth: '''Additional details about the attacks are not available, and the vendor has yet to confirm in-the-wild exploitation of these
      vulnerabilities.'''
    ground_truth_url: https://www.helpnetsecurity.com/2026/06/16/fortisandbox-vulnerabilities-cve-2026-39813-cve-2026-39808-cve-2026-25089/
    fix: Drop the sector values or mark them as exposure context only.
