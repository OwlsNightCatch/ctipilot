claims:
  - claim_id: 4e46288869
    entry: 2026-05-20/microsoft-dcu-disrupts-fox-tempest-malware-signing-as-a-serv
    surface: "summary"
    kind: frontmatter
    text: "Microsoft's Digital Crimes Unit disrupted Fox Tempest, a malware-signing service active since May 2025 that abused Microsoft Artifact Signing to obtain code-signing certificates valid for 72 hours, seizing its website under a case unsealed in the Southern District of New York and revoking over a thousand certificates. Microsoft links it to Vanilla Tempest (which in some cases deployed Rhysida), Storm-0501, Storm-2561 and Storm-0249, and through cryptocurrency analysis to affiliates delivering INC, Qilin and Akira ransomware. The signed malware posed as AnyDesk, Teams, PuTTY and Webex installers."
  - claim_id: 57e004d02c
    entry: 2026-05-20/microsoft-dcu-disrupts-fox-tempest-malware-signing-as-a-serv
    surface: "record 2026-10-21T08:19:40Z"
    kind: record-summary
    text: "The summary's parenthetical now says Vanilla Tempest deployed Rhysida in some cases, as Microsoft writes, instead of reading as if the actor were the ransomware family. The ATT&CK mapping adds the user-run trojanized installer that Microsoft's Vanilla Tempest case study describes."
  - claim_id: 5f149a3192
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "summary"
    kind: frontmatter
    text: "Elastic Security Labs identified CHAINDROP on 2026-08-04, a new wave of the Shai-Hulud npm worm that began with the compromise of the keyv maintainer and has backdoored over 400 npm packages whose combined reach Elastic puts at more than 1.3 billion monthly downloads, keyv alone at over 600 million. Execution comes from a package.json preinstall hook that downloads the Bun runtime to run an obfuscated 711 KB payload, which harvests over 300 credential patterns (AI-assistant tokens, AWS/GCP/Azure/Alibaba credentials, GitHub tokens, Vault tokens, SSH keys and Kubernetes service-account tokens) and self-propagates only when it finds an npm token that both carries package-write permission and can publish without two-factor authentication. Rather than hardcoding a command-and-control domain, CHAINDROP queries an Ethereum smart contract at runtime to resolve where to send the stolen material, so the operator rotates infrastructure without shipping a new payload. On 2026-10-08 a release of the tensorlake npm SDK carried the same payload family with valid build provenance, and Socket and OX Security describe a dead-man switch that wipes the owner's home directory if the stolen GitHub token is revoked before its persistence is removed."
  - claim_id: e505b356a7
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "actions[0]"
    kind: frontmatter
    text: "Audit every npm publish token your organisation and its maintainers hold and revoke any that can publish without two-factor authentication: that exact token property, not package popularity, is what decides whether the worm spreads from a compromised developer to your packages."
  - claim_id: ce69ff4c1c
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "actions[1]"
    kind: frontmatter
    text: "On any developer workstation or build agent that installed a package from the keyv family since 2026-08-04, or tensorlake@0.5.144 since 2026-10-08, treat the AI-assistant, cloud, GitHub, Vault, SSH and Kubernetes credentials present on that host as disclosed and rotate them; the collector sweeps over 300 credential patterns in one pass, so partial rotation leaves the operator a working set. Isolate the host before revoking its GitHub token, because OX Security reports a switch that wipes the machine when the token is revoked; on a host that ran tensorlake@0.5.144, Socket and OX Security also name a token-monitor persistence (a systemd user unit on Linux, a LaunchAgent on macOS, a scheduled task on Windows), which has to be removed before the token is revoked."
  - claim_id: 4798dfd2ec
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: cited
    text: "It appears under two filenames, one in packages compromised directly from the keyv monorepo and another in packages trojanised during worm propagation, which share the same hash, so the filename indicates which generation of the infection a defender is looking at ("
    urls: ["https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain"]
  - claim_id: 6c7afe45ca
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: cited
    text: "In Visual Studio Code a `folderOpen` task under `tasks.json` runs the dropper when an infected repository is merely opened, and where the stolen credential set includes a GitHub App token the worm commits malicious hooks to up to 50 branches per accessible repository, injecting both a `.claude/settings.json` and a `.vscode/tasks.json` into each, so a developer can be infected by opening the repository ("
    urls: ["https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain"]
  - claim_id: 5ca75ffeeb
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: cited
    text: "OX Security states the malware carries a dead man's switch that deletes the current machine if the stolen GitHub token is revoked, separate from the commit-message string warning developers not to revoke the token, which OX calls an extortion string ("
    urls: ["https://www.ox.security/blog/a-new-infostealer-worm-hits-npm-affecting-keyv-and-cacheable/"]
  - claim_id: 59181963af
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: cited
    text: "Elastic, which does not mention a switch, reads that revoke-warning string as an attempt to intimidate developers not to revoke the token, and its guidance is to revoke all GitHub tokens for impacted machines ("
    urls: ["https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain"]
  - claim_id: 9f826fc603
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: cited
    text: "Unit 42 found that the August sample carries an installer for OS-level token-monitor persistence (a macOS LaunchAgent and a Linux systemd user service) that was decrypted but never invoked, and says to treat OS-level persistence as latent capability, not observed behavior ("
    urls: ["https://unit42.paloaltonetworks.com/chaindrop-npm-worm-analysis/"]
  - claim_id: 654f17785e
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: derived
    text: "In file-creation telemetry, look for `.vscode/tasks.json` and `.claude/settings.json` appearing or changing in repositories that no engineer edited, across many branches: the 50-branch injection is noisy in commit history in a way the install-time compromise is not."
  - claim_id: 61cb49fc41
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: derived
    text: "The separating features are that the runtime is fetched mid-install rather than during provisioning and its directory is removed immediately afterwards; that the process reads credential stores belonging to unrelated tools (cloud CLIs, SSH, Kubernetes, AI assistants) in one burst, which no ordinary build step does; and that outbound blockchain RPC follows the credential reads in the same process tree."
  - claim_id: 04a82c0939
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "section 2026-08-08T04:53:00Z"
    kind: uncited
    text: "In that path it asks the runner for an OIDC token scoped to `npm:registry.npmjs.org` and trades it at npm's own trusted-publishing exchange for a real publish credential: the repository's legitimate release identity becomes the attacker's."
  - claim_id: 14ca981a79
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "section 2026-08-08T04:53:00Z"
    kind: uncited
    text: "The attestation says the tarball was built in that repository by that workflow, and that is true.\" Its guidance follows directly: a package having valid npm provenance does not mean the package is clean, only that the tarball came out of the workflow named in the certificate, and if that workflow is running attacker code then valid provenance is what you should expect to see."
  - claim_id: 3adfc2396f
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "section 2026-08-08T04:53:00Z"
    kind: derived
    text: "**Defender takeaway:** provenance attestation has been the reassuring answer to \"how do we know this build is what it claims to be\", and it still answers that question correctly; it just turns out that was never the question worth asking once the workflow itself is hostile."
  - claim_id: c5a7691386
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "section 2026-10-11T03:39:00Z"
    kind: cited
    text: "Socket and OX Security both tell responders to isolate the host and remove the token-monitor persistence first (a systemd user unit on Linux, a LaunchAgent on macOS, a scheduled task on Windows) and only then revoke and rotate, because revoking while the monitor runs wipes the user's home directory; removing the npm dependency alone does not remove that persistence ("
    urls: ["https://www.socket.dev/blog/tensorlake-compromise", "https://www.ox.security/blog/shai-hulud-here-we-go-again-tensorlake-npm-package-hit-with-malware/"]
