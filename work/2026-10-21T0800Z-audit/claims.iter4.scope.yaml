  - claim_id: 73dd39a552
    entry: 2026-05-10/sophos-beagle-backdoor-distributed-via-fake-claude-ai-site-u
    surface: "record 2026-10-21T08:17:40Z"
    kind: record-summary
    text: "The infostealer tag is removed because Sophos describes Beagle as a simple backdoor with remote-shell and file-management commands, and the technology sector because no source names a targeted sector. Exposure and triage lines are added from Malwarebytes' host checks: a misspelled lookalike install directory, and WScript.exe writing the signed G DATA updater, its DLL and an encrypted data file into the Startup folder and starting the updater with a hidden window. The ATT&CK mapping gains the VBScript dropper, payload decryption, in-memory loading, the self-deleting dropper and the hidden window the main text describes."
  - claim_id: 41b22fd9d5
    entry: 2026-06-11/shinyhunters-oracle-peoplesoft-campaign-gadget-chain-access
    surface: "actions[0]"
    kind: frontmatter
    text: "**Patch every Oracle PeopleSoft instance to a supported PeopleTools release or disable/remove PSEMHUB now (CVE-2026-35273); a WAF rule alone no longer stops this.** UNC6240 (ShinyHunters) bypasses literal-string `/PSEMHUB/` WAF blocks with the URL-encoded `/%50SEMHUB/` path, so a perimeter block that has not been reconfigured to match on the normalized path is not a control. Investigate any instance that was internet-reachable and unpatched at any point since 27 May 2026 for compromise; on any host where a web shell is found, treat the host as compromised and rotate all credentials accessible from the PeopleSoft tier (its service accounts reach PeopleSoft configuration files and database connection strings), starting with hosts where WebLogic runs as `root` or `SYSTEM`."
  - claim_id: 7c12257fae
    entry: 2026-06-11/shinyhunters-oracle-peoplesoft-campaign-gadget-chain-access
    surface: "body"
    kind: cited
    text: "Watch for SSH authentication attempts with the `psoft`/`oracle`/`linuxadm` account names or other administrative accounts ("
    urls: ["https://www.bleepingcomputer.com/news/security/oracle-peoplesoft-servers-hacked-in-shinyhunters-data-theft-attacks/"]
  - claim_id: d253dea518
    entry: 2026-06-11/shinyhunters-oracle-peoplesoft-campaign-gadget-chain-access
    surface: "body"
    kind: cited
    text: ") that originate from a PeopleSoft server toward other internal PeopleSoft hosts: the recovered script sprays SSH credentials at the internal hosts named in the compromised server's `/etc/hosts` and, on each successful session, copies a marker file into the WebLogic and Process Scheduler directories, so a successful logon followed by a file written there is the sequence to correlate ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/shinyhunters-targets-education-sector-oracle-exploit/"]
  - claim_id: 793435dfbd
    entry: 2026-06-11/shinyhunters-oracle-peoplesoft-campaign-gadget-chain-access
    surface: "section 2026-06-12T05:00:10Z"
    kind: uncited
    text: "Mandiant GTIG formally attributes the campaign to UNC6240 (ShinyHunters), dating exploitation 27 May – 9 June, a zero-day for the full window, and details the post-exploitation chain: customised MeshCentral remote-management agents masquerading as Microsoft Azure components for persistence and C2, and a per-victim `_fanout.sh` lateral-movement script spraying SSH credentials against internal hosts harvested from `/etc/hosts` (`T1190`, `T1021.004`)."
