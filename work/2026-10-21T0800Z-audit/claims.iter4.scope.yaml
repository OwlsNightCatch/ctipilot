  - claim_id: 3621ff3d21
    entry: 2026-06-30/cve-2026-8037-progress-kemp-loadmaster-pre-auth-rce-via-unin
    surface: "body"
    kind: cited
    text: "The `escape_quotes()` function in the `access` executable allocates buffers via uninitialized `malloc()` without null-terminating escaped strings; a sprayed JSON payload to `/accessv2` (four single-quotes expanding to 16 bytes) overwrites heap metadata in adjacent freed chunks, and the subsequent `__sprintf_chk()` reads out-of-bounds into attacker-controlled data, reaching code execution as root with no authentication. watchTowr published the full mechanics and words the affected range as GA v7.2.63.1 and older and LTSF v7.2.54.17 and older, when the API is enabled; the fix is GA v7.2.63.2, which switches to `calloc()` with proper null termination ("
    urls: ["https://labs.watchtowr.com/enterprise-tech-in-shell-out-progress-kemp-loadmaster-uninitialized-heap-to-pre-auth-rce-cve-2026-8037/"]
  - claim_id: 3a98e53999
    entry: 2026-06-30/cve-2026-8037-progress-kemp-loadmaster-pre-auth-rce-via-unin
    surface: "body"
    kind: cited
    text: "), and LTSF v7.2.54.18 ("
    urls: ["https://thehackernews.com/2026/06/progress-kemp-loadmaster-flaw-could-let.html"]
  - claim_id: 17bd89f564
