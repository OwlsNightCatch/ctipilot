  - claim_id: cc54dca2b4
    entry: 2026-05-10/sophos-beagle-backdoor-distributed-via-fake-claude-ai-site-u
    surface: "body"
    kind: cited
    text: "**Triage:** the updater is a legitimately signed G DATA binary, so the parent process can look benign to endpoint tools; by inference from Malwarebytes' sandbox and dropper-script analysis, the discriminator is the sequence, in which WScript.exe writes the updater, the DLL it loads from its own directory and an encrypted data file into a user's Startup folder and starts the updater with a hidden window while the freshly installed Claude application opens in the foreground ("
    urls: ["https://www.malwarebytes.com/blog/scams/2026/04/fake-claude-site-installs-malware-that-gives-attackers-access-to-your-computer"]
  - claim_id: 01416e228b
