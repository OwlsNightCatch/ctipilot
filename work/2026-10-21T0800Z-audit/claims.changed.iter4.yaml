  - claim_id: 1357786a2d
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "cves[CVE-2026-44772]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-44772\", \"cvss\": \"9.9\", \"status\": [\"patch-available\"], \"affected\": \"SAP Manufacturing Integration and Intelligence XMII 15.4, 15.5, MII_ADMIN 15.4, 15.5 (SAP Security Note 3765948)\", \"fixed\": \"Per SAP Security Note 3765948; the patch does NOT remove the vulnerable servlet; after applying it, customers must additionally configure and maintain the new \\\"Secure Transformer\\\" system property with a list of allowed hosts for XSL files, which Onapsis says limits the vulnerable servlet to XSL files from those hosts\", \"auth\": \"post-auth\", \"vector\": \"zero-click\"}"
  - claim_id: bc8f1a6612
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "section 2026-08-28T05:00:00Z"
    kind: uncited
    text: "The practical consequence: an SAP Basis team that applied Note 3765948 and recorded the CVSS 9.9 flaw as remediated, without configuring the Secure Transformer allowed-hosts property, has not finished the remediation Onapsis describes: the property is what limits the vulnerable servlet to XSL files from the listed hosts."
  - claim_id: 3eac4ea3da
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "record 2026-10-21T08:10:17Z"
    kind: record-summary
    text: "Exposure, detection and defender-takeaway lines now close the analysis. A Commerce Cloud instance redeployed after exploitation attempts began on 2026-08-14 needs its access logs reviewed from that date to the redeploy, since the redeploy does not undo earlier code execution. The Secure Transformer requirement for Note 3765948 is stated as Onapsis gives it: after the patch, the property limits the vulnerable servlet to XSL files from the listed hosts."
  - claim_id: 4f96c94a6d
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-21T06:20:00Z"
    kind: derived
    text: "**Defender takeaway:** there was still nothing to patch at this point (Microsoft has since shipped an engine fix; see the 2026-09-13 update below), so the change for a defender is that detection content is now writable against a documented chain, and that content should key on the Defender-library load by an unexpected process, not on the exploit's filenames, which are proof-of-concept artefacts (the 2026-08-24 update revises this ranking: LevelBlue puts the creation of phoneinfo.dll in System32 first)."
  - claim_id: d259ee3434
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "record 2026-10-21T08:11:58Z"
    kind: record-summary
    text: "The 2026-08-18 update's hunting advice treated a process tree rooted at the Malware Protection Engine as the signal, with an unsourced triage claim; LevelBlue's mechanism shows the SYSTEM stage runs under wermgr.exe from the QueueReporting task, so that advice now points to the 2026-08-24 detection sequence, and the disclosure-day paragraph drops the same premise. The 2026-08-21 update no longer reads MSRC's temporal CVSS metrics as recording the fix and points to LevelBlue's ranking of the signals, and the 2026-09-13 update drops the same reading of the metrics."
