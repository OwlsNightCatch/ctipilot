    text: "VulnCheck reported on 2026-07-28 that it has observed attackers gaining initial access to Langflow with exploits targeting CVE-2026-0769 and a second Langflow flaw, CVE-2026-5027, then harvesting credentials, deploying cryptominers and attempting lateral movement, without splitting that activity between the two, and that neither flaw is in CISA's Known Exploited Vulnerabilities catalog. CVE-2026-0769 is a Zero Day Initiative 0-day advisory: an eval injection in Langflow's eval_custom_component_code function reachable with no authentication (CVSS 9.8), for which ZDI documents no fixed version and names restricting interaction with the product as the only mitigation. A KEV-driven patch process will not surface this, and the KEV-listed CVE-2026-0770, the next CVE number, is a different vulnerability."
