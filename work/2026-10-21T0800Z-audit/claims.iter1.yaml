    surface: "body"
    kind: derived
    text: "Where a public-sector organisation runs coding agents in CI, the questions to ask are whether multiple agent passes share a workspace, whether the agent's instruction file is treated as protected metadata or as ordinary repository content, and (for the two patched products) whether the versions in use are past the fixed releases."
