  - claim_id: 5f149a3192
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "summary"
    kind: frontmatter
    text: "Elastic Security Labs identified CHAINDROP on 2026-08-04, a new wave of the Shai-Hulud npm worm that began with the compromise of the keyv maintainer and has backdoored over 400 npm packages whose combined reach Elastic puts at more than 1.3 billion monthly downloads, keyv alone at over 600 million. Execution comes from a package.json preinstall hook that downloads the Bun runtime to run an obfuscated 711 KB payload, which harvests over 300 credential patterns (AI-assistant tokens, AWS/GCP/Azure/Alibaba credentials, GitHub tokens, Vault tokens, SSH keys and Kubernetes service-account tokens) and self-propagates only when it finds an npm token that both carries package-write permission and can publish without two-factor authentication. Rather than hardcoding a command-and-control domain, CHAINDROP queries an Ethereum smart contract at runtime to resolve where to send the stolen material, so the operator rotates infrastructure without shipping a new payload. On 2026-10-08 a release of the tensorlake npm SDK carried the same payload family with valid build provenance, and Socket and OX Security describe a dead-man switch that wipes the owner's home directory if the stolen GitHub token is revoked before its persistence is removed."
  - claim_id: e505b356a7
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "actions[0]"
    kind: frontmatter
    text: "Audit every npm publish token your organisation and its maintainers hold and revoke any that can publish without two-factor authentication: that exact token property, not package popularity, is what decides whether the worm spreads from a compromised developer to your packages."
  - claim_id: ce69ff4c1c
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "actions[1]"
    kind: frontmatter
    text: "On any developer workstation or build agent that installed a package from the keyv family since 2026-08-04, or tensorlake@0.5.144 since 2026-10-08, treat the AI-assistant, cloud, GitHub, Vault, SSH and Kubernetes credentials present on that host as disclosed and rotate them; the collector sweeps over 300 credential patterns in one pass, so partial rotation leaves the operator a working set. Isolate the host before revoking its GitHub token, because OX Security reports a switch that wipes the machine when the token is revoked; on a host that ran tensorlake@0.5.144, Socket and OX Security also name a token-monitor persistence (a systemd user unit on Linux, a LaunchAgent on macOS, a scheduled task on Windows), which has to be removed before the token is revoked."
  - claim_id: 4798dfd2ec
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: cited
    text: "It appears under two filenames, one in packages compromised directly from the keyv monorepo and another in packages trojanised during worm propagation, which share the same hash, so the filename indicates which generation of the infection a defender is looking at ("
    urls: ["https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain"]
  - claim_id: 6c7afe45ca
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: cited
    text: "In Visual Studio Code a `folderOpen` task under `tasks.json` runs the dropper when an infected repository is merely opened, and where the stolen credential set includes a GitHub App token the worm commits malicious hooks to up to 50 branches per accessible repository, injecting both a `.claude/settings.json` and a `.vscode/tasks.json` into each, so a developer can be infected by opening the repository ("
    urls: ["https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain"]
  - claim_id: 5ca75ffeeb
    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "body"
    kind: cited
    text: "OX Security states the malware carries a dead man's switch that deletes the current machine if the stolen GitHub token is revoked, separate from the commit-message string warning developers not to revoke the token, which OX calls an extortion string ("
