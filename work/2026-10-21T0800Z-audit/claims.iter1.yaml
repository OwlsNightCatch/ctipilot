    entry: 2026-09-18/brevo-cloudflare-worker-clickfix-supply-chain
    surface: "summary"
    kind: frontmatter
    text: "Brevo (CRM/email platform, formerly Sendinblue) confirmed a stolen long-lived Cloudflare API key let an attacker deploy a malicious edge Worker that rewrote Brevo's own pages from 15:01 to 20:30 UTC on 2026-09-14 and, from 16:07 UTC, three customer-embedded widget scripts, serving a ClickFix clipboard-paste lure and a WordPress administrator-backdoor plugin without modifying any origin file. Sansec says Brevo served malware to visitors of more than 100,000 customer sites, a figure it links to a public source-code search for pages mentioning Brevo's domains. BleepingComputer reports the same research as up to 100,000 sites using the affected components."
  - claim_id: 3ceef995e3
    entry: 2026-09-18/brevo-cloudflare-worker-clickfix-supply-chain
    surface: "actions[0]"
    kind: frontmatter
    text: "On every WordPress site that loaded a Brevo forms, Conversations or SDK script on 2026-09-14 and had an administrator visit while logged in, check for any plugin installed or activated that day and compare the plugin directory on disk with the admin plugin list, because the known backdoor hides from that list and copies itself into the must-use-plugins directory. Remove any such plugin, invalidate all administrator sessions, change administrator passwords and review administrator accounts, because its hardcoded key mints admin logins without a password."
