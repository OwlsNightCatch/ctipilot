    text: "In the ROOFDECK variants Zscaler describes, Nostr is the last of three resolvers, after the locally stored address and a signed, encrypted Pastebin address, and its profile metadata is used \"to locate the current dead-drop Pastebin URL\" rather than the server itself ("
    urls: ["https://www.zscaler.com/blogs/security-research/suspected-tradertraitor-group-uses-trojanized-terraform-provider-deliver"]
