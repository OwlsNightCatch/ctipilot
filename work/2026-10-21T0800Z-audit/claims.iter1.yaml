  - claim_id: 3e59ae281a
    entry: 2026-05-09/cve-2026-44128-et-al-seppmail-secure-email-gateway-cvss-9-3
    surface: "summary"
    kind: frontmatter
    text: "NCSC-CH's advisory of 2026-05-08 lists six CVEs (CVSS 6.9 to 9.3) in the SEPPmail Secure E-Mail Gateway as fixed in 15.0.4, the release that removed development test endpoints left active in the beta GINA v2 interface, with the unauthenticated code execution flaw CVE-2026-44128 (9.3) already fixed in 15.0.2.1. InfoGuard's write-up traces that flaw to Perl eval(), places the insecure deserialization fix (CVE-2026-44126) in 15.0.3, and adds the LFT path traversal CVE-2026-2743 (10.0 per The Hacker News). No exploitation is reported."
  - claim_id: 99ed912a53
    entry: 2026-05-09/cve-2026-44128-et-al-seppmail-secure-email-gateway-cvss-9-3
    surface: "record 2026-10-21T08:07:56Z"
    kind: record-summary
    text: "The summary now attributes each fix version to the source that states it: NCSC-CH's advisory gives 15.0.4 for the set and 15.0.2.1 for CVE-2026-44128, while the 15.0.3 fix for CVE-2026-44126 and the Perl eval() mechanism come from InfoGuard. The body already carried these attributions."
  - claim_id: 9b3a0bbded
    entry: 2026-05-10/sophos-beagle-backdoor-distributed-via-fake-claude-ai-site-u
    surface: "body"
    kind: cited
    text: "The trojanized installer puts a working copy of Claude under a misspelled `Cluade` directory beneath `C:\\Program Files (x86)\\Anthropic\\Claude\\`, which Malwarebytes gives as a check alongside the sideloading files in the user's Startup folder ("
    urls: ["https://www.malwarebytes.com/blog/scams/2026/04/fake-claude-site-installs-malware-that-gives-attackers-access-to-your-computer"]
  - claim_id: d4f65429c7
    entry: 2026-05-10/sophos-beagle-backdoor-distributed-via-fake-claude-ai-site-u
    surface: "body"
    kind: cited
    text: "**Detection:** in file-creation and process telemetry, a signed G DATA antivirus updater, an encrypted data file and a DLL written together into a user's Startup folder after the fake installer's MSI runs ("
    urls: ["https://www.sophos.com/en-us/blog/donuts-and-beagles-fake-claude-site-spreads-backdoor"]
  - claim_id: 4905c984cc
    entry: 2026-05-10/sophos-beagle-backdoor-distributed-via-fake-claude-ai-site-u
    surface: "body"
    kind: cited
    text: "**Triage:** the updater is a legitimately signed G DATA binary, so the parent process can look benign to endpoint tools; the discriminator is the sequence, in which WScript.exe writes the updater, the DLL it loads from its own directory and an encrypted data file into a user's Startup folder and starts the updater with a hidden window while the freshly installed Claude application opens in the foreground ("
    urls: ["https://www.malwarebytes.com/blog/scams/2026/04/fake-claude-site-installs-malware-that-gives-attackers-access-to-your-computer"]
  - claim_id: 01416e228b
    entry: 2026-05-10/sophos-beagle-backdoor-distributed-via-fake-claude-ai-site-u
    surface: "body"
    kind: derived
    text: "**Exposure:** Windows hosts where a user ran a Claude installer taken from a lookalike site or an ad rather than the official download page."
  - claim_id: 2aecb5d013
    entry: 2026-05-10/sophos-beagle-backdoor-distributed-via-fake-claude-ai-site-u
    surface: "section 2026-10-21T08:17:40Z"
    kind: cited
    text: "Its VBScript dropper, run by WScript.exe, copies the three sideloading files into the user's Startup folder and starts the signed G DATA updater with a hidden window, and a signed parent like this can look benign to endpoint tools ("
    urls: ["https://www.malwarebytes.com/blog/scams/2026/04/fake-claude-site-installs-malware-that-gives-attackers-access-to-your-computer"]
  - claim_id: af6dee4372
    entry: 2026-05-10/sophos-beagle-backdoor-distributed-via-fake-claude-ai-site-u
    surface: "section 2026-10-21T08:17:40Z"
    kind: uncited
    text: "Malwarebytes gives a host check for the trojanized installer: it puts a working copy of Claude under a misspelled `Cluade` directory beneath `C:\\Program Files (x86)\\Anthropic\\Claude\\`."
  - claim_id: 2b83d5856b
    entry: 2026-05-10/sophos-beagle-backdoor-distributed-via-fake-claude-ai-site-u
    surface: "record 2026-10-21T08:17:40Z"
    kind: record-summary
    text: "The infostealer tag is removed because Sophos describes Beagle as a simple backdoor with remote-shell and file-management commands, and the technology sector because no source names a targeted sector. Exposure and triage lines are added from Malwarebytes' host checks: the misspelled Cluade install directory, and WScript.exe writing the signed G DATA updater, its DLL and an encrypted data file into the Startup folder and starting the updater with a hidden window. The ATT&CK mapping gains the VBScript dropper, payload decryption, in-memory loading, the self-deleting dropper and the hidden window the main text describes."
