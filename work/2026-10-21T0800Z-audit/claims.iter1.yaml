    text: "**Detection:** in mail-flow telemetry, inbound messages styled as Microsoft 365 or OneDrive voicemail notifications that carry a ZIP archive, an HTML attachment or a link, and later a burst of outbound mail from one mailbox to many of its contacts, the chain phishing NCSC describes ("
