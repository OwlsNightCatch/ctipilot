    entry: 2026-06-11/shinyhunters-oracle-peoplesoft-campaign-gadget-chain-access
    surface: "actions[0]"
    kind: frontmatter
    text: "**Patch every Oracle PeopleSoft instance to a supported PeopleTools release or disable/remove PSEMHUB now (CVE-2026-35273); a WAF rule alone no longer stops this.** UNC6240 (ShinyHunters) bypasses literal-string `/PSEMHUB/` WAF blocks with the URL-encoded `/%50SEMHUB/` path, so a perimeter block that has not been reconfigured to match on the normalized path is not a control. Investigate any instance that was internet-reachable and unpatched at any point since 27 May 2026 for compromise; on any host where a web shell is found, treat the host as compromised and rotate all credentials accessible from the PeopleSoft tier (its service accounts reach PeopleSoft configuration files and database connection strings), starting with hosts where WebLogic runs as `root` or `SYSTEM`."
  - claim_id: 9113eebf7e
    entry: 2026-06-11/shinyhunters-oracle-peoplesoft-campaign-gadget-chain-access
    surface: "body"
    kind: cited
    text: "Watch for SSH authentication attempts with the `psoft`/`oracle`/`linuxadm` account names or other administrative accounts that originate from a PeopleSoft server toward other internal PeopleSoft hosts: the recovered script sprays SSH credentials at the internal hosts named in the compromised server's `/etc/hosts` and, on each successful session, copies a marker file into the WebLogic and Process Scheduler directories, so a successful logon followed by a file written there is the sequence to correlate ("
