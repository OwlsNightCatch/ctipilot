  - claim_id: 184f28d90e
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "summary"
    kind: frontmatter
    text: "Ivanti disclosed CVE-2026-104935 on 2026-10-13, an authentication bypass in Connect Secure that lets a remote unauthenticated attacker run commands, and says it is aware of limited exploitation; CISA listed it in KEV the same day. Volexity found a cluster it calls UTA0576 chaining it with a root escalation that Ivanti had not fixed when Volexity reported (a separate record, CVE-2026-111357, now covers that step), patching library code in memory only so Ivanti's Integrity Checker Tool sees no file change, and going after the appliance's Active Directory service account, LAPS passwords and BitLocker recovery keys. Fixed builds are 25.1.1.2, 25.1.3.1 and 22.8R2.5 (Ivanti's own description of the flaw and Rapid7 place 25.1.3.0 outside the affected range, while CERT-FR counts it as affected); a patched appliance that was exposed still needs a compromise check, and CERT-FR says it knows of lateral movement using the LDAP and Active Directory secrets stored on the appliance and tells owners to isolate and preserve it before any reset."
