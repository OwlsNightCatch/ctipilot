    entry: 2026-09-17/cve-2026-76460-cisco-ise-auth-bypass-root-rce
    surface: "body"
    kind: cited
    text: "Cisco disclosed CVE-2026-76460 (CVSS 3.1 10.0, AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H) on 2026-09-16: an unauthenticated, remote attacker can bypass authentication on an API endpoint of Cisco Identity Services Engine (ISE) and ISE Passive Identity Connector (ISE-PIC) due to insufficient authentication control, affecting ISE and ISE-PIC releases before the fixed patch levels \"regardless of device configuration\" ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-ISE-ABP-VNSW7Tn5"]
  - claim_id: 6b1b5f1e14
    entry: 2026-09-17/cve-2026-76460-cisco-ise-auth-bypass-root-rce
    surface: "body"
    kind: cited
    text: "A sibling flaw, CVE-2026-76423 (CVSS 10.0, also unauthenticated and affecting ISE and ISE-PIC before the same fixed patch levels \"regardless of device configuration\"), removes the same authentication boundary via a separate API endpoint, letting an attacker read or modify ISE configuration and identity data with administrative privileges; Cisco states it is \"not aware of any public announcements or malicious use\" of this second flaw as of disclosure, but it shares the same fixed-release schedule ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-ise-multi-hrP9jQSQ"]
  - claim_id: c9c04d20eb
    entry: 2026-09-17/cve-2026-76460-cisco-ise-auth-bypass-root-rce
    surface: "body"
    kind: cited
    text: "Cisco supplies a concrete first check: review each node's `access.log` (or a decrypted debug-log bundle at `./ise/logs/apigateway/access.log.*.gz`) for suspicious usernames on the API endpoint; Cisco's non-exhaustive example filters the output of `show logging application ise-kong/access.log` for the suspicious username ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-ISE-ABP-VNSW7Tn5"]
  - claim_id: d1eb1ff583
    entry: 2026-09-17/cve-2026-76460-cisco-ise-auth-bypass-root-rce
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** patch every ISE/ISE-PIC node and restrict management-plane reachability via ACLs immediately: there is no other mitigation, and Cisco's own guidance is to distrust the appliance's own logs for ruling out compromise once root access is possible."
  - claim_id: aa6ef1c68e
    entry: 2026-09-17/cve-2026-76460-cisco-ise-auth-bypass-root-rce
    surface: "body"
    kind: derived
    text: "**Triage:** a legitimate administrative session against the ISE API originates from an authenticated, known management source; the discriminator here is that exploitation reaches the API without any authentication at all, so any successful request against the affected endpoint from outside expected management-plane sources is itself the signal, and because a root-level attacker can edit or delete `access.log` entries, an apparently clean on-box log is not evidence of an intact device."
