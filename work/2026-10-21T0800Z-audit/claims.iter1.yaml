    text: "On any Artifactory instance that was internet-reachable and unpatched since 15 August 2026, search access logs for an unauthenticated POST to /access/api/v1/aws/token/ followed shortly afterwards by a POST to /access/api/v1/tokens from the same client (in some cases Wiz saw an admin account created within five minutes of the first request); on a hit with both answered HTTP 200, treat the instance as compromised and reset the Access token signing key and certificate before relying on the upgrade."
