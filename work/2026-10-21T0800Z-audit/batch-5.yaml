- entry: 2026-09-21/the-gentlemen-open-directory-vhdx-backup-ntds-theft
  rows:
  - W1-B
  findings:
  - where: headline; summary; body paragraph 2 first sentence
    claim: credential theft from a mounted backup image rather than the live domain controller; extracts ntds.dit and SAM not from the live domain
      controller but from a CIFS-mounted VHDX backup image; rather than dumping credentials from a live, monitored domain controller
    defect: '(low confidence) The contrast with the live domain controller is the entry''s own inference: Talos documents only the extraction
      from the mounted VHDX backups and says nothing about whether the live DC was also dumped (it also lists Zerologon traces in Phase 4).'
    ground_truth: 'Talos Phase 6: ''the threat actor mounted a backup share via CIFS at /mnt/Backup and inspected the Windows file system within
      VHDX backups ... the copying of ntds.dit, SAM, and SYSTEM. The actor then used Impacket''s secretsdump.py to extract credentials and password
      hashes from the collected ntds.dit and SAM files''; no statement that the live DC was not used.'
    ground_truth_url: https://blog.talosintelligence.com/ransomware-incidents-in-japan-in-the-first-half-of-2026/
    fix: Drop the 'rather than / not from the live domain controller' contrast or mark it as the entry's reading ('the history shows credentials
      taken from a mounted backup image; Talos does not say whether the live DC was also dumped').
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T8a
  - where: body paragraph 1 (nmap/masscan sentence; Zerologon/MS17-010 sentence), paragraph 2 (rclone/Wasabi sentence; AdaptixC2 sentence); summary
      clause on Wasabi
    claim: then ran nmap and masscan against externally exposed hosts ...; the command history shows attempted exploitation of CVE-2020-1472 (Zerologon)
      and the MS17-010 vulnerabilities ...; uploaded concurrently ... to Wasabi cloud storage via `rclone`; Command and control ran on the open-source
      AdaptixC2 post-exploitation framework
    defect: 'Four statements drop Talos''s hedge: Talos writes ''appear to have used'', ''traces suggesting the exploitation'', ''traces indicating
      that the VHDX files were ... transferred to cloud storage services such as Wasabi'' and ''may be using it in real-world attacks''.'
    ground_truth: 'Talos: ''They appear to have used Masscan and Nmap''; ''We also observed traces suggesting the exploitation of CVE-2020-1472
      (Zerologon) and the vulnerabilities associated with MS17-010''; ''We also identified traces indicating that the VHDX files were compressed
      with zstd and transferred to cloud storage services such as Wasabi using rclone''; ''The Gentlemen may be using it in real-world attacks.'''
    ground_truth_url: https://blog.talosintelligence.com/ransomware-incidents-in-japan-in-the-first-half-of-2026/
    fix: Restore the hedges ('appear to have', 'traces suggesting', 'traces indicating', 'may be using').
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T8a
  legacy_queue_now: not-legacy
  legacy_duty: false
  em_dashes_in_reader_text: none
- entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
  rows:
  - W1-B
  findings:
  - where: summary, last sentence (after the 2026-10-09 update)
    claim: The second-stage backdoor resolves its command-and-control address by reading an operator profile's public "website" field from the
      Nostr decentralized relay network.
    defect: 'Placed after the sentence on Zscaler''s trojanized-provider variants, it reads as universal, but it is SentinelLabs'' sample only:
      Zscaler reports ROOFDECK resolves through a local configuration, then an RSA-signed Pastebin dead drop, with Nostr profile metadata only
      a fallback that locates the Pastebin URL (the entry''s own Update section says the order differs).'
    ground_truth: 'Zscaler: ''If the Pastebin lookup fails, ROOFDECK can query Nostr profile metadata''; layered design ''1. Use the locally stored
      address. 2. Retrieve a signed and encrypted address from Pastebin. 3. Use Nostr metadata to locate the current dead-drop Pastebin URL.''
      SentinelLabs: ''When found, it reads the website field of the profile and uses that as its C2 URL.'''
    ground_truth_url: https://www.zscaler.com/blogs/security-research/suspected-tradertraitor-group-uses-trojanized-terraform-provider-deliver
    fix: Reword to 'In the sample SentinelLabs analysed, the second-stage backdoor reads the "website" field of a Nostr operator profile as its
      C2 URL; Zscaler's variants try a local configuration and a signed Pastebin dead drop first and use Nostr only as a fallback.'
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T8a
  legacy_queue_now: not-legacy
  legacy_duty: false
  em_dashes_in_reader_text: none
