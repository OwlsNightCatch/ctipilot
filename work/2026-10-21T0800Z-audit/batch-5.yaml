- entry: 2026-09-23/cve-2026-93952-arista-velocloud-orchestrator-exploited
  rows:
  - W1-B
  findings:
  - where: body, first paragraph (and cves[].affected)
    claim: 'Exposure is configuration-dependent: only VCOs with certificate-based Edge-to-VCO authentication configured are affected.'
    defect: Arista's 'Affected Software' list is by version only; the certificate-based authentication condition is stated for exposure/exploitation,
      not as a boundary of 'affected'. The entry conflates the two, and cves[].affected appends the configuration to the version ranges.
    ground_truth: 'Arista, ''Required Configuration for Exploitation'': "VCO is exposed if certificate based authentication from the VeloCloud
      Edge to VeloCloud Orchestrator (VCO) is configured." ''Affected Software'' lists ''5.2.3.15 and below releases in the 5.2.x train'', ''6.1.3.7
      and below'', ''6.4.2.7 and below'', ''7.0.0.2 and below'' with no configuration qualifier.'
    ground_truth_url: https://www.arista.com/en/support/advisories-notices/security-advisory/24765-security-advisory-0183
    fix: Say 'exposed' instead of 'affected' ('only VCOs with certificate-based Edge authentication configured are exposed') and keep cves[].affected
      to the version ranges, with the configuration condition as a separate clause.
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T8b
  - where: body, first paragraph
    claim: a separate, unrelated VCO command-injection flaw disclosed two months earlier
    defect: (low confidence) 'unrelated' is not stated by either cited source; both only call it a different/separate flaw.
    ground_truth: 'The Hacker News 2026-09-22: "The affected releases include those that fixed a different VCO flaw, which Arista reported as
      exploited in July."'
    ground_truth_url: https://thehackernews.com/2026/09/new-cvss-100-velocloud-orchestrator.html
    fix: Drop 'unrelated' (keep 'separate').
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T8b
  legacy_queue_now: not-legacy
  legacy_duty: false
  em_dashes_in_reader_text:
  - title (1)
  - summary (1)
  - actions[1]
  - cves[CVE-2026-93952].affected
  - body (3)
- entry: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
  rows:
  - W1-B
  findings:
  - where: updates[] record 2026-09-25T04:30:00Z, summary
    claim: Anthropic identified and banned the account behind Hermes's use of an earlier Claude model in this campaign, and Cloudflare took down
      the operator's staging infrastructure; the operator rebuilt within hours and the campaign continued.
    defect: The only source for the update (Computing UK) says Cloudflare shut down 'servers connected to the operation' and that researchers
      said the attacker 'repeatedly rebuilt the infrastructure'. Neither Computing UK, Cybersecurity News nor Gambit's report says 'staging' infrastructure
      or 'within hours'. The section body is accurate; only the record summary overstates.
    ground_truth: 'Computing UK 2026-09-23: "Cloudflare confirmed it had shut down servers connected to the operation, but researchers said the
      attacker repeatedly rebuilt the infrastructure and continued the attacks."'
    ground_truth_url: https://www.computing.co.uk/news/2026/security/ai-agents-used-to-steal-credit-card-records
    fix: 'The record is append-only: leave it, or state the narrower wording in a later improvement record (''Cloudflare shut down servers connected
      to the operation; researchers said the attacker repeatedly rebuilt the infrastructure'').'
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T8b
  legacy_queue_now: not-legacy
  legacy_duty: false
  em_dashes_in_reader_text: none
- entry: 2026-09-23/virtualizor-billing-hook-unauth-root-rce
  rows:
  - W1-B
  - W1-E
  findings:
  - where: cves[].cvss (all three records) and Correction 2026-09-30T06:56:15Z
    claim: 'cvss: null (and the Correction: "The scores shown earlier are not on that page and are no longer shown.")'
    defect: 'The 2026-09-30 correction removed CVSS values because the VulnCheck blog post does not carry them, but the per-CVE authority (VulnCheck
      as CNA) publishes them, and they equal the values the entry had before. cvss: null now hides authoritative scores.'
    ground_truth: 'CVE.org records published by VulnCheck: CVE-2026-43641 CVSS 3.1 9.8 / CVSS 4.0 9.3; CVE-2026-43642 CVSS 3.1 8.1 / CVSS 4.0
      9.2; CVE-2026-43643 CVSS 3.1 7.5 / CVSS 4.0 8.7. VulnCheck advisory page for CVE-2026-43643: ''CVSS: 8.7''.'
    ground_truth_url: https://www.vulncheck.com/advisories/softaculous-virtualizor-authorization-bypass-via-billing-module-handler
    fix: Restore the scores in cves[].cvss citing the VulnCheck advisory pages / CNA records (add them as sources) and reword the Correction to
      say the blog post, not the CNA record, lacks them.
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T8b
  - where: body, paragraph 2 (CVE-2026-43643)
    claim: CVE-2026-43643 (CWE-639 authorization bypass through a user-controlled key)
    defect: The entry follows the CWE in the blog post's table; the per-CVE advisory and CNA record classify it differently.
    ground_truth: 'VulnCheck advisory for CVE-2026-43643: ''CWE: CWE-862 Missing Authorization'' (blog table: ''CWE-639 (+306)'').'
    ground_truth_url: https://www.vulncheck.com/advisories/softaculous-virtualizor-authorization-bypass-via-billing-module-handler
    fix: Name CWE-862 per the CVE record (or state that the blog table says CWE-639 and the CVE record CWE-862).
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T8b
  - where: body, paragraph 2 (CVE-2026-43642)
    claim: no working exploitation gadget chain exists in the stock code today
    defect: '(low confidence) Stronger than the source: VulnCheck says no chain was demonstrated, and its own CVE record text speaks of ''available
      POP chains''.'
    ground_truth: 'VulnCheck blog: "so a working POP chain is not demonstrated in the stock code." CVE record: "enabling exploitation of available
      POP chains to achieve remote code execution as root."'
    ground_truth_url: https://www.vulncheck.com/blog/virtualizor-billing-hook-unauthenticated-root-rce
    fix: Say 'VulnCheck did not demonstrate a working gadget chain in the stock code'.
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T8b
  - where: summary / body (exploit availability)
    claim: its post says neither whether that module is public nor whether it observed in-the-wild exploitation
    defect: (low confidence) True of the post, but omits that CISA's SSVC data on the CVE record already lists a public proof of concept for the
      root flaw (2026-09-23).
    ground_truth: 'CISA-ADP SSVC on CVE-2026-43641 (timestamp 2026-09-23T15:40:21Z): Exploitation: poc, Automatable: yes, Technical Impact: total.
      (CVE-2026-43642 and -43643: Exploitation none.)'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-43641
    fix: 'Add that CISA''s SSVC entry records Exploitation: poc for CVE-2026-43641 while the post itself is silent on public release and in-the-wild
      use.'
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T8b
  - source: W1-E item 18 (2026-10-11T1307Z-audit, residual, F11)
    finding: '(low confidence) Carry-over: the framing sentence ("Virtualizor sits outside the typical public-administration estate") carries
      no citation and no cited source states it; it is analyst judgement. Advisory only: leave or soften.'
    earlier_disposition: 'Declined: relevance framing is the profile''s call, not a source claim.'
