- entry: 2026-09-21/conference-phishing-rogue-root-ca-mitm-persistence
  rows:
  - W1-B
  findings:
  - where: summary and body paragraph 4 first sentence
    claim: The most novel component is a payload that hollows MsBuild.exe ... / The most novel component is that second payload, the TLS-intercepting
      local proxy.
    defect: (low confidence) 'Most novel' is stated as fact; Huntress's recap says only that Jon 'deemed the second payload the most interesting'
      and 'walked through more novel tradecraft'.
    ground_truth: 'Recap: ''Jon deemed the second payload the most interesting, and begrudgingly gave props to the threat actor'' and ''Jon walked
      through more novel tradecraft that he and audience members described as "terrifying."'''
    ground_truth_url: https://www.huntress.com/blog/google-doc-sidebar-malware-mac-windows
    fix: Attribute the judgement ('Huntress's analysts singled out the second payload as the most interesting') or drop the superlative.
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T8a
  - where: techniques[] (T1546.015)
    claim: T1546.015 (Component Object Model Hijacking)
    defect: (low confidence) The source says NetSupport Manager 'registers its own COM object' for persistence; it describes no hijacking of an
      existing COM registration, which is what T1546.015 names.
    ground_truth: 'Huntress write-up: ''NetSupport carries the persistence for all three. It installs a kernel-mode keyboard filter driver ...,
      registers it as a service ..., modifies Winlogon, and registers its own COM object.'''
    ground_truth_url: https://www.huntress.com/blog/defcon-phishing-google-doc-malware
    fix: Remove T1546.015 or replace it with the mappings the page supports (T1543.003 for the service, T1547.004 for the Winlogon modification),
      checked against the pinned dataset.
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T8a
