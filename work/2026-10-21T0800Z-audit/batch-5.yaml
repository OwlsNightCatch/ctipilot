entries:
- entry: 2026-09-19/cisa-kev-linux-kernel-ktls-af-alg-ebtables-snat
  rows:
  - W1-B
  findings:
  - where: cves[CVE-2026-53266].affected
    claim: ≤ 6.18.35; branch-dependent, see body
    defect: The affected range stops at 6.18.35 although the kernel CNA record lists the 7.0 series as affected until 7.0.13 (the 2026-09-30 correction
      added 7.0.13 to fixed but not the affected bound), so a 7.0.0 to 7.0.12 host reads as outside the range.
    ground_truth: 'Kernel CNA record for CVE-2026-53266: versions 5.10 ''affected'' (defaultStatus affected), ''7.0.13 lessThanOrEqual 7.0.* unaffected'',
      ''7.1 original_commit_for_fix unaffected'', i.e. 7.0.0-7.0.12 affected.'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-53266
    fix: Set affected to '5.10 to 6.18.35 and 7.0.0 to 7.0.12; branch-dependent, see body'.
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T8a
  - where: 'body paragraph 1, ''Fixed stable kernels, each confirmed in kernel.org''s release ChangeLog: CVE-2025-39682 in ... ; CVE-2025-39964
      in ... ; CVE-2026-53266 in ...'' (three clauses, 17 ChangeLog links)'
    claim: Fixed stable kernels, each confirmed in kernel.org's release ChangeLog
    defect: Fixed versions are all correct, but the cited ChangeLogs never name the CVE ids; they carry only the fix commit titles, so the id-to-fix
      binding is not on the cited page. It rests on the kernel CNA record, which is not cited.
    ground_truth: 'Each of the 17 ChangeLogs carries the matching commit title (''tls: fix handling of zero-length records on the rx_list'' in
      6.1.149/6.6.103/6.12.44/6.16.4; ''crypto: af_alg - Disallow concurrent writes in af_alg_sendmsg'' in 5.10.245/5.15.194/6.1.154/6.6.108/6.12.49/6.16.9;
      ''netfilter: bridge: make ebt_snat ARP rewrite writable'' in 5.10.259/5.15.210/6.1.176/6.6.143/6.12.94/6.18.36/7.0.13) with release dates
      2025-08-28, 2025-09-25, 2025-10-02 and 2026-06-19 as listed. The kernel CNA records (assigner Linux) list exactly those fixed versions per
      CVE; the ChangeLogs contain no ''CVE-'' string for these ids.'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2025-39682 (same for CVE-2025-39964 and CVE-2026-53266; api.osv.dev/v1/vulns/CVE-2025-39682
      also carries the record)
    fix: Say the ChangeLogs carry the fix commits and cite OSV (or the stable commit pages the CVE record references) as the page that names each
      id, or soften 'confirmed' to 'the fix commits appear in'.
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T8a
  - where: sources[] dates and inline labels for the three Red Hat pages
    claim: '[Red Hat Product Security, 2026-09-19](https://access.redhat.com/security/cve/cve-2025-39682) (and the -39964 and -53266 pages)'
    defect: (low confidence) The label dates the three Red Hat pages 2026-09-19, but that is only the date of the exploit-flag update THN reports;
      the advisories' own public dates are 2025-09-05, 2025-10-13 and 2026-06-01, so a reader can take the label as the advisory's publication
      date. The statement the labels support (public exploits exist) is carried by each page's exploit flag, which the plain-text extract does
      not show.
    ground_truth: 'Red Hat security data API: public_date 2025-09-05T00:00:00Z (CVE-2025-39682), 2025-10-13T00:00:00Z (CVE-2025-39964), 2026-06-01T12:00:00Z
      (CVE-2026-53266); page data field_cve_exploit_known true on all three, rendering ''This CVE is high risk and there are known public exploits
      leveraging this vulnerability. Address this vulnerability with high priority.'''
    ground_truth_url: https://access.redhat.com/hydra/rest/securitydata/cve/CVE-2025-39682.json
    fix: Label the pages 'updated 2026-09-19' (or give the public dates) and state that the exploit statement is the page's known-exploit banner.
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T8a
  legacy_queue_now: not-legacy
  legacy_duty: false
  em_dashes_in_reader_text: none
