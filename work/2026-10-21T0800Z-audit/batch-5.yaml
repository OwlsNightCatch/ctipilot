  findings:
  - where: techniques[] (T1027)
    claim: T1027 (Obfuscated Files or Information)
    defect: (low confidence) No part of Kaspersky's post describes obfuscated, encoded or packed payloads; the evasion it describes is AMSI/Event
      Log patching (mapped to T1685) and legitimate-looking archive and file names (mapped to T1036.005).
    ground_truth: 'Securelist: the Stub class ''evades detection by the Antimalware Scan Interface (AMSI) and Windows Event Log mechanisms by
      overwriting addresses in amsi.dll and ntdll.dll''; archives and files ''were disguised to look legitimate'' / ''given names mimicking known
      legitimate software''. No obfuscation or packing is described.'
    ground_truth_url: https://securelist.com/tr/nighteagle-apt-ghostcontainer-and-tunneling/121323/
    fix: Remove T1027 from techniques[] (or cite the page passage that supports it).
    class: imprecision
