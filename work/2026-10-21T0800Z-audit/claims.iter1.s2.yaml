    text: "The status of build 25.1.3.0 now rests on Ivanti's own description of the flaw, which covers versions before 25.1.3.0, beside Rapid7's table and CERT-FR's alert, which counts 25.1.3.0 as affected; 25.1.3.1 stays the target build."
