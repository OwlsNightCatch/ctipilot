    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** count Note 3771065 as closed only once the fixed Commerce Cloud release is rebuilt and redeployed, with an IP filter set restricting the vulnerable endpoint until then, and count Note 3765948 as closed only once the Secure Transformer allowed-hosts property is configured ("
    urls: ["https://onapsis.com/blog/sap-security-patch-day-august-2026/"]
  - claim_id: ab691d1b2a
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "body"
    kind: derived
    text: "**Detection:** in web and reverse-proxy access logs, surface requests to the Data Hub Adapter endpoint from source addresses outside the integration ranges that legitimately feed it (in analyst judgement, legitimate Data Hub imports come from a known set of integration sources), and in process telemetry treat such a request followed by an unexplained child process under the Commerce Cloud application account as an incident."
  - claim_id: 4a7f367619
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "section 2026-08-16T04:35:00Z"
    kind: cited
    text: "); no party reports a compromised production instance, and SAP has not flagged the flaw as exploited in its own advisory ("
    urls: ["https://www.bleepingcomputer.com/news/security/max-severity-sap-commerce-cloud-flaw-now-targeted-in-attacks/"]
  - claim_id: 37786fe8ed
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "section 2026-08-28T05:00:00Z"
