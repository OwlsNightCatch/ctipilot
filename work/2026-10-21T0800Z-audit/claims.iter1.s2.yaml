  - claim_id: edd0b79b5b
    entry: 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout
    surface: "summary"
    kind: frontmatter
    text: "Novee Security's Black Hat USA 2026 write-up root-causes trust-boundary failures in AI coding-agent CI harnesses, each tested against the vendor's own public repository in default configuration. Against Claude Code Action it reports three successive rounds of patch-and-bypass, of which only the last (an allowlist entry that pre-approved a bare hostname for the fetch tool) carries CVE-2026-54316; the two more instructive rounds, a command validator that strips single-quoted content before inspecting it and a read-only allowlist exempt from path checking, carry no identifier. Google's advisory for the Gemini CLI findings, aliased CVE-2026-12537, hardens headless folder trust and tool allowlisting under yolo mode. The third finding, an OpenAI Codex workflow whose two agent passes shared one checkout so the first could rewrite the instruction file the second treats as authoritative, has no CVE and was fixed only in the vendor's own repository."
  - claim_id: d500999ac9
    entry: 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout
    surface: "actions[0]"
    kind: frontmatter
    text: "Audit any CI workflow where two or more agent passes share a single checkout: the Codex fix was to split the passes into separate jobs each with its own checkout, and that change has to be made in your own pipelines because no vendor patch reaches them."
  - claim_id: 4377fe12a3
    entry: 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout
    surface: "body"
    kind: cited
    text: "Google's advisory for the Gemini CLI findings, which OSV aliases to CVE-2026-12537 ("
    urls: ["https://api.osv.dev/v1/vulns/GHSA-wpqr-6v78-jr5g"]
  - claim_id: b7248af412
    entry: 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout
    surface: "body"
    kind: cited
    text: "It rates the issue Critical, CVSS 10.0, and fixes it in `@google/gemini-cli` 0.39.1 and `run-gemini-cli` 0.1.22 ("
    urls: ["https://github.com/google-github-actions/run-gemini-cli/security/advisories/GHSA-wpqr-6v78-jr5g"]
  - claim_id: 25f2d27cf0
    entry: 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout
    surface: "body"
    kind: uncited
    text: "That file \"is loaded from disk on every single invocation and injected as instructions the model treats as authoritative\", so a first pass induced to modify it dictates what the second pass believes it has been told to do."
  - claim_id: 2e76a60557
    entry: 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout
    surface: "body"
    kind: uncited
    text: "It does not propagate to anyone else's pipeline, because the flaw is not in a shipped component: it is in a workflow shape."
  - claim_id: 2ff8fe97da
    entry: 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout
    surface: "body"
    kind: derived
    text: "Where a public-sector organisation runs coding agents in CI, the questions to ask are whether multiple agent passes share a workspace, whether the agent's instruction file is treated as protected metadata or as ordinary repository content, and (for the two patched products) whether the versions in use are past the fixed releases."
  - claim_id: 30d8a26655
    entry: 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout
    surface: "section 2026-10-21T08:08:35Z"
    kind: cited
    text: "Google's advisory, which OSV aliases to CVE-2026-12537 ("
    urls: ["https://api.osv.dev/v1/vulns/GHSA-wpqr-6v78-jr5g"]
  - claim_id: ca32efd4e2
    entry: 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout
    surface: "section 2026-10-21T08:08:35Z"
    kind: cited
    text: "), covers two hardening changes: headless mode no longer trusts the workspace folder automatically, because untrusted contents \"could lead to remote code execution via malicious environment variables in the local `.gemini/` directory\", and \"the Gemini CLI policy engine now evaluates tool allowlisting under --yolo mode\" ("
    urls: ["https://github.com/google-github-actions/run-gemini-cli/security/advisories/GHSA-wpqr-6v78-jr5g"]
  - claim_id: bcde76397c
    entry: 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout
    surface: "section 2026-10-21T08:08:35Z"
    kind: cited
    text: "It does not describe the read of the parent process's environment that the researchers used to reach the runner's secrets ("
    urls: ["https://novee.security/blog/critical-flaws-in-anthropic-google-and-openais-coding-agents/"]
  - claim_id: f5eb02bcff
    entry: 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout
    surface: "record 2026-10-21T08:08:35Z"
    kind: record-summary
    text: "CVE-2026-12537 is now described by what Google's advisory covers: headless mode trusting the workspace folder (remote code execution through environment variables in the local .gemini/ directory) and the tool allowlist ignored under yolo mode. The advisory does not describe the researchers' read of the parent process's environment."
  - claim_id: a0a373e4b9
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "actions[1]"
    kind: frontmatter
    text: "For any SAP Manufacturing Integration and Intelligence instance patched with Security Note 3765948 (CVE-2026-44772), configure and maintain the new 'Secure Transformer' system property with an explicit allowed-hosts list for XSL files: the patch alone does not remove the vulnerable servlet, and without this property the flaw remains exploitable regardless of patch status."
  - claim_id: 7b1e4af421
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "cves[CVE-2026-44772]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-44772\", \"cvss\": \"9.9\", \"status\": [\"patch-available\"], \"affected\": \"SAP Manufacturing Integration and Intelligence XMII 15.4, 15.5, MII_ADMIN 15.4, 15.5 (SAP Security Note 3765948)\", \"fixed\": \"Per SAP Security Note 3765948; the patch does NOT remove the vulnerable servlet; after applying it, customers must additionally configure and maintain the new \\\"Secure Transformer\\\" system property with a list of allowed hosts for XSL files, or the servlet remains reachable\", \"auth\": \"post-auth\", \"vector\": \"zero-click\"}"
  - claim_id: a3745a38b0
