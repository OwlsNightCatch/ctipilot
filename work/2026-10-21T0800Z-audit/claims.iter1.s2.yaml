    text: "Patch or isolate every on-prem VeloCloud Orchestrator now: two release trains have no fix: Arista confirms active exploitation. Deployments on the 5.2 or 6.4 trains must upgrade to 5.2.3.16+ / 6.4.2.8+ immediately. Deployments on the unpatched 6.1.x or 7.0.x trains must restrict VCO web-interface access to trusted administrative networks now, block outbound ports the VCO does not need, and watch for unexpected outbound traffic, backdoor daemons and webshells until a fix ships. Arista conditions exposure on certificate-based Edge authentication but does not say which certificate modes qualify, so moving Edge authentication to PSK mode is an untested option, not a vendor mitigation."
