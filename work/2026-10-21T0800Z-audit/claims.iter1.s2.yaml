    entry: 2026-09-28/cve-2019-18935-telerik-godzilla-webshell-virtualpathprovider
    surface: "summary"
    kind: frontmatter
    text: "AhnLab ASEC reports two separate attack cases in Korea exploiting CVE-2019-18935 on unpatched IIS servers, a .NET deserialization flaw in Telerik UI for ASP.NET AJAX's RadAsyncUpload feature that Telerik says needs an upload encryption the attacker can break or keys it already knows, plus type whitelisting not enabled; version 2020.1.114 enables that whitelisting by default. One installs a file-less, memory-resident Godzilla-protocol web shell via ASP.NET's VirtualPathProvider extensibility point plus a web-shell-adapted SweetPotato privilege-escalation tool; the other drops only a Rust-based external reconnaissance scanner reporting hits over the Telegram Bot API."
