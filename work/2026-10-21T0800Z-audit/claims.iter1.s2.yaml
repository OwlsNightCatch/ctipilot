  - claim_id: 6dd7be917e
    entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
    surface: "summary"
    kind: frontmatter
    text: "SentinelLabs found the FLATROOF and ROOFDECK macOS backdoors, first documented in April 2026's USD 292 million LayerZero/KelpDAO cryptocurrency theft, on an unrelated victim: a small India-based IT-services provider with no cryptocurrency ties. The campaign's fake job-interview GitHub repositories carry weaponized Terraform provider lockfiles that redirect `terraform init` to attacker-controlled provider registries, though SentinelLabs cannot prove how this victim's backdoors were delivered. Zscaler ThreatLabz independently reports a July 2026 trojanized Terraform provider binary that runs malicious code as soon as Terraform loads it and delivers FLATROOF on macOS, Linux and Windows, which drops ROOFDECK (Windows and macOS variants identified), in a campaign it suspects is TraderTraitor. In the sample SentinelLabs analysed, the second-stage backdoor reads an operator profile's public \"website\" field on the Nostr decentralized relay network as its command-and-control URL; Zscaler's variants first try a local configuration and an RSA-signed Pastebin dead drop, and use Nostr profile metadata only as a fallback that locates the current Pastebin URL."
  - claim_id: e6e83444c9
    entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
    surface: "section 2026-10-21T08:13:06Z"
    kind: cited
    text: "Reading an operator's Nostr profile \"website\" field as the command-and-control URL is the behavior of the sample SentinelLabs analysed ("
    urls: ["https://www.sentinelone.com/labs/dont-call-us-well-call-your-apis-tradertraitor-backdoors-resurface-on-victim-with-no-crypto-ties/"]
  - claim_id: 3061f1ffe3
    entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
    surface: "section 2026-10-21T08:13:06Z"
    kind: cited
    text: "In the ROOFDECK variants Zscaler describes, Nostr is the last of three resolvers, after the locally stored address and a signed, encrypted Pastebin address, and its profile metadata is used \"to locate the current dead-drop Pastebin URL\" rather than the server itself ("
    urls: ["https://www.zscaler.com/blogs/security-research/suspected-tradertraitor-group-uses-trojanized-terraform-provider-deliver"]
  - claim_id: aa61bf7618
