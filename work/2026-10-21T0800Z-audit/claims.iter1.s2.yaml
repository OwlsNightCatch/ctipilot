  - claim_id: 07d2137cd3
    entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
    surface: "headline"
    kind: frontmatter
    text: "A public tool bulk-enumerates Entra ID accounts and their MFA methods through Microsoft's own password-reset portal"
  - claim_id: 94a691d10f
    entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
    surface: "summary"
    kind: frontmatter
    text: "LevelBlue (Trustwave) SpiderLabs documents that Microsoft's public, unauthenticated Self-Service Password Reset (SSPR) portal at passwordreset.microsoftonline.com discloses, via a hidden state field in its own response, whether a submitted email address belongs to a real Entra ID account, which second-factor methods that account has registered, and, because Microsoft enforces SSPR for administrators regardless of tenant policy, whether the account is likely privileged. The researcher released a public automation tool, ResetSpy, and Microsoft removed the portal's visual CAPTCHA in August 2026 in favor of backend throttling and behavior-based abuse detection."
  - claim_id: 5faa310360
    entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
    surface: "body"
    kind: cited
    text: "Every other named view, including the documented error codes SSPR_0011 (no password reset policy defined for the user) and SSPR_0013 (the user is not a member of the group enabled for SSPR), still confirms the account exists, because the server only reaches those policy checks after resolving the username in the directory: \"The server only reaches those policy checks after successfully resolving the username in the directory\" ("
    urls: ["https://www.levelblue.com/blogs/spiderlabs-blog/enumerating-users-and-mfa-via-microsofts-password-reset-portal"]
  - claim_id: 7d42fda446
    entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
    surface: "body"
    kind: cited
    text: "**Detection:** Entra ID / Azure AD self-service-password-reset audit events are the telemetry class, specifically SSPR activity records with status failures such as \"user is not member of the password reset users group\", and bulk enumeration attempts: many requests in a short window across varied usernames with no subsequent completed reset ("
    urls: ["https://www.levelblue.com/blogs/spiderlabs-blog/enumerating-users-and-mfa-via-microsofts-password-reset-portal"]
  - claim_id: b9051620fb
    entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** scoping SSPR to a specific security group rather than tenant-wide limits method disclosure to the accounts inside the group and to administrators, but it does not stop existence enumeration, and it exposes the registered methods, or the empty method list, of every in-scope account ("
    urls: ["https://www.levelblue.com/blogs/spiderlabs-blog/enumerating-users-and-mfa-via-microsofts-password-reset-portal"]
  - claim_id: 33ba33d83c
    entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
    surface: "body"
    kind: cited
    text: "Remove alternate-email-OTP and security-question options from the permitted SSPR methods, and enforce phishing-resistant MFA on every privileged role: Microsoft enforces SSPR on admin accounts and this cannot be disabled, so a stronger factor on those accounts is the control that raises the cost of exploiting what the technique reveals ("
    urls: ["https://www.levelblue.com/blogs/spiderlabs-blog/enumerating-users-and-mfa-via-microsofts-password-reset-portal"]
  - claim_id: 435d6a1cc0
    entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
    surface: "body"
    kind: uncited
    text: "For an account that reaches the method-selection screen, the response HTML lists every registered second factor as visible radio buttons, with unregistered methods present in the DOM but hidden, so an attacker also learns whether a target relies on an authenticator app, SMS, or a more easily phished alternate-email one-time code."
  - claim_id: e676241971
    entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
    surface: "section 2026-10-21T08:18:20Z"
    kind: cited
    text: "For each target it returns whether the account exists, which SSPR verification methods are registered, whether those methods amount to a meaningful second factor or are weak-only, and the SSPR policy state ("
    urls: ["https://www.levelblue.com/blogs/spiderlabs-blog/enumerating-users-and-mfa-via-microsofts-password-reset-portal"]
  - claim_id: c92c35fb71
    entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
    surface: "section 2026-10-21T08:18:20Z"
    kind: cited
    text: "Likely administrators are an inference from that policy state: in a tenant that has disabled SSPR for standard users, an account that still reaches method selection \"is likely a privileged role account\" ("
    urls: ["https://www.levelblue.com/blogs/spiderlabs-blog/enumerating-users-and-mfa-via-microsofts-password-reset-portal"]
  - claim_id: 264963c900
    entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
    surface: "section 2026-10-21T08:18:20Z"
    kind: uncited
    text: "ResetSpy does not report administrator status."
  - claim_id: 2cae55bd39
    entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
    surface: "record 2026-10-21T08:18:20Z"
    kind: record-summary
    text: "The headline no longer says ResetSpy enumerates admin status: the tool reports account existence, registered methods, their strength and the SSPR policy state, and likely administrators are inferred from that policy state. The takeaway now says scoping SSPR to a group limits method disclosure to in-group accounts and administrators without stopping existence enumeration, instead of presenting it as shrinking the enumerable population."
