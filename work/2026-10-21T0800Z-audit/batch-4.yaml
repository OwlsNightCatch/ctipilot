- entry: 2026-09-17/cve-2026-58704-google-pixel-modem-zero-click-eop
  rows:
  - W1-B
  findings:
  - where: 'body paragraph 1 (TechCrunch two-wordings sentence), ## Correction section, headline, summary, evidence[], updates[] record summary'
    claim: 'Google did not confirm exploitation to TechCrunch directly: a Google spokesperson did not return TechCrunch''s request for comment.
      TechCrunch words Google''s position two ways'
    defect: The primary source cited first (Google's Pixel Update Bulletin) itself carries Google's hedged exploitation statement in its Announcements
      note; the entry attributes the 'may be under limited, targeted exploitation' wording only to TechCrunch's reporting and frames TechCrunch's
      two wordings as an unresolved inconsistency, when Google's own sentence resolves it (the hedged form is Google's; TechCrunch's 'was exploited'
      opening overstates).
    ground_truth: 'Pixel Update Bulletin, Announcements: ''Note: There are indications that CVE-2026-58704 may be under limited, targeted exploitation.''
      (read via WebFetch; the jina/extract text of the page omits the note).'
    ground_truth_url: https://source.android.com/docs/security/bulletin/pixel/2026/2026-09-01
    fix: Cite Google's bulletin directly for 'there are indications ... may be under limited, targeted exploitation', state that TechCrunch's
      opening sentence ('was exploited') is stronger than Google's wording, and drop 'Google did not confirm' / 'CISA's KEV the only unhedged
      signal' framing.
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T7
  - where: sourcing_note and cves[].cvss
    claim: Google, CISA and TechCrunch publish no numeric CVSS score for this flaw, so none is recorded.
    defect: As of 2026-10-07 the CISA ADP container of the CVE record publishes CVSS 3.1 8.8 (AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H); the Google
      (CNA) record itself has no score and describes the vector as 'remote (proximal/adjacent)', which the body does not convey.
    ground_truth: 'CVE record CVE-2026-58704: Google_Devices CNA: ''This could lead to remote (proximal/adjacent) escalation of privilege with
      no additional execution privileges needed. User interaction is not needed''; adp CISA-ADP cvssV3_1 baseScore 8.8, attackVector ADJACENT_NETWORK.'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-58704
    fix: Say Google's CNA record gives no score and CISA's enrichment rates it 8.8 with an adjacent-network vector (or keep null but drop 'CISA
      publishes no numeric score'); add the proximal/adjacent qualifier to the exposure description.
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T7
