- entry: 2026-09-18/brevo-cloudflare-worker-clickfix-supply-chain
  rows:
  - W1-B
  findings:
  - where: '**Exposure:** line (and body paragraph 1 window sentence)'
    claim: anyone who followed the fake verification prompt on 2026-09-14, within Brevo's stated impact window of 15:01 to 20:30 UTC, and ran
      the pasted command is exposed
    defect: (low confidence) 15:01-20:30 is the Worker's impact window; Brevo's own 'Affected surfaces and window' says the ClickFix was active
      on the listed URLs 'from 16:07 UTC until 20:30', BleepingComputer gives the exposure window as 16:07-20:30 and Sansec observed malware 16:05-20:13.
      The entry applies the longer window to the prompt without noting the two stated starts.
    ground_truth: 'Brevo write-up: ''Impact window: 15:01 to 20:30 UTC, 5h29'' and ''The ClickFix was active on following URLs from 16:07 UTC
      until 20:30.'' BleepingComputer: ''defining the exposure window as between 16:07 and 20:30 UTC''. Sansec: ''Brevo served the malware between
      16:05:18 and 20:12:53 UTC on 14 September.'''
    ground_truth_url: https://status.brevo.com/incidents/01M2QBC4EZ24ZACW6SWQYVW8N3/write-up
    fix: State the ClickFix window as 16:07 to 20:30 UTC per Brevo (Sansec observed 16:05 to 20:13) and the Worker's wider 15:01 to 20:30 impact
      window separately.
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T7
  - where: actions[0], body paragraph 1 and Triage line
    claim: a plugin impersonating "Web Media Optimizer" ... BleepingComputer names the known backdoor plugin "Web Media Optimizer"
    defect: (low confidence) The malicious plugin's display name is a named host/file-name-style indicator in reader-facing text, which the store's
      no-IOC policy excludes; the behavioural checks (plugin on disk not in the admin list, plugin installed 14 September, upload-plugin POST)
      carry the detection without it.
