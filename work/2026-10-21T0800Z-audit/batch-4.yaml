  findings:
  - where: summary and body paragraph 2 (CVE-2026-76423)
    claim: affecting every release regardless of configuration
    defect: (low confidence) Cisco's wording is 'regardless of device configuration', not 'every release'; the fixed releases (3.1 P12 ... 3.5
      P4) are not affected, so 'every release' overstates.
    ground_truth: '''This vulnerability affects Cisco ISE and Cisco ISE Passive Identity Connector (ISE-PIC), regardless of device configuration.''
      Fixed table: first fixed 3.1 Patch 12, 3.2 Patch 11, 3.3 Patch 12, 3.4 Patch 7, 3.5 Patch 4.'
    ground_truth_url: https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-ISE-ABP-VNSW7Tn5
    fix: '''affecting ISE and ISE-PIC releases before the fixed patch levels, whatever the configuration''.'
