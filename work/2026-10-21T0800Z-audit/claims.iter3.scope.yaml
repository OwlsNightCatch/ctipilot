claims:
  - claim_id: 7c04138444
    entry: 2026-05-10/sophos-beagle-backdoor-distributed-via-fake-claude-ai-site-u
    surface: "body"
    kind: cited
    text: "The trojanized installer puts a working copy of Claude under a misspelled lookalike of the Claude directory name inside the Anthropic program folder, which Malwarebytes gives as a check alongside the sideloading files in the user's Startup folder ("
    urls: ["https://www.malwarebytes.com/blog/scams/2026/04/fake-claude-site-installs-malware-that-gives-attackers-access-to-your-computer"]
  - claim_id: d4f65429c7
    entry: 2026-05-10/sophos-beagle-backdoor-distributed-via-fake-claude-ai-site-u
    surface: "body"
    kind: cited
    text: "**Detection:** in file-creation and process telemetry, a signed G DATA antivirus updater, an encrypted data file and a DLL written together into a user's Startup folder after the fake installer's MSI runs ("
    urls: ["https://www.sophos.com/en-us/blog/donuts-and-beagles-fake-claude-site-spreads-backdoor"]
  - claim_id: 2c8bd25d2f
    entry: 2026-05-10/sophos-beagle-backdoor-distributed-via-fake-claude-ai-site-u
    surface: "body"
    kind: cited
    text: "**Triage:** the updater is a legitimately signed G DATA binary, so the parent process can look benign to endpoint tools; by inference from Malwarebytes' sandbox observation, the discriminator is the sequence, in which WScript.exe writes the updater, the DLL it loads from its own directory and an encrypted data file into a user's Startup folder and starts the updater with a hidden window while the freshly installed Claude application opens in the foreground ("
    urls: ["https://www.malwarebytes.com/blog/scams/2026/04/fake-claude-site-installs-malware-that-gives-attackers-access-to-your-computer"]
  - claim_id: 01416e228b
    entry: 2026-05-10/sophos-beagle-backdoor-distributed-via-fake-claude-ai-site-u
    surface: "body"
    kind: derived
    text: "**Exposure:** Windows hosts where a user ran a Claude installer taken from a lookalike site or an ad rather than the official download page."
  - claim_id: 2aecb5d013
    entry: 2026-05-10/sophos-beagle-backdoor-distributed-via-fake-claude-ai-site-u
    surface: "section 2026-10-21T08:17:40Z"
    kind: cited
    text: "Its VBScript dropper, run by WScript.exe, copies the three sideloading files into the user's Startup folder and starts the signed G DATA updater with a hidden window, and a signed parent like this can look benign to endpoint tools ("
    urls: ["https://www.malwarebytes.com/blog/scams/2026/04/fake-claude-site-installs-malware-that-gives-attackers-access-to-your-computer"]
  - claim_id: 336c0c5739
    entry: 2026-05-10/sophos-beagle-backdoor-distributed-via-fake-claude-ai-site-u
    surface: "section 2026-10-21T08:17:40Z"
    kind: uncited
    text: "Malwarebytes gives a host check for the trojanized installer: it puts a working copy of Claude under a misspelled lookalike of the Claude directory name inside the Anthropic program folder."
  - claim_id: 73dd39a552
    entry: 2026-05-10/sophos-beagle-backdoor-distributed-via-fake-claude-ai-site-u
    surface: "record 2026-10-21T08:17:40Z"
    kind: record-summary
    text: "The infostealer tag is removed because Sophos describes Beagle as a simple backdoor with remote-shell and file-management commands, and the technology sector because no source names a targeted sector. Exposure and triage lines are added from Malwarebytes' host checks: a misspelled lookalike install directory, and WScript.exe writing the signed G DATA updater, its DLL and an encrypted data file into the Startup folder and starting the updater with a hidden window. The ATT&CK mapping gains the VBScript dropper, payload decryption, in-memory loading, the self-deleting dropper and the hidden window the main text describes."
  - claim_id: 2b2901d270
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "actions[1]"
    kind: frontmatter
    text: "For any SAP Manufacturing Integration and Intelligence instance patched with Security Note 3765948 (CVE-2026-44772), configure and maintain the new 'Secure Transformer' system property with an explicit allowed-hosts list for XSL files: the patch alone does not remove the vulnerable servlet, and Onapsis requires the property after the patch so that only XSL files from the listed hosts can be consumed."
