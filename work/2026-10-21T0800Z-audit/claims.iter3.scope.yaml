    surface: "cves[CVE-2026-44772]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-44772\", \"cvss\": \"9.9\", \"status\": [\"patch-available\"], \"affected\": \"SAP Manufacturing Integration and Intelligence XMII 15.4, 15.5, MII_ADMIN 15.4, 15.5 (SAP Security Note 3765948)\", \"fixed\": \"Per SAP Security Note 3765948; the patch does NOT remove the vulnerable servlet; after applying it, customers must additionally configure and maintain the new \\\"Secure Transformer\\\" system property with a list of allowed hosts for XSL files, or the servlet remains reachable\", \"auth\": \"post-auth\", \"vector\": \"zero-click\"}"
