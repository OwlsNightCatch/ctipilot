  item: "work/cleanup/wave-06/findings-W1-I.md, last bullet, 'Oracle September 2026 CSPU' (and the same text in runs/2026-10-21/2026-10-21T0800Z-audit.md verification.iterations[6].findings)"
  url_or_quote: "Oracle September 2026 CSPU: no fetched page states the 2026-09-15 citation label, and the page metadata says 2026-09-10 (verification.iter7)."
  summary: "False for the cited page. https://www.oracle.com/security-alerts/cspusep2026.html carries a revision table in its body: '| 2026-September-15 | Rev 1. Initial Release. |' (the 2026-09-10 value is only the page's Updated Date metadata, and trafilatura's date field). The entry's '[Oracle, 2026-09-15]' label is therefore supported and the item would send wave 06 to 'fix' a correct date. Drop the bullet or reword it to say the label is stated by the revision table. Low-confidence companion on the Aikido bullet in the same file (repair-1 residuals): the page's raw HTML carries 'datePublished: 2026-09-04' in an embedded Article JSON-LD block, beside the header 'Apr 7, 2026' / 'Sep 7, 2026', so the 2026-09-04 label is not unsupported, only the page-level metadata disagrees."
