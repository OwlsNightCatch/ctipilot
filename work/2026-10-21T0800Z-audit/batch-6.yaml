- entry: 2026-09-27/flink-lpg-group-crowdfund-extortion-order-hub-breach
  rows:
  - W1-B
  findings:
  - where: body paragraph 2
    claim: (low confidence) The extortion actor behind the breach, self-named "LPG Group"
    defect: States as fact that LPG Group is behind the breach; the identity rests on the group's own extortion emails, heise says the intruders
      were 'bisher unbekannte Kriminelle' and that the group 'bekennt sich' to the acts, and Flink has not named an actor.
    ground_truth: 'heise: ''In diesen ... bekennt sich eine bisher recht unbekannte Bande namens „LPG Group“ zu den Taten.'''
    ground_truth_url: https://www.heise.de/news/Kunden-und-Mitarbeiter-von-Lieferdienst-Flink-werden-erpresst-11467086.html
    fix: Say 'The extortion actor claiming the breach, self-named LPG Group'.
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T9
  - where: body paragraph 3
    claim: Abuse reporting to the group's mail provider curtailed the flood of messages
    defect: 'Drops heise''s qualifiers: it is Flink''s account, the flood was only ''vorerst'' (for now) contained, and heise adds the extortionists
      may seek other routes; sentence also carries no citation of its own.'
    ground_truth: 'heise: ''Laut Flink wurde über eine Abuse-Mitteilung beim von der Bande genutzten Mailprovider die Flut der Schreiben auch
      vorerst eingedämmt, nicht auszuschließen sei aber, dass sich die Erpresser andere Wege suchen.'''
    ground_truth_url: https://www.heise.de/news/Kunden-und-Mitarbeiter-von-Lieferdienst-Flink-werden-erpresst-11467086.html
    fix: Write 'According to Flink, an abuse report to the mail provider curtailed the flood for now' and cite heise.
