- entry: 2026-09-26/kiteworks-precautionary-shutdown-imminent-zero-day-warning
  rows:
  - W1-B
  findings:
  - where: body, Defender takeaway
    claim: 'Run 9.5.1 or later on every deployment (Email Protection Gateway at least 9.4.1 for CVE-2026-54154), and put the open question to
      Kiteworks Support in writing: ... beyond its notice to customers with self-hosted Advanced Forms to contact Customer Support ([Kiteworks,
      2026-09-27](https://www.kiteworks.com/company/press-releases/kiteworks-precautionary-shutdown-advisory/))'
    defect: The sentence's only citation, the 2026-09-27 press release, carries the Advanced Forms support notice but neither CVE-2026-54154 nor
      the 9.4.1 bound; the CVE and version come from GHSA-5xhq-9wq3-rvj6 (cited only in the 2026-10-02 section). Citation does not vouch for the
      CVE/9.4.1 clause.
    ground_truth: 'Press release: ''Customers with self-hosted Advanced Forms should contact Customer Support for assistance.'' (no CVE id, no
      9.4.1). GHSA-5xhq-9wq3-rvj6: CVE-2026-54154, ''Upgrade to Kiteworks Email Protection Gateway 9.4.1 or later.'''
    ground_truth_url: https://www.kiteworks.com/company/press-releases/kiteworks-precautionary-shutdown-advisory/
    fix: 'Split the sentence: cite GHSA-5xhq-9wq3-rvj6 after the 9.4.1 / CVE-2026-54154 clause and keep the press-release citation for the Advanced
      Forms notice.'
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T9
  - where: body paragraph 1
    claim: and recommended shutting systems down even where they are not directly internet-facing, since the possible access route is unconfirmed.
    defect: Clause follows the Heise citation with no citation of its own and attributes the recommendation and rationale to the CISO email; Heise
      states it as KiteWorks recommending (and 'It cannot be said with certainty what potential access routes there might be'), BleepingComputer
      and TechCrunch carry the same point.
    ground_truth: 'Heise: ''KiteWorks recommends shutting down the servers even before this time – even if they are not accessible from the internet.
      It cannot be said with certainty what potential access routes there might be.'''
    ground_truth_url: https://www.heise.de/en/news/Imminent-Zero-Day-Attack-KiteWorks-Urges-Customers-to-Shut-Down-Servers-11466375.html
    fix: Add the Heise citation after the clause (or attribute it to Heise's report of the email).
