    source: W1-B 2026-10-18T1307Z-audit/truth-T9
  - where: Defender takeaway
    claim: (low confidence) treat any wave of individually-addressed extortion emails referencing a real breach as corroboration of that breach's
      scope, not as unrelated spam.
    defect: No cited source says extortion emails corroborate scope; the entry itself reports that Flink did not confirm the claimed 1 million
