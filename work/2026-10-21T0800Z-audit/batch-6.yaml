- entry: 2026-09-28/storm-3168-jadepuffer-azure-destructive-service-principal
  rows:
  - W1-B
  findings:
  - where: frontmatter sectors / priority
    claim: '(low confidence) sectors: [public-sector, technology]; priority: high'
    defect: 'Microsoft''s blog does not name or characterise the victim organisation or its sector, so ''public-sector'' (and the home-region
      nexus that the high priority leans on) is not in the cited source; it is a single-tenant incident whose observed activity dates to early
      June 2026 and whose guidance (rotate exposed secrets, locks) is generic. Context only: the priority bar rests on an assumed Azure/public-sector
      exposure.'
    ground_truth: 'Microsoft: ''Microsoft observed two compromised service principals belonging to the same tenant'' (no sector or victim named);
      ''in early June 2026, one of the compromised service principals enumerated ...'''
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/09/25/storm-3168-agentic-driven-cloud-attacks-using-compromised-service-principals/
    fix: Remove public-sector from sectors unless a source names it; re-grade priority on the exposure of Swiss Azure tenants (leaked workload-identity
      secrets) rather than on the victim sector.
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T9
