- entry: 2026-09-27/pentagon-dmdc-military-personnel-data-breach-unencrypted-ssn
  rows:
  - W1-B
  findings:
  - where: headline; body paragraph 1
    claim: (low confidence) A vulnerable Pentagon HR file server sat unencrypted and reachable for nine months before anyone noticed
    defect: /
    ground_truth: a government's central personnel-data store kept identity numbers unencrypted and readable for nine months before discovery
    ground_truth_url: The nine months is the window of unauthorized access (Oct 2025 to 16 Jul 2026); no source says how long the data had been
      unencrypted or that the server was externally 'reachable' (the entry's own sourcing note says reachability is not reported).
    fix: 'CNN: ''beginning last October, but it wasn''t until nine months later, in July, that the Pentagon discovered and remediated the issue''
      and ''The stolen data wasn''t encrypted, according to the letter.'''
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T9
  - where: Defender takeaway
    claim: check that central personnel and HR data stores encrypt identifying fields at rest, which CNN notes is standard security practice and
      which DMDC's server lacked
    defect: CNN says only that the stolen data was not encrypted and that encrypting sensitive data is standard practice; 'at rest' and 'identifying
      fields' are the entry's gloss, and no source says encryption at rest would have stopped access through the file-sharing vulnerability.
    ground_truth: 'CNN: ''The stolen data wasn''t encrypted, according to the letter. Encrypting sensitive data is a standard security practice.'''
    ground_truth_url: https://www.cnn.com/2026/09/25/politics/pentagon-data-personnel-breach
    fix: 'Mirror CNN: ''encrypt sensitive personnel data, which CNN notes is standard practice and which the stolen data lacked''.'
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T9
