- entry: 2026-09-28/cve-2019-18935-telerik-godzilla-webshell-virtualpathprovider
  rows:
  - W1-B
  findings:
  - where: summary; cves[0]; body paragraph 1; Defender takeaway
    claim: a .NET deserialization flaw in Telerik UI for ASP.NET AJAX's RadAsyncUpload feature, patched since version 2020.1.114 but still reachable
      on unpatched IIS deployments
    defect: /
    ground_truth: patch to 2020.1.114 or later now
    ground_truth_url: 'Omits the vendor''s stated exploitation prerequisites and fix semantics: Telerik''s KB says exploitation needs the attacker
      to break RadAsyncUpload encryption (or know the custom keys) AND type whitelisting not enabled; 2020.1.114 only enables whitelisting by
      default, and the vendor still says to apply the recommended security settings on 2020.1.114 and later. The entry presents a plain pre-auth,
      version-bound flaw and states no exposure discriminator.'
    fix: 'Telerik KB: ''Prerequisites for an Attack: An attacker can break the RadAsyncUpload encryption (or have prior knowledge of your custom
      encryption keys) and stage a malicious request. The type whitelisting feature of RadAsyncUpload is not enabled''; table: ''R1 2020 (2020.1.114)
      and later | Not possible through RadAsyncUpload, unless the attacker has access to your encryption keys | The feature is enabled by default
      | Apply the recommended security settings.'''
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T9
  - where: Defender takeaway
    claim: where patching must wait, restrict or disable the RadAsyncUpload handler and monitor for the VirtualPathProvider-registration pattern
      described above
    defect: The interim control 'restrict or disable the RadAsyncUpload handler' appears in no cited source (AhnLab's mitigation list is upgrade
      to 2020.1.114 or later plus the process and file checks); the vendor's interim control is the recommended security settings (custom encryption
      keys, type whitelisting).
    ground_truth: 'AhnLab mitigation: ''Upgrade Telerik UI for ASP.NET AJAX to a version that includes the Vulnerability Patch ... Telerik UI
      version: 2020.1.114 Or later''; Telerik KB: ''Apply the recommended security settings.'''
    ground_truth_url: https://asec.ahnlab.com/en/95561/
    fix: Replace with the vendor's recommended security settings (cited to Telerik) or drop the unsourced workaround.
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T9
  legacy_queue_now: not-legacy
  legacy_duty: false
  em_dashes_in_reader_text: none
