  findings:
  - where: summary; 2026-09-05 Update section; evidence[2]
    claim: Kubernetes-context proof-of-concept exploits are public, and Red Hat confirms RHEL kernels are affected
    defect: (low confidence) The only source for the Kubernetes proof-of-concept sentence uses "Dirty Frag" for all three CVEs together and does
      not say a Kubernetes PoC exists for CVE-2026-46300 itself; the entry attaches it to this CVE.
    ground_truth: 'Aikido (section ''Why does Dirty Frag matter for containers?'', where Dirty Frag = CVE-2026-43284, CVE-2026-43500 and CVE-2026-46300):
      "Researchers have already published working proof-of-concept exploits for Kubernetes, and Ubuntu spells out the risk of a container escape."
      The Ubuntu link in that sentence is the CVE-2026-43284 page; no source describes a Fragnesia-specific Kubernetes PoC. The public Fragnesia
      PoC cited by Help Net Security overwrites /usr/bin/su.'
    ground_truth_url: https://www.aikido.dev/blog/dirty-frag
    fix: Attribute it as Aikido's statement about the Dirty Frag family, or say only that a public Fragnesia PoC exists (Help Net Security) and
      container reachability depends on seccomp, pod security and user-namespace settings.
