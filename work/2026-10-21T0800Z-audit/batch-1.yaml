- entry: 2026-05-29/cve-2026-9170-ibm-http-server-websphere-application-server-p
  rows:
  - W1-B
  findings:
  - where: frontmatter cves[CVE-2026-9170].fixed and summary; body Defender takeaway (interim-fix sentence); sources[] date of the IBM cumulative-fix
      page
    claim: the interim fix for APAR PH71265 is now part of the cumulative interim fix IFPH71594 ... the cumulative interim fix IFPH71594, which
      includes the PH71265 fix, installs on top of the minimum fix-pack level it requires ([IBM, 2026-06-26](https://www.ibm.com/support/pages/ibm-http-server-latest-cumulative-security-interim-fix))
    defect: The cited IBM page (modified 2026-10-13, inside the audit window) now lists IFDT503301 (13 October 2026) as the current cumulative
      security interim fix, which supersedes IFPH71594, so naming IFPH71594 as the interim route is stale; the citation date 2026-06-26 also predates
      the page's own change history (IFPH71594 superseded IFPH71265 only on 16 July 2026).
    ground_truth: '''This download additionally supersedes (includes) the following recent fixes ... IFPH71594 ... IFPH71265''; Change History
      ''16 July 2026: Supersede IFPH71265 with IFPH71594 for Apache 2.4.68 CVES''; ''Modified date: 13 October 2026''; downloads 9.0.5.29-WS-WASIHS-IFDT503301
      and 8.5.5.30-WS-WASIHS-IFDT503301 (13 October 2026). The fix packs 9.0.5.29 (8 Sep 2026) and 8.5.5.30 (27 Jul 2026) themselves are correct.'
    ground_truth_url: https://www.ibm.com/support/pages/ibm-http-server-latest-cumulative-security-interim-fix
    fix: Say the PH71265 fix is carried by the current cumulative interim fix (IFDT503301 as of 2026-10-13, superseding IFPH71594) or drop the
      named ifix and keep the fix-pack route; correct the page's citation date.
