- entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
  rows:
  - W1-B
  findings:
  - where: Update — 2026-06-17T05:14:33Z, paragraph 2, and record 2026-06-17T05:14:33Z summary
    claim: 'Arctic Wolf''s telemetry documents post-exploitation consistent with Impacket tooling (SMB lateral movement, anonymous NTLM logon,
      share enumeration and domain-user discovery) ... Defenders: ... audit sessions since 17 May for Impacket-pattern lateral movement (EID 4624
      Type 3 from unexpected IPs, SMB enumeration EID 5140/5145) || record summary: "exploitation wave hits European targets — Arctic Wolf documents
      Impacket-style SMB lateral movement post-auth-bypass"'
    defect: Arctic Wolf describes SMB session setup and lightweight reconnaissance after the VPN tunnel and says the activity did not progress
      further in the cases it saw (no lateral movement); its victims were in Europe and North America with the heaviest concentration in the United
      States, not European targets only.
    ground_truth: '''a subset of investigated intrusions, successful VPN session establishment was quickly followed by an SMB session setup request
      and automated internal SMB reconnaissance consistent with Impacket tooling ... network share enumeration and domain user discovery''; ''the
      activity did not progress substantially beyond the initial SMB session setup and lightweight reconnaissance behavior''; ''successful GlobalProtect
      authentication events alone did not necessarily mean threat actors proceeded to move laterally''; ''Impacted organizations were located
      in Europe and North America, with the heaviest concentration in the United States.'''
    ground_truth_url: https://arcticwolf.com/resources/blog/arctic-wolf-observes-increase-in-palo-alto-networks-globalprotect-authentication-bypass-exploitation-via-cve-2026-0257/
    fix: Replace 'SMB lateral movement' with 'SMB session setup and reconnaissance (share enumeration, domain-user discovery)'; drop the European-only
      framing (Europe and North America, mostly US).
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T5
  - where: Update — 2026-06-10T05:00:16Z, last sentence (uncited)
    claim: Hunt GlobalProtect gateway logs for `auth-method=cookie` from unexpected source IPs.
    defect: (low confidence) The quoted field=value string appears in no cited source; Rapid7 shows the method as 'Cookie' inside a gateway-auth
      login record and Arctic Wolf keys detection on cookie-decryption errors followed by success.
    ground_truth: 'Rapid7 log excerpt: ''gateway-auth,login,Cookie,,admin,US,GP-CLIENT''; Arctic Wolf: ''Cookie decryption error followed immediately
      by successful authentication in the same session.'''
    ground_truth_url: https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/
    fix: Describe the telemetry class (gateway-auth logins with the cookie method from unexpected sources) instead of a literal field=value, or
      cite where the field name comes from.
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T5
  - where: actions[0]; Update — 2026-06-10 paragraph 2; Update — 2026-10-06 last sentence
    claim: then force one re-authentication so override cookies regenerate
    defect: (low confidence) Palo Alto says the one-time re-authentication is an automatic consequence of the PAN-OS upgrade (the firewall regenerates
      the cookie), not a step the operator forces; for the dedicated-certificate or disable workarounds the advisory gives no forced re-authentication
      step.
    ground_truth: '''if the firewall is configured to use an authentication override cookie ... it will regenerate the cookie using a more secure
      method. Therefore, GP users will need to re-authenticate after a PAN-OS upgrade, even if a valid cookie is present. This is a one time requirement.'''
    ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0257
    fix: Say users must re-authenticate once after the upgrade (expected, not a task) and drop 'force' on the workaround path unless a source
      is cited.
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T5
  - where: frontmatter sectors
    claim: 'sectors: [public-sector, finance, healthcare, education]'
    defect: (low confidence) No cited source reports exploitation against public-sector victims; Arctic Wolf names insurance, finance, manufacturing,
      education, engineering and healthcare, and 'government' appears only in its general description of Qilin affiliate targeting.
    ground_truth: 'Arctic Wolf 2026-06-11: ''Exploitation was observed across a variety of sectors, including insurance, finance, manufacturing,
      education, engineering, and healthcare.'''
    ground_truth_url: https://arcticwolf.com/resources/blog/arctic-wolf-observes-increase-in-palo-alto-networks-globalprotect-authentication-bypass-exploitation-via-cve-2026-0257/
    fix: Drop public-sector from sectors or treat it as exposure context only.
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T5
  - where: frontmatter cves[CVE-2026-0257].affected / fixed
    claim: 'affected: null; fixed: null'
    defect: (low confidence) The machine-read CVE record leaves both fields null although Palo Alto's advisory table gives the affected trains
      (PAN-OS 12.1, 11.2, 11.1, 10.2; Prisma Access 11.2.0 and 10.2.0) and the fixed builds, which the body already states.
    ground_truth: 'Palo Alto PSIRT product status: PAN-OS 12.1 < 12.1.4-h6 < 12.1.7; 11.2 < 11.2.4-h17 < 11.2.7-h14 < 11.2.10-h7 < 11.2.12; 11.1
      < 11.1.4-h33 < 11.1.6-h32 < 11.1.7-h6 < 11.1.10-h25 < 11.1.13-h5 < 11.1.15; 10.2 < 10.2.7-h34 < 10.2.10-h36 < 10.2.13-h21 < 10.2.16-h7 <
      10.2.18-h6; Prisma Access 11.2.0 < 11.2.7-h13, 10.2.0 < 10.2.10-h36.'
    ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0257
    fix: Populate affected and fixed in the CVE record from the PSIRT table.
    class: imprecision
    source: W1-B 2026-10-18T1307Z-audit/truth-T5
  legacy_queue_now: pending
  legacy_duty: true
  em_dashes_in_reader_text: none
