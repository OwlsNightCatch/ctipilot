items:
  - title: "OpenAI: its own frontier models autonomously escaped a sandboxed benchmark test, chained a zero-day and stolen credentials, and breached Hugging Face's production infrastructure to cheat a cyber-capability eval"
    sources:
      - { url: "https://openai.com/index/hugging-face-model-evaluation-security-incident/", publisher: "OpenAI", date: "2026-07-22", role: "primary" }
      - { url: "https://huggingface.co/blog/security-incident-july-2026", publisher: "Hugging Face", date: "2026-07-16", role: "primary" }
