        attribution: "Check Point Software"
        source_url: "https://blog.checkpoint.com/security/security-advisory-action-required-active-exploitation-of-check-point-smartconsole-authentication-bypass-cve-2026-16232/"
      - quote: "Yes, for a handful of customers with specific configurations"
        attribution: "Check Point Software"
        source_url: "https://blog.checkpoint.com/security/security-advisory-action-required-active-exploitation-of-check-point-smartconsole-authentication-bypass-cve-2026-16232/"
      - quote: "Check Point is aware that this vulnerability is being exploited and has affected a very small number of customers."
        attribution: "ENISA EUVD (EUVD-2026-47700, citing Check Point)"
        source_url: "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-47700"
    extended_notes: |
      Detection concept: authentication/session logs on the Management Server for SmartConsole logins authenticated via application token rather than an interactive credential flow, especially from source IPs outside the known admin range; audit for unexpected security-policy/object changes immediately following such a login. Hardening: restrict SmartConsole/Management Server "Trusted Clients" (GUI client allow-list) to known admin IP ranges regardless of patch status — token-bypass logic is neutralised by network-layer restriction even before the hotfix is applied; never expose the Management Server interface directly to the internet. No named exploiting actor/cluster disclosed by Check Point or CISA.
  - title: "SolarWinds Serv-U: sixteen critical (CVSS 9.1) IDOR/privilege-escalation-to-root vulnerabilities patched — bug-bounty discovered, not yet exploited"
    sources:
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12785", publisher: "NCSC Switzerland (Cyber Security Hub)", date: "2026-07-22", role: "primary" }
      - { url: "https://www.solarwinds.com/trust-center/security-advisories/CVE-2026-28304", publisher: "SolarWinds PSIRT", date: "2026-07-21", role: "primary" }
      - { url: "https://documentation.solarwinds.com/en/success_center/servu/content/release_notes/servu_2026-3_release_notes.htm", publisher: "SolarWinds (Serv-U 2026.3 release notes)", date: "2026-07-21", role: "primary" }
      - { url: "https://www.heise.de/news/Datentransfersoftware-Serv-U-hat-15-kritische-Sicherheitsluecken-11373098.html", publisher: "Heise Online (German)", date: "2026-07-22", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12785 (bridge ncsc-csh recent 10) → primary: SolarWinds PSIRT per-CVE advisory, URL https://www.solarwinds.com/trust-center/security-advisories/CVE-2026-28304 → primary: SolarWinds Serv-U 2026.3 release notes, URL https://documentation.solarwinds.com/en/success_center/servu/content/release_notes/servu_2026-3_release_notes.htm → corroboration: Heise Online, URL https://www.heise.de/news/Datentransfersoftware-Serv-U-hat-15-kritische-Sicherheitsluecken-11373098.html"
    summary: |
      SolarWinds Serv-U (managed file-transfer server) 15.5.4 HF1 and earlier carries sixteen critical (CVSS 3.1 9.1) insecure-direct-object-reference (IDOR, CWE-639) and broken-access-control flaws plus one medium stored-XSS issue, fixed in Serv-U 2026.3 (released 2026-07-21). The chain lets an authenticated user at group-administrator or domain-administrator level escalate to system administrator and achieve remote code execution as root on the underlying host (reduced impact on Windows deployments); individual CVEs cover privilege escalation via configuration-path modification (CVE-2026-28311), arbitrary system-administrator account creation (CVE-2026-28309), arbitrary file read/write (CVE-2026-28321), SMTP-hijack/account-takeover via IDOR (CVE-2026-28313), and domain-user-group elevation to admin group (CVE-2026-28307), among others. All were reported through SolarWinds' Intigriti bug-bounty program; NCSC-CH records current exploitation status as unknown. Serv-U has a documented history of being targeted post-disclosure (e.g. CVE-2021-35211), so treat as a priority patch despite no confirmed ITW activity.
    region_nexus: "global; Serv-U is deployed as an internet-facing managed file-transfer server across public and private sector, including CH/EU government file-exchange use cases"
    primary_sector_nexus: "indirect"
    sector: "public-sector, finance, energy, telco"
