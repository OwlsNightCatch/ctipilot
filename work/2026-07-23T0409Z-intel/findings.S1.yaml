        attribution: "SolarWinds (Serv-U 2026.3 release notes)"
        source_url: "https://documentation.solarwinds.com/en/success_center/servu/content/release_notes/servu_2026-3_release_notes.htm"
    extended_notes: |
      Detection concept: audit Serv-U domain-administrator and group-administrator account activity logs for privilege-escalation actions outside normal admin workflow — new system-administrator account creation, external-tool configuration-path changes, unexpected domain-to-system-admin role changes — and correlate with authentication logs for the account performing them. Hardening: update to Serv-U 2026.3 now; review and prune domain/group-administrator role assignments (the whole chain pivots off an over-privileged authenticated account); do not expose the Serv-U management interface to the internet without additional network controls. No named exploiting actor disclosed — bug-bounty discovery, not field-observed exploitation.
  - title: "Veeam Appliances Updater component: local privilege escalation to root (CVE-2026-56844, CVSS 8.4)"
    sources:
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12784", publisher: "NCSC Switzerland (Cyber Security Hub)", date: "2026-07-22", role: "primary" }
      - { url: "https://www.heise.de/en/news/Backup-software-Veeam-Updater-allows-privilege-escalation-11373057.html", publisher: "Heise Online (English)", date: "2026-07-22", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12784 (bridge ncsc-csh recent 10) → corroboration: Heise Online, URL https://www.heise.de/en/news/Backup-software-Veeam-Updater-allows-privilege-escalation-11373057.html → vendor advisory referenced: Veeam KB4879, URL https://www.veeam.com/kb4879"
    summary: |
      CVE-2026-56844 (CVSS 4.0: 8.4 HIGH) is a local-privilege-escalation flaw in the Veeam Updater component shipped with Veeam Software Appliance and Veeam Infrastructure Appliance (Linux-based). A local, already-authenticated low-privilege user on the appliance can abuse the Updater component to elevate to root, gaining full control of the underlying OS; Windows-based Veeam installations are not directly affected, though remote components running on the Linux appliances remain vulnerable. Vendor patches are available (see Veeam KB4879). NCSC-CH records exploitation status as unknown; no public PoC or ITW activity reported. Relevance for defenders: Veeam backup infrastructure is a recurring post-compromise target for ransomware actors seeking to destroy or tamper with backups, so any local-access foothold on a Veeam appliance host should be treated as a fast path to full appliance takeover until patched.
    region_nexus: "global; Veeam backup/recovery appliances are broadly deployed across CH/EU public and private sector as the last line of defence against ransomware"
    primary_sector_nexus: "indirect"
    sector: "public-sector, energy, finance, healthcare, telco"
    cves: ["CVE-2026-56844"]
    techniques: ["T1068"]
    affected_products: ["Veeam Software Appliance", "Veeam Infrastructure Appliance"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Successful exploitation allows local authenticated attackers to escalate their privileges to root level, gaining full system control of the underlying operating system."
        attribution: "NCSC Switzerland (Cyber Security Hub)"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12784"
    extended_notes: |
      Detection concept: process-creation and file-integrity telemetry on the Veeam appliance host for the Updater component invoking privileged operations outside a scheduled/expected update window, and for unexpected new root-owned processes spawned by a non-root parent tied to the Updater service. Hardening: apply the Veeam patch per KB4879; restrict local (SSH/console) access to Veeam appliance hosts to a minimal admin set, since this flaw's prerequisite is exactly that kind of local access. Borderline priority — local-only prerequisite and no confirmed exploitation, but included given Veeam's status as a standard ransomware-actor objective.
    borderline: true
    borderline_reason: "local-authenticated-only prerequisite (no remote/network vector) and no confirmed exploitation reported anywhere; included because Veeam backup infrastructure is a standing high-value target and the vulnerability class (Updater privesc to root) is directly actionable for defenders hardening backup estates."
