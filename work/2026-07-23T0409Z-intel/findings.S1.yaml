  - title: "Check Point SmartConsole authentication bypass exploited in the wild for full admin takeover (CVE-2026-16232, CVSS 9.1)"
    sources:
      - { url: "https://blog.checkpoint.com/security/security-advisory-action-required-active-exploitation-of-check-point-smartconsole-authentication-bypass-cve-2026-16232/", publisher: "Check Point Software", date: "2026-07-22", role: "primary" }
      - { url: "https://www.cisa.gov/news-events/alerts/2026/07/22/cisa-adds-two-known-exploited-vulnerabilities-catalog", publisher: "CISA (KEV addition alert)", date: "2026-07-22", role: "primary" }
      - { url: "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-47700", publisher: "ENISA EUVD (EUVD-2026-47700)", date: "2026-07-22", role: "corroborating" }
    discovery_trace: "first seen at: cisa-kev, URL https://www.cisa.gov/known-exploited-vulnerabilities-catalog (bridge api fetch, catalogVersion 2026.07.22) → pivot: Check Point PSIRT blog, URL https://blog.checkpoint.com/security/security-advisory-action-required-active-exploitation-of-check-point-smartconsole-authentication-bypass-cve-2026-16232/ → corroboration: CISA KEV addition alert, URL https://www.cisa.gov/news-events/alerts/2026/07/22/cisa-adds-two-known-exploited-vulnerabilities-catalog → corroboration: ENISA EUVD, URL via bridge enisa-euvd recent exploited (EUVD-2026-47700)"
    summary: |
      CVE-2026-16232 (CWE-287, CVSS 3.1 9.1) is an authentication-bypass flaw in the SmartConsole login process of Check Point Security Management and Multi-Domain Security Management (affected: R81.10, R81.20, R82, R82.10+). An unauthenticated remote attacker who can reach the Management Server IP obtains an application login token and uses it to authenticate to SmartConsole with full administrative privileges, enabling changes to firewall security policy and configuration. Exploitation requires the Management Server to be exposed directly to the internet with no restriction on Trusted Clients (GUI-client IP allow-list) — Check Point states this affects "a very specific configuration" and confirms active exploitation against "a handful of customers" with that exposure. CISA added the CVE to KEV the same day (2026-07-22) alongside the already-tracked SharePoint deserialization CVE-2026-50522. Check Point shipped a Jumbo Hotfix same-day; the vendor's interim mitigation is restricting Trusted Clients to known management IPs.
    region_nexus: "global; Check Point is a widely deployed firewall/security-management vendor across Swiss and EU government and critical-infrastructure networks"
    primary_sector_nexus: "direct"
    sector: "public-sector, energy, finance, telco, healthcare, transport, water"
    cves: ["CVE-2026-16232"]
    techniques: ["T1190"]
    affected_products: ["Check Point SmartConsole", "Check Point Security Management", "Check Point Multi-Domain Security Management"]
    entity_keys: []
