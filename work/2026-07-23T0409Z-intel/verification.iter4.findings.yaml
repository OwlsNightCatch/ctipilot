  item: "SolarWinds Serv-U 2026.3 — 15 critical IDOR flaws (solarwinds-serv-u-2026-3-critical-idor-priv-esc-root)"
  url_or_quote: "cves[].type: rce on CVE-2026-28306 / -28307 / -28309 / -28310 / -28314 / -28317"
  summary: >-
    The iteration-3 blanket retype of every CVSS 9.1 Serv-U critical to `rce` is over-broad
    and now contradicts the vendor's own per-CVE authority. Direct fetches of the SolarWinds
    per-CVE advisories (the entry's own primary-source class) title six of the retyped CVEs
    as NOT remote code execution: CVE-2026-28306 "Serv-U Privilege Escalation Vulnerability"
    ("allows a domain administrator to elevate their privileges to a system administrator");
    CVE-2026-28307 "Privilege Escalation Vulnerability" ("domain user group ... elevated into
    an administrator group"); CVE-2026-28309 "Broken Access Control Vulnerability" ("allows a
    domain administrator to create system administrator accounts"); CVE-2026-28310 "Privilege
    Escalation Vulnerability" ("escalate their user type to that of a system administrator");
    CVE-2026-28314 "IDOR Vulnerability" ("leads to an account takeover"); CVE-2026-28317 "IDOR
    Vulnerability" ("can lead to privilege escalation"). None of these six advisory pages state
    remote code execution. Suggested realignment to the per-CVE advisory titles/release notes:
    rce = 28302,28304,28305,28308,28311,28312,28316,28321 (each states RCE / root code or command
    execution); priv-esc = 28306,28307,28309,28310,28317; auth-bypass = 28313,28314 (both account
    takeover — 28314 should match the treatment already given to 28313); xss = 28315.
    The overall headline/summary framing of an IDOR-to-root-RCE chain remains accurate and is
    not flagged; only the per-CVE `type` fields overstate individual flaws.
