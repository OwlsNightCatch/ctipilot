    extended_notes: |
      Defender vantage — hunt/detection concepts (behavioural, no IOCs):
      - AI-assistant config integrity: baseline and monitor writes to AI coding-assistant
        configuration files (Claude Desktop / Cursor / VS Code / Windsurf) that register
        a NEW MCP tool provider, especially one pointing at a hidden/dot directory. An
        unexpected MCP-provider entry appearing shortly after a package install is the
        highest-value single artifact.
      - git persistence: alert on modification of `git config --global init.templateDir`
        and unauthorised writes to the global git-template hooks path — a hook that fires
        on every future `git init`/clone is durable persistence that survives the original
        package.
      - Process-lineage telemetry: node/npm process trees performing narrowly-scoped actions
        against git hooks, package-registry operations, or AI-config files. Class: process-
        creation events (parent = node/npm) correlated with path-specific file writes.
      - Credential-access telemetry: reads of ~/.aws, ~/.ssh, .env and environment-variable
        harvesting followed by egress; DNS-tunnelling egress as a fallback channel (monitor
        anomalous outbound DNS volume/entropy from developer/CI hosts).
      - Time-window blind spot: the 48-96h activation delay defeats install->behaviour
        correlation. Hardening lever CrowdStrike names: extend telemetry retention/correlation
        windows beyond 96h; require review/approval gates before npm publish and git-hook
        changes; scope and short-live CI credentials.
      Naming caution for the composer: SANDWORM_MODE is a supply-chain WORM/malware family and
      is unrelated to the Russian GRU actor "Sandworm" (actor:sandworm in the registry). Do not
      cross-link. Lineage context (from socket.dev, not independently verified here): reported
      alongside the s1ngularity/Shai-Hulud npm-worm lineage as the AI-toolchain evolution of
      that attack class.
