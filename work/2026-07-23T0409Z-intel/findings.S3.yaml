    discovery_trace: "first seen at: WebSearch (\"CrowdStrike Denying the Worm MCP Cursor supply-chain worm AI developer toolchain\") → primary: CrowdStrike blog 'Detecting SANDWORM_MODE and AI Toolchain Supply Chain Attacks', URL https://www.crowdstrike.com/en-us/blog/denying-the-worm-sandworm-mode-and-ai-toolchain-supply-chain-attacks/ → corroboration: SecurityBrief, URL https://securitybrief.com.au/story/crowdstrike-warns-of-malware-targeting-ai-coding-tools"
    summary: |
      CrowdStrike published defensive research (2026-07-21) on SANDWORM_MODE, a
      multi-stage npm supply-chain worm — discovered February 2026 — that targets
      AI-augmented developer workflows rather than only conventional package
      distribution or build systems. The transferable shift CrowdStrike names is
      "living off the AI toolchain": the malware abuses the normalised runtime
      behaviours of AI coding assistants, CI automation and LLM tooling so that its
      malicious actions blend into legitimate developer telemetry. Observable
      behaviours the vendor describes: on install the worm writes unexpected entries
      into AI-assistant configuration files (Claude Desktop, Cursor, VS Code,
      Windsurf) that register a rogue Model Context Protocol (MCP) tool provider
      staged in a hidden directory; it injects git hooks under the global
      git-template hooks path (persistence that fires on future git operations); it
      harvests credentials from environment variables and .env / SSH-key files —
      npm tokens, AWS keys, SSH keys, and API keys for multiple LLM providers
      (OpenAI, Anthropic, Google, Groq, Together, Fireworks, Replicate, Mistral,
      Cohere). It fingerprints the host to separate developer workstations from CI
      runners, delaying full payload activation 48–96 hours on workstations (immediate
      on CI) specifically to defeat detection tools that correlate install-time and
      behaviour signals, and falls back to DNS tunnelling when primary exfiltration
      is blocked. CrowdStrike's own candour is the load-bearing defender lesson: of
      14 investigated behaviours only 9 produced any signal and only 2 met the bar
      for high-fidelity alerting — because npm publish, repo pushes, LLM-API calls,
      credential handling and file writes overlap heavily with legitimate developer
      and CI activity. This is distinct from the run's already-covered AI stories
      (GPT5.6 autonomous exploit-dev; the Hugging Face autonomous-agent breach): here
      the AI developer toolchain itself is the propagation and credential-access
      surface.
