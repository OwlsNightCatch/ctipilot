  item: "CVE-2026-16232 — Check Point SmartConsole auth bypass"
  url_or_quote: "evidence[] quote 'Check Point is aware that this vulnerability is being exploited and has affected a very small number of customers.' attributed to ENISA EUVD."
  summary: "EUVD-attributed evidence quote could not be verified — euvd.enisa.europa.eu returns an app-unavailable JS shell to WebFetch, bridge url, and jina alike (genuinely down this run, not a fetch-ladder failure). Check Point's own confirmed wording is 'affecting a handful of customers', not 'a very small number of customers'. The body dual-attributes 'a very small number of customers' partly to Check Point. Re-verify the EUVD quote when EUVD is reachable, or realign the customer-count phrasing to Check Point's verified 'a handful of customers'. Advisory only."
