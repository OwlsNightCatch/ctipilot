  item: "CVE-2026-16232 — Check Point SmartConsole auth bypass"
  url_or_quote: "Entry states CVSS 9.1 (headline/summary/frontmatter cves[].cvss). Cited primary https://blog.checkpoint.com/security/security-advisory-action-required-active-exploitation-of-check-point-smartconsole-authentication-bypass-cve-2026-16232/ prints CVSS 9.3 for CVE-2026-16232 (confirmed via two targeted fetches)."
  summary: "Vendor-vs-NVD score split unreconciled. NVD (https://nvd.nist.gov/vuln/detail/CVE-2026-16232) scores 9.1 with vector CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N (math confirms 9.1); Check Point PSIRT prints 9.3. Entry uses 9.1 but cites only Check Point (9.3) as the scoring source. Add NVD as a corroborating source (backs 9.1) and/or add a Contradiction line noting the vendor scores it 9.3. Minor magnitude (both critical, priority unaffected)."
