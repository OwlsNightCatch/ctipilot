  - title: "GLPI 11.0.8/10.0.26 patch 16 vulnerabilities incl. two critical (pre-auth-adjacent RCE via form import, MFA bypass) in the ITSM/asset-management platform widely run by French and EU public-sector, education and healthcare IT"
    sources:
      - { url: "https://www.glpi-project.org/en/glpi-11-0-8-and-10-0-26-available/", publisher: "GLPI Project", date: "2026-07-21", role: "primary" }
      - { url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0909/", publisher: "CERT-FR / ANSSI", date: "2026-07-22", role: "primary" }
      - { url: "https://www.it-connect.tech/glpi-11-0-8-and-10-0-26-patch-16-flaws-including-2-critical-vulnerabilities/", publisher: "IT-Connect", date: "2026-07-21", role: "corroborating" }
    discovery_trace: "first seen at: anssi-fr (cert-fr avis-recent feed), URL https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0909/ → pivot: IT-Connect, URL https://www.it-connect.tech/glpi-11-0-8-and-10-0-26-patch-16-flaws-including-2-critical-vulnerabilities/ → primary: GLPI Project security release, URL https://www.glpi-project.org/en/glpi-11-0-8-and-10-0-26-available/"
    summary: |
      The GLPI project shipped 11.0.8 and 10.0.26 on 21 July 2026, fixing 16 vulnerabilities (11
      in the 11.0 branch, 10 in 10.0, 5 shared), and CERT-FR published its own advisory
      (CERTFR-2026-AVI-0909) the next day. GLPI is a widely-deployed open-source IT-asset/helpdesk
      management platform used across French and broader EU public administration, education and
      healthcare organisations. Two flaws are rated critical: CVE-2026-48482, remote code
      execution via GLPI 11's native form-import feature (an attacker who can craft/submit a
      malicious form file gets code execution with application privileges — no memory-safety bug,
      an unsafe-deserialization/parsing path in the import handler); and CVE-2026-52848, a
      complete bypass of GLPI 11's multi-factor authentication mechanism, defeating the 2FA
      hardening the 11.x branch specifically introduced. High-severity entries add further
      exploitation depth: CVE-2026-49470 (account takeover via brute-forcing the 2FA code itself,
      i.e. no rate-limiting on OTP verification), CVE-2026-53625 (privilege escalation through the
      authtype API), CVE-2026-47678/-53629 (SQL injection in dropdown and history-tab components),
      CVE-2026-47679 (arbitrary file deletion), CVE-2026-53626 (arbitrary document read), and
      stored/reflected XSS in suppliers and dashboards (CVE-2026-55214, CVE-2026-53610). CERT-FR's
      own advisory text lists only a subset of the CVEs (confidentiality/integrity/security-bypass
      framing) without CVSS scores, per its usual practice — the full severity picture requires
      the vendor's own release notes. Affected: GLPI 11.0.x before 11.0.8, and all versions before
      10.0.26. No in-the-wild exploitation reported by any source in this run.
    region_nexus: "direct — French public administration (CERT-FR/ANSSI advisory) with broad EU-wide deployment in schools, hospitals, municipalities and ministries running GLPI for IT-asset/helpdesk management"
