  - title: "SolarWinds Serv-U 2026.3 patches 15 critical (CVSS 9.1) IDOR flaws letting authenticated users escalate to root/system-administrator"
    sources:
      - { url: "https://documentation.solarwinds.com/en/success_center/servu/content/release_notes/servu_2026-3_release_notes.htm", publisher: "SolarWinds", date: "2026-07-21", role: "primary" }
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12785", publisher: "NCSC Switzerland (GovCERT.ch Cyber Security Hub)", date: "2026-07-22", role: "primary" }
      - { url: "https://www.heise.de/news/Datentransfersoftware-Serv-U-hat-15-kritische-Sicherheitsluecken-11373098.html", publisher: "heise online", date: "2026-07-22", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12785 → corroboration: heise online, URL https://www.heise.de/news/Datentransfersoftware-Serv-U-hat-15-kritische-Sicherheitsluecken-11373098.html → primary: SolarWinds release notes, URL https://documentation.solarwinds.com/en/success_center/servu/content/release_notes/servu_2026-3_release_notes.htm"
    summary: |
      SolarWinds released Serv-U 2026.3 on 21 July 2026, fixing 16 CVEs, 15 of them CVSS 9.1
      Critical: CVE-2026-28302, -28304, -28310 through -28314, -28316, -28317 and -28321 (exact
      set per NCSC-CH: -28302, -28304, -28314, -28316, -28317, -28321) are insecure direct object
      reference (IDOR) flaws in Serv-U's managed-file-transfer web console that let an
      authenticated, lower-privileged user (in several cases requiring only group- or domain-
      administrator scope, not full system-administrator) reach root-level remote code execution,
      arbitrary account takeover, or unrestricted file read/write on the underlying server — i.e.
      broken object-level authorization rather than a memory-safety bug. CVE-2026-28315 (CVSS 6.2)
      is a stored XSS in the admin UI usable for session hijacking. NCSC-CH and heise both flag the
      release without confirming active exploitation; heise notes Serv-U's history as a target for
      the Cl0p ransomware affiliate in prior MOVEit-class campaigns as context for why file-
      transfer software patch-lag is a recurring high-value target class, not evidence this
      specific chain is already exploited. Prerequisite for the worst-case CVEs is an existing
      authenticated (often admin-tier) session — this is a lateral-privilege-escalation and
      full-compromise risk for anyone already inside a Serv-U tenant, not a pre-auth internet
      exploitation path.
    region_nexus: "global; Serv-U MFT is commonly deployed for CH/EU enterprise and public-sector file-exchange"
