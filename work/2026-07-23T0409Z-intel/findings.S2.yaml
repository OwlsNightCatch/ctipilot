  - title: "Oracle's July 2026 Critical Patch Update fixes 1,449 flaws, including three CVSS 9.9 unauthenticated RCEs in Database, TimesTen and Commerce Platform"
    sources:
      - { url: "https://www.oracle.com/security-alerts/cpujul2026.html", publisher: "Oracle", date: "2026-07-22", role: "primary" }
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12786", publisher: "NCSC Switzerland (GovCERT.ch Cyber Security Hub)", date: "2026-07-22", role: "primary" }
      - { url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0254", publisher: "NCSC-NL", date: "2026-07-22", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12786 → corroboration: advisories-ncsc-nl, URL https://advisories.ncsc.nl/rss/advisories (feed) → advisory https://advisories.ncsc.nl/advisory?id=NCSC-2026-0254 → primary: Oracle, URL https://www.oracle.com/security-alerts/cpujul2026.html"
    summary: |
      Oracle's July 2026 Critical Patch Update (CPU) fixes 1,449 new security patches across the
      full product line — Database Server, E-Business Suite, PeopleSoft Enterprise, Commerce
      Platform, Communications, Enterprise Manager, Java SE/GraalVM and more — and both NCSC
      Switzerland and NCSC-NL flagged it independently the same day. The highest-severity entries
      are CVSS 9.9: CVE-2026-61211 (Oracle Database RDBMS, reachable via the DBMS_CLOUD package —
      a low-privileged, network-authenticated attacker with EXECUTE on DBMS_CLOUD gets full RDBMS
      takeover), CVE-2026-60402 (TimesTen In-Memory Database's Kubernetes Operator component — a
      low-privileged attacker over HTTPS gets full control of the database instance), and
      CVE-2026-61146 (Commerce Content Acquisition System — unauthenticated attacker over HTTP/RMI
      reaches full system compromise). NCSC-NL's own advisory batch additionally flags 9.8-9.9
      unauthenticated RCEs in Oracle PeopleSoft Enterprise (HCM Talent Acquisition Manager, SCM
      eProcurement) and Oracle Commerce Platform/Guided Search — modules commonly run by public-
      sector HR/procurement and e-commerce back offices. Oracle itself states it "continues to
      periodically receive reports of attempts to maliciously exploit vulnerabilities for which
      Oracle has already released security patches," i.e. attackers actively target unpatched
      Oracle estates from prior CPUs, not (yet) this one specifically — no confirmed in-the-wild
      exploitation of the new CVEs as of writing. Given Oracle Database/PeopleSoft/E-Business
      Suite are entrenched in CH/EU public-sector and finance-sector back-office and ERP
      deployments, patch-cycle prioritisation of the CVSS 9+ entries is the actionable item this
      run.
    region_nexus: "global; independently flagged by both NCSC-CH and NCSC-NL, both used as home/near-region government back-office and finance-sector infrastructure (Oracle DB, PeopleSoft, E-Business Suite)"
