    discovery_trace: "first seen at: BleepingComputer RSS feed, URL https://www.bleepingcomputer.com/news/security/arystinger-botnet-infected-thousands-of-d-link-routers-worldwide/ (published 2026-06-21T14:14Z, in 36h window) → primary: Qianxin XLab research blog, URL https://blog.xlab.qianxin.com/arystinger-botnet-hijacks-legacy-routers-for-global-attacks-en/"
    summary: |
      Qianxin XLab disclosed AryStinger, a previously undocumented botnet first observed on March 12, 2026 spreading via two EoL router vulnerabilities (CVE-2013-3307 and CVE-2016-5681 affecting Linksys and D-Link RTL819X-class devices) and, from April 26, via CVE-2025-11837 (QNAP Malware Remover code-injection, Pwn2Own 2025 demo, patched in v6.6.8.20251023). The botnet runs two malware variants: an RTL819X C-language version targeting legacy routers (D-Link DIR-850L 75%, DIR-818LW 13%) with massdns and traffic-tunnel capability, and a Go-language Standard version for NAS devices with integrated fscan, ksubdomain, httpx, and Tlsx recon tooling plus remote command and source-level Go/Java/Python payload execution. The core design purpose is pre-intrusion reconnaissance infrastructure rather than DDoS or cryptomining: infected nodes are assigned distributed DNS subdomain brute-force scanning tasks by a C2 server, split across Executors in parallel to map attack surfaces at scale. Nodes also deploy a dropbear SSH backdoor on a fixed local port and configure iptables to allow inbound C2 traffic, establishing persistent SYSTEM-level remote access. NAT-tunnel tooling lets the C2 proxy attack traffic through compromised nodes, hiding the operator's true origin. At least 4,300 routers are confirmed infected based on asset-scanning for the botnet's dropbear deployment pattern; geographic distribution is South Korea 48.5%, China 31.8%, Sweden 6.4%, Malaysia 3.5%, Singapore 2.5%. VirusTotal detection rate at disclosure was zero. No attribution claimed by XLab; the hardcoded XOR key "sh_#@!_2024_secret" and the Go project name "Ary-Attack" suggest activity since at least 2024.

      CVE-2013-3307: Remote command execution in Linksys routers (RCE via cgi-bin handling); CVE-2016-5681: Remote code execution in D-Link DIR-850L via stack-based buffer overflow in HTTP service; CVE-2025-11837: Code injection in QNAP Malware Remover ≤6.6.8.20250925 (fixed 6.6.8.20251023).

      Defender takeaway: Hunt for dropbear SSH processes on unusual ports on Linux/MIPS-based network devices. Network-level: alert on outbound massdns-pattern DNS query bursts from edge-network IP segments; Protobuf-over-HTTP C2 to domains matching "ajb8.com" and "auq8.com" suffixes. EDR/HIDS on QNAP NAS: monitor for curl|python spawning from the Malware Remover process tree (T1059.006), file writes to /tmp/bin/ by security service processes (T1036), and iptables rule modifications by non-privileged processes (T1562.004). Hardening: replace EoL D-Link DIR-850L and DIR-818LW immediately (no firmware fix possible); patch QNAP Malware Remover to ≥6.6.8.20251023; restrict inbound SSH on management VLANs to known jump-hosts only.
