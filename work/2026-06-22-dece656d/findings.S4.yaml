  - title: "Switzerland EFK federal audit: coordination gaps between BACS and FS BIS leave federal cyber-incident picture incomplete"
    sources:
      - { url: "https://www.swisscybersecurity.net/news/2026-06-19/neue-cyberaufsicht-kaempft-mit-anlaufschwierigkeiten", publisher: "SwissCybersecurity.net", date: "2026-06-19", role: "primary" }
      - { url: "https://www.netzwoche.ch/news/2026-06-19/neue-cyberaufsicht-kaempft-mit-anlaufschwierigkeiten", publisher: "Netzwoche", date: "2026-06-19", role: "corroborating" }
      - { url: "https://www.efk.admin.ch/wp-content/uploads/publikationen/berichte/wirtschaft_und_verwaltung/informatikprojekte/25152/25152-wik-sepos-fs-bis_d.pdf", publisher: "EFK (Swiss Federal Audit Office)", date: "2026-06-19", role: "primary" }
    discovery_trace: "first seen at: inside-it-ch RSS feed item 'EFK sieht Lücken in der Cyberabwehr des Bundes' (2026-06-18) → pivot: SwissCybersecurity.net article, URL https://www.swisscybersecurity.net/news/2026-06-19/neue-cyberaufsicht-kaempft-mit-anlaufschwierigkeiten → primary: EFK report PDF, URL https://www.efk.admin.ch/wp-content/uploads/publikationen/berichte/wirtschaft_und_verwaltung/informatikprojekte/25152/25152-wik-sepos-fs-bis_d.pdf"
    summary: |
      Switzerland's Federal Audit Office (EFK) published an audit on 2026-06-19 finding that the two-year-old reorganized federal cybersecurity structure suffers from coordination failures that leave the strategic oversight body (FS BIS, within SEPOS) without a complete picture of security-relevant events in federal systems. The audit identifies three specific gaps: (1) contracted "Vorgabenmanagement" (requirements management) support from BACS to FS BIS is not being delivered at the agreed scope under the existing service-level agreement; (2) BACS lacks the legal authority to independently forward incident reports to SEPOS/FS BIS — agencies opt in to sharing via the Cyber Security Hub platform, meaning FS BIS may miss incidents it should see; (3) incident response coordination was inconsistent across cases, with stakeholders sometimes unaware of parallel measures taken by the peer body. EFK reviewed a cloud collaboration tool security incident where coordination worked well but noted other cases failed. EFK explicitly rejected a further reorganization (merging under BACS), recommending instead that BACS and FS BIS leadership resolve their differences at management level and clarify roles. The audit's operational implication for Swiss federal SOC defenders: SEPOS-level threat analysis may be missing incident data that BACS holds but cannot share without opt-in from the originating agency, creating visibility gaps in the federal incident picture.
    ch_eu_nexus: "direct; concerns Swiss federal government cybersecurity governance and the Bundesverwaltung's cyber-incident picture"
    public_sector_nexus: "direct"
    sector: "government, public administration"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Vereinbarte Unterstützungsleistungen stünden nicht im vorgesehenen Umfang zur Verfügung"
        attribution: "EFK (via Netzwoche/SwissCybersecurity.net)"
        source_url: "https://www.netzwoche.ch/news/2026-06-19/neue-cyberaufsicht-kaempft-mit-anlaufschwierigkeiten"
      - quote: "BACS lacks legal authority to forward incident data independently, meaning FS BIS may miss critical security events needed for threat assessment"
        attribution: "SwissCybersecurity.net"
        source_url: "https://www.swisscybersecurity.net/news/2026-06-19/neue-cyberaufsicht-kaempft-mit-anlaufschwierigkeiten"
    extended_notes: |
      The Cyber Security Hub mentioned is BACS's incident reporting platform under the ISG (Informationssicherheitsgesetz). The opt-in sharing mechanism means FS BIS's visibility is dependent on agencies affirmatively enabling SEPOS data-sharing — a structural gap the EFK judges unacceptable. The German-language EFK report reference: 25152-WIK-SEPOS-FS-BIS. The Inside-IT.ch RSS item that flagged this was dated 2026-06-18; the full EFK report and press coverage appeared 2026-06-19.

  - title: "NCSC UK: hostile states behind 75% of cyber incidents at UK critical national infrastructure (June 2025–May 2026)"
    sources:
      - { url: "https://www.ncsc.gov.uk/news/ncsc-ceo-hostile-states-linked-to-three-quarters-of-cyber-attacks", publisher: "NCSC UK", date: "2026-06-17", role: "primary" }
      - { url: "https://therecord.media/britain-nation-state-cyberattacks-richard-horne-rusi", publisher: "The Record (Recorded Future News)", date: "2026-06-17", role: "corroborating" }
      - { url: "https://www.infosecurity-magazine.com/news/hostile-states-cni-75-percent-ncsc/", publisher: "Infosecurity Magazine", date: "2026-06-18", role: "corroborating" }
      - { url: "https://www.ncsc.gov.uk/speech/richard-horne-speaking-at-the-rusi-annual-security-lecture", publisher: "NCSC UK (full speech text)", date: "2026-06-17", role: "primary" }
    discovery_trace: "first seen at: infosecurity-magazine RSS feed item 'Hostile States Behind 75% of Cyber-Attacks on UK Critical Infrastructure, NCSC Warns' (2026-06-18), URL https://www.infosecurity-magazine.com/news/hostile-states-cni-75-percent-ncsc/ → primary: NCSC press release, URL https://www.ncsc.gov.uk/news/ncsc-ceo-hostile-states-linked-to-three-quarters-of-cyber-attacks → speech text: https://www.ncsc.gov.uk/speech/richard-horne-speaking-at-the-rusi-annual-security-lecture"
    summary: |
      NCSC CEO Richard Horne disclosed at the RUSI Annual Security Lecture (London, 2026-06-17) that of the more than 200 cyber incidents affecting UK critical national infrastructure managed by the NCSC in the year to May 2026, approximately 75% were attributed to state actors. Russia, China, and Iran were named. The speech reframed cyber security as an "ongoing contest" rather than a risk to be managed — calling out prepositioning activity by hostile states who are "gathering intelligence today to enable kinetic targeting tomorrow." A concurrent NCSC assessment rated it "highly likely" (by 2028) that AI-augmented capabilities will be used to exploit known vulnerabilities in legacy CNI technology. Horne also cited the Volt Typhoon campaign (US CNI prepositioning, attributed 2024) as an example of the espionage-plus-prepositioning pattern that should concern all allied defenders. The framing has direct relevance to Swiss and EU defenders: the NCSC's 75% figure, if replicated in continental European CNI environments, implies that most significant CNI incidents are state-actor campaigns — meaning IR response playbooks and detection logic must account for persistent, low-and-slow access rather than opportunistic criminal exploitation alone.
    ch_eu_nexus: "indirect but high relevance; EU/European state-actor threat pattern directly applies to Swiss federal and EU CNI operators; NCSC is a HIGH-reliability national authority"
