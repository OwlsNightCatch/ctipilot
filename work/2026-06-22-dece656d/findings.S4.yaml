    extended_notes: |
      Transitions Pro Centre Val de Loire is a quasi-governmental French body ("opérateur de compétences" / OPCO-adjacent) funded through employer contributions and supervised by the French Labour Ministry, administering vocational transition programmes. Its data will include personal and professional records of workers undergoing retraining — GDPR-sensitive. The CNIL notification obligation under GDPR Art.33 applies. No victim statement has been located. Ransomware.live lists the attack date as approximately May 3, with listing on May 16.

  - title: "Brazil Civil Defense Cell Broadcast system hijacked — unauthorized extreme alerts sent to ~30M mobile phones across seven states"
    sources:
      - { url: "https://thenextweb.com/news/brazil-civil-defense-alert-hack-misanthropy-cell-broadcast", publisher: "The Next Web", date: "2026-06-20", role: "primary" }
      - { url: "https://www.bloomberg.com/news/articles/2026-06-20/millions-in-brazil-get-fake-government-mobile-alert-after-hack", publisher: "Bloomberg", date: "2026-06-20", role: "corroborating" }
    discovery_trace: "first seen at: databreaches-net RSS feed item 'Brazil's Civil Defense suffers a cyberattack on its official alert network' (2026-06-21), URL https://databreaches.net/2026/06/21/brazils-civil-defense-suffers-a-cyberattack-on-its-official-alert-network/ → pivot: The Next Web primary, URL https://thenextweb.com/news/brazil-civil-defense-alert-hack-misanthropy-cell-broadcast → corroborating: Bloomberg, URL https://www.bloomberg.com/news/articles/2026-06-20/millions-in-brazil-get-fake-government-mobile-alert-after-hack"
    summary: |
      Brazil's national Cell Broadcast emergency alert system (mandated by Anatel, expanded nationally October 2025) was compromised overnight June 19-20, 2026, when an unknown actor sent at least 10 unauthorized "Extreme Alert" notifications — the highest-severity tier, used for imminent-danger events — containing the message "misantropi4" (leetspeak for misanthropy) to approximately 30 million mobile phones across seven states (Paraná, São Paulo, Rio de Janeiro, Brasília, Bahia, Pará, Mato Grosso do Sul, Acre). Cell Broadcast by design bypasses user opt-outs and activates devices in silent mode. The Ministry of Integration and Regional Development took the Cell Broadcast platform offline at 1:30 AM on June 20 after confirming unauthorized access; four telecoms were involved (Algar, Claro, TIM, Vivo). Brazil's Federal Police opened an investigation; no threat actor has been formally attributed — a person claiming responsibility posted on X before posts were removed, but police have not confirmed that claim. The specific access vector (compromised admin credential, API key, or platform vulnerability) has not been publicly disclosed. This is a demonstrator case for Cell Broadcast infrastructure risk: the system intentionally bypasses user consent, making it a high-impact leverage point — both for emergency management and for adversaries who compromise its administration interface. European and Swiss operators running Cell Broadcast systems (EU directive-mandated since 2022) should note that a platform-level compromise is not a fringe scenario.
    ch_eu_nexus: "indirect — same Cell Broadcast technology deployed across EU member states and Switzerland under EU Electronic Communications Code directive; operational lesson applies directly"
    public_sector_nexus: "direct (national emergency management infrastructure)"
    sector: "emergency services, critical national infrastructure, telecoms"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Cell Broadcast systems globally lack cryptographic authentication, making them vulnerable to both direct attacks and clandestine transmitters"
        attribution: "The Next Web"
        source_url: "https://thenextweb.com/news/brazil-civil-defense-alert-hack-misanthropy-cell-broadcast"
      - quote: "Ministry of Integration and Regional Development confirmed the intrusion"
        attribution: "Bloomberg"
        source_url: "https://www.bloomberg.com/news/articles/2026-06-20/millions-in-brazil-get-fake-government-mobile-alert-after-hack"
    extended_notes: |
      EU Electronic Communications Code (Directive 2018/1972/EU) requires all EU member states to implement Cell Broadcast-based public warning systems, with the 2022 deadline since met by most. Switzerland's Federal Office for Civil Protection (BABS) also operates Cell Broadcast (ALERTSWISS). The Brazil incident highlights a risk class — unauthorized administrative access to Cell Broadcast platform rather than radio-side spoofing — that regulators and system operators should address with privileged-access management (PAM) controls, MFA for platform admin accounts, and anomaly-detection on outbound broadcast commands. CONFIDENCE is MEDIUM not HIGH because the precise access method has not been disclosed and the investigation is open.

  - title: "AryStinger botnet: previously undocumented proxy/reconnaissance network exploiting decade-old D-Link CVEs (CVE-2013-3307, CVE-2016-5681) plus CVE-2025-11837 on NAS"
    sources:
      - { url: "https://blog.xlab.qianxin.com/arystinger-botnet-hijacks-legacy-routers-for-global-attacks-en/", publisher: "QiAnXin XLab", date: "2026-06-21", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/arystinger-botnet-infected-thousands-of-d-link-routers-worldwide/", publisher: "BleepingComputer", date: "2026-06-21", role: "corroborating" }
    discovery_trace: "first seen at: BleepingComputer news listing (bridge fetch of listing page), URL https://www.bleepingcomputer.com/news/security/arystinger-botnet-infected-thousands-of-d-link-routers-worldwide/ → primary: QiAnXin XLab technical blog, URL https://blog.xlab.qianxin.com/arystinger-botnet-hijacks-legacy-routers-for-global-attacks-en/"
    summary: |
      QiAnXin XLab published a technical analysis on 2026-06-21 of a previously undocumented botnet named AryStinger that has compromised over 4,300 legacy D-Link routers (primarily DIR-850L at 75% and DIR-818LW at 13%), devices with Realtek RTL819X chipsets produced 2012–2015. Initial infection exploits three CVEs: CVE-2013-3307 and CVE-2016-5681 on routers; CVE-2025-11837 on NAS devices. Post-exploitation chain: download script retrieves latest payload from C2 → bot authenticates with unique Executor ID → Dropbear SSH server deployed for persistent backdoor → bot waits for task assignments. Two malware variants exist: an RTL819X C-based variant for constrained devices (DNS reconnaissance, traffic tunneling/proxying) and a Go-based standard variant for more capable hosts (integrated scanning with Fscan/Ksubdomain/httpx, remote command execution, source-level payload execution in Go/Java/Python, gs-netcat persistence). Geographic distribution: South Korea 48.5%, China 31.8%, Sweden 6.4%, Malaysia 3.5%, Singapore 2.5%. Swedish presence (6.4%) indicates EU/European infrastructure involvement. XLab detected the botnet from March 12, 2026; hardcoded encryption key "sh_#@!_2024_secret" suggests activity may predate 2026. C2 domains: eixfi.ajb8.com, dybic.ajb8.com, opi7.com, sdkv1.dataexplore.cc. The botnet's primary purpose appears reconnaissance and proxy infrastructure rather than DDoS/mining. D-Link DIR-850L and DIR-818LW are end-of-life devices; vendor has not issued patches. Affected devices should be replaced; network defenders should monitor for unusual egress from legacy router management interfaces and traffic to the identified C2 domains.
    ch_eu_nexus: "indirect — 6.4% Sweden nodes; legacy D-Link devices are common across European SMB and municipal networks; EU/CH relevance through presence of end-of-life perimeter devices"
    public_sector_nexus: "indirect (affects any organization running EOL D-Link routers)"
    sector: "horizontal (cross-sector infrastructure)"
    cves: ["CVE-2013-3307", "CVE-2016-5681", "CVE-2025-11837"]
    actors_campaigns_malware: ["AryStinger"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "AryStinger has compromised more than 4,000 outdated routers to turn them into proxies for malicious traffic"
        attribution: "BleepingComputer (via QiAnXin XLab)"
        source_url: "https://www.bleepingcomputer.com/news/security/arystinger-botnet-infected-thousands-of-d-link-routers-worldwide/"
      - quote: "Intranet scanning using integrated tools (Fscan, Ksubdomain, httpx), Remote command execution, Source-level payload execution"
        attribution: "QiAnXin XLab"
        source_url: "https://blog.xlab.qianxin.com/arystinger-botnet-hijacks-legacy-routers-for-global-attacks-en/"
    extended_notes: |
      CVE-2013-3307 (CVSS 10.0) and CVE-2016-5681 are from 2013 and 2016 respectively — the longevity of this threat demonstrates the extended risk window for end-of-life perimeter devices. D-Link has published a support announcement (SAP10503) confirming DIR-850L and DIR-818LW are EOL with no patch planned. CVE-2025-11837 (the NAS vector) is comparatively recent and may indicate the operator is actively adding new initial-access vectors. The Dropbear SSH backdoor gives persistent administrative access; defenders checking for this should look for unexpected SSH daemons on router devices and unexpected outbound SSH to C2 ranges. The XOR encryption key ("sh_#@!_2024_secret") embedded in samples is a weak symmetric key that defenders with PCAP access could use to identify C2 beacon traffic.

  - title: "UPDATE: FulcrumSec / Global Schools Group — dual court injunctions (Singapore High Court, Bombay High Court) fail to halt data publication; PDPC investigation opened"
    sources:
      - { url: "https://databreaches.net/2026/06/20/global-schools-group-obtained-two-court-injunctions-that-didnt-seem-to-change-much-and-might-backfire/", publisher: "DataBreaches.net", date: "2026-06-20", role: "primary" }
      - { url: "https://www.barandbench.com/news/bombay-high-court-restrains-hacker-group-from-disclosing-school-childrens-sensitive-data", publisher: "Bar and Bench (Indian legal news)", date: "2026-06-19", role: "corroborating" }
    discovery_trace: "first seen at: databreaches-net RSS feed item 'Global Schools Group Obtained Two Court Injunctions That Didn't Seem to Change Much—and Might Backfire' (2026-06-20), URL https://databreaches.net/2026/06/20/global-schools-group-obtained-two-court-injunctions-that-didnt-seem-to-change-much-and-might-backfire/ — direct-fetch of DataBreaches.net URL returned 403 (documented in fetch_failures); used WebSearch for corroborating detail → corroborating: Bar and Bench, URL https://www.barandbench.com/news/bombay-high-court-restrains-hacker-group-from-disclosing-school-childrens-sensitive-data"
    summary: |
      The ongoing FulcrumSec extortion of Global Schools Group (Singapore; 45,000+ students across 12 international school brands, 65 campuses in India, Malaysia, Singapore, UK and other countries) reached a new stage in the 36-hour window. Global Schools Group obtained two cross-jurisdictional court injunctions — from the High Court of Singapore (June 13) and the Bombay High Court (June 12) — restraining FulcrumSec from disclosing stolen data including 33,088 child and parent passport numbers across 66 nationalities, 9.4M internal messages spanning 2006–2024, and sensitive student data (medical records, daily movements). FulcrumSec publicly stated the injunctions have "zero impact" on their behavior and that they have more than a dozen backup clearnet domains ready; within hours of their clearnet site being suspended following the Singapore injunction, a new copy appeared on another domain. The Singapore Personal Data Protection Commission (PDPC) has confirmed it will investigate. This case study demonstrates the enforcement limitation of civil injunctions against threat actors operating outside the injuncting jurisdictions, and the operational futility of using legal mechanisms alone without coordinating with law enforcement and hosting/registrar partners. The data exposed includes children's personal information, making GDPR Articles 9 and 80 (representation of data subjects) relevant for any EU-resident children among the victims — Global Schools Foundation's UK campus (GEMS schools) brings UK ICO jurisdiction into scope. The $1.5M USD estimated damages figure in the suit is separate from any regulatory penalty.
    ch_eu_nexus: "indirect — Global Schools Group operates campuses in the UK (GEMS), making UK ICO jurisdiction applicable; EU-resident children from other campuses may be within GDPR scope; demonstrates structural risk of multi-jurisdiction data extortion"
