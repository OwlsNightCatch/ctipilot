  - title: "Prinz Eugen ransomware: new Go-based operator (ROOTBOY) targets EU public-sector-adjacent and financial victims, prioritizes recent files, no on-disk ransom note"
    sources:
      - { url: "https://www.threatdown.com/blog/prinz-eugen-ransomware-a-deep-dive-into-a-new-go-based-encryptor/", publisher: "ThreatDown (Malwarebytes)", date: "2026-06-20", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/new-prinz-eugen-ransomware-prioritizes-recent-files-for-encryption/", publisher: "BleepingComputer", date: "2026-06-20", role: "corroborating" }
      - { url: "https://www.ransomware.live/id/VHJhbnNpdGlvbnMgUHJvIENlbnRyZSBWYWwgZGUgTG9pcmVAUHJpbnpFdWdlbg", publisher: "Ransomware.live (victim listing)", date: "2026-05-16", role: "corroborating" }
    discovery_trace: "first seen at: BleepingComputer news listing, URL https://www.bleepingcomputer.com/news/security/new-prinz-eugen-ransomware-prioritizes-recent-files-for-encryption/ → primary: ThreatDown deep-dive, URL https://www.threatdown.com/blog/prinz-eugen-ransomware-a-deep-dive-into-a-new-go-based-encryptor/ → corroborating EU victim: Ransomware.live, URL https://www.ransomware.live/id/VHJhbnNpdGlvbnMgUHJvIENlbnRyZSBWYWwgZGUgTG9pcmVAUHJpbnpFdWdlbg"
    summary: |
      ThreatDown (Malwarebytes' enterprise division) published a detailed technical analysis on 2026-06-20 of a new hands-on-keyboard ransomware operation calling itself Prinz Eugen. The operator (identified by ThreatDown as ROOTBOY, previously operating as avtokz and GERMANIA) gained initial access via stolen RDP credentials in all observed cases, then manually downloaded the Go-based encryptor (servertool.exe) via Chrome and staged it in the user's Music folder. RemotePC (an IDrive-owned RMM) was abused via PowerShell for payload delivery and a persistence account named "admin" / password "germania" was created. Three-week dwell times preceded encryption, with lateral movement through SharePoint, OneDrive, Jira, Confluence, Remedy, and AppDynamics. The malware's most distinctive behavioral characteristic is a file-selection algorithm that sorts target files by most-recently-modified first (alphabetical tie-breaking), then applies ChaCha20-Poly1305 AEAD encryption with a three-stage KDF (Argon2id → SHA-256 → HKDF-SHA256), 1 MB chunked processing, and per-file random IVs. No ransom note is dropped on disk; extortion happens entirely out-of-band via a dark-web portal. After encryption, the key material is zeroed in memory, garbage collection forced, and the binary self-deletes — aggressively anti-forensic. Five victims are publicly listed including Standard Bank (1.2 TB / 154M SQL rows; 1 BTC demand refused and responded to with staged daily leaks), and notably **Transitions Pro Centre Val de Loire** (French government employment-transition body, attacked ~May 3, listed May 16; hundreds of GB exfiltrated) — a public-sector-adjacent EU victim. ROOTBOY's C2/hosting infrastructure uses AS215439 (Play2go International, Frankfurt) and Porkbun/NiceNIC registrars. Detection: ThreatDown blocked the payload as Malware.Ransom.Agent.Generic; EDR should flag RemotePC PowerShell staging, the unusual admin account creation (Sysmon EID 1 / Windows EID 4720+4728), and Go executable with package name "scorched-earth-ausfc". File extension .prinzeugen and CHV1 file-header magic.
    ch_eu_nexus: "direct — Transitions Pro Centre Val de Loire (France) is a French public-sector employment-transition body under the French Labour Ministry"
    public_sector_nexus: "direct (French government employment body)"
    sector: "public administration (employment), financial services"
