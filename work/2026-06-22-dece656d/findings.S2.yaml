    extended_notes: |
      MITRE ATT&CK mappings (inferred from XLab technical description):
      - T1190 Exploit Public-Facing Application (initial access via CVE-2013-3307/CVE-2016-5681/CVE-2025-11837)
      - T1133 External Remote Services (Dropbear SSH backdoor on port 2332)
      - T1046 Network Service Discovery (internal/external network scanning)
      - T1071.001 Application Layer Protocol: Web Protocols (C2 over HTTP/HTTPS with Protobuf+XOR)
      - T1090.002 Proxy: External Proxy (infected devices enrolled as traffic proxies/tunnels)
      - T1568.002 Dynamic Resolution: Domain Generation (C2 domain families ajb8.com, ahb8.com, ahb8.com families)
      - T1562.004 Impair Defenses: Disable or Modify System Firewall (iptables rules added for persistence)
      The Go-based NAS-targeting variant is noteworthy as a separate toolchain suggesting capability expansion. The botnet's use of legitimate network tools (fscan, httpx, ksubdomain, tlsx) in the standard version makes EDR detection harder on NAS endpoints that lack full EDR agents.

