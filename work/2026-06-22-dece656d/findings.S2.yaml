    discovery_trace: "first seen at: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/arystinger-botnet-infected-thousands-of-d-link-routers-worldwide/ (published 2026-06-21, within window) → primary: Qianxin XLab, URL https://blog.xlab.qianxin.com/arystinger-botnet-hijacks-legacy-routers-for-global-attacks-en/ (published 2026-06-17)"
    summary: |
      Qianxin XLab published technical research on 2026-06-17 on a previously undocumented botnet they named AryStinger, targeting end-of-life D-Link routers built on RTL819X series chipsets (2012-2015 era). BleepingComputer covered it on 2026-06-21. The botnet exploits three CVEs: CVE-2013-3307 (Linksys/D-Link, 2013), CVE-2016-5681 (D-Link, 2016), and CVE-2025-11837 (NAS devices, 2025). Primary targets are D-Link DIR-850L (75% of infections) and DIR-818LW (13%). Confirmed EU nexus: Sweden represents 6.4% of 4,300+ globally infected devices (South Korea 48.5%, China 31.8%, Sweden 6.4%, Malaysia 3.5%, Singapore 2.5%).

      The botnet runs two malware variants: a C-based RTL819X version (V2.0.27, 32-bit MIPS, 32+ versions captured since 2026-03-12) and a Go-based standard version (V1.0.102, x86-64, 22+ versions since 2026-04-26) targeting NAS devices with expanded toolset including fscan, ksubdomain, httpx, and tlsx. Infected devices are enrolled as "Executors" and support internal/external network scanning, DNS reconnaissance (massdns-like), traffic tunneling and proxying, remote command execution, and persistent backdoors. Persistence is established via Dropbear SSH deployed on port 2332 with iptables rules added. C2 communication uses HTTP/HTTPS with Protobuf encoding and XOR encryption (hardcoded key: sh_#@!_2024_secret). The operator splits scanning and reconnaissance tasks across multiple infected nodes for distributed operation.

      No formal attribution. XLab notes the botnet's design enables credential theft through traffic monitoring, DNS hijacking, distributed scanning platforms for downstream attackers, DDoS infrastructure, and lateral movement within compromised networks. Detection: process names syswapd0h and syswapd0w on router filesystem, files under /tmp/bin/, script /tmp/cc.sh, Dropbear SSH listener on non-standard port 2332. Hardening: these D-Link models (DIR-850L, DIR-818LW, DIR-816L) are end-of-life with no vendor patch path — immediate device replacement is the only effective remediation. For defenders with legacy routers still in-network: block outbound traffic to C2 domains (ajb8.com, ahb8.com families), monitor for SSH listeners on non-standard ports, and apply egress filtering for port 2332.
