    attribution: Forever Security
    source_url: https://forever.security/blog/hijacking-ai-agents-via-downloads-folder/
  - quote: In our testing, Claude followed through on this about 50% of the time.
    attribution: Forever Security
    source_url: https://forever.security/blog/hijacking-ai-agents-via-downloads-folder/
  - quote: There is nothing here for OpenAI or Anthropic to patch.
    attribution: Forever Security
    source_url: https://forever.security/blog/hijacking-ai-agents-via-downloads-folder/
  - quote: Leave approval gates and sandboxes enabled.
    attribution: Forever Security
    source_url: https://forever.security/blog/hijacking-ai-agents-via-downloads-folder/
  - quote: It could not determine how the file got into the folder.
    attribution: The Hacker News
    source_url: https://thehackernews.com/2026/10/malicious-file-in-downloads-folder.html
  extended_notes: 'Detection (Forever, behavioural): instruction files nobody on the team wrote (AGENTS.md, CLAUDE.md) in Downloads or in a freshly cloned repository;
    unexpected MCP-server blocks in the machine-wide Codex configuration or a changed base-URL setting; an agent-written project .claude/settings.json that sets an
    API base URL or proxy; an agent invoking the approval-and-sandbox bypass flag in a child process; the npm package name above in any install log (treat the machine
    as compromised). Telemetry class: endpoint file-write and process-creation events with agent-process parentage, plus package-manager logs. Hardening (Forever):
    never start an agent in Downloads; keep approval gates and sandboxes on and treat any text telling the agent to bypass them as hostile; if a stray instruction
    file is found, assume the agent''s tokens leaked and rotate. Gaps: delivery mechanism unknown (Forever says a malicious website could drop such a file but did
    not observe it); the Claude Code chain is a lab reproduction with half the success rate; Forever''s note that Claude was much harder to fool than Codex is its
    own testing. Does not apply to agents that never run in a web-writable directory. The package name is IOC-type; the composer decides whether to carry it.'
- title: 'Huntress on the ConnectWise intrusion: the 2026-10-15 activity looks like scripted tooling steered by an operator, with a 55-second retry change; its detections
    target vendor applications that assign themselves a directory role or add credentials'
  sources:
  - url: https://www.huntress.com/blog/connectwise-attack-ai
    publisher: Huntress
    date: '2026-10-26'
    role: primary
  discovery_trace: 'first seen at: huntress (RSS), URL https://www.huntress.com/blog/rss.xml (item https://www.huntress.com/blog/connectwise-attack-ai, 2026-10-26T19:00Z)
    -> primary (no pivot needed); Huntress cites Microsoft''s 2026-10-21 report and its own 2026-10-16 post, both already in the store'
  summary: 'Huntress, which first reported the ConnectWise Cloud Backup credential abuse on 2026-10-16, published an analysis on 2026-10-26 of who or what drove the
    activity, using Entra sign-in and directory audit logs from tenants it monitors plus fleet-wide sweeps. It says its telemetry aligns with Microsoft''s Storm-0940/ARTEX
    account but does not independently confirm it, and rates its confidence that an LLM was involved in the escalation tooling as low to medium on its own telemetry
    and medium to high once Microsoft''s attribution is included. What it observed on 2026-10-15: the credential used against almost 1,000 tenants one after another
    in ascending tenant-ID order, one to six minutes apart, with the same Python urllib user agent; about 100 identical failures against the first 100 tenants within
    10 seconds (a thread pool), and a second run with another application''s key at 13 to 21 attempts per second, both using application secrets that belong to a
    single tenant and so could not work elsewhere; Huntress infers a script run at least twice and rules out a model making each call at that speed. In the first
    tenants the tooling changed in under a minute between runs: a secret added, removed and added again, a certificate upload that failed on a thumbprint mismatch,
    and a run 55 seconds later that added a retry with doubling waits, then the Global Administrator role granted and removed twice, a different role granted to a
    sibling principal when a removal was refused, and the original service principal deleted; the same sequence repeated in a second tenant 47 seconds later. For
    22 minutes after that deletion requests using the deleted principal kept firing every four to eight seconds and were rejected each time, which Huntress cites
    as the best evidence against a fully autonomous agent. A pilot-then-batch pattern (one tenant tried first, then batches) recurred three times across two tools;
    first enumeration to completed credential changes took under three hours. Huntress states its limits: Microsoft Graph reads are not recorded in the Entra audit
    log and no victim it knows of had Graph activity logging enabled, application-only audit events carry no source IP, and it cannot see the actor''s tooling or
    any model provider behind it. Its behavioural table (pacing, response to errors, request variety, user agent) is labelled its own analyst heuristic, not an industry
    standard, and it warns that cadence will stop being a reliable signal as tooling improves.'
  region_nexus: global; public-sector Microsoft 365 tenants are in scope of any MSP/vendor app-credential abuse
