  - product:microsoft-quick-assist
  - actor:stac4749
  new_entities: []
  relation_suggestions: []
  verification: MULTI-SOURCE
  verification_note: Arctic Wolf is first-hand; its domain-shift finding is consistent with Sophos's STAC4749 reporting, which Arctic Wolf cites and which is already
    in the store; The Hacker News relays Arctic Wolf. The 400-incident aggregate and percentages are Arctic Wolf's alone.
  confidence: MEDIUM
  novelty: update-of:2026-07-29/stac4749-teams-vishing-certificate-pinned-golang-chaos
  novelty_note: Four earlier entries cover Teams helpdesk-impersonation (2026-06-09 Unit 42, 2026-07-25 Microsoft email report, 2026-07-29 STAC4749, 2026-09-03 Node.js
    implant); the delta is the 400-incident aggregate, the ChatCreated detection point, the Safe-Links-avoidance behaviour, the trial-tenant block and a new PowerShell/MSI/Python
    chain. The main agent may prefer the 2026-09-03 entry as the carrier.
  evidence:
  - quote: Microsoft Teams ships with external access (federation) turned on by default, meaning any Teams user in another Microsoft 365 tenant can find, chat with,
      and call an organization’s employees, provided both tenants allow external access.
    attribution: Arctic Wolf Labs
    source_url: https://arcticwolf.com/resources/blog/threat-actors-abuse-microsoft-teams-external-chat-for-initial-access/
  - quote: This activity does not exploit any known Teams vulnerability; it abuses a legitimate, default-on collaboration capability.
    attribution: Arctic Wolf Labs
    source_url: https://arcticwolf.com/resources/blog/threat-actors-abuse-microsoft-teams-external-chat-for-initial-access/
  - quote: Microsoft records this first contact as a ChatCreated event, which Arctic Wolf assesses to be the primary detection opportunity for defenders.
    attribution: Arctic Wolf Labs
    source_url: https://arcticwolf.com/resources/blog/threat-actors-abuse-microsoft-teams-external-chat-for-initial-access/
  - quote: Attackers generally avoid pasting a URL directly into Teams, which would trigger Safe Links / ZAP scanning, and instead navigate to the payload themselves
      during the remote session
    attribution: Arctic Wolf Labs
    source_url: https://arcticwolf.com/resources/blog/threat-actors-abuse-microsoft-teams-external-chat-for-initial-access/
  - quote: 'Block federation with trial-only tenants, as attackers commonly prefer free or trial tenants for their minimal setup requirements:'
    attribution: Arctic Wolf Labs
    source_url: https://arcticwolf.com/resources/blog/threat-actors-abuse-microsoft-teams-external-chat-for-initial-access/
  extended_notes: 'Detection (Arctic Wolf): Teams audit events for ChatCreated from external tenants (first contact), especially 1:1 chats from tenants new to the
    organization with IT-support display names or an ''(Internal)'' suffix, correlated with an inbox flood in the same window (mail-flow telemetry), then Quick Assist
    / RMM process creation not deployed by the IT team, followed by reconnaissance commands (user and group enumeration), LDAP enumeration from a script interpreter,
    and msiexec installs of a second RMM. Triage: a legitimate partner chat comes from an allow-listed domain and an established tenant; the discriminators are a
    first-seen tenant, a throwaway or IT-themed tenant or .top domain, an email flood minutes earlier, and a request to start Quick Assist or run a pasted command.
    Hardening levers (Arctic Wolf, from Microsoft guidance): Teams admin centre external access set to specific domains; block trial-only tenants with the tenant
    federation setting that blocks external access with trial tenants; Defender Tenant Allow/Block List for Teams domains; block or restrict Quick Assist and unsanctioned
    RMM via endpoint protection or application control; out-of-band callback verification for any remote-access request; end-user reporting of suspicious Teams messages.
    Gap: no victim sector or country breakdown is given; IOC lists in the report (tenant names, .top domains) are not for entries.'
- title: 'A planted AGENTS.md in a customer''s Downloads folder made a coding agent try to install a malicious npm package: Forever Security''s in-the-wild catch
    and its Codex and Claude Code reproductions'
  sources:
  - url: https://forever.security/blog/hijacking-ai-agents-via-downloads-folder/
    publisher: Forever Security
    date: '2026-10-22'
    role: primary
  - url: https://www.darkreading.com/application-security/in-the-wild-attack-ai-agents-trust-markdown
    publisher: Dark Reading
    date: '2026-10-26'
    role: corroborating
  - url: https://thehackernews.com/2026/10/malicious-file-in-downloads-folder.html
    publisher: The Hacker News
    date: '2026-10-26'
    role: corroborating
  - url: https://checkmarx.com/zero-post/malfex-npm-malware-campaign-three-payloads-and-an-adversary-that-signs-their-work/
    publisher: Checkmarx Zero
    date: '2026-10-05'
    role: corroborating
  discovery_trace: 'first seen at: darkreading (RSS), URL https://www.darkreading.com/rss.xml (item https://www.darkreading.com/application-security/in-the-wild-attack-ai-agents-trust-markdown,
    2026-10-26) -> primary: Forever Security, URL https://forever.security/blog/hijacking-ai-agents-via-downloads-folder/ (linked from the Dark Reading article) ->
    pivot: THN URL https://thehackernews.com/2026/10/malicious-file-in-downloads-folder.html (links the package research) -> Checkmarx Zero, URL https://checkmarx.com/zero-post/malfex-npm-malware-campaign-three-payloads-and-an-adversary-that-signs-their-work/'
  summary: 'Forever Security says its endpoint product stopped a coding agent, mid-session on a real customer machine, from installing function-color, an npm package
    from the MALFEX supply-chain campaign that Checkmarx Zero documented on 2026-10-05, and that the instruction came from a plain-text AGENTS.md, disguised as engineering
    notes, sitting in the user''s ~/Downloads folder, the one folder a website can write to without a click; Forever could not determine how the file got there, and
    no code ran. Forever''s reproduction on OpenAI Codex, run safely in an isolated VM with the attacker''s real file, has the agent append an MCP-server registration
    to the machine-wide ~/.codex/config.toml whose start command uses launchctl to run npm install of the package outside Codex''s startup timeout, then run a child
    codex exec with the approval and sandbox bypass flag so the payload completes in one session; Forever reports Codex ran the malware in more than 90% of attempts,
    and that the machine-wide config means every later Codex session on the host loads the attacker''s server. Forever''s own Claude Code reproduction, not the in-the-wild
    file, uses a planted CLAUDE.md to make the agent write a project .claude/settings.json that sets the Anthropic API base URL to an attacker-controlled server,
    which leaks the OAuth token (account takeover with no code run) and lets that server answer as the model with tool calls that run code; Forever reports about
    50% success, and the same-session variant about a fifth of the time. Prerequisites per Forever: an agent started in the Downloads directory (about half of its
    customers do this, and about a quarter of agent sessions open a real browser) and, for Codex, a project the agent already trusts. Forever and Dark Reading both
    say there is nothing for the agent vendors to patch because the agent is doing what it was built to do; Forever has found only this one in-the-wild example and
    says it is looking for more. All success rates and the telemetry shares are Forever''s own, from a vendor that sells a product against this class of attack.'
  region_nexus: global; no Swiss victim reported
  primary_sector_nexus: 'indirect: developers and administrators in public-sector IT who run AI coding agents on workstations'
