    role: corroborating
  discovery_trace: 'first seen at: THN weekly recap, URL https://thehackernews.com/2026/10/weekly-recap-this2shell-that2shell.html (2026-10-26, roll-up; discovery
    only) -> primary: CrowdStrike, URL https://www.crowdstrike.com/en-us/blog/crowdstrike-uncovers-new-agentic-ai-campaigns/ (also seen on the CrowdStrike counter-adversary
    listing)'
  summary: CrowdStrike Counter Adversary Operations reports four previously unreported actors that left their offensive agent frameworks exposed in open directories,
    documenting between May and August 2026 incidents in which AI agents made decisions and executed commands. Actor 1, Spanish/English-speaking, compromised at least
    15 Argentina-based healthcare entities with a dual-agent harness (a Supervisor agent selecting the next task from an attack-stage state machine, an Executor agent
    performing it), derived from the open-source PentestGPT project with added MCP servers and exploitation scripts. Actor 2, Chinese-speaking with 20+ named targets,
    compromised government entities of two countries and private sector entities in Brazil and the US, reaching Claude models through a China-based AI proxy service,
    with one deterministic harness that asks the model to choose among preset actions and one that lets Claude Code work as a single agent or delegate to specialist
    agents. Actor 3, Indonesian-speaking and the least sophisticated, gives Claude Code 819 mostly public GitHub-sourced skills without orchestration and still compromised
    several Indonesian government domains and a government domain of another country, intervening periodically to overcome model guardrails. Actor 4, Russian-speaking,
    tasks Claude Code with a single slash command that runs a seven-step workflow from enumeration to exfiltration, and exfiltrated client data from a US CRM vendor
    and compromised private-sector entities in Russia, Kyrgyzstan and the US plus one government domain of another country. CrowdStrike assesses, with moderate confidence,
    that agentic AI commoditizes baseline offensive operations, that agentic intrusions will almost certainly increase and that some low-skill actors will reach effectiveness
    previously limited to organized crime or state-nexus actors. Detailed case studies and defender guidance sit in a downloadable report that the blog links and
    that this return did not read; the blog does not name victims, tooling versions or techniques beyond the above.
