    object: campaign:megalodon-mass-github-cicd-backdoor-5561-repos-sysdiag-optimize-build
    basis: 'Wiz: 57 accounts from Gheist''s first phase were also victims of Megalodon in May (victim-pool overlap, not shared operator) (Wiz, 2026-10-25)'
  verification: SINGLE-SOURCE-OTHER
  verification_note: Wiz Research is the discloser with first-hand telemetry; Infosecurity Magazine, Dark Reading and The Hacker News relay it (Dark Reading adds
    a Wiz researcher interview, still Wiz). Independent first-party corroboration only for the scope of GitHub's control (GitHub changelog). Campaign scale figures
    are Wiz's.
  confidence: MEDIUM
  novelty: new
  evidence:
  - quote: We have recovered more than 13,500 planted branches from more than 850 compromised accounts, ranging from personal projects to enterprise organizations'
      private repositories.
    attribution: Wiz Research
    source_url: https://www.wiz.io/blog/gheist-attempted-scaled-abuse-of-stolen-github-tokens-stumbles
  - quote: A recent GitHub control has been blocking the exploitation in public repositories, but we've observed successful exploitation and follow-on activity in
      private repositories and GitHub enterprise environments.
    attribution: Wiz Research
    source_url: https://www.wiz.io/blog/gheist-attempted-scaled-abuse-of-stolen-github-tokens-stumbles
  - quote: Because the secrets leave through GitHub's own API, there is no attacker domain or outbound connection to block.
    attribution: Wiz Research
    source_url: https://www.wiz.io/blog/gheist-attempted-scaled-abuse-of-stolen-github-tokens-stumbles
  - quote: This protection currently applies to public repositories on github.com only. GitHub Enterprise Server doesn’t add this protection at this time.
    attribution: GitHub Changelog
    source_url: https://github.blog/changelog/2026-07-28-github-actions-holds-potentially-malicious-workflows-for-approval/
  - quote: Rotate every repository, organization and environment secret available to an affected repository. Deleting the run or the branch doesn't undo the exposure.
    attribution: Wiz Research
    source_url: https://www.wiz.io/blog/gheist-attempted-scaled-abuse-of-stolen-github-tokens-stumbles
  extended_notes: 'Detection (Wiz): GitHub audit log runs on branches created by a token owner whose only change is one new workflow file, deleted within a minute
    of completing; unsigned commit authored as the token owner; API user agent ''gheist''; where workflows use cloud OIDC, role assumptions or token exchanges whose
    subject names the planted branch (finds it without GitHub logs); on self-hosted runners, helper files and log headers from the pivot job (Wiz names them). Wiz''s
    branch-name pattern, workflow file name, commit message and file names are campaign artefacts, not IOCs in the hash/IP/domain sense; the composer decides whether
    to carry them. Hardening (Wiz): reviewers required on environments that hold production secrets; OIDC trust policies scoped to protected branches or environments;
    GitHub Apps or short-lived fine-grained tokens instead of personal access tokens; ephemeral self-hosted runners without Docker socket or unrestricted metadata
    access. Post-incident: rotate every secret reachable from an affected repository (deleting the run does not undo exposure), revoke the pushing tokens and check
    their owners'' devices for infostealers, treat a self-hosted runner host that ran such a branch, and its instance role, as compromised, and do not approve held
    runs. Triage: legitimate automation branches carry reviewed multi-file changes; this pattern is a single new workflow file, an unsigned commit, and a run deleted
    by the pusher within about a minute. Gap: Wiz gives no count of Swiss or public-sector victims; scale beyond ''on the scale of a dozen companies'' is unstated.'
- title: 'Cisco Talos: attackers feed hostile text into 25+ legitimate platforms so their own order confirmations, welcome emails and bounce notices deliver the lure,
    passing SPF, DKIM and DMARC'
  sources:
  - url: https://blog.talosintelligence.com/parasitizing-trust-how-legitimate-infrastructure-becomes-a-delivery-pipeline-for-attackers/
    publisher: Cisco Talos
    date: '2026-10-21'
    role: primary
  - url: https://www.helpnetsecurity.com/2026/10/22/legitimate-platforms-abused-phishing-emails/
    publisher: Help Net Security
    date: '2026-10-22'
    role: corroborating
  discovery_trace: 'first seen at: helpnetsecurity, URL https://www.helpnetsecurity.com/ (listing; item https://www.helpnetsecurity.com/2026/10/22/legitimate-platforms-abused-phishing-emails/,
    2026-10-22) -> primary: Cisco Talos, URL https://blog.talosintelligence.com/parasitizing-trust-how-legitimate-infrastructure-becomes-a-delivery-pipeline-for-attackers/
    (also on the Talos RSS feed, 2026-10-21T10:00Z)'
  lookback: true
  summary: 'Cisco Talos reports that over the past year attackers abused more than 25 legitimate platforms (collaboration, productivity, file-sharing, survey, payment
    and AI services) by supplying hostile input and letting the platform''s own mail pipeline do the delivery, and describes three forms. (1) Order-notification abuse:
    in two campaigns totalling about 1,400 messages, a fake support number was planted in the shipping and billing fields of high-value Staples and Dell order confirmations,
    so the email comes from the retailer''s real order domain, passes DKIM alignment and DMARC and uses the real template, and the goal is a phone call to a ''helpline''
    rather than a click, which moves the victim to voice for follow-on social engineering, payment manipulation, credential theft or remote-assistance fraud. (2)
    List bombing used as a delivery vehicle: the attacker submits the victim''s address to registration or notification workflows whose name, company or title fields
    are poorly validated, and the platform''s automatic welcome or confirmation email reflects a lure typed into that field, inside a high-reputation message that
    can pass authentication; Talos calls this not yet a broad shift. (3) Bounce abuse: a delivery-status notification, from opportunistic backscatter to a forged
    envelope sender or from an intentional failure triggered through an authenticated or compromised sending context, carries a lure in the returned or nested content;
    Talos shows a WeTransfer-themed example in a mail-system notice. Talos''s point for defenders is that sender authentication is necessary but not sufficient: SPF,
    DKIM and DMARC say where a message came from, not whether the rendered content is legitimate. It recommends that gateways inspect the fully rendered message,
    including personalization fields and nested MIME, parse delivery-status containers recursively and apply normal phishing and URL analysis to the returned content,
    and that transactional mail be evaluated against the workflow that produced it (an order notice with an unexpected support number, cancellation instructions or
    urgency language is treated differently from a routine receipt). Platform owners are told to validate user-controlled values before storage and again before rendering.
    The report gives no victim sectors or regions.'
  region_nexus: global; no Swiss-specific case stated
  primary_sector_nexus: 'direct for mail-security teams of any administration: authenticated brand mail and bounce notices are normally allow-listed'
  sector: cross-sector
  cves: []
  techniques:
  - T1566
  - T1566.004
  - T1667
  affected_products: []
  entity_keys: []
  new_entities: []
  relation_suggestions: []
  verification: SINGLE-SOURCE-OTHER
  verification_note: Cisco Talos is first-hand (its own telemetry and samples); Help Net Security relays it. Message counts are Talos's.
  confidence: HIGH
  novelty: new
  evidence:
  - quote: Talos has since tracked a significant acceleration in this trend, observing abuse across more than 25 distinct legitimate platforms in the past year.
    attribution: Cisco Talos
    source_url: https://blog.talosintelligence.com/parasitizing-trust-how-legitimate-infrastructure-becomes-a-delivery-pipeline-for-attackers/
  - quote: From a defensive perspective, sender authentication is necessary, but it is not sufficient.
    attribution: Cisco Talos
    source_url: https://blog.talosintelligence.com/parasitizing-trust-how-legitimate-infrastructure-becomes-a-delivery-pipeline-for-attackers/
  - quote: Security gateways should inspect the fully rendered message, not only the sender or template.
    attribution: Cisco Talos
    source_url: https://blog.talosintelligence.com/parasitizing-trust-how-legitimate-infrastructure-becomes-a-delivery-pipeline-for-attackers/
  - quote: A DSN’s administrative appearance does not validate the content inside it.
    attribution: Cisco Talos
    source_url: https://blog.talosintelligence.com/parasitizing-trust-how-legitimate-infrastructure-becomes-a-delivery-pipeline-for-attackers/
  extended_notes: 'Detection (telemetry class first): mail-gateway logs for authenticated messages from brand order or notification domains whose rendered body contains
    a telephone number or cancellation instruction in an address or name field; helpdesk and telephony records of callbacks after such messages; for list bombing,
    bursts of confirmation mail from many unrelated services to one mailbox within minutes, with an unusual text string in the name or company slot of the platform''s
    greeting; for bounces, delivery-status messages whose nested content carries URLs or attachments, especially for mail the user never sent. Triage: a genuine retailer
    notice has an order that matches an account or purchase the recipient recognises and fields that hold addresses; the discriminator is a phone number, support
    or cancellation text in a field meant for a name or address, or a bounce for mail the recipient did not send. Hardening: content-aware inspection of rendered
    and nested MIME content at the gateway; out-of-band callback verification procedures for ''order'' or ''helpline'' calls; for administrations that run their own
    web forms or notification mailers, validate and encode reflected fields before they are written into outgoing mail (Talos''s platform-owner advice). Gap: no counts
    of affected organisations or sectors are given.'
- title: 'Arctic Wolf: over 400 Teams external-chat helpdesk-impersonation cases show a stable pattern, with ChatCreated as the earliest detection point and a Teams
    federation allow-list as the lever'
  sources:
  - url: https://arcticwolf.com/resources/blog/threat-actors-abuse-microsoft-teams-external-chat-for-initial-access/
    publisher: Arctic Wolf Labs
    date: '2026-10-26'
    role: primary
  - url: https://thehackernews.com/2026/10/attackers-use-microsoft-teams-it.html
    publisher: The Hacker News
    date: '2026-10-26'
    role: corroborating
  discovery_trace: 'first seen at: WebSearch ("Arctic Wolf Microsoft Teams campaign October 2026") returned nothing; found via THN RSS, URL https://feeds.feedburner.com/TheHackersNews
    (item https://thehackernews.com/2026/10/attackers-use-microsoft-teams-it.html, 2026-10-26T21:22Z) -> primary: Arctic Wolf Labs, URL https://arcticwolf.com/resources/blog/threat-actors-abuse-microsoft-teams-external-chat-for-initial-access/'
  summary: 'Arctic Wolf Labs analysed more than 400 incidents from its customer base in which attackers used Microsoft Teams external chat (federation, on by default)
    to impersonate IT support, and reports a stable pattern: the 1:1 chat comes from a newly created or acquired Microsoft 365 tenant, with IT-themed display names,
    an appended "(Internal)" label that sits beside Teams'' own External tag, friendly first names, locale-specific wording and, increasingly, the target organization''s
    own name; 30 to 40 percent of cases used default onmicrosoft.com tenants, and among paid domains about half used .top and about 40 percent .com. In a significant
    number of cases the contact followed or accompanied an email-bombing flood that creates the pretext. The attacker''s goal is hands-on-keyboard access through
    a legitimate remote-management tool, Quick Assist most often (built in, Microsoft-signed, needs only a six-digit code), then AnyDesk, ScreenConnect, TeamViewer,
    Atera and others, with a second RMM such as Level installed through msiexec as an independent control channel that survives clean-up of the first. Attackers contact
    several users within about five minutes, apparently by automation, and Arctic Wolf sees payload execution within 15 minutes of a victim engaging, in some cases
    with Kerberoasting-type credential-access detections firing alongside the first Teams alert. Attackers generally avoid pasting a link into Teams, which would
    trigger Safe Links, and navigate to the payload during the remote session instead, so endpoint and identity telemetry matter alongside message scanning. Arctic
    Wolf describes one potentially novel chain: the user is told to run a PowerShell command (parent explorer.exe, ClickFix-like but not disguised as a CAPTCHA) that
    downloads an MSI from Azure Blob Storage, which unpacks a PowerShell loader that decrypts an AES-encrypted stub and extracts a Python implant that runs under
    pythonw.exe, issues LDAP queries for all computer and user objects through the adsisearcher shortcut and sends the output to a randomly chosen C2 endpoint. Arctic
    Wolf says the activity exploits no Teams vulnerability, that it detects at the ChatCreated event before the victim has done anything, and that the lever is to
    move Teams external access from allow-all to an allow-list of partner domains, block federation with trial-only tenants, block unmanaged and consumer accounts,
    and restrict Quick Assist and unsanctioned RMM tools. Its counts and percentages are from Arctic Wolf''s own customer telemetry.'
  region_nexus: global (locale-specific lures, including French and Spanish IT-support wording, are reported); no Swiss-specific case stated
  primary_sector_nexus: 'direct: any administration whose Microsoft 365 tenant leaves Teams external access open to all domains'
  sector: cross-sector
  cves: []
  techniques:
  - T1566.003
  - T1566.004
  - T1667
  - T1219
  - T1204.002
  - T1059.001
  - T1583.001
  - T1585.003
  - T1199
  - T1105
