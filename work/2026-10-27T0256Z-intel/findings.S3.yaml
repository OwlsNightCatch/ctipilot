  discovery_trace: 'first seen at: infosec-magazine (RSS), URL https://www.infosecurity-magazine.com/rss/news/ (item https://www.infosecurity-magazine.com/news/iranian-hacking-group-hosting-c2/,
    2026-10-22) -> primary: Semperis Research, URL https://www.semperis.com/blog/prince-of-persia-threat-group-hiding-in-plain-sight/'
  lookback: true
  summary: 'Semperis (Tomer Bar, formerly SafeBreach Labs, which published the group''s last public research in February 2026) reports that Prince of Persia, the
    Iranian state-nexus actor active for about two decades against dissidents and public and private sector organisations in the US, Europe and the Middle East, went
    dark publicly after that February research, then resumed: after its longest downtime in nearly two decades, a new exfiltration C2 appeared on 2026-05-27, from
    which Semperis saw Tonnerre take more than 1,800 files from one victim in the first week, and the group has moved from VPS hosting to shared hosting and changed
    its control-panel software. In August 2026 Semperis found the Tornado second-stage C2, which holds the file that gives a victim the Telegram bot API key, on shared
    hosting from a US provider, the first US-hosted C2 from this actor in a decade; on 2026-08-24 the group began building a replacement behind Cloudflare, which
    Semperis reads as the actor realising the server had been found. Tornado, per Semperis, arrives through one-day software vulnerabilities such as WinRAR exploits,
    communicates over HTTPS and the Telegram API, uses a domain-generation algorithm and RSA signature checks on C2 requests to lock out researchers, and can take
    C2 routing updates from blockchain transaction fields. Semperis says victim numbers remain low, which could mean targeted attacks or difficulty infecting new
    victims, and that it masks victim details. Infosecurity Magazine reports Semperis''s advice: keep security controls and operating systems up to date and watch
    for unusual Telegram traffic. The report is mostly infrastructure tracking; the transferable points are the delivery through patched-but-unapplied archive-tool
    flaws and Telegram-API C2 from endpoints that have no business talking to it.'
