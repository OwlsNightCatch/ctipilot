  extended_notes: 'Detection (Huntress, behavioural): Entra audit log, a service principal that assigns itself Global Administrator or Privileged Role Administrator,
    deletes itself, or a vendor principal that grants a role to a sibling; credential additions to high-privilege applications from unexpected sources; a vendor application
    behaving differently from its baseline (user agent for the ConnectWise applications is a .NET SDK client; a Python or curl user agent is the anomaly); cross-tenant
    correlation, because a trickle in one tenant can be one campaign at thousands of attempts per minute across the estate. Gap to state: Graph activity logging must
    have been on in advance to see Graph reads; without it a clean Entra audit log is not proof of no access (the ARTEX entry already says this). Huntress lists source
    infrastructure and user agents (IOC-type; not for entries). Huntress''s own numbers cover only tenants it monitors; Microsoft counts more than 2,250 tenants.'
- title: 'CYFIRMA: operators in a monitored I2P channel report a 216-host target set and low-and-slow PHP2Shell checks from 21 compromised nodes, assessed as Lazarus-ecosystem;
    no confirmed compromise'
  sources:
  - url: https://www.cyfirma.com/research/cyfirma-threat-advisory-suspected-dprk-campaign-staging-php2shell-targeting-against-global-php-infrastructure/
    publisher: CYFIRMA
