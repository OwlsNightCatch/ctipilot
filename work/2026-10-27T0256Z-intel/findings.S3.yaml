  discovery_trace: 'first seen at: THN RSS, URL https://feeds.feedburner.com/TheHackersNews (item https://thehackernews.com/2026/10/php2shell-exploitation-hits-government.html,
    2026-10-25T22:49Z) -> primary: CYFIRMA, URL https://www.cyfirma.com/research/cyfirma-threat-advisory-suspected-dprk-campaign-staging-php2shell-targeting-against-global-php-infrastructure/'
  summary: 'CYFIRMA reports from monitoring a closed I2P channel since 2026-10-22 that Korean-speaking operators it assesses as affiliated with the Lazarus Group
    ecosystem said on 2026-10-24 they had a filtered target set of 216 hosts that still look unpatched or partly mitigated for PHP2Shell (CVE-2026-109618 and CVE-2026-109619)
    and were running low-volume, paced PHP weakness checks against them from 21 compromised nodes, which the operators rotate and abandon at the first sign of blocking;
    about a third of the set had been touched when CYFIRMA wrote. CYFIRMA says hosts bannering fixed versions or behind heavy filtering were dropped from the set,
    so the remaining hosts still advertise older PHP; the stated sectors are government, financial institutions, logistics, airports and aviation, manufacturing and
    online transaction platforms, in the US, Japan, South Korea, Thailand, Indonesia, Australia, Taiwan, India, Singapore, the UAE, Saudi Arabia and the EU. It says
    the same 21 addresses were observed in the preceding eight hours attempting web-shell tooling and upload-progress session poisoning, that the entry route is crafted
    multipart/form-data requests with highest success against Apache mod_php in prefork, and that no mass compromise is confirmed for this actor. CYFIRMA''s advice
    that matters for hunting is that the low-volume pacing means rate-based alerts will miss it, so hunts should run across extended windows back to 2026-10-17, and
    that a worker restart destroys the CVE-2026-109619 state, so evidence should be preserved before patching a suspect host. The attribution and the target list
    rest on CYFIRMA''s own closed-source channel monitoring; the advisory states the Lazarus affiliation at both ''moderate'' and ''HIGH'' confidence in different
    places, The Hacker News reports it as moderate, the target spreadsheet was not seen, no victim is named, and no other source corroborates the claim. Context already
    in the store: Palo Alto Networks'' Unit 42 retracted on 2026-10-25 its link between a European government intrusion and these flaws.'
