- title: 'Gheist: stolen GitHub tokens plant a secret-dumping workflow in every repository they reach; GitHub''s July approval hold stops it on public github.com
    repositories but not on private ones or GitHub Enterprise Server'
  sources:
  - url: https://www.wiz.io/blog/gheist-attempted-scaled-abuse-of-stolen-github-tokens-stumbles
    publisher: Wiz Research
    date: '2026-10-25'
    role: primary
  - url: https://github.blog/changelog/2026-07-28-github-actions-holds-potentially-malicious-workflows-for-approval/
    publisher: GitHub Changelog
    date: '2026-07-28'
    role: corroborating
  - url: https://www.infosecurity-magazine.com/news/gheist-attackers-abuse-stolen/
    publisher: Infosecurity Magazine
    date: '2026-10-26'
    role: corroborating
  - url: https://www.darkreading.com/cyberattacks-data-breaches/gheist-stolen-github-tokens-cloud-secrets
    publisher: Dark Reading
    date: '2026-10-26'
    role: corroborating
  - url: https://thehackernews.com/2026/10/gheist-uses-stolen-github-tokens-to.html
    publisher: The Hacker News
    date: '2026-10-26'
    role: corroborating
  discovery_trace: 'first seen at: darkreading (RSS), URL https://www.darkreading.com/rss.xml (item https://www.darkreading.com/cyberattacks-data-breaches/gheist-stolen-github-tokens-cloud-secrets,
    2026-10-26) -> pivot: Infosecurity Magazine, URL https://www.infosecurity-magazine.com/news/gheist-attackers-abuse-stolen/ (names the Wiz report) -> primary:
    Wiz Research, URL https://www.wiz.io/blog/gheist-attempted-scaled-abuse-of-stolen-github-tokens-stumbles -> pivot: THN URL https://thehackernews.com/2026/10/gheist-uses-stolen-github-tokens-to.html
    (links the GitHub changelog) -> GitHub Changelog, URL https://github.blog/changelog/2026-07-28-github-actions-holds-potentially-malicious-workflows-for-approval/'
  summary: 'Wiz Research has tracked since 2026-09-15 an automated campaign it calls Gheist (after the user agent on its API calls) that uses stolen GitHub access
    tokens to create a branch and commit a GitHub Actions workflow in every repository each token can reach: more than 13,500 branches from more than 850 compromised
    accounts, from personal projects to enterprise private repositories. Wiz traces the tokens to infostealer logs and to earlier supply-chain compromises such as
    the March Trivy compromise. The workflow prints the repository''s secrets, and the secrets of any deployment environment, into its own run log base32-encoded
    so that GitHub''s masking, which matches only verbatim values, does not hide them; the tool then downloads the log through the GitHub API and deletes the run
    seconds later, so there is no attacker domain or outbound connection to block. GitHub''s control of 2026-07-28 holds suspicious workflow runs for approval; Wiz
    says every public-repository run it checked stayed in the action_required state, and GitHub''s changelog states the protection applies to public repositories
    on github.com only and does not cover GitHub Enterprise Server. Wiz reports that in private repositories and GitHub Enterprise environments the runs on attacker
    branches completed and were then deleted, that CloudTrail shows the organizations'' own workflows running on those branches and assuming AWS roles, and that in
    enterprise organizations the tool cycled through user and automation-account tokens within minutes, cloned private repositories first and, hours later, cloud
    credentials from the same organization were used to enumerate AWS Secrets Manager. A second variant (first run 2026-09-28) adds an environment matrix so that
    environment-scoped, often production, secrets print; since 2026-10-19 it also pushes a self-hosted-runner job that searches the host for 31 token formats (including
    AI-provider keys), private keys, .env files, Terraform state and shell history, reads every process environment, reaches the Docker socket to mount the host root
    filesystem, and queries cloud instance metadata, though Wiz calls that job buggy. Wiz found the same accounts reused by other campaigns (cracked-software lure
    repositories, Actions free-compute abuse, a DPRK-linked build-config implant, and an earlier Megalodon wave) and says Gheist is distinct from GhostAction. As
    of 2026-10-24 about two thirds of the implicated accounts were no longer on GitHub, which Wiz reads as response to its report, and the campaign was still ongoing
    and evolving; Wiz researcher Rami McCarthy told Dark Reading the campaign affected "on the scale of a dozen companies".'
  region_nexus: global; no Swiss victim reported
  primary_sector_nexus: 'indirect: any administration or supplier that builds software on GitHub with private repositories, GitHub Enterprise Server, cloud-OIDC workflows
    or self-hosted runners'
