- title: 'Symantec''s AI honeypot captured ''Skynet'' mode: an offensive agent that hijacks exposed LLM endpoints and stolen API keys, sends a jailbreak and 74 tool
    definitions, and runs up to 100,000 unattended steps'
  sources:
  - url: https://www.security.com/threat-intelligence/ai-llmjacking-skynet
    publisher: Symantec Threat Hunter Team
    date: '2026-10-21'
    role: primary
  discovery_trace: 'first seen at: symantec-security-com listing, URL https://www.security.com/threat-intelligence (links /threat-intelligence/ai-llmjacking-skynet)
    -> primary (no pivot needed): URL https://www.security.com/threat-intelligence/ai-llmjacking-skynet'
  lookback: true
  summary: 'Symantec''s Threat Hunter Team captured, through an AI honeypot that imitates an unprotected internet-facing model service, the full working prompt of
    an autonomous offensive agent in summer 2026. The operators sent it to what they believed was a real model: a layered jailbreak (identity camouflage, a rewrite
    of secret and .env access as routine development work, a companion persona, a ''rebuttal protocol'' that tells the model to dismiss its own safety messages),
    74 callable tool definitions (internet-wide asset discovery through FOFA, exploit modules for VS Code servers, Django, Jupyter, Laravel, Supabase, Next.js and
    Flask/Werkzeug including debugger-PIN derivation, SSRF through HTML-to-PDF generators aimed at cloud metadata, Prisma Studio database dumping, botnet command
    and control) and a ''Skynet'' directive for up to 100,000 unattended steps that deploys a miner quietly in the background. A request the following day, from a
    rotated address, sent a gzip-compressed shell script that installs XMRig with failover across four pools, hides it under a name made to look like a logging utility
    in directories used by the go2rtc camera-streaming server, sets the immutable attribute on its own configuration and loops to delete a local service''s access
    logs. The honeypot executed nothing. Symantec states that the individual techniques are not novel, and that the assembly into a self-directed agent is. The honeypot''s
    telemetry, over 127,000 external requests from tens of thousands of addresses, was dominated by reconnaissance of model endpoints, spraying of stolen API keys
    and probing for exposed configuration files. Two sets of victims follow: the owner of the exposed endpoint or stolen key pays for the inference, and the hosts
    the agent breaks into lose data and credentials and are put to mining. Symantec''s recommendations: no unauthenticated LLM, self-hosted model or MCP endpoints
    on the internet (authentication on every path, including model-listing and health-check paths, behind a gateway), treat AI API keys as high-value credentials
    with spend monitoring, restrict outbound access from hosts that run tool-enabled agents, enforce IMDSv2 with a hop limit of one on cloud workloads, and run agents
    at least privilege with human approval for sensitive actions.'
  region_nexus: global; no Swiss victim reported
  primary_sector_nexus: 'indirect: any public-sector body that exposes an LLM gateway, self-hosted model server or MCP endpoint, or holds model API keys in code or
    configuration'
