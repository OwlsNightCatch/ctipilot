    text: "{\"id\": \"CVE-2026-111497\", \"cvss\": \"9.2 (CVSS 4.0)\", \"status\": [\"poc-public\", \"patch-available\"], \"affected\": \"Node.js 22.x, 24.x and 26.x before 22.23.4, 24.22.1 and 26.12.1; Google Brotli 1.0.3 to 1.2.0; PyPI Brotli up to 1.2.0; PyPI brotlicffi up to 1.2.0.2; Envoy v1.39.2, v1.38.5, v1.37.7 and v1.36.11 with the Brotli decompressor configured; .NET before 8.0.33, 9.0.22 and 10.0.14 where Brotli data from untrusted parties is decompressed; PAN-OS 12.2 before 12.2.4-h1, 12.1 before 12.1.4-h13, 12.1.7-h11 and 12.1.10-h3, and 11.2 before 11.2.4-h23, 11.2.7-h23, 11.2.10-h17, 11.2.13-h4 and 11.2.16-h1, on PA-Series and VM-Series firewalls with Brotli inspection and TLS decryption enabled (PAN-OS 11.1 and 10.2 and the management interface are not affected); PHP for Windows builds without the -1 suffix, through the cURL extension when automatic decompression is enabled; Ubuntu brotli before the fixed packages\", \"fixed\": \"Node.js 22.23.4, 24.22.1, 26.12.1; Google Brotli 1.0.10, 1.1.1, 1.2.1; PyPI Brotli 1.2.1; PyPI brotlicffi 1.2.1.0; Envoy v1.40.0, v1.39.3, v1.38.6, v1.37.8, v1.36.12; .NET 8.0.33, 9.0.22, 10.0.14; PAN-OS hotfixes 12.2.4-h1, 12.1.4-h13, 12.1.7-h11, 12.1.10-h3, 11.2.4-h23, 11.2.7-h23, 11.2.10-h17, 11.2.13-h4 and 11.2.16-h1 (estimated 2026-10-27 to 2026-10-30); PHP for Windows 8.5.12-1, 8.4.27-1, 8.3.36-1, 8.2.35-1; Ubuntu brotli 1.2.0-4ubuntu0.1 (26.10), 1.2.0-3ubuntu0.1 (26.04), 1.1.0-2ubuntu0.1 (24.04), 1.0.9-2ubuntu0.1 (22.04), no fix yet for 20.04\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 13c835c243
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "body"
    kind: cited
    text: "Node.js shipped security releases on 2026-10-21 for CVE-2026-111497, an out-of-bounds write in the Brotli decoder it bundles: an invalid block switch was reported as a need for more input instead of a format error, so the streaming decoder kept appending input to an eight-byte internal buffer ("
    urls: ["https://nodejs.org/en/blog/vulnerability/october-2026-security-releases"]
  - claim_id: fad64aa6af
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "body"
    kind: cited
    text: "An attacker who can supply Brotli data that an application decompresses with the node:zlib module can corrupt process memory, which can lead to a crash, disclosure of process memory or remote code execution ("
    urls: ["https://nodejs.org/en/blog/vulnerability/october-2026-security-releases"]
  - claim_id: ab425e257e
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "body"
    kind: cited
    text: "The Google CNA record scores it CVSS 4.0 9.2 with no authentication and no user interaction ("
    urls: ["https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-108169"]
  - claim_id: 106e27d459
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "body"
    kind: cited
    text: "Imperva ran code carried in Brotli data against the official Node.js 24.22.0 Linux arm64 image, both through the built-in fetch() consuming a compressed response and through Express 5.0.0 to 5.3.0 and body-parser 2.0.0 to 2.3.0 request-body parsers (raw() and json()); execution took several attempts, and the fixed 24.22.1 rejected the same input ("
    urls: ["https://www.imperva.com/blog/node2shell-from-brotli-data-to-remote-code-execution/"]
  - claim_id: 4879248df2
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "body"
    kind: cited
    text: "A bare Node.js HTTP server does not decode an incoming Brotli body on receipt, so the request path needs those parsers ("
    urls: ["https://www.imperva.com/blog/node2shell-from-brotli-data-to-remote-code-execution/"]
  - claim_id: 1ed5ea8211
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "body"
    kind: cited
    text: "Fixes are in Node.js 22.23.4, 24.22.1 and 26.12.1, whose release notes list CVE-2026-111497 as a high-severity Brotli fix ("
    urls: ["https://nodejs.org/en/blog/release/v22.23.4/", "https://nodejs.org/en/blog/release/v24.22.1/", "https://nodejs.org/en/blog/release/v26.12.1/"]
  - claim_id: 382e8b6097
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "body"
    kind: cited
    text: "); end-of-life lines are always affected when a security release occurs ("
    urls: ["https://nodejs.org/en/blog/vulnerability/october-2026-security-releases"]
  - claim_id: eba4a55247
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "body"
    kind: cited
    text: "The decoder is Google's, so the flaw reaches beyond Node.js: Google released Brotli 1.2.1 on 2026-10-21 and lists CVE-2026-111497 in its release as an out-of-bounds write that permits remote code execution ("
    urls: ["https://github.com/google/brotli/releases/tag/v1.2.1"]
  - claim_id: 40a947d98c
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "body"
    kind: cited
    text: "), and the CVE record covers Brotli 1.0.3 to 1.2.0, fixed in 1.0.10, 1.1.1 and 1.2.1 ("
    urls: ["https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-108169"]
  - claim_id: 97e4be1d97
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "body"
    kind: cited
    text: "OpenSourceMalware found that the PyPI packages Brotli (up to 1.2.0, fixed in 1.2.1 on 2026-10-22) and brotlicffi (up to 1.2.0.2, fixed in 1.2.1.0 on 2026-10-23) compile the same decoder ("
    urls: ["https://opensourcemalware.com/blog/node2shell-affects-python"]
  - claim_id: aa89b57abb
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
