  - claim_id: b41cd0be05
    entry: 2026-09-30/cve-2026-86950-apple-coregraphics-zero-day-kev
    surface: "section 2026-10-27T03:44:46Z"
    kind: cited
    text: "Apple's security content for iOS 18.7.11 and iPadOS 18.7.11, released 2026-10-26, lists CVE-2026-86950 as fixed for iPhone XS, iPhone XS Max, iPhone XR and iPad 7th generation, among other devices, and repeats Apple's statement that it is aware of a report of exploitation in an extremely sophisticated attack against specific targeted individuals on versions of iOS before iOS 27 ("
    urls: ["https://support.apple.com/en-us/149225"]
  - claim_id: e8bce077c7
    entry: 2026-09-30/cve-2026-86950-apple-coregraphics-zero-day-kev
    surface: "section 2026-10-27T03:44:46Z"
    kind: cited
    text: "The notes for iOS and iPadOS 26.7.1 of 2026-09-28 list the fix for iPhone 11 and later and for iPad models from the iPad 8th generation, and the CISA catalog record for the flaw names no other Apple document, so in the documents these sources name the fix reaches those four device families four weeks after the others ("
    urls: ["https://support.apple.com/en-us/149226", "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: 90f9f2533f
