    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "summary"
    kind: frontmatter
    text: "Microsoft reports that since at least September 2026 Storm-0940, a China-state aligned actor, has used ARTEX, an open-source multi-agent LLM penetration-testing framework, to automate scanning, password spraying and OAuth-application abuse against hundreds of organizations across many industries including government, reaching privileged cloud access in under three hours in several cases. Expel independently saw the same infrastructure create its own accounts through Okta self-service registration, enrol Okta Verify and sign in to applications, and CrowdStrike and Recorded Future document another actor using the same framework. Seoul police referred a criminal group's leader to prosecutors on 2026-10-23 for extorting 38 of more than 90 organizations, hospitals and universities among them, with the same framework according to BleepingComputer."
  - claim_id: ff80356130
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-10-27T03:45:25Z"
    kind: cited
    text: "Seoul Metropolitan Police announced on 2026-10-26 that it referred a 32-year-old gang leader to prosecutors on 2026-10-23, with six accomplices investigated without detention, for taking 8.2 million personal-data records and internal files from more than 90 organizations since September 2025, among them cram schools, hospitals, golf courses, universities and large-company affiliates, and for sending extortion e-mails ("
    urls: ["https://www.yna.co.kr/view/AKR20261026075100004"]
  - claim_id: 186bac2b43
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-10-27T03:45:25Z"
    kind: cited
    text: "BleepingComputer, citing local media, reports that the group demanded 360 million won (about USD 270,000) in 38 of the incidents in exchange for not leaking the data, that the police say the leader used the ARTEX framework, the same system used in the attacks on South Korean banks, and that he moved from conventional tools to AI utilities in late August 2026 ("
    urls: ["https://www.bleepingcomputer.com/news/security/former-pentester-used-artex-ai-to-steal-82-million-data-records/"]
  - claim_id: a11db9ae2a
