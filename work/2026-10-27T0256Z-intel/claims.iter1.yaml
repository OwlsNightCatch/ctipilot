  - claim_id: 0556529eed
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "summary"
    kind: frontmatter
    text: "Node.js released 22.23.4, 24.22.1 and 26.12.1 on 2026-10-21 to fix CVE-2026-111497, an out-of-bounds write in its bundled Brotli decoder that can lead to remote code execution, and Imperva ran code through it against the official Node.js 24.22.0 image via fetch() and Express 5 or body-parser 2 request bodies. The flaw is in the upstream Brotli library, so the PyPI packages Brotli (fixed in 1.2.1) and brotlicffi (fixed in 1.2.1.0) carry it too, and Envoy, Microsoft .NET, PHP for Windows and Ubuntu have shipped their own fixes; Palo Alto lists PAN-OS 12.2, 12.1 and 11.2 firewalls that inspect Brotli traffic with TLS decryption enabled, with hotfixes due by 2026-10-30. NCSC Switzerland rates exploitation as unknown with a proof of concept available; no source reports exploitation outside Imperva's laboratory demonstration."
