    surface: "summary"
    kind: frontmatter
    text: "Industrial, building and network-access vendors have published their own notices for the PHP flaws CVE-2026-109618 and CVE-2026-109619, which CISA added to its Known Exploited Vulnerabilities catalog on 2026-10-26. Belden says all versions of NetModule NRSW, the Bern-built router software, are affected with no patched release and advises disabling the web interface; macmon 6.x and 7.x, Schneider Electric Security Expert and Control Engineering, B&R APROL, HMS Netbiter, Wibu-Systems CodeMeter License Central and Oracle Secure Backup and Solaris 11 carry fixes or remediations at varying stages."
  - claim_id: 1b4fad82a5
    entry: 2026-10-27/php2shell-ot-products-netmodule-nrsw-no-fix-macmon-schneider
    surface: "actions[0]"
    kind: frontmatter
    text: "Disable the web interface of every Belden NetModule NRSW router now, after confirming SSH access to it, with the CLI settings http.status=0 and https.status=0, because no patched NRSW release exists; patch macmon 7.x from the service portal and move macmon 6.x to 7.x, and keep the web interfaces of both off networks that are not trusted."
