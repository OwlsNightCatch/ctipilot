    urls: ["https://isc.sans.edu/diary/33458"]
  - claim_id: 8643b3b55a
    entry: 2026-09-30/cve-2026-86950-apple-coregraphics-zero-day-kev
    surface: "record 2026-10-27T03:44:46Z"
