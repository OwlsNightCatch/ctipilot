    surface: "summary"
    kind: frontmatter
    text: "QNAP's advisory QSA-26-18 says the PHP2Shell flaws CVE-2026-109618 and CVE-2026-109619 (CVSS 4.0 9.2) affect the PHP in the web components of QTS, QuTS hero, QuTScloud and several QNAP applications and can be triggered before any application-level authentication. Fixed QTS, QuTS hero and QuTScloud builds dated 2026-10-23 are out, and as of 2026-10-27 the advisory table also lists QVR Surveillance (ARM32) 3.0.3.1756 and TVR OS 1.0.5 as resolved; Note Station 3 and QNE (ADRA) have no fix yet, QuMagie is no longer listed as affected, and QNAP says to keep devices off the internet until fixes ship. QNAP has seen scanning and exploitation attempts against the flaws in the wild but no reports of exploitation targeting its products, while CISA added both flaws to its Known Exploited Vulnerabilities catalog on 2026-10-26. Synology's advisory fixes its PHP packages (except the end-of-life PHP 7.3), Mail Station and Calendar and rates the PHP built into DSM as not exposed."
