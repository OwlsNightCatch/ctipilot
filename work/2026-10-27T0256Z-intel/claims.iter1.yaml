  - claim_id: fede61b11c
    entry: 2026-10-27/camping-care-tcs-camping-data-theft-php-flaw-whatsapp-fraud
    surface: "summary"
    kind: frontmatter
    text: "TCS Camping is warning about 15,000 guests after data was stolen at Camping.Care, the Dutch supplier of the booking system for all TCS campsites; TCS confirmed the theft to SRF on 2026-10-26, SRF reports it in connection with the PHP security hole and Blick says the attackers used the two critical PHP flaws, though no source names a CVE or the entry point. Names, telephone numbers and reservation numbers are already used in fraudulent WhatsApp messages; TCS says account and IBAN data were not affected and the hole is closed."
  - claim_id: dac8229ffc
    entry: 2026-10-27/camping-care-tcs-camping-data-theft-php-flaw-whatsapp-fraud
    surface: "body"
    kind: cited
    text: "TCS Camping, the camping business of the Touring Club Schweiz, is warning about 15,000 guests because the Dutch provider of its booking system, Camping.Care, suffered a data theft; TCS confirmed to the SRF consumer programme Espresso on 2026-10-26 that fraudsters could steal customer and booking information, and SRF reports the case in connection with the worldwide PHP security hole ("
    urls: ["https://www.srf.ch/sendungen/kassensturz-espresso/espresso/php-sicherheitsluecke-betrugsversuche-nach-datenleck-im-buchungssystem-fuer-tcs-camping"]
  - claim_id: 985f26ff50
