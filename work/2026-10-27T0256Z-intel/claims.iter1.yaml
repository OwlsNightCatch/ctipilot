    surface: "body"
    kind: cited
    text: "**Exposure:** the guests who booked through the TCS campsite booking system, about 15,000 of whom TCS has warned, and any other customer of the Camping.Care platform; Blick says it is not the only software supplier hit, and no other Camping.Care customer is named ("
    urls: ["https://www.blick.ch/wirtschaft/hackerangriff-auf-tcs-camping-15000-kunden-gewarnt/nws2bcn"]
