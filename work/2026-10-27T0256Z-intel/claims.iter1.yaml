  - claim_id: 834a72e9a3
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "body"
    kind: cited
    text: "**Exposure:** a service on Node.js 22.x, 24.x or 26.x below the fixed releases that decodes Brotli from an untrusted party, either request bodies inflated by Express 5 or body-parser 2 or compressed responses that fetch() consumes from a server an attacker influences, Python code that decompresses untrusted data with the PyPI Brotli or brotlicffi packages, Envoy with the Brotli decompressor configured, and .NET applications that decompress attacker-controlled Brotli data ("
    urls: ["https://github.com/dotnet/announcements/issues/494"]
