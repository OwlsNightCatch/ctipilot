    surface: "body"
    kind: cited
    text: "Blick, citing SRF, writes that the hackers used the critical PHP flaw to steal customer and booking data and that Camping.Care is not the only software supplier hit ("
    urls: ["https://www.blick.ch/wirtschaft/hackerangriff-auf-tcs-camping-15000-kunden-gewarnt/nws2bcn"]
