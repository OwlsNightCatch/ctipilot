  - claim_id: 0da932030c
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "section 2026-10-27T03:46:02Z"
    kind: cited
    text: "It says its telemetry aligns with Microsoft's Storm-0940 and ARTEX account without independently confirming it, that it is highly confident an operator, a person or an LLM, adapted the tooling between runs, and that its confidence that an LLM was involved in the escalation tooling is low to medium on its own telemetry and medium to high once Microsoft's attribution is included ("
    urls: ["https://www.huntress.com/blog/connectwise-attack-ai"]
  - claim_id: 2d7216051d
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "section 2026-10-27T03:46:02Z"
    kind: cited
    text: "Its evidence for adaptation: a certificate upload that failed on a thumbprint mismatch ended one run with no retry, and the next run 55 seconds later retried the same error with growing waits until it worked; in a second tenant that refused removal of the Global Administrator role, the actor granted a different role to a sibling principal and the original service principal was then deleted ("
    urls: ["https://www.huntress.com/blog/connectwise-attack-ai"]
  - claim_id: 7f0a5b858c
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "section 2026-10-27T03:46:02Z"
    kind: cited
    text: "Microsoft Graph reads are not recorded in the Entra audit log and no victim Huntress knows of had Graph activity logging enabled, so a clean audit log does not show that no Graph access took place ("
    urls: ["https://www.huntress.com/blog/connectwise-attack-ai"]
  - claim_id: 20e655836a
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "section 2026-10-27T03:46:02Z"
    kind: cited
    text: "Huntress recommends alerting when a service principal assigns itself Global Administrator or Privileged Role Administrator, deletes itself, or when one vendor principal grants a role to a sibling, and turning on Graph activity logs where licensing allows ("
    urls: ["https://www.huntress.com/blog/connectwise-attack-ai"]
  - claim_id: 997babe9cd
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "section 2026-10-27T03:46:02Z"
    kind: uncited
    text: "Huntress published its analysis of what drove the 2026-10-15 activity on 2026-10-26, working from Entra sign-in and directory audit logs in the tenants it monitors."
  - claim_id: b7d59d496f
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "record 2026-10-27T03:46:02Z"
    kind: record-summary
    text: "Huntress's analysis of 2026-10-26 reads the activity as scripted tooling steered by an operator, rates LLM involvement low to medium on its own telemetry, adds a detection for service principals that assign themselves or a sibling a directory role, and notes that Graph reads leave no Entra audit record."
  - claim_id: 0ba933c2f6
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "headline"
    kind: frontmatter
    text: "PHP2Shell: CISA lists both flaws as exploited after honeypot code execution; update the runtime, not the CMS"
  - claim_id: e0984a8674
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "summary"
    kind: frontmatter
    text: "The PHP project released 8.5.12, 8.4.27, 8.3.36 and 8.2.35 on 2026-10-21 to fix CVE-2026-109618 and CVE-2026-109619 (CVSS 4.0 9.2), two flaws in the runtime itself that allow unauthenticated remote code execution as the web worker account, most directly on Apache mod_php; PHP 8.1 and older get no upstream release. CISA added both flaws to its Known Exploited Vulnerabilities catalog on 2026-10-26, after Adel Karimi of Perplexity documented 35 successful code executions on three honeypots running PHP 8.4.26 under single-worker mod_php, and VulnCheck holds a working exploit for mod_php on specific builds of PHP 8.2 to 8.5; no source names a compromised production system, and Palo Alto Networks' Unit 42 retracted on 2026-10-25 its update that linked an attack on a European government agency to these flaws. PHP also published an informational advisory for a third code-execution path, CVE-2026-115560, that the October releases do not fix: keep session.upload_progress.enabled=0 until the next regular release. BACS knows of no attack in Switzerland but says PHP applications of the federal administration were affected and that it has no complete overview of the update status; Swiss cantons, universities, the host Cyon with more than 100,000 sites, the Lodur fire-brigade platform and Publica took sites offline as a precaution, and TCS Camping warns 15,000 guests after a data theft at its booking-system supplier that SRF links to the PHP flaw."
  - claim_id: b979cc7e60
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "immediate_action"
    kind: frontmatter
    text: "Update the PHP runtime on every internet-facing host today: Two unauthenticated remote-code-execution flaws in PHP itself are on CISA's exploited list since 2026-10-26 and honeypots recorded working code execution, fixed builds (8.5.12, 8.4.27, 8.3.36, 8.2.35) have been out since 2026-10-21, and public proofs of concept circulate. Update PHP, not the CMS, on every internet-facing server and container image, restart PHP-FPM, Apache and all long-running workers, and confirm the running version, because distribution packages can keep the old version string. Isolate anything that cannot be updated from public networks, and check web roots, logs, crashes and unexpected processes, since an update does not remove an attacker who is already in."
  - claim_id: 03f3cd5c92
