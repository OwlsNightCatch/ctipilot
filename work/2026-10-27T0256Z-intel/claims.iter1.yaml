    text: "Palo Alto Networks' advisory of 2026-10-21, revised on 2026-10-27, lists every release of PAN-OS 12.2, 12.1, 11.2, 11.1 and 10.2 as affected by the two PHP runtime flaws, CVE-2026-109618 and CVE-2026-109619, and notes that the issue applies to PAN-OS software on PA-Series and VM-Series firewalls and on Panorama. Nine hotfixes are now recorded as released (10.2.13-h27, 10.2.16-h12, 10.2.18-h13, 11.1.4-h38, 11.1.6-h40, 11.1.10-h36, 11.1.13-h16, 11.1.16-h4 and 11.2.10-h16), none yet for PAN-OS 12.2 or 12.1; the other hotfixes carry estimated dates from 2026-10-27 to 2026-10-30, and the solution text still speaks of upcoming releases. The PAN-OS exposure is the management web interface (the HTTPS web UI and the XML API service); Palo Alto scores the PAN-OS impact as availability only, CVSS-B 8.7 where management is reachable from the internet and 7.1 behind a jump box, against 9.2 for the PHP flaws themselves, and knows of no malicious exploitation against its products, although CISA added both PHP flaws to its Known Exploited Vulnerabilities catalog on 2026-10-26. The WildFire appliances WF-500 and WF-500-B are listed as unaffected after a correction its timeline dates 2026-10-23, and Cortex XCORE (SaaS) and WildFire Cloud were already remediated; its analysis finds no impact of CVE-2026-115560, the new PHP flaw, on PAN-OS. GlobalProtect and the captive portal are not affected."
