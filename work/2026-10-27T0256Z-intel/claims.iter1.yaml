    surface: "body"
    kind: cited
    text: "**Defender takeaway:** for a booking, ticketing or citizen-portal application that a supplier runs on PHP, ask the supplier in writing whether its runtime was updated to 8.5.12, 8.4.27, 8.3.36 or 8.2.35 or to a vendor backport and whether customer data was accessed before that, since the supplier's patch state, not the customer's, decided this exposure ("
    urls: ["https://www.cisa.gov/news-events/alerts/2026/10/21/critical-vulnerabilities-php-require-immediate-patching"]
  - claim_id: 9b664d6232
    entry: 2026-10-27/gheist-stolen-github-tokens-secret-dumping-workflows
    surface: "headline"
    kind: frontmatter
    text: "Gheist abuses stolen GitHub tokens to dump secrets through Actions; GitHub's hold covers public repositories only"
  - claim_id: 1f49e3d80f
    entry: 2026-10-27/gheist-stolen-github-tokens-secret-dumping-workflows
    surface: "summary"
    kind: frontmatter
    text: "Wiz Research has tracked since 2026-09-15 an automated campaign, Gheist, that uses stolen GitHub tokens to commit a secret-dumping Actions workflow to every repository each token can reach, more than 13,500 branches from more than 850 accounts. GitHub's approval hold of 2026-07-28 stops the workflow on public github.com repositories, but not on private repositories or GitHub Enterprise Server, where Wiz saw the runs complete and the organizations' own workflows assume AWS roles on the attacker branches."
  - claim_id: 00989ff40b
    entry: 2026-10-27/gheist-stolen-github-tokens-secret-dumping-workflows
    surface: "actions[0]"
    kind: frontmatter
    text: "In every GitHub organisation your teams or suppliers administer, private repositories and GitHub Enterprise Server included, search for branches named ci-sync- plus six random characters that add only the workflow file sync-check.yml, and for any workflow run on them; for every hit, rotate all repository, organisation and environment secrets that repository could read and revoke the token that pushed the commit, because deleting the run or the branch does not undo the exposure."
  - claim_id: 4fdce411de
    entry: 2026-10-27/gheist-stolen-github-tokens-secret-dumping-workflows
    surface: "body"
    kind: cited
    text: "Wiz Research has tracked since 2026-09-15 a campaign it calls Gheist, after the user agent on its API calls, that uses stolen GitHub access tokens to create a branch and commit a workflow named sync-check in every repository each token can reach: more than 13,500 planted branches from more than 850 compromised accounts, from personal projects to private enterprise repositories ("
    urls: ["https://www.wiz.io/blog/gheist-attempted-scaled-abuse-of-stolen-github-tokens-stumbles"]
  - claim_id: b7e257f956
    entry: 2026-10-27/gheist-stolen-github-tokens-secret-dumping-workflows
    surface: "body"
    kind: cited
    text: "Wiz traces the tokens to infostealer logs and earlier supply-chain compromises ("
    urls: ["https://www.wiz.io/blog/gheist-attempted-scaled-abuse-of-stolen-github-tokens-stumbles"]
  - claim_id: 16759ca8c5
    entry: 2026-10-27/gheist-stolen-github-tokens-secret-dumping-workflows
    surface: "body"
    kind: cited
    text: "The push triggers the workflow, which prints the repository's secrets, and those of any deployment environment, into its own run log; GitHub masks secret values only when they appear verbatim, so a base32-encoded value prints in full, the tool downloads the log through the GitHub API and deletes the run seconds later, and because the secrets leave through GitHub's own API there is no attacker domain or connection to block ("
    urls: ["https://www.wiz.io/blog/gheist-attempted-scaled-abuse-of-stolen-github-tokens-stumbles"]
  - claim_id: 3b15fd6649
    entry: 2026-10-27/gheist-stolen-github-tokens-secret-dumping-workflows
    surface: "body"
    kind: cited
    text: "In enterprise organizations the tool cycled through the tokens of several users and automation accounts within minutes and cloned private repositories before planting the workflow; hours later cloud credentials from the same organization were used to enumerate AWS Secrets Manager ("
    urls: ["https://www.wiz.io/blog/gheist-attempted-scaled-abuse-of-stolen-github-tokens-stumbles"]
  - claim_id: 8add25a57c
    entry: 2026-10-27/gheist-stolen-github-tokens-secret-dumping-workflows
    surface: "body"
    kind: cited
    text: "A second variant, from 2026-10-19, adds a job for repositories with a self-hosted runner that searches the host, and through the Docker socket its root filesystem, for tokens, private keys, environment files and Terraform state; Wiz calls the job buggy ("
    urls: ["https://www.wiz.io/blog/gheist-attempted-scaled-abuse-of-stolen-github-tokens-stumbles"]
  - claim_id: a49cbc685b
    entry: 2026-10-27/gheist-stolen-github-tokens-secret-dumping-workflows
    surface: "body"
    kind: cited
    text: "Since 2026-07-28 GitHub holds potentially malicious workflow runs in public repositories until a collaborator approves them, and every public Gheist run Wiz checked stayed held; the hold applies to public repositories on github.com only and not to GitHub Enterprise Server ("
    urls: ["https://www.wiz.io/blog/gheist-attempted-scaled-abuse-of-stolen-github-tokens-stumbles", "https://github.blog/changelog/2026-07-28-github-actions-holds-potentially-malicious-workflows-for-approval/"]
  - claim_id: 1f96375d8f
    entry: 2026-10-27/gheist-stolen-github-tokens-secret-dumping-workflows
    surface: "body"
    kind: cited
    text: "In private repositories and GitHub Enterprise environments Wiz saw runs on the attacker branches complete and be deleted, and cloud audit logs showed the organizations' own workflows running on those branches and assuming AWS roles ("
    urls: ["https://www.wiz.io/blog/gheist-attempted-scaled-abuse-of-stolen-github-tokens-stumbles"]
  - claim_id: cacfd72bca
    entry: 2026-10-27/gheist-stolen-github-tokens-secret-dumping-workflows
    surface: "body"
    kind: cited
    text: "As of 2026-10-24 Wiz called the attack ongoing, with about two thirds of the implicated accounts no longer available on GitHub ("
    urls: ["https://www.wiz.io/blog/gheist-attempted-scaled-abuse-of-stolen-github-tokens-stumbles"]
  - claim_id: 5bec3a3a0a
    entry: 2026-10-27/gheist-stolen-github-tokens-secret-dumping-workflows
    surface: "body"
    kind: cited
    text: "**Exposure:** organizations whose developers or automation accounts hold GitHub tokens that an infostealer or earlier compromise could have exposed, above all with private repositories, GitHub Enterprise Server, cloud OIDC workflows or self-hosted runners ("
    urls: ["https://www.wiz.io/blog/gheist-attempted-scaled-abuse-of-stolen-github-tokens-stumbles"]
  - claim_id: ddef172f95
    entry: 2026-10-27/gheist-stolen-github-tokens-secret-dumping-workflows
    surface: "body"
    kind: cited
    text: "**Detection:** in GitHub audit logs, workflow runs on a branch with a fixed prefix and six random characters that were deleted within a minute of completing, and API activity with the user agent gheist; in cloud audit logs, role assumptions whose OIDC subject names such a branch, which shows Actions ran on an attacker branch even where GitHub logs are not collected; on self-hosted runners, the helper files Wiz lists ("
    urls: ["https://www.wiz.io/blog/gheist-attempted-scaled-abuse-of-stolen-github-tokens-stumbles"]
  - claim_id: 3ed9e63b27
    entry: 2026-10-27/gheist-stolen-github-tokens-secret-dumping-workflows
    surface: "body"
    kind: cited
    text: "**Triage:** the planted commit is unsigned but authored as the token's owner, so the author name alone proves nothing; one new workflow file with a fixed commit message on a branch the owner did not create is the pattern ("
    urls: ["https://www.wiz.io/blog/gheist-attempted-scaled-abuse-of-stolen-github-tokens-stumbles"]
  - claim_id: c295361126
    entry: 2026-10-27/gheist-stolen-github-tokens-secret-dumping-workflows
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** rotate every secret available to a repository where a planted branch exists, revoke the tokens that pushed the commits and check their owners' devices for infostealers, treat a self-hosted runner host and its instance role as compromised if a planted branch ran there, and scope OIDC trust to protected branches or environments with required reviewers on environments that hold production secrets ("
    urls: ["https://www.wiz.io/blog/gheist-attempted-scaled-abuse-of-stolen-github-tokens-stumbles"]
  - claim_id: 08045b5489
    entry: 2026-10-27/talos-authenticated-brand-mail-order-bounce-list-bomb-lures
    surface: "headline"
    kind: frontmatter
    text: "Talos: attackers make legitimate platforms mail the lure for them, in order, welcome and bounce emails that pass DMARC"
  - claim_id: c4ef3694d3
    entry: 2026-10-27/talos-authenticated-brand-mail-order-bounce-list-bomb-lures
    surface: "summary"
    kind: frontmatter
    text: "Cisco Talos reports that over the past year attackers abused more than 25 legitimate platforms by supplying hostile input and letting the platform's own mail pipeline deliver it: a fake helpline number planted in Staples and Dell order confirmations, lures reflected into automatic welcome emails through poorly validated sign-up fields, and lures carried inside delivery-status notifications. The mail comes from the real brand domain and can pass SPF, DKIM and DMARC, so Talos says gateways must inspect the rendered message and the nested content of bounces, not only the sender."
  - claim_id: cedaa7c763
    entry: 2026-10-27/talos-authenticated-brand-mail-order-bounce-list-bomb-lures
    surface: "body"
    kind: cited
    text: "Cisco Talos reports that over the past year attackers abused more than 25 legitimate platforms, among them collaboration, productivity, file-sharing, survey, payment and AI services, by supplying hostile input and letting each platform's own mail pipeline deliver it ("
    urls: ["https://blog.talosintelligence.com/parasitizing-trust-how-legitimate-infrastructure-becomes-a-delivery-pipeline-for-attackers/"]
  - claim_id: c26eb45d2e
    entry: 2026-10-27/talos-authenticated-brand-mail-order-bounce-list-bomb-lures
    surface: "body"
    kind: cited
    text: "In order-notification abuse, two campaigns totalling about 1,400 messages planted a fake helpline number in the shipping and billing fields of high-value Staples and Dell order confirmations; the mail comes from the retailer's real order domain, shows DKIM alignment and passes DMARC, and the goal is a phone call rather than a click, which moves the victim to voice for further social engineering, payment manipulation, credential theft or remote-assistance fraud ("
    urls: ["https://blog.talosintelligence.com/parasitizing-trust-how-legitimate-infrastructure-becomes-a-delivery-pipeline-for-attackers/"]
  - claim_id: d9a164c568
    entry: 2026-10-27/talos-authenticated-brand-mail-order-bounce-list-bomb-lures
    surface: "body"
    kind: cited
    text: "In list bombing used as delivery, the attacker submits the victim's address to registration or notification workflows whose name, company or title fields are poorly validated, and the platform's automatic welcome or confirmation email reflects the lure inside a high-reputation message that can pass authentication; Talos says this is not yet a broad shift ("
    urls: ["https://blog.talosintelligence.com/parasitizing-trust-how-legitimate-infrastructure-becomes-a-delivery-pipeline-for-attackers/"]
  - claim_id: f9f081e52a
    entry: 2026-10-27/talos-authenticated-brand-mail-order-bounce-list-bomb-lures
    surface: "body"
    kind: cited
    text: "In bounce abuse, a delivery-status notification carries the lure in its returned or nested content, either as backscatter to a forged envelope sender or through an intentional failure triggered from an authenticated or compromised sending context, and Talos shows a WeTransfer-themed example inside a mail-system notification ("
    urls: ["https://blog.talosintelligence.com/parasitizing-trust-how-legitimate-infrastructure-becomes-a-delivery-pipeline-for-attackers/"]
  - claim_id: 6c5ad55452
    entry: 2026-10-27/talos-authenticated-brand-mail-order-bounce-list-bomb-lures
    surface: "body"
    kind: cited
    text: "Talos concludes that sender authentication is necessary but not sufficient, because it shows where a message came from and not what the trusted system was told to carry ("
    urls: ["https://blog.talosintelligence.com/parasitizing-trust-how-legitimate-infrastructure-becomes-a-delivery-pipeline-for-attackers/"]
  - claim_id: 44c574eb9b
    entry: 2026-10-27/talos-authenticated-brand-mail-order-bounce-list-bomb-lures
    surface: "body"
    kind: cited
    text: "**Exposure:** every mailbox whose gateway or users treat authenticated brand mail, order confirmations, welcome emails and delivery reports as trusted; Talos names no sector or country ("
    urls: ["https://blog.talosintelligence.com/parasitizing-trust-how-legitimate-infrastructure-becomes-a-delivery-pipeline-for-attackers/"]
  - claim_id: 59bf21fcf7
    entry: 2026-10-27/talos-authenticated-brand-mail-order-bounce-list-bomb-lures
    surface: "body"
    kind: cited
    text: "**Detection:** in mail-gateway telemetry, inspect the fully rendered message and recursively the nested MIME content of delivery reports, applying normal phishing, malware and URL analysis to the returned message, and flag transactional mail whose fields carry phone numbers, URLs, urgency language or support instructions where they do not belong or whose content does not match the workflow that produced it ("
    urls: ["https://blog.talosintelligence.com/parasitizing-trust-how-legitimate-infrastructure-becomes-a-delivery-pipeline-for-attackers/"]
  - claim_id: 2a9118f6a0
    entry: 2026-10-27/talos-authenticated-brand-mail-order-bounce-list-bomb-lures
    surface: "body"
    kind: cited
    text: "**Triage:** passing SPF, DKIM or DMARC does not separate these messages from genuine ones; the discriminators Talos gives are whether the rendered fields make business sense for the transaction and whether the content matches the workflow that produced it ("
    urls: ["https://blog.talosintelligence.com/parasitizing-trust-how-legitimate-infrastructure-becomes-a-delivery-pipeline-for-attackers/"]
  - claim_id: f4e926e4dd
    entry: 2026-10-27/talos-authenticated-brand-mail-order-bounce-list-bomb-lures
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** treat sender trust and content trust as separate signals: have the gateway parse bounce containers and analyse the nested message, and treat an unexpected support number or cancellation instruction in an order or registration email as suspect even from an authenticated brand domain ("
    urls: ["https://blog.talosintelligence.com/parasitizing-trust-how-legitimate-infrastructure-becomes-a-delivery-pipeline-for-attackers/"]
  - claim_id: d258974e51
    entry: 2026-10-27/talos-authenticated-brand-mail-order-bounce-list-bomb-lures
    surface: "body"
    kind: uncited
    text: "It describes three forms."
