    text: "Apple's exploited CoreGraphics zero-day is now fixed for iPhone XS, XS Max, XR and iPad 7th generation (iOS 18.7.11)"
  - claim_id: 16381ee25e
    entry: 2026-09-30/cve-2026-86950-apple-coregraphics-zero-day-kev
    surface: "summary"
    kind: frontmatter
    text: "Apple's 2026-09-28 updates (iOS and iPadOS 26.7.1, macOS Tahoe 26.7.1, macOS Sequoia 15.8.1) fix CVE-2026-86950, a CoreGraphics out-of-bounds write that can run arbitrary code when a crafted file is processed, and iOS and iPadOS 18.7.11 of 2026-10-26 carry the fix for iPhone XS, XS Max, XR and iPad 7th generation, which the 26.7.1 notes do not list. Apple says it may have been exploited in an extremely sophisticated attack against specific targeted individuals on versions of iOS before iOS 27, and CISA added it to the KEV catalog on 2026-09-29. No source states how the file is delivered. Since 2026-09-30 a public proof of concept crashes unpatched devices with a crafted PDF font."
  - claim_id: a7f0b283de
    entry: 2026-09-30/cve-2026-86950-apple-coregraphics-zero-day-kev
    surface: "actions[0]"
    kind: frontmatter
    text: "Push iOS and iPadOS 26.7.1, macOS Tahoe 26.7.1 and macOS Sequoia 15.8.1 through device management now, and iOS and iPadOS 18.7.11 to every iPhone XS, XS Max, XR and iPad 7th generation, starting with the devices of staff who could be individually targeted; Apple describes the exploitation only on iOS before iOS 27."
