    entry: 2026-10-27/camping-care-tcs-camping-data-theft-php-flaw-whatsapp-fraud
    surface: "body"
    kind: cited
    text: "**Detection:** the only signal the sources describe is on the recipient side, unsolicited WhatsApp messages that quote a real reservation with the correct name, telephone number and reservation number; no source gives intrusion telemetry from the supplier's systems ("
    urls: ["https://www.srf.ch/sendungen/kassensturz-espresso/espresso/php-sicherheitsluecke-betrugsversuche-nach-datenleck-im-buchungssystem-fuer-tcs-camping"]
  - claim_id: da5ff204f1
    entry: 2026-10-27/camping-care-tcs-camping-data-theft-php-flaw-whatsapp-fraud
    surface: "body"
    kind: cited
    text: "**Triage:** TCS Camping sends no automated booking details, payment requests or reservation links over WhatsApp, so a WhatsApp message of that kind that quotes a genuine reservation is the fraud, however accurate its details ("
    urls: ["https://www.srf.ch/sendungen/kassensturz-espresso/espresso/php-sicherheitsluecke-betrugsversuche-nach-datenleck-im-buchungssystem-fuer-tcs-camping"]
