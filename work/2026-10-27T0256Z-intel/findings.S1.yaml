    summary: |
      Exploitation-status change on the entry that carries the PHP project's two out-of-memory and stale-state flaws. CISA added CVE-2026-109618 ("PHP Memory Corruption Vulnerability") and CVE-2026-109619 ("PHP Stale Internal Request-State Vulnerability") to the KEV catalogue on 2026-10-26 (catalogVersion 2026.10.26): due date 2026-10-29, forensicTriage Yes (the listing carries CISA's forensic-triage requirement), knownRansomwareCampaignUse Unknown, notes pointing at the open-source-component caveat. CISA updated its alert the same day to record the listing; the alert's actions are: inventory every PHP including PHP bundled in other software, patch internet-facing systems first, take PHP-based systems offline if they cannot be patched or run PHP 8.1 or earlier, and monitor for PHP worker processes launching shells or downloading tools; the alert still names no actor and does not say how CISA learned of exploitation. ENISA's EUVD marks both records exploited since 2026-10-26 (EPSS shown as 99.98 and 100.0 on its percent scale); FIRST EPSS for 2026-10-26 is 0.99981 for CVE-2026-109618 and 0.99997 for CVE-2026-109619.
      What the exploitation rests on, as sources state it: Adel Karimi (detection and response lead at Perplexity) published a honeypot report dated 2026-10-24 correlating 35 complete execution-stage HTTP POSTs with 35 /bin/sh starts directly parented by Apache workers (uid 33) on three disposable "phpot" targets running PHP 8.4.26 under single-worker Apache mod_php with a 128 MiB memory limit; the requests followed a four-stage multipart chain (memory pressure, memory disclosure through an oversized PHPSESSID of 800 KiB decoded, further memory pressure, then a target-adjusted execution stage) that matches the public HTTP-only proof-of-concept family, came from two hosting-network source clusters (registered to OVH US and Interserver; Karimi stresses these are two source-address clusters, not two actors), and ran id, proof-file, wget, curl and PHP CLI commands; no second-stage payload download was observed and the web-root writes failed on a read-only filesystem. Karimi says the chain is consistent with CVE-2026-109618 and that the records do not establish a distinct CVE-2026-109619 path, and he cautions that it demonstrates the chain on an intentionally favourable single-worker mod_php profile, not exploit reliability on other worker counts, PHP builds or applications. Expel's Marcus Hutchins (via BleepingComputer) called it by far the highest-quality confirmation of in-the-wild exploitation he has seen. SecurityWeek and BleepingComputer relayed it on 2026-10-26; SecurityWeek notes that as of that morning CISA had not yet listed the flaws.
      VulnCheck's page, updated as of 17:30 ET on 2026-10-26, says its exploit now supports mod_php on AMD64 (and ARM64 for 8.4 and 8.5) across PHP 8.2.28-8.2.34, 8.3.22-8.3.35, 8.4.10-8.4.26 and 8.5.10-8.5.11, plus default WordPress Docker installs, and counts 2,608,039 internet-facing hosts running PHP. watchTowr's FAQ now carries "Exploited in the wild per CISA KEV" in its description. The store entry's statement that no source ties a confirmed compromise to these flaws is superseded: the honeypot execution is the first documented code execution outside a lab, but it is against honeypots, no victim organisation has been named, and CrowdStrike, Wordfence and Sophos earlier reported none. Fortinet's FG-IR-26-186 (revised 2026-10-26) now lists FortiOS, FortiManager, FortiAnalyzer, FortiWeb, FortiProxy and others as confirmed not impacted and keeps only FortiDDoS, FortiSOAR and FortiSOAR PaaS under investigation. BACS's warning page and the Cyber Security Hub post 13083 are unchanged since 2026-10-22 (no Swiss exploitation statement); PHP's archive shows no release after the 2026-10-26 Windows rebuilds.
    region_nexus: "global; BACS (NCSC-CH) has warned and Swiss hosters, cantons and federal PHP applications are in the store entry"
