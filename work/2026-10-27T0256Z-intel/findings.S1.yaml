    discovery_trace: "first seen at: ncsc-csh bridge (python3 tools/fetch_source.py ncsc-csh recent 12; post 13105 published 2026-10-26T13:02Z, citation https://security-hub.ncsc.admin.ch/#/posts/13105) -> pivot: paloalto-psirt feed https://security.paloaltonetworks.com/rss.xml (CVE-2026-111497 item 2026-10-26T23:40Z) -> primary: https://security.paloaltonetworks.com/CVE-2026-111497; php.net archive https://www.php.net/archive/2026.php; distro trackers (Ubuntu, Debian, Alpine, Red Hat); fortinet-psirt feed https://www.fortiguard.com/rss/ir.xml -> https://fortiguard.fortinet.com/psirt/FG-IR-26-187; aikido-security blog update"
    summary: |
      Vendor and authority statements published 2026-10-26 on the Brotli decoder out-of-bounds write that the store entry covers for Node.js, PyPI, Envoy and .NET. (1) NCSC Switzerland (BACS) published Cyber Security Hub advisory 13105 on 2026-10-26: successful exploitation allows unauthenticated remote attackers to cause denial of service or potentially execute code when an application decodes attacker-controlled Brotli data such as compressed HTTP request or response bodies or files; it lists Node.js, Microsoft .NET, Visual Studio, PowerShell, the Python Brotli and brotlicffi packages and Bun among dependants, rates exploitation status UNKNOWN with a proof of concept available, and names the temporary mitigation as disabling Brotli decoding of untrusted data and rejecting Content-Encoding: br until patched, with services restarted and containers rebuilt after updating. (2) Palo Alto Networks lists PAN-OS 12.2 below 12.2.4-h1 (ETA 10/28), 12.1 below 12.1.4-h13 (10/29), 12.1.7-h11 (10/28) and 12.1.10-h3 (10/30), and 11.2 below 11.2.4-h23 (10/30), 11.2.7-h23 (10/29), 11.2.10-h17 (10/27), 11.2.13-h4 (10/27) and 11.2.16-h1 (10/28) as affected; PAN-OS 11.1 and 10.2 are unaffected, and the advisory's table has no Panorama row. The exposure condition is PA-Series or VM-Series firewalls with inspection of Brotli-compressed traffic and TLS/SSL decryption enabled on the dataplane: Brotli inspection is unsupported before PAN-OS 11.2.4 and disabled by default from 11.2.4, the management interface (web and API) is not affected, `show system setting brotli` (11.2.4 and later) or Device > Setup > Content-ID "Allow Brotli Encoding" (12.1.2 and later) shows whether it is on, `set system setting brotli-encoding disable` (verify Enabled: no) is the mitigation, Threat ID 97686 (content version 9165 and later) gives partial coverage, and Palo Alto is not aware of any malicious exploitation; Prisma Cloud Application Security Transporter Client below 0.2.9 is also affected. Palo Alto scores it CVSS 4.0 9.2 critical with moderate urgency. (3) PHP rebuilt its Windows packages (8.5.12-1, 8.4.27-1, 8.3.36-1, 8.2.35-1, which keep the same PHP source and version string) with Brotli 1.2.1 on 2026-10-26: the vulnerable decoder is reachable through the cURL extension when automatic HTTP response decompression is enabled, which is off by default; The Hacker News reads Guzzle's code as enabling that by default and says it did not test it on Windows, and notes the PHP SBOMs of the 2026-10-21 x64 NTS builds list Brotli 1.2.0. (4) Linux distributions: Ubuntu fixed brotli on 26.10 (1.2.0-4ubuntu0.1), 26.04 LTS (1.2.0-3ubuntu0.1), 24.04 LTS (1.1.0-2ubuntu0.1) and 22.04 LTS (1.0.9-2ubuntu0.1), per USN-8956-1, while 20.04, 18.04 and 16.04 "need evaluation" and nodejs on 20.04 is marked vulnerable (vendored Brotli); Debian fixed bookworm (1.0.9-2+deb12u1, DLA-4855-1) and trixie (1.1.0-2+deb13u1, DSA-6582-1) and sid, with its nodejs packages and python-brotlicffi on trixie still marked vulnerable; Alpine fixed brotli 1.2.1-r0 on edge, 3.24 and 3.23 and 1.1.1-r0 on 3.21; Red Hat rates it Important (CVSS 3.1 8.1) and says there is no public, reliable RCE proof of concept; Aikido's update of 2026-10-26 says Amazon Linux, Debian and Alpine have fixes and that Ubuntu, SUSE and the standard RHEL repositories did not yet (Ubuntu has since published). (5) Fortinet's FG-IR-26-187 (2026-10-26), covering ten Node.js CVEs including this one and three other high-rated ones (CVE-2026-105482 dns.resolve NUL truncation, CVE-2026-105483 and CVE-2026-106069 TLS hostname-verification bypasses), lists FortiOS as under investigation and 22 other Fortinet products as not impacted. Aikido also lists fixes for Java brotli4j 1.24.0, Bun 1.4.4, Istio 1.29.9, 1.30.6 and 1.31.2, and says libcurl users need an updated Brotli dependency. Microsoft's MSRC page was revised on 2026-10-26 (version 1.1, acknowledgement only) and still says publicly disclosed yes, exploited no, Exploitation More Likely. No source reports exploitation outside Imperva's laboratory demonstration.
    region_nexus: "Switzerland: NCSC-CH advisory; PAN-OS firewalls and Linux, Node.js and .NET estates in Swiss federal and cantonal administrations"
    primary_sector_nexus: "direct (perimeter firewalls with TLS decryption, web application runtimes, Linux hosts)"
    sector: "public-sector"
