    extended_notes: |
      Detection anchors the sources support (behavioural, no IOCs): process-creation telemetry with Apache or PHP worker parent (apache2/httpd uid 33, php-fpm, php-cgi, lsphp, frankenphp) spawning /bin/sh, then wget/curl/PHP CLI; web-server access logs showing multipart/form-data POSTs with hundreds of parts, mostly "files*" or "x*" fields, no User-Agent, to / or /index.php, including PHPSESSID and PHP_SESSION_UPLOAD_PROGRESS fields; large (hundreds of KiB) Set-Cookie/PHPSESSID values in responses; PHP error-log lines "Allowed memory size ... exhausted in Unknown on line 0" at request startup and Apache worker SIGSEGV with no completed access-log entry for the final stage (Karimi: HTTP 200 on the first three stages is not a success criterion). Hardening: patch to 8.5.12/8.4.27/8.3.36/8.2.35 and restart workers; keep session.upload_progress.enabled=0 (CVE-2026-115560 is not fixed by the October releases).
