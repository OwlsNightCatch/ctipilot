      Detection and hardening anchors the vendors state: Belden's NRSW interim step is CLI disablement of HTTP and HTTPS after confirming SSH reachability; macmon, APROL, License Central and Illustra advisories all reduce to keeping the web UI off untrusted networks until patched. Behavioural hunt: PHP worker or web-server parent processes spawning shells on these appliances is only observable where the product exposes logs; most of these are appliances without EDR, so network-side signals (multipart POSTs with hundreds of parts to the product's web port, from untrusted segments) and reachability review are the realistic controls. Checking the Schneider Security Expert page 1 (affected-products row) was not possible: the pdf subcommand extracted 13 of 44 streams; its Security Expert fixed version comes from SecurityWeek.
