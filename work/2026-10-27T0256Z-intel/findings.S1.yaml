    summary: |
      SecurityWeek's roundup of 2026-10-26, checked against the vendors' own notices, shows PHP2Shell reaching products that Swiss public-sector operators run in buildings, transport, networks and plants. Belden (advisory of 2026-10-22): all versions of NetModule NRSW, including the latest mainline release 5.0.0.104, are affected and no patched release exists; the advised interim step is to disable the web interface after confirming SSH access to the device (cli-set http.status=0 and cli-set https.status=0); macmon 6.x and 7.x use PHP for the web UI and are affected, a patch for 7.x is in the service portal, 6.x must move to 7.x, and the HTTPS/443 web UI and guest portal must not be reachable from the internet unprotected. NetModule AG is headquartered in Bern with a strong focus on mass transit and intelligent traffic systems, according to Belden's acquisition notice. Schneider Electric (SESB-2026-295-01, v1.0.0 2026-10-22, v2.0.0 2026-10-26): EcoStruxure Security Expert (patched 1.48.4.0 from the Customer Care Center, per SecurityWeek), ProLeiT LINEoptimize (formerly Plant iT LMS, all versions, remediation from ProLeiT support) and EcoStruxure Control Engineering (all versions; the v2.0.0 revision of 2026-10-26 adds a remediation: the hosting VM updates automatically if it can reach the debian.org and sury.org repositories, otherwise only through a Schneider patch). Johnson Controls (JCI-PSA-2026-24 v2.0, 2026-10-22, updated 2026-10-23): patches for Illustra Flex4 (MII, Fixed and PTZ, DS), Gen5 Pano and Multi, Pro, Pro4 (PTZ, LPR, Multi Sensor) and Essentials Gen 4 camera firmware (build numbers SS021.25.09.06.0001, SS025.26.01.03.0002, SS016.26.09.03.0002, SS024.26.03.05.0002, SS017.26.03.00.0002, SS022.26.03.02.0002) and Visonic PowerManage 5.0.45, with compensating controls (limit internet-facing web interfaces, WAF or reverse proxy, monitor for unusual web requests, PHP errors, unexpected processes and outbound connections). B&R (ABB) APROL up to R 4.4-65 (SA26P015, 2026-10-23): patches were planned for 2026-10-26 and 2026-10-29 (as printed, R 4.4-65 and R 4.4-01); until then restrict HTTP(S) to the APROL system from untrusted networks. ABB MES deliveries that include DokuWiki are affected through the PHP packages on the DokuWiki host; ABB advises updating only the PHP packages to 8.5.12, 8.4.27, 8.3.36 or 8.2.35 and says no active exploitation had been reported when it wrote on 2026-10-23. HMS Networks: Netbiter firmware up to 3.00.10 is affected through its web server (exploitable from the LAN or the USB port), 3.00.11 fixes it, its Argos documentation server and Talk2M services were patched with no indicators of compromise found, and Flexy and Cosy+ do not use PHP. Wibu-Systems: the CodeMeter License Central web interface and its PHP-based extensions (WebDepot, Gateways, Portal, Connectors) are affected; License Central 5.2.2, a PHP patch installer for 5.1.2 and 5.0.x and Ubuntu Pro updates for 4.x are out, and an mTLS reverse proxy in front of License Central limits the attack surface. Siemens SSA-566512 (2026-10-23; already in the store) lists RUGGEDCOM APE1808 running PAN-OS as affected with patches from support. Rockwell Automation (SD1802) says no product is confirmed affected so far; Moxa reportedly found none and Hitachi Energy was still investigating, per SecurityWeek. These notices predate CISA's KEV listing of 2026-10-26 and none reports exploitation of the vendor's product.
