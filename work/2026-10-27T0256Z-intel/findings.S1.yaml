        attribution: "PHP (news archive 2026-10-26)"
        source_url: "https://www.php.net/archive/2026.php#2026-10-26-1"
      - quote: "Fixed in 1.1.0-2ubuntu0.1"
        attribution: "Ubuntu Security (24.04 LTS row)"
        source_url: "https://ubuntu.com/security/CVE-2026-111497"
      - quote: "there is no public, reliable remote code execution proof-of-concept"
        attribution: "Red Hat"
        source_url: "https://access.redhat.com/security/cve/cve-2026-111497"
      - quote: "Fortinet is currently investigating the impact of these CVEs over Fortinet Products."
        attribution: "Fortinet PSIRT (FG-IR-26-187)"
        source_url: "https://fortiguard.fortinet.com/psirt/FG-IR-26-187"
    extended_notes: |
      Triage-relevant: the PAN-OS exposure needs both Brotli inspection and inbound or outbound TLS decryption on a dataplane policy, so a firewall that does not decrypt, or runs 11.1 or 10.2, is out of scope; the NCSC-CH mitigation (reject Content-Encoding: br on the way in, remove br from Accept-Encoding and disable Brotli decoding of responses on the way out) does not help against a malicious server answering a client regardless of its Accept-Encoding, a point Aikido and OpenAI's advice both make. Brotli bundled into an application (Node.js, Bun, Java brotli4j, static libcurl) is not fixed by updating the system libbrotli package.
