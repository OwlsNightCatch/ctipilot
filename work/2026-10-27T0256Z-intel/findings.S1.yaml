      Apple's 2026-10-26 releases (iOS and iPadOS 27.2, 26.7.2 and 18.7.11, macOS Golden Gate 27.2, Tahoe 26.7.2 and Sequoia 15.8.2, Safari 27.2, tvOS, watchOS and visionOS 27.2) include iOS 18.7.11 and iPadOS 18.7.11 for iPhone XS, iPhone XS Max, iPhone XR and iPad 7th generation. Its CoreGraphics entry for CVE-2026-86950 repeats Apple's statement that it is aware of a report that the issue may have been exploited in an extremely sophisticated attack against specific targeted individuals on versions of iOS before iOS 27. The 2026-09-28 fix (iOS and iPadOS 26.7.1) was listed for iPhone 11 and later and iPad models from the iPad 8th generation, so those four older device families had no fix for four weeks while the flaw was on CISA's KEV list and a public proof of concept crashed unpatched devices. SANS ISC counts 304 vulnerabilities fixed in the 2026-10-26 round, notes that CVE-2026-86950 was patched originally a month ago and that this round delivers the corresponding iOS 18 patches, and says no new vulnerability is marked as already exploited; the iOS 27.2 security notes carry no exploitation statement. Remaining unpatched population: any iPhone or iPad that cannot run iOS 26 or 27 and has not been moved to 18.7.11.
