claims:
  - claim_id: 9f1f4c471d
    entry: 2026-09-30/cve-2026-86950-apple-coregraphics-zero-day-kev
    surface: "summary"
    kind: frontmatter
    text: "Apple's 2026-09-28 updates (iOS and iPadOS 26.7.1, macOS Tahoe 26.7.1, macOS Sequoia 15.8.1) fix CVE-2026-86950, a CoreGraphics out-of-bounds write that can run arbitrary code when a crafted file is processed, and iOS and iPadOS 18.7.11 of 2026-10-26 carry the fix for iPhone XS, XS Max, XR and iPad 7th generation, which the 26.7.1 notes do not list. Apple says it may have been exploited in an extremely sophisticated attack against specific targeted individuals on versions of iOS before iOS 27, CISA added it to the KEV catalog on 2026-09-29, and no source states how the file is delivered. Since 2026-09-30 a public proof of concept crashes unpatched devices with a crafted PDF font."
  - claim_id: e36216c936
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "summary"
    kind: frontmatter
    text: "The PHP project released 8.5.12, 8.4.27, 8.3.36 and 8.2.35 on 2026-10-21 to fix CVE-2026-109618 and CVE-2026-109619 (CVSS 4.0 9.2), two flaws in the runtime that allow unauthenticated remote code execution as the web worker account, most directly on Apache mod_php, with no upstream release for PHP 8.1 and older and a third path, CVE-2026-115560, left unfixed (keep session.upload_progress.enabled=0). CISA added both flaws to its Known Exploited Vulnerabilities catalog on 2026-10-26, after a honeypot operator documented 35 successful code executions on PHP 8.4.26 under single-worker mod_php and VulnCheck extended its working exploit across builds of PHP 8.2 to 8.5; the one production victim the sources name is a Swiss booking-system supplier whose theft SRF links to the flaws without naming a CVE, and Palo Alto Networks' Unit 42 retracted on 2026-10-25 its update that linked an attack on a European government agency to them. As of 2026-10-22 BACS knew of no attack in Switzerland but said federal PHP applications were affected and that it had no complete overview of the update status, and Swiss cantons, universities, Cyon, the Lodur platform and Publica took sites offline as a precaution."
