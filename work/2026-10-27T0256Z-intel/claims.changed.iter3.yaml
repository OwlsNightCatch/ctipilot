  - claim_id: 4115cfcea4
    entry: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
    surface: "summary"
    kind: frontmatter
    text: "Palo Alto Networks' advisory of 2026-10-21, revised on 2026-10-27, lists every release of PAN-OS 12.2, 12.1, 11.2, 11.1 and 10.2 and of Panorama as affected by the PHP flaws CVE-2026-109618 and CVE-2026-109619 through the management web interface (the HTTPS web UI and the XML API service). Eleven hotfixes are released (10.2.13-h27, 10.2.16-h12, 10.2.18-h13, 11.1.4-h38, 11.1.6-h40, 11.1.10-h36, 11.1.13-h16, 11.1.16-h4, 11.2.10-h16, 12.1.7-h11 and 12.2.4-h1) and nine others carry estimated dates up to 2026-10-30. Palo Alto scores the PAN-OS impact as availability only (CVSS-B 8.7 with management reachable from the internet, 7.1 behind a jump box) and knows of no malicious exploitation against its products, although CISA added both PHP flaws to its Known Exploited Vulnerabilities catalog on 2026-10-26; GlobalProtect and the captive portal are not affected."
  - claim_id: e0d3563aa4
    entry: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
    surface: "actions[0]"
    kind: frontmatter
    text: "Install the released hotfix for your maintenance release on every PA-Series and VM-Series firewall and Panorama: 10.2.13-h27, 10.2.16-h12, 10.2.18-h13, 11.1.4-h38, 11.1.6-h40, 11.1.10-h36, 11.1.13-h16, 11.1.16-h4, 11.2.10-h16 (11.2.10-h17 adds the Brotli fix), 12.1.7-h11 or 12.2.4-h1; for every other release, restrict the management interface to a jump box or trusted internal addresses until its hotfix ships, due 2026-10-27 to 2026-10-30, because Palo Alto lists no other workaround."
