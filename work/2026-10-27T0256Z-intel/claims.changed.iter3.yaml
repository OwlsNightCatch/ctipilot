  - claim_id: 83d95feb1d
    entry: 2026-10-25/qnap-synology-php2shell-qts-quts-hero-fixed-others-unfixed
    surface: "summary"
    kind: frontmatter
    text: "QNAP's advisory QSA-26-18 says the PHP2Shell flaws CVE-2026-109618 and CVE-2026-109619 (CVSS 4.0 9.2) affect the PHP in the web components of QTS, QuTS hero, QuTScloud and several QNAP applications and can be triggered before authentication, and fixed builds dated 2026-10-23 are out for QTS, QuTS hero and QuTScloud. As of 2026-10-27 the table lists QVR Surveillance (ARM32) 3.0.3.1756 and TVR OS 1.0.5 as resolved, Notes Station 3 and QNE (ADRA) have no fix and QNAP says to keep devices off the internet; QNAP has seen scanning and exploitation attempts in the wild but no reports of exploitation targeting its products, and CISA added both flaws to its Known Exploited Vulnerabilities catalog on 2026-10-26. Synology's advisory fixes its PHP packages (except the end-of-life PHP 7.3), Mail Station and Calendar."
  - claim_id: e789470da5
    entry: 2026-10-25/qnap-synology-php2shell-qts-quts-hero-fixed-others-unfixed
    surface: "actions[0]"
    kind: frontmatter
    text: "Update every QNAP NAS on QTS, QuTS hero or QuTScloud to the builds of 2026-10-23 (QTS 6.1.0.3656 or 5.2.11.3661, QuTS hero h6.1.0.3656, h6.0.2.3656 or h5.2.11.3661, QuTScloud c5.2.9.3661), every QVR Surveillance (ARM32 models) to 3.0.3.1756 and every TVR OS to 1.0.5, and take any QNAP device running Notes Station 3 or QNE (ADRA) off the internet until QNAP lists a fix."
