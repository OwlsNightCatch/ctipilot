    entry: 2026-10-27/php2shell-ot-products-netmodule-nrsw-no-fix-macmon-schneider
    surface: "summary"
    kind: frontmatter
    text: "Industrial, building and network-access vendors have published their own notices for the PHP flaws CVE-2026-109618 and CVE-2026-109619, which CISA added to its Known Exploited Vulnerabilities catalog on 2026-10-26. Belden says all versions of NetModule NRSW, the router software of the Bern-headquartered NetModule AG, are affected with no patched release and advises disabling the web interface; macmon 6.x and 7.x, Schneider Electric Security Expert and Control Engineering, B&R APROL, HMS Netbiter, Wibu-Systems CodeMeter License Central and Oracle Secure Backup and Solaris 11 carry fixes or remediations at varying stages."
