  - claim_id: e2eab545be
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "record 2026-10-27T03:48:15Z"
    kind: record-summary
    text: "CISA added both flaws to its Known Exploited Vulnerabilities catalog on 2026-10-26 after a honeypot operator documented the first successful code execution (35 shells on three PHP 8.4.26 mod_php targets); no source ties a named CVE to a production compromise. VulnCheck's exploit now also covers PHP 8.2 and 8.3 builds on mod_php, and SRF links a data theft at TCS Camping's booking-system supplier to the PHP flaw; the entry's earlier statements that neither flaw was listed and that no source reported successful exploitation are replaced."
  - claim_id: 78295706e3
    entry: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
    surface: "summary"
    kind: frontmatter
    text: "Palo Alto Networks' advisory of 2026-10-21, revised on 2026-10-27, lists every release of PAN-OS 12.2, 12.1, 11.2, 11.1 and 10.2 and of Panorama as affected by the PHP flaws CVE-2026-109618 and CVE-2026-109619 through the management web interface (the HTTPS web UI and the XML API service). Nine hotfixes are released (10.2.13-h27, 10.2.16-h12, 10.2.18-h13, 11.1.4-h38, 11.1.6-h40, 11.1.10-h36, 11.1.13-h16, 11.1.16-h4 and 11.2.10-h16), none yet for PAN-OS 12.2 or 12.1, and the rest carry estimated dates up to 2026-10-30. Palo Alto scores the PAN-OS impact as availability only (CVSS-B 8.7 with management reachable from the internet, 7.1 behind a jump box) and knows of no malicious exploitation against its products, although CISA added both PHP flaws to its Known Exploited Vulnerabilities catalog on 2026-10-26; GlobalProtect and the captive portal are not affected."
  - claim_id: bfa2e0556b
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "summary"
    kind: frontmatter
    text: "Node.js released 22.23.4, 24.22.1 and 26.12.1 on 2026-10-21 to fix CVE-2026-111497, an out-of-bounds write in its bundled Brotli decoder that can lead to remote code execution, and Imperva ran code through it against the official Node.js 24.22.0 image. The flaw is in the upstream Brotli library, so the PyPI packages Brotli (fixed in 1.2.1) and brotlicffi (1.2.1.0), Envoy, Microsoft .NET, PHP for Windows, Ubuntu and, with Brotli inspection and TLS decryption enabled, PAN-OS 12.2, 12.1 and 11.2 firewalls carry it too, with fixes shipped or due by 2026-10-30. NCSC Switzerland rates exploitation unknown with a proof of concept available; no source reports exploitation outside Imperva's laboratory demonstration."
  - claim_id: 447b7a5eae
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "body"
    kind: cited
    text: "**Exposure:** a service on Node.js 22.x, 24.x or 26.x below the fixed releases that decodes Brotli from an untrusted party, either request bodies inflated by Express 5 or body-parser 2 or compressed responses that fetch() consumes from a server an attacker influences ("
    urls: ["https://www.imperva.com/blog/node2shell-from-brotli-data-to-remote-code-execution/"]
