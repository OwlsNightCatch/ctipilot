  - claim_id: 0d044c339e
    entry: 2026-09-30/cve-2026-86950-apple-coregraphics-zero-day-kev
    surface: "body"
    kind: uncited
    text: "No indicators or behavioural detections have been published by Apple, Meta or CISA, so version compliance is the only measurable lever: device-management inventory of iPhones and iPads below iOS or iPadOS 26.7.1 (below 18.7.11 on iPhone XS, XS Max, XR and iPad 7th generation), and of Macs on Tahoe or Sequoia below the fixed builds."
  - claim_id: 9dbadb29db
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "summary"
    kind: frontmatter
    text: "The PHP project released 8.5.12, 8.4.27, 8.3.36 and 8.2.35 on 2026-10-21 to fix CVE-2026-109618 and CVE-2026-109619 (CVSS 4.0 9.2), two flaws in the runtime itself that allow unauthenticated remote code execution as the web worker account, most directly on Apache mod_php; PHP 8.1 and older get no upstream release. CISA added both flaws to its Known Exploited Vulnerabilities catalog on 2026-10-26, after a honeypot operator documented 35 successful code executions on PHP 8.4.26 under single-worker mod_php and VulnCheck extended its working exploit across builds of PHP 8.2 to 8.5; the only production victim reported is a Swiss booking-system supplier whose theft SRF links to the PHP flaw without naming a CVE, and Palo Alto Networks' Unit 42 retracted on 2026-10-25 its update that linked an attack on a European government agency to these flaws. A third code-execution path, CVE-2026-115560, is not fixed by the October releases: keep session.upload_progress.enabled=0 until the next regular release. As of 2026-10-22 BACS knew of no attack in Switzerland but said PHP applications of the federal administration were affected and that it had no complete overview of the update status; Swiss cantons, universities, the host Cyon, the Lodur fire-brigade platform and Publica took sites offline as a precaution."
