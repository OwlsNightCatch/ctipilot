- code: F14
  category: quantifier-without-source
  section: incident
  item: "2026-10-27/camping-care-tcs-camping-data-theft-php-flaw-whatsapp-fraud (body, first paragraph, claim 268e7efd6e)"
  url_or_quote: "The stolen fields already in criminal use are names, telephone numbers and reservation numbers ... SRF: \"Dabei seien unter anderem Daten wie Namen, Telefonnummern, Reservationsnummern verwendet worden.\" (https://www.srf.ch/sendungen/kassensturz-espresso/espresso/php-sicherheitsluecke-betrugsversuche-nach-datenleck-im-buchungssystem-fuer-tcs-camping)"
  summary: "SRF says the used data includes, among other things (unter anderem), names, telephone numbers and reservation numbers; the entry states the three fields as the closed set of stolen fields already in criminal use. Fix: 'include, among other data, names, telephone numbers and reservation numbers'. The summary sentence ('Names, telephone numbers and reservation numbers are already used') is not exhaustive and needs no change."
- code: F11
  category: editorial-advisory
  section: vulnerability
  item: "2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619 (body third paragraph and 2026-10-27 section, claims 2b3e48f0cf, 042abb8efd)"
  url_or_quote: "The first documented code execution is a honeypot report by Adel Karimi of Perplexity dated 2026-10-24"
  summary: "(low confidence) advisory wording: the same entry reports earlier lab code execution (ReliaQuest 'reproduced exploitation ... in controlled labs', VulnCheck's working exploit), so 'first documented code execution' is only true in the in-the-wild sense SecurityWeek and BleepingComputer use ('had not confirmed any successful code execution'). 'first confirmed code execution against live (honeypot) targets' would remove the ambiguity. May be left."
