    discovery_trace: "first seen at: inside-it-ch, RSS https://www.inside-it.ch/rss.xml (item 'Erfolgreiche Angriffe auf PHP-Lücken bestätigt', 2026-10-26) → extract https://www.inside-it.ch/erfolgreiche-angriffe-auf-php-luecken-bestaetigt-20261026 → pivot: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/php2shell-security-flaws-now-sucessfully-exploited-in-the-wild/ → primary: Karimi honeypot report, URL https://github.com/0x4D31/honeypot-data/blob/main/reports/php2shell/2026-10-24-confirmed-rce.md; KEV leg: cisa-advisories, WebFetch https://www.cisa.gov/news-events/cybersecurity-advisories → alert https://www.cisa.gov/news-events/alerts/2026/10/26/cisa-adds-two-known-exploited-vulnerabilities-catalog → structured check `cisa-kev` bridge (catalogVersion 2026.10.26, dateReleased 2026-10-26T22:24:24Z); Swiss leg: srf-news feed https://www.srf.ch/news/bnf/rss/1646 (keyword sweep) → extract of the Espresso article; Risikomonitor numbers come only from Inside IT (php.risikomonitor.com/ch renders them client-side, the extract showed no figures)."
    summary: |
      Three developments since the covered entry's 2026-10-26 state, which still says no source ties a confirmed compromise to these flaws.
      (1) Exploitation. Adel Karimi (Perplexity) published honeypot evidence dated 2026-10-24 of successful remote code execution against PHP 8.4.26 under single-worker Apache mod_php with a 128 MiB memory limit: 35 execution-stage requests, each followed by a /bin/sh started directly by an Apache worker (uid 33), on three disposable honeypot targets, from two source-address clusters, which he says does not establish two actors. The chain was a four-stage multipart sequence: memory-pressure request, memory disclosure through an oversized PHPSESSID (an 819,200-byte decoded cookie returned in the response), a second memory-pressure request, then an execution request adjusted to the leaked memory layout. The report says the worker usually crashes right after the shell starts, so no normal access-log line exists and HTTP 200 on the first stages is not the success criterion, and that the first commands were an id/proof-file write plus wget, curl or PHP CLI file_get_contents callbacks that failed on the minimal honeypot images. Karimi says the traffic closely matches the public HTTP-only PoC family, that the observed chain is consistent with CVE-2026-109618 and does not establish a distinct CVE-2026-109619 path, and that the evidence "is not a measurement of exploit reliability on other worker counts, PHP builds, or applications". BleepingComputer (2026-10-26) relays it and quotes Expel's Marcus Hutchins calling it the highest-quality confirmation of in-the-wild exploitation he has seen. This is honeypot evidence, not a production victim; it is consistent with CrowdStrike's earlier expectation that a reliable exploit needs a favourable deployment profile.
      (2) KEV. CISA added CVE-2026-109618 ("PHP Memory Corruption Vulnerability") and CVE-2026-109619 ("PHP Stale Internal Request-State Vulnerability") to its Known Exploited Vulnerabilities catalog on 2026-10-26 (catalog 2026.10.26); the entries carry dueDate 2026-10-29, forensicTriage "Yes" and knownRansomwareCampaignUse "Unknown", and CISA revised its 2026-10-21 alert the same day. The FCEB due date is a US federal obligation, but the 'Yes' forensic-triage flag and the 3-day clock are the signal that CISA treats the exploitation evidence as sufficient. The covered entry's statement that neither CVE is in KEV (as of 2026.10.23) is superseded.
      (3) Switzerland. Inside IT relays the Risikomonitor live monitor: on 2026-10-26, 54,229 of the Swiss domains checked (more than 1.8 million web servers in scope) were still unpatched; the same outlet gave 20,231 of 576,549 on 2026-10-22, so the two figures have different scopes and are not a like-for-like trend, and an unpatched domain is not a compromised one. BACS had said no attacks were known in Switzerland and Inside IT says whether the new findings change that is open. SRF Espresso (2026-10-26) reports that TCS Camping is warning about 15,000 customers because the provider of its booking system, Camping.Care, was hit by data theft "in connection with" the PHP security hole: fraudulent WhatsApp messages referencing existing reservations used names, phone numbers and reservation numbers, no account or IBAN data was affected, and the hole has been closed. Neither SRF nor TCS names the CVE or the technique, no vendor statement from Camping.Care was found, and this is a private-sector booking supplier, so it is a reported Swiss data theft linked by TCS to the PHP flaws and not a confirmed PHP2Shell compromise.
    region_nexus: "Switzerland (Risikomonitor Swiss unpatched count; BACS position; TCS Camping / Camping.Care customer-data theft) plus global exploitation status"
