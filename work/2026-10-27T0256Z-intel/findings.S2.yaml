    extended_notes: |
      Detection concepts from the Karimi report (behavioral only, no IOCs): (a) web-server process telemetry: an Apache worker (www-data) spawning /bin/sh followed by id, uname, hostname, wget, curl or php -r, then the worker exiting on a segmentation fault (process-creation events with parent lineage plus Apache error log "child pid ... exit signal Segmentation fault"); (b) PHP error log lines "Allowed memory size ... exhausted ... in Unknown on line 0" at request startup and "Session ID is too long or contains illegal characters" in bursts; (c) response-side: a Set-Cookie carrying a PHPSESSID of hundreds of kilobytes; (d) request-side: very large chunked or fixed-length multipart POSTs to / or /index.php with hundreds of form parts, PHPSESSID and PHP_SESSION_UPLOAD_PROGRESS fields, no User-Agent header, from hosting-provider address space; (e) egress from the web-server account to uncommon HTTP destinations right after such requests. Benign lookalike: a genuine OOM from a large legitimate upload also produces "memory exhausted" lines, but without a shell child process, an oversized session cookie in the response or the multipart structure. Karimi's data cover mod_php with a single worker; a defender running PHP-FPM or multi-worker mod_php should not read the absence of these patterns as safety. Post-patch check: because exploitation attempts began before the 2026-10-21 release (Amazon 2026-10-17), the earlier BACS/AWS guidance to look back to 2026-10-17 stands. Related store entries that mention PHP2Shell via products (PAN-OS/Panorama, NetScaler, QNAP) can note that KEV lists PHP itself, not those products.
