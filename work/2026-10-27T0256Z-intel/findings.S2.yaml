    sources:
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/13105", publisher: "NCSC Switzerland / BACS, Cyber Security Hub (GovCERT.ch)", date: "2026-10-26", role: "primary" }
    discovery_trace: "first seen at: ncsc-ch-security-hub, bridge `ncsc-csh recent 25` (post id 13105, created 2026-10-26T13:02:30Z; API JSON is the data, human page https://security-hub.ncsc.admin.ch/#/posts/13105) → primary (no pivot needed). Covered-entry check: neither 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi nor 2026-10-26/cve-2026-111497-microsoft-net-oob-update-brotli-sockets-fix cites the CSH post."
    summary: |
      The Swiss national authority published on 2026-10-26 an advisory on the Brotli decoder out-of-bounds write (CVE-2026-111497, CVSS 4.0 9.2): unauthenticated remote attackers can cause denial of service or potentially execute code when an application decodes attacker-controlled Brotli data; the advisory states the current exploitation status as unknown with a proof of concept available, lists Node.js, Microsoft .NET, Visual Studio and PowerShell, the Python Brotli and brotlicffi packages and Bun among the dependents, and names as prerequisites an application decoding attacker-controlled Brotli data such as compressed HTTP request or response bodies or compressed files, no authentication required. Its interim mitigation is to disable Brotli decoding of untrusted data and reject Content-Encoding: br until patched, and to restart services and rebuild containers after updating. The covered entries describe the flaw, fixes and exploitation (none reported) but do not carry the interim 'reject Content-Encoding: br' mitigation or the Swiss authority's advisory. Value for the constituency: the Swiss authority has flagged it for its audience, and the mitigation is useful to estates that cannot yet roll Node.js, .NET or PyPI updates.
