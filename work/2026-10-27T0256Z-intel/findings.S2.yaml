    summary: |
      Two small, dated deltas on the covered entry. Inside IT (2026-10-26) relays, from a SonntagsBlick interview, that the Federal Data Protection and Information Commissioner Adrian Lobsiger could not say more about PK Softech because of investigative secrecy but did not rule out extending the procedure later to federal bodies such as pension funds; this would move the proceeding from the supplier to the public bodies (Publica among them) that handed data to it. In the same interview Lobsiger says the EDÖB had received 455 data-security-breach notifications so far in 2026 against 343 in all of 2025 and that, looking at the causes of the reported attacks, human failure rather than technology is the weak point in the large majority of cases; he also says that linking data and dismantling data silos raises breach risk and that anonymised test data should be preferred to production data, which is the issue behind the City of Zurich fund's test-data theft and the Publica legacy-data deletion promise. The Publica incident page carries a new status entry dated 2026-10-26 stating that it has no indication that data from the supplier attack was published on the darkweb and that it keeps monitoring; the covered entry already carries the 2026-10-20 version of that statement, so this is a re-confirmation, not a change. Neither the EDÖB's investigation scope nor Publica's own data-loss assessment has changed in these sources. Lobsiger statements are single-source (Inside IT relaying a paywalled interview).
