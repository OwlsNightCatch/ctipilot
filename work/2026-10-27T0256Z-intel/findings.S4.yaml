items:
  - title: "Camping.Care booking system (reservations for all TCS campsites): customer and booking data stolen through the PHP flaw, fraudulent WhatsApp messages already quote real reservation numbers"
    sources:
      - { url: "https://www.srf.ch/sendungen/kassensturz-espresso/espresso/php-sicherheitsluecke-betrugsversuche-nach-datenleck-im-buchungssystem-fuer-tcs-camping", publisher: "SRF (Kassensturz Espresso)", date: "2026-10-26", role: "primary" }
      - { url: "https://www.blick.ch/wirtschaft/hackerangriff-auf-tcs-camping-15000-kunden-gewarnt/nws2bcn", publisher: "Blick", date: "2026-10-26", role: "corroborating" }
      - { url: "https://www.inside-it.ch/erfolgreiche-angriffe-auf-php-luecken-bestaetigt-20261026", publisher: "Inside IT", date: "2026-10-26", role: "context" }
      - { url: "https://www.bacs.admin.ch/de/warnung-php-de", publisher: "BACS (Federal Office for Cybersecurity)", date: "2026-10-21", role: "context" }
      - { url: "https://borncity.com/blog/2026/10/27/sicherheitsvorfall-bei-secra-bookings-mittelholstein-tourismus-betroffen/", publisher: "Borns IT- und Windows-Blog", date: "2026-10-27", role: "context" }
    discovery_trace: "first seen at: srf-news, URL https://www.srf.ch/news/bnf/rss/1646 (feed fetched 2026-10-27; item 'PHP-Sicherheitslücke – Betrugsversuche nach Datenleck im Buchungssystem für TCS-Camping', 2026-10-26 17:04Z) → primary: SRF Espresso article, URL https://www.srf.ch/sendungen/kassensturz-espresso/espresso/php-sicherheitsluecke-betrugsversuche-nach-datenleck-im-buchungssystem-fuer-tcs-camping (extract; carries the TCS spokesman's confirmation) → corroborating: blick-ch feed https://www.blick.ch/rss.xml, URL https://www.blick.ch/wirtschaft/hackerangriff-auf-tcs-camping-15000-kunden-gewarnt/nws2bcn (relays SRF, adds supplier nationality and the wider PHP wave) → context: Inside IT 2026-10-26 (BACS knew of no Swiss attacks at that time) and BACS PHP warning page. No Camping.Care or TCS own notice could be fetched (tcs.ch pages read, no notice found); no Dutch-language report found (WebSearch 'Camping.Care datalek' returned only an unrelated Secureholiday/Ctoutvert breach from July)."
    summary: |
      TCS Camping is warning about 15,000 guests after Camping.Care, the Dutch supplier of the booking system through which all Touring Club Schweiz campsites take reservations, suffered a data theft. TCS confirmed to SRF's consumer programme Espresso on 2026-10-26 that fraudsters could steal customer and booking information, and SRF ties the case to the worldwide PHP vulnerability; Blick, relaying SRF, says the attackers used the two critical PHP flaws disclosed the week before and that Camping.Care is not the only software supplier hit. The stolen fields already in criminal use are names, telephone numbers and reservation numbers: fraudulent WhatsApp messages that refer to existing reservations have been reported to guests. TCS says account details and IBANs were not affected, that credit card data is not stored in the booking system, that TCS Camping sends no booking details, payment requests or reservation links over WhatsApp, and that the vulnerability has since been closed. No source names the CVE identifiers, the exploited entry point, the date of the intrusion, how many other Camping.Care customers are affected or an actor, and Camping.Care itself is not quoted. No earlier Swiss victim disclosure for the PHP flaws turned up in this run's sources: Inside IT reported earlier the same day that the BACS knew of no attacks in Switzerland while not ruling out unreported ones, so this is the first Swiss-linked victim in this run's reading, one hop away from the Swiss organisation (a supplier) rather than at TCS itself. A parallel booking-platform case is reported by the Borns IT blog (reliability C): secra bookings (Germany) states a 2026-10-23 attack that exported booking data, but the blogger's PHP link is his own suspicion, not secra's statement.
    region_nexus: "switzerland (15,000 TCS campsite guests; supplier in the Netherlands)"
    primary_sector_nexus: "indirect (consumer/association victim; a supplier-hosted PHP application, the exposure class that BACS tells public bodies to ask their suppliers about)"
    sector: "tourism / consumer services"
    cves: [CVE-2026-109618, CVE-2026-109619]
    cve_note: "SRF names only 'the PHP vulnerability' and Blick 'the two critical PHP vulnerabilities' of the previous week; the CVE ids are the main agent's mapping to the store's PHP2Shell entries (references[] needed), not quoted by either outlet."
    techniques: [T1190, T1566.003]
    technique_note: "T1190: Blick says the attackers used the PHP flaw against the booking system; T1566.003: the follow-on is fraud over WhatsApp using real reservation data."
    affected_products: ["Camping.Care (booking system)", "PHP"]
    entity_keys: ["tool:php2shell"]
    new_entities:
      - { key: "incident:camping-care-tcs-camping-data-theft-2026-10", type: incident, name: "Camping.Care / TCS Camping booking-data theft (PHP flaw)", aliases: ["TCS Camping data leak"], summary: "Data theft at the Dutch booking-system supplier Camping.Care, which handles reservations for all TCS campsites; TCS warned about 15,000 guests on 2026-10-26 and ties it to the PHP flaw (SRF, Blick, 2026-10-26)." }
    relation_suggestions:
      - { subject: "incident:camping-care-tcs-camping-data-theft-2026-10", object: "tool:php2shell", basis: "Blick states the attackers used the critical PHP vulnerabilities of the previous week to steal Camping.Care customer and booking data, citing SRF Espresso (2026-10-26); SRF says the data theft is 'in connection with' the worldwide PHP flaw" }
    verification: SINGLE-SOURCE-OTHER
    verification_note: "two outlets, one first-hand chain: the TCS spokesman's confirmation to SRF Espresso; Blick relays SRF. The PHP link is TCS's/the supplier's account as SRF relays it; Camping.Care is not quoted."
    confidence: MEDIUM
    classification_hint: { reliability: B, credibility: 2 }
    novelty: new
    references_suggested: ["2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619", "2026-10-23/netscaler-php2shell-management-gui-fixes-2026-10-27"]
    novelty_note: "A distinct supplier-breach finding that builds on the PHP2Shell entries (CVE overlap, so references[] is required); the main agent may instead fold it into those entries as an update of the 'PHP2Shell victims' running story, which is what the spawn message lists under developing incidents."
    evidence:
      - quote: "Wie der TCS gegenüber dem SRF-Konsumentenmagazin «Espresso» bestätigt, konnten Betrüger Kunden- und Buchungsinformationen entwenden."
        attribution: "SRF (Kassensturz Espresso)"
        source_url: "https://www.srf.ch/sendungen/kassensturz-espresso/espresso/php-sicherheitsluecke-betrugsversuche-nach-datenleck-im-buchungssystem-fuer-tcs-camping"
      - quote: "Im Schreiben an Camping-Gäste heisst es, es seien betrügerische Whatsapp-Nachrichten gemeldet worden, die sich auf bestehende Reservationen beziehen."
        attribution: "SRF (Kassensturz Espresso)"
        source_url: "https://www.srf.ch/sendungen/kassensturz-espresso/espresso/php-sicherheitsluecke-betrugsversuche-nach-datenleck-im-buchungssystem-fuer-tcs-camping"
      - quote: "Die Hacker nutzten die kritische Sicherheitslücke der Programmiersprache PHP, um Kunden- und Buchungsdaten zu stehlen"
        attribution: "Blick"
        source_url: "https://www.blick.ch/wirtschaft/hackerangriff-auf-tcs-camping-15000-kunden-gewarnt/nws2bcn"
      - quote: "Über das Buchungssystem der holländischen Firma werden unter anderem Reservationen für sämtliche Campingplätze des Touring Club Schweiz (TCS) abgewickelt."
        attribution: "Blick"
        source_url: "https://www.blick.ch/wirtschaft/hackerangriff-auf-tcs-camping-15000-kunden-gewarnt/nws2bcn"
      - quote: "Dem Bundesamt für Cybersicherheit (Bacs) waren gemäss dem bisherigen Stand keine Angriffe in der Schweiz bekannt."
        attribution: "Inside IT"
        source_url: "https://www.inside-it.ch/erfolgreiche-angriffe-auf-php-luecken-bestaetigt-20261026"
    extended_notes: |
      Exposure (what the sources support): customers of a PHP-based, supplier-hosted booking or portal application. The BACS PHP warning
      page tells operators to ask their software suppliers and service providers which products are affected, to check hosted offers for
      confirmed fixes, and says an update does not remove an earlier compromise; that is the supplier-chain question for any Swiss
      public body whose tourism, camping, ticketing, citizen-portal or booking service runs on a third party's PHP stack.
      Detection / triage (from the stated mechanism): the visible follow-on is WhatsApp fraud that quotes real names, telephone numbers and
      reservation numbers; TCS states it never sends booking details, payment requests or reservation links over WhatsApp, which is the
      discriminator between a genuine message and the fraud. No post-exploitation behaviour (web shell, persistence) is described by any source.
      Gaps: no CVE ids, entry point, intrusion date, Camping.Care statement, count of other Camping.Care customers (Switzerland or elsewhere).
      TCS (Touring Club Suisse) is also in the Ransomware.live Swiss list as a Qilin claim of 2026-09-20 (unrelated date and actor; no
      source ties the two).
      Same-day sibling: borncity.com (C) on secra bookings (DE) 2026-10-23 attack with exported booking data, partner names including
      Mittelholstein-Tourismus; PHP2Shell is the blogger's suspicion (the firm publishes Contao modules), not secra's statement.

  - title: "PK Softech / Publica: the data protection commissioner does not rule out widening the formal investigation to federal bodies and pension funds; Publica's page of 2026-10-26 still reports no darkweb publication"
    sources:
