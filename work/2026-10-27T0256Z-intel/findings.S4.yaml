    summary: |
      The Seoul Metropolitan Police Agency's cyber investigation unit announced on 2026-10-26 (Yonhap) that it referred a 32-year-old gang leader to prosecutors on 2026-10-23 and that six accomplices are investigated without detention; the group is accused of stealing 8.2 million personal-data records and internal files from more than 90 organisations since September 2025 (cram schools, hospitals, golf courses, universities, large-company affiliates) and sending extortion messages to 38 of them demanding 360 million won in total (BleepingComputer: by e-mail; Yonhap: accomplices also threatened victims' staff by telephone and text message; Yonhap's sub-headline says about 300 million won was extorted, its body gives 360 million as the amount demanded), warning that a disclosed leak would damage the firm's image and could bring regulatory fines; no encryption step is reported. Per Yonhap the leader, a self-taught former penetration tester (2019 to 2022), used conventional vulnerability-finding tools at first and from late August 2026 used generative AI to attack a far broader set of firms indiscriminately; 60 of the victims were hacked with AI, and the AI autonomous penetration-testing system recently used in the South Korean finance-sector data thefts was also used. BleepingComputer, citing Korean media, names that framework as ARTEX, the framework the store already covers through Microsoft's Storm-0940 reporting and CrowdStrike's and Recorded Future's reporting on South Korean banks; Yonhap itself describes the system without naming it, so the ARTEX label is BleepingComputer's. The new point for defenders is the actor class: a non-state, financially motivated extortion gang using the same agentic framework against hospitals and education, with a stated police view that AI lowers the entry barrier.
