      The University of Copenhagen confirmed on 2026-10-23 that hackers reached one of its test environments, detected on Tuesday 2026-10-20 and then brought under control; the database holds personally identifiable information (full name, national identity number, work and home telephone number, personal e-mail address) on about 525,000 individuals. The university says it has no indication that systems supporting day-to-day operations were reached or that activity was affected, and it reported the incident to the Danish Data Protection Agency. In an update of 2026-10-25 20:00 it added that the PIN codes of the ID cards of about 20,000 staff and students were compromised, that this is not a new breach but information it chose not to publish until the codes were changed, and that on 2026-10-23 it restricted physical access to selected critical campus locations and reopened them once new PIN codes were issued. No source names the initial access, an actor, a ransom or the dwell time. The transferable point is the exposure class that also runs through the PK Softech case: production personal data sitting in a test environment, and access-control secrets stored next to it.
