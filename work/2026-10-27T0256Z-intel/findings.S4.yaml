      - { url: "https://www.tio.ch/svizzera/attualita/1958918/dati-violazioni-sicurezza-aumento-svizzera", publisher: "Ticinonline", date: "2026-10-25", role: "corroborating" }
      - { url: "https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten", publisher: "Publica (Pensionskasse des Bundes), page status 2026-10-26", date: "2026-10-26", role: "primary" }
    discovery_trace: "first seen at: inside-it-ch feed https://www.inside-it.ch/rss.xml (2026-10-26 12:19Z item 'Edöb untersucht Cyberangriff auf PK Softech') → extract of https://www.inside-it.ch/edoeb-untersucht-cyberangriff-auf-pk-softech-20261026 (relays the SonntagsBlick interview of 2026-10-25) → corroborating: tio-ch-attacco-informatico, URL https://www.tio.ch/svizzera/attualita/1958918/dati-violazioni-sicurezza-aumento-svizzera (ATS-style relay of the same interview, 2026-10-25) → primary for status: Publica page https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten (carries 'Stand: 26.10.2026'). The SonntagsBlick interview itself was not found (WebSearch returned nothing); EDÖB press release of 2026-10-23 already cited in the entry."
    summary: |
      Two stated facts beyond the entry's 2026-10-25 update. First, in an interview with SonntagsBlick (2026-10-25), relayed by Inside IT and Ticinonline, the federal data protection commissioner Adrian Lobsiger says the formal investigation opened on 2026-10-22 is currently directed against the external IT supplier but that he does not rule out extending it later to federal bodies such as the pension funds; he adds that the interlinking of data and the removal of data silos raise breach risk, that only strictly necessary data should be transmitted, and that anonymised test data is preferable to productive data, which maps onto the entry's test-data and migration-copy findings. He also reports 455 data-security-breach notifications in 2026 so far against 343 in all of 2025, with a high number of unreported cases. Second, Publica's page, status of 2026-10-26, again states it has no indication that data from the attack has been published on the darkweb and that it keeps monitoring. Neither the Confederation nor Publica has changed what it says about the actor, the demand or the scope; the Inside IT piece repeats the 2026-10-23 EDÖB press release.
