        type: incident
        name: "ReliaQuest ShinyHunters leak-site claim / vishing incident (August 2026)"
        aliases: []
        summary: "ShinyHunters listed MDR vendor ReliaQuest on its leak site on ~22-23 August 2026 with unverified screenshots; ReliaQuest's own incident writeup instead documents a vishing call plus MFA-push approval that yielded one view-only identity-dashboard session, contained by device-trust controls before any application or customer data was reached, and explicitly denies compromise (ReliaQuest, 2026-08-23)."
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Claims that ReliaQuest was compromised or targeted by ransomware are false."
        attribution: "ReliaQuest"
        source_url: "https://reliaquest.com/blog/threat-spotlight-social-engineering-attempt-against-reliaquest-what-we-found"
      - quote: "One teammate entered their password and approved the push notification on their phone. That handed the attacker a brief session on our identity dashboard. The extent of the access was view only."
        attribution: "ReliaQuest"
        source_url: "https://reliaquest.com/blog/threat-spotlight-social-engineering-attempt-against-reliaquest-what-we-found"
      - quote: "This playbook is consistent with what we are seeing across the industry: an impersonation call, a throwaway lookalike domain registered and burned within the hour, a harvesting page behind a content delivery network, MFA push abuse, and a rapid attempt to enroll a new authenticator."
        attribution: "ReliaQuest"
        source_url: "https://reliaquest.com/blog/threat-spotlight-social-engineering-attempt-against-reliaquest-what-we-found"
    extended_notes: |
      Detection concept (telemetry class first): identity-provider audit logs showing a successful primary
      authentication plus MFA-push approval event immediately followed, within the same session, by repeated
      application-access denials keyed to device-compliance/device-trust posture — that sequence (auth succeeded,
      but every downstream access attempt failed on device state) is itself a higher-fidelity phishing indicator than
      the authentication event alone. Benign lookalike / triage discriminator (source-supported): ReliaQuest states
      the attacker also attempted rapid enrollment of a new MFA authenticator — a legitimate user re-enrolling a
      lost device also generates this event, but the discriminator here is context: the attacker's enrollment
      attempt followed immediately after a single push approval from a session that had already failed one or more
      device-trust checks, whereas a legitimate re-enrollment typically follows an established helpdesk/change
      workflow and originates from a session that has NOT just failed device compliance. Hardening takeaway: the
      control that actually capped this incident's blast radius was device-trust binding — treating a successful
      identity-provider sign-in as necessary but not sufficient for application access, with a separate managed-device
      check required before any business system is reachable. This is the concrete lesson for any organisation
      (including this constituency's public-sector and CI identity estates) relying on IdP authentication plus MFA
      alone as the access boundary. Fake-news scrutiny applied: the ShinyHunters leak-site listing itself is treated
      throughout as the attacker's own unverified assertion (no data sample, no ransomware, no forensic corroboration
      from any third party) and is explicitly NOT the basis for this item — the item's substance is ReliaQuest's own
      disclosed incident, which is a materially different (and lesser) event than the extortion claim implies.

