items:
  - title: "ShinyHunters lists MDR vendor ReliaQuest on its leak site with three unverified screenshots; ReliaQuest's own writeup instead documents a vishing call plus MFA-push approval contained to one view-only identity session"
    sources:
      - { url: "https://reliaquest.com/blog/threat-spotlight-social-engineering-attempt-against-reliaquest-what-we-found", publisher: "ReliaQuest (victim's own incident writeup)", date: "2026-08-23", role: "primary" }
      - { url: "https://www.galaxywarden.com/blog/breach/reliaquest-llc-shinyhunters-2026-08", publisher: "GalaxyWarden (breach-tracking blog, reliability unconfirmed)", date: "2026-08-23", role: "corroborating" }
    discovery_trace: >
      first seen at: WebSearch ("ShinyHunters ReliaQuest hack claim August 2026") →
      pivot: DataBreaches.Net, URL https://databreaches.net/2026/08/23/shinyhunters-claims-hack-of-reliaquest-but-provides-no-proof/
      (attempted fetch failed — direct HTTP 403 and jina reader credit-exhausted this run; logged as fetch failure) →
      pivot: GalaxyWarden, URL https://www.galaxywarden.com/blog/breach/reliaquest-llc-shinyhunters-2026-08 (fetched, corroborates claim exists and is unconfirmed) →
      primary: ReliaQuest's own blog, URL https://reliaquest.com/blog/threat-spotlight-social-engineering-attempt-against-reliaquest-what-we-found (fetched in full)
    summary: |
      ShinyHunters posted ReliaQuest, LLC to its extortion leak site around 22-23 August 2026, supplying only three
      screenshots that appear to show a logged-in session on ReliaQuest's identity-provider end-user settings page
      and no data samples. ReliaQuest had not, at the time of the leak-site posting, issued a public statement, and
      the claim's only support was the attacker's own screenshots. ReliaQuest then published its own detailed
      incident account on 23 August 2026 titled "A Social Engineering Attempt Against ReliaQuest: What We Found,"
      which frames a distinctly different event and explicitly states that "claims that ReliaQuest was compromised
      or targeted by ransomware are false." Per ReliaQuest's account: on 22 August 2026 an attacker registered a
      lookalike domain, stood up a fake ReliaQuest single sign-on page fronted by a content delivery network, then
      cold-called multiple ReliaQuest employees, each time impersonating a named ReliaQuest security staffer to
      steer the target toward the fake SSO page (T1656 Impersonation combined with T1566.004 Spearphishing Voice).
      One employee entered a password on the fake page and approved the resulting MFA push notification (T1621
      Multi-Factor Authentication Request Generation), handing the attacker a session on ReliaQuest's identity
      dashboard (T1078.004 Valid Accounts: Cloud Accounts). ReliaQuest states the access was view-only: the
      attacker made further attempts to pivot from the identity dashboard into business applications but was
      "consistently denied due to security controls," specifically a device-trust policy that blocks any
      non-ReliaQuest-managed device from reaching applications or systems regardless of a successful identity-provider
      sign-in. Containment terminated the attacker's session, expired the compromised password, and reset every
      authentication factor for the affected account. A stated 48-hour investigation covering control fidelity,
      device trust and on-network access found no additional identities accessed, no business applications reached,
      no customer or company data accessed beyond the one user's login credentials, and no persistence established.
      ReliaQuest frames the underlying playbook — impersonation call, a throwaway lookalike domain burned within the
      hour, a CDN-fronted harvesting page, MFA push abuse, and a rapid attempt to enroll a new authenticator for
      persistence — as consistent with what it observes elsewhere in the industry.
    region_nexus: "global; US-headquartered MDR/SecOps vendor with no stated Swiss or EU customer impact — included under criterion (b): a materially transferable identity-attack chain (voice-impersonation phishing driving MFA-push approval, capped only by device-trust binding) directly applicable to any organisation's IdP hardening posture, including this constituency's public-sector and critical-infrastructure identity estates"
    primary_sector_nexus: "indirect"
    sector: "cross-sector; MDR / security-operations vendor (relevant to any sector relying on third-party SOC/MDR services, including finance, energy, public-sector)"
