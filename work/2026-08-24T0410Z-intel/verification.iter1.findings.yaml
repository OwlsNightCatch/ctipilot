  item: "2026-08-24/reliaquest-vishing-mfa-push-device-trust-contained"
  url_or_quote: "\"Around 22-23 August 2026 the extortion brand **ShinyHunters** ... listed the managed-detection vendor ReliaQuest on its leak site, supplying three screenshots that appear to show a logged-in session on an identity-provider end-user settings page, and no data samples.\" / summary: \"ShinyHunters listed ReliaQuest on its extortion leak site around 22-23 August 2026 with three screenshots appearing to show a logged-in identity-provider settings page and no data samples.\""
  summary: "The entry's only sources[] record is https://reliaquest.com/blog/threat-spotlight-social-engineering-attempt-against-reliaquest-what-we-found (fetched this iteration, full body read). Its article text never mentions ShinyHunters, a leak site, an extortion listing, screenshots, or data samples; the ONLY occurrence of 'ShinyHunters' anywhere on the page is inside <meta name=\"keywords\"> / the JSON-LD keywords string, which asserts nothing about a listing, its date, or its contents. Every leak-site fact (the actor, the dating, the screenshot count, what the screenshots show, the absence of samples) is therefore uncited, and it drives the title, headline, summary, body lead, entities[actor:shinyhunters] and tags[data-breach]. The run record's databreaches-net fetch_failures record says 'a second outlet substituted' for confirming the listing exists — that substitute never reached the entry's sources[]. Remediation: add the corroborating outlet as a sources[] record (and re-derive verification), or strip the leak-site claim from title/headline/summary/body and drop actor:shinyhunters + data-breach."
