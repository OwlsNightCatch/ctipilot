  item: "2026-08-24/rapid7-q2-2026-disclosure-volume-outpaces-triage"
  url_or_quote: "\"while the count of vulnerabilities newly observed under exploitation held roughly steady quarter over quarter at 40\""
  summary: "https://www.rapid7.com/blog/post/tr-new-report-ai-threats-q2-2026-ends-traditional-patch-cycles (fetched this iteration) says only 'Meanwhile, the number of newly exploited vulnerabilities held roughly steady (40)' — no comparison period is specified, and the immediately preceding sentence sets a year-on-year frame ('double the number reported in the same quarter last year (4,268)'). 'Quarter over quarter' is the entry's own addition, and it contradicts the entry's OWN title, which frames the same pairing year on year ('high- and critical-severity disclosures doubled year on year to 8,539 while the number newly exploited held flat at 40'). Fix: drop the period qualifier, or use year on year consistently across title, summary and body."
- code: F3
  category: claim-not-supported
  section: research
  item: "2026-08-24/ftp-banner-dead-drop-resolvers-e4del-pinhole"
  url_or_quote: "\"Its execution path extracts an authorisation token from its own command line, calls a download endpoint keyed to that token and a hardware identifier...\""
  summary: "https://socradar.io/blog/ftp-banners-new-dead-drop-resolver-rats/ (fetched this iteration) places the token extraction inside the C2 COMMAND table, not the process command line: 'runpackage%e4del%[token] extracts an authentication token and reaches out to the C2's /api/download?token=[token]&clientId=[hwid] endpoint.' The token comes from the operator's task string. E4del does separately evaluate its command line, but for a different purpose — an environment guard ('E4del immediately evaluates its command-line arguments ... It looks for the --init flag followed by a username, checking that the current Windows user matches the provided argument'). Conflating the two is detection-relevant: it points a hunter at process command lines for a value that never appears there. Fix: 'extracts an authorisation token from the operator's task string'."
- code: F8
  category: needs-more-research
  section: threats
  item: "2026-08-24/synkloader-teams-helpdesk-impersonation-six-module-loader"
  url_or_quote: "\"A **persistence module** is reached through a second fake-runtime-named DLL that maps libraries into memory without writing them to disk.\" (techniques[] = T1566.003, T1684.001, T1204.002, T1036.005, T1620, T1059.001, T1056.002, T1090, T1113, T1082, T1057, T1007, T1018, T1078, T1584.006 — no T1053.005)"
  summary: "https://expel.com/blog/synkloader-when-you-throw-in-everything-but-the-kitchen-sink/ documents the persistence mechanism in detail and explains why it was built that way, and the entry drops all of it: the DLL 'installs the task by leveraging the COM ... provider CLSID_TaskScheduler with RIID IID_ITaskService, the malware bypasses the need for invoking the Task Scheduler via the command line ... to evade EDRs by sidestepping behavioral detections which monitor command line arguments ... or look for processes which execute schtasks.exe'; 'The scheduled task itself uses a random 12-character alphanumeric name ... configured to launch ss.py via the pythonw.exe executable'; triggers 'Every time the user logs on' and 'Every day at 10 a.m. local time'. This is the most hunt-ready artifact in the report AND the thing that raised the original alert ('the EDR alerted on a scheduled task'), which the entry's own opening cites. techniques[] also omits T1053.005 (Scheduled Task) as a result. The same run's ShieldBreak entry makes exactly this COM-vs-schtasks point, so the depth standard is demonstrably reachable here."
