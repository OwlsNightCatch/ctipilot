  item: "2026-08-24/ftp-banner-dead-drop-resolvers-e4del-pinhole"
  url_or_quote: "classification: {reliability: B, credibility: 2}; sources: socradar.io only; verification: single-source"
  summary: "sources/sources.json records id `socradar` at reliability `C`, and the record's own note says 'Single-vendor investigative claims should be corroborated.' The C definition in sources.json reliability_codes is 'Fairly reliable — some doubt about consistency, OR the source mainly aggregates / re-reports rather than originates. Corroborate before acting.' The entry rates B — one letter above its own source record — on a single-source entry with no corroboration and no explanation. Either set reliability C, or (if the uplift is deliberate because this is SOCRadar STRU first-hand reversing rather than aggregation) state that reasoning in the sourcing_note so the code is auditable. Every other entry in the run matches its source's registered letter (BACS A/A, trustwave-spiderlabs B/B, expel B/B, rapid7-research B/B, truffle-security B/B, reliaquest B/B, bitdefender B/B)."
- code: F11
  category: editorial-advisory
  section: vulnerabilities
  item: "2026-08-24/shieldbreak-defender-remediation-mechanism-hunting-package"
  url_or_quote: "body: \"**`C:\\Windows\\System32\\phoneinfo.dll` does not exist natively on any Windows version**\"; summary: \"a file that exists natively on no Windows version\"; actions[0]: \"the file ships with no Windows version\""
  summary: "LevelBlue's wording is hedged and narrower: 'The file is not expected to exist natively on supported Windows versions.' The entry removes the hedge and widens the scope in three places, including the run's only estate-wide hunt action. LevelBlue does call it 'the strongest unconditional detection point', so the operational conclusion holds — but 'not expected to exist on supported Windows versions' is what the source will bear. Advisory."
- code: F11
  category: editorial-advisory
  section: vulnerabilities
  item: "2026-08-24/shieldbreak-defender-remediation-mechanism-hunting-package"
  url_or_quote: "techniques: [T1574.001, T1053.005, T1036.005, T1027.007, T1106]"
  summary: "The cited source publishes its own ATT&CK table which includes 'T1218 System Binary Proxy Execution — wermgr.exe (signed) used as SYSTEM execution vehicle', and the entry's body describes exactly that behaviour ('that task runs as SYSTEM, so `wermgr.exe` processes the report and loads `phoneinfo.dll` with SYSTEM privileges'). T1218 is active in the pinned v19.2 dataset and is absent from techniques[]. (The entry is correct to use T1574.001 rather than the source's T1574.002, which is revoked in v19.2, and correct to omit T1562.001, also revoked.) Advisory."
- code: F11
  category: editorial-advisory
