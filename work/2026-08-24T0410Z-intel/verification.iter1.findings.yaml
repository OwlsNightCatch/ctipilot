  item: "2026-08-24/reliaquest-vishing-mfa-push-device-trust-contained"
  url_or_quote: "\"ReliaQuest also records that the attacker tried to enrol a new authenticator\" and Triage: \"whereas this one followed immediately after a single push approval from a session already being denied\""
  summary: "https://reliaquest.com/blog/threat-spotlight-social-engineering-attempt-against-reliaquest-what-we-found lists authenticator enrolment only as an element of the INDUSTRY playbook this attempt is consistent with: 'This playbook is consistent with what we are seeing across the industry: an impersonation call, a throwaway lookalike domain registered and burned within the hour, a harvesting page behind a content delivery network, MFA push abuse, and a rapid attempt to enroll a new authenticator.' It never states an enrolment attempt occurred in this incident, and it states the opposite of durable access: 'no persistence was established.' The Triage line then invents a sequence (enrolment immediately after a push approval, inside a session already being denied) that no cited text supports, and closes 'Treat an enrolment attempt inside such a session as an incident' on that invented basis. Same entry, secondary item: 'A stated 48-hour investigation' misreads the source — '...and any suspicious subsequent activity in the last 48 hours' is the lookback window for subsequent activity, not the investigation's duration."
- code: F3
  category: claim-not-supported
  section: research
  item: "2026-08-24/leaked-aws-keys-still-authenticate-git-history-ci-logs"
  url_or_quote: "\"Of the broader population, 10,625 keys (16.6%) were root keys across 9,945 distinct accounts, and only 25 keys — 0.9% — were created in the last thirty days, so this is overwhelmingly not a story about fresh mistakes.\""
  summary: "https://trufflesecurity.com/blog/leaked-corporate-aws-keys-held-full-admin-rights (fetched this iteration) places the 25/0.9% figure inside the key-age section, whose stated denominator is the enumerable subset: 'For the 2,903 keys that permitted iam:ListAccessKeys, AWS reports the exact creation date. ... Only 25 keys (0.9%) were created in the last 30 days.' 0.9% x 2,903 = 26; 0.9% x 64,024 = 576, so the figure cannot be read against 'the broader population'. The entry's own sourcing_note promises the narrow-denominator figures are 'attributed as such in the body' — this one is attached to the wrong population instead. Fix: attribute it to the 2,903 keys that permitted access-key enumeration."
