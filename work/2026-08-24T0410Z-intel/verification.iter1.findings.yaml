  item: "2026-08-24/silkparasite-dll-sideload-pairing-google-drive-c2"
  url_or_quote: "headline: \"SilkParasite: five newly named RATs, one tasked through a shared Google Drive folder and another through HTTP Cookie and ETag headers\""
  summary: "The two channels the headline leads with are the exact facts the in-window strategic entry 2026-08-23/weekly-w34-c2-rendezvous-moved-to-services-you-cannot-block already published ('a China-nexus toolset whose families use a shared Google Drive folder for operator commands and HTTP cookie and ETag header values as a command channel'), and the AI-tells paragraph repeats 2026-08-23/weekly-w34-ai-bought-throughput-not-capability ('leftover Go test functions, a hardcoded AES key set to a sequential placeholder and a configuration field still reading change_this_key'). cti-run.md Phase 1 states 'intel runs never duplicate strategic entries'. The entry's genuinely new operational content — the six side-loading pairs, the pairing-as-signal detection formulation, the WMI-instead-of-cmd execution point, the five registered families, the per-host ChaCha20 keying, the attribution grounds — is what the TITLE leads with and what the headline should. Not a drop: the substance clears the bar and the run record documents the decision. Advisory (headline framing only)."
