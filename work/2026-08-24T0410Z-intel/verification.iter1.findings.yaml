- code: F11
  category: editorial-advisory
  section: annual-report
  item: "2026-08-24/bacs-halbjahresbericht-2026-1-poland-sabotage-dream-job"
  url_or_quote: "headline: \"public sector is **now** the largest share of Swiss mandatory CI reports at 19.4%\" / title: \"...makes public administration the top-reporting critical-infrastructure sector\""
  summary: "Both formulations carry a whiff of novelty the report does not claim. The report's wording is continuity: 'wobei der öffentliche Sektor (19.4 %) und die IT und Telekommunikation (18.6 %) weiterhin am häufigsten Cyberangriffe gemeldet haben' — 'weiterhin' = continue to be the most frequent reporters. The body is accurate ('the public sector accounts for the largest single share at 19.4%, ahead of IT and telecommunications at 18.6%'); only the headline/title framing implies a change. Advisory. Everything else in this entry verified clean against the re-fetched PDF (identical MD5 f085ff2341c9854023f890950b7f67fb, independently re-extracted): 27,128 / 35,727 / 200 / 19.4% / 18.6% / knapp 26% / 13.5% / 12.7% / ~8% / 10,759 / 8,877 / 3,965 / 387 -89% / 258 -57% / 3,817 -64% / 191 WordPress sites / 30 parks / ~500,000 heat customers / DynoWiper+GPO+EDR block / LazyWiper via GPO from a network share / LSASS + Rubeus Diamond ticket + ntds.dit / Slack channel / Impacket over SSL VPN / Exchange-Teams-SharePoint ICS-document search / 'first publicly documented sabotage operation' / >20 Dream Job cases / CHF 60m / OtterCookie+BeaverTail memory-only + bespoke DPRK backdoor / 'no case reported of any other known actor using those specific samples' / NTC photovoltaic study / March 2026 Iran-linked medical-device factory-reset case with Swiss downstream customers. All 23 ATT&CK ids resolve active in the v19.2 pin and each maps to a behaviour the body describes in plain language. The management-summary-vs-chapter-1 tension is handled honestly in the sourcing_note and the run record ('auf einem hohen Niveau stabilisiert hat' vs 'ein Rückgang auf insgesamt 27'128'), and every borrowed-work attribution (CERT.PL, Unit 42, NTC) is placed with the right party."
