    discovery_trace: "first seen at: main-agent tasking correction (embargo lifted 2026-08-24T09:00Z) → checked https://www.bacs.admin.ch/de/medienmitteilungen (listing, empty until 09:00:18Z) → primary: BACS press release, URL https://www.bacs.admin.ch/de/newnsb/vzO9wG1V7K0D-m73EJw8W → pivot: full report PDF fetched via bridge, URL https://cms.news.admin.ch/fileservice/sdweb-docs-prod-nsbcch-files/files/2026/08/24/25a75eab-7e61-467e-aeeb-47a7329ad921.pdf (PDF text extraction failed in this sandbox — cryptography/_cffi_backend module broken for every available Python PDF library (pdfminer.six, pypdf); reporting from the press-release body instead, clearly marked as such)"
    summary: |
      BACS (Bundesamt für Cybersicherheit) published "Halbjahresbericht 2026/1" — the semi-annual Swiss cyber-threat-landscape report covering January-June 2026 — at 11:00 CEST / 09:00 UTC on 2026-08-24, accompanied by a press briefing led by BACS director Florian Schütz. This entry reports from the press-release body; the accompanying 24-page PDF was fetched (2.8 MB, valid PDF 1.7) but this sandbox's available Python PDF-text libraries (pdfminer.six, pypdf) both fail to import because the pre-installed `cryptography` package is missing its `_cffi_backend` binding — text extraction from the PDF itself was not possible this run.

      BACS received 27,128 voluntary incident reports and 200 mandatory reports under the critical-infrastructure notification duty (in force since 1 April 2025) for H1 2026. Among the mandatory CI reports, the public-administration sector (Verwaltungssektor) accounts for the largest single share at 19.4%, ahead of IT/telecom companies at 18.6% — the first time this pipeline has seen BACS name public administration as the top-reported CI sector rather than a runner-up. By attack type, hacking incidents dominate mandatory reports at roughly 26%, credential theft at 13.5%, and data exfiltration and DDoS attacks tied at 12.7% each. Ransomware reports "stagnated at 79" for the half — language BACS uses elsewhere in the release to describe fragmentation and diversification of ransomware families rather than a plateauing threat. A concrete, dated policy-effectiveness data point: the extension of the caller-ID labelling duty to mobile numbers on 1 July 2026 cut monthly reports of fraudulent calls impersonating authorities from a steady 400+/month (Jan-Jun 2026) to under 100 in July — the report's clearest causal claim tying a specific regulatory intervention to a measured fraud-volume drop. BACS also describes attackers "systematically" using AI to produce credible, individually tailored lure content, citing fake job and investment offers as the vehicle. The press release does not break out hacktivism/DDoS-against-Switzerland specifics beyond the 12.7% DDoS-report share, does not name any supply-chain/third-party compromise incident, and gives no half-on-half or year-on-year percentage change against H2/2025 or H1/2025 figures.
