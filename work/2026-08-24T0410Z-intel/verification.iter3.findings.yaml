  item: "entities/registry.yaml — incident:reliaquest-social-engineering-attempt-2026-08 (added by this run)"
  url_or_quote: "\"disclosed in its own account of 2026-08-23, which opens by denying circulating claims that it had been compromised or hit by ransomware\" (registry summary)"
  summary: "The iteration-2 F3 remediation removed the false 'opens with the denial' framing from the entry body, the entry's sourcing_note and the run record, but not from the registry record this run added — which still states the article 'opens by denying'. Independently re-verified this iteration: bridge-fetched https://reliaquest.com/blog/threat-spotlight-social-engineering-attempt-against-reliaquest-what-we-found (63,018 B raw), stripped it to 8,001 chars, and located 'Claims that ReliaQuest was compromised or targeted by ransomware are false.' at character 5,116 of 8,001 (~64%), immediately after the investigation-findings paragraph ('Our investigation, which included a complete audit of our control fidelity, device trust, on-network access ... no persistence was established.') and immediately before the industry-playbook sentence. The article's actual opening is 'On August 22, 2026, ReliaQuest was the target of a social engineering attack.' The registry summary is a published surface (entity pages / graph) and is now the only place in the store carrying the defect the last iteration fixed everywhere else. Fix: reword to match the entry, e.g. 'which sets out its investigation findings and then states that circulating claims of compromise or ransomware are false'."
- code: F4
  category: hallucinated-fact
  section: run-record
  item: "runs/2026-08-24/2026-08-24T0410Z-intel.md — notes body, 'Two entries carry a sourcing caveat' paragraph"
  url_or_quote: "\"The ReliaQuest entry covers a leak-site listing and a victim's own incident write-up that describe materially different events; no source establishes they are the same event, the connection between them is timing alone, and the entry asserts nothing more.\""
  summary: "The published run-record notes describe an entry that no longer exists in that form. After iteration 1's F4 remediation the ReliaQuest entry cites exactly one source (ReliaQuest's own write-up), carries no second source, and its sourcing_note states the opposite of this paragraph: 'Nothing about a leak-site listing, an extortion brand, screenshots or data samples is asserted here, because the only source cited would not bear it; the earlier draft of this entry did assert those specifics and they were removed.' The entry therefore does not 'cover a leak-site listing' at all, and there is no pair of events between which a timing connection could be asserted. Verified by reading the entry frontmatter (sources[] length 1, verification: single-source-victim) and body end-to-end this iteration. Secondary location, same root cause: frontmatter fetch_failures[id=databreaches-net].mitigation_applied still reads 'the aggregator was needed only to confirm the leak-site listing exists and is unverified, for which a second outlet substituted' with covered_anyway: true — defensible as a statement of what the run did at research time, but it describes coverage that appears in no published entry and should say so. Fix: rewrite the paragraph to name the single remaining caveat (the entry is the victim's own account of an attempt, and the claim it denies is neither described by the source nor by the entry)."
- code: F4
  category: hallucinated-fact
  section: trending-vulnerabilities
  item: "2026-08-24/cve-2026-18963-keycloak-red-hat-product-states-corrected"
  url_or_quote: "\"this is the second time in a month that reading a vendor's affected/fixed status out of prose rather than out of its structured product data has produced a wrong operational picture in this store — the structured field is the one to trust.\" (Defender takeaway); headline: \"this pipeline's earlier entry overstated the exposure\""
  summary: "The stated cause of the earlier error is contradicted by the entry it corrects, and no cited source establishes that the earlier reading was wrong rather than superseded. (a) The original entry (2026-08-19/cve-2026-18963-keycloak-reset-credentials-account-takeover) says in its own sourcing_note: 'The affected-and-fixed boundaries are transcribed from the advisory's structured package-state and affected-release data rather than its prose, which is what surfaced ... the JBoss EAP Expansion Pack row that is Affected with no erratum' — i.e. it read the structured data, which is exactly the practice this entry's takeaway prescribes, so 'reading ... out of prose' cannot be the cause of this instance. (b) Red Hat's own CSAF/VEX document for the CVE (fetched this iteration: https://access.redhat.com/security/data/csaf/v2/vex/2026/cve-2026-18963.json, 52,693 B) has initial_release_date 2026-08-17 and revision_history entries at 2026-08-20T18:59:38Z (version 2) and 2026-08-20T22:25:54Z (version 3) — both AFTER the original entry of 2026-08-19 — so a subsequent vendor revision of the Expansion Pack row is a live, uneliminated explanation, and nothing cited rules it out. The corrected product state itself is confirmed and correct: the Hydra security-data API (https://access.redhat.com/hydra/rest/securitydata/cve/CVE-2026-18963.json) returns exactly 11 affected_release rows (RHSA-2026:56519/56520/56523/56524, streams 26.4.15 and 26.6.6) and 2 package_state rows both 'Not affected', and the VEX flags carry component_not_present (Expansion Pack) and vulnerable_code_not_present (Single Sign-On 7), matching the entry's cves[] and body exactly; CVSS 9.1 and the Forgot-password mitigation are also confirmed on the page. Fix: keep the corrected product state, drop the prose-vs-structured causal claim, and state the vendor-revision possibility plainly (e.g. 'Red Hat's VEX document for this CVE was revised on 2026-08-20, after the original entry; no source establishes whether the Affected row was misread or subsequently changed'). The run record's notes repeat the same framing ('fixes a published error of this pipeline's own that overstated exposure') and should move with it."
