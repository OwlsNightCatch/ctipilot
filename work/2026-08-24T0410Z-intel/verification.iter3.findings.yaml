- code: F11
  category: editorial-advisory
  section: run-record
  item: "runs/2026-08-24/2026-08-24T0410Z-intel.md — notes body"
  url_or_quote: "\"The container stalled between preflight and the Phase 1 spawn ... the four research sub-agents did not begin until 08:54–08:55Z\"; \"That sub-agent was terminated about twelve minutes in\"; \"six of this run's nine entries are research-domain material the main agent worked from the coverage backlog\""
  summary: "The run-record notes body is a published surface and the style rule bars workflow-internal vocabulary there. A programmatic count of the body (frontmatter excluded) finds 15 occurrences of 'sub-agent' / 'main agent' / 'Phase N' / 'spawn', against 0 in the 2026-08-18, 08-19, 08-20 and 08-23 intel records and 0–6 in the weeklies — so this record is an outlier rather than the house style. The disclosure itself (a research domain with no sweep behind it) is exactly right and must stay; only the vocabulary needs to be reader-facing ('the research stage', 'the sweep for that domain did not run', 'worked from the coverage backlog and re-verified directly'). Advisory: the main agent may leave this."
- code: F11
  category: editorial-advisory
  section: annual-report
  item: "2026-08-24/bacs-halbjahresbericht-2026-1-poland-sabotage-dream-job — summary"
  url_or_quote: "\"a full anatomy of the 29 December 2025 coordinated sabotage of Polish energy assets — attributed by CERT.PL to Static Tundra\""
  summary: "The report attributes the attack INFRASTRUCTURE, not the incident: 'Eine öffentliche Zuordnung durch das polnische Computer Emergency Response Team (CERT) attribuiert die Angriffsinfrastruktur zu «Static Tundra», einem mutmasslich staatlichen Bedrohungsakteur (APT) aus Russland' (p. 14 of the fetched PDF, MD5 f085ff2341c9854023f890950b7f67fb, identical to this run's copy). BACS then extends it with its own hedge — 'Damit stellt der Vorfall in Polen die erste öffentlich dokumentierte Sabotageoperation dar, an der diese Gruppe offenbar beteiligt war' — which the entry body carries correctly ('BACS records this as the first publicly documented sabotage operation in which the group was apparently involved'). Only the frontmatter summary flattens infrastructure attribution into incident attribution. Advisory: one-clause fix ('CERT.PL attributes the attack infrastructure to Static Tundra'); the body is already right."
- code: F14
  category: quantifier-without-source
  section: active-threats
  item: "2026-08-24/silkparasite-dll-sideload-pairing-google-drive-c2 — summary"
  url_or_quote: "\"Entry in every documented case is DLL side-loading beside a legitimate signed application — Calibre, ABBYY FineReader, Quick Heal, Mp3tag and a Windows Defender component among the named hosts\""
  summary: "Bitdefender hedges exactly where the summary universalises. Fetched this iteration (https://www.bitdefender.com/en-us/blog/businessinsights/silkparasite-tracking-china-nexus-apt-across-central-asia, 196,128 B): 'The most consistent detection surface across the campaign is DLL sideloading' (also the entry's own evidence[] quote, verified verbatim) and 'Like most of the toolset, CookiETagRAT initiates by DLL sideloading' — 'most consistent' and 'most of the toolset', not every case. Two further facts on the page cut against 'every documented case': initial access is a document macro, not side-loading ('Initial access ran through malicious Microsoft Office documents, most likely delivered by spear-phishing email ... the document ran a macro that dropped a signed-application sideloading chain to disk'), and only six host/DLL pairs are named for seven families — NodeEdgeRAT has none, and GoginRAT 'reaches the host through DriveSilkRAT'. The entry body is correctly unquantified ('The consistent element across the whole cluster is the way it lands'), so only the summary needs the fix: 'the most consistent landing surface is DLL side-loading beside a legitimate signed application (six named host/DLL pairs)'."
- code: F14
  category: quantifier-without-source
  section: annual-report
  item: "2026-08-24/bacs-halbjahresbericht-2026-1-poland-sabotage-dream-job — body, second paragraph"
  url_or_quote: "\"Two declines are attributed rather than merely observed.\""
  summary: "The report attributes one decline to a cause, not two, and the paragraph then lists three declines. Fetched PDF text (p. 4): 'Der verringerte Meldeeingang widerspiegelt sich in mehreren Kategorien wie unter anderem bei «Werbung für Online-Anlagebetrug» (387, -89 %), bei CEO-Betrug (258, -57 %) oder auch bei «betrügerische Drohanrufe im Namen von Behörden» (3'817, -64 %). Bei Letzterem dürfte besonders die Verschärfung der Verordnung über Fernmeldedienste (FDV) hinsichtlich des Call-Spoofing zur positiven Entwicklung beigetragen haben, da diese Massnahmen wahrscheinlich bereits vor ihrem Inkrafttreten Wirkung zeigten.' Only 'Bei Letzterem' (the threatening calls) is given a cause; a full-text search for 'Anlagebetrug' returns a single hit — the figure itself, with no cause anywhere in the report — and the CEO-fraud decline is likewise uncaused. Every individual figure in the paragraph is correct (387/-89%, 258/-57%, 3,817/-64%); only the count of attributed declines is invented. Fix: 'One decline is attributed rather than merely observed' and move the other two figures into a plainly observational clause."
