- code: F3
  category: claim-not-supported
  section: summary
  item: "publica-pk-softech-supplier-malware-intrusion-data-outflow / summary"
  url_or_quote: "\"Tamedia reports that Akira holds about 100 GB and demands ransom, as Inside IT relays, and that the authorities now assume data on practically all current and former federal and federally affiliated staff left, as Netzwoche relays\""
  summary: "(low confidence) The iteration-3 relay-attribution finding is only half fixed: the clause still binds '100 GB' to 'as Inside IT relays'. Inside IT (https://www.inside-it.ch/datenleck-bei-publica-gefaehrdet-auch-sicherheitsbehoerden-20261020) says 'Die Gruppe habe die gestohlenen Daten zurückgehalten und fordere Lösegeld' and 'weit über 100'000' persons, with no volume; the volume is on the Tages-Anzeiger page only ('Die Hackergruppe Akira stahl rund hundert Gigabyte komprimierte Pensionskassendaten'). Say 'Tamedia reports that Akira holds about 100 GB, and Inside IT relays that it demands ransom'."
- code: F3
  category: claim-not-supported
  section: body
  item: "litellm-1-107-0-pypi-docker-credential-stealer-lookalike / Detection"
  url_or_quote: "\"an encrypted archive posted to a health-check path on a domain imitating the project's ([Socket, 2026-10-21](https://socket.dev/blog/litellm-compromise))\""
  summary: "(low confidence) Socket records only 'The archive is POSTed to hxxp://www[.]litellm[.]dev/healthcheck'; it never says the domain imitates the project's. Wiz ('This domain is attacker controlled, impersonating LiteLLM infrastructure') and Aikido ('this domain is attacker-controlled and is not affiliated with the legitimate LiteLLM project') carry it and are cited elsewhere on the entry. Add the Wiz or Aikido citation to the clause."
- code: F8
  category: needs-more-research
  section: body
  item: "cve-2026-76466-cisco-expressway-cluster-unauth-root-rce / Exposure, actions[0], Defender takeaway"
  url_or_quote: "\"A standalone Expressway is outside the advisory's vulnerable-product statement.\" ; action \"On every Cisco Expressway-C and Expressway-E that runs in a cluster, upgrade to X15.5.20\""
  summary: "The entry cites https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-exwy-hardening-FhcqBVcs, whose Vulnerable Products section reads 'These vulnerabilities affect Cisco Expressway-C and Cisco Expressway-E, both virtual and appliance versions, regardless of device configuration' (eight CVEs, worst 8.6, AV:N/PR:N, fixed in the same X15.5.20, X14 and earlier migrate). The body mentions that release only as 'also carries Expressway's own hardening fixes', so a reader with a standalone Expressway-E on X15.5.3 or earlier reads 'not affected' and the action and takeaway limit the upgrade to clustered units. State that every Expressway on X15.5.3 or earlier, clustered or not, still needs X15.5.20 for the hardening fixes."
- code: F8
  category: needs-more-research
  section: body
  item: "cve-2026-110264-gitlab-org-mode-renderer-unauth-rce / Detection"
  url_or_quote: "\"A successful exploit is quiet and does not reliably crash, so the absence of a hit never clears an instance\""
  summary: "The cited GitLab detection (https://gitlab.com/gitlab-security-oss/tldr/-/raw/main/Detections/platforms/GitLab/Vulnerability%20Detections/org_mode_render_error_burst.md, Investigation step) gives the host-level code-execution check: 'Hunt for code execution: unexpected child processes of Puma, new files owned by `git` in `/tmp`, outbound connections, changed crontabs or SSH keys for the `git` user'. The entry stops at log signatures and 'treat the secrets as at risk' and omits the one check that answers 'was this instance already hit'. Add it to Detection."
- code: F8
  category: needs-more-research
  section: body
  item: "k0t-fortiweb-fortigate-globalprotect-edge-device-campaign / actions[0] and Defender takeaway"
  url_or_quote: "\"On every FortiGate, enable private-data-encryption with an operator-defined key\""
  summary: "(low confidence) The now-cited Fortinet page https://fortiguard.fortinet.com/psirt/FG-IR-19-007 carries an enablement caveat the headline action omits: 'Enabling private-data-encryption on FortiGates that are centrally managed by a FortiManager or are in High Availability mode may lead to some bugs including an install errors on the FortiManager side and split-brain. This issue is fixed in FortiManager versions 6.2.7 and above and in FortiGate versions 6.2.6, 6.4.4, 6.6.0 and above.' Name it, or state the builds the action is safe on."
- code: F9
  category: surface-contradiction
  section: body
  item: "k0t-fortiweb-fortigate-globalprotect-edge-device-campaign / summary, actions[0], Exposure"
  url_or_quote: "\"decrypts its stored LDAP, Active Directory and administrator secrets offline with the default FortiOS key\" ; \"every FortiGate is exposed to the offline decryption step once its configuration has been downloaded\""
  summary: "(low confidence) Group-IB (cited) says the tool recovers 'LDAP/Active Directory bound credentials, administrator and local-user credentials'. Fortinet's per-CVE page FG-IR-19-007 (cited on the same Exposure clause) says the hard-coded key 'impacts all credential data of type \"ENC\" in FortiOS CLI configuration except the administrator's password' and 'FIPS-CC devices are not impacted as the encryption method is overridden'. The entry picks Group-IB silently on the administrator secrets and says 'every FortiGate'. Add a Contradiction line or scope both statements."
