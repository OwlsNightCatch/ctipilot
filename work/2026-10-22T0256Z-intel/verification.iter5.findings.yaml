- code: F3
  category: claim-not-supported
  section: litellm-1-107-0-pypi-docker-credential-stealer-lookalike
  item: "Defender takeaway (claim 5ab86bc597)"
  url_or_quote: "rotate credentials from a clean machine, because uninstalling reverses nothing and stolen cloud credentials were in use within hours; rebuild from a reviewed artifact, pin images by digest and move to 1.106.2 or an explicit earlier version as the maintainers advise ([LiteLLM, 2026-10-21](https://docs.litellm.ai/blog/security-incident-oct-21-2026))"
  summary: "(low confidence) the only citation is the maintainers' post, which says \"please pin your version to 1.106.2 or any explicit version published prior to now\" and \"Rebuilding images and venvs from scratch is better\"; it carries no digest-pinning advice (Socket: \"pin container digests during recovery\") and no clean-machine advice (Socket: \"from a clean environment\"), and \"stolen cloud credentials were in use within hours\" is Wiz's \"starting approximately 4.5 hours post-exfiltration\", not on the cited page. \"as the maintainers advise\" attributes Socket's digest advice to the maintainers. Fix: add the Socket and Wiz citations to the clauses they carry and limit \"as the maintainers advise\" to the 1.106.2 pin."
- code: F3
  category: claim-not-supported
  section: publica-pk-softech-supplier-malware-intrusion-data-outflow
  item: "main analysis, paragraph 1, Akira sentence (claim 65ed3d92d0)"
  url_or_quote: "Tamedia's Tages-Anzeiger reports, and Inside IT relays, that the Akira ransomware group holds about 100 GB of compressed pension data on well over 100,000 current and former federal employees, including staff of the security authorities, and demands ransom"
  summary: "(low confidence) same attribution defect iteration 4 raised for the summary, left in the body: the Inside IT article (fetched, dated 2026-10-20) carries Akira, the ransom demand, \"weit über 100'000\" persons and security-authority staff but no data volume; \"rund hundert Gigabyte komprimierte Pensionskassendaten\" is only on the Tages-Anzeiger page. Fix: \"Tamedia's Tages-Anzeiger reports that Akira holds about 100 GB of compressed pension data ..., and Inside IT relays the actor, the demand and the number of persons\"."
- code: F4
  category: hallucinated-fact
  section: cve-2026-76466-cisco-expressway-cluster-unauth-root-rce
  item: "Exposure (claim c386ad4c41) and Detection (claim 40ad38c5b5)"
  url_or_quote: "the reachable interface is the clustering database service, and Cisco does not say on which network it listens"
  summary: "(low confidence) Cisco's advisory says \"A vulnerability in the database service feature of Cisco Expressway Series\" and, as a separate cause, \"insufficient validation of client certificates when the TLS Verify Mode is set to Enabled for clustering\"; it never names the service as the clustering database service, and the Detection line builds a telemetry hunt on that identification. Fix: say \"the database service\" (Cisco's wording), noting that Cisco ties the flaw to cluster configuration."
