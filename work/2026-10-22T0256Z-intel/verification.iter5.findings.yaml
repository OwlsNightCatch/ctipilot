  summary: "advisory: the maintainers' post says \"After the prior incident in March, we meaningfully hardened our CI release pipeline\" and the store already covers the March LiteLLM/Trivy package compromise (2026-08-15/trivy-not-litellm-behind-2500-org-credential-collection); the entry neither says this is the second release-pipeline compromise of the project in 2026 nor links that coverage. No cited source attributes the October release to TeamPCP, so no attribution is requested; a one-clause context sentence and a references[] link would help a reader."
