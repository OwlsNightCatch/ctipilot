  item: "cross-entry supersession of an action item (low confidence)"
  url_or_quote: "\"Upgrade every self-managed GitLab CE and EE instance on 19.2, 19.3 or 19.4 to 19.2.8, 19.3.5 or 19.4.2 now\""
  summary: "(low confidence) The new CVE-2026-110264 entry states that 19.4.2, 19.3.5 and 19.2.8 are still affected. The older CI-regex entry (priority high, updated 2026-10-14) still tells readers to upgrade to exactly those builds 'now'. A reader on a multi-day window who works the older action stops one release short. An `improvement` record on the older entry pointing at the 19.5.1 / 19.4.3 / 19.3.6 / 19.2.9 builds would remove the conflict; not blocking."
