- code: F3
  category: claim-not-supported
  section: "connectwise-cloud-backup-skykick-m365-app-credential-abuse, ## Update — 2026-10-22T03:46:23Z"
  item: "claim 1cca36d2da: ConnectWise Update, Microsoft paragraph"
  url_or_quote: "\"from the same network range and including an address ConnectWise published on 2026-10-16\" [cited to https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/]"
  summary: "Date drift on the IP address. Microsoft says only: 'An advisory from the affected cloud backup vendor posted on October 16 shared later additional indicators with one IP address matching exactly the 144.172.64[.]99 infrastructure' (the advisory was posted 16 Oct; the indicator came later). ConnectWise's own archived advisory lists '144.172.64[.]99 **NEW**' under 'Additional IP Indicators' in the update of Sunday 2026-10-18 18:45 UTC, and Huntress's IOC table says 'part of its update on 10/18 at 18:45 UTC'. The address was published on 2026-10-18, not 2026-10-16. Fix: 'an address ConnectWise added to its advisory on 2026-10-18' (cite ConnectWise or Huntress for the date), or drop the date."
- code: F3
  category: claim-not-supported
  section: "php-critical-release-pre-announced-cve-2026-109618-109619, ## Update — 2026-10-22T03:45:26Z"
  item: "claim ed4e95aad1: Lodur description (low confidence)"
  url_or_quote: "\"Lodur, the platform many Swiss fire brigades use to manage personnel data and alarm groups\" [cited to nau.ch Keystone-SDA and RTS]"
  summary: "(low confidence) Neither cited page says Lodur manages 'personnel data'. nau.ch: 'die Plattform Lodur, die für die Verwaltung zahlreicher Schweizer Feuerwehren genutzt wird' and users 'weder auf die in Lodur gespeicherten Daten zugreifen noch die Änderungen an den Alarmgruppen vornehmen'; RTS: 'La plateforme LODUR, utilisée pour la gestion de nombreux corps de sapeurs-pompiers suisses'. Fix: 'to manage fire brigades, including their alarm groups' (or 'stored data')."
- code: F3
  category: claim-not-supported
  section: "cve-2026-76466-cisco-expressway-cluster-unauth-root-rce, body"
  item: "claim d46d979134: Meraki MX automatic update (low confidence)"
  url_or_quote: "\"while Meraki MX and Cisco's cloud firewall services were updated automatically on 2026-10-21\" [cited to cisco-sa-hardening-snort3-ybgmhTQe]"
  summary: "(low confidence) The advisory qualifies it: 'As of October 21, 2026, all Meraki models listed in this advisory that are online and connected to the Cisco Meraki Dashboard have been automatically updated with the Snort 3 package.' The entry drops 'that are online and connected'; a Meraki MX that was offline or disconnected from the Dashboard is not covered. Fix: add the qualifier."
- code: F14
  category: quantifier-without-source
  section: "php-critical-release-pre-announced-cve-2026-109618-109619, summary, body, Update section, record summary"
  item: "claims b45ff5e5cc, 9cab696807, 0e17e8a44d, e06c667e45: 'one unsuccessful web-shell attempt' (low confidence)"
  url_or_quote: "\"one unsuccessful attempt to plant a web shell through a session file\" / \"one unsuccessful web-shell attempt\" [cited to https://www.vulncheck.com/blog/php2shell-vulnerabilities]"
  summary: "(low confidence) VulnCheck writes 'We've also observed at least one attempted exploit from a China-based IP which tried to (unsuccessfully) drop a webshell via a server-side session file.' The entry states the count as exactly one (its timeline table does list one exploitation row, but the text hedges with 'at least'). Fix: 'at least one' or 'an unsuccessful attempt'."
- code: F4
  category: hallucinated-fact
  section: "run record, Verification & coverage notes, Published (6 new), GitLab sentence"
  item: "runs/2026-10-22/2026-10-22T0256Z-intel.md (low confidence)"
  url_or_quote: "\"GitLab ships detections and reports no exploitation or public proof of concept\""
  summary: "(low confidence) The same wording was fixed on the entry in this round (now 'GitLab does not state that the flaw is exploited, and its patch notes and detection pages mention no public proof of concept'), but the run-record sentence still says GitLab 'reports no exploitation or public proof of concept'. The patch notes and both detection pages are silent on exploitation status and on a proof of concept (no 'proof', 'PoC', 'exploited' or 'in the wild' text; the detection page says 'Treat a hit as a probable exploitation attempt'). Align it with the entry: 'GitLab does not state exploitation and its pages mention no public proof of concept'."
