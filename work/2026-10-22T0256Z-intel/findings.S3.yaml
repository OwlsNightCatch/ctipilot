      - { quote: "the threat actor deleted safety policies at the organization level, such as `iam.allowedPolicyMemberDomains`", attribution: "Wiz CIRT", source_url: "https://www.wiz.io/blog/from-phishing-to-llmjacking" }
      - { quote: "Within 24 to 48 hours of initial access, victim organizations experienced unexpected charges reaching tens to hundreds of thousands of dollars in unauthorized Gemini API usage.", attribution: "Wiz CIRT", source_url: "https://www.wiz.io/blog/from-phishing-to-llmjacking" }
    extended_notes: |
      Exposure: Google Cloud organizations where administrators can be reached by search-ad phishing and where the org policy limiting IAM members to company domains is the only barrier against external billing-account members; Workspace login-event ingestion is needed to see the first malicious login. Detection concept (telemetry classes): Google Workspace login events with suspicious-login flags and immediate re-authentication, GCP Admin Activity audit logs for SetOrgPolicy changes on allowedPolicyMemberDomains, IAM policy changes on billing accounts (external-domain principals, billing admin grants, admin demotions), EnableService for the Gemini API plus service-account and key creation in dormant projects, and billing cost-anomaly alerts. Benign lookalike: legitimate partners or finance staff with external-domain billing roles, discriminated by change-ticket correlation and by the combination of org-policy deletion with Gemini enablement. Hardening: spend caps and budget alerts, restrict who may change org policy and billing IAM, phishing-resistant MFA for console administrators, blocking or warning on sponsored results for admin-console searches. IOCs (phishing domains, one IP) omitted.

