  - title: "Hijacked Tor exit relays redirected SSH to interception servers that captured passwords and installed Ebury 1.8.3, a version outside ESET's public detection indicators"
    sources:
      - { url: "https://thehackernews.com/2026/10/attackers-hijacked-over-300-tor-exit.html", publisher: "The Hacker News", date: "2026-10-21", role: "corroborating" }
      - { url: "https://kaba.cx/posts/20261020_Tor/", publisher: "kaba (independent researcher)", date: "2026-10-20", role: "primary" }
      - { url: "https://lists.torproject.org/mailman3/hyperkitty/list/tor-relays@lists.torproject.org/thread/QHRD6YOX6RZRDR7NCHNDO7GLCEA6VFM6/", publisher: "tor-relays mailing list (relay operator post-mortem)", date: "2026-10-07", role: "primary" }
      - { url: "https://lists.torproject.org/mailman3/hyperkitty/list/tor-relays@lists.torproject.org/thread/RXWGWYYYKBDEBNXC2C3NYIQ2HHHWXL7O/", publisher: "tor-relays mailing list (Marc-Etienne M. Léveillé, ESET Ebury author)", date: "2026-10-08", role: "corroborating" }
    discovery_trace: "first seen at: hackernews RSS feed, URL https://feeds.feedburner.com/TheHackersNews (item 'Attackers Hijacked Over 300 Tor Exit Relays to Intercept SSH Connections', 2026-10-21) → article https://thehackernews.com/2026/10/attackers-hijacked-over-300-tor-exit.html → primaries linked there: https://kaba.cx/posts/20261020_Tor/ and the tor-relays threads https://lists.torproject.org/mailman3/hyperkitty/list/tor-relays@lists.torproject.org/thread/QHRD6YOX6RZRDR7NCHNDO7GLCEA6VFM6/ and https://lists.torproject.org/mailman3/hyperkitty/list/tor-relays@lists.torproject.org/thread/RXWGWYYYKBDEBNXC2C3NYIQ2HHHWXL7O/ (the Tor Project's own notice, thread WOHPLKCSHYXFTBRZXDENDKJZMBMPLMG5, was fetched but is not cited)"
    summary: |
      Between 2026-10-01 and 05 an attacker changed the exit policies of more than 300 Tor exit relays (the directory-data analysis counts 377 relays run by 59 operators) so that port 22 was allowed, redirecting SSH through those exits to 12 interception servers that presented their own host key, relayed the session to the real server, captured the typed password and then logged in separately to run a base64-encoded Perl installer that put Ebury, an OpenSSH backdoor and credential stealer, on the target. Only users who connected with a password over Tor and accepted an unfamiliar or changed host key were exposed; key-based logins cannot be relayed this way. The Tor Project's directory authorities flagged the relays BadExit on 2026-10-04 and none remained in the consensus by 2026-10-05; the researcher kaba found the redirection on 2026-10-02. One operator's post-mortem shows how the relays were reached: a first-try password login on 2026-08-28 to a management server (one password reused for SSH, sudo and a backup passphrase, stored in plaintext, with SSH password authentication enabled), root within minutes and Ebury 1.8.3 installed, then a second server about an hour later; the Ebury login leaves no login record, the implant is a single setuid library whose symlink replaces a keyutils library without failing package checks, and it survived a reboot. ESET's Ebury author (now independent) says 1.8.3 has been around since at least June 2026, that ESET's published detection script did not cover it until he posted an updated copy, that stolen credentials are held in memory and pulled over daily SSH connections, and that Ebury spiders through known_hosts. How the other 58 operators were compromised, and who is behind it, is unknown; 71 of 101 relays at one hosting provider's network switched policy, which the analysis flags as an open question about provider-level compromise.
    region_nexus: "global; Linux SSH servers (any), particularly VPS and hosting-provider management planes"
    primary_sector_nexus: "indirect (Linux server fleets; no Swiss public-sector impact reported; one relay host was merely named 'Switzerland2')"
    sector: "cross-sector (Linux infrastructure; Tor relay operators)"
    cves: []
    techniques: [T1557, T1021.004, T1078, T1014]
    affected_products: ["Ebury (OpenSSH backdoor, version 1.8.3)", "OpenSSH servers on Linux", "Tor exit relays"]
    entity_keys: []
    new_entities:
      - { key: "malware:ebury", type: malware, name: "Ebury", aliases: [], summary: "OpenSSH backdoor and credential stealer for Linux active since 2009 (ESET); version 1.8.3 was found on Tor relay operators' servers in October 2026 and, per its ESET author, has existed since at least June 2026 and is newer than ESET's published indicators (tor-relays list, 2026-10-07/08)." }
      - { key: "incident:tor-exit-relay-ssh-interception-ebury-2026-10", type: incident, name: "Tor exit-relay SSH interception and Ebury 1.8.3 compromise (2026-10)", aliases: [], summary: "Between 2026-10-01 and 05 an unidentified actor reconfigured over 300 Tor exit relays on compromised Linux hosts to redirect SSH to interception servers that captured passwords and installed Ebury; the relays were flagged BadExit on 2026-10-04 (kaba, tor-relays list, The Hacker News, 2026-10-07 to 21)." }
