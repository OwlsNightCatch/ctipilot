  - title: "Microsoft assesses that Storm-0940, a China-state aligned actor using the ARTEX agentic-AI framework, was behind the ConnectWise Cloud Backup application-credential abuse"
    sources:
      - { url: "https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/", publisher: "Microsoft Threat Intelligence", date: "2026-10-21", role: "primary" }
      - { url: "https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/", publisher: "Expel", date: "2026-10-21", role: "corroborating" }
    discovery_trace: "first seen at: cyberscoop RSS feed, URL https://cyberscoop.com/feed/ (item title 'Microsoft pins ConnectWise supply-chain attack to China-state aligned threat group', article page not fetched) → primary: Microsoft Security Blog via `msft-secblog recent 15`, URL https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/ → independent analysis: Expel via RSS https://expel.com/blog/rss.xml, URL https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/"
    summary: |
      Microsoft Threat Intelligence assesses that Storm-0940, a China-state aligned actor, was responsible for the ConnectWise Cloud Backup (formerly SkyKick) compromise; the existing entry records that the actor was not yet public. Microsoft says that after the actor took control of several ConnectWise cloud application identities, AI agents acting for it kept signing in to customer Microsoft 365 tenants as those applications, without an interactive user sign-in, and in multiple tenants went on to Microsoft Graph reconnaissance, application-credential changes and changes to identities, groups and privileged roles; it counts attempted sign-ins against more than 2,250 tenants at up to 2,900 attempts per minute. It links the activity to an automated cross-tenant password spray of 2026-10-10 to 14 (327 accounts at eight organizations, more than 151,000 failed logons, no successful authentication seen) through the same network range, one address of which ConnectWise itself published on 2026-10-16. Microsoft warns that the credential changes can persist as a backdoor after the vendor application is remediated, and asks tenants to review service-principal sign-ins and Graph activity from at least 2026-10-15 (back to 2026-10-01 where logs exist) and the Entra audit trail for credential additions, app-role and privileged-role assignments, consents and owner changes. Expel, which analysed the activity separately, adds that ConnectWise's fix leaves secrets planted on other apps in place, that Graph directory reads leave no Entra audit record (so a clean audit log is not proof of no access), and that Huntress has not tied its Global Administrator self-grant observation to the same operator as the Storm-0940 sign-ins. The attribution is Microsoft's assessment from its own telemetry; Expel relays it and no cited source confirms it independently.
    region_nexus: "global; Microsoft 365 / Entra tenants of any ConnectWise or SkyKick customer, which includes MSP-managed public-sector tenants"
    primary_sector_nexus: "indirect (supply-chain access into customer tenants; government is among the sectors Microsoft lists for Storm-0940's wider ARTEX targeting)"
    sector: "technology (MSP / backup vendor) with cross-sector downstream tenants"
    cves: []
    techniques: [T1195, T1078.004, T1098.003, T1098.001, T1528, T1110.003, T1595, T1087.004, T1580]
    affected_products: ["ConnectWise Cloud Backup", "ConnectWise Cloud Management", "SkyKick Partner Portal", "Microsoft Entra ID", "Microsoft Graph"]
    entity_keys: ["incident:connectwise-cloud-backup-skykick-app-credential-abuse-2026-10", "product:connectwise-cloud-backup", "product:connectwise-cloud-management", "product:microsoft-entra-id"]
    new_entities:
