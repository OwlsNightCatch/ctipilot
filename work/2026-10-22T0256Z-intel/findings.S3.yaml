    extended_notes: |
      Delta for the existing entry: (1) actor and tooling attribution (Microsoft only); (2) scale of sign-in attempts and the earlier 10-10 to 10-14 password-spray precursor from the same range (precursor produced no successful authentication per Microsoft); (3) review horizon now 2026-10-15, with 2026-10-01 for service-principal sign-ins; (4) the Entra audit gap for Graph directory reads. Microsoft names four application IDs in its profile (Cloud Backup, ConnectWise - MS Teams, ConnectWise - MS Graph, SkyKick Partner Portal), Expel's table lists eight, and ConnectWise disabled seven application identities, so inventory by application ID from ConnectWise's own list rather than from one vendor's table. Detection concept: Entra service-principal sign-in logs and MicrosoftGraphActivityLogs for the vendor apps from unfamiliar sources, Entra audit for the application adding credentials to other applications or assigning itself a directory role; Microsoft's alert names include 'Application self-assigned Global Administrator role' and 'Unusual Microsoft Graph activity associated with Compromised ConnectWise Application'. A Python user-agent on a vendor app is only supporting evidence (Expel/Huntress: the genuine ConnectWise apps call Graph with kiota-dotnet). The companion ARTEX/Storm-0940 campaign finding is item 2; the main agent may fold item 2 into this update or keep it as a separate threat entry referencing this one.

