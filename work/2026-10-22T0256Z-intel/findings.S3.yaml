  - title: "LiteLLM 1.107.0 on PyPI and in the official Docker images carried a Python start-up credential stealer and an hourly remote-code loader; the release was built from a look-alike GitHub repository"
    sources:
      - { url: "https://www.stepsecurity.io/blog/litellm-1-107-0-compromised-pypi-backdoored-wheels-credential-stealer", publisher: "StepSecurity", date: "2026-10-21", role: "primary" }
