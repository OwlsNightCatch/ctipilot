    summary: |
      Huntress investigated at least three customer incidents in which the top sponsored Google result for 'amazon business' led to a fake Amazon login hosted on Google Sites and a fake CAPTCHA that copies a command to the clipboard and instructs the user to paste it into the Windows Run dialog; macOS visitors received a curl-based alternative. The pasted command, padded so the Run box appears to show only 'push Enter', executes the built-in finger.exe against an attacker-controlled account whose .plan file, pushed beyond a console screen by 68 carriage returns, holds a script; finger uses plaintext TCP 79, which most networks do not block because it is unused. The script downloads an IronPython distribution from a public release page, saves it under a .pdf name, unpacks it with the built-in tar and runs an obfuscated Python stager (XOR plus a Cyrillic-letter substitution of Base64) that loads a Doina loader; Doina fetches a portable Node.js runtime into a ProgramData folder, and the Node module decrypts and injects Lumma Stealer through process hollowing, beaconing over HTTPS then WebSocket, while a pirated NetSupport RMM client is installed under ProgramData and talks to an IP address on TCP 725. Huntress notes that paid-ad clicks carry an aclk path and gclid parameter that proxy logs and browser history can use to rebuild the ad-to-payload chain, and that disabling the Run dialog (its Attack Reduction feature) closes the most common ClickFix entry for users who do not need it, though attackers also use PowerShell, cmd and the Explorer address bar.
