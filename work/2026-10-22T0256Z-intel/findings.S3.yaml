  - title: "Cisco Talos: attackers use trusted platforms' own message pipelines as the delivery channel, via Staples and Dell order notifications, list-bombing sign-up forms and bounce messages that carry the lure"
    sources:
      - { url: "https://blog.talosintelligence.com/parasitizing-trust-how-legitimate-infrastructure-becomes-a-delivery-pipeline-for-attackers/", publisher: "Cisco Talos", date: "2026-10-21", role: "primary" }
    discovery_trace: "first seen at: talos RSS feed, URL https://blog.talosintelligence.com/rss/ (item 'Parasitizing trust: How legitimate infrastructure becomes a delivery pipeline for attackers', 2026-10-21) → primary (no pivot needed): https://blog.talosintelligence.com/parasitizing-trust-how-legitimate-infrastructure-becomes-a-delivery-pipeline-for-attackers/"
    summary: |
      Cisco Talos reports it has seen abuse of more than 25 legitimate platforms in the past year as proxies for malicious content, and analyses three variants that pass SPF, DKIM and DMARC because the outer message is genuine. In two order-notification campaigns (about 1,400 messages) abusing Staples and Dell transactional email, the attacker-supplied phone number and 'helpline' text sat in the shipping and billing fields of a real order confirmation for an expensive purchase, aiming to move the recipient to a phone call (callback phishing) rather than a link. In list bombing, attackers place a hostile string, such as a cryptocurrency lure, in unvalidated name, company or title fields of public registration or project-naming forms so that the platform's own welcome or verification emails deliver it. In bounce abuse, a delivery-status notification or non-delivery report wraps attacker-controlled content, for example a WeTransfer-themed lure inside a mail-system notice, either through forged-sender backscatter or through an authenticated or compromised sending context. Talos's defender guidance is to inspect the fully rendered message and nested MIME content, to treat sender trust and content trust as separate signals, to parse and scan DSN containers recursively, and for platform owners to validate user-controlled values before they are rendered into email templates.
