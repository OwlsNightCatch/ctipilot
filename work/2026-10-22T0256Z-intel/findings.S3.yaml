    extended_notes: |
      Detection concept (telemetry classes): cross-platform correlation of identity-provider administrator-API activity, cloud audit logs (token creation, SSM SendCommand, new IAM users assuming the organization account-access role), Kubernetes audit logs (new cluster-admin bindings, service-account token minting) and CI/CD audit trails; resource-name hunts for pentest-, probe, recon, redteam, exfil prefixes with numeric task IDs and -b/-c retry suffixes; outbound requests to request-catcher webhook services from runners and pods. Benign lookalike: authorised red-team and pentest tooling uses the same naming, discriminated by a change record, by the scoped source addresses and by tempo (agents run hundreds of actions per hour round the clock). Hardening levers named by Wiz: unified retention-consistent logging, strict trust boundaries between staging and production and between CI/CD and every environment, service accounts that cannot mint tokens for arbitrary identities, rotation of all credentials on compromised resources rather than tracing which were read, and continuous external attack-surface scanning for developer tools such as Kafka UI. The store's ReliaQuest (2026-10-09) and CL-UNK-1211 (2026-10-16) entries cover different intrusions. No IOCs carried.

