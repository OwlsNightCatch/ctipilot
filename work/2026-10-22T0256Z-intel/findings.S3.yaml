      - { url: "https://thehackernews.com/2026/10/litellm-compromised-in-supply-chain.html", publisher: "The Hacker News", date: "2026-10-21", role: "corroborating" }
    discovery_trace: "first seen at: hackernews RSS feed, URL https://feeds.feedburner.com/TheHackersNews (item 'LiteLLM Compromised in Supply Chain Attack Delivering Credential Stealer and Backdoor', 2026-10-21) → article https://thehackernews.com/2026/10/litellm-compromised-in-supply-chain.html → primaries named there: SafeDep https://safedep.io/litellm-pypi-compromise-credential-stealer-backdoor/ and StepSecurity https://www.stepsecurity.io/blog/litellm-1-107-0-compromised-pypi-backdoored-wheels-credential-stealer → vendor-side: LiteLLM issue https://github.com/BerriAI/litellm/issues/47826 (Socket and Upwind posts named by THN were not fetched)"
    summary: |
      On 2026-10-21 LiteLLM 1.107.0 was published to PyPI (seven platform wheels; the source distribution carries only a tampered build setting) and as container images on GHCR and Docker Hub (the tag v1.107.0 plus latest, main-latest and main-stable for roughly three hours from about 11:48 UTC), each with a credential stealer and a remote-code loader. The payload sits in site-packages as a .pth file that imports the stealer plus a sitecustomize.py daemon, so both run on every Python start on the host, even when litellm is never imported. The stealer collects SSH keys, cloud and Kubernetes credentials, browser passwords, CI/CD secrets, the environment of every readable process, the configuration of more than 20 AI coding tools and, on a LiteLLM proxy, the provider API keys stored in its database, then posts an encrypted bundle to a look-alike litellm domain; the daemon polls a GitHub dead drop hourly for a server address and runs whatever Python it serves. The v1.107.0 git tag is clean: StepSecurity reports the release was built by BerriAI's own release workflow from a look-alike GitHub repository (hyphenated organization name) with ten extra commits, and LiteLLM says the actions were taken through three engineers' GitHub accounts, apparently with stolen GitHub CLI OAuth tokens, one account triggering the release run and another approving it; how the tokens were obtained is not yet known. Versions 1.106.2 and the 1.107.0 release candidates are clean; PyPI removed 1.107.0 and BerriAI removed the infected image tags the same afternoon (StepSecurity records confirmation at 14:32 UTC, while LiteLLM's issue marks the tags as yanked at 17:13 UTC). StepSecurity notes this is the second LiteLLM PyPI compromise this year. Every credential reachable from a host or container that installed or started 1.107.0 must be treated as stolen.
    region_nexus: "global; any Python environment, CI job or AI gateway that installed litellm 1.107.0 or pulled the image tags"
    primary_sector_nexus: "indirect (public-sector AI gateways and developer workstations that use LiteLLM)"
    sector: "technology / cross-sector"
    cves: []
    techniques: [T1195.002, T1546.018, T1059.006, T1552.001, T1552.004, T1552.005, T1555.003, T1102.001, T1041, T1119]
    affected_products: ["LiteLLM (PyPI litellm 1.107.0)", "LiteLLM Docker images (ghcr.io/berriai/litellm, litellm-database, litellm-non_root, docker.io/litellm/litellm)", "PyPI"]
    entity_keys: ["product:litellm", "product:litellm-proxy", "product:berriai-litellm"]
    new_entities:
      - { key: "incident:litellm-1-107-0-pypi-docker-compromise-2026-10", type: incident, name: "LiteLLM 1.107.0 PyPI and Docker image compromise (2026-10)", aliases: [], summary: "On 2026-10-21 LiteLLM 1.107.0 wheels on PyPI and the v1.107.0, latest, main-latest and main-stable Docker image tags carried a .pth credential stealer and a sitecustomize.py remote-code loader, built from a look-alike GitHub repository through BerriAI's release workflow; LiteLLM attributes the release actions to three engineers' GitHub accounts, apparently via stolen GitHub CLI OAuth tokens (StepSecurity, SafeDep, LiteLLM issue #47826, 2026-10-21)." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - { quote: "published to PyPI with malware in every one of its compiled wheels, and the same payload shipped in the official LiteLLM Docker images.", attribution: "StepSecurity", source_url: "https://www.stepsecurity.io/blog/litellm-1-107-0-compromised-pypi-backdoored-wheels-credential-stealer" }
      - { quote: "The release was built from a lookalike GitHub repository", attribution: "StepSecurity", source_url: "https://www.stepsecurity.io/blog/litellm-1-107-0-compromised-pypi-backdoored-wheels-credential-stealer" }
      - { quote: "Versions 1.106.2, 1.107.0rc1, and 1.107.0rc2 are clean.", attribution: "SafeDep", source_url: "https://safedep.io/litellm-pypi-compromise-credential-stealer-backdoor/" }
      - { quote: "We have identified that the malicious actions were taken through three engineers' GitHub accounts, appearing to be by way of stolen GitHub CLI OAuth tokens,", attribution: "LiteLLM (director of security Oliver Jensen, as quoted by The Hacker News)", source_url: "https://thehackernews.com/2026/10/litellm-compromised-in-supply-chain.html" }
    extended_notes: |
      Likely overlap with S1 / S4 returns (supply-chain incident, no CVE); the main agent dedups. Exposure: `pip show litellm` / lockfiles / SBOMs for 1.107.0 (unpinned `litellm>=` constraints and fresh installs on 2026-10-21 between about 11:40 UTC and the PyPI removal picked it up; proxies tracking latest or main-stable pulled the image on next pull or restart); the clean pin is 1.106.2 by digest. Hunt (post-install compromise check): presence of cook.pth, cook.py and sitecustomize.py at the root of site-packages, a detached Python process holding a remote_code_loader lock file in /tmp, an once-per-host marker file in /tmp, outbound connections from build runners or hosts to a look-alike litellm domain or to raw.githubusercontent.com from jobs that install LiteLLM (StepSecurity: any call to the look-alike domain from a runner is a strong signal the stealer ran); rotate every secret the host or any of its processes could read, including every provider API key in the LiteLLM proxy database. Detection concept: Python interpreter start-up hooks (.pth import lines, sitecustomize) as persistence in package-install telemetry; software-composition scanning that compares sdist, wheel and git tag. Root-cause nuance: StepSecurity reads the build provenance (BerriAI/project-releaser workflow, source = hyphenated look-alike repository), SafeDep suspects a compromised maintainer or bot credential or a private branch, and LiteLLM states stolen GitHub CLI OAuth tokens used for trigger-and-approve; these are consistent but only BerriAI's pipeline logs can settle it. Registry note: three LiteLLM product keys exist (product:litellm, product:litellm-proxy, product:berriai-litellm); the entry should use one canonical key. CVE id: none assigned.

