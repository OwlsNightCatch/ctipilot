  - title: "ARTEX, an open-source multi-agent LLM penetration-testing framework, now drives a China-state aligned actor's machine-speed password spraying and OAuth-app abuse against hundreds of organizations, with privileged cloud access in under three hours in some cases"
    sources:
      - { url: "https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/", publisher: "Microsoft Threat Intelligence", date: "2026-10-21", role: "primary" }
      - { url: "https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/", publisher: "Expel", date: "2026-10-21", role: "primary" }
      - { url: "https://www.crowdstrike.com/en-us/blog/unknown-threat-actor-uses-artex-to-target-south-korean-finance/", publisher: "CrowdStrike Counter Adversary Operations", date: "2026-10-07", role: "corroborating" }
      - { url: "https://www.recordedfuture.com/blog/tag-217-artex-south-korean-banks", publisher: "Recorded Future Insikt Group", date: "2026-10-16", role: "corroborating" }
    discovery_trace: "first seen at: Microsoft Security Blog via `msft-secblog recent 15`, URL https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/ → pivot: Expel RSS item, URL https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/ → pivot (ARTEX background named in both): WebSearch (\"Storm-0940 ARTEX agentic AI Microsoft ConnectWise government targets\") → CrowdStrike, URL https://www.crowdstrike.com/en-us/blog/unknown-threat-actor-uses-artex-to-target-south-korean-finance/ (the CrowdStrike listing at https://www.crowdstrike.com/blog/category/counter-adversary-operations/ dates it 2026-10-07; extract returns a crawl date) → Recorded Future via its feed https://www.recordedfuture.com/feed, URL https://www.recordedfuture.com/blog/tag-217-artex-south-korean-banks"
    summary: |
      Microsoft reports that Storm-0940 (China-state aligned, active since 2021, historically password spraying, exploitation of internet-facing applications and adding credentials to OAuth apps) has used ARTEX since at least September 2026 to automate attacks on hundreds of organizations in aerospace and defense, automotive, chemicals, energy, financial services, government, legal, manufacturing, media, military, semiconductor, software, technology and think tanks. ARTEX is an open-source multi-agent LLM system written in Go with a Next.js front end that can use any AI model, runs a penetration test from reconnaissance to data exfiltration with little human input, and collects discovered assets and flaws in a graph; its interface and output can be switched to Korean, Mandarin, Spanish or Japanese. In several cases the time from first targeting to privileged cloud access was under three hours; Microsoft says most targeting failed but the actor reached privileged cloud persistence at many organizations, and that ARTEX is not a vulnerability but accelerates familiar scanning, password spraying and OAuth-application abuse to machine speed, leaving little time to respond to alerts. Other actors use it too: CrowdStrike analysed the open directories of an unnamed, probably Chinese-speaking and financially motivated actor that ran ARTEX with a DeepSeek back end against South Korean financial institutions in late September and early October, which Recorded Future tracks as TAG-217 and expects other actors to follow. Expel independently saw the same Storm-0940 infrastructure scan a customer and abuse Okta self-service registration with no ConnectWise app involved: five self-created accounts, Okta Verify enrolled on three of them within about a minute of activation, 50 SSO sign-ins and over 100 tokens, about 150 failed OAuth and OIDC requests across more than ten client IDs, and a password spray that Okta ThreatInsight blocked; Expel says the shared IP is its only link to Storm-0940, that the activity alone does not prove ARTEX, and that it has not seen the self-registration tradecraft in public reporting before.
    region_nexus: "global; Microsoft lists government and military among the targeted sectors, no victim or country named; no Swiss victim reported"
    primary_sector_nexus: "direct (government listed among Storm-0940's ARTEX target sectors) but unquantified"
    sector: "cross-sector incl. government"
    cves: []
    techniques: [T1110.003, T1595, T1078.004, T1098.001, T1098.003, T1528, T1136.003, T1098.005, T1087.004, T1580, T1588.007]
    affected_products: ["Microsoft Entra ID", "Microsoft 365", "Okta Workforce Identity (self-service registration)", "ARTEX (attacker framework)"]
    entity_keys: ["incident:connectwise-cloud-backup-skykick-app-credential-abuse-2026-10"]
    new_entities:
      - { key: "tool:artex", type: tool, name: "ARTEX", aliases: [], summary: "Open-source, China-developed multi-agent LLM penetration-testing framework (Go back end, Next.js front end) that runs reconnaissance-to-exfiltration tests with any AI model; used by Storm-0940 against hundreds of organizations (Microsoft, 2026-10-21), by an unnamed actor against South Korean financial institutions (CrowdStrike, 2026-10-07) and tracked by Recorded Future as TAG-217 (2026-10-16)." }
      - { key: "actor:tag-217", type: actor, name: "TAG-217", aliases: [], summary: "Recorded Future Insikt Group designation for the actor behind the ARTEX-assisted attacks on South Korean financial institutions, with infrastructure tested from at least 2026-08-17 and tooling for cryptocurrency-wallet theft, Linux privilege escalation and mobile exploit testing (Recorded Future, 2026-10-16); CrowdStrike calls the same activity an unnamed, probably Chinese-speaking, financially motivated actor." }
    relation_suggestions:
      - { subject: "actor:storm-0940", object: "tool:artex", basis: "Microsoft reports Storm-0940 used the ARTEX agentic AI penetration testing framework from at least September 2026 (Microsoft Threat Intelligence, 2026-10-21)" }
      - { subject: "actor:tag-217", object: "tool:artex", basis: "Recorded Future: TAG-217 used the AI-driven ARTEX framework against South Korean financial institutions (Insikt Group, 2026-10-16)" }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - { quote: "used the agentic AI penetration testing framework ARTEX to automate attacks targeting hundreds of organizations globally across a broad range of industries", attribution: "Microsoft Threat Intelligence", source_url: "https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/" }
      - { quote: "including multiple instances where the time from initial targeting to privileged access was less than 3 hours", attribution: "Microsoft Threat Intelligence", source_url: "https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/" }
      - { quote: "Used Okta self-service registration to create five accounts of its own, then enrolled Okta Verify on three of them", attribution: "Expel", source_url: "https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/" }
      - { quote: "The shared IP is our only link to Storm-0940, and this activity alone doesn’t prove ARTEX was used.", attribution: "Expel", source_url: "https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/" }
      - { quote: "the threat actor is likely a Chinese speaker and financially motivated", attribution: "CrowdStrike Counter Adversary Operations", source_url: "https://www.crowdstrike.com/en-us/blog/unknown-threat-actor-uses-artex-to-target-south-korean-finance/" }
      - { quote: "Use of ARTEX and other AI penetration testing tools is not limited to TAG-217", attribution: "Recorded Future Insikt Group", source_url: "https://www.recordedfuture.com/blog/tag-217-artex-south-korean-banks" }
    extended_notes: |
      Exposure: any tenant that uses password authentication or OAuth app consent, and any Okta org with self-service registration enabled; ARTEX targets are chosen opportunistically at scale, so absence of ConnectWise use does not exclude exposure (Expel). Detection concept (telemetry class first): identity-provider authentication logs across every IdP (Okta, Entra ID, Duo, Google Workspace) for bursts of failed logons and lockouts against many accounts (Microsoft saw lockout responses at nearly 98 % of the spray's events) and for scripted user-agents; Okta system log for new self-registered accounts that enrol Okta Verify and immediately start SSO; Entra audit for application or service-principal credential additions and apps assigning themselves roles. Benign lookalikes: Python or curl user-agents are common in legitimate automation, so they are supporting evidence only (Expel). Hardening levers the sources name: least-privilege multi-tenant application permissions and consent grants, monitoring credential additions and privilege assignments by apps, reviewing self-registered Okta accounts since 2026-10-13. Microsoft is the telemetry holder for the Storm-0940 attribution and calls it an assessment; CrowdStrike and Recorded Future describe a different, financially motivated ARTEX user, so 'ARTEX' must not be read as one actor. Overlaps with the existing ConnectWise entry (item 1); suggest the main agent decides whether this is a standalone threat entry (recommended: new entities, distinct campaign beyond ConnectWise) with references[] to that entry.

