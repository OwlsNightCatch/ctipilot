    summary: |
      Pillar Security reports a critical command-injection flaw (CWE-78) in opencode, the open-source AI coding agent (about 3 million weekly npm downloads), on Windows and WSL: during the OAuth discovery handshake with a remote MCP server, the server-chosen authorization_endpoint value goes unchecked into the dependency that opens URLs, which on Windows hands it to PowerShell without correct quoting, so a response from a malicious, later-compromised, typosquatted or expired-domain MCP server can run code with the developer's privileges and no further user interaction. Affected versions are 1.0.137 to 1.18.32; Anomaly fixed it in 1.18.33 on 2026-09-28 as a refactor, requested no CVE and published no advisory because malicious remote MCP servers are outside its threat model, so vulnerability scanners and dependency bots will not flag affected installations. Pillar proposes CVSS 3.1 9.8 and states that URL scheme validation alone does not stop the attack because the payload can ride in an ordinary https URL; the effective fix is quoting or argument-vector process execution, and the same defect class had three CVEs in 2025. Pillar reported privately at the end of August 2026.
