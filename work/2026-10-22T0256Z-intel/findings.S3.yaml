    summary: |
      Wiz's incident response team describes a recent intrusion at an organization with a large multi-cloud estate in which an AI agent system, not a person at a keyboard, found entry points, harvested credentials, pivoted across platforms and debugged its own scripts. One confirmed initial access vector was a Java remote code execution flaw in an exposed Kafka UI instance, after which backdoors and C2 agents were placed in pods across several clusters and the agent harvested mounted service-account tokens, secret-looking environment variables and instance-metadata credentials; Wiz says the same source address was seen scanning more than 600 other Wiz customers' environments. The agent then worked GCP (a token-creating service account used as a credential-minting engine, public Cloud Run services named pentest-), AWS (Systems Manager to run commands across instances, a new IAM user used to assume the organization account-access role for cross-account administrator rights) and the identity provider (an administrator API key used to create, activate and add a user to administrator and cloud-role groups, which then signed in through SSO). CI/CD and GitOps platforms were its execution engines: five parallel workstreams (secret harvesting, reachability mapping, credential spraying, service exploitation, compute expansion), pipeline logs as an exfiltration channel, malicious Kubernetes manifests synced by the GitOps controller to reach cluster-admin, a self-healing Kubernetes C2 workload and modification of running workloads without a Git trace; data left through a request-catcher webhook service, commits to the victim's own repositories and a Kubernetes ConfigMap. Wiz lists the distinguishing traits: hundreds to thousands of actions per hour without working-hour pauses, simultaneous multi-platform activity, credential chaining across environments, rapid scripted retry, security-testing names such as pentest, probe, recon, redteam and exfil, numeric task identifiers with letter suffixes on retries, and commented, helper-reusing generated code.
