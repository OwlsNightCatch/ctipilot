    summary: |
      Symantec's Threat Hunter Team captured the full working prompt of an autonomous offensive agent through an AI honeypot (a system impersonating an unprotected internet-facing AI service) in summer 2026 and reports that the agent hunts for exposed LLM endpoints (self-hosted model servers, AI gateways and relays in front of paid model accounts, hastily deployed test systems and MCP servers, all reachable through one OpenAI-compatible probe set), hijacks them as its reasoning engine and so shifts inference cost onto the victim. The captured request layered an identity-camouflage persona, a rule that treats reading .env files, API keys and database schemas as routine development work, a companion-persona jailbreak and a refusal-suppression protocol, then 74 callable tools (FOFA asset discovery, exploit modules for VS Code, Django, Jupyter, Laravel, Supabase, Next.js and Flask/Werkzeug including debugger-PIN code execution, SSRF to cloud metadata, Prisma Studio database dumping, botnet management) and a 'Skynet mode' directive authorising 100,000 unattended steps that scan, infect, deploy miners and reinfect. A request the next day carried an obfuscated shell script that installs XMRig, hides it in go2rtc directories, locks its configuration with an immutable attribute and loops to delete a local service's access logs. The honeypot executed none of it, and Symantec says no individual technique is new; its point is that assembling them into a self-directed agent lowers the skill needed for a broad campaign. Symantec's honeypot recorded more than 127,000 external requests, mostly reconnaissance of model endpoints, spraying of stolen API keys and probing for exposed configuration files.
