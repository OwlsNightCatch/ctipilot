  - title: "Group-IB and NyxLab: access-broker operator k0t mass-exploits FortiWeb (CVE-2025-64446) and PAN-OS GlobalProtect (CVE-2026-0257), brute-forces FortiGate and decrypts stolen FortiGate configurations offline; victims later appear on the Qilin and The Gentlemen leak sites"
    sources:
      - { url: "https://www.group-ib.com/blog/stray-cat-network-edge/", publisher: "Group-IB (with NyxLab)", date: "2026-10-21", role: "primary" }
    discovery_trace: "first seen at: group-ib RSS feed, URL https://www.group-ib.com/blog/rss.xml (item 'Stray Cat, Open Doors: How k0t Wanders Through the Network Edge', 2026-10-21) → primary (no pivot needed): https://www.group-ib.com/blog/stray-cat-network-edge/. Corroboration attempt: WebSearch (\"k0t\" Group-IB NyxLab FortiGate FortiWeb GlobalProtect initial access broker campaign) found no independent report; KEV status of the cited CVEs read from the run's CISA KEV fetch (catalogVersion 2026.10.21)."
    summary: |
      Group-IB and NyxLab describe a campaign by an operator tracked as k0t (aliases CryptoFeel and possibly Scrooge) that finds edge devices in bulk through FOFA, ZoomEye and Censys exports and underground IP-list services, then compromises them with its own scripts: the FortiWeb path traversal CVE-2025-64446 (a forged CGIINFO header that creates a local administrator whose trusted-host range is open to all sources), brute force of FortiGate administrator logins with lockout-aware retry, and the PAN-OS GlobalProtect certificate-reuse bypass CVE-2026-0257 (a forged authentication-override cookie submitted to the GlobalProtect login endpoint, then an OpenConnect VPN session). On FortiGate it downloads the configuration and decrypts the stored secrets offline with the default FortiOS key (CVE-2019-6693), recovering LDAP and Active Directory bind and administrator credentials; Group-IB stresses this step is invisible on the appliance. It reports more than 70,000 exposed credentials not linked to the earlier FortiBleed dataset and hands-on Active Directory work with NetExec, Impacket, noPac, PetitPotam relayed to AD CS, Kerbrute and Mimikatz, persistence through OpenConnect, MeshCentral agents enrolled automatically, AdaptixC2, Atera, AnyDesk and ngrok, and exfiltration with Rclone to Wasabi and MEGA. Group-IB sees victim overlap with the Qilin and The Gentlemen leak sites and assesses the operators are probably initial-access brokers, but says the link to either group is unconfirmed, and assesses with moderate confidence an association with FortiBleed-related activity without establishing shared operators. The operator's stated priorities begin with the US and Canada, then European countries; Group-IB says the observed victim distribution (largest share APAC and Latin America) reflects exposed devices rather than deliberate targeting. A further technical report is announced.
    region_nexus: "global; stated priority US/Canada then Europe; no Swiss victim reported"
    primary_sector_nexus: "indirect (edge-device exposure is sector-agnostic; Fortinet and Palo Alto perimeter devices are common in public administrations)"
    sector: "cross-sector"
    cves: [CVE-2025-64446, CVE-2026-0257, CVE-2019-6693, CVE-2021-42278, CVE-2021-42287]
    techniques: [T1190, T1596.005, T1110.001, T1110.003, T1133, T1136.001, T1602.002, T1550.004, T1068, T1003.001, T1003.002, T1003.004, T1003.006, T1558.003, T1187, T1219, T1567.002, T1059.001, T1053.005, T1569.002]
    affected_products: ["Fortinet FortiWeb", "Fortinet FortiGate / FortiOS", "Palo Alto Networks PAN-OS GlobalProtect", "MeshCentral", "AdaptixC2", "NetExec"]
    entity_keys: ["incident:fortibleed-fortigate-credential-exposure", "product:fortinet-fortiweb", "product:meshcentral-meshagent", "actor:qilin", "actor:thegentlemen", "product:palo-alto-networks-pan-os"]
    new_entities:
      - { key: "actor:k0t", type: actor, name: "k0t", aliases: ["CryptoFeel"], summary: "Group-IB and NyxLab name for an access-broker-like operator (possible alias CryptoFeel; likely collaborator Scrooge/ScroogeMcDuck) running a large campaign against exposed FortiGate, FortiWeb and PAN-OS GlobalProtect devices, with victim overlap on the Qilin and The Gentlemen leak sites (Group-IB, 2026-10-21)." }
      - { key: "tool:adaptixc2", type: tool, name: "AdaptixC2", aliases: [], summary: "Open-source modular post-exploitation and adversary-emulation framework (Go team server, Qt client) used by k0t as a second C2 channel beside MeshCentral (Group-IB, 2026-10-21); the registry currently holds only the incident:dfir-bumblebee-adaptixc2-akira-seo-poisoning-killchain record for it." }
    relation_suggestions:
      - { subject: "actor:k0t", object: "incident:fortibleed-fortigate-credential-exposure", basis: "Group-IB assesses with moderate confidence that the k0t cluster is associated with broader FortiBleed-related activity, while finding negligible overlap in compromised credential data and not establishing that the same operators controlled both datasets (Group-IB, 2026-10-21)" }
      - { subject: "actor:k0t", object: "tool:adaptixc2", basis: "Group-IB: operators used AdaptixC2 as an additional C2 channel alongside MeshCentral (Group-IB, 2026-10-21)" }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - { quote: "Large-scale campaign involving vulnerability exploitation and brute-forcing of exposed network devices", attribution: "Group-IB", source_url: "https://www.group-ib.com/blog/stray-cat-network-edge/" }
      - { quote: "More than 70,000 exposed credentials associated with network devices, LDAP dumps etc.", attribution: "Group-IB", source_url: "https://www.group-ib.com/blog/stray-cat-network-edge/" }
      - { quote: "Operators exploited public-facing FortiWeb and GlobalProtect services to gain initial access.", attribution: "Group-IB", source_url: "https://www.group-ib.com/blog/stray-cat-network-edge/" }
      - { quote: "Many victims seen in this campaign have also been observed to be later listed by ransomware groups, Qilin and the Gentlemen, on their Data Leak Sites (DLS).", attribution: "Group-IB", source_url: "https://www.group-ib.com/blog/stray-cat-network-edge/" }
      - { quote: "Enable the ‘private-data-encryption’ setting on FortiGate appliances and supply an operator-defined key.", attribution: "Group-IB", source_url: "https://www.group-ib.com/blog/stray-cat-network-edge/" }
    extended_notes: |
      Exposure: internet-reachable FortiGate (administrator and SSL-VPN logins), FortiWeb below the fix for CVE-2025-64446, and PAN-OS GlobalProtect portals or gateways with authentication-override cookies and the shared certificate configuration (CVE-2026-0257 is already covered by the 2026-05-30 entry, CISA KEV since 2026-05-29 with ransomware use marked known; CVE-2025-64446 is in KEV since 2025-11-14; CVE-2019-6693 is in KEV since 2025-06-25 with ransomware use marked known). A FortiGate is exposed to the offline-decryption step unless private-data-encryption is enabled with an operator-defined key. Detection concept (telemetry classes): appliance administrator audit logs for new local administrators, trusted-host ranges opened to all sources, configuration exports and lockout-and-retry authentication patterns; VPN gateway logs for GlobalProtect sessions authenticated by cookie from unfamiliar sources; domain-controller authentication and Kerberos service-ticket telemetry for the NetExec / Impacket / noPac / PetitPotam pattern (remote execution through scheduled-task and service creation over SMB); endpoint inventory of MeshAgent, AdaptixC2, Atera, AnyDesk and ngrok against approved owners; proxy and DNS egress for Rclone traffic to Wasabi and MEGA. Post-patch compromise check: a patched edge device may already have yielded its configuration, so rotate every credential referenced in it (LDAP and AD bind accounts first) and review the directory for the downstream activity above. Single vendor source (Group-IB with NyxLab, reliability B); technically detailed and consistent with the store's FortiBleed and CVE-2026-0257 entries, hence confidence MEDIUM rather than HIGH. The main agent must declare references[] to 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen and 2026-06-18/fortibleed-73-932-internet-facing-fortigate-devices-exposed because CVE-2026-0257 overlaps.

