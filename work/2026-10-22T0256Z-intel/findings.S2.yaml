    discovery_trace: "first seen at: news-admin-ch, bridge `url https://www.news.admin.ch/de/newnsb` (12 newest cards; card 'Prüfung der Sicherheit und Nutzbarkeit von Microsoft 365', 2026-10-21) → https://www.news.admin.ch/de/newnsb/ImdxsqDyHEzU (extract) → pivot: raw HTML link to https://www.efk.admin.ch/prufung/sicherheit-und-nutzbarkeit-von-microsoft-365/ → primary: report PDF https://www.efk.admin.ch/wp-content/uploads/publikationen/berichte/wirtschaft_und_verwaltung/informatikprojekte/25121/25121be-bk-dti-microsoft-365.pdf (bridge `pdf`, 24 pages read)."
    summary: |
      The Swiss Federal Audit Office (EFK) published on 21 October 2026 its audit of Microsoft 365 in the federal administration (EFK-25121; audit work 23 February to 3 April 2026, report version with statements dated 28 July 2026). The federal Digital Transformation and ICT Steering sector of the Federal Chancellery (BK-DTI) completed the rollout at the end of 2025: 54,000 workstations run by the Federal Office of Information Technology (BIT) were migrated in 14 months, and 57 M365 services are approved for the standard service. The EFK says the BIT built the platform according to the Chancellery's architecture guidelines and Microsoft good practice and that security measures fit the currently restrictive use (unclassified information; the Chancellery aims to extend to the INTERN level). Open findings, all rated priority 1 and accepted by BK-DTI/BIT: compliance management and the systematic evaluation of monitoring and Microsoft Service Trust Portal reports are not yet defined; tenant configuration is only partly automated (the Microsoft 365 Desired State Configuration approach currently covers Entra ID and base settings, with Conditional Access policies reviewed weekly for deviations) and CIS-benchmark hardening is not fully applied; BK-DTI has not defined how often deviations from security standards are evaluated or how to respond; and the backup that the architecture requires (several generations, in a federal data centre, restorable independently of the cloud provider) is not yet in place. The EFK reports that the administration console of the backup product first chosen turned out to be hosted in the USA, contrary to the architecture guideline, so it is being replaced by a Europe-hosted solution and the Microsoft 365 Backup service is the interim measure, which leaves a dependency on Microsoft; the BIT's statement says the local backup environment has since been built and put into production, with half-yearly restore tests. The report also notes about 30 further M365 tenants in the federal administration outside the BIT's standard service, which Microsoft's one-tenant principle does not foresee and which were not examined, and the BIT recommends auditing the other tenant operators too. Customer-managed keys for service encryption are planned for the fourth quarter of 2026; the Customer Lockbox is configured but has not been exercised in production.
    region_nexus: "Switzerland (federal administration; BIT, Federal Chancellery BK-DTI)"
    primary_sector_nexus: "direct: federal public sector; transferable to cantons and communes that run their own Microsoft 365 tenants"
