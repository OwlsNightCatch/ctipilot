    extended_notes: |
      Delta against the stored entry (written before the fix existed): fixed releases and their version table, the Swiss/EU authority response and the concrete Swiss public-sector take-downs. S1 will probably carry the vulnerability facts (fixed versions, Wiz memory-disclosure write-up, Cloudflare WAF, the NCSC.ch advisory's relayed claim that Cloudflare's CTO saw first exploitation attempts, which is an X post and should not be carried as fact); this item is the home-region and sector angle. The main agent may prefer a separate incident entry for the Swiss take-downs (proposed key above); the CVE overlap means it would have to declare the PHP entry in references[].
      Exposure: any Swiss body running PHP-served sites or products with a bundled PHP (agency-built CMS sites, municipal portals, hosting-provider platforms, vendor appliances and admin interfaces); BACS stresses embedded and internal installations, not only public web sites. NCSC-NL's repository carries inventory lists of software products with a PHP dependency (software/ directory) and detection/mitigation material.
      Detection (telemetry classes, derived from the PHP project's described paths as relayed by NCSC.ch, and BACS's log advice): web/application access logs for multipart POSTs to PHP endpoints and requests exercising session upload progress; PHP error logs and process telemetry for worker crashes, out-of-memory kills and fatal errors; process-creation events with the web-server or PHP worker as parent (code runs with the web worker's privileges); file-integrity changes in web roots. NCSC.ch's advisory links Corelight (Zeek/Suricata), Elastic and a third-party Defender XDR hunting pack; coverage depends on telemetry and the rules need tuning. The patch does not evict a prior intruder: restart all workers and check the web root after patching.
      Triage: an unexplained loss of availability of a cantonal, university or municipal web site on 21-22 October is most likely a precautionary PHP take-down (Basel-Stadt, Ticino, UniGE, EPFL, Publica), not a DDoS or defacement; the discriminator is an operator statement saying precaution and a restoration after patching. Lodur's outage in particular is a supplier-side preventive shutdown, so alarm-group administration was unavailable while alarm triggering was reportedly not affected.
      Defender takeaway: decide before the next such event who may order a take-down, how emergency-service dependencies on a single SaaS (alarm-group administration, rosters) degrade, and which suppliers must confirm patched status in writing. Basel-Stadt said it would report on progress on Thursday morning (2026-10-22): the restoration status at fire time was not found.
