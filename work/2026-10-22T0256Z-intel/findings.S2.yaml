    summary: |
      PHP published fixed releases (8.5.12, 8.4.27, 8.3.36, 8.2.35) on 21 October at about 13:40 UTC (ENISA), and BACS published its warning the same day. The Swiss consequence began that evening: the canton of Basel-Stadt activated its crisis staff and, per its own communiqué, shut down every PHP-run cantonal website with no restoration time given while stating that no security-relevant incident had been registered; the Ticino cantonal administration (Department of Finance and Economy) temporarily disabled unspecified online services after BACS's warning; the websites of the University of Geneva and EPFL were unreachable; and Neuchâtel canton and city sites were unreachable without a state statement (RTS reports that Arcinfo presumes the PHP flaw is the cause, unconfirmed). Lodur, the web platform used to manage many Swiss fire brigades, was out of service because its provider took its servers offline as a precaution; users could neither read stored data nor edit alarm groups, and the Valais cantonal fire office stressed this does not necessarily mean the alarm-triggering systems themselves are down. Publica states that it took publica.ch offline on the afternoon of 21 October as a precaution (back since 18:30), unrelated to the supplier incident it is already managing. BACS's page tells operators that PHP may be part of administration interfaces, internal line-of-business applications, hosting platforms, containers or appliances; to confirm fixes with suppliers and hosters; to restart long-running PHP processes and rebuild containers; to verify the running version (distribution packages can carry backports under an unchanged version number); to examine logs and systems for unusual requests, crashes, changed files and unexpected processes (an update does not remove a compromise that has already happened, in BACS's words in German); and, where an immediate update is impossible, to consider temporarily disconnecting critical applications from the Internet. BACS told RTS it knows of no reliable, confirmed substitute for the updates and that the interim measures give no guaranteed full protection. Neighbouring authorities acted harder: AFP reports French prefecture sites were taken offline at ANSSI's request and that public-service and municipal platforms went offline in the UK, Germany, Denmark, the Netherlands and Belgium; SRF reports (and the Corriere del Ticino, citing DPA) that Germany's BSI rated the risk Warnstufe 3 / Orange. Cloudflare, which shipped default WAF protections ahead of disclosure, says it observed attack traffic against its customers during the leak, with payloads mutated to evade its rules; no Swiss source reports a confirmed compromise of a Swiss public-sector site, and Basel-Stadt says none was registered.
