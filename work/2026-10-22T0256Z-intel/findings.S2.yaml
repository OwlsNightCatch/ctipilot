  # 6. Swiss Government Cloud tender (policy/procurement) — borderline
  # ---------------------------------------------------------------------------
  - title: "Swiss Government Cloud: the Confederation opens a 1,117-page tender worth up to CHF 7 billion over 14 years for cloud services meant for federal, cantonal and communal use; Swiss providers say the criteria favour US hyperscalers"
    novelty: new
    borderline: true
    borderline_reason: "Procurement news: it does not change what defenders are obliged or advised to do today; it matters later because the three SGC infrastructures with different data-protection levels will define where public-sector data and logs live, and it ties into the stored sovereignty items (motion 24.3209, e-ID trust infrastructure) and the EFK M365 audit's provider-independence findings. Both sources are paywalled past the lead."
    sources:
      - { url: "https://www.letemps.ch/cyber/des-contrats-pharaoniques-la-suisse-veut-depenser-jusqu-a-7-milliards-de-francs-pour-des-services-cloud-a-destination-de-la-population", publisher: "Le Temps", date: "2026-10-21", role: "primary" }
      - { url: "https://www.inside-it.ch/bis-zu-7-milliarden-fuer-swiss-government-cloud-20261020", publisher: "Inside IT", date: "2026-10-20", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"Swiss Government Cloud Ausschreibung BIT 7 Milliarden Datenschutzlevel Infrastrukturen\") for the Inside IT lead (https://www.inside-it.ch/rss.xml item of 2026-10-20) → pivot: Le Temps cyber section (https://www.letemps.ch/cyber) → https://www.letemps.ch/cyber/des-contrats-pharaoniques-la-suisse-veut-depenser-jusqu-a-7-milliards-de-francs-pour-des-services-cloud-a-destination-de-la-population → Simap tender notice itself not reached (Simap not fetched)."
    summary: |
      Le Temps reports that the Confederation launched on Tuesday 20 October a 1,117-page tender, worth up to CHF 7 billion over 14-year contracts, to renew its cloud-computing services; the Swiss Government Cloud is meant to serve the Confederation, the cantons and the communes, which will store and process their data there. Swiss providers welcome the initiative but, Le Temps says, criticise criteria that they argue favour the American giants. Inside IT, citing the tender on the Simap procurement platform, says the Federal Office of Information Technology (BIT) is tendering three infrastructures with different data-protection levels, and that the current systems are approaching the end of their life cycle. Neither source's paywalled remainder was read, so the security requirements, the data-protection level definitions and the award timetable are not established here.
