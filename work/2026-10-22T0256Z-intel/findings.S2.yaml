  - title: "Federal Audit Office on the federal Microsoft 365 platform: built to good practice, but compliance monitoring, security-baseline review cadence, tenant-configuration automation and a provider-independent backup are still open, and about 30 other federal tenants were not audited"
    novelty: new
    sources:
