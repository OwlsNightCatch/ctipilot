  # 5. BACS week-42 review: hotel-booking phishing relays the e-banking second factor (TWINT)
  # ---------------------------------------------------------------------------
  - title: "BACS week 42: phishing built on stolen hotel-booking data relays the e-banking second factor in real time, including card-reader codes, to take over TWINT"
    novelty: new
    borderline: true
    borderline_reason: "Consumer-fraud review, not public-sector operations; kept as a borderline because it is the in-the-wild instance of the real-time MFA relay that the stored BACS authentication-classes entry (2026-10-19) says only session-bound methods resist."
    sources:
      - { url: "https://www.bacs.admin.ch/de/26w42-de", publisher: "BACS (NCSC.ch), weekly review", date: "2026-10-20", role: "primary" }
    discovery_trace: "first seen at: ncsc-ch-focus, bridge `url --direct https://www.bacs.admin.ch/de/im-fokus` (card 'Woche 42', 2026-10-20) → primary: https://www.bacs.admin.ch/de/26w42-de (extract). Related coverage seen: Netzwoche/swisscybersecurity.net 2026-10-21 (not fetched for claims)."
    summary: |
      BACS's week-42 review describes a shift from mass campaigns to targeted, personalised fraud: attackers who hold name, e-mail address, booking data and hotel name, which BACS says presumably come from compromised booking or hotel mail systems, write in the hotel's name, point to a cloned hotel site on a look-alike domain and promise a 7.5 % cashback. The victim is steered to a TWINT payout and then to a replica of their bank's login page, and while the victim is kept busy the criminals log in to e-banking in the background; when the bank asks for the second factor the victim is talked into approving it or, in some cases, into generating a code with a card reader and reading it out. The aim is mainly to re-register the TWINT account linked to the bank account to another phone number, although direct fraudulent payments are conceivable. BACS notes the method is known from classified-ads platforms and now spreads to hotel bookings.
    region_nexus: "Switzerland"
    primary_sector_nexus: "indirect: staff personal e-banking; conceptually relevant to real-time phishing against any session-based login"
    sector: "public-sector"
    cves: []
    techniques: [T1566, T1111]
    affected_products: []
    entity_keys: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: HIGH
    evidence:
      - quote: "Die Kriminellen versuchen damit vor allem, das mit dem Bankkonto verknüpfte TWINT-Konto auf eine andere Telefonnummer umzuschreiben."
        attribution: "BACS (NCSC.ch), weekly review"
        source_url: "https://www.bacs.admin.ch/de/26w42-de"
    extended_notes: |
      Triage-relevant discriminator from BACS: the attacker holds exact booking details, so 'they know my reservation' is not evidence of legitimacy; a refund never requires entering e-banking credentials or scanning a QR code. Suggested Admiralty: A2.
