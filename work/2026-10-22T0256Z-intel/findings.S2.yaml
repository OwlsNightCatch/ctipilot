    discovery_trace: "first seen at: anssi-fr, bridge `cert-fr` recipes on https://www.cert.ssi.gouv.fr/avis/feed/ and https://www.cert.ssi.gouv.fr/alerte/feed/ → the ALE-014 page (https://www.cert.ssi.gouv.fr/alerte/CERTFR-2026-ALE-014/) menu announced CTI-008 → https://www.cert.ssi.gouv.fr/cti/feed/ (8 items, newest 2026-10-20) → https://www.cert.ssi.gouv.fr/cti/CERTFR-2026-CTI-008/ → report PDF https://www.cert.ssi.gouv.fr/uploads/CERTFR-2026-CTI-008.pdf (bridge `pdf`, 80 pages)."
    summary: |
      CERT-FR (ANSSI) published on 20 October 2026 an 80-page experience report on personal- and sensitive-data breaches from web applications, following a 2024 report limited to the social sector. It reports being informed of 196 data-exfiltration incidents in 2025 against 130 in 2024, with no particular sector targeting, and says many were enabled by low-complexity actions without a technical vulnerability: taking over a user account that reaches an API which returns the database content (an e-health service, May 2025), API access that was insufficiently limited so that a compromised account pulled data it was not entitled to, accidentally exposed data after a maintenance error at a medical-data provider, and recurrent infostealers (agri-food firms in February 2025 after staff installed a free Word-to-PDF converter; late-2025 exfiltrations of public-service data through infostealers on citizens' personal computers) as well as a supplier's account used to reach a lab's results-viewing application. CERT-FR also warns that criminal claims of such breaches are often unverified or recycled but must be qualified by the data controller. The report gives ten risk-reduction principles for applications that cannot be replaced at once: a data-management policy with director-level ownership, least privilege and a per-session volume limit, limiting exposure (treat as internal only traffic from a network that applies your security policy), strong authentication for staff and one-time identifiers or passkeys for the public, a hosting environment that follows ANSSI guidance, traceability that attributes every action to a user and a network address through every component, log review, automatic slow-down and temporary blocking plus blocking sensitive functions on risky sessions, verification (SBOM, audit) before and after go-live, and, specific to administrations, a formal risk-based approval of each application under the RGS and PSSIE. Annexes show implementations for source-address logging, IP and geo restrictions, login-hour limits, sliding-window request limits and failed-attempt detection.
    region_nexus: "France (CERT-FR); transferable to Swiss federal, cantonal and communal citizen-facing applications"
    primary_sector_nexus: "direct (applicability): public administrations running applications with citizen or insured-person data; the report itself is sector-agnostic with an administration-specific principle"
