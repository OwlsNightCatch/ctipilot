        attribution: "Swiss Federal Audit Office (EFK), audit page"
        source_url: "https://www.efk.admin.ch/prufung/sicherheit-und-nutzbarkeit-von-microsoft-365/"
      - quote: "Im Rahmen der Implementation wurde jedoch festgestellt, dass die Administrationskonsole dieser Lösung in den USA gehostet wird."
        attribution: "Swiss Federal Audit Office (EFK), report EFK-25121 (version with statements, 2026-07-28)"
        source_url: "https://www.efk.admin.ch/wp-content/uploads/publikationen/berichte/wirtschaft_und_verwaltung/informatikprojekte/25121/25121be-bk-dti-microsoft-365.pdf"
    extended_notes: |
      Single-source: the Federal Audit Office as the owner of its own audit (press release, audit page and full report are the same first-hand origin); no independent coverage of the 2026-10-21 publication was found (the 2024/2025 EFK M365 audits PA 23740 and PA 24133 are earlier reports). Suggested Admiralty: A2 (authority primary, not independently corroborated). PDF text extraction is stable but hyphenates words across lines, so quotes from the PDF are whitespace-normalised.
      Exposure / relevance for defenders: the pattern applies to any cantonal or communal administration with its own M365 tenant: (1) tenant sprawl, about 30 federal tenants outside the BIT service, each needing the same baseline, (2) configuration-drift control for a cloud that receives features without notice (the report mentions that some updates, for example the Apps Enhanced Configuration Service, can roll out without a Message Center entry), (3) a backup that survives loss of the tenant or the provider connection (the EFK: if the connection to M365 were lost, no backup would currently be available in the interim set-up), (4) provider-side access control: Customer Lockbox set up but untested in production, customer-managed keys still planned.
      Detection concept tied to the findings: Entra ID audit and sign-in logs plus a desired-state diff of tenant configuration (the BIT's weekly Conditional Access deviation review is the reference practice); alerts on security-baseline deviations rather than periodic manual review. The related stored incident (ConnectWise Cloud Backup / SkyKick credential abuse) shows the backup-vendor path into M365 tenants that a provider-independent local backup does not by itself close.
      Defender takeaway: define the review cadence and the response path for baseline deviations, inventory every tenant the organisation or its agencies operate, and keep a restorable M365 backup outside Microsoft and outside any single backup vendor's tenant access.
