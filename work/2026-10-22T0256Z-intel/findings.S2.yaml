      The first sentence of the page reads that CERT-FR followed nearly 200 web-application data breaches in 2025 ("près de 200"); the 196 vs 130 (2024) figures come from the PDF's incident section. A quote from the HTML page is carried above because PDF extraction inserts spacing artefacts. Suggested Admiralty: A2 (national CERT primary for its own incident handling; not independently corroborated).
      Detection concepts it ties to telemetry: source addresses preserved end to end through proxies and load balancers (annexes A-B), request-volume per sliding window per account (annex F), failed-attempt counters (annex G), logins outside normal hours and from unexpected geographies (annexes D-E). Hardening levers: passkeys / one-time identifiers for the public, strong authentication for staff, per-session data-volume caps, API authorisation checks against business rules.
