  - title: "CERT-FR experience report on web-application data breaches: 196 exfiltration incidents in 2025, mostly low-complexity (stolen accounts, API over-reach, infostealers, supplier accounts), with ten risk-reduction principles and one specific to administrations"
    novelty: new
    borderline: true
