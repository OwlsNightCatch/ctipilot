  - claim_id: 88b3b3b06d
    entry: 2026-10-22/cve-2026-76466-cisco-expressway-cluster-unauth-root-rce
    surface: "summary"
    kind: frontmatter
    text: "Cisco's disclosure of 2026-10-21 fixes CVE-2026-76466 (CVSS 3.1 9.8), which lets an unauthenticated attacker who holds persistent cookies run operating-system commands as root on Expressway-C and Expressway-E that are configured in a cluster; X15.5.3 and earlier get X15.5.20, X14 and earlier must migrate, and there is no workaround. Hardening releases ship the same day for the Unified CM family and Unity Connection (up to 9.8, fixed in 15SU5), and for Snort 3 in Secure Firewall Threat Defense and related products (9.0); Cisco knows of no malicious use of any of them."
  - claim_id: 846544928a
    entry: 2026-10-22/cve-2026-76466-cisco-expressway-cluster-unauth-root-rce
    surface: "body"
    kind: uncited
    text: "The same day Cisco ships two further hardening releases whose worst classes are exploitable over the network without authentication."
  - claim_id: 48eed90c7e
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "summary"
    kind: frontmatter
    text: "Microsoft reports that since at least September 2026 Storm-0940, a China-state aligned actor, has used ARTEX, an open-source multi-agent LLM penetration-testing framework, to automate scanning, password spraying and OAuth-application abuse against hundreds of organizations across many industries including government, reaching privileged cloud access in under three hours in several cases. Expel independently saw the same infrastructure create its own accounts through Okta self-service registration, enrol Okta Verify and sign in to applications, and CrowdStrike and Recorded Future document another actor using the same framework."
