    entry: 2026-10-22/k0t-fortiweb-fortigate-globalprotect-edge-device-campaign
    surface: "cves[CVE-2025-64446]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2025-64446\", \"cvss\": null, \"status\": [\"exploited\", \"cisa-kev\", \"patch-available\"], \"affected\": \"FortiWeb 8.0.0 through 8.0.1, 7.6.0 through 7.6.4, 7.4.0 through 7.4.9, 7.2.0 through 7.2.11 and 7.0.0 through 7.0.11; 6.4 and FortiAppSec Cloud are not affected\", \"fixed\": \"8.0.2, 7.6.5, 7.4.10, 7.2.12, 7.0.12; interim: disable HTTP and HTTPS on internet-facing interfaces\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 8966cee6e3
    entry: 2026-10-22/k0t-fortiweb-fortigate-globalprotect-edge-device-campaign
    surface: "cves[CVE-2019-6693]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2019-6693\", \"cvss\": null, \"status\": [\"exploited\", \"cisa-kev\", \"mitigation-only\"], \"affected\": \"Fortinet FortiOS configuration data encrypted with the default key (Fortinet lists 6.2.0, 6.0.0 through 6.0.6 and 5.6.10 and below); a device keeps using that key until private-data-encryption is enabled\", \"fixed\": \"FortiOS 5.6.11, 6.0.7 and 6.2.1 and later add the private-data-encryption option, disabled by default, which makes FortiOS encrypt with an operator-defined key\", \"auth\": \"post-auth\", \"vector\": \"local\"}"
