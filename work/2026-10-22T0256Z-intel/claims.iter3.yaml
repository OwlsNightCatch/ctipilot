    entry: 2026-10-20/ovhcloud-cli-release-assets-replaced-secret-stealing-build
    surface: "summary"
    kind: frontmatter
    text: "OVHcloud says a hacker used a developer's GitHub account to replace the release binaries of its command-line tool for versions v0.11.0 to v0.15.0 on 2026-10-19 with a build that steals secrets from disk, available for 1h33 and downloaded about 250 times; the first replacement was at about 12:47 UTC and OVHcloud deleted the files at 14:21 UTC after a customer's pinned SHA-256 failed. Its postmortem traces the account compromise to a poisoned editor extension installed on the developer's personal MacBook on 2025-10-20, ties it to the GlassWorm actor through a Solana wallet, and names a missing release-immutability setting as the main issue. Anyone who installed or updated the tool from a release asset in that window must rotate every secret on that host; the source tag and the Go module were untouched."
