    surface: "body"
    kind: cited
    text: "A successful exploit is quiet and does not reliably crash, so the absence of a hit never clears an instance ("
    urls: ["https://gitlab.com/gitlab-security-oss/tldr/-/raw/main/Detections/platforms/GitLab/Vulnerability%20Detections/onigmo_native_worker_crash.md"]
  - claim_id: e3973a1714
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "body"
    kind: cited
    text: "On an instance that was exposed and unpatched, treat the instance secrets, CI/CD variables, runner tokens and access tokens the git user can read as at risk, which is the impact GitLab lists ("
    urls: ["https://gitlab.com/gitlab-security-oss/tldr/-/raw/main/Detections/platforms/GitLab/Vulnerability%20Detections/org_mode_render_error_burst.md"]
  - claim_id: f332aacc64
