  - claim_id: a11a41a5e2
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "summary"
    kind: frontmatter
    text: "The PHP project released 8.5.12, 8.4.27, 8.3.36 and 8.2.35 on 2026-10-21 to fix CVE-2026-109618 and CVE-2026-109619 (CVSS 4.0 9.2), two flaws in the runtime itself that allow unauthenticated remote code execution as the web worker account, most directly on Apache mod_php; PHP 8.1 and older get no upstream release. Cloudflare, watchTowr and VulnCheck report attack traffic and one unsuccessful web-shell attempt, public proofs of concept circulate, no source reports a confirmed compromise, and Swiss cantons, universities, the Lodur fire-brigade platform and Publica took sites offline as a precaution."
  - claim_id: e44403548d
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "immediate_action"
    kind: frontmatter
    text: "Update the PHP runtime on every internet-facing host today: Two unauthenticated remote-code-execution flaws in PHP itself are being scanned for and attacked, fixed builds (8.5.12, 8.4.27, 8.3.36, 8.2.35) have been out since 2026-10-21, and public proofs of concept circulate. Update PHP, not the CMS, on every internet-facing server and container image, restart PHP-FPM, Apache and all long-running workers, and confirm the running version, because distribution packages can keep the old version string. Isolate anything that cannot be updated from public networks, and check web roots, logs, crashes and unexpected processes, since an update does not remove an attacker who is already in."
  - claim_id: ecd645e617
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "actions[0]"
    kind: frontmatter
    text: "Update the PHP runtime, not the CMS or its plugins, on every internet-facing server and container image to 8.5.12, 8.4.27, 8.3.36 or 8.2.35 or to your distribution's patched package, restart PHP-FPM, Apache and every long-running worker, rebuild images, and confirm the running version, because a distribution backport can keep the old version string; isolate any application that cannot be updated from public networks until it is."
