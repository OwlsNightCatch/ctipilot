    text: "Group-IB and NyxLab report a campaign by an operator they track as k0t that finds exposed FortiGate, FortiWeb and PAN-OS GlobalProtect devices in bulk, exploits FortiWeb CVE-2025-64446 and GlobalProtect CVE-2026-0257 or brute-forces FortiGate logins, downloads each FortiGate configuration and decrypts its stored LDAP, Active Directory and administrator secrets offline with the default FortiOS key, which cannot be seen on the appliance. Group-IB then sees hands-on Active Directory work, remote-management persistence and exfiltration, and victims that later appear on the Qilin and The Gentlemen leak sites; it assesses the operators as probable initial-access brokers but says the link to either group is unconfirmed."
