    entry: 2026-10-22/litellm-1-107-0-pypi-docker-credential-stealer-lookalike
    surface: "headline"
    kind: frontmatter
    text: "LiteLLM 1.107.0 on PyPI and in the official images stole cloud and AI credentials; removing the package does not stop it"
  - claim_id: d0c9722c9a
    entry: 2026-10-22/litellm-1-107-0-pypi-docker-credential-stealer-lookalike
    surface: "summary"
    kind: frontmatter
    text: "On 2026-10-21 LiteLLM 1.107.0, the open-source LLM gateway, shipped with malicious Python startup files in all seven PyPI wheels (live 11:39 to 13:23 UTC) and in the official GHCR and Docker Hub images behind the v1.107.0, latest, main-latest and main-stable tags (11:46 to 14:20 UTC); they run a credential stealer at every Python start and start a background loader that could execute code fetched from an attacker-chosen host, though Socket saw its pointer empty at 13:01 UTC. The maintainers say the attacker used three engineers' stolen GitHub CLI OAuth tokens, apparently read from the logs of an internet-exposed internal LiteLLM deployment, to force-push a release-workflow change past branch protection and build from a look-alike repository. Wiz saw stolen AWS instance-role credentials tested about 4.5 hours after exfiltration; PyPI and the registries removed the release the same day and the maintainers say to pin 1.106.2 or an explicit earlier version."
  - claim_id: f5289e861e
    entry: 2026-10-22/litellm-1-107-0-pypi-docker-credential-stealer-lookalike
    surface: "actions[0]"
    kind: frontmatter
    text: "Find every host, build agent and container that installed litellm 1.107.0 from PyPI between 11:39 and 13:23 UTC on 2026-10-21, or pulled the v1.107.0, latest, main-latest or main-stable tag of the official GHCR or Docker Hub LiteLLM images between 11:46 and 14:20 UTC; treat each as compromised, inspect it with tooling that does not start Python in the affected environment, rebuild it from a reviewed artifact pinned to 1.106.2 or an image digest, and rotate every cloud, Kubernetes, registry, SSH, database and AI-provider credential it could read, including the provider keys stored in a LiteLLM proxy database."
  - claim_id: 2282cfac13
    entry: 2026-10-22/litellm-1-107-0-pypi-docker-credential-stealer-lookalike
    surface: "body"
    kind: cited
    text: "Socket reports that LiteLLM 1.107.0, an open-source LLM gateway, carries malicious Python startup files in all seven wheels, and that Upwind found the same payload in the published images ("
