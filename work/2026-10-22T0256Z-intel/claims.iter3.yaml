  - claim_id: 8ef7cc8d93
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "headline"
    kind: frontmatter
    text: "GitLab's critical patch fixes an unauthenticated CVSS 10.0 RCE in Org-mode rendering; no exploitation reported"
  - claim_id: a41ee1c74b
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "summary"
    kind: frontmatter
    text: "GitLab's critical patch release of 2026-10-21 fixes CVE-2026-110264 (CVSS 3.1 10.0), an integer overflow in regular-expression handling that lets an unauthenticated user run code on a self-managed GitLab server as the git user; GitLab's own detection write-ups place it in the rendering of .org files, which needs only a public project that can hold the payload. Every version from 7.0 before 18.11.13, 19.0.10, 19.1.9, 19.2.9, 19.3.6, 19.4.3 and 19.5.1 is affected, so instances on the 19.4.2, 19.3.5 and 19.2.8 builds that closed the earlier regular-expression flaws still need this release. GitLab does not report exploitation."
  - claim_id: a68c978495
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every self-managed GitLab CE and EE instance to 19.5.1, 19.4.3, 19.3.6 or the backport for its line (19.2.9, 19.1.9, 19.0.10, 18.11.13) now, internet-reachable instances and instances with public projects first; builds 19.4.2, 19.3.5 and 19.2.8 are still affected."
  - claim_id: 03c4034e0f
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "cves[CVE-2026-110264]"
