    text: "Microsoft reports that since at least September 2026 Storm-0940, a China-state aligned actor, has used ARTEX, an open-source multi-agent LLM penetration-testing framework, to automate scanning, password spraying and OAuth-application abuse against hundreds of organizations across many industries including government, reaching privileged cloud access in under three hours in several cases. Expel independently saw the same infrastructure create its own accounts through Okta self-service registration, enrol Okta Verify and sign in to applications, and CrowdStrike and Recorded Future document other actors using the same framework."
