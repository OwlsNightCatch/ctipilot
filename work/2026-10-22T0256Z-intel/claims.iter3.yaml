  - claim_id: ffaa043dc6
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "summary"
    kind: frontmatter
    text: "ConnectWise says it identified unauthorized access to application identities of its Cloud Backup (formerly SkyKick) service; Huntress and Todyl report that from 15 October the app's credential was used to obtain app-only Microsoft Graph tokens in customer Microsoft 365 tenants; Huntress alone confirmed unauthorized sign-ins in 162 tenants by 16 October and saw ConnectWise Cloud Management apps assign themselves directory roles in about 50 tenants and, in two tenants, a scripted Global Administrator self-grant followed by new client secrets planted on apparently random applications. ConnectWise disabled seven application identities and suspended the service on 17 October, but says disabling does not reverse changes already made in a tenant, so every tenant that ever consented a ConnectWise or SkyKick app needs the apps disabled and its application credentials, directory roles and consents reviewed. Microsoft assesses that the China-state aligned actor Storm-0940 is behind it, using the ARTEX agentic-AI framework, and says it attempted sign-ins to more than 2,250 tenants; how the credential was obtained and what data was read are not public."
  - claim_id: 00652d1a93
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "body"
    kind: cited
    text: "ConnectWise says it identified unauthorized access to application identities within its Cloud Backup (formerly SkyKick) environment; on 2026-10-17 it disabled seven application identities, suspended the service, says the shared Cloud Backup credentials are no longer valid, and warns that disabling does not reverse changes already made in a tenant ("
    urls: ["https://www.connectwise.com/company/trust/advisories"]
  - claim_id: 2325956734
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "body"
    kind: cited
    text: "As of ConnectWise's update of 2026-10-19 01:15 UTC, Cloud Backup, SaaS Security and Cloud Management remained suspended with no confirmed restoration time, which also took ConnectWise's SaaS Security monitoring and alerting out of service ("
    urls: ["https://www.connectwise.com/company/trust/advisories"]
  - claim_id: 9e72c5717a
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "body"
    kind: cited
    text: "), and heise reports on 2026-10-21 that ConnectWise has since begun restoring the services step by step over several days ("
    urls: ["https://www.heise.de/news/Angriffe-via-ConnectWise-Cloud-Backup-11495835.html"]
