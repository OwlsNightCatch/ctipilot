    surface: "body"
    kind: cited
    text: "**Exposure:** an environment that installed litellm 1.107.0 from PyPI between 11:39 and 13:23 UTC on 2026-10-21, or pulled the v1.107.0, latest, main-latest or main-stable tag of the official images from GHCR (until about 13:51 UTC) or Docker Hub (until 14:20 UTC); lockfiles, package caches, CI build logs and running image digests show which ("
    urls: ["https://docs.litellm.ai/blog/security-incident-oct-21-2026"]
