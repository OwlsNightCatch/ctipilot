  - claim_id: d3b4a3f866
    entry: 2026-10-22/k0t-fortiweb-fortigate-globalprotect-edge-device-campaign
    surface: "body"
    kind: cited
    text: "Group-IB and NyxLab describe a campaign by an operator they track as k0t (Group-IB lists CryptoFeel as a potential alias, and Scrooge as a likely collaborator and possible alias) that enumerates internet-facing VPN and firewall appliances in bulk through attack-surface search engines and attacks the product directly, mainly Fortinet firewalls and Palo Alto GlobalProtect portals ("
    urls: ["https://www.group-ib.com/blog/stray-cat-network-edge/"]
  - claim_id: b1c766fef5
    entry: 2026-10-22/k0t-fortiweb-fortigate-globalprotect-edge-device-campaign
    surface: "body"
    kind: cited
    text: "A custom script exploits CVE-2025-64446 against FortiWeb, a relative path traversal that lets an unauthenticated attacker run administrative commands (a forged header impersonating the built-in admin account creates a new local administrator), or brute-forces exposed Fortinet devices as a fallback, backing off for 60 seconds on a lockout, the FortiGate default ("
    urls: ["https://www.group-ib.com/blog/stray-cat-network-edge/", "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: 8d04e8b727
    entry: 2026-10-22/k0t-fortiweb-fortigate-globalprotect-edge-device-campaign
    surface: "body"
    kind: cited
    text: "Against PAN-OS it exploits CVE-2026-0257, the GlobalProtect authentication bypass, with a forged authentication-override cookie and then opens an OpenConnect VPN session ("
    urls: ["https://www.group-ib.com/blog/stray-cat-network-edge/"]
  - claim_id: cd0e82c983
    entry: 2026-10-22/k0t-fortiweb-fortigate-globalprotect-edge-device-campaign
    surface: "body"
    kind: cited
    text: "On a compromised FortiGate the tool downloads the configuration and decrypts its secrets locally with the default FortiOS key, the weakness tracked as CVE-2019-6693, recovering LDAP and Active Directory bind and administrator credentials; unless private-data-encryption is set, the device falls back to that known key ("
    urls: ["https://www.group-ib.com/blog/stray-cat-network-edge/"]
  - claim_id: b075c1a7e4
    entry: 2026-10-22/k0t-fortiweb-fortigate-globalprotect-edge-device-campaign
    surface: "body"
    kind: cited
    text: "Group-IB reports more than 70,000 exposed credentials tied to network devices that were not linked to any other actor, FortiBleed included ("
    urls: ["https://www.group-ib.com/blog/stray-cat-network-edge/"]
  - claim_id: f4c7a23881
    entry: 2026-10-22/k0t-fortiweb-fortigate-globalprotect-edge-device-campaign
    surface: "body"
    kind: cited
    text: "After access the operators work by hand with NetExec, Impacket, noPac, Kerbrute, PetitPotam relayed to the certificate service, and Mimikatz, keep access through the OpenConnect VPN, self-enrolling MeshCentral agents, the AdaptixC2 framework and tools such as Atera and AnyDesk, and exfiltrate with Rclone to Wasabi and MEGA ("
    urls: ["https://www.group-ib.com/blog/stray-cat-network-edge/"]
  - claim_id: 5e9c96bdb3
    entry: 2026-10-22/k0t-fortiweb-fortigate-globalprotect-edge-device-campaign
    surface: "body"
    kind: cited
    text: "Group-IB sees victim overlap with the Qilin and The Gentlemen leak sites and assesses the operators are probably initial-access brokers, but says no relationship is confirmed, and it found indications of a possible connection with the FortiBleed cluster alongside negligible overlap in the compromised credentials ("
    urls: ["https://www.group-ib.com/blog/stray-cat-network-edge/"]
