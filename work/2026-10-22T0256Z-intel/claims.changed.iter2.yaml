  - claim_id: c341483052
    entry: 2026-10-22/litellm-1-107-0-pypi-docker-credential-stealer-lookalike
    surface: "summary"
    kind: frontmatter
    text: "On 2026-10-21 LiteLLM 1.107.0, the open-source LLM gateway, shipped with malicious Python startup files in all seven PyPI wheels (live 11:39 to 13:23 UTC) and in the official GHCR and Docker Hub images behind the v1.107.0, latest, main-latest and main-stable tags (11:46 to 14:20 UTC); they run a credential stealer at every Python start and a background loader that executes code fetched from an attacker-chosen host. The maintainers say the attacker used three engineers' stolen GitHub CLI OAuth tokens, apparently read from the logs of an internet-exposed internal LiteLLM deployment, to force-push a release-workflow change past branch protection and build from a look-alike repository. Wiz saw stolen AWS instance-role credentials tested about 4.5 hours after exfiltration; PyPI and the registries removed the release the same day and the maintainers say to pin 1.106.2 or an explicit earlier version."
  - claim_id: f5289e861e
    entry: 2026-10-22/litellm-1-107-0-pypi-docker-credential-stealer-lookalike
    surface: "actions[0]"
    kind: frontmatter
    text: "Find every host, build agent and container that installed litellm 1.107.0 from PyPI between 11:39 and 13:23 UTC on 2026-10-21, or pulled the v1.107.0, latest, main-latest or main-stable tag of the official GHCR or Docker Hub LiteLLM images between 11:46 and 14:20 UTC; treat each as compromised, inspect it with tooling that does not start Python in the affected environment, rebuild it from a reviewed artifact pinned to 1.106.2 or an image digest, and rotate every cloud, Kubernetes, registry, SSH, database and AI-provider credential it could read, including the provider keys stored in a LiteLLM proxy database."
  - claim_id: dbabeb1d8a
    entry: 2026-10-22/litellm-1-107-0-pypi-docker-credential-stealer-lookalike
    surface: "body"
    kind: cited
    text: "Socket reports that LiteLLM 1.107.0, an open-source gateway for large language model providers, carries malicious Python startup files in all seven wheels, and that Upwind found the same payload in the published images ("
    urls: ["https://socket.dev/blog/litellm-compromise"]
  - claim_id: ddd78643ef
    entry: 2026-10-22/litellm-1-107-0-pypi-docker-credential-stealer-lookalike
    surface: "body"
    kind: cited
    text: "A startup hook and a second startup module in the Python library directory run at every Python start without the application importing LiteLLM: the first collects cloud, Kubernetes, CI, registry and database credentials, SSH, GPG and TLS private keys, browser stores, AI-tool credential files, environment variables and, where configured, the credentials saved in a LiteLLM proxy database, and posts an encrypted archive to a look-alike health-check endpoint; the second forks a detached loader that polls a file in a GitHub repository for a domain and would execute Python downloaded from it with no signature or hash check ("
    urls: ["https://socket.dev/blog/litellm-compromise"]
  - claim_id: e2121ef0cc
    entry: 2026-10-22/litellm-1-107-0-pypi-docker-credential-stealer-lookalike
    surface: "body"
    kind: cited
    text: "The payload is not in the git tag: a packaging setting in an untagged commit pulls it into the wheel, and the container build provenance records a source repository named Berri-AI/litellm, one hyphen away from BerriAI/litellm ("
    urls: ["https://socket.dev/blog/litellm-compromise"]
  - claim_id: 9b6b6ded2f
    entry: 2026-10-22/litellm-1-107-0-pypi-docker-credential-stealer-lookalike
    surface: "body"
    kind: cited
    text: "The maintainers say stolen GitHub CLI OAuth tokens of three engineers drove the release: one account started the run, another approved it, a third deleted the workflow records, and an organisation owner's token disabled branch protection so that a change pointing the releaser at the look-alike repository could be force-pushed ("
    urls: ["https://github.com/BerriAI/litellm/issues/47826", "https://docs.litellm.ai/blog/security-incident-oct-21-2026"]
  - claim_id: c22b8247c9
    entry: 2026-10-22/litellm-1-107-0-pypi-docker-credential-stealer-lookalike
    surface: "body"
    kind: cited
    text: "They believe the tokens were read from the logs of an internet-exposed internal LiteLLM deployment, note that Claude Code can embed a user's GitHub CLI OAuth token in a response body that deployments then log, and suspect, unconfirmed, a recently patched vulnerability as the way in; an embargoed fix for a vulnerability due for disclosure on 2026-10-27 is going to enterprise customers through their private registry ("
    urls: ["https://docs.litellm.ai/blog/security-incident-oct-21-2026"]
