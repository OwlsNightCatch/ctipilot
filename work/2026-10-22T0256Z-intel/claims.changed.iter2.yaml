    entry: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
    surface: "summary"
    kind: frontmatter
    text: "Palo Alto Networks' advisory of 2026-10-21 lists every release of PAN-OS 12.2, 12.1, 11.2, 11.1 and 10.2 and of Panorama as affected by the two PHP runtime flaws, CVE-2026-109618 and CVE-2026-109619, with no fixed release and every estimate listed as to be determined. The exposure is the management web interface (the HTTPS web UI and the XML API service); Palo Alto scores the PAN-OS impact as availability only, CVSS-B 8.7 where management is reachable from the internet and 7.1 behind a jump box, against 9.2 for the PHP flaws themselves, and knows of no malicious exploitation against its products. GlobalProtect and the captive portal are not affected."
