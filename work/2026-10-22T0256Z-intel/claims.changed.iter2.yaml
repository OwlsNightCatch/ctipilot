    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "summary"
    kind: frontmatter
    text: "PK Softech AG, the software supplier of Publica and other Swiss pension funds, says unknown attackers used malware to reach part of its IT and that data must be assumed to have left; the Confederation headlined its 2026-10-08 release \"data outflow confirmed\", and the Federal Prosecutor's Office is investigating. Publica, which insures federal administration and ETH domain staff, says personal data of insured persons has presumably left; the Pensionskasse Stadt Zürich says its insured persons' test data was stolen, the Pensionskasse Post and the Bernische Pensionskasse say personal data left, and other funds are still checking. Tamedia reports, and Inside IT and Netzwoche relay, that Akira holds about 100 GB and demands ransom and that the authorities now assume data on practically all current and former federal and federally affiliated staff left; neither the Confederation nor Publica has confirmed the actor, the demand or the scope."
