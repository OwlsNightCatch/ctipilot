    entry: 2026-10-22/litellm-1-107-0-pypi-docker-credential-stealer-lookalike
    surface: "body"
    kind: cited
    text: "**Detection:** in the cloud audit logs of every account the host could reach, a caller-identity check followed by a Bedrock model listing and IAM enumeration, made with an instance-role credential from an address outside your estate ("
    urls: ["https://www.wiz.io/blog/litellm-compromised-steals-credentials"]
  - claim_id: debb620cec
    entry: 2026-10-22/litellm-1-107-0-pypi-docker-credential-stealer-lookalike
    surface: "body"
    kind: cited
    text: "); on hosts, startup hooks and sitecustomize modules in a Python library directory that your tooling did not install, a detached Python process holding a lock file in the temporary directory, and an encrypted archive posted to a health-check path on a domain imitating the project's ("
    urls: ["https://socket.dev/blog/litellm-compromise"]
  - claim_id: 7abfb8bb68
    entry: 2026-10-22/litellm-1-107-0-pypi-docker-credential-stealer-lookalike
    surface: "body"
    kind: cited
    text: "Starting Python or pip in an affected environment can run the payload again, and removing the package directory does not remove the startup files or stop a running loader ("
    urls: ["https://socket.dev/blog/litellm-compromise"]
