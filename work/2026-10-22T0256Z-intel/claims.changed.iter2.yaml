    entry: 2026-10-22/k0t-fortiweb-fortigate-globalprotect-edge-device-campaign
    surface: "body"
    kind: cited
    text: "The stated priorities begin with the United States and Canada, then Europe; the victims seen, mostly in Asia-Pacific and Latin America, reflect where exposed devices are ("
    urls: ["https://www.group-ib.com/blog/stray-cat-network-edge/"]
  - claim_id: 2bc6252024
    entry: 2026-10-22/k0t-fortiweb-fortigate-globalprotect-edge-device-campaign
    surface: "body"
    kind: cited
    text: "CISA lists all three CVEs in KEV, with ransomware use marked known for CVE-2026-0257 and CVE-2019-6693 ("
    urls: ["https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: f98fbff533
    entry: 2026-10-22/k0t-fortiweb-fortigate-globalprotect-edge-device-campaign
    surface: "body"
    kind: cited
    text: "**Exposure:** internet-reachable FortiGate administrator and VPN logins, FortiWeb, and PAN-OS GlobalProtect portals and gateways; every FortiGate is exposed to the offline decryption step once its configuration has been downloaded unless private-data-encryption is enabled with an operator-defined key ("
    urls: ["https://www.group-ib.com/blog/stray-cat-network-edge/"]
  - claim_id: 5476d22769
    entry: 2026-10-22/k0t-fortiweb-fortigate-globalprotect-edge-device-campaign
    surface: "body"
    kind: cited
    text: "The decryption leaves no trace on the appliance, so a patched or cleaned device may already have yielded its secrets ("
    urls: ["https://www.group-ib.com/blog/stray-cat-network-edge/"]
  - claim_id: 57e2ea7d7b
    entry: 2026-10-22/k0t-fortiweb-fortigate-globalprotect-edge-device-campaign
    surface: "body"
    kind: cited
    text: "**Triage:** OpenConnect, MeshCentral, Atera, AnyDesk and Rclone are legitimate tools, so Group-IB advises judging execution context, installation source, operator account, destination and timing rather than tool names ("
    urls: ["https://www.group-ib.com/blog/stray-cat-network-edge/"]
  - claim_id: ab30a0a0bc
    entry: 2026-10-22/k0t-fortiweb-fortigate-globalprotect-edge-device-campaign
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** enable private-data-encryption with an operator-defined key on every FortiGate and rotate the directory and administrator secrets stored in any configuration that may have left the device, because patching or rebuilding does not undo a copy already decrypted; Group-IB also advises investigating lockout events and raising the lockout time against brute force ("
    urls: ["https://www.group-ib.com/blog/stray-cat-network-edge/"]
  - claim_id: 3f97442f3a
    entry: 2026-10-22/k0t-fortiweb-fortigate-globalprotect-edge-device-campaign
    surface: "body"
    kind: derived
    text: "**Detection:** on edge appliances, unexpected local administrator creation, configuration exports, trusted-host changes, repeated authentication failures, lockout-and-retry patterns and administration from unusual source addresses; on directory infrastructure, the NetExec, Impacket and relay pattern against domain controllers; on endpoints, remote-management agents and dual-use tools without an approved owner."
