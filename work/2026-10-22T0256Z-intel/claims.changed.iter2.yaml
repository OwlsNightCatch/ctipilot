    text: "**Defender takeaway:** rotate credentials from a clean machine, because uninstalling reverses nothing and stolen cloud credentials were in use within hours; rebuild from a reviewed artifact, pin images by digest and move to 1.106.2 or an explicit earlier version as the maintainers advise ("
