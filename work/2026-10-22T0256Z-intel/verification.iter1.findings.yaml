  item: "LiteLLM 1.107.0 on PyPI and in the official images stole cloud and AI credentials; removing the package does not stop it"
  url_or_quote: "summary: \"neither it nor the maintainers have said how the build was authorised\"; body: \"the maintainers say they had not yet identified or locked down the method by which the release was published\"; sourcing_note: \"whether the same workflow uploaded the PyPI wheels is not established\"; evidence[]: \"We have not yet identified or locked down the method by which the threat actor published the malicious release.\""
  summary: "Superseded by the cited source itself. https://github.com/BerriAI/litellm/issues/47826 (maintainer status updates, in the body the run saved) says: \"We have identified that the malicious actions were taken through three engineers' GitHub accounts, appearing to be by way of stolen GitHub CLI OAuth tokens. The threat actor used one user's account triggered the `project-releaser` run, and another user's account to approve it.\" and \"Finally, they ran the compromised workflow, pointed at a lookalike repository (`Berri-AI/litellm` instead of `BerriAI/litellm`), which signed and published the poisoned artifacts.\" The vendor incident post https://docs.litellm.ai/blog/security-incident-oct-21-2026 (update 20:30 UTC: \"We believe we have identified the attack chain\") and Wiz carry the same chain (tokens read from logs of an internet-exposed internal LiteLLM deployment; branch protection disabled with an org-owner token). The summary, body paragraph 2, sourcing_note and the stale evidence quote must be rewritten to the maintainers' account (and the affected windows 11:39-13:23 UTC PyPI, 11:46-14:20 UTC images from the vendor post)."
