  item: "Update 2026-10-22T03:47:53Z, first sentence (claim f57ea57b73)"
  url_or_quote: "relaying the paywalled article that Tamedia's Tages-Anzeiger published on 2026-10-20: the Federal Council and the security authorities now assume ... ([Netzwoche, 2026-10-21](https://www.netzwoche.ch/news/2026-10-08/bundespensionskasse-publica-meldet-datenabfluss))"
  summary: "(low confidence) the cited Netzwoche page carries the scope claim ('Update vom 21.10.2026: ... wie der \"Tages-Anzeiger\" (Paywall) berichtet') but gives no date for the Tages-Anzeiger article, so 'published on 2026-10-20' is not on the page the clause cites; the date is true (Tages-Anzeiger dateline 20.10.2026 10:26, fetched this iteration). Fix: add the Tages-Anzeiger citation to that clause or drop the date."
- code: F8
  category: needs-more-research
  section: k0t-fortiweb-fortigate-globalprotect-edge-device-campaign
  item: "Exposure caveat on private-data-encryption (claim a3eb132c8f) and the matching clause in actions[0]"
  url_or_quote: "which Fortinet warns can cause install errors and split-brain on FortiManager-managed or HA FortiGates"
  summary: "(low confidence) FG-IR-19-007 (fetched) continues the same note: 'This issue is fixed in FortiManager versions 6.2.7 and above and in FortiGate versions 6.2.6, 6.4.4, 6.6.0 and above.' The entry drops the fixed-in versions, so the caveat reads as a current risk on every FortiGate and may deter a defender from enabling the one control the entry urges; add the fixed-in versions (or say the caveat applies only to older FortiOS/FortiManager builds)."
- code: F8
  category: needs-more-research
  section: connectwise-cloud-backup-skykick-m365-app-credential-abuse
  item: "main analysis, ConnectWise advisory snapshot, and Update 2026-10-22T03:46:23Z restoration and attribution sentences"
  url_or_quote: "As of ConnectWise's update of 2026-10-19 01:15 UTC, Cloud Backup, SaaS Security and Cloud Management remained suspended with no confirmed restoration time"
  summary: "(low confidence) the ConnectWise Trust Center is readable through the Wayback copy https://web.archive.org/web/2026id_/https://www.connectwise.com/company/trust/advisories (fetched this iteration, updates through 2026-10-22 00:45 UTC), yet the entry keeps the 2026-10-19 snapshot and takes the restoration start second-hand from heise. The vendor's own updates say restoration began in controlled phases on 2026-10-21 (12:45 and 19:00 UTC), that on 2026-10-21 22:00 UTC ConnectWise itself states 'it appears that a China state-aligned group was responsible' based on threat intelligence shared by Microsoft, and that updates run twice daily from 2026-10-22. The first-party attribution acknowledgement and restoration status belong in the update section (and the run-record gap note 'rests on heise' overstates the blockage)."
- code: F11
  category: editorial-advisory
  section: litellm-1-107-0-pypi-docker-credential-stealer-lookalike
  item: "Detection, 'an encrypted archive posted to a look-alike health-check endpoint' (claim bc2f9f7d80)"
  url_or_quote: "an encrypted archive posted to a look-alike health-check endpoint ([Socket, 2026-10-21](https://socket.dev/blog/litellm-compromise))"
  summary: "(low confidence, advisory) Socket says the archive is POSTed to a /healthcheck URL 'Despite the URL's health-check wording'; it never calls the domain a look-alike of LiteLLM. Wiz ('attacker controlled, impersonating LiteLLM infrastructure') and Aikido ('not affiliated with the legitimate LiteLLM project') say the domain impersonates the project, and neither is cited on that clause. The phrase reads either way; say 'a health-check-style endpoint on an attacker-controlled domain that imitates the project' with the Wiz or Aikido citation if the impersonation is meant."
