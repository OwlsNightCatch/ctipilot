    publisher: Huntress (running analysis, updates of 2026-10-17 and 2026-10-19)
    date: '2026-10-19'
    role: primary
  discovery_trace: 'first seen at: heise-sec feed https://www.heise.de/security/feed.xml (item ''Lieferkettenangriff
    auf Backup-Dienst trifft Hunderte M365-Tenants'', 2026-10-21T14:27) -> primary: Huntress https://www.huntress.com/blog/vendor-credential-enables-unauthorized-access
    (read in full). ConnectWise advisory https://www.connectwise.com/company/trust/advisories returned HTTP 403
    on direct, trafilatura, jina and WebFetch, so the restoration status rests on heise''s reading of it.'
  summary: heise reports on 2026-10-21 that Huntress, which first confirmed unauthorized sign-ins in 162 tenants
    (as of 2026-10-16), later found almost 1,000 Entra tenants with sign-in activity from the single hosting-provider
    address tied to the ConnectWise Cloud Backup credential, over 300 of them successful; in tenants without a ConnectWise
    service principal the attempts failed because the application was not present. Huntress's own update says it
    reviewed application sign-ins across more than 10,000 tenants with ConnectWise applications in the logs it can
    see, and that it also received outside reports, not independently verified, of similar activity including apparently
    hands-on activity. The true number of affected tenants is unknown because ConnectWise has no view into customer
    tenants. heise adds that failed attempts began on 13 October, successful sign-ins from 15 October, that application
    sign-ins of this kind are not covered by MFA or user-facing access restrictions, and that ConnectWise has started
    to restore the suspended services step by step over several days (heise's reading of the vendor advisory, which
    could not be fetched here). The store entry carries the 162-tenant count and the targeted second wave against
    16 policy, national-security, trade and critical-minerals tenants; the new facts are the near-1,000 targeted
    and over-300 successful figures, the 10,000-tenant review base and the start of restoration.
  region_nexus: global; any public body or municipality whose Microsoft 365 tenant ever consented a ConnectWise
    or SkyKick application, directly or through its MSP
  primary_sector_nexus: indirect (MSP-managed Microsoft 365 tenants; Huntress says the second wave probed policy
    and national-security tenants)
