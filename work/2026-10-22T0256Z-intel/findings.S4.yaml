    attribution: Cyberattaque.org
    source_url: https://www.cyberattaque.org/les-sites-des-prefectures-coupes-en-urgence-apres-la-decouverte-dune-faille-critique/
  extended_notes: 'Detection/hardening angle for public bodies: the takedowns were decided on the pre-announcement,
    before any patch existed, which is the decision a Swiss body would face next time. The CERT-FR temporary measures
    are unqualified and cover only part of the attack surface; the PHP team says only patching helps. Hosting-provider
    and distribution schedules differ from php.net, so ask each provider for its date. Source weakness: the prefecture/ANSSI
    claim comes from two aggregator-class sources that name no primary; treat it as reported, not confirmed.'
