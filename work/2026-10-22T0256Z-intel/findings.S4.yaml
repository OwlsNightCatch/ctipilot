    attribution: Tages-Anzeiger (lead)
    source_url: https://www.tagesanzeiger.ch/akira-gruppe-alt-bundesraete-von-hacker-angriff-betroffen-181002064025
  extended_notes: 'Source independence: Netzwoche and ICTjournal share the same author team and both cite Tages-Anzeiger;
    they are one chain, not two. The store entry already carries Tages-Anzeiger''s 2026-10-20 report (about 100
    GB, well over 100,000 people, Akira ransom demand) and the Intelligence Service forgoing operations; this update
    adds only the scope assumption attributed to the Federal Council and security authorities, the 7 October inspection
    and the task force. Ransomware.live has no PK Softech listing (searchvictims/pksoftech returned 404 on 2026-10-22),
    so the Akira claim still has no leak-site corroboration. Defender takeaway if the scope holds: any Confederation
    or federally affiliated employer, and any cantonal body that exchanges payroll or HR data with federal staff,
    should treat AHV number, salary and employer as known to criminals. Exposure check: ask Publica / the fund in
    writing whether the body''s staff are in the affected set. Detection: help-desk and payroll call-back procedures
    for requests quoting AHV number or salary; investment-fraud and vishing reports from staff.'
- title: 'ConnectWise Cloud Backup (SkyKick): Huntress counts almost 1,000 Entra tenants with sign-in activity from
    the attacker''s address and over 300 successful, from more than 10,000 tenants reviewed; heise says ConnectWise
    has begun restoring the services'
  sources:
  - url: https://www.heise.de/news/Angriffe-via-ConnectWise-Cloud-Backup-11495835.html
    publisher: heise online
    date: '2026-10-21'
    role: primary
