    two-page-image scan was read page by page) -> corroborating: https://www.dailypost.co.uk/news/north-wales-news/welsh-firms-password1-test-2-34791209'
  summary: On 2026-10-20 the UK ICO published reprimands, dated 14 October 2026, of Ogi Networks Limited (ONL),
    a Cardiff managed-IT provider, and of the Local Government Data Unit - Wales (Data Cymru), a Welsh local-government
    company, over a ransomware attack of 1 November 2024. The ONL reprimand, whose PDF has no text layer and was
    read from page images, says initial access came through a FortiClient SSL-VPN connection under the account 'Test2',
    which ONL created on 13 January 2012 for Data Cymru, which was still active or had been reactivated 12.5 years
    later, and whose password 'Password1' PureCyber, the incident responder, judged likely compromised by password
    spraying; activity on that account dates from 20 September 2024 and on a second test account, 'testtest', from
    24 September. The account was a basic domain user, the local administrator accounts on the three systems the
    attacker emptied (a domain controller, a file server and an SQL server) shared one password so that hashes taken
    from one could be used on the others, 42 GB were exfiltrated and 182.7 GB encrypted on the file and SQL servers,
    and personal data of 3,300 people, most of them children, was taken. The ICO found ONL infringed Article 32(1)(b)
    and (d) UK GDPR for lacking account auditing and password-strength rules for accounts it created, notes that
    Data Cymru retained control of the network and that neither party had made clear who audits accounts in the
    outsourced arrangement, and records that SSL-VPN access now runs through Microsoft Entra ID with MFA. The attack
    is two years old; what is new is the regulator's root-cause finding on a public-sector supplier chain.
  region_nexus: United Kingdom (Wales); transferable to Swiss communal and cantonal bodies that outsource network
    and account administration to a managed-service provider
