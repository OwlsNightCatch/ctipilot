  extended_notes: 'Update-record candidate rather than a new entry. Exposure/hunt reminder carried by the existing
    entry still applies: Entra sign-in logs expire after 7 days without extended licensing (30 days with P1/P2),
    so a tenant that has not yet exported them may have lost the 15 October evidence; heise and Huntress both say
    the check cannot be reduced to one indicator. Restoration raises a decision for MSP-managed tenants: do not
    re-consent or re-enable the ConnectWise applications until the credentials, directory roles and consent grants
    have been reviewed.'
