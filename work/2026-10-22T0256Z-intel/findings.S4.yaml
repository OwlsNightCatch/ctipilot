    -> primary for the fix facts: CERT-FR alert https://www.cert.ssi.gouv.fr/alerte/CERTFR-2026-ALE-014/. No ANSSI,
    Interior-ministry or Meteo-France statement was reachable; WebSearch for one returned nothing on-point.'
  summary: 'Next reports on 2026-10-21 that, after CERT-EU advised isolating Internet-facing PHP applications from
    public networks if immediate patching was not possible, official European sites went into precautionary maintenance,
    naming the French CNIL, the Dutch parliament and a number of Finnish public services (its evidence for the last
    two is a social-media roundup it links). FrenchBreaches and Cyberattaque.org report that the websites of the
    French prefectures, including the Paris police prefecture, were put into preventive maintenance at ANSSI''s
    request through the Interior ministry, and that impots.gouv.fr (partly, with personal areas still reachable),
    Météo-France, Santé publique France and the City of Paris did likewise; neither links a primary statement, both
    say no attack on these sites is confirmed, and Cyberattaque.org says the shutdown was decided to avoid leaving
    servers exposed between disclosure and patching. Next adds that PHP published the fixes slightly ahead of schedule
    as 8.5.12, 8.4.27, 8.3.36 and 8.2.35, decided to backport sources for the unsupported 7.4, 8.0 and 8.1 (to be
    compiled by the user), says no protection short of patching is worth relying on, that exploits of the flaws
    had circulated for hours, and that Cloudflare reported early attack vectors. CERT-FR''s updated alert lists
    every PHP version before 8.2.35, 8.3.36, 8.4.27 and 8.5.12, plus all 5.x to 8.1.x, as affected, and gives two
    temporary measures it has not qualified: disabling session.upload_progress (which narrows only one of the two
    flaws) and blocking or monitoring multipart Content-Type requests at a WAF. Contradiction: FrenchBreaches ties
    the City of Évry-Courcouronnes'' suspension of all online procedures to the PHP flaws, while Cyberattaque.org
    says the city spoke of a suspected cyberattack and nothing links it to them. This item is the public-sector
    angle of the PHP entry; the patched-version and exploitation facts overlap S1.'
