  summary: 'Netzwoche updated its running PK Softech story on 2026-10-21, and ICTjournal published the same update
    in French, relaying the paywalled body of Tages-Anzeiger''s (Tamedia) article of 2026-10-20, of which the store
    entry already carries the lead facts: the Federal Council and the security authorities now assume that data
    on practically all current and former employees of the Confederation and of federally affiliated bodies were
    taken, among them federal judges, former Federal Council members (the sitting members are said to be spared),
    intelligence-service staff, elite soldiers and cleaning staff. According to the paper, an on-site inspection
    at PK Softech on 7 October established the outflow of security-relevant federal data. The records reportedly
    hold name, birth date, AHV number, address, salary, phone number and e-mail address, partly bank details, marital
    status and partner and children, and show each person''s employer, including for staff working under a cover
    identity for fedpol or the Federal Intelligence Service; the Confederation is said to have set up a task force
    because of the risk to those staff. Tages-Anzeiger names Akira as the attacker, which it says now demands ransom
    and threatens to publish or sell the data, and adds that Publica''s letter to its insured persons mentions neither
    Akira nor the ransom demand. All of this is Tages-Anzeiger''s reporting from unnamed sources, relayed by one
    publisher family; the Confederation, Publica and PK Softech have not confirmed the actor, the ransom demand
    or the scope, and the official line remains the release of 2026-10-08. The facts that are new against the store
    entry are the assumed scope (practically all federal and federally affiliated staff, judges and former Federal
    Council members included), the 7 October on-site inspection and the task force.'
  region_nexus: 'Switzerland: the federal administration, the federal courts, the security authorities (Federal
    Intelligence Service, fedpol) and federally affiliated bodies'
