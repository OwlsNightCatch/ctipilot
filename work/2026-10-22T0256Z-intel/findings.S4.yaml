  - Zeabur
  entity_keys: []
  new_entities:
  - key: incident:zeabur-platform-database-breach-2026-10
    type: incident
    name: Zeabur platform database breach (October 2026)
    aliases:
    - Zeabur October 2026 security incident
    summary: 2026-10-14/15 intrusion into Zeabur's shared clusters and GCP dedicated servers with plaintext admin
      credentials; the platform database holding about 3.2 million environment variables for 321,810 accounts was
      read (Zeabur report 2026-10-19); follows a breach in August 2026 and precedes Zeabur's announced shutdown.
  - key: incident:railway-environment-variable-exposure-2026-10
    type: incident
    name: Railway environment-variable exposure (October 2026)
    aliases:
    - Railway security disclosure October 21st
    summary: Railway disclosed on 2026-10-21 that an unauthorized third party may have accessed encrypted customer
      environment variables and decrypted some; Railway links it to a series of attacks on platform companies aimed
      at AI inference providers.
  verification: MULTI-SOURCE
  confidence: HIGH
  novelty: new
  evidence:
  - quote: On October 14–15, 2026, an attacker used leaked Zeabur internal credentials to break into the shared
      cluster, some Dedicated Servers, and Zeabur internal systems, and eventually read the platform database.
    attribution: Zeabur
    source_url: https://zeabur.com/blogs/october-2026-security-incident
  - quote: long-lived admin credentials were stored in plaintext and could be used from the public internet
    attribution: Zeabur
    source_url: https://zeabur.com/blogs/october-2026-security-incident
  - quote: steal over 3.2 million environment variable records and information for 321,810 accounts
    attribution: BleepingComputer
    source_url: https://www.bleepingcomputer.com/news/security/zeabur-shutting-down-after-second-security-breach-in-two-months/
  - quote: an unauthorized third party may have accessed encrypted environment variables and, for some of them,
      obtained the decrypted contents
    attribution: Railway
    source_url: https://blog.railway.com/p/security-disclosure-wednesday-october-21st
  - quote: We believe this is part of a series of attacks recently targeting platform companies with the aim of
      compromising AI inference providers.
    attribution: Railway
    source_url: https://blog.railway.com/p/security-disclosure-wednesday-october-21st
  extended_notes: 'Exposure: any application deployed on either platform holds its API keys, database and registry
    credentials in the compromised store. Zeabur says projects that moved variables to their own dedicated server
    after August were outside the platform-database read, though compromised hosts could still expose them. Post-incident
    check: replacing a variable on the platform is not enough, the old credential must be revoked at the service
    that issued it, then logs of those services reviewed for use since 14 October (Zeabur) or 21 October (Railway).
    For a Swiss body the relevant question is whether a web agency or supplier hosts a public-sector application
    on either platform. Detection: sign-in and API-usage logs of upstream AI-provider accounts and databases for
    use from unfamiliar infrastructure after the leak window; cloud audit logs for new SSH keys and nodes added
    to platform networks.'
  borderline: true
  borderline_reason: two supplier-side secret-store breaches in a week with a vendor-asserted wider campaign, but
    no Swiss or public-sector customer is named; relevance depends on supplier hosting choices
