    source_url: https://www.dailypost.co.uk/news/north-wales-news/welsh-firms-password1-test-2-34791209
  extended_notes: 'Detection concept (telemetry class): VPN and authentication logs showing a long-dormant or generic-named
    account (test, temp, svc) that suddenly authenticates over SSL VPN, repeated single-password attempts across
    many accounts from one source (password spraying), then SMB or remote-admin authentications from that account''s
    host to servers using a shared local administrator credential. Hardening levers named by the ICO and the ONL
    remediation: periodic account reviews for customer-controlled directories with a named owner on each side of
    an outsourcing contract, deny-list or minimum-length password rules that also cover legacy accounts, unique
    local administrator passwords (LAPS-style), MFA on every remote-access path. The post-patch check does not apply
    (not a vulnerability). Not Swiss and two years old, so below the usual bar unless the main agent wants an outsourcing-hygiene
    item for communal IT.'
  lookback: true
  borderline: true
  borderline_reason: regulator-primary root-cause finding on a 2024 public-sector supplier incident; no new technique
    and no Swiss nexus, so the case for inclusion is the outsourced-account-hygiene lesson only
- title: 'Developer platforms Zeabur and Railway lose customer environment variables within a week: Zeabur''s platform
    database was read through plaintext admin credentials and unrotated tokens, and Railway says it was hit in a
    series of attacks on platform companies aimed at AI inference providers'
  sources:
  - url: https://blog.railway.com/p/security-disclosure-wednesday-october-21st
    publisher: Railway (security disclosure)
    date: '2026-10-21'
    role: primary
  - url: https://zeabur.com/blogs/october-2026-security-incident
    publisher: Zeabur (preliminary incident report)
    date: '2026-10-19'
    role: primary
  - url: https://www.bleepingcomputer.com/news/security/zeabur-shutting-down-after-second-security-breach-in-two-months/
    publisher: BleepingComputer
    date: '2026-10-20'
    role: corroborating
  - url: https://frenchbreaches.com/blog/railway-victime-dune-cyberattaque-des-cles-api-et-acces-aux-bases-de-donnees-menaces
    publisher: FrenchBreaches blog
    date: '2026-10-22'
    role: corroborating
  discovery_trace: 'first seen at: frenchbreaches blog feed https://frenchbreaches.com/blog/feed.xml (item ''Railway
    victime d''une cyberattaque...'', 2026-10-22T01:16 +0200) and bleepingcomputer feed https://www.bleepingcomputer.com/feed/
    (item ''Zeabur shutting down after second security breach in two months'', 2026-10-20) -> primary: Railway https://blog.railway.com/p/security-disclosure-wednesday-october-21st
    and Zeabur https://zeabur.com/blogs/october-2026-security-incident (both read in full).'
  summary: Zeabur's preliminary report says that on 14-15 October 2026 an attacker used leaked internal credentials,
    stored in plaintext in a private configuration repository and including cluster admin tokens with no expiry
    that were reachable from the public internet, to reach its shared cluster in nine regions and 101 GCP dedicated
    servers, add an SSH key and a node to the internal network, and read the platform database; BleepingComputer
    counts over 3.2 million environment-variable records and 321,810 accounts, and Zeabur says the credentials were
    not covered by the rotation after its August breach and that it will shut down from 1 December. The attacker
    ran commands in 865 database services, starting with a few new-api/one-api instances, then n8n at scale and
    PostgreSQL tables, and Zeabur says how the credentials were obtained cannot be confirmed (it hypothesises a
    link to a GitHub App private key leaked in August). Railway disclosed on 2026-10-21 that an unauthorized third
    party may have accessed encrypted environment variables and for some obtained the decrypted contents (API keys,
    database and registry credentials), paused all deployments, and said it believes this is part of a series of
    attacks recently targeting platform companies with the aim of compromising AI inference providers; it has told
    those upstream providers to revoke keys. The Railway link to a wider series is Railway's own belief, with no
    actor and no other victim named by Railway, and Zeabur's report states no objective, so the two incidents are
    not shown to be one campaign. Railway says its impact may be limited to a subset of users, and the scope is
    not yet confirmed.
  region_nexus: global developer-platform customers; Swiss nexus only where a public body or its web agency deploys
    on Railway or Zeabur
  primary_sector_nexus: indirect (technology suppliers holding customers' secrets)
  sector: technology
  cves: []
  techniques:
  - T1078.004
  - T1552.001
  - T1098.004
  - T1021.004
  affected_products:
