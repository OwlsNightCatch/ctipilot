- code: F4
  category: hallucinated-fact
  section: body
  item: "2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619"
  url_or_quote: "Sansec says the leaked worker memory can hold passwords ... though it assigns the disclosure to CVE-2026-109618 and the fatal-backtrace path to CVE-2026-109619, the reverse of the PHP advisories' assignment used here"
  summary: "Half of the stated reversal is false. Sansec's table puts 'Fatal-error backtrace use-after-free' under CVE-2026-109619 (https://sansec.io/research/php2shell), and the PHP advisory GHSA-6wmf-4rv5-p3rp (CVE-2026-109619) carries 'PHP 8.5 fatal error backtrace: confirmed'; GHSA-w8hw-w9fx-j79w (CVE-2026-109618) has no backtrace, upload-progress or memory-disclosure text (raw page checked). Only the upload-progress / memory-disclosure assignment differs (Sansec and VulnCheck: 109618; PHP: 109619). Introduced by the iteration-1 F9 remediation. Fix: say Sansec assigns the upload-progress memory disclosure to CVE-2026-109618 while the PHP advisories list memory disclosure and session upload progress under CVE-2026-109619, and that both put the fatal-backtrace path under 109619."
- code: F3
  category: claim-not-supported
  section: body
  item: "2026-10-22/litellm-1-107-0-pypi-docker-credential-stealer-lookalike"
  url_or_quote: "**Exposure:** ... lockfiles, package caches, CI build logs and running image digests show which ([LiteLLM, 2026-10-21](https://docs.litellm.ai/blog/security-incident-oct-21-2026))"
  summary: "(low confidence) The cited LiteLLM post says only 'You can check with pip show litellm' and names the affected image digest; the list 'lockfiles, caches, build logs, container layers, and running image digests' is Socket's (https://socket.dev/blog/litellm-compromise, 'Contain Affected Environments'). Add the Socket citation to this clause or trim the list to what the vendor post says."
- code: F3
  category: claim-not-supported
  section: body
  item: "2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse"
  url_or_quote: "Microsoft says ARTEX accelerated the abuse of compromised applications already granted access to Microsoft 365 tenants, and Expel adds that it is not a vulnerability and only speeds up familiar techniques such as password spraying and OAuth-application abuse ([Expel, 2026-10-21](https://expel.com/...))"
  summary: "(low confidence) The attribution split is now right (Microsoft: 'Storm-0940's use of ARTEX accelerated the speed of compromised application abuse ... through applications that had already been granted access'; Expel: 'ARTEX isn't a vulnerability, so there's nothing to patch'), but the sentence ends with the Expel link only, so the Microsoft half carries no citation in its clause. Add the Microsoft link."
