  summary: "(low confidence) The advisory page reads 'rbeuque74 published GHSA-862f-55f5-vmvw Oct 20, 2026' (relative-time datetime 2026-10-20T12:49:39Z). The incident date is 2026-10-19, the citation date is the publication date, so the label is one day early (not a timezone artifact). Facts in the clauses are supported. Fix the source date and the six inline labels."
- code: F5
  category: missing-citation
  section: body
  item: "2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse"
  url_or_quote: "Microsoft assesses the same actor was behind the ConnectWise Cloud Backup application-credential abuse (Microsoft, 2026-10-21](https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/))."
  summary: "Malformed markdown link: the opening '[' is missing (the file has 16 '[' against 17 '](' ), so the clause renders as literal text with a stray URL and no working citation. The claim itself is supported by the Microsoft post ('Microsoft assesses that Storm-0940 was responsible for the recently disclosed ConnectWise supply chain compromise'). Fix: '([Microsoft, 2026-10-21](https://...))'."
- code: F18
  category: action-item-discipline
  section: actions
  item: "2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release"
  url_or_quote: "On every PAN-OS firewall and Panorama appliance, restrict the management interface (the MGT port and any dataplane interface that carries a management profile) to a jump box or trusted internal addresses today ..."
  summary: "(low confidence) Fails 10b(d): the in-window entry 2026-10-15/cve-2026-0322-pan-os-management-interface-code-injection already carries 'Restrict the management interface of every PA-Series, VM-Series and Panorama to a jump box or trusted internal addresses now, then upgrade each to the fixed build of its train'. The aggregated Action Items list would show the same task twice. An empty actions[] is acceptable here; the PHP-specific delta (no fixed release yet, Threat Prevention coverage conditions) is already in the body."
- code: F11
  category: editorial-advisory
  section: summary
  item: "2026-10-22/litellm-1-107-0-pypi-docker-credential-stealer-lookalike"
  url_or_quote: "a credential stealer at every Python start and a background loader that executes code fetched from an attacker-chosen host"
  summary: "(low confidence) Reads as an observed capability. Socket: at 13:01:44 UTC 'the GitHub pointer returned HTTP 200 with an empty body. That response prevents the loader from reaching its download stage'; Wiz: 'dormant C2 capability', domain.txt 'never populated beyond initial test values'. The body hedges ('would execute'), the summary and headline do not; a responder scoping exposure wants 'no remote code delivery observed, credential theft certain'."
