  - claim_id: a418933224
    entry: 2026-10-22/k0t-fortiweb-fortigate-globalprotect-edge-device-campaign
    surface: "actions[0]"
    kind: frontmatter
    text: "On every FortiGate (FortiOS 5.6.11, 6.0.7, 6.2.1 or later; check the FortiManager and HA note in Fortinet's FG-IR-19-007 first where it applies), enable private-data-encryption with an operator-defined key, and for any device that was internet-reachable with a brute-forceable administrator login or an unpatched exposed service, treat the LDAP and Active Directory bind and administrator credentials stored in its configuration as known to the attacker and rotate them, bind accounts first."
  - claim_id: 5c145f8ae7
    entry: 2026-10-22/k0t-fortiweb-fortigate-globalprotect-edge-device-campaign
    surface: "body"
    kind: cited
    text: "Group-IB and NyxLab describe a campaign by an operator they track as k0t (Group-IB lists CryptoFeel as a potential alias, and Scrooge as a likely collaborator and possible alias) that enumerates internet-facing VPN and firewall appliances in bulk and attacks the product directly, mainly Fortinet firewalls and Palo Alto GlobalProtect portals ("
    urls: ["https://www.group-ib.com/blog/stray-cat-network-edge/"]
  - claim_id: 35c9f59df2
    entry: 2026-10-22/k0t-fortiweb-fortigate-globalprotect-edge-device-campaign
    surface: "body"
    kind: cited
    text: "On a compromised FortiGate the tool downloads the configuration and decrypts its secrets locally with the default FortiOS key, the weakness tracked as CVE-2019-6693, recovering LDAP and Active Directory bind and, Group-IB says, administrator credentials, although Fortinet's advisory excludes the administrator's password and says FIPS-CC devices are not impacted; unless private-data-encryption is set, the device falls back to that known key ("
    urls: ["https://www.group-ib.com/blog/stray-cat-network-edge/", "https://fortiguard.fortinet.com/psirt/FG-IR-19-007"]
  - claim_id: aa62d31f81
    entry: 2026-10-22/k0t-fortiweb-fortigate-globalprotect-edge-device-campaign
    surface: "body"
    kind: cited
    text: "After access the operators work by hand with NetExec, Impacket, Kerbrute, relayed PetitPotam and Mimikatz, keep access through OpenConnect, MeshCentral agents, AdaptixC2, Atera and AnyDesk, and exfiltrate with Rclone to Wasabi and MEGA ("
    urls: ["https://www.group-ib.com/blog/stray-cat-network-edge/"]
  - claim_id: a3eb132c8f
    entry: 2026-10-22/k0t-fortiweb-fortigate-globalprotect-edge-device-campaign
    surface: "body"
    kind: cited
    text: "); every FortiGate except FIPS-CC models is exposed to the offline decryption step once its configuration has been downloaded unless private-data-encryption, available from FortiOS 5.6.11, 6.0.7 and 6.2.1 and off by default, is enabled with an operator-defined key, which Fortinet warns can cause install errors and split-brain on FortiManager-managed or HA FortiGates ("
    urls: ["https://www.group-ib.com/blog/stray-cat-network-edge/", "https://fortiguard.fortinet.com/psirt/FG-IR-19-007"]
