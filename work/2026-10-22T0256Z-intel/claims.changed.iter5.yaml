claims:
  - claim_id: 12bdc04dad
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "summary"
    kind: frontmatter
    text: "PK Softech AG, the software supplier of Publica and other Swiss pension funds, says unknown attackers used malware to reach part of its IT and that data must be assumed to have left; the Confederation headlined its 2026-10-08 release \"data outflow confirmed\", and the Federal Prosecutor's Office is investigating. Publica, which insures federal administration and ETH domain staff, says personal data of insured persons has presumably left; the Pensionskasse Stadt Zürich says its insured persons' test data was stolen, the Pensionskasse Post and the Bernische Pensionskasse say personal data left, and other funds are still checking. Tamedia reports that Akira holds about 100 GB and demands ransom and that the authorities now assume data on practically all current and former federal and federally affiliated staff left, which Inside IT relays for the actor and the demand and Netzwoche for the demand and the scope; neither the Confederation nor Publica has confirmed the actor, the demand or the scope."
  - claim_id: 4e8083216e
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "body"
    kind: cited
    text: "GitLab's ad-hoc critical patch release of 2026-10-21 fixes CVE-2026-110264 (CVSS 3.1 10.0), an integer overflow while compiling a specially crafted regular expression that could let an unauthenticated user execute code on the GitLab server ("
    urls: ["https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-5-1-released/"]
