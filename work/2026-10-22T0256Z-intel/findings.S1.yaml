  extended_notes: |-
    SUGGESTED TREATMENT: update-of 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619. The prior entry is priority high and still says 'no-patch' with the fix scheduled; the fix shipped, so cves[].status moves to patch-available (plus exploited-attempts wording), fixed becomes 8.5.12 / 8.4.27 / 8.3.36 / 8.2.35, the 'affected' text can drop the PHP 5 versus 5.4 disagreement (sources now state: affected = every release before the fixed build on 8.2 to 8.5, all older branches unfixed upstream; code dates to 5.4.0 per Calif). The sourcing_note claim that neither CVE is in CVE.org or EUVD is stale: EUVD carries EUVD-2026-107260 (CVE-2026-109618) and EUVD-2026-107265 (CVE-2026-109619), both CVSS 4.0 9.2, affected 8.2.* <8.2.35, 8.3.* <8.3.36, 8.4.* <8.4.27, 8.5.* <8.5.12. Suggested priority: critical with an immediate_action to update the PHP runtime (not the CMS) on every internet-facing host today and restart workers; the bar is met by an unauthenticated RCE in the runtime under most public web estates, vendor and national-authority 'patch now' language (NCSC-CH, NCSC-NL, CERT-EU, UK NCSC says update or take offline), and attack traffic from three independent telemetry owners. Evidence discipline: exploitation ATTEMPTS and scanning are reported by Cloudflare, watchTowr and VulnCheck; nobody reports a confirmed compromise; the PHP Foundation found no functional public PoC at disclosure and VulnCheck found a very small number with the correct mechanism. Suggested Admiralty: reliability A (PHP and national authorities), credibility 1 for the release facts, exploitation wording 'attempts observed'.
    EXPOSURE (sourced): any PHP installation serving web requests: Apache mod_php (highest risk, demonstrated pre-application), PHP-FPM, php-cgi, FrankenPHP, LiteSpeed/LSAPI. Default configurations are exploitable (Calif: 'always exploitable under default configurations'; session upload progress is on by default and needs no session_start()). Updating the CMS or a plugin does not change exposure. Check the running version on the server, not the package manager (distribution backports keep the old version string), restart Apache/PHP-FPM/long-running workers, and rebuild container images; the official Docker images were reported fixed by 17:40 UTC (Geniar's tracker, not cited). Appliances and products that bundle PHP need the vendor update (NCSC-NL says the software inventory in its repository is still being filled in). VulnCheck: 2,608,039 internet-facing PHP hosts, 56.56% advertise a PHP below the fixed build, 43.44% hide the version; about 42% sit on end-of-life branches. Unit 42 (Cortex Xpanse): over 22.6 million potentially vulnerable exposed instances (different method, not comparable).
    TEMPORARY MITIGATIONS (PHP's own list; none complete): session.upload_progress.enabled=0 set in php.ini, the FPM pool or the server config and every worker restarted (not ini_set or .user.ini); memory_limit=-1 enforced administratively (php_admin_value) with a cgroup/container memory boundary, never RLIMIT_AS or RLIMIT_DATA; low post_max_size (8M, or 32M where uploads are needed) plus frontend limits on decoded size, field count, multipart parts, headers per part and nesting, including requests with no usable Content-Length; fatal_error_backtraces=0 on PHP 8.5; block multipart/form-data at the proxy where uploads are not needed (breaks uploads and some forms). Sansec warns memory_limit=-1 lets one request use all server memory. Cloudflare deployed default WAF rules for free and paid plans from 2026-10-21 03:02 UTC and says patching still comes first.
    DETECTION CONCEPTS (telemetry class first): (1) web or reverse-proxy access logs: multipart/form-data POSTs to PHP endpoints (index.php in the canary data) with chunked or length-less bodies, huge numbers of empty file parts with deeply nested field names, a flood of repeated headers inside a part, then HTTP 500 or 502 and worker restarts from the same client; anomalous Set-Cookie PHPSESSID values (oversized or malformed, the memory-disclosure channel) on responses to unauthenticated requests; requests that try to read a session file through a file-disclosure path with php://filter after a PHP_SESSION_UPLOAD_PROGRESS upload (VulnCheck's failed web-shell attempt). (2) PHP/Apache/FPM error logs: memory-limit fatals, 'Allowed memory size' errors, child exits and segmentation faults clustered per client (Aikido, Corelight's PHP_Crash_Sequence idea). (3) process-creation telemetry: apache2, httpd, nginx, php-fpm*, lsphp, php-cgi parents spawning sh/bash/dash with -c and id, whoami, curl, wget, base64 -d or /dev/tcp patterns, interpreters (python -c, perl -e, php -r), or downloaders (Elastic's convergent-behaviour rules). (4) file telemetry: new or modified .php/.phtml under web roots and upload directories, new files in the PHP session save path, new admin accounts in the CMS. (5) network sensors: Corelight published Zeek and Suricata detections (multipart header flood, large form keys, serialized-structure repetition patterns, advertised-PHP-version inventory); Elastic and a third-party Microsoft Defender hunting pack exist. NCSC-CH lists them (updated 2026-10-22 02:10). POST-PATCH COMPROMISE CHECK: patching does not evict an attacker already in and the memory-disclosure flaw can leak passwords, session tokens, API keys and TLS private keys without leaving a code-execution trace (Wiz, php2shell.com, Sansec), so after the update review the exposure window for the signs above, web shells and unexpected admin users, and consider rotating secrets held by internet-facing PHP processes (Aikido).
    TRIAGE (benign lookalikes, follows from the stated mechanism): ordinary large uploads that exceed memory_limit also produce memory-limit fatals and HTTP 500s; the discriminators the sources give are the shape of the request (nested empty file parts, header floods, length-less multipart, a second multipart request to the same worker right after a crash), a burst from one client, worker crashes with native frames rather than a PHP-level error, oversized PHPSESSID cookies, and a web-server process spawning a shell. GitLab-style crash-only logic does not apply: the sources say successful exploitation can be quiet.
    CONTEXT: leak and embargo. Information leaked on 2026-10-20 (about 20:00 UTC pre-announcement), Calif mistakenly published a video, Chainguard released patched images at 07:41 UTC on 2026-10-21 citing exploits in the wild, the PHP Foundation calls that an embargo break (Socket, PHP Foundation). Several Dutch sites went offline as a precaution (Sansec: Tweakers, the House of Representatives, the NCSC, Security.NL; Security.nl: DigiD, MijnOverheid, Overheid.nl, TweedeKamer.nl and the Belastingdienst, mostly back online the same evening; the Dutch police said its own site stayed reachable but some phone-line services were reduced); Unit 42 says at least one European government took its website offline. This is the nearest public-sector precedent for how the sector responded and for the cost of waiting. Discovery credit: Calif, Wiz Research, OpenAI, Quarkslab (Corelight table); the finding was AI-assisted (Wiz, Calif, PHP Foundation). Calif's write-up names applications it exploited pre-auth: WordPress 7.1.2, Drupal 11.4.3, Joomla 6.1.4, MediaWiki 1.46.2, Roundcube 1.7.4, Magento 2.4.9, phpMyAdmin 5.2.3, Nextcloud 35.0.1, Laravel 13.11, Symfony 8.1, WHMCS.
    DISTRIBUTIONS: Debian tracker shows bookworm security 8.2.35-1~deb12u1 and trixie security 8.4.27-1~deb13u1 fixed (DSA-6574-1, DLA-4848-1), unstable and testing still 8.4.26-1 at fetch; Ubuntu published USN-8948-1; the PHP project said rpms.remirepo.net would not have updates on release day (Geniar later reported Remi had the fix at 19:20 UTC, not cited).
    VENDOR IMPACT: see the PAN-OS/Panorama item. Fortinet FG-IR-26-186 (2026-10-21): FortiADC, FortiADC Manager, FortiClient EMS, FortiDDoS, FortiDDoS-F, FortiSIEM, FortiMonitor, FortiClient Cloud, FortiSOAR, FortiSOAR PaaS, FortiGuard and FortiEndpoint under investigation; FortiOS, FortiManager, FortiAnalyzer, FortiWeb, FortiMail, FortiAuthenticator, FortiSwitch, FortiNAC and the FortiClient desktop builds confirmed not impacted. Cisco cisco-sa-php-october26-Jj384Daq (v1.1, 2026-10-21): investigation, ISE, Catalyst Center, Catalyst SD-WAN Manager, Expressway Series, Nexus Dashboard Insights, AppDynamics and others listed under investigation, no workaround, 'not aware of any malicious use'.
