  summary: 'Cisco''s risk-based disclosure run of 2026-10-21 (first and third Wednesday of the month) carries one flaw that clears the pre-authentication network 9.0+ bar and three CWE-grouped hardening releases. CVE-2026-76466 (CVSS 3.1 9.8, AV:N/AC:L/PR:N/UI:N) lets an unauthenticated remote attacker run operating-system commands as root on Cisco Expressway-C and Expressway-E, virtual and appliance, when the devices are configured in a cluster: the clustering database service relies on persistent cookies and does not validate client certificates even when TLS Verify Mode is enabled, so an attacker holding the cookies can connect and invoke RPC commands. Fixed in X15.5.20 for X15.5.3 and earlier; X14 and earlier have no fix and must migrate; there is no workaround, and Cisco does not say how an attacker obtains the cookies. The three hardening releases bundle internally found flaws under one CVE per weakness class, with the CVSS of the worst underlying flaw: Unified CM, Unified CM SME, IM&P, Emergency Responder, Prime Collaboration Deployment and Unity Connection (CVE-2026-76473 CWE-74 9.8, CVE-2026-76474 CWE-287 improper authentication 9.8, CVE-2026-76475 XSS 9.3, others 8.8 to 7.5; fixed in 15SU5, release 14 migrates); Snort 3 in Secure Firewall Threat Defense, Cyber Vision, Meraki MX, Unified Threat Defense on IOS XE, Cloud-delivered Firewall and Secure Access (CVE-2026-20043 out-of-bounds write and CVE-2026-20236 incorrect calculation, 9.0, AC:H; FTD fixed in 7.0.10, 7.2.12, 7.4.8, 7.6.6, 7.7.13, 10.0.2 and 10.1.0; Snort 3.12.4.0; Cyber Vision 5.6.0); Expressway (CVE-2026-76490 to -76497, up to 8.6, also X15.5.20). Cisco says these were found in internal testing, in the Snort case with frontier AI models, and that its PSIRT is not aware of malicious use of any of them. Cisco Meraki MX and cloud services were updated automatically on 2026-10-21.'
