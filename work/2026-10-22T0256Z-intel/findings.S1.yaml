    attribution: 'GitLab security (threat detection: Org-mode render error burst)'
    source_url: https://gitlab.com/gitlab-security-oss/tldr/-/raw/main/Detections/platforms/GitLab/Vulnerability%20Detections/org_mode_render_error_burst.md
  extended_notes: |-
    SUGGESTED TREATMENT: new entry for a new CVE; declare 2026-10-13/cve-2026-97229-gitlab-ci-regex-compiler-unauthenticated-rce in references[] (same product, same Onigmo class, different code path: GitLab's detection page calls CVE-2026-97229 a bypass of CVE-2026-93577 in the CI path, and CVE-2026-110264 the Org-mode path). Alternatively an update on that entry; the CVE sets are disjoint, so a new entry is the cleaner fit. Priority suggestion: high (CVSS 10.0, unauthenticated, no workaround stated, internet-reachable GitLab, but no exploitation or public PoC reported and a payload file must live in a public project).
    EXPOSURE: self-managed GitLab CE/EE at the versions above; read the version at /help or Admin > Overview; the vulnerable renderer is reached when GitLab renders a .org file (blob view, README, preview), so instances with public projects or open sign-up are the exposed shape; GitLab does not state a configuration switch that removes the path. Patched builds: 19.5.1, 19.4.3, 19.3.6, 19.2.9, 19.1.9, 19.0.10, 18.11.13. Upgrading brings database migrations (19.4.3 and 19.3.6 carry regular migrations; single-node instances have downtime).
    DETECTION (from GitLab's detections, telemetry class first): (1) Rails exceptions log (exceptions_json.log): five or more Timeout::Error 'execution expired' exceptions from the OtherMarkup renderer on .org files from one client within 30 minutes, often sequentially named files; (2) Workhorse log: HTTP 502 on the .org blob route (the request that crashes a worker is absent from the Rails request log); (3) Puma worker stderr (puma_stderr.log): a native Ruby [BUG] crash report whose backtrace runs through org-ruby (headline.rb, regexp_helper.rb) or Onigmo frames (match_at, onig_search_gpos, onig_compile, compile_tree), which also covers the CI path of CVE-2026-97229; (4) repository content: an oversized #+TODO:, #+SEQ_TODO: or #+TYP_TODO: line in .org files; (5) editor preview forcing the Org renderer onto a non-Org file (zero baseline). Benign lookalikes named by GitLab: a documentation-heavy repository of large .org files rendered many times in a short window, or one or two timeouts on one big .org file; a crash with no accompanying render burst or ci/lint 502 from one client is more likely a benign parser bug. A quiet period after a burst can indicate success, and absence of a hit never clears an instance.
    POST-PATCH COMPROMISE CHECK: the exploit runs as the git user and is described as quiet; on an instance that was exposed and unpatched, review for the signals above across the exposure window, for new or modified files and hooks under the git user's repositories and home, new admin users or tokens, and unexpected outbound connections from the Rails/Puma host.
    UPGRADE NOTE: GitLab's earlier 2026-10-12 fixes (19.4.2, 19.3.5, 19.2.8) and the 2026-09-23 ones do not contain this fix.
