  summary: 'GitLab''s ad-hoc critical patch release of 2026-10-21 fixes CVE-2026-110264 (CVSS 3.1 10.0, AV:N/AC:L/PR:N/UI:N/S:C), which GitLab describes as an integer overflow while compiling a specially crafted regular expression that could let an unauthenticated user run code on the GitLab server. GitLab''s own detection write-ups place it in the Org-mode markup path rather than the CI path of CVE-2026-97229: the org-ruby gem interpolates a raw #+TODO: keyword from a .org file into Regexp.new, a keyword with more than 32,767 repeats makes the Onigmo engine wrap a signed 16-bit repeat id and write out of bounds at match time, and with heap grooming that becomes a system() call as the git user; the render request needs no authentication, only a public project that can hold the .org payload, and the write-ups do not say how the payload file gets into such a project. Affected: every version from 7.0 before 18.11.13, 19.0 before 19.0.10, 19.1 before 19.1.9, 19.2 before 19.2.9, 19.3 before 19.3.6, 19.4 before 19.4.3 and 19.5 before 19.5.1, so instances that moved to 19.4.2, 19.3.5 or 19.2.8 for the CI regex flaw are not fixed for this one. GitLab.com is already patched and Dedicated tenants on 19.3.5-internal0, 19.4.2-internal0 or later need no action. GitLab does not state that the flaw is exploited and no public proof of concept is reported; it released two threat detections for self-managed instances and says a successful exploit is quiet and does not reliably crash. The same release fixes eleven further flaws rated 8.2 and lower, led by CVE-2026-15723 (CVSS 8.2, authenticated account takeover where OmniAuth SAML and LDAP auto-linking are both enabled).'
