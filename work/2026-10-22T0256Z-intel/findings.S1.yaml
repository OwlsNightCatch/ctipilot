  summary: 'Fortinet disclosed FG-IR-26-180 on 2026-10-13: a path traversal (CWE-22) in the FortiSIEM gRPC service phQueryMaster that lets an unauthenticated attacker run code with crafted packets, CVSS 9.4, Known Exploited ''No'', found internally by Fortinet. Only FortiSIEM 7.5.0 is affected (7.5.1 fixes it, 7.6 and FortiSIEM Cloud are not), and Fortinet says restricting access to TCP port 27918 prevents the issue. On 2026-10-20 Horizon3 published the root cause and a proof-of-concept repository: the service binds all interfaces on 27918 and does not request client certificates, the SendQueryResult RPC builds a file path from an attacker-controlled query-id without validation, a null byte embedded in the query-id removes the server''s own filename suffix so an existing file can be overwritten in place, and overwriting the redis health-check script that cron runs every 60 seconds yields code execution. Horizon3 found no application log that reveals exploitation and points to modification times of /opt/charting/redishb.sh and /opt/phoenix/bin/phLicenseTool as the files to inspect. No source reports exploitation; FIRST''s EPSS for the CVE is 0.0046 on 2026-10-21. The same Fortinet batch (FG-IR-26-176 to -185, all Known Exploited ''No'') also carries FortiSandbox GUI authentication bypass CVE-2026-107656 (CVSS 9.6, 5.0.0 to 5.0.6 and 4.4.0 to 4.4.9, fixed in 5.0.7 and 4.4.10), dropped by earlier runs as not exploited.'
