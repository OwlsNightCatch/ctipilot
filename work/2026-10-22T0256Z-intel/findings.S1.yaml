  summary: 'The PHP project shipped 8.5.12, 8.4.27, 8.3.36 and 8.2.35 on 2026-10-21 (CERT-EU records about 13:30 UTC, ahead of the scheduled 14:00 UTC) and published the technical advisories: CVE-2026-109618 (RCE via out-of-memory corruption: PHP aborts a request with longjmp() while request data is half-initialised and the shutdown path then trusts it) and CVE-2026-109619 (RCE via stale global state: request-owned state survives a fatal error and the next request on the same worker uses it), both CVSS 4.0 9.2. The project states the confirmed impact is unauthenticated code execution as the web worker account and rates the risk highest for Apache mod_php, where one unauthenticated multipart request triggers it during request startup before any application code runs; FPM RCE was confirmed through application-level and session upload-progress paths; source analysis judges FrankenPHP likely susceptible to application-independent attacks and LSAPI to application-specific ones, both unvalidated. Wiz and Sansec add an application-agnostic memory disclosure (freed worker memory returned in a PHPSESSID cookie); Calif says the earliest affected path dates to PHP 5.4.0. Fixed releases exist for 8.2 to 8.5 only; PHP 8.1 and older get no upstream release, only minimal source backports for 7.4, 8.0 and 8.1, and distributions and LTS vendors (Debian 12 and 13 security archives, Ubuntu USN-8948-1) ship their own packages. Exploitation status, by owner: Cloudflare says it observed attack traffic against its customers while the flaw was still leaked, watchTowr says its honeypots observed exploitation on 21 October, VulnCheck''s canary hosts recorded scanning from the morning of 21 October and one attempt, not successful, to plant a web shell through the upload-progress path, and a Chainguard executive says unnamed vendors reported exploits in the wild (unverified). The PHP Foundation says the public PoCs it inspected at disclosure were not functional, and VulnCheck says none of the public PoCs it reviewed independently defeats ASLR on x86-64 while ARM64 can be brute-forced. Hadrian says it saw exploitation at scale from 11:35 UTC, mostly through the session upload-progress path, and Security.nl relays Patchstack and others reporting attack attempts and Previdian saying the attackers it saw did not manage to run PHP or upload files. No source reports a confirmed compromise, and neither CVE is in CISA''s KEV catalogue (version 2026.10.21). Dutch government sites were taken offline as a precaution on 21 October (Security.nl: DigiD, MijnOverheid, Overheid.nl, TweedeKamer.nl and the tax authority), and most were back by that evening while the police site stayed up. NCSC Switzerland, NCSC-NL, CERT-EU and the UK NCSC published advisories; the NCSC-CH note adds, at 21 October 19:35, that unverified reports about recently patched versions do not by themselves establish a bypass of the fixes. Palo Alto confirms PAN-OS and Panorama are affected with no fixed release (separate item), Fortinet and Cisco list products under investigation.'
  region_nexus: 'global; Switzerland: NCSC-CH published and kept updating a Security Hub advisory (post 13083, last edited 2026-10-22 00:11 UTC). Public-sector relevance is an inference: every Swiss federal, cantonal or communal site or portal on a PHP CMS or framework named in the sources (WordPress, Drupal, Joomla, Nextcloud, Laravel, Magento, MediaWiki, Roundcube, phpMyAdmin) runs the vulnerable runtime until PHP itself is updated.'
