    attribution: Fortinet PSIRT (FG-IR-26-180, Arbitrary file write in grpc phQueryMaster)
    source_url: https://fortiguard.fortinet.com/psirt/FG-IR-26-180
  - quote: any remote client can connect to the gRPC service on port tcp/27918 unauthenticated and without presenting a client certificate
    attribution: 'Horizon3.ai (CVE-2026-106173: FortiSIEM gRPC Path Traversal to RCE)'
    source_url: https://horizon3.ai/attack-research/cve-2026-106173-deep-dive-fortisiem-grpc-path-traversal-file-write-rce/
  - quote: We did not find any application logs that would explicitly reveal that this vulnerability was exploited.
    attribution: 'Horizon3.ai (CVE-2026-106173: FortiSIEM gRPC Path Traversal to RCE)'
    source_url: https://horizon3.ai/attack-research/cve-2026-106173-deep-dive-fortisiem-grpc-path-traversal-file-write-rce/
  extended_notes: |-
    EXPOSURE: FortiSIEM 7.5.0 only (7.5.1 or above fixes; 7.6 not affected; FortiSIEM Cloud not affected). Reachability: TCP 27918 on the supervisor or any node running phQueryMaster; Fortinet's workaround is to restrict that port. Read the version from the FortiSIEM GUI or CLI.
    DETECTION: telemetry class: network flow and firewall logs for connections to TCP 27918 from hosts that are not FortiSIEM collectors or workers; file-integrity monitoring or timestamps on /opt/charting/redishb.sh and /opt/phoenix/bin/phLicenseTool (Horizon3: no application log records exploitation); unexpected files under /query/result outside the expected directory structure; child processes of the cron-run redis health-check script. Horizon3's example overwrite target runs every 60 seconds as the admin user context.
    HARDENING: upgrade 7.5.0 to 7.5.1 or later, restrict TCP 27918 to the cluster until then; 4.4 and 5.0 FortiSandbox users on the same batch: FG-IR-26-185 CVE-2026-107656 (unauthenticated GUI authentication bypass via alternate path, 9.6).
- title: LiteLLM 1.107.0 on PyPI and the official Docker images carried a credential stealer and a remote-code loader that Python starts through .pth and sitecustomize hooks; the build came from a lookalike repository (Berri-AI/litellm)
  sources:
  - url: https://socket.dev/blog/litellm-compromise
    publisher: Socket Research Team
    date: '2026-10-21'
    role: primary
  - url: https://github.com/BerriAI/litellm/issues/47826
    publisher: Upwind security research team (GitHub issue on BerriAI/litellm)
    date: '2026-10-21'
    role: primary
  - url: https://www.aikido.dev/blog/litellm-compromised-infostealer-rat
    publisher: Aikido Security
    date: '2026-10-21'
    role: corroborating
  discovery_trace: 'first seen at: aikido-security, URL https://www.aikido.dev/blog (python3 tools/fetch_source.py url, then extract https://www.aikido.dev/blog/litellm-compromised-infostealer-rat dated 2026-10-21) -> pivot: socket-dev-blog feed, URL https://socket.dev/api/blog/feed.atom (item ''LiteLLM PyPI Package and Docker Images Compromised to Steal Cloud and AI Credentials'', 2026-10-21T13:41Z), URL https://socket.dev/blog/litellm-compromise -> primary: Upwind issue, URL https://github.com/BerriAI/litellm/issues/47826'
  summary: 'On 2026-10-21 version 1.107.0 of LiteLLM, the open-source LLM gateway and proxy (about 23 million weekly downloads per Socket), was found to carry malicious startup files in all seven PyPI wheels and in the official GHCR and Docker Hub images behind the latest, main-latest and main-stable tags. A packaging setting in the Maturin build configuration (data = cook) pulled a directory that exists neither in the git tag nor the source tree into the wheel: cook.pth runs an infostealer at every Python start and sitecustomize.py forks a background loader that polls a GitHub-hosted pointer file and would execute Python fetched from the domain it names, with no signature check. The stealer targets cloud, Kubernetes, CI, registry and database credentials, SSH, GPG and TLS private keys, browser stores, AI-tool credential files and environment variables, and LiteLLM''s own stored provider credentials where a database URL is configured. Socket reads the container provenance as showing the release workflow built from a source repository one hyphen away from the legitimate one, and says the evidence does not establish how that override was authorised, whether an account or token was compromised, or whether the same workflow uploaded the wheels. PyPI removed 1.107.0 and the images were pulled the same day; the loader''s pointer file was empty at one check, which does not disable the stealer. The maintainers'' reply in the issue and a safe-version pin of 1.106.2 are reported by Upwind; Socket does not certify earlier artifacts.'
  region_nexus: global; no Swiss victim named; relevant to any public-sector or supplier team running a LiteLLM gateway or pulling its images by floating tag
  primary_sector_nexus: indirect (AI-gateway dependency; constituency exposure is an inference)
  sector: technology
  cves: []
  techniques:
  - T1195.002
  - T1546.018
  - T1552.001
  - T1552.005
  - T1102.001
  affected_products:
  - LiteLLM
  entity_keys:
  - product:litellm
  - product:berriai-litellm
  new_entities: []
  relation_suggestions: []
  verification: MULTI-SOURCE
  confidence: HIGH
  novelty: new
  borderline: true
  borderline_reason: supply-chain compromise with no stated Swiss or public-sector nexus; likely also surfaced by S3/S4; included for the transferable lesson (build-input substitution invisible in the tag, Python startup hooks, floating container tags) and cloud-credential theft at scale; the main agent decides and dedups across domains
  evidence:
  - quote: contains malicious Python startup files that collect cloud credentials, private keys, browser data, and authentication files for AI development tools
    attribution: Socket Research Team
    source_url: https://socket.dev/blog/litellm-compromise
  - quote: The available evidence establishes what source the container build recorded and how the payload was included.
    attribution: Socket Research Team
    source_url: https://socket.dev/blog/litellm-compromise
  - quote: removing the LiteLLM package directory alone does not remove those files or stop an existing process
    attribution: Socket Research Team
    source_url: https://socket.dev/blog/litellm-compromise
  - quote: PyPI has now quarantined version 1.107.0.
    attribution: Aikido Security
    source_url: https://www.aikido.dev/blog/litellm-compromised-infostealer-rat
  extended_notes: |-
    EXPOSURE: any environment that ran `pip install litellm==1.107.0` (any platform) or pulled ghcr.io/berriai/litellm, its -database and -non_root variants, or litellm/litellm on Docker Hub by the latest, main-latest or main-stable tags (or v1.107.0) before the images were pulled on 2026-10-21; Socket's registry check at about 13:14 UTC found the floating tags resolving to the affected index. Check lockfiles, caches, CI build logs, container layers and running image digests.
    DETECTION: telemetry class: file and package inventory for .pth files and sitecustomize.py in Python site-packages that were not installed by your own tooling (the cook.pth/cook.py/sitecustomize.py trio, `sitecustomize.py` alone can be legitimate); process telemetry for a detached Python process with a lock file in /tmp and hourly polling; egress logs for POSTs of an encrypted archive to a look-alike 'healthcheck' endpoint and fetches of a pointer file from a GitHub repository path followed by a code download; cloud, identity-provider, repository and registry audit logs for use of credentials the host could read. Starting Python or pip in an affected environment can run the payload again, so inspect with trusted tooling first.
    POST-INCIDENT: removal of the package does not reverse credential exposure or stop a running loader; rebuild from a reviewed artifact, revoke and replace exposed credentials from a clean environment (cloud sessions, provider keys, developer-tool sessions, registry tokens, SSH keys, database credentials), pin container digests, recover on 1.106.2 per Upwind.
    IOC NOTE: payload hashes, the exfiltration host and the pointer repository are in the sources and deliberately omitted here.
