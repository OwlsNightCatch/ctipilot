  discovery_trace: 'first seen at: paloalto-psirt, URL https://security.paloaltonetworks.com/rss.xml (python3 tools/fetch_source.py feed ... 15; newest item ''CVE-2026-109618 Impact of Critical Vulnerabilities in PHP ... on Palo Alto Networks Products'', 2026-10-21T23:33Z) -> primary: Palo Alto Networks, URL https://security.paloaltonetworks.com/CVE-2026-109618 (extract) -> Unit 42 brief, URL https://unit42.paloaltonetworks.com/cve-2026-109618-cve-2026-109619/ (linked from the advisory)'
  summary: 'Palo Alto Networks'' advisory of 2026-10-21 lists PAN-OS 12.2, 12.1, 11.2, 11.1 and 10.2 (all releases) and Panorama (all) as affected by the PHP2Shell flaws CVE-2026-109618 and CVE-2026-109619, with no fixed release and the estimate ''TBD'' for every train. No special configuration is required: the flaw sits in the management web interface (the HTTPS web UI and the XML API service), and it reaches a dataplane interface only where a management profile is attached to it; GlobalProtect portal and gateway and the captive portal are stated as not impacted, and Cloud NGFW, Prisma Access, Cortex products and the GlobalProtect app are listed unaffected. Palo Alto rates its own product CVSS-B 8.7 (severity high, urgency moderate) where the management interface is reachable from the internet, 7.1 where it is only adjacent, and says it is not aware of any malicious exploitation of the issue against its products. Until fixes ship it recommends restricting management access to a jump box or trusted internal addresses, and offers Threat Prevention coverage (Threat IDs 543004, 97622, 97623, 97624 and 97625, content version 9162 and later; 543004 also via Frontier Virtual Patching on PAN-OS 12.2.4 and later), which only protects management traffic that is routed through a dataplane interface, uses a replaced inbound-management certificate and has threat prevention enabled on it. Unit 42 says it has seen proof of concept of the flaws and that Cortex Xpanse counts over 22.6 million potentially vulnerable exposed instances across the internet (all PHP, not PAN-OS).'
  region_nexus: global; any Swiss federal, cantonal or communal estate that runs PAN-OS firewalls or Panorama (constituency relevance is an inference, the sources do not name Swiss customers)
