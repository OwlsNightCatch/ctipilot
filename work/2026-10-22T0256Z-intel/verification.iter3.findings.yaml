  section: cves
  item: "k0t-fortiweb-fortigate-globalprotect-edge-device-campaign / cves[CVE-2019-6693]"
  url_or_quote: "fixed: \"no fix release; the private-data-encryption option overrides the default key\" vs https://fortiguard.fortinet.com/psirt/FG-IR-19-007"
  summary: "Fortinet's per-CVE PSIRT (fetched this iteration) says: 'FortiOS: In versions 5.6.11 and above, 6.0.7 and above, and 6.2.1 and above, administrators can choose to be prompted for a password ... set private-data-encryption enable /* disabled by default */'. The option ships in specific releases, so 'no fix release' is wrong and the record omits the version prerequisite; Group-IB itself calls the option the associated fix. Replace with the release floor and cite FG-IR-19-007."
