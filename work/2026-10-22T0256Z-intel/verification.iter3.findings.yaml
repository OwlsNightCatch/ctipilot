  item: "cve-2026-76466-cisco-expressway-cluster-unauth-root-rce / summary"
  url_or_quote: "\"an unauthenticated attacker who holds persistent cluster cookies\""
  summary: "(low confidence) Cisco's advisory says 'This vulnerability is due to the use of persistent cookies' and 'An attacker with possession of the cookies'; it never calls them cluster cookies. The body (correctly) says 'persistent cookies'. Drop 'cluster' from the summary."
- code: F3
  category: claim-not-supported
  section: body
  item: "cve-2026-76466-cisco-expressway-cluster-unauth-root-rce / Defender takeaway"
  url_or_quote: "\"...schedule the move of X14 and earlier, Unified CM family and Unity Connection to 15SU5 (release 14 migrates), and FTD to the fixed build of its train; Cisco reports no exploitation of any of them and lists no workaround for the Expressway flaw ([Cisco PSIRT](.../cisco-sa-vcs-static-cred-hr7EWZ8t))\""
  summary: "(low confidence) The only link on the clause is the Expressway advisory (cisco-sa-vcs-static-cred), which carries X15.5.20, 'no workarounds' and 'not aware of ... malicious use' for the Expressway flaw only. 15SU5, the FTD fixed builds and 'no exploitation of any of them' are in cisco-sa-voice-hardening-twgbH9e3 and cisco-sa-hardening-snort3-ybgmhTQe. Add those two links to the clause."
- code: F3
