- code: F8
  category: needs-more-research
  section: cves
  item: "k0t-fortiweb-fortigate-globalprotect-edge-device-campaign / cves[] and Exposure"
  url_or_quote: "CVE-2025-64446: \"affected\": \"...the affected versions are not stated in the cited sources\", \"fixed\": \"not stated in the cited sources\", cvss null; CVE-2026-0257: \"fixed\": \"not restated in the cited sources\""
  summary: "Fortinet's PSIRT https://fortiguard.fortinet.com/psirt/FG-IR-25-910 (fetched this iteration, linked from the KEV row) lists FortiWeb 8.0.0-8.0.1 -> 8.0.2, 7.6.0-7.6.4 -> 7.6.5, 7.4.0-7.4.9 -> 7.4.10, 7.2.0-7.2.11 -> 7.2.12, 7.0.0-7.0.11 -> 7.0.12, the interface workaround and a post-upgrade check for unauthorised administrators. FG-IR-19-007 gives the FortiOS release floor for private-data-encryption (5.6.11, 6.0.7, 6.2.1), without which the headline action cannot be applied on older builds. PAN advisory https://security.paloaltonetworks.com/CVE-2026-0257 lists the 0257 fixed builds. Add the vendor PSIRTs as sources and fill affected/fixed/cvss."
