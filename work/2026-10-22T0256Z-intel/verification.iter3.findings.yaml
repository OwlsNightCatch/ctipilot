  item: "php-critical-release-pre-announced-cve-2026-109618-109619 / first sentence"
  url_or_quote: "\"...CVE-2026-109618 and CVE-2026-109619, both CVSS 4.0 9.2, and urges all PHP users to update immediately ([PHP, 2026-10-21](https://www.php.net/archive/2026.php#2026-10-21-5))\""
  summary: "(low confidence) The 2026-10-21-5 item lists the fixed versions, both CVE ids and 'All PHP users are strongly encouraged to update immediately' but no CVSS; 'both rated CVSS v4.0 9.2' is in the 2026-10-20-1 item of the same archive page (also CERT-EU, Sansec). Add the 10-20-1 anchor or CERT-EU to the clause."
