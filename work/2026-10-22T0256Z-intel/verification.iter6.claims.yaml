claims:
  - {claim_id: 12bdc04dad, verdict: ok, source_url: null, passage: "Summary vs sources: admin.ch 'Datenabfluss bestätigt'; Publica 'vermutlich Personendaten ... abgeflossen'; PKZH 'entwendet'; NZZ BPK 'davon ausgegangen werden muss' (see F11 on 'say')"}
