  - title: "NCSC UK publishes interim technical guidance for securing agentic-AI deployments — sandboxing, credential-lifetime scoping, and human-in/on/out-of-the-loop oversight tiers, pending formal guidance that will supersede it"
    sources:
      - { url: "https://www.ncsc.gov.uk/blogs/managing-the-cyber-risk-of-agentic-ai", publisher: "NCSC UK", date: "2026-08-20", role: "primary" }
    discovery_trace: >
      first seen at: ncsc-uk (RSS feed https://www.ncsc.gov.uk/api/1/services/v1/all-rss-feed.xml),
      item "Managing the cyber risk of agentic AI" published Thu 20 Aug 2026 → primary (no pivot
      needed): NCSC UK blog, URL https://www.ncsc.gov.uk/blogs/managing-the-cyber-risk-of-agentic-ai.
    summary: |
      NCSC UK published interim practical guidance on 20 August 2026 for organisations deploying
      agentic AI systems, explicitly framed as a stop-gap: "the NCSC is sharing interim practical
      advice, based on NCSC research to date... [while] working with partners to develop formal
      guidance which will build upon, and ultimately supersede, this blog." The guidance recommends
      calibrating controls to the agent's autonomy level and blast radius rather than treating all
      agentic deployments uniformly: threat-model failure scenarios before deployment; constrain
      agent behaviour through explicit prompt-level constraints (acknowledged as necessary but
      insufficient alone); choose a human-oversight tier — human-in-the-loop, human-on-the-loop, or
      human-out-of-the-loop — proportionate to the severity of a wrong action; network-sandbox agents
      behind allowlists or protocol-aware proxies; enforce strong compute isolation; restrict agent
      credentials to the minimum permissions needed for the task with the shortest practicable
      lifetime; and maintain comprehensive logging, real-time monitoring for unexpected/concerning
      behaviour, and a tested emergency-shutdown capability. The post assigns accountability
      explicitly: named individuals or groups must own agentic-AI activities in an organisation. NCSC
      UK cross-references Australia's ACSC guidance on the same topic (published in parallel), giving
      this two co-published national authorities rather than one. This is guidance, not a binding
      obligation, but it is the kind of buyer/operator control-language public-sector procurement and
      governance functions increasingly cite (continuing the pattern this pipeline flagged in W32's
      forensic-observability and SBOM items) and is the first authority-level technical baseline this
      pipeline has tracked specifically for defending against an organisation's OWN agentic-AI
      deployments, as distinct from AI-assisted attacker tooling or AI-eval containment failures
      covered in prior weeklies.
    region_nexus: "United Kingdom (NCSC UK primary); parallel guidance issued by Australia's ACSC — transferable baseline for any Swiss/EU public-sector body evaluating agentic-AI deployment"
