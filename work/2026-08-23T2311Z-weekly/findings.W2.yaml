    summary: |
      Status re-check on the Berlin Landesnetz (state network) compromise the Senate Chancellery
      first confirmed on 17 August 2026: forensic investigation had established a "Inkriminierung"
      (contamination/compromise) of the Landesnetz, and two administrations — Senatsverwaltung für
      Stadtentwicklung, Bauen und Wohnen, and Senatsverwaltung für Mobilität, Verkehr, Klimaschutz
      und Umwelt — had been isolated from the network since Friday 14 August 2026 as a precaution,
      disrupting housing-benefit (Wohngeld) disbursement to over 50,000 households and other citizen
      services (Wohnberechtigungsscheine, Zweckentfremdungsanträge, building-permit processing).
      As of the Senate Chancellery's own press release dated 23 August 2026 (English version), both
      administrations are again connected to the Landesnetz and "in principle, operational," though
      occasional disruptions may persist; the housing-benefit backlog can now be processed. Across
      nine days and three named official bodies (Landeskriminalamt, Staatsanwaltschaft Berlin, BSI),
      NO named authority has stated an initial-access vector, exploited product/service, malware
      family, or CVE identifier. The Senate Chancellery's 17 August release states explicitly that,
      "aus ermittlungstaktischen Gründen" (for investigative-tactical reasons), no further concrete
      information on the scope and background can currently be given. Regional press (Tagesspiegel,
      18 August) separately reported that data exfiltration occurred at the building administration
      but that officials characterise the taken data as information that "was already publicly
      accessible via Open Data" — a characterisation from the Senatskanzlei, not an independent
      forensic finding. Interior Senator Iris Spranger has stated the 20 September 2026 Berlin
      state election is not endangered because election-relevant systems were not directly affected
      by the isolation. The forensic investigation and IT-security hardening (continuous enhanced
      monitoring) are stated to continue "in den kommenden Wochen" (in the coming weeks). No BSI-authored
      publication, and no Bundestag/Abgeordnetenhaus document, was found describing a vector; this
      run found none.
