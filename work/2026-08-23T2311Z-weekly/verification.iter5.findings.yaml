    Frontmatter title overstates the body. The body's fourth case is headed "**And one where there
    was no flag to disagree about.**" (CVE-2026-73570 Zimbra: ENISA records exploited since
    2026-08-18, CISA catalogued 2026-08-21, no authority contradicts another). The entry's own
    summary says "four vulnerability records ... carried contradictory exploitation determinations",
    the closing body paragraph says "This week's four are the same failure moved one field to the
    right", and the sourcing_note says "in any of the four cases". Only the title claims five
    disagreements. Verified against pages/kev.txt (CVE-2026-73570 dateAdded 2026-08-21) and
    pages/csh-12863.txt. Fix: the title should say five records / four disagreements (e.g. "Five CVEs
    this week where the exploitation flag came apart — four where the authorities disagree outright
    and one where no feed had a flag to disagree about"), matching the summary, body and sourcing note.
- code: F14
  category: quantifier-without-source
  section: weekly-multi-day
  item: "weekly-w34-berlin-landesnetz-nine-days-no-vector"
  url_or_quote: "summary: \"Five intel runs in this pipeline could not publish an operational entry for exactly that reason\" / body: \"Five separate fires of this pipeline researched Berlin's Landesnetz compromise and none could publish\""
  summary: >-
    The "five fires researched it" quantifier is contradicted by this pipeline's own artefacts. The
    Senate Chancellery release is dated 2026-08-17, and the 2026-08-17T0413Z intel fire preceded it,
    so at most four fires (18, 19, 20, 23 Aug) could have researched the incident. Case-insensitive
    grep for "berlin" across work/<run-id>/ shows ZERO hits for 2026-08-15, 2026-08-16 (x2),
    2026-08-17 (x2), 2026-08-18 and 2026-08-19, and hits only for 2026-08-20T0409Z-intel and
    2026-08-23T0409Z-intel; grep for "landesnetz" across runs/ matches only runs/2026-08-20 and this
    weekly. Evidence on disk supports two fires, not five. The same claim is repeated in the
    published run record ("The Berlin Landesnetz entry closes a coverage hole that five consecutive
    intel fires could not") and must be corrected in both places. NOTE: the run record's separate
    statement "Five intel fires published 39 operational entries in the window" IS correct (17, 18,
    19, 20, 23 August) — the defect is only the claim that five fires researched and failed to
    publish Berlin.
- code: F11
  category: editorial-advisory
  section: weekly-research
  item: "weekly-w34-ai-bought-throughput-not-capability"
  url_or_quote: "body: \"Cisco Talos followed a compromised host's traffic to an open directory on the actor's download server and walked away with UAT-10147's own operational material: a target list of roughly 170,000 URLs\""
  summary: >-
    Advisory only, main agent may leave. Talos attributes the two open directories to two roles: the
    target list comes "From the threat actor's command-and-control (C2) server open directory", while
    the OPSEC-failure section describes "a compromised machine communicating with a download server
    hosted at 139.180.197[.]150. A review of this IP address revealed an open directory." The entry
    binds the target list to the download-server directory. The source does not clearly distinguish
    whether these are the same host, so this is a conflation rather than a false statement. Everything
    else in the paragraph checks out: 17 files of ~10,000 URLs, nine-section playbook (Section 9
    exists), four Python scripts (Talos's own summary says "three companion Python scripts" but the
    body later documents "The fourth python script ('exfil.py')" — the entry's four is correct),
    DeepAudit on the management server, PentestGPT on the C2 server, and all five initial-access CVEs.
