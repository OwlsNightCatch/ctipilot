  - title: "SilkParasite: a medium-confidence China-nexus cluster runs seven RAT families — five newly named — against Central Asian economic-policy ministries, with residue consistent with AI-assisted malware development"
    sources:
      - { url: "https://www.bitdefender.com/en-us/blog/businessinsights/silkparasite-tracking-china-nexus-apt-across-central-asia", publisher: "Bitdefender Labs", date: "2026-08-19", role: "primary" }
      - { url: "https://therecord.media/china-cyber-espionage-central-asia", publisher: "The Record (Recorded Future News)", date: "2026-08-20", role: "corroborating" }
    discovery_trace: "first seen at: bitdefender-threat-debrief, URL https://www.bitdefender.com/en-us/blog/businessinsights (listing fetch surfaced the post title/date) → primary: Bitdefender Labs, URL https://www.bitdefender.com/en-us/blog/businessinsights/silkparasite-tracking-china-nexus-apt-across-central-asia → corroboration: The Record, URL https://therecord.media/china-cyber-espionage-central-asia"
    summary: |
      Bitdefender Labs disclosed SilkParasite, a cyberespionage operation it assesses at medium confidence as China-nexus, targeting government bodies handling economic policy across Uzbekistan, Turkmenistan, Kyrgyzstan, Tajikistan, Kazakhstan and Georgia since roughly late 2025. Initial access is spear-phishing email carrying a malicious Office document inside a password-protected RAR (password in the email body), regionally tailored to impersonate specific ministries; the delivery macro checks for a running Kaspersky process (avp.exe) and adapts its behavior accordingly before dropping a legitimate signed application alongside a malicious DLL with the expected filename (DLL side-loading) — observed hosts include Calibre's ebook-edit.exe, ABBYY FineReader.exe, Quick Heal's emlproui.exe, a Windows Defender component (MpDefenderCoreService.exe) and Mp3tag.exe. Seven RAT families are in play — DriveSilkRAT (.NET/C++), CookiETagRAT (C++), NomadRAT (C++), GoginRAT (Go) and NodeEdgeRAT (Node.js) are newly documented; SpiceRAT (C/C++, previously attributed by Cisco Talos to SneakyChef) and BloodAlchemy (ShadowPad/Deed RAT lineage) were already known. Six of the seven load additional capability on demand from C2 rather than shipping it all at once; DriveSilkRAT routes commands through a shared Google Drive folder (living-off-trusted-services) and CookiETagRAT hides commands inside HTTP Cache-Control/ETag header values. Persistence rides scheduled tasks masquerading as routine maintenance (e.g. NodeEdgeRAT's "SysEdgeUpdateTaskMachineCore", styled as a Microsoft Edge updater). Bitdefender assesses medium confidence that development leaned on AI assistance — GoginRAT ships leftover Go unit-test functions and a hardcoded placeholder AES key ("0123456789abcdef"); NodeEdgeRAT's encryption-key config field is still set to the literal string "change_this_key"; two recovered phishing lures are themselves conspicuously AI-generated documents — while stressing the toolset overall remains "professionally engineered" human work that AI merely accelerated, not AI-authored malware.
    region_nexus: "Central Asia (Uzbekistan, Turkmenistan, Kyrgyzstan, Tajikistan, Kazakhstan) and Georgia; no Swiss/EU targeting reported by the source"
    primary_sector_nexus: "indirect"
    sector: "government, public-sector"
