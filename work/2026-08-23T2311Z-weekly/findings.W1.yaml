      Detection angle for defenders outside the named region: the DLL side-loading host list (Calibre, ABBYY FineReader, Quick Heal, an MS Defender component name, Mp3tag) is a concrete hunt list — flag any of these signed binaries loading a DLL from a non-standard install path or a path also writable by the current user. The AI-development-residue indicators (test-harness leftovers, placeholder crypto keys, template-literal config values) are a hunt heuristic worth generalizing: grep newly-recovered implants for common AI-scaffolding placeholders before assuming professional/nation-state tooling is bug-free.

  - title: "Two independent vendors document the same technique class this week: attackers impersonating Claude, ChatGPT and Copilot to deliver stealers and RATs via poisoned search ads and fake install pages"
    sources:
      - { url: "https://www.sophos.com/en-us/blog/fake-ai-real-malware-attackers-impersonating-ai-brands", publisher: "Sophos X-Ops", date: "2026-08-19", role: "primary" }
      - { url: "https://www.huntress.com/blog/fake-claude-macsync", publisher: "Huntress", date: "2026-08-17", role: "primary" }
    discovery_trace: "first seen at: sophos-xops feed, URL https://www.sophos.com/en-us/blog/feed?id=blt6f15f4f7deaf4242 → primary: Sophos X-Ops, URL https://www.sophos.com/en-us/blog/fake-ai-real-malware-attackers-impersonating-ai-brands ; separately first seen at: huntress feed, URL https://www.huntress.com/blog/rss.xml → primary: Huntress, URL https://www.huntress.com/blog/fake-claude-macsync"
    summary: |
      Sophos X-Ops reviewed 38 confirmed adversarial-AI cases from a year of MDR casework (2025-07-02 through 2026-06-29) and found nearly all involved counterfeit versions of legitimate AI platforms used as malware delivery vehicles — Claude was the most abused brand (26 of 38 cases), ahead of ChatGPT and Copilot. The chain runs: a user searches for an AI coding tool, lands on a typosquatted domain via a malicious ad or poisoned search result, is walked through a fake "InstallFix" guide, and is talked into running an obfuscated one-liner (mshta, or PowerShell with -enc/IEX) that delivers LummaStealer, custom RATs, or a previously undocumented backdoor Sophos names "Beagle"; a parallel vector uses browser extensions posing as AI assistants that function as credential-harvesting infostealers. Sophos maps the pattern to T1566 (phishing lures), T1218.005 (mshta signed-binary proxy execution) and T1071.001 (web-protocol C2), and states behavioral detection outperformed any AI-brand-specific signature. Independently, Huntress reverse-engineered MacSync, a six-stage macOS infostealer/RAT distributed through a poisoned Google Ads result that redirects to a shared Claude.ai conversation displaying a curl command; the resulting chain runs a polymorphic zsh loader entirely in memory, uses AppleScript to harvest credentials, drops a Mach-O RAT that talks to a hardcoded WebSocket C2 endpoint, escalates TCC privileges for screen recording, and persists via a renamed LaunchAgent plist — exfiltrating browser cookies, Keychain secrets, SSH keys, Telegram sessions, cloud credentials and, via trojanized wallet apps, cryptocurrency seed phrases. Both write-ups land in the same week from unrelated MDR/SOC telemetry sources and converge on the same finding: employees searching for legitimate AI coding assistants are now a reliable initial-access vector, and file-hash detection is moot against the loader's polymorphism.
    region_nexus: "global; the vector (search-engine ads for AI coding tools) is untargeted by geography or sector"
    primary_sector_nexus: "indirect"
    sector: "public-sector, finance, healthcare, telco, energy, water, transport"
    cves: []
    techniques: [T1566, T1218.005, T1071.001, T1543.001, T1555.001]
    affected_products: ["Claude (Anthropic)", "ChatGPT (OpenAI)", "Microsoft Copilot"]
    entity_keys: ["campaign:clickfix-macos-2026"]
    new_entities:
      - { key: "malware:beagle-backdoor", type: malware, name: "Beagle", aliases: [],
          summary: "Previously undocumented backdoor Sophos recovered from a fake-Claude-site delivery chain during MDR casework, part of a broader wave of malware distributed via counterfeit AI-brand install pages (Sophos X-Ops, 2026-08-19)." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Attackers are exploiting the surge in demand for AI software by faking the software itself: names users trust, like Claude, ChatGPT, and Copilot, become delivery vehicles for malware."
        attribution: "Sophos X-Ops"
        source_url: "https://www.sophos.com/en-us/blog/fake-ai-real-malware-attackers-impersonating-ai-brands"
      - quote: "You can't detect based on the hash, you're gonna have to detect on the behavior."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/fake-claude-macsync"
      - quote: "A recovery phrase doesn't work like that; there is nothing to revoke or reset, nothing to stop the access."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/fake-claude-macsync"
    extended_notes: |
      Triage/benign-lookalike note: legitimate AI-tool installers do also invoke shell one-liners and browser-extension installs, so the discriminator both vendors converge on is destination, not action class — a curl/PowerShell one-liner sourced from a shared-conversation link or a typosquat domain (rather than the vendor's own docs/CLI installer) is the tell. Hardening lever: block execution of terminal-paste instructions copied from web pages is not enforceable technically, but egress-filtering newly-registered/typosquat AI-brand domains and disabling unmanaged browser-extension installation are.

