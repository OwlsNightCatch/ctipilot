  - title: "Sophos publishes a CPU-only NetNTLMv1 rainbow-table pipeline that cracks a captured hash in under 20 minutes on commodity hardware — closing the 'you'd need a GPU farm' assumption behind leaving the legacy protocol enabled"
    sources:
      - { url: "https://www.sophos.com/en-us/blog/accelerating-netntlmv1-lookups-without-gpus", publisher: "Sophos X-Ops", date: "2026-08-17", role: "primary" }
    discovery_trace: "first seen at: sophos-xops feed, URL https://www.sophos.com/en-us/blog/feed?id=blt6f15f4f7deaf4242 → primary: Sophos X-Ops, URL https://www.sophos.com/en-us/blog/accelerating-netntlmv1-lookups-without-gpus"
    summary: |
      Sophos X-Ops built a CPU-only rainbow-table lookup pipeline against NetNTLMv1 — the legacy Windows challenge-response scheme that still encrypts the derived NT hash under 56-bit DES when a static server challenge is used — that recovers the NT hash in under 20 minutes on a 64-core AMD EPYC server, work that previously needed roughly 8 hours on GPU hardware. The speedup comes from bitsliced DES with AVX2 vectorization processing 256 independent DES operations in parallel (~2.1 billion DES ops/sec on the test machine), split across three pipeline stages (precompute, search, check) with the table set horizontally sharded so the job runs concurrently with other CPU-bound cracking work rather than monopolizing a GPU. Sophos built on and published against Mandiant's public NetNTLMv1 rainbow tables. The practical effect for defenders: an environment that still permits NetNTLMv1 negotiation (a legacy compatibility default in many older Windows/AD deployments) can no longer assume that a captured NetNTLMv1 response is safe absent a GPU cluster — commodity server or even high-end workstation CPUs now clear it inside a lunch break, once an attacker has captured the response via any of the standard forced-authentication techniques (LLMNR/NBT-NS poisoning, coerced SMB/HTTP auth).
    region_nexus: "global; applies to any Active Directory environment that has not disabled NetNTLMv1 negotiation"
    primary_sector_nexus: "indirect"
    sector: "public-sector, energy, water, transport, healthcare, finance, telco"
    cves: []
    techniques: [T1557.001, T1110.002]
    affected_products: ["Microsoft Windows NTLM (NetNTLMv1 authentication)"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Threat actors thrive on the availability of legacy technology that survives long after its security integrity has expired."
        attribution: "Sophos X-Ops"
        source_url: "https://www.sophos.com/en-us/blog/accelerating-netntlmv1-lookups-without-gpus"
    extended_notes: |
      Hardening lever named by the source: disable NetNTLMv1 negotiation outright (Network security: LAN Manager authentication level GPO) rather than relying on offline-cracking cost as a mitigating factor; the source frames periodic re-assessment of legacy-authentication exposure during security assessments as the compensating control where NetNTLMv1 cannot yet be disabled.

  - title: "CopyCop (Storm-1516) runs a three-wave media-impersonation disinformation campaign against a US-Armenia AI data-center investment — a Russian-state-aligned information-operation technique class, not a network intrusion"
    sources:
      - { url: "https://www.recordedfuture.com/blog/copycop-targets-ai-investment", publisher: "Recorded Future (Insikt Group)", date: "2026-08-18", role: "primary" }
    discovery_trace: "first seen at: recordedfuture-insikt feed, URL https://www.recordedfuture.com/feed → primary: Recorded Future Insikt Group, URL https://www.recordedfuture.com/blog/copycop-targets-ai-investment"
    summary: |
      Insikt Group documented three successive media-impersonation waves between 2026-06-24 and 2026-07-13 by CopyCop (tracked elsewhere as Storm-1516), a Russian state-aligned influence network, targeting the Firebird AI data-center project in Hrazdan, Armenia — a roughly $500 million US-Armenia AI infrastructure investment tied to Armenia's post-CSTO westward geopolitical realignment. The technique is not intrusion but fabrication and amplification: spoofed websites impersonating TechCrunch and Gizmodo, and forged Iranian-military-style communications, seeded false narratives about seismic risk, infrastructure instability and military targeting of the facility, amplified through a persistent CopyCop social-media account cluster whose combined reach grew from limited engagement to over 1.6 million views by the third wave. Insikt links the domains to prior confirmed CopyCop infrastructure via CSS-stylesheet-hash reuse across the media-impersonation sites. This is included as a technique-class item rather than a core Swiss/European nexus item: the victim is a non-European facility, but the fabricated-media-outlet-plus-coordinated-amplification playbook is the same class Russian-state-aligned actors have run against European targets, and Insikt's infrastructure-fingerprinting method (reused CSS assets) is a transferable detection lead for anyone tracking the same operator.
    region_nexus: "Armenia; no direct Swiss/European targeting in this report, but the operator (CopyCop/Storm-1516) is Russian state-aligned and has run comparable campaigns against European targets"
