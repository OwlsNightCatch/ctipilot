    borderline: false

  - title: "Ransomware encrypts central IT systems at Stadtwerke Landsberg KU, a German municipal multi-utility (power, water, district heating, fibre, EV charging) — public utility operations held because corporate IT and OT were segmented"
    sources:
      - { url: "https://www.stadtwerke-landsberg.de/aktuelles/warnungen-hinweise/stadtwerke-landsberg-ku-information-ueber-it-vorfall", publisher: "Stadtwerke Landsberg KU (victim's own notice)", date: "2026-09-07", role: primary }
      - { url: "https://news.risky.biz/risky-bulletin-anthropic-agents-went-hacking-again/", publisher: "Risky Business News (Risky Bulletin)", date: "2026-09-11", role: corroborating }
    discovery_trace: "first seen at: risky-biz-news, URL https://news.risky.biz/risky-bulletin-anthropic-agents-went-hacking-again/ → primary: Stadtwerke Landsberg KU's own incident notice, URL https://www.stadtwerke-landsberg.de/aktuelles/warnungen-hinweise/stadtwerke-landsberg-ku-information-ueber-it-vorfall"
    summary: |
      Stadtwerke Landsberg KU, the municipally owned multi-utility for Landsberg am Lech, Germany (electricity grid, water supply, sewage treatment, district heating, fibre network, EV charging, a public swimming bath and parking garages), disclosed on 2026-09-07 that it was hit overnight on 1 September 2026 by a criminal cyberattack that encrypted central IT systems. The utility states explicitly that operational technology — the power grid, water and sewage systems, district heating, fibre network, EV charging, the public bath and parking garages — was not affected, only corporate/business IT; no ransomware group has publicly claimed the attack and none is named in the notice. Whether customer personal data (names, addresses, phone numbers, emails, bank account details held for billing) was accessed or exfiltrated "cannot be conclusively determined at this time," per the utility's own statement. Response measures: external cybersecurity specialists engaged, affected systems isolated, a crisis team activated, authorities notified, a criminal complaint filed, and fallback procedures put in place for affected business functions.
    region_nexus: "Germany — a DACH-neighbour municipally owned multi-utility, structurally analogous to Swiss communal Stadtwerke/Elektrizitätswerke (many Swiss municipalities and cantons directly own and operate power, water and district-heating utilities as public-sector critical infrastructure)"
    primary_sector_nexus: "direct"
    sector: "public-sector"
    cves: []
    techniques: [T1486]
    affected_products: []
    entity_keys: []
    new_entities:
      - { key: "incident:stadtwerke-landsberg-ransomware-2026-09", type: incident, name: "Stadtwerke Landsberg KU ransomware attack (September 2026)", aliases: [], summary: "Ransomware encrypted central corporate IT systems at Stadtwerke Landsberg KU, a German municipal multi-utility, overnight 1 September 2026; OT/public-utility operations (power, water, district heating, EV charging) were unaffected per the utility's own disclosure (2026-09-07). No actor has claimed responsibility." }
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "wurden die Stadtwerke Landsberg KU in der Nacht zum 1. September Opfer eines kriminellen Cyber-Angriffs, in dessen Folge zentrale IT-Systeme verschlüsselt wurden"
        attribution: "Stadtwerke Landsberg KU"
        source_url: "https://www.stadtwerke-landsberg.de/aktuelles/warnungen-hinweise/stadtwerke-landsberg-ku-information-ueber-it-vorfall"
      - quote: "Ob und in welchem Umfang auf personenbezogene Daten zugegriffen wurde und ob diese abgeflossen sind, kann zum jetzigen Zeitpunkt noch nicht abschließend beurteilt werden"
        attribution: "Stadtwerke Landsberg KU"
        source_url: "https://www.stadtwerke-landsberg.de/aktuelles/warnungen-hinweise/stadtwerke-landsberg-ku-information-ueber-it-vorfall"
    extended_notes: |
      Verification note: the victim's own notice is the primary (Admiralty-A-eligible as a first-party statement) and
      is corroborated only by Risky Business News' one-line roundup mention (which itself just links the same victim
      notice) — so this is functionally single-source on substance, though the victim's own disclosure is normally
      accepted per the fake-news guard (a first-party statement, not a leak-site claim). No independent German press
      (e.g. BR24, Augsburger Allgemeine local coverage) was checked within the time budget; flagging so the main agent
      can weigh whether to seek a second source before publish. Defender takeaway: the segmentation the utility
      describes (corporate IT encrypted, OT/public-service delivery systems untouched) is the intended outcome of
      IT/OT network segmentation for any municipally owned utility — worth surfacing as a positive control example for
      Swiss cantonal/communal utility operators reasoning about their own IT/OT boundary, rather than only as an
      incident to react to.
    watchlist: []
    borderline: true
    borderline_reason: "out-of-nexus victim (Germany, not Switzerland) with only one substantive source (the victim's own notice); included under PD-11 criterion (b)/(d) — directly transferable IT/OT segmentation lesson for Swiss communal-government-owned utilities, a core constituency structure — but the main agent should weigh the single-source strength before treating it as more than a brief, low-confidence item."

