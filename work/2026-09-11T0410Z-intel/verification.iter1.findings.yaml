  url_or_quote: "\"Reuters independently reports the total now stands at ten or more additional sites, with some trackers citing as many as 23, a discrepancy Reuters states \\\"could not be independently verified\\\" ([Zenity Labs, 2026-09-09]; [heise Security, 2026-09-10])\""
