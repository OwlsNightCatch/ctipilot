- code: F3
  category: claim-not-supported
  section: new-entries
  item: "Ivanti September 2026 Security Update — ITSM, Sentry, EPMM"
  url_or_quote: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0358 cited for: \"Ivanti Sentry carries CVE-2026-83527 (CVSS 8.1) ... ([NCSC-NL NCSC-2026-0358, 2026-09-09])\""
  summary: "NCSC-2026-0358 is titled \"Kwetsbaarheden verholpen in Ivanti Neurons for ITSM\" and lists only the eight ITSM CVEs (12645/12646/12647/12648/12650/12651/12744/12745) — it never mentions CVE-2026-83527 or Sentry. The actual Sentry advisory is NCSC-2026-0357 (fetched, confirms CVSS 8.1, CWE-288 auth bypass) and the actual EPMM advisory is NCSC-2026-0359 (CVE-2026-18851) — neither is cited in the entry's sources[]. The frontmatter sourcing_note claims \"NCSC-NL's three independent per-product advisories (ITSM, Sentry, EPMM)\" were used, but only one NCSC-NL URL (the ITSM one) appears in sources[]. Fix: cite NCSC-2026-0357 for the Sentry claim and NCSC-2026-0359 for the EPMM claim, or correct the sourcing_note."
- code: F4
  category: hallucinated-fact
  section: new-entries
  item: "Ivanti September 2026 Security Update — ITSM, Sentry, EPMM"
  url_or_quote: "evidence[]: \"these ITSM flaws were uncovered through Ivanti's use of advanced large language models integrated into its product security and engineering workflows, marking a rare instance of AI-assisted vulnerability discovery being credited in a formal advisory.\" — publisher: Cyber Security News"
  summary: "Cyber Security News' actual text reads \"...uncovered through the company's use of advanced large language models...\" (fetched 2026-09-11) — the entry's evidence[] quote silently substitutes \"Ivanti's\" for \"the company's\", so it is not a contiguous verbatim substring of the cited page. Meaning is preserved but the substitution itself is the defect per check 4b (\"a re-hedged word is F4\")."
