  url_or_quote: "\"the group's Moscow-based principal, Oleksandr Ieremenko, held an FSB cover identity and was the subject of a US Secret Service bounty ... ([cash.ch, 2026-09-10])\""
  summary: "cash.ch's 2026-09-10 article never names \"Oleksandr Ieremenko\" and says only \"Die USA setzten ein Kopfgeld von einer Million Dollar auf ihn aus\" (no \"Secret Service\"). Both the name and the \"Secret Service\" attribution are exclusive to 20 Minuten's 2026-09-10 article (\"Oleksandr Ieremenko... Der Secret Service hat eine Belohnung von einer Million Dollar ausgeschrieben\"), which is cited elsewhere in the same update section but not attached to this clause. Fix: attach the 20 Minuten citation to this sentence (or add it alongside cash.ch)."
- code: F4
