  - title: "Canton of Bern confirms 1 November 2026 entry-into-force for its new cantonal cybersecurity law (ICSG): 24h/72h mandatory incident reporting for all cantonal administrative units"
    sources:
      - { url: "https://www.kaio.fin.be.ch/de/start/themen/rechtliche-grundlagen/ICSG.html", publisher: "Kanton Bern — Amt für Informatik und Organisation (KAIO), official cantonal source", date: "2026-09-09", role: "primary" }
      - { url: "https://ch.headtopics.com/news/kanton-bern-verscharft-cyberschutz-bei-angriffen-gilt-ab-87600698", publisher: "headtopics.com, relaying Berner Zeitung / Kanton Bern Regierungsrat press statement", date: "2026-09-10", role: "corroborating" }
      - { url: "https://www.derbund.ch/kanton-bern-neues-cybersicherheitsgesetz-gilt-ab-1-november-348551404624", publisher: "Der Bund (Tamedia)", date: "2026-09-10", role: "corroborating" }
    discovery_trace: "first seen at: inside-it-ch RSS feed, URL https://www.inside-it.ch/rss.xml (item \"Bern revidiert Gesetz für Informations- und Cybersicherheit\", 2026-09-10T12:01Z; article body itself repeatedly 429/paywall-blocked across trafilatura/jina/WebFetch transports this run) → pivot: WebSearch (\"Bern revidiert Gesetz Informationssicherheit Cybersicherheit Kanton Meldepflicht 24 Stunden\") → primary: Kanton Bern KAIO official page, URL https://www.kaio.fin.be.ch/de/start/themen/rechtliche-grundlagen/ICSG.html → corroborating: headtopics.com relay of Berner Zeitung, URL https://ch.headtopics.com/news/kanton-bern-verscharft-cyberschutz-bei-angriffen-gilt-ab-87600698 → corroborating: derbund.ch, URL https://www.derbund.ch/kanton-bern-neues-cybersicherheitsgesetz-gilt-ab-1-november-348551404624"
    summary: |
      Canton Bern's government council (Regierungsrat) announced on 2026-09-10 that the cantonal Gesetz über Informations- und Cybersicherheit (ICSG) — passed by the Grand Council on 12 June 2025 — and its implementing Verordnung über die Informations- und Datensicherheit (IDSV) will enter into force on 1 November 2026, confirmed by the canton's own IT/security office (KAIO). From that date, all cantonal administrative units (Dienststellen) must report cyberattacks and security incidents within 24 hours; where personal data is affected, a 72-hour deadline applies instead. The law is built around a graduated (tiered) procedure for ICT assets: depending on protection need, either uniform baseline minimum measures apply or a detailed security-and-data-protection concept is required, and the canton only classifies information as "intern", "vertraulich" or "geheim" where unauthorised disclosure would harm its interests. New obligations include mandatory personal security screening (Personensicherheitsprüfung, PSP) for certain roles and, from 1 November 2026, explicit accountability for security assigned to each agency's or directorate's top leadership as the designated security officer (Sicherheitsverantwortliche/r, SIVE DIR/Amt), supported by security officers (SIBE) and a new central advisory unit (Beratungsstelle Informations- und Datensicherheit, IDS) inside KAIO that also runs the cantonal ISMS. The ICSG/IDSV explicitly satisfies the security requirements for cooperation with the federal government under the national Informationssicherheitsgesetz (ISG). Municipal bodies (Einwohner-, Kirch- und Burgergemeinden) and other public-task carriers are bound by the ICSG/IDSV only to the extent they process cantonal or federal information, use cantonal/federal ICT resources, or handle personal data on the canton's behalf — the cantonal rules otherwise apply to them only as a recommendation. The canton is also standing up a dedicated platform for reporting security incidents, vulnerabilities, data-security breaches and cyberattacks, not yet published. Transition periods of two to three years apply for administrative units to fully implement the new requirements. This complements, rather than duplicates, the revised cantonal data-protection law (KDSG/KDSV), already in force since 1 September 2026.
