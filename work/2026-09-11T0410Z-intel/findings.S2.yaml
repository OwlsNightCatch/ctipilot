  - title: "Zurich District Court hands down verdict in the LockerGoga/MegaCortex/Nefilim trial: 12 years 9 months, exceeding the prosecution's own demand, plus a 10-year expulsion order"
    sources:
      - { url: "https://www.srf.ch/news/schweiz/zuercher-bezirksgericht-hackerangriff-auf-stadler-rail-taeter-zu-langer-haft-verurteilt", publisher: "SRF (Schweizer Radio und Fernsehen)", date: "2026-09-10", role: "primary" }
      - { url: "https://www.cash.ch/news/hacker-von-stadler-rail-und-meier-tobler-zu-langer-haft-verurteilt-967811", publisher: "cash.ch (AWP wire)", date: "2026-09-10", role: "primary" }
      - { url: "https://www.20min.ch/story/bezirksgericht-zuerich-ukrainischer-hacker-52-muss-fuer-fast-13-jahre-ins-gefaengnis-103618489", publisher: "20 Minuten", date: "2026-09-10", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"Bezirksgericht Zürich Urteil LockerGoga MegaCortex Ransomware\") → primary: SRF, URL https://www.srf.ch/news/schweiz/zuercher-bezirksgericht-hackerangriff-auf-stadler-rail-taeter-zu-langer-haft-verurteilt → corroborating: cash.ch, URL https://www.cash.ch/news/hacker-von-stadler-rail-und-meier-tobler-zu-langer-haft-verurteilt-967811 → corroborating: 20 Minuten, URL https://www.20min.ch/story/bezirksgericht-zuerich-ukrainischer-hacker-52-muss-fuer-fast-13-jahre-ins-gefaengnis-103618489"
    summary: |
      The Zurich District Court (Bezirksgericht Zürich) delivered its verdict on 2026-09-10 in the trial this store already tracks (entity incident:zurich-lockergoga-megacortex-nefilim-trial-2026, entry 2026-08-18/zurich-trial-lockergoga-megacortex-nefilim-swiss-victims). The 52-year-old Ukrainian software developer resident in canton Basel-Landschaft, in custody since October 2021, was sentenced to 12 years and 9 months' unconditional imprisonment plus a 10-year expulsion order (Landesverweis) and forfeiture of CHF 300,000 to the state — nine months MORE than the prosecution's own 12-year demand, an outcome all three outlets flag as the court going further than the charge. The court found it proven that the defendant developed key components of LockerGoga, then MegaCortex, then Nefilim over roughly three years and passed the code to still-unidentified operators ("bis heute unbekannte Hintermänner") who selected victim companies and coordinated the extortion; it rejected his defense that he was merely an IT consultant unaware of criminal use, citing ransom notes ("Erpresserschreiben") found on his own data and a body of digital traces on his storage media. He was found guilty of extortion, attempted extortion, serious data damage (schwere Datenbeschädigung) and pornography (child-sexual-abuse material found on his devices); the judge noted his refusal to answer many questions undermined his credibility. Total damage across the ten targeted companies (Switzerland, France, Norway, Scotland, Canada, Netherlands, US; four Swiss — Stadler Rail, Meier Tobler, Crealogix, IHI Ionbond) is estimated above CHF 100 million; three non-Swiss victims paid a combined CHF 4.5 million in ransom, the four Swiss victims paid none. In the Stadler Rail intrusion specifically, the defendant personally exfiltrated roughly 500 GB of confidential data used as a publication threat; Stadler refused to pay. The prosecutor's closing argument reiterated that the group's Moscow-based principal, Oleksandr Ieremenko, operated under an alleged FSB cover identity and was subject to a US Secret Service $1M bounty, and framed the operation as illustrating overlapping interests between criminal ransomware crews and the Russian state; the court found no evidence the convicted defendant himself had intelligence-service ties. The defense's bid for full acquittal — arguing all seized digital evidence was inadmissible because the defendant was not adequately informed of his data-sealing rights during the searches — was rejected by the court. The verdict is not final: the defendant, on his fourth defense lawyer, can appeal to the cantonal Obergericht and ultimately the Bundesgericht; he remains in security detention (Sicherheitshaft) in the meantime.
    region_nexus: "Switzerland — Zurich prosecution/court, defendant resident in Basel-Landschaft; four of ten victim companies Swiss (Stadler Rail, Meier Tobler, Crealogix, IHI Ionbond)"
