  - title: "EU Cyber Resilience Act Article 14 mandatory vulnerability/incident reporting enters into legal effect today (11 September 2026) — update on the tracked CRA reporting-obligation entry"
    sources:
      - { url: "https://digital-strategy.ec.europa.eu/en/policies/cra-reporting", publisher: "European Commission — Shaping Europe's Digital Future (official EU source)", date: "2026-07-31", role: "primary" }
      - { url: "https://www.enisa.europa.eu/topics/product-security/single-reporting-platform-srp", publisher: "ENISA (official EU cybersecurity agency, SRP operator)", date: "2026-09-10", role: "primary" }
      - { url: "https://www.freshfields.com/en/our-thinking/blogs/technology-quotient/cyber-resilience-act-reporting-obligations-take-effect-on-11-september-2026-102nzmk", publisher: "Freshfields (law firm client alert)", date: "2026-08-31", role: "corroborating" }
      - { url: "https://www.privacyworld.blog/2026/09/cyber-resilience-act-11-september-2026-key-starting-point-for-reporting-obligations/", publisher: "Privacy World / Squire Patton Boggs (law firm client alert)", date: "2026-09-07", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"Cyber Resilience Act reporting obligation deadline September 2026\") → pivot: WebSearch (\"Cyber Resilience Act reporting obligations take effect on 11 September 2026\") → primary: European Commission Digital Strategy, URL https://digital-strategy.ec.europa.eu/en/policies/cra-reporting → primary: ENISA SRP page, URL https://www.enisa.europa.eu/topics/product-security/single-reporting-platform-srp → corroborating: Freshfields, URL https://www.freshfields.com/en/our-thinking/blogs/technology-quotient/cyber-resilience-act-reporting-obligations-take-effect-on-11-september-2026-102nzmk → corroborating: Privacy World, URL https://www.privacyworld.blog/2026/09/cyber-resilience-act-11-september-2026-key-starting-point-for-reporting-obligations/"
    summary: |
      This is an update on the entry this store already tracks under entity policy:eu-cyber-resilience-act (entry 2026-08-29/eu-cra-reporting-obligation-ncsc-fi-checklist, an NCSC-FI checklist published ahead of go-live). The deadline that entry anticipated has now arrived: as of 2026-09-11, the EU Cyber Resilience Act's Article 14 mandatory reporting obligation for manufacturers of "products with digital elements" (PDEs) is in legal effect — more than a year ahead of the CRA's main December 2027 compliance date, and covering PDEs already placed on the EU market, not only new ones. Manufacturers must notify actively exploited vulnerabilities and severe incidents through ENISA's centralised Single Reporting Platform (SRP) on a fixed clock that starts from the manufacturer's own awareness (not from platform availability): a 24-hour early warning, a 72-hour detailed notification, and a final report due 14 days after a corrective measure is available (vulnerability) or one month after the notification (severe incident); manufacturers must also inform affected/all users of available mitigations. ENISA continued publishing and dating updates to its SRP operator guidance (Assigned-Representative registration, notification submission/update, and "Particularly Exceptional Circumstances" handling for CSIRT dissemination delays) on 9 and 10 September 2026, immediately ahead of go-live — none of the sources this run reached explicitly confirm the platform is now accepting live submissions, only that ENISA's own target for operational readiness was this date and that guidance material continued to be refreshed into the final two days. Neither the EU Commission's page nor ENISA's SRP page carries an explicit "platform is live" confirmation dated today; this is noted as an open point for the reader rather than asserted. For Swiss public-sector IT, procurement and vulnerability-management teams (Switzerland is outside the EU/CRA's direct jurisdiction), the practical effect is upstream and indirect: EU-market vendors of connected devices, industrial/embedded systems, network equipment and software commonly deployed across cantonal and federal environments are now legally compelled to disclose actively-exploited flaws and severe incidents on this fixed clock, via a new formal channel (SRP → competent CSIRT → ENISA) distinct from existing vendor PSIRT advisories — a new upstream disclosure surface worth tracking alongside existing patch-management intake, and one manufacturers must reconcile against parallel NIS2/GDPR reporting where the same vendor is in scope for those regimes too.
