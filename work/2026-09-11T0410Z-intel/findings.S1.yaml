  - title: >
      Ivanti September 2026 Security Update — ten CVEs across Neurons for ITSM, Sentry and EPMM,
      two unauthenticated CVSS 9.8 deserialization RCEs, AI-assisted discovery credited
    sources:
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12928", publisher: "NCSC Switzerland (Cyber Security Hub)", date: "2026-09-10", role: primary }
      - { url: "https://www.ivanti.com/blog/september-2026-security-update", publisher: "Ivanti (vendor blog)", date: "2026-09-08", role: primary }
      - { url: "https://www.securityweek.com/ivanti-patches-critical-flaws-across-enterprise-security-products/", publisher: "SecurityWeek", date: "2026-09-09", role: corroborating }
      - { url: "https://cybersecuritynews.com/multiple-ivanti-vulnerabilities/", publisher: "Cyber Security News", date: "2026-09-08", role: corroborating }
      - { url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0358", publisher: "NCSC-NL (advisory NCSC-2026-0358, Neurons for ITSM)", date: "2026-09-09", role: corroborating }
      - { url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0357", publisher: "NCSC-NL (advisory NCSC-2026-0357, Sentry)", date: "2026-09-09", role: corroborating }
      - { url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0359", publisher: "NCSC-NL (advisory NCSC-2026-0359, EPMM)", date: "2026-09-09", role: corroborating }
    discovery_trace: >
      first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12928
      (created 2026-09-10T05:49:08Z, in-window) → primary: Ivanti's own blog, URL
      https://www.ivanti.com/blog/september-2026-security-update → pivot (per-CVE vendor advisories
      forums.ivanti.com/s/article/... returned only a Salesforce-community JS shell on every
      transport tried, direct/extract/jina — recipe gap, not cited) → corroborating: SecurityWeek,
      URL https://www.securityweek.com/ivanti-patches-critical-flaws-across-enterprise-security-products/
      → corroborating: Cyber Security News, URL https://cybersecuritynews.com/multiple-ivanti-vulnerabilities/
      (per-CVE CVSS/CWE breakdown table) → corroborating: NCSC-NL advisories NCSC-2026-0357/0358/0359
      (fetched via https://advisories.ncsc.nl/rss/advisories). All ten CVEs independently verified
      against NVD's CVE 2.0 API (services.nvd.nist.gov) for CVSS-vector confirmation; none appear in
      CISA's KEV catalog as of the 2026.09.10 catalog version (checked directly).
    summary: |
      Ivanti's September 2026 Patch Tuesday-aligned disclosure (2026-09-08) covers ten CVEs across
      three product lines, none reported exploited. Neurons for ITSM carries eight: two unauthenticated
      deserialization-of-untrusted-data flaws reaching remote code execution on the server,
      CVE-2026-12744 and CVE-2026-12745 (both CVSS 3.1 9.8, AV:N/AC:L/PR:N/UI:N); three missing-authorization
      flaws letting an authenticated attacker escalate to code execution, CVE-2026-12645/12646/12647
      (all 9.9, PR:L/S:C); and three further authenticated deserialization RCEs, CVE-2026-12650 (9.9,
      PR:L/S:C) and CVE-2026-12651/12648 (8.8 each, PR:L/S:U). Ivanti Sentry carries CVE-2026-83527
      (CVSS 8.1, AC:H), an authentication bypass (CWE-288) letting a remote unauthenticated attacker
      obtain administrative-level access to Sentry deployments managed through EPMM or Neurons for MDM.
      Ivanti Endpoint Manager Mobile (EPMM) carries CVE-2026-18851 (CVSS 8.8, PR:L), a missing-authorization
      flaw (CWE-862) letting an authenticated low-privilege attacker escalate to full administrator.
      Ivanti states the ITSM flaws were found through its own use of large language models integrated
      into product-security and engineering workflows — a rare instance of AI-assisted vulnerability
      discovery credited directly in a vendor's own formal advisory. On-premises Neurons for ITSM needs
      the September patch on versions 2025.2 through 2026.1 (2026.2 gets the fix on 2026-09-21 when it
      ships); the cloud/SaaS version was already patched across all landscapes on 2026-08-09, requiring
      no customer action. Sentry is fixed in R10.8.2/R10.7.3/R10.6.4; EPMM in 12.10.0.0/12.9.0.2/12.8.0.4.
      Ivanti states it has no evidence of exploitation for any of the ten prior to disclosure and that no
      other Ivanti product is affected. Given Ivanti EPMM's and Neurons-family products' documented history
      as a repeated target for edge/MDM exploitation campaigns, cybersecuritynews.com explicitly flags
      prioritising patching of internet-exposed Neurons for ITSM instances.
    region_nexus: "global; Ivanti EPMM/Sentry/Neurons for ITSM are widely deployed for mobile-device management and IT service management across European and Swiss public-sector and enterprise estates"
