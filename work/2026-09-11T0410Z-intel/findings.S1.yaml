  - title: >
      Apereo CAS (Central Authentication Service): vendor discloses an RCE affecting every 7.3.x
      deployment "simply running CAS", patched same week under an embargoed grace-window disclosure
      with no CVE assigned yet
    sources:
      - { url: "https://apereo.github.io/2026/09/08/vuln/", publisher: "Apereo Community Blog (CAS project)", date: "2026-09-08", role: primary }
      - { url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1150/", publisher: "CERT-FR / ANSSI (CERTFR-2026-AVI-1150)", date: "2026-09-10", role: corroborating }
    discovery_trace: >
      first seen at: anssi-fr, URL https://www.cert.ssi.gouv.fr/avis/feed/ (item "Vulnérabilité dans
      Apereo CAS (10 septembre 2026)", https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1150/) →
      primary: Apereo's own vulnerability-disclosure blog post, URL https://apereo.github.io/2026/09/08/vuln/
      (linked from the CERT-FR advisory's Documentation section) → corroborating WebSearch
      ("Apereo CAS 7.3.8.3 vulnerability CVE September 2026 remote code execution") found no
      independent security-press pickup and no CVE assignment as of fetch time.
    summary: |
      Apereo, the open-source project behind CAS (Central Authentication Service) — a widely deployed
      SSO/identity-provider server used across higher education and, per CERT-FR's advisory the same
      day, flagged to the French government constituency — disclosed a vulnerability on 2026-09-08
      under its formal grace-window vulnerability-response process, which withholds full technical
      detail for a period after the fix ships. What Apereo does state: the flaw is not tied to any
      specific feature, extension, customised UI or theme — "You are affected if you simply run CAS" —
      and exploitation "will lead to remote code execution attempts." It affects the 7.3.x release
      line; a third party (working anonymously, with the analysis "almost entirely driven by AI")
      reported it on 2026-09-04 and Apereo shipped the fix on 2026-09-08 as CAS 7.3.8.3, described as a
      drop-in replacement upgrade for standard deployments. No CVE identifier or CVSS score has been
      published as of this writing (neither Apereo's post nor CERT-FR's advisory carries one — an
      unusual gap for an RCE-class disclosure), no proof-of-concept is public and no party reports
      exploitation. CERT-FR (ANSSI) independently carried the advisory the same window, rating the
      risk "exécution de code arbitraire à distance." Because Apereo's own language deliberately omits
      the vulnerable component, the auth precondition and the trigger mechanism during the embargo
      window, this item is patch-now guidance rather than a hunt/detection brief — organisations running
      CAS 7.3.x should upgrade to 7.3.8.3 without waiting for the technical write-up Apereo says will
      follow once the grace window passes.
    region_nexus: "global; CAS is a common SSO/identity-provider choice for higher-education and government e-government portals across Europe, and CERT-FR (France) flagged it to its own constituency the same day"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: []
    techniques: [T1190]
    affected_products:
      - "Apereo CAS"
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "The issue addressed here is not tied or connected to a specific feature or extension of the CAS software... ultimately will lead to remote code execution attempts... You are affected if you simply run CAS."
        attribution: "Apereo Community Blog (CAS project)"
        source_url: "https://apereo.github.io/2026/09/08/vuln/"
      - quote: "The issues were originally reported to the CAS project on September 4th, 2026 and fixed on September 8th, 2026... reported to the CAS project by third-party researchers (who decided to remain anonymous)... almost entirely driven by AI analysis"
        attribution: "Apereo Community Blog (CAS project)"
        source_url: "https://apereo.github.io/2026/09/08/vuln/"
      - quote: "Une vulnérabilité a été découverte dans Apereo CAS. Elle permet à un attaquant de provoquer une exécution de code arbitraire à distance."
        attribution: "CERT-FR / ANSSI (CERTFR-2026-AVI-1150)"
        source_url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1150/"
    extended_notes: |
      Confidence held at MEDIUM rather than HIGH specifically because the vendor has deliberately
      withheld the vulnerable component/function, the CWE class, the auth precondition and any CVSS
      score during its disclosure grace window — the fact of the flaw and the patch are two-source
      verified, but the technical substance a Tier 2/3 responder would want (attack surface, prereqs)
      is not yet public from any source. No CVE/CVSS to report in cve_table for this item since none
      has been assigned. Flag for a follow-up run once Apereo's promised technical write-up lands
      (their post explicitly says "Additional details will be provided once the security grace window
      passes") or a CVE ID is assigned — the store should catch the delta as an update on this entry
      rather than a fresh item.
    watchlist: []
    borderline: false

