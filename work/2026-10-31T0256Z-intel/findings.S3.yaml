      Exposure: hosts where Cursor installed or auto-updated the Anthropic Claude Code extension between 09:27 and 20:35 UTC on 2026-10-29; Phorion's 2026-10-31 update widened the version guidance from 2.1.313 to 2.1.312 and 2.1.313 after Cursor's notice. Cursor and Phorion publish a check for the attacker key comment in authorized_keys; Phorion advises matching the key fingerprint, not the comment. Detection (telemetry classes): process-creation events where a Node/Electron extension-host parent spawns ssh or autossh with remote port forwarding and no command; file-write events to ~/.ssh/authorized_keys by an IDE process; creation of a LaunchAgent, user crontab @reboot entry or scheduled task named after monitoring components shortly after an extension update; dot-prefixed script and key files under ~/.config; extension-install telemetry for the two version numbers. Post-removal check: uninstalling does not remove the persistence; kill tunnel processes, remove the key and persistence, rotate credentials reachable from the host (Cursor step 5). Triage lookalike: administrators legitimately run autossh tunnels; the discriminator is the IDE-extension parent process and a user-writable persistence script, not a systemd or configuration-managed unit. OX Security also published on this (body unreadable). No IOCs recorded here by design.

