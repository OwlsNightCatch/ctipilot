    borderline_reason: "DoS-only impact, but it is remote, zero-click, has a public PoC and interrupts emergency calls, which matters to the emergency-service constituency; the bulletin status could not be verified on a Google page."
    evidence:
      - quote: "Devices updated to the October 2026 patch level or later are protected; devices on earlier patch levels remain vulnerable."
        attribution: "Mark B (smsofdeath.com)"
        source_url: "https://smsofdeath.com/"
      - quote: "Tested across multiple makes and models (Pixel 9 on April 2026 firmware, various Samsung Galaxy and A-series) with a 100% reproduction rate."
        attribution: "Mark B (smsofdeath.com)"
        source_url: "https://smsofdeath.com/"
      - quote: "RESTRICT AUTOMERGE: Fix remote DoS in decodeWapPdu (b/517376969)"
        attribution: "Android Open Source Project"
        source_url: "https://android.googlesource.com/platform/frameworks/opt/telephony/+/735d9672603fa206c4b43cb668c1aa273db70b97%5E%21/"
    extended_notes: |
      Exposure: check the Android security patch level (Settings > About phone) for 2026-10-01 or later on Android 14 to 17 handsets, and inventory any Android 12 or 13 devices in the fleet (no fix expected). An MDM inventory of patch levels is the practical control; the sources name no carrier-side or device-side filter for WAP Push. Detection: telephony-process crash and restart loops in device logs, repeated 'service lost' events, and users reporting dropped calls or a recovery-mode prompt after receiving no visible message; benign lookalike is an ordinary OOM or modem reset, whose discriminator is the repeat on every boot and the recovery wipe-data prompt. Do not choose 'Wipe data' in the recovery prompt (reporter's advice). Post-patch check: none needed beyond patch level, since the flaw is DoS.

