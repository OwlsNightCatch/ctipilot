  - title: "CVE-2026-98432, Linux kernel IPv4 TCP: a SYN-handling use-after-free present since 4.4, with an Anthropic-built remote root exploit against MPTCP listeners; Go services listen with MPTCP by default and Ubuntu and RHEL kernels are still unfixed"
