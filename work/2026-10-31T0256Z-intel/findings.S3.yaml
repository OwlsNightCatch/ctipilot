  - title: "Teams help-desk impersonation to domain-controller identity: Microsoft traces two human-operated intrusions from a Quick Assist session through portable Bun and Java runtimes to AD CS ESC1 certificates with DCSync, and PetitPotam relayed to ESC8 Web Enrollment"
    suggested_kind: threat
    suggested_priority: high
    sources:
      - { url: "https://www.microsoft.com/en-us/security/blog/2026/10/30/help-desk-impersonation-ad-cs-abuse-investigating-esc1-esc8-intrusion-paths/", publisher: "Microsoft Security Blog (Microsoft Threat Intelligence)", date: "2026-10-30", role: "primary" }
    discovery_trace: "first seen at: msft-secblog recent (python3 tools/fetch_source.py msft-secblog recent 12), feed URL https://www.microsoft.com/en-us/security/blog/feed/ -> primary (no pivot needed): https://www.microsoft.com/en-us/security/blog/2026/10/30/help-desk-impersonation-ad-cs-abuse-investigating-esc1-esc8-intrusion-paths/"
    summary: |
      FACTS (Microsoft Threat Intelligence, first-hand investigation, activity not attributed to any actor): in two human-operated intrusions an external Teams contact (messages and calls, organisation-themed onmicrosoft.com tenant names, support-themed display names) persuaded a user to open Quick Assist and read out the code, giving hands-on-keyboard access with no malware attachment and no Teams vulnerability. In the session the operator dropped an archive in Downloads, extracted it into a newly created KB-prefixed folder under the user profile (AppData\Roaming) and started a staged payload with a portable Python, Bun (a renamed executable that still carried Bun version metadata) or Java runtime, which ran host and network discovery and connected to domain infrastructure over LDAPS and SMB while assessing AD CS. Case 1 (ESC1): a certificate template that accepts requester-supplied identity and broad enrollment produced certificates for three privileged accounts in a first wave (three users targeted, one workstation), and about 90 minutes later for eight more in a second wave (16 users targeted); DCSync began within seconds of the first certificate. Defender automated attack disruption restricted the covered identities and blocked more than 1,000 SMB attempts, but one privileged account excluded from automated response stayed usable, reached a file server and ran a renamed Rclone (as SearchApp.exe) copying recursively to an external SFTP destination with 20 concurrent transfers, files up to three years old, excluding executables, databases, virtual disks, media, temp and log types. Case 2 (ESC8): PetitPotam (EFSRPC) coerced a domain controller's machine account to authenticate to the attacker host, which relayed that NTLM authentication to an AD CS Web Enrollment endpoint without relay protection (/certsrv), obtained a Domain Controller-template certificate and used it for PKINIT to get a TGT for the DC account; Defender raised ESC8 alerts, the customer isolated the workstation, and no further progression was seen.
      WHY IT MATTERS (Microsoft's framing, consistent with the mechanics): an issued certificate is an authentication path independent of the first compromised password; resetting the user or reimaging the first workstation does not revoke the certificate or invalidate Kerberos tickets already issued, and revoking a certificate does not retroactively invalidate TGTs or service tickets. Hardening named by Microsoft: HTTPS plus Extended Protection for Authentication on every enrollment web endpoint, remove unneeded Web Enrollment and Certificate Enrollment Web Service endpoints, disable NTLM on enrollment services where feasible, review authentication-capable templates (requester-supplied subject, broad enrollment, weak issuance) and require approval, enable the Certification Services audit subcategory and the CA audit filter, limit Teams external access and federation, allow-list remote-support tools and alert when an approved remote-support process extracts archives or launches interpreters from user-writable paths, and treat containment exclusions as incident decisions with a compensating manual action. This sits next to the entry the store already carries on NTLM relay past signing (SpecterOps/Blackfield) and Talos's Q3 help-desk-vishing finding, but those do not cover AD CS certificate issuance as the privilege step.
    region_nexus: "global; any Swiss public-sector Windows/Active Directory estate with AD CS and external Teams access enabled"
    primary_sector_nexus: "direct (administrations run AD CS and Teams; help-desk social engineering is sector-agnostic)"
