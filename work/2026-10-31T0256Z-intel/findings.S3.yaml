    discovery_trace: "first seen at: blick-ch news sitemap, URL https://www.blick.ch/news.xml (Swiss press titles 'Mega-Hack erschüttert die Krypto-Welt', 2026-10-29, and 'Das musst du zum grössten Krypto-Raub aller Zeiten wissen', 2026-10-30) and bleepingcomputer feed, URL https://www.bleepingcomputer.com/feed/ -> pivot: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/binance-links-63-billion-crypto-theft-to-compromised-devops-laptop/ -> pivot: TRM Labs, URL https://www.trmlabs.com/resources/blog/north-korea-steals-usd-6-36-billion-from-binance-in-the-largest-hack-in-history -> corroborating: SecurityWeek, URL https://www.securityweek.com/6-billion-binance-hack-bears-hallmarks-of-north-koreas-tradertraitor/ (Binance's own statements are X posts and are only used as quoted by these outlets)"
    summary: |
      FACTS (TRM Labs on-chain tracing): on 2026-10-29 an attacker moved about USD 6.36 billion out of Binance wallets on ten blockchains, most of it within about 20 minutes from 20:05 UTC, with a second wave around 23:05 UTC; stablecoin issuers and Arbitrum's Security Council froze about USD 2.7 billion, leaving roughly USD 2.4 billion in the attacker's hands. Preparation started at least 36 hours earlier (small Tornado Cash withdrawals funding an operator wallet, code tested on other wallets). On Ethereum the attacker used EIP-7702 to make a Binance hot wallet delegate to a sweeper contract, with 50 pre-signed authorisations covering consecutive nonces so one would match; on the other nine chains Binance wallets sent funds through ordinary valid signatures. CLAIMS AND ASSESSMENTS: Binance (as quoted by SecurityWeek and BleepingComputer) says its initial investigation suggests a compromised DevOps engineer's laptop gave access to a service container used to submit unauthorised withdrawals, found no evidence of a wallet private-key leak, and that the attack was not a single-permission 'one-click' action; TRM assesses the most likely explanation is that the attacker gained the ability to make Binance's hot-wallet signing system sign transactions of its choosing across chains. TRM attributes the theft to TraderTraitor (DPRK) with high confidence on on- and off-chain intelligence and prior-heist similarities (Bybit 2025, KelpDAO 2026); BleepingComputer reports Chainalysis agreeing with a high degree of confidence (an X post, not independently read). Binance itself has not attributed responsibility.
    region_nexus: "global; Swiss press coverage (Blick); no stated Swiss public-sector exposure"
    primary_sector_nexus: "none direct; transferable lesson is privileged DevOps-endpoint compromise reaching a signing or secrets-bearing service container"
    sector: "financial"
