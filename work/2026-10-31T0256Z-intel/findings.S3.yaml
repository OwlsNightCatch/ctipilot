    summary: |
      FACTS (kernel CVE team, 2026-10-15): CVE-2026-98432 is a use-after-free in the Linux kernel's IPv4 TCP connection setup path (net/ipv4/af_inet.c, net/ipv4/tcp_ipv4.c). tcp_v4_syn_recv_sock() hands ownership of ireq->ireq_opt to the child socket without copying it, and a retransmitted SYN for the same request socket processed on another CPU builds a SYNACK from the options that inet_sock_destruct() and tcp_v4_reqsk_destructor() free with a plain kfree() instead of after an RCU grace period (ip_options_build() reads opt->optlen twice). A second path exists through request-socket migration (net.ipv4.tcp_migrate_req=1 or a BPF_SK_REUSEPORT_SELECT_OR_MIGRATE program). The bug entered with commit 079096f103fa in Linux 4.4 and is fixed upstream in 6.12.113, 6.18.56, 7.2.10 and 7.3-rc7; IPv6 is not affected by the first issue, and an IPv6 migration variant (ipv6_opt, set only by CALIPSO) is left to a separate patch. The CNA scores it CVSS 9.8.
      CLAIMS (Anthropic, 2026-10-27, discoverer): its Frontier Red Team had an unreleased Claude model write an exploit that lets a remote, unauthenticated attacker send packets to a Linux server with a multipath TCP (MPTCP) listener and run arbitrary commands as root; stage one defeats KASLR by making the race drive the kernel to copy an attacker-controlled number of extra bytes back in a reply, stage two overwrites a callback pointer; a lost race only fails the handshake, so the attacker retries, and the proof of concept needed 48 minutes to leak a kernel pointer plus five to reach command execution. The exploit is not public. The Go team (2026-10-29) states the demonstrated exploit needs an MPTCP listener but the bug is not MPTCP-specific, so systems with no MPTCP listener may be exposed to similar attacks; since Go 1.24 Go programs enable MPTCP by default on Linux listen sockets (GODEBUG=multipathtcp=0 or a go.mod directive turns it off), which means Go-built network services can carry an MPTCP listener nobody configured. Go calls per-program disabling fragile and recommends only a patched kernel; CIQ's testing found that setting net.mptcp.enabled=0 alone leaves the plain-TCP path reachable.
      PATCH STATE as read 2026-10-30/31: Debian 12 (6.1.190-1, DLA-4841-1) and Debian 13 (6.12.113-1, DSA-6568-1) fixed; Ubuntu 22.04, 24.04, 26.04 and 26.10 listed 'Vulnerable work in progress' and 20.04, 18.04 and 16.04 vulnerable (Canonical, updated 2026-10-30); Red Hat lists RHEL 8, 9 and 10 as affected (RHEL 6 and 7 not affected per CIQ/BleepingComputer); CIQ had no patched Rocky/RLC kernel on 2026-10-30. Severity statements disagree between sources: the CNA 9.8; the Red Hat page read on 2026-10-31 shows 9.8 and 'Critical' for RHEL while BleepingComputer on 2026-10-30 reported a Red Hat score of 5.9 (DoS-oriented); CIQ cites 8.1 upstream. No source reports exploitation in the wild.
      INFERENCE (mine, mechanical from the stated trigger): CIQ states an unauthenticated peer starts the flaw by sending TCP SYN packets that carry IPv4 options, so inbound SYNs with IP options (IHL above 5) on listening ports are a rare, hunt-able telemetry class, and repeated handshake failures or retransmitted-SYN bursts from one source match the retryable race; a kernel crash or unexplained reboot is the DoS-side signal Red Hat describes.
    region_nexus: "global; any Swiss public-sector Linux server estate (Ubuntu LTS, RHEL/Rocky, Debian) and any Go-built internet-facing service on Linux"
