  - title: "CVE-2026-58882, Android telephony ('SMS of Death'): a single malformed WAP Push SMS crashes com.android.phone, drops calls including emergency calls and loops the phone into recovery; public PoC, fixed in the October update for Android 14 to 17 only"
    suggested_kind: vulnerability
    suggested_priority: notable
    sources:
      - { url: "https://smsofdeath.com/", publisher: "Mark B (reporter, SMS of Death write-up)", date: "2026-10-29", role: "primary" }
      - { url: "https://android.googlesource.com/platform/frameworks/opt/telephony/+/735d9672603fa206c4b43cb668c1aa273db70b97%5E%21/", publisher: "Android Open Source Project (fix commit)", date: "2026-06-15", role: "primary" }
      - { url: "https://www.heise.de/news/SMS-des-Todes-Sicherheitsluecke-laesst-Android-Smartphones-abstuerzen-11506526.html", publisher: "heise security", date: "2026-10-30", role: "corroborating" }
    discovery_trace: "first seen at: heise-sec feed, URL https://www.heise.de/security/feed.xml (item 'SMS des Todes', https://www.heise.de/news/SMS-des-Todes-Sicherheitsluecke-laesst-Android-Smartphones-abstuerzen-11506526.html) -> pivot: researcher page, URL https://smsofdeath.com/ -> pivot: AOSP commit, URL https://android.googlesource.com/platform/frameworks/opt/telephony/+/735d9672603fa206c4b43cb668c1aa273db70b97%5E%21/ (linked from heise). The Android Security Bulletin pages for 2026-10 and 2026-11 could not be read (the paths I tried 404), so the bulletin status is heise's claim only."
    summary: |
      FACTS (researcher write-up plus the AOSP commit): WapPushOverSms.decodeWapPdu() reads the WSP header length as a uintvar into a long, casts it to int with no range check and allocates a byte array of that size; a 5-byte uintvar that decodes to 0x80000000 becomes -2147483648 and the uncaught NegativeArraySizeException kills com.android.phone. The message arrives as a data SMS (WAP Push, port 2948), is never shown in the inbox, and the attacker needs only the victim's number. Effects reported on a Pixel 9 and several Samsung Galaxy models at 100% reproduction: 1-2 seconds of no service per message, active calls dropped including emergency calls, carrier redelivery re-crashing the phone for up to a week from one message, and the poison message retried at every boot, which pushes the device into a recovery wipe-data prompt roughly every 90 seconds; recovery without a factory reset needs a PC and ADB. The reporter filed it with Google on 2026-05-05 (initially closed 'Will Not Fix', per heise), Google's AOSP fix was authored 2026-06-15 and merged 2026-08-05, and the October 2026 Android update carries it for Android 14 to 17; Android 12 and 13 are out of support and unfixed. A working proof-of-concept app is published on GitHub by the reporter. CLAIMS: the researcher says the fix catches RuntimeException and deletes the poison message rather than adding the bounds check he proposed (consistent with the commit message 'Fix remote DoS in decodeWapPdu'); heise reports Google lists the flaw as critical in the coming November bulletin and that it is absent from the October bulletin (I could not verify either on a Google page). GrapheneOS statements cited by heise are X posts and are not used.
    region_nexus: "global; Swiss emergency services and administrations with Android handsets on pre-October patch levels or on Android 12/13"
    primary_sector_nexus: "direct for emergency services (police, fire, EMS, civil protection) whose staff rely on Android phones for voice"
