    suggested_kind: vulnerability
    suggested_priority: critical
    sources:
      - { url: "https://www.rapid7.com/blog/post/ra-rapid7-analysis-unauthenticated-file-upload-to-rce-in-beyondtrust-remote-support-cve-2026-102764/", publisher: "Rapid7 (Jack Heysel, Rapid7 Analysis)", date: "2026-10-30", role: "primary" }
    discovery_trace: "first seen at: rapid7 blog index, URL https://www.rapid7.com/blog/ (fetched via python3 tools/fetch_source.py url, hrefs under /blog/post/) -> primary (no pivot needed): https://www.rapid7.com/blog/post/ra-rapid7-analysis-unauthenticated-file-upload-to-rce-in-beyondtrust-remote-support-cve-2026-102764/ ; the watchTowr intelligence page https://watchtowr.com/intelligence/ lists its own BeyondTrust FAQ (not fetched, undated listing)"
    summary: |
      DELTA on the existing critical entry (BeyondTrust patched CVE-2026-102764 under BT26-05 on 2026-10-15 after GTIG found ARMORY CASTLE exploiting it as a zero-day; GTIG warned of widespread exploitation once the flaw was public). On 2026-10-30 Rapid7 published a full reverse-engineering write-up and states that a Metasploit module now implements the chain (PHP and Unix Command targets). FACTS (Rapid7, own lab reproduction on Remote Support 24.1.2 build 1524046 with public issue-menu session starts and thin chat enabled, the defaults): the flaw is an origin-validation gap between the appliance's internal message router (brain) and the customer-side thin-scc worker. An anonymous customer session (POST to /api/start_session, then a /nw WebSocket) lets the attacker put the reserved local router ID 1 in the source address of a message; the router's anti-spoofing check compares only against the real router ID, the local-address predicate accepts router 1, and the worker treats the message as local, exposing the internal LocalFileTransfer service with its native filesystem provider. The attacker controls file contents and destination path (limited by the worker's filesystem permissions), the same forgery reaches file-send (Rapid7 read /proc/self/environ to learn the install path), and a PHP file written into the site's public directory runs as the site's operating-system user. Rapid7 states other affected releases and fixed builds were not established by its test; the BeyondTrust advisory (already in the entry) remains the source for affected and fixed versions.
      DETECTION DETAIL (Rapid7, what it observed on its exploited lab appliance, with a rejected negative-control request for comparison): the successful request is an extensionless URL that executes the uploaded PHP file, while the same path with .php fails, so rules that only match requests ending in .php miss it; the module's PHP deleted itself afterwards (final 404); an interrupted transfer can leave a temporary file ending .php.n$t (that suffix also belongs to the normal transfer code); thin-scc.log and thin-scc-errors.log under the appliance log directory record the file-service requests, and a successful exploit need not leave a 'DISCARDING NONLOCAL MESSAGE' line because the forged local source passes that check; the HTTP access log shows the public session creation and the request to the uploaded endpoint but not the forged router ID; brain.log gives client addresses and timestamps; debug logging is off by default, so detailed message payloads are not captured.
      WHY IT CHANGES PRIORITY: a public exploit module and a root-cause write-up lower the barrier for opportunistic scanning of internet-exposed self-hosted appliances that have not applied BT26-05; the prior entry's persistence and rebuild guidance for appliances exposed since late August is unchanged.
