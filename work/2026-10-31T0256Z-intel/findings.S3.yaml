      Single-source: Microsoft is first-hand on both cases; the Teams-to-remote-support entry pattern is independently documented elsewhere (Talos IR Q3 trends already in the store; CrowdStrike's legal-sector report describes the same IT-impersonation to remote-tool pattern) but the AD CS branch is Microsoft-only. Exposure: AD forests with an enterprise CA, enrolment templates that allow requester-supplied subject with broad enrolment, Web Enrollment/CES over HTTP or without EPA, Teams tenants allowing external chat and calls, and Quick Assist not restricted. How to tell: Defender for Identity's AD CS posture assessments (Microsoft's pointer) or an inventory of /certsrv endpoints and template ACLs. Detection (telemetry classes): Teams external-chat creation and impersonation-signal audit events; process-creation and network events for bun.exe/java.exe/python started from a KB-numbered folder under AppData\Roaming, then connections on 80, 445, 636 and 88; CA request and issuance records (requester, SAN, template) correlated with the first PKINIT logon using the issued certificate; a domain-controller machine account authenticating to the CA from a device that is not that DC (Microsoft calls the identity-to-source mismatch the strongest pivot); EFSRPC traffic aimed at a DC; DCSync-type replication from a non-DC. Post-incident: revoke the certificates, publish revocation, and separately assess issued Kerberos tickets; password reset and reimage are not enough. Triage lookalike: legitimate help-desk Quick Assist sessions; discriminators are an external-tenant initiator with no ticket, and a Python/Bun/Java runtime launched from a freshly created user-writable folder rather than a managed install path.

