    summary: |
      FACTS (Cursor, first-hand): between about 09:27 and 20:35 UTC on 2026-10-29 (2:27 am to 1:35 pm PT) a modified copy of Anthropic's Claude Code extension, versions 2.1.312 and 2.1.313 for macOS and Windows, was served from the Cursor VS Code extension marketplace; Cursor removed it, shut the marketplace down briefly, rotated its keys, rebuilt it, and had the hosting provider take the attacker server offline. Microsoft Threat Intelligence confirms the packages were never published to the Visual Studio Marketplace or npm, and states that Anthropic told it its systems were not compromised and it did not build the package. How the attacker was able to publish under the Anthropic identity is not disclosed by any source I read (my reading: Cursor's key rotation implies a marketplace-side fault, but no source says so).
      BEHAVIOUR (Phorion and Microsoft, consistent code analysis): a function prepended to the minified extension.js runs the moment Node loads the module, before activate(), with no interaction. It collects host and user data (hostname, user, OS, architecture, home and working directory, global git email, up to forty environment-variable names containing KEY, TOKEN, SECRET, PASS, AWS or GCP; names, not values), appends an attacker Ed25519 public key to ~/.ssh/authorized_keys (de-duplication is by a comment string, not the key), tries to enable the SSH service, opens a reverse tunnel with an embedded private key (outbound ssh or autossh with remote forwarding of the workstation's port 22, retried every sixty seconds) and writes persistence outside the extension directory: a user LaunchAgent with KeepAlive on macOS, an @reboot crontab entry on Linux, a scheduled task requesting SYSTEM with a Startup-folder batch fallback on Windows, all named after monitoring components. Because of coding errors the SSH-enable step fails on a standard-user macOS or Windows host (on macOS, systemsetup -getremotelogin run without admin rights prints an error and exits 0 instead of 'Off', so the enable branch is skipped), so Cursor and Phorion assess the attacker could not log in on most hosts; the key, the persistence and the host-details report still happened. The number of affected users is Cursor's estimate of up to 5,000 (relayed by Sophos). No actor attribution is made by any source.
