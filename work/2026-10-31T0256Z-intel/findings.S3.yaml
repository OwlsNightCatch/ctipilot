      Exposure check for the reader: kernel build via uname -r against the fixed lines above and the distro tracker for the backported package version (Ubuntu and RHEL fixes were not out on 2026-10-30); hosts that expose an MPTCP listener at all (the sources do not name an inventory command); Go binaries built with Go 1.24 or later and not pinned to multipathtcp=0. Interim mitigation published by CIQ is a firewall rule dropping IPv4 TCP packets that carry IP options before the TCP stack, validated on firewalld/nftables hosts; it is a stopgap, not a fix. Compromise check after patching: none stated (no ITW reports), so the post-patch check is a review of kernel logs and crashes plus inbound SYN-with-IP-options flow records since 2026-10-15. Anthropic's post also reports 62 Chrome CVEs patched in Chrome 156 and a Windows kernel QUIC out-of-bounds read (CVE-2026-33096) from the same programme; not assessed here. Primary page date for the Anthropic post is 2026-10-27 (outside the 26 h window); the in-window delta is the Go team guidance, distro-lag status and press pickup of 2026-10-29/30. S1 may surface the same CVE.

