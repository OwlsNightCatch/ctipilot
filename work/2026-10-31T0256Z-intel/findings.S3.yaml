    summary: |
      CLAIMS (ReliaQuest, from its own incident telemetry; the page date in the page metadata is 2026-10-28): attackers combine help-desk, HR or legal impersonation by phone, SMS or external collaboration requests with fake identity, passkey, SSO or enrolment pages, then route sign-in and device registration through residential proxies chosen to sit near the victim's expected location, so impossible-travel, unexpected-country and ASN-reputation signals stay quiet. Actions on objectives began about six minutes after initial access in one incident and about 15 minutes in another. Data theft ran through built-in SaaS APIs rather than malware: in SharePoint cases Microsoft Graph clients generated tens of thousands of file-access events across hundreds of sites, and in one database case an attacker scanned more than 23 billion rows and extracted roughly 136 GB in a 14-hour automated session. ReliaQuest says that in several incidents telemetry showed file access without a matching download event, yet the files later appeared on leak sites, so a download event must not be required before escalating; one compromised identity also reached SharePoint, mail, Salesforce and analytics through SSO, and disabling the user in one application did not revoke the others. It reports blocking more than 350 related impersonation domains since March 2026, with monthly counts rising from 5 in March to almost 100 in the first three weeks of October, many weaponised within hours of registration and themed on passkey, SSO, Okta or enrolment, and says groups like ShinyHunters and related clusters can run the same playbook against many organisations at once (ReliaQuest's association; it gives no attribution evidence for these incidents). ReliaQuest assesses generative-AI templating of the domains as possible but unconfirmed. Mitigations it names: phishing-resistant MFA and managed-device (Conditional Access) policy for sensitive SaaS, and prioritising identity-to-SaaS correlation (new authentication method or device registration followed by Graph or bulk file access) over isolated geography alerts.
