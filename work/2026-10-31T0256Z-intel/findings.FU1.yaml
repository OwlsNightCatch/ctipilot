  discovery_trace: 'first seen at: FU1 spawn lead (Veeam KB 4961 per CERT-FR AVI-1426 and CSIRT Italia) → primary: Veeam KB4961, raw HTML via bridge url (URL https://www.veeam.com/kb4961; the extract rendering dropped the per-CVE headings, so the raw body was read) → CERT-FR advisory (URL https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1426/) naming CVE-2023-22793, CVE-2026-107238, CVE-2026-107239 → HackerOne-CNA CVE records (CVE JSON API https://cveawg.mitre.org/api/cve/CVE-2023-22793 and the two others, read for CWE/affected/SSVC, not for citation) → GHSA page (https://github.com/advisories/GHSA-6762-QXRG-R3X8) and ENISA EUVD search API (https://euvdservices.enisa.europa.eu/api/search?text=Veeam&fromDate=2026-10-20&size=50) → CISA KEV bridge (catalogVersion 2026.10.30) → Veeam Help Center pages for the component''s ports (URLs https://helpcenter.veeam.com/docs/mp/vmware_guide/network_protocols_and_ports.html and https://helpcenter.veeam.com/docs/mp/vmware_guide/install_veeam_mp.html). CSIRT Italia''s Veeam alert was not located by search and is not cited.'
  summary: 'Veeam KB4961 (published 2026-10-29; CVE records published 2026-10-29T22:55Z; CERT-FR 2026-10-30) lists three flaws in Veeam Management Pack for Microsoft System Center, all affecting version 9.1 and all earlier version 9 builds, ''including the Veeam Backup & Replication 13 compatibility patch''. Veeam states ''A fix will not be provided for version 9.x. Customers running version 9.x should upgrade to 13.1.0.334'', and that unsupported versions were not tested but ''are likely affected''. The CNA record is Veeam''s HackerOne CNA entry: affected 9.0 lessThan 13.1.0.334.


    Per CVE, from Veeam''s structured KB fields: CVE-2023-22793 (critical, CVSS 4.0 9.3, AV:N/AC:L/AT:N/PR:N/UI:N) is an unauthenticated RCE on servers running the Veeam Virtualization Extensions service (VE Service); the CNA record adds CWE-502, deserialization of untrusted data. The odd ''2023'' id is genuine: HackerOne reserved it on 2023-01-06 and published it with the other two on 2026-10-29 (CERT-FR, EUVD-2023-60727 and GHSA all carry it), so the year does not date the flaw. CVE-2026-107238 (high, 8.7, PR:L, CWE-502) is RCE as LocalSystem on servers running the Collector service by an authenticated domain user. CVE-2026-107239 (high, 8.8, AT:P/PR:L/UI:P, CWE-23 relative path traversal) is RCE on Collector-service servers by a member of the ''Veeam Virtualization Extensions Users'' group. Veeam says all three were ''Discovered during internal testing'', and says nothing about exploitation. The caller''s phrase ''unauthenticated RCE in some cases'' is accurate for exactly one of the three, CVE-2023-22793.


    Exploitation: none found. None of the three is in KEV (catalogVersion 2026.10.30); EUVD shows no exploitedSince and EPSS 0.0; CISA''s ADP SSVC reads Exploitation none for all three (Automatable ''yes'' only for CVE-2023-22793, Technical Impact total for all); a GitHub repository search for CVE-2023-22793 returned zero repositories. Veeam''s own KB header warns that ''attackers will likely attempt to reverse-engineer the patch to exploit unpatched deployments'', which matters here because the fixed 13.1.0.334 build is the diffing target while 9.x stays unpatched (Veeam''s generic statement, applied to this case by the analyst).


    Exposure of the component: the KB does not state which listener the vulnerable code path uses. Veeam''s Veeam MP for VMware guide documents the VE Service''s default listener as ''Secured TCP 8084'' for Collector-to-service and web-UI-to-service traffic (port chosen at setup) and the web UI as HTTP 4430, with the SCOM Integration Service link on 50052; the service account ''must be a member of the local Administrators group''. These are management-plane ports on the System Center Operations Manager side, not an internet-facing interface by design; reachability is whatever the network allows from workstation, Collector and server segments.'
  region_nexus: global product; relevant only where Swiss administrations or suppliers run System Center Operations Manager with Veeam MP 9.x (VMware, Hyper-V or Veeam Backup & Replication monitoring)
  primary_sector_nexus: 'indirect: monitoring integration deployed by IT operations; also a supplier-side tool at managed-service providers'
