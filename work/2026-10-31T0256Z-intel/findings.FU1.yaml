  - quote: A vulnerability allowing an unauthenticated attacker to perform remote code execution (RCE) on servers running the Veeam Virtualization Extensions service of Veeam Management Pack
    attribution: Veeam KB4961
    source_url: https://www.veeam.com/kb4961
  - quote: A fix will not be provided for version 9.x. Customers running version 9.x should upgrade to 13.1.0.334.
