    attribution: Progress WS_FTP Server 2025 documentation
    source_url: https://docs.progress.com/bundle/wsftp-install-2025/page/Using-WS_FTP-Server-Manager.html
  extended_notes: 'EXPOSURE: Windows only (every CNA record lists platform Windows). Per Progress''s install documentation the Manager is a web admin application at http://<host>/WSFTPSVR/ reachable from ''a computer that has Internet or network access to the server'', and the Ad Hoc Transfer module''s default address is http://<host>:80/AHT (IIS-hosted, user-facing by design). The docs do not say the installer restricts either to a management network, so internet exposure is a deployment decision; the FTP/SSH listeners are the other attack surface (CVE-2026-90865 is tied to FTP notification variables, CVE-2026-90869 to the SSH service). Version check: compare the installed build with 2025.0.4 / 2024.0.7. Not located: release notes for 2025.0.4 and 2024.0.7 (docs.progress.com Fixed Issues page last updated 2026-01-07).

    DETECTION (telemetry classes, anchors only as examples): web-server access logs of the IIS sites hosting /WSFTPSVR/ (Manager), /AHT and the Web Transfer client, looking for administrator logons from unusual source addresses and requests to Manager pages by accounts that never used them; WS_FTP authentication/audit logs for system or host administrator logons following any anonymous probing; process-creation events with the IIS worker (w3wp.exe) or WS_FTP service processes as parent spawning cmd.exe, powershell.exe or other interpreters (the command-injection CVEs execute with ''elevated privileges'' or as the IIS worker process); file-write events under the virtual-folder and web roots. Post-patch compromise check: because CVE-2026-84295 is stated to expose administrative credentials and patching does not rotate credentials already read (analyst inference), rotate WS_FTP system and host administrator passwords after upgrading and review administrator-account and notification-variable configuration for changes.

    HARDENING: upgrade every instance to 2025.0.4 or 2024.0.7; instances on unsupported branches get no patch (CSIRT Italia quoting the vendor), so migrate or take them off the network; keep the Manager (/WSFTPSVR/) and Web Admin reachable from the management network only; review which accounts hold delegated Host Administrator rights (CVE-2026-90863, -90864, -90866).

    SOURCING GAPS: Progress''s bulletin ''WS-FTP-Server-Critical-Security-Alert-Bulletin-September-2026'' (URL taken from the CSIRT Italia page''s references) is a Salesforce Lightning SPA and returned only a ''CSS Error'' shell to extract, WebFetch and jina; the knowledge-article link inside the CNA records (progress.lightning.force.com) requires a Progress ID login. BSI''s CSAF product tree lists 2024.0.6, 2025.0.3, 2024.0.7 and 2025.0.4 as the ''fixed'' products and marks all four ''<'' ranges known_affected for every one of the 15 CVEs, so it does not separate which build fixes which CVE; the per-CVE CNA records are the authority (84294 to 84296 fixed in 2024.0.6 / 2025.0.3, 90861 to 90872 fixed in 2024.0.7 / 2025.0.4).'
- title: 'Veeam Management Pack for Microsoft System Center 9.x: unauthenticated RCE in the Virtualization Extensions service (CVE-2023-22793, CVSS 4.0 9.3) plus two authenticated RCEs; no fix for 9.x, upgrade to 13.1.0.334; no exploitation or public PoC found'
  novelty: new
  borderline: true
  borderline_reason: Vendor-rated unauthenticated network RCE (AV:N/PR:N), but the vulnerable VE Service is an internal management-plane component (documented default TCP 8084 between Collectors, web UI and the service), no exploitation, no PoC, not in KEV, and the product is niche (SCOM-integrated monitoring); the real burden is that 9.x gets no patch and the only fix is a move to 13.1.0.334. The main agent decides whether that clears the entry bar.
