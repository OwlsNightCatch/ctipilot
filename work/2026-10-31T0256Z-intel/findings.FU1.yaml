  summary: 'Progress (as CNA) published 15 CVE records on 2026-10-29 for WS_FTP Server on Windows, in two tranches: CVE-2026-84294, -84295 and -84296 are stated as affecting versions ''prior to 2024.0.6 and 2025.0.3''; CVE-2026-90861 to -90872 ''prior to 2024.0.7 and 2025.0.4''. The first build clear of all 15 is therefore 2024.0.7 on the 2024 branch and 2025.0.4 on the 2025 branch; CSIRT Italia lists 2025.0.3 (10.0.3) and earlier and 2024.0.6 (9.0.6) and earlier as affected and says the vendor will issue no workaround or patch for unsupported versions. The CNA records name only the 2024 and 2025 branches; the sources do not say whether older supported branches are affected. Progress''s own bulletin (community.progress.com) could not be read on any transport (Salesforce SPA shell), so every vendor-side fact below comes from Progress''s structured CNA records as republished by GitHub''s advisory database and ENISA EUVD, cross-read against BSI and CSIRT Italia.


    Unauthenticated network paths (Progress CVSS 3.1 vectors with PR:N): CVE-2026-84295 ''improper authentication ... could allow an unauthenticated remote attacker to access sensitive information, including administrative credentials'', CVSS 10.0 (AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H, CWE-287/522); this is the authentication-bypass-class flaw, and the CNA text names no component or endpoint. CVE-2026-90865, OS command injection through FTP notification variables (''arbitrary command execution with elevated privileges under certain configurations''), CVSS 9.0 with AC:H, PR:N, CWE-78/88. CVE-2026-90867, ''improper access control in the Web Admin console ... could expose administrative functionality to remote authentication attempts'', CVSS 8.1 with AC:H, PR:N. Lower-impact unauthenticated flaws: CVE-2026-90869 (SSH service denial of service, attacker must know an account''s enrolled public key, 7.5), CVE-2026-90870 (Ad Hoc Transfer resource exhaustion, 5.3) and CVE-2026-90871 (path traversal in Ad Hoc Transfer and Web Transfer, integrity impact low, 5.3). The remaining CVEs need an account: CVE-2026-90868 (OS command injection, 9.9, PR:L, ''under certain configurations''), three delegated Host Administrator flaws rated 9.1 (CVE-2026-90863 missing authorization to command execution, CVE-2026-90864 and -90866 path-confinement bypasses that Progress says can reach file write or RCE), CVE-2026-90872 (Manager eval injection to commands as the IIS worker process, 6.6), CVE-2026-90861 (cleartext password of one administrator visible to another through activity logs, 6.6), CVE-2026-84294 (Ad Hoc Transfer path traversal, authenticated read, 7.7), and CVE-2026-84296 and -90862 (MFA bypasses, 6.8 and 4.3). BSI rates the bundle ''hoch'' and CSIRT Italia counts 6 critical and 3 high (it lists CVE-2026-84294, -84295, -90863 to -90869).


    Exploitation: none found as of this check. CISA''s KEV catalog (catalogVersion 2026.10.30) holds no 2026 WS_FTP CVE; ENISA EUVD shows no exploitedSince value and EPSS 0.0 on all 15 records; CISA''s ADP SSVC data inside the CVE records read ''Exploitation: none'' on the 14 records that carry it (Automatable ''yes'' for CVE-2026-84295, -90869, -90870 and -90871); CSIRT Italia''s CVE table leaves its PoC and exploitation columns empty for all nine critical/high CVEs; a GitHub repository search for each of the key CVE ids and for ''WS_FTP 2026'' returned zero repositories. Progress''s own exploitation statement was not read. Context, not evidence of current exploitation: CVE-2023-40044, an authenticated-attacker deserialization flaw in the same product''s Ad Hoc Transfer module, is in KEV (added 2023-10-05, ransomware use ''Known''), so this product line has been a ransomware target after a patch before. Analyst inference (not stated by Progress): CVE-2026-84295 yields administrative credentials, and several of the other flaws are reachable once an administrator or host administrator is authenticated, so the two classes may chain from the network to command execution; no source describes such a chain.'
  region_nexus: global product; Windows-hosted managed-file-transfer servers are common in public administrations and their suppliers; CSIRT Italia and BSI both published, no Swiss-specific statement found in this follow-up
