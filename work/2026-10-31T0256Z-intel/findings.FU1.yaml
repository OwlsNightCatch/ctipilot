  reason: '''python3 tools/fetch_source.py extract https://www.veeam.com/kb4961'' dropped the per-CVE headings and the affected-build detail, leaving three anonymous descriptions with no CVE ids; ''python3 tools/fetch_source.py url https://www.veeam.com/kb4961'' returned the full 207 KB raw HTML and the CVE ids, CVSS and affected builds were recovered by stripping tags. Recipe for Veeam KB pages: use ''url'', not ''extract''.'
- source_id: csirt-italia-veeam
  reason: No CSIRT Italia alert for the Veeam Management Pack was located by WebSearch; the caller's CSIRT Italia reference was not independently read. CERT-FR AVI-1426 was read instead.
- source_id: github-search
  reason: GitHub repository search (api.github.com/search/repositories) via 'url' was served by the jina fallback and returned total_count 0 for each CVE id queried; absence of public PoC repositories is a point-in-time observation, not proof.
