  reason: 'community.progress.com bulletin ''WS-FTP-Server-Critical-Security-Alert-Bulletin-September-2026'' is a Salesforce Lightning SPA: extract returned the 754 KB app shell (direct-raw), WebFetch and jina both returned only a ''Sorry to interrupt / CSS Error'' stub; the CNA-record knowledge link (progress.lightning.force.com) needs a Progress ID. Working route found instead: per-CVE Progress CNA records via ''python3 tools/fetch_source.py url https://cveawg.mitre.org/api/cve/<CVE>'' (full CVSS vector, CWE, affected, ADP SSVC) plus ''url https://euvdservices.enisa.europa.eu/api/search?text=<term>&fromDate=<date>&size=50'' (all vendor CVEs in one call; fields exploitedSince and epss). Progress''s own exploitation statement therefore remains unread.'
