  extended_notes: 'DETECTION (telemetry classes): network flow or firewall logs for connections to the VE Service port (documented default TCP 8084; confirm the configured port on the host) from hosts other than the Collectors, the web UI host and the SCOM management servers; process-creation events with the Veeam Virtualization Extensions or Collector service executables as parent spawning cmd.exe, powershell.exe or other interpreters, with SYSTEM or the service account as the user (CVE-2026-107238 states LocalSystem; the service account is a local Administrators member); membership changes of the local ''Veeam Virtualization Extensions Users'' group (the group named in CVE-2026-107239). No post-patch compromise artefacts are described by Veeam.

    HARDENING: no patch exists for 9.x, so the options are upgrade to Management Pack 13.1.0.334 (check its System Center Operations Manager compatibility first; this is a major-version move) or restrict network reach to the VE Service port to the Collector, web UI and management-server hosts and tighten membership of the ''Veeam Virtualization Extensions Users'' group until the upgrade lands. Which SCOM versions 13.1 supports was not checked in this follow-up.

    TRIAGE NOTE: CVE-2023-22793 is a 2026 disclosure despite its id; a CVE tracker keyed on year would date it wrong.'
