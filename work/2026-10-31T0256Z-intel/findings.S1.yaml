  - "CVE-2026-111357 (Ivanti Connect Secure, KEV 2026-10-30): covered entry already says exploited (status [exploited], cites Canadian Cyber Centre update 1) but not cisa-kev and not patch-available; material delta returned in item 1 (Ivanti patch of 2026-10-29, KEV listing, new fixed builds from the Cyber Centre, CISA due date 2026-11-02, forensic triage flag)."
  - "KEV additions 2026-10-26 to 2026-10-29 (PHP x2, Adobe Commerce PolyShell, Brotli, VMware ESX CVE-2026-41709, Linux kernel CVE-2026-46300, GitLab CVE-2026-97229, Cisco ASA/FTD CVE-2026-76418): all already covered by store entries; no new KEV delta beyond the two Ivanti rows. Cisco ASA entry (cve-2026-76418) re-read: the extracted Cisco advisory page shows no revision-history table and no change from the entry, and NCSC-NL NCSC-2026-0463 of 2026-10-30 restates it (no new delta found)."
  - "No scheduled multi-product vendor release landed inside the window: Microsoft Patch Tuesday was 2026-10-13, Oracle CPU 2026-10-21, Fortinet 2026-10-13 and 2026-10-22 hardening, SAP's next Security Patch Day is the second Tuesday of November, Next.js scheduled release is 2026-11-03 (seven medium issues pre-announced). Nearest in-window batches: the Drupal contributed-project batch of 2026-10-28 (39 advisories, SA-CONTRIB-2026-254 to -292; only -254 confirmed exploited, handled in item 2), GitLab patch release 19.5.3 of 2026-10-29 (eMudhra trust only, item 11), Dell DSA-2026-416 (item 8), Juniper JSA112183 of 2026-10-28 (Session Smart Router and Conductor, 18 CVEs, two EUVD scores seen (5.3 and 3.7), CERT-FR lists remote code execution among the risks, no 9.0+ row seen, bulletin page unreadable; dropped), Apple Xcode 27.2 of 2026-10-29 (CVE-2026-112602/-112605, confidentiality only; dropped), TeamViewer TV-2026-1011 of 2026-10-28 (three High rows, CVSS 7.8 to 8.8, require a connection to a malicious host or a crafted recording, no exploitation; dropped)."
  - "Microsoft Security Update Guide: no in-window CVE with Exploited=Yes or Publicly Disclosed=Yes (revision sweep on latestRevisionDate >= 2026-10-29 shows only Edge, Outlook and SharePoint revisions rated not exploited); dropped."
  - "CISA ICS advisories (cisa csaf-recent): newest batch released 2026-10-29 06:00 UTC (ICSA-26-302-01 to -03, -300-02, -258-06, -125-01, -275-02), before the window start; none returned."
  - "ENISA EUVD: the exploited list (4 records) holds only CVE-2026-111357, CVE-2026-97229, CVE-2026-76418 and CVE-2026-41709, all covered; the 45 records scored 9.0+ on 2026-10-30/31 held no other exploitedSince row. Items noted and dropped as not exploited and niche: Thales Sentinel Keys Server HTTP stack overflow (EUVD-2026-114364, 9.3), ClickHouse Server unauthenticated code execution (EUVD-2026-113778, 9.5, no details published), vsftpd FTPS data-channel hijack (EUVD-2026-113833, 9.1), Teltonika RUTOS (EUVD-2026-113748, 9.4)."
  - "NCSC-NL 2026-10-30: NCSC-2026-0462 Juniper Session Smart Router/Conductor (dropped, see above); NCSC-2026-0463 Cisco ASA/FTD (covered); NCSC-2026-0460 Dell (item 8); NCSC-2026-0461 Linux kernel (item 3)."
  - "BSI WID-SEC items of 2026-10-30 reviewed (20 new): Mattermost authenticated code execution CVE-2026-93851 (EUVD-2026-112505), Progress WS_FTP (15 CVEs, high), ServiceNow AI Platform (authenticated), Veeam Management Pack (kb4961, remote code execution, fixed 13.1.0.334 per CERT-FR AVI-1426), Grafana CVE-2026-100105 (authorization bypass, authenticated, CVSS 7.7): none exploited, none pre-auth at 9.0+; dropped."
  - "Synology SA-26:15 (Node2Shell, 2026-10-29): only Synology Chat Client moderate with fix ongoing, all server packages not affected; dropped. Synology SA-26:14 unchanged since 2026-10-22."
  - "Siemens ProductCERT: SSA-045512 (Node2Shell, VersiCharge, 2026-10-30) and SSA-443410 (Industrial Edge) are mostly known-not-affected lists; SSA-898633 (PAN-OS on RUGGEDCOM APE1808) V1.0 2026-10-30 not read; only SSA-166980 returned (borderline item 10)."
  - "Searchlight Cyber 2026-10-28: AEM cloud pre-auth RCE chain research (patched in cloud; VULN-34973/34975/34976/34977, no CVEs) and a PHP2Shell scanner post: research posts for S3, not S1."
