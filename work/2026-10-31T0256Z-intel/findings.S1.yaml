    entity_keys: ["product:linux-kernel", "product:linux-kernel-kvm-x86"]
    new_entities:
      - { key: "trend:pwnescape-linux-kernel-ipv4-checksum-offload-kvm-escape", type: trend, name: "PwnEscape", aliases: ["CVE-2026-99999", "PwnEscape KVM escape"], summary: "Linux kernel IPv4 checksum-offload flaw that lets a guest rewrite a validated IPv4 header on the host, found by pwn.ai during Vercel's sandbox challenge; CVSS 3.1 9.3 (kernel CVE team record via CSO Online and NCSC-NL)." }
    relation_suggestions: []
    verification: MULTI-SOURCE
