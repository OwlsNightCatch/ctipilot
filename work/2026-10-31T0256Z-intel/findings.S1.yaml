    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/13124 (python3 tools/fetch_source.py ncsc-csh post 13124; recent list fetched with ncsc-csh recent 15) → primary: Drupal SA-CONTRIB-2026-254, URL https://www.drupal.org/sa-contrib-2026-254 (WebFetch; extract hits the site's bot challenge) → corroborating: SecurityWeek, URL https://www.securityweek.com/drupal-commerce-core-vulnerability-exploited-against-online-stores/ (extract); The Hacker News, URL https://thehackernews.com/2026/10/hackers-actively-exploit-highly.html (extract); BSI WID-SEC-2026-4230 via bsi-csaf (bsi-de record)"
    summary: |
      Drupal's advisory SA-CONTRIB-2026-254 of 2026-10-28 says the Commerce Core module "doesn't sufficiently protect certain routes and entity fields, leading to an access bypass that may financially impact the vendor", and that the flaw is being actively exploited in the wild. The Drupal security team scores it 21 of 25 (highly critical: no authentication, low complexity, all module configurations targeted). Affected: Commerce Core before 8.x-2.41 and 3.0.0 up to but not including 3.3.13; fixed: 3.3.13 on the 3.x line and 8.x-2.41 on the older line. Drupal's statistics put the module on more than 42,000 sites (SecurityWeek). Drupal gives no detail on the exploitation, the actor, the number of affected sites or whether it began before the fix. The only attacker-visible effect stated is manipulation of order-related data (NCSC-CH: unauthenticated attackers can bypass access controls and manipulate order data for financial loss); the advisory's guidance is to audit orders for inconsistencies. The same 2026-10-28 Drupal contributed-project batch held 39 advisories (SA-CONTRIB-2026-254 to -292): besides this one, Single Content Sync carries a remote-code-execution and a file-path advisory (SA-CONTRIB-2026-275 and -274, critical 17 of 25), OAuth/OIDC login modules carry authentication or access bypasses (SA-CONTRIB-2026-284 and -290, critical), the CAPTCHA module carries an advisory whose rating says exploit code exists in the wild (SA-CONTRIB-2026-281), and Commerce Core SA-CONTRIB-2026-259 and Media Alias Display SA-CONTRIB-2026-292 carry proof-of-concept ratings; none of those is stated to be exploited.
