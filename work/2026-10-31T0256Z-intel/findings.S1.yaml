      Exposure: any Drupal site running Commerce Core below 3.3.13 (3.x) or below 8.x-2.41 (older line); Drupal says the flaw works whatever the module configuration, and the module covers both the built-in cart and checkout and decoupled front ends reached through APIs. Detection: Drupal's own guidance is to audit store orders for inconsistencies, so the telemetry class is application order data (compare order state, totals and payment status with the payment provider's records) plus web-server access logs; Drupal and the sources name no routes, parameters or request patterns, so nothing narrower is stated, and no mitigation other than the upgrade is named. No actor, no victim count. Not in CISA KEV and not in ENISA EUVD's exploited list at fetch time. NCSC-CH (A) is a single-source-carve-out authority; Drupal advisory is the vendor primary.
