    discovery_trace: "first seen at: GitLab security releases feed, URL https://about.gitlab.com/security-releases.xml (feed; newest item 2026-10-29) after CERT-FR avis CERTFR-2026-AVI-1427 (URL https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1427/, listing from cert-fr avis-recent 40) → primary: URL https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-5-3-released/ (extract)"
    summary: |
      GitLab's patch release of 2026-10-29 (CE/EE 19.5.3, 19.4.5, 19.3.7, 19.2.10, 19.1.10, 19.0.11 and 18.11.14) addresses CVE-2026-111943: "GitLab has removed trust for eight eMudhra intermediate CA certificates whose private keys have been compromised" from the certificate stores it ships. Impacted: all CE/EE versions before 18.11.14, 19.0 before 19.0.11, 19.1 before 19.1.10, 19.2 before 19.2.10, 19.3 before 19.3.7, 19.4 before 19.4.5 and 19.5 before 19.5.3. Upgrading GitLab does not update Runner or AI Gateway: Runner must go to 19.5.1 (and CI/CD job images that bring their own ca-certificates package must be rebuilt) and AI Gateway to 18.11.8, 19.0.13, 19.1.9, 19.2.5, 19.3.3, 19.4.3 or 19.5.3. GitLab.com is already patched. The patch also carries database migrations (downtime on single-node instances). The covered eMudhra entry lists vendor trust-store updates (Oracle Java and OpenJDK among them) but no GitLab release.
