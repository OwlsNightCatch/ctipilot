    novelty: new
    borderline: true
    borderline_reason: "Critical-scored pre-auth authentication bypass on a virtualisation management API, vendor-fixed 2026-10-29, but no exploitation reported and LXD/MicroCloud is a niche stack for the constituency."
    sources:
      - { url: "https://discourse.ubuntu.com/t/security-advisory-critical-vulnerability-found-in-canonical-lxd-and-microcloud/90557", publisher: "Canonical (Ubuntu Discourse security advisory)", date: "2026-10-28", role: "primary" }
      - { url: "https://euvd.enisa.europa.eu/vulnerability/EUVD-2026-114194", publisher: "ENISA EUVD (EUVD-2026-114194, Canonical as numbering authority)", date: "2026-10-30", role: "corroborating" }
    discovery_trace: "first seen at: enisa-euvd, URL https://euvdservices.enisa.europa.eu/api/search?fromScore=9&toScore=10&fromDate=2026-10-30&toDate=2026-10-31&size=100 (url bridge; EUVD-2026-114194, score 10.0) → primary: Canonical advisory, URL https://discourse.ubuntu.com/t/security-advisory-critical-vulnerability-found-in-canonical-lxd-and-microcloud/90557 (extract); the GitHub advisory GHSA-99jp-jwmc-65p4 listed in EUVD references returned a 404 page to the reader"
    summary: |
      Canonical's advisory (2026-10-28) says the mutual-TLS logic of the LXD remote API compared all peer certificates the client sent with the known trust-store entries, although only the leaf certificate proves ownership of the signing key, so an attacker can authenticate to the LXD or MicroCloud API as another identity by placing that identity's public certificate as an intermediate in the chain; in MicroCloud an attacker who intercepts the public certificate of a joining cluster member can authenticate as that member. Depending on the victim identity's privilege the attacker "may gain root access to the host machine". The flaw was referred to Canonical by the Incus project and confirmed to affect LXD. Fixed releases (2026-10-29, progressive roll-out to stable): LXD 6.10.1, 5.21.9, 5.0.11 and 4.0.15; MicroCloud 3.4.1 and 2.1.5. EUVD records it as CVE-2026-112816 with CVSS 4.0 10.0 (network, no privileges, no user interaction). No exploitation report and no workaround other than upgrading was read.
    region_nexus: "global"
    primary_sector_nexus: "indirect (private-cloud virtualisation management plane)"
    sector: "public-sector"
    cves: [CVE-2026-112816]
    techniques: [T1190, T1078]
    affected_products: ["Canonical LXD", "Canonical MicroCloud"]
    entity_keys: []
    new_entities:
      - { key: "product:canonical-lxd", type: product, name: "Canonical LXD", aliases: ["LXD", "MicroCloud"], summary: "Canonical's system-container and virtual-machine manager with a mutual-TLS REST API (and the MicroCloud clustering product built on it); CVE-2026-112816 allows impersonation of a trusted client (Canonical advisory, 2026-10-28)." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    evidence:
      - quote: "The vulnerability allows an attacker that is able to reach the LXD HTTPS API to authenticate as any trusted TLS client, for which the attacker has the public certificate."
        attribution: "Canonical"
        source_url: "https://discourse.ubuntu.com/t/security-advisory-critical-vulnerability-found-in-canonical-lxd-and-microcloud/90557"
      - quote: "However, only the leaf certificate proves ownership of the signing key."
        attribution: "Canonical"
        source_url: "https://discourse.ubuntu.com/t/security-advisory-critical-vulnerability-found-in-canonical-lxd-and-microcloud/90557"
    extended_notes: |
      Exposure: LXD or MicroCloud with the HTTPS API (cluster port) reachable by an attacker who can obtain a trusted client's public certificate (public certificates are not secret by design). Detection: LXD API authentication and request logs showing a client identity whose presented chain contains more than one certificate (our inference from the mechanism; Canonical names no detection). Check that snap channels have rolled the fixed versions (progressive roll-out).
