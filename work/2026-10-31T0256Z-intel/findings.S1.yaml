        attribution: "Anthropic"
        source_url: "https://www.anthropic.com/research/discovering-vulnerabilities-with-claude"
      - quote: "As of October 29, Ubuntu and RHEL have not released a fixed kernel."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/10/linux-kernel-tcp-flaw-with-98-cvss.html"
      - quote: "As of October 29, none of the vendor advisories, the CVE record, or Anthropic's post reports attacks using the flaw."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/10/linux-kernel-tcp-flaw-with-98-cvss.html"
      - quote: "grootschalig misbruik niet waarschijnlijk is"
        original: "grootschalig misbruik niet waarschijnlijk is"
        attribution: "NCSC-NL (English: large-scale abuse is not likely, given exploit complexity and distro mitigations)"
        source_url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0461"
    extended_notes: |
      Exposure: a kernel with an IPv4 TCP listener reachable by the attacker; Anthropic's demonstrated exploit needs an MPTCP listener, and applications request MPTCP per socket (Go 1.24+ listeners do by default; the Go Security Team gives GODEBUG=multipathtcp=0 as a fragile per-program mitigation and says systems without MPTCP listeners may still be vulnerable). Distribution status moves daily; NCSC-NL calls the likelihood "medium" and damage "high". Detection: no behavioural signal is published; the sources note that a lost race fails only that handshake, so a repeated pattern of failing handshakes and retransmitted SYNs from one source against a listener is the only hunting angle the mechanism implies (our inference, not stated by a source). PwnEscape: host kernel patching, guest-only updates do not help. Tracking caveat: pwn.ai's post metadata date is 2026-10-31 (earlier CSO reporting of 2026-10-16 and 2026-10-20 covers the same finding).
