    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/13120 (ncsc-csh recent 15 → post 13120, 2026-10-29) and advisories-ncsc-nl, URL https://advisories.ncsc.nl/advisory?id=NCSC-2026-0461 (ncsc-nl recent 25 → ncsc-nl csaf NCSC-2026-0461, 2026-10-30) → pivot: The Hacker News, URL https://thehackernews.com/2026/10/linux-kernel-tcp-flaw-with-98-cvss.html (extract; distro status table, Go MPTCP guidance) → primary: Anthropic research post, URL https://www.anthropic.com/research/discovering-vulnerabilities-with-claude (extract) and kernel CVE announcement, URL https://lists.openwall.net/linux-cve-announce/2026/10/15/1 (extract) → second CVE: CSO Online, URL https://www.csoonline.com/article/4236460/linux-kernel-gets-a-fix-for-a-flaw-that-enabled-attackers-to-escape-vms.html and discoverer post, URL https://pwn.ai/blog/pwnescape (extract)"
    summary: |
      NCSC-NL's advisory of 2026-10-30 groups two Linux kernel network-stack flaws. CVE-2026-98432 is a race condition in the IPv4 TCP connection set-up (tcp_v4_syn_recv_sock hands ireq_opt to the child socket without copying it; a concurrent retransmitted SYN builds a SYNACK from freed inet_opt/ireq_opt memory) that the kernel CVE team published on 2026-10-15 (the CVE record carries CVSS 9.8, score added 2026-10-24); the bug dates to Linux 4.4 and IPv6 is not affected. Anthropic wrote on 2026-10-27 that its model produced an exploit giving a remote, unauthenticated attacker root command execution against servers with a multipath TCP (MPTCP) listener: a first stage leaks a kernel address (48 minutes in its test) to defeat KASLR, a second overwrites a callback pointer (5 more minutes), and a lost race only fails that handshake, so the attacker can retry; the post publishes no exploit code, kernel version or configuration, and the CVE record and fix do not mention MPTCP. Red Hat, Amazon, Oracle and SUSE score the flaw 5.9 to 8.1 against the kernel team's 9.8, and the Go Security Team says the bug is not specific to MPTCP (Go 1.24 and later programs listen with MPTCP by default). As of 2026-10-29/30 per The Hacker News, Ubuntu and RHEL had no fixed kernel (Red Hat lists RHEL 8, 9 and 10 and OpenShift 4 as Affected, no mitigation it considers deployable), while Debian, Oracle Linux, SUSE and Amazon Linux had fixed packages for some kernels; upstream fixes are in 5.10.272, 5.15.223, 6.1.190, 6.6.159, 6.12.113, 6.18.56, 7.2.10 and 7.3. No source reports attacks, and the flaw is not in CISA KEV. CVE-2026-99999 (PwnEscape, CVSS 3.1 9.3, local/guest vector) lets a guest that controls packet checksum-offload metadata rewrite an already-validated IPv4 header on the host, leaking host memory and, per the discoverer, giving root code execution on the researchers' own KVM and Firecracker hosts; pwn.ai told CSO Online it expects exploits in weaker configurations within weeks and in default hypervisor configurations within a month, and updating guests alone does not fix it.
    region_nexus: "global; Ubuntu and RHEL estates and KVM-based virtualisation are common in public-sector data centres"
    primary_sector_nexus: "indirect (generic server and hypervisor kernel class)"
    sector: "public-sector"
    cves: [CVE-2026-98432, CVE-2026-99999]
    techniques: [T1190, T1068, T1611]
