  - claim_id: c9521defbd
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "body"
    kind: uncited
    text: "A request to the public login script `welcome.cgi` names a protected script in an `X-DSCGI-PATH` header, so the URL passes the authentication check and the header picks the destination."
  - claim_id: 9973a11cfc
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "body"
    kind: uncited
    text: "The upload script `wu.cgi` writes a file to disk before checking that it is a ZIP, and parallel requests run a Perl script before it is deleted."
  - claim_id: 4165261953
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "body"
    kind: uncited
