    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "body"
    kind: derived
    text: "A clean Integrity Checker result does not show the appliance is safe, and patching does not evict an attacker who is already in."
