    text: "Progress WS_FTP Server: unauthenticated CVSS 10.0 flaw can expose admin credentials; fixed in 2025.0.4 and 2024.0.7"
  - claim_id: ed9bbf3653
    entry: 2026-10-31/progress-ws-ftp-server-cve-2026-84295-unauth-cvss-10
    surface: "summary"
    kind: frontmatter
    text: "Progress, as CVE numbering authority, published on 2026-10-29 CVE-2026-84295, an improper-authentication flaw in WS_FTP Server on Windows that could let an unauthenticated remote attacker reach administrative credentials (CVSS 3.1 10.0), together with an unauthenticated command injection under certain configurations (CVE-2026-90865, 9.0) and an access-control flaw in the Web Admin console (CVE-2026-90867, 8.1). Builds before 2024.0.7 and 2025.0.4 are affected, and CSIRT Italia counts 6 critical and 3 high flaws in the release and says Progress will issue no patch for unsupported versions. No source reports exploitation, and CISA's catalog holds no 2026 WS_FTP flaw, though a 2023 flaw in the same product is listed with known ransomware use."
  - claim_id: 01266bba6a
    entry: 2026-10-31/progress-ws-ftp-server-cve-2026-84295-unauth-cvss-10
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every WS_FTP Server on Windows to 2024.0.7 or 2025.0.4 now, partner-facing and internet-reachable instances first, and rotate its administrator credentials afterwards, because CVE-2026-84295 can expose them to an unauthenticated attacker and the upgrade does not change what was already read; an instance on an unsupported branch gets no patch from Progress, so take it off the network or migrate it."
