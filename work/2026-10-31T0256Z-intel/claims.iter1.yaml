    surface: "actions[0]"
    kind: frontmatter
    text: "Update Commerce Core on every Drupal site to 3.3.13 (3.x) or 8.x-2.41 (earlier releases) now, then audit orders back as far as your logs reach for inconsistencies between order state, totals and the payment provider's records, because Drupal says the flaw is exploited, names no other mitigation and does not say when exploitation began."
