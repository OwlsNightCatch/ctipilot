  - claim_id: 7230f599a9
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "body"
    kind: derived
    text: "**Detection:** The appliance's own logs were tampered with, so start upstream: web proxy, load balancer or WAF logs for many requests to `welcome.cgi`, above all with an `X-DSCGI-PATH` header or one whose script differs from the URL path."
  - claim_id: bab0f9a526
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "body"
    kind: derived
    text: "On domain controllers, look for LDAP queries from the appliance's service account for LAPS, BitLocker recovery and password attributes, and spraying from the appliance's address."
