claims:
  - claim_id: 81aafdb44a
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "headline"
    kind: frontmatter
    text: "Ivanti Connect Secure chain: root step patched 29 Oct, CISA lists three flaws; 25.1.1.2 and 22.8R2.5 fall short"
  - claim_id: a39f03df08
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "summary"
    kind: frontmatter
    text: "Ivanti disclosed the exploited Connect Secure authentication bypass CVE-2026-104935 on 2026-10-13; Volexity saw it chained by UTA0576 with a root escalation, CVE-2026-111357, patching library code in memory only so Ivanti's Integrity Checker Tool sees no file change, and going after the appliance's Active Directory service account, LAPS passwords and BitLocker recovery keys. Ivanti patched the root step on 2026-10-29 and CISA listed it and a third chain flaw, CVE-2026-118527, on 2026-10-30; the Canadian Cyber Centre now lists every build before 25.1.1.3, 25.1.3.1 and 22.8R2.6 as affected, which takes in 25.1.1.2 and 22.8R2.5, the builds of 2026-10-13. A patched appliance that was exposed still needs a compromise check, and CERT-FR says it knows of lateral movement using the LDAP and Active Directory secrets stored on the appliance and tells owners to isolate and preserve it before any reset."
  - claim_id: ce0d96ea7b
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "immediate_action"
    kind: frontmatter
    text: "Patch Ivanti Connect Secure now, then check the appliance and its AD account for compromise: Ivanti and CISA confirm exploitation of CVE-2026-104935, and Volexity saw the chain used against a fully patched 22.8R2.4 appliance from 2026-10-03. Upgrade every Connect Secure appliance to 25.1.1.3, 25.1.3.1 or 22.8R2.6, internet-facing ones first: after Ivanti patched the root-escalation step on 2026-10-29 the Canadian Cyber Centre lists every earlier build as affected, 25.1.1.2 and 22.8R2.5 included. Ivanti's Integrity Checker Tool cannot see this chain, so an appliance that was reachable on an affected build needs a compromise check and rotation of the Active Directory service account, LAPS passwords and other secrets it could reach."
  - claim_id: 2a28f5dc94
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every Ivanti Connect Secure appliance to 25.1.1.3, 25.1.3.1 or 22.8R2.6 now, internet-facing appliances first: the Canadian Cyber Centre lists every earlier build as affected, so appliances that took only the 2026-10-13 builds 25.1.1.2 or 22.8R2.5 are still short of the root-step patch; 22.7.x and below are not affected."
  - claim_id: d9a71dd8d8
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "actions[1]"
    kind: frontmatter
    text: "Run a compromise check on every appliance that was reachable on an affected build, starting with proxy, load balancer or WAF logs back to at least 2026-10-03 for welcome.cgi requests that carry an X-DSCGI-PATH header; where compromise cannot be excluded, first cut the appliance off from the internet and the internal network and snapshot a virtual appliance's file system and memory without powering it down, then follow Ivanti's recovery steps and reset the domain service account, LAPS and local passwords, certificates, API keys, the Kerberos tickets of its service accounts and the licence-server authentication the appliance held, because CERT-FR knows of lateral movement using the LDAP and Active Directory secrets."
