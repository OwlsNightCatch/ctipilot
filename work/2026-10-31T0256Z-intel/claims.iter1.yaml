    surface: "body"
    kind: cited
    text: "**Exposure:** 25.1.1.1 and prior, 25.1.2.2 and prior and 22.8R2.4 and prior are affected by CVE-2026-104935 and 22.7.x and below are not ("
    urls: ["https://www.rapid7.com/blog/post/etr-ivanti-connect-secure-zero-day-exploited-in-the-wild-cve-2026-104935/"]
