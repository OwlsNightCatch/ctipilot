    surface: "body"
    kind: cited
    text: "CISA listed it and a third chain flaw, CVE-2026-118527, on 2026-10-30, says each can be chained with the other two, and describes CVE-2026-118527 as a predictable-identifier flaw that lets a remote authenticated attacker upload files with attacker-controlled content to a known location on disk ("
    urls: ["https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: 8bd2b64c6c
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "body"
    kind: cited
    text: "The exploit leaves no web shell and patches library code in memory only, so Ivanti's Integrity Checker Tool, which looks for file changes, does not detect it, and Volexity found log entries removed; The operator then went after the Active Directory service account stored on the appliance: LDAP queries for LAPS passwords, BitLocker recovery keys and password attributes, password spraying, and packet capture of plaintext LDAP, HTTP Basic and NTLM traffic ("
    urls: ["https://www.volexity.com/blog/2026/10/13/a-series-of-unauthenticated-events-chained-exploitation-of-ivanti-connect-secure-zero-days/"]
  - claim_id: 181e78ac3d
