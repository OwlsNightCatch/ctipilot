    text: "On every internet-facing Linux server, install the distribution kernel that fixes CVE-2026-98432 and reboot as soon as it ships (Debian bookworm 6.1.190-1 and trixie 6.12.113-1 are out; Ubuntu and RHEL kernels were not as of 2026-10-30), and until then drop IPv4 TCP packets that carry IP options ahead of the TCP stack as CIQ describes, after testing on one non-production host because it also drops legitimate option-bearing traffic; disabling MPTCP alone does not close the path."
