    surface: "summary"
    kind: frontmatter
    text: "Drupal's advisory SA-CONTRIB-2026-254 of 2026-10-28 says an access bypass in the Commerce Core module, which adds a shopping cart and checkout to Drupal sites, is being actively exploited in the wild; the Drupal security team scores it 21 of 25, needing no authentication and affecting every module configuration. Commerce Core 3.0.0 up to but not including 3.3.13, and earlier releases before 8.x-2.41, are affected, and Drupal tells operators to update and audit their orders for inconsistencies. NCSC Switzerland issued its own advisory on 2026-10-30; Drupal says nothing on the method, the actor or the number of sites hit."
