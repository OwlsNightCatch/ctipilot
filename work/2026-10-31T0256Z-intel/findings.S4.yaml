    relation_suggestions: []
    verification: MULTI-SOURCE
    sourcing_note: "SIHF is the victim's own statement for the access method and dates; the sale figures and the Swiss Basketball claim come from FrenchBreaches (Admiralty C), analysing samples from the sellers; Swiss Basketball has not confirmed."
