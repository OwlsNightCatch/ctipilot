  - title: "FortiBleed 2.0: Hudson Rock analyses 1,703 more FortiGate configuration reports (dated February 2026) holding 40,573 cleartext secrets and 975 domain labels absent from the first dataset"
    lookback: true
    sources:
      - { url: "https://www.infostealers.com/article/fortibleed-2-0-975-new-domains-40573-exposed-secrets-claim-your-ethical-disclosure/", publisher: "InfoStealers (Hudson Rock)", date: "2026-10-27", role: "primary" }
    discovery_trace: "first seen at: infostealers-hudson-rock, URL https://www.infostealers.com/feed/ (feed fetch 2026-10-31, item https://www.infostealers.com/article/fortibleed-2-0-975-new-domains-40573-exposed-secrets-claim-your-ethical-disclosure/) → primary (no pivot needed)"
    summary: |
      Hudson Rock (InfoStealers) reports a second dataset of FortiGate configuration reports obtained from criminal sources: 1,703 files for 1,689 host identifiers, report timestamps almost all on 2026-02-20 (report dates, it stresses, not compromise dates), holding 101,419 credential and account records of which 40,573 carry cleartext secrets, including 37,076 local-user records and 1,576 Active Directory LDAP bind records, plus administrator, SMTP and HA-cluster secrets. It says 924 of the 1,689 host identifiers and 975 of 1,453 domain labels are not in its first 'FortiBleed' dataset (73,932 login rows), and that on the 765 overlapping hosts 524 of 766 administrator login rows match the earlier dataset's username and cleartext password, a match of recorded credentials that, it cautions, does not establish continuous access or reuse. It notes that configurations using FortiOS's default private-data-encryption key can permit offline recovery of stored secrets, that Fortinet supports per-device keys, and that 7,437 of the 37,076 cleartext local-user records are marked disabled. It places the data in the context of the k0t edge-device campaign (Group-IB/NyxLab) and says victim overlap with Qilin and The Gentlemen is described but a direct affiliation is unconfirmed.

      Delta against the store: the FortiBleed 1.0 entry and the k0t entry already carry the exposure and the private-data-encryption lever; this adds a second, smaller dataset with account-level depth and no new vector. No source states a Swiss or public-sector slice.
