      - { url: "https://frenchbreaches.com/alertes/fuite-donnees-federation-suisse-hockey-glace-sihf-87000-personnes-mvovz4lyan9qc7wovbi", publisher: "FrenchBreaches (analysis of the seller's sample; claim figures)", date: "2026-10-26", role: "corroborating" }
      - { url: "https://frenchbreaches.com/alertes/federation-suisse-basketball-piratage-donnees-52000-licencies-mineurs-mvuxxch97tc2qxlgrdy", publisher: "FrenchBreaches (Swiss Basketball claim)", date: "2026-10-30", role: "primary" }
    discovery_trace: "first seen at: frenchbreaches, URL https://frenchbreaches.com/feed.xml (feed fetch 2026-10-31; items Fédération suisse de basketball and SIHF) → primary: FrenchBreaches alert, URL https://frenchbreaches.com/alertes/federation-suisse-basketball-piratage-donnees-52000-licencies-mineurs-mvuxxch97tc2qxlgrdy → pivot: ictjournal, URL https://www.ictjournal.ch/news/2026-10-30/en-bref-le-hockey-suisse-face-a-une-fuite-nvidia-investit-dans-meta-google-devoile (RSS https://www.ictjournal.ch/rss.xml) → primary: SIHF notice, URL https://www.sihf.ch/fr/news/allgemein/202627/informations-destinees-aux-utilisateurs-de-mysihf/"
    summary: |
      Two Swiss national sports federations are linked to data theft from member portals in the same fortnight. SIHF's own notice (2026-10-26) says an unauthorised person logged in to MySIHF with a user's credentials and viewed personal data accessible through that account between 17 and 19 October, that the federation learned on 26 October that MySIHF data was offered for sale on an internet forum, that it blocked the abused access and fixed the security gap on 26 October, informed the Federal Data Protection and Information Commissioner and filed a police complaint, and that passwords were not accessed and no sign of changes to MySIHF servers or programmes was found. Data that may be affected: name, birth date, postal and e-mail address, phone number, club or team membership, role as player, coach or referee, profile photo and, for a small number of users, IBAN. FrenchBreaches (not independent confirmation, a claim analysis) reports the seller 'weykofa' claims 87,226 people, 540,287 rows and about 6.9 GB, and that the sample contains emergency contacts and technical access data.

      Swiss Basketball: FrenchBreaches reports that a forum user called 'Venus1337' claims to have compromised an extranet of the federation and exported 52,344 licensee records, 5,696 coach and 1,523 referee records and 36,689 accounting rows, with names, addresses, birth dates, phones, e-mails and AHV numbers, and that 21,648 of 32,709 interpreted birth dates fall under 18; it found no password or card data, could not determine how access was obtained, and found no official confirmation by the federation. The two claims come from different forum handles; nothing links them to one actor or one software platform. Swiss relevance beyond the sport: the AHV number is the federal social-insurance identifier, and a credentialed account that can read this much data is the kind of over-broad portal role the SIHF notice implies (inference).
    region_nexus: "Switzerland (national federations, FDPIC notified by SIHF)"
    primary_sector_nexus: "indirect: private associations, not public bodies; AHV numbers and minors' data; sports federations intersect with cantonal and federal youth-sport programmes"
    sector: "sport associations (private)"
    cves: []
    techniques: [T1078, T1213]
    affected_products: ["MySIHF"]
    entity_keys: []
