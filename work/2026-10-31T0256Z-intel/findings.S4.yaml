    detection: "Telemetry class: signing and payment service request logs checked against a policy outside the service (destination allowlists, value caps), and wallet-code monitoring (an address that should hold no code turning into a delegation pointer; Blockaid says the delegation was visible on-chain for 3 minutes 24 seconds before the sweep and that its engine classified the delegation transaction as malicious; TRM advises alerting on any unexpected EIP-7702 delegation and treating a request for many authorizations over a range of transaction counts as an indicator). On the engineering side: EDR telemetry from engineer laptops plus audit logs of sessions into service containers from engineer identities. Post-incident check stated by Blockaid: clear a delegation (a new authorization pointing at the zero address) before rotating keys, because the delegation belongs to the address and survives key rotation."
    defender_takeaway: "Source-grounded (TRM): separate signing infrastructure and approval paths by chain and wallet tier, reject EIP-7702 authorizations unless expected, keep a tested revocation path. Analyst reading: engineer endpoints that can reach services which act on keys belong in the privileged tier, and a signature check inside the same trust domain as the signer does not bound the loss."
    extended_notes: |
      Re-check for Binance's promised technical post-mortem (it will say how the laptop was compromised and what the additional points of breach are) and for any government attribution (FBI named TraderTraitor for Bybit). The loss figure moved from $5.7 billion to $6.3 billion within a day and TRM's $6.36 billion is valued at theft time. The previous fire's reopen trigger (post-mortem names the vector) is not met, but the new facts (attribution by two blockchain-intelligence firms, 'additional points of breach', independent signing-infrastructure analysis, Swiss press coverage) change the PD-11 picture. The Bitget entry of 2026-09-29 (actor:jade-sleet, north-korea-nexus) is the closest precedent in the store.

  - title: "Berlin Landesnetz: the attack-detection licences covered only 5 percent of devices, and neither the entry endpoint nor the servers data left from were among them (rbb24)"
    sources:
