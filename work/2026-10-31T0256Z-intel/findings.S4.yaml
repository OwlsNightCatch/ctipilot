  - title: "Fehmarnbelt tunnel contractor FLC confirms an October intrusion; the 'Barracuda' extortion group claims an EDR bypass, access since 17 September, encrypted vCenter virtual machines and 2.44 TB of data"
    sources:
      - { url: "https://femernlinkcontractors.com/update-on-the-cyber-incident/", publisher: "Femern Link Contractors (FLC statement)", date: "2026-10-27", role: "primary" }
      - { url: "https://www.heise.de/news/Cyberangriff-auf-Fehmarnbelt-Tunnel-Gesellschaft-Cybergang-meldet-sich-11504853.html", publisher: "heise online (reports the group's leak-site text; does not verify it)", date: "2026-10-29", role: "corroborating" }
    discovery_trace: "first seen at: heise-sec, URL https://www.heise.de/security/feed.xml (feed fetch 2026-10-31, item https://www.heise.de/news/Cyberangriff-auf-Fehmarnbelt-Tunnel-Gesellschaft-Cybergang-meldet-sich-11504853.html; heise-sec is outside this slice, read as part of the Swiss/German press sweep) → primary: FLC statement, URL https://femernlinkcontractors.com/update-on-the-cyber-incident/ (linked from the heise article)"
    summary: |
      Femern Link Contractors (FLC), the consortium building the Fehmarnbelt tunnel between Germany and Denmark (a state-backed public infrastructure project), states that it discovered a cyber incident on 11 October, immediately activated incident response, isolated affected servers, engaged external specialists, confirms that systems containing personal data were affected, has notified potentially affected people and set up a legal hotline for employees; the investigation is ongoing (statement dated 2026-10-27). heise reports that parts of the construction work were temporarily halted and have resumed, and that a leak site of a group calling itself 'Barracuda' (unrelated to the vendor Barracuda Networks, per heise) now claims the attack and offers the data for US$500,000, individually or as a whole.

      Claims by the group, per heise from the leak-site text (unverified; FLC has not responded to the publication threat): the attackers bypassed the EDR system, had full access to all confidential FLC data from 17 September, then encrypted all VMware vCenter virtual machines, which brought the infrastructure down; the data amounts to 2.44 TB (contracts, correspondence, insurance documents, tunnel-construction photographs, bank accounts and employee information); a deal was blocked, the group says, by Danish police involvement, so it will publish. heise notes the page carries details only the real attackers would know, which FLC could check quickly.

      Why it is here: it is a read-across to the held ARX Group claim (Aurora leak site, Swiss engineering consultancy for tunnel and SBB/USTRA projects), because both are suppliers on public infrastructure projects that hold project documentation and employee data. Out-of-window and out-of-nexus: heise's article is about 12 hours before the window and no Swiss entity is involved.
