        attribution: "SIHF"
        source_url: "https://www.sihf.ch/fr/news/allgemein/202627/informations-destinees-aux-utilisateurs-de-mysihf/"
      - quote: "Nous avons corrigé, le 26 octobre 2026, la faille de sécurité ayant permis l’accès aux données."
        attribution: "SIHF"
        source_url: "https://www.sihf.ch/fr/news/allgemein/202627/informations-destinees-aux-utilisateurs-de-mysihf/"
      - quote: "Sur un forum de pirates, un utilisateur connu sous le pseudonyme **« Venus1337 »** affirme avoir compromis un extranet de la **Fédération suisse de basketball** et exporté les informations auxquelles il avait accès."
        attribution: "FrenchBreaches"
        source_url: "https://frenchbreaches.com/alertes/federation-suisse-basketball-piratage-donnees-52000-licencies-mineurs-mvuxxch97tc2qxlgrdy"
      - quote: "À ce stade, aucune confirmation officielle de la Fédération suisse de basketball concernant cette revendication ne figure parmi les éléments examinés."
        attribution: "FrenchBreaches"
        source_url: "https://frenchbreaches.com/alertes/federation-suisse-basketball-piratage-donnees-52000-licencies-mineurs-mvuxxch97tc2qxlgrdy"
    exposure: "Members, coaches and referees registered in the two federations' portals (names, contact data, birth dates, AHV numbers in the basketball claim, IBAN for a few SIHF users); minors are included in both."
    detection: "Telemetry class for portal operators: authentication and session logs of club or user accounts reading records outside their own club or role, with bulk-read volumes; SIHF's account of one user's credentials reading broadly across three days is the pattern to look for. Guest-side signal: phishing or payment lures that cite the federation, a club or a licence renewal."
    defender_takeaway: "Analyst reading: for public bodies that run member or applicant portals keyed to the AHV number, check that a single credentialed account cannot read beyond its role, alert on bulk reads, and prepare victim-notification text that names the phishing risk."
