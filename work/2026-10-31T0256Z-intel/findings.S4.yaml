    discovery_trace: "first seen at: cyberdaily-au, URL https://www.cyberdaily.au/security (extract; item https://www.cyberdaily.au/security/14364-aussie-holiday-park-operators-compromised-by-rms-cloud-third-party-breach) and borncity, URL https://borncity.com/blog/feed/ (item https://borncity.com/blog/2026/10/29/cybervorfall-im-umfeld-der-tiroler-plattform-feratel-whatsapp-phishing-bei-reisebuchungen/) → primary: RMS Cloud status page, URL https://rmscloud.statuspage.io/ → corroborating: ABC, URL https://www.abc.net.au/news/2026-10-27/rms-holiday-booking-software-hacked/107315194 → pivot (Swiss use of the Deskline interface): WebSearch ('feratel Deskline Schweiz Datenabfluss Buchungsdaten WhatsApp Betrug Schnittstellenzugangsdaten') → Clock Software, URL https://support.clock-software.com/en/support/solutions/articles/9000171707 → background: Tageskarte, URL https://www.tageskarte.io/hotellerie/detail/maritim-informiert-gaeste-ueber-datendiebstahl-bei-ihotelier.html (from WebSearch 'Amadeus Zugriff Reservierungsdaten Lufthansa Swiss Austrian Passagiere Datenvorfall Oktober 2026')"
    summary: |
      Two accommodation-software suppliers disclosed intrusions within days of each other, both followed by phishing of guests that quotes genuine booking details. RMS Cloud (property-management and booking software for more than 6,000 hotels, holiday parks and apartments worldwide, per ABC) says on its status page that on Monday 2026-10-26 it identified unauthorised access to a limited part of its environment, that a subset of guest reservation information (contact information and reservation details) is involved, that credit-card and payment details are not, and that unknown actors are sending phishing by email, SMS and WhatsApp that quotes reservation data and asks guests to confirm payment details; Cyber Daily adds that RMS began issuing new credentials to its integration partners on 2026-10-28, and the status page (2026-10-30) says it notified the Australian Cyber Security Centre, the Australian Information Commissioner and the National Office of Cyber Security.

      For feratel (Tyrol, operator of the Deskline destination and booking platform), the only source is a customer notice relayed by the Borns blog, so this part is single-source: feratel says there is no indication of a break-in into its own systems, that an attacker obtained the Deskline interface access credentials of an interface partner through a third-party system and misused them to pull booking data, that the retrieval ran from 2026-10-25 23:00 to 2026-10-26 01:15, that the data covers bookings with future arrival entered through selected sales channels (name, address, phone, e-mail, travel dates, booked property, price, payment status; no card data), and that the fraud messages seen so far concern the 'Internet' sales channel. Feratel offers MFA for its WebClient and ExpertClient portals as a measure it says is unrelated to the incident; the Tyrolean tourism association reset all passwords in the feratel web client and removed the telephone-number field from the portal. Which interface partner lost the credentials, and through which third-party system, is not stated.

      Pattern, as an assessment: bulk pulls of booking data through supplier or integration-partner access followed by payment-confirmation lures over WhatsApp now appear at several booking platforms in 2026: Amadeus iHotelier (unusual API activity found 2026-09-11, Maritim notified 8,716 guests), Camping.Care (already in the store as the TCS camping entry), RMS Cloud and feratel Deskline. No source ties the incidents to one actor. Swiss exposure: Clock Software's Deskline 3.0 connector lets operators choose Switzerland as the country, and Swiss trade press documented the WhatsApp fraud with real booking data from May 2026 (search results, not fetched); no Swiss destination or RMS customer is named for these two incidents.
