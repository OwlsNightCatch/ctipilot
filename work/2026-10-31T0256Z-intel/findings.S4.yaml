  - title: "Ruag MRO publishes its law-firm investigation: years of insider fraud, and a former employee sent technical drawings of Leopard 2 parts to private mailboxes and to third parties in Germany"
    sources:
      - { url: "https://www.srf.ch/news/schweiz/millionenbetrug-bei-ruag-pfister-spricht-von-schwerwiegenden-verfehlungen-bei-der-ruag", publisher: "SRF (Swiss public broadcaster)", date: "2026-10-30", role: "primary" }
      - { url: "https://www.srf.ch/news/schweiz/millionenbetrug-bei-der-ruag-bundesrat-pfister-mich-schockiert-die-kriminelle-energie", publisher: "SRF (interview with Federal Councillor Martin Pfister)", date: "2026-10-30", role: "corroborating" }
    discovery_trace: "first seen at: srf-news, URL https://www.srf.ch/news/bnf/rss/1646 (feed fetch 2026-10-31, item https://www.srf.ch/news/schweiz/millionenbetrug-bei-der-ruag-bundesrat-pfister-mich-schockiert-die-kriminelle-energie) → primary: SRF, URL https://www.srf.ch/news/schweiz/millionenbetrug-bei-ruag-pfister-spricht-von-schwerwiegenden-verfehlungen-bei-der-ruag. The investigation report itself was not located or fetched."
    summary: |
      Per SRF (2026-10-30), the federally owned defence company Ruag MRO published a law-firm investigation covering deals since 2002, including Leopard 1 and 2 tanks and spare parts, which reports serious compliance violations, structural control weaknesses and a 'business first' culture, with whistleblower tips not adequately pursued. Ruag has filed several criminal complaints (breach of trust, forgery, violation of manufacturing or trade secrets) and proceedings run in Switzerland and Germany against former staff; Ruag seeks EUR 51 million in damages from ten people. SRF reports a EUR 4.5 million purchase of Leopard spare parts from the Dutch state in 2020 that an employee passed on to a related German firm, with Ruag claiming EUR 46.9 million damage, and under-market sales of at least 22 Leopard 2 gearboxes between 2017 and 2022.

      Security-relevant slice: a former employee is alleged to have sent technical drawings to private e-mail addresses and to third parties in Germany, so there is a suspicion that approval-required Leopard 2 components were made by unapproved manufacturers and that parts may have entered Ruag stores and workshops or Swiss Army tanks; Ruag's board chair says the articles reviewed are not safety-relevant and there is no known security risk, and the Defence Department (VBS) had the corresponding spare parts blocked. Material from stores that Ruag runs for Armasuisse for the Swiss Army is also alleged to have been used for third-party deals. The Defence Minister says the full report is still being reviewed and that the owner's own role is under examination. No source describes a cyber intrusion.
