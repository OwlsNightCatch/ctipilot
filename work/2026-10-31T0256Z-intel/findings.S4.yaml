  - title: "Cursor's marketplace served a trojanised Claude Code extension for about 11 hours on 29 October: it plants an SSH key, a reverse tunnel and persistence on Windows and macOS"
    sources:
      - { url: "https://cursor.com/blog/claude-code-extension-security-notice", publisher: "Cursor (security notice, updated 2026-10-30 11:30 PT)", date: "2026-10-30", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/malicious-claude-code-extension-on-cursor-planted-ssh-backdoors/", publisher: "BleepingComputer", date: "2026-10-30", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/feed/ (feed fetch 2026-10-31, item https://www.bleepingcomputer.com/news/security/malicious-claude-code-extension-on-cursor-planted-ssh-backdoors/) → primary: Cursor security notice, URL https://cursor.com/blog/claude-code-extension-security-notice (linked from the BleepingComputer article). The two research posts the article cites (phorion.io and opensourcemalware.com) returned no body through extract and are not cited."
    summary: |
      Cursor, the AI code editor, says that between about 02:27 and 13:35 Pacific time on 2026-10-29 a maliciously modified version of Anthropic's Claude Code extension (versions 2.1.312 and 2.1.313 for Windows and macOS) was available in the Cursor VS Code extension marketplace; the versions were not developed by Anthropic. BleepingComputer reports up to 5,000 developers exposed, a malicious JavaScript loader placed at the start of the extension's main script by researchers' findings (Phorion and OpenSourceMalware, not fetched), and that the extension was the only distribution channel (initial claims about npm, Open VSX and the Microsoft marketplace were wrong).

      Behaviour per Cursor: on load, with no user action, it collects hostname, user name, OS, architecture, home path, environment-variable names, working directories, Git e-mail and public IP; tries to append an attacker-controlled SSH public key (labelled as a telemetry service account) to the user's authorized keys, enable the local SSH service and open a reverse SSH tunnel to the attacker's server; and tries to make the tunnel persistent through a macOS LaunchAgent or a Windows scheduled task that attempts to run as SYSTEM with a Startup-script fallback, retrying about every 60 seconds. Cursor says errors in the malicious code mean the SSH-enable step fails except where the editor ran with administrator privileges, so the tunnel gave no login on most hosts, but the key, the persistence and the reconnaissance POST still happened. Cursor shut down the marketplace, audited it, rotated its keys and had the hosting provider take the attacker server offline. Uninstalling the extension may not be enough, because the payload drops standalone persistence scripts. How the attacker published under Anthropic's name, and whether Cursor's or Anthropic's systems were breached, is not explained (BleepingComputer).
    region_nexus: "global; developers worldwide; no Swiss or public-sector victim named"
    primary_sector_nexus: "indirect: developer endpoints in government IT teams and suppliers that use Cursor with the Claude Code extension"
    sector: "technology / developer tooling (supply chain)"
    cves: []
    techniques: [T1195.002, T1059.007, T1082, T1098.004, T1572, T1543.001, T1053.005]
    affected_products: ["Cursor", "Anthropic Claude Code extension for VS Code (versions 2.1.312 and 2.1.313 in the Cursor marketplace)"]
    entity_keys: ["product:cursor", "product:anthropic-claude-code"]
    new_entities:
      - { key: "incident:cursor-marketplace-trojanised-claude-code-extension-2026-10", type: incident, name: "Trojanised Claude Code extension in the Cursor marketplace (October 2026)", aliases: [], summary: "A maliciously modified Anthropic Claude Code extension (2.1.312 and 2.1.313 for Windows and macOS) was served from Cursor's extension marketplace for about 11 hours on 2026-10-29 and tried to plant an SSH key, a reverse tunnel and persistence (Cursor, BleepingComputer, 2026-10-29 and 2026-10-30)." }
    relation_suggestions:
      - { subject: "incident:cursor-marketplace-trojanised-claude-code-extension-2026-10", object: "product:cursor", basis: "Cursor states the malicious versions were distributed through its own VS Code extension marketplace (Cursor security notice, 2026-10-29)" }
    verification: MULTI-SOURCE
    sourcing_note: "Vendor security notice (Cursor, first-party) plus BleepingComputer; the research posts by Phorion and OpenSourceMalware were not readable and are not relied on."
    confidence: HIGH
    classification_hint: { reliability: A, credibility: 1 }
    priority_hint: routine
    novelty: new
    borderline: true
    borderline_reason: "Out-of-nexus supply-chain incident, vendor-disclosed with a closed exposure window; qualifies only under PD-11(b)/(d) as a transferable developer-endpoint lesson. It may overlap an S1 or S3 item on the same extension; main agent to dedupe or drop."
    evidence:
      - quote: "The extension runs malicious code that attempts to install a persistent SSH backdoor."
        attribution: "Cursor"
        source_url: "https://cursor.com/blog/claude-code-extension-security-notice"
      - quote: "Uninstalling the extension may not be sufficient — the payload drops standalone persistence scripts that keep running."
        attribution: "Cursor"
        source_url: "https://cursor.com/blog/claude-code-extension-security-notice"
      - quote: "The malicious extension appends the attacker's public key, labeled `svc-telemetry`, to your SSH authorized keys."
        attribution: "Cursor"
        source_url: "https://cursor.com/blog/claude-code-extension-security-notice"
      - quote: "A malicious version of Anthropic's Claude Code VS Code extension was distributed through Cursor's extension marketplace for approximately 11 hours on October 29, exposing up to 5,000 developers to malware designed to install persistent SSH backdoors."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/malicious-claude-code-extension-on-cursor-planted-ssh-backdoors/"
    exposure: "Developers who installed or updated the Claude Code extension at version 2.1.312 or 2.1.313 from the Cursor marketplace on macOS or Windows between 02:27 and 13:35 Pacific on 2026-10-29. Vendor check: look for the telemetry-labelled key in the user's authorized-keys file (and, on Windows, the administrators authorized-keys file)."
    detection: "Telemetry class: endpoint file-write events to the SSH authorized-keys files from an editor or extension host process; process-creation events for ssh with reverse port forwarding or autossh with an editor as ancestor; LaunchAgent plist writes and scheduled-task creation by the editor's child processes; extension-installation telemetry for the two versions inside the window; egress to the attacker host (Cursor lists it). Post-patch compromise check: removing the extension does not remove the key, the persistence objects or running tunnel processes; Cursor provides remediation scripts and says to rotate credentials and sessions reachable from affected hosts, from a trusted system, and to consider a rebuild."
    triage: "Legitimate reverse SSH tunnels and autossh exist among administrators; the discriminators in the source are that the key is appended by an editor extension process, carries a telemetry-service-style comment, and that persistence objects are named to resemble system-monitoring components and retry about every 60 seconds."
    defender_takeaway: "Analyst reading: treat editor extension marketplaces as a software supply-chain channel: pin or allowlist extensions and versions on developer endpoints, and add authorized-keys and tunnel-process monitoring to the developer-endpoint detections."
    extended_notes: |
      Not an IOC list on purpose: the Cursor notice carries hashes, an attacker address, a key fingerprint and persistence names, which are in the source for responders who need them.

  - title: "Swiss sports federations' member portals: SIHF confirms a third party read MySIHF data with a user's credentials and offered it for sale; a different actor claims 52,000 Swiss Basketball licence records including AHV numbers"
    sources:
      - { url: "https://www.sihf.ch/fr/news/allgemein/202627/informations-destinees-aux-utilisateurs-de-mysihf/", publisher: "Swiss Ice Hockey Federation (user notice)", date: "2026-10-26", role: "primary" }
