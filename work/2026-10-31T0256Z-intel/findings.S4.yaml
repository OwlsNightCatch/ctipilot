    discovery_trace: "first seen at: borncity, URL https://borncity.com/blog/2026/10/31/neue-erkenntnisse-im-cybervorfall-auf-senatsverwaltung-berlins/ (RSS https://borncity.com/blog/feed/) → primary: rbb24 Recherche, URL https://www.rbb24.de/politik/beitrag/2026/10/berlin-hackerangriff-verwaltung-darknet-rhysida-daten-senatorin-bonde.html → primary mirror: rbb press release, URL https://www.presseportal.de/pm/51580/6374775"
    summary: |
      rbb24 Recherche (2026-10-21), citing replies from the Senate Department for Urban Development, reports that the attack-detection system introduced in 2026 was licensed for only five percent of all devices, that extending it was 'not possible for financial reasons', and that neither the endpoint identified as the criminals' entry point nor the servers from which data later left were covered by it. rbb24 also reports that IT-security funding was only partly available in 2024 although the state's information-security guideline has required adequate staffing and funds since 2017, that Berlin planned in 2023 to expand detection and containment, and that the departments' own affected data included unstructured files from shared and personal directories, among them identity-card copies of employees and the transport senator (department-confirmed). BSI had warned of ClickFix at least since March 2025, publicly and in daily situation reports that also went to the states; rbb24 says it remains unanswered whether those warnings reached the two departments, because Berlin-CERT (at the state IT service centre) informs agency security officers and each agency implements measures itself. The Borns blog repeats these findings on 2026-10-30 with the same numbers; it adds nothing of its own.

      Delta against the existing entry: the entry records the phishing-click vector, the BSI confirmation and the leak contents, but not the control gap (detection licensed for 5 percent, the compromised endpoint and exfiltration servers outside it), the split of responsibility between a central CERT and agencies, or the data-hygiene finding (identity documents in shared directories). Contradiction to hold: the store records BSI's own confirmation (Mastodon post and BITS advisory, reported by heise) that TerminalFix was the vector, while rbb24 writes that BSI did not confirm to it whether the Berlin attack followed that pattern. Recency: the rbb24 primary is 10 days old; only the Borns relay is inside the window.
