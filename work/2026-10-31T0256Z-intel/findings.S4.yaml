    summary: |
      Binance, the largest crypto exchange by volume, lost about $6.3 billion from hot wallets on ten blockchains on 2026-10-29, most of it within about 20 minutes from 20:05 UTC (TRM Labs: $6.36 billion at the time of theft, about four times the $1.5 billion Bybit theft of February 2025). Facts from Binance's own announcement (published 2026-10-30, updated the same day): its initial investigation suggests a compromised DevOps engineer's laptop, that the attacker reached a service container and submitted unauthorized withdrawal transactions, that it has found no evidence of a wallet private-key leak, that the estimated impact is about $6.3 billion with about $3 billion frozen on-chain, that withdrawals are suspended while security checks finish (the announcement's update says deposits are unaffected; BleepingComputer's earlier wording says deposits and withdrawals), that the affected address authorisation was revoked, that losses will be covered from its SAFU fund and company funds, and that a technical post-mortem follows once facts are verified. Binance's co-CEO said (per BleepingComputer) the attacker did not simply use one engineer's permissions and that the attack was more complex than a single action, and Binance said it "uncovered additional points of breach" (X posts, relayed by BleepingComputer and Inside IT; not fetched directly). This goes beyond what the 2026-10-30 fire held: that run dropped the item as a preliminary 'laptop' finding with no attribution.

      Independent on-chain analysis (TRM Labs, Blockaid) describes the mechanics. On Ethereum the attacker submitted one transaction carrying 50 EIP-7702 authorizations signed by a Binance hot wallet's key at consecutive transaction counts, so that one was valid when executed; the wallet was thereby delegated to an attacker-written sweeper contract, which drained it about three and a half minutes later and kept draining new deposits for hours because the delegation stayed in place. On the other nine chains, Binance wallets of different key types sent funds to the attacker through ordinary signed transfers inside the same half hour. TRM assesses (assessment, not a Binance statement) that the most likely explanation is that the attacker could make Binance's hot-wallet signing system sign transactions of its choosing across chains. Preparation began at least 36 hours earlier: a Tornado Cash-funded operator wallet, code tested and rehearsed on attacker-owned wallets. Tether, Circle, Ripple, World Liberty Financial and the Arbitrum Security Council froze about $2.7 billion; TRM says the attacker still controls about $2.4 billion in assets no issuer can freeze.

      Attribution is a third-party assessment: TRM Labs attributes the theft to North Korea's TraderTraitor with high confidence, citing on- and off-chain intelligence and similarities to the Bybit and KelpDAO thefts (small mixer withdrawals funding the operator wallet, early staging, signatures prepared in advance); BleepingComputer reports Chainalysis stating the same with a high degree of confidence. Binance has not attributed the theft and says it is working with law enforcement; SRF notes the identity is unconfirmed. The initial-access technique against the engineer's laptop is not described by any source. PD-11 basis: (a) global scale, the largest crypto theft on record, with Swiss trade press and SRF covering it, and (b) a stated access path, an engineer endpoint with reach into a service that can request privileged signatures, transferable to any organization whose engineers' endpoints can reach payment, signing or deployment services. The store already carries the Bitget theft of September 2026 (same TraderTraitor/Jade Sleet alias set) as a precedent for a crypto-exchange theft entry.
