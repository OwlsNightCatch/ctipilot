    discovery_trace: "first seen at: nextgov-fcw, URL https://www.nextgov.com/cybersecurity/ (extract of the cybersecurity listing) → drill: https://www.nextgov.com/cybersecurity/2026/10/officials-suspect-iran-series-cyberattacks-military-base-freezers/416934/ and https://www.nextgov.com/cybersecurity/2026/10/pentagon-investigates-suspected-cyberattack-behind-military-freezer-failures/416926/ → pivot: WebSearch (\"Pentagon military commissary freezer malfunctions suspected cyberattack Reuters Stars and Stripes Fort Huachuca\") → WebSearch (\"Pentagon investigating suspected cyberattack freezers commissaries Iran-linked Cyber Command French authorities October 30 2026\") → pivot: Task & Purpose, URL https://taskandpurpose.com/news/military-commissary-cyberattack-pentagon-investigation/ (carries the DoD and Army CID statements and links the Reuters exclusive) → primary: Reuters exclusive via US News, URL https://www.usnews.com/news/world/articles/2026-10-29/exclusive-pentagon-treating-military-base-freezer-malfunctions-as-suspected-cyberattack-officials-say (reuters.com itself answers with a CAPTCHA)"
    summary: |
      Facts (Reuters, 2026-10-29, citing four officials): the Pentagon is treating the August freezer malfunctions at US military bases as a suspected hack, at least six commissaries (on-base grocery stores) were affected according to Reuters' review of the bases' own posts, and in at least one case the cooling units' temperatures were cranked up overnight rather than the units simply stopping, which matches the forced-defrost pattern of the French supermarket attack already in the store. A Department of Defense official told Task & Purpose that the Defense Criminal Investigative Service leads a joint investigation; Army CID's Cyber Field Office says it works with DCIS, the Defense Commissary Agency and French law enforcement on the refrigeration outages in Europe, and a Cyber Command unit is coordinating with interagency partners. Reuters could not establish whether Danfoss or any other controller brand ran at the affected US bases, could not say how far the investigation is or who is responsible, and the Pentagon has not publicly confirmed that hackers caused the failures.
      Claim (Nextgov, 2026-10-30, two anonymous people familiar with the matter): US officials suspect Iran-linked hackers; Nextgov itself writes that the entry method is unclear and that the assessment may change. No other outlet found makes the Iran attribution, so it is one outlet's anonymous-source claim, not an established finding; the earlier Danfoss entry's French-side evidence (ANSSI: exposed controllers with weak passwords; Forescout: hacktivist-claimed refrigeration attacks) neither supports nor contradicts it.
      What is new for the existing entry: the activity class may have hit a military logistics estate in August, about six weeks before the French incident of 11 to 12 October, and law enforcement on both sides of the Atlantic is comparing the two. Our assessment (not stated by the sources): the investigation is a reason to treat cold-chain and building-supervision controllers of Armed Forces, civil-protection and public-institution sites (canteens, hospitals, stores) as in scope of the exposure check the entry already recommends.
    region_nexus: "United States and France; Swiss nexus only through the existing entry (NCSC.ch rated the refrigeration activity exploited) and by analogy for Swiss Armed Forces and public-institution cold chain"
