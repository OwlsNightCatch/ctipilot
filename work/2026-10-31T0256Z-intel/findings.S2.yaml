  # ITEM 2 - Request Tracker / RTIR security releases (borderline)
  # ---------------------------------------------------------------------------
  - title: "Request Tracker 6.0.4 and 5.0.11 and RT for Incident Response: 30 CVEs fixed, among them stored XSS from unauthenticated email to a public queue, an ExecuteCode-bypass RCE and a CSRF that grants SuperUser; no exploitation reported"
    novelty: new
    borderline: true
    borderline_reason: "No exploitation reported and most of the 30 fixes need an authenticated user holding a specific right; relevance depends on whether Swiss public-sector service desks or CSIRTs run RT/RTIR, which no source establishes. Kept because RTIR is incident-handling tooling and the unauthenticated-email stored XSS fires in the session of the analyst who opens the ticket. The main agent decides; S1 may already carry it from the vendor side."
    sources:
      - { url: "https://docs.bestpractical.com/release-notes/rt/6.0.4", publisher: "Best Practical (RT 6.0.4 release notes)", date: "2026-10-29", role: "primary" }
      - { url: "https://docs.bestpractical.com/release-notes/rt/5.0.11", publisher: "Best Practical (RT 5.0.11 release notes)", date: "2026-10-29", role: "primary" }
      - { url: "https://cert.pl/en/posts/2026/10/CVE-2026-105454/", publisher: "CERT Polska", date: "2026-10-30", role: "primary" }
    discovery_trace: "first seen at: cert-pl, URL https://cert.pl/en/rss.xml (feed fetch; item dated 2026-10-30) → drill: https://cert.pl/en/posts/2026/10/CVE-2026-105454/ → pivot: WebSearch (\"Best Practical Request Tracker 6.0.4 5.0.11 security release XSS CVE-2026-105454\", no vendor hit) → pivot: https://docs.bestpractical.com/release-notes/rt/index.html (lists 6.0.4 and 5.0.11 as current) → primary: https://docs.bestpractical.com/release-notes/rt/6.0.4 and https://docs.bestpractical.com/release-notes/rt/5.0.11"
    summary: |
      Best Practical released Request Tracker (RT) 6.0.4 and 5.0.11 on 2026-10-29, saying each release addresses many security issues and that all users should upgrade as soon as possible; the 6.0.4 security list carries 30 CVE ids (it also completes the earlier fix for CVE-2026-41073) and the 5.0.11 list 28. CERT Polska reported most of them and published its own advisory on 2026-10-30 for three cross-site scripting flaws, CVE-2026-105454 to CVE-2026-105456.
      The path that needs no account: RT does not HTML-escape the URL when it auto-links URLs in HTML ticket content, so HTML email from any sender to a queue that grants CreateTicket or ReplyToTicket to Everyone plants script that runs with the viewer's rights when the ticket history is displayed (CVE-2026-105454, RT 5.0 and 6.0). In RT for Incident Response (RTIR), which opens the Incident Reports queue to everyone by default, the subject of an emailed report runs script when a handler splits the ticket or creates an incident from the report (CVE-2026-105455, RTIR 6.0 only; RTIR 5.0 is not affected), and RTIR's extension of the HTML scrubber lets javascript: links through across the whole RT instance once RTIR is installed (CVE-2026-105456, fixed in RTIR 5.0.11 and 6.0.4).
      Reported by Jurre van Bergen and Threatnotify: remote code execution through a bypass of the ExecuteCode right by a user holding ModifyTemplate but not ShowTemplate, which also bypasses $DisallowExecuteCode (CVE-2026-108351); an unauthenticated denial of service through unbounded growth of the CSS cache (CVE-2026-108349); forged verified-signature status on incoming GnuPG and S/MIME mail (CVE-2026-108272, CVE-2026-108350); and security tokens and password salts generated with a non-cryptographic random generator, now taken from the system's cryptographic source (CVE-2026-108348). Further fixes include a cross-site request forgery through the URL shortener in which a crafted short link followed by an administrator makes rights changes up to granting SuperUser (CVE-2026-108279, RT 5.0.4 and later and RT 6.0), a ticket-forwarding authorization bypass that mails out any transaction including on tickets the user cannot see (CVE-2026-108270), and a privilege escalation through the REST group endpoints (CVE-2026-108353). Most of the remaining fixes require an authenticated user holding a specific right (ForwardMessage, ModifyTemplate, ShowConfigTab, AdminGroup).
      Neither the vendor nor CERT Polska reports exploitation. CERT Polska's tables print the affected ranges with an inclusive upper bound (5.0.0 to 5.0.11, 6.0.0 to 6.0.4) while the same page says the fix is in 5.0.11 and 6.0.4, and the vendor lists those as the fixing releases: read it as affected before 5.0.11 and before 6.0.4. Both branches also gain TOTP multi-factor authentication, configurable password policies and self-service password reset (off by default), which need the new $SecretKey option set before users enroll.
    region_nexus: "global; Polish national CERT coordinated; no Swiss victim or Swiss-specific statement in any source"
    primary_sector_nexus: "indirect (ticketing and incident-handling software used by IT service desks and CSIRTs; use inside Swiss public bodies not established)"
    sector: "public-sector"
    cves: [CVE-2026-105454, CVE-2026-105455, CVE-2026-105456, CVE-2026-108351, CVE-2026-108349, CVE-2026-108279, CVE-2026-108348, CVE-2026-108272, CVE-2026-108350, CVE-2026-108270, CVE-2026-108353]
    cves_note: "The 6.0.4 security list carries 30 CVE ids (28 in the 5.0.11 notes); the eleven above are the ones with reach beyond a privileged account, code execution or token generation. Full list is in the vendor notes."
    techniques: [T1190, T1059.007, T1098]
    technique_basis: "T1190: unauthenticated email into a public queue reaches stored XSS (and the unauthenticated CSS-cache DoS); T1059.007: script runs in the handler's browser session; T1098: the URL-shortener CSRF and REST group-endpoint flaw change rights, up to SuperUser."
    affected_products: ["Request Tracker", "RT for Incident Response"]
    entity_keys: []
    new_entities:
      - { key: "product:request-tracker", type: product, name: "Request Tracker (RT)", aliases: ["RT", "Best Practical Request Tracker"], summary: "Best Practical's open-source ticketing system; RT 6.0.4 and 5.0.11 (2026-10-29) fix 30 and 28 CVEs, including stored XSS from unauthenticated email and an ExecuteCode-bypass RCE (Best Practical release notes; CERT Polska)." }
      - { key: "product:rt-incident-response", type: product, name: "RT for Incident Response (RTIR)", aliases: ["RTIR"], summary: "Best Practical's incident-handling extension of RT; opens the Incident Reports queue to everyone by default, which is the unauthenticated-sender path in CVE-2026-105455 and CVE-2026-105456 (CERT Polska, 2026-10-30)." }
    verification: MULTI-SOURCE
    confidence: HIGH
    admiralty_suggestion: "A1 on the fixed-version and CVE facts (vendor release notes plus the reporter's own advisory); exploitation status unknown, none reported"
    evidence:
      - quote: "That includes an unauthenticated sender of HTML email to any queue that grants CreateTicket or ReplyToTicket to Everyone, which is common for a queue that accepts mails from the public."
        attribution: "CERT Polska"
        source_url: "https://cert.pl/en/posts/2026/10/CVE-2026-105454/"
      - quote: "RTIR grants everyone the right to create Incident Reports by default, so an unauthenticated sender of an emailed report can set that subject."
        attribution: "CERT Polska"
        source_url: "https://cert.pl/en/posts/2026/10/CVE-2026-105454/"
      - quote: "RT 6.0.4 is now available for general use. This release addresses many security issues and it is recommended that all users upgrade as soon as possible."
        attribution: "Best Practical"
        source_url: "https://docs.bestpractical.com/release-notes/rt/6.0.4"
        note: "plain-text release notes wrapped at about 70 columns; the quote is the same sentence pair with line breaks read as spaces"
      - quote: "A user with ModifyTemplate but not ShowTemplate can change the code in a Perl template. This also bypasses $DisallowExecuteCode."
        attribution: "Best Practical"
        source_url: "https://docs.bestpractical.com/release-notes/rt/6.0.4"
        note: "line breaks read as spaces; the same text is in the 5.0.11 notes"
    extended_notes: |
      Exposure: RT 5.0.x before 5.0.11 and 6.0.x before 6.0.4; the URL-shortener CSRF (CVE-2026-108279) affects RT 5.0.4 and later per the 5.0.11 notes; CVE-2026-105455 is RTIR 6.0 only. Vendor-documented ways to read the running version and the exposed queues are not in the sources fetched; what is stated is the condition: a queue that grants CreateTicket or ReplyToTicket to Everyone (typical for a public intake address) or an RTIR Incident Reports queue left at its default.
      Detection (telemetry class first; the mechanism comes from the sources, the checks follow mechanically and are ours): inbound mail and ticket-content logs for HTML mail with crafted URLs or javascript: links to public queues; web server access logs for the ticket-display, split-ticket and incident-creation pages opened shortly after such mail; and, after patching, a review of RT's own change records for templates and scrips (ModifyTemplate), group and role membership, and rights grants including SuperUser, since those are the objects the CSRF, REST and template flaws let an attacker change. Neither source says whether existing security tokens or password salts must be rotated after the RNG fix; that question is open.
      Hardening named by the sources: patch to 6.0.4 / 5.0.11; turn on the new TOTP MFA after setting $SecretKey; the notes also raise newer minimum versions of MIME::Tools 5.522, HTML::Gumbo 0.19, Starlet 0.33 and Mozilla::CA 20261020.
      Triage: the stored-XSS alerts will look like ordinary HTML mail into a ticket queue; the discriminator is script or a javascript: scheme inside a link or subject, and a handler session that then performs RT actions the handler did not initiate.

