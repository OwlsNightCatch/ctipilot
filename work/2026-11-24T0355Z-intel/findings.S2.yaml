items:
  - title: "Microsoft Entra Connect Health: an API flaw present from 2026-07-23 was exploited to read tenant contact and configuration metadata (administrator e-mail addresses among it); Microsoft fixed it server-side on 2026-11-19 and began notifying tenants on 2026-11-20"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/security/microsoft-entra-connect-health-flaw-exploited-to-steal-tenant-data/", publisher: "BleepingComputer", date: "2026-11-21", role: "primary" }
      - { url: "https://www.netzwoche.ch/news/2026-11-23/angreifer-lesen-konfigurationsdaten-von-microsoft-kunden-aus", publisher: "Netzwoche", date: "2026-11-23", role: "corroborating" }
      - { url: "https://www.it-connect.fr/entra-connect-health-faille-exploitee-metadonnees-tenants/", publisher: "IT-Connect", date: "2026-11-24", role: "corroborating" }
    discovery_trace: "first seen at: netzwoche (RSS), URL https://www.netzwoche.ch/rss.xml → item https://www.netzwoche.ch/news/2026-11-23/angreifer-lesen-konfigurationsdaten-von-microsoft-kunden-aus (feed item 'Angreifer lesen Konfigurationsdaten von Microsoft-Kunden aus', 2026-11-23) → primary-as-relayed: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/microsoft-entra-connect-health-flaw-exploited-to-steal-tenant-data/ (quotes Microsoft's customer notification and a Microsoft spokesperson) → corroboration: it-connect (feed https://www.it-connect.fr/feed/), URL https://www.it-connect.fr/entra-connect-health-faille-exploitee-metadonnees-tenants/. Microsoft's own page not found (WebSearch 'Microsoft Entra Connect Health security notification tenant metadata aka.ms/ConnectHealth/scripts Azure Service Health' returned only generic docs); the Reddit post with the notification text is not fetchable (WebFetch refused www.reddit.com)."
    summary: |
      Microsoft told affected tenants through Azure Service Health, from 2026-11-20, that a vulnerability in
      the Microsoft Entra Connect Health API, introduced on 2026-07-23 and found by Microsoft on 2026-11-09 (109 days later,
      per IT-Connect's count), was exploited for unauthorised read-only access to tenant-level metadata. Microsoft deployed a
      server-side fix on 2026-11-19 and concluded its investigation on 2026-11-20; it says it found no
      unauthorised configuration change, although the flaw could in principle also have changed Connect Health monitoring
      settings. Exposed data, per Microsoft's notification as quoted by BleepingComputer: e-mail addresses of tenant
      technical contacts and administrator accounts; tenant ID, display name, initial domain, country and region; Entra licence
      tier and directory-synchronisation status (enabled, last sync time); Connect Health onboarding status; and an expired
      agent-registration certificate for a Microsoft internal service decommissioned in late 2024 that the API still returned.
      Microsoft says passwords, password hashes, authentication tokens, valid cryptographic keys, on-premises server and AD
      topology and Azure subscription data were not exposed, that no customer software update is needed, and it warns of targeted
      phishing and social engineering aimed at the exposed administrator addresses. Recommended: phishing-resistant MFA on
      privileged accounts, a review of Connect Health configuration, and a review of Entra audit and sign-in logs; a
      PowerShell script (aka.ms/ConnectHealth/scripts) lists the metadata types that could have been exposed, but shows current
      values, not what was accessed. Microsoft has not said who exploited it, when exploitation began or how many tenants are
      affected; more than a dozen administrators and some MSPs (notifications for several customer tenants) reported
      notices on Reddit per BleepingComputer. The service monitors on-premises identity infrastructure (Entra Connect Sync servers, AD FS
      farms, domain controllers) through agents (IT-Connect), so the in-scope population is hybrid-identity tenants, which
      includes public administrations that synchronise on-premises AD to Microsoft 365.
    region_nexus: "global; relayed by Swiss trade press (Netzwoche) for Swiss IT leads; hybrid-identity public-sector tenants are in the service's scope, no Swiss tenant is named"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: []
    techniques: [T1190, T1589.002]
    affected_products: ["Microsoft Entra Connect Health"]
    entity_keys: []
    new_entities:
      - { key: "product:microsoft-entra-connect-health", type: product, name: "Microsoft Entra Connect Health", aliases: ["Azure AD Connect Health"],
          summary: "Microsoft cloud service that monitors on-premises identity infrastructure (Entra Connect Sync, AD FS, domain controllers) through installed agents and reports alerts in the Entra admin centre; its API held a flaw from 2026-07-23 to 2026-11-19 that was exploited for tenant-metadata read access (BleepingComputer, IT-Connect, 2026-11)." }
      - { key: "incident:microsoft-entra-connect-health-api-tenant-metadata-2026-11", type: incident, name: "Entra Connect Health API tenant-metadata exposure (2026-07 to 2026-11)", aliases: [],
          summary: "Microsoft confirmed to customers on 2026-11-20 that a Connect Health API flaw (introduced 2026-07-23, found 2026-11-09, fixed server-side 2026-11-19) was exploited to read tenant contact and configuration metadata, including administrator e-mail addresses; no actor named." }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    suggested_classification: { reliability: B, credibility: 2 }
    novelty: new
    evidence:
      - quote: "Microsoft discovered the vulnerability in the Entra Connect Health API on November 9, 2026, after it was first introduced on July 23."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/microsoft-entra-connect-health-flaw-exploited-to-steal-tenant-data/"
      - quote: "On 20 November 2026, we concluded our investigation and determined that unauthorized read-only access to tenant-level metadata associated with your organization had occurred."
        attribution: "BleepingComputer (quoting Microsoft's customer notification)"
        source_url: "https://www.bleepingcomputer.com/news/security/microsoft-entra-connect-health-flaw-exploited-to-steal-tenant-data/"
      - quote: "Organizations are also advised to ensure privileged accounts use phishing-resistant multifactor authentication, review their Connect Health configurations, and examine Microsoft Entra audit and sign-in logs for suspicious activity."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/microsoft-entra-connect-health-flaw-exploited-to-steal-tenant-data/"
      - quote: "Wer hinter den Angriffen steckt, wann sie begannen und wie viele Kunden betroffen sind, lässt Microsoft offen."
        attribution: "Netzwoche"
        source_url: "https://www.netzwoche.ch/news/2026-11-23/angreifer-lesen-konfigurationsdaten-von-microsoft-kunden-aus"
    extended_notes: |
      Exposure: a tenant that onboarded Connect Health (Entra Connect Sync, AD FS, domain controllers) and received an Azure
      Service Health notice; check Azure Service Health for the notification rather than waiting for Microsoft's web page.
      Detection (telemetry class first): mail-flow logs for messages to the administrator and technical-contact addresses that
      impersonate Microsoft or Entra (Connect Health, tenant security notices); Entra sign-in and audit logs for privileged accounts
      (new MFA registrations, device-code or consent grants, sign-ins from new locations) in the weeks after 2026-11-20.
      Microsoft states there is no customer-side patch, so the post-fix check is exactly that review. The source chain is one
      origin: Microsoft's customer notification (shared by admins on Reddit) and Microsoft's statement to BleepingComputer; Netzwoche
      and IT-Connect re-read the same notification. A Microsoft web advisory was not found. The flaw's mechanism (what the API
      call was) is not disclosed. Overlap with S1/S4: likely the same item; main agent dedups.
    borderline: false

  - title: "Bulgaria: the digital ministry says a five-year espionage operation (since 2021) downloaded more than 130 GB, about 62 million pages, from the state's inter-institution document infrastructure; found in August 2026 by a newly deployed national monitoring system"
    sources:
      - { url: "https://www.thestar.com.my/news/world/2026/11/19/bulgaria-uncovers-five-year-cyberespionage-operation", publisher: "Reuters (via The Star)", date: "2026-11-19", role: "primary" }
      - { url: "https://www.zataz.com/cyberespionnage-en-bulgarie-62-millions-de-pages-volees/", publisher: "ZATAZ", date: "2026-11-23", role: "corroborating" }
    discovery_trace: "first seen at: zataz (RSS), URL https://www.zataz.com/feed/ → item https://www.zataz.com/cyberespionnage-en-bulgarie-62-millions-de-pages-volees/ (2026-11-23; cites Reuters 2026-11-18) → primary-as-relayed: Reuters via The Star, URL https://www.thestar.com.my/news/world/2026/11/19/bulgaria-uncovers-five-year-cyberespionage-operation (found via WebSearch 'Bulgaria government hackers 62 million documents Council of Ministers cyber espionage five years e-government ministry'). The ministry's own release was not located; a Bulgarian-language WebSearch returned only the same wire coverage."
    summary: |
      On 2026-11-18 Bulgaria's minister for innovation and digital transformation, Ivan Vassilev, said that since 2021 more than 130 GB (62
      million pages) of government documents had been downloaded (Reuters, citing Nova TV). The material covers cabinet work, internal
      reports and correspondence between ministries and state institutions; ZATAZ adds that the intruders entered the infrastructure
      public bodies use to exchange documents, moved between several parts of the system and downloaded files. The operation was
      found after Bulgaria deployed a new national cyber-security monitoring system that flagged suspicious activity in August 2026. The
      ministry says several international groups are believed responsible, with no conclusive link to a foreign state or intelligence
      service, no evidence so far that citizens' personal data was compromised and no sign of publication on the dark web (ZATAZ).
      Response: a task force of the interior and defence ministries, security and intelligence services and the national incident-response team,
      with private firms and ENISA; affected systems isolated, malware removed, attacker access cut, and 90 days of reinforced
      monitoring planned (ZATAZ). Prosecutors were notified to examine institutions' actions and possible failures during the
      undetected period. ZATAZ relays the ministry's own finding that the defences under successive governments "did not work as a whole"
      on networks shared between institutions, where common monitoring can correlate events each service sees only in isolation. No
      initial-access vector, malware family or actor is named in either source.
    region_nexus: "EU (Bulgaria); transferable to Swiss federal and cantonal administrations that share document-exchange and e-government infrastructure"
    primary_sector_nexus: "direct (government administration target; transferable lesson)"
    sector: "public-sector"
