        attribution: "ZATAZ"
        source_url: "https://www.zataz.com/cyberespionnage-en-bulgarie-62-millions-de-pages-volees/"
    extended_notes: |
      All coverage traces to the ministry's 2026-11-18 briefing (Reuters via Nova TV; AFP also reported it, seen here only as a
      WebSearch summary). A search-result summary of a Ukrainian outlet gave a different first-alert date (23 June); not fetched, so
      not carried. Lesson stated by the ministry, not inferred here: separate per-service monitoring on shared networks missed what
      common monitoring found; the detection concept that follows from the stated mechanism is cross-institution correlation of
      bulk document-read and download telemetry on document-exchange platforms. Overlap with S4 likely; main agent dedups.
    borderline: true
    borderline_reason: "no Swiss nexus and no TTP detail; kept for the government-sector long-dwell lesson (five years, found by shared monitoring) and ENISA's involvement; first reported 2026-11-18, ZATAZ in window 2026-11-23"

  - title: "OSCE Ministerial Council in Lugano (3 and 4 December 2026): the Swiss Army supports Ticino with up to 2,000 personnel including cyber capabilities from 30 November; BACS's own review of the 2024 Bürgenstock summit records NoName057(16) DDoS against Swiss authorities and intrusion and phishing attempts against two cantons and a medical call centre"
    suggested_kind: "threat awareness / event-driven exposure (not a policy change)"
    sources:
      - { url: "https://www.news.admin.ch/de/newnsb/SLfi0iF0vhyH", publisher: "Swiss federal news portal (VBS / Federal Council release)", date: "2026-11-23", role: "primary" }
      - { url: "https://www.bacs.admin.ch/en/24-kfu-2-en", publisher: "NCSC Switzerland (BACS), first report on the Cyber Situation Network, Summit on Peace in Ukraine", date: "2024-06-20", role: "corroborating" }
    discovery_trace: "first seen at: news-admin-ch, URL https://www.news.admin.ch/de/newnsb (listing, 12 releases) → item https://www.news.admin.ch/de/newnsb/SLfi0iF0vhyH ('33. OSZE-Ministerkonferenz in Lugano: Armee zum Konferenzschutz im Einsatz', 2026-11-23, via extract) → WebSearch ('OSZE Ministerkonferenz Lugano Cyberangriffe DDoS Hacktivisten Schutz Bundesamt für Cybersicherheit Warnung') surfaced the BACS 2024 Bürgenstock reporting → pivot: https://www.bacs.admin.ch/en/24-kfu-2-en (fetched, historical background framed as such)."
    summary: |
      The Swiss Army supports the canton of Ticino with up to 2,000 service members for the 33rd OSCE Ministerial Council in Lugano on 3 and 4
      December 2026; the assistance service runs from 30 November to 10 December and the Federal Council restricted airspace within
      46 km of Lugano from 30 November to 4 December. The release says the Army contributes its cyber, counter-drone and CBRN
      capabilities, with overall command with the Ticino cantonal police (federal release, 2026-11-23). It does not describe the cyber role further and
      announces no warning to operators of public web services. Background, from BACS's own first review of the June 2024 Summit on
      Peace in Ukraine at Bürgenstock (published 2024-06-20): BACS coordinated a Cyber Situation Network of almost 100 experts from
      national and cantonal authorities and the private sector; it recorded several DDoS attacks on the websites of authorities and
      organisations involved, clearly perpetrated by the pro-Russian hacktivist group NoName057(16), within expected levels with only minor
      disruption, plus intrusion attempts against the IT systems of the cantons of Nidwalden and Obwalden and phishing against employees of
      Lucerne's medical emergency call centre. Assessment (this brief's, not BACS's): the 2024 pattern is the precedent for the
      exposed set around Lugano, namely public websites of federal, Ticino cantonal and communal bodies and the cantonal emergency
      services; no BACS warning for Lugano had been published by 2026-11-24 (BACS Im Fokus and Aktuelle Vorfälle newest 2026-11-18).
    region_nexus: "Switzerland: Ticino cantonal and communal administrations, cantonal police and emergency services, federal bodies involved in the conference"
    primary_sector_nexus: "direct"
    sector: "public-sector"
    cves: []
    techniques: [T1498, T1566]
    affected_products: []
    entity_keys: []
    new_entities:
      - { key: "actor:noname057-16", type: actor, name: "NoName057(16)", aliases: ["NoName057(16)"],
          summary: "Pro-Russian hacktivist group; per NCSC Switzerland (BACS, 2024-06-20) it clearly carried out DDoS attacks on websites of Swiss authorities and organisations around the June 2024 Bürgenstock Summit on Peace in Ukraine." }
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: MEDIUM
    suggested_classification: { reliability: A, credibility: 2 }
