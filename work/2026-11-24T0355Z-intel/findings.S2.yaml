      - quote: "Die Armee bringt zudem ihre Fähigkeiten im Bereich Cyber, Drohnenabwehr und ABC-Schutz ein."
        attribution: "Swiss federal news portal (VBS)"
        source_url: "https://www.news.admin.ch/de/newnsb/SLfi0iF0vhyH"
      - quote: "Der Assistenzdienst der Armee dauert vom 30. November bis zum 10. Dezember 2026."
        attribution: "Swiss federal news portal (VBS)"
        source_url: "https://www.news.admin.ch/de/newnsb/SLfi0iF0vhyH"
      - quote: "Large events and international conferences are often used as opportunities for cyberattacks."
        attribution: "NCSC Switzerland (BACS)"
        source_url: "https://www.bacs.admin.ch/en/24-kfu-2-en"
      - quote: "which were clearly perpetrated by the pro-Russian hacktivist group 'NoName057(16)'"
        attribution: "NCSC Switzerland (BACS)"
        source_url: "https://www.bacs.admin.ch/en/24-kfu-2-en"
    extended_notes: |
      Defender angle: a dated, announced high-profile event in Ticino is a window in which public-facing websites of the host
      canton, nearby communes and federal bodies sit in the same target set as in 2024; the telemetry that mattered then was
      volumetric web traffic against authority websites (DDoS), intrusion attempts on cantonal IT, and phishing aimed at
      emergency call-centre staff. The 2024 review also notes that BACS stood the situation network up as a public-private network;
      whether a Lugano equivalent is planned is not stated anywhere read. EU Council cyber-sanctions listing of NoName057(16) on
      2026-11-16 appeared only in secondary search results and was not fetched, so it is not carried.
    borderline: true
    borderline_reason: "awareness only: the federal release announces an army deployment, not a threat or a duty; the DDoS link rests on a 2024 precedent and BACS has issued no Lugano-specific warning; relevant to Ticino, federal and emergency-service defenders if the main agent wants an event-exposure entry"

