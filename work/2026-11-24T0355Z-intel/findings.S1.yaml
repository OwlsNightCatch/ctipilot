      - { url: "https://thehackernews.com/2026/11/f5-warns-6-critical-big-ip-flaws-can.html", publisher: "The Hacker News", date: "2026-11-18", role: "corroborating" }
    discovery_trace: "first seen at: advisories-ncsc-nl, `ncsc-nl recent 15` listing, NCSC-2026-0508 (https://advisories.ncsc.nl/advisory?id=NCSC-2026-0508, read through `ncsc-nl csaf NCSC-2026-0508`) → bsi-de `bsi-rss` [NEU] [hoch] F5 BIG-IP WID-SEC-2026-4723 (https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-4723, read through `bsi-csaf`) → F5 CNA records via https://cveawg.mitre.org/api/cve/CVE-2026-123637 and the other eleven CVEs of the notice (affected modules, fixed engineering-hotfix builds, CISA ADP SSVC) → vendor K-articles https://my.f5.com/manage/s/article/K000163937 and K000164058 are Salesforce shells on extract and WebFetch → WebSearch (\"F5 BIG-IP CVE-2026-123637 OR CVE-2026-116953 TMM iRule remote code execution November 2026 advisory\") → pivot: The Hacker News, URL https://thehackernews.com/2026/11/f5-warns-6-critical-big-ip-flaws-can.html. F5 published on 2026-11-18; no store entry covers this BIG-IP notice (the 2026-10-29 BIG-IP entry is a different release), the first in-window authority record is BSI's of 2026-11-23."
    summary: |
      F5's 2026-11-18 security notification (22 advisories, 10 of them for NGINX) includes six BIG-IP flaws that an unauthenticated remote attacker can use to terminate the Traffic Management Microkernel (TMM), disrupting traffic until it restarts, and which F5 says may allow remote code execution. They are stack-based overflows in the data plane (no control-plane exposure), each CVSS 3.1 9.8 and CVSS 4.0 9.3, and each needs a specific configuration on a virtual server: an iRule using GENERICMESSAGE::route on client traffic (CVE-2026-116953), an HTTP profile with an iRule using PSC::ip_address (CVE-2026-120285) or MR::message route (CVE-2026-120292), an iRule using DNS::scrape (CVE-2026-120722, BIG-IP DNS) or PEM::subscriber (CVE-2026-121805, BIG-IP PEM), or an APM per-request policy that includes both the Client Information and Endpoint Security agents (CVE-2026-123637, APM only). Four were reported by watchTowr's Sina Kheirkhah and two were found by F5.
      Affected are the BIG-IP 21.1.0, 17.5.0 and 17.1.0 branches (releases past End of Technical Support were not evaluated), BIG-IP Next for Kubernetes 2.2 to 2.4 and, for two of the CVEs, BIG-IP CNF. No scheduled release carries the fix and F5 lists no workaround: the fixes are engineering hotfixes (BIG-IP 21.1.0.4.0.19.3-ENG, 17.5.1.11.0.61.12-ENG or 17.5.1.10.0.80.35-ENG, 17.1.3.7.0.21.4-ENG or 17.1.3.6.0.14.20-ENG; Next for Kubernetes BNK-2.4.2-EHF1, BNK-2.3.4-EHF1, BNK-2.2.5-EHF1), which F5 says do not receive the QA of scheduled releases. No exploitation is reported (CISA ADP SSVC for CVE-2026-123637, 2026-11-18: Exploitation none, Automatable yes, Technical Impact total). BSI dates the F5 advisory K000163937 and a support solution K000164239 to 2026-11-22, which suggests the notice was revised or supplemented after the 2026-11-18 publication. The same notice carries six lower-rated flaws, notably iControl SOAP command execution for any authenticated user with at least the Guest role (CVE-2026-125274, 8.8; fixed in BIG-IP 21.1.0.3, 17.5.1.10, 17.1.3.6 and BIG-IQ 8.4.2.3) and iControl REST tokens whose lifetime an attacker holding a token can extend (CVE-2026-120718, 8.1). They are distinct from the exploited September flaw CVE-2026-94127.
    region_nexus: "global; no source names a region or sector"
    primary_sector_nexus: "indirect: BIG-IP LTM, DNS, PEM and APM are edge components; no source names the public sector"
    sector: "public-sector"
    cves: [CVE-2026-123637, CVE-2026-116953, CVE-2026-120285, CVE-2026-120292, CVE-2026-120722, CVE-2026-121805, CVE-2026-125274, CVE-2026-120718]
    techniques: [T1190, T1499.004]
    affected_products: ["F5 BIG-IP", "F5 BIG-IP APM", "F5 BIG-IP Next for Kubernetes", "F5 BIG-IP CNF", "F5 BIG-IQ"]
    entity_keys: ["product:f5-big-ip", "product:f5-big-ip-access-policy-manager-apm"]
    new_entities: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    classification_suggestion: "reliability A (F5 CNA records via BSI and NCSC-NL, both national CERTs), credibility 2: all outlets derive from F5's single notice, no exploitation or public exploit reported"
    evidence:
      - quote: "allow an attacker to crash the Traffic Management Microkernel (TMM) without logging in, disrupting traffic until the TMM restarts"
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/11/f5-warns-6-critical-big-ip-flaws-can.html"
      - quote: "None of the company's advisories says the flaws have been exploited."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/11/f5-warns-6-critical-big-ip-flaws-can.html"
      - quote: "For the six critical flaws, the only fixes are engineering hotfixes, builds that the company issues between its normal software releases."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/11/f5-warns-6-critical-big-ip-flaws-can.html"
      - quote: "Ein entfernter, anonymer Angreifer kann eine Schwachstelle in F5 BIG-IP ausnutzen, um beliebigen Programmcode auszuführen."
        attribution: "BSI"
        source_url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-4723"
      - quote: "Sommige van deze kwetsbaarheden kunnen door een niet-geauthenticeerde aanvaller worden misbruikt om op afstand willekeurige code uit te voeren."
        attribution: "NCSC-NL"
        source_url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0508"
    extended_notes: |
      Exposure: configuration-dependent. A defender reads the running version from the BIG-IP system and then looks for virtual servers whose iRules call GENERICMESSAGE::route, PSC::ip_address, MR::message route, DNS::scrape or PEM::subscriber (with the HTTP profile where F5 states it), or APM per-request policies containing both the Client Information and Endpoint Security agents. A system on a custom engineering hotfix needs a new one from F5 support (The Hacker News).
      Detection concept (derived from the stated mechanism): TMM process termination and restart events and core files in the BIG-IP system logs, correlated with the virtual server that carries the affected iRule or APM policy. F5's wording is that TMM restarts and RCE "may" follow; no source describes a successful code-execution chain or a post-exploitation artefact.
      F5 K-articles referenced by the CNA records (K000163929, K000163936 to K000163946, K000164058) and BSI's K000164239 were not readable (Salesforce Experience Cloud shell). CVE record data: https://cveawg.mitre.org/api/cve/CVE-2026-123637 (and siblings), F5 CNA.

