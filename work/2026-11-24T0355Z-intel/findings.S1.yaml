    discovery_trace: "first seen at: advisories-ncsc-nl, `ncsc-nl recent 15` listing, NCSC-2026-0512 and NCSC-2026-0513 (https://advisories.ncsc.nl/advisory?id=NCSC-2026-0512, https://advisories.ncsc.nl/advisory?id=NCSC-2026-0513, both published 2026-11-23, read through `ncsc-nl csaf`) → primary: Splunk SVD-2026-1103 (https://advisory.splunk.com/advisories/SVD-2026-1103) and SVD-2026-1108 (https://advisory.splunk.com/advisories/SVD-2026-1108), both read with `extract`. Splunk published on 2026-11-18; the in-window authority record is NCSC-NL's of 2026-11-23; no store entry mentions Splunk."
    summary: |
      Splunk published two advisories on 2026-11-18. SVD-2026-1103 covers 38 CVEs in Splunk Enterprise (highest 9.4). Two are unauthenticated authentication bypasses in REST APIs: the RapidDiag REST API (CVE-2026-76535, CVSS 3.1 9.1, AV:N/AC:L/PR:N/UI:N, C:H/I:H/A:N) and the Cluster Configuration REST API (CVE-2026-76536, 9.4, C:L/I:H/A:H). Two more unauthenticated rows are rated 7.5, a RapidDiag bypass through hard-coded credentials (CVE-2026-131190, CWE-798) and a REST API bypass through missing authentication (CVE-2026-131192, CWE-305). A cluster of SPL-injection and authorization flaws reachable by low-privileged users carry 8.8 and 8.1 (CVE-2026-76538 SPL injection through the REST API, CVE-2026-76540 improper authorization through the REST API, CVE-2026-76544 SPL injection through metric alert filters), alongside stored cross-site scripting, path traversal in the Deployment Server and denial-of-service rows. Affected versions are 10.6.0.5, 10.4.0 to 10.4.4, 10.2.0 to 10.2.8, 10.0.0 to 10.0.11 and 9.4.0 to 9.4.16; Splunk says to upgrade to 10.6.1, 10.4.5, 10.2.9, 10.0.12 or 9.4.17 or higher.
      SVD-2026-1108 covers 59 CVEs in Splunk SOAR below 8.8.0 (fixed in 8.8.0, highest 9.9): remote code execution through the App Wizard (CVE-2026-131253, 9.9, PR:L, scope changed) and through the REST API (CVE-2026-131287, 9.6, PR:L, CWE-863), both for authenticated users, plus many authorization, cross-site scripting and information-disclosure rows. NCSC-NL rates both advisories medium likelihood and high damage and notes that even unauthenticated users can perform actions that normally need higher privileges. No exploitation or public exploit is stated in any source. This is the SIEM and SOAR platform many SOCs run, so a compromise exposes the stored searches, credentials and response playbooks it holds (collector's assessment, not a source statement).
    region_nexus: "global; no region or sector named by Splunk or NCSC-NL"
    primary_sector_nexus: "indirect: SIEM and SOAR platforms are common in security operations teams; no public-sector statement in the sources"
