    extended_notes: |
      Exposure: no customer-side patch exists for the Hosted Cloud; exposure is through the MSP or hoster that runs the tenant. Ask the provider whether it received N-able's partner notice, which integrations lost their API or OAuth tokens on revocation, and (for SpamExperts Local Cloud) which build the appliance reports (fixed: 20261121.1943, per the CVE record).
      Detection concept (derived from the stated mechanism, not from a source's hunting guidance): management-plane/API audit logs for LDAP-synchronisation connection checks whose target is an internal address or a non-LDAP port, and API-token use from unexpected sources before the 2026-11-21 revocation; on the tenant side, unexplained authentication failures from integrations after the revocation. N-able says mail flow kept working, so mail-flow telemetry is not expected to show the intrusion.
      Post-patch check: The Hacker News states it is unknown whether credentials the intruder may have reached were actually taken. Partners that configured an LDAP synchronisation relay can ask N-able whether the bind credentials stored for it were in scope of the credential rotation (this is the collector's question, not a source statement).
      The vendor advisory https://me.n-able.com/s/security-advisory/aArVy0000002mrlKAA is a Salesforce Experience Cloud page that renders nothing on any transport tried (extract, url, jina, WebFetch); its text is read from the N-able CNA CVE record and the GitHub advisory mirror. CVSS 4.0: AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:N/SC:H/SI:H/SA:N. CISA ADP SSVC (2026-11-23): Exploitation active, Automatable no, Technical Impact total. EPSS 0.0035.

