        attribution: "Xen Orchestra GitHub security advisory"
        source_url: "https://github.com/vatesfr/xen-orchestra/security/advisories/GHSA-2r3w-c2vx-fv5g"
    extended_notes: |
      Entry fields the delta touches: cves[] (CVE-2026-133469 added), the fixed-version statement (xen-orchestra 6.9.2 / 6.10.1 alongside xo-server 5.211.2 / 5.213.1; the earlier 'BleepingComputer names 6.9.1 and 6.10.0' discrepancy in the entry's sourcing note is settled in Vates' favour by the CVE record), sources and evidence, and a CVSS statement. Detection concept the root cause allows (derived): reverse-proxy or web-access logs that retain the Cookie header would show an authenticationToken or token cookie value beginning with a JSON-object prefix; Vates' original advisory says a successful exploit leaves no Xen Orchestra log. The REST route that returns login tokens is the post-bypass step; token revocation after patching is the evident remediation (derived).
      EPSS not yet published for this CVE. The advisory carries a one-line proof-of-concept request; it is deliberately not reproduced here.

