    discovery_trace: "first seen at: cisa-kev bridge (python3 tools/fetch_source.py cisa-kev, catalogue 2026.11.23, https://www.cisa.gov/known-exploited-vulnerabilities-catalog) and the kev-window.txt NOT COVERED row → CVE record via https://cveawg.mitre.org/api/cve/CVE-2026-134624 (N-able CNA, CISA ADP SSVC Exploitation: active) → EUVD https://euvdservices.enisa.europa.eu/api/search?text=CVE-2026-134624 → vendor advisory https://me.n-able.com/s/security-advisory/aArVy0000002mrlKAA returned only a Salesforce shell on extract, url, jina and WebFetch → WebSearch (\"N-able Mail Assure SpamExperts security incident November 2026\") → pivot: The Hacker News, URL https://thehackernews.com/2026/11/n-able-confirms-hackers-accessed-cloud.html → pivot: The Hacker News, URL https://thehackernews.com/2026/11/n-able-discloses-critical-mail-assure.html → primary: N-able blog, URL https://www.n-able.com/blog/mail-assure-incident-update. Earlier runs (11-18, 11-20, 11-21, 11-22) borderline-dropped the incident for 'no vector'; the CVE publication plus KEV listing is the new development."
    summary: |
      N-able disclosed on 2026-11-18 that an unauthorized party had reached one server of its Mail Assure and SpamExperts Hosted Cloud, the email-filtering service it runs for managed service providers in the Americas, APAC and Europe regions, after a service disruption that began on 2026-11-16. Mail filtering kept working, but the management portal, APIs, quarantine and logging were offline until 2026-11-21 23:45 UTC. On 2026-11-22 N-able said it had remediated "the identified vulnerability" and published CVE-2026-134624 to track it: a server-side request forgery in the LDAP synchronisation connection check that runs when a relay is configured. Builds before 20261121.1943 do not restrict the destination, so an authenticated API user can make the server connect to arbitrary internal hosts and ports, learn which are reachable and send crafted data to internal services (CWE-918, CVSS 4.0 9.3 with PR:H; the advisory does not claim code execution). CISA added it to KEV on 2026-11-23 on evidence of active exploitation (catalogue due date 2026-11-26).
      N-able says exploitation was confined to a single N-able-hosted server and that monitoring since remediation found nothing further; The Hacker News reports that N-able has not said whether the flaw was the attackers' way in. N-able has engaged an independent DFIR team and promises a root cause analysis within about two weeks (roughly 2026-12-06). Its response included taking the server offline, rotating internal platform credentials, revoking customers' existing API tokens, invalidating OAuth tokens and resetting local users' passwords, so partner integrations need new credentials. N-able states the incident is unrelated to the N-central Able2Shell-family flaws. The Hosted Cloud is already patched; SpamExperts Local Cloud runs on customer hardware, the incident statements describe only the Hosted Cloud, and The Hacker News concludes that Local Cloud operators should confirm they run build 20261121.1943.
    region_nexus: "global; the Europe region of the hosted service is among those named as affected; no Swiss victim or Swiss customer is named in any source"
