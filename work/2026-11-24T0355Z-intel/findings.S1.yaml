    extended_notes: |
      Exposure: a defender reads the Splunk Enterprise or SOAR version from the product and checks whether the splunkd management interface (and for clusters the cluster-manager and peer interfaces) is reachable from segments other than administration and cluster peers; the two critical rows need no credentials. The sources give no endpoint paths, ports or workaround.
      Detection concept (derived from the stated mechanism): management-interface access logs showing successful responses on RapidDiag or cluster-configuration REST endpoints to addresses that are not cluster peers, deployment infrastructure or administrator workstations, without a preceding authenticated session. Splunk gives no hunting guidance and no indicators; SPL-injection rows would show as unexpected search commands in search audit records for low-privileged accounts.
      Splunk's per-CVE sections (affected-module conditions for the 9.1 and 9.4 rows) were not in the extracted page text; the table rows above are verbatim. EPSS: CVE-2026-76535 0.0037, CVE-2026-76536 0.0031, CVE-2026-131253 0.0059, CVE-2026-131287 0.0034 (FIRST.org, 2026-11-23). NCSC-NL advisory pages are cited by portal URL; the read came from the bridge's CSAF JSON.

