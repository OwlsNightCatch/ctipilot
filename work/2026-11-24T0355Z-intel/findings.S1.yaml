  - title: "F5 BIG-IP: six unauthenticated stack overflows rated CVSS 9.8 (CVE-2026-123637, -116953, -120285, -120292, -120722, -121805) crash TMM and may allow code execution; fixed only by engineering hotfixes"
    sources:
      - { url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-4723", publisher: "BSI CERT-Bund WID (WID-SEC-2026-4723)", date: "2026-11-23", role: "primary" }
