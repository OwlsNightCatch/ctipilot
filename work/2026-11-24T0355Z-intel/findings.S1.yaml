        attribution: "ENISA EUVD (CVE record text, GitHub CNA)"
        source_url: "https://euvdservices.enisa.europa.eu/api/search?fromScore=9&toScore=10&fromDate=2026-11-22&toDate=2026-11-24&page=0&size=100"
