  - title: "Splunk Enterprise and Splunk SOAR November 2026 releases: two unauthenticated REST authentication bypasses (CVE-2026-76535 9.1, CVE-2026-76536 9.4) and authenticated RCE in SOAR (CVE-2026-131253 9.9, CVE-2026-131287 9.6)"
    sources:
      - { url: "https://advisory.splunk.com/advisories/SVD-2026-1103", publisher: "Splunk (SVD-2026-1103, Splunk Enterprise)", date: "2026-11-18", role: "primary" }
      - { url: "https://advisory.splunk.com/advisories/SVD-2026-1108", publisher: "Splunk (SVD-2026-1108, Splunk SOAR)", date: "2026-11-18", role: "primary" }
      - { url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0512", publisher: "NCSC-NL (NCSC-2026-0512, Splunk Enterprise)", date: "2026-11-23", role: "corroborating" }
