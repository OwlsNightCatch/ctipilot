    discovery_trace: "first seen at: enisa-euvd, `url --direct 'https://euvdservices.enisa.europa.eu/api/search?fromScore=9&toScore=10&fromDate=2026-11-22&toDate=2026-11-24&page=0&size=100'` (38 rows at 9.0+; EUVD-2026-133254, GHSA-2r3w-c2vx-fv5g, CVE-2026-133469, vatesfr xen-orchestra) → CVE record https://cveawg.mitre.org/api/cve/CVE-2026-133469 (GitHub CNA, published 2026-11-23T17:07Z, CISA ADP SSVC Exploitation: poc) → primary: GHSA https://github.com/vatesfr/xen-orchestra/security/advisories/GHSA-2r3w-c2vx-fv5g, read with `extract`. Matched to the covered entry by mechanism (empty-object login cookie) and by the fixed xo-server numbers 5.213.1 and 5.211.2."
    summary: |
      The Xen Orchestra authentication bypass covered on 2026-11-11 from Vates advisory VSA-2026-062, at that time without a CVE id, is now CVE-2026-133469 (GitHub CNA, published 2026-11-23, CVSS 3.1 9.8, AV:N/AC:L/PR:N). The public GitHub advisory gives the root cause: the REST cookie parser turns an authenticationToken cookie whose value is a JSON object prefix into an empty object, the REST authentication path hands it to the token provider without requiring a string, and the token collection treats an empty-object lookup as unfiltered and returns its first token, so the request authenticates as that token's owner. The sign-in function has no parameter schema, unlike the deprecated token sign-in that declares a string. The advisory's own prerequisite: authentication succeeds only if the first token returned is unexpired and belongs to an existing user; otherwise the request fails without trying another token, and the attacker does not choose which token comes back. Successful use returns reusable login token ids, gives Admin rights, and per the advisory can lead to code execution on managed pools and root on XCP-ng nodes.
      The CVE record states "This vulnerability is actively exploited in the wild" and gives the fixed versions as xen-orchestra 6.9.2 and 6.10.1 (xo-server 5.211.2 and 5.213.1), which resolves the 6.9.1 and 6.10.0 numbers a news outlet had given. CISA's ADP record for the CVE (2026-11-23) lists Exploitation as poc rather than active and the CVE is not in KEV as of the 2026-11-23 catalogue, so the exploitation statement still rests on Vates.
