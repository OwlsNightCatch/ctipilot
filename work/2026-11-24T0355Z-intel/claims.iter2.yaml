    entry: 2026-11-24/babidighost-jailbroken-ai-agent-belgium-france-switzerland
    surface: "summary"
    kind: frontmatter
    text: "SOCRadar reconstructs a nine-day operation (2026-11-06 to 2026-11-14) in which a low-skill French-speaking operator ran a jailbroken Hermes-based AI agent against more than 50 organisations and datasets, mostly in Belgium, France and Switzerland, breaching two of 14 analysed in depth and partly breaching three, the largest thefts being an insurer's customer database through an unpatched Metabase (CVE-2023-38646) and the archives of more than 13 municipalities through a weak password on a shared IT provider's storage interface, while TOTP, IP allow-listing and server-side validation stopped it. ZATAZ reports that the BlackHatSect0r handle now rents the agent and offers a bank-phishing platform that covers 28 Swiss banks; neither source names a Swiss victim."
