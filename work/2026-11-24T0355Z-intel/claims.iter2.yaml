    text: "N-able confirmed on 2026-11-18 that an unauthorized party had reached a web server of its Mail Assure and SpamExperts Hosted Cloud, the email-filtering service it runs for managed service providers, and on 2026-11-22 published CVE-2026-134624, a server-side request forgery in the LDAP-synchronisation connection check (CVSS 4.0 9.3, authenticated API user) that build 20261121.1943 fixes; CISA added it to its Known Exploited Vulnerabilities catalog on 2026-11-23. N-able says exploitation was confined to one N-able-hosted server, has not said whether the flaw was the way in, and revoked customers' API and OAuth tokens, so integrations need new credentials."
