  - claim_id: e68e32ec11
    entry: 2026-11-24/project-zero-net-code-integrity-bypass-cve-2026-108398
    surface: "summary"
    kind: frontmatter
    text: "Google Project Zero's James Forshaw shows that .NET Framework 4 falls back to a flat, non-image mapping when an assembly's executable-image header flag is cleared, so hooks and audits on image loads never see the load, and that the code-integrity policy check meant to stop the fallback passes on Windows 11 S Mode, letting an untrusted assembly run under User Mode Code Integrity. Microsoft fixed it as CVE-2026-108398 in October 2026 (Important, CVSS 3.1 8.8, publicly disclosed, not exploited); the same behaviour bypassed VirtualBox's Windows process hardening (CVE-2026-87268) and gives code execution as a protected process light, which Microsoft's servicing criteria treat as out of scope."
