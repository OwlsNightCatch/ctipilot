    surface: "actions[0]"
    kind: frontmatter
    text: "On every Azure API Management instance, read the gateway RuntimeVersion as NSM describes (0.52.x is patched from build 31936, 0.53.x from build 31938, and v2 or Consumption-tier patterns are not affected) and, whatever the result, rotate every named value, backend credential, identity-provider client secret, subscription key and token the instance held, plus the Key Vault secrets it references, then review the Activity, gateway, Key Vault and service-principal sign-in logs for use of the old values, because NSM says to assume secrets and named values are exposed and Microsoft's notice says Classic instances were exposed before its 2026-11-19 mitigation."
