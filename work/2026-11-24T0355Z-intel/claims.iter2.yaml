  - claim_id: 43f6137bcb
    entry: 2026-11-24/symantec-ai-authored-powershell-toolkit-iis-webshell-dns
    surface: "summary"
    kind: frontmatter
    text: "Symantec's Threat Hunter Team found a toolkit on a stock-exchange web server in an African country in which 41 PowerShell modules ran under an IIS web shell for 3 minutes 12 seconds on 2026-09-20, hunting secrets in Group Policy Preferences, shared folders, SharePoint, SCCM and TFS, testing a guessed password, a reused token and API keys against the exchange's investment API and a securities-depository gateway, and returning their output as hex-encoded DNS lookups to a public out-of-band testing service. Symantec assesses AI authorship from the uniform scaffolding, attributes six older implants on the same server to Witchetty with high confidence but does not attribute the toolkit, and does not know whether any credential worked."
