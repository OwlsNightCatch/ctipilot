  - claim_id: c744144702
    entry: 2026-11-24/project-zero-net-code-integrity-bypass-cve-2026-108398
    surface: "body"
    kind: uncited
    text: "On .NET Framework 4 the runtime first maps an assembly as an image section; if that fails with a bad-format error it falls back to a flat, data-only mapping that .NET can still run, so hooks and audits on image loads never see it."
  - claim_id: defd731d3f
    entry: 2026-11-24/project-zero-net-code-integrity-bypass-cve-2026-108398
    surface: "body"
    kind: uncited
    text: "A check meant to stop the fallback when code integrity is enforced tests the Windows lockdown policy for inequality with the configuration-code-integrity value, which is exactly what Windows 11 S Mode returns (User Mode Code Integrity enforced, Dynamic Code Security off), so it passes."
  - claim_id: 3727d54b1c
    entry: 2026-11-24/project-zero-net-code-integrity-bypass-cve-2026-108398
    surface: "body"
    kind: uncited
    text: "The same behaviour defeated VirtualBox's Windows process hardening (CVE-2026-87268): an AnyCPU .NET assembly made its image screening return the bad-format status, the flat fallback loaded the unmodified assembly, and a current-user COM registration brought it into a hardened process; VirtualBox fixed it by never returning that status and by adding a COM option that disables current-user hive lookups."
