claims:
  - claim_id: 73c589f955
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "summary"
    kind: frontmatter
    text: "Vates advisory VSA-2026-062 of 2026-11-10 rates Critical an authentication bypass in Xen Orchestra and the Xen Orchestra Appliance, the web management plane for XCP-ng pools: a login cookie that parses to an empty object authenticates as the owner of the first stored token, giving Admin rights, code execution on managed pools and root on XCP-ng nodes. Vates says a threat actor is actively exploiting it; the fixes are xo-server 5.213.1 (latest channel) and 5.211.2 (stable channel), and the flaw is now CVE-2026-133469 (CVSS 3.1 9.8), whose record says it is exploited and fixed in Xen Orchestra 6.9.2 and 6.10.1."
  - claim_id: 710fa9da23
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "cves[CVE-2026-133469]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-133469\", \"cvss\": \"9.8\", \"status\": [\"exploited\", \"poc-public\", \"patch-available\"], \"affected\": \"xen-orchestra before 6.9.2 (stable) and 6.10.0 (latest); xo-server before 5.211.2 (stable) and 5.213.0 (latest)\", \"fixed\": \"xen-orchestra 6.9.2 and 6.10.1 (xo-server 5.211.2 and 5.213.1)\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: f21f2b5eac
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "body"
    kind: cited
    text: "Vates published advisory VSA-2026-062 on 2026-11-10, rated Critical, for Xen Orchestra and the Xen Orchestra Appliance (XOA), the web management plane for XCP-ng pools; the flaw is tracked as CVE-2026-133469, CVSS 3.1 9.8 ("
    urls: ["https://docs.vates.tech/security-advisories/advisories/2026/vates-sa-2026-062/", "https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-133254"]
  - claim_id: afb08b8ad5
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "body"
    kind: cited
    text: "Vates says a threat actor is actively exploiting the flaw, that an adversary can bypass authentication and act with Admin privilege, and that a compromise can lead to arbitrary code execution on managed pools and a full takeover of XCP-ng nodes as root ("
    urls: ["https://docs.vates.tech/security-advisories/advisories/2026/vates-sa-2026-062/"]
  - claim_id: 34a52df95a
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "body"
    kind: cited
    text: "The mechanism, per Vates: the REST cookie parser turns an authenticationToken cookie of j:%7B%7D into an empty object, the REST authentication path hands that object to the token provider without requiring a string, the token lookup treats it as unfiltered and returns the first token, and the provider authenticates as that token's owner if the token has not expired; the authenticated token-listing route then returns reusable login token ids ("
    urls: ["https://docs.vates.tech/security-advisories/advisories/2026/vates-sa-2026-062/"]
  - claim_id: b9c5c9ffa0
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "body"
    kind: cited
    text: "The attacker needs network reach to the interface and an unexpired first token in the Xen Orchestra token store, and no credentials or user interaction; the attacker does not choose which token the lookup returns ("
    urls: ["https://github.com/vatesfr/xen-orchestra/security/advisories/GHSA-2r3w-c2vx-fv5g"]
  - claim_id: 7ec9d6937e
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "body"
    kind: cited
    text: "Xen Orchestra before 6.9.2 (stable) and before 6.10.1 (latest) is affected, and the fixes are xo-server 5.211.2 on the stable channel and 5.213.1 on the latest channel; a source install must move to the latest master ("
    urls: ["https://docs.vates.tech/security-advisories/advisories/2026/vates-sa-2026-062/"]
  - claim_id: 2d8c3898e9
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "body"
    kind: cited
    text: "The CVE record names the same fixed releases, 6.9.2 and 6.10.1, and states the flaw is actively exploited in the wild ("
    urls: ["https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-133254"]
  - claim_id: 9f65dec5ea
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "body"
    kind: cited
    text: "); BleepingComputer named 6.9.1 and 6.10.0 as the fixed releases, which the CVE record contradicts ("
    urls: ["https://www.bleepingcomputer.com/news/security/critical-xen-orchestra-auth-bypass-flaw-exploited-to-hijack-vm-servers/"]
  - claim_id: 91d89e7bd6
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "body"
    kind: cited
    text: "**Exposure:** any Xen Orchestra or XOA instance below those versions whose web or REST port is reachable from an untrusted network; Vates' first mitigation is a dedicated management network, never the internet ("
    urls: ["https://docs.vates.tech/security-advisories/advisories/2026/vates-sa-2026-062/"]
  - claim_id: 5eb2946854
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "body"
    kind: cited
    text: "**Detection:** a successful exploit leaves no Xen Orchestra log, so the signal is on the wire or at a reverse proxy: HTTP requests whose authenticationToken cookie is an empty JSON object in the encoded or the literal form, and Vates warns that a rule written as a regular expression can be bypassed with other encodings ("
    urls: ["https://docs.vates.tech/security-advisories/advisories/2026/vates-sa-2026-062/"]
  - claim_id: 578f375f70
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "body"
    kind: cited
    text: "On the XCP-ng hosts Vates lists a VM that sends its serial console to a file, a VM with an unexpected name, cron files written by the actor and the dynamic-linker preload file, and says these cover only the known campaign, so their absence does not prove a clean host ("
    urls: ["https://docs.vates.tech/security-advisories/advisories/2026/vates-sa-2026-062/"]
  - claim_id: 135388bade
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** update now and take the interface off any untrusted network; for an instance that was exposed, treat the stack as possibly compromised, rotate every secret it held (backup remotes, the root and pool secrets, user and OTP secrets, mail-server passwords) and reinstall where compromise is confirmed ("
    urls: ["https://docs.vates.tech/security-advisories/advisories/2026/vates-sa-2026-062/"]
  - claim_id: b8a5d8af9f
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "section 2026-11-24T04:29:11Z"
    kind: cited
    text: "GitHub, as numbering authority, published CVE-2026-133469 for this flaw on 2026-11-23 with CVSS 3.1 9.8; the record states that it is actively exploited in the wild and fixed in 6.9.2 and 6.10.1, the same releases Vates names, and lists xo-server before 5.211.2 and 5.213.1 as affected ("
    urls: ["https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-133254"]
  - claim_id: c57742178e
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "section 2026-11-24T04:29:11Z"
    kind: cited
    text: "The project's own advisory, published on 2026-11-20, gives the root cause in the REST cookie parser and the token lookup, and the prerequisite: authentication succeeds only if the token returned first is unexpired and belongs to an existing user, and a successful request returns reusable login token ids ("
    urls: ["https://github.com/vatesfr/xen-orchestra/security/advisories/GHSA-2r3w-c2vx-fv5g"]
  - claim_id: 7a3c6435f4
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "section 2026-11-24T04:29:11Z"
    kind: cited
    text: "The advisory includes a one-request proof of concept, so the technique is public ("
    urls: ["https://github.com/vatesfr/xen-orchestra/security/advisories/GHSA-2r3w-c2vx-fv5g"]
  - claim_id: 4f296acc28
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "record 2026-11-24T04:29:11Z"
    kind: record-summary
    text: "The flaw now has a CVE id, CVE-2026-133469 (CVSS 3.1 9.8), whose record states it is actively exploited and fixed in Xen Orchestra 6.9.2 and 6.10.1, which settles the release numbers BleepingComputer gave differently; the project's own advisory names the root cause and the token prerequisite and includes a one-request proof of concept, so the entry now carries the public-proof-of-concept status. The fixed releases and the actions are unchanged."
  - claim_id: 55899d1f5d
    entry: 2026-11-17/optimjack-poisoned-vendor-scripts-skimmer-iphone-router
    surface: "actions[0]"
    kind: frontmatter
    text: "List every page of your organisation's sites, and of the agencies that build them, that has loaded Optimizely project JavaScript since 2026-11-16, or Kissmetrics i.js, a StorifyMe widget or the minute-ly loader since 2026-11-13, capture the bytes the browser receives and compare them with the provider's own project content (a search for the loader's host name misses the variant that hides it in base64), and where a file carries the injected loader remove it, keep the response bytes as evidence and treat the payment, login and form pages that loaded an affected Optimizely file as exposed to card and session theft."
  - claim_id: c5ef00fddd
    entry: 2026-11-17/optimjack-poisoned-vendor-scripts-skimmer-iphone-router
    surface: "actions[1]"
    kind: frontmatter
    text: "If your organisation or an agency building its sites has an Optimizely Web Experimentation account, audit every Project JavaScript field for code nobody wrote and rotate the API tokens, session tokens and integration keys tied to it, because the attacker impersonated users on targeted accounts to edit that field."
