    text: "Norway's NSM said on 2026-11-20 that an unknown actor actively went after access tokens, secrets and named values in Azure API Management, that the flaw hit several Norwegian organisations including Equinor and Skagerak Energi, and that it also affects other sectors and countries. Microsoft, in a customer notice quoted by SecurityWeek, identified the issue on 2026-11-18 and closed the access path on 2026-11-19, and says Classic instances were exposed before then while v2 tiers are not affected. NSM tells every APIM user to assume secrets and named values are exposed and to rotate all tokens and secrets."
