    surface: "summary"
    kind: frontmatter
    text: "Microsoft told Entra tenants from 2026-11-20 that a flaw in the Entra Connect Health API, introduced on 2026-07-23 and found on 2026-11-09, was exploited for unauthorized read-only access to tenant metadata: administrator and technical-contact email addresses, tenant identifiers and domain names, licence tier and directory-synchronisation status. It fixed the flaw server-side on 2026-11-19, says no customer update is needed and no configuration change was found, and advises expecting targeted phishing against the exposed addresses; it has not said who exploited the flaw, how many tenants are affected or when exploitation began."
