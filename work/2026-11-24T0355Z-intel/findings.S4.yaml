  - title: "Microsoft Entra Connect Health: an API flaw present since 2026-07-23 was exploited to read tenant metadata (administrator and technical-contact emails, tenant and domain details); Microsoft fixed it server-side on 2026-11-19 and is notifying tenants through Azure Service Health"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/security/microsoft-entra-connect-health-flaw-exploited-to-steal-tenant-data/", publisher: "BleepingComputer", date: "2026-11-21", role: "primary" }
      - { url: "https://www.netzwoche.ch/news/2026-11-23/angreifer-lesen-konfigurationsdaten-von-microsoft-kunden-aus", publisher: "Netzwoche", date: "2026-11-23", role: "corroborating" }
    discovery_trace: "first seen at: netzwoche, URL https://www.netzwoche.ch/rss.xml (item 'Angreifer lesen Konfigurationsdaten von Microsoft-Kunden aus', 2026-11-23) -> primary reporting: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/microsoft-entra-connect-health-flaw-exploited-to-steal-tenant-data/ (extract; quotes Microsoft's customer notification, shared on Reddit r/sysadmin which WebFetch refuses, and a Microsoft spokesperson) -> independent confirmation searched at WebSearch ('Microsoft Entra Connect Health breach notification tenants Reddit sysadmin Azure Service Health', extended): only derivative rewrites of BleepingComputer, no MSRC page found"
    summary: |
      Microsoft told Entra tenants, in a notification shared on Reddit and reported by BleepingComputer on 2026-11-21 (netzwoche relays it on 2026-11-23), that a flaw in the Entra Connect Health API, introduced on 2026-07-23 and found on 2026-11-09, was exploited: its investigation, concluded 2026-11-20, found unauthorized read-only access to tenant-level metadata and no unauthorized configuration changes. Microsoft deployed a server-side fix on 2026-11-19 and began notifying affected organisations through Azure Service Health; no customer-side update is needed. Exposed: email addresses of tenant technical contacts and administrator accounts; tenant IDs, display names, initial domain names, country and region codes; Entra licence tiers and directory-synchronisation status (enabled flag, last sync time); Connect Health onboarding status; and an expired agent-registration certificate (for an internal service decommissioned in late 2024) that the API still returned. Microsoft says passwords, hashes, tokens, valid cryptographic keys, on-premises server and Active Directory topology and Azure subscription data were not exposed, although the flaw could in principle have changed Connect Health monitoring settings. Microsoft has not said who exploited it, how many tenants are affected or when exploitation began; more than a dozen administrators posted the notice and some MSPs received notices for several customer tenants. Microsoft's advice: expect targeted phishing and social engineering aimed at the exposed administrator and contact addresses, use phishing-resistant MFA on privileged accounts, review the Connect Health configuration and the Entra audit and sign-in logs; a Microsoft PowerShell script shows the current configuration values (not the data that was accessed).
    region_nexus: "global Microsoft cloud; any Swiss federal, cantonal or communal tenant with hybrid identity (Entra Connect Health agents, AD FS) may hold an Azure Service Health notice"
    primary_sector_nexus: "indirect (cloud supplier incident; public-sector hybrid-identity administrators are the phishing audience)"
    sector: "public-sector"
    cves: []
    techniques: [T1190, T1589.002]
    technique_notes: "T1190 = exploitation of the Connect Health API flaw in a Microsoft-hosted service; T1589.002 = administrator and technical-contact email addresses read from tenant metadata. The phishing Microsoft warns of (T1566) is an expected follow-on, not observed."
    affected_products: ["Microsoft Entra Connect Health", "Microsoft Entra ID"]
    entity_keys: []
    new_entities:
