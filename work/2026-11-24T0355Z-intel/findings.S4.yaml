    discovery_trace: "first seen at: theregister-security-feed, URL https://www.theregister.com/security/headlines.atom (item 'Bulgaria evicts cyber snoops who lurked inside government networks for 5 years', 2026-11-23) -> primary: Bulgarian Ministry of Innovation and Digital Transformation, URL https://midt.gov.bg/bg/news/1614 (extract, Bulgarian, 2026-11-18; cited in The Register) -> corroboration: ZATAZ https://www.zataz.com/cyberespionnage-en-bulgarie-62-millions-de-pages-volees/ (2026-11-23); the minister's bTV interview (btvnovinite.bg link in The Register) was not fetched"
    summary: |
      Bulgaria's Ministry of Innovation and Digital Transformation said on 2026-11-18 that attackers kept unauthorized access since 2021 to the infrastructure through which state institutions exchange information, moved between its components and collected sensitive state-related information, calling it the longest and largest known cyber-espionage case against the Bulgarian administration. The activity stayed unseen for years because the existing protections did not work as one integrated system; it was found thanks to a new national cybersecurity system that for the first time gives a single picture of state networks (the ministry says the response group has worked since August; ZATAZ dates the alert to August 2026). An inter-agency group (innovation, interior and defence ministries, the national security, intelligence and military-intelligence services, the e-government agency and the state IT operator, with international partners) isolated the environment, tightened access to critical systems, cut the attackers off from their infrastructure and ended all unauthorized access found; the infrastructure stays under heightened monitoring for 90 days. The checks so far found no compromise of citizens' personal data. In coverage on 2026-11-23 The Register adds the minister's figures (more than 130 GB downloaded over five years, about 62 million pages; The Register asked the government to confirm) and his statement that several international hacking groups had accessed government systems since 2021, without naming groups or countries; the access method is not disclosed and no actor is attributed. ZATAZ adds that the prosecutor has been seized to examine why the intrusion stayed unnoticed for nearly five years.
