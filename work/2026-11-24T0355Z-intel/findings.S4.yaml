      - { key: "product:azure-api-management", type: product, name: "Azure API Management", aliases: ["APIM"], summary: "Microsoft Azure service for publishing, securing and managing APIs; Classic tiers were affected by the 2026-11 secrets exposure, v2 tiers were not." }
    verification: MULTI-SOURCE
    confidence: HIGH
    classification_hint: { reliability: A, credibility: 2 }
    priority_hint: notable
    novelty: new
    cross_domain_note: "S1 may also surface this as a vulnerability (no CVE is cited in any fetched source); this item carries the incident and authority-advisory angle. Check prior coverage of 'CVE-2026-35425' APIM before merging - a search snippet linked a July 2026 APIM CVE but no fetched source ties it to this incident, so it is NOT asserted here."
    evidence:
      - quote: "An unknown actor has actively gone after access tokens, secrets and named values in APIM. (translated from Norwegian)"
        original: "En ukjent aktør har aktivt gått etter access tokens, secrets og named values i APIM."
        attribution: "NSM (Norway)"
        source_url: "https://nsm.no/aktuelt/nsm-deler-tiltak-mot-sarbarhet-i-azure-api-management"
      - quote: "Equinor and Skagerak Energi are among the organisations that have been hit. (translated from Norwegian)"
        original: "Equinor og Skagerak Energi er blant virksomhetene som har blitt rammet."
        attribution: "NSM (Norway)"
        source_url: "https://nsm.no/aktuelt/nsm-deler-tiltak-mot-sarbarhet-i-azure-api-management"
      - quote: "Everyone who has Azure API Manager must assume that their secrets and named values have been compromised. (translated from Norwegian)"
        original: "Alle som har Azure API Manager må ta utgangspunkt i at deres secrets og named values er på avveie."
        attribution: "NSM (Norway)"
        source_url: "https://nsm.no/aktuelt/nsm-deler-tiltak-mot-sarbarhet-i-azure-api-management"
      - quote: "Our investigation found that customers were exposed and an unauthorized party could have used the issue to access secrets stored in Azure API Management Classic instances before Microsoft identified the security issue"
        attribution: "Microsoft customer notice, as quoted by SecurityWeek"
        source_url: "https://www.securityweek.com/azure-flaw-exploited-to-target-secrets-at-norwegian-energy-firms/"
    extended_notes: |
      Exposure check (vendor-documented, via NSM): read RuntimeVersion from the gateway's internal-status endpoint (NSM's page gives the path); 0.52.x is patched from build 31936, 0.53.x from 31938, lower numbers are still vulnerable, patterns such as 0.53.4608.0 are v2 or Consumption tier and not affected. Post-mitigation compromise check: Microsoft's mitigation closes the access path but does not undo earlier theft; rotate backend credentials, app-registration secrets, subscription keys, Key Vault secrets APIM references and tenant access keys, then hunt (Kristiansen's log map: Azure Activity log for secret-list requests and configuration changes, APIM gateway logs for tracing requests, developer-portal audit log, Entra service-principal sign-ins for use of the rotated app credentials, Key Vault audit logs, Microsoft Graph activity logs). Hardening levers: Key Vault references instead of inline named values, disable the retired direct Management REST API, restrict policy editing and tracing, close unused developer portals. NSM also states the national cyber risk level is high and that AI use is accelerating exploitation of newly known flaws.
