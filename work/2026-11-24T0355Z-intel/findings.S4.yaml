        attribution: "Bulgarian Ministry of Innovation and Digital Transformation"
        source_url: "https://midt.gov.bg/bg/news/1614"
      - quote: "The incident was discovered thanks to the new national cybersecurity system. (translated from Bulgarian)"
        original: "Инцидентът беше открит благодарение на новата национална система за киберсигурност"
        attribution: "Bulgarian Ministry of Innovation and Digital Transformation"
        source_url: "https://midt.gov.bg/bg/news/1614"
    extended_notes: |
      Detection concept: the ministry's own lesson is that per-service protections did not correlate; shared inter-agency platforms need a common telemetry view (authentication and file-access logs across institutions) so that low-and-slow collection by an unattributed intruder becomes visible. After eviction the ministry runs 90 days of heightened monitoring for re-entry. Unknowns (ministry silent): initial access vector, persistence, which groups, which documents (ZATAZ says Council of Ministers work, internal reports and inter-institution correspondence; that is ZATAZ's reading, not in the ministry text I read).
