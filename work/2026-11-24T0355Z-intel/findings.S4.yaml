      - { key: "actor:babidighost", type: actor, name: "BabidiGhost", aliases: ["Babidi", "@babidighost", "Ghosthunters"], summary: "Low-skill French-speaking operator whose exposed staging server (hijacked French business server) let SOCRadar reconstruct a 2026-11-06 to 2026-11-14 campaign by a jailbroken BlackHatSect0r-toolchain agent against banks, insurers and municipalities in Belgium, France and Switzerland; SOCRadar calls him a second operator of the toolchain, ZATAZ treats the signature as the same actor as BlackHatSect0r (SOCRadar, 2026-11-20; ZATAZ, 2026-11-23)." }
