    sourcing_note: "single effective source (BleepingComputer, which quotes Microsoft's customer notification and a Microsoft spokesperson); netzwoche re-reports it; no MSRC or Microsoft-hosted page was reachable (reddit.com refused by WebFetch); at least a dozen admins corroborating on Reddit is BleepingComputer's statement, not independently seen"
