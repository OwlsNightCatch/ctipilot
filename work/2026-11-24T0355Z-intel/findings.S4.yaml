        attribution: "SOCRadar Research"
        source_url: "https://socradar.io/blog/babidighost-ai-augmented-cybercrime/"
      - quote: "a 120-thread crawler swept Swiss websites for international bank account numbers (IBANs), emails and phone numbers"
        attribution: "SOCRadar Research"
        source_url: "https://socradar.io/blog/babidighost-ai-augmented-cybercrime/"
      - quote: "The advertisement stresses the integration of 28 Swiss institutions, including UBS, PostFinance, Raiffeisen, ZKB, BCV, BCGE, Migros Bank, Swissquote, Pictet and Julius Baer. (translated from French)"
        original: "L’annonce commerciale insiste sur l’intégration de 28 établissements suisses, parmi lesquels UBS, PostFinance, Raiffeisen, ZKB, BCV, BCGE, Migros Bank, Swissquote, Pictet et Julius Baer."
        attribution: "ZATAZ"
        source_url: "https://www.zataz.com/blackhatsect0r-phishing-bancaire-extorsion-et-industrie/"
    extended_notes: |
      Defender anchors from SOCRadar (no IOCs carried): exposure = internet-facing analytics/BI tools (Metabase before 0.46.6.1 / Enterprise before 1.46.6.1 per NVD), storage-management interfaces with weak admin passwords, API routes without authentication, sign-in flows that leak whether an account exists, SMS-sending functions without rate limits, secrets readable from the web application's process environment. Detection concept = egress/proxy telemetry for a server making continuous calls to a model-provider API or the Telegram bot API without a business reason; database-trigger audit on PostgreSQL for unexpected entries; Windows persistence that presents as a Windows Update service or task but is unsigned and outside the servicing stack, plus Defender exclusions; SOCRadar's own hunt window was 2026-11-05 to 2026-11-17. Controls that held: MFA (TOTP), IP allow-listing, server-side validation. Post-compromise: implants outlived the agent's API key by about a day, so revoking model access does not evict deployed beacons.
      Caveats: SOCRadar anonymises victims by sector and country and withholds victim-side data, so no Swiss public body is confirmed as a victim; the Swiss nexus is targeting (crawler, banks in the kit) not a named Swiss breach. ZATAZ's AAAEP and inter-communal claims are the actor's own and unverified (ZATAZ itself flags the lack of independent proof, and says it confirmed modification of some storage spaces only for the Spanish victim Torcal). The 28-bank kit is an advertised product; ZATAZ does not report Swiss victims of it. Possible S3 overlap (SOCRadar is a research record) - the incident/targeting angle is the S4 contribution.
