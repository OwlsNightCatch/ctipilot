    discovery_trace: "first seen at: databreaches-net, URL https://databreaches.net/feed/ (item 'BabidiGhost: An AI-Augmented Cybercrime Operation', 2026-11-23, relays SOCRadar; article body 403 on every transport) -> pivot: SOCRadar blog index https://socradar.io/blog/ (WebFetch) -> primary: https://socradar.io/blog/babidighost-ai-augmented-cybercrime/ (extract, 2026-11-20) -> independent corroboration: ZATAZ feed https://www.zataz.com/feed/ -> https://www.zataz.com/blackhatsect0r-phishing-bancaire-extorsion-et-industrie/ , https://www.zataz.com/blackhat-sector-une-ia-offensive-a-louer-pour-500-e/ , https://www.zataz.com/cyberattaque-contre-aaaep-585-000-personnes-exposees/ (all 2026-11-23, in window) -> context: https://www.zataz.com/entre-bievre-et-rhone-visee-par-une-revendication-cyber/ (2026-11-15) and SOCRadar Part I https://socradar.io/blog/blackhatsect0r-dxqrtxx-operation-server/ (2026-09-16)"
    summary: |
      SOCRadar recovered the exposed home directory of 'BabidiGhost', a French-speaking, low-skill operator who ran a jailbroken Hermes-based AI agent (the toolchain SOCRadar documented in September for the BlackHatSect0r crew) against more than 50 organisations and datasets between 2026-11-06 and 2026-11-14, 'mostly in Belgium, France and Switzerland'. Of 14 organisations analysed in depth, two were breached and three partly breached, and every success used a public flaw or a plain exposure: an unpatched internet-facing Metabase (CVE-2023-38646, pre-authentication RCE) that gave container-environment cloud-database credentials, a full customer-database export and a database trigger as persistence; a shared IT provider's storage-management interface reachable from the internet with a weak administrator password, which yielded 23 archives (about 8.6 GB) belonging to more than 13 municipalities and 10 other public bodies (SOCRadar's geography section ties that server to Belgium, so no Swiss municipality is named); unauthenticated production API routes; and a login-error oracle that confirmed 48 corporate accounts. TOTP second factors (11 brute-force scripts failed), IP allow-listing (49 hostnames unreachable) and server-side business validation stopped the same agent. A 120-thread crawler swept Swiss websites for IBANs, email addresses and phone numbers. The agent went silent when its model API key was revoked on 2026-11-14; a PowerShell beacon and a C# backdoor posing as a Windows Update service kept calling home until 2026-11-15. In window, ZATAZ (2026-11-23) reports that the BlackHatSect0r handle now rents the jailbroken agent for EUR 500-1,800 and sells a bank-phishing platform with 241 HTML templates for 81 banks in France, Belgium, Luxembourg and Switzerland, 28 of them Swiss (named: UBS, PostFinance, Raiffeisen, ZKB, BCV, BCGE, Migros Bank, Swissquote, Pictet, Julius Baer), sent partly through hijacked SMTP servers (one the actor ties to a French pension-insurer domain, which ZATAZ says is unconfirmed). ZATAZ also relays the crew's unverified claims against a French inter-communal authority (40 communes, water-service telemetry database, Veeam backups, Active Directory hashes, published 2026-11-15) and against AAAEP (Metabase superuser access, about 585,000 people). The sources disagree on identity: SOCRadar treats BabidiGhost as a second operator of the BlackHatSect0r toolchain, ZATAZ treats BabidiGhost and GhostHunters as signatures of BlackHatSect0r.
    region_nexus: "switzerland (explicit target set: Swiss-website IBAN crawler, 28 Swiss banks in the phishing kit), belgium, france"
    primary_sector_nexus: "direct for local government (13+ municipalities and 10 other public bodies' archives taken via a shared IT provider; French inter-communal authority claim), indirect for Swiss public-sector banks (PostFinance, ZKB, BCV, BCGE) used as phishing lures"
