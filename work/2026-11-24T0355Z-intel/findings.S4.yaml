  - title: "Azure API Management Classic: a flaw let an unknown actor take secrets, named values and tokens from APIM instances; Norway's NSM names Equinor and Skagerak Energi as hit, says other sectors and countries are affected, and tells every APIM user to treat secrets as compromised after Microsoft's 2026-11-19 mitigation"
    sources:
