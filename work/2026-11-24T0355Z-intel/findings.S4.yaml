  - title: "BabidiGhost / BlackHatSect0r: a jailbroken Hermes-based AI agent run against more than 50 targets 'mostly in Belgium, France and Switzerland' (shared-IT-provider storage server with the data of 13+ municipalities, unpatched Metabase, Swiss IBAN crawler), and the same handle now sells the agent and a bank-phishing kit with 28 Swiss banks"
    sources:
