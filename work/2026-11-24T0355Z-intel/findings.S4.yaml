    discovery_trace: "first seen at: theregister-security-feed, URL https://www.theregister.com/security/headlines.atom (item 'Norway links energy firm cyberattacks to critical Azure API Management flaw', 2026-11-23) -> pivot: The Register article (WebFetch + raw url) -> primary: NSM, URL https://nsm.no/aktuelt/nsm-deler-tiltak-mot-sarbarhet-i-azure-api-management (extract; feed https://nsm.no/rss/alle-oppdateringer-fra-nsm/ confirms 2026-11-20 publication) -> victim statements: https://www.equinor.com/news/20261711-equinor-detected-cyber-attack and https://www.skagerakenergi.no/presse/pressemeldinger/skagerak-energi-utsatt-for-forsok-pa-cyberangrep -> corroboration: SecurityWeek https://www.securityweek.com/azure-flaw-exploited-to-target-secrets-at-norwegian-energy-firms/ ; the Microsoft customer notice SecurityWeek and The Register read is on Reddit (r/sysadmin), which WebFetch refuses"
    summary: |
      Norway's NSM said on 2026-11-20 (updated 2026-11-23) that an unknown actor had actively gone after access tokens, secrets and named values in Azure API Management (APIM), that the vulnerability had hit several Norwegian organisations, naming Equinor and Skagerak Energi, and that it also affects other sectors and countries. Microsoft, in a customer notice that SecurityWeek and The Register read, identified the issue on 2026-11-18 and automatically deployed a mitigation on 2026-11-19; it says an unauthorized party could have accessed secrets in APIM Classic instances before then, that v2 tiers are not affected, and that exposure is tied to Classic deployments that ignored its network-security guidance or kept secrets inline instead of in Key Vault. Exposed items include named values, client secrets for identity and OpenID Connect providers, subscription keys and tokens for the direct management API. The extent of exploitation is unknown: Equinor reported its attack on 2026-11-17, said on 2026-11-19 it did not appear to target Equinor specifically and on 2026-11-20 that it was stopped with no sign of data theft or alteration; Skagerak Energi reported a possible attempted attack on 2026-11-18 with no operational impact. NSM tells all APIM users to assume secrets and named values are exposed and to rotate every token and secret, map what each instance can reach, check the gateway RuntimeVersion against the patched thresholds (0.52.x from build 31936, 0.53.x from 31938; other patterns are v2 or Consumption tier and not vulnerable) and escalate to the provider if unpatched. An independent practitioner guide adds that the retired direct Management API should be switched off, old developer portals closed, and gateway, activity, service-principal, Key Vault and Graph logs hunted.
    region_nexus: "norway (named victims); the vulnerability affects other countries and sectors per NSM, so Swiss tenants running APIM Classic are in scope"
    primary_sector_nexus: "indirect (cloud supplier flaw; any Swiss public body fronting APIs with APIM Classic holds backend credentials in the same store)"
    sector: "energy"
    cves: []
    techniques: [T1190, T1528, T1552]
    technique_notes: "T1190 = exploitation of the APIM service flaw; T1528 = access tokens and management-API tokens taken; T1552 = secrets and named values stored inline in APIM read out. Reuse of the stolen credentials against backend services is a risk NSM and Kristiansen describe, not an observed step."
    affected_products: ["Azure API Management (Classic tiers)"]
    entity_keys: []
    new_entities:
