      - { key: "product:microsoft-entra-connect-health", type: product, name: "Microsoft Entra Connect Health", aliases: ["Azure AD Connect Health"], summary: "Microsoft cloud monitoring service for on-premises identity infrastructure (AD FS, directory synchronisation); subject of the 2026-11 API metadata exposure." }
