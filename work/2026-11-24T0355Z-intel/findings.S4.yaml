    extended_notes: |
      Exposure check: the Azure Service Health notification Microsoft names as the notice channel (Service Health, tenant scope); Connect Health is only present where the Connect Health agents or AD FS monitoring were onboarded. Detection concept (post-fix): the data cannot be un-leaked, so the control is on the follow-on - email-gateway and helpdesk logs for pretexts aimed at the exposed administrator and technical-contact addresses, Entra sign-in logs for privileged accounts (new sign-in locations, MFA registration changes, device-code and SSO prompts), and Entra audit logs for changes to Connect Health or synchronisation settings; Microsoft says it saw no configuration changes. Caveat: one third-party page claims 'thousands' of tenants and an access window of 2026-07-23 to 2026-11-19; Microsoft has stated neither, treat as unsupported.
