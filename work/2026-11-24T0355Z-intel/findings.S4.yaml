    technique_notes: "T1595.002/T1596.003/T1589.002 = path scanning, certificate-log harvesting and account validation (SOCRadar ATT&CK table); T1584.004 = hijacked staging server; T1190 = Metabase CVE-2023-38646; T1078/T1110.001/T1552.001 = valid and guessed credentials, secrets read from the container environment; T1059.001/T1053.005/T1547.001/T1546/T1036.005 = PowerShell beacon, scheduled tasks, Run key, database trigger, Windows-Update masquerade; T1685 = Defender exclusions; T1567 = Telegram bot API and file-transfer exfiltration; T1213/T1005 = database and archive collection; T1657 = IBAN harvesting and attempted account drain; T1566 = the bank-phishing kit ZATAZ describes (offered, not observed against a named victim); T1588.007 = the actor obtaining and renting a jailbroken AI agent."
