    discovery_trace: "first seen at: securityweek, URL https://www.securityweek.com/feed/ (item 'N-able Patches Critical Flaw Disclosed After Mail Assure Cyberattack', 2026-11-23) -> primary: N-able blog, URL https://www.n-able.com/blog/mail-assure-incident-update (extract, 2026-11-22; confirms CVE-2026-134624, DFIR engagement and RCA promise) -> CVE record confirmed through the NVD API (services.nvd.nist.gov, not cited): MailAssure (SpamExperts) before 20261121.1943, CVSS 4.0 9.3"
    summary: |
      N-able disabled access to the Mail Assure and SpamExperts Hosted Cloud portal and API on 2026-11-16 (logging, mailbox synchronisation, management portal and quarantine suspended; mail delivery unaffected) and confirmed on 2026-11-18 that the services had been attacked: the intruders hit a web server and likely accessed certain credentials stored there. N-able contained the incident, changed credentials and revoked API and OAuth tokens, and restored the dashboard and APIs on 2026-11-21. Its investigation found an SSRF flaw, CVE-2026-134624 (CVSS 4.0 9.3): the LDAP-synchronisation connection check performed when a relay is configured did not restrict its destination, so a sufficiently privileged API user could make the server connect to arbitrary internal hosts and ports and send crafted data; version 20261121.1943 patches it. N-able says exploitation was confined to a single N-able-hosted server and continued monitoring has found no further malicious activity; an independent DFIR team is engaged and a formal root-cause analysis is promised within two weeks. How the web server was first compromised is not stated, and whether the SSRF was the entry or was found afterwards is not stated.
