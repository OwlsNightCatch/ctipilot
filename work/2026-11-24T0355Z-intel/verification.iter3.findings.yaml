- code: F3
  category: claim-not-supported
  section: research
  item: "2026-11-24/project-zero-net-code-integrity-bypass-cve-2026-108398 (sources[] Oracle record and Exposure citation)"
  url_or_quote: "[Oracle, 2026-09-10](https://www.oracle.com/security-alerts/cspusep2026.html)"
  summary: "Citation date does not equal the source's own publication date. The Oracle advisory's visible revision table reads '2026-September-15 | Rev 1. Initial Release.' (Oracle's schedule: third Tuesday; the Oracle CVE record datePublished is 2026-09-15T20:06Z). 2026-09-10 is only the page's meta 'Updated Date' (2026-09-10T07:24:10Z). Five days of drift in both sources[].date and the body citation label. Set 2026-09-15."
- code: F3
  category: claim-not-supported
  section: research
  item: "2026-11-24/project-zero-net-code-integrity-bypass-cve-2026-108398 (Exposure line, claim 7cd455230b)"
  url_or_quote: "**Exposure:** Windows hosts that rely on App Control for Business or WDAC user-mode code integrity as an application-control boundary without Dynamic Code Security, and Windows hosts that run Oracle VM VirtualBox 7.2.16 ([Oracle, 2026-09-10](https://www.oracle.com/security-alerts/cspusep2026.html))."
  summary: "Adjacency: the single citation terminating this sentence is Oracle's CSPU page, which carries only the VirtualBox clause (row CVE-2026-87268, 'Supported Versions Affected 7.2.16', Note 1 'applies to Windows host only'). The first clause (WDAC / User Mode Code Integrity without Dynamic Code Security) appears nowhere on the Oracle page; it comes from the Project Zero post (https://projectzero.google/2026/11/virtualbox-process-hardening.html, 'If an enterprise is deploying a WDAC code integrity policy ... The Dynamic Code Security option isn't enabled by default') and MSRC's FAQ (bypass WDAC enforcement). The delta-6 fix added the Oracle citation at the end of a two-source sentence. Fix: cite Project Zero / MSRC after the first clause and Oracle after the second."
- code: F4
  category: hallucinated-fact
  section: research
  item: "2026-11-24/project-zero-net-code-integrity-bypass-cve-2026-108398 (headline, claim 0fafe6c894)"
  url_or_quote: "headline: \"Project Zero: one-bit change loads untrusted .NET assemblies past UMCI; fixed in October, PPL bypass remains\""
  summary: "(low confidence) The headline states 'PPL bypass remains' as fact. Project Zero writes only: 'The use of WLDP_LOCKDOWN_IS_ENFORCE specifically checks for UMCI being enabled ... However this wouldn't change the behavior in PPL therefore that should still be bypassable.' That is Forshaw's expectation, not a retest; the entry body hedges correctly ('Forshaw expects it to remain bypassable'), so frontmatter overstates the body. Fix: 'PPL bypass expected to remain' or equivalent."
- code: F11
  category: editorial-advisory
  section: research
  item: "2026-11-24/project-zero-net-code-integrity-bypass-cve-2026-108398 (Exposure, VirtualBox clause)"
  url_or_quote: "Windows hosts that run Oracle VM VirtualBox 7.2.16"
  summary: "(low confidence) Oracle's page lists 7.2.16 as the only supported affected version, but states: 'Product releases that are not under Premier Support or Extended Support are not tested ... it is likely that earlier versions of affected releases are also affected by these vulnerabilities.' A host on an earlier build can read the line as out of scope. Optional: say '7.2.16 and likely earlier builds' (the Oracle page names no fixed build)."
