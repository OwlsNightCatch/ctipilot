  - title: "Socket: 13 malicious NuGet packages and a fake WinUI 3 'home assessment' target .NET developers with an MSBuild targets-file stager, an osk.exe DLL side-load and GitHub-API command and control"
    sources:
      - { url: "https://socket.dev/blog/malicious-nuget-packages-fake-job-assessments", publisher: "Socket (Threat Research Team)", date: "2026-11-23", role: "primary" }
    discovery_trace: "first seen at: standing sweep of research feeds (outside the S3 slice), feed https://socket.dev/api/blog/feed.atom item dated 2026-11-23T21:55Z → primary (no pivot needed): https://socket.dev/blog/malicious-nuget-packages-fake-job-assessments read with `extract`. WebSearch (\"malicious NuGet packages fake job assessment WinUI.Button VS_Builder.MSBuildAnalyzer osk.exe\") found no second report of this operation."
    summary: |
      Socket's Threat Research Team identified 13 malicious NuGet packages tied to fake developer job "home assessment" projects aimed at Windows .NET developers; most pose as WinUI 3 and WPF button controls. Socket describes five infection paths from one operation (it began on npm in July 2026 and hosts payloads on GitHub). In the take-home project the project file adds a committed local package feed, and a package's build/<id>.targets file, which NuGet imports automatically, runs `dotnet` on a bundled analyzer DLL after every build (its Outputs names a file that is never created so MSBuild never treats it as up to date, ContinueOnError set); that stager downloads a file from GitHub to %LOCALAPPDATA%\osk and copies System32\osk.exe beside it for a DLL side-load, which a FileButton control launches hidden the first time it is created. A second package (WinUI.Button) starts a background task in a control constructor that downloads an executable through the GitHub contents API with an embedded fine-grained token and runs it from %TEMP%. Fake axios repositories serve Windows executables named like project files (axios.csproj): a loader using a GitHub repository as two-way command and control with an embedded token, a Chrome profile stealer that uploads to GitHub, and a payload reporting to Telegram; a trojanized "Crypto Wallet Analyzer" app was released on GitHub on 2026-11-13 and a ClickFix page is hosted on GitHub Pages. NuGet had removed 12 of the 13 packages at the time of writing (WinUI.Button 1.0.0 was still listed). Socket has not attributed the operation to a named actor; it notes that the take-home lures resemble fake-interview operations that public reporting links to North Korea (Contagious Interview) while pointing out that other North Korean and Iranian-nexus clusters also use coding-assessment lures.
    region_nexus: "global; Windows .NET developers and build hosts; no Swiss or EU victim stated"
