    extended_notes: |
      FACT / CLAIM / INFERENCE. Facts (Socket package and repository analysis): package behaviours, the build-time and run-time stages, the commit history of the fake repositories, the GitHub-token C2 pattern. Claim: that the five paths are one operation is Socket's assessment from shared owners, publisher accounts, git identity and token naming; attribution is explicitly withheld. Not verified here: the NuGet removal log Socket cites, and the second-stage payloads that were already taken down (GitHub accounts returned 404 during Socket's analysis). Package names, repository names, hashes, imphashes and Base64 strings in Socket's tables must not be carried.
      Detection concepts (from Socket's recommendations, telemetry class first): (1) process-creation lineage: dotnet.exe started by MSBuild with a DLL argument inside a restored NuGet package lib folder; (2) osk.exe running, or an OskSupport-style DLL written, outside %WINDIR%\System32, and osk.exe started hidden by a .NET/WinUI application; (3) .NET applications writing executables to %TEMP% and self-deleting batch files; (4) egress: authenticated GitHub API requests from developer workstations and build hosts with odd User-Agent patterns, GitHub contents PUT requests, Telegram Bot API traffic from build hosts, raw.githubusercontent.com downloads of .csproj-named binaries; (5) package-feed hygiene: RestoreAdditionalProjectSources, extra NuGet.config feeds, committed .nupkg files in a repository. Benign lookalike: legitimate NuGet packages ship build/*.targets with <Exec> for code generation or analyzers; the discriminators are an Outputs file that is never produced, ContinueOnError/IgnoreExitCode, a binary launch from the package lib folder, an unknown publisher, and any network download during build.
      Hardening levers: NuGet package source mapping and restricting restore feeds, including folders inside a repository; review third-party packages that carry build or buildTransitive targets with Exec; run candidate take-home projects only in disposable VMs without credentials; rotate browser-saved credentials, session cookies and developer tokens after any exposure.
