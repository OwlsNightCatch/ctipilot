  - title: "AhnLab: a Korean-language fake Ollama installer drops the vulnerable NeacSafe64.sys driver (CVE-2025-45737) to manual-map the WinWyvern kernel driver and patch Korean security products in memory"
    sources:
      - { url: "https://asec.ahnlab.com/en/96708/", publisher: "AhnLab ASEC", date: "2026-11-20", role: "primary" }
      - { url: "https://github.com/za233/NeacController", publisher: "za233 (public PoC repository, GitHub)", date: "2025-04-02", role: "corroborating (describes the NeacSafe64.sys primitives the malware reuses)" }
    discovery_trace: "first seen at: ahnlab-asec, listing https://asec.ahnlab.com/en/ read with WebFetch (post listed 2026-11-20, inside the record's 145 h lookback) → primary (no pivot needed): https://asec.ahnlab.com/en/96708/ read with `extract` (served by the jina reader; publication metadata 2026-11-19T15:00Z = 2026-11-20 KST) → corroboration: the PoC repository the post links, https://github.com/za233/NeacController. WebSearch (\"NeacSafe64.sys BYOVD WinWyvern fake Ollama installer Korean security products\") found no second report."
    summary: |
      AhnLab ASEC describes malware distributed through a Korean-language website imitating an AI-tool download page (an Ollama installer in OllamaSetup.zip) that uses BYOVD to disable Korea-based security products. The MSI inside the archive runs an embedded NVIDIA_Control.exe only when the host is not a virtual machine, while the installer also sets up the genuine Ollama so the user sees a normal install. NVIDIA_Control.exe hides a malicious DLL in an NTFS alternate data stream, writes the signed NetEase anti-cheat driver NeacSafe64.sys to System32, registers it as an automatic-start service (the public PoC uses manual) with the registry values of a file-system minifilter (group FSFilter Activity Monitor, altitude 370020), connects to its filter communication port and drives three opcodes: 12 (SSDT entry address, to derive the kernel base), 14 (arbitrary kernel read) and 70 (arbitrary kernel write), reusing the public PoC for CVE-2025-45737 (versions before 1.0.0.8; the opcode 14/70 handlers do not validate address or length). Shellcode placed in the driver's NonPagedPool buffer calls ExAllocatePoolWithTag, the reconstructed WinWyvern driver image is written with opcode 70, and a HalDispatchTable entry is temporarily pointed at its entry point and triggered through NtQueryIntervalProfile to run DriverEntry. WinWyvern then takes IOCTLs on its device object, patches hard-coded byte patterns in the memory of modules and drivers of specific Korean security products to disable detection and remediation, and can execute payloads received from its C2. AhnLab assesses a Korea-specific attack because the site is Korean and every targeted product is domestic; it names no actor, and states that the latest AhnLab V3 (Lite) is not affected by the memory patches and can detect and remove the chain even after execution.
    region_nexus: "Korea (targeted victims and products); no Swiss or EU nexus stated. Transferable value is the BYOVD chain, the driver, and the fake-AI-tool lure."
    primary_sector_nexus: "indirect: technique class (vulnerable signed driver used for kernel read/write to blind endpoint security) applies to any Windows fleet; no sector targeting stated beyond Korean users"
    sector: "technology"
    cves: [CVE-2025-45737]
    techniques: [T1204.002, T1497.001, T1564.004, T1543.003, T1068, T1687, T1685, T1518.001]
    affected_products: ["NetEase NeacSafe64.sys anti-cheat driver (before 1.0.0.8)", "Microsoft Windows", "Ollama (impersonated installer)"]
    entity_keys: ["product:ollama"]
    new_entities:
      - { key: "malware:winwyvern", type: malware, name: "WinWyvern", aliases: [], summary: "Malicious kernel driver that AhnLab ASEC reports manual-mapped through the vulnerable NeacSafe64.sys driver to patch Korean security products in memory and run payloads from its C2 (AhnLab, 2026-11-20)." }
      - { key: "tool:neacsafe64-sys", type: tool, name: "NeacSafe64.sys (vulnerable NetEase anti-cheat driver)", aliases: ["NeacSafe64"], summary: "Signed NetEase anti-cheat driver whose opcode 14 and 70 handlers give arbitrary kernel read/write (CVE-2025-45737, versions before 1.0.0.8); a public PoC exists and AhnLab reports it used for BYOVD against Korean security products (AhnLab, 2026-11-20)." }
    relation_suggestions:
      - { subject: "malware:winwyvern", object: "tool:neacsafe64-sys", basis: "AhnLab: the threat actor installed NeacSafe64.sys and exploited it to load the WinWyvern kernel driver (AhnLab, 2026-11-20)" }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    lookback: true
    borderline: true
    borderline_reason: "Korea-specific targeting (hard-coded patches only for Korean security products), single vendor source; kept because the BYOVD chain, the driver, the minifilter/ADS artefacts and the AI-tool lure are transferable to any Windows fleet and fit the audience's driver-abuse interest"
    evidence:
      - { quote: "The threat actor installed the vulnerable driver NeacSafe64.sys and then exploited it to load a malicious kernel driver.", attribution: "AhnLab ASEC", source_url: "https://asec.ahnlab.com/en/96708/" }
      - { quote: "Given that the site is in Korean and the targeted products are all domestic solutions, this incident is assessed to be an attack specifically targeting users in Korea.", attribution: "AhnLab ASEC", source_url: "https://asec.ahnlab.com/en/96708/" }
      - { quote: "The malware is distributed via a website disguised as a legitimate AI tool distribution page.", attribution: "AhnLab ASEC", source_url: "https://asec.ahnlab.com/en/96708/" }
      - { quote: "The latest version of AhnLab V3 (Lite) is not affected by the memory patches attempted by the malware in this case", attribution: "AhnLab ASEC", source_url: "https://asec.ahnlab.com/en/96708/" }
    extended_notes: |
      FACT / CLAIM / INFERENCE. Facts (AhnLab analysis): the install chain, driver service and minifilter values, opcode usage, HalDispatchTable trigger, the comparison table showing the actor's implementation largely identical to the public PoC. Claim: Korea-specific intent is AhnLab's assessment from the site language and the target list. Not stated: any actor, victim count, whether other (non-Korean) products are patched, the C2 protocol, the initial lure placement beyond a blog that listed the fake domains as official. The post's IOC and hash tables must not be carried.
      Detection concepts (telemetry class first): (1) driver/service installation events (service-install 7045/4697, Sysmon driver-load) for a file-system driver named NeacSafe64 in System32 on a host that is not a game client, with start type Automatic; (2) registry writes under the service key creating a minifilter Instances subkey with an altitude of 370020 and group FSFilter Activity Monitor; (3) a user-mode process calling FilterConnectCommunicationPort to a vendor driver port it has no business with (EDR API telemetry where available); (4) a DLL or executable stored in an NTFS alternate data stream of a System32 path and launched from it (file-stream creation telemetry, USN journal); (5) an installer MSI whose InstallExecuteSequence runs an embedded executable only on non-virtual hosts, shipped beside a genuine vendor installer. Benign lookalike: NeacSafe64.sys legitimately installed by NetEase games (Overwatch/Naraka-class clients) on gaming PCs; the discriminators are a non-gaming or managed host, System32 placement by a non-game installer, Automatic start, and a parent chain from an unknown AI-tool installer.
      Hardening levers: Microsoft's recommended driver block rules / HVCI (memory integrity) and a WDAC deny rule for vulnerable NeacSafe64 versions below 1.0.0.8 (whether this driver is currently on the Microsoft blocklist is not stated in the source and must be checked); software-install allow-listing so users cannot run installers fetched from look-alike AI-tool sites; kernel-driver load alerting.
    admiralty_suggestion: "B2"
