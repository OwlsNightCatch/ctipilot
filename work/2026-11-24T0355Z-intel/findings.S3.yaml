    extended_notes: |
      FACT / CLAIM / INFERENCE split. Fact (Symantec first-hand telemetry): the module run window, the credential and API-key tests, the DNS chunking scheme, the six implants. Claim: AI authorship is Symantec's assessment ("fit better than bespoke tooling"), no model identified; Witchetty attribution of the implants is "high confidence" by Symantec, ESET's TA410 sub-group link is carried from Symantec's citation of ESET's 2022 work. Absent from the source: initial access, whether any credential worked, exfiltrated data, the collector.
      Detection concepts (telemetry class first; derived mechanically from the described behaviour, Symantec gives no rule logic): (1) process-creation / script-block logging with the IIS worker process (w3wp.exe) as ancestor of powershell.exe, especially Start-Job plus Wait-Job timeouts and repeated short-lived PowerShell children within seconds; (2) DNS egress from a web or application server (server-class source, never a user workstation) to a public OAST service domain family, with unusually long hex-looking labels in 50-character chunks and a numeric offset label; (3) read access to SYSVOL policy folders and to web.config/.env/appsettings files by the web-tier account (file-share audit 5145 on SYSVOL, file-access audit on config files); (4) SCCM AdminService and WMI SMS_R_System queries from a non-management host, SharePoint snap-in loading from a web server, TFS API calls from an IIS host; (5) the investment-API shape: many credential variants (blank key, reused bearer token) against one authentication endpoint from one IP within minutes. Benign lookalike (analyst inference, not from the source): OAST lookups from a vulnerability scanner or pentest host are expected; the discriminator is a production server issuing them through PowerShell child processes of the IIS worker.
      Hardening levers the facts point to: remove legacy GPP cpassword artefacts from SYSVOL; keep secrets out of web-root and shared-folder config files (vault them) and rotate any found in such places; restrict web-tier service accounts from SCCM/TFS/SharePoint and from reading SYSVOL beyond need; egress-filter DNS from servers to approved resolvers and block OAST service domains at the resolver; inspect IIS servers for web shells and for DLL sideloading pairs beside legitimate vendor binaries.
      Context for the composer: a distinct incident from the entry 2026-11-17/symantec-ai-assisted-retailer-intrusion-orion-rabbitmq (US retailer); suggest it be referenced in references[] rather than treated as an update. Constituency link is behavioural, not geographic; no Swiss victim; Symantec's IOC section (hashes, one OAST token) must not be carried.
    admiralty_suggestion: "B2"
