  - title: "Project Zero: clearing one PE header bit makes .NET Framework 4 load an untrusted assembly past Windows code-integrity checks (CVE-2026-108398, fixed 2026-10-13); the same primitive defeated VirtualBox process hardening (CVE-2026-87268) and still yields a PPL bypass"
    sources:
      - { url: "https://projectzero.google/2026/11/virtualbox-process-hardening.html", publisher: "Google Project Zero (James Forshaw)", date: "2026-11-23", role: "primary" }
      - { url: "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-108398", publisher: "Microsoft MSRC", date: "2026-10-13", role: "corroborating (record read through the MSRC Security Update Guide API via `msrc cve CVE-2026-108398`; the page itself is a JS shell)" }
    discovery_trace: "first seen at: standing sweep of research feeds (outside the S3 slice), feed https://projectzero.google/feed.xml item dated 2026-11-23 → primary (no pivot needed): https://projectzero.google/2026/11/virtualbox-process-hardening.html read with `extract` → corroboration: `python3 tools/fetch_source.py msrc cve CVE-2026-108398` (MSRC record, release 2026-10-13) and the Oracle CNA record for CVE-2026-87268 via https://cveawg.mitre.org/api/cve/CVE-2026-87268 (published 2026-09-15)."
    summary: |
      James Forshaw (Google Project Zero) published on 2026-11-23 a write-up of a code-integrity bypass found while re-examining VirtualBox's Windows process hardening. On .NET Framework 4, PEImageLayout::Map first maps an assembly as an image section (SEC_IMAGE); if CreateFileMapping fails with ERROR_BAD_EXE_FORMAT it falls back to a data-only mapping (FlatImageLayout) that .NET can still run, so anything that hooks or audits image-section creation never sees the load. A Windows Lockdown Policy check meant to stop the fallback when code integrity is enforced tests the policy flags for inequality with WLDP_LOCKDOWN_CONFIG_CI, which is exactly the value Windows 11 S Mode (UMCI enforced, Dynamic Code Security off) returns, so the check passes. Clearing the IMAGE_FILE_EXECUTABLE_IMAGE flag in the COFF header of a managed assembly (one bit, no checksum fix-up) and running it with the .NET Framework64 v4.0.30319 regasm.exe /unregister (no administrator rights; it runs a ComUnregisterFunction) executed arbitrary code under UMCI. Forshaw did not first report this to Microsoft because MSRC servicing criteria place PPL bypasses out of scope and WDAC appeared to have a policy that blocked it; because he had already presented it publicly at the 2026 44Con conference when he reported it in late September, the issue was handled as a zero-day, tracked as CVE-2026-108398 (".NET Framework Security Feature Bypass Vulnerability", Important, CVSS 8.8, MSRC: publicly disclosed, not exploited, "Exploitation Less Likely") and fixed in the October 2026 update by correcting the policy check; the older .NET 3.5/2.0 frameworks do not run the bypass and modern .NET (5 and later) was not investigated. For VirtualBox (CVE-2026-87268, Oracle CNA: 7.2.16, Windows host only, CVSS 7.8) a managed AnyCPU assembly is an x86 PE with executable sections on an x64 host, which makes VirtualBox's NtCreateSection hook return STATUS_INVALID_IMAGE_FORMAT and triggers the same fallback; the payload is loaded by a current-user COM registration for a class a hardened VirtualBox process loads, started by launching a VM; VirtualBox fixed it by never returning that status and by adding a COM option that disables current-user hive lookups. Against protected processes, a COM hijack of an object loaded by WerSecureFault.exe gave code execution as PPL at TCB level without administrator rights; PPL bypasses are out of MSRC servicing scope and the WLDP fix does not change that behaviour, so Forshaw expects it to remain bypassable (full Protected Process is not affected because the .NET runtime DLLs lack page hashes). A working PoC is in the Project Zero tracker; no in-the-wild exploitation is reported by either source.
    region_nexus: "global; Windows endpoints enforcing WDAC / App Control for Business user-mode code integrity (including S Mode) and Windows hosts running VirtualBox"
    primary_sector_nexus: "indirect: relevant to government Windows fleets that rely on WDAC UMCI as an application-control boundary; no Swiss victim or exploitation reported"
    sector: "technology"
    cves: [CVE-2026-108398, CVE-2026-87268]
    techniques: [T1218.009, T1546.015, T1620, T1068]
    affected_products: ["Microsoft .NET Framework 4.x", "Microsoft Windows Defender Application Control / App Control for Business (UMCI)", "Oracle VM VirtualBox (Windows host)", "Windows Protected Process Light"]
    entity_keys: ["product:microsoft-net-framework"]
    new_entities:
      - { key: "product:oracle-vm-virtualbox", type: product, name: "Oracle VM VirtualBox", aliases: ["VirtualBox"], summary: "Oracle's desktop hypervisor; the Windows host process hardening was bypassed through a .NET assembly load fallback (CVE-2026-87268, Project Zero 2026-11-23)." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - { quote: "This single bit change is all you need to load an untrusted .NET assembly.", attribution: "Google Project Zero (James Forshaw)", source_url: "https://projectzero.google/2026/11/virtualbox-process-hardening.html" }
      - { quote: "The modified assembly was loaded into memory and executed arbitrary code even with UMCI enabled.", attribution: "Google Project Zero (James Forshaw)", source_url: "https://projectzero.google/2026/11/virtualbox-process-hardening.html" }
      - { quote: "Note this behavior only seems to work on .NET Framework v4", attribution: "Google Project Zero (James Forshaw)", source_url: "https://projectzero.google/2026/11/virtualbox-process-hardening.html" }
      - { quote: "I’d already publicly disclosed therefore it was treated as a zero day", attribution: "Google Project Zero (James Forshaw)", source_url: "https://projectzero.google/2026/11/virtualbox-process-hardening.html" }
      - { quote: "Untrusted search path in .NET Framework allows an authorized attacker to bypass a security feature locally.", attribution: "Microsoft MSRC", source_url: "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-108398" }
    extended_notes: |
      FACT / CLAIM / INFERENCE. Facts: the .NET fallback mechanics, the S Mode demonstration with regasm.exe, the VirtualBox chain, the PPL result and the vendor fixes are the discoverer's own analysis and are confirmed by the MSRC record (CVE-2026-108398, release 2026-10-13, publiclyDisclosed Yes, exploited No) and the Oracle CNA record (CVE-2026-87268, published 2026-09-15). Forshaw's statement that the PPL variant should remain bypassable is his assessment. Not verified from fetched sources: which .NET Framework 4.x builds and KB numbers carry the fix (MSRC API returned no product table here) and the VirtualBox release that contains the fix. Do not infer unaffected branches from this.
      Detection concepts (derived from the described mechanism; the post gives no detection logic): flat-mapped managed code produces no image-load event, so rely on (a) process-creation telemetry for regasm.exe / regsvcs.exe invoked with an unregister option against a DLL in a user-writable path, (b) registry-write telemetry for current-user COM class registrations that point a CLSID at mscoree.dll with an Assembly/CodeBase value (COM hijacking), (c) .NET runtime assembly-load ETW events that have no matching image-load event, (d) static file scanning for valid managed assemblies whose COFF Characteristics lack the executable-image bit. Benign lookalike: regasm/regsvcs run by developers or installers registering their own signed COM assemblies from build or Program Files paths; the discriminators are unsigned/modified assembly, user-writable path, current-user hive registration, S Mode or UMCI-enforced host.
      Hardening levers: apply the October 2026 .NET Framework security update (CVE-2026-108398); where UMCI is the boundary, verify the fix on the fleet and treat PPL as not a boundary against local admin-free .NET code; Dynamic Code Security blocks the behaviour but by accident, is not on by default and disables .NET byte-array Assembly::Load; update VirtualBox on Windows hosts.
    admiralty_suggestion: "B1"
