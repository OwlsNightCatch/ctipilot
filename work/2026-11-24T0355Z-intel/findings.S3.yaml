  - title: "Symantec: 41 likely AI-authored PowerShell modules ran under an IIS web shell at an African stock exchange for just over three minutes, testing harvested credentials against financial APIs and returning the output as hex-encoded DNS lookups to a public OAST service"
    sources:
      - { url: "https://www.security.com/threat-intelligence/african-stock-exchange-ai-assisted-attack", publisher: "Symantec / Broadcom (Threat Hunter Team)", date: "2026-11-19", role: "primary" }
      - { url: "https://www.security.com/threat-intelligence/witchetty-steganography-espionage", publisher: "Symantec / Broadcom (Threat Hunter Team)", date: "2022-09-29", role: "background (same victim and actor in 2022; not an in-window source)" }
    discovery_trace: "first seen at: symantec-security-com, feed https://www.security.com/rss/v1/blogs/rss.xml/221 (item dated 2026-11-19, inside the record's 168 h lookback) → primary (no pivot needed): https://www.security.com/threat-intelligence/african-stock-exchange-ai-assisted-attack read with `extract` → background: https://www.security.com/threat-intelligence/witchetty-steganography-espionage. WebSearch (\"Symantec \\\"stock exchange\\\" AI-assisted PowerShell toolkit Witchetty 41 modules\" and a second reformulation) found no independent corroboration."
    summary: |
      Symantec's Threat Hunter Team reports a toolkit found on a web server of a stock exchange in an African country: 41 PowerShell modules ran under a web shell inside the IIS worker process between 08:44 and 08:47 UTC on 2026-09-20 (three minutes twelve seconds, a new module every few seconds). The modules hunted for secrets in the domain's SYSVOL (Group Policy Preferences cpassword), shared policy folders, web roots and deployment directories (xml, json, .env and web.config files, AWS access keys, database connection strings), enumerated SharePoint (keyword search for "aws", "credential", "password"), Team Foundation Server and SCCM (an AdminService/WMI SMS_R_System lookup of the machine a named user last logged on to), probed an AWS RDS PostgreSQL instance and a SQL Server with integrated authentication, and tested a guessed password, a reused bearer token and several API keys (including a blank control key) against the exchange's investment API and a securities-depository gateway, connecting by IP with a hand-set Host header and certificate validation off. Every module hex-encoded its output into 50-character chunks and resolved them as DNS names under a unique token on a public out-of-band testing (OAST) service; the collector is not visible to Symantec, so it does not know whether any credential worked, and it found no evidence of privilege escalation or data theft. Symantec's AI-authorship assessment rests on uniform scaffolding (identical error-handling line and try/catch, the DNS loop copied byte for byte into all 41 modules, generic variable names, a progress variable in one module only, a deliberately invalid credential as a test) and says that no single signal is conclusive. Separately, six persistence implants on the same server (DLL loaders hosted by svchost.exe and by legitimate security-vendor and Visual Studio binaries, XOR/RC4-encrypted payload files, Cobalt Strike beacons) are attributed to Witchetty (LookingFrog, a TA410 sub-group per ESET) with high confidence, one first seen in 2020 and the earliest evidence dating to April 2026; Symantec does not attribute the toolkit to Witchetty or any group and lists three hypotheses (Witchetty with new tooling, a second more capable operator using the same access, an unrelated actor on the same compromise). The initial access vector is not stated; the web shell running under IIS suggests to Symantec that a vulnerability may have been exploited. The same exchange was a Witchetty target in 2022 (Exchange ProxyShell/ProxyLogon web shells).
    region_nexus: "Victim in Africa (stock exchange); no Swiss or EU victim. Relevance is transferable behaviour on any Windows/IIS estate with Active Directory, SCCM, SharePoint and TFS."
    primary_sector_nexus: "indirect: finance victim; the tradecraft (web shell to AD/GPP/SCCM/SharePoint/TFS secret hunting, token and API-key replay, DNS egress to an OAST service) transfers to on-prem public-sector Windows estates"
