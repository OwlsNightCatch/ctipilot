    surface: "body"
    kind: cited
    text: "**Detection:** the post says protection code that checks the loaded image section does not see this load ("
    urls: ["https://projectzero.google/2026/11/virtualbox-process-hardening.html"]
  - claim_id: 74d8db5dfb
    entry: 2026-11-24/project-zero-net-code-integrity-bypass-cve-2026-108398
    surface: "body"
    kind: uncited
    text: "On .NET Framework 4 the runtime first maps an assembly as an image section; if that fails with a bad-format error it falls back to a flat, data-only mapping that .NET can still run, so protection code that checks the loaded image section never sees it."
  - claim_id: 62396b0341
    entry: 2026-11-24/project-zero-net-code-integrity-bypass-cve-2026-108398
    surface: "body"
    kind: uncited
    text: "A check meant to stop the fallback when code integrity is enforced tests the Windows lockdown policy for inequality with the configuration-code-integrity value, which is exactly what Windows 11 S Mode returns (User Mode Code Integrity on, Dynamic Code Security off), so it passes."
