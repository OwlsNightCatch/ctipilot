    surface: "body"
    kind: cited
    text: "James Forshaw of Google Project Zero published a write-up of a code-integrity bypass found re-examining VirtualBox's Windows process hardening ("
    urls: ["https://projectzero.google/2026/11/virtualbox-process-hardening.html"]
  - claim_id: 2551c403d0
    entry: 2026-11-24/project-zero-net-code-integrity-bypass-cve-2026-108398
    surface: "body"
    kind: cited
    text: "Clearing the executable-image flag in the COFF header of a managed assembly, one bit with no checksum fix-up, and loading it through a .NET Framework 4 command-line utility without administrator rights ran arbitrary code under User Mode Code Integrity; it only seems to work on .NET Framework v4 ("
    urls: ["https://projectzero.google/2026/11/virtualbox-process-hardening.html"]
