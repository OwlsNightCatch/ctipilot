  - claim_id: 941fce1f03
    entry: 2026-10-22/cve-2026-76466-cisco-expressway-cluster-unauth-root-rce
    surface: "summary"
    kind: frontmatter
    text: "Cisco's disclosure of 2026-10-21 fixes CVE-2026-76466 (CVSS 3.1 9.8), which lets an unauthenticated attacker who holds persistent cookies run operating-system commands as root on Expressway-C and Expressway-E configured in a cluster; X15.5.3 and earlier get X15.5.20, X14 and earlier must migrate, and there is no workaround. CISA added it to its Known Exploited Vulnerabilities catalog on 2026-11-20, and F6 reports that, soon after a public proof of concept appeared, attackers compromised two internet-reachable X15.5.3 devices, reached two internal cluster nodes through one and ran Python scripts for scanning and credential theft, while Cisco's advisory still says it knows of no malicious use. The same-day hardening releases for the Unified CM family and Unity Connection (up to 9.8, fixed in 15SU5) and for Snort 3 (9.0) are not known to be exploited."
  - claim_id: a861624528
    entry: 2026-10-22/cve-2026-76466-cisco-expressway-cluster-unauth-root-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every clustered Cisco Expressway-C and Expressway-E to X15.5.20 now (X14 and earlier has no fix and must migrate) and, until it is in, limit TCP 4371 to 4372 to the cluster peers' addresses as F6 advises, because CISA lists CVE-2026-76466 as exploited and F6 saw two internet-reachable nodes compromised soon after a public proof of concept appeared."
