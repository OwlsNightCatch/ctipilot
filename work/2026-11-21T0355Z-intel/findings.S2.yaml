  - title: "Publica (update): the federal pension fund commissions an external review of how the supplier PK Softech was selected and controlled; first report due end of March 2027"
    sources:
      - { url: "https://www.inside-it.ch/publica-laesst-cybervorfall-extern-pruefen-20261119", publisher: "Inside IT (relaying a Publica communique)", date: "2026-11-19", role: "primary" }
    discovery_trace: "first seen at: inside-it-ch RSS, URL https://www.inside-it.ch/rss.xml (item 'Publica laesst Cybervorfall extern pruefen', 2026-11-19T11:26Z, inside the 72 h developing window) → extract https://www.inside-it.ch/publica-laesst-cybervorfall-extern-pruefen-20261119. Publica's own communique page was not found (WebSearch for it returned only a 27 Oct digitec/Galaxus article); no pivot to a primary was possible."
    summary: |
      Inside IT reports on 2026-11-19 that Publica, the federal pension fund, has decided to have an external audit firm examine how the attack on its software supplier PK Softech could happen despite existing precautions. Four areas: the selection of the supplier and the data-protection and access-authorisation requirements agreed with it; the handling of personal data; security requirements and the effectiveness of existing controls; and governance and oversight (responsibilities, information paths and decisions between the pension-fund commission, committees and the office). The procedure is to be fixed by the end of January and a first report is planned by the end of March 2027; criminal investigation is outside the review and belongs to the Federal Prosecutor's Office and the data-protection commissioner (EDOEB). Publica says it must be assumed that personal data of insured persons, former insured persons and pensioners left, and no ransom demand has become known.
