    discovery_trace: "first seen at: heise-sec RSS, URL https://www.heise.de/security/feed.xml (item 'SonicWall raet Kunden zum Entsorgen von Gen6-Firewalls') → extract https://www.heise.de/news/SonicWall-raet-Kunden-zum-Entsorgen-von-Gen6-Firewalls-11532307.html → primary: SonicWall product advisory, URL https://www.sonicwall.com/support/notices/product-advisory-retire-unsupported-gen-6-firewalls/kA1VN000002iouP0AQ (extract, full table)"
    summary: |
      SonicWall's product advisory (dated 2026-11-18, relayed by heise on 2026-11-20) says Gen 6 and Gen 6.5 firewalls running SonicOS 6.x, including the NSv virtual firewalls, have reached end of support and will receive no firmware updates or security patches whatever the severity of a newly found flaw, and that internet-facing Gen 6 devices should be treated as a high-risk exposure and replaced with Gen 8 on SonicOS 8. The vendor's end-of-support dates run from 2024-03-08 (NSA 2600) through 2025-01-23 (TZ300 and TZ300W), 2026-02-20 (SuperMassive 9200 to 9800, NSsp 12400 and 12800), 2026-04-16 (SOHO, TZ300P, NSa 9250 to 9650, NSv), 2026-05-01 (NSa 2650), 2026-08-01 (TZ400, TZ600, NSA 3600, NSa 3650) and 2026-10-01 (TZ350, TZ500, SOHO 250, NSA 4600 to 6600, NSa 4650 to 6650). Interim measures SonicWall lists: inventory every Gen 6 device including spares and branch units, switch off WAN-side management over HTTPS, SSH and SNMP and the SSL-VPN or restrict it to known source addresses, enforce MFA on remaining remote and admin accounts, reset local passwords, disable unused services and watch logs for unusual logins, configuration changes and traffic. SonicWall's stated reasoning: supported generations get fixes that then reveal where to look (every fix is a map), and its own SonicOS flaw of early November was fixed only for Gen 7 and Gen 8. This is a vendor end-of-life notice, not a new flaw or an exploitation report.
    region_nexus: "global; small SonicWall appliances are common in SME and communal estates (deployment prevalence in Swiss public administration not sourced)"
