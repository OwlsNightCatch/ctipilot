    sources:
      - { url: "https://www.sonicwall.com/support/notices/product-advisory-retire-unsupported-gen-6-firewalls/kA1VN000002iouP0AQ", publisher: "SonicWall (product advisory)", date: "2026-11-18", role: "primary" }
