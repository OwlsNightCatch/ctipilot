    summary: |
      On 2026-11-19 the BSI presented its annual cybersecurity situation report and rated the situation in Germany 'tense to critical' for the first time since 2023, citing the geopolitical situation and AI. Figures from the BSI press release: 160 newly known vulnerabilities a day (35 percent more than the year before); the average time from disclosure to first known exploitation fell from 53 days in the previous reporting period to 25 days in the current one and to 8 days in the second quarter of 2026; and the BSI says small and medium enterprises and communes remain especially vulnerable targets. According to heise's report of the presentation, the BSI observes mainly Chinese actors going after perimeter systems with zero-days, regards fully automated AI-driven attacks as the main driver of the new rating although not yet widely observed, introduces a 'Cyber Index' (170 points, up 50 percent), and warns that 'store now, decrypt later' is already reality and recommends crypto-agility in all new developments. The report is a German-federal assessment; it changes no obligation for Swiss estates.
