    extended_notes: |
      FACTS (canton's own words): data theft from a permit-G database, about 97,000 records since 2016-11-28, platform isolated, BACS and the data-protection supervisor informed, criminal complaint against unknown persons, forensic work continuing. CLAIMS: the canton's spokesman calls the attack massive and broad and says it was stopped quickly; Basler Zeitung (not the canton) reports no ransom demand and no contact; an outside expert (Raphael Reischuk, NTC, quoted by Basler Zeitung) says much points to Russia because no money was demanded: an inference, evidence-free, attribute never adopt. INFERENCES (mine, flag as such): (1) the canton's statement that it cannot say which individual records were taken and assumes all suggests the platform's logging could not bound what was read: a detection lesson, not stated by the canton; (2) the canton does not say whether the permit database sat on one of the six rebuilt servers, so do not merge the two phases; the common phrase is 'der Cyberangriff'. NOT STATED: initial access, tool, dwell time, extortion, leak-site listing, whether documents were taken (the canton: no indication, cannot be excluded).
      Triage-ready exposure: affected are people for whom a G-permit application was lodged via the BL platform (including completed, rejected and former-employee cases) and employers' HR and case-handler contacts (company address, names, phone, e-mail). The canton's own risk list: targeted phishing referencing a permit procedure or earlier application, social engineering as an authority, employer, bank, misuse of ID copies if any, and fraud attempts on employers via HR contacts (payment and bank-detail change requests). Mail-flow telemetry: messages that cite an application number, ZEMIS number, permit status or an 'authority platform' link; benign lookalike: genuine AMIB/KIGA correspondence about a pending permit, discriminated by sender domain and whether the platform link points at an official bl.ch address (the platform is currently offline, so any login or upload request for it is suspect).
      Defender takeaway for cantonal and communal estates (decision that changes): inventory internet-reachable legacy and superseded applications (the affected set per the canton included a decommissioned tax calculator) and check retention (this database held completed and rejected procedures back to 2016 and the canton names that as why the count is large). Mapping: T1213 (collection from the permit database); initial access left unmapped because no source states it.
