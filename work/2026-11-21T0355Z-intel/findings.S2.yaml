  - title: "CVE-2026-127027, Poste.io before 2.5.22: an unauthenticated e-mail to port 25 gives command execution as root in the container, through DMARC-report attachment handling (CERT Polska)"
    sources:
      - { url: "https://cert.pl/en/posts/2026/11/CVE-2026-127027/", publisher: "CERT Polska", date: "2026-11-20", role: "primary" }
    discovery_trace: "first seen at: cert-pl RSS, URL https://cert.pl/en/rss.xml (fetched via tools/fetch_source.py feed) → primary: CERT Polska advisory, URL https://cert.pl/en/posts/2026/11/CVE-2026-127027/ (extract)"
    summary: |
      CERT Polska published CVE-2026-127027 on 2026-11-20: Analogic Poste.io, a self-hosted mail server, is vulnerable to OS command injection (CWE-78) in DMARC report processing in all versions before 2.5.22. Mail sent to the dmarc-reports@ address is stored without sender verification, and a script that runs as root unpacks the attachments with unsafe shell commands, so command injection works through crafted attachments (for example file names or archive contents). Per CERT Polska a remote unauthenticated attacker who can send an e-mail to the server's port 25 can execute arbitrary commands as root within the Poste.io container. Fixed in 2.5.22; reported by Pawel Franczyk (logrox) through coordinated disclosure. No exploitation report and no CVSS score appear on the advisory page; no second source was found.
    region_nexus: "global; Poste.io is a small-scale self-hosted mail server (use in Swiss public administration not sourced)"
    primary_sector_nexus: "indirect"
    sector: "cross-sector"
    cves: [CVE-2026-127027]
    techniques: [T1190, T1059.004]
