    summary: |
      On 2026-11-20 the canton of Basel-Landschaft said that forensic analysis by external cybersecurity experts had confirmed that the attackers gained access to a database tied to work permits for cross-border commuters (permit G) and took data from it. The canton's FAQ puts the volume at about 97,000 records covering permit applications lodged through the cantonal online platform since 2016-11-28, with name, home address, date of birth, civil status, occupation and function, the ZEMIS identification number and employers' contact data; the FAQ adds nationality, sex, application number, working percentage, start and end of the assignment, name and civil-status changes and previous and new employers, and says that theft of uploaded documents such as contracts or ID copies cannot be excluded although there is no indication of it. The canton says it cannot establish which individual records were taken and therefore assumes all of them were; the platform has been taken off the network and isolated, and applications can still be submitted through forms on the migration office's site. The canton names no entry point, tool or actor, and says that for tactical reasons it gives no information on suspects; its first communique (2026-11-18) reported diverse attacks since Sunday 2026-11-15, individual servers isolated from the internet, and an evening update put the impact at about 20 applications on six servers that were being reinstalled, among them a superseded tax calculator, while the cantonal rescue and security organisations said their IT was never affected. The canton informed the federal cybersecurity office (BACS), the cantonal data-protection supervisory authority, the federal foreign ministry (EDA) and the German and French embassies, and filed a criminal complaint against unknown persons. Basler Zeitung reports that no ransom demand was made and the attackers did not contact the canton, and relays an outside expert's suspicion of Russian actors; that suspicion is the expert's inference with no evidence cited, not a finding of the canton.
