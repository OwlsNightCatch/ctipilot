    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: MEDIUM
    novelty: new
    suggested_classification: { reliability: A, credibility: 2 }
    evidence:
      - quote: "A remote unauthenticated attacker who can send an email to the server's port 25 can execute arbitrary commands as root within the Poste.io container."
        attribution: "CERT Polska"
        source_url: "https://cert.pl/en/posts/2026/11/CVE-2026-127027/"
      - quote: "This issue was fixed in version 2.5.22."
        attribution: "CERT Polska"
        source_url: "https://cert.pl/en/posts/2026/11/CVE-2026-127027/"
    extended_notes: |
      Exposure: any Poste.io instance reachable on SMTP port 25 below 2.5.22 (version readable in the admin UI or container image tag; not sourced beyond 'all versions before 2.5.22'). Behaviour for hunting: a process spawned by the DMARC-report unpack script on the mail host (archive tools or a shell with child processes) after inbound mail to the DMARC-reports address; benign lookalike: legitimate DMARC aggregate reports (zip or gzip attachments from large mailbox providers) trigger the same unpack path, so discriminate on child processes other than the archiver and on attachment or file names containing shell metacharacters. Compensating control not stated by CERT Polska. S1 domain; kept here because CERT-PL is an essential record of S2.
    borderline: true
    borderline_reason: "pre-auth root command execution over SMTP from the authority carve-out source, but the product is niche and its presence in Swiss public administration is unknown; S1 may return it"
