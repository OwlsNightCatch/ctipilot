      Exposure check on PAN-OS/Panorama: the HTTP/2 option (documented by PAN) must be enabled for the flaws to apply; the vendor-stated way to tell is the HTTP/2 setting in the PAN-OS configuration, and the version table above.
      Detection concept: worker or management-plane process crashes/restarts (web server core dumps, repeated service restarts) correlated with unusual HTTP/2 stream or window-update volume from one source; Rapid7's PoC (per store) needs very large HTTP/2 traffic volumes, so sustained high-volume HTTP/2 flows to a single listener are the discriminating pattern against ordinary traffic.
