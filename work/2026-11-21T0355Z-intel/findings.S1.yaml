    summary: |
      CISA added CVE-2026-76466 (Cisco Expressway-C and Expressway-E, clustered, unauthenticated root command execution, CVSS 3.1 9.8) to its Known Exploited Vulnerabilities catalog on 2026-11-20 with a 2026-11-23 due date and a forensic-triage flag under BOD 26-04; the CISA alert gives no per-CVE exploitation detail, the CVE record carries a CISA SSVC "Exploitation: active", and ENISA EUVD lists exploitedSince 2026-11-20. The first-hand observation behind it, or at least a public one, is F6's (Russian vendor, press release of 2026-11-18): its cybersecurity centre investigated what it calls the first case of exploitation, at a Russian organisation. F6 states that attackers used a public proof of concept shortly after it appeared, compromised two internet-reachable Expressway X15.5.3 devices, and through one reached two further cluster nodes on the internal network; with root they ran home-written Python scripts for network scanning, SMB share discovery, SQL Server and WinRM interaction and review of GitLab repositories to take credentials, and F6 assesses from comments in the code that an AI assistant helped adapt the scripts during the intrusion. F6's hunt pointer is an unexpected Erlang node-up record in the Expressway Erlang system log, and its stop-gap when patching is not possible is to limit TCP 4371-4372 to the trusted cluster peers. Cisco's advisory is unchanged at version 1.0 (2026-10-21) and still says its PSIRT is not aware of malicious use; fixed release X15.5.20, X14 and earlier must migrate, no workaround. What is not known: who the actor is, whether CISA's evidence is the F6 case or another, and whether Expressway-C or only Expressway-E was the entry point (F6 says internet-reachable devices). A French consultancy blog dated 2026-11-13 names a PoC author and says it was tested on X15.3.2 in a two-node cluster with permissive TLS; that is a lead only (low reliability, contradicts Cisco on the root cause), not carried. F6's indicator values (two IP addresses, a node name, file-path pattern) are indicators and must not be carried into the entry.
    region_nexus: "global; Expressway is a widely deployed video-conferencing and firewall-traversal gateway (Cisco collaboration estates in cantonal and federal administrations are plausible but no Swiss deployment is evidenced in the sources); the F6 victim is Russian"
    primary_sector_nexus: "indirect; exposed Expressway-E in a cluster is the case to check first"
