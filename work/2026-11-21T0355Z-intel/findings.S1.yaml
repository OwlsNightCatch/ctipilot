  - title: "WordPress 7.1.5 security release (2026-11-18): twenty fixes including an unauthenticated Template Part block-attribute privilege escalation that can lead to remote code execution through an editor's session, an unauthenticated SQL injection in WP_Meta_Query, multisite Super Admin takeover and an unauthenticated XML-RPC pingback denial of service"
