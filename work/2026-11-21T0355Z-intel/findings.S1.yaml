        attribution: "WordPress.org"
        source_url: "https://wordpress.org/news/2026/11/wordpress-7-1-5-release/"
      - quote: "Unauthenticated privilege escalation via Template Part block attributes that could lead to remote code execution"
        attribution: "WordPress.org"
        source_url: "https://wordpress.org/news/2026/11/wordpress-7-1-5-release/"
      - quote: "It counts as unauthenticated because the attacker only has to get the block markup in front of someone who can open it."
        attribution: "Patchstack"
        source_url: "https://patchstack.com/articles/wordpress-7-1-5-security-release/"
      - quote: "As a courtesy, the security fixes were backported to all branches eligible to receive security fixes (currently through 4.7)."
        attribution: "WordPress.org"
        source_url: "https://wordpress.org/news/2026/11/wordpress-7-1-5-release/"
    extended_notes: |
      Lookback item (wordpress-org-news lookback 168 h): published inside the record's lookback and not yet in the store. Suggest priority notable at most: no exploitation, the headline RCE needs a privileged user to open attacker-controlled content, and the release post says sites that support automatic background updates will start the update on their own. Short entry advised.
      Exposure: the WordPress version shown in the dashboard Updates screen (7.1.4 and earlier on the 7.1 branch; backport branches per the release post); whether automatic background updates are enabled; multisite installations for the Super Admin flaw.
      Detection concept: web access logs for comment submissions containing hex or octal escape sequences in shortcode attributes and for batched xmlrpc.php pingback requests; for the editor-session path, REST requests with dot-segment or encoded-slash entity keys issued from an admin session, and unexpected plugin installation events after an editor opens untrusted content.
      Defender takeaway: confirm 7.1.5 (or the backported build) installed; on multisite review Super Admin accounts created after the preview-path exposure.
