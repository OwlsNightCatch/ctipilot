candidate_sources:
  - id: danfoss-security-advisories
    publisher: "Danfoss coordinated vulnerability disclosure (security advisories)"
    url: "https://www.danfoss.com/en/service-and-support/coordinated-vulnerability-disclosure/danfoss-security-advisories/"
    category: vulns
    why: "First-party advisories (DSA-2026-12-01 and -02, 2026-11-20) with CVE ids for the AK-SM and AK-SC refrigeration controllers behind the Swiss-nexus October campaign; the store entry notes the advisories page named none of the flaws on 2026-11-14, so a per-run check is the only way a vendor fix or CVE reaches the entry. The detail pages read cleanly with extract; the listing page was not fetched in this run (add the listing as the record URL after a probe)."
  - id: f6-press-releases
    publisher: "F6 (Russian cyber-security vendor, press releases and blog)"
    url: "https://www.f6.ru/media-center/press-releases/"
    category: vendor-research
    why: "First-hand incident-response reporting in Russian that led by days: the first observed exploitation of Cisco Expressway CVE-2026-76466 (press release of 2026-11-18, extract reads it; CNews relayed it in Russian). Reliability B for its own casework (vendor telemetry, not independently verified); the listing page was not fetched, only the detail page."
  - id: apache-tomcat-security
    publisher: "Apache Tomcat security pages (security-9, -10, -11)"
    url: "https://tomcat.apache.org/security-11.html"
    category: vulns
    why: "Tomcat is the application server under most Java public-sector web applications (and under Apache Roller); the page lists fixes with report and public dates and reads with extract; the 2026-11-19 critical (CVE-2026-133325, cluster TLS-PSK on TLS 1.3, fix pending in 11.0.30) is an example of an item no slice record covers."
coverage_gaps:
  - source_id: f5-k-articles
    reason: "Rotation-priority gap: no such record exists in sources/sources.json. my.f5.com is a Salesforce SPA: `extract https://my.f5.com/manage/s/article/K000164058` returns the HTML shell and WebFetch returns a myF5 loading placeholder (two articles tried). Working recipe found: F5 publishes its CVE records as a CNA, so `python3 tools/fetch_source.py url --direct https://cveawg.mitre.org/api/cve/<CVE-ID>` returns the affected branches, descriptions, references (K-article ids) and the CISA-ADP SSVC block; The Hacker News and NCSC-NL (`ncsc-nl csaf <id>` lists every F5 K-article id) fill the hotfix and fixed-version detail. Fixed-build names for the six critical BIG-IP flaws remain unread."
  - source_id: perforce-portal
    reason: "Rotation-priority gap: no such record exists in sources/sources.json. The Puppet Enterprise advisory (CVE-2026-115731 and -115732) was not re-read at Perforce's portal in this run; the store entry already carries the KEV listing (2026-11-17) and the NCSC.ch advisory of 2026-11-19 exists; WebSearch surfaced no in-window revision and no source named a new fixed build."
  - source_id: belden-psirt
    reason: "HTML listing 403 on every transport (known); the reader pool is dead (all keys answer HTTP 402). WebSearch surfaced only PSIRT-4 to -7 PDFs (newest 2026-09-09 / 2026-09-04 per the header and revision log) and nothing in the 168 h lookback; no recipe change."
  - source_id: techora.ru
    reason: "Not a slice record: techora.ru serves a JS/video 'checking your browser' interstitial to extract and WebFetch, so the Russian re-report of the F6 case was unreadable; F6's own press release (extract) and CNews carry the same content. Recipe note: `url --direct https://zoom.cnews.ru/...` returns cp1251 text that the bridge decodes as latin-1, so the stdout is double-encoded mojibake; recover it with s.encode('latin-1').decode('cp1251') (the `extract` output of the same page is mojibake as well)."
  - source_id: securitylab.ru
    reason: "HTTP 403 ('Access to www.securitylab.ru is forbidden') on extract; not a slice record; no recipe."
  - source_id: jina-reader
    reason: "All ten jina reader keys answered HTTP 402 during this run (extract fell through them and still returned content from trafilatura-direct for most hosts); two hosts (lists.apache.org announce thread, n-able.com blog) were served by the reader after rotation."
  - source_id: cisa-advisories
    reason: "Working recipe confirmed today: WebFetch of https://www.cisa.gov/news-events/cybersecurity-advisories returns a clean 10-item listing with titles, dates and hrefs, and WebFetch of the per-alert URL reads the alert text; `cisa csaf-recent` returned the newest ICS advisories (icsa-26-323-01 to -03, released 2026-11-19, outside the window), so no ICS advisory fell inside the window. The cisa.gov all.xml feed was not retried (known 403)."
