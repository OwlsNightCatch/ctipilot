    extended_notes: |
      Store delta for the existing entry (fields: cves[].status to exploited, summary/headline/title, sources, evidence, actions, body; priority candidate raise notable to high: confirmed exploitation + public PoC + root RCE on an edge-class collaboration gateway + 3-day KEV due date).
      The existing entry says "Cisco knows of no malicious use" for the Expressway flaw; it is now contradicted by CISA KEV and F6, while Cisco's own advisory has not been revised (conflict held openly, not averaged).
      Detection concept (telemetry class first): Expressway OS/application logs (the Erlang system log named by F6) for node-up or node-connect events from hosts that are not cluster peers; network flow/firewall logs for connections to TCP 4371-4372 (and Erlang port mapper) from non-peer addresses; post-compromise: egress scanning, SMB, MSSQL and WinRM traffic originating from Expressway management/DMZ addresses, and unexpected Python processes on the appliance.
      Triage: legitimate cluster peers also connect to these ports, so discriminate on source address (peer list) and on whether the appliance subsequently initiates internal scans or SMB/WinRM sessions it never did before.
      Hardening: upgrade to X15.5.20 (clustered units first), restrict the cluster database ports to peer addresses, keep Expressway-E cluster peers off routable segments. Post-patch compromise check: patching does not evict an attacker who already holds root; review erlang.log history and outbound connections from before the upgrade.
      Suggested rating: reliability A (CISA, first-hand vendor-independent report from F6 as B), credibility 1-2 (exploitation corroborated by two independent parties, details single-sourced to F6).
