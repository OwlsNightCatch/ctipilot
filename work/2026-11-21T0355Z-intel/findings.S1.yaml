    summary: |
      WordPress 7.1.5 (2026-11-18, a short-cycle security release; the next major release 7.2 is planned for 2026-12-08) lists fixes for multiple issues; Patchstack counts twenty fixes, eighteen of them exploitable vulnerabilities and two hardening changes, and the release follows 7.1.4, which three weeks earlier fixed an unauthenticated core-update race (CVE-2026-119977). The ones that start without credentials are: privilege escalation via Template Part block attributes that WordPress says can lead to remote code execution (Patchstack's code reading is REST path injection through an unchecked entity key in the block editor, reaching the administrator's own plugin-installation endpoints with the administrator's credentials when an editor or administrator opens the crafted block markup, so it needs one privileged user interaction), an SQL injection in WP_Meta_Query via nested relation values (reachable only where a plugin or theme passes request data into meta_query), stored XSS via shortcode attributes in comments (needs a page with a Latest Comments block), unauthenticated denial of service via batched XML-RPC pingbacks, and unauthenticated disclosure of private taxonomy terms through the REST search endpoint; further fixes include a multisite privilege escalation from site Administrator to Super Admin through Customizer menu previews, an SQL injection through the front-page setting in Customizer changeset previews (administrator), and many XSS and disclosure flaws at Contributor, Author, Editor and Subscriber level. Security fixes were backported to all branches eligible for them, currently through 4.7, with backports shipping as they become ready. No CVE identifiers were found in the release post or Patchstack's article, no exploitation is reported, and the backport branch build numbers were not captured (the release post says the backports are in progress and ship as they become ready), so no per-branch fixed list is carried.
    region_nexus: "global; WordPress core runs a large share of communal and cantonal websites (assessment, no Swiss-specific source)"
    primary_sector_nexus: "direct for sites that run WordPress core, indirect otherwise"
    sector: "public-sector"
