    summary: |
      Apache's announcement of 2026-11-17 assigns CVE-2026-129448 (CVSS 3.1 9.8, CWE-502) to Apache Roller 4.0.0 through 6.1.4 and says it is the same vulnerability as CVE-2026-82384, which Apache disclosed on 2026-09-25 for 6.1.5 only, adding "This issue is being actively exploited". The XML-RPC endpoint (/roller-services/xmlrpc in the Roller web application) accepts the XML-RPC library's vendor extension types, including serialized Java objects, and deserializes them while parsing the request, before authentication; the September post adds that the servlet is mapped unconditionally, so parsing happens even when the XML-RPC feature is switched off and no non-default configuration is needed. Apache's fix is Roller 6.1.6 or later (the project's downloads page now offers 6.1.7 as the best available build); without upgrading, set enabledForExtensions to false in WEB-INF/web.xml or remove the XML-RPC servlet mapping and restart, because disabling XML-RPC in the administration UI does not help older versions. CISA added CVE-2026-129448 to KEV on 2026-11-20 with a 2026-11-23 due date and the forensic-triage flag, and the CVE record carries CISA's SSVC "Exploitation: active, Automatable: yes, Technical Impact: total". Apache has published no detail on the attacks, the actor or the number of compromised servers (BleepingComputer); Corgea, a secondary source, states a Python PoC has been public since 2026-09-28 and that a separate client-side deserialization flaw, CVE-2026-123374, is fixed in 6.1.7, neither of which was confirmed against a primary here. EPSS (FIRST, 2026-11-20) is 0.0119 (69th percentile). Roller runs as a WAR, typically in Tomcat, and is not a Maven library, so dependency scanners reading lockfiles will not see it.
