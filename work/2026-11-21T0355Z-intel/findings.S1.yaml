ortiAnalyzer, FortiADC, FortiAuthenticator, FortiSIEM, FortiSandbox and FortiWeb, and confirms FortiOS, FortiProxy, FortiMail, FortiNAC and FortiPAM not impacted. AWS (bulletin 2026-192-AWS, 2026-11-19, a lookback item) adds that because the HTTP/2 issues act before a complete HTTP request is formed, AWS WAF managed and custom rules cannot effectively detect or block them, that patched nginx packages exist for Amazon Linux 2, 2023 and 2027, and that Elastic Beanstalk environments are affected only where the customer enabled HTTP/2 on their own nginx listener, with disabling HTTP/2 as the interim mitigation for the two Critical HTTP/2 flaws. No vendor reports exploitation; EPSS (FIRST, 2026-11-20) is 0.0609 for CVE-2026-123633 and 0.0603 for CVE-2026-123007 (about the 94th percentile).
