  # ------------------------------------------------------------------ 1. Cisco Expressway: first in-the-wild report (update)
  - title: "Cisco Expressway CVE-2026-76466: F6 reports the first in-the-wild exploitation, two internet-facing Expressway nodes rooted and two internal cluster nodes reached, then AI-assisted Python tooling for SMB, SQL Server, WinRM and GitLab credential theft; Cisco's own advisory still says no known malicious use, and CISA listed the flaw on 2026-11-20"
    sources:
      - { url: "https://thehackernews.com/2026/11/hackers-exploit-critical-cisco.html", publisher: "The Hacker News (relaying F6, 2026-11-19)", date: "2026-11-20", role: "primary" }
      - { url: "https://securityaffairs.com/203598/hacking/hackers-exploit-cisco-expressway-flaw-cve-2026-76466-to-breach-russian-organization.html", publisher: "Security Affairs (quotes the F6 report)", date: "2026-11-20", role: "corroborating" }
      - { url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-vcs-static-cred-hr7EWZ8t", publisher: "Cisco PSIRT", date: "2026-10-21", role: "vendor-reference" }
    discovery_trace: "first seen at: hackernews feed https://feeds.feedburner.com/TheHackersNews (68-feed research/news sweep, item 2026-11-20T10:32Z) -> pivot: THN article https://thehackernews.com/2026/11/hackers-exploit-critical-cisco.html -> pivot: Security Affairs https://securityaffairs.com/203598/hacking/hackers-exploit-cisco-expressway-flaw-cve-2026-76466-to-breach-russian-organization.html (quotes the F6 text) -> primary F6 press release https://f6.security/media-center/press-releases/cisco-vulnerability-exploitation/ (UNREACHABLE: direct 403 on extract, 403 on WebFetch, jina pool exhausted; claims below are carried through the two outlets' verbatim quotes of F6) -> vendor: Cisco PSIRT https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-vcs-static-cred-hr7EWZ8t (fetched this run: still revision 1.0 of 2026-OCT-21) -> exploitation status cross-check: python3 tools/fetch_source.py cisa-kev (catalogue 2026.11.20) shows CVE-2026-76466 dateAdded 2026-11-20, dueDate 2026-11-23, forensicTriage Yes"
    summary: |
      F6, a Russian security company, reports what it calls the first case of in-the-wild exploitation of CVE-2026-76466 (CVSS 9.8; unauthenticated root command execution on clustered Cisco Expressway-C and Expressway-E through the database service and its persistent-cookie / unvalidated client-certificate weakness), against Expressway X15.5.3 devices, after a proof-of-concept exploit became public on GitHub. The attackers first rooted two internet-facing Expressway devices and, through one, two further cluster nodes on the victim's internal network. After root they staged custom Python scripts (F6 judges from comments and fix descriptions that AI tools probably helped write them) to scan the network, find reachable SMB shares, interact with SQL Server and WinRM and read GitLab repositories to take credentials and other sensitive data. The attack is not attributed to any known actor, and the victim is a Russian organisation. Cisco's advisory (fetched this run) is still revision 1.0 of 2026-10-21 and says PSIRT is not aware of any public announcements or malicious use, so the vendor has not caught up with the F6 report. CISA added the flaw to KEV on 2026-11-20 with a federal due date of 2026-11-23 and its forensic-triage flag set. Fixes are X15.5.20 for X15.5.3 and earlier; X14 and earlier must migrate; there is no workaround; the flaw bites only on devices configured in a cluster.
    region_nexus: "global; the reported victim is a Russian organisation, exposure is any internet-facing clustered Expressway-E/C; no public-sector victim reported"
    primary_sector_nexus: "indirect"
    sector: "technology"
    cves: [CVE-2026-76466]
    techniques: [T1190, T1059.006, T1046, T1021.006, T1213.003]
    affected_products: ["Cisco Expressway Series"]
    entity_keys: ["product:cisco-expressway-series"]
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: "update-of:2026-10-22/cve-2026-76466-cisco-expressway-cluster-unauth-root-rce"
    classification_hint: { reliability: "B", credibility: "2", why: "F6 (telemetry-holding IR vendor) is the origin, relayed by two outlets that trace to one report; independent corroboration of exploitation status is the CISA KEV listing of 2026-11-20; the F6 page itself could not be fetched" }
    evidence:
      - quote: "it observed what appears to be the first case of in-the-wild exploitation of the flaw to gain remote command execution on compromised Cisco Expressway X15.5.3 devices with root privileges"
        attribution: "The Hacker News (reporting F6)"
        source_url: "https://thehackernews.com/2026/11/hackers-exploit-critical-cisco.html"
      - quote: "The attackers initially compromised two Cisco Expressway internet-facing devices."
        attribution: "Security Affairs (quoting F6)"
        source_url: "https://securityaffairs.com/203598/hacking/hackers-exploit-cisco-expressway-flaw-cve-2026-76466-to-breach-russian-organization.html"
      - quote: "The attack has not been attributed to any known threat actor or group."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/11/hackers-exploit-critical-cisco.html"
      - quote: "The Cisco PSIRT is not aware of any public announcements or malicious use of the vulnerability that is described in this advisory."
        attribution: "Cisco PSIRT"
        source_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-vcs-static-cred-hr7EWZ8t"
    extended_notes: |
      Delta against the existing entry (updated_at null, says "not known to be actively exploited"): exploitation status flips to exploited in the wild (F6 report of 2026-11-19, THN 2026-11-20) and on CISA KEV (2026-11-20, due 2026-11-23). S1's kev_window_diff lists this CVE as COVERED-STALE, so the main agent should write ONE update record that carries both the KEV listing and the F6 post-exploitation detail.
      Exposure: Expressway-C and Expressway-E, virtual and appliance, configured in a cluster and running X15.5.3 or earlier (vendor); a reachable database service between nodes is the attack path.
      Detection (all from F6 as relayed by the two outlets): a nodeup entry in the Erlang system log (erlang.log) for a specific Erlang node identity marks a connection from a node matching the exploitation mechanism (F6 publishes the identity; not repeated here); Python scripts staged on the device disk; outbound scanning from the Expressway toward internal SMB, SQL Server, WinRM and GitLab. Behavioural hunt: an appliance that has no business initiating SMB/WinRM/SQL sessions doing so; cluster-node database-service connections from outside the cluster. Post-patch: patching does not evict an attacker who already holds root and has pivoted, so review the cluster nodes and every credential reachable from them.
      Triage: nothing benign in the F6 text resembles the exploitation sequence; cluster-internal Erlang node traffic is normal between peers, so the discriminator is a node name or source that is not a cluster peer.
      Hardening: upgrade to X15.5.20 (or migrate off X14 and earlier), segment the Expressway-E/C pair from internal admin and file-share networks.
      No IOCs carried: F6 published two IP addresses, which are deliberately not repeated here.

  # ------------------------------------------------------------------ 2. SOCRadar PHP2Shell AI-agent operator
  - title: "PHP2Shell exploited at scale by a human-directed, AI-augmented operator: SOCRadar reads the open directories of its C2 and AI-agent lab (about 595 targets in 57 countries, 393-404 hosts compromised) and the cloud-key, secret and database collection pipeline behind it"
    sources:
      - { url: "https://socradar.io/blog/php2shell-ai-agents-credential-harvesting/", publisher: "SOCRadar Threat Research Unit", date: "2026-11-18", role: "primary" }
    discovery_trace: "first seen at: socradar, URL https://socradar.io/blog/ (extract of the listing, featured card; the listing's own date metadata is stale 2026-09-10) -> primary: SOCRadar STRU article https://socradar.io/blog/php2shell-ai-agents-credential-harvesting/ (per-article extract date 2026-11-18). Independent corroboration attempted: WebSearch (\"PHP2Shell exploitation campaign AI agent operator open directory C2 credential harvesting DeepSeek omp maq\") returned only SOCRadar's own pages for this operator; related but separate store coverage of PHP2Shell abuse exists (Dream/Fragnesia campaign key in registry)"
    summary: |
      SOCRadar found two open directories (the operator's C2/loot server and, on 2026-11-08, the operator's AI-agent lab, an 18 GB working tree) that document how public PHP2Shell (CVE-2026-109618 / CVE-2026-109619) proofs of concept released on 2026-10-21 became an automated exploitation, persistence and credential-theft pipeline within days. The operator adapted the exploit to default-configuration PHP on Apache (it works under mod_php and FrankenPHP and fails under FPM) and to individual PHP builds, sourced targets from a Shodan pool of about 68,000 PHP/Apache hosts, filtered out CDN/WAF fronts and queued targets as numbered jobs; a self-built queue dispatched 39 parallel agent workers against two self-hosted DeepSeek endpoints, with the C2 database synchronised to the lab every 15 seconds. SOCRadar's own caveat: the snapshot cannot show whether the actions came from autonomous agents or manual execution, "the true degree of automation remains unconfirmed", and no chain completed without manual oversight; an agent goal file instructing the agent to pursue a USDT payout autonomously did not produce theft. Post-exploitation per shell: reverse shell to a per-job high port, SSH key append, per-minute cron beacon, token-protected PHP webshells with random names in the document root, application-level backdoors (Nextcloud app, Laravel route cache), a localhost-only Dropbear reached through an auto_prepend_file directive, then a standard collector and secret scanners (gitleaks, trufflehog) over web roots and git history, theft of ECS/IMDS role credentials and enumeration of STS, S3, Secrets Manager, SSM and RDS, and exfiltration as tar archives by HTTP POST to the C2. SOCRadar counts about 595 unique targeted IPs in 57 countries, about 393 compromised hosts, 217 interactive shells but only 12 with root, most as www-data inside containers (68% of jobs in Docker or Podman, Amazon EC2 the most common host), with custom PHP applications (200 jobs) and Nextcloud (163) the main victim classes. SOCRadar assesses with moderate confidence a financially motivated initial-access-broker pattern and with low confidence on identity (no named actor match). Fixed PHP builds are 8.2.35, 8.3.36, 8.4.27 and 8.5.12 (the store already carries the upstream release).
    region_nexus: "global; victims in 57 countries, none named; Switzerland not mentioned"
    primary_sector_nexus: "indirect"
    sector: "cross-sector"
    cves: [CVE-2026-109618, CVE-2026-109619]
    techniques: [T1190, T1595.002, T1059.004, T1505.003, T1098.004, T1053.003, T1572, T1571, T1552.001, T1552.005, T1560.001, T1074.001]
    affected_products: ["PHP", "Nextcloud Server", "Apache HTTP Server"]
    entity_keys: ["tool:php2shell", "product:php"]
    new_entities:
      - { key: "campaign:php2shell-ai-agent-credential-harvesting-2026-10", type: campaign, name: "PHP2Shell AI-agent credential-harvesting operation (SOCRadar, October to November 2026)", aliases: [], summary: "SOCRadar STRU's reconstruction of one operator's PHP2Shell exploitation pipeline from two open directories: forked public PoCs, a per-target job C2 with persistence and a standard collector, and a queue of AI-agent workers on self-hosted DeepSeek models; human-directed and AI-augmented, assessed as an initial-access-broker pattern (SOCRadar, 2026-11-18)." }
    relation_suggestions:
      - { subject: "campaign:php2shell-ai-agent-credential-harvesting-2026-10", object: "tool:php2shell", basis: "SOCRadar: the operator forked public PHP2Shell PoCs into its own default-configuration exploit and per-build profiles (SOCRadar, 2026-11-18)" }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    lookback: true
    classification_hint: { reliability: "C", credibility: "2", why: "single first-party analysis of exposed operator infrastructure; SOCRadar is a vendor (record reliability C) and itself hedges the automation claim; no independent report of this operator found; consistent with other PHP2Shell abuse and agentic-attacker reporting in the store" }
    evidence:
      - quote: "Within days of the public proofs of concept released on October 21, 2026, the operator adapted the exploit to default-configuration PHP/Apache and to individual PHP builds."
        attribution: "SOCRadar Threat Research Unit"
        source_url: "https://socradar.io/blog/php2shell-ai-agents-credential-harvesting/"
      - quote: "Because this snapshot cannot clarify if the actions stemmed from autonomous agents or manual operator execution within unarchived tmux/maq sessions, the true degree of automation remains unconfirmed."
        attribution: "SOCRadar Threat Research Unit"
        source_url: "https://socradar.io/blog/php2shell-ai-agents-credential-harvesting/"
      - quote: "Web-server children spawning sh, curl or bash -i"
        attribution: "SOCRadar Threat Research Unit"
        source_url: "https://socradar.io/blog/php2shell-ai-agents-credential-harvesting/"
    extended_notes: |
      Related store entry that MUST be declared in references[] (CVE overlap): 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619; the PHP2Shell vendor-fix entries are separate. This item is the operator/campaign layer, not a vendor patch.
      Exposure (SOCRadar): PHP 8.2 to 8.5 before the 2026-10-21 fixed builds running as mod_php or FrankenPHP on Apache prefork with default memory_limit and post_max_size; FPM deployments were not exploited by this toolkit (worker exit on start-up out-of-memory). The exploit trigger is a multipart POST near post_max_size with more than 1,000 fields and one part holding a very large number of tiny header lines, followed by a second request on the same keep-alive connection; Nextcloud endpoints (status, cron, public) were used as entry points.
      Detection (telemetry classes): web/access logs for oversized multipart POSTs with HTTP 500 and an X-Powered-By header, followed by a second POST on the same connection; process-creation telemetry for web-server children spawning sh, curl or an interactive bash with a network redirect; outbound connections from a web server host to arbitrary high ports; file-integrity monitoring on authorized_keys of the web service account and on web roots for new randomly named PHP files; PHP configuration scans for an unexpected auto_prepend_file; a loopback-only SSH daemon; cloud audit logs showing web-application roles or keys calling STS, S3, Secrets Manager, SSM or RDS enumeration from non-VPC addresses, and metadata-endpoint requests from web processes; execution of secret scanners (gitleaks, trufflehog, linPEAS) on a web host.
      Triage: gitleaks/trufflehog and cron jobs are also used by legitimate DevOps; the discriminator is the parent (web server user, no TTY, spawned by the PHP worker) and a collector writing fixed-layout archives under a temp directory followed by an HTTP POST to a non-corporate host.
      Post-patch compromise check: the toolkit installs SSH keys, cron beacons, webshells and application backdoors that survive a PHP upgrade, and harvests cloud keys and database credentials, so rotate every secret reachable from an exposed PHP host first exposed after 2026-10-21 and reimage where feasible (SOCRadar's advice).
      Hardening: IMDSv2 with restricted task roles, WAF limits on multipart field and header counts, disable display_errors in production. Do not carry the C2 and lab IP addresses (omitted deliberately; they appear in the source).

  # ------------------------------------------------------------------ 3. Unit 42 Com vishing
  - title: "Unit 42 on Com-affiliated vishing extortion: seven named actors and clusters, new CL-CRI-1264 (Vortex) and CL-CRI-1274 (Cinder) since September 2026, healthcare now the most-targeted sector, and a sideloaded 'Google Chrome' extension giving DevTools remote control"
    sources:
      - { url: "https://unit42.paloaltonetworks.com/com-affiliate-vishing-attacks/", publisher: "Palo Alto Networks Unit 42", date: "2026-11-20", role: "primary" }
      - { url: "https://deoxy.net/blog/inside-unc6671s-browser-implant/", publisher: "Kevin Pham (deoxy)", date: "2026-09-10", role: "corroborating" }
    discovery_trace: "first seen at: unit42 feed https://unit42.paloaltonetworks.com/feed/ (standing lab check; item 2026-11-20T22:00Z) -> primary: Unit 42 https://unit42.paloaltonetworks.com/com-affiliate-vishing-attacks/ -> pivot (its References list): deoxy https://deoxy.net/blog/inside-unc6671s-browser-implant/ for the browser implant. The store already carries 2026-05-16/gtig-unc6671-blackfile-vishing-aitm-rogue-mfa-programmatic-s, 2026-07-10/helix-data-extortion-devicecode-vishing-sharepoint-exfil and 2026-08-07/unc6671-blackfile-multi-brand-passkey-vishing-aitm"
    summary: |
      Unit 42 describes persistent Com-affiliated vishing, cloud data-theft and extortion waves since August 2026 and splits them into Bling Libra (ShinyHunters) and clusters CL-CRI-1116 (Redact, formerly BlackFile), -1147 (Pink), -1182 (Falcon), -1192 (Helix, which Google tracks as UNC6671) and two it newly uncovered in September 2026, CL-CRI-1264 (Vortex) and CL-CRI-1274 (Cinder), both overlapping activity Google tracks as UNC6671. The chain is a caller posing as internal IT sending the employee to an organisation-specific subdomain of a short-lived SSO, passkey or IT-support lookalike domain that runs an adversary-in-the-middle proxy relaying credentials and MFA approvals in real time; Vortex then enrols its own MFA device within minutes and automates python-httpx collection of Microsoft 365 mail, OneDrive and SharePoint, while Cinder replays a persistent keep-me-signed-in token from proxy infrastructure to avoid a second Duo prompt and collects through python-requests and the Microsoft Graph SDK; both then message employees in Teams or internal email pointing to a Tor negotiation site. In a Helix case Unit 42 found a Chrome extension named after the browser, sideloaded in Developer Mode from an attacker server (not the Web Store), that keylogs, harvests Microsoft and Google cookies and local storage, scans pages for QR codes, streams the webcam and gives operators Chrome DevTools Protocol control through chrome.debugger; deoxy had analysed the implant in September and Unit 42 credits that write-up. Unit 42 lists persistence by unauthorised MFA devices and workstation objects, unapproved third-party OAuth apps and secondary accounts, mailbox-rule and calendar changes, clearing of security alerts, and exfiltration with rclone, SaaS APIs and SaaS-to-SaaS transfers. Victims are mainly financial, healthcare and legal organisations in the US, UK and Australia; healthcare overtook financial services in September and Australia rose from under 1% to about 13% of observed subdomains in October. The cluster split is Unit 42's taxonomy, while GTIG groups several of these brands under one operator, so the attributions compete rather than agree.
    region_nexus: "global; targeted organisations primarily in the US, UK and Australia, no Swiss or EU public-sector victim stated; the playbook (help-desk impersonation, passkey/MFA re-enrolment, SharePoint exfiltration) transfers to any Entra or Okta tenant with centralised SSO"
    primary_sector_nexus: "indirect"
    sector: "healthcare, finance, legal"
    cves: []
    techniques: [T1566.004, T1557, T1539, T1550.004, T1098.005, T1078.004, T1213, T1567, T1176.001, T1056.001, T1185, T1564.008, T1583.001]
    affected_products: ["Microsoft 365", "Okta", "Cisco Duo", "Google Chrome"]
    entity_keys: ["actor:shinyhunters", "actor:unc6671", "actor:helix-extortion"]
    new_entities:
      - { key: "actor:cl-cri-1264", type: actor, name: "CL-CRI-1264 (Vortex)", aliases: ["Vortex"], summary: "Unit 42 activity cluster first seen September 2026: vishing into organisation-specific adversary-in-the-middle subdomains, rapid enrolment of an unauthorised MFA device, python-httpx collection of Microsoft 365 mail, OneDrive and SharePoint, Teams extortion messages; mostly healthcare, pharmaceutical and medical targets; overlaps activity Google tracks as UNC6671 (Unit 42, 2026-11-20)." }
      - { key: "actor:cl-cri-1274", type: actor, name: "CL-CRI-1274 (Cinder)", aliases: ["Cinder"], summary: "Unit 42 activity cluster first seen September 2026: vishing for access, replay of a persistent keep-me-signed-in token to avoid repeated Duo MFA, Graph SDK and python-requests collection from SharePoint and OneDrive, internal extortion by email and Teams; overlaps activity Google tracks as UNC6671 (Unit 42, 2026-11-20)." }
      - { key: "tool:dokos-panel", type: tool, name: "Doko's Panel", aliases: [], summary: "Operator-controlled adversary-in-the-middle phishing kit that Unit 42 says some Com-affiliated actors share; Okta-targeting variants replace the default backend handler with a renamed endpoint, per Push Security as cited by Unit 42 (2026-11-20)." }
    relation_suggestions:
      - { subject: "actor:cl-cri-1264", object: "actor:unc6671", basis: "Unit 42: CL-CRI-1264 (Vortex) overlaps with activity Google tracks as UNC6671 (Unit 42, 2026-11-20)" }
      - { subject: "actor:cl-cri-1274", object: "actor:unc6671", basis: "Unit 42: CL-CRI-1274 (Cinder) overlaps with activity Google tracks as UNC6671 (Unit 42, 2026-11-20)" }
      - { subject: "actor:helix-extortion", object: "actor:unc6671", basis: "Unit 42: CL-CRI-1192, which Google tracks under UNC6671, is the cluster whose case yielded the sideloaded Chrome extension (Unit 42, 2026-11-20)" }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    classification_hint: { reliability: "B", credibility: "2", why: "Unit 42 holds first-hand IR telemetry; the new cluster designations and victimology rest on Unit 42 alone, while the playbook and the browser implant are corroborated by deoxy and by the store's earlier GTIG and ReliaQuest-based entries" }
    evidence:
      - quote: "In September 2026, we identified a new activity cluster that we track as CL-CRI-1264."
        attribution: "Palo Alto Networks Unit 42"
        source_url: "https://unit42.paloaltonetworks.com/com-affiliate-vishing-attacks/"
      - quote: "We have observed attackers behind CL-CRI-1264 enrolling an unauthorized MFA device within minutes of authenticating to establish persistence."
        attribution: "Palo Alto Networks Unit 42"
        source_url: "https://unit42.paloaltonetworks.com/com-affiliate-vishing-attacks/"
      - quote: "required the victim to manually sideload it using Developer Mode"
        attribution: "Palo Alto Networks Unit 42"
        source_url: "https://unit42.paloaltonetworks.com/com-affiliate-vishing-attacks/"
      - quote: "Our monitoring of domains linked to Com-related activity showed that their targeting shifted from financial services to healthcare in early September 2026."
        attribution: "Palo Alto Networks Unit 42"
        source_url: "https://unit42.paloaltonetworks.com/com-affiliate-vishing-attacks/"
    extended_notes: |
      Related store entries (may be declared in references[]; no CVEs involved): 2026-05-16/gtig-unc6671-blackfile-vishing-aitm-rogue-mfa-programmatic-s, 2026-07-10/helix-data-extortion-devicecode-vishing-sharepoint-exfil, 2026-08-07/unc6671-blackfile-multi-brand-passkey-vishing-aitm. This is new on the cluster split, healthcare shift, Vortex/Cinder and the extension, so it is a new entry rather than an update of the August one.
      Exposure: any Microsoft 365 / Entra or Okta tenant with a help desk that can be talked into resetting or enrolling authentication methods, centralised SSO and SharePoint/OneDrive holding bulk data; Unit 42 names healthcare, finance and legal.
      Detection (telemetry classes): identity-provider sign-in and authentication-method audit logs for a new MFA device or passkey registered within minutes of a sign-in from a residential-proxy or commercial-VPN address, the same device name reused across unrelated accounts (Unit 42 stresses standard phone models are not standalone indicators), and a persistent-session token replayed from a second network; cloud audit logs for scripted collection with python-httpx / python-requests / Microsoft Graph SDK (kiota) user agents against mail, OneDrive and SharePoint, bulk download volume and new OAuth app consents or data-sync utilities; Teams and mail logs for extortion text from an internal account; endpoint/browser management for an extension installed through Developer Mode, a debugging-banner extension and chrome.debugger permission; DNS and certificate-transparency monitoring for lookalike SSO, passkey and IT-support domains carrying the organisation name as a subdomain.
      Triage: scripted Graph SDK access and new-device enrolment are also legitimate admin and onboarding activity; the discriminator is an enrolment that follows a call or an AiTM-like sign-in, from a proxy address, with no help-desk ticket, and a bulk read pattern that no service account owns.
      Post-incident check: removing the MFA device is not enough; revoke sessions and refresh tokens, review OAuth consents, mailbox rules and workstation or device objects the attacker registered.
      Hardening (Unit 42): tighten help-desk verification, move to phishing-resistant MFA (FIDO2/passkeys), enforce a browser extension allowlist, build visibility into identity actions and alert on unauthorised data exports. No domains, hashes or addresses carried.

  # ------------------------------------------------------------------ 4. Rapid7 Webworm NtMonitor
  - title: "Webworm's custom SoftEther rebuild 'NtMonitor': Rapid7 finds a stealth-hardened VPN bridge with renamed endpoints, an in-binary resource archive and an encrypted config in the toolkit of the China-aligned APT that targets European governments"
    sources:
      - { url: "https://www.rapid7.com/blog/post/tr-spying-on-governments-no-malware-custom-webworms-toolkit-softether-bridge", publisher: "Rapid7 Intelligence", date: "2026-11-19", role: "primary" }
      - { url: "https://www.welivesecurity.com/en/eset-research/webworm-new-burrowing-techniques/", publisher: "ESET Research", date: "2026-05-20", role: "context" }
    discovery_trace: "first seen at: rapid7-research feed https://www.rapid7.com/rss.xml (parsed in the 68-feed research sweep; item 2026-11-19T15:05Z; the record was last swept 2026-11-08 so this post has not been seen by a prior fire) -> primary: Rapid7 https://www.rapid7.com/blog/post/tr-spying-on-governments-no-malware-custom-webworms-toolkit-softether-bridge -> context pivot (cited by Rapid7): ESET https://www.welivesecurity.com/en/eset-research/webworm-new-burrowing-techniques/. WebSearch (\"Webworm SoftEther NtMonitor custom VPN bridge government Rapid7\") found no second report of the NtMonitor build"
    summary: |
