  # ------------------------------------------------------------------ 5. Arctic Wolf EVTX
  - title: "Cleared Windows event logs are not empty: Arctic Wolf IR shows cleared EVTX files keep earlier records in chunk free space that standard forensic tools neither parse nor flag, recovering a ransomware encryptor's command line from a cleared System log"
    sources:
      - { url: "https://arcticwolf.com/resources/blog/windows-event-log-cleared-think-outside-the-box/", publisher: "Arctic Wolf Incident Response", date: "2026-11-20", role: "primary" }
      - { url: "https://github.com/libyal/libevtx/blob/main/documentation/Windows%20XML%20Event%20Log%20(EVTX).asciidoc", publisher: "libyal libevtx (EVTX format documentation)", date: "2026-11-21", role: "corroborating" }
    discovery_trace: "first seen at: arctic-wolf-labs feed https://arcticwolf.com/resources/blog/feed/ (item 2026-11-20T01:24Z, 32 minutes before the window; record lookback 149 h) -> primary: Arctic Wolf https://arcticwolf.com/resources/blog/windows-event-log-cleared-think-outside-the-box/ -> corroborating mechanism: libevtx format documentation https://github.com/libyal/libevtx/blob/main/documentation/Windows%20XML%20Event%20Log%20(EVTX).asciidoc (the page Arctic Wolf cites for the chunk-header layout)"
    summary: |
      During a ransomware investigation Arctic Wolf found that clearing a Windows event log does not wipe the EVTX file: Windows truncates after the first 64 KB cluster and resets the first and last record numbers, but that first chunk keeps its earlier records in its free space. On a domain controller, the System log held 104 allocated events after the final clear at 16:01, yet a keyword search of the physical image found the encryptor's full command line (including the password argument it needed in order to run) inside the allocated System.EVTX itself, stamped about three hours before the clear, and a netscan execution record plus an attacker hostname survived in another log. A second incident's PowerShell log held 44 records of which only one was allocated, every one the same Get-WinEvent ClearLog one-liner, showing repeated clearing. Arctic Wolf reports that parsing with Event Viewer, EvtxECmd and Magnet AXIOM did not show the pre-clear records and that it identified no forensic tool that flags records left in EVTX slack space; one tool that parses sequentially without the header might surface them but does not label which records predate the clear. Because EVTX uses substitution templates, recovered records lose some repeated fields but keep basic data verbatim. Arctic Wolf built a proof-of-concept carver (whether it is published is not stated) and asks tool vendors to at least alert on EVTX files with possible old data and to mark recovered records as partial. The libevtx documentation independently describes scanning a chunk's free space for event records and notes that free space often holds former versions of existing records.
    region_nexus: "global; forensic technique, no regional nexus"
    primary_sector_nexus: "indirect"
    sector: "cross-sector"
    cves: []
    techniques: [T1685.005, T1036.005]
    affected_products: ["Microsoft Windows"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    lookback: true
    classification_hint: { reliability: "B", credibility: "2", why: "original IR research with a reproducible mechanism; the format documentation corroborates the free-space mechanism but not Arctic Wolf's case findings or its claim about tool coverage" }
    evidence:
      - quote: "clearing a Windows Event Log does not wipe the underlying Windows Event Log (EVTX) file"
        attribution: "Arctic Wolf Incident Response"
        source_url: "https://arcticwolf.com/resources/blog/windows-event-log-cleared-think-outside-the-box/"
      - quote: "When a log is cleared, Windows truncates everything after the first 64 KB cluster and resets the first and last record numbers in the log."
        attribution: "Arctic Wolf Incident Response"
        source_url: "https://arcticwolf.com/resources/blog/windows-event-log-cleared-think-outside-the-box/"
      - quote: "In our testing, we didn’t identify any forensic tool that flags records left in EVTX slack space after a log is cleared."
        attribution: "Arctic Wolf Incident Response"
        source_url: "https://arcticwolf.com/resources/blog/windows-event-log-cleared-think-outside-the-box/"
    extended_notes: |
      Why it matters to the audience: a DFIR technique class for the point where an intrusion ends with log clearing (ransomware encryptors do it by design). Defender actions are forensic rather than preventive: when a log shows "cleared", image the EVTX file and carve its first chunk and free space instead of accepting the empty log; record numbers and timestamps that run backwards between allocated and free records show records that predate the clear.
      Detection note: the log-cleared event records themselves (and a PowerShell ClearLog one-liner left in a PowerShell log) are a high-value alert; Arctic Wolf says clearing often triggers EDR/IDS alerts and is frequently what exposes an attack.
      Caveat: the claim that no mainstream tool flags this is Arctic Wolf's test result at time of writing. No hashes or addresses carried; ATT&CK note: T1070.001 is revoked in the pinned v20 dataset, T1685.005 is the active id.

  # ------------------------------------------------------------------ 6. ZDI Docker Model Runner  (borderline)
  - title: "Docker Desktop Model Runner: ZDI publishes the full container-to-host chain behind CVE-2026-28400 (argument injection into llama-server, host file read/write, code execution through Docker Extensions); fixed in Docker Desktop 4.61.0, but the WSL2 VM-to-host extension pivot is declared out of Docker's threat model"
    sources:
      - { url: "https://www.zerodayinitiative.com/blog/2026/11/17/hostile-inference-exploiting-docker-model-runner-for-container-escapes", publisher: "Zero Day Initiative (Nitesh Surana, Trend Research)", date: "2026-11-17", role: "primary" }
      - { url: "https://github.com/docker/model-runner/security/advisories/GHSA-m456-c56c-hh5c", publisher: "Docker (GitHub security advisory)", date: "2026-02-27", role: "vendor-reference" }
      - { url: "https://www.zerodayinitiative.com/advisories/ZDI-26-150/", publisher: "Zero Day Initiative", date: "2026-03-03", role: "corroborating" }
    discovery_trace: "first seen at: zdi, URL https://www.zerodayinitiative.com/blog/ (WebFetch listing; item displayed 2026-11-18, per-post date 2026-11-17) -> primary: ZDI post https://www.zerodayinitiative.com/blog/2026/11/17/hostile-inference-exploiting-docker-model-runner-for-container-escapes (extract) -> vendor: Docker GHSA https://github.com/docker/model-runner/security/advisories/GHSA-m456-c56c-hh5c -> ZDI advisory https://www.zerodayinitiative.com/advisories/ZDI-26-150/. Companion Trend write-up (2026-03-12) https://www.trendaisecurity.com/en-us/resources-insights/trendai-security-blog/cracking-the-isolation-novel-docker-desktop-vm-escape-techniques-under-wsl2 read for context"
    summary: |
      ZDI's write-up shows how the unauthenticated Docker Model Runner (DMR) API, reachable from any container at its internal DNS name on macOS and Windows Docker Desktop, let a default-privilege container append arbitrary command-line arguments to the host-side llama-server process through the configure endpoint (CVE-2026-28400, GHSA-m456-c56c-hh5c, ZDI-26-150 rated as a denial of service). Three llama-server flags that touch files give host read and write bounded by the sandbox: on macOS a Seatbelt profile limits them to Docker Desktop's data tree (which holds logs, extension assets and the VM data disk, so overwriting the disk destroys all containers, images and volumes); on Windows a Job Object has no filesystem limit, so the whole user profile is reachable, and a UNC path in a flag or an error message leaks the Windows username (the UNC path also exposes a capturable NTLMv2 value). Because llama-server logs model metadata and prompts, an attacker steers the log content and so writes a partly controlled file, and the payoff is overwriting an installed Docker Extension's UI file so that when the user opens the extension, JavaScript runs in the Electron renderer and drives the extension SDK to drop and run a host executable as the Docker Desktop user; prerequisites are an installed extension, a malicious image or compromised container, and the user opening the extension. A second macOS escape (ZDI-26-451) abused a Seatbelt profile that did not deny the LaunchServices Mach service, so a replaced llama-server script could launch unsandboxed apps; Docker fixed it in February 2026. A third, ZDI-26-258, moves from a compromised WSL2 Docker Desktop VM to the Windows host by flipping the marketplace-only extensions setting over the VM's backend socket; Docker replied that it is outside its threat model. Fixes: Model Runner 1.0.16 and Docker Desktop 4.61.0 or later; Docker's advisory says Model Runner is on by default from 4.46.0 and that enabling Enhanced Container Isolation blocks container access to it (not if the API is exposed to localhost over TCP in specific configurations).
    region_nexus: "global; developer workstations running Docker Desktop on macOS or Windows"
    primary_sector_nexus: "indirect"
    sector: "technology"
    cves: [CVE-2026-28400]
    techniques: [T1611, T1485, T1187, T1552.001]
    affected_products: ["Docker Desktop", "Docker Model Runner"]
    entity_keys: []
    new_entities:
      - { key: "product:docker-desktop", type: product, name: "Docker Desktop", aliases: [], summary: "Docker's desktop container platform for macOS, Windows and Linux; ships Docker Model Runner (default on since 4.46.0) and Docker Extensions (ZDI, Docker GHSA-m456-c56c-hh5c, 2026-11-17 and 2026-02-27)." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    lookback: true
    borderline: true
    borderline_reason: "technically solid and vendor-confirmed, but the CVE was fixed in February 2026 (Docker Desktop 4.61.0); the reader value now is the unfixed-by-design WSL2 VM-to-host extension pivot and the Enhanced Container Isolation lever on developer workstations, which is narrow for a public-sector constituency; main agent to decide"
    classification_hint: { reliability: "B", credibility: "1", why: "discoverer's write-up confirmed by the vendor's own GitHub advisory for versions and workaround, and by the ZDI advisory" }
    evidence:
      - quote: "a container created with default privileges can supply arbitrary command-line arguments to the llama-server process that runs on the host."
        attribution: "Zero Day Initiative"
        source_url: "https://www.zerodayinitiative.com/blog/2026/11/17/hostile-inference-exploiting-docker-model-runner-for-container-escapes"
      - quote: "Docker Desktop users should update to 4.61.0 or later, which includes the fixed Model Runner."
        attribution: "Docker (GHSA-m456-c56c-hh5c)"
        source_url: "https://github.com/docker/model-runner/security/advisories/GHSA-m456-c56c-hh5c"
      - quote: "enabling Enhanced Container Isolation (ECI) blocks container access to Model Runner, preventing exploitation"
        attribution: "Docker (GHSA-m456-c56c-hh5c)"
        source_url: "https://github.com/docker/model-runner/security/advisories/GHSA-m456-c56c-hh5c"
      - quote: "Docker responded that the attack scenario falls outside of their threat model since the container-to-VM escape prerequisite is privileged in the first place."
        attribution: "Zero Day Initiative"
        source_url: "https://www.zerodayinitiative.com/blog/2026/11/17/hostile-inference-exploiting-docker-model-runner-for-container-escapes"
    extended_notes: |
      Exposure: Docker Desktop for macOS or Windows from 4.46.0 (Model Runner on by default) to before 4.61.0; check with the Docker Desktop version dialog or docker version. ZDI-26-258 (WSL2 VM to host through the settings API on the VM's backend socket, flipping the marketplace-only extensions flag) has no vendor fix by Docker's own statement; it needs a prior container-to-VM escape or an exposed Docker API.
      Detection (telemetry classes): process-creation telemetry for the Docker Desktop backend's child llama-server started with file-operation flags (a log file pointing outside the model store, a grammar or chat-template file, UNC paths on Windows); file-integrity monitoring on Docker Desktop's data directory and extension asset directories (index.html and host/ directories) and unexpected writes to the VM data disk; Windows SMB egress from the Docker Desktop user session to an unexpected host; new Docker Extensions or extension files changing outside an install.
      Triage: llama-server child processes and model pulls are normal when developers run local models; the discriminator is flags that contain paths outside the model store or UNC paths, spawned after a container call to the model-runner endpoint.
      Hardening: update to 4.61.0 or later, enable Enhanced Container Isolation, restrict extensions to the marketplace allowlist and review installed extensions, do not expose the Docker daemon over TCP on WSL2 hosts (Trend, March 2026). No hashes or addresses carried.

  # ------------------------------------------------------------------ 7. Apiiro Blank Canvas  (borderline)
  - title: "Blank Canvas: Apiiro finds 133 dormant VS Code Marketplace listings from one operator, each shipping a 20-byte no-op file until a silent update armed three as loaders that run whatever a server sends; Microsoft removed 131 extensions on 2026-11-03"
    sources:
      - { url: "https://apiiro.com/blog/blank-canvas", publisher: "Apiiro Research", date: "2026-11-17", role: "primary" }
      - { url: "https://yeethsecurity.com/blog/2026-11-03-Server-Is-The-Extension", publisher: "Yeeth Security", date: "2026-11-03", role: "corroborating" }
    discovery_trace: "first seen at: apiiro-research, URL https://apiiro.com/blog/ (extract of the listing; served via the reader transport) -> primary: Apiiro https://apiiro.com/blog/blank-canvas (extract, Published Time 2026-11-17) -> pivot (its Prior work list): Yeeth Security https://yeethsecurity.com/blog/2026-11-03-Server-Is-The-Extension, which independently analysed one of the three armed loaders on 2026-11-03"
    summary: |
      Apiiro found a fleet of 133 VS Code Marketplace listings created in bulk in two script-driven bursts on 2026-09-23 and 2026-09-24, each shipping the same 20-byte console.log file, a generic description, no icon and an activation setting that runs on every VS Code start, with names pairing a corporate-sounding publisher to a board, canvas or desk product, and with install counters padded far above download counts. Three were later armed by silent update (Trellis Board on 2026-10-12, Studio Plan about four days after Trellis Board's removal on 2026-10-23, and Mesa Panel, still blank on 2026-11-01 and analysed as armed by Yeeth on 2026-11-03): the extension joins a board on an attacker server, polls it every 60 seconds, saves a note and runs it as a script (cscript on Windows, sh elsewhere) with the developer's permissions and every token in the editor's environment; the signature check meant to restrict notes is turned off in one package's shipped settings file and bypassed by a board-ID substring in the other two, and the server chooses the board. Microsoft removed the fleet in four waves (1, 2, 4 and 126 extensions between 2026-10-23 and 2026-11-03, the last day being the most in a single day in its removal log; the previous busiest day had 19), but the armed Trellis Board stayed listed for 11 days after arming despite Microsoft saying it scans updates. A victim account, taken from an anonymous report and not independently confirmed by Apiiro, describes a fake-recruiter lure on Discord pushing a Roblox developer to install an earlier build and join a board, delivering a script chain that created a logon task and injected a .NET remote access tool into explorer.exe; the payload matches earlier Knostic, Pluto Security and Yeeth write-ups of fake task-board extensions since June. Apiiro's analysis was static only; it never ran extension code or contacted an attacker host. Its transferable control advice: treat an extension update like a new install, switch off extension auto-update on managed editors and keep an allowlist.
    region_nexus: "global; targeted at individual developers (Roblox developers via fake recruiters), no regional nexus"
    primary_sector_nexus: "indirect"
    sector: "technology"
    cves: []
    techniques: [T1176.002, T1608.001, T1566.003, T1059.005, T1059.004, T1053.005]
    affected_products: ["Visual Studio Code"]
    entity_keys: ["product:visual-studio-code"]
    new_entities:
      - { key: "campaign:blank-canvas-vscode-extension-fleet-2026-11", type: campaign, name: "Blank Canvas (VS Code Marketplace dormant-extension fleet)", aliases: ["Blank Canvas"], summary: "Apiiro's name for 133 dormant VS Code Marketplace extensions from one operator, blank until a silent update turns them into server-driven script loaders; Microsoft removed 131 extensions on 2026-11-03 (Apiiro, 2026-11-17)." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    lookback: true
    borderline: true
    borderline_reason: "sound primary with an independent corroborating analysis, but the victim class is individual developers lured by fake recruiters and the fleet was removed on 2026-11-03; value for the constituency is the sleeper-extension technique and the extension auto-update lever for managed developer workstations; main agent to decide against the existing Cursor/Claude Code extension entry"
    classification_hint: { reliability: "B", credibility: "2", why: "Apiiro static analysis of Marketplace data and Microsoft's removal log; Yeeth independently analysed one armed loader; the victim narrative rests on an anonymous report" }
    evidence:
      - quote: "On November 3, 2026, Microsoft removed 131 extensions from the Visual Studio Code Marketplace as malware, the most in one day in its public removal log."
        attribution: "Apiiro Research"
        source_url: "https://apiiro.com/blog/blank-canvas"
      - quote: "Microsoft says it scans updates too, yet the armed Trellis Board stayed listed for 11 days."
        attribution: "Apiiro Research"
        source_url: "https://apiiro.com/blog/blank-canvas"
      - quote: "so the blank a developer installed can become the loader without another decision."
        attribution: "Apiiro Research"
        source_url: "https://apiiro.com/blog/blank-canvas"
    extended_notes: |
      Related store entry: 2026-10-31/cursor-marketplace-claude-code-extension-ssh-backdoor (different mechanism: tampered release of a real extension).
      Exposure: developer machines with VS Code (and forks) that auto-update extensions, from the Marketplace, where an extension installed weeks ago can change behaviour overnight.
      Detection (telemetry classes): process-creation telemetry for cscript or sh started by the VS Code extension host; creation of per-extension storage folders holding board and hook files and temp log files; for the Windows payload chain a hidden folder under ProgramData and a logon scheduled task with a driver-service name; egress from the editor process to a newly registered domain every 60 seconds; extension inventory (code --list-extensions or managed-IDE telemetry) for publishers with no history, an activation event of "*", and a trivial entry file.
      Triage: legitimate extensions poll servers and run helper scripts; the discriminator is a script executed from a note fetched from a remote board with unsigned execution, an extension that was empty at install and changed with a minor update, and a publisher created days before a burst of listings.
      Hardening: extensions.autoUpdate off on managed editors, extension allowlist, review new versions before they reach developers; rotate tokens, git credentials and cloud CLI logins on any machine that ran one. No extension IDs, domains or hashes carried.

