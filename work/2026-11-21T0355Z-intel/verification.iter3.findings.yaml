  item: "2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack, updates[] record 2026-11-21T04:39:53Z (summary)"
  url_or_quote: "Danfoss published its first CVE ids for the controllers: CVE-2026-129713 (CVSS 9.3, unauthenticated stack overflow in AK-SM 8xxA firmware 5.4.0 and earlier, fix only in a coming 5.5.x) and CVE-2026-127057 ..."
  summary: "'first CVE ids for the controllers' is unsupported and contradicted by the entry's own Censys-sourced section: Danfoss patched AK-SM 800A flaws CVE-2025-41450, CVE-2025-41451 and CVE-2025-41452 in 2025 (Censys: 'Danfoss patched several vulnerabilities in its AK-SM 800A controllers more than a year earlier'; NCSC.ch hub post 13054 links Danfoss's DSA-2025-08-01). The body section does not say 'first'; only the record summary does. Fix: say Danfoss published CVE ids for two controller flaws, without 'first'."
