    date: '2026-11-20'
    role: corroborating
  discovery_trace: 'first seen at: piyolog, URL https://piyolog.hatenadiary.jp/ (listing via bridge url; entry https://piyolog.hatenadiary.jp/entry/2026/11/21/002438 read with extract) -> primary: Digital Agency press release, URL https://www.digital.go.jp/press/a966ee61-478c-4194-8f13-f97599fae986 -> corroboration: Yomiuri, URL https://www.yomiuri.co.jp/politics/20261120-GYT1T00361/'
  summary: Japan's Digital Agency announced on 2026-11-20 that part of the files held on the file-sharing service it provides inside the Government Solution Service (GSS) may have leaked. It detected on 2026-11-12 that someone other than the regular sharing counterparts may have accessed files, cut the service's external communications and suspended the service the same day; the investigation so far confirms that this access ran from 2026-07-30 to 2026-11-12 (the exact period is still being examined), so first access preceded detection by about three and a half months. The service is used by ministries and agencies to exchange large meeting documents with each other and with outside parties; Piyolog, compiling the national press, reports that about 25 agencies and 150,000 users sit on GSS, that the counterparts include municipalities and companies, that the sharing runs on a private-sector cloud service, and that GSS handles information only up to the second of three confidentiality levels.
    The agency says the files may contain personal information (counts and contents not yet known), has reported to the Personal Information Protection Commission, works with the police and an external firm, and has seen no secondary harm so far. Yomiuri reports the agency believes GSS itself had no security problem this time, which separates it from the September GSS intrusion (a VPN-appliance flaw, about 246,000 records) already in the store. The agency does not say how the non-recipients obtained access (links, accounts or tokens), whether the actor is known, or whether the service vendor or the agency detected it; nothing here names a mechanism.
