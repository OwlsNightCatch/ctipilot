  discovery_trace: 'first seen at: inside-it-ch RSS, URL https://www.inside-it.ch/rss.xml -> article https://www.inside-it.ch/eu-kommission-bestaetigt-cyberangriff-20261119 -> primary: Politico, URL https://www.politico.eu/newsletter/brussels-playbook/cyberattack-hits-the-commission/ -> pivot: heise, URL https://www.heise.de/news/Cyberangriff-auf-EU-Kommission-Verdacht-auf-KI-Tool-Artex-tagelange-Ausfaelle-11531596.html (spokesperson confirmation, discovery dates, CERT-EU blog link) -> CERT-EU blog, URL https://cert.europa.eu/blog/from-penetration-testing-to-cyber-threat-beware-of-artex'
  summary: 'Politico reported on 2026-11-19 that a cyber campaign hit the European Commission: CERT-EU, the EU institutions'' security service, detected that international hackers used ARTEX, a publicly available AI-powered tool built to find vulnerabilities in IT systems, and several applications were taken offline as a precaution. The HR platform Sysper (payslips, leave requests, timesheets) and the medical-reimbursement system MyPMO were disrupted for more than ten days and restored earlier in the week, Sysper crashing again on Wednesday; internal translation services were hit on Tuesday 17 November; salaries were paid as usual. Spokesperson Thomas Regnier said individual systems were targeted and the people concerned informed; heise adds that he confirmed the incident at the Commission''s midday briefing on 19 November as an AI-generated cyber campaign, discovered on 22 October and confirmed on 26 October, and said that as things stand no personal information has flowed out. An anonymous
    EU official told Politico the opposite worry, that staff personal data may have been compromised and that the investigation had not yet settled it; the two statements are held side by side here rather than reconciled. Politico, citing a leaked internal mail, says the Corporate Management Board met urgently early in November and the digital-services department ordered stepped-up security checks. CERT-EU''s 5 November blog had already stated that it had seen similar AI-driven activity against its own constituency that highly likely involved ARTEX, and the tool''s availability will likely speed adoption by threat actors. No source names the initial access vector, the systems'' software or an actor; every Swiss and German report traces to Politico plus the Commission''s own briefing.'
