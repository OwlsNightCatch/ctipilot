  summary: JPMorgan Chase said on 2026-11-20 that third-party service providers were the target of a cyber attack and that attackers accessed marketing data held by those vendors, which may include customer names and email addresses; Visa said its incident involved a third-party provider in Asia Pacific with no payment data affected, and Mastercard said a provider exposed a limited number of email addresses of cardholders in one benefit programme. The n0n extortion group claimed all three, leaked the claimed data on its site on 2026-11-16, and, per BleepingComputer, had on 2026-11-11 claimed the attack on Qubole (the vendor in the store's Qubole entry, whose abused AWS cross-account integration roles Wiz and Sentra documented); Qubole has not responded or confirmed, so the link between the leaks and Qubole is the outlet's inference. Sophos CTU's senior director of threat intelligence cautions that in several cases n0n's data appears to come from third-party providers running marketing, loyalty
    or concierge programmes rather than from the brands' own networks. The group first appeared in September 2026; CyberXTron (via Infosecurity Magazine) reported initial entry from infostealer-sourced credentials and threats to destroy backups, and SOCRadar's analysis of an exposed operator workspace reports credential stuffing against 305 FortiGate SSL-VPN appliances through residential proxies, weak RDP and WinRM logins, exposed AWS keys, hijacked Cisco Firepower Management Center instances with every access policy switched to BLOCK, mass S3 deletion and an AI coding agent that wrote attack scripts. The store carries no entry on n0n.
