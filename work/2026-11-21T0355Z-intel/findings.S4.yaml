- title: 'Japan Digital Agency: files on the government-wide GSS file-sharing service were accessed by non-recipients from 2026-07-30 to 2026-11-12, detected 12 November'
  sources:
  - url: https://www.digital.go.jp/press/a966ee61-478c-4194-8f13-f97599fae986
    publisher: Digital Agency (Japan), press release
    date: '2026-11-20'
    role: primary
  - url: https://piyolog.hatenadiary.jp/entry/2026/11/21/002438
    publisher: Piyolog (Piyokango), compiles Asahi, Nikkei, TBS, Yomiuri and NHK reporting
    date: '2026-11-21'
    role: corroborating
  - url: https://www.yomiuri.co.jp/politics/20261120-GYT1T00361/
