  summary: 'The canton of Basel-Landschaft said on 2026-11-20 that the forensic analysis by the experts it called in shows the attackers gained access to the database of work permits for cross-border commuters and stole 97,000 records (name, home address, date of birth, marital status, occupation, the identification number in the federal central migration information system ZEMIS, and employer contact data), covering permits applied for since 2016-11-28. The platform is deactivated, applications can still be submitted through the migration office''s forms, the canton filed a criminal complaint against unknown persons and informed the federal cyber office BACS, the data-protection supervisory body, the foreign ministry and the German and French embassies, and warns of phishing and identity theft. Earlier reporting (watson, 2026-11-18): attacks on the administration since Sunday 15 November affected about twenty cantonal applications running on six servers that are being reinstalled; the emergency
