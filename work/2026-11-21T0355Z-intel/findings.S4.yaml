  summary: 'On 18 and 19 November 2026 the Hokkaido cities of Iwamizawa and Rumoi and the town of Shintoku each disclosed that data they had handed to their contractor GIS Hokkaido (Sapporo) was exposed on a development terminal belonging to GIS Hokkaido''s subcontractor Rimgate (Sapporo). The terminal was infected with the information stealer K2F (also written k2f_chan) overnight on 2 to 3 November; Rimgate found traces on 4 November, cut the terminal from the network, reported to GIS Hokkaido on 9 November, and GIS Hokkaido told the municipalities between 13 and 16 November. Exposed data, as the municipalities state it: Rumoi up to 71,002 resident-register records (as of 2022-02-03) and up to 4,503 records of persons needing support, including disability category, care level and consent status; Iwamizawa up to 10,348 land parcels and 7,037 buildings from the fixed-asset-tax data (building records carry no owner names); Shintoku 6,001 resident-register records and 986 disaster-evacuation-assistance
    records; none contains the national My Number, and no external leakage or misuse is confirmed. Rumoi''s contract with GIS Hokkaido ended in March 2022 with deletion agreed afterwards, yet the data was still on the subcontractor''s terminal, and Rumoi says GIS Hokkaido never told it the data had been passed on (Piyolog, citing Kyodo via Nikkei). GIS Hokkaido told ITmedia on 19 November that the PC launcher of the game NIKKE is involved and declined to say whether Rimgate staff ran the game on a work PC. An independent researcher''s analysis of that launcher compromise states that from 2026-09-27 four official JavaScript files on the publisher''s CDN contained attacker code and that from 23 October at the latest opening the launcher could install a remote-control agent; the researcher states the way the attacker obtained CDN write access was unknown at the time of writing. Piyolog notes the K2F name matches a string and internal build name reported for that launcher payload; the municipalities
    themselves name only K2F, and the launcher link rests on GIS Hokkaido''s statement to ITmedia.'
  region_nexus: apac (Japan); direct analogue for Swiss communes and cantons whose resident-register or social-care data sits with a contractor and a sub-contractor
