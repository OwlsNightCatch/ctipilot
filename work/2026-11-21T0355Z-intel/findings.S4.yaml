  extended_notes: 'Exposure (source-stated): any administration whose resident-register, social-care or tax data was handed to a contractor that sub-contracts, and any endpoint at a supplier on which consumer software such as a game launcher can run next to live project data. Detection concept (inference from the mechanism): EDR telemetry of a consumer game launcher or its updater loading remotely fetched scripts on a supplier-managed development workstation, browser credential-store access followed by outbound connections from the same process lineage, and an inventory check of which supplier terminals still hold deliverables after contract end. Post-compromise check the notices imply: credentials stored in the infected terminal''s browsers and any session tokens on it should be treated as exposed; Rimgate detected on day 2 but the municipalities learned only 9 to 14 days later, so the reporting chain, not detection, was the slow link. Defender takeaway (inference): contractual deletion
    at contract end and notification duties that reach sub-contractors are the controls this case tests; an inventory of copies held at suppliers (including sub-suppliers) is the check that would have surfaced the 2022-vintage data. The NIKKE launcher compromise is not otherwise in the store; it is consumer-facing and enters here only as the delivery path, with the researcher write-up (last updated 2026-11-09) as background rather than window material.'
- title: 'European Commission: AI-driven campaign using the ARTEX pentest framework disrupted its HR, medical-reimbursement and translation systems for more than ten days (discovered 22 October, confirmed 26 October)'
  sources:
