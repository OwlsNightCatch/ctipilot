  section: cleared-evtx-logs-keep-earlier-records-in-chunk-free-space
  item: "2026-11-21/cleared-evtx-logs-keep-earlier-records-in-chunk-free-space (Detection line)"
  url_or_quote: "carve its first chunk for records with earlier timestamps and higher record identifiers than the allocated ones"
  summary: "Arctic Wolf's figures show the opposite: allocated records run 2,635,913 to 2,636,016 (Figures 6 and 7) while the free-space records are 'Identifier 2,635,767' (Figure 8) and 2,635,218 (Figure 9), i.e. LOWER ids with earlier timestamps. Replace 'higher' with 'lower' (or drop the id clause)."
