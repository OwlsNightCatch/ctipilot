- code: F11
  category: editorial-advisory
  section: cve-2026-76466-cisco-expressway-cluster-unauth-root-rce
  item: "Reader-facing composition narration: Cisco body 'when read on 2026-11-21'; Cisco record summary 'The entry now reads as exploited, moves to high, and carries F6's log marker and the post-upgrade compromise check'; Java4Shell record summary 'the Cisco statements elsewhere in the entry are corrected to match'; Danfoss record summary 'the summary and the main analysis no longer say no identifier exists'"
  url_or_quote: "Cisco's advisory was still at its initial version when read on 2026-11-21"
  summary: "Changelog summaries should state the delta, not narrate the editing; 'when read on <date>' is pipeline narration (say 'as of 2026-11-21'). Low confidence extra: the Danfoss 2026-11-11 section still says 'No CVE identifiers exist yet' in the present tense after the 2026-11-21 section reports Danfoss's CVE ids."
