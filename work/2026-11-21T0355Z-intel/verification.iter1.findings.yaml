- code: F3
  category: claim-not-supported
  section: sap-netweaver-enterprise-portal-cve-2025-42884-kev
  item: "2026-11-21/sap-netweaver-enterprise-portal-cve-2025-42884-kev (body, first sentence)"
  url_or_quote: "CISA added CVE-2025-42884 to its Known Exploited Vulnerabilities catalog on 2026-11-20, naming SAP NetWeaver Enterprise Portal, on evidence of active exploitation that it does not describe ([CISA, 2026-11-20])"
  summary: "CISA's alert row reads \"CVE-2025-42884 SAP NetWeaver Improper Neutralization of Special Elements in Data Query Logic Vulnerability\": it names SAP NetWeaver, not Enterprise Portal; the Enterprise Portal component comes from SAP's bulletin and ENISA. Drop 'Enterprise Portal' from the CISA clause or say CISA names 'SAP NetWeaver' and SAP/ENISA place the CVE in Enterprise Portal."
