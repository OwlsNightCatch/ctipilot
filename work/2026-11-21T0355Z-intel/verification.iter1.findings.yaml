  item: "2026-11-21/basel-landschaft-97000-cross-border-work-permits-stolen (length vs the incident floor); also the 2026-11-21 update section of 2026-11-20/usi-lugano-online-forms-vulnerability-exploited"
  url_or_quote: "priority: routine; opening paragraph of five sentences plus Exposure and Defender takeaway; USI update: three long sentences on a routine entry"
