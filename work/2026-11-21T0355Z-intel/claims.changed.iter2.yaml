    text: "F6 reports what it calls the first case of exploitation, an intrusion at a Russian organisation: after a public proof of concept appeared, the attackers compromised two internet-reachable Expressway X15.5.3 devices, reached two further cluster nodes in the internal network through one of them and, with root, ran Python scripts they wrote for network scanning, SMB share discovery, SQL Server and WinRM interaction and the review of GitLab repositories to take credentials; F6 reads comments in the code as showing that an AI assistant helped adapt the scripts during the intrusion ("
