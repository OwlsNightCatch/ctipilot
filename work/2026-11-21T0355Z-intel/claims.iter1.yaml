    text: "{\"id\": \"CVE-2026-114938\", \"cvss\": \"8.1\", \"status\": [\"poc-public\", \"patch-available\"], \"affected\": \"OpenJDK 17.0.6 and later, 21, 25 and 27 up to 17.0.21.0.3, 21.0.13.0.3, 25.0.5.0.3 and 27.0.1.0.3 on x86-64 with AVX-512 VBMI; Oracle Java SE 8u511b33-perf\", \"fixed\": \"Oracle builds 17.0.21.1, 21.0.13.1, 25.0.5.1, 27.0.1.1 and 8u513-perf; Cisco has no fixed release yet for Secure Network Analytics or Secure Workload and lists further affected products in its advisory; Siemens has no fix yet for Siveillance Control, Siveillance Control Pro or Industrial Edge Management Pro and Virtual\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
