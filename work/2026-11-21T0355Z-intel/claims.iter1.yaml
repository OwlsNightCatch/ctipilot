  - claim_id: f346ecb549
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "summary"
    kind: frontmatter
    text: "F5 and the nginx project fixed five memory-corruption flaws in the nginx data plane on 2026-11-18, two in HTTP/2 and one each in HTTP/3, the resolver and the mail proxy, which CERT-EU says can lead to unauthenticated code execution with the privileges of the worker process; NCSC-NL scores all five CVSS 4.0 9.2, NCSC.ch and Wiz the two HTTP/2 flaws and Rapid7 CVE-2026-123007. The fixes are in nginx 1.31.9 and 1.30.7 and NGINX Plus 37.3.0.1 and 37.0.8.1, while NGINX Plus R33 to R36 have no update. Rapid7 published a proof of concept for CVE-2026-123007, CERT-EU reports no exploitation, and NCSC.ch, CERT-EU, CERT.at and NCSC-NL issued warnings. Palo Alto Networks lists PAN-OS and Panorama with HTTP/2 enabled as affected, Cisco and Siemens list products with fixes pending or none, and Fortinet is still investigating its portfolio."
  - claim_id: 466c9ea7d9
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "actions[0]"
    kind: frontmatter
    text: "On every PAN-OS firewall and Panorama with the HTTP/2 option enabled, upgrade to 12.2.4-h3, 12.1.10-h6 or 11.2.16-h3 or later (12.1.7-h15, 11.2.10-h19 and 11.2.13-h6 are listed with a 2026-11-23 ETA) or disable HTTP/2, because Palo Alto Networks lists CVE-2026-123007 and CVE-2026-123633 as affecting them with that option on."
  - claim_id: 1692394f3a
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "actions[1]"
    kind: frontmatter
    text: "Update every internet-facing nginx to 1.31.9 or 1.30.7 (NGINX Plus to 37.3.0.1 or 37.0.8.1) and restart the process, because a reload does not replace the running executable; where the update waits, disable HTTP/2 on exposed listeners, which blocks only CVE-2026-123007 and CVE-2026-123633, since five unauthenticated flaws reach code execution as the worker and Rapid7's proof of concept for one of them is public."
