claims:
  - claim_id: d37bf3d132
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "summary"
    kind: frontmatter
    text: "Coopérative U, Intermarché and E. Leclerc confirmed a cyberattack on their refrigeration systems overnight on 11 to 12 October 2026, a remotely forced defrost at hundreds of French stores, and on 2026-11-09 France's foreign ministry attributed that campaign, and only that campaign, to the Iranian unit Shahid Kaveh. More followed: more than 115 stores in at least six more countries and the first German shops on 2026-11-02, altered cold-room settings at three sites of the French blood service through a supplier, and, per SRF on 2026-11-05, a Köniz butcher and three Volg stores in Switzerland. CERT-FR reports numerous compromises of Danfoss AK-SM and AK-SC controllers and of Copeland xweb and Dixell xweb, and NCSC Switzerland rates the activity actively exploited. On 2026-11-11 Midnight Blue reported six pre-authentication remote-code-execution flaws in all Danfoss AK-SM 800A firmware up to 5.3.2, with no known exploitation (BSI), and on 2026-11-20 Danfoss published CVE-2026-129713 (CVSS 9.3, an unauthenticated stack overflow in AK-SM 8xxA firmware 5.4.0 and earlier, fix only in an announced 5.5.x) and CVE-2026-127057 (CVSS 9.9, default credentials on every legacy AK-SC 355 and AK-SM 800, no fix); CCB says updating, new passwords and Strict mode are insufficient, so removing internet exposure comes first, and BACS's statement of 2026-11-10 that updates fix the known flaws predates the report and does not cover the six."
