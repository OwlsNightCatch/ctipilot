  - claim_id: e28e0889af
    entry: 2026-10-22/cve-2026-76466-cisco-expressway-cluster-unauth-root-rce
    surface: "headline"
    kind: frontmatter
    text: "Cisco Expressway root RCE is exploited (CISA KEV, F6 incident): upgrade clustered units to X15.5.20 and check them"
  - claim_id: 73e0a18ebe
    entry: 2026-10-22/cve-2026-76466-cisco-expressway-cluster-unauth-root-rce
    surface: "summary"
    kind: frontmatter
    text: "Cisco's disclosure of 2026-10-21 fixes CVE-2026-76466 (CVSS 3.1 9.8), which lets an unauthenticated attacker who holds persistent cookies run operating-system commands as root on Expressway-C and Expressway-E configured in a cluster; X15.5.3 and earlier get X15.5.20, X14 and earlier must migrate, and there is no workaround. CISA added it to its Known Exploited Vulnerabilities catalog on 2026-11-20, and F6 reports that attackers used a public proof of concept against two internet-reachable X15.5.3 devices, reached two internal cluster nodes through one and ran Python scripts for scanning and credential theft, while Cisco's advisory still says it knows of no malicious use. The same-day hardening releases for the Unified CM family and Unity Connection (up to 9.8, fixed in 15SU5) and for Snort 3 (9.0) are not known to be exploited."
  - claim_id: cffdad7b1b
    entry: 2026-10-22/cve-2026-76466-cisco-expressway-cluster-unauth-root-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every clustered Cisco Expressway-C and Expressway-E to X15.5.20 now (X14 and earlier has no fix and must migrate) and, until it is in, limit TCP 4371 to 4372 to the cluster peers' addresses as F6 advises, because CISA lists CVE-2026-76466 as exploited and F6 saw a public proof of concept used against two internet-reachable nodes."
  - claim_id: c7ce361b87
    entry: 2026-10-22/cve-2026-76466-cisco-expressway-cluster-unauth-root-rce
    surface: "actions[1]"
    kind: frontmatter
    text: "On every clustered Expressway that was reachable before the upgrade, search erlang.log for a nodeup record naming wombat@127.0.0.1 and check for scanning, SMB, SQL Server and WinRM traffic that starts on the Expressway or its cluster peers, treating a hit as a root compromise, because an upgrade does not evict an attacker who already holds root."
