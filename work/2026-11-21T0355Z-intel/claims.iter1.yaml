    text: "DSA-2026-12-01 assigns CVE-2026-129713 (CVSS 9.3) to a stack-based buffer overflow in an unauthenticated CGI handler of the AK-SM 8xxA series, firmware 5.4.0 and earlier: crafted HTTP or HTTPS POST requests cause memory corruption and a web-server restart and, in Danfoss's words, hypothetically arbitrary code execution with web-server privileges, with no authentication; the fix is an announced 5.5.x release that is not yet published, Danfoss will remove the option to disable Strict mode, and its mitigations are no internet exposure, access only through a VPN or protected network, Strict mode and strong passwords ("
