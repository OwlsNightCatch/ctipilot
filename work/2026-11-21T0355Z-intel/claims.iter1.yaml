  - claim_id: 97d8c34a26
    entry: 2026-11-21/apache-roller-cve-2026-129448-xmlrpc-deserialization-kev
    surface: "summary"
    kind: frontmatter
    text: "Apache's announcement of 2026-11-17 assigns CVE-2026-129448 (CVSS 3.1 9.8) to Apache Roller 4.0.0 through 6.1.4, the same flaw it disclosed as CVE-2026-82384 for 6.1.5 in September: the XML-RPC endpoint deserializes vendor extension types before authenticating the requester, which gives an unauthenticated attacker code execution. Apache states the flaw is being actively exploited and CISA listed it on 2026-11-20, while neither describes the attacks; Roller 6.1.6 or later fixes it, and switching XML-RPC off in the administration interface does not help on older releases."
  - claim_id: 638aad78f6
    entry: 2026-11-21/apache-roller-cve-2026-129448-xmlrpc-deserialization-kev
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every Apache Roller to 6.1.6 or later (6.1.7 is the project's best available release) and, where that waits, set enabledForExtensions to false in WEB-INF/web.xml or remove the /roller-services/xmlrpc servlet mapping and restart; treat any internet-reachable instance on an older release as possibly compromised, because Apache and CISA report exploitation and the request is deserialized before authentication."
