  - claim_id: f5ef21e5e7
    entry: 2026-11-21/hokkaido-municipal-data-subcontractor-pc-k2f-infostealer
    surface: "summary"
    kind: frontmatter
    text: "On 2026-11-18 and 2026-11-19 the Hokkaido municipalities Iwamizawa, Rumoi and Shintoku disclosed that data they gave their contractor GIS Hokkaido was stored on a development terminal of its subcontractor Rimgate that the K2F information stealer infected overnight on 2 to 3 November: up to 71,002 resident-register and 4,503 support-needed records for Rumoi, whose personal data was still on the terminal after its contract ended, 6,001 resident-register and 986 evacuation-support records for Shintoku, and fixed-asset-tax land and building data for Iwamizawa. GIS Hokkaido told ITmedia that the PC launcher of the game NIKKE is involved and would not say whether Rimgate staff ran the game on the work PC; no leak or misuse is confirmed, and none of the data contains the national My Number."
