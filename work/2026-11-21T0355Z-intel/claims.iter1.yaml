    text: "On 2026-11-20 the canton of Basel-Landschaft said that forensic analysis by external experts confirmed the attackers reached a database of work permits for cross-border commuters (permit G) and took data from it: about 97,000 records from applications lodged through its online platform since 2016-11-28, with names, addresses, birth dates, nationality, occupation, the ZEMIS identification number and employers' contact details. The canton cannot say which records left and assumes all did; it names no entry point, tool or actor, took the platform off the network and filed a criminal complaint against unknown persons."
