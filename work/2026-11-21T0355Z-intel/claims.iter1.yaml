    entry: 2026-11-21/webworm-ntmonitor-custom-softether-vpn-bridge-rapid7
    surface: "headline"
    kind: frontmatter
    text: "Rapid7: Webworm hides SoftEther VPN Bridge behind NtMonitor branding, new endpoints and an encrypted config"
  - claim_id: 83990f863a
    entry: 2026-11-21/webworm-ntmonitor-custom-softether-vpn-bridge-rapid7
    surface: "summary"
    kind: frontmatter
    text: "Rapid7 describes NtMonitor, a Windows build of SoftEther VPN Bridge 4.44 that it attributes with moderate confidence to Webworm, the China-aligned actor that ESET documented moving to European government targets in May 2026. The rebuild keeps SoftEther's function of bridging a remote network into the victim's LAN and strips its fingerprints: branding, handshake paths, the handshake watermark, the separate resource archive and the plain-text configuration are all changed, and Rapid7 found no backdoor or other added capability. Only one antivirus vendor detected the sample on VirusTotal although it has been public since January."
  - claim_id: e81b90273d
    entry: 2026-11-21/webworm-ntmonitor-custom-softether-vpn-bridge-rapid7
    surface: "body"
    kind: cited
    text: "Rapid7 analysed what it believes is a so-far unknown custom tool, a modified build of SoftEther VPN Bridge version 4.44 (build 9807) that it attributes to Webworm with moderate confidence ("
    urls: ["https://www.rapid7.com/blog/post/tr-spying-on-governments-no-malware-custom-webworms-toolkit-softether-bridge"]
  - claim_id: d9291f1d9b
    entry: 2026-11-21/webworm-ntmonitor-custom-softether-vpn-bridge-rapid7
    surface: "body"
    kind: cited
    text: "Webworm is the China-aligned actor that ESET reported in May 2026 moving to European government targets and to dual-use tools such as SoftEther ("
    urls: ["https://www.welivesecurity.com/en/eset-research/webworm-new-burrowing-techniques/"]
  - claim_id: ece6ee62e1
    entry: 2026-11-21/webworm-ntmonitor-custom-softether-vpn-bridge-rapid7
    surface: "body"
    kind: cited
    text: "The rebuild keeps the bridge function, which cascades a remote network into the victim's local network, and removes the fingerprints: the PE metadata and internal strings are rebranded as a network-monitoring product (inconsistently, since the service name and many registry paths still say SoftEther), the HTTP handshake endpoints get update-style names, the handshake watermark becomes a truncated PNG header so stock SoftEther peers cannot connect and the stock watermark cannot fingerprint the build, the resource archive that normally sits beside the executable is embedded in it as a PE resource, and the configuration is stored under a new name in a custom-encrypted format ("
    urls: ["https://www.rapid7.com/blog/post/tr-spying-on-governments-no-malware-custom-webworms-toolkit-softether-bridge"]
  - claim_id: c0380762c5
    entry: 2026-11-21/webworm-ntmonitor-custom-softether-vpn-bridge-rapid7
    surface: "body"
    kind: cited
    text: "Rapid7 found no backdoor or other added capability, concludes the actor puts stealth above capability, and says only one antivirus vendor detected the sample although it has been public since January ("
    urls: ["https://www.rapid7.com/blog/post/tr-spying-on-governments-no-malware-custom-webworms-toolkit-softether-bridge"]
  - claim_id: 256f21aaba
    entry: 2026-11-21/webworm-ntmonitor-custom-softether-vpn-bridge-rapid7
    surface: "body"
    kind: cited
    text: "**Exposure:** Windows hosts in government networks that Webworm has already compromised; Rapid7 says that in every configuration it holds the VPN is set to bridge a remote network into the local one ("
    urls: ["https://www.rapid7.com/blog/post/tr-spying-on-governments-no-malware-custom-webworms-toolkit-softether-bridge"]
  - claim_id: 8d288f167b
    entry: 2026-11-21/webworm-ntmonitor-custom-softether-vpn-bridge-rapid7
    surface: "body"
    kind: cited
    text: "**Detection:** Rapid7's most reliable network detection, where TLS traffic can be inspected, is a POST request to an update-themed CGI path with a JPEG content type whose body starts with a PNG file header; on hosts, look for a SoftEther VPN Bridge service that was not installed by the organisation, in particular one whose binary carries its resource archive inside itself, and for firewall rules added by such a service ("
    urls: ["https://www.rapid7.com/blog/post/tr-spying-on-governments-no-malware-custom-webworms-toolkit-softether-bridge"]
  - claim_id: 9b03f17766
    entry: 2026-11-21/webworm-ntmonitor-custom-softether-vpn-bridge-rapid7
    surface: "body"
    kind: cited
    text: "Rapid7 expects the branding, endpoints and watermark to be swapped out next, so behaviour that is intrinsic to SoftEther matters more than any one string ("
    urls: ["https://www.rapid7.com/blog/post/tr-spying-on-governments-no-malware-custom-webworms-toolkit-softether-bridge"]
  - claim_id: 5882c4c382
    entry: 2026-11-21/webworm-ntmonitor-custom-softether-vpn-bridge-rapid7
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** government networks in Europe should treat any unmanaged SoftEther VPN Bridge, however it is named, as a persistence mechanism that bridges an outside network into theirs, and learn the tool's intrinsic behaviour, as Rapid7 recommends for the government sector ("
    urls: ["https://www.rapid7.com/blog/post/tr-spying-on-governments-no-malware-custom-webworms-toolkit-softether-bridge"]
  - claim_id: 5656884cf4
    entry: 2026-11-21/cleared-evtx-logs-keep-earlier-records-in-chunk-free-space
    surface: "headline"
    kind: frontmatter
    text: "Arctic Wolf: a cleared Windows event log keeps earlier records in its first EVTX chunk; carve it"
  - claim_id: 7e78243854
    entry: 2026-11-21/cleared-evtx-logs-keep-earlier-records-in-chunk-free-space
    surface: "summary"
    kind: frontmatter
    text: "Arctic Wolf incident responders report that clearing a Windows event log truncates the EVTX file after the first 64 KB cluster and resets the record numbers, but the first chunk keeps its earlier records in its free space. On a domain controller the System log held 104 allocated events after the final clear, yet the encryptor's full command line, stamped about three hours before the clear, sat inside the allocated file, and Event Viewer, EvtxECmd and Magnet AXIOM showed none of it; a PowerShell log in a second case held 44 records of which one was allocated."
  - claim_id: ecd829cb0a
    entry: 2026-11-21/cleared-evtx-logs-keep-earlier-records-in-chunk-free-space
    surface: "body"
    kind: cited
    text: "Arctic Wolf's incident responders report that clearing a Windows event log does not wipe the underlying EVTX file ("
    urls: ["https://arcticwolf.com/resources/blog/windows-event-log-cleared-think-outside-the-box/"]
  - claim_id: 834eb6fbc2
    entry: 2026-11-21/cleared-evtx-logs-keep-earlier-records-in-chunk-free-space
    surface: "body"
    kind: cited
    text: "On clearing, Windows truncates the file after the first 64 KB cluster and resets the first and last record numbers, but that first chunk keeps its earlier records in free space until enough new events fill it ("
    urls: ["https://arcticwolf.com/resources/blog/windows-event-log-cleared-think-outside-the-box/"]
  - claim_id: ea4835455a
    entry: 2026-11-21/cleared-evtx-logs-keep-earlier-records-in-chunk-free-space
    surface: "body"
    kind: cited
    text: "In a ransomware case the encryptor needed a password argument to run, and Arctic Wolf found its full command line inside the allocated System.EVTX of a domain controller, stamped about three hours before the final clear and absent from the parsed output of Event Viewer, EvtxECmd and Magnet AXIOM; another log held a netscan execution record and an attacker hostname that survived the same way ("
    urls: ["https://arcticwolf.com/resources/blog/windows-event-log-cleared-think-outside-the-box/"]
  - claim_id: cc3e20cb97
    entry: 2026-11-21/cleared-evtx-logs-keep-earlier-records-in-chunk-free-space
    surface: "body"
    kind: cited
    text: "In a second case a PowerShell log held 44 records of which one was allocated, all of them the same command that clears every log, which shows repeated clearing ("
    urls: ["https://arcticwolf.com/resources/blog/windows-event-log-cleared-think-outside-the-box/"]
  - claim_id: e0d8b9d412
    entry: 2026-11-21/cleared-evtx-logs-keep-earlier-records-in-chunk-free-space
    surface: "body"
    kind: cited
    text: "Arctic Wolf identified no forensic tool that flags records left in the slack space after a clear, and records come back with some template-held fields missing ("
    urls: ["https://arcticwolf.com/resources/blog/windows-event-log-cleared-think-outside-the-box/"]
  - claim_id: e09277fffd
    entry: 2026-11-21/cleared-evtx-logs-keep-earlier-records-in-chunk-free-space
    surface: "body"
    kind: cited
    text: "**Detection:** the clearing itself is the alertable event, since Arctic Wolf notes that it often triggers EDR or IDS alerting and is frequently what exposes an attack in progress; the recovery step is forensic: when a log shows as cleared, acquire the EVTX file and carve its first chunk for records with earlier timestamps and higher record identifiers than the allocated ones ("
    urls: ["https://arcticwolf.com/resources/blog/windows-event-log-cleared-think-outside-the-box/"]
  - claim_id: 7932b09f4b
    entry: 2026-11-21/cleared-evtx-logs-keep-earlier-records-in-chunk-free-space
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** do not treat a cleared log as empty; preserve the EVTX files of affected hosts promptly, because new events overwrite the free space once they fill the first 64 KB, and search the whole file, not only the parsed events, for the encryptor's command line, tool names and hostnames ("
    urls: ["https://arcticwolf.com/resources/blog/windows-event-log-cleared-think-outside-the-box/"]
