  - title: "CVE-2026-44963 — Veeam Backup & Replication: any authenticated domain user achieves RCE on backup server (CVSS v4 9.4)"
    sources:
      - url: "https://www.veeam.com/kb4869"
        publisher: "Veeam Software (vendor)"
        date: "2026-06-09"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/veeam-backup-replication-rce-flaw-lets.html"
        publisher: "The Hacker News"
        date: "2026-06-09"
        role: "corroborating"
      - url: "https://www.bleepingcomputer.com/news/security/new-veeam-vulnerability-exposes-backup-servers-to-rce-attacks/"
        publisher: "BleepingComputer"
        date: "2026-06-09"
        role: "corroborating"
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12625"
        publisher: "NCSC-CH Security Hub"
        date: "2026-06-10"
        role: "corroborating"
    discovery_trace: "first seen at: ncsc-csh bridge post 12625 published 2026-06-10 → primary: Veeam KB4869 URL https://www.veeam.com/kb4869 → corroborating: THN 2026-06-09, BleepingComputer 2026-06-09 → also covered by NCSC-NL NCSC-2026-0188"
    summary: |
      CVE-2026-44963 (CVSS v4 9.4 Critical, CWE-502 Deserialization of Untrusted Data) is an authenticated remote code execution vulnerability in Veeam Backup & Replication versions 12.x (specifically <= 12.3.2.4465). Any authenticated domain user — including standard enterprise Active Directory accounts with no administrative privileges — can execute arbitrary code on the Veeam Backup Server by sending a specially crafted deserialization payload.

      Attack prerequisites: the attacker must have a valid domain user credential in the Active Directory domain to which the backup server is joined. Workgroup-joined (non-domain) Veeam deployments are not affected. In most enterprise environments, domain user accounts number in the thousands, dramatically broadening the attacker population beyond traditional service-account abuse.

      Technical root cause: CWE-502 insecure deserialization — the Veeam backup server processes a KV store data payload via the Python `jsonpickle` library without sufficient type validation, allowing crafted objects to invoke arbitrary code paths upon deserialization. Researcher Sina Kheirkhah (@SinSinology) of watchTowr discovered and responsibly disclosed the flaw; a public PoC is available on GitHub.

      Impact: successful exploitation grants OS-level code execution as the backup service user, enabling backup manipulation or deletion (ransomware preparation), lateral movement to backup-protected systems, and credential harvest from backup metadata. Veeam infrastructure is a high-priority ransomware target because it holds the organisation's recovery assets.

      Affected: VBR 12.x <= 12.3.2.4465. Not affected: VBR 13.x (architectural changes removed the vulnerable component). Fix: upgrade to 12.3.2.4854 (released 2026-06-09). Detection: watch for unexpected API calls to Veeam Backup Server from non-administrative domain accounts; monitor for anomalous jsonpickle deserialization patterns in Veeam service logs; Sysmon EID 1 with Veeam service as parent process spawning unexpected child processes.
    ch_eu_nexus: "global; Veeam is the dominant backup/DR platform across Swiss and EU enterprise and public-sector environments"
    public_sector_nexus: "indirect — Veeam is widely used in Swiss federal and cantonal IT for backup infrastructure"
    sector: "all sectors with Veeam Backup & Replication 12.x deployments"
    cves: [CVE-2026-44963]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
