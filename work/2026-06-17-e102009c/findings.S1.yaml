  - title: "CVE-2026-11645 — Google Chrome V8: out-of-bounds read/write in JavaScript engine, exploited in the wild, CISA KEV (Chrome 149.0.7827.103)"
    sources:
      - url: "https://chromereleases.googleblog.com/2026/06/stable-channel-update-for-desktop_0153744567.html"
        publisher: "Google Chrome Releases"
        date: "2026-06-08"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/chrome-v8-zero-day-cve-2026-11645.html"
        publisher: "The Hacker News"
        date: "2026-06-09"
        role: "corroborating"
      - url: "https://nvd.nist.gov/vuln/detail/CVE-2026-11645"
        publisher: "NVD/MITRE"
        date: "2026-06-09"
        role: "cveid-verification"
    discovery_trace: "first seen at: cisa-kev bridge — CVE-2026-11645 dateAdded 2026-06-09 → primary: Chrome Releases blog URL https://chromereleases.googleblog.com/2026/06/stable-channel-update-for-desktop_0153744567.html → corroborating: THN 2026-06-09, URL https://thehackernews.com/2026/06/chrome-v8-zero-day-cve-2026-11645.html"
    summary: |
      CVE-2026-11645 (CVSS 8.8 HIGH, CWE-787/CWE-125 out-of-bounds write/read) is the fifth Chrome zero-day exploited in 2026. The flaw resides in the V8 JavaScript/WebAssembly engine and allows a remote attacker to achieve arbitrary code execution inside the browser's renderer sandbox via a crafted HTML page — no user interaction beyond visiting the page is required.

      Attack surface: any browser rendering attacker-controlled content, including Chrome, Chromium-based browsers (Edge, Brave, Opera), on Windows, macOS, and Linux. The flaw was discovered by researcher "303f06e3" (awarded $55,000 bug bounty) on April 27, 2026.

      Exploitation type: out-of-bounds write/read enables memory corruption in the V8 heap; in typical V8 exploitation the renderer process is compromised first, requiring a sandbox-escape chain for full OS code execution. Google has not publicly attributed the exploitation to a specific actor or campaign. CISA KEV added 2026-06-09 with due date 2026-06-23 (standard 14-day tier).

      Patched: Chrome 149.0.7827.102/103 for Windows/macOS, 149.0.7827.102 for Linux. Chrome auto-updates when restarted. Defenders: verify deployed Chrome versions (check via `chrome://settings/help` or endpoint management console), ensure browser restart cadence is enforced by policy. EDR alert: unexpected child processes from renderer process (`chrome --renderer`) or GPU process are a lateral sandbox-escape indicator; Sysmon EID 10 on `chrome.exe` spawning non-standard child processes.
    ch_eu_nexus: "global; Chrome/Chromium is the dominant browser in EU and Swiss government workstation fleets"
    public_sector_nexus: "direct"
    sector: "all sectors"
    cves: [CVE-2026-11645]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Out-of-bounds read and write in V8 in Google Chrome prior to 149.0.7827.103 allowed a remote attacker to execute arbitrary code inside a sandbox via a crafted HTML page."
        attribution: "NVD (via CISA KEV)"
        source_url: "https://nvd.nist.gov/vuln/detail/CVE-2026-11645"

