items:
  - title: "UPDATE: FortiSandbox triple active exploitation — CVE-2026-39813, CVE-2026-39808 (both April-patched), and CVE-2026-25089 (patched June 9) hit simultaneously"
    sources:
      - url: "https://securityaffairs.com/193709/ai/fortinet-warned-as-three-critical-fortisandbox-bugs-come-under-attack.html"
        publisher: "Security Affairs"
        date: "2026-06-16"
        role: "primary"
      - url: "https://www.helpnetsecurity.com/2026/06/16/fortisandbox-vulnerabilities-cve-2026-39813-cve-2026-39808-cve-2026-25089/"
        publisher: "Help Net Security"
        date: "2026-06-16"
        role: "corroborating"
      - url: "https://www.fortiguard.com/psirt/FG-IR-26-141"
        publisher: "Fortinet PSIRT (CVE-2026-25089)"
        date: "2026-06-09"
        role: "patch-reference"
    discovery_trace: "first seen at: NCSC-CH Security Hub ncsc-csh bridge → prior coverage check showed CVE-2026-25089 covered 2026-06-12 as disclosure-only → in-window delta: confirmed exploitation of all three CVEs reported by Defused Cyber on June 15 → primary: Security Affairs 2026-06-16, URL https://securityaffairs.com/193709/ai/fortinet-warned-as-three-critical-fortisandbox-bugs-come-under-attack.html → corroborating: Help Net Security 2026-06-16, URL https://www.helpnetsecurity.com/2026/06/16/fortisandbox-vulnerabilities-cve-2026-39813-cve-2026-39808-cve-2026-25089/"
    summary: |
      UPDATE (CVE-2026-25089 originally disclosed 2026-06-12, not yet exploited then): On June 15-16 2026, threat intelligence firm Defused Cyber reported observing active exploitation of three FortiSandbox vulnerabilities within a 24-hour window. The three CVEs are:

      CVE-2026-39808 (CVSS 9.8, CWE-78): OS command injection in FortiSandbox's JRPC API; unauthenticated remote attacker can execute arbitrary OS commands via crafted HTTP requests. Patches available since April 2026 (FG-IR-26-100). Attack surface: any internet-reachable FortiSandbox management interface.

      CVE-2026-39813 (CVSS 9.1, CWE-22): Path traversal in FortiSandbox's JRPC API; unauthenticated attacker can bypass authentication via specially crafted HTTP requests. Patches available since April 2026 (FG-IR-26-112). Two months of available patches have apparently not been applied in targeted environments.

      CVE-2026-25089 (CVSS 9.8, CWE-78): OS command injection in the FortiSandbox web UI's VNC-launch handler (HTTP parameter injection into shell command construction); unauthenticated attacker can execute arbitrary commands via crafted HTTP requests against `/api/sandboxapi/startVNCView` or equivalent endpoint. Patched June 9, 2026 (FG-IR-26-141). The exploit seen in the wild appears AI-generated and is assessed as faulty/incomplete by Defused Cyber — but it is still finding traction, indicating unpatched deployments with no compensating controls.

      FortiSandbox is the Fortinet product that provides sandboxed file analysis verdicts consumed by FortiGate, FortiMail, FortiProxy, and FortiClient — compromise of the sandbox analysis pipeline is a high-value target since it can flip verdicts and suppress blocking across the dependent Fortinet stack. Fortinet has not yet officially confirmed exploitation. Detection: monitor FortiSandbox web-UI access logs for unauthenticated POST requests to JRPC API endpoints and VNC-launch handlers from external IPs; FortiGate IPS signature updates for FG-IR-26-100, FG-IR-26-112, FG-IR-26-141 are the compensating control while patching is staged.
    ch_eu_nexus: "global; Fortinet is heavily deployed in Swiss and EU public-sector network perimeters; FortiSandbox is standard in FortiGate NGFW deployments"
    public_sector_nexus: "direct — Fortinet NGFW/sandbox stack is standard in Swiss cantonal and federal environments"
    sector: "government, critical-infrastructure, defence, healthcare, finance"
    cves: [CVE-2026-39808, CVE-2026-39813, CVE-2026-25089]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-to-prior:2026-06-12"
    evidence:
      - quote: "Cybersecurity firm Defused Cyber confirmed it's seen active exploitation of three vulnerabilities in Fortinet FortiSandbox within a 24-hour window. Two of them had patches sitting available since April. The third got fixed last week, which, apparently, wasn't fast enough."
        attribution: "Security Affairs"
        source_url: "https://securityaffairs.com/193709/ai/fortinet-warned-as-three-critical-fortisandbox-bugs-come-under-attack.html"
      - quote: "Attackers have been spotted exploiting three vulnerabilities (CVE-2026-39813, CVE-2026-39808, CVE-2026-25089) in FortiSandbox, a platform that other Fortinet security products depend on for threat verdicts to enforce blocking decisions and trigger automated responses."
        attribution: "Help Net Security"
        source_url: "https://www.helpnetsecurity.com/2026/06/16/fortisandbox-vulnerabilities-cve-2026-39813-cve-2026-39808-cve-2026-25089/"
      - quote: "The exploit for CVE-2026-25089 appears to have been built with AI assistance, and it shows, not in a good way [...] attackers are throwing broken AI-generated code at unpatched systems and still finding traction."
        attribution: "Security Affairs"
        source_url: "https://securityaffairs.com/193709/ai/fortinet-warned-as-three-critical-fortisandbox-bugs-come-under-attack.html"

  - title: "UPDATE: PAN-OS GlobalProtect CVE-2026-0257 — Palo Alto confirms active exploitation by unnamed threat actor, NCSC-CH updates advisory"
    sources:
      - url: "https://unit42.paloaltonetworks.com/active-exploitation-of-pan-os-cve-2026-0257/"
        publisher: "Palo Alto Networks Unit 42"
        date: "2026-06-09"
        role: "primary"
      - url: "https://security.paloaltonetworks.com/CVE-2026-0257"
        publisher: "Palo Alto Networks PSIRT"
        date: "2026-05-13"
        role: "vendor-advisory"
      - url: "https://securityaffairs.com/193638/security/palo-alto-warns-of-exploitation-of-vpn-bypass-exploits-cve-2026-0257-in-pan-os-flaw.html"
        publisher: "Security Affairs"
        date: "2026-06-15"
        role: "corroborating"
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12605"
        publisher: "NCSC-CH Security Hub"
        date: "2026-06-16"
        role: "corroborating"
    discovery_trace: "first seen at: ncsc-csh bridge post 12605 updated 2026-06-16 adding Unit42 active-exploitation warning → primary: Unit42 Threat Brief URL https://unit42.paloaltonetworks.com/active-exploitation-of-pan-os-cve-2026-0257/ → vendor advisory: https://security.paloaltonetworks.com/CVE-2026-0257 → corroborating: Security Affairs 2026-06-15, URL https://securityaffairs.com/193638/security/palo-alto-warns-of-exploitation-of-vpn-bypass-exploits-cve-2026-0257-in-pan-os-flaw.html"
    summary: |
      UPDATE (original story from approximately 2026-06-05, CISA KEV added early June; in-window delta: NCSC-CH Security Hub post 12605 updated 2026-06-16 with Unit42 threat brief confirmation; SecurityAffairs coverage 2026-06-15): CVE-2026-0257 is an authentication bypass (CWE-565: reliance on cookies without validation or integrity checking) in Palo Alto Networks PAN-OS affecting GlobalProtect portal and gateway.

      Exploitation mechanism: When authentication override cookies are enabled on a GlobalProtect portal or gateway, and a specific certificate configuration is present, the `main_DecryptAppAuthCookie` function in PAN-OS decrypts the incoming base64-encoded cookie but performs no signature verification after decryption — the decrypted content is trusted implicitly. An attacker can forge a cookie matching a legitimate user's session, which the gateway then accepts to establish a full VPN tunnel without credentials.

      Earliest observed exploitation: May 17-18, 2026 at 01:51 UTC, originating from Vultr-hosted infrastructure, using the hostname "GP-CLIENT" on a Linux host with spoofed MAC address aa:bb:cc:dd:ee:ff. Rapid7 MDR caught two exploitation waves (May 18 and 21) assessing likely same threat actor. Unit 42 describes attempted VPN access by "an unidentified threat actor" — no post-access behavior or lateral movement confirmed as of June 9.

      Affected versions: PAN-OS 10.2 (< 10.2.7-h34 / < 10.2.10-h36 / < 10.2.13-h21 / < 10.2.16-h7 / < 10.2.18-h6), PAN-OS 11.1 (< 11.1.4-h33 / < 11.1.6-h32 / < 11.1.7-h6 / < 11.1.10-h25 / < 11.1.13-h5 / < 11.1.15), PAN-OS 11.2 (< 11.2.4-h17 / < 11.2.7-h14 / < 11.2.10-h7 / < 11.2.12), PAN-OS 12.1 (< 12.1.4-h6 / < 12.1.7). Prisma Access also affected. Cloud NGFW not affected.

      Required configuration for exposure: GlobalProtect portal or gateway with "Generate cookie for authentication override" or "Accept cookie for authentication override" enabled AND specific certificate configuration. CVSS 4.0 score: 7.8 (HIGH); vendor urgency: HIGHEST ("ATTACKED" exploit maturity). Defender check: navigate to Network > GlobalProtect > Portals/Gateways, Agent tab > Client Settings > Authentication Override to check whether cookie features are enabled. Disable if not operationally required. Detection: web access logs for GlobalProtect portal/gateway showing authentication from unexpected source IPs using cookie-based auth; Rapid7's open-source PoC script can verify appliance exposure.
    ch_eu_nexus: "global; PAN-OS GlobalProtect is widely deployed in Swiss and EU public-sector perimeter defences"
    public_sector_nexus: "direct"
    sector: "all sectors with GlobalProtect deployments"
    cves: [CVE-2026-0257]
    actors_campaigns_malware: ["unidentified threat actor (Unit42)"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-to-prior:2026-06-05"
    evidence:
      - quote: "Palo Alto Networks has become aware of limited exploit attempts on unpatched PAN-OS devices without mitigations applied."
        attribution: "Palo Alto Networks PSIRT"
        source_url: "https://security.paloaltonetworks.com/CVE-2026-0257"
      - quote: "The incoming encrypted cookie is base64 decoded and then decrypted using a private key. The decrypted content is then trusted implicitly, with no signature verification of any kind occurring after decryption."
        attribution: "Rapid7 (via SecurityAffairs)"
        source_url: "https://securityaffairs.com/193638/security/palo-alto-warns-of-exploitation-of-vpn-bypass-exploits-cve-2026-0257-in-pan-os-flaw.html"

  - title: "CVE-2026-48907 — Joomla Content Editor (JCE): unauthenticated PHP file upload to RCE, CISA KEV, automated attacks ongoing (CVSS v4 10.0)"
    sources:
      - url: "https://www.joomlacontenteditor.net/news/jce-security-update-and-a-free-patch-for-older-sites"
        publisher: "Widget Factory / JCE (vendor)"
        date: "2026-06-03"
        role: "primary"
      - url: "https://www.cisa.gov/news-events/alerts/2026/06/16/cisa-adds-one-known-exploited-vulnerability-catalog"
        publisher: "CISA"
        date: "2026-06-16"
        role: "corroborating"
      - url: "https://nvd.nist.gov/vuln/detail/CVE-2026-48907"
        publisher: "NVD/MITRE"
        date: "2026-06-16"
        role: "cveid-verification"
    discovery_trace: "first seen at: cisa-kev bridge — CVE-2026-48907 dateAdded 2026-06-16 (within window) → vendor advisory: https://www.joomlacontenteditor.net/news/jce-security-update-and-a-free-patch-for-older-sites → CISA alert: https://www.cisa.gov/news-events/alerts/2026/06/16/cisa-adds-one-known-exploited-vulnerability-catalog"
    summary: |
      CVE-2026-48907 (CWE-284 Improper Access Control, CVSS v4 10.0 Critical) is an unauthenticated remote-code-execution vulnerability in the Joomla Content Editor (JCE) extension, versions < 2.9.99.5, developed by Widget Factory. JCE is one of the most widely installed third-party Joomla editors, present on a large proportion of public-sector, educational, and SMB Joomla sites across Europe.

      Attack chain (three-stage, fully automated): (1) Unauthenticated attacker POSTs to `index.php?option=com_jce&task=profiles.import` — the profile import endpoint lacks any authentication check. (2) Attacker imports a crafted JCE editor profile that sets `Permitted File Extensions` to include `.php` or other executable extensions for a plugin (Image Manager or File Browser). (3) Attacker uploads a PHP web shell via the editor; the file lands in the `images/` folder by default. Successful exploitation yields OS-level code execution as the web server user.

      Detection: Web server access logs — look for unauthenticated POST requests to `index.php?option=com_jce&task=profiles.import`. Unexplained PHP files in `/images/`, `/media/`, or `/tmp/` directories. In JCE admin (Components > JCE Editor > Editor Profiles): unfamiliar profiles with automatically generated names placed at the top of the profile list, with PHP upload extensions enabled. A compromised site remains vulnerable until patched — attacks are fully automated so lack of a public registration form is not protective.

      Patched in JCE 2.9.99.5 (released 2026-06-03) and further hardened in 2.9.99.6 (2026-06-06). CISA KEV addition 2026-06-16 carries a BOD 26-04 due date of 2026-06-19 (the 3-day tier, highest urgency class). All sites running JCE < 2.9.99.5 should assume compromise and restore from a pre-breach backup after verifying the attack timeline from web logs.
    ch_eu_nexus: "global; Joomla is widely used across Swiss and EU municipal/cantonal websites and smaller public-sector portals"
    public_sector_nexus: "direct — Joomla CMS with JCE editor is standard in European municipal web presence"
    sector: "government, education, SMB, healthcare"
    cves: [CVE-2026-48907]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The vulnerability is being actively exploited, working exploit code is public, and the attacks are automated, so a site with no public registration is not safe."
        attribution: "Widget Factory / JCE (vendor)"
        source_url: "https://www.joomlacontenteditor.net/news/jce-security-update-and-a-free-patch-for-older-sites"
      - quote: "Look for unauthenticated requests to the profile import task, index.php?option=com_jce&task=profiles.import. The earliest matching entry shows when the site was first reached, so restore from a backup taken before that date."
