  - title: "CryptoBandits Windows clipboard hijacker — USB LNK worm propagation and Tor hidden-service C2, cryptocurrency wallets targeted (Trojan:Win32/CryptoBandits.A)"
    sources:
      - url: "https://www.microsoft.com/en-us/security/blog/2026/06/17/crypto-clipper-uses-tor-worm-like-propagation-for-persistence-control/"
        publisher: "Microsoft Security Blog"
        date: "2026-06-17"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/microsoft-details-windows-clipper.html"
        publisher: "The Hacker News"
        date: "2026-06-18"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews RSS feed 2026-06-18 → primary: Microsoft Security Blog 2026-06-17 → corroborated The Hacker News 2026-06-18"
    summary: |
      Microsoft Threat Intelligence detailed Trojan:Win32/CryptoBandits.A (and variants B, JS/CryptoBandits.A/B) on 2026-06-17, active since at least February 2026. Initial infection arrives via malicious `.lnk` shortcut files distributed on USB storage devices. The LNK worm propagation loop: the malware scans attached USB drives for `.doc`, `.xlsx`, and `.pdf` files, hides the originals (hidden attribute), replaces them with same-named LNK files that execute the worm payload on user interaction — a classic removable-media social-engineering chain. Once running, the malware drops obfuscated JavaScript components, deploys scheduled tasks for persistence (both worm component and stealer component), launches a renamed Tor client binary, and registers the victim with three hidden-service endpoints (`/route.php` for beaconing, `/recvf.php` for data exfiltration, `/stub.php` for payload retrieval) via SOCKS5 on localhost:9050. The clipboard hijacker polls every 500 ms for cryptocurrency address patterns (Bitcoin, Ethereum, Tron, Monero) and swaps them silently. The C2 also supports an EVAL command enabling remote code execution. Attribution is currently unassigned. This campaign is relevant beyond the cryptocurrency-theft angle: the USB-LNK worm mechanism has historically crossed into air-gapped and isolated industrial environments; the Tor C2 design makes network-level blocking ineffective without egress filtering that explicitly blocks Tor bridges. Detection: Sysmon EID 1 for WScript/CScript launching `curl.exe`, `cmd.exe`, or `powershell.exe` as parent; process with `localhost:9050` outbound connections (SOCKS5 proxy); scheduled task creation with XML payload referencing obfuscated JavaScript; clipboard API calls at 500ms intervals (ETW Consumer telemetry). Hardening: enforce `NoAutorun`/`NoDriveTypeAutorun` policy; block LNK execution from removable media via Attack Surface Reduction rule `Block execution of potentially obfuscated scripts`; restrict `wscript.exe`/`cscript.exe` to signed scripts via AppLocker or WDAC; Tor traffic (`*.onion` DNS, localhost:9050 SOCKS5) blocked at egress proxy.
    ch_eu_nexus: "global; USB-LNK worm vector is relevant to Swiss government environments that still use removable media for data transfer to isolated systems"
    public_sector_nexus: "indirect"
    sector: "finance, government, all sectors with cryptocurrency exposure"
    cves: []
    actors_campaigns_malware: ["CryptoBandits", "Trojan:Win32/CryptoBandits.A"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The malware scans the USB device for common document files like .doc, .xlsx, .pdf, hides the original files and creates new LNK shortcuts bearing the same names"
        attribution: "Microsoft Security Blog"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/06/17/crypto-clipper-uses-tor-worm-like-propagation-for-persistence-control/"
      - quote: "CryptoBandits monitors clipboard activity every 500 milliseconds to extract seed phrases and private keys...WScript, CScript, or related script engines launch curl, cmd.exe, PowerShell"
        attribution: "Microsoft Security Blog"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/06/17/crypto-clipper-uses-tor-worm-like-propagation-for-persistence-control/"

