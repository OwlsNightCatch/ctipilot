  - title: "Cisco ISE CVE-2026-20181 / CVE-2026-20190 — two-vector attack chain: unauthenticated credential harvest feeds authenticated root RCE, full ISE 3.5 patch deferred to August"
    sources:
      - url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-ise-multi-G5WP8vv"
        publisher: "Cisco PSIRT"
        date: "2026-06-17"
        role: "primary"
      - url: "https://www.securityweek.com/critical-command-execution-vulnerability-patched-in-cisco-ise/"
        publisher: "SecurityWeek"
        date: "2026-06-17"
        role: "corroborating"
      - url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-1989"
        publisher: "BSI CERT-Bund"
        date: "2026-06-17"
        role: "corroborating"
    discovery_trace: "first seen at: bsi-de RSS (bridge), WID-SEC-2026-1989 published 2026-06-17 → primary: Cisco PSIRT cisco-sa-ise-multi-G5WP8vv → corroborated SecurityWeek 2026-06-17"
    summary: |
      Cisco published advisory cisco-sa-ise-multi-G5WP8vv on 2026-06-17 covering two vulnerabilities in Cisco Identity Services Engine (ISE) and ISE Passive Identity Connector (ISE-PIC). CVE-2026-20190 (CVSS 7.5): improper authorization checks allow an unauthenticated remote attacker to read sensitive information from the device via crafted HTTP requests, including hashed administrative credentials. CVE-2026-20181 (CVSS 9.1, CWE-22): an authenticated administrator can send a crafted HTTP request to execute arbitrary OS commands and escalate to root; on single-node deployments exploitation also causes a DoS condition. The operationally critical aspect is the two-vector chain: CVE-2026-20190 gives an unauthenticated attacker hashed credentials from the management interface; offline cracking or pass-the-hash reuse then provides the admin-level authentication required for CVE-2026-20181, converting a network-accessible ISE appliance into a root-code-execution target without interactive credentials. Fixed versions: ISE 3.3 Patch 11 and 3.4 Patch 6 are available now; ISE 3.5 Patch 4 is scheduled for August 2026 (3.5 Patch 3 covers CVE-2026-20190 only). Cisco PSIRT reports no known exploitation. Cisco ISE is ubiquitous in large network-access control (NAC) and 802.1X deployments across Swiss and European public-sector networks; a compromised ISE node gives RADIUS and identity-policy control. Detection: network-level anomaly on HTTPS management port; ISE application logs showing unexpected API calls to the affected endpoints; syslog ERS-API request anomalies. Hardening: restrict management-plane access to trusted subnets; apply patches urgently; for ISE 3.5 deployments apply Patch 3 immediately to close CVE-2026-20190 and plan the August upgrade.
    ch_eu_nexus: "direct — Cisco ISE is widely deployed in Swiss government and cantonal 802.1X/NAC infrastructure; compromise yields RADIUS/AD identity-plane control"
    public_sector_nexus: "direct"
    sector: "government, education, finance, healthcare"
