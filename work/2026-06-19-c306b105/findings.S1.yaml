  - title: "Drupal Core June 2026 security release — CVE-2026-55803 PHP object injection (Critical), CVE-2026-55804 gadget chain (Moderately critical), plus four further advisories"
    sources:
      - url: "https://www.drupal.org/sa-core-2026-005"
        publisher: "Drupal Security Team"
        date: "2026-06-17"
        role: "primary"
      - url: "https://www.drupal.org/sa-core-2026-006"
        publisher: "Drupal Security Team"
        date: "2026-06-17"
        role: "primary"
      - url: "https://www.drupal.org/sa-core-2026-007"
        publisher: "Drupal Security Team"
        date: "2026-06-17"
        role: "corroborating"
      - url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-2002"
        publisher: "BSI CERT-Bund"
        date: "2026-06-18"
        role: "corroborating"
    discovery_trace: "first seen at: bsi-de RSS (bridge), WID-SEC-2026-2002 published 2026-06-18, tagged kritisch → fetched BSI CSAF showing external references → fetched drupal.org sa-core-2026-005 through sa-core-2026-009 directly"
    summary: |
      The Drupal Security Team released six advisories on 2026-06-17, fixed in Drupal 10.5.12, 10.6.11, 11.2.14, and 11.3.12. The lead advisory is SA-CORE-2026-005 / CVE-2026-55803 (Critical, 18/25): a PHP object injection flaw in the JSON:API module where an attacker with JSON:API write permission against an entity using a serialized custom field type can inject a malicious serialized payload. No field type shipped in Drupal Core meets the prerequisite; the vulnerability requires: (a) JSON:API write access enabled (off by default), and (b) a contributed or custom entity-reference field that serializes its property. SA-CORE-2026-006 / CVE-2026-55804 (Moderately critical, 14/25) adds a deserialization gadget chain — not independently exploitable but provides the execution primitive for CVE-2026-55803 if attacker-controlled input reaches `unserialize()`. SA-CORE-2026-007 / CVE-2026-55806 (Less critical, 9/25): the `rebuild.php` script doesn't validate the Host header against trusted host patterns, enabling cache poisoning or open redirect. SA-CORE-2026-008 / CVE-2026-55807 (Moderately critical): SSRF through the Media module's oEmbed URL discovery mechanism. SA-CORE-2026-009 / CVE-2026-55808 (Moderately critical): JSON:API and REST image-upload endpoints validate file extension but not MIME type, allowing non-image file upload that some server configurations may serve with a permissive MIME type. Drupal reports no active exploitation of any of these. Drupal is prominent in Swiss and EU public-sector websites (government portals, NGOs, universities). Patch path: update to the fixed releases; for sites that cannot immediately update, disabling JSON:API write access and configuring trusted host patterns mitigates the most severe issues.
    ch_eu_nexus: "direct — Drupal powers numerous Swiss federal and cantonal government websites and EU institution portals"
    public_sector_nexus: "direct"
    sector: "government, education, NGO"
    cves: [CVE-2026-55803, CVE-2026-55804, CVE-2026-55806, CVE-2026-55807, CVE-2026-55808]
    actors_campaigns_malware: []
