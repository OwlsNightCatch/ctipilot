  - title: "pgAdmin 4 v9.16 — seven security CVEs including unauthenticated pickle RCE (CVE-2026-12046, CVSS 9.5) and AI-assistant RCE chain (CVE-2026-12045, CVSS 9.4), released 2026-06-18"
    sources:
      - url: "https://www.pgadmin.org/docs/pgadmin4/9.16/release_notes_9_16.html"
        publisher: "pgAdmin (PostgreSQL Global Development Group)"
        date: "2026-06-18"
        role: "primary"
      - url: "https://github.com/pgadmin-org/pgadmin4/issues/10072"
        publisher: "pgAdmin GitHub"
        date: "2026-06-18"
        role: "corroborating"
      - url: "https://github.com/pgadmin-org/pgadmin4/issues/10022"
        publisher: "pgAdmin GitHub"
        date: "2026-06-18"
        role: "corroborating"
    discovery_trace: "first seen at: enisa-euvd recent criticals (bridge), EUVD-2026-37966 and EUVD-2026-37965 published 2026-06-18 with CVSS 9.5 and 9.4 → primary: pgAdmin release notes 9.16 → GitHub issues confirming all seven CVEs"
    summary: |
      pgAdmin 4 v9.16 (released 2026-06-18) patches seven security CVEs across pgAdmin 4 v6.0–9.15. The most severe are: CVE-2026-12046 (CVSS 4.0: 9.5, CWE-306): Two SQL Editor endpoints — `DELETE /sqleditor/close/<trans_id>` and `POST /sqleditor/initialize/sqleditor/update_connection/<sgid>/<sid>/<did>` — are missing the `@pga_login_required` decorator in server mode, making them reachable unauthenticated. Both endpoints reach a `pickle.loads()` deserialization sink on session `gridData[trans_id]['command_obj']`. Full exploitation to RCE additionally requires knowledge of Flask's `SECRET_KEY` and write access to the sessions directory, but those preconditions may exist in shared-hosting environments or following partial compromise. CVE-2026-12045 (CVSS 4.0: 9.4): The AI Assistant's `execute_sql_query` tool wraps LLM-generated SQL in a `BEGIN TRANSACTION READ ONLY` block but forwards multi-statement payloads verbatim; a COMMIT/ROLLBACK prefix escapes the read-only wrapper, enabling full DML and — via `COPY ... TO PROGRAM` on a superuser database role — OS command execution. Delivery is via prompt injection into any database object the AI Assistant reads. CVE-2026-12048 (CVSS 4.0: 9.3): stored XSS via PostgreSQL server error text and EXPLAIN plan node content injected through `html-react-parser` without sanitisation across toasts, modals, and SQL editor flows. CVE-2026-12044: SQL injection in sixteen dialog-template `COMMENT ON` operations. Fixed in pgAdmin 4 v9.16 for all supported releases. pgAdmin is widely used in Swiss and European public-sector PostgreSQL deployments as the primary GUI admin tool. Detection for CVE-2026-12046: pgAdmin server logs for unauthenticated requests to `/sqleditor/close/` and `/sqleditor/initialize/sqleditor/update_connection/`. Detection for CVE-2026-12045: review pgAdmin AI-assistant query logs for COMMIT/END/ROLLBACK/ABORT as leading tokens in LLM-generated queries. Hardening: restrict pgAdmin server-mode network access to trusted admin subnets; rotate Flask SECRET_KEY; update to v9.16 immediately.
    ch_eu_nexus: "direct — pgAdmin is the dominant GUI for PostgreSQL management in Swiss and EU government and university database teams"
    public_sector_nexus: "direct"
    sector: "government, education, finance, research"
