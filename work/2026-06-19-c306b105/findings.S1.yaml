  - title: "F5 NGINX CVE-2026-42530 / CVE-2026-42055 — unauthenticated RCE in HTTP/3 and HTTP/2 proxy modules, CVSS 9.2, out-of-band patches"
    sources:
      - url: "https://thehackernews.com/2026/06/f5-patches-two-critical-nginx-open.html"
        publisher: "The Hacker News"
        date: "2026-06-18"
        role: "primary"
      - url: "https://securityaffairs.com/193842/security/f5-patches-critical-nginx-vulnerabilities-enabling-unauthenticated-code-execution.html"
        publisher: "Security Affairs"
        date: "2026-06-18"
        role: "corroborating"
      - url: "https://nginx.org/en/security_advisories.html"
        publisher: "NGINX"
        date: "2026-06-17"
        role: "corroborating"
      - url: "https://nvd.nist.gov/vuln/detail/CVE-2026-42530"
        publisher: "NVD"
        date: "2026-06-17"
        role: "corroborating"
      - url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-1995"
        publisher: "BSI CERT-Bund"
        date: "2026-06-17"
        role: "corroborating"
    discovery_trace: "first seen at: bsi-de RSS (bridge), WID-SEC-2026-1995 published 2026-06-17 → pivot to NGINX security advisories page → pivot to NVD CVE-2026-42530 + CVE-2026-42055 → corroborated via The Hacker News article 2026-06-18 + Security Affairs 2026-06-18 → F5 advisory K000161616"
    summary: |
      F5 released out-of-band security patches on 2026-06-17 for two critical CVSS v4.0 9.2 vulnerabilities in NGINX Open Source and NGINX Plus. CVE-2026-42530 is a use-after-free (CWE-416) in the ngx_http_v3_module: a remote unauthenticated attacker can craft an HTTP/3 QUIC session that reopens a QPACK encoder stream, triggering a worker-process crash or — when ASLR is disabled or bypassed — arbitrary code execution. The vulnerability affects NGINX Open Source 1.31.0–1.31.1, NGINX Gateway Fabric 1.3.0–1.6.2 / 2.0.0–2.6.3, and NGINX Instance Manager / Ingress Controller across 3.x–5.x lines. Mitigation: disable HTTP/3 (`listen [::]:443 quic` removed from config) or update to Open Source 1.31.2 / Gateway Fabric 2.6.4. CVE-2026-42055 is a heap-based buffer overflow (CWE-122) in the ngx_http_proxy_v2_module and ngx_http_grpc_module: exploitation requires `proxy_http_version 2` or `grpc_pass` directives, `ignore_invalid_headers off`, and `large_client_header_buffers` set to >2 MB — a non-default configuration triple. Vulnerable: Open Source 1.13.10–1.31.1 (stable branch < 1.30.3; mainline < 1.31.2) and NGINX Plus R33–R36 / 37.0.0–37.0.1. NGINX Plus R36 P6 / 37.0.2.1 contain the fix. Two additional high-severity flaws (CVE-2026-11311, CVE-2026-50107, CVSS not separately stated) allow an authenticated attacker to inject arbitrary NGINX configuration directives into NGINX Gateway Fabric. F5 reports no active in-wild exploitation of any of these four CVEs at time of publication. Detection: web-server access logs showing malformed HTTP/3 QPACK session restarts or oversized headers; worker-process crash logs (`nginx: worker process ... exited on signal 11`) are a direct indicator for CVE-2026-42530 exploitation attempts. Hardening: audit nginx.conf for the prerequisite triple on CVE-2026-42055; all deployments should update regardless given the breadth of affected products.
    ch_eu_nexus: "global; NGINX underpins a large fraction of Swiss and EU public-sector web infrastructure, reverse proxies, and Kubernetes ingress"
    public_sector_nexus: "indirect — NGINX is the dominant reverse proxy in Swiss cantonal and federal web farms"
    sector: "government, telco, cloud, e-commerce"
    cves: [CVE-2026-42530, CVE-2026-42055, CVE-2026-11311, CVE-2026-50107]
