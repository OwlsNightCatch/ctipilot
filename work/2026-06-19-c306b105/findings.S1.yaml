  - title: "CVE-2026-50656 RoguePlanet — unpatched Windows Defender Malware Protection Engine EoP (CWE-59) to SYSTEM via TOCTOU race; public PoC, patch development acknowledged by Microsoft"
    sources:
      - url: "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-50656"
        publisher: "Microsoft MSRC"
        date: "2026-06-16"
        role: "primary"
      - url: "https://www.helpnetsecurity.com/2026/06/17/rogueplanet-zero-day-cve-2026-50656/"
        publisher: "Help Net Security"
        date: "2026-06-17"
        role: "corroborating"
      - url: "https://thehackernews.com/2026/06/microsoft-confirms-rogueplanet-defender_02022423645.html"
        publisher: "The Hacker News"
        date: "2026-06-17"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews RSS feed item 2026-06-17 'Microsoft Confirms RoguePlanet Defender Zero-Day' → primary: MSRC CVE-2026-50656 page → corroborated Help Net Security 2026-06-17 + NVD 2026-06-16"
    summary: |
      CVE-2026-50656 (CVSS 3.1 Microsoft: 7.8 HIGH; NVD: 7.0 HIGH; CWE-59 Improper Link Resolution Before File Access) is a local elevation-of-privilege zero-day in the Microsoft Malware Protection Engine (mpengine.dll), used by Microsoft Defender on all Windows 10 and Windows 11 versions. Researcher Nightmare Eclipse / Chaotic Eclipse disclosed the PoC on 2026-06-09, the day of the June 2026 Patch Tuesday, as the fourth in a serialised zero-day campaign (BlueHammer, UnDefend, RedSun, GreenPlasma, YellowKey all preceded it). The exploit abuses a TOCTOU race condition: during a file scan, Defender checks a file path and later reopens it for analysis; the exploit replaces the original file with a malicious one in the window between check and use, causing Defender to spawn a shell with SYSTEM privileges. Prerequisites: local authenticated access, low privileges; no user interaction required; works regardless of Defender Real-Time Protection status. Microsoft rated the exploitability as "Exploitation More Likely." The researcher acknowledges the race makes the exploit non-deterministic ("hit or miss"), but claims 100% success rate on specific machines and notes signature-based mitigations are trivially defeated by minor PoC modifications. As of 2026-06-18 no patch is available; Microsoft states a fix is in development with no timeline. This is the fifth Nightmare Eclipse Windows zero-day in a series spanning April–June 2026 (NCSC-CH tracks the series in post 12622). Note: this item extends prior coverage of the Chaotic Eclipse zero-day wave (covered in 2026-W24 as a multi-day item) — the material delta is the CVE assignment (CVE-2026-50656), Microsoft's acknowledgement, and the MSRC "Exploitation More Likely" classification issued 2026-06-16/17. Detection: Windows Security Center alert suppression patterns; process-tree watch for mpengine.dll or MsMpEng.exe spawning cmd.exe or PowerShell as SYSTEM (Sysmon EID 1 with parent image `C:\Program Files\Windows Defender\MsMpEng.exe`); WEL 4688 process-creation audit for unexpected child processes of MsMpEng. Hardening: no patch available; apply defence-in-depth via Privileged Identity Management to limit accounts capable of triggering scans; monitor EDR alerting for MsMpEng SYSTEM children.
    ch_eu_nexus: "universal — Microsoft Defender is the default AV/EDR on all managed Windows endpoints including Swiss public-sector workstations"
