  - title: "ESET: Gentlemen ransomware gang maintains operator-curated portfolio of eight EDR killer variants — BYOVD targets 48 vendors, 400+ processes"
    sources:
      - url: "https://www.welivesecurity.com/en/eset-research/killing-me-gently-inside-gentlemens-edr-killer-framework/"
        publisher: "ESET Research (WeLiveSecurity)"
        date: "2026-06-18"
        role: "primary"
      - url: "https://krebsonsecurity.com/2026/06/who-runs-the-ransomware-group-the-gentlemen/"
        publisher: "Krebs on Security"
        date: "2026-06-10"
        role: "corroborating"
    discovery_trace: "first seen at: eset (welivesecurity), URL https://www.welivesecurity.com/feed/ → primary: ESET WeLiveSecurity, URL https://www.welivesecurity.com/en/eset-research/killing-me-gently-inside-gentlemens-edr-killer-framework/"
    summary: |
      ESET's months-long investigation into the Gentlemen RaaS gang reveals a centralised, operator-maintained EDR-killing framework called GentleKiller with at least eight documented variants, each abusing a different legitimate driver via BYOVD: the Kaspersky variant abuses eb.sys (a rootkit); the FACEIT Anti-Cheat variant abuses NSecKrnl (nseckrnl.sys); the Valorant variant abuses GameDriverX64.sys (CVE-2025-61155); the Javelin variant abuses Safetica ProcessMonitor (stpm_old/new.sys); the WatchDog variant abuses Zemana WatchDog (dmx.sys); and the Network Blocker variant abuses Qihoo 360 (360netmon_wfp.sys). Three additional third-party tools are integrated: HexKiller (using Baidu BdApi googleApiUtil64.sys), ThrottleBlood (TechPowerUp), and HavocKiller (Huawei Audio havoc.sys — CVE publicly disclosed 19 March 2026 but operationally used since 23 January 2026). The framework targets over 400 security processes mapped to 48 EDR/AV vendors including CrowdStrike, SentinelOne, Sophos, ESET, Defender, and 44 others. Operators apply unified evasion: Enigma/Themida binary packing, invalid copies of legitimate digital certificates from Norton/Kaspersky/Symantec/Avast/SentinelOne, and fabricated version info. The Rust-based credential stealer OxideHarvest (attributed to affiliate "quant"/buildx641) targets Chromium and Gecko browsers with parallel multi-thread crawling. ESET identifies the gang's founder as "hastalamuerte" (also "zeta88"), with prior affiliations to Qilin, Embargo, LockBit, Medusa, and BlackLock; the gang offers affiliates a 90% cut. Unlike US-centric peers, Gentlemen shows globally distributed victimology with notable Southeast Asia, South America, and Western Europe targeting. A May 2026 internal data leak confirmed the operator-maintained EDR-killing model.
    ch_eu_nexus: "direct — Western Europe and France explicitly identified in victimology; gang previously affiliated with EU-targeting groups (Embargo, Qilin)"
    public_sector_nexus: "indirect — Gentlemen's sector-agnostic opportunistic targeting includes public-sector organisations; 48 targeted EDR vendors include products common in EU public-sector estates"
    sector: "cross-sector ransomware"
    cves: []
    actors_campaigns_malware: ["Gentlemen RaaS", "GentleKiller", "OxideHarvest", "HavocKiller", "ThrottleBlood", "HexKiller", "hastalamuerte", "Storm-2697"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
