    extended_notes: |
      Enterprise relevance is limited but non-zero: developer workstations running Steam with Wallpaper Engine in a corporate environment are an exposure path. Detection: DarkKomet uses port 1604 by default; Lumma and Vidar are common infostealer families with extensive Sigma coverage. The AggregatorHost.dll hijack targeting Steam credentials is noteworthy for organisations where Steam accounts are linked to business email. T1218 (System Binary Proxy Execution — wallpaper app as execution proxy).

