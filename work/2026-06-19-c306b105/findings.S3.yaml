    summary: |
      Kaspersky researchers documented a campaign abusing Steam Workshop's Wallpaper Engine "application wallpapers" (standalone executable wallpapers) to distribute multiple malware families since August 2025. Fourteen malicious wallpapers were identified (all subsequently removed by Steam at publication). The infection mechanism exploits Wallpaper Engine's native code-execution capability for application wallpapers: attackers upload archives containing executables that, when run, drop a backdoor (Synaptics.exe) and a loader (._cache_GAME1.exe) that launches a legitimate game as a distraction while installing a compromised AggregatorHost.dll that targets the Steam application to harvest session credentials. Malware families delivered include DarkKomet backdoor, Lumma infostealer, Vidar infostealer, RenEngine loader, crypto miners, ransomware variants, and botnet loaders. Evasion techniques include password-protected archives with credentials embedded in filenames or JSON config files, and legitimate-appearing gameplay during infection. Geographic distribution: 89% China, 5.5% Russia, with Germany listed in the sub-1.5% category alongside Singapore, Hong Kong, Vietnam, India, and Canada — confirming European exposure.
    ch_eu_nexus: "indirect — Germany listed in victim distribution; EU users of Wallpaper Engine (100,000+ daily active users) are exposed; no Switzerland-specific targeting identified"
