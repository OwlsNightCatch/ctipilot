        attribution: "ESET Research"
        source_url: "https://www.welivesecurity.com/en/eset-research/killing-me-gently-inside-gentlemens-edr-killer-framework/"
      - quote: "Targets over 400 security processes mapped to 48 products"
        attribution: "ESET Research"
        source_url: "https://www.welivesecurity.com/en/eset-research/killing-me-gently-inside-gentlemens-edr-killer-framework/"
    extended_notes: |
      Detection: Monitor for suspicious service creation loading any of the named drivers (eb.sys, nseckrnl.sys, GameDriverX64.sys, stpm_old.sys, stpm_new.sys, dmx.sys, 360netmon_wfp.sys, googleApiUtil64.sys, ThrottleBlood.sys, havoc.sys); watch for DeviceIoControl calls from unexpected executables; hunt for process-termination loops targeting security software; alert on GentlemenCollection directory creation; check for invalid digital signatures impersonating major AV vendors. Drivers loaded as Windows services (T1543.003). The 23-January-2026 operational use of HavocKiller predates the public March 2026 PoC disclosure by 55 days — rapid PoC operationalisation is documented operational pattern.
      MITRE: T1543.003, T1574.002, T1036, T1036.001, T1027, T1685, T1106, T1059.003.

  - title: "DragonForce Backdoor.Turn: first-known malware abusing Microsoft Teams TURN relay for covert QUIC C2, combined with 5-driver BYOVD EDR kill"
    sources:
      - url: "https://www.security.com/threat-intelligence/dragonforce-msteams-backdoor"
        publisher: "Broadcom / Symantec Threat Intelligence"
        date: "2026-06-16"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/dragonforce-hackers-abuse-microsoft.html"
        publisher: "The Hacker News"
        date: "2026-06-18"
        role: "corroborating"
      - url: "https://www.helpnetsecurity.com/2026/06/16/dragonforce-microsoft-teams-malware-backdoor-turn/"
        publisher: "Help Net Security"
        date: "2026-06-16"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed, URL https://feeds.feedburner.com/TheHackersNews → primary: Broadcom/Symantec, URL https://www.security.com/threat-intelligence/dragonforce-msteams-backdoor → WebSearch confirmed June 16 publication date"
    summary: |
      Broadcom's Symantec and Carbon Black teams documented Backdoor.Turn, a custom Go-based RAT deployed by a DragonForce RaaS affiliate (Hackledorb) against a major U.S. services firm. The backdoor's novel C2 technique — described as "the first known case of a malware or group using this specific technique" — obtains an anonymous Teams visitor token via Microsoft's Skype-backed identity services, routes the initial connection through a legitimate Microsoft TURN relay server, and then establishes a QUIC session to the actual attacker C2. Network defenders see only outbound connections to legitimate Microsoft infrastructure. The implant was installed post-ransomware-deployment in December 2025 for persistent re-entry or resale, and the intrusion ran undetected for 1–2 months. Initial access was via SQL/MSSQL server exploitation. The attack chain includes DLL sideloading (vboxrt.dll via legitimate VirtualBox binary), then a five-driver BYOVD sequence: HWAuidoOs2Ec.sys (Huawei, novel "Havoc Process Terminator" exploitation method), wsftprm.sys (Topaz Antifraud, CVE-2023-52271), GameDriverX64.sys (Tower of Fantasy, CVE-2025-61155), K7RKScan.sys (K7 Security, CVE-2025-1055), and ABYSSWORKER (custom driver impersonating a Palo Alto product). Backdoor.Turn capabilities include command execution, network scanning with TLS certificate/webpage title capture, LDAP/AD enumeration (ADExplore), credential-based lateral movement, and browser credential theft.
    ch_eu_nexus: "indirect — U.S. victim named; DragonForce RaaS is globally distributed and previously active against EU targets; ABYSSWORKER driver is documented in separate EU-facing intrusions"
    public_sector_nexus: "indirect — DragonForce targets public-sector organisations in other campaigns; BYOVD techniques transferable across targets"
    sector: "cross-sector"
    cves: [CVE-2023-52271, CVE-2025-61155, CVE-2025-1055]
    actors_campaigns_malware: ["DragonForce", "Hackledorb", "Backdoor.Turn", "ABYSSWORKER"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "the first known case of a malware or group using this specific technique"
        attribution: "Broadcom / Symantec Threat Intelligence"
        source_url: "https://www.security.com/threat-intelligence/dragonforce-msteams-backdoor"
      - quote: "The attackers were on the victim network for between one and two months"
        attribution: "Broadcom / Symantec Threat Intelligence"
        source_url: "https://www.security.com/threat-intelligence/dragonforce-msteams-backdoor"
    extended_notes: |
      Detection: Hunt for DeviceIoControl calls from unexpected processes against any of the five named drivers; alert on anonymous Teams visitor token requests originating from non-Teams processes; monitor for QUIC sessions established from DbgView64.exe; watch for vboxrt.dll loaded by non-VirtualBox executables. Defenders in Teams-heavy environments should baseline expected TURN relay usage and alert on anomalous QUIC traffic to Teams infrastructure from server processes. MITRE: T1190, T1574.002, T1547.010, T1087.002, T1018, T1555.003, T1486.

  - title: "Microsoft discloses USB-LNK-worm + Tor-C2 cryptocurrency clipper campaign: WSH/ActiveX + PyArmor, active since February 2026"
    sources:
      - url: "https://www.microsoft.com/en-us/security/blog/2026/06/17/crypto-clipper-uses-tor-worm-like-propagation-for-persistence-control/"
        publisher: "Microsoft Defender Security Research Team"
        date: "2026-06-17"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/microsoft-details-windows-clipper.html"
        publisher: "The Hacker News"
        date: "2026-06-18"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed, URL https://feeds.feedburner.com/TheHackersNews → primary: Microsoft Security Blog, URL https://www.microsoft.com/en-us/security/blog/2026/06/17/crypto-clipper-uses-tor-worm-like-propagation-for-persistence-control/"
    summary: |
      Microsoft Defender's research team disclosed a multi-component cryptocurrency-theft campaign active since February 2026. The malware combines a USB-based LNK worm with a Tor-C2 clipboard hijacker and screenshot exfiltrator. The worm component: distributes via malicious .lnk shortcut files on removable drives; scans USBs for DOC/XLSX/PDF files, hides originals, and creates deceptive LNK replacements; checks for prior infection before deploying payload; establishes persistence via XML-defined scheduled tasks in C:\Users\Public\Documents\[5-char-folder]\. The clipper/stealer uses Windows Script Host (WScript) and ActiveXObject for execution, deploys a portable Tor binary (renamed ugate.exe) establishing SOCKS5 on localhost:9050, and communicates with .onion hidden services (10 identified) over HTTP via three endpoints: /route.php (beacon/commands), /recvf.php (file upload), /stub.php (payload download). Collection targets 12/24-word BIP39 seed phrases, Ethereum/Bitcoin WIF private keys, and replaces cryptocurrency addresses across Bitcoin legacy/P2SH/Taproot/Bech32, Tron, and Monero. Screenshots captured every 10 seconds (5 per incident). Multi-layer obfuscation includes dual-layer JavaScript, PyArmor-protected Python installer, and anti-analysis Task Manager detection via WMI Win32_Process. Microsoft Defender detects as Trojan:Win32/CryptoBandits.A/B and Trojan:JS/CryptoBandits.A/B.
    ch_eu_nexus: "indirect — campaign is global; USB distribution vector relevant for any environment using removable media"
    public_sector_nexus: "indirect — financial-workflow systems handling cryptocurrency custody relevant; USB vector relevant for air-gapped/limited-internet environments"
    sector: "financial, cryptocurrency"
    cves: []
    actors_campaigns_malware: ["CryptoBandits"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "relies on Windows Script Host and ActiveX-driven logic to launch a bundled Tor proxy and poll a hidden-service C2 server"
        attribution: "Microsoft Defender Security Research Team"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/06/17/crypto-clipper-uses-tor-worm-like-propagation-for-persistence-control/"
    extended_notes: |
      Detection signals: WScript/CScript spawning curl, cmd.exe, or PowerShell; curl invoked with --socks5-hostname parameter; localhost:9050 SOCKS5 connections; scheduled task creation with 5-character naming convention in C:\Users\Public\Documents\; ugate.exe process execution; clipboard-polling loops at 500ms intervals (T1115). USB AutoRun/AutoPlay must be disabled via GPO. Restrict wscript.exe/cscript.exe on servers. Block LNK execution from removable drives. MITRE: T1027, T1053, T1115, T1113, T1071, T1090, T1041.

  - title: "EvilTokens PhaaS: OAuth 2.0 device-code flow weaponised for token theft and BEC, AI-augmented with Groq LLaMA pipeline — Switzerland listed in victim geography"
    sources:
      - url: "https://www.welivesecurity.com/en/cybercrime/eviltokens-phishing-doesnt-steal-password/"
        publisher: "ESET / WeLiveSecurity"
        date: "2026-06-15"
        role: "primary"
      - url: "https://blog.sekoia.io/new-widespread-eviltokens-kit-device-code-phishing-as-a-service-part-1/"
        publisher: "Sekoia TDR"
        date: "2026-03-30"
        role: "corroborating"
    discovery_trace: "first seen at: eset (welivesecurity), URL https://www.welivesecurity.com/feed/ → ESET June 15 article cites Sekoia primary → Sekoia Part 1 URL https://blog.sekoia.io/new-widespread-eviltokens-kit-device-code-phishing-as-a-service-part-1/ (March 30, out-of-window primary, cited as background)"
    summary: |
      ESET's June 15 write-up provides practitioner-level coverage of the EvilTokens PhaaS kit, which has been in active operation since February 2026 and was first documented by Sekoia in March. The kit weaponises Microsoft's OAuth 2.0 Device Authorization Grant flow: the attacker requests a device code from /oauth2/v2.0/devicecode, delivers a lure (impersonating Adobe, DocuSign, SharePoint, calendar invites, voicemail notifications) that directs the victim to the legitimate microsoft.com/devicelogin page, and harvests the resulting access and refresh tokens — bypassing MFA because the victim authenticates on a genuine Microsoft page. Primary Refresh Tokens (PRTs) can then be generated for silent SSO across all Microsoft 365 applications. The backend REST API exposes /api/prt/convert, /api/prt/refresh, /api/prt/cookie (x-ms-RefreshTokenCredential), and /api/prt/owa-session for persistent post-compromise access. Sekoia Part 2 (April 7, 2026) revealed AI-augmented BEC automation via Groq API: Stage 1 processes up to 5,000 emails using llama-3.1-8b-instant to identify finance-related threads; Stage 2 uses llama-3.3-70b-versatile to generate three draft BEC emails targeting each victim. Scale: over 1,000 domains hosting EvilTokens pages, ~280 Telegram subscribers, $1,500 lifetime + $500/month affiliate pricing. Switzerland is explicitly listed among impacted countries by Sekoia.
    ch_eu_nexus: "direct — Switzerland explicitly listed in impacted countries by Sekoia; France also listed; targets finance, HR, logistics, and sales personnel, all common M365 enterprise profiles in Swiss public-sector"
    public_sector_nexus: "direct — Swiss public-sector M365 users are in-scope targets; device-code phishing bypasses conditional access policies that only restrict password-based flows"
    sector: "cross-sector, financial, government"
    cves: []
    actors_campaigns_malware: ["EvilTokens", "eviltokensadmin"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "tricks victims into completing legitimate authentication on real Microsoft pages"
        attribution: "ESET / WeLiveSecurity"
        source_url: "https://www.welivesecurity.com/en/cybercrime/eviltokens-phishing-doesnt-steal-password/"
      - quote: "Over 1,000 results from URL pattern queries for /api/device/start and /api/device/status/"
        attribution: "Sekoia TDR"
        source_url: "https://blog.sekoia.io/new-widespread-eviltokens-kit-device-code-phishing-as-a-service-part-1/"
    extended_notes: |
      Detection: In Entra ID sign-in logs, hunt for device-code grant type (OAuth device flow) logins from unfamiliar devices or geographic anomalies; inspect refresh token usage without corresponding interactive sign-ins; audit new device registrations. Conditional Access hardening: create a CA policy blocking device-code flow for all cloud apps except explicitly whitelisted device types; restrict the /devicelogin endpoint. For BEC follow-on: monitor Graph API calls to /v1.0/me/messages with unusually large message counts from new tokens. MITRE: T1078.004, T1556.006 (MFA bypass via token theft), T1528 (Steal Application Access Token).

  - title: "F5 out-of-band patches for NGINX: CVE-2026-42530 (use-after-free, HTTP/3 QUIC, CVSS 9.2) and CVE-2026-42055 (heap overflow, HTTP/2 proxy, CVSS 9.2) — no exploitation reported yet"
    sources:
      - url: "https://nginx.org/en/security_advisories.html"
        publisher: "NGINX (F5)"
        date: "2026-06-17"
        role: "primary"
      - url: "https://www.securityweek.com/f5-patches-critical-high-severity-nginx-vulnerabilities/"
        publisher: "SecurityWeek"
        date: "2026-06-18"
        role: "corroborating"
      - url: "https://nvd.nist.gov/vuln/detail/CVE-2026-42530"
        publisher: "NIST NVD"
        date: "2026-06-17"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed, URL https://feeds.feedburner.com/TheHackersNews → NVD for CVE details, URL https://nvd.nist.gov/vuln/detail/CVE-2026-42530 → NGINX official advisory page, URL https://nginx.org/en/security_advisories.html → SecurityWeek corroboration, URL https://www.securityweek.com/f5-patches-critical-high-severity-nginx-vulnerabilities/"
    summary: |
      F5 released out-of-band security patches on June 17, 2026 for two critical NGINX vulnerabilities. CVE-2026-42530 (CWE-416 use-after-free, CVSS v4 9.2 / CVSS v3.1 8.1): affects ngx_http_v3_module in NGINX Open Source 1.31.0–1.31.1; a remote unauthenticated attacker sends a crafted HTTP/3 session that reopens a QPACK encoder stream, causing memory corruption in the worker process; code execution is possible when ASLR is disabled or bypassable; mitigation is to disable HTTP/3 support. Patch: NGINX Open Source 1.31.2+, NGINX Gateway Fabric 2.6.4. CVE-2026-42055 (CWE-122 heap-based buffer overflow, CVSS v4 9.2 / CVSS v3.1 8.1): affects ngx_http_proxy_v2_module and ngx_http_grpc_module in NGINX Open Source 1.13.10–1.31.1 and NGINX Plus R36–R36 P5 / 37.0–37.0.2.0; prerequisites are proxy_http_version set to 2 or grpc_pass directives, ignore_invalid_headers off, AND large_client_header_buffers larger than 2 MB; remote unauthenticated exploitation results in worker restart or, if ASLR bypassed, code execution; mitigation is to remove ignore_invalid_headers off or reduce buffer size. Patch: NGINX Open Source 1.31.2+ / 1.30.3+, NGINX Plus R36 P6 / 37.0.2.1. No active exploitation reported at publication. Note: the SecurityWeek article references a previous NGINX exploitation case, and F5 notes NGINX has recently been targeted.
    ch_eu_nexus: "indirect — NGINX is extremely common as a reverse proxy and load balancer in Swiss and EU public-sector web infrastructure"
    public_sector_nexus: "indirect — NGINX runs widely in public-sector web-facing infrastructure"
    sector: "cross-sector, web infrastructure"
    cves: [CVE-2026-42530, CVE-2026-42055]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Not vulnerable: 1.31.2+; Vulnerable: 1.31.0-1.31.1"
        attribution: "NGINX (F5)"
        source_url: "https://nginx.org/en/security_advisories.html"
    extended_notes: |
      NGINX is widely deployed as reverse proxy for public-sector portals. Operators should: confirm NGINX version across all deployments; prioritise upgrade to 1.31.2+ (or 1.30.3+ on stable branch) for HTTP/3 and proxy-HTTP/2 users; as interim mitigation, disable HTTP/3 (listen ... quic directive removal) and enforce ignore_invalid_headers on (the default) plus keep large_client_header_buffers at default (8 4k). NGINX Plus customers: upgrade to R36 P6 or 37.0.2.1. The NGINX Gateway Fabric (Kubernetes ingress) is also affected — patch to 2.6.4.

  - title: "Sophos X-Ops: Underground forums show cautious AI adoption — PolyEngine polymorphic packer uses Claude, Cobalt Strike gains REST/MCP integration, Leak Bazaar deploys NLP for stolen-data triage"
    sources:
      - url: "https://www.sophos.com/en-us/blog/ai-in-the-underground-curiosity-claims-and-concerns"
        publisher: "Sophos X-Ops / Counter Threat Unit"
        date: "2026-06-17"
        role: "primary"
    discovery_trace: "first seen at: sophos-xops (news.sophos.com feed), URL https://news.sophos.com/feed/ → primary: Sophos blog, URL https://www.sophos.com/en-us/blog/ai-in-the-underground-curiosity-claims-and-concerns"
    summary: |
      Sophos Counter Threat Unit published a research piece on June 17 based on underground forum monitoring, revealing a nuanced picture of AI adoption in cybercrime. Threat actors are adopting AI in several concrete operational ways: PolyEngine, an open-source polymorphic PE packer on GitHub, uses Claude for code refinement to evade static detections; a modified Cobalt Strike version (REST API) integrates Claude MCP for C2 orchestration; Leak Bazaar, a stolen-data exchange platform, uses ML with NLP capabilities to automatically categorise and triage stolen datasets for buyers; AI voice bots for vishing attacks on Telegram are being actively advertised; and "AI OnlyFans Models" services synthesise romantic fraud personas. At the same time, significant scepticism persists: some actors doubt practical gains from LLMs for skilled malware authors, fear AI will reduce market rates for manual services, and one actor expressed doubt about Anthropic's Project Glasswing assertions. Named underground actors include CyberThreat, VOLTIC, HackingRealm, Snow, ApexDev, Wikileaks, ADMIN, NightRaider, and the Rehub admin. Key implication for defenders: AI-assisted packing/obfuscation means static signature matching is weakening faster, and vishing campaigns will achieve higher language quality at lower cost.
    ch_eu_nexus: "indirect — findings apply globally; Rehub and RTM forums cited are accessible to EU threat actors"
    public_sector_nexus: "indirect — AI-enhanced phishing and vishing directly relevant to social-engineering defences in Swiss public-sector"
    sector: "cross-sector"
    cves: []
    actors_campaigns_malware: ["PolyEngine", "Leak Bazaar", "Apex AI", "Metatron"]
    verification: SINGLE-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "PolyEngine — Polymorphic PE packer using Claude for code refinement"
        attribution: "Sophos X-Ops"
        source_url: "https://www.sophos.com/en-us/blog/ai-in-the-underground-curiosity-claims-and-concerns"
    extended_notes: |
      Single-source flag applies — the specific forum actor claims are from Sophos CTU's own monitoring and cannot be independently cross-checked. The named tools (PolyEngine on GitHub, Metatron) are publicly verifiable. The broader trend (AI used for evasion/social engineering) is corroborated by multiple concurrent reports. Defender implication: static-only detections need supplementation with behavioural controls; anti-vishing training must account for AI-quality language. MITRE: T1027.007 (Dynamic API Resolution / obfuscation), T1566.004 (Vishing).

  - title: "Krebs: 'Popa' Android botnet (Vo1d plugin) — 1.5–2.5M daily IPs on unofficial Android TV boxes — linked to NetNut/Alarum Technologies (NASDAQ: ALAR)"
    sources:
      - url: "https://krebsonsecurity.com/2026/06/popa-botnet-linked-to-publicly-traded-israeli-firm/"
        publisher: "Krebs on Security"
        date: "2026-06-18"
        role: "primary"
      - url: "https://synthient.com/blog/popa-from-sourcing-to-distribution"
        publisher: "Synthient"
        date: "2026-06-18"
        role: "corroborating"
    discovery_trace: "first seen at: krebs (krebsonsecurity.com feed), URL https://krebsonsecurity.com/feed/ → primary: KrebsOnSecurity, URL https://krebsonsecurity.com/2026/06/popa-botnet-linked-to-publicly-traded-israeli-firm/"
    summary: |
      Krebs on Security reported that multiple security firms (Synthient, Black Lotus Labs/Lumen, Nokia Deepfield, Spur, HUMAN Security) have concluded the Popa Android botnet — a plugin component of the Vo1d botnet that operates on unofficial Android TV boxes — is linked to NetNut, a residential proxy service operated by publicly-traded Israeli firm Alarum Technologies Ltd (NASDAQ: ALAR). The botnet delivers 1.5–2.5 million distinct IP addresses daily, controlled through 250–300 command servers; the actual control infrastructure uses domains including gmslb[.]net, safernetwork[.]io, tera-home[.]com, and ninjatech[.]io. Popa is distributed through pirated streaming apps (CRICFy, DooFlix, Sprozfy, RTS Tv, Flixoid, CyberFlix, Rapid Streamz, TvMob, HD/OceanStreams) bundled on unofficial Android TV boxes sold via e-commerce under thousands of brand names. Lumen/Black Lotus Labs describe Popa as "one of the most problematic and dangerous proxy botnets." Misuse includes advertising fraud, account takeovers, mass data-scraping (1.4M IPs in a single May 2026 incident), and AI model training. Industry research shows 42% of LG webOS smart TV apps and 25%+ of Samsung Tizen apps contain residential proxy SDKs; 65% of Infoblox customers query residential proxy domains. Alarum/NetNut denies allegations.
    ch_eu_nexus: "indirect — proxy traffic from Popa nodes can traverse Swiss/EU IP ranges, masking attacker origin for access-broker campaigns; affected TV boxes sold globally including EU"
    public_sector_nexus: "indirect — account takeover and scraping operations enabled by Popa affect public-sector accounts; relevant for SOC teams doing IP reputation and traffic analysis"
    sector: "cross-sector"
    cves: []
    actors_campaigns_malware: ["Popa", "Vo1d"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "devices running Popa forward traffic from Netnut clients"
        attribution: "Synthient (via Krebs)"
        source_url: "https://krebsonsecurity.com/2026/06/popa-botnet-linked-to-publicly-traded-israeli-firm/"
      - quote: "most problematic and dangerous proxy botnets"
        attribution: "Chris Formosa, Lumen/Black Lotus Labs (via Krebs)"
        source_url: "https://krebsonsecurity.com/2026/06/popa-botnet-linked-to-publicly-traded-israeli-firm/"
    extended_notes: |
      The Popa/Vo1d botnet is distinct from traditional botnets; it provides residential proxy infrastructure to other threat actors, obscuring their true origin for authentication attacks, web scraping, and fraud. SOC teams should note that 65% of IP reputation queries to residential proxy domains are coming from their customer base (Infoblox statistic) — meaning the proxy layer is already embedded in threat actor operations against defended environments. Blocking unofficial Android TV boxes' outbound traffic to known Popa control domains (gmslb[.]net, safernetwork[.]io) removes one C2 cluster. T1090.003 (Proxy: Multi-hop Proxy).

