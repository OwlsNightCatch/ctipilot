  - title: "Cisco ISE CVE-2026-20181 + CVE-2026-20190: unauthenticated credential harvest chaining to root RCE — no workaround"
    sources:
      - url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-ise-multi-G5WP8vv"
        publisher: "Cisco PSIRT"
        date: "2026-06-17"
        role: "primary"
      - url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-1989"
        publisher: "BSI CERT-Bund"
        date: "2026-06-18"
        role: "corroborating"
    discovery_trace: "first seen at: bsi-rss (bridge), summary for WID-SEC-2026-1989 'Cisco Identity Services Engine: Mehrere Schwachstellen', published 2026-06-18 → bsi-csaf WID-SEC-2026-1989 → Cisco advisory URL cisco-sa-ise-multi-G5WP8vv from CSAF references → Cisco PSIRT page fetched (partial body) → WebSearch 'CVE-2026-20181 CVE-2026-20190 Cisco ISE' for corroborating detail"
    summary: |
      Cisco patched two critical vulnerabilities in Identity Services Engine (ISE) — the NAC and RADIUS/TACACS+ policy
      enforcement platform deployed in EU public-sector networks — published 2026-06-17 in advisory
      cisco-sa-ise-multi-G5WP8vv. CVE-2026-20190 (CVSS 9.1, CWE: improper authorization) allows an unauthenticated
      remote attacker to access hashed credentials and sensitive data via direct HTTP requests to specific API
      endpoints; no authentication required. CVE-2026-20181 (CVSS 9.1, CWE: improper input validation) allows an
      authenticated admin to execute arbitrary commands as root via crafted CLI input. The two-CVE chain is the
      operative threat model: CVE-2026-20190 enables credential harvest without any prior foothold; the obtained
      hashed credentials can be relayed or cracked and fed into CVE-2026-20181 for root-level RCE. Cisco states no
      workarounds exist. Affected: ISE 3.3 through 3.4 (fix in Patch 11 and Patch 6 respectively); ISE 3.5 fix is
      planned for August 2026, leaving a gap. Cisco ISE is the dominant NAC platform in European public-sector and
      defence environments. Detection: monitor ISE API endpoint access logs for unauthenticated requests to credential-
      adjacent endpoints (T1190); correlate with abnormal admin CLI sessions (T1059) from newly-seen source IPs.
    ch_eu_nexus: "direct — Cisco ISE is core NAC/identity platform widely deployed in Swiss federal and cantonal IT and EU public-sector networks"
    public_sector_nexus: "direct"
    sector: "government, defence, public-sector, education"
