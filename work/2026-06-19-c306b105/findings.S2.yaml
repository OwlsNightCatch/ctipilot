  - title: "NGINX CVE-2026-42530: HTTP/3 QUIC use-after-free, CVSS 9.2 — mitigate by disabling HTTP/3 if patching delayed"
    sources:
      - url: "https://nginx.org/en/security_advisories.html"
        publisher: "NGINX / F5"
        date: "2026-06-17"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/security/f5-issues-out-of-band-patches-for-nginx-http3-quic-use-after-free/"
        publisher: "BleepingComputer"
        date: "2026-06-18"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('NGINX CVE 2026 HTTP/3 QUIC use-after-free June 2026') → nginx.org/en/security_advisories.html fetched (bridge) → BleepingComputer corroborating article fetched"
    summary: |
      F5/NGINX disclosed CVE-2026-42530 on 2026-06-17 alongside the nginx 1.31.2 mainline release: a use-after-free
      in ngx_http_v3_module triggered by a crafted QUIC session. CVSS v4.0 score 9.2 (Critical). The vulnerability
      occurs during HTTP/3 stream processing when a memory object tied to a QUIC connection is freed prematurely;
      a remote unauthenticated attacker can trigger worker-process memory corruption or segfault and, where ASLR is
      disabled or bypassable, may achieve RCE. Affected: NGINX Open Source 1.31.0 and 1.31.1 (both June 2026 mainline
      releases). Fixed: 1.31.2+. A second CVE in the same release — CVE-2026-42055 (CVSS medium) — covers a buffer
      overflow in ngx_http_proxy_v2_module and ngx_http_grpc_module; patch together. For operators who cannot patch
      immediately, removing `quic` from all `listen` directives disables HTTP/3 and eliminates the attack surface
      without affecting HTTP/1.1 or HTTP/2. NGINX is the dominant reverse proxy in EU public-sector and enterprise
      environments. Detection: Sysmon EID 1 on nginx worker process spawn anomalies; worker-process crash/restart logs
      are a pre-exploitation indicator; F5 WAF or BIG-IP ASM rule updates cover QUIC packet anomalies.
    ch_eu_nexus: "indirect — NGINX is the most deployed reverse proxy in EU and CH government/enterprise environments; HTTP/3 enablement is common on newer deployments"
    public_sector_nexus: "indirect"
    sector: "telco, government, finance, public-sector"
    cves: ["CVE-2026-42530", "CVE-2026-42055"]
    actors_campaigns_malware: []
