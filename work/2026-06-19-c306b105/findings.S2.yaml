  - title: "pgAdmin 4 < 9.16: unauthenticated pickle RCE (CVE-2026-12046), AI Assistant prompt injection to RCE (CVE-2026-12045), stored XSS (CVE-2026-12048)"
    sources:
      - url: "https://www.pgadmin.org/support/security/"
        publisher: "pgAdmin / PostgreSQL Global Development Group"
        date: "2026-06-18"
        role: "primary"
      - url: "https://www.ccb.belgium.be/fr/soc-fed/cert/avis/warning-rce-xss-pgadmin4-patch-immediately"
        publisher: "CCB Belgium (Centre for Cybersecurity Belgium)"
        date: "2026-06-18"
        role: "corroborating"
    discovery_trace: "first seen at: enisa-euvd (bridge, recent criticals) → ENISA EUVD entries EUVD-2026-12046 and EUVD-2026-12045 → pgAdmin security page fetched → CCB Belgium advisory 'Warning: RCE & XSS in pgAdmin4, Patch Immediately!' fetched (bridge) → confirmed in-window publication 2026-06-18"
    summary: |
      pgAdmin 4 version 9.16 (released 2026-06-18) patches three critical vulnerabilities reported by the PostgreSQL
      Global Development Group. CVE-2026-12046 (CVSS 4.0: 9.5): two SQL Editor API endpoints
      (DELETE /sqleditor/close/<trans_id> and POST /sqleditor/initialize/sqleditor/update_connection/...) lack the
      @pga_login_required decorator in server mode, allowing unauthenticated HTTP access. Both endpoints call
      pickle.loads() on session data (session['gridData'][trans_id]['command_obj']); an attacker who can also write
      to the Flask session store or control Flask SECRET_KEY can achieve arbitrary Python code execution — typical
      partial-compromise chain on shared or misconfigured hosting. CVE-2026-12045 (CVSS 4.0: 9.4): pgAdmin's AI
      Assistant executes SQL queries via execute_sql_query; the wrapper enforces BEGIN TRANSACTION READ ONLY, but
      multi-statement payloads starting with COMMIT or ROLLBACK terminate the read-only guard. Attacker-controlled
      database content (ErrorResponse messages, EXPLAIN output) can inject these payloads as prompt injection; when
      the pgAdmin user holds PostgreSQL superuser role, this escalates to OS-level RCE via COPY ... TO PROGRAM.
      CVE-2026-12048 (CVSS 4.0: 9.3): stored XSS via backend-derived text in notifier toasts, Explain visualiser, and
      SQL editor dialogs — injected via ErrorResponse messages from a malicious PostgreSQL server. All affect pgAdmin 4
      versions 6.0 through 9.15. Upgrade to 9.16 immediately; as an interim measure, disable the AI Assistant feature
      and restrict pgAdmin server-mode network access. CCB Belgium issued an urgent patch advisory on 2026-06-18.
    ch_eu_nexus: "direct — pgAdmin is the standard GUI for PostgreSQL in EU/CH public-sector data environments; CCB Belgium national CERT issued urgent advisory"
    public_sector_nexus: "direct"
    sector: "government, finance, public-sector, education"
    cves: ["CVE-2026-12046", "CVE-2026-12045", "CVE-2026-12048"]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Warning: RCE & XSS in pgAdmin4, Patch Immediately! Multiple critical vulnerabilities in pgAdmin 4 versions prior to 9.16"
        attribution: "CCB Belgium (Centre for Cybersecurity Belgium)"
        source_url: "https://www.ccb.belgium.be/fr/soc-fed/cert/avis/warning-rce-xss-pgadmin4-patch-immediately"
      - quote: "CVE-2026-12046: Missing authentication on SQL Editor endpoints reaching pickle.loads() sink; CVSS 9.5"
        attribution: "pgAdmin / PostgreSQL Global Development Group"
        source_url: "https://www.pgadmin.org/support/security/"

  - title: "Gentlemen RaaS 'GentleKiller' EDR-killer framework: 400+ security processes, 48 products, BYOVD within days of new PoC — active EU targeting"
    sources:
      - url: "https://www.welivesecurity.com/en/eset-research/killing-me-gently-inside-gentlemens-edr-killer-framework/"
        publisher: "ESET WeLiveSecurity"
