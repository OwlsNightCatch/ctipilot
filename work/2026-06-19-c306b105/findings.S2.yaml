        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('Gentlemen ransomware GentleKiller EDR killer June 2026') → ESET WeLiveSecurity primary research article fetched → HelpNetSecurity corroborating article fetched"
    summary: |
      ESET published primary research on 2026-06-18 into GentleKiller, a modular EDR/AV-evasion toolkit built and
      maintained centrally by the Gentlemen ransomware-as-a-service operators and distributed to their affiliates —
      a structural departure from the norm where affiliates source their own tools. GentleKiller comprises 8+ variants
      targeting 400+ named security processes across 48 EDR, AV, and XDR product families. Its principal technique is
      BYOVD (T1068 Exploitation for Privilege Escalation via a vulnerable legitimately-signed driver): Gentlemen
      operationalizes newly disclosed BYOVD proof-of-concepts within days of public release, systematically integrating
      the new driver into GentleKiller's rotation. Gentlemen emerged in late 2025 and reached top-5 most active RaaS
      gang in Q1 2026; affiliates receive a 90% share. EU targeting is confirmed: France, Germany, and the UK are
      primary target geographies, with industrial and IT organizations as preferred verticals — profile overlapping
      Swiss critical-sector threat exposure. Detection opportunities: kernel driver load events (Sysmon EID 6, Code
      Integrity or ETW/EtwTi kernel callbacks) for legitimately-signed but LOLbin-abused or CVE-indexed drivers;
      process-termination sequences where the terminating parent is not a user-initiated process (EDR process tree
      anomaly); kernel-mode thread injection indicators. Hardening: Microsoft Vulnerable Driver Blocklist (HVCI mode)
      and driver allowlisting via Windows Defender Application Control (WDAC) policies reduce BYOVD exposure.
    ch_eu_nexus: "direct — active EU targeting confirmed (France, Germany, UK); industrial and IT sector focus matches Swiss public-sector profile"
