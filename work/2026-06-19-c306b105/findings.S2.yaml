  - title: "Icarus extortion group breaches Klue Battlecards via dormant credential, harvests OAuth tokens, exfiltrates Salesforce CRM data from enterprise customers"
    sources:
      - url: "https://www.bleepingcomputer.com/news/security/icarus-extortion-group-breaches-klue-targets-salesforce-crm-data/"
        publisher: "BleepingComputer"
        date: "2026-06-18"
        role: "primary"
      - url: "https://www.huntress.com/blog/klue-breach-salesforce-oauth-attack-chain"
        publisher: "Huntress"
        date: "2026-06-18"
        role: "primary"
    discovery_trace: "first seen at: WebSearch ('Icarus extortion group Klue Salesforce OAuth June 2026') → BleepingComputer article fetched → Huntress blog post fetched (self-disclosed victim and chain analysis)"
    summary: |
      A new extortion actor tracked as Icarus (active since April 28, 2026, two prior victims) compromised Klue
      Battlecards — a market-intelligence SaaS platform — on 2026-06-18 and used the access to steal Salesforce CRM
      data from Klue's enterprise customers. The attack chain: Icarus obtained a dormant employee credential for Klue's
      backend, deployed a malicious code update to the Klue application, harvested OAuth access tokens for all customer
      Salesforce integrations stored in Klue's backend, then queried each customer's Salesforce REST API
      (/services/data/v59.0/sobjects and /services/data/v59.0/query) — approximately 1,000 API queries in 15 minutes.
      Huntress self-disclosed as a victim and published the technical chain. Salesforce confirmed it disabled the Klue
      Battlecards integration. Icarus contacted victims directly via email using alias "mr bean" with Session Messenger
      ID for extortion demands. MITRE ATT&CK mapping: T1528 Steal Application Access Token (OAuth token harvest from
      SaaS backend); T1619 Cloud Storage Object Discovery (Salesforce sobject enumeration); T1567.002 Exfiltration to
      Cloud Storage (data exfiltration via API). Detection: Salesforce event monitoring logs for high-frequency API
      queries from Klue integration tokens; OAuth application audit logs for new delegated scopes or token issuance
      from third-party integrations; anomalous bulk data-export events (Salesforce Shield Event Monitoring EID
      ReportExport, ApiTotalUsage). Hardening: review all OAuth delegated-access grants in Salesforce Connected Apps;
      enforce token rotation and short TTLs; audit third-party SaaS integrations that hold delegated CRM access.
    ch_eu_nexus: "indirect — supply-chain SaaS attack pattern affects any EU/CH enterprise using Klue Battlecards or similar market-intelligence SaaS with Salesforce delegated OAuth"
    public_sector_nexus: "indirect"
    sector: "finance, IT, enterprise"
    cves: []
    actors_campaigns_malware: ["Icarus"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Icarus extortion group breached Klue via dormant credential, harvested OAuth tokens, queried Salesforce REST API across 1,000 customer accounts in 15 minutes"
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/icarus-extortion-group-breaches-klue-targets-salesforce-crm-data/"
      - quote: "Huntress confirms its own Salesforce data was accessed via the Klue integration OAuth token compromise"
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/klue-breach-salesforce-oauth-attack-chain"

