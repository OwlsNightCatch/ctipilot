      - url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-2002"
        publisher: "BSI CERT-Bund"
        date: "2026-06-18"
        role: "corroborating"
    discovery_trace: "first seen at: bsi-rss (bridge), summary for WID-SEC-2026-2002 'Drupal: Mehrere Schwachstellen ermöglichen Codeausführung', published 2026-06-18 → bsi-csaf WID-SEC-2026-2002 for CSAF detail → drupal.org SA-CORE-2026-005..009 URLs from CSAF references → drupal.org advisory pages fetched"
    summary: |
      Drupal Security Team published five security advisories on 2026-06-17 (SA-CORE-2026-005 through SA-CORE-2026-009)
      covering critical vulnerabilities in Drupal Core across all supported releases. The aggregate severity is rated
      "kritisch" (critical) by BSI. Vulnerability classes include arbitrary PHP/code execution (RCE) via deserialization
      or unsafe file-handling routines, reflected and stored cross-site scripting (XSS) in multiple UI components, and
      open redirect. Exploitation prerequisites vary by advisory: SA-CORE-2026-005 (RCE) requires authenticated access
      with elevated permissions; SA-CORE-2026-006 through -009 address lower-privilege XSS and redirect vectors that
      could chain into account takeover against privileged users. Affected platforms include Unix and Windows deployments.
      Drupal is the dominant CMS for EU and Swiss government web properties; unpatched installations are directly
      accessible via public-facing web infrastructure, mapping to T1190 Exploit Public-Facing Application. Defenders
      should check web-server access logs for anomalous POST patterns to Drupal's form/ajax endpoints and apply the
      patched Drupal releases immediately. BSI escalated to "kritisch" and issued coordinated advisory WID-SEC-2026-2002
      on 2026-06-18.
    ch_eu_nexus: "direct — Drupal is the dominant CMS in EU and CH government/public-sector web properties; CH confederation sites and cantonal government portals use Drupal"
    public_sector_nexus: "direct"
