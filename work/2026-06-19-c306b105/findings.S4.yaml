  - title: "Operation Endgame expands: TA569/SocGholish infrastructure dismantled across 14,971 WordPress sites"
    sources:
      - url: "https://www.helpnetsecurity.com/2026/06/18/law-enforcement-socgholish-operation-endgame/"
        publisher: "Help Net Security"
        date: "2026-06-18"
        role: "primary"
      - url: "https://www.politie.nl/en/news/2026/juni/18/11-operation-endgame-expands-to-socgholish-malware.html"
        publisher: "Dutch National Police (Politie)"
        date: "2026-06-18"
        role: "primary"
      - url: "https://www.proofpoint.com/us/blog/threat-insight/sayonara-socgholish-operation-endgame-expands"
        publisher: "Proofpoint Threat Research"
        date: "2026-06-18"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('SocGholish Operation Endgame 2026-06-18') → Help Net Security article fetched (200) → pivot: Dutch Police (Politie) press release fetched via bridge url (200) → Proofpoint Sayonara SocGholish blog fetched via bridge url (200)"
    summary: |
      A coordinated law enforcement operation on June 18, 2026 — an expansion of the May 2024 Operation
      Endgame — dismantled infrastructure associated with TA569 (Evil Corp affiliate, SocGholish operator).
      Dutch National High Tech Crime Unit (NHCTU) led the effort in coordination with the RCMP, FBI, BKA,
      and Europol. 106 command-and-control servers were taken down and 14,971 compromised WordPress sites
      had the malicious SocGholish JavaScript loader removed.

      SocGholish (tracked as FakeUpdates) operates by injecting obfuscated JavaScript into legitimate
      WordPress sites, typically via compromised wp-admin credentials or vulnerable plugins. When a victim
      visits an infected page, the JS fingerprints the browser and — if deemed valuable — renders a
      convincing fake browser update dialog. Accepting triggers a drive-by download of a ZIP containing
      a .js or .lnk stage-1 loader, which executes via wscript.exe or mshta.exe (T1059.007 JavaScript,
      T1204.002 Malicious File). Stage-2 payloads have historically included Cobalt Strike beacons,
      NetSupport RAT, and ransomware access passes to affiliates including Evil Corp's downstream operators.

      TA569 is assessed to overlap with Evil Corp, the Russian cybercriminal group responsible for the Zeus
      banking trojan and Dridex malware lineage. The May 2024 Operation Endgame phase targeted the
      IcedID/BokBot, Pikabot, Bumblebee, and Smokeloader droppers; this June 2026 phase is the first
      to directly address the SocGholish/FakeUpdates component, which has been a persistent initial-access
      broker mechanism since approximately 2017.

      Detection context: Sysmon EID 1 — wscript.exe or mshta.exe spawned from browser process (Chrome,
      Firefox, Edge) is a high-fidelity behavioural trigger for SocGholish stage-1 execution. Network
      defenders should correlate web proxy logs for outbound connections from browser processes to
      WordPress-hosted URLs serving .zip files with .js payloads. WordPress administrators should audit
      wp-admin credentials, review file integrity for injected JavaScript in theme files, and ensure
      plugin supply-chain hygiene.
    ch_eu_nexus: "direct — Dutch NHCTU led the operation; EU law enforcement coordination via Europol; compromised WordPress infrastructure global but likely includes EU-hosted sites"
    public_sector_nexus: "indirect — web-inject delivery mechanism affects any organization whose users browse compromised WordPress sites; EU public sector web presence commonly runs WordPress"
    sector: "all sectors (drive-by delivery), criminal"
    cves: []
    actors_campaigns_malware: ["TA569", "Evil Corp", "SocGholish", "FakeUpdates", "Operation Endgame"]
    mitre_attack:
