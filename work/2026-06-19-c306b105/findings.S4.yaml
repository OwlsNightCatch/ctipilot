      - quote: "Dutch National High Tech Crime Unit (NHCTU), in cooperation with the Royal Canadian Mounted Police (RCMP), FBI, German Federal Criminal Police (BKA) and Europol, targeted 106 servers and had malicious code removed from 14,971 websites."
        attribution: "Help Net Security"
