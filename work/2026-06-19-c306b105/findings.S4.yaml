  - title: "Icarus group exploits Klue OAuth token, bulk-exfiltrates Salesforce CRM data from multiple enterprises"
    sources:
      - url: "https://www.bleepingcomputer.com/news/security/klue-breach-icarus-group-uses-stolen-oauth-tokens-to-raid-salesforce/"
        publisher: "BleepingComputer"
        date: "2026-06-18"
        role: "primary"
      - url: "https://www.reliaquest.com/blog/threat-spotlight-icarus-salesforce-oauth-extortion/"
        publisher: "ReliaQuest"
        date: "2026-06-17"
        role: "primary"
      - url: "https://www.huntress.com/blog/klue-breach-investigation"
        publisher: "Huntress"
        date: "2026-06-18"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('Klue OAuth breach Salesforce Icarus 2026') → BleepingComputer article fetched (200) → ReliaQuest threat spotlight fetched (200) → Huntress blog fetched (200)"
    summary: |
      The Icarus extortion group (active since approximately April 2026) conducted a supply-chain-style
      attack against Klue Battlecards, a competitive intelligence SaaS product that integrates with
      Salesforce via OAuth. The attack vector was a dormant prototype-integration credential that Icarus
      compromised through Klue's backend systems — the OAuth token was extracted via injected code in
      Klue's application layer rather than a direct Salesforce attack.

      Once Icarus held a valid OAuth access token scoped to a victim organization's Salesforce instance,
      the group queried the Salesforce REST API directly using the token's permissions. Specific endpoints
      included /services/data/v59.0/sobjects/ (object enumeration) and /services/data/v59.0/query
      (SOQL query execution). This pattern abuses T1078.004 (Cloud Accounts — Valid OAuth Credentials) and
      T1530 (Data from Cloud Storage Object) at the Salesforce layer, entirely bypassing the victim's
      endpoint and network perimeter controls. The exfiltration window spanned approximately 24 hours per
      victim before Salesforce detected anomalous API usage and disabled the Klue Battlecards integration.

      Confirmed victim: Huntress (published its own incident disclosure June 18). Exfiltrated data
      categories included business contact records, internal sales communications, price quotes, and
      competitive intelligence briefs — high-value for secondary campaigns. Icarus's extortion operator
      uses the alias "mr bean" on Session Messenger and has been observed demanding ransoms in the
      $250K–$2M range. Salesforce's response was to disable the Klue integration at the platform level
      pending vendor remediation.

      Detection context: Salesforce API audit logs (EventMonitoring) will record the REST API calls under
      the OAuth token's user context. Defenders should alert on: (a) SObject enumeration calls
      (/sobjects/) from unfamiliar integration users, (b) bulk SOQL SELECT * patterns in EventMonitoring
      ApiTotalUsage, (c) OAuth tokens granted to third-party integrations accessing records outside their
      normal operational hours. Hardening: review all Connected App OAuth grants in Salesforce Setup,
      revoke dormant/prototype integrations, enforce IP-range restrictions on OAuth grant policies,
      and enable EventMonitoring export to your SIEM.
    ch_eu_nexus: "global; Salesforce CRM is widely deployed across EU enterprises and public-sector bodies; Switzerland-based Salesforce customers using Klue Battlecards should audit OAuth grants immediately"
    public_sector_nexus: "indirect — Salesforce is deployed in many Swiss/EU public-sector contexts; third-party SaaS integration OAuth abuse is a generalizable pattern"
    sector: "technology, financial services, professional services"
    cves: []
    actors_campaigns_malware: ["Icarus"]
    mitre_attack:
      - id: "T1078.004"
        name: "Valid Accounts: Cloud Accounts"
      - id: "T1530"
        name: "Data from Cloud Storage Object"
      - id: "T1199"
        name: "Trusted Relationship"
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The Icarus group, active since April 2026, gained access to Klue's backend systems and injected code to harvest OAuth tokens from the Battlecards integration. Using the stolen tokens, Icarus queried connected Salesforce instances via REST API for approximately 24 hours per victim."
        attribution: "ReliaQuest"
        source_url: "https://www.reliaquest.com/blog/threat-spotlight-icarus-salesforce-oauth-extortion/"
      - quote: "Huntress confirmed today that internal sales data was exfiltrated from its Salesforce environment following the Klue compromise. The stolen data included contacts, email communications, and competitive pricing information. Huntress's own systems were not compromised."
        attribution: "Huntress"
