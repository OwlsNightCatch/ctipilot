  item: "Reuters reported on 2026-10-03, as relayed by Nextgov/FCW and SecurityWeek, that a suspected ShinyHunters member had been detained in Jordan and was helping investigators"
  url_or_quote: "https://www.securityweek.com/fbi-blames-contractors-missed-patch-for-shinyhunters-breach/"
  summary: "(low confidence) The clause ends on a SecurityWeek-only citation, but SecurityWeek never names Reuters here ('The arrest of another alleged ShinyHunters leader ... (aka Rey), came to light on October 3. Rey was reportedly arrested in Jordan and has been cooperating with authorities'). The Reuters attribution and 'helping investigators' are Nextgov's: 'Reuters reported Saturday that another suspected member ... had been detained in Jordan and was helping investigators'. Cite Nextgov at this clause or drop SecurityWeek from the relay claim."
