  - title: "Stored XSS in the Ninja Forms and WPC Product Bundles WordPress plugins is exploited to plant a hidden administrator and four persistence routes"
    sources:
      - { url: "https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/", publisher: "Patchstack", date: "2026-10-06", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/ninja-forms-plugin-flaw-exploited-to-hack-wordpress-sites/", publisher: "BleepingComputer", date: "2026-10-06", role: "corroborating" }
      - { url: "https://wordpress.org/plugins/ninja-forms/", publisher: "WordPress.org (Ninja Forms changelog)", date: "2026-09-28", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer feed https://www.bleepingcomputer.com/feed/ (tools/fetch_source.py feed) -> article https://www.bleepingcomputer.com/news/security/ninja-forms-plugin-flaw-exploited-to-hack-wordpress-sites/ -> primary: Patchstack https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/ (also in Patchstack feed https://patchstack.com/feed/) -> fixed-version corroboration: https://wordpress.org/plugins/ninja-forms/ changelog; CVE records read via https://cveawg.mitre.org/api/cve/CVE-2026-94504 and CVE-2026-93836 (Wordfence CNA, 2026-09-22)"
    summary: |
      Patchstack, from its own telemetry, reports that since 2026-10-04 one actor has been exploiting two unrelated stored cross-site-scripting flaws in WordPress plugins, both publicly disclosed on 2026-09-22 (CNA Wordfence, CVSS 3.1 7.2 each): CVE-2026-93836 in WPC Product Bundles for WooCommerce up to 8.6.6 (about 30,000 installs; an unauthenticated quantity parameter keeps attacker markup that is stored in order metadata and rendered unsafely) and CVE-2026-94504 in Ninja Forms up to 3.15.3 (more than 500,000 installs; an anonymous form submission is stored and rendered without safe encoding in the legacy submission editor). The attacker submits the script through the normal public form or cart endpoint and waits. When a logged-in administrator opens the order or the form submission, the script runs in the wp-admin origin and rides that administrator's session (it never reads the cookie, so HttpOnly gives no protection): it scrapes the CSRF nonces, installs a malicious plugin through the normal upload installer, creates an administrator account and calls a persistence installer. Patchstack describes four independent ways back in: a visible administrator account; a second administrator hidden from the Users screen by a dropped must-use plugin (hooks on the user query, the users list arguments and the role counts); a magic-login URL bound to the site's oldest existing administrator, backed by a second must-use plugin; and an unauthenticated file manager in the uploaded plugin that only runs on a direct request (it has no command primitive, but upload and save write attacker bytes to any writable path). The must-use plugins are obfuscated with a per-site key and backdated to the oldest file time in the WordPress root, so searches for recently changed files miss them; removing the vulnerable plugin or even the malicious plugin closes none of the last three routes. Patchstack states exploitation volume is limited in its telemetry and that two is what it has confirmed, not a ceiling, because the second stage is plugin-agnostic. Fixed versions: Ninja Forms 3.15.4 (changelog dated 2026-09-21, "strengthen output escaping in admin submission edit screen"; 3.15.5 followed on 2026-09-28) and WPC Product Bundles 8.6.7 (per the upstream changelog as read by Patchstack), so the exploited window opened about two weeks after the Ninja Forms fix shipped. BleepingComputer restates Patchstack and adds nothing independent. Not in CISA KEV; CISA ADP SSVC for both records shows exploitation none as of 2026-09-22 (before the campaign).
    region_nexus: "global; no Switzerland-specific reporting. WordPress with Ninja Forms or WooCommerce is common on municipal and agency websites (no source states a Swiss number)"
    primary_sector_nexus: "indirect"
    sector: "public-sector, technology"
    cves: [CVE-2026-93836, CVE-2026-94504]
    techniques: [T1190, T1059.007, T1136.001, T1505.003, T1070.006, T1564.002]
    affected_products: ["Ninja Forms", "WPC Product Bundles for WooCommerce", "WordPress"]
    entity_keys: ["product:wordpress"]
    new_entities:
      - { key: "product:ninja-forms", type: product, name: "Ninja Forms", aliases: ["Ninja Forms - The Contact Form Builder That Grows With You"], summary: "WordPress form-builder plugin with more than 500,000 installs; CVE-2026-94504 (stored XSS, up to 3.15.3, fixed 3.15.4) is exploited in an October 2026 campaign (Patchstack, 2026-10-06)." }
      - { key: "product:wpc-product-bundles-for-woocommerce", type: product, name: "WPC Product Bundles for WooCommerce", aliases: ["woo-product-bundle"], summary: "WooCommerce plugin by WPClever with about 30,000 installs; CVE-2026-93836 (unauthenticated stored XSS via the quantity parameter, up to 8.6.6, fixed 8.6.7) is exploited in an October 2026 campaign (Patchstack, 2026-10-06)." }
      - { key: "campaign:wordpress-stored-xss-hidden-admin-implant-2026", type: campaign, name: "WordPress stored-XSS hidden-administrator campaign (October 2026)", aliases: [], summary: "Patchstack-observed campaign (first seen 2026-10-04) using stored XSS in Ninja Forms and WPC Product Bundles to run a browser-side implant in an administrator's session that installs a plugin, creates visible and hidden administrators, and plants must-use-plugin persistence; no actor is named." }
    relation_suggestions:
      - { subject: "campaign:wordpress-stored-xss-hidden-admin-implant-2026", object: "product:ninja-forms", basis: "Patchstack: the campaign's payload was delivered through CVE-2026-94504 in Ninja Forms on 2026-10-05 (Patchstack, 2026-10-06)" }
      - { subject: "campaign:wordpress-stored-xss-hidden-admin-implant-2026", object: "product:wpc-product-bundles-for-woocommerce", basis: "Patchstack: the first observed exploitation on 2026-10-04 targeted CVE-2026-93836 in WPC Product Bundles (Patchstack, 2026-10-06)" }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Two unrelated WordPress plugins, two separate stored Cross-Site Scripting vulnerabilities, one payload."
        attribution: "Patchstack"
        source_url: "https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/"
      - quote: "exploitation volume remains limited in our telemetry"
        attribution: "Patchstack"
        source_url: "https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/"
      - quote: "It is a fully privileged administrator the site owner cannot see."
        attribution: "Patchstack"
        source_url: "https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/"
      - quote: "Removing the vulnerable plugin, or even the malicious one, closes none of the last three."
        attribution: "Patchstack"
        source_url: "https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/"
      - quote: "strengthen output escaping in admin submission edit screen"
        attribution: "WordPress.org (Ninja Forms changelog)"
        source_url: "https://wordpress.org/plugins/ninja-forms/"
    extended_notes: |
      Contradiction to carry: BleepingComputer says both flaws "require an authenticated session to exploit"; Patchstack and the Wordfence CNA records call both unauthenticated stored XSS (the authenticated session is the administrator's, which the script rides, not the attacker's), so the composer should follow Patchstack/CNA.
      Sourcing: the exploitation claim rests on Patchstack's own telemetry (Admiralty B, credibility 2: not independently confirmed, logical, consistent); BleepingComputer is a re-report. The fix versions are independently corroborated by the Ninja Forms changelog on WordPress.org; the WPC 8.6.7 fix version is Patchstack's reading of the upstream changelog and BleepingComputer repeats it.
      Triage-ready behaviour (no IOCs; domains, hashes and source addresses are deliberately omitted, Patchstack's post carries them): (1) public POSTs to the plugin's AJAX submit endpoint or to a WooCommerce product URL whose form/quantity fields contain script or image-onerror markup that loads a remote script; (2) later, from an administrator's own session and IP, a plugin-upload install event (plugin-install upload tab), a user-creation event and a call to the persistence installer within seconds of the administrator opening a Ninja Forms submission or WooCommerce order; (3) new PHP files in wp-content/mu-plugins that the Plugins screen never lists, with modification times older than the WordPress install; (4) an administrator row in the users/usermeta tables that wp-admin does not show; (5) requests to wp-login.php carrying a login-token query parameter, and direct requests to files inside the uploaded plugin. Benign lookalikes: a legitimate administrator installing a plugin from a ZIP produces the same install events; the discriminators are the sequence (install plus user creation plus a self-triggered persistence call inside one page-view), the source being a stored-content view rather than the plugins screen, and the hidden-versus-listed administrator mismatch. Post-patch check: patching stops new injections but does not evict an implant, so enumerate administrators in the database against the wp-admin list, inspect mu-plugins by content not by date, rotate privileged credentials and WordPress salts, and treat the site's oldest administrator account as compromised if a login-token URL existed.
      Hardening: update Ninja Forms to 3.15.4 or later (3.15.5 is current) and WPC Product Bundles to 8.6.7; the second stage is plugin-agnostic, so any stored XSS that reaches an administrator is a candidate vector (Patchstack's conclusion).
      Suggested handling: new `vulnerability`/`threat` entry; priority is a call for the main agent (confirmed in-the-wild exploitation but limited volume per the discoverer; popular plugin; persistence survives patching). Admiralty suggestion: B2.

