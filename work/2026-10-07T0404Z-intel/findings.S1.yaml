coverage_gaps:
  - source_id: ssd-disclosure
    reason: "The /advisories/ listing and every per-advisory page return a Cloudflare-style CAPTCHA through extract (reader fallback) and an empty body through WebFetch; only the homepage reads, via the reader, and shows the three newest advisories undated (DCOM PsmServiceExtHost LPE on Windows 11 25H2, UNISOC T612 LPE, Linux bridge STP timer use-after-free). No dates, so nothing returned. Reader credit was spent on four calls."
  - source_id: vulncheck
    reason: "RECIPE CHANGE: `extract` and the bridge still return a stale 2022 snapshot, but WebFetch of https://www.vulncheck.com/blog now returns the current listing with dates and URLs (newest 2026-10-01, Cisco SD-WAN CVE-2026-76504 write-up, already covered; 2026-09-30 JCTables Joomla). Suggest fetch_method webfetch with that recipe."
  - source_id: flatt-security
    reason: "`feed https://flatt.tech/research/index.xml` only works through the reader and carries no dates; per-post pages read cleanly with extract and are dated (newest 2026-10-06). Use extract on the first listing link."
  - source_id: tp-link-omada-psirt
    reason: "`url` recipe works but the page is a React blob; bulletin dates sit in the embedded data (MM-DD-YYYY). One old advisory (CVE-2025-9289/9290) was re-dated 10-06-2026; nothing new in the lookback."
  - source_id: chrome-releases
    reason: "(not in this slice) `feed https://chromereleases.googleblog.com/feeds/posts/default` returned a non-JSON body during this run; no Chrome KEV addition exists in the window, so no impact."

self_evolution:
  - "GitHub's public REST API reads on the direct transport and is a better recipe than the HTML advisory pages for any project that publishes GHSA advisories: `python3 tools/fetch_source.py url --direct \"https://api.github.com/repos/<org>/<repo>/security-advisories?per_page=40\"` returns ghsa_id, cve_id, severity, vulnerable_version_range and patched_versions as JSON (used on zammad/zammad: 27 advisories in one call). Worth a note in the research definition's fetch tooling reference."
  - "`tools/fetch_source.py url <URL>` silently falls back to the metered reader on any host that is not HTML-challenged (it did so for upgrade.mikrotik.com version-text endpoints and for non-HTML API replies): add `--direct` when the endpoint is a plain-text or JSON API."
  - "A same-day delta check of every covered entry's vendor GitHub-advisory / release page would have caught Zammad 7.2.1 one fire earlier; the entry's own `sources[]` URLs are the natural recheck list (a cheap 'recheck covered primaries' step for S1)."
  - "WebFetch returned an empty body on ssd-disclosure.com again (second consecutive documented wall); do not spend WebFetch calls on that host."

