  - title: "CVE-2026-21589, Atlassian Data Center: watchTowr publishes the root cause, a working request shape and a detection script, and shows the file read reaching Crowd service credentials"
    sources:
      - { url: "https://labs.watchtowr.com/you-wont-hear-about-these-even-in-myths-atlassian-jira-confluence-and-more-pre-auth-arbitrary-file-read-cve-2026-21589/", publisher: "watchTowr Labs", date: "2026-10-06", role: "primary" }
      - { url: "https://github.com/watchtowrlabs/watchTowr-vs-Atlassian-CVE-2026-21589", publisher: "watchTowr Labs (GitHub)", date: "2026-10-06", role: "primary" }
      - { url: "https://confluence.atlassian.com/security/cve-2026-21589-arbitrary-file-access-vulnerability-impacts-multiple-products-1870495748.html", publisher: "Atlassian", date: "2026-10-05", role: "corroborating" }
    discovery_trace: "first seen at: watchtowr, RSS https://labs.watchtowr.com/rss/ (fetched via tools/fetch_source.py feed) -> primary (no pivot needed): https://labs.watchtowr.com/you-wont-hear-about-these-even-in-myths-atlassian-jira-confluence-and-more-pre-auth-arbitrary-file-read-cve-2026-21589/ -> pivot: https://github.com/watchtowrlabs/watchTowr-vs-Atlassian-CVE-2026-21589 -> re-read vendor advisory https://confluence.atlassian.com/security/cve-2026-21589-arbitrary-file-access-vulnerability-impacts-multiple-products-1870495748.html (no revision; still no exploitation statement)"
    summary: |
      Delta on the covered entry (it was written from Atlassian's advisory alone, which says the attacker must already know a file's exact name and path and that Atlassian found no evidence of exploitation). Facts from the vendor, unchanged on re-read: advisory of 2026-10-05, CVSS 4.0 9.3, all versions of eight Data Center products affected, fixed versions as already carried, and Atlassian says it "cannot confirm if your instances have been affected". New in-window facts from watchTowr Labs, which diffed vulnerable and fixed builds: the flaw sits in the shared web-resource library (atlassian-plugins-webresource, 6.0.7 vulnerable versus 6.0.8 different); its router converts a double-colon sequence into a path separator on resource-serving routes, and a deprecated relative-resource helper then concatenates the user-controlled resource name, so a traversal written with the double-colon form (the one the Atlassian WAF regex already lists) reaches files below the Tomcat context. watchTowr states it cannot traverse out of the Tomcat context but can read any file inside the application server's web root, and that the route differs per product (verified on Jira, Confluence and Bitbucket). Because WEB-INF files have fixed, well-known names, Atlassian's "must know the exact file name" limit does little work in practice (analyst inference from the published request shape, not a vendor statement). watchTowr then demonstrates impact: in a Jira that is integrated with Crowd, WEB-INF/classes/crowd.properties holds the application name and its password in plaintext; those credentials authenticate to Crowd's REST API as the Jira application, where an attacker can list users, create an account and add it to the jira-administrators group, which watchTowr calls "basically game over" (it notes a Crowd IP allowlist would make this harder). watchTowr published a detection-artefact script for Jira, Confluence and Bitbucket on GitHub and says it also built the whole chain as one Python PoC (the public repository is the detection script, not that chain). watchTowr's own claim, from a FOFA title search, is just under 700,000 internet-facing Confluence instances. No source reports exploitation: the advisory and CISA's ADP SSVC record (exploitation none, 2026-10-06) say none, the CVE is not in CISA KEV (catalog 2026.10.04), FIRST EPSS is 0.0074. The defender consequence is that the flaw moved from "vendor advisory, no details" to "public technical details plus a public check script within one day of disclosure", which is the usual precursor to scanning.
    region_nexus: "global; self-managed Atlassian Data Center is common in public-sector estates (no source states a Swiss number)"
    primary_sector_nexus: "indirect"
    sector: "public-sector, technology"
    cves: [CVE-2026-21589]
    techniques: [T1190, T1005, T1552.001, T1136.001]
    affected_products: ["Atlassian Bitbucket Data Center", "Atlassian Confluence Data Center", "Atlassian Jira Service Management Data Center", "Atlassian Jira Software Data Center", "Atlassian Bamboo Data Center", "Atlassian Crowd Data Center", "Atlassian Crucible", "Atlassian Fisheye"]
    entity_keys: ["product:atlassian-bitbucket-data-center", "product:atlassian-confluence-data-center", "product:atlassian-jira-service-management-data-center", "product:atlassian-jira-software-data-center", "product:atlassian-bamboo-data-center", "product:atlassian-crowd-data-center"]
    new_entities: []
