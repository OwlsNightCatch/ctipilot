  - title: "LibreOffice 26.2.5 / 26.8.0 close a document-opens-Java-code flaw (CVE-2026-63277) with a public PoC; Apache OpenOffice up to 4.1.16 has no fix yet"
    sources:
      - { url: "https://www.libreoffice.org/about-us/security/advisories/cve-2026-63277", publisher: "The Document Foundation (LibreOffice security advisories)", date: "2026-10-05", role: "primary" }
      - { url: "https://www.openwall.com/lists/oss-security/2026/10/02/2", publisher: "Apache OpenOffice via oss-security", date: "2026-10-02", role: "primary" }
      - { url: "https://github.com/v12-security/pocs/blob/main/office_jdbc_bugs/libreoffice/README.md", publisher: "V12 security (PoC repository)", date: "2026-10-05", role: "corroborating" }
      - { url: "https://thehackernews.com/2026/10/libreoffice-and-openoffice-flaws-let.html", publisher: "The Hacker News", date: "2026-10-06", role: "corroborating" }
      - { url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-3738", publisher: "BSI CERT-Bund WID", date: "2026-10-06", role: "corroborating" }
    discovery_trace: "first seen at: thehackernews.com feed https://feeds.feedburner.com/TheHackersNews (tools/fetch_source.py feed) -> article https://thehackernews.com/2026/10/libreoffice-and-openoffice-flaws-let.html -> primary: https://www.libreoffice.org/about-us/security/advisories/cve-2026-63277 (advisory list for 26.2.5/26.8.0) and https://www.openwall.com/lists/oss-security/2026/10/02/2 (Apache OpenOffice CVE-2026-59265) -> PoC: https://github.com/v12-security/pocs/tree/main/office_jdbc_bugs -> BSI WID-SEC-2026-3738 via tools/fetch_source.py bsi-csaf (also seen in BSI RSS)"
    summary: |
      The Document Foundation announced on 2026-10-05 a LibreOffice 26.2.5 / 26.8.0 security batch of six advisories, led by CVE-2026-63277 (CNA CVSS 4.0 8.5, vector local with user interaction): a Calc spreadsheet can carry a saved database range that auto-refreshes from a remote ODB document whose JDBC settings name a driver class and a remote JAR, so "opening the document could run Java code from that location", with no macro-style warning or active-content prompt. The same batch fixes five document-triggered data-access flaws in the same linked-data-source feature family: arbitrary file write through an embedded Firebird database (CVE-2026-63266), local-file read and GET-request forgery through the csv provider (CVE-2026-63267) and the sql provider (CVE-2026-63268), the same classes through GStreamer and HLS playlists (CVE-2026-63269) and environment/ini-file leaks (CVE-2026-63270). Apache OpenOffice has the matching flaw as CVE-2026-59265 (Apache severity critical, CWE-426): every release up to 4.1.16 is affected, the project says the fix "is expected" in 4.1.17 (release-candidate phase) and advises disabling Java runtime integration or not opening untrusted files; the OpenOffice fix is not released. Two teams reported it independently (Rick de Jager of V12; Thomas Rinsma and Edoardo Geraci of Codean Labs) and V12 published proofs of concept for both programs, with the precondition that "Java and JDBC support must be installed and enabled". No source reports exploitation (The Hacker News: only a proof of concept; CISA ADP SSVC exploitation none; FIRST EPSS 0.0015 / 0.0022). BSI CERT-Bund rates the LibreOffice batch hoch and models the attacker as local. Gap: the LibreOffice advisory names fixed builds 26.2.5 and 26.8.0 only; it states nothing for older branches such as 25.8, so their status is unconfirmed.
    region_nexus: "global; LibreOffice is widely deployed across European public administrations (no source quantifies a Swiss or DACH estate)"
    primary_sector_nexus: "indirect"
    sector: "public-sector, cross-sector"
    cves: [CVE-2026-63277, CVE-2026-59265, CVE-2026-63266, CVE-2026-63267, CVE-2026-63268, CVE-2026-63269, CVE-2026-63270]
    techniques: [T1204.002, T1203, T1105]
    affected_products: ["LibreOffice", "Apache OpenOffice"]
    entity_keys: []
    new_entities:
      - { key: "product:libreoffice", type: product, name: "LibreOffice", aliases: ["LibreOffice Calc", "The Document Foundation LibreOffice"], summary: "Open-source office suite by The Document Foundation; 26.2.5 / 26.8.0 (2026-10-05) fix a document-opens-Java-code flaw (CVE-2026-63277) and five data-access flaws in the same linked-data-source feature." }
      - { key: "product:apache-openoffice", type: product, name: "Apache OpenOffice", aliases: ["OpenOffice", "OpenOffice Calc"], summary: "Open-source office suite by the Apache Software Foundation; versions up to 4.1.16 are affected by CVE-2026-59265 (malicious document executes Java code), fix expected in 4.1.17 (Apache, 2026-10-02)." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "A document could name a Java database driver for such a link to be loaded from a remote location, so opening the document could run Java code from that location."
        attribution: "The Document Foundation"
        source_url: "https://www.libreoffice.org/about-us/security/advisories/cve-2026-63277"
      - quote: "This issue is expected to be fixed in version 4.1.17, which is in the release candidate phase."
        attribution: "Apache OpenOffice"
        source_url: "https://www.openwall.com/lists/oss-security/2026/10/02/2"
      - quote: "LibreOffice loads and instantiates the driver without a macro-style safety warning or active-content prompt."
        attribution: "V12 security"
        source_url: "https://github.com/v12-security/pocs/blob/main/office_jdbc_bugs/libreoffice/README.md"
      - quote: "So far, it has only been shown as a proof of concept, and there are no reports of its use in real attacks."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/10/libreoffice-and-openoffice-flaws-let.html"
    extended_notes: |
      Why it clears the bar: public PoC for a document-borne code-execution path that skips the macro-trust prompt, in software that is standard on public-sector desktops, with a vendor fix already available for LibreOffice; the weaker legs are the Java precondition, the required user interaction and the absence of exploitation reports. Suggested priority: notable (not high) unless the constituency runs OpenOffice or LibreOffice with Java enabled at scale.
      Behavioural description for the Detection/Triage lines (from the PoC README, no IOCs): on opening a spreadsheet, the office process makes outbound HTTP requests for a database document and then a JAR, after which the Java driver loads inside the office process and may spawn child processes; the document itself is an ODS with a persisted database range set to refresh on load. Telemetry classes: process-creation events with the office process as parent, egress/proxy logs for the office process fetching .odb/.jar resources, and JVM start from the office process. Benign lookalike: legitimate Calc documents with linked external data (csv/html/xml data providers) also fetch remote content on load; the discriminators are a JDBC driver class path pointing at a remote JAR, a JVM start with no business JDBC use, and the file arriving from email or the web.
      Hardening levers: update LibreOffice to 26.2.5 / 26.8.0; for OpenOffice disable Java runtime integration in Preferences (vendor advice) until 4.1.17; the LibreOffice fix restricts Java class-path entries to file URLs and restores only the csv, html and xml data providers on load; mail-gateway handling of ODS attachments is an analyst-level compensating control, not a vendor statement.
      Admiralty suggestion: A1 (vendor advisories from both projects plus independent discoverers).

