        attribution: "watchTowr Labs"
        source_url: "https://labs.watchtowr.com/you-wont-hear-about-these-even-in-myths-atlassian-jira-confluence-and-more-pre-auth-arbitrary-file-read-cve-2026-21589/"
      - quote: "When you access Atlassian Crowd directly with the leaked credentials, it is basically game over."
        attribution: "watchTowr Labs"
        source_url: "https://labs.watchtowr.com/you-wont-hear-about-these-even-in-myths-atlassian-jira-confluence-and-more-pre-auth-arbitrary-file-read-cve-2026-21589/"
      - quote: "Detection Artifact Generator attempts to check if the target is vulnerable to CVE-2026-21589."
        attribution: "watchTowr Labs (GitHub)"
        source_url: "https://github.com/watchtowrlabs/watchTowr-vs-Atlassian-CVE-2026-21589"
      - quote: "Atlassian cannot confirm if your instances have been affected by this vulnerability."
        attribution: "Atlassian"
        source_url: "https://confluence.atlassian.com/security/cve-2026-21589-arbitrary-file-access-vulnerability-impacts-multiple-products-1870495748.html"
    extended_notes: |
      Suggested handling: `update` record on the covered entry (it is a reader-facing delta: public technical details, a public check script and a credential-theft chain). The entry's "Atlassian found no evidence of exploitation" sentence stays true but needs the "public technical details and a public check script since 2026-10-06" qualifier, and its Exposure/Detection lines can now name the mechanism.
      Detection concept (telemetry class first): web/reverse-proxy access logs on every Data Center node, URL-decoded up to two passes (Atlassian's own guidance), searching for dot-dot sequences adjacent to a slash, backslash or double colon on plugin web-resource download routes; Atlassian publishes the regex and the Tomcat RewriteValve/urlrewrite rule. Post-patch / post-exposure check that follows mechanically from the stated chain (not a vendor statement): Crowd audit/access logs for REST calls authenticating as the Jira/Confluence/Bitbucket application account from unexpected sources, newly created Crowd users, and membership changes of administrator groups; rotate the Crowd application passwords stored in crowd.properties because the file was readable. Hardening levers: patch to the fixed versions, WAF/Tomcat rule as interim, remove internet exposure, restrict Crowd to an IP allowlist (watchTowr notes this raises the bar).
      Affected/fixed versions are unchanged from the entry (all versions below the fixed lines named in Atlassian's advisory). The vendor-versus-ticket discrepancy on Crowd 7.1.6/7.1.7 already noted in the entry is untouched.
      Admiralty suggestion: A1 (vendor advisory + independent discoverer write-up).

