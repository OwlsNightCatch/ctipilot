  - title: "@subql/common 5.8.3 npm compromise: attacker tampered with the publish workflow and shipped an infostealer through Trusted Publisher OIDC; the malicious version lived about 50 minutes"
    borderline: true
    borderline_reason: "Well-documented primary, but a Web3-indexer package with a roughly 50-minute exposure window and no stated public-sector footprint; the transferable lesson (CI workflow tampering published through an OIDC Trusted Publisher) is the only reason to keep it. Also S3's lane, so a duplicate is likely."
    sources:
      - { url: "https://flatt.tech/research/posts/subql-common-npm-supply-chain-attack/", publisher: "GMO Flatt Security Research", date: "2026-10-06", role: "primary" }
    discovery_trace: "first seen at: flatt-security, feed https://flatt.tech/research/index.xml (tools/fetch_source.py feed, reader fallback, undated items) -> primary (no pivot needed): https://flatt.tech/research/posts/subql-common-npm-supply-chain-attack/ (dated 2026-10-06 by the post)"
    summary: |
      GMO Flatt Security, from analysis on its Takumi Guard infrastructure, reports that on 2026-10-05 an attacker with push access to the subquery/subql GitHub repository committed an unsigned change to the publish workflow that downloads a prebuilt tarball from an external server and swaps it into packages/common before the publish step, then bumped the version; the workflow published @subql/common 5.8.3 to npm at 11:56 UTC as a Trusted Publisher (GitHub Actions OIDC) release, so provenance looked legitimate, and the version was removed from npm at about 12:46 UTC (a 5.8.3-onf-rt1 test release without a postinstall hook preceded it). The package adds a postinstall hook that runs an obfuscated loader which daemonizes itself, skips Russian-locale systems, steals credentials (AWS including Parameter Store and Secrets Manager across regions, GitHub tokens, Kubernetes, Vault, SSH keys, .env, .npmrc and Docker config) and offers a reverse shell; requiring the package at runtime also launches it. Flatt says some descriptions may contain inaccuracies because it prioritised speed. Anyone who installed 5.8.3 should rotate AWS, GitHub and secret-store credentials and check for a lingering background node process and lock file; the last known safe version is 5.8.2.
