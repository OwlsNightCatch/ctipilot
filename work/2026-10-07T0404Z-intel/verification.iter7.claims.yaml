  # --- new entry: ninja-forms-wpc-bundles ---
  - {claim_id: 4062dd954a, verdict: ok, source_url: "https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/", passage: "One JavaScript payload... installs an admin account you cannot see in wp-admin; 'Active exploitation observed'"}
  - {claim_id: 4fa53d58b6, verdict: ok, source_url: "https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/", passage: "first observed the payload on October 4, 2026...CVE-2026-93836; ...four independent routes; 'exploitation volume remains limited in our telemetry'"}
  - {claim_id: 3a25b905f9, verdict: ok, source_url: "https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/", passage: "Update Ninja Forms to 3.15.4 or later; 8.6.7 carries the security fix; Compare that result against what wp-admin shows; Sort by content, not by date"}
  - {claim_id: 1a738de290, verdict: ok, source_url: "https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/", passage: "rotate privileged credentials and WordPress authentication salts...that account's password should be treated as compromised even though it was never directly stolen"}
  - {claim_id: 034209c1c8, verdict: ok, source_url: "https://cveawg.mitre.org (CVE record saved in primaries/CVE-2026-94504.json)", passage: "Wordfence CNA CVSS:3.1 baseScore 7.2; Ninja Forms lessThanOrEqual 3.15.3; Patchstack: 3.15.4 or later"}
  - {claim_id: e451299ac2, verdict: ok, source_url: "primaries/CVE-2026-93836.json", passage: "Wordfence CNA CVSS 3.1 baseScore 7.2; WPC lessThanOrEqual 8.6.6; upstream changelog identifies 8.6.7"}
  - {claim_id: 57436769e2, verdict: ok, source_url: "https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/", passage: "Two unrelated WordPress plugins... first observed Oct 4 (CVE-2026-93836)... following day CVE-2026-94504 in Ninja Forms"}
  - {claim_id: eee196d2a0, verdict: ok, source_url: "https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/", passage: "quantity beginning with a valid numeric value...stored in WooCommerce order metadata; normal Ninja Forms AJAX endpoint...legacy administrative submission editor; Unauthenticated Stored XSS"}
  - {claim_id: 25ab91fc31, verdict: ok, source_url: "https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/", passage: "HttpOnly cookies do not help here, because the JavaScript never reads the cookie. It simply rides the administrator's authenticated session"}
  - {claim_id: 4809c3a36c, verdict: ok, source_url: "https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/", passage: "submits it through WordPress' own plugin installer...create administrator...fetch emer-run.php"}
  - {claim_id: 32cbed3420, verdict: ok, source_url: "https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/", passage: "Four Ways Back In: visible admin; hidden admin via mu-plugin; magic login URL oldest administrator; unauthenticated file manager reachable by direct request"}
  - {claim_id: 0abe69ba1e, verdict: ok, source_url: "https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/", passage: "takes the oldest modification time it finds, and stamps it onto the file...defeats the usual hunt for recently changed files"}
  - {claim_id: 487e61a16a, verdict: ok, source_url: "https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/", passage: "Both vulnerabilities had been publicly disclosed on September 22; exploitation volume remains limited; post-exploitation stage is plugin-agnostic"}
  - {claim_id: 302c6dc848, verdict: ok, source_url: "https://www.bleepingcomputer.com/news/security/ninja-forms-plugin-flaw-exploited-to-hack-wordpress-sites/", passage: "WPC Product Bundles 8.6.7 or later and Ninja Forms 3.15.4 or later. Updating the vulnerable plugin prevents further exploitation but does not clean an existing infection."}
  - {claim_id: 23744f8031, verdict: ok, source_url: "https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/", passage: "Ninja Forms through version 3.15.3...WPC Product Bundles ... through version 8.6.6; stored XSS... fires the moment they look"}
  - {claim_id: 254875170c, verdict: ok, source_url: "https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/", passage: "investigate any administrator account created around the time an administrator viewed WooCommerce orders or Ninja Forms submissions; _wplogin query parameter; mu-plugins never shown on Plugins screen"}
  - {claim_id: 66d70b70b0, verdict: ok, source_url: "https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/", passage: "Remove the unauthorized accounts and plugins, clear the dropped files... rotate privileged credentials and WordPress authentication salts...never directly stolen"}
  - {claim_id: 291adfd765, verdict: ok, source_url: "https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/", passage: "poses as WP Smart Thumbnails... Installed and active, it does nothing. It only detonates on a direct HTTP request"}
  - {claim_id: bff6380160, verdict: ok, source_url: "https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/", passage: "Removing the vulnerable plugin, or even the malicious one, closes none of the last three."}
