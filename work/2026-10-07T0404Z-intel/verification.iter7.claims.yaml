  # --- new entry: gentlemen/azazel ---
  - {claim_id: 797627be2c, verdict: ok, source_url: "https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files", passage: "Every confirmed victim was reached through stolen CI/CD secrets...Azazel registered a reverse shell handler as a tool...via MCP, then drove attack execution through it"}
  - {claim_id: d96e795592, verdict: ok, source_url: "https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files", passage: "Russian-speaking affiliate of the Gentlemen...approximately 6TB...Azazel recovered the master key and bulk-decrypted every protected value; hardcoded authentication bypass token...in git history"}
  - {claim_id: a66cdd2ca4, verdict: ok, source_url: "https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files", passage: "using their tooling, negotiation channels, and ransom note template...own independent data leak blog...The RaaS operator lost revenue."}
  - {claim_id: e260d40db6, verdict: ok, source_url: "https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files", passage: "Two servers...more than two dozen victim directories and approximately 6TB of stolen data spanning logistics, insurance, pharmaceutical, AI, medical devices, and government-adjacent infrastructure"}
  - {claim_id: 713b994844, verdict: ok, source_url: "https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files", passage: "Every victim outside the AI sector engagement was reached the same way. GitLab CI/CD variable stores and git repository history became credential sources"}
  - {claim_id: 74b38ec276, verdict: ok, source_url: "https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files", passage: "From a single CI/CD token, Azazel reached more than 150 databases...More than 120,000 records were exfiltrated...killing the live PostgreSQL process and deleting the production data directory"}
  - {claim_id: cfcc47b912, verdict: ok, source_url: "https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files", passage: "fetches user-supplied URLs server-side...Jasypt master key...JWT backdoor from git history...Grafana offline cracking...Live object storage exfil"}
  - {claim_id: a45c88ebbb, verdict: ok, source_url: "https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files", passage: "va.py verified delivery...checking eight surfaces...Each check was executed via exec_in_session MCP calls to 127.0.0.1:35367; CloudSEK has not identified prior public reporting"}
  - {claim_id: eecae9bd40, verdict: ok, source_url: "https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files", passage: "(see advisory finding: 'self-hosted' and 'unmasked or unprotected' are inferred from mitigations; page says 'A single GitLab instance hosted CI/CD pipelines for two unrelated organisations')"}
  - {claim_id: 4b37575a2f, verdict: ok, source_url: "https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files", passage: "Alert on CI/CD variable reads from unexpected IPs, service account token use outside normal runner infrastructure, and README or Issue modifications via pipeline token"}
  - {claim_id: 415889152d, verdict: ok, source_url: "https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files", passage: "falsepositives: Legitimate MinIO backup jobs to authorised remote destinations"}
  - {claim_id: da32c31118, verdict: ok, source_url: "https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files", passage: "Never bind an MCP server beyond strict loopback. Treat exec_in_session as a privileged operation requiring an audit trail...Azazel recovered credentials from commits that appeared removed from the current branch"}
