  summary: Osaka Metropolitan University says a large failure of its information infrastructure beginning in the early hours of 2026-10-02
    is a ransomware attack under investigation with external specialists; its maintenance vendor noticed servers stopping in sequence
    around 00:20 local time and by about 04:00 had confirmed the stopped virtual-server group and signs of data tampering (Asahi, press-conference
    timeline). According to the press conference as reported by TBS/MBS, the attackers got into the virtualization platform that the
    university's information systems run on, about 500 servers stopped, and most backup data were encrypted and unusable. Affected systems
