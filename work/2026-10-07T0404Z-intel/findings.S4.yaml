    role: corroborating
  discovery_trace: 'first seen at: piyolog, URL https://piyolog.hatenadiary.jp/ (listing) -> https://piyolog.hatenadiary.jp/entry/2026/10/06/121225
    (ARTEX compilation; its sibling https://piyolog.hatenadiary.jp/entry/2026/10/06/103019 lists the affected institutions) -> WebSearch
    ("ARTEX AI hacking tool Shinhan Bank breach Yonhap financial authorities AI attack") -> https://biz.heraldcorp.com/article/10892497
    (FSI official) and https://www.koreaherald.com/article/10892290; also bleepingcomputer feed item ''South Korea probes bank breaches
    amid suspected AI-powered attacks'' https://www.bleepingcomputer.com/news/security/south-korea-probes-bank-breaches-amid-suspected-ai-powered-attacks/.
    The FSC notice cited by BleepingComputer (https://fsc.go.kr/no010101/87869) was unreachable on every transport'
  summary: 'Between about 27 September and 2 October several South Korean banks were breached in parallel, always through internal employee-
    or partner-facing applications rather than customer internet or mobile banking: Shinhan Bank''s mobile inquiry service for loan
    agents (an attacker bypassed identity verification; its figures put the exposed people at roughly 25,000), a KB Kookmin employee
    mobile-support system, Hana Bank''s sales-support system and a BNK Busan Bank page, with two savings banks under review (Korea Herald,
    Herald Business). A Korea Financial Security Institute official told the Herald Business that the investigators traced attacker
    IPs and logs from Shinhan Bank, found evidence pointing to ARTEX AI, an open-source LLM-based autonomous penetration-testing system
    distributed via GitHub for Chinese-speaking users, and stated that a human used the AI as a tool, that attackers rotate IPs while
    the method and exploited weakness stay the same, that traffic from the tool carries a recognisable data signature, and that more
    institutions, including some outside banking, were attacked than suffered incidents (Woori and NongHyup were targeted but the weakness
    was absent). Peers found their own breaches only after the institute shared the attacker IPs sector-wide and each bank searched
    its access logs retroactively. Contradiction to hold: Piyolog, citing the institute''s head on 2026-10-04, reports he said the IP
    traces carried ARTEX traces and that the method suggests AI, but that he cannot be certain since he has not seen the agent itself,
    so the ''confirmed'' wording in the Herald Business is the official''s, not the institute head''s. Piyolog also records the ARTEX
    developer''s changelog adding, on 2026-09-19, a disclaimer gate and a default block of .gov and .edu targets, and Team Cymru''s
    and Oasis Security''s observation of exposed ARTEX infrastructure (counts and addresses deliberately not carried). The Korean regulator
    (FSC) ordered financial firms to inspect all externally accessible systems, including non-customer-facing ones.'
  region_nexus: South Korea; no Swiss nexus. Technique class (AI-agent-driven enumeration of internal web applications) matches the
    Danish CPR hypothesis and the OpenAI-agent entries
