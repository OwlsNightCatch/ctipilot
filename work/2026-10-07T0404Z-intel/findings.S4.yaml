  discovery_trace: 'first seen at: databreaches-net, URL https://databreaches.net/feed/ (item ''FBI Blames Contractor''s Missed Patch
    for ShinyHunters Breach'') https://databreaches.net/2026/10/06/fbi-blames-contractors-missed-patch-for-shinyhunters-breach/ -> pivot:
    SecurityWeek https://www.securityweek.com/fbi-blames-contractors-missed-patch-for-shinyhunters-breach/ (cites Reuters https://www.reuters.com/technology/accenture-contractor-removed-fbi-following-damaging-data-breach-sources-say-2026-10-06/,
    not readable: extract returned an empty JS shell) -> pivot: Nextgov/FCW front https://www.nextgov.com/cybersecurity/ -> primary-reporting:
    https://www.nextgov.com/cybersecurity/2026/10/fbi-removes-accenture-contractor-after-missed-security-patch-led-breach/416441/ (FBI
    statement given to Nextgov directly)'
  summary: 'Delta on the covered ShinyHunters/FBI entry, whose open question was whether the point of breach was a third party or the
    FBI''s own enterprise. FBI cyber chief Brett Leatherman now states (to Nextgov/FCW, and as relayed from Reuters by SecurityWeek)
    that the FBI''s review determined the incident resulted from a security failure of a platform managed by a third-party organisation
    after a contractor failed to implement a security patch explicitly issued to secure that platform, and that the FBI has removed
    the contractor. The FBI does not name the contractor, product or CVE. Reuters (via two people familiar, as relayed by SecurityWeek)
    says the system is Oracle''s PeopleSoft human-resources platform and the organisation is Accenture; Nextgov''s anonymous source
    adds that Accenture is responsible for software patch management and custom code at the FBI and that Oracle provided the patches
    that were not integrated. Accenture did not answer questions about the patching failure and said it is proud to support the FBI.
    Nextgov notes the statement does not address why the patch was missed or how the FBI monitored the contractor. Context SecurityWeek
    reports: ShinyHunters'' leak site is still live but a post urging victims to pay has been removed and the newest victim post is
    dated 2026-09-22. These findings fit the covered entry''s existing attribution (ShinyHunters told BleepingComputer it used the URL-encoded
    WAF bypass for the patched flaw CVE-2026-35273, a claim); the FBI statement itself neither confirms nor names that CVE.'
