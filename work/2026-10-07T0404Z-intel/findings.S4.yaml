    systems and clinical operation are unaffected; at least roughly 130,000 people's records (names, addresses, mail addresses, student-card
    photos) are stored in the affected systems and exfiltration is under investigation; the university declined to say whether a ransom
    was demanded. Classes were cancelled through 8 October. The entry vector and the actor are not public. Reported to the personal-data
    authority, the ministry, the founding prefecture and city, JPCERT and police.
