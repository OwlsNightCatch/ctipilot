- title: 'Liechtenstein VwbP beneficial-ownership register breach: government tells parliament no misuse of the stolen data is known,
    vulnerabilities are fixed, the register partly reopened on 5 October and an external IT review is due in H1 2027'
  sources:
  - url: https://www.inside-it.ch/liechtenstein-will-nach-cyberangriff-luecken-geschlossen-haben-20261006
    publisher: Inside IT (reports Head of Government Haas' answer to a Landtag question)
    date: '2026-10-06'
    role: primary
  discovery_trace: 'first seen at: WebFetch of https://www.inside-it.ch/ (listing, headline ''Liechtenstein will nach Cyberangriff Lücken
    geschlossen haben'') -> https://www.inside-it.ch/liechtenstein-will-nach-cyberangriff-luecken-geschlossen-haben-20261006 (extract).
    The underlying Landtag answer was searched (landtag.li Kleine Anfragen) and not found; no second outlet located (vaterland.li and
    landesspiegel.li front pages showed nothing on it; volksblatt.li and llv.li unreachable on every transport)'
  summary: 'Status-only delta on the covered Liechtenstein VwbP entry (31,000 legal-entity records copied on 2026-07-30). Inside IT
    reports Head of Government Brigitte Haas'' written answer to MP Johannes Kaiser: since the end of August the findings have been
    further verified, there is still no indication of concrete misuse of the stolen data, and the criminal investigation continues;
    the identified vulnerabilities have been fixed and a data-integrity check found no sign that VwbP data were altered; further security
    reviews and additional protections were implemented; the other state IT systems taken offline as a precaution have completed their
    security reviews and are running again; the VwbP register itself resumed operation in restricted form on 2026-10-05. The external
    IT review (incident reconstruction, audit of selected systems, governance) is still in procurement, with results expected in the
    first half of 2027. Inside IT repeats what the IT office head said in August (already in the entry): unauthorised access was possible
    through faulty authorisation-check logic and the attackers used the API through repeated single requests; the actor remains unknown.
    No new technical detail.'
