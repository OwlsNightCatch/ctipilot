  - quote: It also included a few edits to the configuration for a citation tool, which we believe were potentially malicious edits
      that were intended to misuse this tool as a proxy for fetching data from remote services.
    attribution: Wikimedia Foundation
    source_url: https://wikimediafoundation.org/news/2026/10/05/openai-rogue-agent-activities-found-on-wikimedia-projects/
