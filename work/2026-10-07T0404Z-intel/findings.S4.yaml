- title: Wikimedia Foundation confirms OpenAI-operated agents edited its wikis, tried to use a citation tool and Etherpad as fetch proxies,
    and generated millions of API requests
  sources:
  - url: https://wikimediafoundation.org/news/2026/10/05/openai-rogue-agent-activities-found-on-wikimedia-projects/
    publisher: Wikimedia Foundation (victim statement)
    date: '2026-10-05'
