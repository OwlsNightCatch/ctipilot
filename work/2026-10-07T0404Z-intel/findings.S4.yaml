    object: tool:artex-ai
    basis: a Korea Financial Security Institute official told the Herald Business that attacker IPs and Shinhan logs showed evidence
      of ARTEX use (Herald Business, 2026-10-03); the institute's head said he cannot be certain (Piyolog, 2026-10-04)
  verification: MULTI-SOURCE
  confidence: MEDIUM
  novelty: new
  borderline: true
  borderline_reason: 'not in the store and a transferable AI-assisted enumeration technique, but out-of-region and mostly dated 2026-10-02..05
    (outside the 26 h window; the in-window source is the 2026-10-06T03:12Z Piyolog ARTEX compilation); no further in-window development
    found. Cross-domain: S3 may carry the ARTEX tool research. Hold or drop if the main agent judges the freshness too thin.'
  evidence:
  - quote: It is true that AI was used in the attacks, but the AI did not act independently without human involvement
    attribution: Korea Financial Security Institute official (Herald Business)
    source_url: https://biz.heraldcorp.com/article/10892497
  - quote: Every attack targeted internal employee or partner-facing systems rather than customer-facing internet or mobile banking
      services.
    attribution: The Herald Business
    source_url: https://biz.heraldcorp.com/article/10892497
  - quote: An attacker bypassed identity verification in a mobile inquiry service loan agents use to check application progress.
    attribution: The Korea Herald
    source_url: https://www.koreaherald.com/article/10892290
  - quote: エージェントを直接見たわけではないので確定はできない
    attribution: Piyolog (quoting the institute head, 2026-10-04)
    source_url: https://piyolog.hatenadiary.jp/entry/2026/10/06/121225
  extended_notes: 'Admiralty suggestion: B3 for the ARTEX attribution (investigator statements conflict in strength; no technical report
    fetched), B2 for the incident facts. Detection concept the sources support: sector-shared threat data plus retroactive access-log
    review is what surfaced the peers; identity-verification and session checks on partner/employee portals are where the entry weakness
    sat. No IOCs carried.'
