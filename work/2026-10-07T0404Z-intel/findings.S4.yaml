    source_url: https://www.datatilsynet.dk/presse-og-nyheder/nyhedsarkiv/2026/okt/datatilsynet-er-opmaerksom-paa-sag-om-opslag-i-cpr
  - quote: Det var en dyr faktura, der gav hint om, at der var sket et brud - ikke systematiske alamer.
    attribution: DR Nyheder
    source_url: https://www.dr.dk/nyheder/indland/live-uvedkommende-har-haft-adgang-til-millioner-af-cpr-numre
  - quote: En efterforskning pågår, og politiet har været forbi fysisk hos en mindre virksomhed for at indsamle spor.
    attribution: DR Nyheder
    source_url: https://www.dr.dk/nyheder/indland/live-uvedkommende-har-haft-adgang-til-millioner-af-cpr-numre
  - quote: Det kunne være en hypotese, når der er lavet så mange opslag på så kort tid, at man måske har anvendt en algoritme.
    attribution: DR Nyheder (NSK centre head Henriette Erbs)
    source_url: https://www.dr.dk/nyheder/indland/live-uvedkommende-har-haft-adgang-til-millioner-af-cpr-numre
  - quote: Man kan ikke længere bruge CPR-nummeret som en måde at autentificere sig på.
    attribution: DR Nyheder (director, Styrelsen for Samfundssikkerhed)
    source_url: https://www.dr.dk/nyheder/indland/live-uvedkommende-har-haft-adgang-til-millioner-af-cpr-numre
  extended_notes: 'Entry fields that move: summary/body gain the technique class (automated lookups enumerating valid CPR numbers) and
    the detection trigger (an anomalous bill, not a security alarm; the minister had already said red lights should have lit). The existing
    entry''s techniques [T1199, T1213] stay; T1119 (Automated Collection) is supported by ''automated lookups''. Telemetry hook the
    sources support: per-party lookup-volume and billing/usage metering on a register''s third-party interface. The analogy to Swiss
    registers with private lookup access is the composer''s inference, not sourced. Dropped as non-actionable: Danish public advice
    to citizens (sikkerdigital.dk). Admiralty suggestion: A2 (authority first-hand; AI element is hypothesis, attribute to NSK). Freshness:
    source dates 2026-10-05 (authority) and 2026-10-06 (DR); the existing entry was composed 2026-10-06T04:57Z from the ministry release
    and Ritzau and missed both.'
