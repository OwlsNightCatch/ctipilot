- title: 'Denmark CPR register breach: the data-protection authority describes a very large number of automated lookups to find valid
    CPR numbers; the 6 October press briefing adds a billing anomaly as the detection trigger, a police AI/algorithm hypothesis and
    a physical police visit to the company'
