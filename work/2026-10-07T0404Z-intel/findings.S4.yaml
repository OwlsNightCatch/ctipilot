    -> its outbound link to the Datatilsynet notice https://www.datatilsynet.dk/presse-og-nyheder/nyhedsarkiv/2026/okt/datatilsynet-er-opmaerksom-paa-sag-om-opslag-i-cpr
    (primary) -> pivot: DR news front https://www.dr.dk/nyheder/indland (extract, then WebFetch for hrefs) -> DR live blog https://www.dr.dk/nyheder/indland/live-uvedkommende-har-haft-adgang-til-millioner-af-cpr-numre
    (JSON-LD liveBlogUpdate entries dated 2026-10-06T14:05Z-15:40Z carry the press-briefing content)'
  summary: 'Delta on the covered Danish CPR entry, which says no source names the method. The Danish data-protection authority states
    (2026-10-05) that CPR''s own notification, received Sunday 4 October, describes a very large number of automated lookups against
    the CPR system aimed at identifying valid CPR numbers (translated). That fixes the technique class as high-volume automated enumeration
    through a lawfully granted third-party lookup right, not intrusion into the register. DR''s live blog from the 6 October press briefing
    adds: the investigation is under way and police visited a smaller company in person to collect traces; foreign police have been
    contacted in case foreign actors are behind it; an unusually large invoice, not systematic alarms, hinted that a breach had occurred
    (DR also reports the authorities confirmed that the invoice at a smaller company alerted them); the director of Styrelsen for Samfundssikkerhed
    said the CPR number can no longer be used to authenticate a person; neither the actor, the method of compromise nor the company
    whose access was abused was disclosed. A centre head at the police unit NSK (Henriette Erbs, per DR) said that so many lookups in
    so short a time make it a hypothesis that an algorithm was used, that police are looking into it and that she cannot say more at
    present; DR''s framing is AI. That is a police hypothesis, not a finding; DR''s legal correspondent adds that organised crime and
    state actors are both being considered. Dates: the Datatilsynet notice and BleepingComputer are 2026-10-05 and were not in the existing
    entry; the DR entries are 2026-10-06.'
  region_nexus: Denmark (neighbouring-region national population register; third-party lookup access path is a pattern common to European
    registers)
