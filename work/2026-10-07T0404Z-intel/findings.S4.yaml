  summary: 'On 2026-10-06 ASOS app users received a push notification headed ''ASOS HACKED'' addressed to the company''s DPO and IT
    team, claiming a full compromise of its Snowflake instance and demanding engagement under threat of a leak, with a link to a Telegram
    channel run by a self-styled ''Xuanye group'' (BleepingComputer, CyberInsider). ASOS confirmed in a regulatory announcement that
    an unauthorised customer notification was sent at about 10am and that it is investigating unauthorised activity involving third-party
    platforms it uses to communicate with customers, restricted access to those notification platforms, and says basic personal information
    such as name and contact details may have been accessed while payment-card data and passwords are not believed affected. ASOS has
    not confirmed the Snowflake claim, the number of affected customers or the access vector; the group''s own statements (customer
    data held on its server, no payment data) are claims. Defender-relevant behaviour: the extortion demand was delivered to the whole
    user base through the victim''s own push channel, i.e. control of a third-party messaging platform tenant became the pressure lever;
