      - { url: "https://www.inside-it.ch/liechtenstein-verstaerkt-it-schutz-nach-datenklau-20260819", publisher: "Inside IT (2026-08-20)", date: "2026-08-20", role: "corroborating" }
      - { url: "https://www.bj.admin.ch/de/newnsb/L0rkU9ZvCFSw", publisher: "Bundesamt für Justiz (BJ)", date: "2026-10-01", role: "corroborating" }
    discovery_trace: >-
