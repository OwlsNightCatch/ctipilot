      Microsoft's Digital Defense Report 2026 (reporting period 2025-07-01 to 2026-06-30; published 1-2 October) is the
      week's annual report and is not in the store. Its Swiss-specific content, read from the report PDF itself: Microsoft
      Switzerland states that Swiss customers rank 13th in Europe and 39th worldwide for how often they are hit by malicious
      activity (Ukraine, UK and Germany lead Europe, France sixth). In the PDF's nation-state section Switzerland is listed
      with 20 in the Europe block of the regional sample of observed activity (eighth of ten listed) and appears tenth, at
      2%, in the top-ten targeted countries for Russian state actors (that table's sector split: think tanks and NGOs 25%,
      government 14%, other 13%, IT 11%, research and academia 11%, defense industry 5%). The ransomware-landscape section
      carries a year-over-year country table that lists Switzerland at 29 for the 2025 period and 59 for the 2026 period
      (+103%); the extracted text does not state the unit, and the section's context is public leak-site victims and
      Defender-detected ransom events. The same section's industry table lists "Government agencies and services" rising from 57
      to 133, and Microsoft names Qilin the leading family by leak-site victims (16.4%, up 386%) with Akira the most active
      in Defender-detected enterprise events (22%, up 150%; Qilin 14%, up 111%). On Russian tradecraft the report says actors
      lean harder on identity and cloud abuse, including OAuth-application abuse and token replay, some use adversary-in-the-
      middle capability at the network edge and at ISP level for selective interception, and some target internet-facing edge
      devices; it ties the December 2025 destructive attack on Poland's energy sector to that edge-device access vector.
      Correction of a secondary: dcod's Swiss article says Switzerland is fifth most targeted by North Korean groups (about 2%)
      and that Russian espionage in Switzerland concentrates on administrations, NGOs and energy; the report's North Korea
      top-ten countries table (United States 43%, Republic of Korea 7%, UK 5%, India 4%, Germany 4%, Japan 4%, Australia 3%,
      Canada 2%, France 2%, Philippines 1%) does not list Switzerland, and the Russia sector split is global, not Swiss. dcod's
      ransomware doubling (29 to 59) and Russia top-ten placement do match the PDF.
