  # ------------------------------------------------------------------ 5
  - title: "Chrome blocks unauthorized certificates after registry-level hijacks of the .gh, .sl and .as ccTLDs; Google urges CT monitoring of every domain and restrictive CAA with ACME account binding"
    sources:
      - { url: "https://blog.google/security/chromes-response-to-recent-cctld-registry-hijacks/", publisher: "Google (Chrome Secure Web and Networking Team)", date: "2026-10-06", role: "primary" }
    discovery_trace: >-
      first seen at: google-tag RSS https://blog.google/security/rss/ (item 2026-10-06 11:53Z) → drill (extract)
      https://blog.google/security/chromes-response-to-recent-cctld-registry-hijacks/ → primary (no pivot needed); corroboration
      attempted with three WebSearch queries (".gh .sl .as ccTLD registry hijack unauthorized certificates ...", "Sierra Leone .sl domain
      registry compromised ...", "Chrome CRLSets blocks certificates after .gh .sl .as ccTLD ...") and found none
    summary: |
      Google's Chrome security team reports that in the week before 2026-10-06 it learned of a series of domain hijacks in the
      .gh (Ghana), .sl (Sierra Leone) and .as (American Samoa) country-code namespaces. Google says the incidents were not a
      compromise of its own systems: attackers compromised the third-party ccTLDs, modified authoritative DNS records and
      obtained unauthorized HTTPS certificates covering several Google domains and domains of other organizations; Google has
      no reason to believe the issuing certificate authorities erred. Chrome blocked the certificates through CRLSets, worked
      with the CAs to get them revoked, and, after Certificate Transparency log data showed more affected organizations
      including several leading global brands, proactively blocked those as well and notified owners where possible. Google
      cautions that it cannot guarantee it found every affected domain and that its Chrome-side blocks do not protect other
      clients. Domain-owner guidance: monitor Certificate Transparency for all domains including parked and regional ccTLD
      properties, and publish restrictive CAA records with ACME account bindings and validation-method restrictions, which
      cannot stop issuance during an active DNS hijack but stop an attacker reusing cached domain-control-validation state
      after the hijack ends. The registry operators, the hijack mechanism at the registries, the actor and the exact
      timeline are not stated in the post.
    region_nexus: "global; no stated Swiss nexus (relevant only to domains under .gh/.sl/.as; guidance transfers to every domain portfolio)"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: []
    techniques: [T1584.001, T1588.004]
    affected_products: ["Google Chrome"]
    entity_keys: []
    new_entities: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    classification_hint: { reliability: B, credibility: 2, note: "first-party statement from the browser vendor about its own response; no independent corroboration found; registries silent" }
    novelty: new
    evidence:
      - quote: "Last week, we became aware of a series of domain hijacks in the .gh (Ghana), .sl (Sierra Leone), and .as (American Samoa) country-code top-level namespaces (i.e., ccTLDs)."
        attribution: "Google (Chrome Secure Web and Networking Team)"
        source_url: "https://blog.google/security/chromes-response-to-recent-cctld-registry-hijacks/"
      - quote: "During these hijacks, attackers modified authoritative DNS records and obtained unauthorized HTTPS certificates covering several Google domains, as well as domains belonging to other organizations."
        attribution: "Google (Chrome Secure Web and Networking Team)"
        source_url: "https://blog.google/security/chromes-response-to-recent-cctld-registry-hijacks/"
      - quote: "Perform ongoing monitoring of Certificate Transparency for all of your domains"
        attribution: "Google (Chrome Secure Web and Networking Team)"
        source_url: "https://blog.google/security/chromes-response-to-recent-cctld-registry-hijacks/"
    extended_notes: |
      Hunt/hardening concepts the post supports: telemetry class = Certificate Transparency log monitoring and DNS
      change/authoritative-record monitoring for every domain the organization owns (parked and country-code properties
      included); lever = CAA with accounturi and validationmethods (RFC 8657) restored promptly after any DNS hijack. No Swiss
      public-sector exposure is known; the Swiss registry (Switch, .ch/.li) is not named. S1/S3 may judge it a DNS/PKI
      infrastructure item of general interest.
    borderline: true
    borderline_reason: "No Swiss nexus and single first-party source; concrete, low-cost hardening levers for any organization that owns country-code domains. Lean KEEP as a short threat item only if the main agent wants a DNS/PKI-trust lens; otherwise drop."

  # ------------------------------------------------------------------ 6
  - title: "Swiss communes' e-mail authentication: SPF near-universal but strict DMARC on ~13%, and 87% of Microsoft 365 communes lack a strict DMARC policy (ESORICS 2026 workshop paper, 2,109 Swiss municipalities)"
    sources:
      - { url: "https://papers.mxmap-project.org/secassure2026.pdf", publisher: "Bischof, Huser, Ochsner, Petrlic, Portmann (ESORICS 2026 workshop accepted manuscript)", date: "2026-10-06", role: "primary" }
      - { url: "https://www.swisscybersecurity.net/news/2026-10-06/mehr-als-jede-zweite-schweizer-gemeinde-setzt-auf-microsoft", publisher: "SwissCybersecurity.net", date: "2026-10-06", role: "corroborating" }
      - { url: "https://www.inside-it.ch/schweizer-gemeinden-gut-geschuetzt-vor-e-mail-betrug-20261005", publisher: "Inside IT", date: "2026-10-05", role: "corroborating" }
    discovery_trace: >-
      first seen at: swisscybersecurity-net via WebFetch https://www.swisscybersecurity.net/ (item 2026-10-06 "Mehr als jede zweite Schweizer Gemeinde
      setzt auf Microsoft") → drill (extract) https://www.swisscybersecurity.net/news/2026-10-06/mehr-als-jede-zweite-schweizer-gemeinde-setzt-auf-microsoft
      → primary: paper PDF linked there, read with `pdf` https://papers.mxmap-project.org/secassure2026.pdf (Swiss table row read);
      second framing: inside-it-ch RSS https://www.inside-it.ch/rss.xml → https://www.inside-it.ch/schweizer-gemeinden-gut-geschuetzt-vor-e-mail-betrug-20261005
    summary: |
      Researchers at the University of Fribourg, Lucerne University of Applied Sciences and two German universities of applied
      sciences measured provider dependence and e-mail authentication across more than 15,000 municipal domains in Germany,
      Austria and Switzerland (DNS fingerprinting plus active SPF, DMARC and DANE probes, April 2026). For Switzerland (2,109
      municipalities in the paper's table) SPF is present on 99.2% of domains with a strict policy on 79.9%, DMARC is present
      on 55.5% but enforcement at the strictest level (reject) on only 13.4%, and DANE on 7.3%. Roughly 52% of Swiss
      communes (1,099) run Microsoft 365 and 87% of those have no strict DMARC rule; domestic providers show about twice the
      strict-DMARC coverage of US-cloud providers in every country. The authors read provider category as shaping which
      mechanisms get deployed rather than as a scalar security level. The two Swiss trade-press write-ups of the same paper
      frame it oppositely (Inside IT: communes "mostly well protected"; SwissCybersecurity.net: "clear gaps" in sender
      protection); the paper's own abstract says strict enforcement policies and effective DMARC configurations are rare.
      Actionable lever for communal IT: publish DMARC at p=reject (after report-only monitoring) on every sending and
      non-sending domain; spoofed tax-authority and municipal mail is the scenario the press ties this to.
    region_nexus: "Switzerland (communal level), DACH comparison"
    primary_sector_nexus: "direct (communal administrations)"
    sector: "public-sector"
    cves: []
    techniques: [T1672, T1566]
    affected_products: ["Microsoft 365"]
    entity_keys: []
    new_entities: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    classification_hint: { reliability: B, credibility: 2, note: "peer-reviewed workshop paper (accepted manuscript) with passive measurement; press framings conflict, primary numbers are consistent across both" }
    novelty: new
    evidence:
      - quote: "Zwar haben knapp 56 Prozent der Schweizer Gemeinden DMARC eingerichtet, doch nur gut 13 Prozent verlangen die strengste Konsequenz und lassen solche Nachrichten abweisen."
        attribution: "SwissCybersecurity.net"
        source_url: "https://www.swisscybersecurity.net/news/2026-10-06/mehr-als-jede-zweite-schweizer-gemeinde-setzt-auf-microsoft"
      - quote: "Auch bei Microsoft 365 bleibt diese Lücke gross: 87 Prozent der Schweizer Gemeinden, die den Dienst nutzen, haben keine strikte DMARC-Regel aktiviert."
        attribution: "SwissCybersecurity.net"
        source_url: "https://www.swisscybersecurity.net/news/2026-10-06/mehr-als-jede-zweite-schweizer-gemeinde-setzt-auf-microsoft"
    extended_notes: |
      Table row read from the paper (columns as extracted): Switzerland 2,109 | 99.2% | 79.9% | 55.5% | 13.4% | 7.3%
      (column headers were not recoverable from the extracted text; the press reports map them to SPF present, SPF strict,
      DMARC present, DMARC strict, DANE). Passive DNS measurement of April 2026; 93 Swiss communes could not be attributed to
      a provider because upstream security gateways mask the infrastructure. Inside IT's lead sentence ("2110 Gemeinden setzen
      auf Microsoft 365") misreads the sample size as the Microsoft count.
    borderline: true
    borderline_reason: "Direct communal-tier posture data with a clear hardening lever (DMARC enforcement) but routine, point-in-time measurement; no incident or exploitation. Lean DROP unless the main agent wants one short communal-tier research entry."

