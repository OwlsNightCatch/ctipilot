    extended_notes: |
      Suggested changelog scope (type update): body gains a short "Update" section carrying the 2026-08-19 root-cause
      statement (authorisation-logic flaw, API abused via repeated single requests, not a classic software vulnerability),
      the eID-upstream and monitoring remediation, the 2026-10-05 restricted restart and the 2026-10-06 status; fields:
      summary, body, sources, evidence, sourcing_note. The existing techniques (T1213, T1190) already fit; the "new user account"
      step (NZZ 2026-08-07, already in the entry) is also what the government's registration-area finding concerns.
      Detection concept the sources support (telemetry class: web/API access logs of the register's application tier):
      one external principal issuing a long run of single-entity lookups far above its own and the legitimate-user
      baseline; the entry's Triage paragraph already carries that discriminator. Analyst inference (mine, not a source
      claim): a per-account query cap, which BJ describes for the Swiss register, would bound exactly this enumeration
      pattern (NZZ: it took the attacker several hours to read 31,000 records one by one). The existing entry's action
      about forged breach notifications is unaffected. Prior-fire visibility: the BJ go-live release (2026-10-01) and the
      2026-08-19 government release were available to earlier fires and are not in the store; the Oct-6 status is the new
      trigger.

