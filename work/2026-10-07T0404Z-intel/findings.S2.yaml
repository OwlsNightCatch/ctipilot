  - title: "Liechtenstein VwbP register breach: government states the root cause as faulty authorisation-checking logic abused through single-record API requests; register back in restricted operation 2026-10-05"
    sources:
      - { url: "https://www.presseportal.ch/de/pm/100000148/100941692", publisher: "Regierung des Fürstentums Liechtenstein", date: "2026-08-19", role: "primary" }
      - { url: "https://www.presseportal.ch/de/pm/100000148/100941875", publisher: "Regierung des Fürstentums Liechtenstein (2026-08-31 release)", date: "2026-08-31", role: "primary" }
