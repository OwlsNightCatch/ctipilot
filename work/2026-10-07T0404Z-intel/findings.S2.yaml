      Government's answer to a Landtag inquiry; the government's own reply text was not located) → pivot: Inside IT
      2026-08-20 https://www.inside-it.ch/liechtenstein-verstaerkt-it-schutz-nach-datenklau-20260819 → primary: Government of
      Liechtenstein release 2026-08-19 https://www.presseportal.ch/de/pm/100000148/100941692 (found via WebSearch
      ("Sicherheitsanalyse VwbP abgeschlossen fehlerhafte Logik Überprüfung der Berechtigungen eID vorgeschaltet Regierung
      Liechtenstein Medienmitteilung")) → https://www.presseportal.ch/de/pm/100000148/100941875 (2026-08-31, external review);
      Swiss context: WebSearch ("Transparenzregister Schweiz Start 1. Oktober 2026 ...") → BJ release
      https://www.bj.admin.ch/de/newnsb/L0rkU9ZvCFSw
    summary: |
      The entry for this incident records the access mechanism only as "a vulnerability in the reporting portal" (NZZ via the
      Liechtenstein IT office). The government's own release of 2026-08-19, which the entry does not carry, is more precise:
      the security analysis found that unauthorised access to the beneficial-ownership register (VwbP) was possible "due to
      faulty authorisation-checking logic", which let the attacker abuse the register's API "through repeated individual
      requests in a manner that was not intended". The Head of the Office of Information Technology, Fabian Schmid, adds it
      "was not a classic software vulnerability" and withholds further technical detail for investigative reasons. The weak
      spot sat in the registration area; the announced fixes are an eID step placed upstream of user-account verification and
      identity checking, plus extended monitoring and detection so unauthorised access is noticed earlier. The government
      announced on 2026-08-31 that an international audit firm will review this incident, audit further systems holding
      sensitive data and review IT procurement, control and administration.
      On 2026-10-06 Inside IT, relaying Head of Government Brigitte Haas's answer to a Landtag inquiry, reports: no
      indication of concrete misuse of the copied data; the identified vulnerabilities are fixed and data integrity was
      checked with no sign that VwbP data was altered; the other state systems taken offline as a precaution have passed
      their security reviews and are back in service; the VwbP itself resumed in restricted form on 2026-10-05; criminal
      investigations continue and the actor is still unknown; the external IT review is still in procurement and the
      government expects results in the first half of 2027. The 2026-10-06 status rests on that single relayed account.
      Swiss context: the federal Transparenzregister (Bundesamt für Justiz) went live on 2026-10-01, the date the Federal
      Council had confirmed in the thread this entry already carries (VSV/SBVg concern, 2026-08-31). The BJ release states
      that the number of possible queries is limited, access is protected by multi-stage authentication, the system runs in a
      specially secured network with data held on a single physical server in Switzerland, and internal and external
      vulnerability tests recur; some services (full-register query, difference report) are not yet available.
    region_nexus: "Liechtenstein (customs- and currency-union neighbour of Switzerland); Swiss federal Transparenzregister went live 2026-10-01 and holds the equivalent dataset"
