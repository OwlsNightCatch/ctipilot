    summary: |
      Reuters, citing three sources and relayed by heise (2026-10-04) and SwissCybersecurity.net (update of 2026-10-06),
      reports that a ShinyHunters member active under the handle "Rey" was detained in Jordan this week and is cooperating with
      the FBI, handing investigators access to his devices so they can map the group's network, identities and locations;
      SwissCybersecurity.net names him as Sali at-Din Khader and says he "reportedly" gave the FBI his digital
      correspondence. The FBI would not confirm the Reuters report directly but, per heise, said there had already been
      several arrests in the case; the stored entry records only the earlier Dutch arrest of a 24-year-old. heise adds, again
      citing Reuters, that the group's dark-web site disappeared on Wednesday (2026-09-30), that Reuters and 404 Media lost
      contact with their ShinyHunters sources, and that a group-linked email told Reuters the group wants no further
      escalation with the FBI (SwissCybersecurity.net: a "complete retreat"). dcod relays 404 Media that the group says it
      will not publish the 2-3 TB taken from the FBI recruitment portal. All of this is anonymous-source reporting and a
      criminal group's own statement: the detention is unconfirmed by the FBI, the Reuters piece itself could not be read in
      this run, and a no-publication pledge does not remove the data from the group's hands.
