  - title: "Switzerland: parliament refers motion 24.4393 to the Federal Council: identification duty for .ch/.swiss registrants and a wider legal basis for blocking abused domains"
    sources:
      - { url: "https://ws.parlament.ch/odata.svc/Business(ID=20244393,Language='DE')?$format=json", publisher: "Swiss Federal Assembly (Curia Vista OData, motion 24.4393)", date: "2026-10-01", role: "primary" }
      - { url: "https://www.swisscybersecurity.net/news/2026-03-20/parlament-will-betruegern-das-handwerk-legen", publisher: "SwissCybersecurity.net", date: "2026-10-06", role: "corroborating" }
      - { url: "https://www.inside-it.ch/schweizer-domains-werden-besser-geschuetzt-20261002", publisher: "Inside IT", date: "2026-10-02", role: "corroborating" }
    discovery_trace: >-
      first seen at: netzwoche via WebFetch https://www.netzwoche.ch/ (item "Update: Parlament fordert mehr Schutz für Schweizer
      Internetadressen", 2026-10-06) and swisscybersecurity-net via WebFetch https://www.swisscybersecurity.net/ → drill (extract)
      https://www.swisscybersecurity.net/news/2026-03-20/parlament-will-betruegern-das-handwerk-legen → pivot: inside-it-ch RSS
      https://www.inside-it.ch/rss.xml → https://www.inside-it.ch/schweizer-domains-werden-besser-geschuetzt-20261002 → primary:
      Curia Vista OData (the parlament.ch geschaeft page is a client-rendered template) fetched with `url`:
      https://ws.parlament.ch/odata.svc/Business(ID=20244393,Language='DE')?$format=json and /BusinessStates?$format=json
    summary: |
      Motion 24.4393 (Michael Götte, SVP/SG) "Es braucht griffige Massnahmen gegen die missbräuchliche Verwendung von
      schweizerischen Domains!" carries the Curia Vista status "Überwiesen an den Bundesrat" dated 2026-10-01. It instructs
      the Federal Council to change the legal basis so that .ch and .swiss domains are issued only to unambiguously
      identified natural or legal persons, and so that the technical and administrative blocking of an abused domain by the
      authorities is no longer limited to phishing and malware but covers other abuse cases (the motion's reasoning points at
      Art. 15(1) of the Internet Domains Ordinance, VID, and at registrars who currently face little consequence for
      inadequate registrant checks, with Switch to be involved). After a second round in the National Council and again in the
      Council of States, the Council of States followed the National Council's original text and kept the identification duty;
      the Federal Council recommended acceptance. SwissCybersecurity.net also quotes Hostpoint's co-founder opposing an
      identification duty as a cost with little benefit. No operational change yet: the Federal Council must now draft the
      ordinance or law changes. For defenders it signals a wider future takedown route (other criminal abuse beyond phishing
      and malware) and stricter registrant identity checks behind .ch/.swiss registrations; current reporting and blocking
      channels are unchanged.
