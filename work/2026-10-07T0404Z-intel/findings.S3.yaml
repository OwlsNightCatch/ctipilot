  - title: "CL-STA-1178 'Blinder Tunnel': a recruitment-lure Visual Studio project executes on project load, then an AppDomainManager hijack disables ETW and GitHub carries the C2"
    sources:
      - { url: "https://unit42.paloaltonetworks.com/blinder-tunnel-targets-critical-infrastructure/", publisher: "Palo Alto Networks Unit 42", date: "2026-10-06", role: "primary" }
      - { url: "https://www.elastic.co/security-labs/the-shelby-strategy", publisher: "Elastic Security Labs", date: "2025-03-26", role: "corroborating" }
    discovery_trace: "first seen at: unit42, feed URL https://unit42.paloaltonetworks.com/feed/ (item dated Tue, 06 Oct 2026 10:00:33 +0000) → primary: Unit 42 article, URL https://unit42.paloaltonetworks.com/blinder-tunnel-targets-critical-infrastructure/ (extract) → background pivot from the article's own link: Elastic Security Labs 'The Shelby Strategy', URL https://www.elastic.co/security-labs/the-shelby-strategy (describes the earlier SHELBYLOADER/SHELBYC2 GitHub-C2 activity; does not cover the 2026 campaign)"
    summary: |
      Unit 42 (2026-10-06) tracks an Iranian state-aligned cluster as CL-STA-1178 and names its March 2026 campaign against
      an individual in Iraqi critical infrastructure "Blinder Tunnel"; infrastructure was staged from November 2025, and the
      same actor ran conflict-themed Google Drive credential phishing against an Israeli entity in May-June 2026. Delivery:
      a recruiter persona impersonating a Dubai Airports IT department sent a decoy Inno Setup "career portal", then a
      weaponised C# Visual Studio project as an at-home coding test. The project file overrides the GetFrameworkPaths
      target that Visual Studio runs in its design-time build, so code executes the moment the project is opened, before any
      compile; it copies a Microsoft-signed Visual Studio host binary under a renamed filename into a user-profile
      folder and launches it. A .config file beside that binary replaces the .NET AppDomainManager to load the malware and
      sets etwEnable to false, which Unit 42 says impairs ETW-based detection; a DLL then sideloads. The loader (ShelbyLoader
      V2) uses the GitHub API with a hard-coded personal access token for tasking and, if that is revoked, a dead-drop in
      GitHub issue comments hidden in HTML comment markers and encrypted per machine. Follow-on: ShelbyC2 V2 RAT, a module
      that runs PowerShell inside a hosted runspace in the hijacked process so no powershell.exe is created, and Blackwood,
      a loader for the open-source Chisel tunnelling tool giving a reverse SOCKS proxy. Attribution is Unit 42's own
      assessment (high confidence, Iranian nexus) resting on Iranian-hosted infrastructure, MP3 metadata pointing to an
      Iranian music site, regional victimology, and TTP resemblance (AppDomainManager hijack to disable ETW like
      Screening Serpens; in-memory .NET PowerShell wrappers like Agent Serpens), which Unit 42 itself calls low-confidence
      overlaps; the link to Elastic's earlier Shelby research rests on the shared "Peaky Blinders" naming. GitHub removed
      the malicious infrastructure Unit 42 identified. Unit 42 states it knows of no breach of Dubai Airports.
    region_nexus: "Middle East (Iraq, UAE, Israel); no Swiss or European target stated"
    primary_sector_nexus: "indirect: transferable developer-workstation and living-off-the-cloud tradecraft"
    sector: "critical-infrastructure"
    cves: []
    techniques: [T1204.002, T1127.001, T1574.014, T1574.001, T1685, T1102.001, T1059.001, T1572, T1547.001]
    affected_products: ["Microsoft Visual Studio", "Microsoft .NET Framework", "GitHub"]
