  - title: "Attackers hijacked the .gh, .sl and .as ccTLD registries, edited authoritative DNS and obtained valid certificates for Google and other brands (Chrome)"
    sources:
      - { url: "https://blog.google/security/chromes-response-to-recent-cctld-registry-hijacks/", publisher: "Google (Chrome Secure Web and Networking Team)", date: "2026-10-06", role: "primary" }
      - { url: "https://securityonline.info/cctld-registry-hijack/", publisher: "Daily CyberSecurity", date: "2026-10-07", role: "corroborating" }
    discovery_trace: "first seen at: google-tag, feed URL https://blog.google/security/rss/ (item 'Chrome's Response to Recent ccTLD Registry Hijacks', Tue 06 Oct 2026 11:53, safety-net sweep of research feeds beyond the S3 slice) → primary: Google blog post, URL https://blog.google/security/chromes-response-to-recent-cctld-registry-hijacks/ → pivot: WebSearch ('Chrome blocks certificates ccTLD hijacks .gh .sl .as Google domains Certificate Transparency') → Daily CyberSecurity rewrite, URL https://securityonline.info/cctld-registry-hijack/ (not independent; no other independent coverage or registry statement was located)"
    summary: |
      Google's Chrome team (2026-10-06) says that "last week" it became aware of a series of domain hijacks in the .gh (Ghana),
      .sl (Sierra Leone) and .as (American Samoa) country-code namespaces: attackers compromised the third-party ccTLDs, which
      puts every domain under them at risk, modified authoritative DNS records, and obtained unauthorized HTTPS certificates
      covering several Google domains and domains of other organizations. Google's statement that the CAs did nothing wrong
      follows from how validation works: control of the authoritative DNS passes automated domain-control checks. Chrome
      blocked the certificates through CRLSets and worked with the issuing CAs to have them revoked; Certificate Transparency
      data then revealed further affected brands and services, which Chrome also blocked, contacting owners where possible.
      Google does not name the affected domains, the CAs, the certificate count, the registries' own status or any actor, and
      says it cannot guarantee it found every affected domain nor that browser blocking protects non-Chrome clients. Advice
      to domain owners: monitor Certificate Transparency for the whole domain portfolio including parked or regional
      ccTLD domains; publish restrictive CAA records bound to specific ACME accounts and validation methods, because CAs may
      reuse cached domain-validation results, so a restrictive policy restored after the hijack prevents certificate minting
      from cached validation. No independent corroboration of the registry compromises (registry statements) was found.
    region_nexus: "global; Africa and Pacific ccTLD registries; no Swiss target stated"
    primary_sector_nexus: "indirect: DNS and certificate hygiene for any government domain portfolio"
    sector: "technology"
    cves: []
    techniques: [T1584.001, T1584.002]
    affected_products: ["Google Chrome", "ccTLD registries .gh .sl .as"]
    entity_keys: []
    new_entities:
      - { key: "incident:cctld-registry-hijacks-gh-sl-as", type: incident, name: "ccTLD registry hijacks (.gh, .sl, .as) used to obtain certificates",
          aliases: [],
          summary: "September-October 2026 compromises of the Ghana, Sierra Leone and American Samoa country-code registries; attackers changed authoritative DNS and obtained unauthorized HTTPS certificates for Google and other brands (Google Chrome, 2026-10-06)." }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: "No Swiss or constituency domain named and the affected registries are outside the constituency's TLDs; value is the transferable CT-monitoring and CAA-with-ACME-binding control and the cached-validation point. Single first-party source; no registry statement or actor named."
    evidence:
      - quote: "attackers modified authoritative DNS records and obtained unauthorized HTTPS certificates covering several Google domains, as well as domains belonging to other organizations."
        attribution: "Google (Chrome Secure Web and Networking Team)"
        source_url: "https://blog.google/security/chromes-response-to-recent-cctld-registry-hijacks/"
      - quote: "browser-side intervention should not be relied on to protect your users."
        attribution: "Google (Chrome Secure Web and Networking Team)"
        source_url: "https://blog.google/security/chromes-response-to-recent-cctld-registry-hijacks/"
      - quote: "Due to the nature of the attacks, we have no reason to believe the Certification Authorities (CAs) that issued the impacted certificates did anything wrong."
        attribution: "Google (Chrome Secure Web and Networking Team)"
        source_url: "https://blog.google/security/chromes-response-to-recent-cctld-registry-hijacks/"
    extended_notes: |
      Exposure: any organization holding or relying on domains under .gh, .sl or .as (including defensive or parked
      registrations) and any service whose users do not run Chrome. Detection: Certificate Transparency monitor alerts on
      issuance for owned names from an unexpected CA or ACME account; authoritative DNS change/NS-delegation monitoring for
      every ccTLD domain in the portfolio; passive DNS or resolver logs showing a registered name suddenly resolving to
      new addresses. Hardening (Google's): CAA with accounturi and validationmethods (RFC 8657) restored after DNS control
      is regained; short certificate lifetimes and reduced validation reuse are cited as ecosystem direction. The post does
      not say whether the .ch/.li registries or any European TLD were affected.

