      - { key: "campaign:blinder-tunnel", type: campaign, name: "Blinder Tunnel", aliases: [],
          summary: "March 2026 campaign by CL-STA-1178 against Iraqi critical infrastructure using a fake Dubai Airports recruitment lure, a trojanized Visual Studio project and GitHub-API C2 (Unit 42, 2026-10-06)." }
      - { key: "malware:shelbyloader", type: malware, name: "ShelbyLoader / ShelbyC2", aliases: ["ShelbyLoader V2", "ShelbyC2 V2", "SHELBYLOADER", "SHELBYC2"],
