  # ------------------------------------------------------------------ 6
  - title: "Harbor container registry: any user who can create a project can aim a webhook at internal addresses and cloud metadata (GHSA-2phj-cp9f-qq6w), fixed in 2.13.6, 2.14.5, 2.15.3 and 2.16.0"
    sources:
      - { url: "https://www.ox.security/blog/harbor-ssrf-vulnerability-cloud-credentials/", publisher: "OX Security", date: "2026-10-06", role: "primary" }
      - { url: "https://github.com/goharbor/harbor/security/advisories/GHSA-2phj-cp9f-qq6w", publisher: "Harbor project (GitHub security advisory)", date: "2026-10-06", role: "primary" }
    discovery_trace: "first seen at: ox-security, raw listing https://www.ox.security/blog/ (post dated October 6, 2026, bridge url) → primary: OX Security article, URL https://www.ox.security/blog/harbor-ssrf-vulnerability-cloud-credentials/ (extract) → vendor primary: Harbor GitHub advisory GHSA-2phj-cp9f-qq6w, URL https://github.com/goharbor/harbor/security/advisories/GHSA-2phj-cp9f-qq6w"
    summary: |
      OX Research disclosed, and the Harbor project published the same day (2026-10-06), an SSRF in Harbor's webhook delivery,
      tracked as GHSA-2phj-cp9f-qq6w (no CVE identifier appears in either source; OX rates it CVSS 6.4 moderate, CWE-918).
      Root cause per OX: validateTargets() when a webhook policy is created only checks that the scheme is http or https and
      that the URL parses, and delivery by the jobservice passes the stored address to a plain HTTP client, so loopback,
      RFC 1918 and link-local addresses, including the cloud metadata endpoint, are accepted. Prerequisite: the
      NotificationPolicy create permission, which every user receives as project admin of a project they create; with the
      default setting Project Creation "Everyone", any registered account suffices. Affected: every Harbor version with
      webhooks (1.7.0 and later); fixed in v2.13.6, v2.14.5, v2.15.3 and v2.16.0, and after upgrading private, loopback
      and link-local webhook targets are rejected and existing ones stop being delivered unless the operator sets the
      allow_private_network_access option (or the HARBOR_ALLOW_PRIVATE_NETWORK_ACCESS variable). The sources differ on
      impact: OX says the instance's temporary cloud IAM credentials can be harvested and also leak into the
      project-readable task log, while the Harbor advisory words it more narrowly (the POST reaches internal services and
      the response body is logged only when the target answers with an error status). OX also claims that a Shodan-based
      scan on 2026-09-23 found 6,370 reachable instances, all on pre-fix versions, 718 on cloud ranges and 25 with
      self-registration; this is OX's own measurement. No exploitation is reported; OX says a proof of concept is forthcoming.
    region_nexus: "global; Harbor is a common registry in public-sector Kubernetes and CI/CD platforms (no Swiss instance named)"
    primary_sector_nexus: "indirect"
    sector: "technology"
    cves: []
    techniques: [T1190, T1552.005]
    affected_products: ["Harbor (CNCF container registry)"]
    entity_keys: []
    new_entities:
      - { key: "product:harbor", type: product, name: "Harbor (CNCF container registry)", aliases: ["goharbor/harbor"],
          summary: "Open-source CNCF container registry hosting images for CI/CD and Kubernetes; subject of GHSA-2phj-cp9f-qq6w (webhook SSRF), October 2026." }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    borderline: true
    borderline_reason: "Moderate CVSS (6.4), authenticated prerequisite, no exploitation reported and no CVE yet; relevant only where Harbor runs with Project Creation set to Everyone or on a cloud host whose metadata service is reachable from the jobservice."
    evidence:
      - quote: "validateTargets() only confirms the scheme is http/https and that the URL parses."
        attribution: "OX Security"
        source_url: "https://www.ox.security/blog/harbor-ssrf-vulnerability-cloud-credentials/"
      - quote: "If the target answers with an error status, the response body is written to the webhook execution log, which project members can read."
        attribution: "Harbor project (GitHub security advisory)"
        source_url: "https://github.com/goharbor/harbor/security/advisories/GHSA-2phj-cp9f-qq6w"
      - quote: "so untrusted users cannot become project admin"
        attribution: "Harbor project (GitHub security advisory)"
        source_url: "https://github.com/goharbor/harbor/security/advisories/GHSA-2phj-cp9f-qq6w"
    extended_notes: |
      Exposure check (vendor): you are affected if you run Harbor 1.7.0+, untrusted users can become project admin (default
      Project Creation: Everyone) and the jobservice can reach internal services or a cloud metadata endpoint. Interim
      controls (vendor): set Project Creation to Admin Only, restrict outbound traffic from the jobservice
      (NetworkPolicy or firewall, always block 169.254.169.254), require token-based metadata access (IMDSv2 or the provider
      equivalent). Post-patch / compromise check (vendor): review existing webhook targets for private IP literals,
      localhost, link-local or internal service names with a query on the notification_policy table, and read the execution
      logs of those policies; if any target pointed at a metadata endpoint, rotate the instance role credentials.

