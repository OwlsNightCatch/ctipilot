      - { subject: "actor:cl-sta-1178", object: "actor:screening-serpens-unc1549-smoke-sandstorm-nimbus-manticore-iran-apt", basis: "Unit 42 (2026-10-06) reports low-confidence overlaps in TTPs (AppDomainManager hijacking to disable ETW) with Screening Serpens; not an equivalence claim" }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: "No Swiss or European target; value is the transferable chain (design-time project execution, AppDomainManager config with ETW disabled, GitHub API as C2, in-process PowerShell runspace) for developer and IT workstations; single vendor source."
    evidence:
      - quote: "We discovered that an Iranian state-aligned threat actor has been masquerading as the Dubai Airports IT department to deliver trojanized coding challenges to high-value targets."
        attribution: "Palo Alto Networks Unit 42"
        source_url: "https://unit42.paloaltonetworks.com/blinder-tunnel-targets-critical-infrastructure/"
      - quote: "the attackers defined a custom XML target with this exact name in their malicious .csproj file, overriding the safe Microsoft default behavior."
        attribution: "Palo Alto Networks Unit 42"
        source_url: "https://unit42.paloaltonetworks.com/blinder-tunnel-targets-critical-infrastructure/"
      - quote: "Because Event Tracing for Windows (ETW) is critical for monitoring execution and detecting in-memory threats, this flag could impair detection capabilities."
        attribution: "Palo Alto Networks Unit 42"
        source_url: "https://unit42.paloaltonetworks.com/blinder-tunnel-targets-critical-infrastructure/"
      - quote: "We assess with high confidence that this activity aligns with an Iranian-nexus threat."
        attribution: "Palo Alto Networks Unit 42"
        source_url: "https://unit42.paloaltonetworks.com/blinder-tunnel-targets-critical-infrastructure/"
    extended_notes: |
      Exposure: developers and IT staff who open third-party Visual Studio projects (coding tests, recruiter or contractor
      repositories) on a workstation with unrestricted outbound HTTPS. Detection (telemetry classes, from the source's
      mechanism): process-creation lineage showing msbuild.exe or the Visual Studio design-time build copying executables and
      launching one from a user-profile folder; a renamed Microsoft-signed .NET host binary with a sidecar .config that
      names an appDomainManager assembly or sets etwEnable to false; DLL loads from the application's own folder by a
      binary that normally lives elsewhere; non-browser, non-git processes calling api.github.com with a personal access
      token or the issue-search API; a loaded System.Management.Automation module in a process that is not powershell.exe,
      pwsh.exe or a known host. Benign lookalike: genuine developer tooling legitimately calls GitHub APIs and
      MSBuild targets copy files; the discriminators are an unexpected parent (project open, not a build the developer
      started), an unsigned or unexpected DLL beside a signed host and a .config that changes ETW or app-domain
      settings. Unit 42 lists a Cortex XDR block on the sideload; no Microsoft mitigation for the design-time build
      behaviour is stated in the article. Hardening named by Unit 42 is limited to securing developer environments and
      monitoring anomalous cloud-platform traffic. The article carries hashes, IPs and domains (not reproduced here).

