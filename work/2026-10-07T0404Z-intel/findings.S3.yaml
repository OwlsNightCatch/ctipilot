  - title: "CVE-2026-21589, Atlassian Data Center: watchTowr publishes the root cause and a checker, and shows how the file read reaches Crowd administrator"
    sources:
      - { url: "https://labs.watchtowr.com/you-wont-hear-about-these-even-in-myths-atlassian-jira-confluence-and-more-pre-auth-arbitrary-file-read-cve-2026-21589/", publisher: "watchTowr Labs", date: "2026-10-06", role: "primary" }
      - { url: "https://github.com/watchtowrlabs/watchTowr-vs-Atlassian-CVE-2026-21589", publisher: "watchTowr (GitHub)", date: "2026-10-06", role: "primary" }
    discovery_trace: "first seen at: watchtowr, feed URL https://labs.watchtowr.com/rss/ (item dated 2026-10-06 17:01Z; safety-net feed sweep beyond the S3 slice) → primary: watchTowr Labs post, URL https://labs.watchtowr.com/you-wont-hear-about-these-even-in-myths-atlassian-jira-confluence-and-more-pre-auth-arbitrary-file-read-cve-2026-21589/ → pivot: watchTowr GitHub repository linked from the post, URL https://github.com/watchtowrlabs/watchTowr-vs-Atlassian-CVE-2026-21589. Dedup: prior_coverage entry 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access states there was no independent technical analysis."
    summary: |
      watchTowr Labs (2026-10-06) diffed a vulnerable and a fixed build of the atlassian-plugins-webresource library
      (6.0.7 against 6.0.8), the component shared by Jira, Confluence and Bitbucket, and places the flaw in the web-resource
      Router: it converts a double colon in a request path into a slash before it resolves a plugin resource, so a
      "..::" sequence walks out of the resource directory through a deprecated relative-path resolver that is still
      reachable. watchTowr reports reading any file inside the application server's Tomcat context, WEB-INF included, but
      not outside it, and verified routes on Jira, Confluence and Bitbucket (Bitbucket blocks web.xml but not other
      WEB-INF files). Impact claim, from watchTowr's own lab build: where a product is integrated with Atlassian Crowd,
      WEB-INF/classes/crowd.properties stores the application name and its password in plaintext, and watchTowr used
      those against the Crowd REST API to create an account and add it to the Jira administrators group; it notes that a
      Crowd IP allow-list would make that step harder. watchTowr also published a GitHub "Detection Artifact Generator"
      that sends the traversal to Jira, Confluence and Bitbucket hosts to test them. This is the first independent
      technical analysis of the flaw; it does not contradict Atlassian's advisory, but it changes the exploitation outlook
      from "no evidence of exploitation, root cause unpublished" to "root cause, request shape and a runnable checker are
      public". watchTowr reports no in-the-wild exploitation, and estimates exposure from its own internet search (nearly
      700,000 Confluence login pages), an estimate not a measured vulnerable count.
    region_nexus: "global; self-managed Atlassian Data Center is common in public-sector development and service-desk estates"
    primary_sector_nexus: "indirect (generic enterprise/public-sector software)"
    sector: "technology"
    cves: [CVE-2026-21589]
    techniques: [T1190, T1005, T1552.001, T1136]
    affected_products: ["Atlassian Bitbucket Data Center", "Atlassian Confluence Data Center", "Atlassian Jira Service Management Data Center", "Atlassian Jira Software Data Center", "Atlassian Crowd Data Center"]
    entity_keys: ["product:atlassian-bitbucket-data-center", "product:atlassian-confluence-data-center", "product:atlassian-jira-service-management-data-center", "product:atlassian-jira-software-data-center", "product:atlassian-crowd-data-center"]
    new_entities: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-of:2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access"
    evidence:
      - quote: "While we are not able to traverse outside of the Tomcat context, we discovered it is possible to read any file within the application server itself."
        attribution: "watchTowr Labs"
        source_url: "https://labs.watchtowr.com/you-wont-hear-about-these-even-in-myths-atlassian-jira-confluence-and-more-pre-auth-arbitrary-file-read-cve-2026-21589/"
      - quote: "The password for the application, in plaintext."
        attribution: "watchTowr Labs"
        source_url: "https://labs.watchtowr.com/you-wont-hear-about-these-even-in-myths-atlassian-jira-confluence-and-more-pre-auth-arbitrary-file-read-cve-2026-21589/"
      - quote: "When you access Atlassian Crowd directly with the leaked credentials, it is basically game over."
        attribution: "watchTowr Labs"
        source_url: "https://labs.watchtowr.com/you-wont-hear-about-these-even-in-myths-atlassian-jira-confluence-and-more-pre-auth-arbitrary-file-read-cve-2026-21589/"
      - quote: "Detection Artifact Generator attempts to check if the target is vulnerable to CVE-2026-21589."
        attribution: "watchTowr (GitHub)"
        source_url: "https://github.com/watchtowrlabs/watchTowr-vs-Atlassian-CVE-2026-21589"
    extended_notes: |
      Delta for the existing entry (changelog record, type update): (1) independent root-cause analysis now public (shared
      web-resource library, "::" to "/" mapping, deprecated relative-path resolver) plus a runnable checker on GitHub, so
      the "no independent technical analysis" caveat no longer holds; (2) the impact is not limited to reading files the
      attacker must already know: the Crowd integration file gives a plaintext application credential and a path to
      directory-service administrator; (3) post-patch compromise check: after upgrading, rotate the Crowd application
      password stored in crowd.properties of every Jira/Confluence/Bitbucket integrated with Crowd, and review Crowd for
      accounts created or group memberships changed since the exposure began (the existing log hunt for ".." next to "::"
      stays the entry point); (4) hardening lever beyond the patch: restrict Crowd REST access to an allow-list of the
      integrated application hosts, which watchTowr says makes the pivot harder. The fetched watchTowr text does not state
      a CVSS change or exploitation. Atlassian's own advisory (already cited in the entry) remains the patch reference.
      Overlap note: S1 (watchtowr is an essential record there) may return the same post; one changelog record is enough.

