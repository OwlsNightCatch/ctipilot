  - title: "The Gentlemen affiliate 'Azazel': a parallel leak site, an all-CI/CD-secrets intrusion chain and the first reported MCP-driven attack execution (CloudSEK)"
    lookback: true
    event_date: "2026-10-05"
    sources:
      - { url: "https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files", publisher: "CloudSEK TRIAD", date: "2026-10-05", role: "primary" }
      - { url: "https://www.infosecurity-magazine.com/news/affiliate-doublecrosses-raas/", publisher: "Infosecurity Magazine", date: "2026-10-06", role: "corroborating" }
    discovery_trace: "first seen at: infosec-magazine, feed URL https://www.infosecurity-magazine.com/rss/news/ (item 'Ransomware Affiliate Double-Crosses RaaS Operator to Steal Victim Funds', Tue 06 Oct 2026 08:30 GMT) → pivot: Infosecurity Magazine article, URL https://www.infosecurity-magazine.com/news/affiliate-doublecrosses-raas/ → primary: CloudSEK TRIAD report, URL https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files (dated 2026-10-05, also in feed https://www.cloudsek.com/blog/rss.xml). Infosecurity is a rewrite of the CloudSEK report, not an independent source."
    summary: |
      CloudSEK (2026-10-05) analysed two exposed servers (an open directory) belonging to "Azazel", a Russian-speaking
      affiliate of The Gentlemen RaaS, and reports about 6 TB of stolen data across more than two dozen victims in six
      countries (logistics, insurance, pharmaceutical, AI, medical devices and "government-adjacent infrastructure"), none
      named. Claims, all CloudSEK's: Azazel used the Gentlemen's tooling and negotiation channel but published victims
      on his own leak site (LEAKNED) and kept the proceeds, bypassing the operator. Every non-AI victim was reached
      through stolen CI/CD secrets: GitLab CI/CD variable stores and git history mined with GitLab-focused enumeration and
      secret-scanning tools, one GitLab instance serving two unrelated organisations gave footholds at both, and in
      one case a single CI/CD token reached more than 150 databases and hundreds of source repositories across a SaaS
      platform and its clients. A second chain against an AI medical-imaging company ran for weeks: SSRF through an
      unauthenticated API that fetches user-supplied URLs reached internal services, a Jasypt master key decrypted every
      configuration secret, a JWT bypass token removed from the code but still in git history gave permanent access,
      Grafana database hashes were cracked offline, a MinIO bucket was mirrored continuously and kubeconfig files were swept
      from the loot. A platform hosting a government-linked financial registry lost over 120,000 records and had its
      PostgreSQL process killed and data directory deleted after exfiltration. Ransom-note delivery was scripted across
      eight surfaces (message of the day, SSH banner, a PostgreSQL parameter, a database admin login template, a repository
      README and a GitLab issue among them). CloudSEK reports Azazel registered a reverse-shell handler as a tool in an AI coding
      assistant over MCP and drove attack commands through a loopback-bound MCP port, and ran internet-wide scanning for
      exposed MCP ports; CloudSEK states it has found no earlier public report of MCP used operationally this way. Exfil path:
      cloud sync, scp, pg_dump or HTTP POST to a C2 host, then a dedicated staging server, then MEGA.
    region_nexus: "global (six countries, unnamed); no Swiss victim stated"
    primary_sector_nexus: "indirect: government-adjacent victims; GitLab/Kubernetes/MinIO estates common in public-sector platforms"
    sector: "multiple (technology, logistics, healthcare, government-adjacent)"
    cves: []
    techniques: [T1190, T1213.003, T1552.001, T1078, T1530, T1567.002, T1485, T1491.001]
    affected_products: ["GitLab", "MinIO", "Grafana", "Kubernetes", "Model Context Protocol (MCP) servers"]
    entity_keys: ["actor:thegentlemen", "product:gitlab", "product:model-context-protocol-mcp"]
    new_entities:
      - { key: "actor:azazel", type: actor, name: "Azazel", aliases: ["LEAKNED operator"],
          summary: "Russian-speaking Gentlemen RaaS affiliate that, per CloudSEK (2026-10-05), ran his own leak site LEAKNED alongside the program, reached victims through stolen CI/CD secrets and drove attack commands through an MCP-connected AI coding assistant." }
    relation_suggestions:
      - { subject: "actor:azazel", object: "actor:thegentlemen", basis: "CloudSEK (2026-10-05): Azazel is an affiliate of the Gentlemen ransomware group using its tooling and ransom note template" }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Every confirmed victim was reached through stolen CI/CD secrets."
        attribution: "CloudSEK TRIAD"
        source_url: "https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files"
      - quote: "Azazel registered a reverse shell handler as a tool inside an AI coding assistant via MCP, then drove attack execution through it."
        attribution: "CloudSEK TRIAD"
        source_url: "https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files"
      - quote: "He built and operated his own independent leak site under the brand LEAKNED"
        attribution: "CloudSEK TRIAD"
        source_url: "https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files"
      - quote: "It’s likely the secrets were deleted by their developers from the current version of Git repositories but remained in earlier commits, which Azazel found."
        attribution: "Infosecurity Magazine"
        source_url: "https://www.infosecurity-magazine.com/news/affiliate-doublecrosses-raas/"
    extended_notes: |
      Why it matters beyond the actor: the access path is credentials, not exploits, and it is reproducible against any
      self-hosted GitLab or CI runner estate. Detection concepts (CloudSEK's mitigations restated by telemetry class):
      CI/CD audit logs for variable reads and token use from addresses outside the runner fleet; git and project audit events
      for bulk repository clone or history walks by one token; object-storage access logs for a bulk mirror/sync client
      from an unexpected source; web/API logs for server-side URL-fetch endpoints requesting link-local or internal addresses;
      for MCP, inventory any MCP server bound beyond loopback and log initialize/exec-style tool calls from clients outside
      an allowlist (CloudSEK calls the client identity "hermes" and the scanner fingerprint "internet-census-mcp-scanner"
      malicious indicators for this operator). Hardening: secrets manager instead of pipeline variables, rotation of any
      credential that was ever committed (history, not only the current branch), IMDS/loopback egress controls for URL-fetch
      features, do not treat Jasypt ENC() values as a boundary. Dedup/context: The Gentlemen are already tracked
      (actor:thegentlemen; FTAPI incident entry 2026-10-02 and several earlier entries), so this is a delta on tradecraft and
      affiliate-model dynamics, not a new actor story. CloudSEK is a single vendor source and the leak-site/victim details are
      its own reading of exposed infrastructure; the Sigma rule in the report was not reproduced.

