          summary: "Loader that runs the open-source Chisel tunnelling tool in memory (reverse SOCKS proxy); earlier documented by CPX and used by CL-STA-1178 per Unit 42 (2026-10-06)." }
    relation_suggestions:
      - { subject: "actor:cl-sta-1178", object: "malware:shelbyloader", basis: "Unit 42 (2026-10-06): the attackers deployed ShelbyLoader V2 and ShelbyC2 V2" }
