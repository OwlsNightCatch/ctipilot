      - { url: "https://www.securityweek.com/fbi-blames-contractors-missed-patch-for-shinyhunters-breach/", publisher: "SecurityWeek", date: "2026-10-06", role: "primary" }
    discovery_trace: "first seen at: securityweek, WebFetch listing of https://www.securityweek.com/ (headline 'FBI Blames Contractor's Missed Patch for ShinyHunters Breach', 2026-10-06) → primary available: SecurityWeek article, URL https://www.securityweek.com/fbi-blames-contractors-missed-patch-for-shinyhunters-breach/, which relays an FBI statement and a Reuters report → Reuters original (https://www.reuters.com/technology/accenture-contractor-removed-fbi-following-damaging-data-breach-sources-say-2026-10-06/) blocked to WebFetch; no fbi.gov statement page found by WebSearch (two queries)"
    summary: |
      Reuters reported on 2026-10-06, per SecurityWeek, that the FBI removed an Accenture contractor after the breach that
      exposed personal information of thousands of bureau employees. The FBI has not named the contractor or the
      platform; Reuters' two sources say the system was Oracle's PeopleSoft human-resources platform. The FBI cyber chief's
      statement, as quoted by SecurityWeek, attributes the incident to "a security failure of a platform managed by a
      third-party organization" after "a contractor failed to implement a security patch explicitly issued to secure the
      platform". Accenture did not answer questions and said it is proud to support the FBI's mission. Delta against the
      existing entry: the FBI's statement of 2026-09-23 said the point of breach was undetermined between a third party and
      its own enterprise; the FBI now states the cause is an unapplied vendor patch on a third-party-managed platform. The
      quoted statement does not say which patch, or whether the contractor relied on a firewall-rule workaround instead of
      the patch. SecurityWeek also notes
      ShinyHunters' site is still live, its payment-pressure post was removed and its latest victim post is dated
      2026-09-22. Reuters' separate report of a ShinyHunters member detained in Jordan (SecurityWeek, 2026-10-05) is
      sourced to anonymous people and the FBI did not confirm it; earlier fires dropped it and it is not carried here.
