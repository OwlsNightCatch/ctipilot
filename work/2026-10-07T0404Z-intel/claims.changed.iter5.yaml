  - claim_id: feb5b62e33
    entry: 2026-09-28/cve-2019-18935-telerik-godzilla-webshell-virtualpathprovider
    surface: "record 2026-10-07T04:55:00Z"
    kind: record-summary
    text: "The entry called the two AhnLab cases unrelated and 2026 intrusions, which ASEC does not say or date; the headline, summary and text now describe two attack cases in Korea, and the Detection line states ASEC's account of the shell's request header. CISA's Known Exploited Vulnerabilities catalog has listed CVE-2019-18935 since 2021-11-03 and, in version 2026.10.04, marks it as used in known ransomware campaigns; the catalog does not date that flag, so a server found exploited warrants a check for follow-on activity as a precaution, not only the patch."
