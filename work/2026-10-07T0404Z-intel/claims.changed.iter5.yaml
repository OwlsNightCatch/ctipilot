  - claim_id: 8527f66c77
    entry: 2026-09-28/cve-2019-18935-telerik-godzilla-webshell-virtualpathprovider
    surface: "summary"
    kind: frontmatter
    text: "AhnLab ASEC reports two separate attack cases in Korea exploiting CVE-2019-18935, a .NET deserialization flaw in Telerik UI for ASP.NET AJAX's RadAsyncUpload feature, patched since version 2020.1.114 but still reachable on unpatched IIS deployments. One installs a file-less, memory-resident Godzilla-protocol web shell via ASP.NET's VirtualPathProvider extensibility point plus a web-shell-adapted SweetPotato privilege-escalation tool; the other drops only a Rust-based external reconnaissance scanner reporting hits over the Telegram Bot API."
  - claim_id: 1b12331e51
    entry: 2026-09-28/cve-2019-18935-telerik-godzilla-webshell-virtualpathprovider
    surface: "body"
    kind: cited
    text: "AhnLab's ASEC documents two separate attack cases in Korea that both exploit CVE-2019-18935, a .NET deserialization vulnerability in the RadAsyncUpload file-upload feature of Telerik UI for ASP.NET AJAX, patched by the vendor since version 2020.1.114 but still reachable on unpatched IIS deployments; successful exploitation executes code with the privileges of the `w3wp.exe` worker-process account ("
    urls: ["https://asec.ahnlab.com/en/95561/"]
  - claim_id: d5d3a4d8ee
    entry: 2026-09-28/cve-2019-18935-telerik-godzilla-webshell-virtualpathprovider
    surface: "body"
    kind: cited
    text: "The second case used the same CVE purely to launch a Rust-based reconnaissance scanner: it pulls a target list from an operator-controlled server, asynchronously probes each target across candidate URL paths for exposed WordPress installer/configuration pages, and reports any hit back to the operator over the Telegram Bot API, without dropping a reverse shell or web shell on the compromised Telerik host itself ("
    urls: ["https://asec.ahnlab.com/en/95561/"]
  - claim_id: ce571355ef
    entry: 2026-09-28/cve-2019-18935-telerik-godzilla-webshell-virtualpathprovider
    surface: "body"
    kind: cited
    text: "ASEC says the installed shell tells its actions apart by the request's `Type` header, so a request carrying that header to a Telerik endpoint is worth checking ("
    urls: ["https://asec.ahnlab.com/en/95561/"]
  - claim_id: 4a754653ed
    entry: 2026-09-28/cve-2019-18935-telerik-godzilla-webshell-virtualpathprovider
    surface: "body"
    kind: uncited
    text: "For the second case, look for outbound connections from an IIS host to `api.telegram.org`, a pattern with no legitimate counterpart on a production Telerik/IIS server."
