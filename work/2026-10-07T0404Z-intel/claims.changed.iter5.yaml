    surface: "record 2026-10-07T04:54:00Z"
    kind: record-summary
    text: "The government's release of 2026-08-19 states the cause as faulty authorisation-checking logic abused through repeated individual API requests, not a classic software vulnerability, and adds an upstream eID step to account verification and wider monitoring; the Head of Government told the Landtag the weaknesses are fixed, data integrity was checked and the register resumed in restricted form on 2026-10-05, with no sign of misuse of the copied data. With the weaknesses fixed and the register reopened, the incident no longer calls for a decision, and the do-now action about forged notifications is withdrawn."
