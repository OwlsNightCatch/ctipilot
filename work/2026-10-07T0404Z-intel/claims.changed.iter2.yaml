  - claim_id: 4fa53d58b6
    entry: 2026-10-07/ninja-forms-wpc-bundles-stored-xss-hidden-admin-campaign
    surface: "summary"
    kind: frontmatter
    text: "Patchstack reports that since 2026-10-04 one campaign has been exploiting two unrelated stored cross-site scripting flaws, CVE-2026-93836 in WPC Product Bundles for WooCommerce up to 8.6.6 and CVE-2026-94504 in Ninja Forms up to 3.15.3, by planting a script in an order or a form submission that runs when a logged-in administrator opens it. The script uses the administrator's own session to install a malicious plugin and create administrators, one of them hidden from the Users screen, and leaves four independent ways back in, so updating to Ninja Forms 3.15.4 or WPC Product Bundles 8.6.7 stops new injections but does not evict an implant. Patchstack says exploitation volume is limited so far and that the second stage works with any stored XSS that reaches an administrator."
  - claim_id: 3a25b905f9
    entry: 2026-10-07/ninja-forms-wpc-bundles-stored-xss-hidden-admin-campaign
    surface: "actions[0]"
    kind: frontmatter
    text: "Update Ninja Forms to 3.15.4 or later and WPC Product Bundles for WooCommerce to 8.6.7 or later on every WordPress site, then check each site for an implant the update does not remove, starting with a comparison of the database's administrator list against the Users screen and an inspection of the must-use plugins directory by content."
  - claim_id: 254875170c
    entry: 2026-10-07/ninja-forms-wpc-bundles-stored-xss-hidden-admin-campaign
    surface: "body"
    kind: cited
    text: "**Detection:** in web server logs, public POSTs to the plugin's form-submit endpoint or to a product URL whose fields carry script or an image error handler that loads a remote script; in WordPress audit and database records, a plugin-upload install, a user creation and a call to a persistence installer around the time an administrator opens a submission or an order, administrator rows in the users and metadata tables that the Users screen does not list, PHP files under the must-use plugins directory that the Plugins screen never shows, and requests to the login page carrying a token parameter ("
    urls: ["https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/"]
  - claim_id: 4f3cf090a7
    entry: 2026-10-07/ninja-forms-wpc-bundles-stored-xss-hidden-admin-campaign
    surface: "body"
    kind: derived
    text: "**Triage:** a legitimate administrator installing a plugin from a ZIP produces the same plugin-install and user-creation events; the discriminators are that they follow an administrator opening a stored submission or order, that the installed plugin is an empty decoy, and that the new administrator is missing from the Users list."
  - claim_id: 61eae9cdca
    entry: 2026-10-07/gentlemen-affiliate-azazel-ci-cd-secrets-mcp-attacks
    surface: "summary"
    kind: frontmatter
    text: "CloudSEK analysed two exposed servers of \"Azazel\", a Russian-speaking affiliate of the Gentlemen ransomware group who also ran his own leak site, and reports about 6 TB of stolen data from more than two dozen organisations in six countries, among them government-adjacent infrastructure. It says every confirmed victim was reached through stolen CI/CD secrets, mainly GitLab variable stores and git history, that one deeper intrusion into an AI platform chained server-side request forgery, a recovered master key that decrypted the configuration and a token recovered from git history, and that Azazel drove attack commands through an MCP server on a local port. The report is a single source and names no victim."
  - claim_id: 713b994844
    entry: 2026-10-07/gentlemen-affiliate-azazel-ci-cd-secrets-mcp-attacks
    surface: "body"
    kind: cited
    text: "Every victim outside one deeper intrusion was reached the same way: GitLab CI/CD variable stores and git history were mined for tokens, database credentials, API keys and SSH private keys with enumeration and secret-scanning tools, and one GitLab instance that served two unrelated organisations gave footholds at both ("
    urls: ["https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files"]
  - claim_id: 6748b1a164
    entry: 2026-10-07/gentlemen-affiliate-azazel-ci-cd-secrets-mcp-attacks
    surface: "body"
    kind: cited
    text: "Ransom notes were pushed to eight surfaces, among them the login message, the SSH banner, a database configuration parameter, a database-admin login template, a repository README and an issue opened against the victim's project, and CloudSEK reports that the verification script drove these checks through an MCP server bound to a local port, an operational use of MCP as an attack execution channel that, CloudSEK says, no earlier public report describes ("
    urls: ["https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files"]
  - claim_id: 57e2685c8e
    entry: 2026-10-07/cl-sta-1178-blinder-tunnel-csproj-lure-github-c2
    surface: "body"
    kind: cited
    text: "**Detection:** process-creation lineage showing Visual Studio or the build engine copying executables into a user-profile folder and launching one at project open; a renamed, signed Microsoft host binary with a sidecar configuration file that names an app-domain manager or turns ETW off; binaries that load unknown or non-standard DLLs outside system directories, which Unit 42 advises monitoring; non-browser, non-git processes calling the GitHub API with a token or searching issues; and the PowerShell engine loaded into a process that is not a PowerShell host ("
    urls: ["https://unit42.paloaltonetworks.com/blinder-tunnel-targets-critical-infrastructure/"]
