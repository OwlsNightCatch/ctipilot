claims:
  - claim_id: 5bf4ff0972
    entry: 2026-08-04/liechtenstein-vwbp-beneficial-ownership-register-breach
    surface: "summary"
    kind: frontmatter
    text: "The Government of Liechtenstein disclosed on 2026-08-02 that an unknown actor gained unauthorised digital access to the Verzeichnis wirtschaftlich berechtigter Personen — the national beneficial-ownership register at the Amt für Justiz — overnight into 2026-07-30 and copied records for roughly 31,000 legal entities. Forensics released 2026-08-03 characterise it as a targeted attack on that register with no attacks found on other systems, but the government progressively took the eMWST VAT portal, the Lides reporting platform, the central account register and the Intax tax system offline as a precaution. The attackers reached the register through its reporting portal rather than the database directly (NZZ reports a vulnerability in the portal), registering a new user account and enumerating every record one by one; no actor has been identified and no ransom demand reported. The breach is declared under GDPR Article 33. The government later called the cause faulty authorisation-checking logic abused through repeated single-record API requests, said an upstream eID step will strengthen account verification, and reported the register back in restricted operation on 2026-10-05 with no sign of misuse of the copied data."
  - claim_id: 3225387087
    entry: 2026-08-04/liechtenstein-vwbp-beneficial-ownership-register-breach
    surface: "actions[0]"
    kind: frontmatter
    text: "Brief fiduciary, trustee and private-banking teams that genuine VwbP breach notifications reach beneficial owners by an indirect route, Amt für Justiz to the legal entity and then the legal entity to the beneficial owner, and that forged notifications imitating that two-hop chain should be expected."
  - claim_id: 113957dfef
    entry: 2026-08-04/liechtenstein-vwbp-beneficial-ownership-register-breach
    surface: "body"
    kind: uncited
    text: "The government states there is no indication that data in the system was altered or deleted, and, as of 2026-08-02, the register is unavailable to external users through the LLV.li portal; it resumed in restricted form on 2026-10-05 (see the Improvement of 2026-10-07)."
