  - claim_id: e85ec623a8
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "headline"
    kind: frontmatter
    text: "Atlassian file-read flaw: root cause and checker now public; on Crowd-integrated Jira it ends in admin access"
  - claim_id: 5eafcafdd1
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "summary"
    kind: frontmatter
    text: "Atlassian's advisory of 2026-10-05 fixes CVE-2026-21589, an unauthenticated arbitrary file access flaw in every version of Bitbucket, Confluence, Jira Service Management, Jira Software, Bamboo and Crowd Data Center, plus Crucible and Fisheye (CVSS 4.0 9.3); Atlassian found no evidence of exploitation as of 2026-10-05 and tells customers to patch immediately or take internet-facing instances off the internet. watchTowr Labs published the root cause, the request shape and a runnable checker on 2026-10-06, and shows that where Jira is integrated with Crowd the file read exposes a plaintext Crowd application password that gives access to Crowd as an administrator of that application."
  - claim_id: 5eb8d3fc7f
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "actions[1]"
    kind: frontmatter
    text: "On every Jira instance that was internet-reachable and unpatched and is integrated with Crowd, treat the Crowd application password in its WEB-INF/classes/crowd.properties as readable: rotate it after the upgrade and review Crowd for user accounts created or group memberships changed since the exposure began, alongside Atlassian's log search for '..' next to '/', '\\\\' or '::'."
  - claim_id: 08cbda72f7
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: cited
    text: "), and its Crowd ticket lists the same fixed Crowd builds ("
    urls: ["https://jira.atlassian.com/browse/CWD-6610"]
  - claim_id: 0d1ff41bed
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: cited
    text: "Jira instances integrated with Crowd carry a plaintext application password in a configuration file under the readable web root, so a file read can end in administrator access there; watchTowr demonstrated this on Jira only ("
    urls: ["https://labs.watchtowr.com/you-wont-hear-about-these-even-in-myths-atlassian-jira-confluence-and-more-pre-auth-arbitrary-file-read-cve-2026-21589/"]
  - claim_id: 44d979d010
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: derived
    text: "Upgrading does not undo a read of the Crowd credential, so Crowd's own audit records of new users and changed group memberships are the post-patch check for Jira instances integrated with Crowd."
  - claim_id: 615423da48
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** upgrade each affected installation to a fixed version of its line now, internet-reachable ones first, and until each is upgraded keep it off the internet or behind Atlassian's rule; then search the access logs for the exposure period for traversal sequences, rotate the Crowd application password on every Jira instance integrated with Crowd and review Crowd for accounts created since the exposure began, because the flaw's mechanics are now public and Atlassian cannot confirm that any instance is unaffected."
  - claim_id: 621b2eb53e
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-07T04:50:00Z"
    kind: cited
    text: "The impact it demonstrates depends on the configuration: where Jira is integrated with Crowd, the crowd.properties file under WEB-INF stores the application name and its password in plaintext, and with those watchTowr reached Crowd's REST interface in its lab, created a user and added it to the Jira administrators group; it adds that a Crowd IP allow-list would make this harder ("
    urls: ["https://labs.watchtowr.com/you-wont-hear-about-these-even-in-myths-atlassian-jira-confluence-and-more-pre-auth-arbitrary-file-read-cve-2026-21589/"]
