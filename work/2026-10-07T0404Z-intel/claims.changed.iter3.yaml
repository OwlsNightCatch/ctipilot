claims:
  - claim_id: 6aa4c91009
    entry: 2026-08-04/liechtenstein-vwbp-beneficial-ownership-register-breach
    surface: "summary"
    kind: frontmatter
    text: "The Government of Liechtenstein disclosed on 2026-08-02 that an unknown actor gained unauthorised digital access to the Verzeichnis wirtschaftlich berechtigter Personen — the national beneficial-ownership register at the Amt für Justiz — overnight into 2026-07-30 and copied records for roughly 31,000 legal entities. Forensics released 2026-08-03 characterise it as a targeted attack on that register with no attacks found on other systems, but the government progressively took the eMWST VAT portal, the Lides reporting platform, the central account register and the Intax tax system offline as a precaution. The attackers reached the register through its reporting portal rather than the database directly (NZZ reports a vulnerability in the portal), registering a new user account and enumerating every record one by one; no actor has been identified and no ransom demand reported. The breach is declared under GDPR Article 33. The government later called the cause faulty authorisation-checking logic abused through repeated individual API requests, said an upstream eID step will strengthen account verification, and reported the register back in restricted operation on 2026-10-05 with no sign of misuse of the copied data."
  - claim_id: fde13e7140
    entry: 2026-08-04/liechtenstein-vwbp-beneficial-ownership-register-breach
    surface: "section 2026-10-07T04:54:00Z"
    kind: uncited
    text: "With the weaknesses fixed and the register reopened, the incident no longer calls for a decision this week, and its priority moves from high to notable."
  - claim_id: a6ece46f32
    entry: 2026-08-04/liechtenstein-vwbp-beneficial-ownership-register-breach
    surface: "record 2026-10-07T04:54:00Z"
    kind: record-summary
    text: "The government's release of 2026-08-19 states the cause as faulty authorisation-checking logic abused through repeated individual API requests, not a classic software vulnerability, and adds an upstream eID step to account verification and wider monitoring; the Head of Government told the Landtag the weaknesses are fixed, data integrity was checked and the register resumed in restricted form on 2026-10-05, with no sign of misuse of the copied data. With the weaknesses fixed and the register reopened, the incident no longer calls for a decision this week and its priority moves from high to notable."
  - claim_id: 50f2376286
    entry: 2026-09-24/shinyhunters-fbi-peoplesoft-breach-claim
    surface: "summary"
    kind: frontmatter
    text: "The extortion group ShinyHunters claims it exploited Oracle PeopleSoft to compromise the FBI's recruitment site (apply.fbijobs.gov), then pivoted into FBI-managed AWS GovCloud infrastructure and stole employee and applicant data; it told BleepingComputer it used the URL-encoded WAF bypass for the known PeopleSoft flaw CVE-2026-35273 and still claims a further unknown flaw. On 2026-10-06 the FBI's cyber chief said the incident resulted from a security failure of a platform managed by a third-party organization after a contractor failed to implement a security patch explicitly issued to secure it, and that the FBI has removed the contractor; Reuters' sources, as relayed by SecurityWeek, name Oracle PeopleSoft and Accenture, and the FBI names neither. Reuters reports psychiatric and medical files in the documents the group shared, Nextgov/FCW reports, citing two people familiar with the matter, that the data covers intelligence analysts and Remote Operations Unit personnel, and Nextgov/FCW relays Reuters' report of a suspected member detained in Jordan who is helping investigators."
