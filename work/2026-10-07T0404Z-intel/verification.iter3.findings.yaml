- code: F3
  category: claim-not-supported
  section: zammad-cve-2026-102489-102490-exploited-divd-breach
  item: "2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach, body paragraph 2"
  url_or_quote: "CVE-2026-102490 lets the local zammad user escalate to root in all versions including the latest alpha, and DIVD scores the pair 9.4 when chained ([DIVD CSIRT, 2026-09-29](https://csirt.divd.nl/cves/CVE-2026-102490))"
  summary: "(low confidence) the cited CVE record is titled 'Undisclosed LPE in Zammad v1.5.0 to v7.1.0-alpha' and lists affected '>= 1.5.0 to < 7.1.0-alpha'; 'all versions including the latest alpha' is the wording of the case page DIVD-2026-00015 (and of NCSC-NL), not of the record cited at this clause. Cite the case page for the scope and the CVE record for the 9.4, or state the record's range (the sourcing note already names the discrepancy)."
- code: F3
  category: claim-not-supported
  section: gentlemen-affiliate-azazel-ci-cd-secrets-mcp-attacks
  item: "2026-10-07/gentlemen-affiliate-azazel-ci-cd-secrets-mcp-attacks, body paragraph 2 (claim 323241e758)"
  url_or_quote: "administrator hashes from the monitoring stack were cracked offline"
  summary: "(low confidence) CloudSEK: 'Azazel extracted admin hashes and ran offline cracking against them. The candidate list recovered from earlier in the engagement included HPC cluster credentials...'. It reports the attempt and the wordlist, not a successful crack. Reword to 'were run through offline cracking'."
- code: F5
  category: missing-citation
  section: liechtenstein-vwbp-beneficial-ownership-register-breach
  item: "2026-08-04/liechtenstein-vwbp-beneficial-ownership-register-breach, body paragraph 2 ('The government's own timeline...')"
  url_or_quote: "Unauthorised digital access occurred overnight into 2026-07-30; irregularities were noticed at the Amt für Justiz during that day; ... A crisis unit convened that evening under Head of Government Brigitte Haas and Justice Minister Emanuel Schädler, was formally confirmed on 2 August, and a media conference was announced for 2026-08-04. The government states there is no indication that data in the system was altered or deleted, and, as of 2026-08-02, the register is unavailable..."
  summary: "(low confidence) the whole paragraph carries dated facts, names and a status with no inline citation. Every fact is in the government release of 2026-08-02 (https://www.presseportal.ch/de/pm/100000148/100941487) and the media-conference date in the release of 2026-08-03 (.../100941500), both already cited elsewhere in the entry; add the two inline citations. Inherited text, but the paragraph was edited this run."
- code: F9
  category: surface-contradiction
  section: gentlemen-affiliate-azazel-ci-cd-secrets-mcp-attacks
  item: "2026-10-07/gentlemen-affiliate-azazel-ci-cd-secrets-mcp-attacks, summary and body paragraph 1"
  url_or_quote: "about 6 TB of stolen data from more than two dozen victims ... in six countries"
  summary: "(low confidence) CloudSEK's text says 'more than two dozen victim directories ... six countries', but its own Victim Roster chart (image on the same page, https://cdn.prod.website-files.com/635e632477408d12d1811a64/6ac38b4b74e76f4d605024ca_87d530d1.png) shows '22 VICTIMS' and ten named countries (USA 4, France 2, China 2, UK 2, Mexico, Indonesia, Peru, Japan, India, Vietnam 1 each) plus 6 'Misc / Unknown'. The entry follows the text silently. Add a Contradiction line or hedge the counts."
- code: F10
  category: missed-angle
  section: shinyhunters-fbi-peoplesoft-breach-claim
  item: "2026-09-24/shinyhunters-fbi-peoplesoft-breach-claim, Update 2026-10-07 (Jordan detention clause)"
  url_or_quote: "Nextgov/FCW relays Reuters' report of 2026-10-03 that a suspected ShinyHunters member had been detained in Jordan and was helping investigators"
  summary: "(low confidence) The Register, 2026-10-05 (https://www.theregister.com/security/2026/10/05/fbi-confirms-multiple-arrests-related-to-shinyhunters-hack/5301178): an FBI spokesperson told it the bureau has 'already worked with partners to arrest multiple subjects' while declining to comment on the Jordan arrest. That on-record FBI statement is the only primary-side datum on the arrests and the entry lacks it; search: 'FBI confirms multiple arrests ShinyHunters'."
- code: F11
  category: editorial-advisory
  section: liechtenstein-vwbp-beneficial-ownership-register-breach
  item: "2026-08-04/liechtenstein-vwbp-beneficial-ownership-register-breach, Improvement 2026-10-07 and record summary"
  url_or_quote: "With the weaknesses fixed and the register reopened, the incident no longer calls for a decision this week, and its priority moves from high to notable."
  summary: "Narrates the entry's own priority metadata in reader-facing text and the record summary; the 'no decision this week' rationale is the useful part, 'its priority moves from high to notable' is record-keeping. May be left; two-sentence trim if the main agent edits the section anyway."
