  - claim_id: 8964c60351
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: cited
    text: "Until a patch is applied, Atlassian says to remove the instance from the internet where possible, including instances that require user authentication, or to block at a web application firewall or proxy any URL that carries '..' directly next to a slash, backslash or '::' in plain or percent-encoded form; it also gives a Tomcat RewriteValve rule for Confluence, Jira Service Management, Jira Software, Bamboo and Crowd and a urlrewrite.xml rule for Bitbucket ("
    urls: ["https://confluence.atlassian.com/security/cve-2026-21589-arbitrary-file-access-vulnerability-impacts-multiple-products-1870495748.html"]
  - claim_id: 8e5b87b4d3
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: cited
    text: "**Exposure:** every self-managed Data Center installation of the eight products on a version below the fixed ones, internet-facing instances first, because Atlassian asks that even instances requiring user authentication be taken off the internet until patched; Atlassian Cloud customers need do nothing ("
    urls: ["https://confluence.atlassian.com/security/cve-2026-21589-arbitrary-file-access-vulnerability-impacts-multiple-products-1870495748.html"]
  - claim_id: 39d0b48e25
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: cited
    text: "Instances integrated with Crowd carry a plaintext application password in a configuration file under the readable web root, so they are the ones where a file read can end in administrator access ("
    urls: ["https://labs.watchtowr.com/you-wont-hear-about-these-even-in-myths-atlassian-jira-confluence-and-more-pre-auth-arbitrary-file-read-cve-2026-21589/"]
  - claim_id: 7209ad98ba
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: cited
    text: "Atlassian says to URL-decode each request line (up to two decoding passes) and look for '..' directly next to '/', '\\' or '::', or to search the raw lines with its regular expression; it cannot confirm whether any instance was affected and asks customers to check every affected instance for evidence of compromise ("
    urls: ["https://confluence.atlassian.com/security/cve-2026-21589-arbitrary-file-access-vulnerability-impacts-multiple-products-1870495748.html"]
  - claim_id: 2efa9318c1
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: derived
    text: "**Detection:** web server and reverse-proxy access logs."
  - claim_id: 69f04afa4d
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: derived
    text: "Upgrading does not undo a read of the Crowd credential, so Crowd's own audit records of new users and changed group memberships are the post-patch check for integrated instances."
  - claim_id: c38ac8cf48
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** upgrade each affected installation to a fixed version of its line now, internet-reachable ones first, and until each is upgraded keep it off the internet or behind Atlassian's rule; then search the access logs for the exposure period for traversal sequences, rotate the Crowd application password on every integrated instance and review Crowd for accounts created since the exposure began, because the flaw's mechanics are now public and Atlassian cannot confirm that any instance is unaffected."
  - claim_id: 3dcf25afeb
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-07T04:50:00Z"
    kind: cited
    text: "watchTowr Labs published the root cause on 2026-10-06 after comparing a vulnerable and a fixed build of the web-resource library that Jira, Confluence and Bitbucket share: its router converts a double colon in a request path into a slash before it resolves a plugin resource, so a traversal written with double colons leaves the resource directory through a deprecated relative-path resolver that is still reachable ("
    urls: ["https://labs.watchtowr.com/you-wont-hear-about-these-even-in-myths-atlassian-jira-confluence-and-more-pre-auth-arbitrary-file-read-cve-2026-21589/"]
  - claim_id: 271682d615
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-07T04:50:00Z"
    kind: cited
    text: "). watchTowr says it cannot leave the Tomcat context but can read any file within the application server, and it shows working requests against Jira, Confluence and Bitbucket, with Bitbucket blocking one configuration file but not another under WEB-INF ("
    urls: ["https://labs.watchtowr.com/you-wont-hear-about-these-even-in-myths-atlassian-jira-confluence-and-more-pre-auth-arbitrary-file-read-cve-2026-21589/"]
  - claim_id: 45a9cb73a3
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-07T04:50:00Z"
    kind: cited
    text: "The impact it demonstrates depends on the configuration: where an application is integrated with Crowd, its crowd.properties file under WEB-INF stores the application name and its password in plaintext, and with those watchTowr reached Crowd's REST interface in its lab, created a user and added it to the Jira administrators group; it adds that a Crowd IP allow-list would make this harder ("
    urls: ["https://labs.watchtowr.com/you-wont-hear-about-these-even-in-myths-atlassian-jira-confluence-and-more-pre-auth-arbitrary-file-read-cve-2026-21589/"]
  - claim_id: 84f41acadc
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-07T04:50:00Z"
    kind: cited
    text: "). watchTowr also published a Detection Artifact Generator on GitHub that sends the traversal to Jira, Confluence and Bitbucket hosts to test whether they are vulnerable ("
    urls: ["https://github.com/watchtowrlabs/watchTowr-vs-Atlassian-CVE-2026-21589"]
  - claim_id: 62016b7208
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-07T04:50:00Z"
    kind: uncited
    text: "Neither watchTowr's post nor Atlassian's advisory of 2026-10-05 reports exploitation in the wild."
  - claim_id: 3051e37e48
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "record 2026-10-07T04:50:00Z"
    kind: record-summary
    text: "watchTowr Labs published the root cause (a path-separator substitution in the web-resource library shared by Jira, Confluence and Bitbucket), the request shape and a runnable checker on 2026-10-06, and shows that where an application is integrated with Crowd the file read exposes a plaintext Crowd application password that gives administrator access to Crowd for that application. Exposure grows from a patch-now flaw with unpublished mechanics to one with public mechanics and a Crowd credential to rotate; no exploitation is reported."
  - claim_id: 26556bc9d4
    entry: 2026-10-06/denmark-cpr-population-register-third-party-access-breach
    surface: "summary"
    kind: frontmatter
    text: "Denmark's CPR administration says unauthorised parties used a private Danish company's lawful right to search the Central Person Register to obtain names, addresses and CPR numbers of about 8.8 million of its roughly 11 million records (living, deceased and emigrated persons); the ministry says the access does not cover the names and addresses of people with name-and-address protection. The minister told Ritzau the access lasted about ten days in September through a smaller company whose security around that access had not been good enough, in her words. Datatilsynet's notice describes a very large number of automated lookups to identify valid CPR numbers; the actor, the company and how the access was obtained are not public."
