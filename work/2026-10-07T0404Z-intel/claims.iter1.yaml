    entry: 2026-10-07/ninja-forms-wpc-bundles-stored-xss-hidden-admin-campaign
    surface: "body"
    kind: cited
    text: "Patchstack reports two unrelated stored cross-site scripting flaws that deliver the same second-stage script, first seen on 2026-10-04 against WPC Product Bundles for WooCommerce (CVE-2026-93836) and on 2026-10-05 against Ninja Forms (CVE-2026-94504) ("
