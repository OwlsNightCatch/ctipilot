    urls: ["https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: ac1ec774cb
    entry: 2026-09-28/cve-2019-18935-telerik-godzilla-webshell-virtualpathprovider
