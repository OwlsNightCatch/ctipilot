  - claim_id: 23744f8031
    entry: 2026-10-07/ninja-forms-wpc-bundles-stored-xss-hidden-admin-campaign
    surface: "body"
    kind: cited
    text: "**Exposure:** WordPress sites running Ninja Forms 3.15.3 or older, or WPC Product Bundles for WooCommerce 8.6.6 or older, where an administrator opens form submissions or orders in wp-admin ("
    urls: ["https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/"]
  - claim_id: cc4dbaf32b
    entry: 2026-10-07/ninja-forms-wpc-bundles-stored-xss-hidden-admin-campaign
    surface: "body"
    kind: cited
    text: "**Detection:** in web server logs, public POSTs to the plugin's form-submit endpoint or to a product URL whose fields carry script or an image error handler that loads a remote script; in WordPress audit and database records, a plugin-upload install, a user creation and a call to a persistence installer inside one page view of an administrator opening a submission or an order, administrator rows in the users and metadata tables that the Users screen does not list, PHP files under the must-use plugins directory that the Plugins screen never shows, and requests to the login page carrying a token parameter ("
    urls: ["https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/"]
  - claim_id: 66d70b70b0
    entry: 2026-10-07/ninja-forms-wpc-bundles-stored-xss-hidden-admin-campaign
    surface: "body"
    kind: cited
    text: "Updating does not evict an implant: Patchstack says to remove the unauthorised accounts and plugins and the dropped files, rotate privileged credentials and authentication salts, and treat the oldest administrator's password as compromised even though it was never directly stolen ("
    urls: ["https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/"]
  - claim_id: 0d66e197cb
    entry: 2026-10-07/ninja-forms-wpc-bundles-stored-xss-hidden-admin-campaign
    surface: "body"
    kind: derived
    text: "**Triage:** a legitimate administrator installing a plugin from a ZIP produces the same plugin-install and user-creation events; the discriminators are that they occur within one page view of a stored submission or order, from the administrator's own session without a visit to the Plugins screen, and that the new administrator is missing from the Users list."
  - claim_id: bff6380160
    entry: 2026-10-07/ninja-forms-wpc-bundles-stored-xss-hidden-admin-campaign
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** update both plugins now, then treat any site where an administrator opened a stored order or submission since 2026-10-04 as possibly compromised until the database administrator list, the must-use plugins and the oldest administrator's credentials have been checked, because the patch closes the injection and none of the persistence routes."
  - claim_id: 797627be2c
    entry: 2026-10-07/gentlemen-affiliate-azazel-ci-cd-secrets-mcp-attacks
    surface: "headline"
    kind: frontmatter
    text: "CloudSEK: a Gentlemen affiliate reached victims through stolen GitLab CI/CD secrets and drove attacks over MCP"
  - claim_id: 799d3e12ce
    entry: 2026-10-07/gentlemen-affiliate-azazel-ci-cd-secrets-mcp-attacks
    surface: "summary"
    kind: frontmatter
    text: "CloudSEK analysed two exposed servers of \"Azazel\", a Russian-speaking affiliate of the Gentlemen ransomware group who also ran his own leak site, and reports about 6 TB of stolen data from more than two dozen organisations in six countries, among them government-adjacent infrastructure. It says every confirmed victim was reached through stolen CI/CD secrets, mainly GitLab variable stores and git history, that one deeper intrusion into an AI platform chained server-side request forgery, a decrypted configuration key and a token recovered from git history, and that Azazel drove attack commands through an MCP server on a local port. The report is a single source and names no victim."
  - claim_id: a66cdd2ca4
    entry: 2026-10-07/gentlemen-affiliate-azazel-ci-cd-secrets-mcp-attacks
    surface: "body"
    kind: cited
    text: "CloudSEK reports that an exposed open directory and a misconfigured storage server revealed the operation of \"Azazel\", a Russian-speaking affiliate of the Gentlemen ransomware group, who used the group's tooling, negotiation channels and ransom-note template but published victims on a leak site of his own and kept the proceeds, so the Gentlemen operator lost the revenue ("
    urls: ["https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files"]
  - claim_id: a8028590c8
    entry: 2026-10-07/gentlemen-affiliate-azazel-ci-cd-secrets-mcp-attacks
    surface: "body"
    kind: cited
    text: "Two servers held about 6 TB of stolen data in more than two dozen victim directories, spanning logistics, insurance, pharmaceutical, AI, medical-device and government-adjacent organisations in six countries ("
    urls: ["https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files"]
  - claim_id: 18c97e963a
    entry: 2026-10-07/gentlemen-affiliate-azazel-ci-cd-secrets-mcp-attacks
    surface: "body"
    kind: cited
    text: "Every victim outside one deeper intrusion was reached the same way: GitLab CI/CD variable stores and git history were mined for tokens, database credentials, API keys and SSH private keys with GitLab-focused enumeration and secret-scanning tools, and one GitLab instance that served two unrelated organisations gave footholds at both ("
    urls: ["https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files"]
  - claim_id: 74b38ec276
    entry: 2026-10-07/gentlemen-affiliate-azazel-ci-cd-secrets-mcp-attacks
    surface: "body"
    kind: cited
    text: "From one CI/CD token the actor reached more than 150 databases, payment gateways and hundreds of source repositories across a SaaS platform and its clients, and at a platform hosting a government-linked financial registry it exfiltrated more than 120,000 records and then killed the PostgreSQL process and deleted the production data directory ("
    urls: ["https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files"]
  - claim_id: 323241e758
    entry: 2026-10-07/gentlemen-affiliate-azazel-ci-cd-secrets-mcp-attacks
    surface: "body"
    kind: cited
    text: "The deeper intrusion, into an AI platform, ran for weeks: an API that fetches user-supplied URLs server-side gave an unauthenticated route into the internal network, a recovered master key decrypted every secret in the cluster configuration, a hardcoded authentication-bypass token that had been removed from the code but stayed in git history gave lasting access, administrator hashes from the monitoring stack were cracked offline, and an object-storage bucket was mirrored continuously ("
    urls: ["https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files"]
  - claim_id: c7c6a979a0
    entry: 2026-10-07/gentlemen-affiliate-azazel-ci-cd-secrets-mcp-attacks
    surface: "body"
    kind: cited
    text: "Ransom notes were pushed to eight surfaces, among them the login message, the SSH banner, a database configuration parameter, a database-admin login template, a repository README and an issue opened against the victim's project, and CloudSEK reports that the verification script drove these checks through an MCP server bound to a local port, the first operational use of MCP as an attack execution channel it knows of ("
    urls: ["https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files"]
  - claim_id: eecae9bd40
    entry: 2026-10-07/gentlemen-affiliate-azazel-ci-cd-secrets-mcp-attacks
    surface: "body"
    kind: cited
    text: "**Exposure:** self-hosted GitLab where CI/CD variables are unmasked or unprotected or where removed secrets remain in git history, GitLab instances that run pipelines for more than one organisation, APIs that fetch user-supplied URLs without validation, and MCP servers reachable beyond strict loopback ("
    urls: ["https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files"]
  - claim_id: 4b37575a2f
    entry: 2026-10-07/gentlemen-affiliate-azazel-ci-cd-secrets-mcp-attacks
    surface: "body"
    kind: cited
    text: "**Detection:** CI/CD and repository audit logs for variable reads from unexpected addresses, service-account token use outside the normal runner infrastructure, and README or issue changes made with a pipeline token from an unusual source; object-storage and database logs for bulk mirroring or dumps to hosts outside the backup estate; MCP initialisation requests from clients outside an allowlist; and a PostgreSQL process killed and its data directory deleted after a large read ("
    urls: ["https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files"]
  - claim_id: 415889152d
    entry: 2026-10-07/gentlemen-affiliate-azazel-ci-cd-secrets-mcp-attacks
    surface: "body"
    kind: cited
    text: "**Triage:** legitimate backup jobs also mirror object storage to remote destinations, so the discriminator is the destination and the source host, not the copy command itself ("
    urls: ["https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files"]
  - claim_id: da32c31118
    entry: 2026-10-07/gentlemen-affiliate-azazel-ci-cd-secrets-mcp-attacks
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** treat CI/CD variable stores and git history as credential stores: keep secrets in a dedicated secrets manager, mask and protect every variable, rotate tokens and audit history for removed secrets, because the actor recovered credentials from commits that no longer appeared on the current branch; never bind an MCP server beyond loopback and treat its command-execution tool as privileged with an audit trail ("
    urls: ["https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files"]
  - claim_id: 90830f431f
