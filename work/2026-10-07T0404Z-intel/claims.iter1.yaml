    entry: 2026-08-04/liechtenstein-vwbp-beneficial-ownership-register-breach
    surface: "body"
    kind: uncited
    text: "The government states there is no indication that data in the system was altered or deleted, and the register is unavailable to external users through the LLV.li portal."
