claims:
  - claim_id: c6f6acd118
    entry: 2026-08-04/liechtenstein-vwbp-beneficial-ownership-register-breach
    surface: "summary"
    kind: frontmatter
    text: "The Government of Liechtenstein disclosed on 2026-08-02 that an unknown actor gained unauthorised digital access to the Verzeichnis wirtschaftlich berechtigter Personen — the national beneficial-ownership register at the Amt für Justiz — overnight into 2026-07-30 and copied records for roughly 31,000 legal entities. Forensics released 2026-08-03 characterise it as a targeted attack on that register with no attacks found on other systems, but the government progressively took the eMWST VAT portal, the Lides reporting platform, the central account register and the Intax tax system offline as a precaution. The attackers reached the register through a vulnerability in its reporting portal rather than the database directly, registering a new user account and enumerating every record one by one; no actor has been identified and no ransom demand reported. The breach is declared under GDPR Article 33. The government later called the cause faulty authorisation-checking logic abused through repeated single-record API requests, said an upstream eID step will strengthen account verification, and reported the register back in restricted operation on 2026-10-05 with no sign of misuse of the copied data."
  - claim_id: df69f9367d
    entry: 2026-08-04/liechtenstein-vwbp-beneficial-ownership-register-breach
    surface: "body"
    kind: cited
    text: "On 2026-08-02 the government disclosed that the register had been attacked and that \"Datenkopien von rund 31'000 Rechtsträgern\" (\"copies of data on around 31,000 legal entities\") were unlawfully taken ("
    urls: ["https://www.presseportal.ch/de/pm/100000148/100941487"]
  - claim_id: 61d16fb342
    entry: 2026-08-04/liechtenstein-vwbp-beneficial-ownership-register-breach
    surface: "body"
    kind: cited
    text: "The Record and SRF both carry the same figure ("
    urls: ["https://therecord.media/hackers-steal-records-liechtenstein-companies-foundations", "https://www.srf.ch/news/international/31-000-geklaute-datensaetze-taeterschaft-von-cyberangriff-in-liechtenstein-weiterhin-unklar"]
  - claim_id: 32387362c8
    entry: 2026-08-04/liechtenstein-vwbp-beneficial-ownership-register-breach
    surface: "body"
    kind: cited
    text: "First findings characterise the event as a targeted attack on the VwbP at the Amt für Justiz, and \"Weitere Angriffe auf andere Systeme konnten nicht festgestellt werden\" (\"no further attacks on other systems could be established\") — yet the government kept widening the shutdown: the eMWST VAT portal and the Lides electronic reporting and data-exchange platform came off the network on 31 July, and on 3 August the central account register and the central tax system Intax followed, explicitly as precautionary measures with no indication of unlawful access ("
    urls: ["https://www.presseportal.ch/de/pm/100000148/100941500"]
  - claim_id: 56d4fb020e
    entry: 2026-08-04/liechtenstein-vwbp-beneficial-ownership-register-breach
    surface: "body"
    kind: uncited
    text: "The Verzeichnis wirtschaftlich berechtigter Personen (VwbP, \"register of beneficial owners\") exists because Liechtenstein implemented the EU's 5th Anti-Money-Laundering Directive: the VwbPG has been in force since 2021, and the register records the natural persons behind Rechtsträger — companies, foundations and trust arrangements."
  - claim_id: cb1b71649c
    entry: 2026-08-04/liechtenstein-vwbp-beneficial-ownership-register-breach
    surface: "body"
    kind: uncited
    text: "The government's own timeline is worth reading as a benchmark, because detection was human and internal rather than telemetry-driven."
  - claim_id: 81feee6c42
    entry: 2026-08-04/liechtenstein-vwbp-beneficial-ownership-register-breach
    surface: "body"
    kind: uncited
    text: "Unauthorised digital access occurred overnight into 2026-07-30; irregularities were noticed at the Amt für Justiz during that day; the Amt für Informatik was brought in, secured the data and took the affected system off the network the same day; the government was informed on 31 July that the attack had potentially succeeded, and the first confirmed preliminary findings arrived on the afternoon of 1 August."
  - claim_id: 371bfce359
    entry: 2026-08-04/liechtenstein-vwbp-beneficial-ownership-register-breach
    surface: "body"
    kind: uncited
    text: "A crisis unit convened that evening under Head of Government Brigitte Haas and Justice Minister Emanuel Schädler, was formally confirmed on 2 August, and a media conference was announced for 2026-08-04."
