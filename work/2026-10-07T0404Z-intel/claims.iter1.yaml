  - claim_id: 0266d6580b
    entry: 2026-10-07/cl-sta-1178-blinder-tunnel-csproj-lure-github-c2
    surface: "summary"
    kind: frontmatter
    text: "Unit 42 describes a March 2026 campaign by an Iranian-nexus cluster it calls CL-STA-1178 against an individual in Iraqi critical infrastructure, in which a recruiter persona impersonating Dubai Airports IT sent a coding-test Visual Studio project whose project file runs code during the design-time build, before any compile. The chain then hijacks the .NET AppDomainManager through a configuration file that disables ETW, sideloads a DLL, and uses the GitHub API and issue comments for command and control, with PowerShell run inside the hijacked process so no powershell.exe starts. No Swiss or European target is reported and Unit 42 is the only source."
