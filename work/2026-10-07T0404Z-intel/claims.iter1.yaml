    text: "CISA's Known Exploited Vulnerabilities catalog has listed CVE-2019-18935 since 2021-11-03 and, in version 2026.10.04, marks it as used in known ransomware campaigns; the catalog does not date that flag. A Telerik server found exploited therefore needs a compromise assessment, not only the patch."
