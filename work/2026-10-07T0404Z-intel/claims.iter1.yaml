  - claim_id: cba52d4ab5
    entry: 2026-09-24/shinyhunters-fbi-peoplesoft-breach-claim
    surface: "summary"
    kind: frontmatter
    text: "The extortion group ShinyHunters claims it exploited Oracle PeopleSoft to compromise the FBI's recruitment site (apply.fbijobs.gov), then pivoted into FBI-managed AWS GovCloud infrastructure and stole employee and applicant data; it told BleepingComputer it used the URL-encoded WAF bypass for the known PeopleSoft flaw CVE-2026-35273 and still claims a further unknown flaw. On 2026-10-06 the FBI's cyber chief said the incident resulted from a security failure of a platform managed by a third-party organization after a contractor failed to implement a security patch explicitly issued to secure it, and that the FBI has removed the contractor; Reuters' sources, as relayed by SecurityWeek, name Oracle PeopleSoft and Accenture, and the FBI names neither. Reuters reports psychiatric and medical files in the documents the group shared, Nextgov/FCW reports, citing two people familiar with the matter, that the data covers intelligence analysts and Remote Operations Unit personnel, and Reuters, as relayed by Nextgov/FCW and SecurityWeek, reports a suspected member detained in Jordan who is cooperating with investigators."
