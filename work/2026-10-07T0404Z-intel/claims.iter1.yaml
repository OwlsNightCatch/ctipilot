    surface: "body"
    kind: cited
    text: "No account is needed: a numeric-prefixed quantity keeps attacker markup in WooCommerce order data, and a textarea submission sent through the normal form endpoint is stored and rendered without safe encoding in the legacy Ninja Forms submission editor ("
    urls: ["https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/"]
  - claim_id: 25ab91fc31
    entry: 2026-10-07/ninja-forms-wpc-bundles-stored-xss-hidden-admin-campaign
    surface: "body"
    kind: cited
    text: "The script runs when a logged-in administrator opens the order or submission, rides that session in wp-admin without reading the cookie, so HttpOnly does not help ("
    urls: ["https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/"]
  - claim_id: 4809c3a36c
    entry: 2026-10-07/ninja-forms-wpc-bundles-stored-xss-hidden-admin-campaign
    surface: "body"
    kind: cited
    text: "With that session it uploads a plugin through WordPress' own installer, creates an administrator and calls a persistence installer ("
    urls: ["https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/"]
  - claim_id: 32cbed3420
    entry: 2026-10-07/ninja-forms-wpc-bundles-stored-xss-hidden-admin-campaign
    surface: "body"
    kind: cited
    text: "Patchstack counts four ways back in: the visible administrator; a second administrator that a dropped must-use plugin hides from the Users list, its filters and its role counts; a login URL, backed by another must-use plugin, that authenticates as the site's oldest administrator; and an unauthenticated file manager in the uploaded plugin that runs only on a direct request and can write files anywhere writable ("
    urls: ["https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/"]
