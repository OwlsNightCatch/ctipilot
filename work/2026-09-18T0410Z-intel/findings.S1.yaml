    summary: |
      CVE-2026-87886 (CVSS 7.8) is a local privilege-escalation flaw caused by insecure file permissions in the
      Acronis Backup plugin/extension for cPanel & WHM (Linux, before build 1.9.3.1021, fixed in 1.9.3 HF3),
      Plesk (Linux, before build 1.8.11.638) and DirectAdmin (Linux, before build 1.2.3.238). A local attacker
