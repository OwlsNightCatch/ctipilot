        attribution: "NCSC-NL (NCSC-2026-0382)"
        source_url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0382"
      - quote: "Vier kwetsbaarheden, CVE-2026-20130, CVE-2026-20192, CVE-2026-76423 en CVE-2026-76460, hebben een CVSS-score van 10,0."
