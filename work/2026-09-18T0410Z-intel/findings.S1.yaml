  - title: "Cisco's 16 September ISE hardening release covers 21 vulnerabilities (13 critical) beyond the already-exploited CVE-2026-76460 — four flaws at CVSS 10.0 total"
    sources:
      - { url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0382", publisher: "NCSC-NL (NCSC-2026-0382)", date: "2026-09-17", role: "primary" }
      - { url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-notice-jfxK98ZP", publisher: "Cisco PSIRT (advance notification bundle)", date: "2026-09-16", role: "primary" }
      - { url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1197/", publisher: "CERT-FR (CERTFR-2026-AVI-1197)", date: "2026-09-17", role: "corroborating" }
    discovery_trace: "first seen at: advisories-ncsc-nl, URL https://advisories.ncsc.nl/rss/advisories (item NCSC-2026-0382, published 2026-09-17T09:24Z) -> primary: Cisco PSIRT advance-notification bundle, URL https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-notice-jfxK98ZP -> corroboration: CERT-FR, URL https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1197/"
    summary: |
      The CVE-2026-76460 Cisco ISE authentication-bypass entry (already tracked as exploited) was one part of a
      much larger, single 16 September Cisco ISE hardening release: 21 vulnerabilities total, 13 rated critical.
      Four carry the maximum CVSS 10.0: the already-covered CVE-2026-76460 (exploited authentication bypass) and
      CVE-2026-76423 (same-day sibling, REST API unauthenticated admin-access bypass, not yet confirmed
      exploited — both already named in the target entry), plus two newly-disclosed CVEs from this same release
      — CVE-2026-20130 and CVE-2026-20192 — which NCSC-NL's advisory explains are Cisco-internal
      CWE-class-grouped bundles (Cisco groups multiple underlying flaws sharing a CWE classification for a
      hardening release under one CVE ID each; the CVSS score reflects the highest-scoring underlying flaw in
      each bundle). Beyond the CVSS 10.0 tier, the release also fixes three unauthenticated CVSS 9.9 RCE flaws
      (CVE-2026-20211, CVE-2026-20176, CVE-2026-20307), three CVSS 9.1 authenticated RCE/API flaws
      (CVE-2026-20282/20283/20284) and two CVSS 9.1 command-injection flaws (CVE-2026-20306/20305), down to
      medium-severity SQLi, XSS, path-traversal and 802.1X session-hijack issues. NCSC-NL states four of the 21
      vulnerabilities are remotely exploitable without authentication based on the published CVSS scores. Only
      CVE-2026-76460 is confirmed under active exploitation; Cisco has not reported exploitation for any of the
      other 20.
    region_nexus: "global; affects Cisco ISE/ISE-PIC deployments, a common NAC/identity chokepoint in government network estates including Swiss cantonal/federal environments already flagged for the CVE-2026-76460 exploitation"
