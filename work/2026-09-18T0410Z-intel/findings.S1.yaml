  - title: "CVE-2026-91843 — Check Point Security Management / Multi-Domain Security Management / Log Server: unauthenticated stack overflow in the login process reaches root RCE (CVSS 9.8)"
    sources:
      - { url: "https://support.checkpoint.com/results/sk/sk1000155", publisher: "Check Point PSIRT (sk1000155)", date: "2026-09-16", role: "primary" }
      - { url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-3429", publisher: "BSI CERT-Bund (WID-SEC-2026-3429)", date: "2026-09-17", role: "corroborating" }
      - { url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1193/", publisher: "CERT-FR (CERTFR-2026-AVI-1193)", date: "2026-09-17", role: "corroborating" }
    discovery_trace: "first seen at: bsi-de, URL https://wid.cert-bund.de/content/public/securityAdvisory/rss (item WID-SEC-2026-3429, published 2026-09-17T11:11Z) -> primary: Check Point PSIRT, URL https://support.checkpoint.com/results/sk/sk1000155 -> corroboration: CERT-FR, URL https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1193/ -> verified: NVD https://nvd.nist.gov/vuln/detail/CVE-2026-91843 and MITRE https://cveawg.mitre.org/api/cve/CVE-2026-91843"
    summary: |
      Check Point disclosed CVE-2026-91843 (CVSS 9.8) on 2026-09-16: a stack-based buffer overflow (CWE-121)
      in the unauthenticated login process to Check Point Security Management Server, Multi-Domain Security
      Management Server, Log Server and Multi-Domain Log Server. An attacker who can reach the management
      login interface can send an oversized username to overflow the stack and execute arbitrary code remotely
      with root privileges — no credentials or user interaction required. Affected: R82.20, R82.10 up to Jumbo
      Hotfix Take 44, R82 up to Take 126, R81.20 up to Take 166, R81.10 (EoS) up to Take 190, and all R80.x/R81
      (EoS) builds; Smart-1 Cloud was already unaffected because the fix had already shipped there. Check Point
      ships the fix as a LivePatch (validated via `cplp list` showing the CVE-2026-91843 patch armed) rather
      than a full upgrade. Check Point's own advisory and BSI both record exploitation status as UNKNOWN — no
      confirmed in-the-wild abuse as of this writing, and CISA's SSVC exploitation field for this CVE reads
      "none". Check Point gives one operational detection hook: SmartConsole Audit/Admin login logs will show
      "Administrator failed to log in: Username too long" during an exploitation attempt. Standard hardening
      (restricting Trusted Clients/GUI access to known IP ranges/subnets) reduces exposure since the login
      service should not normally be internet-facing, but the flaw itself requires no authentication.
    region_nexus: "global; any organization running Check Point Security/Multi-Domain Management or Log Servers, including Swiss public-sector network security estates"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: [CVE-2026-91843]
    techniques: [T1190]
    affected_products: ["Check Point Quantum Security Management Server", "Check Point Multi-Domain Security Management Server", "Check Point Log Server", "Check Point Multi-Domain Log Server"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "A stack overflow during the unauthenticated login process may allow an attacker to run arbitrary code remotely with root privileges."
        attribution: "Check Point PSIRT (sk1000155)"
        source_url: "https://support.checkpoint.com/results/sk/sk1000155"
      - quote: "In SmartConsole, search for Audit and Admin login logs containing the message: \"Administrator failed to log in: Username too long\"."
        attribution: "Check Point PSIRT (sk1000155)"
        source_url: "https://support.checkpoint.com/results/sk/sk1000155"
    extended_notes: |
      CVSS vector CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H per NVD/MITRE. This is a distinct CVE/product
      line from the already-covered CVE-2026-85103/CVE-2026-85102 Quantum Security Gateway/VPN pre-auth RCE
      pair (entry 2026-09-10/checkpoint-quantum-vpn-cert-preauth-rce-cvss98) — that pair hit VPN certificate
      processing on Security Gateway/Spark Firewall; this one hits the management-plane login process on
      Security Management/Log Servers. No entity/CVE overlap with any existing entry.

  - title: "Cisco's 16 September hardening cycle for Secure FMC/ASA/FTD adds two more critical root-RCE flaws (CVE-2026-20324 sftunnel arbitrary file write, CVE-2026-20242 Java deserialization) — no exploitation confirmed for either"
    sources:
      - { url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-notice-jfxK98ZP", publisher: "Cisco PSIRT (advance notification bundle)", date: "2026-09-16", role: "primary" }
      - { url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-fmc-sftunn-codex-c3O4Jft2", publisher: "Cisco PSIRT (CVE-2026-20324 advisory)", date: "2026-09-16", role: "primary" }
      - { url: "https://blog.talosintelligence.com/fmc-ongoing-exploitation/", publisher: "Cisco Talos", date: "2026-09-09", role: "corroborating (background — already reflected in the target entry)" }
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12954", publisher: "NCSC Switzerland Cyber Security Hub (post 12954)", date: "2026-09-17", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/dashboard (post id 12954, published 2026-09-17T13:09Z) -> primary: Cisco PSIRT advance-notification bundle, URL https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-notice-jfxK98ZP -> pivot: Cisco PSIRT per-CVE advisory, URL https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-fmc-sftunn-codex-c3O4Jft2 -> verified: MITRE https://cveawg.mitre.org/api/cve/CVE-2026-20324 and https://cveawg.mitre.org/api/cve/CVE-2026-20242"
    summary: |
      As previewed in the prior update to this entry (Cisco had scheduled a hardening release for
      2026-09-16), Cisco's Secure Firewall ASA/FTD/FMC Software Hardening Release: September 2026 shipped on
      schedule and adds two more critical, unauthenticated-adjacent root-RCE flaws to the FMC product line
      already tracked by this entry (CVE-2026-20079, exploited by three named clusters). CVE-2026-20324 (CVSS
      9.9) is a flaw in the sftunnel inter-device communication protocol (enabled by default): a registered
      sftunnel peer has incorrect file-write permissions, so an attacker who hijacks the sftunnel connection or
      who is already a valid registered peer can write an arbitrary file to disk that then executes as root —
      this requires the attacker to already hold valid low-privilege credentials on the device. CVE-2026-20242
      (CVSS 9.8) is an insecure Java deserialization bug in the FMC "External Database Access" feature: a host
      that is configured in the external-database access allowlist can send a crafted serialized Java byte
      stream to a specific TCP port and obtain root code execution — no credentials needed, but the attacker
      must already control an allow-listed host. Cisco confirms ASA and FTD software are NOT affected by
      CVE-2026-20324; SCC Firewall Management (SaaS) is unaffected by CVE-2026-20242. Cisco states it is "not
      aware of any public announcements or malicious use" of either flaw. There are no workarounds for either;
      only the hardening release remediates them. The same 16 September cycle also shipped a critical (9.9)
      Nexus Dashboard hardening bundle (CVE-2026-20360/20361/20322/20325/20326/CVE-2026-76409) and further
      high-severity ASA/FTD denial-of-service fixes, none reported exploited.
    region_nexus: "global; affects Cisco Secure FMC/ASA/FTD deployments including Swiss public-sector perimeter/firewall-management estates already flagged for the sibling CVE-2026-20079"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
