    extended_notes: |
      No CVE/product names published — NTC's report is deliberately anonymized at the product level and the disclosure went through confidential vendor notification with most vendors already remediating. Defender-relevant angle for cantonal/communal IT and facilities-management units: any solar/PV or building-management procurement should now require (a) mandatory minimum device security requirements (NTC's own recommendation), (b) explicit disabling or network-isolation of local maintenance interfaces on inverters, and (c) a documented cybersecurity criterion in tender specifications — the exact gap canton Bern's Baudirektion admits it lacked. Swissolar (the industry association) is separately quoted (cash.ch/SRF) calling for binding cyber standards and a central register tracking how much grid feed-in can be remotely controlled. Treat as a systemic/supply-chain risk-landscape item rather than an active-exploitation alert — no known incident or campaign against Swiss PV fleets has been reported.

