items:
  - title: "NTC finds default passwords and unauthenticated power-output control across most tested Swiss solar inverters, plus a manufacturer-cloud concentration risk to the whole power grid"
    sources:
      - { url: "https://en.ntc.swiss/news/cybersecurity-of-photovoltaic-systems", publisher: "National Test Institute for Cybersecurity (NTC), Switzerland", date: "2026-09-17", role: "primary" }
