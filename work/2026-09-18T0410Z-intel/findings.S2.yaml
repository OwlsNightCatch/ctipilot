      - { url: "https://www.inside-it.ch/hackerangriffe-auf-solaranlagen-koennen-stromnetz-gefaehrden-20260917", publisher: "Inside IT Switzerland", date: "2026-09-17", role: "corroborating" }
    discovery_trace: "first seen at: inside-it-ch, URL https://www.inside-it.ch/rss.xml (feed item published 2026-09-17T12:14:40Z, title \"Hackerangriffe auf Solaranlagen können Stromnetz gefährden\") → pivot: SRF Rundschau, URL https://www.srf.ch/news/schweiz/risiko-cyberangriffe-sicherheitsexperten-blackout-risiko-wegen-solaranlagen → pivot: cash.ch, URL https://www.cash.ch/news/studie-findet-kritische-cyberlucken-bei-schweizer-solaranlagen-969350 → primary: NTC (National Test Institute for Cybersecurity), URL https://en.ntc.swiss/news/cybersecurity-of-photovoltaic-systems (found via WebSearch (\"NTC National Test Institute for Cybersecurity Wechselrichter Studie Bericht 2026\"))"
    summary: |
      Switzerland's National Test Institute for Cybersecurity (NTC) published a year-long security assessment (2026-09-17) of seven inverters and four energy-management systems from eight manufacturers — devices representative of the roughly 338,000 grid-connected photovoltaic installations in Switzerland. The testing produced more than 50 findings, 7 critical and 6 high, and full device takeover on 4 of the 11 products tested. The recurring risk patterns NTC names: default passwords; insecure maintenance access using identical credentials across an entire device fleet; missing or weak encryption of local-interface communication; and interfaces that cannot be disabled. Most strikingly for defenders, on almost every inverter tested the local control interface let an unauthenticated actor change how much power the installation feeds into the grid, down to zero, with no login required. NTC frames the systemic risk not as any single device's security posture (comparable to other widely-used connected devices) but as manufacturer-cloud concentration: most manufacturers retain privileged maintenance access across their entire fleet, so compromising one manufacturer's cloud could let an attacker simultaneously manipulate thousands of installations — turning a fleet that is individually inconsequential into de-facto critical infrastructure for grid stability, particularly since solar now regularly covers more than half of instantaneous Swiss electricity demand on sunny days. SRF's corroborating reporting adds a market-concentration angle directly relevant to Swiss public-sector procurement: roughly 60%+ of the Swiss inverter market share belongs to two Chinese manufacturers (Huawei, Sungrow), Switzerland's Federal Intelligence Service (NDB) has warned the country risks becoming a preferred target if it protects critical infrastructure less than the EU, and canton Bern's own cantonal building authority (Baudirektion) admits a public tender for a cantonal vocational school's rooftop solar installation was structured such that only a Huawei inverter could qualify, while acknowledging cybersecurity is "still barely anchored" in its procurement process. The EU has already withdrawn subsidy eligibility for Chinese-inverter projects and the US has declared a grid emergency restricting sanctioned-country inverters; Switzerland has taken no equivalent step. No CVEs were assigned; NTC deliberately withheld product names and technical exploit detail, reporting findings confidentially to manufacturers, most of whom have already shipped fixes.
