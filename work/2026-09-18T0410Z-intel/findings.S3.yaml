  - title: "MovieReaper: a modular Windows crimeware framework distributed via a supply-chain compromise of a shared public torrent-file repository, using the Solana blockchain as a dead-drop resolver for its second-stage C2"
    sources:
      - { url: "https://securelist.com/moviereaper-malware-torrent-odyssey-solana/121344/", publisher: "Kaspersky (Securelist)", date: "2026-09-17", role: "primary" }
    discovery_trace: "first seen at: WebSearch (\"new APT malware report September 17 2026 government backdoor research\") cross-referenced against Securelist's own listing, URL https://securelist.com/ (front-page item dated 2026-09-17) → primary: Kaspersky Securelist, URL https://securelist.com/moviereaper-malware-torrent-odyssey-solana/121344/"
    summary: |
      Kaspersky documents MovieReaper, a previously undocumented modular multi-stage crimeware framework Kaspersky traces back to October 2025, distributed through a supply-chain compromise rather than trojanized-installer social engineering on individual trackers: the attackers compromised itorrents.org, a widely used shared public repository that many independent torrent trackers rely on to resolve magnet links, so that requesting a legitimate torrent instead silently returns a malicious torrent file — a single compromise point reaching users across many unrelated tracker sites simultaneously (the compromise was reported still active at publication). Several hundred victims are confirmed across individuals and organizations spanning enterprise, government, IT, consulting, retail, transportation and agriculture sectors in Russia, Türkiye, Japan, Kenya, Uganda, Colombia, Spain, the Netherlands, Belgium, Germany and others. The infection chain: a first-stage loader (distributed under many different disguised filenames referencing popular films, identical file hash across all downloads) resolves Windows API addresses by manually walking the PEB's loaded-module linked list rather than calling LoadLibrary/GetProcAddress, then downloads shellcode over plain HTTP from a hardcoded domain (with a hardcoded IP fallback), using randomized URL paths mimicking benign cloud-asset requests. Execution uses a vectored-exception-handler hijack that redirects into a manually located ntdll syscall gadget to call NtProtectVirtualMemory directly, then invokes the undocumented ntdll export EtwpCreateEtwThread (an ETW-Threat-Intelligence-provider-evading alternative to CreateThread) to run the mapped shellcode. The second stage queries a Solana blockchain account via the public `getAccountInfo` RPC endpoint to retrieve a base64-encoded, XOR-encrypted second-stage C2 address — a blockchain dead-drop resolver pattern that lets the operators rotate C2 infrastructure without needing to update the malware itself, since only the on-chain record changes. This stage communicates over TLS-pinned HTTPS using the nanopb protobuf library and can load and execute additional COFF modules via a `module_init` entry point, providing an extensible command interface. A third-stage module performs UAC bypass and persistence using public techniques, masquerades the binary as `%ProgramData%\Microsoft\Windows\Telemetry\msedge.exe`, and respawns the loader with a command-line flag that skips anti-sandbox checks and signals the C2 (via a status flag in its beacon) that it is a persisted, second-run instance rather than a first infection. The final-stage module functions as a remote file manager exposing 21 commands (upload/download/read/enumerate/create/copy/rename/move/delete/chmod/symlink, plus preview/thumbnail commands for pre-exfiltration triage of image and document contents) and Kaspersky suspects further on-demand modules exist beyond what was recovered. Kaspersky assesses the first-stage domain/IP as the single highest-value disruption point, since taking it down blocks the entire infection chain including the blockchain-resilient second stage.
    region_nexus: "global — confirmed victims in Russia, Türkiye, Japan, Kenya, Uganda, Colombia, Spain, the Netherlands, Belgium, Germany and other countries"
    primary_sector_nexus: "direct — government named among confirmed affected sectors alongside enterprise, IT, consulting, retail, transportation and agriculture"
    sector: "cross-sector"
