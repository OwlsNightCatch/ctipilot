      Single-source (Kaspersky's own primary research); no independent corroboration found within the window. No file hashes, IPs, domains or mutex strings carried into this summary per no-IOC policy, though the primary's IOC section (hashes, C2 domain/IP, mutex names) is available for internal reference only if the main agent needs it. Detection framing for the composer: telemetry class = process-creation + memory-protection API call sequences (a process calling NtProtectVirtualMemory to mark a region RWX shortly followed by a call into ntdll's EtwpCreateEtwThread export is anomalous for almost any legitimate application); a second telemetry class = outbound HTTPS to Solana public RPC endpoints (api.mainnet.solana.com) originating from a non-wallet, non-Web3 process is a strong behavioral discriminator, since legitimate blockchain-RPC traffic from an enterprise endpoint is otherwise rare.
