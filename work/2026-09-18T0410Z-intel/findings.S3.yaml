  - title: "FamousSparrow retires SparrowDoor for SparroWocky, a new modular C++ backdoor with BOF-loading and call-stack-spoofing anti-analysis, deployed almost exclusively against Latin American governments since mid-2025"
    sources:
      - { url: "https://www.welivesecurity.com/en/eset-research/beware-sparrowock-backdoor-bites-commands-catch/", publisher: "ESET (WeLiveSecurity)", date: "2026-09-17", role: "primary" }
    discovery_trace: "first seen at: eset, URL https://www.welivesecurity.com/en/ (front-page listing, article dated 17 Sep 2026) → primary: ESET Research, URL https://www.welivesecurity.com/en/eset-research/beware-sparrowock-backdoor-bites-commands-catch/"
    summary: |
      ESET Research documents FamousSparrow's shift to a new flagship backdoor, SparroWocky, which since August 2025 has replaced the group's exclusive SparrowDoor implant. From mid-2025 into 2026, ESET's telemetry shows 90% of FamousSparrow's targets are in Latin America (Argentina, Ecuador, Guatemala, Honduras, Panama, Peru, Puerto Rico, Venezuela), almost all governmental entities — an unusually sustained single-region focus for a China-aligned APT group ESET otherwise tracks globally. ESET assesses with high confidence that FamousSparrow authored and operates SparroWocky, based on SparrowDoor deploying it in early attacks and matching victimology against previously SparrowDoor-targeted organizations. SparroWocky is deployed via a "trident loader": a legitimate executable, a malicious side-loading DLL (T1574.001) with an arbitrary .text-section patch that preserves the legitimate DLL's export table and metadata to blend in with automated analysis, and an encrypted .dat payload file (custom header, RC4-keyed) whose decrypted plaintext PE has its MZ/PE magic bytes stripped before being reflectively mapped into memory — evading simple in-memory pattern-matching. The backdoor incorporates open-source components directly rather than deploying them side by side as in the SparrowDoor era: Mbed TLS for its C2 channel, MinHook for API hooking, and a modified COFF Loader (based on TrustedSec's project) enabling in-memory execution of Beacon Object Files (Cobalt Strike/Brute Ratel/Metasploit/Sliver-compatible), redirecting BOF-imported-symbol calls through a stack-spoofing subroutine. Notable anti-analysis techniques: a SilentMoonwalk/StackMoonwalk variant that forges call stacks using JOP/ROP gadgets located in legitimate kernel32.dll so hooked/obfuscated API calls appear to originate from RtlUserThreadStart/BaseThreadInitThunk; a MinHook-based CreateThread hook that redirects the reported thread-start address to AnimateWindow (a benign-looking API) via a trampoline; and, for dynamically loaded PE payloads, forgery of a fake LDR_DATA_TABLE_ENTRY in the process's PEB_LDR_DATA module list plus MUI-resource-redirection hooks to camouflage a loaded executable as a legitimate System32 utility. Persistence is via a Windows service or a registry Run key (operator-configurable). C2 traffic uses Mbed TLS over a custom-pinned certificate trust anchor with RC4-encrypted command payloads. ESET assesses the Latin America focus likely reflects Chinese state interest in monitoring regional government reactions to renewed US engagement in the region (citing a Panamanian port-concession dispute as a specific confirmed target-motive match) and notes FamousSparrow's separately reported links to Earth Estries (per Trend Micro) and contested links to Salt Typhoon (which ESET does not adopt, citing no technical overlap).
    region_nexus: "Latin America (targets); China-aligned APT activity relevant globally to any government-sector defender building detection/hunt content for DLL side-loading, BOF-loading implants and call-stack-spoofing anti-analysis techniques"
