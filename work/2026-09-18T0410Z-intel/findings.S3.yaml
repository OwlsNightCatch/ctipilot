    discovery_trace: "first seen at: inside-it-ch, URL https://www.inside-it.ch/rss.xml (RSS listing, item published 2026-09-17T12:14:40Z; the article page itself 429'd on both extract and jina-fallback attempts, bounded-retry limit reached) → pivot: WebSearch (\"NTC Solaranlagen Schwachstellen Stromnetz Schweiz September 2026\") → pivot: SRF (Rundschau), URL https://www.srf.ch/news/schweiz/risiko-cyberangriffe-sicherheitsexperten-blackout-risiko-wegen-solaranlagen → primary: NTC's own report page, URL https://www.ntc.swiss/aktuelles/cybersicherheit-von-photovoltaikanlagen"
    summary: |
      Switzerland's National Test Institute for Cybersecurity (NTC) published a year-long technical security assessment (2026-09-17) of eleven digital products from eight manufacturers widely deployed in Swiss residential and commercial solar installations: seven inverters and four energy-management systems. Testing surfaced more than 50 findings, seven rated critical and six high; five of the eleven products carried at least one high/critical finding, and NTC obtained full device control on four of the eleven. The single most operationally significant pattern: on nearly all tested inverters, an attacker can change how much power the installation feeds into the grid — down to zero — via the local control interface with no authentication at all. Individually this affects one rooftop system; NTC's core finding is that because most inverters stay permanently connected to a handful of manufacturer clouds for remote management and firmware delivery, an attacker who compromises one manufacturer's cloud (or coerces the manufacturer) can trigger the identical unauthenticated power-cutoff manipulation across every connected installation simultaneously — turning what looks like consumer-grade IoT into de facto critical grid infrastructure. Other recurring weaknesses: default/preset passwords, unsecured maintenance access using identical credentials across an entire device fleet, missing or weak encryption on local-interface communication, and interfaces that cannot be disabled. NTC reported findings confidentially to vendors before publication; remediation is complete for some products and ongoing for others. NTC deliberately withheld product names and technical exploitation detail from the public report. SRF's independently reported companion piece (Rundschau investigative program) adds a supply-chain concentration angle not in NTC's own report text: Chinese manufacturers Huawei and Sungrow now hold over 60% of the Swiss inverter market (Federal Office of Energy estimate), NTC's founder Raphael Reischuk states whoever controls the inverter fleet controls the grid, and SRF cites a real-world precedent of a Chinese inverter manufacturer remotely disabling units in the US and other countries during a distribution dispute (units displayed "Not allowed to use"). Switzerland's Federal Intelligence Service (NDB) is cited warning that under-protecting critical infrastructure relative to the EU makes Switzerland a preferred attack target; a canton Bern procurement (a vocational school PV installation) is cited as a case where cybersecurity was "not yet well anchored" in tender criteria and a Huawei inverter was the only realistic bid.
    region_nexus: "Switzerland (home region) — NTC is a Swiss national testing body; SRF documents a cantonal government (Bern) procurement of the affected technology class and cites NDB (Swiss federal intelligence) warnings on critical-infrastructure protection gaps relative to the EU"
