      - "Malware behavior detail: the ClickFix/plugin payload 'does not activate for crawlers, developers and automated scanners' (Sansec) — a selective-targeting/evasion behavior worth noting as a detection-evasion characteristic (automated scans of a compromised page would not necessarily surface the malicious behavior)."
