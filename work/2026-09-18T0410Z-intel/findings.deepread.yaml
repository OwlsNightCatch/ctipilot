  - item_number: 9
    title: "Update — Cisco ISE hardening release (21 vulnerabilities, 13 critical, Sept 16)"
    confirmed: true
    corrections: []
    additional_detail:
      - "IMPORTANT CLARIFICATION (not a correction, but worth stating precisely): the '21 total / 13 critical' figure from NCSC-NL is NOT the total count of CVEs Cisco disclosed for ISE on Sept 16 — Cisco's own advance-notification bundle page (cisco-sa-notice-jfxK98ZP) lists 42 distinct CVE IDs across 15 separate ISE advisory titles that day, spanning severities from Critical 10.0 down to Medium 3.8. NCSC-NL's advisory (NCSC-2026-0382) scopes to a specific 21-CVE subset. I independently pulled NCSC-NL's own structured CSAF document (via the ncsc-nl csaf bridge command, since the human-facing advisories.ncsc.nl page redirects client-side and could not be read directly) and it lists EXACTLY 21 CVE ids: CVE-2026-20307, 20211, 20176, 76423, 76424, 76425, 76426, 76427, 76428, 20282, 20283, 20284, 20305, 20306, 20130, 20192, 20194, 20234, 20237, 20287, 76460. Using NCSC-NL's OWN per-CVE CVSS scores from that document, exactly 13 of these 21 score >=9.0 (20307=9.9, 20211=9.1, 20176=9.1, 76423=10.0, 76424=7.2, 76425=7.6, 76426=4.9, 76427=4.9, 76428=4.9, 20282=4.9, 20283=6.5, 20284=9.1, 20305=9.1, 20306=9.1, 20130=10.0, 20192=10.0, 20194=9.1, 20234=9.9, 20237=9.1, 20287=6.5, 76460=10.0) — confirming NCSC-NL's '13 critical' count exactly. So the S1 findings YAML's '21 total, 13 critical' framing is fully accurate FOR NCSC-NL's specific advisory scope, but the composer should be careful not to imply this is the complete Sept-16 ISE disclosure — Cisco's own bundle page shows roughly double that number of CVE IDs when including the medium/high-severity items NCSC-NL's advisory does not cover (RADIUS DoS, SQL injection, XSS, path traversal, medium auth-bypass, info disclosure, SQL/HQL injection, authorization bypass, 802.1x session hijack — none of which reach the ~4.9+ severity floor NCSC-NL's 21-CVE scope appears to use)."
      - "CERT-FR's combined advisory (CERTFR-2026-AVI-1197, covering BOTH the FMC/ASA/FTD hardening cycle from item 8 AND the ISE hardening cycle from item 9 under one French advisory) states explicitly and singularly: 'Cisco indique que la vulnérabilité CVE-2026-76460 est activement exploitée' (Cisco states that CVE-2026-76460 is actively exploited) — no other CVE in the entire Sept 16 disclosure batch is named as exploited by CERT-FR. This fully confirms 'only CVE-2026-76460 is exploited' with an independent, authoritative source beyond Cisco's own advisory."
      - "CERT-FR adds an important patch-availability caveat not currently in either entry: 'Cisco indique que les versions 3.2 et 3.1 de Identity Services Engine (ISE) ne seront plus supportées à partir du 30 novembre 2027 et n'ont pas reçu de correctif pour les vulnérabilités CVE-2026-20247, CVE-2026-20282, CVE-2026-20300, CVE-2026-76424, CVE-2026-76425, CVE-2026-76426 et CVE-2026-76428' — i.e. ISE 3.1 and 3.2 (both scheduled for End-of-Software-Maintenance Nov 30, 2027) will NOT receive fixes for seven of the disclosed CVEs at all. Worth flagging: any org running ISE 3.1/3.2 has an unpatchable subset of this disclosure and should treat upgrade to 3.3+ as the only remediation path for those specific CVEs."
      - "Per-CVE CWE/mechanism detail for the two newly-disclosed CVSS-10.0 bundle CVEs confirmed via NCSC-NL's CSAF: CVE-2026-20130 = CWE-class 'onvoldoende neutralisatie van invoer' (insufficient input neutralization — an injection-class bundle); CVE-2026-20192 = CWE-class 'onjuiste toegangscontrole' (improper access control bundle). NCSC-NL: 'Cisco heeft voor deze hardening-release meerdere onderliggende kwetsbaarheden per CWE-klasse onder één CVE-ID samengebracht. De CVSS-score vertegenwoordigt daarbij de hoogst scorende onderliggende kwetsbaarheid' (Cisco grouped multiple underlying vulnerabilities per CWE class under one CVE ID for this hardening release; the CVSS score represents the highest-scoring underlying vulnerability) — this is more precise than the S1 findings' generic 'CWE-class-grouped bundles' framing and worth adding the specific CWE-class names per CVE."
      - "CVE-2026-76423 mechanism confirmed precisely via NCSC-NL's per-CVE CSAF record (CWE-23 Relative Path Traversal as primary, also implicated: CWE-290 Authentication Bypass by Spoofing, CWE-611 XML External Entity injection, CWE-89 SQL Injection): 'Multiple vulnerabilities in Cisco Identity Services Engine (ISE) and ISE Passive Identity Connector (ISE-PIC) allow remote attackers to bypass authentication, execute remote code, and perform SQL injection and XML External Entity injection attacks via REST API authorization flaws.' This is richer than the existing entry's framing of CVE-2026-76423 as a single 'REST API unauthenticated admin-access bypass' — it is itself a CWE-class bundle covering multiple flaw types via REST API authorization weaknesses."
      - "CVE-2026-76460 mechanism confirmed via NCSC-NL's own CVSS vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H, base 10.0, CWE-648 (Incorrect Use of Privileged APIs) — matches the existing entry's framing exactly, no discrepancy."
