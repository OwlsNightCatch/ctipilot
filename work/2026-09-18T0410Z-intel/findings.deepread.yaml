    additional_detail:
      - "Precise syscall-gadget mechanism for the VEH-hijack-style anti-analysis (this is SparroWocky's loader, distinct from MovieReaper's separate VEH technique in item 5 — do not conflate): not applicable here, SparroWocky does not use VEH; correcting my own note — SparroWocky's anti-analysis techniques are SilentMoonwalk call-stack forgery (using JOP/ROP gadgets in legitimate kernel32.dll to make calls appear to originate from RtlUserThreadStart/BaseThreadInitThunk) and a MinHook-based CreateThread hook that reports AnimateWindow as the fake thread start address via a trampoline."
      - "Trident loader confirmed precisely: legitimate executable + side-loading DLL (patched .text-section region, entry point redirected into the patch, exported-function list/metadata otherwise untouched to blend in) + a same-named .dat payload file with a custom header (4-byte magic 0x11328712, config size, payload size, 16-byte RC4 key) whose decrypted PE payload has its MZ/PE magic bytes stripped before reflective in-memory mapping."
      - "BOF loading confirmed precisely: command 0x14 uses a modified TrustedSec COFFLoader/RunCOFF; the modification specifically redirects BOF-imported-symbol calls to a stack-spoofing subroutine (hiding/proxying calls the BOF object makes to external libraries) — compatible with Cobalt Strike, Brute Ratel, Metasploit and Sliver BOF-formatted objects."
      - "Sample analyzed: PE-timestamp-compiled 2025-11-17, backdoor self-reported version 1.8, SHA-1 44F0A22B143B79FA760BF31E14C8FFF714C8A2A1 (IOC — do not carry into the entry). Authors: Alexandre Côté Cyr and Romain Dumont (ESET)."
      - "Persistence config confirmed operator-selectable via the .dat configuration: value 1 = Windows service, value 2 = registry Run key (HKLM or HKCU depending on privilege level) — matches the summary's 'operator-configurable' framing exactly."
      - "C2 network protocol confirmed: Mbed TLS for the TLS channel to the C&C server, connecting on port 443 by default (also observed on 8080); self-signed certs reused across some servers but no reliable generic fingerprint per ESET. RC4 with a per-message freshly generated 8-byte key encrypts command arguments/results."
