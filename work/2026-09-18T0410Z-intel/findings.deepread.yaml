          own published article, not a fabrication risk on the findings YAML's part, but the composer
          should either merge both lists explicitly as "at least: Russia, Spain, Germany, Türkiye, Japan,
          Kenya, and others across Europe, Asia and Africa (Kaspersky's own article gives two
          overlapping-but-not-identical country enumerations in different sections)" or cite the more
          specific "Victims" section list, rather than presenting the Introduction's list as the complete
          or sole enumeration.
