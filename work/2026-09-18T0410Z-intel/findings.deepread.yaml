      - "Sansec's own published timeline table (in its 2026-09-16 write-up) opens with two entries about the separate Sept-10 SSO incident, sourced explicitly to Brevo's OWN Sept-10 write-up: '2026-09-10 06:30 — Brevo identifies the SSO flaw' and '2026-09-10 08:30 — Attacker loses access in Brevo's SSO incident' — both cited 'per its write-up' (i.e. per Brevo's own separate incident report). Sansec does NOT explicitly assert these two incidents are technically connected or share an attacker, but by placing these Sept-10 timestamps as the opening rows of ITS OWN Sept-14-incident timeline table, Sansec's presentation implies a narrative continuity between the two incidents without making an explicit causal claim. Worth surfacing this nuance rather than treating the two incidents as entirely unconnected in the entry's framing, while being careful not to overstate it as a confirmed technical link — neither Brevo's post-mortem (which does not mention the Sept 10 incident at all) nor Sansec's prose makes an explicit causation claim."
      - "The '100,000 sites' figure precise sourcing: Sansec's own text states 'Brevo served malware to visitors of its own site and more than 100 thousand customer sites,' linked to a publicwww.com source-code search for pages referencing 'brevo.com' OR 'sibforms.com' OR 'sibautomation.com' — i.e. the figure is an upper-bound COUNT OF SITES EMBEDDING the affected Brevo components (a proxy for maximum possible exposure), not a confirmed count of sites whose visitors actually received the injected malicious payload during the ~5-hour window. BleepingComputer's own paraphrase is appropriately hedged: Sansec 'reported that it may have impacted up to 100,000 websites that use the affected Brevo components.' The existing findings YAML's phrasing ('estimates the affected embedded-script exposure reached up to 100,000 websites') is reasonably calibrated already; recommend keeping the hedged 'up to' framing rather than a bare '100,000 sites compromised' claim."
