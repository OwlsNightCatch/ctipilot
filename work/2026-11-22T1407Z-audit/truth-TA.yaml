    ground_truth: 'AFP: "France''s cyber security agency had already identified ''a vulnerability in software supplied by a Danish company and has contacted the vendor''" (attributed to a person close to the Prime Minister)'
    ground_truth_url: https://www.khaleejtimes.com/world/europe/french-supermarkets-refrigerator-shutdown-cyberattack
