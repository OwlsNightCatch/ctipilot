    ground_truth: 'Style rule: a section carries the cited delta only; the retraction belongs in the record summary'
    ground_truth_url: https://dixell.fr/wp-content/uploads/2026/10/Recommandations-pour-une-utilisation-securisee-des-superviseurs-XWEB-v1.0.pdf
    fix: Cut the sentence (advisory).
  length_note: null
  notes:
  - 'Two claims left unreadable, not defects: (1) 2026-10-14 section, NCSC hub 13054 "could affect other sectors, such as healthcare for specialized cooling equipment": the post was edited 2026-11-06 and 2026-11-16 and the current text no longer carries that sentence; (2) 2026-11-14 section, BSI v1.0 "criticality 3 (Orange)": the same URL now serves v1.1 (17.11.2026) showing Kritikalität 2 / Gelb and Gefährdung Aktive Ausnutzung, v1.0 is not retrievable (heise 13 Nov: BSI urges "unverzüglichen Handeln" is consistent with Orange). Danfoss advisories index (current) pairs CVE-2026-127057 with DSA-2026-12-01 and shows a blank CVE for DSA-2026-12-02; the advisories and the CVE records (CVE-2026-129713 9.3 stack overflow, CVE-2026-127057 9.9 default credentials) agree with the entry. NCSC hub post also gained (2026-11-16) VulnCheck''s 14 XWEB EVO flaws; BSI v1.1 CVE-2026-124014/124010 are covered by entry 2026-11-13/dixell-copeland-xweb-evo-vulncheck-cves-end-of-service. DSA-2026-12-01/-02, CCB,
    Midnight Blue, CERT-FR (versions 12/13/16 Oct), French MFA, CERTFR-2026-CTI-009 and the other cited pages verified.'
- entry: 2026-10-15/cve-2026-76519-cisco-secure-email-gateway-file-write-root
  verdict: imprecision
  findings:
  - code: F16
    claim_id: null
    where: 'priority: critical and immediate_action (low confidence)'
    defect: critical retained five weeks after the 2026-10-14 advisory; the only in-window development is an improvement record (public Metasploit module, merged 2026-11-05, Rapid7 wrap-up 2026-11-20)
    ground_truth: 'Phase 4 critical bar requires action "time-critical to the hour or day" and lists "patches >=1 week old without new exploitation" as a disqualifier; Cisco: "Customers who have enabled automatic Content Scanner Tools updates are not required to take any action"; no source reports new exploitation or verified scanning since October'
    ground_truth_url: https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-esa-afw-zqYJkjxp
    fix: Consider high; or, if the public module counts as new weaponisation, keep critical but record the change as a type update so the entry floats.
  - code: F11
    claim_id: null
    where: updates[] record 2026-11-22T04:34:04Z (type improvement)
    defect: A new in-the-wild development (public Metasploit module) is typed improvement, so updated_at stays null and the entry does not float
    ground_truth: 'Rapid7 2026-11-20: "Adds a new exploit module for CVE-2026-76519 an unauth RCE in Cisco Secure Email Gateway ... giving us RCE with root privs."'
    ground_truth_url: https://www.rapid7.com/blog/post/pt-metasploit-wrap-up-breaking-zimbra-s-identity-boundaries/
    fix: Retype as update (advisory).
  length_note: null
  notes:
  - Cisco advisory (9.8, conditions, fixed builds 15.5.5-014 / 16.5.0-780 / CST 25.3.0.5525, log check, cluster guidance, revision 1.0 only), BleepingComputer, KEV (2026-10-14; CVE-2026-76461 added 2026-09-14), Rapid7 and Metasploit PR 22028 (merge event 2026-11-05) verified.
