  - code: F14
    claim_id: null
    where: title ("compromised in France, six more European countries and Switzerland") (low confidence)
    defect: Fixed count "six more European countries" while the entry's own body lists more
    ground_truth: BleepingComputer counts six (Belgium, the Netherlands, Sweden, Luxembourg, Ireland, Estonia) but The Guardian adds Finland and heise/WDR/Tagesschau add Germany (Rewe confirmed an attack aimed at Danfoss), so the body names at least eight; the summary correctly says "at least six more countries"
    ground_truth_url: https://www.theguardian.com/world/2026/nov/02/supermarket-freezers-across-europe-hit-by-second-suspected-cyber-attack
    fix: 'Title: "at least six more European countries" or "more than six".'
  - code: F5
