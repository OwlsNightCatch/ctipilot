- entry: 2026-06-16/obsidian-security-a-three-cve-chain-turns-any-litellm-user-i
  verdict: imprecision
  findings:
  - code: F4
    claim_id: 1976a6f635
    where: cves[CVE-2026-47101].cvss and sourcing_note
    defect: 'cvss: "n/a" and sourcing_note "no listed source scores CVE-2026-47101 on its own", while the entry records VulnCheck''s score for the sibling CVE-2026-47102'
    ground_truth: 'VulnCheck per-CVE advisory (the CNA for 47101): "LiteLLM < 1.83.14 Privilege Escalation via API Key Generation ... Severity: HIGH ... CVSS: 8.7 ... CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N"; GitHub-reviewed GHSA-qrc4-49gv-mv9m: CVSS 3.1 8.8, CVSS 4.0 8.7'
    ground_truth_url: https://www.vulncheck.com/advisories/litellm-privilege-escalation-via-api-key-generation
    fix: Record cvss "8.7 (CVSS 4.0, VulnCheck)" for CVE-2026-47101, cite the VulnCheck advisory, and drop the "no listed source scores" clause of sourcing_note.
  - code: F14
    claim_id: null
    where: sourcing_note ("CISA's catalog entry is the only statement of exploitation, which names no actor, victim or observed behaviour")
    defect: 'Absolute quantifier: CISA is presented as the only statement of exploitation of CVE-2026-40217'
    ground_truth: 'Google Threat Intelligence Group / Mandiant (2026-11-02, two weeks before the update; already in the store as entry 2026-11-09/llmjacking-stolen-cloud-keys-enable-model-services-resale): "a follow-on cluster executed targeted application logic exploitation against the victim''s LiteLLM gateway. The actor exploited a user ID rebind vulnerability in the /key/regenerate endpoint (CVE-2026-40217) to elevate standard Virtual Keys into full PROXY_ADMIN master administrative credentials"'
    ground_truth_url: https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models
    fix: Narrow the clause to the listed sources or add GTIG as a second, mechanism-conflicting statement of in-the-wild use.
  - code: F9
    claim_id: null
    where: main analysis / 2026-11-19 section (mechanism of CVE-2026-40217)
    defect: Entry and vendor advisory describe CVE-2026-40217 as a custom-code guardrail sandbox escape (RCE); no Contradiction line for the conflicting exploitation report
    ground_truth: GTIG attributes the exploited CVE-2026-40217 to a "user ID rebind vulnerability in the /key/regenerate endpoint" giving PROXY_ADMIN (likely a conflation with the allowed_routes/role-escalation flaws, but the sources disagree and the entry does not say so)
    ground_truth_url: https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models
    fix: Add a one-sentence Contradiction line naming GTIG's description versus the vendor advisory and CISA's "Unprotected Alternate Channel" listing.
  - code: F3
    claim_id: null
    where: sources[0] date 2026-06-11 (low confidence)
    defect: 'Obsidian source dated 2026-06-11 '
    ground_truth: 'Page JSON-LD "datePublished": "2026-09-08T05:01:12.759Z", "dateModified": "2026-09-08T04:54:52.106Z"; the page''s own timeline ends "June 11, 2026 - Published the research" and The Hacker News linked it on 2026-06-15, so the entry date is substantively right and the metadata looks like a CMS re-save'
    ground_truth_url: https://www.obsidiansecurity.com/blog/litellm-privilege-escalation-rce
    fix: None required; optionally note the page was re-saved 2026-09-08.
  length_note: null
  notes:
  - KEV (dateAdded 2026-11-18), GHSA-wxxx-gvqv-xp7p fields (>= 1.81.8, < 1.83.10; CVSS 4.0 5.9; text says 1.83.11, patched_versions >= 1.83.10) and the Obsidian/THN claims all verified; the GitHub-reviewed global advisory scores CVE-2026-40217 higher (3.1 8.8, 4.0 7.5, high) than the vendor record the entry uses, noted not counted.
- entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
  verdict: factual-error
  findings:
  - code: F13
    claim_id: 08080c17e7
    where: title, headline, summary ("Huntress traced worm-like exploitation back to 20 August"; "Huntress had already watched ..."; "Huntress documented exploitation from 20 August 2026")
    defect: Asserts that the 20 August worm-like activity was exploitation of CVE-2026-84869 and that Huntress documented it as such weeks before the patch
    ground_truth: Huntress 2026-09-03 post (with the 9/8 update) describes rogue ScreenConnect clients deployed by social engineering and a modified client that propagates over new connections; its 9/8 update only notes "ConnectWise has released a security update to address a vulnerability (CVE-2026-84869)" and never says the August incidents exploited it. Huntress 2026-11-16 dates confirmed exploitation to a canary push "On November 13", spray from "October 20 to November 16", traversal pushes "October 23, 24 and 27" and a near-miss "On October 19"; SecurityWeek (2026-09-07) and the SCKit post ("In September 2026, Huntress stood up a Rapid Response to similar worm-like activity") make no CVE link either
    ground_truth_url: https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation
    fix: 'Rephrase title/headline/summary to what the sources state: Huntress saw worm-like rogue-client spread from 20 August, ConnectWise then disclosed the file-transfer flaw on 8 September, and Huntress confirmed exploitation of CVE-2026-84869 from October.'
  - code: F13
    claim_id: 6ddc069a14
    where: body para 3 ("the exact abuse path CVE-2026-84869 patches") and para 2 ("Huntress had been tracking the exploitation since 20 August", claim 3491a80055)
    defect: States as fact that the modified client's auto-run file-transfer message is the CVE-2026-84869 abuse path and that the August incidents were exploitation of it
    ground_truth: 'Huntress rogue-screenconnect-installations: "This creates a worm-like behavior: propagating infections over new ScreenConnect connections." ConnectWise advisory: "file-transfer actions could be processed through an active remote session without proper authorization or Host confirmation". No cited source equates the two.'
    ground_truth_url: https://www.huntress.com/blog/rogue-screenconnect-installations
    fix: Mark the link as the entry's inference ("matches the behaviour ConnectWise describes") or cut it; the 11-16 Update section already carries the sourced exploitation.
  - code: F3
    claim_id: eac01247ef
    where: body para 3 ("A technician's ScreenConnect client that has been infected this way silently re-infects every subsequent host it connects to") and actions[1] ("propagated the infection to every host that client connected to") (low confidence)
    defect: Reverses the direction of propagation
    ground_truth: '"Connecting to an infected ScreenConnect client can cause the server-side Host system to receive and execute the same four-stage VBScript chain": the infection flows to Hosts that connect TO the infected client; Huntress 11-16: "A malicious guest ... can push a file to the technician''s machine"'
    ground_truth_url: https://www.huntress.com/blog/rogue-screenconnect-installations
    fix: Say that every Host that joins a session with an infected client can be re-infected.
  length_note: headline 133 characters (bound 120); main analysis 536 words
  notes:
  - ConnectWise disclosure (9.9, prior to 26.6.5, servers not impacted), KEV dateAdded 2026-09-11 and the 2026-11-17 section (688,000 requests, 42 servers, 29 sources, nine seconds) verified; ConnectWise bulletin page returns 403 to WebFetch, GitHub disclosure has a single commit (2026-09-08).
