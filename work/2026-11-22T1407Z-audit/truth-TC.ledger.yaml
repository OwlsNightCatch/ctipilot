    entry: 2026-11-18/barracuda-cloud-intrusion-vendor-held-key-artex-consistent
    surface: "body"
    kind: cited
    text: "The key had been stored in a configuration file in the vendor's GitHub repository, which was exposed when the vendor's development environment was compromised ("
    urls: ["https://trust.barracuda.com/security/barracuda-xdr-integration-credentials"]
  - claim_id: 2816fa3560
    entry: 2026-11-18/barracuda-cloud-intrusion-vendor-held-key-artex-consistent
    surface: "body"
    kind: cited
    text: "The first call with the key came on 2026-11-01 at 04:33 UTC; within minutes the attacker was mapping what the key reached and reading stored secrets such as AWS access keys and Azure service principal secrets, and each secret opened the next system, from cloud accounts to a data analytics system, to a source-code access token and on to Kubernetes clusters ("
    urls: ["https://blog.barracuda.com/2026/11/11/anatomy-of-a-machine-speed-intrusion"]
  - claim_id: 2a0141cd74
    entry: 2026-11-18/barracuda-cloud-intrusion-vendor-held-key-artex-consistent
    surface: "body"
    kind: cited
    text: "In just under four hours on 2026-11-02 it pushed short-lived branches to a handful of repositories to trigger a build workflow written to print the build system's secrets into the job log, encoded so that log masking would not hide them, and its last recorded activity was at 23:31 UTC, about 10 cloud accounts and 44 hours after the start ("
    urls: ["https://blog.barracuda.com/2026/11/11/anatomy-of-a-machine-speed-intrusion"]
  - claim_id: 2fade59edf
    entry: 2026-11-18/barracuda-cloud-intrusion-vendor-held-key-artex-consistent
    surface: "body"
    kind: cited
    text: "In a Kubernetes cluster the attacker deployed a container that mounted the underlying server's file system read-only, enough to harvest that server's credentials, and tried to create a new administrative cloud identity, which was blocked ("
    urls: ["https://blog.barracuda.com/2026/11/11/anatomy-of-a-machine-speed-intrusion"]
  - claim_id: 490cc9ea8d
    entry: 2026-11-18/barracuda-cloud-intrusion-vendor-held-key-artex-consistent
    surface: "body"
    kind: cited
    text: "On servers where it had a shell, its commands searched for environment variables named WALLET, MNEMONIC, SEED and PRIV, Ethereum keystore files, extended private keys, seed phrase files and Kubernetes secrets with wallet-related names, and Barracuda calls the activity consistent with a financially motivated actor seeking cryptocurrency and reusable credentials ("
    urls: ["https://trust.barracuda.com/security/barracuda-xdr-integration-credentials"]
  - claim_id: 734c0b0535
    entry: 2026-11-18/barracuda-cloud-intrusion-vendor-held-key-artex-consistent
    surface: "body"
    kind: cited
    text: "Barracuda says the resource names, the sequence of activity and the credential and wallet hunting routines match ARTEX, which many groups use, so the match shows how the attacker operated, not who it was ("
    urls: ["https://blog.barracuda.com/2026/11/11/anatomy-of-a-machine-speed-intrusion"]
  - claim_id: 60c0bb7e00
    entry: 2026-11-18/barracuda-cloud-intrusion-vendor-held-key-artex-consistent
    surface: "body"
    kind: cited
    text: "**Exposure:** a system the attacker reached stores the credentials Barracuda Managed XDR uses to collect data from customers' connected systems such as Microsoft 365, Google Workspace and endpoint security platforms; only organisations using the API integration for Managed XDR Cloud or Monitored Endpoint are affected, and Barracuda notified those with potentially affected credentials ("
    urls: ["https://trust.barracuda.com/security/barracuda-xdr-integration-credentials"]
  - claim_id: 8e86a03990
    entry: 2026-11-18/barracuda-cloud-intrusion-vendor-held-key-artex-consistent
