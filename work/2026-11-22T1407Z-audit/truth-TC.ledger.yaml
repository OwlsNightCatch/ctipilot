    text: "Broadcom's Tanzu advisory TNZ-2026-1107 says several Tanzu products ship affected Java runtimes and lists released fixes: Java Buildpack 5.5.0 and 5.5.1, Ruby Buildpack 1.10.104, Tanzu OpenJDK 17.0.21.1+5, 21.0.13.1+5 and 25.0.5.1+5 and Foundation Core 3.1.19, 3.3.10 and 11.0.3, where the identity service and CredHub carry an affected Java 25 runtime that Tanzu has not yet confirmed from the bill of materials; it names -XX:-UseBASE64Intrinsics as the preferred workaround ("
    urls: ["https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/39639"]
  - claim_id: 3bd7ae0eb9
    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "section 2026-11-20T05:12:29Z"
    kind: cited
    text: "Palo Alto Networks lists fixed builds of Privilege Threat Analytics, Remote Access Connector and the Secure Access HTML5 Gateway, says PAN-OS is not affected, offers no workaround and is not aware of any malicious exploitation ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-114938"]
  - claim_id: a4f407e6f6
    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "section 2026-11-20T05:12:29Z"
    kind: uncited
    text: "Three more vendors published product status."
  - claim_id: 5e23ce77de
    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "section 2026-11-20T05:12:29Z"
    kind: uncited
    text: "None of these statuses changes the exploitation picture above."
  - claim_id: fdd1a3ebe5
    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "section 2026-11-21T04:38:58Z"
    kind: cited
    text: "Cisco's advisory is now at version 1.3 (2026-11-20), whose change log reads \"Changed Catalyst Center from affected to not affected\", and its product table shows Catalyst Center, IOS XE, ISE and UCS Central as not affected, so the Cisco product list above follows that version ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-nov2026-java-rce-eCa6ss9z"]
  - claim_id: 32624dd6fe
    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "section 2026-11-21T04:38:58Z"
    kind: cited
    text: "Siemens has published two advisories for CVE-2026-114938 and lists no fix for either: Siveillance Control and Siveillance Control Pro, the physical-security management systems, with the JVM option -XX:-UseBASE64Intrinsics on the client until Java is updated ("
    urls: ["https://cert-portal.siemens.com/productcert/html/ssa-810379.html"]
  - claim_id: c54869e6b8
    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "section 2026-11-21T04:38:58Z"
    kind: cited
    text: "), and Industrial Edge Management Pro and Virtual, where Siemens' immediate measure is to block direct internet access or shut the instances down ("
    urls: ["https://cert-portal.siemens.com/productcert/html/ssa-272816.html"]
  - claim_id: 7e574aed7f
    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "section 2026-11-21T04:38:58Z"
    kind: uncited
    text: "Neither Cisco nor Siemens reports exploitation of its products."
  - claim_id: e2d22c06c7
    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "section 2026-11-22T04:45:27Z"
    kind: cited
    text: "Ubuntu lists fixed OpenJDK packages for openjdk-17 on 18.04 to 26.10, openjdk-21 on 20.04 to 26.10, openjdk-25 on 22.04 to 26.10 and openjdk-27 on 26.10, and marks openjdk-8 not affected on every release it lists ("
    urls: ["https://ubuntu.com/security/CVE-2026-114938"]
  - claim_id: 79f59eb9e2
    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "section 2026-11-22T04:45:27Z"
    kind: cited
    text: "Debian published DSA-6639-1 for openjdk-21 and DLA-4917-1 for openjdk-17 on 2026-11-19, both listing this flaw ("
    urls: ["https://lists.debian.org/debian-security-announce/2026/msg00561.html", "https://lists.debian.org/debian-lts-announce/2026/11/msg00042.html"]
  - claim_id: c7bf371648
    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "section 2026-11-22T04:45:27Z"
    kind: cited
    text: "); its tracker lists the fixed builds 17.0.21.1+2-1~deb12u1 for bookworm and 21.0.13.1+2-1~deb13u1 and 25.0.5.1+2-1~deb13u1 for trixie and, as of 2026-11-22, still shows openjdk-21 and openjdk-25 on forky as vulnerable ("
    urls: ["https://security-tracker.debian.org/tracker/CVE-2026-114938"]
  - claim_id: a97a459942
    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "section 2026-11-22T04:45:27Z"
    kind: cited
    text: "Citrix lists the Linux VDA of Citrix Virtual Apps and Desktops, Citrix Analytics, Citrix Endpoint Management (XenMobile Server), App Layering and UniconOS Management (Scout) as impacted with fixed builds still to be determined, and NetScaler ADC and Gateway, NetScaler Console, StoreFront, XenServer and Provisioning as not impacted ("
    urls: ["https://support.citrix.com/external/article/CTX697367/citrix-security-advisory-for-cve20261149.html"]
  - claim_id: 3a820aa731
    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "section 2026-11-22T04:45:27Z"
    kind: cited
    text: "Mitel's first advisory marks MiVoice 5000, OpenScape Business, OpenScape Voice and OpenScape Xpert not affected and is still investigating, among others, MiCollab, MiVoice Business and OpenScape 4000 ("
    urls: ["https://www.mitel.com/support/security-advisories/mitel-product-security-advisory-misa-2026-0014"]
  - claim_id: 29436f37d6
    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "section 2026-11-22T04:45:27Z"
    kind: cited
    text: "These supersede the reading of 2026-11-18 that Red Hat and Ubuntu had no fix: Red Hat has released fixed OpenJDK packages for Red Hat Enterprise Linux as of 2026-11-19, while it still lists some products that bundle Java, such as Red Hat build of Keycloak, as affected ("
    urls: ["https://www.tenable.com/blog/java4shell-cve-2026-114938-frequently-asked-questions-about-openjdk-rce-vulnerability"]
  - claim_id: eb1950b954
    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "record 2026-11-19T05:03:07Z"
    kind: record-summary
    text: "GreyNoise reports exploitation attempts against CVE-2026-114938 as of 2026-11-18, none confirmed successful against its sensors, and VulnCheck says a working RCE exploit is available to its customers; Cisco lists 13 products as affected with fixed releases still to be determined, Fortinet is still investigating, BACS's warning adds internal systems and supplier clarification, and Tenable says Red Hat and Ubuntu had released no fix and Debian only an unstable-branch fix as of 2026-11-18, with Keycloak recommending a JVM option as the interim mitigation."
  - claim_id: b2cca7ce01
    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "record 2026-11-20T05:12:29Z"
    kind: record-summary
    text: "Elastic confirms Elasticsearch 7.17.3 and later is affected, with remote code execution needing an authenticated read-level user and unauthenticated actors limited to denial of service, and announces fixes without dates; Broadcom lists released Tanzu fixes and Palo Alto Networks lists fixed builds, none reporting exploitation."
  - claim_id: 25a7b84948
    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "record 2026-11-21T04:38:58Z"
    kind: record-summary
    text: "Siemens lists Siveillance Control, Siveillance Control Pro and Industrial Edge Management Pro and Virtual as affected with no fix, and Cisco's advisory version 1.3 moves Catalyst Center to not affected and shows IOS XE, ISE and UCS Central as not affected, so the earlier Cisco listing of Catalyst Center as affected no longer holds."
  - claim_id: 109474ed3d
    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "record 2026-11-22T04:45:27Z"
    kind: record-summary
    text: "Ubuntu and Debian list fixed OpenJDK packages and Red Hat has released fixed packages for Red Hat Enterprise Linux; Citrix lists Linux VDA, Analytics, XenMobile Server, App Layering and UniconOS Scout as impacted with no fixed build, and Mitel is still investigating MiCollab, MiVoice Business and most of its other products."
