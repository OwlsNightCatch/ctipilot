  - claim_id: a430fa6b66
    entry: 2026-11-17/optimjack-poisoned-vendor-scripts-skimmer-iphone-router
    surface: "summary"
    kind: frontmatter
    text: "Optimizely says an unauthorized party exploited a flaw in its Web Experimentation account signup flow to impersonate users and add malicious JavaScript to some customer projects, fewer than 5% of its customers, and Report URI counts 178 organisations that served the code on 2026-11-16 while Zscaler ThreatLabz counts more than 450 domains; the Optimizely files carry a crypto clipper and card skimmer. Ohey reports that scripts served by Kissmetrics and StorifyMe gained a loader from 2026-11-13 that routes iPhones to the Coruna and DarkSword exploit-kit stages and that minute-ly's loader was replaced outright; Hudson Rock names 21 web properties, among them the University of Basel's StorifyMe widget, and calls the iPhone stages delivery observations, not confirmed compromises. How the Kissmetrics, StorifyMe and minute-ly files were altered is unknown."
  - claim_id: 55899d1f5d
    entry: 2026-11-17/optimjack-poisoned-vendor-scripts-skimmer-iphone-router
    surface: "actions[0]"
    kind: frontmatter
    text: "List every page of your organisation's sites, and of the agencies that build them, that has loaded Optimizely project JavaScript since 2026-11-16, or Kissmetrics i.js, a StorifyMe widget or the minute-ly loader since 2026-11-13, capture the bytes the browser receives and compare them with the provider's own project content (a search for the loader's host name misses the variant that hides it in base64), and where a file carries the injected loader remove it, keep the response bytes as evidence and treat the payment, login and form pages that loaded an affected Optimizely file as exposed to card and session theft."
  - claim_id: c5ef00fddd
    entry: 2026-11-17/optimjack-poisoned-vendor-scripts-skimmer-iphone-router
    surface: "actions[1]"
    kind: frontmatter
    text: "If your organisation or an agency building its sites has an Optimizely Web Experimentation account, audit every Project JavaScript field for code nobody wrote and rotate the API tokens, session tokens and integration keys tied to it, because the attacker impersonated users on targeted accounts to edit that field."
