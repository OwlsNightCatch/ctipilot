    kind: cited
    text: "**Detection:** in cloud control-plane audit logs, a long-lived key used by a non-vendor address, secret-store reads followed by use of those secrets in other accounts, resources named with the letter i followed by digits and no hyphen, short-lived branches in a handful of repositories that trigger a workflow, and container deployments that mount the node's file system ("
    urls: ["https://trust.barracuda.com/security/barracuda-xdr-integration-credentials", "https://blog.barracuda.com/2026/11/11/anatomy-of-a-machine-speed-intrusion"]
