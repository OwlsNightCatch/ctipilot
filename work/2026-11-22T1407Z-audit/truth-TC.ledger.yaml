  - claim_id: 86d9345bde
    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "headline"
    kind: frontmatter
    text: "Java4Shell: OpenJDK Base64 heap overflow chained to pre-auth RCE in Jira and Keycloak; update Java, attempts seen"
  - claim_id: f8d8b3dbfe
    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "summary"
    kind: frontmatter
    text: "Oracle's Critical Security Patch Update and the OpenJDK advisory of 2026-11-17 fix CVE-2026-114938, an out-of-bounds write in the AVX-512 Base64 decoder that Calif, its discoverer, scores CVSS 4.0 9.2 and says it turned into pre-authentication code execution in the default configurations of Keycloak, Jira, Confluence, Artifactory, Jenkins and PingFederate; Oracle scores it CVSS 3.1 8.1 with high attack complexity. Only x86-64 hosts with AVX-512 VBMI are affected, a trigger proof of concept is public, Calif withholds its product chains, a second researcher claims a working exploit with no release stated, GreyNoise reports exploitation attempts without a confirmed success against its sensors, and VulnCheck says a working exploit is available to its customers. NCSC.ch and BACS warn operators to update internet-reachable Java applications and identity services first, and Cisco's advisory, at version 1.3, lists Catalyst Center, IOS XE and ISE as not affected while Siemens lists Siveillance Control, Siveillance Control Pro and Industrial Edge Management Pro and Virtual with no fix yet."
  - claim_id: 9a65b96585
    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "On every x86-64 host with an AVX-512 VBMI processor that runs Java 17, 21, 25 or 27, update the JDK to 17.0.21.1, 21.0.13.1, 25.0.5.1 or 27.0.1.1 (Oracle builds; Ubuntu and Debian packages carry the same fixes under their own build numbers, other distributions use theirs) or 8u513-perf, then restart the Java processes and rebuild containers, internet-reachable applications and the identity, build and artifact servers Calif names (Keycloak, Jira, Confluence, Artifactory, Jenkins, PingFederate) first; where that waits, start the JVM with -XX:-UseBASE64Intrinsics, or with -XX:UseAVX=2 on x86-64 hosts only."
