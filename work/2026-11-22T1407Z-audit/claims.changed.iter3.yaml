    entry: 2026-11-18/oracle-november-2026-cspu-56-unauthenticated-critical-rows
    surface: "actions[0]"
    kind: frontmatter
    text: "Apply the November 2026 CSPU first to Communications Diameter Signaling Router, Communications Unified Assurance and PeopleSoft PeopleTools, whose Brotli rows are the KEV-listed CVE-2026-111497, then block T3 and IIOP to every WebLogic Server from networks that untrusted hosts can reach and patch internet-reachable Access Manager, WebLogic Server, E-Business Suite and APEX or REST Data Services instances, because Oracle marks 56 rows at CVSS 9.0 or above as exploitable without authentication and names blocking the required network protocols as its interim measure for attacks that need no privileges."
