    kind: frontmatter
    text: "{\"id\": \"CVE-2026-111497\", \"cvss\": \"9.8 (CVSS 3.1, Siemens)\", \"status\": [\"exploited\", \"cisa-kev\", \"poc-public\", \"patch-available\", \"no-patch\"], \"affected\": \"Siemens Desigo CC V8 and V9, SENTRON Powermanager V8 and V9, all versions, SICAM PAS CC from V6.02 and SICAM SCC from V7.01 (no fix planned), IPAS Tester; Siemens SIMATIC WinCC V7/V8, WinCC Unified (PC Runtime, for Industrial Edge, SIQENCE), WinCC Runtime Professional, WinCC Companion, WinCC OA V3.20 below V3.20 P17.1 and V3.21, User Management Component, TIA Administrator, BRAUMAT and SISTAR V8.2 Update 1 to below Update 5, COMOS Walkinside, Project Server Web Administration Tool and the SIMATIC Profiling Tool, and Teamcenter V2412 to V2606, the Opcenter family, Process Preparation X, HyperLynx, PADS and Xpedition products, Innexis Architecture Native Acceleration 2026, Insights Hub, PAVE360 Automotive 2026 and Simcenter Executable Digital Twin and Studio, all versions unless a bound is given (Siemens lists Polarion and seven other software products as not affected); Siemens Gridscale X DSA V5.3 up to but excluding V5.4 and Gridscale X PSS®E below V36.8.0; Industrial Edge Management Applications, Common Configurator and the configurator applications below their fixed versions; Mitel MiVoice Business 10.6.0.7 and earlier, MiVoice Business Solution Virtual Instance up to the build Mitel lists, OpenScape SBC V11R3.4.4 and earlier, OpenScape SESAP V2 R1.1.9 and earlier, OpenScape Contact Center V12R0 to V12R0FR7, OpenScape Xpert V9 R0.2.0 and earlier, OpenScape Endpoint Management V1 R2.5.1 and earlier, OpenScape Alarm Response V1.10 and earlier, MiCollab Advanced Messaging 23.4 and earlier, Mitel Performance Analytics 3.6.3.313 and earlier; Cisco Duo Network Gateway and RoomOS, which Cisco's combined advisory lists in a table with no per-CVE column, below the builds it lists; Apple iOS and iPadOS, macOS, watchOS, visionOS and HomeView Software releases before the versions below; Cisco Nexus 3000 and 9000 Series Switches in standalone NX-OS with Guest Shell, in the same table with no per-CVE column; Apple tvOS before 27.2.1 on Apple TV 4K 2nd generation and later\", \"fixed\": \"Desigo CC: latest .NET security updates via Windows Update; WinCC OA V3.20 P17.1, BRAUMAT and SISTAR V8.2 Update 5, no fix planned for the SIMATIC Profiling Tool and no fix available for the other products added on 2026-11-10 (SSA-242944 products: Brotli disabled at the application or proxy layer and an IIS request-filtering rule on UMC; SSA-678870: knowledge-base mitigations for Teamcenter and Opcenter, a firewall block of Brotli for HyperLynx, PADS and Xpedition, none listed for Innexis, Insights Hub, PAVE360 and Simcenter); Gridscale X DSA V5.4, Gridscale X PSS®E V36.8.0; Industrial Edge: Data Flow Monitoring V3.0.18, Flow Creator Configurator V1.15.1 and four further configurators, Common Configurator no fix; Mitel: OpenScape SBC V11R3.4.5, a MiCollab Advanced Messaging patch (KB000129143) and DAKS-IoT V2.00 for OpenScape Alarm Response released, updates planned for SESAP (V2 R1.1.10), Contact Center (V12R0FR8), Performance Analytics (3.6.4) and the rest; Cisco: fixes listed in its combined advisory for Duo Network Gateway 3.4.2 and RoomOS on-premises 11.41.2.3 and 26.7.4.3, not tied to one CVE; Apple (2026-11-09): iOS and iPadOS 27.2.1 and 26.7.3, macOS Golden Gate 27.2.1, macOS Tahoe 26.7.3, macOS Sequoia 15.8.3, watchOS 27.2.1, visionOS 27.2.1, HomeView Software 27.2 (2026-11-12); Cisco Nexus 3000 and 9000 Series in standalone NX-OS (Guest Shell): Guestshell 4.9 or NX-OS 10.3.11 (December 2026), 9.3.19, 10.5.7 and 10.7.1 (January 2027) or 10.4.9 and 10.6.5 (February 2027), not tied to one CVE; Apple tvOS 27.2.1 (2026-11-13)\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
