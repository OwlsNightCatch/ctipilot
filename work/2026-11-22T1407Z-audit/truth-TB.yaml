- entry: 2026-11-17/bundid-automated-mass-logins-lock-federal-citizen-accounts
  verdict: imprecision
  findings:
  - code: F5
    claim_id: feb440d0c5
    where: body, last sentence (low confidence)
    defect: '"No Swiss portal is reported affected." carries no citation.'
    ground_truth: None of the four cited pages (heise, Handelsblatt, WEB.DE, ad-hoc-news) mentions Switzerland or a Swiss portal; the sentence rests on absence of reports.
    ground_truth_url: https://www.heise.de/news/BundID-Massenhafte-Angriffe-fuehren-zu-Kontosperrungen-11526376.html
    fix: Drop the sentence or rephrase as "the cited reports mention no Swiss portal".
  - code: F8
    claim_id: 0f6474468e
    where: body ("An aggregator reports that password sign-in returned the same afternoon ... no primary source read confirms it"), sourcing_note, headline/title ("password sign-in cut on 16 November")
    defect: Treats the same-day restoration of password sign-in behind a mandatory e-mail code as a single-aggregator report with no primary confirmation.
    ground_truth: 'Spiegel, 2026-11-16: the BundID site notice on Monday afternoon says 2FA was activated for all accounts: "Sie erhalten nun bei jeder Anmeldung mit ›Benutzername & Passwort‹ zusätzlich einen Sicherheitscode per E-Mail, den Sie vor erfolgreicher Anmeldung eingeben müssen"; eID and Elster sign-in "blieben weiterhin möglich"; ID Tech (2026-11-17) quotes the same notice.'
    ground_truth_url: https://www.spiegel.de/netzwelt/web/bundid-hacker-attackieren-konten-zweifaktor-authentifizierung-aktiviert-a-305b6f61-70ac-4a83-8b2c-62c4d98d13c4
    fix: Cite Spiegel for the operator notice, drop "no primary source read confirms it", and state that the operator re-enabled password sign-in the same day behind a mandatory e-mail one-time code, which is the lesson for defenders.
  length_note: main analysis 299 words; headline 102 chars
  notes:
  - 'heise, Handelsblatt, WEB.DE and ad-hoc-news match the entry; verbatim German originals of all three evidence quotes found; later outlets (Tichys Einblick 2026-11-18: "mindestens 10.000", opinion outlet, attributes the figure to an IT journal) put a count the BSI has not published, so the sourcing_note "number of locked accounts is not disclosed" still holds for official sources.'
