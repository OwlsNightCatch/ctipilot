- entry: 2026-11-10/n-able-n-central-33-unpatched-flaws-public-pocs-offline
  verdict: imprecision
  findings:
  - code: F8
    claim_id: null
    where: cves[CVE-2026-90436].status, tags, body (no KEV mention); last record 2026-11-18T05:12:35Z
    defect: status [exploited, mitigation-only] and tags omit cisa-kev; the entry never says CISA lists the Axis flaw as exploited.
    ground_truth: 'CISA KEV (cisa-kev read, dateReleased 2026-11-20): CVE-2026-90436 "Apache Axis Unsafe Reflection Vulnerability", dateAdded 2026-11-18; CISA alert 2026-11-18 "CISA Adds Four Known Exploited Vulnerabilities to Catalog" lists CVE-2026-90436 Apache Axis; Tenable FAQ (updated 2026-11-19): "On November 18, CISA added CVE-2026-90436 to its KEV catalog". The sibling Confluence entry already carries cisa-kev.'
    ground_truth_url: https://www.cisa.gov/news-events/alerts/2026/11/18/cisa-adds-four-known-exploited-vulnerabilities-catalog
    fix: Add cisa-kev to the CVE-2026-90436 status and to tags, with one cited sentence in a changelog update.
  - code: F9
    claim_id: 07223a3f2b
    where: body, Agent2Shell sentence ("two chains of which let an unauthenticated attacker who can reach the server run commands as SYSTEM on managed endpoints") and the 2026-11-14 section (low confidence)
    defect: Presents Huntress/Hacker News reading of Agent2Shell alone and states "N-able does not name either chain or say it is fixed" without citing N-able's own remediation page, which groups the 2026-11-12 disclosures and characterises Agent Impersonation differently.
    ground_truth: 'N-able Vulnerability Remediation Update (updated 2026-11-16): "With regards to Agent Impersonation, to take advantage of the vulnerability an attacker would already need to have a foothold on an endpoint ... The attacker would only be able to receive the same information an agent does through normal operation and set the same values that an agent can set." and "It will also harden how Agents, Probes and appliances authenticate and communicate, limiting an attacker''s ability to perform Agent Impersonation, further remediating the risk. HF3 also permanently removes access to the Legacy API."'
    ground_truth_url: https://www.n-able.com/blog/n-able-vulnerability-remediation-update
    fix: 'Cite the N-able remediation page and add a Contradiction line: N-able says agent impersonation needs an existing endpoint foothold and that HF3 limits it and removes the Legacy API, while Huntress and Hacker News describe unauthenticated SYSTEM execution from the server.'
  length_note: main analysis 547 words; headline 111 chars
  notes:
  - CVSS 4.0 scores, vectors, affected-version wording and auth/vector classes of all 24 N-able CNA records match the ENISA EUVD search records; HF3 CVE titles and Huntress severity counts match; Huntback 21 rigs (9 US, 4 ZA, 4 CA, 1 each UK, DE, FR, SE) and 19 on build 2026.4.1.26 match; no Hotfix newer than HF3 found as of 2026-11-22.
  - Tenable FAQ was revised 2026-11-19, so the 2026-11-12 statements cited to it ("no signs of compromise", "no fix", "follow-up hotfix", Intune deactivated) survive only in part on the current page; they are corroborated by Huntress 11/12, Field Effect update 2 and BleepingComputer.
