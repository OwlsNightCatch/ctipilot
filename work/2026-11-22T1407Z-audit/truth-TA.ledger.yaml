    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "section 2026-10-07T04:52:00Z"
    kind: cited
    text: "The two critical advisories: the public sign-up form accepted account fields it should have ignored, so an attacker without any account could register on an email address they did not own, have that account treated as already confirmed and add it to any organization, then read and reply to other customers' tickets in those organizations, with a second flaw letting a customer change fields of another customer's ticket in the same organization ("
    urls: ["https://github.com/zammad/zammad/security/advisories/GHSA-79wh-8g2f-xj2c"]
  - claim_id: e9813e9565
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "section 2026-10-07T04:52:00Z"
    kind: cited
    text: "); and the email-verification flow established a fully authenticated session for an account that had never completed email verification and had multi-factor authentication configured, without the second factor, which needs possession of the account's verification email but no password and carries the account's permissions up to administrator ("
    urls: ["https://github.com/zammad/zammad/security/advisories/GHSA-f3qr-94c2-7mx2"]
  - claim_id: 26c1877109
