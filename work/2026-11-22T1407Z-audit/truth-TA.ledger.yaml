    text: "Danfoss published CVE ids for two controller flaws: CVE-2026-129713 (CVSS 9.3, unauthenticated stack overflow in AK-SM 8xxA firmware 5.4.0 and earlier, fix only in a coming 5.5.x) and CVE-2026-127057 (CVSS 9.9, documented default credentials on every legacy AK-SC 355 and AK-SM 800, no fix). BSI's version 1.1 warning reports exploitation attempts against two Copeland XWEB EVO flaws."
