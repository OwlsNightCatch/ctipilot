  - claim_id: 33a2b4edb9
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "record 2026-10-04T04:43:00Z"
    kind: record-summary
    text: "CISA added both CVEs to its KEV catalog on 2026-10-02, and Zammad's own statement of 2026-10-01 says the code-execution flaw is exploitable only on 6.5 and older (which receive no security fixes), that 7.0 and later are not affected and 7.2.0 hardens the code, and that it cannot confirm the root-escalation flaw because DIVD gave it no technical details. Zammad also says it first received a report about the code-execution flaw in August 2026, before the exploitation DIVD dates to 2026-09-21."
  - claim_id: 384013f0de
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "record 2026-10-06T04:58:00Z"
    kind: record-summary
    text: "Zammad's own advisory of 2026-10-05 says it now has DIVD's technical details for CVE-2026-102490, assesses it as a local escalation that needs prior access to the server, ties it to a confirmed vulnerability in packager.io and is working on a solution; no fix is named yet. Zammad advises restricting access to the underlying server to trusted administrators."
  - claim_id: 042069433e
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "record 2026-10-07T04:52:00Z"
    kind: record-summary
    text: "Zammad released 7.2.1 on 2026-10-06 with 27 security advisories, two rated critical (a public sign-up path to other customers' tickets and a multi-factor bypass in the email-verification flow), all affecting 7.2.0 and earlier; 7.2.0 is therefore no longer the release to install. None of the advisories carries a CVE id, none is reported exploited, and no source says whether 7.2.1 fixes the exploited root escalation CVE-2026-102490."
  - claim_id: 98d2910bac
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "record 2026-10-08T04:57:05Z"
    kind: record-summary
    text: "Horizon3 published the root cause of CVE-2026-102489 and a working exploit on 2026-10-07: a single unauthenticated WebSocket request makes Zammad return an error carrying every active user's session cookies, and a leaked administrator session writes a mail template through the package installation endpoint that runs code as the zammad user. The exploited flaw now has a public exploit, and Horizon3 says the root escalation remains unpatched."
  - claim_id: 17100191a3
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "record 2026-10-10T03:43:01Z"
    kind: record-summary
    text: "Zammad 7.2.2 (2026-10-08) fixes the local escalation from the zammad account to root that no vendor fix covered before, in DEB and RPM (packager.io) installations only; installations from source and the official container images were never affected. The exploited code-execution flaw and its public exploit are unchanged."
  - claim_id: d5e30a4e37
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "record 2026-10-20T08:40:20Z"
    kind: record-summary
    text: "Zammad shipped 6.5.5 on 2026-10-15, an emergency release for the unsupported 6.5 series that hardens the WebSocket server code against the exploited code-execution flaw CVE-2026-102489; it installs only from a new package repository and does not extend 6.5 support. Zammad still tells every self-hosted installation to upgrade to 7.2.2, and the 6.5.5 notes do not mention the root escalation."
  - claim_id: 75a92707a6
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "record 2026-11-20T05:14:45Z"
    kind: record-summary
    text: "DIVD completed its forensic investigation: the attacker, who used AI agents after reaching root, was mainly after credentials (a GitLab token, a Slack key and shared-mailbox OAuth tokens); about 41,000 ticket titles and a limited set of older conversations left the host, and the first response started 19 hours after the alert. Zammad's release 7.2.3 of 2026-11-11, a critical security update, supersedes 7.2.2 as the build to install."
  - claim_id: e961961e60
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "headline"
    kind: frontmatter
    text: "Danfoss AK-SM 800A: six unpatched pre-auth RCE flaws, Strict mode does not remove them; France blames IRGC"
  - claim_id: 604986e6c6
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "summary"
    kind: frontmatter
    text: "Coopérative U, Intermarché and E. Leclerc confirmed a cyberattack on their refrigeration systems overnight on 11 to 12 October 2026, a remotely forced defrost at hundreds of French stores, and on 2026-11-09 France's foreign ministry attributed that campaign, and only that campaign, to the Iranian unit Shahid Kaveh. More followed: more than 115 stores in at least six more countries and the first German shops on 2026-11-02, altered cold-room settings at three sites of the French blood service through a supplier, and, per SRF on 2026-11-05, a Köniz butcher and three Volg stores in Switzerland. CERT-FR reports numerous compromises of Danfoss AK-SM and AK-SC controllers and of Copeland xweb and Dixell xweb, and NCSC Switzerland rates the activity actively exploited. On 2026-11-11 Midnight Blue reported six pre-authentication remote-code-execution flaws in all Danfoss AK-SM 800A firmware up to 5.3.2, and on 2026-11-20 Danfoss published CVE-2026-129713 (CVSS 9.3, an unauthenticated stack overflow in AK-SM 8xxA firmware 5.4.0 and earlier, fix only in an announced 5.5.x) and CVE-2026-127057 (CVSS 9.9, default credentials on every legacy AK-SC 355 and AK-SM 800, no fix); CCB says updating, new passwords and Strict mode are insufficient, so removing internet exposure comes first, and BACS's statement of 2026-11-10 that updates fix the known flaws predates the report and does not cover the six."
  - claim_id: 77cd5c82bc
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "actions[0]"
    kind: frontmatter
    text: "Find every Danfoss AK-SM and AK-SC, Copeland xweb and Dixell xweb refrigeration controller, and any other refrigeration controller with a remote management interface because not every second-wave site's vendor is confirmed, in facilities you own or that a contractor manages for you and take its management interface off the internet now, restoring access only through a secure VPN or protected network (filtering to the contractor's source addresses is an emergency stop-gap, and CERT-FR asks you to check your insurance conditions before cutting the contractor's data uplink); an end-of-life unit that gets no fixes needs replacing, because a factory reset leaves it vulnerable and probably compromised again."
  - claim_id: 451c50f45d
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "actions[1]"
    kind: frontmatter
    text: "On every such controller that was reachable from the internet, check the whole configuration, defrost ranges, alarm thresholds and notification recipients included, against the intended one, verify the actual temperatures and test that alarms reach staff; for a Danfoss unit that may have been taken over, restart it or otherwise factory-reset it, restore access only through a secure VPN or protected network and reconfigure it for service, then update its firmware, set the security level to Strict and replace the default and any weak passwords, which do not close the six unpatched AK-SM 800A flaws that Midnight Blue and CCB report, so the interface stays off the internet; change all credentials where compromise is suspected and check the devices attached to the controllers, as BSI advises; and on every Copeland or Dixell XWEB unit confirm the factory Admin password was changed and give each contractor a named account with an expiry date."
