claims:
  - claim_id: 9c73b9cecc
    entry: 2026-06-16/obsidian-security-a-three-cve-chain-turns-any-litellm-user-i
    surface: "headline"
    kind: frontmatter
    text: "LiteLLM: CISA lists the guardrail sandbox escape CVE-2026-40217 as exploited; the chain gives root on the AI gateway"
  - claim_id: a87245c212
    entry: 2026-06-16/obsidian-security-a-three-cve-chain-turns-any-litellm-user-i
    surface: "summary"
    kind: frontmatter
    text: "CISA added CVE-2026-40217, the custom-code guardrail sandbox escape in LiteLLM that Obsidian Security chained with CVE-2026-47101 and CVE-2026-47102 into root on the AI gateway, to its Known Exploited Vulnerabilities catalog on 2026-11-18 and describes the exploitation no further. LiteLLM says the flaw needs a proxy-admin credential by default, which the chain's privilege escalation supplies, fixes the chain in v1.83.14-stable and gives a reverse-proxy block for the endpoint."
  - claim_id: 24928ff2f7
    entry: 2026-06-16/obsidian-security-a-three-cve-chain-turns-any-litellm-user-i
    surface: "actions[0]"
    kind: frontmatter
    text: "Pin LiteLLM to v1.83.14-stable or later on every instance and, until it is in, block POST /guardrails/test_custom_code at the reverse proxy or API gateway; on any instance an untrusted user could reach on an older build, rotate every provider API key, the database credentials, any MCP tokens stored in the proxy and the master and salt keys, and audit every Custom Code Guardrail, the litellm_settings.callbacks entries and every proxy_admin holder, because CISA lists CVE-2026-40217 as exploited and the chain reaches those secrets."
