  - claim_id: 98c0331980
    entry: 2026-10-15/cve-2026-76519-cisco-secure-email-gateway-file-write-root
    surface: "body"
    kind: cited
    text: "**Exposure:** a physical or virtual Cisco Secure Email Gateway is exposed when both conditions hold: the File Reputation service is enabled and assigned to a mail policy (web interface, Mail Policies, Incoming or Outgoing Mail Policies, Advanced Malware Protection, \"Enable File Reputation\" ticked), and the Content Scanner Tools version, shown by the `contentscannerstatus` command, is earlier than 25.3.0.5525; Secure Email and Web Manager and Secure Web Appliance are not affected, and Cisco Secure Email Cloud Gateway customers need take no action ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-esa-afw-zqYJkjxp"]
  - claim_id: 8d0869afca
    entry: 2026-10-15/cve-2026-76519-cisco-secure-email-gateway-file-write-root
    surface: "body"
    kind: cited
    text: "The attack arrives as an email attachment passing through the appliance, so exposure does not depend on its management interface being reachable ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-esa-afw-zqYJkjxp"]
  - claim_id: 1ad6ef3557
    entry: 2026-10-15/cve-2026-76519-cisco-secure-email-gateway-file-write-root
    surface: "body"
    kind: cited
    text: "**Detection:** start with the appliance's own logs: Cisco's self-check is `grep \"System Security\" system_logs` on each cluster member, which returns \"Suspected compromise indicator was found\", \"Security scan did not complete\" or \"No compromise indicator was found\" ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-esa-afw-zqYJkjxp"]
