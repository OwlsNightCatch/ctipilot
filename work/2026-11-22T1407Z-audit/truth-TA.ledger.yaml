    surface: "section 2026-11-20T05:14:45Z"
    kind: cited
    text: "Separately, Zammad released 7.2.3 on 2026-11-11 as a critical security update that addresses several vulnerabilities, so 7.2.2 is no longer the build to install, and it requires an nginx or Apache2 configuration change that clears the Remote-User header next to X-Forwarded-User, which the Docker images apply automatically ("
