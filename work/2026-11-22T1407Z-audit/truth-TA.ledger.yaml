    kind: cited
    text: "Server-side, Huntress points to guest-originated file-run events (RanFiles, EventType 85, or SentFiles, 86) in App_Data\\Session.db, read from a copy, that overlap an open host connection; on workstations it points to the ScreenConnect client running batch or script files from its Temp folder, and to any client whose command line names a relay the organisation does not own ("
    urls: ["https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation"]
  - claim_id: 33e0a7c508
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "record 2026-11-17T04:35:15Z"
    kind: record-summary
    text: "Huntress confirmed exploitation of CVE-2026-84869 against MSP technicians: on 2026-11-12 a guest-pushed batch file ran on a technician's client with no prompt and installed a rogue ScreenConnect client within about nine seconds, while attacker guests were making 688,000 run-file requests on 42 MSP servers between 2026-10-20 and 2026-11-16. Updating the server does not fix it; every technician host client must be on 26.6.5 or later."
