  - claim_id: 2b91c98d26
    entry: 2026-06-16/obsidian-security-a-three-cve-chain-turns-any-litellm-user-i
    surface: "record 2026-11-19T05:04:59Z"
    kind: record-summary
    text: "CISA added the LiteLLM guardrail sandbox escape CVE-2026-40217, the last step of Obsidian Security's chain, to its Known Exploited Vulnerabilities catalog on 2026-11-18; LiteLLM's own advisory now supplies the description, the proxy-admin prerequisite, the CVSS 4.0 5.9 score and the endpoint block."
  - claim_id: 08080c17e7
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "headline"
    kind: frontmatter
    text: "ConnectWise patches a ScreenConnect flaw Huntress had already watched turn every infected connection into the next one's launch point"
  - claim_id: e75c607cce
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "summary"
    kind: frontmatter
    text: "CVE-2026-84869 (CVSS 9.9) lets file-transfer actions inside an already-active ConnectWise ScreenConnect remote session run without the authorization or Host-confirmation step the product is meant to require. Huntress documented exploitation from 20 August 2026, over two weeks before ConnectWise's 8 September patch (26.6.5), in which a modified ScreenConnect client automatically pushes the same infection chain to every newly connected Host session, giving the bug a worm-like spread across an MSP's or IT department's own remote-support connections."
  - claim_id: f30f67cb82
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "actions[0]"
    kind: frontmatter
    text: "Update every ScreenConnect technician host client and Access agent to 26.6.5 or later now, not only the server, because the vulnerable code runs on the technician's machine; where that waits, remove the TransferFiles permission from every role and session group (Administration > Security > Roles)."
  - claim_id: b4b4257ffc
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "actions[1]"
    kind: frontmatter
    text: "Treat any pre-26.6.5 client that shows a second, unfamiliar RMM tool or an unexplained ScreenConnect connection ID as compromised and reimage it rather than patching in place, because a technician's session can already have propagated the infection to every host that client connected to."
  - claim_id: 2f1179ef31
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "actions[2]"
    kind: frontmatter
    text: "On every ScreenConnect server, read a copy of App_Data\\\\Session.db for guest-originated RanFiles or SentFiles events that overlap an open host connection, and on any hit isolate the technician's workstation and rotate every credential reachable from it (RMM, PSA, vault, customer admin accounts), because Huntress saw one workstation fully compromised nine seconds after its client ran a guest-pushed file."
  - claim_id: 2c8ef32ad4
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "cves[CVE-2026-84869]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-84869\", \"cvss\": \"9.9\", \"status\": [\"exploited\", \"cisa-kev\", \"patch-available\"], \"affected\": \"ScreenConnect client versions prior to 26.6.5\", \"fixed\": \"26.6.5\", \"auth\": \"post-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 078df8b95e
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "body"
    kind: cited
    text: "ConnectWise's own disclosure describes a client-side condition in ScreenConnect Support and Access sessions where file-transfer actions could be processed through an active remote session \"without proper authorization or Host confirmation,\" letting files be transferred to and executed on the Host system, including through elevated execution paths ("
    urls: ["https://github.com/ConnectWise-Advisories/Disclosures/tree/main/CVE-2026-84869"]
  - claim_id: 7a8cc679e6
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "body"
    kind: cited
    text: "Depending on the profile, the final PowerShell stage installs a ScreenConnect backdoor client concealed as a hidden Windows service (its registry Uninstall entry removed and a restrictive service security descriptor applied), builds a UAC-bypass helper via a hijacked `ms-settings:` protocol handler routed through `ComputerDefaults.exe`, sets `AmsiUtils.amsiInitFailed = true` to blind AMSI, adds all of `C:\\Users` as a Defender exclusion, and disables Defender reporting, notifications and Hypervisor-Protected Code Integrity; the package also drops a vulnerable WinRing0 kernel driver alongside the payload ("
    urls: ["https://www.huntress.com/blog/rogue-screenconnect-installations"]
  - claim_id: eac01247ef
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "body"
    kind: cited
    text: "A technician's ScreenConnect client that has been infected this way silently re-infects every subsequent host it connects to, independent of the original social-engineering vector ("
    urls: ["https://www.huntress.com/blog/rogue-screenconnect-installations"]
  - claim_id: 7deccc6ce1
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "body"
    kind: cited
    text: "No named threat-actor cluster is attributed by any source; CISA added the CVE to its Known Exploited Vulnerabilities catalog on 2026-09-11 ("
    urls: ["https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: d1a361a198
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "body"
    kind: cited
    text: "**Exposure:** every ScreenConnect host client and Access agent before 26.6.5, whatever the server version, because the vulnerable code runs on the technician's machine; the server's connection history records which client version each technician used ("
    urls: ["https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation"]
  - claim_id: e26cfa32ab
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "body"
    kind: cited
    text: "**Detection:** on the server, guest-originated file-run events (RanFiles, SentFiles) in App_Data\\Session.db that overlap an open host connection; on technician workstations, the ScreenConnect client starting cmd, PowerShell or script hosts from its Temp folder, msiexec unpacking an MSI into a user-profile folder, and outbound relay connections to domains you do not own, often on port 8041 ("
    urls: ["https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation"]
  - claim_id: d48ebb8a72
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "body"
    kind: uncited
    text: "ScreenConnect servers are not affected, only client versions before 26.6.5, the release that fixes CVE-2026-84869 (CVSS 9.9)."
  - claim_id: 3491a80055
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "body"
    kind: uncited
    text: "Huntress had been tracking the exploitation since 20 August, more than two weeks before ConnectWise's 8 September disclosure."
  - claim_id: 5d8943aba8
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "body"
    kind: uncited
    text: "Starting 20 August 2026, its SOC found rogue ScreenConnect clients deployed via social engineering (a fake tech-support Quick Assist session in one case, a phishing-driven MSI in another) that immediately spawned four chained VBScript stagers via `wscript.exe`."
  - claim_id: 1f46a8054b
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "body"
    kind: uncited
    text: "The stagers profile the host (existing ScreenConnect install, installed security-product names, available RAM to rule out a sandbox), then pull an AES-encrypted payload bundle keyed to that profile from Dropbox."
  - claim_id: 6ddc069a14
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "body"
    kind: uncited
    text: "The installed backdoor client is what turns the bug into a worm: it continuously inspects ScreenConnect's own connection-status collection for newly established Host sessions and, on each new connection, packages the same four VBScript stagers into a ScreenConnect file-transfer message flagged to auto-run, the exact abuse path CVE-2026-84869 patches."
  - claim_id: ec900961c3
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "body"
    kind: derived
    text: "A client that ran such a file needs a compromise check, because patching does not remove a rogue client that is already installed."
  - claim_id: 122f067de2
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** any MSP-managed or self-hosted ScreenConnect deployment, including the IT-service-provider chain that reaches public-sector customers, should patch to 26.6.5 immediately and treat every pre-patch client as a potential re-infection vector, not just the host that was originally targeted."
  - claim_id: 0fa454cf0d
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "body"
    kind: derived
    text: "**Triage:** a benign ScreenConnect file-transfer message is initiated by a human technician against a session they are actively working; the worm's signature is a file-transfer action auto-queued the moment a new Host connection appears, with no corresponding operator action, immediately followed by `wscript.exe` spawning multiple child `.vbs` processes."
  - claim_id: 886d435a03
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "section 2026-11-17T04:35:15Z"
    kind: cited
    text: "Huntress confirmed exploitation of CVE-2026-84869 against MSP technicians in a campaign it separates from the crypto-exchange-named decoy sessions it reported on 2026-11-13, and it describes the SCKit malware as appearing to leverage a vulnerable server-side extension, not to exploit this flaw directly ("
    urls: ["https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation"]
  - claim_id: 8c3f040235
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "section 2026-11-17T04:35:15Z"
    kind: cited
    text: "On 2026-11-12 a technician at one MSP joined a blank-named Access session on the MSP's server and the host client ran a batch file the guest had pushed, with no prompt; within about nine seconds a hidden PowerShell relaunch, a curl download and an administrative-image unpack of an MSI ended with a rebranded ScreenConnect client connected to an attacker relay on port 8041 ("
    urls: ["https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation"]
  - claim_id: 2e99051948
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "section 2026-11-17T04:35:15Z"
    kind: cited
    text: "Huntress read the delivery side from server databases: between 2026-10-20 and 2026-11-16 attacker guests made 688,000 run-file requests for update.bat-style files from 29 source addresses on 42 MSP servers, repeating them in case a technician joined, and Huntress assesses with high confidence that the spray operator and the relay operator are the same ("
    urls: ["https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation"]
  - claim_id: 1ed246de05
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "section 2026-11-17T04:35:15Z"
    kind: cited
    text: "In October an attacker also joined three real customer support sessions as an extra guest and asked the technician's client to run a path-traversal file into the Startup folder; two of the three technicians were on vulnerable Windows clients and the Mac client failed ("
    urls: ["https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation"]
  - claim_id: 5feaf64aad
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "section 2026-11-17T04:35:15Z"
    kind: cited
    text: "The vulnerable code runs on the technician's machine, so updating the server alone does not close it, and Huntress saw many technicians on 22.x, 24.2 and 25.8 clients weeks after 26.6.5 shipped ("
    urls: ["https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation"]
