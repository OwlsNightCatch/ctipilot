    entry: 2026-10-15/cve-2026-76519-cisco-secure-email-gateway-file-write-root
    surface: "body"
    kind: cited
    text: "Cisco warns that an attacker with root may remove or hide evidence, so it also recommends cross-checking network and firewall logs outside the device for unexpected uploads from the appliance to external addresses or downloads from malicious addresses ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-esa-afw-zqYJkjxp"]
