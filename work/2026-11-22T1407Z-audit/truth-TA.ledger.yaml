    surface: "section 2026-10-07T04:52:00Z"
    kind: cited
    text: "Among the high-rated advisories are a remote code execution through a template sanitizer bypass in automation configuration, a session identifier disclosed in an authenticated configuration response that enabled off-host session takeover, and a second-order SQL injection in ticket overview sorting ("
