    surface: "section 2026-11-20T05:14:45Z"
    kind: cited
    text: "The credential material it touched was a GitLab personal access token that could not reach the internal GitLab, a Slack API key without read permission and the OAuth tokens of two shared mailboxes, used to send test emails with no mailbox-content compromise observed; only the host carrying Zammad was compromised at root level, and because direct outbound traffic from it was impossible the extraction from the ticket system was selective, about 41,000 ticket titles and a limited set of older conversations ("
