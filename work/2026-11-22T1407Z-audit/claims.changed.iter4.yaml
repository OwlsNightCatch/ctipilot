  - claim_id: d1e3470389
    entry: 2026-11-20/vmware-vcenter-cve-2026-123890-auth-bypass-exploited-gtig
    surface: "body"
    kind: cited
    text: "**Detection:** SSH switched on and then off again through the appliance management API, a new local or SSO administrator, Directory Service database pulls over its RPC interface, and reads of the master key and the PostgreSQL credential file over SSH; in network telemetry, sweeps of ports 2012, 5480 and 9080 from a Linux appliance that is not a management host; on ESXi, logins as vpxuser or root, a new authorized_keys entry and a hidden directory on a VMFS volume ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/armory-castle-exploits-vsphere/"]
  - claim_id: 8d101a894f
    entry: 2026-11-20/vmware-vcenter-cve-2026-123890-auth-bypass-exploited-gtig
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** treat the update as an emergency change and plan around vCenter 7.0, which has no public fix; meanwhile GTIG's hardening guidance drops inbound TCP 2012 from non-allowlisted addresses, tested first because the port carries SSO traffic ("
