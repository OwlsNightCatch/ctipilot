  - claim_id: 144ce71ae1
    entry: 2026-10-22/cve-2026-76466-cisco-expressway-cluster-unauth-root-rce
    surface: "body"
    kind: cited
    text: "Cisco's advisory of 2026-10-21 fixes CVE-2026-76466 (CVSS 3.1 9.8) in the database service of Expressway-C and Expressway-E: an unauthenticated remote attacker who holds persistent cookies can run operating-system commands as root, because of the use of persistent cookies, and because client certificates are not validated when TLS Verify Mode is enabled for clustering; Cisco does not say how an attacker obtains the cookies ("
