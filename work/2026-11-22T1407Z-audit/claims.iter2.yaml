    surface: "summary"
    kind: frontmatter
    text: "The PHP project released 8.5.13, 8.4.28, 8.3.37, 8.2.36 and 8.6.0 on 2026-11-19 with fixes for up to 18 CVEs per branch. The most direct is CVE-2026-129289: PHP-FPM keeps unread php://input bytes on a persistent FastCGI connection, so an unauthenticated multipart request can plant a second FastCGI request and run PHP code as the worker, but only behind a front end that reuses FastCGI connections, which standard nginx and Apache setups do not. The release also fixes CVE-2026-115560, left open in October, and follow-ups to the incomplete fix for the exploited PHP2Shell flaw CVE-2026-109619; no source reports exploitation of this release's CVEs or a public proof of concept."
