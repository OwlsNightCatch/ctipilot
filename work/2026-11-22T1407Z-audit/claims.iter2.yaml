    text: "); Entra and Okta sign-in, which the sprays target ("
    urls: ["https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"]
  - claim_id: 3e4cb8a63a
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "); and any Okta org with self-service registration enabled, where not using ConnectWise does not exclude exposure ("
    urls: ["https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/"]
  - claim_id: 37d7bf18b2
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "**Detection:** in every identity provider's authentication logs, bursts of failed logons and lockouts spread over many accounts; in the Okta system log, newly self-registered accounts that enrol Okta Verify and start single sign-on within minutes; and in the Entra audit log, credentials or certificates added to applications that nobody on your team created and any application that assigns itself a directory role ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/", "https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/"]
  - claim_id: a8b75c9ffb
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "In web access logs, Wiz points to source-map and OpenAPI downloads followed minutes later by calls to internal routes found only in those files, and in sign-in telemetry to a new user agent per burst at a one-second cadence ("
    urls: ["https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"]
  - claim_id: 3bfeb9afda
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** Expel's reading is that the framework adds speed, not a new vulnerability, so the levers are identity controls: least privilege on multi-tenant application permissions and consent grants, alerting on credential additions and privileged role assignments by applications, and a review of self-registered Okta accounts since 2026-10-13 ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/", "https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/"]
  - claim_id: 8c3d55485c
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-22T15:01:12Z"
    kind: cited
    text: "Who is exposed, by source: Microsoft ties ARTEX's speed-up to Microsoft 365 tenants whose applications already hold access ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/"]
  - claim_id: 498dc6e0e6
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-22T15:01:12Z"
    kind: cited
    text: "); Wiz saw the sprays go after Entra and Okta sign-in, hitting hundreds of users, mainly software engineers ("
    urls: ["https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"]
  - claim_id: 165414484a
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-22T15:01:12Z"
    kind: cited
    text: "); and Expel's case needed only Okta self-service registration, so not using ConnectWise does not exclude exposure ("
    urls: ["https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/"]
  - claim_id: 0bd305ccdd
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "record 2026-11-22T15:01:12Z"
    kind: record-summary
    text: "Exposure by source: Microsoft ties ARTEX's speed-up to Microsoft 365 tenants whose applications already hold access, Wiz saw the sprays hit Entra and Okta sign-in, and Expel's case needed only Okta self-service registration."
