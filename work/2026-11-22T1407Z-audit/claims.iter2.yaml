    surface: "body"
    kind: cited
    text: "An aggregator attributes the credential-stuffing label to the BSI, which neither heise nor Handelsblatt does ("
    urls: ["https://www.ad-hoc-news.de/wissenschaft/bundid-nach-angriffswelle-passwort-login-jetzt-nur-noch-mit-e-mail-code/70522344"]
