  - claim_id: 2843aa42af
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "Microsoft Threat Intelligence reports that as early as September 2026 Storm-0940, a China-state aligned actor active since 2021, used the agentic penetration-testing framework ARTEX to automate attacks on hundreds of organizations across many industries, government and military among them; ARTEX is an open-source multi-agent LLM system that runs a penetration test from reconnaissance to exfiltration with little human involvement ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/"]
  - claim_id: 6173e69dcc
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "Microsoft says ARTEX accelerated the abuse of compromised applications already granted access to Microsoft 365 tenants, and most targeting failed, yet several cases went from first targeting to privileged cloud access in under three hours ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/"]
  - claim_id: 50f3923e5e
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "Expel saw Storm-0940 infrastructure scan a customer and, from 2026-10-13, abuse its Okta self-service registration with no ConnectWise application involved: the attacker created five accounts of its own, enrolled Okta Verify on three of them about a minute after activation and ran a password spray that Okta ThreatInsight blocked ("
    urls: ["https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/"]
  - claim_id: de2abe4719
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "Expel says the shared source address is its only link to Storm-0940, and the activity alone does not prove ARTEX was used ("
    urls: ["https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/"]
  - claim_id: 34c0078340
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "CrowdStrike saw another actor use ARTEX against South Korean financial institutions from late September; Recorded Future tracks it as TAG-217 ("
    urls: ["https://www.crowdstrike.com/en-us/blog/unknown-threat-actor-uses-artex-to-target-south-korean-finance/", "https://www.recordedfuture.com/blog/tag-217-artex-south-korean-banks"]
  - claim_id: 84977e4dd3
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "Wiz independently tracked an actor using ARTEX-associated tooling, overlapping with Storm-0940, against IT and software vendors throughout October 2026, focused on identity providers and Microsoft 365 integrations; most attempts failed and none of the techniques is novel ("
    urls: ["https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"]
  - claim_id: 572599be31
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "It also saw fabricated OAuth authorization codes, unsigned JWTs against over 60 SSO routes, Cognito account-recovery calls and password sprays against Entra and Okta in bursts of 20 to 60 minutes ("
    urls: ["https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"]
  - claim_id: d28d3dff91
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "**Exposure:** Microsoft 365 tenants with applications already granted access, whose abuse ARTEX sped up ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/"]
  - claim_id: 6bc2bb6c95
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
