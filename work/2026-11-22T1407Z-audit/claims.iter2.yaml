    kind: cited
    text: "Cisco gives two causes for CVE-2026-76466: the use of persistent cookies and, separately, client certificates that are not validated when TLS Verify Mode is enabled for clustering; it does not say that clustering is what uses the persistent cookies ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-vcs-static-cred-hr7EWZ8t"]
