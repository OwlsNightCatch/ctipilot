    surface: "body"
    kind: cited
    text: "), a flaw CISA has listed as exploited since 2026-10-27 ("
    urls: ["https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: df56ce259c
