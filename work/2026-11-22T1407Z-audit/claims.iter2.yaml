    text: "Socket and SafeDep report that versions 1.26.1 and 1.26.2 of Microsoft's official agent-framework metapackage were published to PyPI on 2026-11-17, about 33 minutes apart, with a .pth file that runs a credential stealer whenever Python starts, so a pip install in a CI job is enough. It collects environment secrets and credential files and requests Azure managed-identity, Azure DevOps and, in 1.26.2, GitHub Actions OIDC tokens. Both versions were removed from PyPI and 1.26.0 is the last clean release; a second maintainer account created on the day of the attack can still publish agent-framework and five sibling projects, four of which 1.26.0 installs, and how it got access is not known."
  - claim_id: 1543680186
