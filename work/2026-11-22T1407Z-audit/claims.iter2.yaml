    surface: "actions[0]"
    kind: frontmatter
    text: "Search lockfiles, requirements files and CI install logs for agent-framework 1.26.1 or 1.26.2 installed since 2026-11-17 20:35 UTC, and on every host or job that ran Python after installing either, treat the environment variables, local credential files, Azure managed-identity and Azure DevOps tokens and, for 1.26.2, GitHub Actions OIDC tokens as stolen and rotate them, then lock the whole dependency tree with hashes at agent-framework 1.26.0 and hold new releases of agent-framework-openai, -purview, -redis, -tools and -postgres, because the maintainer account created on the day of the attack can still publish those siblings and 1.26.0 accepts any release of four of them below 2.0."
