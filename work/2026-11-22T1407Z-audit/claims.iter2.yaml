  - claim_id: be8809e468
    entry: 2026-11-17/bundid-automated-mass-logins-lock-federal-citizen-accounts
    surface: "summary"
    kind: frontmatter
    text: "On 2026-11-16 Germany's BSI confirmed automated, mass login attempts against BundID, the federal citizen account for online administrative services: failed attempts locked accounts and triggered password-reset mails, and the federal government switched off username-and-password sign-in that morning, then restored it the same afternoon with a mandatory security code by e-mail at every password sign-in, while eID and Elster sign-in stayed open. The BSI has no indication that any account was compromised; Handelsblatt, citing government circles, calls it credential stuffing."
  - claim_id: abee6fa42d
    entry: 2026-11-17/bundid-automated-mass-logins-lock-federal-citizen-accounts
    surface: "body"
    kind: cited
    text: "That afternoon the BundID site notice said two-factor authentication had been switched on for all accounts, with a security code by e-mail at every sign-in by username and password ("
    urls: ["https://www.spiegel.de/netzwelt/web/bundid-hacker-attackieren-konten-zweifaktor-authentifizierung-aktiviert-a-305b6f61-70ac-4a83-8b2c-62c4d98d13c4"]
  - claim_id: a38333b8c5
