    urls: ["https://www.synology.com/en-global/support/security/Synology_SA_26_21"]
  - claim_id: b7c925ca64
    entry: 2026-11-22/synology-dsm-oauth-api-cve-2026-120382-unauth-file-write
    surface: "body"
    kind: cited
    text: "DSM 7.4 is fixed in 7.4.1-90080-2 and DSM 7.3 in 7.3.2-86009-6; DSM 7.2.2, 7.2.1, 7.1 and BeeStation OS 1.5 are marked OnGoing, with an upgrade to 7.3.2-86009-6 recommended for the 7.2 lines, while APM, DSM Enterprise and SRM are not affected ("
    urls: ["https://www.synology.com/en-global/support/security/Synology_SA_26_21"]
  - claim_id: 3ed9aac859
    entry: 2026-11-22/synology-dsm-oauth-api-cve-2026-120382-unauth-file-write
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** update DSM 7.4 and 7.3 now; where no fix exists, deactivate the OAuth Service package as Synology's mitigation, and for 7.2.x plan the move to 7.3.2-86009-6 ("
    urls: ["https://www.synology.com/en-global/support/security/Synology_SA_26_21"]
  - claim_id: 27ce32f6d0
    entry: 2026-11-22/synology-dsm-oauth-api-cve-2026-120382-unauth-file-write
    surface: "body"
    kind: uncited
    text: "The advisory does not mention exploitation."
  - claim_id: afb6ed9391
    entry: 2026-11-22/synology-dsm-oauth-api-cve-2026-120382-unauth-file-write
    surface: "body"
    kind: uncited
    text: "An unauthenticated file write on a network storage appliance warrants action before the regular cycle, because it reaches the data the NAS holds without credentials."
  - claim_id: ce8c1cdbc7
    entry: 2026-11-22/synology-dsm-oauth-api-cve-2026-120382-unauth-file-write
    surface: "body"
    kind: derived
    text: "**Exposure:** a NAS on DSM 7.4 below 7.4.1-90080-2, DSM 7.3 below 7.3.2-86009-6, any DSM 7.2.2, 7.2.1 or 7.1, or BeeStation OS 1.5 whose DSM interface untrusted hosts can reach; the running version is shown in the DSM control panel."
  - claim_id: 48966a49b3
    entry: 2026-11-22/synology-dsm-oauth-api-cve-2026-120382-unauth-file-write
    surface: "body"
    kind: derived
    text: "**Detection:** in DSM web and reverse-proxy logs, requests to the OAuth API from addresses that do not normally use it, and file changes on the NAS outside administrator activity, which follow from the mechanism; Synology names no indicators."
  - claim_id: 2efc7c3738
    entry: 2026-11-22/timeroasting-detection-ms-sntp-own-rid-check-huntress
    surface: "headline"
    kind: frontmatter
    text: "Timeroasting leaves no logon event; Huntress shows the signal that holds is a host requesting another account's RID"
  - claim_id: d0963adfb8
    entry: 2026-11-22/timeroasting-detection-ms-sntp-own-rid-check-huntress
    surface: "summary"
    kind: frontmatter
    text: "Huntress reverse-engineered the MS-SNTP signing code on a patched Windows Server 2025 domain controller and reports that timeroasting, an unauthenticated UDP/123 request that makes a domain controller return a password-derived MAC for any computer or trust account, produces no authentication event for the targeted accounts and raised no Defender for Identity alert across eleven test runs. Modern Windows clients send a 120-byte extended authenticator that public tools could not crack; Huntress published a reference cracker and a hashcat module for it. Packet size is not a usable signal: the check that holds is a source host requesting a RID other than its own computer account, with volume as the fallback."
  - claim_id: d577a7feed
    entry: 2026-11-22/timeroasting-detection-ms-sntp-own-rid-check-huntress
    surface: "body"
    kind: cited
    text: "Timeroasting abuses MS-SNTP, Microsoft's authentication extension to NTP: a client names an account by its RID, and the domain controller answers with a MAC computed with that account's password-derived key, without the client authenticating first; the reachable accounts are computer and trust accounts, and the MAC is then cracked offline with no further contact and no lockout ("
    urls: ["https://www.huntress.com/blog/detecting-timeroasting"]
  - claim_id: 3aa678ea99
    entry: 2026-11-22/timeroasting-detection-ms-sntp-own-rid-check-huntress
    surface: "body"
    kind: cited
    text: "Huntress names the crackable population as image-built or never-rotated machines, hand-set trusts and non-Windows joins, and says a pre-created account still on its lowercase-name default falls instantly while a normal random machine secret would not ("
    urls: ["https://www.huntress.com/blog/detecting-timeroasting"]
  - claim_id: 75e3342059
    entry: 2026-11-22/timeroasting-detection-ms-sntp-own-rid-check-huntress
    surface: "body"
    kind: cited
    text: "Reading w32time.dll and netlogon.dll on a fully patched Windows Server 2025 domain controller, Huntress documents two authenticator forms: a 68-byte legacy form with an MD5 MAC, which public tools emit and hashcat cracks, and a 120-byte extended form using HMAC-SHA512, which modern Windows clients send by default and which had no public cracker ("
    urls: ["https://www.huntress.com/blog/detecting-timeroasting"]
  - claim_id: 5932739b2d
    entry: 2026-11-22/timeroasting-detection-ms-sntp-own-rid-check-huntress
    surface: "body"
    kind: cited
    text: "The patched controller answered extended-form requests that asked for the previous key, and Huntress published a reference implementation and a hashcat module for it that awaits a mode number upstream, so an extended-form capture can no longer be read as uncrackable ("
    urls: ["https://www.huntress.com/blog/detecting-timeroasting"]
  - claim_id: c7022ce699
    entry: 2026-11-22/timeroasting-detection-ms-sntp-own-rid-check-huntress
    surface: "body"
    kind: cited
    text: "Across eleven runs over five hours, with the sensor confirmed live by a control DCSync, Defender for Identity raised no alert on the MS-SNTP traffic; its \"Suspicious SAM Account Name Change\" alert, which names timeroasting, fires on a sAMAccountName change (event 5136), the fingerprint of the targeted variant, not of the unauthenticated sweep ("
    urls: ["https://www.huntress.com/blog/detecting-timeroasting"]
  - claim_id: da02e18272
    entry: 2026-11-22/timeroasting-detection-ms-sntp-own-rid-check-huntress
    surface: "body"
    kind: cited
    text: "**Exposure:** Windows domain controllers, which answer MS-SNTP for computer and trust accounts (Huntress tested one patched Windows Server 2025 controller, and Samba AD controllers do not implement the extended form); the accounts at risk are those whose secret is weak, hand-set or never rotated ("
    urls: ["https://www.huntress.com/blog/detecting-timeroasting"]
  - claim_id: 3ecd3fa90e
    entry: 2026-11-22/timeroasting-detection-ms-sntp-own-rid-check-huntress
    surface: "body"
    kind: cited
    text: "On the domain controller, Windows Filtering Platform audit event 5156 records w32time accepting the UDP/123 connection when that subcategory is enabled; on any other host, a process other than the time service sending UDP/123 to a domain controller is a high-signal EDR hit ("
    urls: ["https://www.huntress.com/blog/detecting-timeroasting"]
  - claim_id: f18a46d7a8
    entry: 2026-11-22/timeroasting-detection-ms-sntp-own-rid-check-huntress
    surface: "body"
    kind: cited
    text: "The rule that holds for both forms and even a single packet resolves the source address to its computer account and flags a request for any other RID; a source asking for many RIDs in a short window is the weaker volumetric fallback ("
    urls: ["https://www.huntress.com/blog/detecting-timeroasting"]
  - claim_id: 2bed7882fd
    entry: 2026-11-22/timeroasting-detection-ms-sntp-own-rid-check-huntress
    surface: "body"
    kind: cited
    text: "**Triage:** packet size separates nothing on a modern fleet, where members send the 120-byte form as normal time sync and the public tools emit 68 bytes; domain controllers can legitimately request a trust account's RID during hierarchy synchronization, so they need an allowlist ("
    urls: ["https://www.huntress.com/blog/detecting-timeroasting"]
  - claim_id: 66b5a1cf9e
    entry: 2026-11-22/timeroasting-detection-ms-sntp-own-rid-check-huntress
    surface: "body"
    kind: cited
    text: "A machine account that authenticates and then sprays shares is delegation abuse, not timeroasting ("
    urls: ["https://www.huntress.com/blog/detecting-timeroasting"]
  - claim_id: 21a4045df4
    entry: 2026-11-22/timeroasting-detection-ms-sntp-own-rid-check-huntress
    surface: "body"
    kind: derived
    text: "**Detection:** network and host telemetry, not authentication logs: the targeted accounts generate no 4768, 4769, 4624 or 4776 events."
  - claim_id: edf112b59c
    entry: 2026-11-22/timeroasting-detection-ms-sntp-own-rid-check-huntress
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** do not treat Defender for Identity or authentication analytics as coverage; collect UDP/123 telemetry from domain controllers and build the own-RID check, and reset pre-created, image-built and hand-set computer and trust account secrets, since those are the ones a sweep can crack."
