    kind: cited
    text: "Oracle's matrices carry no exploitation flag of their own, and its interim relief is blocking the network protocols an attack requires or, for attacks that need certain privileges or package access, removing those; patches exist only for versions under Premier or Extended Support, and Oracle says earlier versions are likely affected too ("
    urls: ["https://www.oracle.com/security-alerts/cspunov2026.html"]
  - claim_id: 8410a841cd
