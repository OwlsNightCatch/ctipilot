  - claim_id: c7320ccdb7
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "headline"
    kind: frontmatter
    text: "ScreenConnect clients before 26.6.5 run guest-pushed files unprompted; Huntress confirms exploitation against MSPs"
  - claim_id: 4d1d201113
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "summary"
    kind: frontmatter
    text: "CVE-2026-84869 (CVSS 9.9) lets file-transfer actions inside an already-active ConnectWise ScreenConnect remote session run without the authorization or Host-confirmation step the product is meant to require; ConnectWise fixed it in 26.6.5 on 8 September. Huntress has confirmed exploitation against MSP technicians since October 2026, with attacker guests spraying run-file requests across 42 MSP servers. Earlier, from 20 August, Huntress saw rogue ScreenConnect clients that push their infection chain as an auto-run file transfer on every new connection, behaviour that matches the flaw, though Huntress does not tie those incidents to the CVE."
  - claim_id: 70955c60a0
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "actions[1]"
    kind: frontmatter
    text: "Treat any pre-26.6.5 client that shows a second, unfamiliar RMM tool or an unexplained ScreenConnect connection ID as compromised and reimage it rather than patching in place, because every Host that joined a session with an infected client can have received and run the same infection chain."
  - claim_id: 860ad80629
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "body"
    kind: cited
    text: "The installed backdoor client gives the infection a worm-like spread: it continuously inspects ScreenConnect's own connection-status collection for newly established Host sessions and, on each new connection, packages the same four VBScript stagers into a ScreenConnect file-transfer message flagged to auto-run, so connecting to an infected client can make the server-side Host system receive and run the same chain, independent of the original social-engineering vector ("
    urls: ["https://www.huntress.com/blog/rogue-screenconnect-installations"]
  - claim_id: 477f718323
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "body"
    kind: cited
    text: "That matches the unauthorized file transfer ConnectWise later patched, but Huntress's post notes the patch without tying the August incidents to CVE-2026-84869 ("
    urls: ["https://www.huntress.com/blog/rogue-screenconnect-installations"]
  - claim_id: 740582a8b5
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "body"
    kind: uncited
    text: "Starting 20 August 2026, before ConnectWise's disclosure, Huntress's SOC found rogue ScreenConnect clients deployed via social engineering (a fake tech-support Quick Assist session in one case, a phishing-driven MSI in another) that immediately spawned four chained VBScript stagers via `wscript.exe`."
  - claim_id: 17b587f5f2
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "section 2026-11-22T14:50:39Z"
    kind: cited
    text: "Huntress's post on the August incidents describes rogue ScreenConnect clients that push their infection chain to every Host that connects to them, and its 8 September update notes ConnectWise's patch without tying those incidents to the CVE ("
    urls: ["https://www.huntress.com/blog/rogue-screenconnect-installations"]
  - claim_id: 5374af9fc8
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "section 2026-11-22T14:50:39Z"
    kind: cited
    text: "); the exploitation Huntress confirms runs from October ("
    urls: ["https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation"]
  - claim_id: 50da95e4f5
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "section 2026-11-22T14:50:39Z"
    kind: uncited
    text: "The entry said Huntress traced exploitation of CVE-2026-84869 back to 20 August."
  - claim_id: 6f7e6c56d0
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "section 2026-11-22T14:50:39Z"
    kind: uncited
    text: "The entry also had the spread running from an infected client to the hosts it connects to; Huntress describes the Host side of a session with an infected client receiving and running the chain."
  - claim_id: a9a2ebdcd9
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "record 2026-11-22T14:50:39Z"
    kind: record-summary
    text: "Huntress does not tie its 20 August rogue-client incidents to CVE-2026-84869; the exploitation of the flaw it confirms runs from October 2026. The worm-like spread runs from an infected client to every Host that joins a session with it, not the other way round."
