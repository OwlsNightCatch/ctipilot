    text: "Synology's advisory Synology-SA-26:21 (2026-11-19, revised 2026-11-20) fixes CVE-2026-120382, an argument-injection flaw in the OAuth API of DiskStation Manager that lets remote attackers read or write arbitrary files and cause denial of service, scored CVSS 3.1 9.8 with no privileges or user interaction required. DSM 7.4 and 7.3 are fixed in 7.4.1-90080-2 and 7.3.2-86009-6; DSM 7.2.2, 7.2.1, 7.1 and BeeStation OS 1.5 have no fix yet, and Synology's mitigation is to deactivate the OAuth Service package. No source reports exploitation."
