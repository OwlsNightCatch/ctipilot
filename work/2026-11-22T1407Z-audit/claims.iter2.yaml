    text: "Contradiction on the exploited mechanism: Google Threat Intelligence Group reports that an actor exploited \"a user ID rebind vulnerability in the /key/regenerate endpoint (CVE-2026-40217) to elevate standard Virtual Keys into full PROXY\\_ADMIN master administrative credentials\" against a victim's LiteLLM gateway ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models"]
  - claim_id: 5c748d4208
    entry: 2026-06-16/obsidian-security-a-three-cve-chain-turns-any-litellm-user-i
    surface: "section 2026-11-22T14:59:11Z"
    kind: cited
    text: "VulnCheck's advisory scores CVE-2026-47101 at CVSS 4.0 8.7 ("
    urls: ["https://www.vulncheck.com/advisories/litellm-privilege-escalation-via-api-key-generation"]
  - claim_id: 3ea6da2ecd
    entry: 2026-06-16/obsidian-security-a-three-cve-chain-turns-any-litellm-user-i
    surface: "record 2026-11-22T14:59:11Z"
