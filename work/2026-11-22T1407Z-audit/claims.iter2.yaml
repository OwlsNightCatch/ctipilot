    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "summary"
    kind: frontmatter
    text: "Oracle's Critical Security Patch Update and the OpenJDK advisory of 2026-11-17 fix CVE-2026-114938, an out-of-bounds write in the AVX-512 Base64 decoder that Calif, one of its two credited reporters, scores CVSS 4.0 9.2 and says it turned into pre-authentication code execution in the default configurations of Keycloak, Jira, Confluence, Artifactory, Jenkins and PingFederate; Oracle scores it CVSS 3.1 8.1 with high attack complexity. Only x86-64 hosts with AVX-512 VBMI are affected, a trigger proof of concept is public, Calif withholds its product chains, a second researcher claims a working exploit with no release stated, GreyNoise reports exploitation attempts without a confirmed success against its sensors, and VulnCheck says a working exploit is available to its customers. NCSC.ch and BACS warn operators to update internet-reachable Java applications and identity services first, and Cisco's advisory, at version 1.3, lists Catalyst Center, IOS XE and ISE as not affected while Siemens lists Siveillance Control, Siveillance Control Pro and Industrial Edge Management Pro and Virtual with no fix yet."
