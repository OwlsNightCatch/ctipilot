    surface: "actions[0]"
    kind: frontmatter
    text: "Update every Drupal site to 11.4.13, 11.3.22 or 10.6.22 now and move sites on end-of-life lines (Drupal 11.2.x and 10.5.x and below) to a supported branch, and where the update has to wait secure the installer as Drupal's instructions for securing install.php describe, because Drupal reports SA-CORE-2026-017, an installer reinstall that can end in site takeover or remote code execution, exploited on live sites from 2026-11-19."
