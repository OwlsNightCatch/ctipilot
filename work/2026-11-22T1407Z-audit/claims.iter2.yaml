  - claim_id: 18e70dfa0c
    entry: 2026-11-18/oracle-november-2026-cspu-56-unauthenticated-critical-rows
    surface: "summary"
    kind: frontmatter
    text: "Oracle's Critical Security Patch Update of 2026-11-17 carries 655 patches, and its risk matrices mark 56 of the 62 rows scoring CVSS 3.1 9.0 or above as remotely exploitable without authentication. Six are CVSS 10.0 with changed scope, in Oracle Access Manager (three rows), WebLogic Server TopLink Integration, Platform Security for Java and Business Intelligence Enterprise Edition, and WebLogic Server and E-Business Suite carry further unauthenticated rows at 9.8. The only exploited flaw among them is the Brotli decoder flaw CVE-2026-111497, which CISA has listed as exploited since 2026-10-27 and which fills three of the unauthenticated rows; for attacks that need no privileges Oracle's interim measure is blocking the network protocols an attack needs."
  - claim_id: 00f3b5b147
    entry: 2026-11-18/oracle-november-2026-cspu-56-unauthenticated-critical-rows
    surface: "body"
    kind: cited
    text: "The release also carries three unauthenticated 9.8 rows for the Brotli flaw CVE-2026-111497 in Communications Diameter Signaling Router, Communications Unified Assurance and PeopleSoft PeopleTools ("
    urls: ["https://www.oracle.com/security-alerts/cspunov2026.html"]
  - claim_id: 9b102e8b7b
