    entry: 2026-11-18/drupal-core-critical-release-2026-11-18-psa-2026-11-16
    surface: "summary"
    kind: frontmatter
    text: "Drupal published SA-CORE-2026-017 (CVE-2026-132165) and SA-CORE-2026-018 (CVE-2026-132166, Moderately critical, not directly exploitable) on 2026-11-18: under specific conditions an attacker can use the installer to attempt to reinstall Drupal, which can lead to site takeover or remote code execution. Drupal now rates SA-CORE-2026-017 Highly critical and says it received a report of exploitation on live sites from 2026-11-19 19:00 UTC; the fix is in 11.4.13, 11.3.22 and 10.6.22, and the only workaround is securing the installer."
