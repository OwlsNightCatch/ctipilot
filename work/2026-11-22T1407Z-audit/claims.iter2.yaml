    entry: 2026-11-18/riken-fugaku-rikyu-intrusion-status-dashboard-ssh-keys
    surface: "headline"
    kind: frontmatter
    text: "RIKEN Fugaku: intruder entered via the public status dashboard, exfiltrated 430 SSH private keys, tried some elsewhere"
  - claim_id: 1a32cc0690
    entry: 2026-11-18/riken-fugaku-rikyu-intrusion-status-dashboard-ssh-keys
    surface: "summary"
    kind: frontmatter
    text: "RIKEN says that between 2026-11-10 and 2026-11-13 an external party used the publicly accessible web page showing Fugaku's operating status to enter its internal operational network, tampered with internal servers (some with malicious programs) and collected and exfiltrated credentials users had stored for other systems: RIKEN's second notice of 2026-11-20 counts 430 SSH private keys, 233 of them without a passphrase. Up to 4,222 Fugaku and 375 Rikyu users are affected, RIKEN confirmed that some of the stolen credentials were tried against other systems, and it suspended Fugaku on 2026-11-14. How the dashboard was breached is still under investigation, and RIKEN names no actor."
  - claim_id: 7ba8646deb
    entry: 2026-11-18/riken-fugaku-rikyu-intrusion-status-dashboard-ssh-keys
    surface: "body"
    kind: cited
    text: "The intruder tampered with multiple internal servers, some of them with malicious programs; up to 4,222 Fugaku users and 375 Rikyu users are affected ("
    urls: ["https://www.riken.jp/en/news_pubs/news/2026/20261116_2/index.html"]
  - claim_id: 33ca890ac4
    entry: 2026-11-18/riken-fugaku-rikyu-intrusion-status-dashboard-ssh-keys
    surface: "body"
    kind: cited
    text: "From users' home directories it collected and exfiltrated credentials for connecting to external systems such as other organisations' supercomputers and cloud services: 430 SSH private keys, 233 of them without a passphrase and 197 with one ("
    urls: ["https://www.riken.jp/en/news_pubs/news/2026/20261120_1/index.html"]
  - claim_id: e14a2b326b
    entry: 2026-11-18/riken-fugaku-rikyu-intrusion-status-dashboard-ssh-keys
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** treat every private key and access key stored on a compromised host as stolen, and a key without a passphrase as usable at once: RIKEN asks users to revoke the matching public key at each external service where it is authorised and to generate a new pair, and to replace any other stored credential through the service concerned ("
    urls: ["https://www.riken.jp/en/news_pubs/news/2026/20261116_2/index.html"]
  - claim_id: f35c856615
    entry: 2026-11-18/riken-fugaku-rikyu-intrusion-status-dashboard-ssh-keys
    surface: "section 2026-11-22T14:47:21Z"
    kind: cited
    text: "RIKEN's second notice confirms what the first said only might have happened: the intruder collected and exfiltrated SSH private keys and similar credentials for external systems from users' home directories, 430 keys in all, 233 without a passphrase and 197 with one ("
    urls: ["https://www.riken.jp/en/news_pubs/news/2026/20261120_1/index.html"]
  - claim_id: 327f207dc4
    entry: 2026-11-18/riken-fugaku-rikyu-intrusion-status-dashboard-ssh-keys
    surface: "section 2026-11-22T14:47:21Z"
    kind: cited
    text: "It has also identified access traces to the registration data of the 4,222 Fugaku users (address, affiliation, phone numbers and the type of identity document used), reports no misuse beyond the connection attempts already disclosed, and says Fugaku resumes only after public services are separated from the administrative network and the servers are rebuilt ("
    urls: ["https://www.riken.jp/en/news_pubs/news/2026/20261120_1/index.html"]
  - claim_id: b1d684c45c
    entry: 2026-11-18/riken-fugaku-rikyu-intrusion-status-dashboard-ssh-keys
    surface: "record 2026-11-22T14:47:21Z"
    kind: record-summary
    text: "RIKEN's second notice of 2026-11-20 confirms the exfiltration of 430 SSH private keys for external systems (233 without a passphrase), identifies access traces to Fugaku users' registration data, and ties Fugaku's restart to separating public services from the administrative network."
