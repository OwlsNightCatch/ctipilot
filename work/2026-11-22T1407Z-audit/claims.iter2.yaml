claims:
  - claim_id: b7983c8bbd
    entry: 2026-06-16/obsidian-security-a-three-cve-chain-turns-any-litellm-user-i
    surface: "summary"
    kind: frontmatter
    text: "CISA added CVE-2026-40217, the custom-code guardrail sandbox escape in LiteLLM that Obsidian Security chained with CVE-2026-47101 and CVE-2026-47102 into root on the AI gateway, to its Known Exploited Vulnerabilities catalog on 2026-11-18 and describes the exploitation no further; Google's threat-intelligence group attributes an exploited LiteLLM flaw to the same id but describes it as a key-regeneration user-ID rebind, not the sandbox escape. LiteLLM says the flaw needs a proxy-admin credential by default, which the chain's privilege escalation supplies, fixes the chain in v1.83.14-stable and gives a reverse-proxy block for the endpoint."
  - claim_id: 3931ce210d
    entry: 2026-06-16/obsidian-security-a-three-cve-chain-turns-any-litellm-user-i
    surface: "cves[CVE-2026-47101]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-47101\", \"cvss\": \"8.7 (CVSS 4.0, VulnCheck)\", \"status\": [\"poc-public\", \"patch-available\"], \"affected\": \"LiteLLM before v1.83.14-stable\", \"fixed\": \"v1.83.14-stable\", \"auth\": \"post-auth\", \"vector\": \"zero-click\"}"
  - claim_id: dd8c5f1bf2
    entry: 2026-06-16/obsidian-security-a-three-cve-chain-turns-any-litellm-user-i
    surface: "section 2026-11-22T14:59:11Z"
