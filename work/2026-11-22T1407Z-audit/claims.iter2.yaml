    text: "**Defender takeaway:** the operator's containment was to switch off the password-only path while eID and other sign-in means stayed open, as heise and Handelsblatt report it, and to bring it back the same day only with an e-mail security code ("
    urls: ["https://www.spiegel.de/netzwelt/web/bundid-hacker-attackieren-konten-zweifaktor-authentifizierung-aktiviert-a-305b6f61-70ac-4a83-8b2c-62c4d98d13c4"]
