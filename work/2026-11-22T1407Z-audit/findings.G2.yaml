    summary: |
      NCSC Ireland publishes a "critical" advisory (published 2026-11-18, CVSS 9.8, not on CISA KEV) for CVE-2026-121481:
      EVP_EncodeBlock() with an input length close to INT_MAX can overflow the output-size calculation and write past the
      caller-supplied buffer. Affected: OpenSSL 4.1.0 before 4.1.1 and 4.0.0 before 4.0.4. The advisory itself says no path by
      which an attacker can trigger it has been identified, because OpenSSL's TLS, QUIC and CMS code never encodes buffers
      of that size and the command-line tools cannot practically be made to; only an application that forwards an
      attacker-controlled length to the function is exposed. The score rests on the formal rating, not a reachable
      attack. Lane note for G1: no entry or state record carries this id.
