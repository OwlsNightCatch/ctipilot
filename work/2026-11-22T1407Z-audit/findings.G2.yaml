  - title: "BACS weekly review 46 (2026-11-17): a lure built on the PHP vulnerability phishes CMS administrator credentials, and a Swiss domestic-help service's leaked names, addresses and AHV numbers were already used in personalised card-phishing on 24 October"
    update_target: "2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow"
    update_type: improvement
    sources:
      - { url: "https://www.bacs.admin.ch/de/26w46-de", publisher: "BACS / NCSC.ch (Wochenrückblick 46)", date: "2026-11-17", role: "primary" }
    discovery_trace: "first seen at: ncsc-ch-focus, URL https://www.bacs.admin.ch/de/im-fokus (listing, 2026-11-17 card 'Woche 46') -> primary (no pivot needed): https://www.bacs.admin.ch/de/26w46-de (extract)"
    summary: |
      The federal cyber office's weekly review for week 46 describes two things it currently observes. First, phishing
      mails that cite the widely reported PHP vulnerability and send recipients to a fake page offering "updates"; those
      who enter credentials let the attackers log in to the administration tool of the website and manipulate or take
      over the site (BACS names no actor or count). Second, a Swiss company offering employment and administration
      services for household helpers announced a data outflow on 2026-10-07 and warned those affected; on 2026-10-24
      targeted phishing mails went out in the company's name carrying recipients' names, addresses and AHV numbers and
      aiming at credit-card data including the security code. BACS expects that, given recent cases in which AHV numbers
      and other personal details were taken, such data will increasingly be used to make mails, SMS and calls look
      credible and personalised. For the covered Publica entry (federal pension fund, AHV numbers among the data) this is
      a primary Swiss precedent of leaked AHV numbers reused in phishing within 17 days. The weekly review names no link
      between the household-help case and Publica.
    region_nexus: "Switzerland"
    primary_sector_nexus: "indirect (federal employees' AHV numbers in the Publica/PK Softech data; CMS operators incl. communes)"
    sector: "public-sector"
    cves: []
    techniques: [T1566.002, T1078]
    affected_products: ["PHP", "web content management systems"]
    entity_keys: ["incident:pk-softech-publica-cyberattack-2026-09"]
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: HIGH
    novelty: "update-of:2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow"
    borderline: true
    borderline_reason: "awareness-level: the first-pass runs dropped the review as 'phishing awareness, no new technique' (2026-11-18); the only delta is the Swiss precedent for AHV-number reuse and the PHP-lure credential harvesting. The Publica entry is already long; the audit decides."
    evidence:
      - quote: "Am 24. Oktober wurden nämlich im Namen der Firma gezielte Phishing-E-Mails versendet. Die Nachrichten enthielten unter anderem die Namen, Adressen und AHV-Nummern der Empfängerinnen und Empfänger und wirkten dadurch besonders glaubwürdig."
        attribution: "BACS / NCSC.ch"
