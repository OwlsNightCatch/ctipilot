      - { url: "https://www.heise.de/news/BSI-aendert-Lagebewertung-auf-angespannt-bis-kritisch-11530831.html", publisher: "heise online", date: "2026-11-19", role: "corroborating" }
    discovery_trace: "first seen at: heise-sec, URL https://www.heise.de/security/feed.xml (item 'BSI ändert Lagebewertung auf angespannt bis kritisch', 2026-11-19) -> pivot: heise article https://www.heise.de/news/BSI-aendert-Lagebewertung-auf-angespannt-bis-kritisch-11530831.html (extract; carries the BSI press link) -> primary: https://www.bsi.bund.de/DE/Service-Navi/Presse/Pressemitteilungen/Presse2026/261119_Lagebericht.html (extract) -> report chapters https://www.bsi-lagebericht.de/node/4 and /node/32 (extract)"
    summary: |
      Germany's BSI raised its overall assessment from "tense" to "tense to critical" for the reporting period July 2025
      to June 2026 and introduced a Cyber Index (BSI CX) averaging 170 points, 50 percent above the previous period. The
      press release counts 160 newly known vulnerabilities a day (35 percent more), and a mean time from disclosure to
      first known exploitation of 53 days a year ago, 25 days in the period and 8 days in Q2 2026; it adds that attackers
      often know vulnerabilities before they are published or patched. The Gefährdungslage chapter attributes most of the
      9 percent rise in the attack score to exploitation attacks on internet-reachable systems (score up 48 percent to
      133), and the threat chapter reports a 57 percent rise in reconnaissance activity. The release repeats that small
      and mid-sized enterprises and communes are particularly vulnerable targets. German statistics; no Swiss figures; the
      Swiss counterpart is the BACS half-year report (HJB 2026-1 published in August). The three intel fires that saw it
      dropped it as Germany-only statistics; the report itself was read here as the 2026-11-21 fire's note suggested.
    region_nexus: "Germany (neighbouring authority); communes named as targets"
