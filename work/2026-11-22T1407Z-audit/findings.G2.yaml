    summary: |
      dpa reports that the Stadtwerke Wittenberg say a disruption on Wednesday 2026-11-18 turned out to be a targeted
      attack that happened in the night to Wednesday; about 8,000 customers of the subsidiary Wittenberg-Net lost phone and
      internet, all relevant systems were disconnected and shut down as a precaution, and restoration was expected to be
      complete on Thursday. The district office (Landratsamt) was unreachable by phone all Wednesday while internal
      telephony and work continued, and town-hall staff had no internet connection while the town's website and online
      forms stayed up; a police statement that 110 and 112 stayed reachable is reported by a search summary only, not read
      on the page. The utility named no vector or actor and has handed all information to the authorities. The transferable
      point is dependency: a municipal utility's ISP subsidiary carried a district authority's external telephony and a
      town hall's internet, so one provider incident disabled public-administration channels.
