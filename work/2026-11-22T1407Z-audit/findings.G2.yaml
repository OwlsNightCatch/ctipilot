summary_note: >
  The week's Swiss stories were already covered accurately; the re-sweep found no new Swiss federal, cantonal or
  communal incident beyond them. One material correction on a covered Swiss-adjacent entry (BundID), one primary
  Swiss-federal delta on Java4Shell (swiyu notice), and a set of correctly-droppable borderline items.
items:
  - title: "BundID: the operator's own notice (quoted by Spiegel) says two-factor sign-in by e-mail code was switched on for all accounts on the afternoon of 2026-11-16 while eID and Elster stayed open; the covered entry says only an aggregator reports this"
    update_target: "2026-11-17/bundid-automated-mass-logins-lock-federal-citizen-accounts"
    update_type: improvement
    sources:
      - { url: "https://www.spiegel.de/netzwelt/web/bundid-hacker-attackieren-konten-zweifaktor-authentifizierung-aktiviert-a-305b6f61-70ac-4a83-8b2c-62c4d98d13c4", publisher: "DER SPIEGEL", date: "2026-11-16", role: "primary" }
      - { url: "https://idtechwire.com/germany-adds-email-codes-to-bundid-logins-after-wave-of-automated-attacks-on-citizen-accounts/", publisher: "ID Tech", date: "2026-11-17", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"BundID Massenlogins Angriff BSI Passwort-Login wieder freigeschaltet\") -> pivot: idtechwire.com, URL https://idtechwire.com/germany-adds-email-codes-to-bundid-logins-after-wave-of-automated-attacks-on-citizen-accounts/ (extract) -> primary: Spiegel article it cites, URL https://www.spiegel.de/netzwelt/web/bundid-hacker-attackieren-konten-zweifaktor-authentifizierung-aktiviert-a-305b6f61-70ac-4a83-8b2c-62c4d98d13c4 (extract; carries the BundID homepage notice verbatim). The operator page https://id.bund.de/de is a JavaScript shell and could not be read."
    summary: |
      Spiegel (2026-11-16) reproduces the notice on the BundID site on Monday afternoon: after numerous unauthorised
      login attempts, two-factor authentication was activated for all BundID accounts, so every sign-in with username
      and password now needs a security code sent by e-mail; sign-in with the eID and the Elster certificate stayed
      possible. This is the operator's own wording (as quoted by Spiegel), not a BSI statement. It settles what the
      covered entry leaves open: the entry says password sign-in was switched off on 2026-11-16 (Handelsblatt, morning)
      and that a return behind an e-mail code rests on one aggregator (ad-hoc-news). The headline "password sign-in cut"
      therefore describes only the morning; by the afternoon password sign-in was available again behind a mandatory
      e-mail second factor. Spiegel, like heise and Handelsblatt, relays the BSI statement that no compromise is evidenced
      and says the BSI named neither the number of locked accounts nor its countermeasures. The containment lever worth
      carrying is therefore "switch the password path to mandatory out-of-band second factor", not only "switch it off".
    region_nexus: "Germany (federal citizen account); transferable to Swiss cantonal and communal citizen portals; no Swiss portal reported affected"
    primary_sector_nexus: "direct (public-sector citizen identity portal)"
    sector: "public-sector"
