    summary: |
      heise reports that the EU Council added NoName057(16) to its framework of sanctions against malicious cyber
      activity (asset freeze, travel ban, ban on making funds available), raising that framework to 27 persons and 12
      entities, in the same package that listed the Social Design Agency and 29 other persons and entities under the
      hybrid-threats framework (Council release dated 2026-11-16 per the link heise cites). heise summarises the group's
      record as DDoS claims against government bodies, critical infrastructure and firms in Ukraine, the US and the EU,
      in Europe mostly energy, finance, transport, water and, in election campaigns, political parties. Separately, El País
      reports that Spain's police arrested on Tuesday 2026-11-17 in Burgos a 51-year-old former security guard they regard
      as the group's main instigator in Spain, holding firearms, about 200 bladed weapons and ammunition; police describe
      it as the first attempted physical implantation of the group in Spain, whose activity had been confined to cyberspace;
      he was released under court-ordered conditions; police data attribute at least 447 attacks since 2024 to the group in
      Spain. Neither action is reported to change the group's DDoS capability, and no Swiss measure follows from either.
