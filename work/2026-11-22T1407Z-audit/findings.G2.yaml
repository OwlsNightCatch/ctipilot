      - quote: "ist damit zu rechnen, dass solche Daten künftig vermehrt genutzt werden, um E-Mails, SMS oder Anrufe glaubwürdiger und stärker personalisiert erscheinen zu lassen"
        attribution: "BACS / NCSC.ch"
