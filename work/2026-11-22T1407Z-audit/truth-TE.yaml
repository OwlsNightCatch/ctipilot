        claim_id: null
        where: "body paragraph 2 (CVE-2026-129481 and CVE-2026-129182 'incomplete fix for CVE-2026-109619') and summary 'no source reports exploitation'"
        defect: "(low confidence) The entry calls CVE-2026-129481 and CVE-2026-129182 follow-ups to CVE-2026-109619 but never says that CVE-2026-109619 is the PHP2Shell flaw CISA lists as exploited; 'no source reports exploitation' is true only of this release's CVEs and reads as if the whole lineage were unexploited."
        ground_truth: "CISA KEV (catalogVersion 2026.11.20) lists CVE-2026-109619 and CVE-2026-109618 with dateAdded 2026-10-26. GHSA-g3vh-838c-65v7: 'This is an incomplete fix for CVE-2026-109619'. GHSA-2fjv-p558-g82m: 'Successful exploitation can result in memory corruption and potentially full remote code execution (RCE), as in CVE-2026-109619 ... RCE through these specific entry points has not been demonstrated.' watchTowr lists all November CVEs as 'Not reported' exploited."
        ground_truth_url: "https://github.com/php/php-src/security/advisories/GHSA-g3vh-838c-65v7"
        fix: "Add one clause that CVE-2026-109619 (the PHP2Shell flaw) has been on CISA KEV since 2026-10-26 and that the follow-ups close paths in the same class without reported exploitation; optionally note on the earlier entry that its 'keep upload progress disabled until the next regular release' advice is closed by this release."
    length_note: "main analysis 545 words (within the 550 bound)"
