  - entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    verdict: imprecision
    findings:
      - code: F3
        claim_id: 1c8675fd82
        where: "## Update - 2026-11-21T04:37:47Z, Siemens sentence (echoed in the update record summary 'Siemens Industrial Edge has no fix', affected_products 'Siemens Industrial Edge', entities product:siemens-industrial-edge)"
        defect: "Siemens (SSA-935812, 2026-11-20) lists Industrial Edge products as affected in all versions with no fix available"
        ground_truth: "SSA-935812 lists as affected only five device-side products: Industrial Edge Cloud Device (IECD), Device Kit arm64, Device Kit x86-64, Own Device (IEOD) and Virtual Device (IEVD), 'Currently no fix is available'. It lists Industrial Edge Hub, Management Cloud, Management Pro V1, Management Pro V2 and Management Virtual under Known Not Affected: 'This product is not affected because HTTP/2 is disabled, and HTTP/3 and SSI are not used.'"
        ground_truth_url: "https://cert-portal.siemens.com/productcert/html/ssa-935812.html"
        fix: "Name the affected Industrial Edge device products (Cloud Device, Device Kit, Own Device, Virtual Device) and state that Industrial Edge Hub and the Management products are listed as not affected; narrow the 'Siemens Industrial Edge' shorthand accordingly."
      - code: F3
        claim_id: cc3603fe76
        where: "body paragraph 2: 'Rapid7 says execution has the worker's permissions and root is not established'"
        defect: "(low confidence) 'root is not established' is attributed to Rapid7 (cited to Rapid7, CERT.at, Wiz)."
        ground_truth: "Rapid7 says only: 'execute code with the nginx worker process's permissions'; the post never discusses root or privilege escalation. Xint (cited elsewhere in the entry) is the source that reaches root, via a chained kernel SCTP flaw."
        ground_truth_url: "https://www.rapid7.com/blog/post/ve-cve-2026-123007-critical-nginx-http-2-integer-underflow-leads-to-rce-fixed"
        fix: "Drop 'and root is not established' or reword it as the entry's own note (Rapid7's exploit runs with worker permissions; Xint reached root only with a separate kernel flaw)."
      - code: F11
        claim_id: null
        where: "sourcing_note"
        defect: "(advisory) The sourcing note runs to six sentences of composition rationale: 'the entry follows the majority', 'the score recorded here', 'whose values are used'."
        ground_truth: "Reader-facing sourcing_note should be provenance only (two sentences)."
        ground_truth_url: null
        fix: "Cut to the provenance (nginx.org undated, F5 K-articles not public so Plus builds come from Rapid7, Wiz and CERT.at which differ on R33 versus R34 to R36) and drop the rationale sentences."
    length_note: "main analysis 548 words (within the 550 bound); headline 120 characters (at the bound, not over)"
