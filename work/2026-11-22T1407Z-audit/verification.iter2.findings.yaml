  url_or_quote: "OpenVoxDB's fixed versions come from OpenVox's release notice, not from the pages first given for them. / report: OpenVoxDB clause cited to pages that do not name it"
  summary: "False provenance statement. GHSA-q4hm-33rc-572g, one of the two pages first cited for the OpenVoxDB clause, lists package 'OpenVoxDB (OpenVox/Puppet)' with affected '<= 9.1.0 and <= 8.17.0' and patched '9.2.0 and 8.18.0' (fetched raw this pass; the trafilatura extract drops the second package row, which is how TD misread it). SecurityWeek names no OpenVox version. Drop 'not from the pages first given for them' from the record summary and reword the report row to say only SecurityWeek lacked the versions."
