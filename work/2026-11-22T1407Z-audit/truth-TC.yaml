    claim_id: d7582573a5
    where: body, **Detection:** line (low confidence)
    defect: '"a vendor-signed executable running from ProgramData beside an unsigned DLL"'
    ground_truth: Symantec describes "an old, legitimate Bitdefender executable (bdreinit.exe) with a malicious DLL (log.dll)" and "a G DATA signed executable (ask.exe) with ask.dll"; it never says the
      DLLs are unsigned.
    ground_truth_url: https://www.security.com/threat-intelligence/ai-assisted-attack-us-retailer
    fix: Write "beside a DLL it does not normally load" or drop "unsigned".
  - code: F11
    claim_id: null
    where: body paragraph 2 and **Detection:** (advisory)
    defect: Names the attacker side-load pairs "bdreinit.exe with log.dll" and "ask.exe with ask.dll", file-name indicators that Symantec itself lists in its IOC section and says are reused by several actors
    ground_truth: 'Symantec: "the bdreinit.exe and log.dll pairing has also been used by several threat actors in different operations, so it does not on its own identify the malware or the actor."'
    ground_truth_url: https://www.security.com/threat-intelligence/ai-assisted-attack-us-retailer
    fix: Describe the behaviour (a vendor-signed security executable launching a sibling DLL from ProgramData) and drop the file names; the lineage-based Detection line already stands without them.
