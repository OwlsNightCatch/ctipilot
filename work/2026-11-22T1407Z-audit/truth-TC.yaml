- entry: 2026-11-17/optimjack-poisoned-vendor-scripts-skimmer-iphone-router
  verdict: imprecision
  findings:
  - code: F8
    claim_id: 11a89c6383
    where: body, **Exposure:** line
    defect: '"any page that loads Optimizely project JavaScript from cdn.optimizely.com" narrows exposure to one hostname'
    ground_truth: 'Report URI: "Some customers serve their snippet from their own domain, such as opt.scheels.com/js/<id>.js or www.vodafone.com.au/js/<id>.js. Those were affected too, because the content
      comes from the same Optimizely project." Zscaler: modified snippets were served "including Optimizely''s CDN (including cdn.optimizely.com) and, in some cases, customer domains".'
    ground_truth_url: https://blog.report-uri.com/worlds-largest-brands-infected-with-malware-via-optimizely/
    fix: Say "any page that loads an Optimizely snippet, served from cdn.optimizely.com or from a customer-owned hostname"; the matching action already says "loaded Optimizely project JavaScript" so only
      the Exposure line needs the change.
  - code: F8
    claim_id: null
    where: body (no sentence bounds the Optimizely exposure window or states the C2 takedown); publisher revision of 2026-11-17T09:17Z after the entry's first record
    defect: The entry gives only the 2026-11-16 start of the Optimizely injection and Report URI's 20:40-21:10 UTC mass clean-up; it never states when the Optimizely files were fully clean or that the main
      collection host was taken down.
    ground_truth: 'Report URI "Update: 17 November 2026, 09:17 UTC": "As of 16 Nov 23:11 UTC we observed that all infected Optimizely files were cleaned, and have remained clean since." and "1688360.cc,
      the main payload and data-collection server, was put on clientHold at 17 Nov 00:37 UTC. It no longer resolves."'
    ground_truth_url: https://blog.report-uri.com/worlds-largest-brands-infected-with-malware-via-optimizely/
    fix: 'Add one cited sentence to the next section: Optimizely files clean from 2026-11-16 23:11 UTC, collection host on clientHold from 2026-11-17 00:37 UTC, so the browser-exposure window for Optimizely-served
      pages is about 04:21 to 23:11 UTC on 2026-11-16 (Kissmetrics, StorifyMe and minute-ly status still unknown).'
  - code: F3
    claim_id: df469a2484
    where: '## Update — 2026-11-18T04:57:41Z, last sentence of the contradiction paragraph (low confidence)'
    defect: '"the earlier Kissmetrics, StorifyMe and minute-ly wave is not in the 178" is cited to Report URI, which does not name minute-ly'
    ground_truth: 'Report URI: "The earlier `webshell.lol` wave, through Kissmetrics, StorifyMe and Minute Media, affected other sites and isn''t included above." The equivalence Minute Media = minute-ly
      (foxsports.com listed under Minute Media by Report URI, loader named minute-ly by Hudson Rock) is not stated by either page.'
    ground_truth_url: https://blog.report-uri.com/worlds-largest-brands-infected-with-malware-via-optimizely/
    fix: Write "Kissmetrics, StorifyMe and Minute Media (the vendor Hudson Rock calls minute-ly)" or drop minute-ly from that clause.
  - code: F3
    claim_id: 9b4b3c65bd
    where: body paragraph 2 (low confidence)
    defect: '"Hudson Rock describes the stealer as skimming card number, expiry and CVV ... and sending readable cookies with a page image" omits that the cookie and page-image path is conditional; the
      action then treats login pages as exposed to "session theft"'
    ground_truth: 'Hudson Rock: "This path is conditional, not a beacon that runs for every visitor. The screenshot routine requires recorded address matches"; Zscaler: "Cookie theft and screen capture
      occurs only when a valid crypto wallet address is replaced and the element is visible."'
    ground_truth_url: https://www.infostealers.com/article/poisoned-scripts-on-bbc-zoom-and-other-major-websites-linked-to-iphone-exploit-loaders/
    fix: Add "only after it swaps a wallet address" to the cookie and page-image clause; keep the session-rotation advice, which Report URI also gives.
  - code: F4
    claim_id: null
    where: sourcing_note, first sentence (low confidence)
    defect: '"Amirul Cyber and Report URI found the Optimizely injection independently"'
    ground_truth: Neither the Report URI post nor the Amirul Cyber post states how or whether the other was known; Hudson Rock says only that it "reviewed Amirul Cyber's OptimJack research" whose "asset
      leads helped expand the original sample set".
    ground_truth_url: https://amirulcyber.com/2026/11/16/optimjack-optimizely-skimmer/
    fix: Drop "independently" or say "both reported the Optimizely injection on 2026-11-16".
  length_note: null
