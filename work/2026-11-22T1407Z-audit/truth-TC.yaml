- entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
  verdict: imprecision
  findings:
  - code: F3
    claim_id: f8d8b3dbfe
    where: summary ("Calif, its discoverer"), body paragraph 1 ("Calif, which found it"), sources[] label "Calif (discoverer)" (low confidence)
    defect: Presents Calif as the sole discoverer
    ground_truth: 'Oracle CSPU acknowledgements list two reporters: "Albert Yang: CVE-2026-114938" and "Quang Luong of Calif.io: CVE-2026-114938" (OpenJDK advisory also thanks Albert Yang); Tenable: "Oracle
      credits Quang Luong of Calif.io and Albert Yang"; Calif''s own timeline: sundarms hit the bug in the wild on June 9, albertnetymk identified the root cause on September 8 and proposed a fix on September
      9, and its credits say "Original bug report by sundarms and albertnetymk".'
    ground_truth_url: https://www.oracle.com/security-alerts/cspunov2026.html
    fix: Say "Calif, which independently found and weaponised it (Oracle also credits Albert Yang; an earlier public report existed from June and a trigger PoC from September)".
  - code: F5
    claim_id: ced0531063
    where: title, cves[].fixed and actions[0] state Oracle fixed builds 17.0.21.1, 21.0.13.1, 25.0.5.1, 27.0.1.1 and 8u513-perf; no body sentence states or cites them
    defect: The fixed Oracle builds appear nowhere in the main analysis or any section with an inline citation, and the cited Oracle CSPU page lists affected builds only
    ground_truth: 'Tenable: "Fixed Oracle build | 8u513-perf, 17.0.21.1, 21.0.13.1, 25.0.5.1, 27.0.1.1"; NCSC.ch hub: "Oracle has published the following updated JDK versions: 17.0.21.1, 21.0.13.1, 25.0.5.1,
      27.0.1.1"; Equixly: "update it to 8u513-perf".'
    ground_truth_url: https://www.tenable.com/blog/java4shell-cve-2026-114938-frequently-asked-questions-about-openjdk-rce-vulnerability
    fix: Add a cited sentence to the main analysis giving the fixed Oracle builds (Tenable and NCSC.ch hub as sources) so the title, cves[].fixed and action are traceable.
  - code: F8
    claim_id: 9039dd9b19
    where: '## Update — 2026-11-19T05:03:07Z, last sentence (Keycloak part), and later sections; publisher revision of 2026-11-19T08:00Z'
    defect: Says the Keycloak images "tagged 26.8.2-1 and 26.8.2-2 carry an affected Java build" and no later section reports that Keycloak shipped fixed images
    ground_truth: 'Keycloak (last updated 19 November 2026, 08:00 UTC): "Keycloak container images for 26.8 have been updated to Red Hat OpenJDK 21.0.13.1, which includes fixes for CVE-2026-114938. The
      updated tags include `latest`, `26.8`, `26.8.2`, and `26.8.2-3`." Tenable (updated Nov 19) repeats it.'
    ground_truth_url: https://www.keycloak.org/2026/11/java4shell-vulnerability-cve-2026-114938
    fix: Add to the next section that Keycloak 26.8 images (latest, 26.8, 26.8.2, 26.8.2-3) carry OpenJDK 21.0.13.1 as of 2026-11-19, cited to the Keycloak post or to Tenable; Keycloak is one of the six
      pre-auth chains in the headline.
  - code: F3
    claim_id: 9039dd9b19
    where: '## Update — 2026-11-19T05:03:07Z, Tenable clause (low confidence)'
    defect: '"Tenable adds that as of 2026-11-18 Red Hat and Ubuntu had released no fix and Debian had fixed only its unstable branch" no longer matches the cited page; the 2026-11-22 Improvement section
      supersedes it but the older sentence still stands as a Tenable statement'
    ground_truth: 'Tenable current text: "Ubuntu released fixes for its openjdk-17, openjdk-21, openjdk-25 and openjdk-27 packages on November 18. Debian has fixed openjdk-21 and openjdk-25 in its stable
      release, Debian 13"; Ubuntu''s own page shows USN-9155-1 to USN-9158-1 dated 18 November 2026.'
    ground_truth_url: https://www.tenable.com/blog/java4shell-cve-2026-114938-frequently-asked-questions-about-openjdk-rce-vulnerability
    fix: Reword the 2026-11-19 sentence as the reading of the Tenable text at that date and keep the explicit supersession note, or delete the distribution-status part of that section now that the Improvement
      section carries the current state.
  - code: F11
    claim_id: eb1950b954
    where: updates[0] (2026-11-19T05:03:07Z) summary vs its section (advisory, low confidence)
    defect: Record summary says "Cisco lists 13 products as affected with fixed releases still to be determined", but the section under that heading was later rewritten to the Cisco v1.3 state (dated 2026-11-20)
      and states no count
    ground_truth: 'Cisco advisory v1.3 (2026-NOV-20) lists about 25 affected products; the revision history shows v1.1 and v1.2 changes on 2026-NOV-18 and 2026-NOV-19 without counts, so the "13" cannot
      be re-checked today. SecurityWeek (2026-11-19): "more than a dozen of its products are affected".'
    ground_truth_url: https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-nov2026-java-rce-eCa6ss9z
    fix: No edit to the append-only record; if the section is touched again, keep its text consistent with the record or note in the next record that the count moved.
  - code: F10
    claim_id: null
    where: whole entry (advisory, not a truth defect)
    defect: The headline names Jira and Keycloak but the entry carries no Atlassian vendor statement, and its exploitation picture stops at GreyNoise "as of 2026-11-18"
    ground_truth: 'Atlassian (posted 2026-11-18): Data Center "out-of-cycle patches ... will be released once third-party Temurin releases are made available"; interim mitigation "-XX:UseAVX=2 -XX:+IgnoreUnrecognizedVMOptions"
      for Bamboo, Bitbucket, Confluence, Crowd, Jira and Jira Service Management Data Center. SecurityWeek (2026-11-19): GreyNoise "over 150 requests matching the shape of a Java4Shell attack, coming from
      five IP addresses", WatchTowr honeypot hits with "java4shell-recon" user agents, Previdian nine attempts from six IPs, none confirmed successful.'
    ground_truth_url: https://community.atlassian.com/forums/discussion/3317765/data-center-mitigations-for-cve-2026-114938
    fix: 'Add Atlassian Data Center status (search: "Atlassian Data Center mitigations CVE-2026-114938") and the 2026-11-19 probing telemetry (https://www.securityweek.com/java4shell-exploitation-attempts-begin-as-vendors-rush-out-advisories/)
