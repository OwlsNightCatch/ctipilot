- id: G1-1
  title: 'Synology DSM OAuth API flaw CVE-2026-120382: unauthenticated argument injection with arbitrary file read and write (CVSS 3.1 9.8); fixed in DSM 7.4.1-90080-2
    and 7.3.2-86009-6, DSM 7.2.x, 7.1 and BeeStation OS still unfixed, interim measure is deactivating the OAuth Service package'
  sources:
  - url: https://www.synology.com/en-global/support/security/Synology_SA_26_21
    publisher: Synology PSIRT (Synology-SA-26:21, CNA for its own products)
    date: '2026-11-19'
    role: primary
  - url: https://securityonline.info/synology-dsm-vulnerabilities-cve-2026-120382/
    publisher: Daily CyberSecurity (securityonline.info)
    date: '2026-11-19'
    role: corroborating
  discovery_trace: 'first seen at: synology-security-advisories, feed https://www.synology.com/api/rssfeed/security/en-global (item Synology-SA-26:21, 2026-11-19)
    -> primary: Synology PSIRT, URL https://www.synology.com/en-global/support/security/Synology_SA_26_21 (extract for the body; raw url --direct for the revision
    table, which extract drops) -> corroboration: https://securityonline.info/synology-dsm-vulnerabilities-cve-2026-120382/ (aggregator, restates the vendor page);
    ENISA EUVD text search for CVE-2026-120382 on 2026-11-22 returned no record. The 2026-11-22T0355Z intel run composed this item, withdrew it as out of window and
    left it as a lead for this audit (its run record, borderline-drop line).'
  summary: Synology published Synology-SA-26:21 on 2026-11-19 (UTC+8 15:47) and revised it on 2026-11-20 ('Update fix status for DSM 7.3 and DSM 7.4'). CVE-2026-120382
    is an improper neutralization of argument delimiters in a command (CWE-88) in the OAuth API of DiskStation Manager; Synology says it allows remote attackers to
    read or write arbitrary files and conduct denial-of-service attacks and scores it CVSS 3.1 9.8 (AV:N/AC:L/PR:N/UI:N), so it needs no credentials. The advisory
    table marks DSM 7.4, 7.3, 7.2.2, 7.2.1, 7.1 and BeeStation OS 1.5 Critical; APM 2.0 and 1.2, DSM Enterprise 1.0 and SRM 1.3 and 1.2 are listed not affected. Fixed
    builds are DSM 7.4.1-90080-2 and 7.3.2-86009-6 or above; DSM 7.2.2, 7.2.1, 7.1 and BeeStation OS are marked 'OnGoing' (for 7.2.x Synology recommends moving to
    7.3.2-86009-6 or above). The description text names 6.2.4-25556-9, 7.1.1-42962-10, 7.2.1-69057-14 and 7.2.2-72806-11 as builds before which DSM is vulnerable,
    which does not square with 'OnGoing' for those branches, so the 7.2.x and 7.1 fix state is unresolved on the vendor page. Synology's mitigation is to deactivate
    the OAuth Service package. The page does not state exploitation; the only second source is an aggregator that restates the page. The CVE is not yet in ENISA EUVD.
    The store already carries two other unauthenticated DSM criticals (2026-09-22 SCGI and LDAP rows, 2026-11-11 SA-26:19 Auth API), and the nginx2root entry carries
    the DSM builds that contain this fix without naming CVE-2026-120382.
  region_nexus: global; Synology DSM is a common NAS and backup target in small public administrations, schools and municipalities (store entries 2026-09-22 and 2026-11-11
    treat it as in scope)
