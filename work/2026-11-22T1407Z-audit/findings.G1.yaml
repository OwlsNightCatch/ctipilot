- id: G1-4
  title: 'Apache Shiro CVE-2026-129349: DefaultLdapRealm with authentication caching accepts any password after one successful login (CVSS 4.0 9.1, fixed in 3.0.1);
    the Belgian CCB reports a public proof of concept on 2026-11-18'
  sources:
  - url: https://lists.apache.org/thread/1whn52ht402lhc782c3s843c9hho8b4y
    publisher: Apache Shiro project (announcement CVE-2026-129349)
    date: '2026-11-15'
    role: primary
  - url: https://ccb.belgium.be/advisories/warning-improper-authentication-vulnerability-apache-shiro-patch-immediately
    publisher: Centre for Cybersecurity Belgium (CCB), warning updated 18/11/2026
    date: '2026-11-18'
    role: corroborating
  discovery_trace: 'first seen at: ccb-belgium, raw url listing https://ccb.belgium.be/advisories (hrefs with dd/mm/yyyy dates; ''warning-improper-authentication-vulnerability-apache-shiro-patch-immediately'',
    last update 18/11/2026) -> extract of the CCB page (cites the vendor thread) -> primary: Apache announce thread https://lists.apache.org/thread/1whn52ht402lhc782c3s843c9hho8b4y
    (extract). The 2026-11-16 intel fire dropped Shiro before the PoC statement existed.'
  summary: 'Apache Shiro before 3.0.1: when authentication caching is enabled on DefaultLdapRealm, a user who has logged in once can log in again with any password,
    because the cached authentication skips the LDAP bind and the default AllowAllCredentialsMatcher accepts any credentials; an attacker needs only a valid username
    (Apache, CVSS 4.0 9.1, critical). The condition is non-default: authentication caching must be on for an LDAP realm. The CCB added on 2026-11-18 that a public
    proof of concept is now available, which increases the likelihood of exploitation in the wild, and tells readers to patch immediately; its mitigations are upgrading
    to 3.0.1 or later, disabling authentication caching on the LDAP realm, or checking credentials against the cached authentication with SimpleCredentialsMatcher.
    No source reports exploitation. The CCB page did not name the PoC''s author or location, and no independent copy of the PoC was fetched.'
  region_nexus: global; Shiro is embedded in Java applications, and the store has no Swiss footprint figure
  primary_sector_nexus: indirect
  sector: public-sector
  cves:
