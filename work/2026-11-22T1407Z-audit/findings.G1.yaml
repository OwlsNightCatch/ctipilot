    attribution: Synology PSIRT
    source_url: https://www.synology.com/en-global/support/security/Synology_SA_26_21
  - quote: '| DSM 7.2.2 | Critical | OnGoing (Upgrading to 7.3.2-86009-6 or above is recommended). |'
    attribution: Synology PSIRT
    source_url: https://www.synology.com/en-global/support/security/Synology_SA_26_21
  - quote: '| DSM 7.1 | Critical | OnGoing |'
    attribution: Synology PSIRT
    source_url: https://www.synology.com/en-global/support/security/Synology_SA_26_21
  extended_notes: 'Exposure: the advisory ties the flaw to the OAuth API and the OAuth Service package (the mitigation is deactivating it) but does not say which
    port or interface must be reachable, whether the package is installed by default, or whether the flaw is reachable with the package off; no detection guidance
    and no post-patch compromise check is given, so none is carried. Defender takeaway grounded in the page: update DSM 7.4 and 7.3 to the named builds; on DSM 7.2.x,
    7.1 and BeeStation OS, where the fix is ''OnGoing'', deactivate the OAuth Service package and move 7.2.x to 7.3.2-86009-6 or above as Synology recommends. Behavioural
    hook for triage: an unauthenticated request to the DSM OAuth API followed by unexpected file creation or modification under DSM paths, or a restart of the web
    stack, would match the stated impact; the sources give no telemetry specifics.'
- id: G1-2
  title: 'IGEL Universal Management Suite: ISN-2026-44 (a certificate forwarded in the X-SSL-CERT header bypasses authentication and can take over the UMS host, CVSS
    3.1 9.8, only behind a reverse proxy with client-certificate forwarding) and ISN-2026-50 (ZipSlip in the App Proxy upload path, 8.5); both fixed in UMS 12.13.140,
    12.14.120 and 12.15.100, no exploitation stated'
  sources:
  - url: https://kb.igel.com/en/security-safety/current/isn-2026-44-ums-certificate-replay-vulnerability
    publisher: 'IGEL (ISN 2026-44: UMS Certificate Replay Vulnerability)'
    date: '2026-11-16'
    role: primary
  - url: https://kb.igel.com/en/security-safety/current/isn-2026-50-zipslip-vulnerability-in-ums
    publisher: 'IGEL (ISN 2026-50: ZipSlip Vulnerability in UMS)'
    date: '2026-11-17'
    role: primary
  - url: https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-4599
    publisher: BSI WID (WID-SEC-2026-4599, relays ISN 2026-44)
    date: '2026-11-16'
    role: corroborating
  discovery_trace: 'first seen at: bsi-de, changes.csv https://wid.cert-bund.de/.well-known/csaf/white/changes.csv then bsi-csaf WID-SEC-2026-4599 (initial release
    2026-11-16, ''IGEL UMS: Schwachstelle ermoeglicht Erlangen von Administratorrechten'', severity hoch) -> primary: IGEL advisory ISN 2026-44, URL https://kb.igel.com/en/security-safety/current/isn-2026-44-ums-certificate-replay-vulnerability
    (listed in BSI references) -> pivot: IGEL security notices index https://kb.igel.com/en/security-safety/current (''New or Updated'' lists ISN 2026-50 and ISN
    2026-42) -> primary: ISN 2026-50 URL https://kb.igel.com/en/security-safety/current/isn-2026-50-zipslip-vulnerability-in-ums. No entry in the store mentions IGEL
    (grep of entries/ returned nothing).'
  summary: 'IGEL published two UMS notices on 2026-11-16 and 2026-11-17. ISN 2026-44 (CVSS 3.1 9.8, AV:N/AC:L/PR:N/UI:N) says a certificate forwarded via the X-SSL-CERT
    header can bypass authentication controls and lead to full takeover of the UMS host server because UMS lacked a validation check; it affects UMS only when used
    behind a reverse proxy with client-cert-forwarding enabled, and installations using ICG or no reverse proxy are not affected. ISN 2026-50 (8.5, PR:L, scope changed)
    says a missing validation on file uploads when UMS acts as an App Proxy lets a crafted file write outside intended locations and take over the UMS host. Both
    are fixed only by updating to UMS 12.13.140, 12.14.120 or 12.15.100. IGEL''s version lists do not line up exactly: ISN 2026-44 says ''all UMS versions below 12.14.110''
    and ISN 2026-50 says ''12.13.130 and below'' and ''12.14.110 and below'' while naming 12.14.120 as the fix. BSI rates ISN 2026-44 hoch and calls the attacker
    remote and anonymous; neither IGEL page nor BSI states exploitation, and no CVE id is given by IGEL or in BSI''s CSAF. IGEL separately updated ISN 2026-42 (eMudhra
    CA compromise affecting IGEL OS 11, IGEL OS 12 and several apps) on 2026-11-18 (''fixed JRE and JDK apps released''), which the store''s eMudhra entry does not
    mention.'
  region_nexus: global; the store carries no footprint figure for IGEL in Swiss public-sector estates, so relevance rests on UMS being the management plane of IGEL
    OS thin-client fleets
