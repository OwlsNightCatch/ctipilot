  source_publication_date: 2026-11-16 (ISN 2026-44), 2026-11-17 (ISN 2026-50)
  evidence:
  - quote: 'a certificate forwarded via the Header: X-SSL-CERT could be used to bypass authentication controls and could lead to full takeover of the UMS host server'
    attribution: IGEL
    source_url: https://kb.igel.com/en/security-safety/current/isn-2026-44-ums-certificate-replay-vulnerability
  - quote: This affects the following UMS versions ONLY when used together with a reverse proxy, and UMS has client-cert-forwarding enabled.
    attribution: IGEL
    source_url: https://kb.igel.com/en/security-safety/current/isn-2026-44-ums-certificate-replay-vulnerability
  - quote: UMS Installations using ICG or no reverse proxy are NOT affected.
    attribution: IGEL
    source_url: https://kb.igel.com/en/security-safety/current/isn-2026-44-ums-certificate-replay-vulnerability
  - quote: A validation was missing on file uploads when using the UMS as an App Proxy.
    attribution: IGEL
    source_url: https://kb.igel.com/en/security-safety/current/isn-2026-50-zipslip-vulnerability-in-ums
  - quote: Ein entfernter, anonymer Angreifer kann eine Schwachstelle in IGEL UMS ausnutzen, um Sicherheitsvorkehrungen zu umgehen und Administratorrechte zu erlangen.
    attribution: BSI WID
    source_url: https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-4599
  extended_notes: 'Exposure: ISN 2026-44 applies only where UMS sits behind a reverse proxy that forwards client certificates in X-SSL-CERT; check the proxy and UMS
    client-cert-forwarding setting, and the UMS version against the fixed lines. ISN 2026-50 applies when UMS is used as an App Proxy. IGEL''s general recommendation
    on both pages is not to run UMS (Tomcat) with root or system privileges, which limits what a host takeover yields. No detection guidance or post-patch compromise
    check is stated by IGEL or BSI. Behaviour: a request carrying an X-SSL-CERT header that the proxy did not set itself, followed by administrative actions from
    an unexpected source, would match ISN 2026-44''s stated mechanism; this follows from the described header handling, not from a source''s telemetry guidance.'
