  source_publication_date: 2026-11-15 (Apache announcement as dated by the EUVD record; the thread page shows no date), 2026-11-18 (CCB update)
  borderline: true
  borderline_reason: dropped on 2026-11-16 as non-default (LDAP realm with authentication caching) with no PoC; the CCB's 2026-11-18 PoC statement is the delta, but
    the PoC is unconfirmed by a second source and the footprint is unestablished
  evidence:
