- id: G1-5
  title: 'F5 BIG-IP November 2026 TMM data-plane flaws (CVE-2026-116953, CVE-2026-120285, CVE-2026-120292, CVE-2026-120722, CVE-2026-121805, CVE-2026-123637): unauthenticated
    stack buffer overflows reachable through named iRule commands or APM policies, remote code execution possible; NCSC-NL now names the trigger conditions'
  sources:
  - url: https://advisories.ncsc.nl/advisory?id=NCSC-2026-0508
    publisher: NCSC-NL (NCSC-2026-0508, CSAF)
    date: '2026-11-19'
    role: primary
  discovery_trace: 'first seen at: advisories-ncsc-nl, feed listing (NCSC-2026-0508 ''Kwetsbaarheden verholpen in F5 BIG-IP'', 2026-11-19) -> ncsc-nl csaf NCSC-2026-0508
    (per-CVE summaries, CWE, CVSS 3.1 and 4.0 vectors; references K000163929 to K000164058, which no transport reads) -> corroboration: ENISA EUVD per-CVE descriptions
    (F5 CNA text) for the same six ids, fetched through the EUVD search API. Earlier fires composed and dropped this family twice (iteration 1 of 2026-11-19 ''F5
    BIG-IP K000164058'' and the 2026-11-16 drop).'
  summary: 'NCSC-NL''s advisory of 2026-11-19 lists 12 CVEs in BIG-IP: six stack-based buffer overflows in the Traffic Management Microkernel that unauthenticated
    remote attackers can trigger over the data plane, each tied to a named configuration (an iRule using GENERICMESSAGE::route, PSC::ip_address, MR::message route
    (with an HTTP profile), DNS::scrape or PEM::subscriber, or an APM per-request policy with the Client Information and Endpoint Security agents), with denial of
    service certain and remote code execution possible; the scores are CVSS 3.1 9.8 in NCSC-NL''s CSAF and 4.0 9.3 in the CVE records. Other rows: an iControl REST
    token that does not expire (8.1), an authenticated iControl SOAP command injection (8.8), and APM denial-of-service rows (7.5). F5''s own K-articles are not readable,
    so affected and fixed versions are not stated here, and the EUVD text adds that versions past End of Technical Support are not evaluated and that there is no
    control-plane exposure. No exploitation is reported. The delta against the earlier drops is that a national CERT now states the trigger conditions and the CVE
    ids in a citable document.'
