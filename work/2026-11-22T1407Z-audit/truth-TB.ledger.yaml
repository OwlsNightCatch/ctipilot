  - claim_id: 44150e98a4
    entry: 2026-11-10/n-able-n-central-33-unpatched-flaws-public-pocs-offline
    surface: "body"
    kind: cited
    text: "An independent researcher published what Huntress counts as 33 critical flaws in the N-central appliance, chaining into four exploits, and N-able took its hosted environments offline on 2026-11-09 ("
    urls: ["https://www.huntress.com/blog/n-able-disables-cloud-services-following-disclosure-of-able2shell-exploit-chains"]
  - claim_id: 595d11d843
    entry: 2026-11-10/n-able-n-central-33-unpatched-flaws-public-pocs-offline
    surface: "body"
    kind: cited
    text: "On 2026-11-10 N-able released N-central 2026.4 Hotfix 2, build 2026.4.1.26, for which Huntress lists seven CVE ids ("
    urls: ["https://status.n-able.com/2026/11/10/n-central-2026-4-hf2-release-notes/", "https://www.huntress.com/blog/n-able-disables-cloud-services-following-disclosure-of-able2shell-exploit-chains", "https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-122942", "https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-122961"]
  - claim_id: 006e199a69
    entry: 2026-11-10/n-able-n-central-33-unpatched-flaws-public-pocs-offline
    surface: "body"
    kind: cited
    text: "On 2026-11-12 the researcher published a second set. 4EverAble2Shell is unauthenticated command execution as root that requires the Legacy API to be enabled, per BleepingComputer; it chains CVE-2026-90436, an Apache Axis 1.x deserialization flaw for which Apache does not expect a fix, with a root escalation in N-central's maintenance helper ("
    urls: ["https://www.bleepingcomputer.com/news/security/new-n-able-4everable2shell-zero-day-exploited-hours-after-poc-released/", "https://openwall.com/lists/oss-security/2026/11/06/12", "https://huntback.io/blog/ncentral-4everable2shell-miners-on-live-servers"]
  - claim_id: 747a23b6d8
    entry: 2026-11-10/n-able-n-central-33-unpatched-flaws-public-pocs-offline
    surface: "body"
    kind: cited
    text: "Huntback counts at least 21 servers, 19 of them on Hotfix 2, in North America, South Africa and Europe but not Switzerland, and Previdian's sensors recorded attempts at the chain ("
    urls: ["https://huntback.io/blog/ncentral-4everable2shell-miners-on-live-servers", "https://previdian.com/VULN-2026-0009"]
  - claim_id: 07223a3f2b
    entry: 2026-11-10/n-able-n-central-33-unpatched-flaws-public-pocs-offline
    surface: "body"
    kind: cited
    text: "Agent2Shell is a set of more than ten issues in how the server talks to Windows Agents and Probes, two chains of which let an unauthenticated attacker who can reach the server run commands as SYSTEM on managed endpoints; N-able confirmed it also requires the non-default Legacy API ("
    urls: ["https://thehackernews.com/2026/11/new-n-central-exploits-work-against.html", "https://www.huntress.com/blog/n-able-disables-cloud-services-following-disclosure-of-able2shell-exploit-chains"]
  - claim_id: ddedfb0338
    entry: 2026-11-10/n-able-n-central-33-unpatched-flaws-public-pocs-offline
    surface: "body"
    kind: cited
    text: "N-able has published indicators of compromise for customers that have not disabled the Legacy API ("
    urls: ["https://www.huntress.com/blog/n-able-disables-cloud-services-following-disclosure-of-able2shell-exploit-chains"]
  - claim_id: 89e2d24ee6
    entry: 2026-11-10/n-able-n-central-33-unpatched-flaws-public-pocs-offline
    surface: "body"
    kind: cited
    text: "Hotfix 3 of 2026-11-16 fixes 17 more CVE ids, hardens how Agents and Probes authenticate and blocks the Legacy API permanently, without naming 4EverAble2Shell or Agent2Shell or saying either is fixed ("
    urls: ["https://status.n-able.com/2026/11/16/n-central-2026-4-hf3-release-notes/"]
  - claim_id: b12732acac
    entry: 2026-11-10/n-able-n-central-33-unpatched-flaws-public-pocs-offline
    surface: "body"
    kind: cited
    text: "); Huntress reports public proof-of-concept code for all 17 and no exploitation of them in its partners' environments ("
    urls: ["https://www.huntress.com/blog/n-able-disables-cloud-services-following-disclosure-of-able2shell-exploit-chains"]
  - claim_id: 7de69f4377
    entry: 2026-11-10/n-able-n-central-33-unpatched-flaws-public-pocs-offline
    surface: "body"
    kind: cited
    text: "**Exposure:** an on-premises N-central server, yours or an IT provider's, below build 2026.4.1.39, and for the second set any build up to Hotfix 2 when the Legacy API, off by default, is on and reachable ("
    urls: ["https://www.huntress.com/blog/n-able-disables-cloud-services-following-disclosure-of-able2shell-exploit-chains"]
  - claim_id: bff79fb41e
    entry: 2026-11-10/n-able-n-central-33-unpatched-flaws-public-pocs-offline
    surface: "body"
    kind: cited
    text: "); an Agent or Probe not on Hotfix 3 can be impersonated ("
    urls: ["https://status.n-able.com/2026/11/16/n-central-2026-4-hf3-release-notes/"]
  - claim_id: 03d2d26760
    entry: 2026-11-10/n-able-n-central-33-unpatched-flaws-public-pocs-offline
    surface: "body"
    kind: cited
    text: "A compromised server reaches the systems N-central manages ("
    urls: ["https://fieldeffect.com/blog/n-central-offline-alleged-zero-days"]
  - claim_id: 295ddf2821
    entry: 2026-11-10/n-able-n-central-33-unpatched-flaws-public-pocs-offline
    surface: "body"
    kind: cited
    text: "**Detection:** in N-central's authentication and audit logs from 2026-11-08 onward, unexpected logins, new administrator accounts and changes to stored credentials or API integrations; on managed endpoints, unscheduled software deployments, scripts and remote-control sessions ("
    urls: ["https://www.huntress.com/blog/n-able-disables-cloud-services-following-disclosure-of-able2shell-exploit-chains", "https://fieldeffect.com/blog/n-central-offline-alleged-zero-days"]
  - claim_id: a0e18600df
    entry: 2026-11-10/n-able-n-central-33-unpatched-flaws-public-pocs-offline
    surface: "body"
    kind: cited
    text: "For 4EverAble2Shell, Huntback names POST requests to the Axis endpoint /dms/services/ServerUI, a symlink at the N-central flag file path, a systemd unit or cron entry relaunching a miner and a hidden miner directory under /tmp or /var/tmp ("
    urls: ["https://huntback.io/blog/ncentral-4everable2shell-miners-on-live-servers"]
  - claim_id: c7063bb743
    entry: 2026-11-10/n-able-n-central-33-unpatched-flaws-public-pocs-offline
    surface: "body"
    kind: cited
    text: "Huntress's Agent2Shell indicators are static analysis only: SYSTEM PowerShell with an encoded command spawned by the Agent, where an Agent child PowerShell is common and the command is what matters ("
    urls: ["https://www.huntress.com/blog/n-able-disables-cloud-services-following-disclosure-of-able2shell-exploit-chains"]
  - claim_id: b0321f601b
    entry: 2026-11-10/n-able-n-central-33-unpatched-flaws-public-pocs-offline
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** upgrade on-premises servers to Hotfix 3, then every Agent and Probe, those already on Hotfix 2 included ("
    urls: ["https://status.n-able.com/2026/11/16/n-central-2026-4-hf3-release-notes/"]
  - claim_id: e1e0798893
    entry: 2026-11-10/n-able-n-central-33-unpatched-flaws-public-pocs-offline
    surface: "body"
    kind: cited
    text: "), and confirm the Legacy API is disabled and not internet-reachable, because Hotfix 2 did not stop 4EverAble2Shell, 19 of the 21 compromised servers already ran it ("
    urls: ["https://huntback.io/blog/ncentral-4everable2shell-miners-on-live-servers"]
  - claim_id: df1ea11658
    entry: 2026-11-10/n-able-n-central-33-unpatched-flaws-public-pocs-offline
    surface: "body"
    kind: cited
    text: ") and N-able does not say Hotfix 3 fixes it; treat a hit as a full compromise and rotate the administrator, service and integration credentials the platform holds where activity looks unauthorised ("
    urls: ["https://fieldeffect.com/blog/n-central-offline-alleged-zero-days"]
  - claim_id: c3d411e8bb
    entry: 2026-11-10/n-able-n-central-33-unpatched-flaws-public-pocs-offline
    surface: "body"
    kind: derived
    text: "Ask each IT provider managing your endpoints through N-central whether it runs a server on premises and has upgraded it."
  - claim_id: dd957d82f8
    entry: 2026-11-10/n-able-n-central-33-unpatched-flaws-public-pocs-offline
    surface: "section 2026-11-11T03:49:03Z"
    kind: cited
    text: "N-able released N-central 2026.4 Hotfix 2, build 2026.4.1.26, on 2026-11-10 as a critical security update; hosted servers are already upgraded, on-premises customers must upgrade their own servers, and every customer must upgrade Agents and Probes, Agents first as N-able recommends ("
    urls: ["https://status.n-able.com/2026/11/10/n-central-2026-4-hf2-release-notes/"]
  - claim_id: 59cb89d623
    entry: 2026-11-10/n-able-n-central-33-unpatched-flaws-public-pocs-offline
