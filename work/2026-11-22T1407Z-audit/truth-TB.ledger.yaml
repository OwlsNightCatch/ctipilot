    surface: "section 2026-11-17T04:34:20Z"
    kind: cited
    text: "Fortinet revised the FortiOS HA advisory on 2026-11-16: FortiGate HA clusters running FGCP, in both active-passive and active-active mode, are also affected on the vulnerable builds, in addition to the FGSP with standalone-config-sync and autoscale deployments named in its summary, but exploitation requires an attack vector adjacent to the HA segment ("
    urls: ["https://fortiguard.fortinet.com/psirt/FG-IR-26-273"]
  - claim_id: 4ada63fc5e
    entry: 2026-10-23/fortinet-hardening-release-fortios-fortimanager-fortimail
    surface: "section 2026-11-17T04:34:20Z"
    kind: cited
    text: "For fixed builds where the HA layer-2 segment is not fully trusted, the advisory adds a hardening configuration: an HA password with encryption and authentication enabled for FGCP and standalone-config-sync, an encryption setting and a pre-shared secret on the standalone-cluster object for FGSP peers, and a pre-shared secret on the autoscale object ("
    urls: ["https://fortiguard.fortinet.com/psirt/FG-IR-26-273"]
  - claim_id: 26b6494d98
