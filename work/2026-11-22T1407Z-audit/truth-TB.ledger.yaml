  - claim_id: 38c53cb770
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "body"
    kind: cited
    text: "HPE Networking's bulletin HPESBNW05162 (initial release 2026-10-22) fixes 76 CVEs in the wireless operating systems AOS-8 and AOS-10 for Mobility Conductors, Controllers, Gateways managed by HPE Networking Central, AOS-10 access points (AOS-AP) and AOS-8 Instant access points (AOS-IAP) ("
    urls: ["https://support.hpe.com/hpesc/public/docDisplay?docId=hpesbnw05162en_us&docLocale=en_US"]
  - claim_id: cb91d2e818
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "body"
    kind: cited
    text: "By the CSAF's CVSS 3.1 scores, 33 of the 76 rate 9.0 or higher (eight at 10.0, ten at 9.8, ten at 9.6, one at 9.4 and four at 9.3); the 19 rated 10.0, 9.8 or 9.4 need network access and no privileges, and the other 14 are reachable from the adjacent network ("
    urls: ["https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05162.json"]
  - claim_id: fd2e8ad9d4
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "body"
    kind: cited
    text: "The named mechanisms include authentication bypasses and command injection in the AOS-10 interface and in the PAPI protocol, a buffer overflow and a command injection in the AOS-8 PAPI protocol that arrive as crafted packets on its UDP port, an authentication bypass in the AOS-8 SSH daemon, and SQL injection in the web-based management interface ("
    urls: ["https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05162.json"]
  - claim_id: e6aa9ff8d9
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "body"
    kind: cited
    text: "HPE says the flaws were generally found by its internal security research, that it is not aware of public discussion or exploit code as of the release, and that customers are strongly urged to patch; for some of the critical rows exploitation also needs preconditions outside the attacker's control, which the bulletin does not itemise ("
    urls: ["https://support.hpe.com/hpesc/public/docDisplay?docId=hpesbnw05162en_us&docLocale=en_US", "https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05162.json"]
  - claim_id: b5341e38a8
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "body"
    kind: cited
    text: "The bulletin and its CSAF name AOS-10 10.8.x up to 10.8.1.1, 10.7.x up to 10.7.2.6 and 10.4.x up to 10.4.1.13, and AOS-8 8.13.x up to 8.13.3.0 and 8.10.x up to 8.10.0.23; fixed builds are AOS-10.8.1.2, 10.7.2.7 and 10.4.1.14 and AOS-8.13.3.1 and 8.10.0.24 ("
    urls: ["https://support.hpe.com/hpesc/public/docDisplay?docId=hpesbnw05162en_us&docLocale=en_US", "https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05162.json"]
  - claim_id: 744f34ea90
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "body"
    kind: cited
    text: "Customers with AP-5xx access points in a FIPS-compliant environment must use the AOS-8.13.3.2-FIPS build or later ("
    urls: ["https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05162.txt"]
  - claim_id: 3d9ed690d9
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "body"
    kind: cited
    text: "Since revision 2 of 2026-11-17 the AOS-10 PAPI authentication bypass carries CVE-2026-95787, which replaced CVE-2026-79845, and CVE-2026-95788 to CVE-2026-95791 were added, all below CVSS 3.1 9.0 ("
    urls: ["https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05162.json"]
  - claim_id: 642fd0aed1
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "body"
    kind: cited
    text: "**Exposure:** any HPE Networking mobility conductor, controller, gateway, access point or virtual machine that runs a listed version; HPE's CSAF scopes the flaws by software version, so the check is the running version, not the hardware model ("
    urls: ["https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05162.json"]
  - claim_id: c1d861f998
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "body"
    kind: cited
    text: "HPE presumes versions past end of maintenance affected and says installations past end of support should be considered potentially impacted ("
    urls: ["https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05162.txt"]
  - claim_id: f352ffd2ad
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "body"
    kind: cited
    text: "The named surfaces are the CLI and web management interfaces and the PAPI access-point management protocol on UDP port 8211 ("
    urls: ["https://support.hpe.com/hpesc/public/docDisplay?docId=hpesbnw05162en_us&docLocale=en_US", "https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05162.json"]
  - claim_id: 32c3c155bf
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "body"
    kind: cited
    text: "HPE publishes no detection guidance, so no post-compromise check is defined ("
    urls: ["https://support.hpe.com/hpesc/public/docDisplay?docId=hpesbnw05162en_us&docLocale=en_US"]
  - claim_id: b21d3d46d1
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** upgrade controllers, gateways and access points to the fixed build of their train, management and PAPI-exposed units first, and apply HPE's management-segment restriction (a dedicated layer 2 segment or VLAN behind firewall policy) at once where the upgrade has to wait; HPE says it is not aware of public discussion or exploit code, so the order follows exposure of the management and access-point protocol paths rather than a known campaign ("
    urls: ["https://support.hpe.com/hpesc/public/docDisplay?docId=hpesbnw05162en_us&docLocale=en_US"]
  - claim_id: e3e7d8b753
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "body"
    kind: derived
    text: "**Detection:** management-plane access and accounting logs for logins and sessions from outside the management segment, and network flow data for PAPI traffic on UDP 8211 or controller management ports from segments that carry users or guests."
  - claim_id: 8978f4e0c8
