    surface: "section 2026-11-18T05:12:35Z"
    kind: cited
    text: "Agents and Probes that are not upgraded are susceptible to impersonation, and all customers, hosted and on-premises, must upgrade every Agent and Probe to 2026.4.1 HF3 whether or not they already run Hotfix 2 ("
    urls: ["https://status.n-able.com/2026/11/16/n-central-2026-4-hf3-release-notes/"]
  - claim_id: 788a1b166d
    entry: 2026-11-10/n-able-n-central-33-unpatched-flaws-public-pocs-offline
    surface: "section 2026-11-18T05:12:35Z"
    kind: cited
    text: "The release notes name neither 4EverAble2Shell nor Agent2Shell nor the Apache Axis flaw and do not say they are fixed; what changes is the Legacy API, which N-able itself said both chains need and which is now blocked permanently ("
    urls: ["https://status.n-able.com/2026/11/16/n-central-2026-4-hf3-release-notes/", "https://www.huntress.com/blog/n-able-disables-cloud-services-following-disclosure-of-able2shell-exploit-chains"]
  - claim_id: ee5d6adead
