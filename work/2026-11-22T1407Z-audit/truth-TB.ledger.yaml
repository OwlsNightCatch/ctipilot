  - claim_id: 4d7c46582b
    entry: 2026-11-10/n-able-n-central-33-unpatched-flaws-public-pocs-offline
    surface: "record 2026-11-18T05:12:35Z"
    kind: record-summary
    text: "N-able released Hotfix 3 (build 2026.4.1.39, 2026-11-16): 17 more CVE ids fixed, Agent and Probe authentication hardened, the Legacy API permanently blocked, and every Agent and Probe must be upgraded even from Hotfix 2. N-able does not say Hotfix 3 fixes 4EverAble2Shell or Agent2Shell, and Huntress reports public proof-of-concept code for all 17 ids."
  - claim_id: a669dd70bc
    entry: 2026-11-11/confluence-dc-cve-2026-90436-apache-axis-remote-api-rce
    surface: "headline"
    kind: frontmatter
    text: "Confluence Data Center: Axis RCE (Remote API on) now exploited in N-able N-central; update to 9.2.28 or disable it"
  - claim_id: c72da0c4bf
    entry: 2026-11-11/confluence-dc-cve-2026-90436-apache-axis-remote-api-rce
    surface: "summary"
    kind: frontmatter
    text: "Atlassian's advisory of 2026-11-09 says Apache Axis, which Confluence uses for its XML-RPC and SOAP APIs, has a critical remote-code-execution flaw (CVE-2026-90436, CVSS 4.0 9.3, no privileges or user interaction), exploitable in Confluence Data Center 1.x to 9.x only when the Remote API setting is enabled, which it is not by default for new installations. The fix is 9.2.28; the workaround is to clear the Remote API checkbox without a restart; Atlassian cannot confirm whether instances were affected and asks teams to check them; no source reports exploitation of Confluence, but the same flaw is exploited against N-able N-central servers that embed Axis."
  - claim_id: 5b8784e0f0
    entry: 2026-11-11/confluence-dc-cve-2026-90436-apache-axis-remote-api-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "On every Confluence Data Center instance, open General Configuration, Further Configuration and clear the Remote API (XML-RPC & SOAP) checkbox now (no restart), confirm the soap-axis1 confluenceservice-v2 servlet path answers HTTP 403, and upgrade to 9.2.28, because Atlassian cannot confirm whether instances were affected and asks teams to check them for compromise."
  - claim_id: 1c554b4eab
    entry: 2026-11-11/confluence-dc-cve-2026-90436-apache-axis-remote-api-rce
    surface: "cves[CVE-2026-90436]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-90436\", \"cvss\": \"9.3\", \"status\": [\"exploited\", \"cisa-kev\", \"patch-available\", \"mitigation-only\"], \"affected\": \"Confluence Data Center 1.x to 9.x with the Remote API (XML-RPC & SOAP) setting enabled; 10.x not affected; Cloud not affected\", \"fixed\": \"9.2.28; workaround: clear the Remote API (XML-RPC & SOAP) checkbox\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: e6dc9119d3
