    surface: "record 2026-11-12T04:20:00Z"
    kind: record-summary
    text: "Fortinet's advisories of 2026-11-10 carry ten more critical rows than the nine first listed across FortiAnalyzer, FortiManager, FortiOS, FortiMail and FortiClient, and the October builds do not fix every row: FortiAnalyzer and FortiManager 8.0 have no fixed build for CVE-2026-126170 until 8.0.3, FortiMail 7.2 awaits 7.2.10 for CVE-2026-126150, and FortiOS 7.0 and FortiAnalyzer and FortiManager 7.2 and 7.0 must migrate."
  - claim_id: 3ce322e193
