    surface: "record 2026-11-15T14:55:21Z"
    kind: record-summary
    text: "FortiAnalyzer and FortiManager 7.2 are fixed for CVE-2026-126229 in 7.2.13 and only 7.0 must migrate, so 7.2 owners update rather than migrate; the 7.6, 7.4 and 7.2 lines below their fixed builds are affected as well as 8.0. Fortinet added a virtual patch for the iBGP flaw CVE-2026-126254 on 2026-11-13, and FortiMail and FortiAuthenticator are dated to their 2026-10-21 release."
  - claim_id: f7438d6a72
