    text: "The fixed builds are unchanged (8.0.1 or above, 7.6.8, 7.4.13 and 7.2.14, with 7.0 migrating) and the revision says nothing about exploitation."
  - claim_id: b82c1a5f1c
    entry: 2026-10-23/fortinet-hardening-release-fortios-fortimanager-fortimail
    surface: "record 2026-11-11T03:50:56Z"
    kind: record-summary
    text: "Fortinet's withheld advisories were published on 2026-11-10 and name unauthenticated FortiMail code-execution, SQL-injection and IBE account-takeover flaws (CVSS up to 9.8), two FortiAuthenticator authentication bypasses (9.0 and 9.1), a FortiOS OSPF flaw reachable from the adjacent network and unauthenticated code execution through the FortiManager FGFM port; the fixed versions are unchanged and no exploitation is stated."
  - claim_id: 7c7dc0ab26
