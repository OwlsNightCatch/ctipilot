    text: "**Defender takeaway:** switch the Remote API off today and upgrade to 9.2.28, because the flaw is already exploited against another product's embedded Axis; because Atlassian asks for a compromise check, review the access logs of any instance that had the API enabled and was reachable from untrusted networks."
