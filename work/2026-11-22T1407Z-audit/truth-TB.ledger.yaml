    entry: 2026-10-23/fortinet-hardening-release-fortios-fortimanager-fortimail
    surface: "body"
    kind: derived
    text: "**Exposure:** FortiMail 8.0.0 to 8.0.1, 7.6.0 to 7.6.6, 7.4.0 to 7.4.8 or any 7.2; FortiAuthenticator 8.0.0 to 8.0.3 and 6.6.0 to 6.6.10; FortiOS below the fixed builds and any 7.0; FortiAnalyzer and FortiManager 8.0.0 to 8.0.2 or below 7.6.8, 7.4.12 or 7.2.13 (any 7.0), with the JSON API, oftp or FGFM port reachable; FortiClient 7.4.0 to 7.4.7 and, on Windows, 7.2.0 to 7.2.14."
  - claim_id: cd20458d6a
    entry: 2026-10-23/fortinet-hardening-release-fortios-fortimanager-fortimail
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** upgrade FortiMail, FortiAuthenticator and the internet-facing FortiOS, FortiManager and FortiAnalyzer units now; an unpatched FortiMail is exposed to the exploited flaw too."
  - claim_id: 2c8201ff2f
    entry: 2026-10-23/fortinet-hardening-release-fortios-fortimanager-fortimail
    surface: "body"
    kind: derived
    text: "On FortiAnalyzer and FortiManager 8.0 apply the rpc-permit workaround until 8.0.3 ships, plan migration off unfixed branches, and keep administrative interfaces and the FGFM and oftp ports off untrusted networks; where an HA segment is shared with less trusted hosts, set the HA password with encryption and authentication on fixed FortiOS builds."
