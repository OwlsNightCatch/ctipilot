    text: "PHP2Shell: Trend Micro Apex, Mobile Security and Analyzer patches out, Analyzer 7.5 gets none; Quest KACE, NetApp fixed"
  - claim_id: 403023ab7d
    entry: 2026-10-29/php2shell-trend-micro-apex-quest-kace-netapp-ontap
    surface: "summary"
    kind: frontmatter
    text: "Trend Micro posted Critical Patch build 7351 for Apex Central and build 20113 for Apex One Service Pack 1 on 2026-11-11, each upgrading PHP to 8.2.35 (the Apex One readme does not name the flaw), and its advisory, updated 2026-11-18, names both patches and lists critical patches 1020 for Deep Discovery Analyzer 7.7 and 1082 for 7.6 (none for 7.5, upgrade to 7.6) and for Deep Discovery Inspector and Email Inspector, while its Download Center carries a Mobile Security for Enterprise 9.8 SP5 patch dated 2026-11-17 that the advisory row has not caught up with; Quest says all KACE SMA and SDA versions are affected, with SMA 15.0 CU5 and 15.1 CU2 and the SDA 9.3 hotfix out and advice to block ports 80, 443 and 52230 until applied; and NetApp's advisory lists ONTAP 9 as affected only by CVE-2026-109618, with attacker access as the www user restricted to the PHP jail and hotfix builds from 9.12.1P20HF1 to 9.19.1P4. NetApp says it is aware of public discussion of the vulnerability and none of the three vendors reports an exploited case on its page, although CISA lists both flaws as exploited."
  - claim_id: b001f7ee7c
    entry: 2026-10-29/php2shell-trend-micro-apex-quest-kace-netapp-ontap
    surface: "actions[0]"
    kind: frontmatter
    text: "Install Trend Micro's Apex Central Critical Patch build 7351 and Apex One Service Pack 1 Critical Patch build 20113 (both released 2026-11-11; the Apex One readme updates PHP to 8.2.35 without naming the flaw) on every server now and keep their consoles on administrator networks until done; install Mobile Security for Enterprise 9.8 SP5 Critical Patch 10 (build 3461) and the Deep Discovery Analyzer critical patch for the installed version (1020 on 7.7, 1082 on 7.6; 7.5 gets none, so upgrade to 7.6 first); install the critical patches the table lists for Deep Discovery Inspector and Email Inspector."
  - claim_id: d426ac0cc1
    entry: 2026-10-29/php2shell-trend-micro-apex-quest-kace-netapp-ontap
    surface: "actions[1]"
    kind: frontmatter
    text: "Install KACE SMA 15.0 CU5 or 15.1 CU2 and the SDA 9.3 hotfix 9.3.313 (9.3.312 where already installed), and until then block inbound ports 80, 443 and 52230 to every appliance, as Quest advises."
