    surface: "body"
    kind: derived
    text: "**Exposure:** a Data Center instance on any 9.x or earlier release, with 9.2.28 the only fixed version listed, whose Remote API (XML-RPC & SOAP) setting is ticked; the setting sits under General Configuration, Further Configuration."
  - claim_id: bd2590c84c
    entry: 2026-11-11/confluence-dc-cve-2026-90436-apache-axis-remote-api-rce
    surface: "body"
    kind: derived
    text: "**Detection:** web access logs for requests to the soap-axis1 servlet path and the XML-RPC endpoint from unexpected sources, and child processes of the Confluence JVM that the application does not normally start; this is an inference from the attack mechanics, not a source statement."
  - claim_id: 97bf318959
