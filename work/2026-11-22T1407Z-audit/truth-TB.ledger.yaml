    entry: 2026-11-10/n-able-n-central-33-unpatched-flaws-public-pocs-offline
    surface: "headline"
    kind: frontmatter
    text: "N-central: Hotfix 3 fixes 17 more CVEs and blocks the Legacy API; 4EverAble2Shell exploited; upgrade Agents too"
  - claim_id: 0f7beeb315
    entry: 2026-11-10/n-able-n-central-33-unpatched-flaws-public-pocs-offline
    surface: "summary"
    kind: frontmatter
    text: "An independent researcher published proof-of-concept code on 2026-11-08 and 2026-11-09 for what Huntress counts as 33 critical flaws in N-able's N-central appliance, and a second disclosure on 2026-11-12 added 4EverAble2Shell, a chain through Apache Axis (CVE-2026-90436) that works against Hotfix 2 when the Legacy API is on and is exploited on at least 21 production servers, and Agent2Shell, SYSTEM commands on managed Windows endpoints. Hotfix 2 (build 2026.4.1.26, 2026-11-10) fixed seven CVE ids and Hotfix 3 (build 2026.4.1.39, 2026-11-16) fixes 17 more, hardens how Agents and Probes authenticate and blocks the Legacy API permanently, but N-able does not name either chain or say it is fixed; Huntress reports public proof-of-concept code for all 17 and no exploitation of them in its partners' environments. Every on-premises server and every Agent and Probe must be on Hotfix 3, including those already on Hotfix 2."
  - claim_id: 2fc6df07ba
    entry: 2026-11-10/n-able-n-central-33-unpatched-flaws-public-pocs-offline
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every on-premises N-central server to 2026.4 Hotfix 3 (build 2026.4.1.39) and every Agent and Probe to 2026.4.1 HF3 even if already on Hotfix 2, confirm the Legacy API is disabled and not reachable from the internet, and on any server that had the Legacy API on check the web logs for POST requests to the Axis endpoint /dms/services/ServerUI carrying a SOAP fault and the host for a symlink at the N-central flag file path, treating a hit as a full compromise, because public proof-of-concept code exists for all 17 new CVE ids, Hotfix 2 did not stop 4EverAble2Shell and N-able does not say Hotfix 3 fixes it."
