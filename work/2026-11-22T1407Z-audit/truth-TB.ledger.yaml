    surface: "section 2026-11-18T05:12:35Z"
    kind: cited
    text: "Among the 17 ids, the release notes title CVE-2026-129272 \"MMS3 appliance authentication bypass via predictable passcode\", CVE-2026-129280 \"ServerUI SOAP operations missing authorisation checks\" and CVE-2026-129286 \"SIS GenericFiles version path traversal leads to RCE\", and Huntress counts three critical, eight high and six medium scores, all assigned by N-able as CVE numbering authority ("
    urls: ["https://status.n-able.com/2026/11/16/n-central-2026-4-hf3-release-notes/", "https://www.huntress.com/blog/n-able-disables-cloud-services-following-disclosure-of-able2shell-exploit-chains"]
  - claim_id: bbe6c5f3dd
