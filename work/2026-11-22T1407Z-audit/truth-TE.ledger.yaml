    surface: "body"
    kind: cited
    text: "**Exposure:** OpenScape 4000 and OpenScape 4000 Manager at the releases above; the vulnerable component is the Platform, and the advisory does not say which of its interfaces are normally reachable ("
    urls: ["https://www.mitel.com/support/security-advisories/mitel-product-security-advisory-misa-2026-0013"]
