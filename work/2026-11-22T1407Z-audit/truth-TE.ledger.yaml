    text: "The chain deploys Monero miners, run with randomized syslog-themed process names, with at least four live workers; persistence is a modified crontab, an RSA public key appended to the authorized_keys of every accessible profile and an edited ~/.profile, and the attackers unset HISTFILE and purge the bash history ("
    urls: ["https://github.com/PaloAltoNetworks/Unit42-timely-threat-intel/blob/main/2026-10-07-XMRig-campaign-through-CVE-2026-90817.txt"]
