    urls: ["https://www.cert.cyber.gouv.fr/avis/CERTFR-2026-AVI-1569/", "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-4685"]
  - claim_id: d4c14f4650
