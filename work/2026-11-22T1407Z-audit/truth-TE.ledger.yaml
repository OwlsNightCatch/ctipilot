    text: "Ruby 4.0.10, 3.4.13, 3.3.14 fix seven memory flaws; a Rails exploit is announced for 25 November: update the interpreter"
  - claim_id: 1dd57ad846
    entry: 2026-11-20/ruby-4-0-10-regexp-case-conversion-memory-flaws
    surface: "summary"
    kind: frontmatter
    text: "The Ruby project released 4.0.10, 3.4.13 and 3.3.14 on 2026-11-18 for seven memory-corruption flaws in the regexp engine and in string case conversion, three rated Critical, and says it knows of proofs of concept that reach remote code execution. Veria Labs, which found the case-conversion flaw independently (CVE-2026-132825, a one-byte heap overflow), says Rails and classic-style Sinatra are exposed without authentication in their default configuration and plans to publish a code-execution proof of concept on stock Rails on 25 November 2026; no exploitation is reported. Ruby 3.2 and earlier are end of life, and the interpreter itself, not a gem, must be updated."
  - claim_id: 705dd8f3db
    entry: 2026-11-20/ruby-4-0-10-regexp-case-conversion-memory-flaws
    surface: "actions[0]"
    kind: frontmatter
    text: "Update the Ruby interpreter to 4.0.10, 3.4.13 or 3.3.14 on every application host, worker, CI runner and container image that runs Rails, Sinatra or other Ruby code that handles untrusted text, rebuild the images and restart the workers before Veria Labs' announced exploit of 25 November 2026, because updating a gem does not fix the interpreter and Rails is exposed in its default configuration."
  - claim_id: 298dc1f4b8
    entry: 2026-11-20/ruby-4-0-10-regexp-case-conversion-memory-flaws
    surface: "actions[1]"
