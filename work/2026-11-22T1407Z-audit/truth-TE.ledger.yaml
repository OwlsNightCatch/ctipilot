  - claim_id: 63e6ac6251
    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "body"
    kind: cited
    text: "The PHP project released 8.5.13, 8.4.28, 8.3.37, 8.2.36 and 8.6.0 on 2026-11-19, and the changelogs list up to 18 CVEs per branch ("
    urls: ["https://www.php.net/ChangeLog-8.php"]
  - claim_id: b6ee5e9ebd
    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "body"
    kind: cited
    text: "The most direct is CVE-2026-129289: when php://input was opened but not read to the end, PHP-FPM leaves the unread request bytes on a persistent FastCGI connection, so a malformed multipart body can place a second FastCGI request inside the first, and an unauthenticated attacker can bypass front-end routing and execute attacker-controlled PHP code with the privileges of the worker ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-qc49-hpvq-g2w6"]
  - claim_id: 62cc172523
    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "body"
    kind: cited
    text: "It requires a front end that enables persistent backend connections and an application path that opens php://input without reading it fully; standard nginx and Apache configurations that close the FastCGI connection after each request are not affected by the demonstrated attack ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-qc49-hpvq-g2w6"]
  - claim_id: 415c81a808
    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "body"
    kind: cited
    text: "Two session flaws close the item the October release left open ("
    urls: ["https://watchtowr.com/intelligence/php-cve-2026-115560-faq/"]
  - claim_id: ab1a619ad1
    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "body"
    kind: cited
    text: "): CVE-2026-115560, where upload-progress session data is written in one serializer format and read in another, and CVE-2026-126714, where an interrupted write by the default files handler leaves a mixed old and new session file; both end in object injection and need an object gadget chain in the application ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-658j-r8rw-q6mx", "https://github.com/php/php-src/security/advisories/GHSA-fm2m-fjf5-v3cp"]
  - claim_id: bfadca858f
    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "body"
    kind: cited
    text: "The fix for the first disables upload progress by default ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-658j-r8rw-q6mx"]
  - claim_id: 48af05ff8d
    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "body"
    kind: cited
    text: "CVE-2026-129481, a use-after-free of a stale session filename after an interrupted session shutdown, is in PHP's words an incomplete fix for CVE-2026-109619 and affects PHP 8.3 and later, and CVE-2026-129182, for PHP 8.5 only, covers further scenarios after the 8.5.12 fix ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-g3vh-838c-65v7", "https://github.com/php/php-src/security/advisories/GHSA-2fjv-p558-g82m"]
  - claim_id: 0efd6c0519
    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "body"
    kind: cited
    text: "CVE-2026-129474, PHP 8.5 only, is exposed on the built-in defaults, because fatal error backtraces are on in 8.5 and the default includes arguments, and php.ini-production, which sets zend.exception_ignore_args=1, or fatal_error_backtraces=0 prevents the attack; PHP confirmed code execution on 8.5 ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-8mjj-2r7p-4hg2"]
  - claim_id: fbf9d04767
    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "body"
    kind: cited
    text: "CVE-2026-129496 needs a startup diagnostic written through a file-based error_log in a non-thread-safe build ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-gr4f-wgx5-jpfv"]
  - claim_id: 7c493ebf0c
    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "body"
    kind: cited
    text: "CVE-2026-129291, an epoll use-after-free in PHP-FPM, gives root from a worker where catch_workers_output is on and the FPM master runs as root ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-jm4m-qfqx-967m"]
  - claim_id: f436767f13
    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "body"
    kind: cited
    text: "NCSC.ch lists exploitation as unknown with no public proof of concept referenced, and watchTowr reports none as of 2026-11-20 ("
    urls: ["https://security-hub.ncsc.admin.ch/#/posts/13212", "https://watchtowr.com/intelligence/php-cve-2026-115560-faq/"]
  - claim_id: 461ff8ca4d
    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "body"
    kind: cited
    text: "**Exposure:** PHP 8.5 without php.ini-production settings is exposed to CVE-2026-129474 on the defaults, when an application path enters a magic method ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-8mjj-2r7p-4hg2"]
  - claim_id: 6f547ddaa7
    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "body"
    kind: cited
    text: "For CVE-2026-129289, PHP-FPM servers whose front end keeps FastCGI backend connections open (nginx fastcgi_keep_conn on, Apache mod_proxy_fcgi enablereuse=on, HAProxy in FastCGI mode) and whose applications open php://input without consuming it, which the PHP advisory says some frameworks do; standard nginx and Apache setups are outside the demonstrated attack ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-qc49-hpvq-g2w6"]
  - claim_id: 886c471d32
    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** move the PHP runtime, not the CMS or its plugins, to the fixed build of its branch and restart PHP-FPM; where that waits, turn FastCGI connection reuse off ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-qc49-hpvq-g2w6"]
