    text: "REDCap unauthenticated survey-to-RCE chain exploited and on CISA KEV; upgrade to 16.0.49, 17.3.10 or 17.4.4"
  - claim_id: 84efb19727
    entry: 2026-11-19/redcap-cve-2026-90817-unauth-survey-rce-exploited-kev
    surface: "summary"
    kind: frontmatter
    text: "Securifera described CVE-2026-90817 on 2026-09-27, a five-step chain in Vanderbilt's REDCap research-data platform that turns a request to a public survey into code execution on the server without authentication, given a valid public survey hash (CVSS 3.1 9.8). Unit 42 reported it exploited on 2026-10-07 to install Monero miners behind a transient web shell, with cron, SSH-key and shell-profile persistence, and CISA added it to its Known Exploited Vulnerabilities catalog on 2026-11-18. The fixed builds are 16.0.49 LTS, 17.3.10 LTS and 17.4.4 Standard."
  - claim_id: a466274b77
    entry: 2026-11-19/redcap-cve-2026-90817-unauth-survey-rce-exploited-kev
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every REDCap server to 16.0.49 LTS, 17.3.10 LTS or 17.4.4 Standard and, on any server that was internet-reachable on an older build, check for transient Blade-template files under the web temp cache, crontabs, the authorized_keys of every account, ~/.profile and Monero miner processes, treating a hit as a server compromise, because Unit 42 saw the chain used for mining with persistence that an upgrade does not remove."
  - claim_id: ea9a627309
    entry: 2026-11-19/redcap-cve-2026-90817-unauth-survey-rce-exploited-kev
    surface: "cves[CVE-2026-90817]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-90817\", \"cvss\": \"9.8 (CVSS 3.1)\", \"status\": [\"exploited\", \"cisa-kev\", \"poc-public\", \"patch-available\"], \"affected\": \"REDCap 13.3.0 through 16.0.48 LTS, 17.3.9 LTS and 17.4.3 Standard\", \"fixed\": \"16.0.49 LTS, 17.3.10 LTS, 17.4.4 Standard\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: d39882a811
    entry: 2026-11-19/redcap-cve-2026-90817-unauth-survey-rce-exploited-kev
    surface: "body"
    kind: cited
    text: "The public survey handler checks the passthrough value in two forms, so a double-encoded value reaches the root index.php dispatcher while the route restriction is skipped; the project user-rights object is built before the respondent identity exists, so the public context receives the Data Import privilege and the POST CSRF check is skipped because NOAUTH is defined; the Data Import commit path trusts the posted file name as a local path or PHP stream; the byte-order-mark cleanup writes changed bytes back to the same stream, which turns a CSV cleanup into an arbitrary overwrite; and a compiled-template cache file is then rendered as PHP through a route that works without a login ("
    urls: ["https://www.securifera.com/blog/2026/09/27/survey-says-remote-code-execution-cve-2026-90817/"]
  - claim_id: fe2c432df4
    entry: 2026-11-19/redcap-cve-2026-90817-unauth-survey-rce-exploited-kev
    surface: "body"
    kind: cited
    text: "An attacker needs only a valid survey hash, with no account, project membership, session cookie, role or CSRF token ("
    urls: ["https://www.securifera.com/blog/2026/09/27/survey-says-remote-code-execution-cve-2026-90817/"]
  - claim_id: 1c3ad903ea
    entry: 2026-11-19/redcap-cve-2026-90817-unauth-survey-rce-exploited-kev
