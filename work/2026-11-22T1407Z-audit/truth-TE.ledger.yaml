    text: "Affected are OpenScape 4000 V11 R0.22 through V11 R2.11 and V10 R1.68 and earlier, and OpenScape 4000 Manager V11 R0.22 through V11 R2.11 and V10 R1.34, R1.42, R1.54 and R1.68; Mitel does not assess end-of-support releases ("
