    entry: 2026-11-19/tcherber-access-broker-fortigate-sonicwall-vpn-ldap-sweep
    surface: "headline"
    kind: frontmatter
    text: "Cyderes: 'tcherber' VPN toolkit for FortiGate and SonicWall, credential file mixing default and real logins, LDAP sweep"
  - claim_id: 4ff627fef6
    entry: 2026-11-19/tcherber-access-broker-fortigate-sonicwall-vpn-ldap-sweep
    surface: "summary"
    kind: frontmatter
    text: "Cyderes' Howler Cell recovered a Go toolkit that wraps OpenConnect for FortiGate and NetExtender for SonicWall, a credential file of more than 500 FortiGate entries mixing default guest, admin and test logins with organisation-specific passwords, and VPN connection logs showing sustained root-level tunnels into multiple victim environments in May and June 2026. Once the tunnel is up the orchestrator maps internal routes and enumerates Active Directory over LDAP, while port scanning, SMB reconnaissance and credential validation are manual tools. Cyderes assesses a Russian-speaking initial access broker and malware-as-a-service seller and names no victim, vulnerability or firmware version."
  - claim_id: 809821894d
    entry: 2026-11-19/tcherber-access-broker-fortigate-sonicwall-vpn-ldap-sweep
    surface: "actions[0]"
    kind: frontmatter
    text: "Audit every FortiGate and SonicWall VPN gateway for local accounts with default or guessed passwords (guest, admin, test) or passwords that appear in credential dumps, reset or remove them, and search VPN logs since May 2026 for logins by such accounts that are followed by a broad LDAP enumeration from the VPN address pool, because Cyderes found a broker's toolkit and logs showing root-level tunnels into multiple victims."
  - claim_id: dc429d851c
    entry: 2026-11-19/tcherber-access-broker-fortigate-sonicwall-vpn-ldap-sweep
    surface: "body"
    kind: cited
    text: "Cyderes' Howler Cell identified a database holding more than 500 FortiGate VPN credential entries and VPN connection records showing successful root-level tunnels into multiple victim environments during May and June 2026 ("
    urls: ["https://www.cyderes.com/howler-cell/exposing-tcherber"]
  - claim_id: c13c13678d
    entry: 2026-11-19/tcherber-access-broker-fortigate-sonicwall-vpn-ldap-sweep
    surface: "body"
    kind: cited
    text: "The recovered Go toolkit wraps OpenConnect with --protocol=fortinet for FortiGate, with a 30-second reconnect loop that keeps the tunnel up, and NetExtender for SonicWall, whose wrapper probes seven login URL paths and ten page patterns to find the authentication domain ("
    urls: ["https://www.cyderes.com/howler-cell/exposing-tcherber"]
  - claim_id: 7f5d0c703e
    entry: 2026-11-19/tcherber-access-broker-fortigate-sonicwall-vpn-ldap-sweep
    surface: "body"
    kind: cited
    text: "The credential file mixes default guest, admin and test logins with organisation-specific passwords, which Cyderes reads as both brute-force harvesting and credential-dump sourcing; the broker's forum advert claims the access came from brute-forcing and an \"exploit toolkit\", which Cyderes relays without confirming ("
    urls: ["https://www.cyderes.com/howler-cell/exposing-tcherber"]
  - claim_id: 2d67a7d41e
    entry: 2026-11-19/tcherber-access-broker-fortigate-sonicwall-vpn-ldap-sweep
    surface: "body"
    kind: cited
    text: "The orchestrator launches the FortiGate client in the background with a 20-second stabilization delay, maps internal subnets and gateways from the established tunnel, and runs an LDAP module that enumerates users, groups, domain structure and domain controllers; port scanning, SMB reconnaissance and credential validation sit in separate tools that the operator runs by hand ("
    urls: ["https://www.cyderes.com/howler-cell/exposing-tcherber"]
  - claim_id: bd39329584
    entry: 2026-11-19/tcherber-access-broker-fortigate-sonicwall-vpn-ldap-sweep
    surface: "body"
    kind: cited
    text: "Cyderes assesses a Russian-speaking operator working as both an initial access broker and a malware-as-a-service provider, with operations ongoing as of September 2026, and notes that the handle comes from a build-path username that one machine or several could share ("
    urls: ["https://www.cyderes.com/howler-cell/exposing-tcherber"]
  - claim_id: b0b77b6eaa
    entry: 2026-11-19/tcherber-access-broker-fortigate-sonicwall-vpn-ldap-sweep
    surface: "body"
    kind: cited
    text: "VMRay independently links the same build path to Zer0day Stealer and ENIGMA Locker and calls the same developer the likely author of an HVNC remote-control sample, without mentioning VPN access brokerage ("
    urls: ["https://www.vmray.com/news/one-leftover-build-path-links-an-infostealer-a-remote-access-tool-and-a-ransomware-family/"]
  - claim_id: 48e7661cb5
    entry: 2026-11-19/tcherber-access-broker-fortigate-sonicwall-vpn-ldap-sweep
    surface: "body"
    kind: cited
    text: "**Exposure:** a FortiGate or SonicWall VPN gateway reachable from the internet that accepts a local account with a default or guessed password, or a password that appears in a credential dump; Cyderes names no vulnerability or firmware version and does not discuss multi-factor authentication ("
    urls: ["https://www.cyderes.com/howler-cell/exposing-tcherber"]
  - claim_id: 5847d2821b
    entry: 2026-11-19/tcherber-access-broker-fortigate-sonicwall-vpn-ldap-sweep
    surface: "body"
    kind: cited
    text: "**Detection:** VPN gateway logs for successful logins by default-named accounts and for repeated reconnect attempts from one source about every 30 seconds, the interval of the FortiGate client's retry loop; after the tunnel is up, route parsing and a broad LDAP enumeration of users, groups and domain controllers from an address in the VPN pool follow from the toolkit's orchestrator ("
    urls: ["https://www.cyderes.com/howler-cell/exposing-tcherber"]
  - claim_id: 3797437d7d
    entry: 2026-11-19/tcherber-access-broker-fortigate-sonicwall-vpn-ldap-sweep
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** audit VPN credentials on FortiGate and SonicWall appliances, which is Cyderes' own recommendation, and treat default-named accounts and dumped passwords as the entry the toolkit relies on ("
    urls: ["https://www.cyderes.com/howler-cell/exposing-tcherber"]
  - claim_id: 145e4d0735
    entry: 2026-11-20/mitel-openscape-4000-misa-2026-0013-unauth-cvss-10
    surface: "headline"
    kind: frontmatter
    text: "Mitel OpenScape 4000: two unauthenticated CVSS 10.0 Platform flaws; upgrade to V11 R2.14 or restrict access"
  - claim_id: 2d760030d2
    entry: 2026-11-20/mitel-openscape-4000-misa-2026-0013-unauth-cvss-10
    surface: "summary"
    kind: frontmatter
    text: "Mitel's advisory MISA-2026-0013 of 2026-11-18 covers three flaws in the Platform component of OpenScape 4000 and OpenScape 4000 Manager: an unauthenticated improper-authentication flaw and an unauthenticated command injection, both CVSS 3.1 10.0, and a command injection reachable from the adjacent network (9.6). CVE ids have been requested but not assigned; the fix is V11 R2.14, PLT HF5 on V11 R1.26 or a patch for V10 R0.28 to V11 R0.22, and enabling Security Mode restricted access is Mitel's workaround. The advisory says nothing about exploitation, and it is the second critical Mitel advisory in a week."
  - claim_id: e1c363053b
    entry: 2026-11-20/mitel-openscape-4000-misa-2026-0013-unauth-cvss-10
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every OpenScape 4000 and OpenScape 4000 Manager to V11 R2.14, apply PLT HF5 on V11 R1.26 or Mitel's patch on V10 R0.28 to V11 R0.22, and until then enable Security Mode restricted access as Mitel's workaround article KB000129263 describes, because two unauthenticated Platform flaws are rated CVSS 10.0."
  - claim_id: 6fdd5ec391
    entry: 2026-11-20/mitel-openscape-4000-misa-2026-0013-unauth-cvss-10
    surface: "body"
    kind: cited
    text: "Mitel's advisory MISA-2026-0013 of 2026-11-18 covers three flaws in the Platform component of OpenScape 4000 and OpenScape 4000 Manager, tracked by Mitel's internal ids because the CVE identifiers it requested are not yet assigned ("
