    surface: "body"
    kind: cited
    text: "); where the techniques Symantec lists are found, assume Active Directory credentials are exposed and plan a krbtgt reset and wider credential rotation ("
    urls: ["https://www.security.com/threat-intelligence/power-management-software-attack-vector"]
  - claim_id: 1d9a873a53
    entry: 2026-11-19/idunno-anticsrf-cve-2026-131914-exploited-no-patch-w3wp-rce
    surface: "headline"
    kind: frontmatter
    text: "Idunno.AntiCsrf (ASP.NET WebForms) unauthenticated deserialization RCE exploited, no patch: remove the module"
  - claim_id: 79fbe485a7
    entry: 2026-11-19/idunno-anticsrf-cve-2026-131914-exploited-no-patch-w3wp-rce
    surface: "summary"
    kind: frontmatter
    text: "Mandiant published CVE-2026-131914 on 2026-11-18 for Idunno.AntiCsrf, an open-source anti-CSRF HTTP module for ASP.NET WebForms last released in December 2008: any anonymously reachable page that does not opt out passes a crafted CSRF form field to an unvalidated deserializer, so one POST runs code in the IIS worker process (CVSS 4.0 9.3). Mandiant states that exploitation in the wild has been observed, names no actor, and says the project has no active maintainer or official patch, so the fix is to remove the module, and Mandiant adds that environments with evidence of exploitation should rotate the secrets held in the web configuration and inspect the web root."
  - claim_id: c9bbedfb41
    entry: 2026-11-19/idunno-anticsrf-cve-2026-131914-exploited-no-patch-w3wp-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "Search every ASP.NET WebForms application's Web.config and bin directory for Idunno.AntiCsrf by name, not by file hash because recompiled copies keep the flaw, and remove the module and its DLL, replacing it with a supported anti-forgery mechanism; on any server with evidence of exploitation, such as IIS requests to .aspx pages that returned 302 or 500 with unusually large request sizes, rotate the machineKey, encryption keys and database credentials in Web.config and applicationHost.config, because Mandiant observed exploitation and no patch exists."
  - claim_id: 2db503fcc7
    entry: 2026-11-19/idunno-anticsrf-cve-2026-131914-exploited-no-patch-w3wp-rce
    surface: "cves[CVE-2026-131914]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-131914\", \"cvss\": \"9.3 (CVSS 4.0)\", \"status\": [\"exploited\", \"no-patch\"], \"affected\": \"Idunno.AntiCsrf.dll 0.9.1.0 (0.9.1 Beta) and earlier, including internally recompiled copies\", \"fixed\": \"none; the project is defunct and Mandiant says to remove the module\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: aed56b9df2
    entry: 2026-11-19/idunno-anticsrf-cve-2026-131914-exploited-no-patch-w3wp-rce
    surface: "body"
    kind: cited
    text: "Mandiant published advisory MNDT-2026-0048 and CVE-2026-131914 on 2026-11-18 for Idunno.AntiCsrf, a defunct open-source anti-CSRF HTTP module for ASP.NET WebForms, last released as 0.9.1 Beta in December 2008 on the since-retired CodePlex platform and with no active maintainer or official patch ("
    urls: ["https://github.com/mandiant/Vulnerability-Disclosures/blob/master/2026/MNDT-2026-0048.md"]
  - claim_id: 2d73adc2a1
    entry: 2026-11-19/idunno-anticsrf-cve-2026-131914-exploited-no-patch-w3wp-rce
    surface: "body"
    kind: cited
    text: "In the module's PreRequestHandlerExecute step, once the CSRF cookie and the CSRF form field are both non-empty, it deserializes the form field with a parameterless ObjectStateFormatter, which performs no MAC, signature, encryption or machineKey validation and enforces no SerializationBinder restrictions, so a crafted serialized .NET object in that field runs code in the IIS worker process, w3wp.exe; one POST with no prior authentication or valid CSRF token suffices ("
    urls: ["https://github.com/mandiant/Vulnerability-Disclosures/blob/master/2026/MNDT-2026-0048.md"]
  - claim_id: c16c30fb24
    entry: 2026-11-19/idunno-anticsrf-cve-2026-131914-exploited-no-patch-w3wp-rce
    surface: "body"
    kind: cited
    text: "The module runs before the page lifecycle, so any anonymously reachable .aspx page, or any page that relies on application-level session checks inside Page_Load, is reachable unless it opts out through ISuppressCsrfCheck or the SuppressCsrfCheck attribute; pipeline-level authentication rules run earlier and keep anonymous requests away from pages they protect ("
    urls: ["https://github.com/mandiant/Vulnerability-Disclosures/blob/master/2026/MNDT-2026-0048.md"]
  - claim_id: 579c8be039
    entry: 2026-11-19/idunno-anticsrf-cve-2026-131914-exploited-no-patch-w3wp-rce
    surface: "body"
    kind: cited
    text: "After the sink the module raises its own error, so the response is HTTP 302 when customErrors is active and HTTP 500 when its mode is Off, and recompiled or customised copies keep the sink under different file hashes ("
    urls: ["https://github.com/mandiant/Vulnerability-Disclosures/blob/master/2026/MNDT-2026-0048.md"]
  - claim_id: e734a990a4
    entry: 2026-11-19/idunno-anticsrf-cve-2026-131914-exploited-no-patch-w3wp-rce
    surface: "body"
    kind: cited
    text: "Mandiant states that active exploitation in the wild has been observed, names no actor, and says Google's FLARE team completed the root-cause analysis during an incident-response investigation on 2026-11-04 ("
    urls: ["https://github.com/mandiant/Vulnerability-Disclosures/blob/master/2026/MNDT-2026-0048.md"]
  - claim_id: 7db585b605
    entry: 2026-11-19/idunno-anticsrf-cve-2026-131914-exploited-no-patch-w3wp-rce
    surface: "body"
    kind: cited
    text: "); the ENISA record scores the flaw CVSS 4.0 9.3 ("
    urls: ["https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-129432"]
  - claim_id: ffa5ca0fac
    entry: 2026-11-19/idunno-anticsrf-cve-2026-131914-exploited-no-patch-w3wp-rce
    surface: "body"
    kind: cited
    text: "**Exposure:** an ASP.NET WebForms application whose Web.config registers Idunno.AntiCsrf.AntiCsrfModule under httpModules or modules, or whose bin directory holds Idunno.AntiCsrf.dll; Mandiant says to search by name, not by hash ("
    urls: ["https://github.com/mandiant/Vulnerability-Disclosures/blob/master/2026/MNDT-2026-0048.md"]
  - claim_id: 06946d19c2
    entry: 2026-11-19/idunno-anticsrf-cve-2026-131914-exploited-no-patch-w3wp-rce
    surface: "body"
    kind: cited
    text: "**Detection:** IIS logs for anomalous POST requests to .aspx endpoints that return 302 or 500 with elevated request size (cs-bytes, where logged), carrying the module's default cookie __CSRFCOOKIE and form field __CSRFTOKEN, and process-creation telemetry for children of w3wp.exe, which follows from code execution in the worker; if the csrfSettings section is omitted from Web.config, a setter bug overwrites the fallback form field name with RaiseException, so the default field name is not a reliable hunting key on every deployment ("
    urls: ["https://github.com/mandiant/Vulnerability-Disclosures/blob/master/2026/MNDT-2026-0048.md"]
  - claim_id: 9dd0d7dac0
    entry: 2026-11-19/idunno-anticsrf-cve-2026-131914-exploited-no-patch-w3wp-rce
    surface: "body"
    kind: cited
    text: "**Triage:** the module's own tokens are a GUID cookie and a short serialized GUID in the form field, so a cookie that is not a GUID, or a large Base64 value in the CSRF form field, is not legitimate token traffic ("
    urls: ["https://github.com/mandiant/Vulnerability-Disclosures/blob/master/2026/MNDT-2026-0048.md"]
  - claim_id: d329400ebf
    entry: 2026-11-19/idunno-anticsrf-cve-2026-131914-exploited-no-patch-w3wp-rce
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** remove the module and its DLL and replace it with a supported anti-forgery mechanism, since no patch exists; on environments with evidence of exploitation, Mandiant says to rotate all secrets stored in Web.config and applicationHost.config, machineKey and encryption keys and database credentials included, and to inspect the web roots for unauthorized files ("
    urls: ["https://github.com/mandiant/Vulnerability-Disclosures/blob/master/2026/MNDT-2026-0048.md"]
  - claim_id: 34f8596905
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "headline"
    kind: frontmatter
    text: "NGINX nginx2root: five unauthenticated flaws reach worker RCE, Rapid7 PoC public; update 1.31.9, 1.30.7 or Plus 37.3.0.1"
  - claim_id: d58fae40c6
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "summary"
    kind: frontmatter
    text: "F5 and the nginx project fixed five memory-corruption flaws in the nginx data plane on 2026-11-18, two in HTTP/2 and one each in HTTP/3, the resolver and the mail proxy, which CERT-EU says can lead to unauthenticated code execution with the privileges of the worker process; NCSC-NL scores all five CVSS 4.0 9.2, NCSC.ch and Wiz the two HTTP/2 flaws and Rapid7 CVE-2026-123007. The fixes are in nginx 1.31.9 and 1.30.7 and NGINX Plus 37.3.0.1 and 37.0.8.1, while NGINX Plus R33 to R36 have no update. Rapid7 published a proof of concept for CVE-2026-123007, CERT-EU reports no exploitation, and NCSC.ch, CERT-EU, CERT.at and NCSC-NL issued warnings. Palo Alto Networks lists PAN-OS and Panorama with HTTP/2 enabled as affected, Cisco, Siemens and Synology list products with fixes pending or none, Fortinet confirms FortiOS, FortiProxy and FortiMail not impacted and is still investigating FortiManager, FortiAnalyzer, FortiAuthenticator and dozens of other products."
  - claim_id: 466c9ea7d9
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "actions[0]"
    kind: frontmatter
    text: "On every PAN-OS firewall and Panorama with the HTTP/2 option enabled, upgrade to 12.2.4-h3, 12.1.10-h6 or 11.2.16-h3 or later (12.1.7-h15, 11.2.10-h19 and 11.2.13-h6 are listed with a 2026-11-23 ETA) or disable HTTP/2, because Palo Alto Networks lists CVE-2026-123007 and CVE-2026-123633 as affecting them with that option on."
  - claim_id: 5c892bdcf2
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "actions[1]"
    kind: frontmatter
    text: "Update every internet-facing nginx to 1.31.9 or 1.30.7 (NGINX Plus to 37.3.0.1 or 37.0.8.1) and restart the process, because a reload does not replace the running executable; Ubuntu lists the fixes in USN-9159-1 for 16.04 LTS to 26.10, those for 16.04, 18.04 and 20.04 being available with Ubuntu Pro; where the update waits, disable HTTP/2 on exposed listeners, which blocks only CVE-2026-123007 and CVE-2026-123633, since five unauthenticated flaws reach code execution as the worker and Rapid7's proof of concept for one of them is public."
  - claim_id: ccc851f51d
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "actions[2]"
    kind: frontmatter
    text: "Update every Synology DSM 7.4 to 7.4.1-90080-2 and every DSM 7.3 to 7.3.2-86009-6 (Synology recommends 7.3.2-86009-6 or above for DSM 7.2.x), and on DSM 7.2.x, 7.1 and BeeStation OS, where the fix is listed as ongoing, turn HTTP/2 off under Control Panel, Network, Connectivity, because CVE-2026-123007 affects DSM with HTTP/2 enabled."
