    entry: 2026-11-19/redcap-cve-2026-90817-unauth-survey-rce-exploited-kev
    surface: "body"
    kind: cited
    text: "Unit 42's note of 2026-10-07 reports active exploitation: an unauthenticated POST to a public survey URL stages a transient Blade-template web shell under the temp cache, run by php-fpm with the web server's permissions, which executes a Base64 bash cradle entirely in memory and pipes a payload disguised as a JPEG into bash ("
    urls: ["https://github.com/PaloAltoNetworks/Unit42-timely-threat-intel/blob/main/2026-10-07-XMRig-campaign-through-CVE-2026-90817.txt"]
