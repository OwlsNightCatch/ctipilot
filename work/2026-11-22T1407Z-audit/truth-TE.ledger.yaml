    kind: cited
    text: "The issues are corrected in V11 R2.14, Mitel provides PLT HF5 for V11 R1.26 and a patch for V10 R0.28 to V11 R0.22 (for the Manager, V10 R1.34 to V11 R0.22), and for customers who cannot apply the fix quickly, enabling Security Mode restricted access is a workaround that prevents exploitation, with the steps in a portal-only article ("
