- entry: 2026-11-18/drupal-core-critical-release-2026-11-18-psa-2026-11-16
  verdict: factual-error
  findings:
  - code: F4
    claim_id: a3383ed0c6
    where: title, headline, summary, body paragraph 3 ("neither advisory reports exploitation"), Update section last sentence and updates[] record summary ("No exploitation is reported."); sourcing_note; cves[CVE-2026-132165].status
    defect: 'The entry states "no exploitation is reported" / "no source reports exploitation" and carries SA-CORE-2026-017 as "Critical", status [patch-available], tags without actively-exploited. Drupal revised SA-CORE-2026-017 after the last record (2026-11-19T05:02:14Z): the page now opens with an exploitation update and rates it Highly critical, exploit maturity Exploit.'
    ground_truth: 'SA-CORE-2026-017 (article:modified_time 2026-11-21T16:14:36Z): "Update: the Security Team has received a report this was exploited on live sites as early as 2026-11-19 19:00 UTC." Title "Drupal core - Highly critical - Remote code execution - SA-CORE-2026-017".'
    ground_truth_url: https://www.drupal.org/sa-core-2026-017
    fix: 'Append an update record: Highly critical, exploitation reported from 2026-11-19 19:00 UTC; change title/headline/summary to say exploited, move cves[CVE-2026-132165].status to include exploited, add tag actively-exploited, drop every "no exploitation reported" statement (body paragraph 3, Update section, sourcing_note).'
  - code: F4
    claim_id: fc85bb8764
    where: 'body paragraph 1 and Update section: "SA-CORE-2026-017 (CVE-2026-132165, rated Critical 18 of 25, with access complexity Complex, access none, exploit status Proof, meaning a proof of concept exists ...)" and "The 18 of 25 rating in the pre-announcement is SA-CORE-2026-017''s"'
    defect: The rating and exploit-maturity gloss no longer match the advisory the sentence is cited to.
    ground_truth: 'Drupal advisory feed item for SA-CORE-2026-017: "Security risk: Highly critical 20 ∕ 25 AC:Complex/A:None/CI:All/II:All/E:Exploit/TD:Uncommon" (the PSA of 2026-11-16 carried "Critical 18 ∕ 25 ... E:Proof"). SA-CORE-2026-018 is unchanged: "Moderately critical 14 ∕ 25 ... E:Theoretical".'
    ground_truth_url: https://www.drupal.org/security/rss.xml
    fix: State the current rating (Highly critical 20 of 25, exploit status Exploit, meaning exploit code or exploitation is known) and keep the PSA 18 of 25 only as the pre-announcement figure.
  - code: F16
    claim_id: null
    where: 'frontmatter priority: notable'
    defect: notable on a pre-authentication code-execution flaw in a CMS widely used in Swiss public-sector web estates, now with a vendor-reported exploitation of live sites.
    ground_truth: 'SA-CORE-2026-017: "A:None" (no access needed), "Update: the Security Team has received a report this was exploited on live sites as early as 2026-11-19 19:00 UTC.", fix released 2026-11-18 (in window). High-bar elements all present: exploited, plausible constituency exposure, decision within 7 days; the critical bar (exploited now, time-critical) is arguable given TD:Uncommon ("only uncommon module configurations are exploitable", the entry''s own gloss).'
    ground_truth_url: https://www.drupal.org/sa-core-2026-017
    fix: Raise to high at least (critical is a judgement call on the TD:Uncommon qualifier) when the exploitation update is recorded.
  length_note: body 465 words; headline 109 chars.
  notes:
  - SA-CORE-2026-018, PSA-2026-11-16, NCSC.ch hub 13196 and NCSC-NL ncsc-2026-0507 statements otherwise verified (the three PSA evidence quotes and the SA-018 quote are verbatim in the Drupal advisory feed items; the SA-018 and PSA pages themselves return a client challenge to extract).
- entry: 2026-11-18/microsoft-agent-framework-pypi-credential-stealer-pth-hook
  verdict: imprecision
  findings:
  - code: F4
    claim_id: null
    where: 'frontmatter evidence[2]: quote "How the attacker got publishing access is not known yet." attributed to SafeDep (named lead from the cited-page pre-pass)'
    defect: 'Decision: page revised since, not a fabricated quote. The sentence is a contiguous passage of the page as the entry''s run read it (work/2026-11-18T0356Z-intel/bodies/FU2/agentfw/safedep.extract.md line 38: "How the attacker got publishing access is not known yet. This is the second Microsoft package on PyPI ..."). SafeDep has since added an "Update (18 November 2026)" and a section "A maintainer account created the same day" and replaced the sentence; it no longer appears, so the literal check fails against the live page.'
    ground_truth: 'Current page on the access route: "PyPI lists a second maintainer on agent-framework, `vibiret`. The account joined PyPI on 17 November 2026, the day both malicious versions went up." / "The join date points to `vibiret` as the account that uploaded 1.26.1 and 1.26.2. Neither PyPI nor Microsoft has released the upload log that would confirm it. How the account got maintainer access is not known."'
    ground_truth_url: https://safedep.io/blog/microsoft-agent-framework-pypi-compromise
    fix: Noted and left per the brief for the page edit itself; when the entry next gets a record, replace the quote with "How the account got maintainer access is not known." and add the vibiret finding.
  - code: F3
    claim_id: 222ae40928
    where: 'body paragraph 1: "SafeDep ... says the project is Microsoft''s official metapackage, published under the microsoft account on PyPI, that 1.26.1 appeared at 20:35 UTC ..."'
    defect: The "published under the microsoft account" clause was on the page when the entry was written ("The project is published under the `microsoft` account on PyPI") but SafeDep replaced it; the live page now says the project has two maintainers and that the join date points to the second account as the uploader.
    ground_truth: '"PyPI lists two maintainers for the project, `microsoft` and `vibiret`." / "PyPI does not publish who uploaded a file. The join date points to `vibiret` as the account that uploaded 1.26.1 and 1.26.2."'
    ground_truth_url: https://safedep.io/blog/microsoft-agent-framework-pypi-compromise
    fix: 'Replace with the current wording: two maintainers (microsoft and vibiret, the latter created 2026-11-17); uploader not confirmed by PyPI or Microsoft.'
  - code: F8
    claim_id: b000643460
    where: actions[0] and Defender takeaway ("pin agent-framework to 1.26.0 or earlier" / "pin agent-framework to a known clean version"), frontmatter summary
    defect: 'Publisher revision after the entry: SafeDep now reports a same-day maintainer account with publishing rights on five sibling projects and says a pin on agent-framework alone is not enough. The entry carries none of it, so its pin advice is incomplete.'
    ground_truth: '"Lock the whole dependency tree with hashes. A pin on agent-framework alone leaves its four sibling dependencies free to update." / "Hold off on any new release of agent-framework or the five sibling projects until Microsoft removes `vibiret` and confirms the releases are clean." / "Besides agent-framework, it can publish to the five projects below" (agent-framework-openai, -purview, -redis, -tools, -postgres).'
    ground_truth_url: https://safedep.io/blog/microsoft-agent-framework-pypi-compromise
    fix: Append an update record with the vibiret / sibling-package exposure and change the action to lock the full dependency tree with hashes and hold sibling-project updates until Microsoft confirms clean releases.
  length_note: body 438 words; headline 112 chars.
  notes:
  - 'PyPI JSON API checked 2026-11-22: latest 1.26.0, 1.26.1 and 1.26.2 absent from the release list (sourcing_note holds). Socket and the remaining SafeDep claims verified.'
