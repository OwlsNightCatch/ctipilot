    claim_id: d6a506f36b
    where: headline "...; none exploited", title "no row is marked exploited", summary "No source reports exploitation of any of these rows", sourcing_note "no third-party write-up of any of them was found"
    defect: Three of the 56 unauthenticated 9.8 rows the entry itself lists (Communications Diameter Signaling Router PMAC (Node.js), Communications Unified Assurance Core (Brotli), PeopleSoft PeopleTools OpenSearch Dashboards (Node.js)) are the Brotli flaw CVE-2026-111497, which CISA lists as exploited (KEV, added 2026-10-27); the store's own entry on that flaw is tagged actively-exploited. The body mentions the three rows without saying so.
    ground_truth: 'CISA KEV: "cveID": "CVE-2026-111497", "vendorProject": "Google", "product": "Brotli", "vulnerabilityName": "Google Brotli Unchecked Return Value Vulnerability", "dateAdded": "2026-10-27". Oracle matrix rows: "CVE-2026-111497 | Oracle Communications Unified Assurance | Core (Brotli) | HTTP | Yes | 9.8" and the DSR and PeopleTools rows.'
    ground_truth_url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    fix: 'Scope the statement: "no exploitation of the other rows is reported; the three CVE-2026-111497 (Brotli) rows are KEV-listed as exploited", in headline, summary, sourcing_note and the body sentence about the three rows; consider adding the KEV status to that sentence with a cite.'
  length_note: body 389 words; headline 110 chars.
  notes:
