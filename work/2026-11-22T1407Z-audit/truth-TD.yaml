- entry: 2026-11-18/riken-fugaku-rikyu-intrusion-status-dashboard-ssh-keys
  verdict: imprecision
  findings:
  - code: F8
    claim_id: 0d1c17f097
    where: body paragraph 1 ("took or may have taken files in users' home directories ... credentials users had stored"), summary, Defender takeaway; no updates[] record
    defect: 'RIKEN issued a second notice on 2026-11-20 after the entry (no record appended): credential exfiltration is now confirmed with counts, and more personal data is confirmed taken. The entry still carries the first notice''s hedged wording and no counts.'
    ground_truth: '"We have confirmed evidence that authentication credentials (such as SSH private keys) used to connect to external systems ... were collected and exfiltrated from the home directories of some users." Breakdown: "Private keys without passphrases: 233 instances / Private keys with passphrases: 197 instances (Total: 430 instances)". "Newly confirmed items: Information entered during account registration (address, affiliation, other demographic information, contact information such as phone numbers), and records of identity verification status". "we have identified traces indicating that an intruder(s) accessed the targeted information"; remediation now includes "separating public services from the administrative network"; police cooperation with Saitama and Hyogo Prefectural Police.'
    ground_truth_url: https://www.riken.jp/en/news_pubs/news/2026/20261120_1/index.html
    fix: 'Append an update record: 430 keys confirmed exfiltrated (233 without passphrase, 197 with), newly confirmed account-registration and identity-verification data, access traces identified, resumption conditional on separating public services from the admin network.'
  length_note: body 368 words; headline 109 chars.
  notes:
  - The first notice (page unchanged, same fingerprint) supports every claim in the entry, including the 4,222 + 375 = 4,597 reconciliation in the sourcing_note. techniques[] omits a Valid Accounts / remote-services mapping for the confirmed attempts to connect to other systems with obtained credentials (advisory only).
