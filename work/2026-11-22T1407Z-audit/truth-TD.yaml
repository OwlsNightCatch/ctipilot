- entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
  verdict: imprecision
  findings:
  - code: F3
    claim_id: 082d531d75
    where: 'Improvement section 2026-11-20T05:12:02Z, second paragraph: "The fix is in the same Puppet Enterprise builds, in Puppet Core 9.1.3 and 8.22.2 and, for OpenVox Server and OpenVoxDB, in 9.2.0 and 8.18.0 ([SecurityWeek, 2026-11-18]; [OpenVox, 2026-11-03] GHSA-q4hm-33rc-572g)"'
    defect: 'Adjacency: the OpenVoxDB part of the clause rests on neither cited page. SecurityWeek names no OpenVox or OpenVoxDB version at all, and GHSA-q4hm lists one package, OpenVox Server (affected "<= 9.1.0 and <= 8.17.0", patched "9.2.0 and 8.18.0"); the word "openvoxdb" appears on neither page. The same applies to cves[CVE-2026-115732].affected/fixed "OpenVox Server and OpenVoxDB up to 9.1.0 and 8.17.0 / 9.2.0, 8.18.0".'
    ground_truth: 'oss-security (cited elsewhere in the entry): "openvoxdb versions 9.2.0 and 8.18.0" and Vox Pupuli table "| `openvoxdb` | 8.18.0 | 9.2.0 |" carry the OpenVoxDB figures; GHSA-q4hm sidebar: Package "OpenVox Server", Patched versions "9.2.0 and 8.18.0".'
    ground_truth_url: https://www.openwall.com/lists/oss-security/2026/11/03/14
    fix: Add the oss-security / Vox Pupuli citation to the OpenVoxDB clause (or drop OpenVoxDB from the SecurityWeek / GHSA-q4hm clause).
  - code: F3
    claim_id: 07e0cf704b
    where: frontmatter cves[CVE-2026-115731].affected / fixed (OpenVox) (low confidence)
    defect: (low confidence) The record binds "OpenVox Server up to 9.1.0 and 8.17.0" to CVE-2026-115731, but that range is the one GHSA-q4hm states for the other flaw (CVE-2026-115732). The per-CVE authority for 115731 (GHSA-ffr6-rwpm-p5wq) names the package OpenVox Agent, affected "<= 9.2.0 and <= 8.31.1", patched "9.3.0 and 8.32.0"; the entry carries no OpenVox Agent fix version for this flaw.
    ground_truth: 'GHSA-ffr6-rwpm-p5wq sidebar: Package "OpenVox Agent"; Affected versions "<= 9.2.0 and <= 8.31.1"; Patched versions "9.3.0 and 8.32.0". oss-security: "openvox-agent versions 9.3.0 and 8.32.0 / openvox-server versions 9.2.0 and 8.18.0".'
    ground_truth_url: https://github.com/OpenVoxProject/openvox/security/advisories/GHSA-ffr6-rwpm-p5wq
    fix: Add OpenVox Agent 9.3.0 and 8.32.0 to cves[CVE-2026-115731] affected/fixed (and to the action) alongside the server builds 9.2.0 and 8.18.0.
  - code: F16
    claim_id: null
    where: 'frontmatter priority: notable (low confidence)'
    defect: (low confidence) notable on a CISA KEV-listed, exploited code-execution flaw in a configuration-management server that yields the CA signing key (and, per Neodyme and NCSC.ch, reach into every managed node).
    ground_truth: 'CISA KEV (catalogue 2026.11.20): CVE-2026-115731 dateAdded 2026-11-17, "knownRansomwareCampaignUse": "Unknown"; NCSC.ch hub 13204: "Current exploitation status: Actively Exploited, Proof of Concept Available". High-bar elements: exploited in the window, plausible constituency exposure (config management in public-sector IT), upgrade plus autosign review inside 7 days. The argument for staying notable is that exposure needs network reach to the Puppet server and a CA-signed certificate.'
    ground_truth_url: https://security-hub.ncsc.admin.ch/#/posts/13204
    fix: Consider priority high; keep notable only if the editorial judgement is that Puppet servers are rarely reachable by untrusted clients in this constituency.
  length_note: body 663 words (main analysis 406 + Improvement section 257); over the 550 bound only in total. Headline 104 chars.
  notes:
  - 'Release-notes citation labelled 2026-11-12: the page now reads "Last published: November 19, 2026" and "Released November 2026"; the original run recorded the footer "Last published: November 12, 2026", so the page was republished after the entry; its fixes list now carries both CVE-2026-115731 and CVE-2026-115732. Noted, left.'
