    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "record 2026-10-27T03:45:25Z"
    kind: record-summary
    text: "Seoul police referred the leader of a criminal group to prosecutors on 2026-10-23 for stealing 8.2 million records from more than 90 organizations, hospitals and universities among them, and extorting 38; BleepingComputer reports that the group used ARTEX, so the framework is now documented in criminal extortion use as well as in Storm-0940's state-aligned activity."
  - claim_id: 50bb26b709
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "record 2026-11-01T03:29:45Z"
    kind: record-summary
    text: "Google Threat Intelligence Group and Mandiant report that since late August they have seen ARTEX, PentAGI and CAIRN operated inside incident-response cases, with ARTEX adopted by extortion groups and suspected PRC-nexus clusters whose victims include US government organizations; they track the Wiz-observed ARTEX campaign as UNC7228, overlapping Storm-0940, and say the original ARTEX repository was taken down in October while forks keep spreading it. The agent's log signature is bursts of roughly 2 to 25 seconds, error-driven retries and, in one case, MySQL general-log changes likely intended to write JSP web shells."
  - claim_id: 84278d23a9
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "record 2026-11-07T03:50:15Z"
    kind: record-summary
    text: "Microsoft reports that Storm-3358, a Cambodia-based, financially motivated cluster, has used ARTEX since October 2026 against financial organisations, pairing it with conventional scanners and installing the open-source remote access tools WISP, vshell and AdaptixC2; Check Point Research reads ten exposed operator consoles showing campaigns that run almost autonomously once a goal is set, and Microsoft says honeypots, decoys, tarpits and fake wins helped reduce the attack traffic reaching real assets."
