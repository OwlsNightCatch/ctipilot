    kind: record-summary
    text: "Wiz Research independently reports an ARTEX-using actor overlapping with Storm-0940 against software vendors in October, and adds log signatures that mark the agent: source-map-then-route sequences, unsigned-JWT SSO probes and one-second-cadence spray bursts with a user agent per burst."
