    kind: cited
    text: "Three Hokkaido municipalities disclosed on 2026-11-18 and 2026-11-19 that personal data they had handed to their contractor GIS Hokkaido was stored on a development terminal of GIS Hokkaido's subcontractor Rimgate, on which traces of the information stealer K2F were found: the terminal was infected overnight on 2 to 3 November, Rimgate found the traces on 4 November and cut it from the network, and GIS Hokkaido told the municipalities between 13 and 16 November ("
