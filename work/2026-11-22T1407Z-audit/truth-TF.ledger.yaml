claims:
  - claim_id: c6cd79b9ec
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "headline"
    kind: frontmatter
    text: "FBI: various actors run ARTEX against many sectors, government included; Microsoft names Storm-0940 and Storm-3358"
  - claim_id: 24d0708587
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "summary"
    kind: frontmatter
    text: "Microsoft reports that since at least September 2026 Storm-0940, a China-state aligned actor, has used ARTEX, an open-source multi-agent LLM penetration-testing framework, to automate scanning, password spraying and OAuth-application abuse against hundreds of organizations across many industries including government, reaching privileged cloud access in under three hours in several cases; Expel saw the same infrastructure create its own accounts through Okta self-service registration. Google Threat Intelligence Group and Mandiant report on 2026-10-31 that since late August they have seen ARTEX, PentAGI and CAIRN operated in incident-response cases, with ARTEX adopted by extortion groups and suspected PRC-nexus clusters whose victims include US government organizations, and that the original ARTEX repository was taken down in October while forks keep it in circulation. CrowdStrike and Recorded Future document another actor using the framework, and Seoul police referred a criminal group's leader to prosecutors on 2026-10-23 for extorting 38 of more than 90 organizations, with the same framework according to BleepingComputer. Microsoft adds on 2026-11-06 another cluster, the Cambodia-based, financially motivated Storm-3358 targeting financial organisations, and Check Point reads ten exposed operator consoles that show near-autonomous, opportunistic ARTEX campaigns. CERT-EU says AI-driven activity against the EU institutions it protects highly likely involved ARTEX. The FBI's FLASH of 2026-11-13 says a variety of actors have used ARTEX since at least August against sectors including financial services, government, technology and defense, and lists the observed techniques, among them cloud-trust and vendor-credential pivots, Kudu abuse and Active Directory credential theft."
  - claim_id: 9bd6ee185f
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "actions[0]"
    kind: frontmatter
    text: "In every Okta org that allows self-service registration, review the accounts created since 2026-10-13 and every Okta Verify enrollment on them, and remove self-created accounts that nobody provisioned."
  - claim_id: a5eeae5fcb
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "Microsoft Threat Intelligence reports that as early as September 2026 Storm-0940, a China-state aligned actor active since 2021, used the agentic penetration-testing framework ARTEX to automate attacks on hundreds of organizations across many industries, government and military among them ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/"]
  - claim_id: 0054f6f66c
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "ARTEX is an open-source multi-agent LLM system that can use any AI model and runs a penetration test from reconnaissance to exfiltration with little human involvement ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/"]
  - claim_id: eeb0bb5d15
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "Microsoft says ARTEX accelerated the abuse of compromised applications already granted access to Microsoft 365 tenants ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/"]
  - claim_id: 58f1d8575e
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "), and Expel adds that it is not a vulnerability and only speeds up familiar techniques such as password spraying and OAuth-application abuse ("
    urls: ["https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/"]
  - claim_id: 7c0408f67d
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "); most targeting failed, yet several cases went from first targeting to privileged cloud access in under three hours ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/"]
  - claim_id: 404a1df459
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "Microsoft assesses the same actor was behind the ConnectWise Cloud Backup application-credential abuse ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/"]
  - claim_id: dafb9278f4
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "Expel saw Storm-0940 infrastructure scan a customer and, from 2026-10-13, abuse its Okta self-service registration with no ConnectWise application involved: the attacker created five accounts of its own, enrolled Okta Verify on three of them about a minute after activation, made 50 single sign-on logins with more than 100 OAuth tokens issued and ran a password spray that Okta ThreatInsight blocked ("
    urls: ["https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/"]
  - claim_id: 2ed4adeac1
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "Expel says the shared source address is its only link to Storm-0940, the activity alone does not prove ARTEX was used, and it had not seen the technique reported before ("
    urls: ["https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/"]
  - claim_id: 7d55fabb7c
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "Other actors use it: CrowdStrike analysed an unnamed, probably Chinese-speaking and financially motivated actor that ran ARTEX against South Korean financial institutions from late September ("
    urls: ["https://www.crowdstrike.com/en-us/blog/unknown-threat-actor-uses-artex-to-target-south-korean-finance/"]
  - claim_id: 56c61ed5bd
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "), and Recorded Future, which tracks that activity as TAG-217, says use of ARTEX and other AI penetration-testing tools is not limited to it ("
    urls: ["https://www.recordedfuture.com/blog/tag-217-artex-south-korean-banks"]
  - claim_id: 8e9f927275
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "Wiz Research independently reports that throughout October 2026 it tracked an actor using ARTEX-associated tooling, overlapping with Storm-0940, against IT and software vendors, focused on identity providers (Okta, Entra, Cognito) and Microsoft 365 integrations, and says that most attempts failed and that none of the techniques is novel ("
    urls: ["https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"]
  - claim_id: 00ba73e031
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "It describes a consistent sequence: downloading JavaScript bundles, exposed source maps, runtime configuration and OpenAPI documents, then calling internal API routes by name minutes later; fabricated authorization codes and malformed state values against Microsoft OAuth callbacks; unsigned JWTs tried against more than 60 SSO route variants in two minutes; and account-recovery, sign-up and Cognito calls such as InitiateAuth, ForgotPassword and ResendConfirmationCode ("
    urls: ["https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"]
  - claim_id: 3cd9fdcb64
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "Its password sprays against Entra and Okta hit hundreds of users, mainly software engineers, in bursts of 20 to 60 minutes with a unique user agent per burst, a median gap of one second between attempts and new source addresses within minutes of a block ("
    urls: ["https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"]
  - claim_id: 4bde764d50
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "**Exposure:** any tenant that relies on password sign-in or grants OAuth consent to applications, and any Okta org with self-service registration enabled; not using ConnectWise does not exclude exposure ("
    urls: ["https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/"]
  - claim_id: 50c37af9af
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "**Detection:** in the authentication logs of every identity provider in use, bursts of failed logons and lockouts spread over many accounts; in the Okta system log, newly self-registered accounts that enrol Okta Verify and start single sign-on within minutes; and in the Entra audit log, credentials or certificates added to applications that nobody on your team created and any application that assigns itself a directory role ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/", "https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/"]
  - claim_id: 297a697100
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "A clean audit log is not proof of no access, because Microsoft Graph directory reads leave no Entra audit record ("
    urls: ["https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/"]
  - claim_id: 08571f196b
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "In web access logs of an application exposed to the same actor, Wiz points to source-map and OpenAPI downloads followed minutes later by calls to internal routes that appear only in those files, and to sign-in telemetry showing a new user agent for each burst of attempts at a one-second cadence ("
    urls: ["https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"]
  - claim_id: b553d7b4b1
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "**Triage:** Python and curl user agents match common legitimate automation, so Expel treats them as supporting evidence only, and a Python user agent on an application that normally calls Microsoft Graph with a .NET SDK is the anomaly ("
    urls: ["https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/"]
  - claim_id: d048ad9945
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** Expel's reading is that the framework adds speed, not a new vulnerability, so the levers are the identity controls it runs into: least privilege on multi-tenant application permissions and consent grants, alerting on credential additions and privileged role assignments by applications, and a review of self-registered Okta accounts since 2026-10-13 ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/", "https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/"]
  - claim_id: be0ca9831d
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-10-24T03:45:02Z"
    kind: cited
    text: "Wiz Research reports an actor using ARTEX-associated tooling, overlapping with Storm-0940, against IT and software vendors throughout October 2026, focused on Okta, Entra and Cognito and on Microsoft 365 integrations, with most attempts failing ("
    urls: ["https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"]
  - claim_id: a88f89c6d6
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-10-24T03:45:02Z"
    kind: cited
    text: "It describes the log signatures of the agent: source-map and OpenAPI downloads followed minutes later by calls to internal routes that appear only in those files, fabricated OAuth callback values, unsigned JWTs tried against more than 60 SSO route variants in two minutes, account-recovery and sign-up calls, and password-spray bursts of 20 to 60 minutes against Entra and Okta with a unique user agent per burst and a median gap of one second between attempts ("
    urls: ["https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"]
  - claim_id: d81618e283
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-10-24T03:45:02Z"
    kind: cited
    text: "Wiz says chaining, automatic adaptation to rate limits and blocks, and tests against heavily scrutinised Microsoft OAuth flows separate the agent from a human operator ("
    urls: ["https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"]
  - claim_id: ff80356130
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-10-27T03:45:25Z"
    kind: cited
    text: "Seoul Metropolitan Police announced on 2026-10-26 that it referred a 32-year-old gang leader to prosecutors on 2026-10-23, with six accomplices investigated without detention, for taking 8.2 million personal-data records and internal files from more than 90 organizations since September 2025, among them cram schools, hospitals, golf courses, universities and large-company affiliates, and for sending extortion e-mails ("
    urls: ["https://www.yna.co.kr/view/AKR20261026075100004"]
  - claim_id: 186bac2b43
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-10-27T03:45:25Z"
    kind: cited
    text: "BleepingComputer, citing local media, reports that the group demanded 360 million won (about USD 270,000) in 38 of the incidents in exchange for not leaking the data, that the police say the leader used the ARTEX framework, the same system used in the attacks on South Korean banks, and that he moved from conventional tools to AI utilities in late August 2026 ("
    urls: ["https://www.bleepingcomputer.com/news/security/former-pentester-used-artex-ai-to-steal-82-million-data-records/"]
  - claim_id: a11db9ae2a
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-10-27T03:45:25Z"
    kind: cited
    text: "Yonhap counts 60 of the victims as hacked with AI and describes the system as the AI autonomous penetration-testing system used in the recent financial-sector data thefts without naming it, so the ARTEX name is BleepingComputer's ("
    urls: ["https://www.yna.co.kr/view/AKR20261026075100004"]
  - claim_id: 0f00324a5a
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-10-27T03:45:25Z"
    kind: cited
    text: "No encryption step is reported, and the police say AI lowered the barrier to entry and call this the first arrest in Korea in a large-scale hacking and personal-data theft case that exploited generative AI ("
    urls: ["https://www.bleepingcomputer.com/news/security/former-pentester-used-artex-ai-to-steal-82-million-data-records/"]
  - claim_id: ed530b6e90
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-10-27T03:45:25Z"
    kind: uncited
    text: "The framework is therefore in use by a financially motivated criminal group as well as by the state-aligned actor Microsoft describes; no source reports a Swiss victim."
  - claim_id: a9f4cfa2e0
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-01T03:29:45Z"
    kind: cited
    text: "Google Threat Intelligence Group (GTIG) and Mandiant report that since late August 2026 they have seen threat actors operate ARTEX, PentAGI, CAIRN and possibly custom harnesses inside Mandiant incident-response engagements, with agents carrying out significant parts of the attack lifecycle such as lateral movement, database exploitation and exfiltration preparation ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/artex-and-friends-enter-agentic-offensive-frameworks"]
  - claim_id: 0723ddc06c
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-01T03:29:45Z"
    kind: cited
    text: "They say ARTEX has been adopted since late August by financially motivated extortion groups and suspected PRC-nexus clusters, whose operations affected organizations in government, technology, chemicals and materials, and manufacturing in the United States, and that the campaign Wiz tracks, which GTIG tracks as UNC7228, overlaps with Microsoft's Storm-0940 and dates back to at least August 2026 ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/artex-and-friends-enter-agentic-offensive-frameworks"]
  - claim_id: 60eb0192b0
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-01T03:29:45Z"
    kind: cited
    text: "The original ARTEX repository was taken down by its creator in October because of abuse, but community forks, among them a commercial one, keep the framework in circulation ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/artex-and-friends-enter-agentic-offensive-frameworks"]
  - claim_id: 3af75710e2
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-01T03:29:45Z"
    kind: cited
    text: "GTIG's log signature for the agent is execution in bursts of roughly 2 to 25 seconds, error-driven retries and forensically noisy trial and error; in one case, given valid credentials, the framework used an application's SQL API to point the MySQL general log at a web-accessible .jsp path and then ran SELECT statements carrying script tags, likely intended to write web shells under somewhat-incremental file names until they ran cleanly ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/artex-and-friends-enter-agentic-offensive-frameworks"]
  - claim_id: 83ea767f1f
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-01T03:29:45Z"
    kind: uncited
    text: "In several cases the operators handed ARTEX compromised credentials and told it to run the later stages."
  - claim_id: 528136cc9b
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-07T03:50:15Z"
    kind: cited
    text: "Microsoft Threat Intelligence reports that Storm-3358, a Cambodia-based intrusion cluster that primarily targets financial organisations in Southeast Asia and a smaller number of large financial organisations globally, began using ARTEX against the financial sector in October 2026 ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/11/06/artex-abuse-expands-as-cybercriminals-target-financial-sector/"]
  - claim_id: f1c1b0efa2
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-07T03:50:15Z"
    kind: cited
    text: "Microsoft says the cluster combines ARTEX with conventional automated tools to scan internet-facing systems, exploit flaws including anonymous file upload and server-side request forgery, and install the open-source remote access tools WISP, vshell and AdaptixC2, which ARTEX agents download with netcat and curl ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/11/06/artex-abuse-expands-as-cybercriminals-target-financial-sector/"]
  - claim_id: 8bbcf1092e
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-07T03:50:15Z"
    kind: cited
    text: "Microsoft's tell for an agent on a scanned system is \"a wide variety of requests in a brief time\", retries of variations on one technique and a move to next-stage actions at machine speed; ARTEX by default drives Nmap, curl, wget, Python HTTP clients and headless Chromium through Playwright, and blocking their default traits will not stop an agent, which \"will quickly change them\" ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/11/06/artex-abuse-expands-as-cybercriminals-target-financial-sector/"]
  - claim_id: 706173540a
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-07T03:50:15Z"
    kind: cited
    text: "In Microsoft's testing, honeypots, decoys, tarpits and fake wins helped reduce the attack traffic reaching real assets, with no figures given ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/11/06/artex-abuse-expands-as-cybercriminals-target-financial-sector/"]
  - claim_id: 81eb769ae6
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-07T03:50:15Z"
    kind: cited
    text: "Check Point Research counts 2,557 systems that host or hosted ARTEX panels, 1,608 of them live and public, and ten that exposed the full database; in those ten consoles the operators set a goal and then \"barely interacted with their agent fleets\" ("
    urls: ["https://research.checkpoint.com/2026/hacking-on-autopilot-inside-artex-cybercrime-campaigns/"]
  - claim_id: d7ff1b01b2
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-07T03:50:15Z"
    kind: cited
    text: "In the signing-shop campaign the agents got in through hardcoded administrator passwords in JavaScript bundles, missing API authentication, command injection, insecure direct object references, weak administrative credentials and template injection ("
    urls: ["https://research.checkpoint.com/2026/hacking-on-autopilot-inside-artex-cybercrime-campaigns/"]
  - claim_id: a16c027260
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-07T03:50:15Z"
    kind: uncited
    text: "The campaigns it reads are opportunistic crime, not espionage: iOS signing certificates from grey-market shops, a cryptocurrency-service campaign and game-account credentials."
  - claim_id: 2feae7535e
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-07T03:50:15Z"
    kind: uncited
    text: "Check Point does not name Storm-3358."
  - claim_id: dc9983f446
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-08T14:11:58Z"
    kind: cited
    text: "CERT-EU, the cybersecurity service of the EU institutions, says it has seen several threat actors use ARTEX to automate their campaigns in recent weeks and has observed AI-driven activity against its own constituency that highly likely involved ARTEX; it assesses that the framework's public availability will likely accelerate adoption, notes that the public versions are independent forks since the original author withdrew the repository in October, and maps the activity to active scanning, tool acquisition and exploitation of public-facing applications ("
    urls: ["https://cert.europa.eu/blog/from-penetration-testing-to-cyber-threat-beware-of-artex"]
  - claim_id: 884abe9aca
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-08T14:11:58Z"
    kind: cited
    text: "Its guidance adds one point beyond limiting exposure and isolating management panels: keep non-severe findings in the remediation cycle, because AI-enabled tooling can chain minor misconfigurations into higher-impact attack paths ("
    urls: ["https://cert.europa.eu/blog/from-penetration-testing-to-cyber-threat-beware-of-artex"]
  - claim_id: 607bcd5af5
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-08T14:11:58Z"
    kind: cited
