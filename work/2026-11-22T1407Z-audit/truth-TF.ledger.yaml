    kind: frontmatter
    text: "The Swiss university USI said on 2026-11-19 (communiqué translated from Italian) that unauthorised third parties had access to data on one of its applications between 2026-11-09 and 2026-11-17 by exploiting a vulnerability in the software of an online-forms system that collects job applications, scholarship requests and surveys. The server held the form responses and their attached documents; USI secured it and informed the authorities and the people concerned. Its chief operating officer said on 2026-11-20 that the stolen data are mainly names, e-mail addresses and phone numbers, with a small share of job applications and scholarship requests, that more than 8,000 e-mails warned those concerned, and that AI agents found and exploited the flaw, which is USI's own assessment with no technical evidence given. USI names no product, vulnerability or attacker, and no extortion claim has been reported."
