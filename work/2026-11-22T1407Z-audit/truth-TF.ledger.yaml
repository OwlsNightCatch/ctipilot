    surface: "record 2026-11-08T14:11:58Z"
    kind: record-summary
    text: "CERT-EU says it has observed AI-driven activity against the EU institutions that highly likely involved ARTEX and expects the framework's public forks to accelerate adoption; in Switzerland, the co-head of GovCERT at the Federal Office for Cybersecurity said no case of autonomous AI agents hacking someone had been reported to the office so far."
  - claim_id: bbe4ade941
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "record 2026-11-16T04:29:57Z"
    kind: record-summary
    text: "The FBI's FLASH of 2026-11-13 says a variety of actors have used ARTEX since at least August against sectors including government, with more than 1,600 exposed consoles in early November. It lists the observed steps (cloud-trust and vendor-credential pivots, Kudu abuse, Active Directory credential theft, exfiltration preparation), the telemetry to check and the attack-surface hardening it recommends."
