    surface: "body"
    kind: cited
    text: "Amazon Threat Intelligence found on 2026-09-10 a publicly reachable, unauthenticated instance of Cairn, an open-source autonomous AI penetration-testing framework, whose exposed history showed a roughly 48-hour campaign from 2026-09-08 against IP addresses of universities in East Asia outside mainland China ("
