    entry: 2026-11-21/cleared-evtx-logs-keep-earlier-records-in-chunk-free-space
    surface: "headline"
    kind: frontmatter
    text: "Arctic Wolf: a cleared Windows event log keeps earlier records in its first EVTX chunk; carve it"
  - claim_id: 7e78243854
    entry: 2026-11-21/cleared-evtx-logs-keep-earlier-records-in-chunk-free-space
    surface: "summary"
    kind: frontmatter
    text: "Arctic Wolf incident responders report that clearing a Windows event log truncates the EVTX file after the first 64 KB cluster and resets the record numbers, but the first chunk keeps its earlier records in its free space. On a domain controller the System log held 104 allocated events after the final clear, yet the encryptor's full command line, stamped about three hours before the clear, sat inside the allocated file, and Event Viewer, EvtxECmd and Magnet AXIOM showed none of it; a PowerShell log in a second case held 44 records of which one was allocated."
  - claim_id: ecd829cb0a
    entry: 2026-11-21/cleared-evtx-logs-keep-earlier-records-in-chunk-free-space
    surface: "body"
    kind: cited
    text: "Arctic Wolf's incident responders report that clearing a Windows event log does not wipe the underlying EVTX file ("
    urls: ["https://arcticwolf.com/resources/blog/windows-event-log-cleared-think-outside-the-box/"]
  - claim_id: 834eb6fbc2
    entry: 2026-11-21/cleared-evtx-logs-keep-earlier-records-in-chunk-free-space
    surface: "body"
    kind: cited
    text: "On clearing, Windows truncates the file after the first 64 KB cluster and resets the first and last record numbers, but that first chunk keeps its earlier records in free space until enough new events fill it ("
    urls: ["https://arcticwolf.com/resources/blog/windows-event-log-cleared-think-outside-the-box/"]
  - claim_id: ea4835455a
    entry: 2026-11-21/cleared-evtx-logs-keep-earlier-records-in-chunk-free-space
    surface: "body"
    kind: cited
    text: "In a ransomware case the encryptor needed a password argument to run, and Arctic Wolf found its full command line inside the allocated System.EVTX of a domain controller, stamped about three hours before the final clear and absent from the parsed output of Event Viewer, EvtxECmd and Magnet AXIOM; another log held a netscan execution record and an attacker hostname that survived the same way ("
    urls: ["https://arcticwolf.com/resources/blog/windows-event-log-cleared-think-outside-the-box/"]
  - claim_id: cc3e20cb97
    entry: 2026-11-21/cleared-evtx-logs-keep-earlier-records-in-chunk-free-space
    surface: "body"
    kind: cited
    text: "In a second case a PowerShell log held 44 records of which one was allocated, all of them the same command that clears every log, which shows repeated clearing ("
    urls: ["https://arcticwolf.com/resources/blog/windows-event-log-cleared-think-outside-the-box/"]
  - claim_id: e0d8b9d412
    entry: 2026-11-21/cleared-evtx-logs-keep-earlier-records-in-chunk-free-space
    surface: "body"
    kind: cited
    text: "Arctic Wolf identified no forensic tool that flags records left in the slack space after a clear, and records come back with some template-held fields missing ("
    urls: ["https://arcticwolf.com/resources/blog/windows-event-log-cleared-think-outside-the-box/"]
  - claim_id: 32acca77ee
    entry: 2026-11-21/cleared-evtx-logs-keep-earlier-records-in-chunk-free-space
    surface: "body"
    kind: cited
    text: "**Detection:** the clearing itself is the alertable event, since Arctic Wolf notes that it often triggers EDR or IDS alerting and is frequently what exposes an attack in progress; the recovery step is forensic: when a log shows as cleared, acquire the EVTX file and carve its first chunk for records with earlier timestamps and lower record identifiers than the allocated ones ("
    urls: ["https://arcticwolf.com/resources/blog/windows-event-log-cleared-think-outside-the-box/"]
  - claim_id: 7932b09f4b
    entry: 2026-11-21/cleared-evtx-logs-keep-earlier-records-in-chunk-free-space
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** do not treat a cleared log as empty; preserve the EVTX files of affected hosts promptly, because new events overwrite the free space once they fill the first 64 KB, and search the whole file, not only the parsed events, for the encryptor's command line, tool names and hostnames ("
    urls: ["https://arcticwolf.com/resources/blog/windows-event-log-cleared-think-outside-the-box/"]
