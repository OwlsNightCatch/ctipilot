- entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
  verdict: imprecision
  findings:
  - code: F3
    claim_id: 4bde764d50
    where: body, **Exposure:** line (cited to Expel)
    defect: '"any tenant that relies on password sign-in or grants OAuth consent to applications, and any Okta org with self-service registration enabled; not using ConnectWise does not exclude exposure" ([Expel, 2026-10-21])  (low confidence)'
    ground_truth: 'Expel: "Am I at risk if I never used ConnectWise or SkyKick? Possibly. The target set is wider than ConnectWise customers. Expel saw Storm-0940 infrastructure hit a customer''s Okta tenant in October 2026, using self-service registration to create its own accounts and enroll Okta Verify." The page does not state that any tenant relying on password sign-in or OAuth consent is exposed; only the Okta self-registration case and the "wider than ConnectWise" point are carried.'
    ground_truth_url: https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/
    fix: Limit the Expel-cited clause to "any Okta org with self-service registration enabled; not using ConnectWise does not exclude exposure", and cite Microsoft (password spraying and OAuth application abuse are Storm-0940 techniques) for the broader password/OAuth-consent exposure statement, or drop it.
  length_note: main analysis 726 words (over the 550-word bound); headline 114 characters (within bound)
- entry: 2026-10-22/cve-2026-76466-cisco-expressway-cluster-unauth-root-rce
  verdict: imprecision
  findings:
  - code: F3
    claim_id: 5e3637ae17
    where: body paragraph 1, first sentence (cited to Cisco cisco-sa-vcs-static-cred-hr7EWZ8t)
    defect: '"...because clustering uses persistent cookies and validates client certificates insufficiently even with TLS Verify Mode enabled"  (low confidence)'
    ground_truth: 'Cisco: "This vulnerability is due to the use of persistent cookies. Additionally, there is insufficient validation of client certificates when the TLS Verify Mode is set to Enabled for clustering, which means that client certificates are not validated." The advisory does not say that clustering is what uses the persistent cookies.'
    ground_truth_url: https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-vcs-static-cred-hr7EWZ8t
    fix: 'Reword to track the advisory: "because of the use of persistent cookies, and because client certificates are not validated when TLS Verify Mode is enabled for clustering".'
  length_note: null
- entry: 2026-11-20/usi-lugano-online-forms-vulnerability-exploited
  verdict: imprecision
  findings:
  - code: F4
    claim_id: null
    where: evidence[1] (translated quote vs original)
    defect: 'quote: "The data stolen are essentially first names, surnames, e-mail addresses and phone numbers, and to a minimal extent also job applications or scholarship requests (translated from Italian)." original: "sostanzialmente nomi, cognomi, indirizzi e-mail, numeri di telefono, ma in minima parte anche candidature o richieste di borse di studio"  (low confidence; cosmetic)'
    ground_truth: 'Page: "Valnegri parla poi del tipo di dati trafugati, che sono sostanzialmente nomi, cognomi, indirizzi e-mail, numeri di telefono, ma in minima parte anche candidature o richieste di borse di studio." The English lead "The data stolen are" translates words ("del tipo di dati trafugati, che sono") that the `original:` field does not contain; the original span starts at "sostanzialmente".'
    ground_truth_url: https://www.cdt.ch/news/ticino/lattacco-hacker-allusi-messo-a-segno-da-agenti-ia-abbiamo-avvisato-8-mila-utenti-444981
    fix: Extend `original:` to "i dati trafugati, che sono sostanzialmente nomi, ..." or drop "The data stolen are" from the English quote.
  length_note: null
- entry: 2026-11-20/vmware-vcenter-cve-2026-123890-auth-bypass-exploited-gtig
  verdict: imprecision
  findings:
  - code: F4
    claim_id: 4f6b5119e2
    where: body, **Detection:** line, first telemetry clause (cited to GTIG)
    defect: '"in the vCenter appliance management audit log, SSH switched on and then off again, a new local or SSO administrator, and reads of the Directory Service database, the master key and the PostgreSQL credential file"  (low confidence)'
    ground_truth: GTIG describes the SSH enable/disable via the VAMI API, the new local administrator and the credential-file reads over SSH as observed activity, but names no "appliance management audit log" as the place the file and database reads are visible; its only log-side artefact is the SecOps rule name "VMware vCenter VAMI API SSH Enablement". The telemetry location for the reads is the entry's inference.
    ground_truth_url: https://cloud.google.com/blog/topics/threat-intelligence/armory-castle-exploits-vsphere/
    fix: Say which of the three behaviours GTIG ties to a log source (VAMI SSH enablement) and present the file and database reads as behaviours to hunt for in host/SSH session telemetry without asserting the audit log carries them.
  - code: F5
    claim_id: null
    where: frontmatter tags / cves[CVE-2026-123890].status vs body
    defect: tags and status assert `cisa-kev`, sources[] lists CISA and evidence[] quotes CISA, but the body prose never states that CISA listed the flaw (no CISA/KEV mention, no inline citation)  (low confidence; the internal improvement record 2026-11-21T05:11:01Z added them without a body statement)
    ground_truth: CISA alert 2026-11-20 lists "CVE-2026-123890 VMWare vCenter Authentication Bypass Using an Alternate Path or Channel Vulnerability"; KEV catalogue 2026.11.20 dateAdded 2026-11-20.
    ground_truth_url: https://www.cisa.gov/news-events/alerts/2026/11/20/cisa-adds-four-known-exploited-vulnerabilities-catalog
    fix: Add one inline-cited sentence to the exposure/summary paragraph that CISA listed CVE-2026-123890 as exploited on 2026-11-20 (a non-internal record), or accept that the tag is metadata only.
  - code: F8
    claim_id: null
    where: frontmatter affected_products[] and cves[CVE-2026-123893].affected
    defect: affected_products lists vCenter Server, VMware Cloud Foundation, SDDC Manager and VMware Tools; CVE-2026-123893 affected reads "SDDC Manager and VCF Installer in VMware Cloud Foundation 9.1, 9.0 and 5.x"  (low confidence)
    ground_truth: 'VMSA-2026-0009.1 "1. Impacted Products": VMware vCenter, VMware Cloud Foundation, VMware vSphere Foundation, VMware Tools, VMware Telco Cloud Platform, VMware Telco Cloud Infrastructure; response-matrix rows for CVE-2026-123893 read "VMware Cloud Foundation, VMware vSphere Foundation | SDDC Manager / VCF Installer | 9.1.x.x" and "...9.0.x.x".'
    ground_truth_url: https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/39495
    fix: Add "VMware vSphere Foundation" to affected_products and to the CVE-2026-123893 affected text.
  length_note: null
