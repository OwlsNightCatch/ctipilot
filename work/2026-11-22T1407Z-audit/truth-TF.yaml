- entry: 2026-11-21/basel-landschaft-97000-cross-border-work-permits-stolen
  verdict: imprecision
  findings:
  - code: F4
    claim_id: null
    where: evidence[0] (translated quote vs original)
    defect: 'quote: "The forensic investigations carried out in the meantime have confirmed that the perpetrators were able to gain access to a database related to work permits for cross-border commuters and to extract data from it. (translated from German)" original: "hat sich bestätigt, dass sich die Täterschaft Zugriff auf eine Datenbank im Zusammenhang mit Arbeitsbewilligungen für Grenzgängerinnen und Grenzgänger verschaffen und daraus Daten abziehen konnte"  (cosmetic)'
    ground_truth: 'FAQ page: "Im Rahmen der inzwischen durchgeführten forensischen Untersuchungen hat sich bestätigt, dass sich die Täterschaft Zugriff auf eine Datenbank im Zusammenhang mit Arbeitsbewilligungen für Grenzgängerinnen und Grenzgänger verschaffen und daraus Daten abziehen konnte." The English opening clause ("The forensic investigations carried out in the meantime") has no counterpart in the `original:` span, which starts at "hat sich bestätigt". Both quotes are otherwise verbatim and every claim of the entry is supported. Note: the cited URL returns HTTP 403 to every transport in the container; the page was read through the canton''s short link https://www.baselland.ch/FAQData, which resolves to the cited page.'
    ground_truth_url: https://www.baselland.ch/politik-und-behorden/direktionen/sicherheitsdirektion/amt_fuer_migration/bewilligungen/faq-data/
    fix: Extend `original:` to start at "Im Rahmen der inzwischen durchgeführten forensischen Untersuchungen hat sich bestätigt, ...".
