- entry: 2026-11-22/monai-label-path-traversal-zero-day-found-by-cairn-ai-agents
  verdict: imprecision
  findings:
  - code: F3
    claim_id: '8700829790'
    where: body, **Detection:** first clause (cited to the 0.8.6 release notes)
    defect: '"web or reverse-proxy access logs for PUT requests to the two datastore endpoints whose `image` parameter carries parent-directory sequences or a leading dot, which the fix neutralises or rejects, and for tar uploads to `PUT /session/` with `uncompress=true`" ([Project MONAI release notes, 2026-11-22])  (low confidence)'
    ground_truth: 'The 0.8.6 release notes name the two datastore endpoints and the `PUT /session/?uncompress=true` tar upload but say nothing about the `image` query parameter, parent-directory sequences or dot-prefixed IDs. That detail is in the GHSA: "The /datastore/image endpoint also reduces the image ID to its basename and rejects empty or dot-prefixed IDs with HTTP 400" and "a value such as ../../../tmp/x writes the uploaded content to any location".'
    ground_truth_url: https://github.com/Project-MONAI/MONAILabel/security/advisories/GHSA-qc22-rmgc-vg94
    fix: Cite the GHSA alongside the release notes for the image-parameter / dot-prefix clause (the release notes only for the session tar-upload clause).
  length_note: null
