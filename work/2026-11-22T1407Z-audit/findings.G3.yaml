  extended_notes: 'Triage-relevant behaviour (Unit 42, single report): the sequence an alert should match is an inbound call or Teams contact from ''IT support'' -> sign-in through a lookalike SSO/MFA subdomain (apex domains posing as SSO, passkey or help-desk pages; Unit 42 gives .claims/.report TLDs and sso/mfa/passkey/okta keywords as registration patterns) -> a new MFA method or device enrolled minutes after the first sign-in -> sign-ins from residential-proxy or commercial-VPN addresses -> scripted bulk reads of mailbox, OneDrive and SharePoint (python-httpx, python-requests, Graph SDK user agents) -> Teams or email extortion from a compromised account. Benign lookalikes: a legitimate help-desk-initiated MFA reset also enrols a device; the discriminator is that the enrolment follows a sign-in from a new network that the user did not initiate through the organisation''s own portal, and that the user reports an inbound call. Hardening levers named by Unit 42: help-desk callback verification through a trusted channel, phishing-resistant MFA, browser-extension allowlisting (block Developer Mode sideloading), alerting on mass data export. The ''Google Chrome'' extension manifest ID and file hashes are IOCs and are deliberately omitted.'
- title: 'Huntress: timeroasting leaves no logon event, modern Windows clients send the 120-byte extended MS-SNTP authenticator that hashcat cannot crack, and the detection that holds keys on a host asking a DC to sign for another account''s RID'
  sources:
  - url: https://www.huntress.com/blog/detecting-timeroasting
    publisher: Huntress (Andrew Schwartz)
    date: '2026-11-19'
    role: primary
  - url: https://cybersecurity.bureauveritas.com/uploads/whitepapers/Secura-WP-Timeroasting-v3.pdf
    publisher: Secura / Bureau Veritas Cybersecurity (Tom Tervoort)
    date: '2023'
    role: corroborating
  discovery_trace: 'first seen at: huntress, feed URL https://www.huntress.com/blog/rss.xml (item ''Detecting Timeroasting the Hard Way'', 2026-11-19T14:00Z; 2026-11-22T0355Z-intel run record listed it as an out-of-window lead for this audit) -> primary (no pivot needed): https://www.huntress.com/blog/detecting-timeroasting (read with extract) -> pivot: original technique whitepaper linked by Huntress, https://cybersecurity.bureauveritas.com/uploads/whitepapers/Secura-WP-Timeroasting-v3.pdf (read with pdf; 26/60 streams decoded, text extractable)'
  summary: 'Huntress reverse-engineered w32time.dll and netlogon.dll on a patched Windows Server 2025 domain controller (build 26100.33438) to document how timeroasting (abuse of MS-SNTP, Tom Tervoort''s 2023 technique) works and how to detect it. Facts from Huntress: MS-SNTP has two authenticator formats, a 68-byte legacy form with an MD5 MAC (hashcat mode 31300, produced by timeroast.py and NetExec) and a 120-byte extended form (SP800-108 key derivation with label ''sntp-ms'' including the trailing null and the little-endian RID as context, HMAC-SHA512, 64-byte output) for which hashcat has no module; modern Windows w32time sends the extended form by default. The DC signs only for computer and trust accounts (workstation, server and interdomain trust account types), so the crackable population is machine and trust accounts with weak or never-rotated secrets; targeted timeroasting of a user first needs write access to flip the user into a machine-looking account (appended $ and a workstation-trust userAccountControl). The request creates no authentication event for the targeted account (no 4768, 4769, 4624 or 4776), but the UDP/123 exchange is visible in DC network telemetry (Windows Filtering Platform event 5156 where enabled, EDR network events). Huntress''s detection argument: do not key on packet size, because modern members send the 120-byte form; the signal that holds is a host asking a DC to sign for a RID that is not its own machine account (sequential RID sweeps from one source on one ephemeral port, constant or zero NTP transmit timestamp), with a size-agnostic volumetric rule on authenticated NTP to DCs as the weaker fallback; a zero MAC in the request is normal and must not be alerted on. Huntress tested Defender for Identity over eleven runs and five hours and reports that none of its alerts fired on the unauthenticated sweep; the ''Suspicious SAM Account Name Change'' alert covers only the privileged targeted variant. Huntress also ships a verified reference implementation and a hashcat module (not yet assigned an upstream mode number) for the extended form, which lowers the cracking barrier for the previously uncovered format. The 2023 Secura whitepaper independently states the base mechanism (''the client does not actually have to authenticate itself to the NTP server'') and recommends monitoring many NTP queries from one source or with a non-existent RID. Limits: single vendor research with lab validation; no in-the-wild exploitation is reported, Huntress validated its Suricata rules only against lab captures of a sweep, and whether the old-key flag occurs in legitimate traffic is unmeasured. Swiss relevance: every on-premises Active Directory estate in federal, cantonal and communal administrations is in scope, and the detection needs DC or network-sensor UDP/123 telemetry that most SOCs do not collect.'
  region_nexus: global; applies to any on-premises Active Directory estate, including Swiss federal, cantonal and communal administrations
