  discovery_trace: 'first seen at: trendmicro-research, feed URL https://www.trendaisecurity.com/en-us/resources-insights/trendai-security-blog/rss.xml (item ''BYOD Ransomware: An Identity-First Extortion Campaign Moving Into Hospitals and Universities'', 2026-11-18 14:00 UTC) -> primary: https://www.trendaisecurity.com/en-us/resources-insights/trendai-security-blog/byod-ransomware-hospitals-universities (read with extract) -> pivots to the victim reports Trend links: BleepingComputer Vanderbilt https://www.bleepingcomputer.com/news/security/vanderbilt-university-hit-in-byod-ransomware-attack-data-theft-claimed/, BleepingComputer UNM https://www.bleepingcomputer.com/news/security/unm-health-ransomware-attack-disrupts-patient-care-surgeries/, The Record Michigan State https://therecord.media/michigan-state-university-byod-gang-cyber-incident (all read with extract)'
  summary: 'TrendAI (2026-11-18) assembles the public record on BYOD, a ransomware and data-extortion group first observed in September 2026 that listed at least nine organisations between 2026-10-05 and 2026-11-09: small businesses, Trump Mobile, the University of New Mexico Health Sciences Center (2026-10-26; ambulances diverted 12:30 to 14:30, more than 30 clinics closed, per UNM as relayed by TrendAI), Michigan State University (listed 2026-11-01; MSU links it to a credential compromise it detected in early October and a forced password reset on 2026-10-01), Vanderbilt University (2026-11-09; the university told staff to shut down devices) and the Texas Health and Human Services Commission (listed 2026-11-09, no confirmation). BleepingComputer and The Record independently report the UNM, Michigan State and Vanderbilt incidents and the group''s leak-site claims. Claims versus facts: BYOD claims 36,000 systems at UNM including Active Directory forests, Group Policy and the Entra tenant, and a domain-controller takeover and over one million SSNs at Vanderbilt; UNM says only some end-user devices were affected, Michigan State sees no central Active Directory compromise, and neither Vanderbilt nor the Texas agency has confirmed the group''s claims. Encryption is implied at UNM by the group''s offer of free decryption keys to healthcare facilities. Audio ransom messages played on infected computers at UNM and Vanderbilt (BleepingComputer saw a video and a ransom note named README_BYOD_31.txt). The only initial-access routes on record are the Michigan State credential compromise (victim-stated) and a BYOD member''s own claim of a remote access trojan on a third-party carrier employee''s computer. TrendAI states no vulnerability, malware sample or indicator is public and that its hunting list (privileged-group and Group Policy changes with new scheduled tasks or startup scripts, domain-controller sign-ins from workstations, new privileged cloud roles and application credentials, bursts of MFA prompts, unusual remote-access tools, mass file renaming, shadow-copy deletion, large database exports) is built from behaviours victims describe, not from analysed intrusions. Why borderline: the 2026-11-22T0355Z fire dropped it (outside the Swiss and European nexus; the group''s own claims). The case for return is that the victims are public universities, a university hospital and a state agency and the access pattern (valid accounts, hybrid AD plus Entra, Group Policy deployment) is the same one Swiss cantonal hospitals, universities and administrations carry; the case against is that TrendAI''s piece is a vendor synthesis without first-hand telemetry and no Swiss or European victim exists.'
