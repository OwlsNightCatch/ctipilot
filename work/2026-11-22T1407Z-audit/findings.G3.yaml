  summary: 'Kaspersky (2026-11-17) describes Operation ShadowCloud, an intrusion campaign it first saw in early 2026 in which the actor abuses the legitimate MeshCentral agent to drop two new backdoors whose command channels hide behind cloud services: GraphDoor authenticates to login.microsoftonline.com with a hard-coded client ID and secret (client-credentials grant, an application not a user) and exchanges encrypted data as files in a SharePoint document library through Microsoft Graph, while GitDoor uses GitHub; plug-ins include a modified Erfrp proxy and an Ably channel proxy. Loaders are sideloaded DLLs (Sandboxie, OpenJDK, Python, ZoomIt binaries) reading an encrypted config.ini. Victims are in Asia and Africa, primarily government (the entry point seen was at a Taiwanese organisation). Kaspersky points to Chinese-speaking groups; Sophos CTU, which covered a fragment on 2026-10-20 as BRONZE SANDCASTLE, corroborates the Sandboxie sideloading signature. Why borderline: dropped by two earlier fires because no source ties the campaign to Europe and the Graph-C2 and DLL-sideloading classes are known. Retained here because the detection hook (a non-browser process on an endpoint obtaining Graph tokens for a foreign tenant and writing .js.map-named files to SharePoint) applies to any Microsoft 365 egress-monitoring programme in a government SOC.'
