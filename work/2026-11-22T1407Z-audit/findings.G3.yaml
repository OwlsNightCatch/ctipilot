  summary: 'Talos (2026-11-18) surveys C2 resilience from DGAs, domain fronting and P2P to dead-drop resolvers on public blockchains: Bitcoin transactions, EVM smart contracts (EtherHiding), TRON wallets and Solana memo programs, read through read-only RPC queries that return an encrypted C2 configuration into process memory, so domain seizures and blocklists do not cut the channel. Talos''s defensive conclusion is to move from static domain blocklists to monitoring anomalous outbound JSON-RPC traffic and endpoint memory and to treat blockchain infrastructure as a threat communication channel. The companion UAT-12643 post of the same day was dropped earlier (low-confidence DPRK attribution, no constituency nexus). Why borderline: a technique-class overview whose subject is already carried by the 2026-08-23 blockchain dead-drop C2 entry and the EtherHiding entries; no new campaign, victim or Swiss nexus.'
