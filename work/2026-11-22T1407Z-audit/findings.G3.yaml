  discovery_trace: 'first seen at: infosec-magazine, feed URL https://www.infosecurity-magazine.com/rss/news/ (item ''Mail Bombing Attacks Fuel IT Helpdesk Impersonation Scams'', Fri 20 Nov 2026 11:55 UTC) -> pivot: https://www.infosecurity-magazine.com/news/mail-bombing-attacks-it-helpdesk/ -> primary: https://www.fortra.com/blog/mail-bombing-pretext-teams-vishing-attack (found via WebSearch (''Fortra FIRE mail bombing Teams vishing IT helpdesk impersonation update November 2026''); read with extract, served by the reader)'
  summary: 'Fortra FIRE (2026-11-19) tracks targeted mail bombing, in which an address is entered into newsletter, registration and demo forms across unrelated sites so that legitimate services flood the inbox (peak about 10,000 messages per campaign, about 1,000 a day; Mailchimp and Mandrill most seen, then Amazon SES and SendGrid), followed at the peak by a Microsoft Teams contact from a supposed internal IT representative who gives verbal and e-mail instructions that supposedly stop the flood. FIRE says indicators suggest an AI agent crawls pages for signup boxes, saw a phishing page with fake validation steps during the waves but cannot link it to the bombing operator or the Teams calls, and advises independent verification of any support contact, recipient-scoped containment with expiry, review of allowlist exceptions for the delivery platforms and review of Teams external-access settings and policies. Detection guidance: look across a recipient''s inbox for a volume surge from unrelated senders with repeated signup language (List-Unsubscribe headers help but legitimate bulk mail has them too); individual messages pass SPF, DKIM and DMARC. Why borderline: mail bombing followed by Teams impersonation is a known pattern (store entry 2026-08-24 SynkLoader Teams helpdesk impersonation); the delta is the agent-driven signup automation and the delivery-platform mix, reported by a single vendor.'
