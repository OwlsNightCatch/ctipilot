    attribution: Huntress
    source_url: https://www.huntress.com/blog/detecting-timeroasting
  - quote: Do not build on packet size.
    attribution: Huntress
    source_url: https://www.huntress.com/blog/detecting-timeroasting
  - quote: During this testing, none of them fired on timeroasting.
    attribution: Huntress
    source_url: https://www.huntress.com/blog/detecting-timeroasting
  - quote: Note that the client does not actually have to authenticate itself to the NTP server.
    attribution: Secura / Bureau Veritas Cybersecurity
    source_url: https://cybersecurity.bureauveritas.com/uploads/whitepapers/Secura-WP-Timeroasting-v3.pdf
  extended_notes: 'Detection (network telemetry class first): UDP/123 requests to domain controllers larger than a plain 48-byte NTP request, from a single source address and ephemeral port, walking RIDs sequentially for accounts other than the sender''s own machine account; DC-side Windows Filtering Platform 5156 (needs the subcategory enabled) or EDR network events; on the sender, any non-time-service process sending UDP/123 to a DC. Directory-change telemetry (5136, sAMAccountName change with a trailing $ plus userAccountControl flip) covers the privileged targeted variant only. Hardening: rotate and verify machine-account and trust-account password rotation, remove legacy or image-built machines and hand-set trust passwords; Samba AD domain controllers do not implement the extended form (Huntress). Triage: a legitimate domain member sends the same authenticated request with a zeroed MAC for its own RID at time-sync intervals; the discriminator is a foreign RID, a sweep, volume and a non-time-service sender. No IOCs and no rule code are carried; Huntress''s Suricata rules are not reproduced.'
