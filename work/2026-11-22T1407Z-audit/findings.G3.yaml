  summary: 'Unit 42 (publication 2026-11-20) reports, from its own telemetry and incident-response engagements, on Com-affiliated vishing, cloud data theft and extortion since August 2026. It names Bling Libra (aka ShinyHunters), the clusters CL-CRI-1116 (Redact, formerly BlackFile), 1147 (Pink), 1182 (Falcon) and 1192 (Helix), and two clusters it says are new: CL-CRI-1264 (Vortex, first seen September 2026) and CL-CRI-1274 (Cinder), which it says overlap activity Google tracks as UNC6671. Facts as stated by Unit 42: CL-CRI-1264 mainly targets healthcare, pharmaceutical and medical organisations; staff are phoned by ''internal IT support'' and sent to per-organisation subdomains that act as adversary-in-the-middle proxies passing credentials and MFA approvals through in real time; an unauthorised MFA device is enrolled within minutes (one device name, ''Pixel 10a'', reused across accounts); Microsoft 365 mailbox, OneDrive and SharePoint content is pulled by scripts with a python-httpx user agent; victims are then messaged directly in Microsoft Teams and pointed to a Tor negotiation site. CL-CRI-1274 avoids re-prompting for Duo MFA by replaying a persistent keep-me-signed-in session token from proxy infrastructure, collects data with python-requests and the Microsoft Graph SDK, and sends extortion by email and Teams from a compromised account. For CL-CRI-1192 (the Helix/UNC6671 lineage) Unit 42 describes a malicious Chromium extension named ''Google Chrome'' (manifest 1.6.111, a second build 1.6.112): not in the Chrome Web Store, downloaded from an attacker server and sideloaded in Developer Mode, it logs keystrokes, takes local/session storage and IndexedDB, harvests Microsoft and Google authentication cookies, scans pages for QR codes, streams the webcam and gives operators remote control through chrome.debugger (hidden screenshots, input events, clipboard, navigation). Kevin Pham''s separate static analysis of builds 1.6.111 and 1.6.112 (2026-09-10) matches the capability list. Victimology (Unit 42): healthcare overtook financial services in September and stayed the most targeted sector in October alongside financial services; most targeted organisations are US-based, Australia rose from under 1% of observed subdomains to about 13% in October; no Swiss or continental-European victim is named. Unit 42 assesses (moderate confidence) that the extension is an alternative way to extract credentials from desktop browsers and says it has no evidence the extension is shared with other Com actors. Its recommendations: tighten help-desk verification, move to phishing-resistant MFA (FIDO2/passkeys), enforce browser-extension allowlists, alert on identity actions and on unauthorised data exports. Delta against the store: the UNC6671 entry carries the GTIG 2026-08-06 report (vishing to AiTM to rogue MFA to SharePoint exfiltration, passkey-enrolment pretext) but none of the browser-extension implant, the Vortex and Cinder clusters, the keep-me-signed-in token replay, the Teams-based extortion message step, or the healthcare shift.'
  region_nexus: US, UK and Australia observed (Unit 42); no Swiss or continental-European victim named; transferable to Swiss cantonal hospitals and administrations that run Microsoft 365/Entra ID or Okta/Duo SSO with a phone-based help desk
