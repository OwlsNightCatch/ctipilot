  summary: 'Symantec (2026-11-19) reports that on 2026-09-20 a stock exchange in an African country ran 41 PowerShell modules under a web shell on an IIS server for 3 minutes 12 seconds, a new module every few seconds, hunting domain policy-folder and application-directory secrets (cloud keys, database connection strings), mapping cloud and database estate, enumerating SharePoint, SCCM and TFS servers and testing credentials, a reused bearer token and API keys against the exchange''s investment API and a securities-depository gateway. Every module shared one scaffold with the same DNS exfiltration loop copied byte for byte, hex-encoding output into 50-character chunks resolved as unique subdomains of a public out-of-band testing service, which Symantec calls rarely seen. Symantec attributes six persistence implants on the same server to Witchetty (LookingFrog) with high confidence but explicitly does not attribute the AI-authored toolkit to any group; earliest malicious activity dated from April 2026. Why borderline: Symantec''s assessment of AI authorship is inference from code uniformity; the victim is African and no source ties the activity to Europe; the earlier fire dropped Symantec''s AI-assisted retailer intrusion on the same reasoning. The transferable detection hook is DNS egress from a web-server or IIS worker process to out-of-band testing domains in bursts of per-module lookups.'
