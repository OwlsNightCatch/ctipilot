  discovery_trace: 'first seen at: ohey-ca, listing URL https://ohey.ca/research/ (card dated 19 November 2026, fetched with url --direct and extract) -> primary: https://ohey.ca/research/optimjack-iphone-exploit-router-for-rent/ (read with extract) -> pivot: Report URI timeline linked from Ohey, https://blog.report-uri.com/worlds-largest-brands-infected-with-malware-via-optimizely/ (already cited by the store entry; read with extract for the earlier webshell.lol wave)'
  summary: 'Ohey (2026-11-19) reports from its own scans and archives that the iPhone exploit router served through the poisoned vendor scripts (the OPTIMJACK activity on BBC, Zoom and other sites) is a rental service: the operator rents it by channel code, renters get a reseller console that lists each phone''s wallets, keystores, Keychain, messages and photos and alerts them on Telegram, and the vendor attack ran on the router''s own ''house'' channel. Ohey holds 31 renter codes in use since 31 August 2026 (renters include a fake-verification kit that put the router on 33 hacked sites, a gambling network and a LenAI operator). On the vendor path Ohey reports that the poisoned Kissmetrics, StorifyMe and minute-ly scripts all loaded one file that Report URI traced to ''linkforge'', a seller of hidden backlinks on hacked sites; on 9 November linkforge''s connector script on its hacked sites swapped ad-network code for the router, and the vendor files loaded the router from 13 November. Report URI independently dates the earlier webshell.lol wave through Kissmetrics, StorifyMe and Minute Media to 13 to 16 November and separates it from the Optimizely injection of 16 November. Ohey says registrars put the vendor loader hosts on hold on 17 November and linkforge on 18 November, that this removed delivery but not the service, and that nine of 24 router hosts still answered at 22:10 UTC on 18 November. Delta against the store: the OptimJack entry (updated 2026-11-19T05:06Z) says Optimizely''s sign-up-flow flaw was the vector and lists the other vendors, but it carries nothing on the rental model, on the hidden-backlink origin of the Kissmetrics/StorifyMe/minute-ly path, or on the registrar takedowns and the surviving router hosts. Ohey is a single small web-threat lab; the linkforge link rests on Report URI''s trace as relayed by Ohey and on Ohey''s own archive reading. Swiss relevance is indirect: the exposure is any organisation that loads third-party marketing, analytics or backlink scripts into pages that iPhone users open.'
