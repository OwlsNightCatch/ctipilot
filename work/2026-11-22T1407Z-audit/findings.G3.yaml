  summary: 'Ohey (2026-11-16) follows the ClickFix path end to end from its own trackers: a hacked page reads its server address from a smart contract through a public blockchain gateway (eth_call, free and unlogged on-chain), decrypts the answer with a key in the page, runs the next stage, shows a fake Cloudflare-style check and puts a PowerShell (irm | iex) or macOS Terminal command on the clipboard that the visitor pastes into File Explorer''s address bar (Win+E) or PowerShell (Win+X, I). Tracker data as of 2026-11-16: 240 contracts on seven chains (116 on Ethereum Sepolia or BNB testnet), 382 command hosts of which 192 belong to kits that also read a contract; GzipGnaw''s main host used 1,353 subdomains on 1,315 sites and moved to a new domain a week after a new contract named it; macOS commands clear the Terminal and its history after starting the download. Why borderline: the class (ClickFix, EtherHiding, macOS Terminal paste) is carried by about two dozen store entries since July (for example 2026-07-20 UAC-0145 EtherHiding, 2026-08-07 macOS ClickFix, 2026-09-29 Push Security ClickFix review); this is tracker telemetry with no new defender decision, and the kit and domain names are IOC-type material.'
