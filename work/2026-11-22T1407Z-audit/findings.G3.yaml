- title: 'Fortra FIRE: mail-bombing floods (about 10,000 messages per campaign, via Mailchimp/Mandrill, SES, SendGrid) followed by Microsoft Teams ''internal IT'' vishing; likely driven by an AI agent that crawls signup forms'
