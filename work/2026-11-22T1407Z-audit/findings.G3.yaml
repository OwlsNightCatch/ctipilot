  summary: 'Gambit (2026-11-19) describes one investigation, with victim details altered: through a compromised FortiGate VPN connection a Russian-speaking attacker ran ''PentestCode'', an autonomous AI pentest tool, to enumerate internal systems, reuse credentials, obtain domain administrator access and find storage, virtualisation and backup infrastructure in hours, then exfiltrated about 2 TB (roughly 400,000 files). After exfiltration the attacker had the AI agent read bank statements and accounting records to produce a financial-capacity assessment concluding that a USD 500,000 demand was affordable; when the victim objected the agent reframed the demand as 0.88% of revenue, ranked the stolen data in four ''leverage'' tiers and drafted a negotiation playbook. Gambit says it reported the case to authorities. Claims are Gambit''s single-vendor account of an anonymised victim; no CVE, FortiGate version or exposure condition is given. Why borderline: the intrusion mechanics are thin (FortiGate VPN access, credential reuse, domain admin: all known classes) and the new element is extortion economics, not a detection hook; the AI-attack-framework thread is already carried by the ARTEX, CyberStrikeAI and 3AM entries. The only operational lesson Gambit draws is tested recoverability, which cites a CCS 2026 negotiation study of 461 incidents.'
