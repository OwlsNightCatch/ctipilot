  summary: "(low confidence) Same shape as iteration 2's Oracle F8. Exposure now names SENTRON Powermanager, SICAM PAS CC and SICAM SCC, but the takeaway, actions[0] and cves[].fixed still give the Siemens remedy for Desigo CC only. SSA-045512 V1.3 (https://cert-portal.siemens.com/productcert/html/ssa-045512.html) gives SENTRON Powermanager V8/V9 and Integrated PA Suite Tester 'Install the latest .NET security updates via Windows Update' and SICAM PAS CC (>= V6.02) and SICAM SCC (>= V7.01) 'Currently no fix is planned. Temporarily disable Brotli compression and decompression at the application or proxy layer if it is not strictly required.' Name those remedies beside Desigo CC (an action is not required, the takeaway and fixed field are)."
