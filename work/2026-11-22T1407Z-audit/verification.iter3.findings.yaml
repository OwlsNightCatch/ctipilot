- code: F3
  category: claim-not-supported
  section: body
  item: "2026-11-20/vmware-vcenter-cve-2026-123890-auth-bypass-exploited-gtig, Detection line and Improvement section 2026-11-22T14:57:35Z (also the audit report vCenter row)"
  url_or_quote: "Detection: \"reads of the Directory Service database, the master key and the PostgreSQL credential file over SSH\" / section: \"describes the Directory Service, master-key and credential-file reads as taking place over SSH\" / report: \"GTIG: SSH via the appliance management API, reads over SSH\""
  summary: "GTIG (https://cloud.google.com/blog/topics/threat-intelligence/armory-castle-exploits-vsphere/) says the Directory Service data.mdb is acquired by BONESAW through the vmdird RPC interface: 'Using the authenticated administrator session, the attacker can execute arbitrary commands and acquire files, including the data.mdb database, by leveraging the vCenter Server Directory Service (vmdird) RPC interface vmdirdbcp', and BONESAW 'streams the raw underlying LMDB file'. Only the master crypto key file and the PostgreSQL password file were taken 'using SSH', after SSH was enabled through the VAMI API. The text this fire changed puts all three reads over SSH; the entry's own main analysis already has the order right (BONESAW read the database; SSH was switched on afterwards for the key and credential file). Fix the Detection line and the section to separate the RPC read of the Directory Service database (TCP 2012) from the SSH reads of the master key and PostgreSQL credential file, and the report row likewise."
- code: F3
  category: claim-not-supported
  section: body
  item: "2026-11-07/cve-2026-111497-brotli-desigo-cc-mitel-openscape-cisco-duo, Defender takeaway"
  url_or_quote: "Update OpenScape SBC to V11R3.4.5, apply Mitel's SESAP and Contact Center workarounds, and update Duo Network Gateway to 3.4.2 and Nexus Guest Shell to Guestshell 4.9, as Cisco's table lists ([Cisco PSIRT, 2026-10-27](https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-oct2026-node-js-Jj3SQ19u))"
  summary: "(low confidence) The only citation terminates a sentence that chains Mitel's SBC V11R3.4.5 and the SESAP and Contact Center workarounds with Cisco's Duo Network Gateway 3.4.2 and Guestshell 4.9. The Cisco advisory carries only the Cisco items; the Mitel items sit on https://www.mitel.com/support/security-advisories/mitel-product-security-advisory-misa-2026-0010 ('Update to V11R3.4.5. Workaround available'; SESAP KB000129034; Contact Center KB000129114). The SBC clause was rewritten this fire. Split the sentence and cite Mitel for its half."
