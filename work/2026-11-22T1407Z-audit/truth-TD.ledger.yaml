  - claim_id: fbdfbb9224
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "body"
    kind: cited
    text: "CISA added CVE-2026-115731 to its Known Exploited Vulnerabilities catalog on 2026-11-17 on evidence of active exploitation, naming no actor or victim ("
    urls: ["https://www.cisa.gov/news-events/alerts/2026/11/17/cisa-adds-one-known-exploited-vulnerability-catalog"]
  - claim_id: f5f2af9b61
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "body"
    kind: cited
    text: "The flaw sits in Puppet's report-processing code as used by Puppet Server: a client that holds any CA-signed agent certificate can run arbitrary code on the server as its service user by sending a report with a crafted rich-data type in a PUT request, and where the certificate authority autosigns requests without strong verification an unauthenticated network attacker can first obtain such a certificate ("
    urls: ["https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-116495"]
  - claim_id: d3b5170533
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "body"
    kind: cited
    text: "The CNA scores it CVSS 4.0 9.4 ("
    urls: ["https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-116495"]
  - claim_id: 3edf2e8dab
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "body"
    kind: cited
    text: ") and Red Hat CVSS 3.1 9.9 ("
    urls: ["https://access.redhat.com/security/cve/CVE-2026-115731"]
  - claim_id: 3ba2c66a27
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "body"
    kind: cited
    text: "The discoverers at Neodyme call the bug authenticated in the strict sense, because it needs a valid agent certificate, and say it allows code execution on the management server in a default configuration ("
    urls: ["https://neodyme.io/en/blog/puppet_rce/"]
  - claim_id: d0b1948af0
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "body"
    kind: cited
    text: "The OpenVox advisory of the same day includes a full trigger event and says autosign is common in enterprise deployments and that code execution as the puppet user gives access to the CA signing key ("
    urls: ["https://github.com/OpenVoxProject/openvox/security/advisories/GHSA-ffr6-rwpm-p5wq"]
  - claim_id: 56fad9e0ef
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "body"
    kind: cited
    text: "Puppet's 2026.0.1 release notes list the flaw among the fixes in Puppet Enterprise 2026.0.1 ("
    urls: ["https://help.puppet.com/pe/current/topics/release-notes-pe-x-1.htm"]
  - claim_id: 4257793036
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "body"
    kind: cited
    text: "), and the EUVD record names 2025.12.1 and 2023.8.13 as the fixed releases of the other two lines ("
    urls: ["https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-116495"]
  - claim_id: 16f4eaf6c0
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "body"
    kind: cited
    text: "); OpenVox fixes it in server 9.2.0 and 8.18.0 ("
    urls: ["https://www.openwall.com/lists/oss-security/2026/11/03/14"]
  - claim_id: a03cddfdf6
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "body"
    kind: cited
    text: "), and Vox Pupuli says open-source Puppet will not receive any more updates ("
    urls: ["https://voxpupuli.org/blog/2026/11/03/critical-cve-updates/"]
  - claim_id: 2e1df6786e
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "body"
    kind: cited
    text: "**Exposure:** a Puppet Enterprise or OpenVox server below the fixed releases that accepts agent connections; the reachable condition is a CA-signed agent certificate, which an outsider obtains where the CA autosigns without strong verification, a setup the OpenVox advisory calls common in enterprise deployments ("
    urls: ["https://github.com/OpenVoxProject/openvox/security/advisories/GHSA-ffr6-rwpm-p5wq"]
  - claim_id: 14cc1fa9ca
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "body"
    kind: cited
    text: "A server that untrusted clients could reach before the upgrade should be treated as having exposed its CA signing key, since code execution as the puppet user reaches it ("
    urls: ["https://github.com/OpenVoxProject/openvox/security/advisories/GHSA-ffr6-rwpm-p5wq"]
  - claim_id: 3410070386
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** upgrade now and, until then, avoid autosigning certificate requests without strong verification ("
    urls: ["https://access.redhat.com/security/cve/CVE-2026-115731"]
  - claim_id: ad086f9353
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "body"
    kind: cited
    text: "The 2026.0.1 upgrade changes `auth.conf` wildcard matching, so a rule for `*.example.com` no longer matches `example.com` itself and rules that relied on that need review ("
    urls: ["https://help.puppet.com/pe/current/topics/release-notes-pe-x-1.htm"]
  - claim_id: 110ba94a35
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "body"
    kind: derived
    text: "**Detection:** on the Puppet server, PUT requests to the agent report endpoint from hosts that enrolled recently, newly signed certificate requests that nobody approved, and child processes of the server's service account."
  - claim_id: 70e4cf5999
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "section 2026-11-20T05:12:02Z"
    kind: cited
    text: "The same Perforce advisory fixed a second flaw, CVE-2026-115732, an authorization bypass in the certificate-name matching of Puppet's authorization library, scored CVSS 4.0 9.0: a CA-signed certificate whose name extends or shortens an authorised host name is authorised as that host ("
    urls: ["https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-116493"]
  - claim_id: 792861d04b
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "section 2026-11-20T05:12:02Z"
    kind: cited
    text: "Neodyme's example is that an attacker who got a certificate for `evil.target.lab.local` can authenticate as `target.lab.local`, then fetch that host's catalog, which can carry configuration files with database credentials and API tokens, push spoofed facts and add exported resources ("
    urls: ["https://neodyme.io/en/blog/puppet_rce/"]
  - claim_id: 8c19516373
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "section 2026-11-20T05:12:02Z"
    kind: cited
    text: "Where the CA autosigns, such a certificate can be requested for a name that does not exist yet, and OpenVox says autosign is not the default but is common in real deployments ("
    urls: ["https://github.com/OpenVoxProject/trapperkeeper-authorization/security/advisories/GHSA-q4hm-33rc-572g"]
  - claim_id: d7de342aac
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "section 2026-11-20T05:12:02Z"
    kind: cited
    text: "); NCSC.ch adds that in Puppet Enterprise the bypass also enables CA administration and remote command execution on managed nodes ("
    urls: ["https://security-hub.ncsc.admin.ch/#/posts/13204"]
  - claim_id: 082d531d75
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "section 2026-11-20T05:12:02Z"
    kind: cited
    text: "The fix is in the same Puppet Enterprise builds, in Puppet Core 9.1.3 and 8.22.2 and, for OpenVox Server and OpenVoxDB, in 9.2.0 and 8.18.0 ("
    urls: ["https://www.securityweek.com/critical-perforce-puppet-rce-exploited-in-attacks/", "https://github.com/OpenVoxProject/trapperkeeper-authorization/security/advisories/GHSA-q4hm-33rc-572g"]
