    surface: "section 2026-11-20T05:12:02Z"
    kind: cited
    text: "CISA's catalog entry covers only CVE-2026-115731 ("
    urls: ["https://www.cisa.gov/news-events/alerts/2026/11/17/cisa-adds-one-known-exploited-vulnerability-catalog"]
  - claim_id: a91fdc7bb1
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "section 2026-11-20T05:12:02Z"
    kind: cited
    text: "); NCSC.ch labels the pair actively exploited with a proof of concept available and lists a community report as an additional source ("
    urls: ["https://security-hub.ncsc.admin.ch/#/posts/13204"]
  - claim_id: afc1e0eaa4
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "section 2026-11-20T05:12:02Z"
    kind: cited
    text: "), while the report The Hacker News quotes describes a CVE-2026-115731 intrusion, so exploitation of CVE-2026-115732 itself is not established ("
    urls: ["https://thehackernews.com/2026/11/hackers-exploiting-critical-puppet-rce.html"]
  - claim_id: f88249ecfd
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "section 2026-11-20T05:12:02Z"
    kind: cited
    text: "NCSC.ch's temporary measures are to disable certificate autosigning, enforce strong request validation, audit the issued certificates for colliding names and review the CA configuration for signs of compromise ("
    urls: ["https://security-hub.ncsc.admin.ch/#/posts/13204"]
  - claim_id: a827f08dc2
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "record 2026-11-20T05:12:02Z"
    kind: record-summary
    text: "The same advisory fixed CVE-2026-115732 (CVSS 4.0 9.0), a certificate-name authorization bypass that lets a certificate for a name extending a real host name authenticate as that host; the fixed builds are the same and Puppet Core 9.1.3 and 8.22.2 are added. CISA lists only CVE-2026-115731, and exploitation of the second flaw is not established."
  - claim_id: 253265be35
    entry: 2026-11-18/drupal-core-critical-release-2026-11-18-psa-2026-11-16
    surface: "headline"
    kind: frontmatter
    text: "Drupal 11.4.13, 11.3.22, 10.6.22 fix an installer reinstall to takeover or RCE (SA-017, Critical); update now"
  - claim_id: a3383ed0c6
    entry: 2026-11-18/drupal-core-critical-release-2026-11-18-psa-2026-11-16
    surface: "summary"
    kind: frontmatter
    text: "Drupal published SA-CORE-2026-017 (CVE-2026-132165, Critical 18 of 25) and SA-CORE-2026-018 (CVE-2026-132166, Moderately critical, not directly exploitable) on 2026-11-18: under specific conditions an attacker can use the installer to attempt to reinstall Drupal, which can lead to site takeover or remote code execution. Fixed in 11.4.13, 11.3.22 and 10.6.22, the only workaround is securing the installer, and no source reports exploitation, although the Security Team had warned that exploits might be developed within hours or days."
  - claim_id: ab8bf58aa2
    entry: 2026-11-18/drupal-core-critical-release-2026-11-18-psa-2026-11-16
    surface: "actions[0]"
    kind: frontmatter
    text: "Update every Drupal site to 11.4.13, 11.3.22 or 10.6.22 now and move sites on end-of-life lines (Drupal 11.2.x and 10.5.x and below) to a supported branch, and where the update has to wait secure the installer as Drupal's instructions for securing install.php describe, because SA-CORE-2026-017 lets an attacker who reaches the installer attempt a reinstall that can end in site takeover or remote code execution."
