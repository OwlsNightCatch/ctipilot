    text: "Drupal published the announced core security release on 2026-11-18: SA-CORE-2026-017 (CVE-2026-132165, Critical, installer reinstall leading to site takeover or remote code execution) and SA-CORE-2026-018 (CVE-2026-132166, not directly exploitable), fixed in 11.4.13, 11.3.22 and 10.6.22. No exploitation is reported."
  - claim_id: 50081db780
    entry: 2026-11-18/microsoft-agent-framework-pypi-credential-stealer-pth-hook
    surface: "headline"
    kind: frontmatter
    text: "Microsoft's agent-framework on PyPI carried a Python-startup credential stealer in 1.26.1 and 1.26.2; pin 1.26.0"
  - claim_id: 32307d7e7d
    entry: 2026-11-18/microsoft-agent-framework-pypi-credential-stealer-pth-hook
    surface: "summary"
    kind: frontmatter
    text: "Socket and SafeDep report that versions 1.26.1 and 1.26.2 of Microsoft's official agent-framework metapackage were published to PyPI on 2026-11-17, about 33 minutes apart, with a .pth file that runs a credential stealer whenever Python starts, so a pip install in a CI job is enough. It collects environment secrets and credential files and requests Azure managed-identity, Azure DevOps and, in 1.26.2, GitHub Actions OIDC tokens. Both versions were removed from PyPI and 1.26.0 is the last clean release; how the attacker obtained publishing access is not known."
  - claim_id: b000643460
    entry: 2026-11-18/microsoft-agent-framework-pypi-credential-stealer-pth-hook
    surface: "actions[0]"
    kind: frontmatter
    text: "Search lockfiles, requirements files and CI install logs for agent-framework 1.26.1 or 1.26.2 installed since 2026-11-17 20:35 UTC, and on every host or job that ran Python after installing either, treat the environment variables, local credential files, Azure managed-identity and Azure DevOps tokens and, for 1.26.2, GitHub Actions OIDC tokens as stolen and rotate them, then pin agent-framework to 1.26.0 or earlier."
  - claim_id: e8a88f8c2d
    entry: 2026-11-18/microsoft-agent-framework-pypi-credential-stealer-pth-hook
    surface: "body"
    kind: cited
    text: "Socket reports that the Microsoft agent-framework PyPI package was compromised on 2026-11-17, in versions 1.26.1 and 1.26.2, both of which install Python startup hooks that collect credentials, environment data and cloud identity tokens and send them to a web endpoint ("
    urls: ["https://socket.dev/blog/agent-framework-pypi-package-compromised-with-credential-stealer"]
  - claim_id: 222ae40928
    entry: 2026-11-18/microsoft-agent-framework-pypi-credential-stealer-pth-hook
    surface: "body"
    kind: cited
    text: "SafeDep, which flagged both releases independently, says the project is Microsoft's official metapackage, published under the microsoft account on PyPI, that 1.26.1 appeared at 20:35 UTC and 1.26.2 at 21:08 UTC, that each is a single wheel where earlier releases shipped a wheel and a source archive, and that both were removed from PyPI and 1.26.0 is the last clean release ("
    urls: ["https://safedep.io/blog/microsoft-agent-framework-pypi-compromise"]
  - claim_id: 1355382f31
    entry: 2026-11-18/microsoft-agent-framework-pypi-credential-stealer-pth-hook
    surface: "body"
    kind: cited
    text: "The attacker published 1.26.2 after 1.26.1 was gone, so removing one version did not stop it, and how it obtained publishing access is not known ("
    urls: ["https://safedep.io/blog/microsoft-agent-framework-pypi-compromise"]
  - claim_id: 63fbd77a7c
    entry: 2026-11-18/microsoft-agent-framework-pypi-credential-stealer-pth-hook
    surface: "body"
    kind: cited
    text: "Nothing has to import the package: a .pth file runs on Python startup, imports a module and launches collection in a background process or thread, so a pip install in a CI job is enough ("
    urls: ["https://socket.dev/blog/agent-framework-pypi-package-compromised-with-credential-stealer", "https://safedep.io/blog/microsoft-agent-framework-pypi-compromise"]
  - claim_id: 24883adcde
    entry: 2026-11-18/microsoft-agent-framework-pypi-credential-stealer-pth-hook
    surface: "body"
    kind: cited
    text: "). 1.26.1 routes through the package's own initializer, while 1.26.2 moves the payload to a new top-level module and restores the legitimate initializer byte for byte, so checking only the initializer misses it ("
    urls: ["https://socket.dev/blog/agent-framework-pypi-package-compromised-with-credential-stealer"]
  - claim_id: 31aecc9d04
    entry: 2026-11-18/microsoft-agent-framework-pypi-credential-stealer-pth-hook
    surface: "body"
    kind: cited
    text: "The code matches environment variables by substring, such as TOKEN, SECRET, KEY and AZURE, reads other processes' environments and credential files for pip, npm, netrc, git, Docker, Hugging Face and Foundry, and actively requests fresh Azure managed-identity and Azure DevOps tokens, with GitHub Actions OIDC tokens added in 1.26.2; it compresses the result and posts it to a web endpoint and downloads no further code ("
    urls: ["https://socket.dev/blog/agent-framework-pypi-package-compromised-with-credential-stealer"]
  - claim_id: a80c08146e
    entry: 2026-11-18/microsoft-agent-framework-pypi-credential-stealer-pth-hook
    surface: "body"
    kind: cited
    text: "There is no persistent on-disk marker, so fresh process trees can trigger collection again ("
    urls: ["https://socket.dev/blog/agent-framework-pypi-package-compromised-with-credential-stealer"]
  - claim_id: 8569938289
    entry: 2026-11-18/microsoft-agent-framework-pypi-credential-stealer-pth-hook
    surface: "body"
    kind: cited
    text: "**Exposure:** any developer machine, CI job or container that installed agent-framework 1.26.1 or 1.26.2 and then ran Python; lockfiles and requirements files show the installed version, and the last clean release is 1.26.0 ("
    urls: ["https://safedep.io/blog/microsoft-agent-framework-pypi-compromise"]
  - claim_id: 6c638d8e63
    entry: 2026-11-18/microsoft-agent-framework-pypi-credential-stealer-pth-hook
    surface: "body"
    kind: cited
    text: "**Detection:** lockfiles and requirements files naming the two versions, and a .pth file added to site-packages by the package, looked for on disk without starting the environment's Python, because starting it runs the stealer again ("
    urls: ["https://safedep.io/blog/microsoft-agent-framework-pypi-compromise"]
  - claim_id: 29baca4f61
    entry: 2026-11-18/microsoft-agent-framework-pypi-credential-stealer-pth-hook
    surface: "body"
    kind: cited
    text: "); outbound POSTs to a web-hook service from build and developer hosts; because the stealer requests identity tokens, review sign-in and activity logs for the managed identities and federated credentials the environment could use, from the install time onward ("
    urls: ["https://safedep.io/blog/microsoft-agent-framework-pypi-compromise"]
  - claim_id: 6670d4ceb2
    entry: 2026-11-18/microsoft-agent-framework-pypi-credential-stealer-pth-hook
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** remove both versions, rotate every secret and federated identity a host or job could read, and pin agent-framework to a known clean version; Socket advises rotating potentially exposed credentials where either version was installed ("
    urls: ["https://socket.dev/blog/agent-framework-pypi-package-compromised-with-credential-stealer"]
