  - claim_id: e65f93251a
    entry: 2026-11-18/typo3-core-security-releases-2026-11-17-installer-chain
    surface: "body"
    kind: cited
    text: "TYPO3 released ten core advisories on 2026-11-17, fixed in 14.3.12 LTS, 13.4.40 LTS, 12.4.52 ELTS, 11.5.57 ELTS and 10.4.63 ELTS ("
    urls: ["https://news.typo3.com/article/typo3-14312-13440-12452-11557-and-10463-security-releases-published"]
  - claim_id: 22161f1fc0
    entry: 2026-11-18/typo3-core-security-releases-2026-11-17-installer-chain
    surface: "body"
    kind: cited
    text: "); versions 10.0.0 to 10.4.62, 11.0.0 to 11.5.56, 12.0.0 to 12.4.51, 13.0.0 to 13.4.39 and 14.0.0 to 14.3.11 are affected ("
    urls: ["https://news.typo3.com/security/advisory/typo3-core-sa-2026-027"]
  - claim_id: e1bc99b154
    entry: 2026-11-18/typo3-core-security-releases-2026-11-17-installer-chain
    surface: "body"
    kind: cited
    text: "SA-027 is rated Critical: placing a file whose name starts with FIRST_INSTALL in the public web root or the project root re-enables the installer on a configured instance without authentication, which allows changing the database connection and creating a new administrator and system maintainer account, and that leads to remote code execution; leftover or restored marker files also work ("
    urls: ["https://news.typo3.com/security/advisory/typo3-core-sa-2026-027"]
  - claim_id: 56dad4d82c
    entry: 2026-11-18/typo3-core-security-releases-2026-11-17-installer-chain
    surface: "body"
    kind: cited
    text: "SA-026, rated High, supplies the file: the backend endpoint for adding online media accepts a target folder in the fallback storage, which points to the public web root, so any authenticated low-privileged backend user can create media files with a partially controllable name there ("
    urls: ["https://news.typo3.com/security/advisory/typo3-core-sa-2026-026"]
  - claim_id: d6999635d6
    entry: 2026-11-18/typo3-core-security-releases-2026-11-17-installer-chain
    surface: "body"
    kind: cited
    text: "TYPO3 states that SA-029, a Medium information disclosure in the Form Framework, is known to be actively exploited, and names no actor, victim or behaviour ("
    urls: ["https://news.typo3.com/security/advisory/typo3-core-sa-2026-029"]
  - claim_id: b9b70e069e
    entry: 2026-11-18/typo3-core-security-releases-2026-11-17-installer-chain
    surface: "body"
    kind: cited
    text: "A failed upload shows the raw storage error with the upload sub-folder, so an attacker can derive the public URL of an uploaded file, and where the form accepts HTML this becomes cross-site scripting unless the web server applies TYPO3's recommended Content-Security-Policy to the upload folder ("
    urls: ["https://news.typo3.com/security/advisory/typo3-core-sa-2026-029"]
  - claim_id: a682e93a06
    entry: 2026-11-18/typo3-core-security-releases-2026-11-17-installer-chain
    surface: "body"
    kind: cited
    text: "SA-032 closes the matching gap, an empty allowedMimeTypes list that was treated as no restriction and let unauthenticated visitors upload HTML or SVG to a public folder ("
    urls: ["https://news.typo3.com/security/advisory/typo3-core-sa-2026-032"]
  - claim_id: 8021fc289b
    entry: 2026-11-18/typo3-core-security-releases-2026-11-17-installer-chain
    surface: "body"
    kind: cited
    text: "SA-028 lets ImageMagick's MVG coder disclose any web-server-readable file through a processed image; it needs ImageMagick with its default configuration allowing the MVG coder, and unauthenticated visitors reach it where such an upload form exists ("
    urls: ["https://news.typo3.com/security/advisory/typo3-core-sa-2026-028"]
  - claim_id: dbdb0c9ded
    entry: 2026-11-18/typo3-core-security-releases-2026-11-17-installer-chain
    surface: "body"
    kind: cited
    text: "SA-025 is an Import/Export path traversal that writes arbitrary files and needs an administrator or a user enabled for import ("
    urls: ["https://news.typo3.com/security/advisory/typo3-core-sa-2026-025"]
  - claim_id: 387088fcc3
    entry: 2026-11-18/typo3-core-security-releases-2026-11-17-installer-chain
    surface: "body"
    kind: cited
    text: "Four lesser flaws are an incomplete open-redirect fix (SA-030), page-cache flooding where cHash validation is not enforced (SA-031), file-dump token reuse (SA-033) and an SSRF in the 14.x Dashboard RSS widget (SA-034) ("
    urls: ["https://news.typo3.com/security/advisory/typo3-core-sa-2026-030", "https://news.typo3.com/security/advisory/typo3-core-sa-2026-031", "https://news.typo3.com/security/advisory/typo3-core-sa-2026-033", "https://news.typo3.com/security/advisory/typo3-core-sa-2026-034"]
  - claim_id: 8cbd60ae89
    entry: 2026-11-18/typo3-core-security-releases-2026-11-17-installer-chain
    surface: "body"
    kind: cited
    text: "**Exposure:** any TYPO3 instance on an affected version; the installer chain needs only a low-privileged backend account, and the Form Framework flaws need a public form with an upload element ("
    urls: ["https://news.typo3.com/security/advisory/typo3-core-sa-2026-026", "https://news.typo3.com/security/advisory/typo3-core-sa-2026-032"]
  - claim_id: bd87035f7b
    entry: 2026-11-18/typo3-core-security-releases-2026-11-17-installer-chain
    surface: "body"
    kind: cited
    text: "**Detection:** files whose name starts with FIRST_INSTALL in the web root or project root, and administrator or system maintainer accounts nobody created ("
    urls: ["https://news.typo3.com/security/advisory/typo3-core-sa-2026-027"]
  - claim_id: 382c1d80ab
    entry: 2026-11-18/typo3-core-security-releases-2026-11-17-installer-chain
    surface: "body"
    kind: cited
    text: "); HTML or SVG files in the form upload folder and web-server logs for direct requests to them ("
    urls: ["https://news.typo3.com/security/advisory/typo3-core-sa-2026-032"]
  - claim_id: a7304191b3
    entry: 2026-11-18/typo3-core-security-releases-2026-11-17-installer-chain
    surface: "body"
    kind: cited
    text: "After updating, configure at least one allowed MIME type for every upload element, because an empty list now refuses uploads ("
    urls: ["https://news.typo3.com/security/advisory/typo3-core-sa-2026-032"]
  - claim_id: 5466960154
    entry: 2026-11-18/typo3-core-security-releases-2026-11-17-installer-chain
    surface: "body"
    kind: cited
    text: "); on 14.x configure the dashboard_rss allowed hosts, because the update alone does not mitigate SA-034 ("
    urls: ["https://news.typo3.com/security/advisory/typo3-core-sa-2026-034"]
  - claim_id: 8953fe0bb5
    entry: 2026-11-18/typo3-core-security-releases-2026-11-17-installer-chain
    surface: "body"
    kind: cited
    text: "); and deliver the form upload folder with a restrictive Content-Security-Policy, which nginx needs configured by hand ("
    urls: ["https://news.typo3.com/security/advisory/typo3-core-sa-2026-029"]
  - claim_id: f558599d6f
    entry: 2026-11-18/typo3-core-security-releases-2026-11-17-installer-chain
    surface: "body"
    kind: cited
    text: "); and, after updating, configure image formats outside the default raster set, such as psd or ppm, explicitly in fileExtensionToMimeType so ImageMagick still processes them ("
    urls: ["https://news.typo3.com/security/advisory/typo3-core-sa-2026-028"]
  - claim_id: c23e6f11b1
    entry: 2026-11-18/typo3-core-security-releases-2026-11-17-installer-chain
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** update to the fixed release of each branch now."
  - claim_id: ed26d12d86
    entry: 2026-11-19/airlock-gateway-cve-2026-19707-smart-form-protection
    surface: "headline"
    kind: frontmatter
    text: "Airlock Gateway: Smart Form Protection buffer overflow can crash or take over the gateway; update to 8.5.3 or 8.6.1"
  - claim_id: 12e6b21693
    entry: 2026-11-19/airlock-gateway-cve-2026-19707-smart-form-protection
    surface: "summary"
    kind: frontmatter
    text: "Airlock (Ergon) published CVE-2026-19707 on 2026-11-18: attacker-controlled HTML in a backend response can overflow a buffer in the Smart Form Protection feature of Airlock Gateway 8.5.0 to 8.5.2 and 8.6.0, possibly causing denial of service or remote code execution against the gateway, when the feature is enabled on a mapping whose backend returns certain multi-byte HTML character references (CVSS 4.0 9.5, high attack complexity). The fix is in 8.5.3 and 8.6.1, no source reports exploitation, and Airlock says a compromised gateway could also affect the protection of the other backends behind it."
  - claim_id: 0eb21be90b
    entry: 2026-11-19/airlock-gateway-cve-2026-19707-smart-form-protection
    surface: "actions[0]"
    kind: frontmatter
    text: "Move every Airlock Gateway running 8.5.0 through 8.5.2 to 8.5.3 and every one running 8.6.0 to 8.6.1, starting with gateways that have Smart Form Protection enabled on a mapping whose backend serves user-supplied HTML, because Airlock says one backend response can crash or take over the gateway that protects every backend behind it."
  - claim_id: b6419f37ed
    entry: 2026-11-19/airlock-gateway-cve-2026-19707-smart-form-protection
    surface: "cves[CVE-2026-19707]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-19707\", \"cvss\": \"9.5 (CVSS 4.0)\", \"status\": [\"patch-available\"], \"affected\": \"Airlock Gateway 8.5.0 to 8.5.2 and 8.6.0 with Smart Form Protection enabled on a mapping whose backend returns certain multi-byte HTML character references\", \"fixed\": \"8.5.3 and 8.6.1\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: ac6e48d3e7
    entry: 2026-11-19/airlock-gateway-cve-2026-19707-smart-form-protection
    surface: "body"
    kind: cited
    text: "It says attacker-controlled HTML in a backend response can exploit the Smart Form Protection feature of Airlock Gateway 8.5.2 and earlier and 8.6.0, possibly leading to a denial of service or remote code execution against the gateway, and that the issue is fixed in 8.5.3 and 8.6.1 ("
    urls: ["https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-128505"]
  - claim_id: 2ef13f5f23
    entry: 2026-11-19/airlock-gateway-cve-2026-19707-smart-form-protection
    surface: "body"
    kind: cited
    text: "The attack needs Smart Form Protection, or the corresponding expert settings, enabled on a mapping whose backend returns a response containing certain multi-byte HTML character references, and the overflow happens while the gateway parses that response; the response can come from a malicious or compromised backend or from a trusted backend that returns attacker-supplied HTML, for example an application that stores and serves user-provided HTML files ("
    urls: ["https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-128505"]
  - claim_id: 9c3d76629f
    entry: 2026-11-19/airlock-gateway-cve-2026-19707-smart-form-protection
    surface: "body"
    kind: cited
    text: "The record scores CVSS 4.0 9.5 with high attack complexity and says that compromising the gateway could also affect the availability and protection of other backends deployed behind it ("
    urls: ["https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-128505"]
  - claim_id: 8d854bd5ee
    entry: 2026-11-19/airlock-gateway-cve-2026-19707-smart-form-protection
    surface: "body"
    kind: cited
    text: "Airlock's release notes for 8.6.1 and 8.5.3 list a fix for a buffer overflow when decoding HTML entities in the same releases, without a CVE id ("
    urls: ["https://docs.airlock.com/gateway/latest/index/1781491741687.html", "https://docs.airlock.com/gateway/8.5/index/1755485389146.html"]
  - claim_id: 44d4d7224b
    entry: 2026-11-19/airlock-gateway-cve-2026-19707-smart-form-protection
    surface: "body"
    kind: cited
    text: "Airlock's support table shows 8.5 supported until 06/2027, 8.4 past its end of support in 08/2026 and 8.3 no longer supported ("
    urls: ["https://docs.airlock.com/gateway/latest/index/1755485389142.html"]
  - claim_id: 9892ce6fbd
    entry: 2026-11-19/airlock-gateway-cve-2026-19707-smart-form-protection
    surface: "body"
    kind: cited
    text: "**Exposure:** Airlock Gateway 8.5.0 to 8.5.2 or 8.6.0 with Smart Form Protection enabled, which Airlock's documentation says requires URL encryption to be activated first, on a mapping whose backend can return attacker-supplied HTML ("
    urls: ["https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-128505", "https://docs.airlock.com/gateway/latest/index/1648621032215.html"]
  - claim_id: c57d6de240
    entry: 2026-11-19/airlock-gateway-cve-2026-19707-smart-form-protection
    surface: "body"
    kind: cited
    text: "**Detection:** the record names no indicator; gateway process crashes or restarts and unexpected child processes on the gateway, and backend responses with unusual multi-byte HTML character references, follow from the mechanism ("
    urls: ["https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-128505"]
  - claim_id: 6cc2cfea48
    entry: 2026-11-19/airlock-gateway-cve-2026-19707-smart-form-protection
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** update to 8.5.3 or 8.6.1, backends that serve user-supplied HTML behind a gateway with Smart Form Protection first; no source reports exploitation, so the order follows exposure rather than a known campaign ("
    urls: ["https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-128505"]
  - claim_id: 7a01356e71
    entry: 2026-11-19/airlock-gateway-cve-2026-19707-smart-form-protection
    surface: "body"
    kind: uncited
    text: "Airlock (Ergon) published CVE-2026-19707 on 2026-11-18 as the CNA."
