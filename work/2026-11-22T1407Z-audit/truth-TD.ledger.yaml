    entry: 2026-11-18/oracle-november-2026-cspu-56-unauthenticated-critical-rows
    surface: "body"
    kind: cited
    text: "Oracle's Critical Security Patch Update of 2026-11-17 carries 655 new patches ("
    urls: ["https://www.oracle.com/security-alerts/cspunov2026.html"]
  - claim_id: 00b6e49a2b
    entry: 2026-11-18/oracle-november-2026-cspu-56-unauthenticated-critical-rows
    surface: "body"
    kind: cited
    text: "Its risk matrices score 62 rows at CVSS 3.1 9.0 or above, 56 of them marked remotely exploitable without authentication and without privileges ("
    urls: ["https://www.oracle.com/security-alerts/cspunov2026.html"]
  - claim_id: d09481b67c
    entry: 2026-11-18/oracle-november-2026-cspu-56-unauthenticated-critical-rows
    surface: "body"
    kind: cited
    text: "); Tenable counts 62 critical patches across 57 CVEs ("
    urls: ["https://www.tenable.com/blog/oracle-november-2026-critical-security-patch-update-addresses-640-cves-cve-2026-114938"]
  - claim_id: a9b185312f
    entry: 2026-11-18/oracle-november-2026-cspu-56-unauthenticated-critical-rows
    surface: "body"
    kind: cited
    text: "Six of them score 10.0 with changed scope: Oracle Access Manager 12.2.1.4.0 and 14.1.2.1.0 in the Admin Console (CVE-2026-114835) and twice in the Authentication Engine (CVE-2026-91500, CVE-2026-91510), WebLogic Server TopLink Integration (CVE-2026-91569), Platform Security for Java (CVE-2026-114824) and Business Intelligence Enterprise Edition Platform Security (CVE-2026-114784), all over HTTP ("
    urls: ["https://www.oracle.com/security-alerts/cspunov2026.html"]
  - claim_id: dcc0cf0c39
    entry: 2026-11-18/oracle-november-2026-cspu-56-unauthenticated-critical-rows
    surface: "body"
    kind: cited
    text: "WebLogic Server 12.2.1.4.0 to 15.1.1.0.0 carries further unauthenticated rows at 9.8: Core over T3 and IIOP (CVE-2026-91470) and over SOAP (CVE-2026-91456), and TopLink Integration over HTTP (CVE-2026-91570, CVE-2026-91583) and TCP (CVE-2026-91585); Oracle words the T3 and IIOP row as an easily exploitable flaw that lets an unauthenticated attacker with network access compromise WebLogic Server ("
    urls: ["https://www.oracle.com/security-alerts/cspunov2026verbose.html"]
  - claim_id: 301ef57684
    entry: 2026-11-18/oracle-november-2026-cspu-56-unauthenticated-critical-rows
    surface: "body"
    kind: cited
    text: "E-Business Suite 12.2.3 to 12.2.15 has four unauthenticated HTTP rows at 9.8 in Attachments (CVE-2026-114880), Application Object Library (CVE-2026-114924), Applications Framework REST Services (CVE-2026-114925) and Universal Work Queue (CVE-2026-114863), and APEX and REST Data Services have two at 9.8 over HTTPS (CVE-2026-114849, CVE-2026-114850) ("
    urls: ["https://www.oracle.com/security-alerts/cspunov2026.html"]
  - claim_id: eb3159c380
    entry: 2026-11-18/oracle-november-2026-cspu-56-unauthenticated-critical-rows
    surface: "body"
    kind: cited
    text: "Oracle's footnote says the patch for the E-Business Suite row CVE-2026-114918 also addresses CVE-2025-61882 ("
    urls: ["https://www.oracle.com/security-alerts/cspunov2026.html"]
  - claim_id: d097919115
    entry: 2026-11-18/oracle-november-2026-cspu-56-unauthenticated-critical-rows
    surface: "body"
    kind: cited
    text: "), which CISA lists as exploited with known ransomware use ("
    urls: ["https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: d8cebc6401
    entry: 2026-11-18/oracle-november-2026-cspu-56-unauthenticated-critical-rows
    surface: "body"
    kind: cited
    text: "The release also carries three rows for the Brotli flaw CVE-2026-111497 in Communications Diameter Signaling Router, Communications Unified Assurance and PeopleSoft PeopleTools ("
    urls: ["https://www.oracle.com/security-alerts/cspunov2026.html"]
  - claim_id: 08ece06ecb
    entry: 2026-11-18/oracle-november-2026-cspu-56-unauthenticated-critical-rows
    surface: "body"
    kind: cited
    text: "Oracle's matrices carry no exploitation flag, and its interim relief is blocking the network protocols an attack requires or, for attacks that need certain privileges or package access, removing those; patches exist only for versions under Premier or Extended Support, and Oracle says earlier versions are likely affected too ("
    urls: ["https://www.oracle.com/security-alerts/cspunov2026.html"]
  - claim_id: 7ec656e1e2
    entry: 2026-11-18/oracle-november-2026-cspu-56-unauthenticated-critical-rows
    surface: "body"
    kind: cited
    text: "**Exposure:** Access Manager, WebLogic Server, E-Business Suite, APEX or REST Data Services, Platform Security for Java and Business Intelligence Enterprise Edition instances on the listed versions that untrusted networks can reach over HTTP, HTTPS, SOAP, TCP, T3 or IIOP ("
    urls: ["https://www.oracle.com/security-alerts/cspunov2026.html"]
  - claim_id: cfc2e52c37
    entry: 2026-11-18/oracle-november-2026-cspu-56-unauthenticated-critical-rows
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** apply the November 2026 patches to internet-reachable identity, middleware, ERP and APEX instances first, and until then block the protocols a row needs, T3 and IIOP for the WebLogic Core row ("
    urls: ["https://www.oracle.com/security-alerts/cspunov2026.html"]
  - claim_id: dc7daeec88
    entry: 2026-11-18/oracle-november-2026-cspu-56-unauthenticated-critical-rows
    surface: "body"
    kind: derived
    text: "Oracle names no per-flaw workaround, so unsupported versions have no vendor fix."
  - claim_id: 247ed080c5
    entry: 2026-11-18/riken-fugaku-rikyu-intrusion-status-dashboard-ssh-keys
    surface: "headline"
    kind: frontmatter
    text: "RIKEN Fugaku: intruder entered via the public status dashboard, took users' SSH keys and tried them elsewhere"
  - claim_id: 5c9cea2358
    entry: 2026-11-18/riken-fugaku-rikyu-intrusion-status-dashboard-ssh-keys
    surface: "summary"
    kind: frontmatter
    text: "RIKEN says that between 2026-11-10 and 2026-11-13 an external party used the publicly accessible web page showing Fugaku's operating status to enter its internal operational network, tampered with internal servers (some with malicious programs) and took or may have taken home-directory files, user-authentication data and credentials users had stored for other systems, such as SSH private keys and access keys. Up to 4,222 Fugaku and 375 Rikyu users are affected, RIKEN confirmed that some of the stolen credentials were tried against other systems, and it suspended Fugaku on 2026-11-14. How the dashboard was breached is still under investigation, and RIKEN names no actor."
  - claim_id: 0438504610
    entry: 2026-11-18/riken-fugaku-rikyu-intrusion-status-dashboard-ssh-keys
    surface: "body"
    kind: cited
    text: "RIKEN's Center for Computational Science says that between 2026-11-10 and 2026-11-13 an external third party entered Fugaku's internal operational network through the publicly accessible web page that displays the supercomputer's operating status, and that the exact method is still under investigation ("
    urls: ["https://www.riken.jp/en/news_pubs/news/2026/20261116_2/index.html"]
  - claim_id: 0d1c17f097
    entry: 2026-11-18/riken-fugaku-rikyu-intrusion-status-dashboard-ssh-keys
    surface: "body"
    kind: cited
    text: "The intruder tampered with multiple internal servers, some of them with malicious programs, and took or may have taken files in users' home directories and user-authentication data, including credentials users had stored for connecting to other systems, such as SSH private keys and access keys; up to 4,222 Fugaku users and 375 Rikyu users are affected ("
    urls: ["https://www.riken.jp/en/news_pubs/news/2026/20261116_2/index.html"]
  - claim_id: 6d32c55e7b
    entry: 2026-11-18/riken-fugaku-rikyu-intrusion-status-dashboard-ssh-keys
    surface: "body"
    kind: cited
    text: "RIKEN has confirmed that the intruder tried some of the obtained credentials against other systems and is checking whether damage or secondary misuse followed ("
    urls: ["https://www.riken.jp/en/news_pubs/news/2026/20261116_2/index.html"]
  - claim_id: 7512e7b289
    entry: 2026-11-18/riken-fugaku-rikyu-intrusion-status-dashboard-ssh-keys
    surface: "body"
    kind: cited
    text: "RIKEN and the external provider that maintains the system began investigating suspicious network traffic on 2026-11-12, confirmed the access on 2026-11-13 and suspended Fugaku on 2026-11-14 ("
    urls: ["https://www.riken.jp/en/news_pubs/news/2026/20261116_2/index.html"]
  - claim_id: 16559da631
    entry: 2026-11-18/riken-fugaku-rikyu-intrusion-status-dashboard-ssh-keys
    surface: "body"
    kind: cited
    text: "It replaced the administrative keys, invalidated the public keys all users use to log in and halted all running and queued jobs, and it names no actor; it says there is no evidence yet that research data was exfiltrated ("
    urls: ["https://www.riken.jp/en/news_pubs/news/2026/20261116_2/index.html", "https://www.bleepingcomputer.com/news/security/japan-takes-fugaku-supercomputer-offlline-after-cyberattack/"]
  - claim_id: 79f1295153
    entry: 2026-11-18/riken-fugaku-rikyu-intrusion-status-dashboard-ssh-keys
    surface: "body"
    kind: cited
    text: "**Exposure:** a shared compute or research system whose operating-status page is reachable from the internet and sits on a network path to its internal operations servers, and whose users keep SSH private keys or cloud access keys in their home directories ("
    urls: ["https://www.riken.jp/en/news_pubs/news/2026/20261116_2/index.html"]
  - claim_id: e192e40d39
    entry: 2026-11-18/riken-fugaku-rikyu-intrusion-status-dashboard-ssh-keys
    surface: "body"
    kind: cited
    text: "**Detection:** authentications to other systems with keys that belong to users of the affected host, arriving from unfamiliar addresses, and changes or unknown programs on the servers that run the system's operation; RIKEN's own reviews cover the network configuration and the rebuilding of compromised servers ("
    urls: ["https://www.riken.jp/en/news_pubs/news/2026/20261116_2/index.html"]
  - claim_id: 9812e2a62d
    entry: 2026-11-18/riken-fugaku-rikyu-intrusion-status-dashboard-ssh-keys
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** treat every private key and access key stored on a compromised host as stolen: RIKEN asks users to revoke the matching public key at each external service where it is authorised and to generate a new pair, and to replace any other stored credential through the service concerned ("
    urls: ["https://www.riken.jp/en/news_pubs/news/2026/20261116_2/index.html"]
  - claim_id: 2ee289c167
    entry: 2026-11-18/riken-fugaku-rikyu-intrusion-status-dashboard-ssh-keys
    surface: "body"
    kind: derived
    text: "Relevant to Swiss research and high-performance-computing operators as a transferable pattern of exposure."
  - claim_id: 27eff421b7
    entry: 2026-11-18/riken-fugaku-rikyu-intrusion-status-dashboard-ssh-keys
    surface: "body"
    kind: derived
    text: "A status page that is public should not give a route into the operations network."
  - claim_id: b83a425791
    entry: 2026-11-18/typo3-core-security-releases-2026-11-17-installer-chain
    surface: "headline"
    kind: frontmatter
    text: "TYPO3: backend user to installer to admin and RCE (SA-027 Critical); Form Framework flaw SA-029 exploited; update now"
  - claim_id: ff91c63127
    entry: 2026-11-18/typo3-core-security-releases-2026-11-17-installer-chain
    surface: "summary"
    kind: frontmatter
    text: "TYPO3 published ten core advisories on 2026-11-17 for 10.0.0 to 14.3.11, fixed in 14.3.12 LTS, 13.4.40 LTS, 12.4.52 ELTS, 11.5.57 ELTS and 10.4.63 ELTS. The one rated Critical (SA-027) lets a file named FIRST_INSTALL placed in the web root re-enable the installer without authentication, which creates an administrator and leads to remote code execution, and SA-026 lets any low-privileged backend user create such a file. TYPO3 states that SA-029, a Medium information disclosure in the Form Framework that can become cross-site scripting through uploaded HTML, is known to be actively exploited, naming no actor or victim."
  - claim_id: dc0976ac63
    entry: 2026-11-18/typo3-core-security-releases-2026-11-17-installer-chain
    surface: "actions[0]"
    kind: frontmatter
    text: "Update every TYPO3 instance to 14.3.12, 13.4.40, 12.4.52 ELTS, 11.5.57 ELTS or 10.4.63 ELTS now, and on 14.x configure HTTP/allowed_hosts/dashboard_rss; until then check the public web root and the project root for unexpected files whose name starts with FIRST_INSTALL and the backend for administrator or system maintainer accounts nobody created, because a low-privileged backend user can re-enable the installer and TYPO3 states that one flaw in the same release is actively exploited."
