  - claim_id: d6a506f36b
    entry: 2026-11-18/oracle-november-2026-cspu-56-unauthenticated-critical-rows
    surface: "summary"
    kind: frontmatter
    text: "Oracle's Critical Security Patch Update of 2026-11-17 carries 655 patches, and its risk matrices mark 56 of the 62 rows scoring CVSS 3.1 9.0 or above as remotely exploitable without authentication. Six are CVSS 10.0 with changed scope, in Oracle Access Manager (three rows), WebLogic Server TopLink Integration, Platform Security for Java and Business Intelligence Enterprise Edition, and WebLogic Server and E-Business Suite carry further unauthenticated rows at 9.8. No source reports exploitation of any of these rows, and for attacks that need no privileges Oracle's interim measure is blocking the network protocols an attack needs."
  - claim_id: 8593586423
    entry: 2026-11-18/oracle-november-2026-cspu-56-unauthenticated-critical-rows
    surface: "actions[0]"
    kind: frontmatter
    text: "Block T3 and IIOP to every WebLogic Server from networks that untrusted hosts can reach and apply the November 2026 CSPU first to internet-reachable Access Manager, WebLogic Server, E-Business Suite and APEX or REST Data Services instances, because Oracle marks 56 rows at CVSS 9.0 or above as exploitable without authentication and names blocking the required network protocols as its interim measure for attacks that need no privileges."
