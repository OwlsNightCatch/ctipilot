        attribution: "Zimbra / Synacor"
        source_url: "https://blog.zimbra.com/2026/07/patch-release-update-zimbra-10-1-20/"
      - quote: "a command injection vulnerability in the SNMP monitoring component when SNMP notifications are enabled"
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/07/zimbra-patches-critical-snmp-command.html"
      - quote: "Ein Angreifer kann mehrere Schwachstellen in Synacor Zimbra ausnutzen, um beliebigen Programmcode auszuführen, Cross-Site-Scripting-Angriffe durchzuführen, Sicherheitsmaßnahmen zu umgehen, vertrauliche Informationen offenzulegen und unbefugte Aktionen durchzuführen."
        attribution: "BSI CERT-Bund (WID-SEC-2026-2429)"
        source_url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-2429"
    extended_notes: |
      Detection: SNMP-notification-enabled Zimbra deployments should monitor for unexpected child processes spawned by the SNMP/Swatchdog service account (process-creation telemetry with parent-image = the SNMP monitoring daemon is the anchor — a classic command-injection tell, since that service should never spawn a shell). For the Classic Web Client XSS issues, monitor for anomalous JavaScript execution or session-token use immediately following a user viewing an email with an unusual attachment filename or crafted header field (T1539-style session-cookie theft pattern). Hardening: upgrade to ZCS 10.1.20; if SNMP notifications are not required, disable them to remove the command-injection attack surface entirely pending the still-unnamed-CVE fix's full technical disclosure. No IOCs published by any cited source.

