  - title: "IBM Langflow: CISA confirms active exploitation of unauthenticated exec_globals RCE (CVE-2026-0770) the same day NCSC-NL discloses 15 more patched CVEs, incl. unauthenticated superuser account creation"
    sources:
      - { url: "https://www.cisa.gov/news-events/alerts/2026/07/21/cisa-adds-four-known-exploited-vulnerabilities-catalog", publisher: "CISA", date: "2026-07-21", role: "primary" }
      - { url: "https://www.zerodayinitiative.com/advisories/ZDI-26-036/", publisher: "Zero Day Initiative (Trend Micro)", date: "2026-01-09", role: "primary" }
      - { url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0251", publisher: "NCSC-NL (NCSC-2026-0251)", date: "2026-07-21", role: "primary" }
      - { url: "https://github.com/0xgh057r3c0n/CVE-2026-0770", publisher: "0xgh057r3c0n (GitHub PoC)", date: "2026-07", role: "corroborating" }
      - { url: "https://www.ibm.com/support/pages/node/7278920", publisher: "IBM Security Bulletin (CVE-2026-9135)", date: "2026-07", role: "corroborating" }
      - { url: "https://www.ibm.com/support/pages/node/7278924", publisher: "IBM Security Bulletin (CVE-2026-8859)", date: "2026-07", role: "corroborating" }
    discovery_trace: "first seen at: cisa-kev bridge (python3 tools/fetch_source.py cisa-kev) → CVE-2026-0770 newly added 2026-07-21 → primary: CISA alert, URL https://www.cisa.gov/news-events/alerts/2026/07/21/cisa-adds-four-known-exploited-vulnerabilities-catalog → pivot: ENISA EUVD (python3 tools/fetch_source.py enisa-euvd recent exploited), URL EUVD-2026-4466 → pivot: Zero Day Initiative advisory, URL https://www.zerodayinitiative.com/advisories/ZDI-26-036/ → pivot: GitHub PoC, URL https://github.com/0xgh057r3c0n/CVE-2026-0770 → cross-reference: NCSC-NL RSS (advisories.ncsc.nl/rss/advisories) surfaced NCSC-2026-0251 same day → primary: NCSC-NL CSAF advisory, URL https://advisories.ncsc.nl/advisory?id=NCSC-2026-0251 → pivot: IBM Security Bulletins (per-CVE), URLs https://www.ibm.com/support/pages/node/7278920 and https://www.ibm.com/support/pages/node/7278924"
    summary: |
      CISA added CVE-2026-0770 to KEV on 2026-07-21, confirming active exploitation of an unauthenticated Langflow RCE that Zero Day Initiative (ZDI-26-036) disclosed on 2026-01-09 as an unpatched zero-day after six months of unanswered vendor contact (reported 2025-07-18). The flaw sits in the POST /api/v1/validate/code endpoint: the exec_globals parameter passed to Langflow's code-validation handler is executed via Python exec() without sandboxing (CWE-829, inclusion of functionality from an untrusted control sphere), giving root-context code execution. Exploitation is unauthenticated only where AUTO_LOGIN=true and the operator has retained Langflow's documented default credentials (langflow/langflow) — a misconfiguration, not a code defect, which is why no dedicated version patch closes this specific CVE and the durable fix is disabling AUTO_LOGIN or rotating the default account.
      The same day, NCSC-NL published NCSC-2026-0251, a separate and much larger disclosure: 15 new CVEs across IBM Langflow OSS (now under IBM ownership following the DataStax acquisition) versions 1.0.0 through 1.10.0, all fixed in 1.10.1. The batch spans an unauthenticated missing-authentication class (CVE-2026-9202, CVSS 9.8, CWE-306) that lets an attacker create unlimited new user accounts on any Langflow instance and, when the documented NEW_USER_IS_ACTIVE=true option is set, immediately activate them to reach RCE endpoints — bypassing AUTO_LOGIN restrictions entirely; a path-traversal arbitrary file write in the APIRequest "Save to File" feature (CVE-2026-8859, CVSS 9.9, CWE-22) via unsanitised HTTP Content-Disposition filenames; SSRF from insecure default configuration (CVE-2026-7754); RCE via insufficient validation of MCP server configuration files (CVE-2026-7755); unsafe deserialization in the AsyncDiskCache class reachable through apply_tweaks() parameter override (CVE-2026-8476, CWE-502); authenticated file read of the JWT signing key enabling forged authentication tokens; and code injection in the Policies/ToolGuard component (CVE-2026-9135, CVSS 9.9) where guard-field validation covered only the main component code field and not dynamic CodeInput fields.
      This is the third distinct Langflow CVE CISA has KEV-listed inside roughly two weeks (after CVE-2026-33017 and CVE-2026-55255, both 2026-07-07), and the fourth-plus vulnerability class overall once the NCSC-NL batch is counted — Langflow's exposure as a self-hosted AI-agent orchestration platform holding embedded credentials and broad system permissions keeps drawing attacker and researcher attention alike.
    region_nexus: "global; Langflow is increasingly self-hosted by EU/CH public-sector and research bodies building internal LLM/agent pipelines"
    primary_sector_nexus: "indirect"
