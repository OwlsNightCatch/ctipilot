    evidence:
      - quote: "CVE-2026-0770 Langflow Inclusion of Functionality from Untrusted Control Sphere Vulnerability"
        attribution: "CISA"
        source_url: "https://www.cisa.gov/news-events/alerts/2026/07/21/cisa-adds-four-known-exploited-vulnerabilities-catalog"
      - quote: "The specific flaw exists within the handling of the exec_globals parameter provided to the validate endpoint. The issue results from the inclusion of a resource from an untrusted control sphere. An attacker can leverage this vulnerability to execute code in the context of root."
        attribution: "Zero Day Initiative (ZDI-26-036)"
        source_url: "https://www.zerodayinitiative.com/advisories/ZDI-26-036/"
      - quote: "IBM Langflow OSS 1.0.0 through 1.10.0 allows unauthenticated attackers to create unlimited user accounts on any Langflow instance; when NEW_USER_IS_ACTIVE=true (documented deployment option), newly created accounts are immediately active and can authenticate to reach RCE endpoints, bypassing the need for AUTO_LOGIN."
        attribution: "IBM Security Bulletin (CVE-2026-9202)"
        source_url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0251"
    extended_notes: |
      Detection: hunt for POST requests to /api/v1/validate/code and /api/v1/login/auto_login on self-hosted Langflow instances from unexpected source IPs, especially any followed by outbound connections or new local OS process spawns from the Langflow service account (webshell/reverse-shell behavioral pattern, not signature-based). Benign lookalike: legitimate flow-authoring traffic to /api/v1/validate/code originates from authenticated UI sessions with a browser user-agent and Referer header; unauthenticated or scripted POSTs to that endpoint, or any POST carrying an exec_globals key, are the discriminator. Hardening: disable AUTO_LOGIN in production, rotate the documented default credentials (langflow/langflow) if AUTO_LOGIN must stay enabled, set NEW_USER_IS_ACTIVE=false, and upgrade to Langflow OSS 1.10.1 for the NCSC-NL batch. No IOCs available from any cited source (none published behavioral network indicators beyond the endpoint paths above).

  - title: "CISA KEV-lists a 5-year-old DD-WRT UPnP overflow (CVE-2021-27137) as C0XMO Gafgyt botnet keeps exploiting it for cross-architecture IoT/Linux takeover"
    sources:
      - { url: "https://www.cisa.gov/news-events/alerts/2026/07/21/cisa-adds-four-known-exploited-vulnerabilities-catalog", publisher: "CISA", date: "2026-07-21", role: "primary" }
      - { url: "https://www.fortinet.com/blog/threat-research/inside-cross-platform-propagation-of-new-gafgyt-variant-c0xmo", publisher: "Fortinet FortiGuard Labs", date: "2026-06-03", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/c0xmo-botnet-spreads-via-dd-wrt-router-flaw-kills-rival-malware/", publisher: "BleepingComputer", date: "2026-06-07", role: "corroborating" }
    discovery_trace: "first seen at: cisa-kev bridge (python3 tools/fetch_source.py cisa-kev) → CVE-2021-27137 newly added 2026-07-21 → primary: CISA alert, URL https://www.cisa.gov/news-events/alerts/2026/07/21/cisa-adds-four-known-exploited-vulnerabilities-catalog → pivot: WebSearch (\"C0XMO botnet DD-WRT CVE-2021-27137 UPnP\") → primary: Fortinet FortiGuard Labs research, URL https://www.fortinet.com/blog/threat-research/inside-cross-platform-propagation-of-new-gafgyt-variant-c0xmo → corroborating: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/c0xmo-botnet-spreads-via-dd-wrt-router-flaw-kills-rival-malware/ → cross-reference: ENISA EUVD (python3 tools/fetch_source.py enisa-euvd recent exploited), URL EUVD-2021-34854"
    summary: |
      CISA added CVE-2021-27137 to KEV on 2026-07-21 with an exploitedSince date of the same day (per ENISA EUVD), confirming active exploitation of a five-year-old DD-WRT router-firmware flaw: an unsafe strcpy in the UPnP SSDP parser (router/upnp/src/ssdp.c, function ssdp_msearch) lets an unauthenticated remote attacker overflow an internal fixed buffer via an oversized ST:uuid: value in a crafted M-SEARCH request sent to UDP port 1900, achieving code execution. Exploitation requires only that the DD-WRT device has UPnP enabled (off by default, internal-interfaces-only by default) and is reachable — no authentication and no user interaction. A fix has existed since DD-WRT changeset 45724 (disclosed via SSD Disclosure); there is no new vendor patch tied to this KEV addition — the only action for defenders is confirming devices run post-45724 firmware or disabling UPnP.
      The vulnerability is the initial-access vector for C0XMO, a Gafgyt-derived DDoS botnet FortiGuard Labs documented in June 2026. C0XMO separates its network scanner into a standalone Python component supporting ARM, MIPS, PowerPC, SuperH, x86 and x86_64 targets, and after gaining a foothold via CVE-2021-27137 also brute-forces weak Telnet/SSH credentials and probes UPnP/HNAP/CGI/DVR/GLPI/AVTECH/Zyxel management interfaces and exposed ADB (port 5555) on Android devices. It persists via cron jobs (every 15 minutes), copies to /tmp/.sys, /var/tmp/.sys, /dev/shm/.sys and $HOME/.sys, and appends execution commands to ~/.bashrc, ~/.profile and ~/.bash_profile. Distinctively, it enumerates running processes and actively kills and removes competing botnet clients, red-team tools and their persistence artifacts before installing its own 19-method DDoS toolkit — directly relevant to any exposed embedded-Linux or IoT estate, including OT-adjacent devices in energy, water and transport networks.
    region_nexus: "global; directly relevant to exposed embedded-Linux/IoT and OT-adjacent CPE in energy, water and transport networks"
    primary_sector_nexus: "indirect"
    sector: "energy, water, transport, telco"
    cves: [CVE-2021-27137]
    techniques: [T1190, T1110.001, T1053.003, T1546.004]
    affected_products: ["DD-WRT"]
    entity_keys: ["campaign:c0xmo-gafgyt"]
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "CVE-2021-27137 DD-WRT Stack-Based Buffer Overflow Vulnerability"
        attribution: "CISA"
        source_url: "https://www.cisa.gov/news-events/alerts/2026/07/21/cisa-adds-four-known-exploited-vulnerabilities-catalog"
      - quote: "The vulnerability occurs when the SSDP parser mishandles oversized ST:uuid: values in specially crafted M-SEARCH requests sent via UDP port 1900."
        attribution: "Fortinet FortiGuard Labs"
        source_url: "https://www.fortinet.com/blog/threat-research/inside-cross-platform-propagation-of-new-gafgyt-variant-c0xmo"
      - quote: "C0XMO exhibits a considerably more advanced architecture and feature set compared to earlier IoT botnets."
        attribution: "Fortinet FortiGuard Labs"
        source_url: "https://www.fortinet.com/blog/threat-research/inside-cross-platform-propagation-of-new-gafgyt-variant-c0xmo"
    extended_notes: |
      Detection (telemetry class, vendor-neutral): inbound UDP/1900 traffic to management/CPE interfaces carrying oversized ST:uuid: header values; outbound Telnet(23)/SSH(22) connection floods sourced from a single CPE (credential-stuffing pattern); a router/IoT device's process table containing an unexpected Python interpreter invocation with --rand / --rand-ports arguments; a device abruptly stopping DDoS/mining activity attributable to a previously-known botnet family — consistent with C0XMO's active competitor-removal behavior. Benign lookalike: legitimate UPnP discovery traffic on port 1900 is low-volume and well-formed; malformed/oversized ST header values or M-SEARCH floods are the discriminator. Hardening: disable UPnP on internet-facing DD-WRT devices, or confirm firmware is built from changeset 45724 or later; no IOCs cited (network/file paths given are behavioral patterns, not indicators, per source).

  - title: "Zimbra 10.1.20 fixes 9 issues incl. an SNMP command-injection RCE and 4 stored-XSS bugs, flagged by NCSC-CH and BSI; 3 of 9 carry CVEs, exploitation status unknown"
    sources:
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12782", publisher: "NCSC-CH Cyber Security Hub", date: "2026-07-21", role: "primary" }
      - { url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-2429", publisher: "BSI CERT-Bund (WID-SEC-2026-2429)", date: "2026-07-21", role: "primary" }
      - { url: "https://blog.zimbra.com/2026/07/patch-release-update-zimbra-10-1-20/", publisher: "Zimbra / Synacor", date: "2026-07-20", role: "primary" }
      - { url: "https://thehackernews.com/2026/07/zimbra-patches-critical-snmp-command.html", publisher: "The Hacker News", date: "2026-07-21", role: "corroborating" }
      - { url: "https://wiki.zimbra.com/wiki/Zimbra_Security_Advisories", publisher: "Zimbra / Synacor", date: "2026-07-20", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-csh bridge (python3 tools/fetch_source.py ncsc-csh recent 30), post id 12782 → primary: NCSC-CH advisory, URL https://security-hub.ncsc.admin.ch/#/posts/12782 → pivot: vendor blog, URL https://blog.zimbra.com/2026/07/patch-release-update-zimbra-10-1-20/ → cross-reference: BSI CERT-Bund RSS (wid.cert-bund.de/content/public/securityAdvisory/rss) surfaced WID-SEC-2026-2429 same day → primary: BSI CSAF advisory, URL https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-2429 → pivot: The Hacker News, URL https://thehackernews.com/2026/07/zimbra-patches-critical-snmp-command.html → pivot: Zimbra Security Advisories wiki, URL https://wiki.zimbra.com/wiki/Zimbra_Security_Advisories"
    summary: |
      Zimbra shipped Collaboration Suite (ZCS) 10.1.20 on 2026-07-20, fixing nine security issues; NCSC-CH and BSI CERT-Bund both flagged the release on 2026-07-21. The headline flaw is a command-injection vulnerability in Zimbra's SNMP monitoring component, exploitable when SNMP notifications are enabled (Zimbra's integrated Swatchdog service must be running), letting an attacker send crafted payloads to execute arbitrary OS commands on the mail server — Zimbra has withheld a CVE identifier and technical specifics for this issue "in line with industry best practices" pending wider patch adoption. Four stored cross-site-scripting bugs in the Classic Web Client round out the un-CVE'd issues: malicious attachment filenames, crafted fields, and rendered attachments can each trigger script execution inside a victim's authenticated webmail session.
      Three issues did receive CVE identifiers, confirmed via BSI's CSAF record: CVE-2026-50055 (mail-forwarding restriction bypass — an authenticated attacker can exfiltrate mail even where forwarding restrictions are enforced, mapping to email-forwarding-rule abuse), CVE-2026-10631 (access-control issue in the EWS extension), and CVE-2026-50054 (authorization flaw in mailbox delegation). All three CVE IDs currently sit in RESERVED status on NVD/MITRE (not yet populated with CVSS/description) but are confirmed valid assignments via the BSI advisory. The release also fixes an SSRF in Zimbra's Nextcloud integration. No source reports confirmed in-the-wild exploitation of any of the nine issues; this follows Zimbra's July 10 fix (ZCS 10.1.19) for a separate, unrelated Classic Web Client crafted-email code-execution bug NCSC-CH flagged two weeks earlier — the second Zimbra security release inside two weeks.
    region_nexus: "global; Zimbra is a common self-hosted webmail/groupware platform for SMEs and some public-sector bodies in Switzerland/EU"
    primary_sector_nexus: "direct"
    sector: "public-sector, telco"
    cves: [CVE-2026-50055, CVE-2026-10631, CVE-2026-50054]
    techniques: [T1190, T1114.003, T1539]
