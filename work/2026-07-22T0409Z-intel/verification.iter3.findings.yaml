- code: F14
  category: quantifier-without-source
  section: south-korea-knda-elearning-zero-day-breach
  item: "South Korea KNDA e-learning zero-day breach"
  url_or_quote: "reported as roughly 2,500 diplomats posted worldwide and 350 serving overseas officials"
  summary: >-
    Body asserts the ~10,000 exposed records break down as 'roughly 2,500 diplomats
    posted worldwide and 350 serving overseas officials', attributed with 'reported as'.
    None of the three cited sources carry this breakdown: Korea Herald (primary) does not
    mention 2,500 or 350 (targeted re-fetch confirmed); DailySecu explicitly does NOT
    state 2,500/350 and instead says '일부 보도에서는 ... 약 6000명' (some reports: ~6,000
    people); Seoul Shinmun body says only '최대 1만명' (up to 10,000) and its only 2500/350
    string hits are unrelated URLs/an iframe height. The specific breakdown is an
    unsupported quantifier (and mildly contradicts DailySecu's ~6,000). Remediation:
    drop the '2,500 / 350' clause or cite a source that states it.
- code: F10
  category: missed-angle
  section: whole-run
  item: "Langflow CISA-KEV entry / run record coverage shape"
  url_or_quote: "https://www.cisa.gov/news-events/alerts/2026/07/21/cisa-adds-four-known-exploited-vulnerabilities-catalog"
  summary: >-
    The 2026-07-21 CISA KEV alert the Langflow entry cites added four CVEs: Langflow
    (published), DD-WRT CVE-2021-27137 (explicitly documented as a borderline-drop), and
    TWO WordPress Core CVEs — CVE-2026-63030 (Interpretation Conflict) and CVE-2026-60137
    (SQL Injection) — now actively exploited. WordPress Core is widely deployed across the
    Swiss/European public sector the SOC defends, yet neither CVE is covered nor named as a
    drop anywhere in the run record (only DD-WRT is triaged). Assess relevance and either
    publish a brief entry/update or document the drop decision for the two WordPress Core
    KEV additions. Suggested query: 'CVE-2026-63030 CVE-2026-60137 WordPress Core exploited'.
