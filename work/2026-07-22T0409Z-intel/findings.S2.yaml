    extended_notes: |
      No technical indicators of the intrusion mechanism into the supplier's platform were disclosed (neither
      party named the supplier or the platform). The transferable lesson for defenders is squarely about
      third-party/vendor risk: a ransomware/extortion actor reached sensitive-adjacent data without needing to
      breach the primary target's own network by compromising a B2B data-exchange integration instead —
      mirrors this month's Deutsche Bank/"Unsafe" vendor-incident pattern already in the brief. Recommended
      defender angle: inventory and monitor B2B/supplier data-exchange platform integrations for anomalous
      access, require MFA on all supplier/partner-portal accounts (Everest's own most common initial-access
      gap is unprotected RDP/VPN), and treat vendor-facing data-exchange channels as part of the organisation's
      own attack surface for third-party risk assessments. Everest's claimed prior targeting of Heathrow/
      Brussels/Berlin airport aviation systems and a European electricity grid/telecom operator (per Halcyon,
      unconfirmed by the named victims) makes this a recurring actor against the European CI space this report
      already tracks.
