  - title: "SharePoint CVE-2026-50522 escalates to active exploitation via public PoC — attackers steal machine keys for persistent forged authentication; NCSC-NL flags on-prem instances"
    sources:
      - { url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0237", publisher: "NCSC-NL (Nationaal Cyber Security Centrum)", date: "2026-07-21", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/critical-sharepoint-rce-flaw-exploited-to-steal-machine-keys/", publisher: "BleepingComputer (relaying watchTowr)", date: "2026-07-21", role: "primary" }
      - { url: "https://thehackernews.com/2026/07/critical-sharepoint-rce-cve-2026-50522.html", publisher: "The Hacker News", date: "2026-07-21", role: "corroborating" }
      - { url: "https://securityaffairs.com/195760/security/public-poc-triggers-active-exploitation-of-critical-sharepoint-rce-vulnerability-cve-2026-50522.html", publisher: "Security Affairs", date: "2026-07-21", role: "corroborating" }
    discovery_trace: "first seen at: advisories-ncsc-nl (python3 tools/fetch_source.py ncsc-nl recent 20), URL https://advisories.ncsc.nl/rss/advisories → advisory NCSC-2026-0237 rev. 1.0.2, URL https://advisories.ncsc.nl/advisory?id=NCSC-2026-0237 (fetched in full via python3 tools/fetch_source.py ncsc-nl csaf NCSC-2026-0237) → pivot: WebSearch (\"CVE-2026-50522 SharePoint watchTowr exploit\") → primary: BleepingComputer relaying watchTowr's findings, URL https://www.bleepingcomputer.com/news/security/critical-sharepoint-rce-flaw-exploited-to-steal-machine-keys/ → corroboration: The Hacker News, URL https://thehackernews.com/2026/07/critical-sharepoint-rce-cve-2026-50522.html → corroboration: Security Affairs, URL https://securityaffairs.com/195760/security/public-poc-triggers-active-exploitation-of-critical-sharepoint-rce-vulnerability-cve-2026-50522.html"
    summary: |
      CVE-2026-50522 (CVSS 9.8) — a deserialization-of-untrusted-data RCE in Microsoft SharePoint Server 2016,
      2019 and Subscription Edition patched in the July 2026 Patch Tuesday cycle alongside CVE-2026-58644 — was
      previously assessed by all sources as "none confirmed exploited in the wild yet" (this brief's 2026-07-15
      coverage). NCSC-NL's advisory NCSC-2026-0237 was updated on 2026-07-21 (revision 1.0.2) to report that,
      per watchTowr, public exploit code for CVE-2026-50522 was published and is now being actively exploited
      against on-premises SharePoint deployments, letting attackers gain long-term network access by stealing
      machine keys. watchTowr's own telemetry (relayed via BleepingComputer) describes the exploitation chain
      in more technical detail: a malicious .NET BinaryFormatter payload is delivered via a forged
      SecurityContextToken in a WS-Federation sign-in response to the /_trust/default.aspx endpoint; a
      successfully processed payload executes arbitrary code and lets the attacker exfiltrate the server's
      machine keys, which are then used to forge valid ASP.NET authentication tokens/ViewState — giving
      persistent, re-authenticatable access that survives patching unless the keys are rotated. watchTowr's
      honeypot network ("Attacker Eye") observed successful exploitation attempts within hours of the PoC
      (attributed to researcher "Janggggg") going public on 2026-07-20. No authentication is required for the
      initial RCE. NCSC-NL explicitly recommends updating vulnerable on-prem SharePoint systems immediately;
      watchTowr additionally states patching alone is insufficient and that any exposed asset's machine keys
      /credentials should be rotated.
    region_nexus: "Netherlands (NCSC-NL advisory) and EU/Switzerland broadly — on-premises SharePoint remains widely deployed in public-sector document-management and intranet infrastructure"
    primary_sector_nexus: "direct"
    sector: "public-sector"
    cves: ["CVE-2026-50522"]
    techniques: [T1190, T1552.004, T1606]
    affected_products: ["Microsoft SharePoint Server 2016", "Microsoft SharePoint Server 2019", "Microsoft SharePoint Server Subscription Edition"]
    entity_keys: []
