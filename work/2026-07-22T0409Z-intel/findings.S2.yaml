        attribution: "NCSC-NL (advisory NCSC-2026-0237, rev. 1.0.2)"
        source_url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0237"
      - quote: "A remote attacker to execute code over a network without authentication"
        attribution: "BleepingComputer / watchTowr"
        source_url: "https://www.bleepingcomputer.com/news/security/critical-sharepoint-rce-flaw-exploited-to-steal-machine-keys/"
      - quote: "Within hours, our global honeypot network, Attacker Eye, captured exploitation attempts using this PoC that successfully compromised target systems"
        attribution: "watchTowr (relayed via BleepingComputer)"
        source_url: "https://www.bleepingcomputer.com/news/security/critical-sharepoint-rce-flaw-exploited-to-steal-machine-keys/"
      - quote: "Rotate credentials on any asset that may have been exposed"
        attribution: "watchTowr (relayed via BleepingComputer)"
        source_url: "https://www.bleepingcomputer.com/news/security/critical-sharepoint-rce-flaw-exploited-to-steal-machine-keys/"
    extended_notes: |
      Detection concept: telemetry class is web/application-server access logs plus IIS/SharePoint request
      logging on the /_trust/default.aspx WS-Federation endpoint — anomalous POST bodies containing serialized
      .NET payloads to this endpoint, or ULS log entries reflecting BinaryFormatter deserialization errors/
      exceptions, are the anchor; on the identity side, watch for SharePoint-issued auth tokens/ViewState that
      validate against a machine key not present in the current IIS worker-process config (a signal the key
      was exfiltrated and reused externally). Hardening beyond the July patch: rotate machine keys (and any
      derived ASP.NET validation/decryption keys) on every internet-reachable on-prem SharePoint farm that
      exposed /_trust/default.aspx before patching, since watchTowr states the exfiltrated keys remain usable
      to forge authentication even after the vulnerability itself is closed. This is the third escalation in
      the same July SharePoint patch cluster this brief has tracked (CVE-2026-58644 confirmed exploited
      2026-07-17; now CVE-2026-50522 2026-07-21) — any organisation that treated the July cycle as fully
      remediated after the 58644 fix should re-check CVE-2026-50522 exposure and rotate keys specifically.
