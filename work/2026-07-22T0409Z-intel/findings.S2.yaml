  - title: "Everest ransomware group breaches a Stadler Rail supplier's data-exchange platform, demands CHF 10 million ransom — Stadler refuses to pay"
    sources:
      - { url: "https://www.swissinfo.ch/ger/cyberkriminelle-greifen-thurgauer-zugbauer-stadler-rail-an/91776656", publisher: "swissinfo.ch", date: "2026-07-21", role: "primary" }
      - { url: "https://www.itmagazine.ch/artikel/87645/Ransomware-Attacke_Stadler_Rail_hat_nicht_gezahlt.html", publisher: "IT Magazine (Switzerland)", date: "2026-07-21", role: "corroborating" }
      - { url: "https://www.halcyon.ai/threat-group/everest", publisher: "Halcyon AI (threat-actor profile)", date: "2025-11-19", role: "background" }
    discovery_trace: "first seen at: WebSearch (\"Cyberangriff Schweiz 21 Juli 2026\") → primary: swissinfo.ch, URL https://www.swissinfo.ch/ger/cyberkriminelle-greifen-thurgauer-zugbauer-stadler-rail-an/91776656 → corroboration: IT Magazine, URL https://www.itmagazine.ch/artikel/87645/Ransomware-Attacke_Stadler_Rail_hat_nicht_gezahlt.html → background pivot (Everest TTPs/victimology): WebSearch (\"Everest ransomware group background TTPs double extortion 2026\") → Halcyon AI threat profile, URL https://www.halcyon.ai/threat-group/everest"
    summary: |
      Stadler Rail, a Swiss rolling-stock manufacturer headquartered in Thurgau, disclosed on 21 July 2026 that
      unauthorised parties gained access, in mid-July, to a data-exchange platform Stadler uses with an
      (unnamed) supplier. The Everest ransomware/extortion group claimed the intrusion and demanded a ransom of
      CHF 10 million. Stadler states it does not pay ransoms under any circumstances, has filed a criminal
      complaint, and reports that its own IT systems were unharmed, no security-relevant or personal data was
      stolen, and worldwide rail-vehicle production and in-service fleets are unaffected. The accessed
      information is described by Stadler as belonging to the supplier and not security-relevant.
      Everest is a Russian-speaking, closed-group double-extortion operation active since December 2020 that
      also runs an Initial Access Broker service (since Nov. 2021) and a paid corporate-insider recruitment
      program (since Oct. 2023); documented initial-access vectors are internet-exposed RDP without MFA and
      vulnerable VPN endpoints, with Cobalt Strike beacons over HTTPS and triple-redundant remote-access
      persistence (AnyDesk/Splashtop/Atera installed as Windows services) before WinRAR-staged exfiltration.
      Per Halcyon's tracking, Everest has previously claimed compromises of aviation systems at Heathrow,
      Brussels and Berlin airports (Sept. 2025) and a European national electricity grid plus telecom networks
      (Oct. 2025) — the Stadler case is a further instance of the group reaching a target's sensitive data
      through a trusted third-party B2B channel rather than the primary target's own perimeter, the same
      pattern as the Deutsche Bank / "Unsafe" vendor-platform incident reported this month.
    region_nexus: "Switzerland (Thurgau) — home-region manufacturer; Stadler rolling stock is operated across European rail networks including SBB"
