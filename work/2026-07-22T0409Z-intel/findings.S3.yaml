      Defender vantage: this is a BitLocker-abuse extortion model in the ShrinkLocker
      lineage (Kaspersky references its 2024 ShrinkLocker research) but here driven by
      an RMM-and-GPO admin workflow rather than a self-contained binary. The highest-
      value hunt signals are GPO/scheduled-task changes invoking BitLocker on machines
      that were not previously encrypted, sudden BitLocker recovery-key changes, and
      MSSQL processes (sqlservr.exe) spawning cmd.exe/powershell.exe via xp_cmdshell.
  - title: "Kaspersky corroborates the Cavern/HOLLOWGRAPH cluster and attributes it to OilRig (APT34): new 'Project CAV3RN' module adds DNS AAAA-record C2 config recovery behind Outlook-calendar Graph C2"
    sources:
      - { url: "https://securelist.com/project-cav3rn-cyberespionage-framework-using-outlook-and-dns/120757/", publisher: "Kaspersky (Securelist / GReAT)", date: "2026-07-21", role: "primary" }
      - { url: "https://research.checkpoint.com/2026/cavern-manticore-exposing-iran-linked-modular-c2-framework/", publisher: "Check Point Research", date: "2026-07-06", role: "corroborating" }
    discovery_trace: "first seen at: securelist RSS (https://securelist.com/feed/), URL https://securelist.com/project-cav3rn-cyberespionage-framework-using-outlook-and-dns/120757/ → primary (no pivot needed); cross-ref Check Point Cavern Manticore + Group-IB HOLLOWGRAPH (already covered)"
    summary: |
      Kaspersky GReAT published independent analysis of a new communication module
      (AzureCommunication.dll) in the Cavern C2 framework — the same Iran-linked toolset
      Check Point tracks as "Cavern Manticore" and Group-IB documented as HOLLOWGRAPH —
      and attributes the framework to OilRig (APT34). The new module replaces the earlier
      HTTP/WebSocket component with Microsoft Graph, exchanging encrypted commands and
      results as attachments (RSA-OAEP-SHA256 + AES-256-GCM) inside far-future Outlook
      calendar events (dated 2050-05-13) keyed to a controller-generated agent ID. The
      genuinely novel element beyond prior reporting is the resilience layer: when Graph
      authentication or tenant validation fails, the module recovers replacement
      connection settings (TenantId, ClientId, ClientSecret, UserEmail) via DNS AAAA
      responses from attacker nameservers, encoding length markers and 14-byte chunks in
      specially formatted subdomains. This is a material second-vendor corroboration of a
      cluster this pipeline covered on 2026-07-21 (HOLLOWGRAPH), adding the explicit
      OilRig attribution and the DNS AAAA config-recovery mechanics.
    region_nexus: "Israel / Middle East government and IT targeting; technique transferable to any Microsoft 365 tenant, including EU/CH public-sector"
