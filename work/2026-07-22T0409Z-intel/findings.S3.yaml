  - title: "Kaspersky: 'XEntry Team' runs living-off-the-land BitLocker extortion via RDP/MSSQL access, RMM tooling and GPO — ransom notes printed on office printers"
    sources:
      - { url: "https://securelist.com/new-extortion-scheme-printers-bitlocker/120718/", publisher: "Kaspersky (Securelist / GERT)", date: "2026-07-21", role: "primary" }
    discovery_trace: "first seen at: securelist RSS (https://securelist.com/feed/), URL https://securelist.com/new-extortion-scheme-printers-bitlocker/120718/ → primary (no pivot needed)"
    summary: |
      Kaspersky's GERT incident-response team documented two 2026 extortion cases by a
      crew it tracks as "XEntry Team" that abuses native Windows BitLocker for impact
      instead of deploying a conventional ransomware family — a living-off-the-land
      encryption model that leaves no bespoke encryptor for signature-based detection.
      Initial access in the analysed cases was an internet-exposed RDP service and a
      misconfigured Microsoft SQL Server whose xp_cmdshell extended stored procedure
      allowed OS command execution. The operators established persistence and remote
      control through legitimate RMM suites — ManageEngine Endpoint Central, Mesh Agent
      and Tactical RMM — dropped web shells, then used Group Policy Objects to push
      BitLocker encryption tasks across domain-joined systems. Ransom demands were small
      (about USD 3,000 in the Colombia case) and, in a notable delivery twist, ransom
      notes emerged from victims' office printers. Because every stage relies on
      built-in Windows features and off-the-shelf admin tooling, detection must target
      the behaviours — anomalous RDP logons, MSSQL xp_cmdshell command execution, new
      RMM-agent installs, GPO changes that invoke manage-bde/BitLocker, and unexpected
      recovery-key rotation — not a malware artefact.
    region_nexus: "global; TTP directly transferable to Swiss/EU public-sector and CI estates running exposed RDP, MSSQL and RMM"
