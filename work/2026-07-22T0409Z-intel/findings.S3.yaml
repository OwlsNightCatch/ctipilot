  - title: "SentinelLABS midyear assessment: Iran-nexus cyber operations shift from pre-conflict recon to access monetisation and persona-led coercion across five clusters"
    sources:
      - { url: "https://www.sentinelone.com/labs/iran-war-cyber-threat-landscape-a-midyear-assessment-on-what-matters/", publisher: "SentinelOne (SentinelLABS)", date: "2026-07-21", role: "primary" }
    discovery_trace: "first seen at: sentinellabs RSS (https://www.sentinelone.com/labs/feed/), URL https://www.sentinelone.com/labs/iran-war-cyber-threat-landscape-a-midyear-assessment-on-what-matters/ → primary (no pivot needed)"
    summary: |
      SentinelLABS published a midyear assessment of the Iran-nexus cyber threat landscape,
      framing activity across five clusters — Void Manticore (destructive, persona-led),
      MuddyWater (espionage), APT34/OilRig (regional intelligence), APT42 (cloud and social
      engineering) and CyberAv3ngers (opportunistic OT) — targeting US and Israeli
      government, finance, critical infrastructure and NGO sectors. Its central analytic
      judgement is that post-conflict activity has moved from reconnaissance toward access
      monetisation and selective disruption, with persona-fronted campaigns weaponising
      public claims (leak samples, victim lists, unverifiable impact figures) to impose
      psychological cost before any technical effect is confirmed — meaning defenders
      should treat loud public claims skeptically and separately from verified impact. The
      lab's defender priorities are concrete and transferable to Swiss/EU CI and government:
      eliminate internet-facing industrial systems, secure identity/RMM/service-provider
      access paths, enforce phishing-resistant MFA on trusted administrative accounts, and
      architect recovery independent of production dependencies. Named tooling overlaps with
      this pipeline's existing coverage (Cavern Manticore, CyberAv3ngers OT activity).
    region_nexus: "US/Israel/Middle East targeting; CyberAv3ngers OT opportunism and identity-path tradecraft directly relevant to EU/CH critical infrastructure and government"
