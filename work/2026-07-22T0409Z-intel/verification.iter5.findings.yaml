- code: F4
  category: hallucinated-fact
  section: trending-vulnerabilities
  item: "Zimbra Collaboration Suite 10.1.20 — SNMP command-injection RCE plus stored-XSS"
  url_or_quote: "CVE-2026-10631 (an access-control issue in the EWS extension), and CVE-2026-50054 (an authorization flaw in mailbox delegation) ... Three issues received CVE identifiers, confirmed via BSI's CSAF record"
  summary: >
    The specific CVE-to-issue mappings CVE-2026-10631 = EWS-extension access control and
    CVE-2026-50054 = mailbox-delegation authorization are asserted as fact but appear in NONE
    of the cited sources. Verified this iteration: the Zimbra blog lists the nine issues with no
    CVE identifiers; BSI CSAF WID-SEC-2026-2429 carries only three bare CVE IDs (title=CVE-id,
    product_status, release_date) with no per-CVE descriptions; The Hacker News maps ONLY
    CVE-2026-50055 = mail-forwarding bypass; NVD/MITRE are RESERVED. The body's inline attribution
    "confirmed via BSI's CSAF record" and the sourcing_note claim "their issue mapping confirmed via
    BSI's CSAF record" are contradicted by the CSAF, which contains no issue mapping. Only the
    CVE-2026-50055 = mail-forwarding bypass mapping is source-supported (Hacker News). Remediation:
    hedge the two unconfirmed CVE->issue assignments (or find a source that establishes them) and
    correct the body/sourcing_note so they no longer claim BSI's CSAF confirms a mapping it does not.
