      - { url: "https://www.sec.gov/Archives/edgar/data/0000021344/000162828026048466/ko-20260716.htm", publisher: "SEC EDGAR — The Coca-Cola Company Form 8-K", date: "2026-07-16", role: "primary" }
    discovery_trace: "first seen at: WebSearch (\"Anubis ransomware Coca-Cola Fairlife breach confirmed statement\") → pivot: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/anubis-ransomware-claims-coca-cola-fairlife-attack-threatens-data-leak/ → corroborating: Cybernews (fetch attempt returned HTTP 403, not re-tried; corroboration taken from WebSearch synthesis of its published summary) → primary: Coca-Cola Company investor press release, URL https://investors.coca-colacompany.com/news-events/press-releases/detail/1166/the-coca-cola-company-announces-technology-disruption-involving-fairlife-operations → primary: SEC Form 8-K, URL https://www.sec.gov/Archives/edgar/data/0000021344/000162828026048466/ko-20260716.htm"
    summary: |
      The Anubis ransomware-as-a-service group claimed responsibility on 21 July 2026 for a cyberattack on
      fairlife LLC, Coca-Cola's dairy subsidiary, five days after Coca-Cola's own 16 July disclosure (an
      investor press release and SEC Form 8-K) that a third party had gained unauthorized access to a
      portion of fairlife's systems, including production-related systems, forcing a temporary suspension
      of all US fairlife production (Canadian production unaffected; product quality/safety not impacted).
      Anubis claims to have fully encrypted fairlife's Nutanix hyperconverged-infrastructure (HCI)
      environment and exfiltrated roughly 1 TB of corporate data, threatening publication unless
      negotiations begin; BleepingComputer states it could not independently verify the encryption-scope or
      data-volume claims, and Coca-Cola has not corroborated them. If accurate, the claimed targeting of the
      Nutanix HCI layer — which underlies both IT and production-adjacent virtualized workloads — mirrors
      the ESXi-encryptor playbook of attacking the hypervisor/HCI control plane to maximize operational
      impact from a single compromised layer, a technique class relevant to any manufacturer virtualizing
      OT-adjacent systems on converged infrastructure (Nutanix AHV/Prism, VMware ESXi, Hyper-V). Anubis has
      operated as a RaaS since December 2024 and has separately added data-wiper capability to its toolkit.
      Inclusion basis: (b) a materially relevant, transferable TTP — HCI/hypervisor-layer ransomware
      causing a physical-production halt at a globally recognized multinational brand.
    region_nexus: "US operations (Fairlife); global brand (Coca-Cola) — HCI/hypervisor-targeting technique is directly transferable to any EU/CH manufacturer virtualizing production-adjacent systems on converged infrastructure"
