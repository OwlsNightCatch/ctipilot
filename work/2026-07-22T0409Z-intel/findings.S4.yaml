items:
  - title: "Everest ransomware breaches a Stadler Rail supplier data-exchange platform, demands CHF 10 million — Swiss rail manufacturer refuses to pay"
    sources:
      - { url: "https://www.swissinfo.ch/ger/cyberkriminelle-greifen-thurgauer-zugbauer-stadler-rail-an/91776656", publisher: "swissinfo.ch (Swiss public broadcaster)", date: "2026-07-21", role: "primary" }
      - { url: "https://www.itmagazine.ch/artikel/87645/Ransomware-Attacke_Stadler_Rail_hat_nicht_gezahlt.html", publisher: "Swiss IT Magazine", date: "2026-07-21", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"Schweiz Datenleck Cyberangriff Firma Juli 2026\") → pivot: swissinfo.ch, URL https://www.swissinfo.ch/ger/cyberkriminelle-greifen-thurgauer-zugbauer-stadler-rail-an/91776656 → corroborating: itmagazine.ch, URL https://www.itmagazine.ch/artikel/87645/Ransomware-Attacke_Stadler_Rail_hat_nicht_gezahlt.html (Railway Gazette International and Le Temps coverage of the same story returned HTTP 403 on WebFetch and were not pursued further)"
    summary: |
      Stadler Rail, the Swiss rail-vehicle manufacturer headquartered in Bussnang (Thurgau), disclosed on
      21 July 2026 that the Russian-speaking double-extortion group Everest compromised a data-exchange
      platform it shares with a supplier and demanded a CHF 10 million ransom. Stadler refused to pay,
      filed a criminal complaint with Thurgau cantonal police, and states no security-relevant or personal
      data was stolen and that its own core IT systems and worldwide production were unaffected — the
      accessed data was supplier-side technical information, not related to deployed rolling stock.
      Everest, active since December 2020, runs a triple-track business model (double-extortion encryption,
      initial-access brokerage, and a paid corporate-insider recruitment programme) built on BlackByte-
      lineage tooling (locally-generated encryption keys, ConfuserEx-protected .NET encryptor), and has
      previously claimed victims including Collins Aerospace and several European airports — this is the
      latest instance of the group reaching into transport-sector supply chains. The incident extends a
      week-long pattern of Swiss/European breaches entering via third-party/supplier infrastructure rather
      than the primary victim's own perimeter (cf. IWB Basel, Ernst & Young, AsyncAPI, Kudankulam/Reliance
      already in this run's prior coverage). Inclusion basis: direct home-region hit — Swiss transport-
      sector manufacturer, no additional gate criteria needed.
    region_nexus: "Switzerland (Thurgau) — home region, direct hit on a transport-sector manufacturer"
    primary_sector_nexus: "indirect"
    sector: "transport"
