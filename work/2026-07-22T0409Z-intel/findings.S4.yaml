  - title: "South Korea's Foreign Ministry: ~10-month zero-day intrusion into the Diplomatic Academy's e-learning platform exposes records on nearly all diplomats"
    sources:
      - { url: "https://www.koreaherald.com/article/10815199", publisher: "The Korea Herald", date: "2026-07-21", role: "primary" }
      - { url: "https://www.dailysecu.com/news/articleView.html?idxno=207721", publisher: "DailySecu (Korean cybersecurity trade press)", date: "2026-07-21", role: "corroborating" }
      - { url: "https://www.seoul.co.kr/news/society/accident/2026/07/22/20260722008007", publisher: "Seoul Shinmun", date: "2026-07-22", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"South Korea diplomats data leak Foreign Ministry cyberattack KNDA\") → pivot: The Korea Herald, URL https://www.koreaherald.com/article/10815199 → pivot: WebSearch (\"외교부 국립외교원 사이버공격 제로데이 유출\") → corroborating: DailySecu, URL https://www.dailysecu.com/news/articleView.html?idxno=207721 → corroborating (same-day follow-up): Seoul Shinmun, URL https://www.seoul.co.kr/news/society/accident/2026/07/22/20260722008007"
    summary: |
      South Korea's Ministry of Foreign Affairs disclosed on 21 July 2026 that attackers exploited a
      previously unknown zero-day vulnerability in the server software behind the Korea National
      Diplomatic Academy's (KNDA) online training/e-learning platform, combined with security-configuration
      weaknesses, to seize control of the server between April and May 2025. The intrusion evaded the
      Academy's routine security checks (in place since the platform's 2022 deployment) and was only
      discovered in early February 2026, after another government agency flagged suspicious activity; the
      server was taken offline at that point and the (unnamed) software manufacturer released a patch once
      the flaw was identified during the investigation. Public disclosure followed roughly five months after
      internal discovery. Exposed data covers up to ~10,000 records of current and former diplomats,
      overseas-mission officials and embassy/consulate administrative staff — reported as roughly 2,500
      diplomats posted worldwide and 350 currently serving overseas officials — including names, user IDs,
      email addresses and encrypted passwords, but not resident-registration numbers, phone numbers, home
      addresses or photographs. Officials state there is not yet sufficient technical evidence to identify
      the perpetrator but are not ruling out state-backed groups, including North Korea. Inclusion basis:
      (a) genuinely significant scale (near-complete diplomatic-corps exposure of a G20 nation) and (d) an
      imminent, transferable shared threat — any EU/CH ministry or public institution running an externally
      reachable staff e-learning/training platform faces the same exposure class, and the case underscores
      that cross-agency threat-sharing, not the operator's own telemetry, caught this intrusion.
    region_nexus: "South Korea (outside home region); transferable lesson for EU/CH government e-learning/training platforms exposed to the internet"
    primary_sector_nexus: "direct"
    sector: "public-sector / government (diplomatic training infrastructure)"
