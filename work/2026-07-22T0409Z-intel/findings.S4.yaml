  - title: "Anubis ransomware claims Coca-Cola's Fairlife dairy subsidiary, alleging full encryption of its Nutanix HCI infrastructure"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/security/anubis-ransomware-claims-coca-cola-fairlife-attack-threatens-data-leak/", publisher: "BleepingComputer", date: "2026-07-21", role: "primary" }
