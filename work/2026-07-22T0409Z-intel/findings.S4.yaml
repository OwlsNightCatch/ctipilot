  - title: "Estée Lauder confirms Cl0p Oracle E-Business Suite breach (CVE-2025-61882) — ~10.5-month dwell before discovery"
    sources:
      - { url: "https://www.helpnetsecurity.com/2026/07/21/estee-lauder-data-breach-oracle-ebs/", publisher: "Help Net Security", date: "2026-07-21", role: "primary" }
