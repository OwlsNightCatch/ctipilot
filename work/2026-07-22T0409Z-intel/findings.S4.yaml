      - { url: "https://oag.ca.gov/system/files/ELC%20-%20U.S.%20Individual%20Notification%20Letter.pdf", publisher: "California Attorney General (Estée Lauder's own breach notification letter)", date: "2026-07", role: "primary" }
      - { url: "https://www.oracle.com/security-alerts/alert-cve-2025-61882.html", publisher: "Oracle Security Alerts (vendor advisory)", date: "2025-10-05", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"Estée Lauder data breach Oracle E-Business Suite Cl0p\") → pivot: Help Net Security, URL https://www.helpnetsecurity.com/2026/07/21/estee-lauder-data-breach-oracle-ebs/ → pivot: CyberInsider, URL https://cyberinsider.com/estee-lauder-discloses-data-breach-tied-to-oracle-e-business-suite-attacks/ → primary: California AG breach-notification letter (Estée Lauder's own document), URL https://oag.ca.gov/system/files/ELC%20-%20U.S.%20Individual%20Notification%20Letter.pdf → vendor advisory: Oracle, URL https://www.oracle.com/security-alerts/alert-cve-2025-61882.html"
    summary: |
      The Estée Lauder Companies disclosed, via a notification letter filed with the California Attorney
      General around 20-21 July 2026, that an unauthorized third party exploited CVE-2025-61882 — an
      unauthenticated remote-code-execution flaw in Oracle E-Business Suite's BI Publisher Integration
      component (affecting EBS 12.2.3-12.2.14, patched by Oracle's 4 October 2025 out-of-band update,
      CISA KEV-listed since 6 October 2025 with "Known" ransomware-campaign use) — to access its EBS-based
      HR management system. Initial compromise occurred on or around 9 August 2025; Estée Lauder did not
      determine the intrusion and data theft until 19 June 2026 (~10.5-month dwell) and disclosed publicly
      roughly a month after that. Exposed data varies per individual and includes names, postal/email
      addresses, dates of birth, Social Security numbers, passport numbers, bank account numbers, health
      information, performance evaluations and payroll history. The intrusion is part of the Cl0p extortion
      gang's mass August-2025 zero-day campaign against Oracle EBS, which has separately hit 100+
      organizations including Nissan, a Canon subsidiary, Harvard University, University of Phoenix, The
      Washington Post and Logitech. Estée Lauder engaged outside cybersecurity experts, notified law
      enforcement, and is offering 24 months of Kroll identity-monitoring (enrollment deadline 31 October
      2026). Inclusion basis: (a) genuinely global significance (Fortune-500 multinational, SSN/passport/
      health-data exposure, part of a 100+-victim campaign) and (b) a transferable dwell-time/detection
      lesson — a zero-day RCE against a widely-deployed ERP platform sat undetected for over ten months.
    region_nexus: "global (US multinational); Oracle E-Business Suite is widely deployed across EU/CH enterprise and public-sector ERP estates — the same Cl0p campaign already affects 100+ organizations globally"
