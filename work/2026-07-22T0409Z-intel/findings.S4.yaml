          summary: "Korea National Diplomatic Academy's online training platform compromised via an undisclosed zero-day plus security misconfiguration (April/May 2025 - February 2026 dwell); ~10,000 diplomat/embassy-staff records exposed; attribution unconfirmed, North Korea/China not ruled out (Korea Herald, DailySecu, Seoul Shinmun, 2026-07-21/22)." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "The attacker exploited a previously unknown security flaw, known as a zero-day vulnerability, in software used by the platform"
        attribution: "The Korea Herald"
