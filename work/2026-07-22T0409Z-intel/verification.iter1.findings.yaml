- code: F4
  category: hallucinated-fact
  section: cavern-cav3rn-oilrig-attribution-dns-aaaa-c2-fallback
  item: "Kaspersky corroborates the Cavern/HOLLOWGRAPH cluster, attributes it to OilRig (APT34)..."
  url_or_quote: "headline: 'A second vendor ties the Outlook-calendar Graph C2 framework to OilRig'; summary/body: 'attributing it to OilRig (APT34)'; body: 'providing the explicit attribution that earlier coverage of this cluster lacked'"
  summary: "Overstates confidence. Kaspersky's Attribution section states 'we retain our low-confidence assessment that Project CAV3RN is associated with OilRig' and 'we identified no direct code reuse or infrastructure overlap', and notes it had already attributed CAV3RN to OilRig in a PREVIOUS report with low confidence. The entry presents this as 'the explicit attribution that earlier coverage lacked' / headline 'ties ... to OilRig'. Reword to a low-confidence assessment associating (not attributing) the framework with OilRig; drop 'explicit'. Verified via jina fetch of https://securelist.com/project-cav3rn-cyberespionage-framework-using-outlook-and-dns/120757/ (Attribution section, lines 323-341)."
- code: F5
  category: missing-citation
  section: everest-ransomware-stadler-rail-supplier-platform-breach
  item: "Everest ransomware breaches a Stadler Rail supplier data-exchange platform..."
  url_or_quote: "body para 2: 'Everest is a Russian-speaking, closed-group double-extortion operation active since December 2020 that also runs an initial-access-broker service and a paid corporate-insider recruitment programme ... Per third-party actor tracking the group has previously claimed compromises of aviation systems at Heathrow, Brussels and Berlin airports (September 2025) and a European electricity grid and telecom networks (October 2025)'"
  summary: "Entire actor-background paragraph carries no inline citation; 'Per third-party actor tracking' is not a source. The two cited sources (swissinfo.ch, itmagazine.ch) cover only the Stadler incident, not Everest's founding date, business model, initial-access vectors, or the airport/grid victim claims. Research (findings.S4.yaml) sourced these to AttackIQ/Halcyon/SOCRadar profiles — add one such actor-profile record as corroborating and inline-cite, or attribute the specific claims. (Airport/grid claims are already correctly hedged as unconfirmed.)"
