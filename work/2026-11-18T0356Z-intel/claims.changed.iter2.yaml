  - claim_id: 7c9d718e5c
    entry: 2026-11-18/cold-relic-stolen-pretext-cloud-identity-persistence
    surface: "summary"
    kind: frontmatter
    text: "Mandiant reports that COLD RELIC, the name Google Threat Intelligence Group now uses for the group formerly tracked as COLDRIVER and UNC4057 (Star Blizzard), reused the staff directory and identities stolen from one US organisation in late 2025 to impersonate a contact when approaching a second in 2026. In the late-2025 case it took over a Super Admin account through push-notification fatigue, kept access with enrolled passkeys, MFA backup codes and rogue MFA devices that survived password and session resets, and exported the whole tenant; in 2026 it phished Entra ID credentials and registered a new MFA device to download one user's drive. GTIG names government officials, defense contractors and NGOs in Europe and North America as targets and says new phishing operations continued into November 2026."
  - claim_id: 14dfeaf2d8
    entry: 2026-11-18/cold-relic-stolen-pretext-cloud-identity-persistence
    surface: "actions[0]"
    kind: frontmatter
    text: "In every Google Workspace and Entra ID tenant you run, search the administrator and sign-in logs for passkey, backup-code and MFA-device enrolments on privileged accounts and for tenant-wide Customer Takeout exports, because COLD RELIC's enrolled authenticators survived password and session resets."
