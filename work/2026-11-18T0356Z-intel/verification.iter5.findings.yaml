  section: 2026-11-10/n-able-n-central-33-unpatched-flaws-public-pocs-offline (section "Update — 2026-11-18T05:12:35Z", paragraph 2, claim fcb3bbdb8e)
  item: "The release notes and N-able's notice name neither 4EverAble2Shell nor Agent2Shell nor the Apache Axis flaw and do not say they are fixed"
