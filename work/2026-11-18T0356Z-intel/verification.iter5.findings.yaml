  section: 2026-11-18/microsoft-agent-framework-pypi-credential-stealer-pth-hook (body, Detection, claim 5247ae47dc)
  item: "because the stealer requests identity tokens, Azure and GitHub sign-in logs for those identities show later use ([SafeDep, 2026-11-18])"
  url_or_quote: "https://safedep.io/blog/microsoft-agent-framework-pypi-compromise"
  summary: "(low confidence) SafeDep says only: 'Review sign-in and activity logs for the managed identities and federated credentials that environment could use, from the install time onward.' It names no GitHub sign-in logs and states no result ('show later use'); the stealer's GitHub Actions OIDC token requests are in the page, but a GitHub-side log source is not. Fix: say 'review sign-in and activity logs for the managed identities and federated credentials the environment could use, from the install time onward', which is SafeDep's wording."
