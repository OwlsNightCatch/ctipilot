    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: "Infoblox's own statement is thin and the customer-snapshot detail rests on The Register's anonymous sources (Security Affairs and Cyber Daily relay them); The Register piece is dated 2026-11-16 21:53 UTC, about four hours before the 26 h window opens, with Security Affairs and Cyber Daily dated 2026-11-17; the constituency relevance (NIOS in Swiss public networks) is not stated by any source."
    classification_suggestion: "B2 (company statement first-hand but sparse; details from anonymous sources relayed by two outlets)."
    evidence:
      - quote: "investigating a security event involving unauthorized access to certain company information through a compromised third-party data migration vendor"
        attribution: "TechCrunch (quoting Infoblox)"
        source_url: "https://techcrunch.com/2026/11/16/cyber-giant-infoblox-confirms-security-incident-after-hackers-access-company-information/"
      - quote: "Based on our investigation to date, we have no indication that any Infoblox products, cloud services, software updates or build-and-release processes were involved."
        attribution: "Infoblox (statement to Cyber Daily)"
        source_url: "https://www.cyberdaily.au/security/14454-hacked-infoblox-discloses-third-party-data-breach-employee-data-compromised"
      - quote: "saved snapshots of customers’ network data, such as DNS, DHCP configurations, Grid databases, and reporting logs, that can be used to fully recover the appliance or grid in case of a system failure or faulty upgrade"
        attribution: "Security Affairs (quoting The Register)"
        source_url: "https://securityaffairs.com/203309/data-breach/infoblox-confirms-supply-chain-breach-after-attackers-access-sensitive-data.html"
    extended_notes: |
      Exposure: not stated which customers; Infoblox says it 'sent notifications'. A defender should check for an Infoblox customer notice and whether NIOS backups or Grid snapshots were ever shared with the vendor via SharePoint-style channels.
      Detection concepts (inference): audit-log review of a third party's accounts in the tenant's collaboration platform (bulk file downloads, sign-ins outside the migration window); for customers, treat NIOS topology data as disclosed reconnaissance material and re-check internal DNS/DHCP exposure and zone/option content.
      Lesson with a mechanism: third-party migration tooling gets standing broad read access to a document store; the intruder needs no exploit. The mapping T1213.002 (SharePoint) is an analyst mapping of the reported pull of data out of SharePoint with vendor accounts; no source names the exfiltration channel, so no exfiltration technique is mapped.

