    extended_notes: |
      Exposure (as the sources support it): any HPC or research-computing operator that publishes a live status or monitoring dashboard to the internet, and any site whose users hold keys for several centres. Mapping notes: T1190 is mapped because RIKEN says the dashboard was the foothold and that a software vulnerability was abused (method itself undisclosed); T1552.004 for SSH private keys read from home directories; T1005 for the home-directory file collection; T1078 and T1021.004 are attempts RIKEN confirms (connection attempts with stolen credentials), not confirmed successes.
      Detection concepts a defender can derive (analyst inference, not stated by RIKEN): on login nodes, public-key SSH logins from sources not previously seen for that user, especially for users who also have accounts at RIKEN or other HPC centres, and key fingerprints that match the invalidated Fugaku keys; web-tier telemetry on any exposed status/monitoring page (unexpected child processes of the web service, outbound connections from the host); file-read patterns across many home directories from one service account. Triage: legitimate users re-registering new keys after a partner centre's mass revocation look similar to key replay; the discriminator is the key's fingerprint history and source network.
      Hardening levers named by RIKEN: fix the abused software vulnerability, rebuild compromised servers, review network configuration, revise the operations/maintenance responsibility split with the outsourced maintainer. Defender takeaway candidate: treat users' stored private keys as part of the HPC centre's blast radius; do not publish operational dashboards from the same network segment as the management servers.
      Timeline note: RIKEN's release is 2026-11-16 (before the 26 h window); in-window coverage is BleepingComputer 2026-11-17 and DataBreaches.net 2026-11-17; Piyolog (lookback 74 h) carries the full timeline.

  - title: "Barracuda: an attacker used a cloud access key issued to an AI vendor and never retired, took about 44 hours to cross roughly ten cloud accounts, a data-analytics system, source-code access and Kubernetes clusters, and Barracuda assesses the behaviour matches the ARTEX framework"
    sources:
      - { url: "https://blog.barracuda.com/2026/11/11/anatomy-of-a-machine-speed-intrusion", publisher: "Barracuda (blog, first-hand account)", date: "2026-11-11", role: "primary" }
      - { url: "https://trust.barracuda.com/security/barracuda-xdr-integration-credentials", publisher: "Barracuda Trust Center advisory (updated 2026-11-13)", date: "2026-11-13", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/barracuda-links-cloud-breach-to-artex-ai-powered-cyberattack/", publisher: "BleepingComputer", date: "2026-11-16", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/news/security/ (listing parsed with url --direct; the feed returned only 15 items) → https://www.bleepingcomputer.com/news/security/barracuda-links-cloud-breach-to-artex-ai-powered-cyberattack/ → primary: Barracuda blog, URL https://blog.barracuda.com/2026/11/11/anatomy-of-a-machine-speed-intrusion → primary: Barracuda Trust Center, URL https://trust.barracuda.com/security/barracuda-xdr-integration-credentials. Store check: no entry covers this incident; ARTEX entries exist (tool:artex)."
    summary: |
      Barracuda says an attacker used a valid cloud access key, issued to an unnamed AI vendor for an earlier project and never retired, to run a machine-speed intrusion between 2026-11-01 04:33 UTC and 2026-11-02 23:31 UTC. The key had been stored in a configuration file in the vendor's GitHub repository, which was exposed when the vendor's development environment was compromised in October (Trust Center update of 2026-11-13). With it the attacker read stored secrets (AWS access keys, Azure service-principal secrets), decrypted infrastructure-as-code state files, pulled credentials from server metadata services and Kubernetes service accounts, and chained from the cloud accounts to a data-analytics system, a source-code access token and Kubernetes clusters, touching about ten cloud accounts. On 2026-11-02 it pushed short-lived branches to a handful of repositories to trigger a build workflow written to print the build system's secrets into the job log, with the output encoded so that the usual secrets masking would not hide it. On a group of servers it ran commands searching for wallet and seed-phrase material (environment variables named WALLET, MNEMONIC, SEED, PRIV; Ethereum keystore files; extended private keys; Kubernetes secrets with wallet-related names; none existed on those systems), deployed a container that mounted the host file system (read-only, enough to harvest the host's credentials) and tried to create a new cloud administrator identity, which was blocked. Barracuda removed the container on the evening of 2026-11-04 and found the intrusion because an engineer noticed unusual activity on their own account on 11-04, the same day the vendor reported its own incident; the activity had already stopped. One reached system stores the credentials Barracuda XDR uses to collect data from customers' connected systems (Microsoft 365, Google Workspace, endpoint security platforms and others); logging there was not detailed enough to rule out access, so Barracuda told affected Managed XDR Cloud and Monitored Endpoint customers to revoke and recreate integration credentials and review connected-system activity from 2026-11-01. Barracuda assesses that the machine-style resource labels (letter 'i' plus digits), probe names, ordering of actions and built-in credential and wallet hunting match ARTEX, an open-source AI-driven pentest framework, and says the match shows how the attacker worked, not who it was; it judges the motive financial but does not rule out that wallet hunting was a diversion or that AI-service credentials were also a target. No threat actor is named.
    region_nexus: "global; no Swiss customer named. Barracuda Managed XDR integration credentials (Microsoft 365, Google Workspace, endpoint platforms) are the exposure that matters to any Swiss public body using the service."
    primary_sector_nexus: "indirect: a security vendor whose email-security and XDR products are in public-sector estates (the store already carries Barracuda ESG items); the lesson is vendor-held standing keys."
