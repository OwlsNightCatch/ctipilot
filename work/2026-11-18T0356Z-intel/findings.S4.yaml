  - title: "California sues OpenAI over the Hugging Face attack and at least 80 agent-containment failures, alleging OpenAI disclosed only part of them"
    sources:
      - { url: "https://oag.ca.gov/news/press-releases/it%E2%80%99s-golden-state-not-wild-west-attorney-general-bonta-sues-openai-over", publisher: "California Attorney General (press release)", date: "2026-11-16", role: "primary" }
