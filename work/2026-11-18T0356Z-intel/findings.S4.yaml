      - { url: "https://www.netzwoche.ch/news/2020-05-18/supercomputer-unter-cyberbeschuss", publisher: "Netzwoche (2020 HPC SSH-key campaign, Swiss sites)", date: "2020-05-18", role: "background" }
    discovery_trace: "first seen at: piyolog, URL https://piyolog.hatenadiary.jp/ (listing, entry 2026/11/17/030254) → pivot: bleepingcomputer feed, URL https://www.bleepingcomputer.com/news/security/japan-takes-fugaku-supercomputer-offlline-after-cyberattack/ → primary: RIKEN press release, URL https://www.riken.jp/pr/news/2026/20261116_2/index.html → corroboration: Kyodo via 47NEWS https://www.47news.jp/15239255.html and Mainichi https://mainichi.jp/articles/20261117/ddm/001/040/111000c; Swiss background found via WebSearch ('CSCS ETH Zürich Supercomputing Sicherheitsvorfall SSH Schlüssel Fugaku HPC Zugangsdaten') → CSCS 2020 notice and Netzwoche 2020. databreaches-net feed also listed it (2026-11-17, summary only, article body 403)."
    summary: |
      RIKEN's Center for Computational Science said on 2026-11-16 that between 2026-11-10 and 2026-11-13 a third party entered the internal operations network of the Fugaku supercomputer, using the internet-facing web page that shows Fugaku's operating status (the dashboard) as the foothold; the exact intrusion method is still under investigation, but RIKEN's remediation list names a "software vulnerability that was abused". The intruder operated several internal servers, tampered with part of them (RIKEN says programs were planted) and took, or may have taken, two kinds of data: the user-authentication system's records (names, e-mail addresses and IDs of up to 4,222 Fugaku users plus names and e-mail addresses of up to 375 users of the AI supercomputer Rikyu, 4,597 in total) and files from users' home directories, which include the credentials users had stored for supercomputers and services outside RIKEN (SSH private keys, access keys) and research data. RIKEN confirms the intruder used some of the stolen credentials to try to reach other systems and says it is still checking for secondary damage; it reports no evidence that research results left. Maintenance of the affected operations system is outsourced: suspicious traffic was detected on 11-12, intrusion confirmed 11-13 16:33 JST, the affected system isolated 11-13 22:07, Fugaku shut down 11-14 04:30, management keys replaced 11-14, and on 11-15 all running and queued jobs were stopped and every user's login public key was invalidated; users were asked to revoke the stored keys at each destination and, per Piyolog citing a Mainichi report of 2026-11-17, to re-check analyses run 11-12 to 11-15. No attributor is named. RIKEN reported to Japan's personal-information commission, MEXT and the HPCI partner organisations. Assessment (this analyst, not RIKEN): the loot is a credential set that works at other computing centres, so the exposure extends to every site where a Fugaku user also holds an account; the same pattern, SSH keys harvested at one HPC centre and replayed at others, hit ETH Zürich and CSCS Lugano and targeted EPFL and the University of Basel in May 2020, with the University of Basel describing initial access as compromised SSH keys of user accounts obtained from other HPC centres (CSCS 2020 notice; Netzwoche 2020).
    region_nexus: "Japan (apac); no Swiss victim reported. Same-class Swiss precedent: May 2020 HPC SSH-key campaign across ETH Zürich, CSCS, EPFL and University of Basel (CSCS; Netzwoche)."
    primary_sector_nexus: "indirect: public research computing; Swiss federal and cantonal research institutions that share users or keys with other HPC centres (ETH domain, CSCS, universities) are the same asset class. No source says any Swiss site is affected now."
