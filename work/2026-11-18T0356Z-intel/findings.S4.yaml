  - title: "Infoblox confirms a breach through a compromised third-party SharePoint data-migration vendor: employee payroll and dependent identity data, and, reportedly, saved NIOS customer snapshots (DNS and DHCP configuration, Grid databases, reporting logs)"
    sources:
      - { url: "https://techcrunch.com/2026/11/16/cyber-giant-infoblox-confirms-security-incident-after-hackers-access-company-information/", publisher: "TechCrunch (Infoblox statement)", date: "2026-11-16", role: "primary" }
      - { url: "https://www.theregister.com/security/2026/11/16/infoblox-customer-and-staff-data-exposed-in-sharepoint-breach/5310280", publisher: "The Register (exclusive, anonymous sources and a CEO email)", date: "2026-11-16", role: "primary" }
      - { url: "https://www.cyberdaily.au/security/14454-hacked-infoblox-discloses-third-party-data-breach-employee-data-compromised", publisher: "Cyber Daily (Infoblox statement)", date: "2026-11-17", role: "corroborating" }
      - { url: "https://securityaffairs.com/203309/data-breach/infoblox-confirms-supply-chain-breach-after-attackers-access-sensitive-data.html", publisher: "Security Affairs", date: "2026-11-17", role: "corroborating" }
    discovery_trace: "first seen at: The Register security Atom feed (fetch_source feed), URL https://www.theregister.com/security/headlines.atom (title 'Infoblox customer and staff data exposed in Sharepoint breach') → read via WebFetch of https://www.theregister.com/security/2026/11/16/infoblox-customer-and-staff-data-exposed-in-sharepoint-breach/5310280 (extract returned only page chrome) → pivot: WebSearch ('Infoblox data breach employees dependents Social Security numbers Scott Harrell email vendor compromised') → TechCrunch https://techcrunch.com/2026/11/16/cyber-giant-infoblox-confirms-security-incident-after-hackers-access-company-information/ (Infoblox statement) → Cyber Daily https://www.cyberdaily.au/security/14454-hacked-infoblox-discloses-third-party-data-breach-employee-data-compromised → Security Affairs https://securityaffairs.com/203309/data-breach/infoblox-confirms-supply-chain-breach-after-attackers-access-sensitive-data.html. No Infoblox-published notice was found."
    summary: |
      Infoblox told TechCrunch on 2026-11-16 that it is investigating a security event involving unauthorized access to certain company information through a compromised third-party data migration vendor, that it activated incident response and brought in outside experts, and (to Cyber Daily) that it has no indication that any Infoblox products, cloud services, software updates or build-and-release processes were involved. Per The Register's anonymous sources, the vendor performed SharePoint migration work with trusted access to Infoblox's SharePoint and the intruders used the vendor's accounts and access to exfiltrate data directly from Microsoft SharePoint; TechCrunch's sources say Infoblox has ended its work with the vendor and that sensitive customer data was taken. A CEO email seen by The Register says employee data was taken: direct-deposit details, contact details, dates of birth and Social Security numbers of staff and dependents. The Register and Security Affairs report that the taken customer material includes configuration data for some customers' NIOS deployments, described as saved snapshots of customers' network data (DNS and DHCP configuration, Grid databases, reporting logs) that can recover an appliance or grid; Security Affairs notes the snapshots are not reported to hold passwords but give a map of a customer's internal network. Infoblox has not named the vendor, said how many customers or staff are affected, or said whether the attackers made demands, and no group has claimed it. No vulnerability or CVE is named; the reported access path is valid vendor accounts, not an exploit.
    region_nexus: "global (US-headquartered vendor); no Swiss customer named by any source"
    primary_sector_nexus: "indirect: DNS/DHCP/IPAM infrastructure vendor; any Swiss public body running NIOS Grid backups or having shared configuration snapshots with Infoblox is the exposed population, but no source says Swiss customers are among those affected."
