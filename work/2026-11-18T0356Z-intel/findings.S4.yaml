      - quote: "The cloud access key used had been stored in a configuration file within the third party’s GitHub repository"
        attribution: "Barracuda"
        source_url: "https://trust.barracuda.com/security/barracuda-xdr-integration-credentials"
    extended_notes: |
      Recency: Barracuda's advisory is 2026-11-10 (updated 11-13) and the blog 2026-11-11; the first sighting in this run is BleepingComputer's 2026-11-16 article on the bleepingcomputer record (49 h lookback), hence lookback: true. Nothing in the store covers it (checked entries and registry).
      Exposure / how to tell: only customers of Barracuda Managed XDR Cloud or Monitored Endpoint with API integrations were contacted; Barracuda says organisations that heard nothing need no action. Customers' check: revoke and recreate integration credentials and review activity logs of the connected systems (Microsoft 365, Google Workspace, endpoint platforms) from 2026-11-01.
      Detection concepts tied to what Barracuda observed: cloud audit logs showing first use of a long-unused vendor key followed within minutes by secret-store reads; identity-provider or cloud logs for one principal enumerating secrets across several accounts; source-control audit logs for short-lived branches created and deleted that trigger CI workflows which echo secrets (encoded) into job logs; Kubernetes audit events for newly deployed privileged or host-path-mounting containers; attempted creation of cloud administrator identities. Behavioural lookalike: legitimate infrastructure-scanning or vendor onboarding tools also enumerate secrets, but a vendor key used outside the engagement window, resource names that are all 'i' plus digits, and workflow files that print secrets are the discriminators Barracuda names.
      Hardening named by Barracuda: remove long-lived and over-privileged keys, expire vendor credentials when an engagement ends, move integration credentials to a store that survives cluster-admin compromise, full audit and data-access logging, restrict privileged workloads and which services can read secrets, runtime threat detection on clusters. Barracuda's own framing: 'detect-and-respond as the primary strategy is dead' (an opinion, not a finding). Barracuda's blog cites Railway's October incident and says at least nine AI developer platforms disclosed incidents in October; Chainstack (2026-11-03, via AI Weekly relaying The Hacker News) is another ARTEX-linked vendor breach outside the window. The Barracuda IOC list (IPs, user agents) exists on the Trust Center page and is deliberately not carried.

