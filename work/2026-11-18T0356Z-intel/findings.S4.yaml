    discovery_trace: "first seen at: databreaches-net feed page 2, URL https://databreaches.net/feed/?paged=2 (item 'Germany: Greiz Hospital Reopens Emergency Room After Ransom Attack', article body 403) → WebSearch ('Kreiskrankenhaus Greiz Ronneburg Notaufnahme IT Ausfall Hackerangriff Wiedereröffnung') → primary: Landkreis Greiz release, URL https://www.landkreis-greiz.de/aktuelles/news-detailseite/hacker-angriff-auf-kreiskrankenhaus-greiz-ronneburg (found via https://borncity.com/blog/2026/11/16/cyberangriff-auf-kreiskrankenhaus-greiz-ronneburg-nov-2026/) → dpa copies at kma-online and kurier.de."
    summary: |
      The district of Greiz said on 2026-11-15 that a hacker attack on the Kreiskrankenhaus Greiz-Ronneburg (256 beds per Borns IT blog) was found around 09:00 that Sunday; the state criminal police (LKA) and the prosecutor were informed and the emergency department in Greiz was unavailable, with 112 callers routed by the Gera dispatch centre to other hospitals. The district says patient safety was not at risk and scheduled appointments went ahead. On 2026-11-17 dpa reported that the emergency department was taking patients again, case by case in close coordination with the Gera dispatch centre and the local doctors, with emergency surgery and other treatments running and normal operation planned for later in the week. The spokesman declined to say what type of attack it was or whether a ransom was demanded (a matter for the LKA); several systems are affected. The ransomware framing comes only from Borns IT blog (a reader tip and a report of an extortion letter, not confirmed by the hospital or any authority) and from DataBreaches.net's headline. No actor, vector or data-theft statement exists in any source. The public-sector lesson is operational: a public district hospital's emergency department was off for roughly two days and the regional 112 dispatch centre carried the diversion, so dispatch-to-hospital capacity data and manual diversion procedures were the working continuity control.
