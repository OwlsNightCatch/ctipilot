      Delta only: the two-incident split with dates and the 'all accounts created before 2026-10-30' billing scope are new versus the 2026-11-09 bulletin; Uber (149,346 drivers, notified from 2026-11-10; Uber learned 2026-10-09) is a new downstream victim. Detection takeaway: customer-side alerting on a vendor environment is blind when the intruder uses the vendor's own internal identities, so vendor-side notification speed and contractual data-minimisation (Notion cites a zero-data-retention commitment that did not cover the exposed dataset) are the controls that matter.
