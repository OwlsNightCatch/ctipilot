    summary: |
      Fireworks AI, the inference platform whose exposed Cursor-issued key started the Cursor marketplace incident, published an update on 2026-11-17 that replaces its earlier single narrative with two separate incidents. First incident (2026-08-03 to 2026-10-07): an unauthorized party probed and then entered Fireworks systems with stolen Fireworks credentials and a vulnerability in one of its services, misused the platform and, for a small number of customers, accessed secrets, model files and datasets; Unit 42 has finished the forensics and Fireworks calls it contained. Second incident (2026-10-23 to 2026-10-30): an unauthorized party reached Fireworks development machines hosted at a third-party cloud provider that had itself suffered a security incident and used that to reach part of Fireworks's production systems, accessing account and billing information for all accounts created before 2026-10-30 and, for a small number of customers, datasets, models and secrets; a second forensic firm is still investigating. Fireworks had attributed the earlier activity to a financially motivated LLMjacking group (bulletin of 11-09). New downstream disclosure: Uber's letters of 2026-11-10 say a service provider told Uber on 2026-10-09 that its internal credentials had been compromised and used to access Uber's account with the provider, and that on 2026-10-13 Uber established its data connected to that provider was accessed; the data is names, driver's license numbers, dates of birth and addresses of 149,346 drivers (BleepingComputer, citing a Maine filing; TechCrunch cites an Oregon notice for the same number). TechCrunch identifies the provider as Fireworks (Uber's own letters do not name it) and quotes Uber that, because the attackers used Fireworks's own internal credentials, no alerts were triggered although Uber had alerting enabled for its Fireworks environment. Cursor and Notion earlier confirmed their own data was taken in the same chain (Notion: AI chat transcripts from the Insights feature in a small number of workspaces).
