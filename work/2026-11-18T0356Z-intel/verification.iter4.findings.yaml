  item: "2026-11-18/microsoft-agent-framework-pypi-credential-stealer-pth-hook (claim c005b94666)"
  url_or_quote: "SafeDep ... says ... that both were removed so that 1.26.0 is again the newest version ([SafeDep, 2026-11-18])"
  summary: "(low confidence) SafeDep says both versions are 'Malicious, removed from PyPI' and 'The last clean release is 1.26.0'; it never says 1.26.0 is the newest version. The fact is true (PyPI JSON for agent-framework, fetched this iteration, lists 1.26.0 as the only 1.26.x release) and the sourcing_note already names PyPI's listing. Fix: say 'both were removed and 1.26.0 is the last clean release', or cite PyPI for the newest-version clause."
