  - title: "BACS weekly review 46: phishing that uses the PHP vulnerability as a lure to harvest website-admin credentials, and personalised phishing carrying names, addresses and AHV numbers from an earlier Swiss data leak"
    sources:
      - { url: "https://www.bacs.admin.ch/de/26w46-de", publisher: "BACS (NCSC.ch)", date: "2026-11-17", role: "primary" }
    discovery_trace: "first seen at: ncsc-ch-focus, URL https://www.bacs.admin.ch/de/im-fokus (card dated 17 November 2026, 'Woche 46') -> primary (no pivot needed): https://www.bacs.admin.ch/de/26w46-de"
    summary: |
      In its weekly review of 17 November, BACS describes two observed campaigns. First, phishing mails that exploit the attention around the critical PHP flaws (BACS warning of 21 October): recipients are asked to follow a link to install supposed updates or read more, the link leads to a phishing page, and entered credentials let attackers log in to the administration tool of the victim's website and manipulate or fully take it over. Second, a Swiss company offering employment and administration services for household helpers announced a data leak on 7 October 2026 and warned the people affected; on 24 October targeted phishing mails in the company's name followed, carrying recipients' names, addresses and AHV numbers and asking for credit-card data including the security code. BACS adds that, given recent cases in which AHV numbers and other personal details were stolen, it expects such data to be used more often to make mails, SMS and calls look credible, and that correct personal details are no proof of authenticity. BACS gives no victim count and does not name the company or the PHP-lure sender infrastructure.
    region_nexus: "Switzerland: BACS observations from Swiss reports; the AHV-number remark follows recent Swiss leaks (the covered Publica / PK Softech incident is the public-sector case, the review does not name it)."
    primary_sector_nexus: "indirect (website operators and staff of public bodies whose AHV numbers sit in leaked pension-fund data; the review does not name public bodies)"
    sector: "public-sector"
    cves: []
    techniques: [T1566.002, T1078]
    affected_products: []
    entity_keys: ["tool:php2shell"]
    new_entities: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: "weekly-review item; the PHP-lure phishing against CMS admin credentials and the BACS expectation of AHV-number-laden phishing after the Swiss pension-fund leaks are the transferable, constituency-relevant parts; the rest is consumer fraud awareness"
    evidence:
      - quote: "Aktuell beobachtet das BACS Phishing-Kampagnen, die sich auf die bekannte PHP-Schwachstelle beziehen"
        attribution: "BACS (NCSC.ch)"
        source_url: "https://www.bacs.admin.ch/de/26w46-de"
      - quote: "Geben die Betroffenen dort ihre Zugangsdaten ein, können die Angreifer sich mit diesen Daten ins Administrations-Tool des Webauftritts einloggen und diesen manipulieren oder vollständig übernehmen."
        attribution: "BACS (NCSC.ch)"
        source_url: "https://www.bacs.admin.ch/de/26w46-de"
      - quote: "Die Nachrichten enthielten unter anderem die Namen, Adressen und AHV-Nummern der Empfängerinnen und Empfänger und wirkten dadurch besonders glaubwürdig."
        attribution: "BACS (NCSC.ch)"
        source_url: "https://www.bacs.admin.ch/de/26w46-de"
    extended_notes: |
      Detection concept: login events to CMS administration back ends from unfamiliar sources shortly after a staff member opened a mail that cites a PHP or CMS vulnerability; mail-flow rules for messages that invoke an urgent security update and link to a non-vendor domain. Hardening named by BACS: install updates only through the vendor's official channels or established administration processes, call services from the known address rather than a mailed link.
      Related covered entries: the PHP2Shell entries (BACS advisory of 21 October) and the Publica / PK Softech supplier intrusion (AHV numbers among the leaked data).

