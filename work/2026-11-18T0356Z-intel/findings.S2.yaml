  - title: "Danfoss AK-SM 800A: Midnight Blue's six pre-authentication stack-overflow flaws in the current firmware (up to 5.3.2) mean refrigeration controllers that were already patched stay exposed; BSI re-issued its warning on 17 November and the Belgian CCB says removing internet exposure comes first"
    sources:
      - { url: "https://www.bsi.bund.de/SharedDocs/Cybersicherheitswarnungen/DE/2026/2026-306525-1032.pdf?__blob=publicationFile&v=2", publisher: "BSI (BITS-H 2026-306525-11e2, version 1.1)", date: "2026-11-17", role: "primary" }
      - { url: "https://ccb.belgium.be/advisories/warning-six-new-danfoss-vulnerabilities-refrigeration-controllers-risk-immediate-action", publisher: "Centre for Cybersecurity Belgium", date: "2026-11-12", role: "primary" }
      - { url: "https://www.midnightblue.nl/blog/multiple-rce-danfoss-aksm800a", publisher: "Midnight Blue (discoverer)", date: "2026-11-11", role: "primary" }
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/13180", publisher: "NCSC.ch Cyber Security Hub", date: "2026-11-16", role: "corroborating" }
      - { url: "https://www.heise.de/en/news/Supermarket-attacks-Danfoss-controllers-remained-vulnerable-after-updates-11524473.html", publisher: "heise online", date: "2026-11-13", role: "corroborating" }
    discovery_trace: "first seen at: `ncsc-csh recent 25` (Security Hub post 13180, 2026-11-16, 'Danfoss AK-SM 800A: Multiple Pre-Authentication Remote Code Execution') -> pivot: Security Hub post, URL https://security-hub.ncsc.admin.ch/#/posts/13180 -> pivot: heise EN, URL https://www.heise.de/en/news/Supermarket-attacks-Danfoss-controllers-remained-vulnerable-after-updates-11524473.html -> primary: BSI warning v1.1 of 2026-11-17 read with `pdf`, URL https://www.bsi.bund.de/SharedDocs/Cybersicherheitswarnungen/DE/2026/2026-306525-1032.pdf?__blob=publicationFile&v=2 -> primary: CCB advisory, URL https://ccb.belgium.be/advisories/warning-six-new-danfoss-vulnerabilities-refrigeration-controllers-risk-immediate-action -> primary: Midnight Blue write-up, URL https://www.midnightblue.nl/blog/multiple-rce-danfoss-aksm800a"
    summary: |
      The existing entry on the October-November refrigeration attacks (Danfoss AK-SM and AK-SC, Copeland and Dixell XWEB; Swiss cases reported by SRF) tells readers to apply the vendor firmware that fixes the disclosed CVEs. Midnight Blue (as dated by BSI, 11 November) reports that within about an hour of manual review it found six pre-authentication remote code execution flaws (stack-based buffer overflows) in the latest AK-SM 800A firmware, 5.3.2, with CVE ids pending and disclosure to Danfoss under way; the CCB confirmed it on 12 November, noting that no patch existed then and that the research also finds a flaw in the session-control mechanism itself, so strict session mode does not remove the risk. Heise, reading Midnight Blue, says the device lacks stack canaries, PIE and Secure Boot, so takeover could give persistence (the CCB says possibly surviving a reset or firmware update) or leave the controller permanently inoperable; Midnight Blue advises prioritising removal of internet exposure over patching. BSI re-issued its warning on 17 November (version 1.1, criticality 2/yellow): Danfoss firmware up to at least 5.3.2 is affected, no CVE numbers were assigned yet, it lists the Copeland XWEB EVO findings of 13 November (14 flaws, exploitation attempts against CVE-2026-124014 and CVE-2026-124010; support ended in March 2026) and says even new patches are no guarantee against further flaws, so controllers should sit behind a VPN at minimum. The NCSC.ch hub post of 16 November says vendor firmware updates are available and points back to its earlier recommendations; heise reads BSI as treating only the update of 12 November (version 5.4.0) as not compromised, a version number that the BSI PDF text itself does not state and that the Danfoss advisory index fetched this run does not list, so the fixed build is unconfirmed here. BSI's overview sheet marks the overall threat as active exploitation (it covers the earlier attacks and the Copeland probes); no source reports exploitation of the six new Danfoss flaws, and BSI warns that the researchers' reports may give attackers enough detail to exploit them.
    region_nexus: "Switzerland and Europe: BACS advisory of 10 November and Security Hub advisory 13054 already cover Swiss refrigeration incidents; the Security Hub posted this development on 16 November. BSI reports a low three-digit number of exposed devices in Germany."
    primary_sector_nexus: "indirect (cold-chain and refrigeration at hospitals, blood services, food retail and public kitchens; the French blood service was hit in the earlier wave)"
