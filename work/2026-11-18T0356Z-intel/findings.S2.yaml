  - title: "Canton Zurich's cloud strategy (Regierungsrat decision 1155/2026): a four-level cloud model decides which information classes may sit in global, regulated, Swiss or cantonal clouds; secret factual data stays out of global and regulated clouds, the technical and organisational safeguards are still to be written"
