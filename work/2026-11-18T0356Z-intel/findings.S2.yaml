  - title: "Microsoft 365 global outage of 12 and 13 November: Microsoft's preliminary report blames a latent defect in a Windows-based internal process on its front-end gateway servers; Swiss institutions were affected and an Aargau parliamentarian asks the cantonal government about emergency plans"
    sources:
      - { url: "https://www.it-connect.fr/panne-microsoft-365-rapport-post-incident-bug-windows/", publisher: "IT-Connect (reading of Microsoft's preliminary report)", date: "2026-11-16", role: "primary" }
      - { url: "https://www.inside-it.ch/aargau-soll-nach-m365-ausfall-notfallplaene-pruefen-20261116", publisher: "Inside IT", date: "2026-11-16", role: "primary" }
    discovery_trace: "first seen at: it-connect, URL https://www.it-connect.fr/feed/ (feed item 'Microsoft 365 : un correctif Windows défectueux à l'origine de la panne mondiale', 16 Nov) -> read with `extract` on https://www.it-connect.fr/panne-microsoft-365-rapport-post-incident-bug-windows/ -> pivot: Swiss angle from inside-it-ch, URL https://www.inside-it.ch/aargau-soll-nach-m365-ausfall-notfallplaene-pruefen-20261116 (read with `url --direct`); WebSearch (Microsoft 365 outage 12 13 November 2026 post-incident report Windows update root cause) returned only secondary coverage and early network-upgrade explanations, Microsoft's report itself (a Word document in the admin center) is not publicly linkable"
    summary: |
      IT-Connect, reading Microsoft's preliminary post-incident report distributed through the Microsoft 365 admin center, says the outage ran from Thursday 12 November 17:20 to Friday 13 November 17:10 (French time), nearly 24 hours, that Microsoft first spoke of a network problem but the report points to a defect in an internal Windows process in a patch built for the front-end gateway servers, in service since July and not caught by load tests on weaker machines. The report's chain, as IT-Connect relays it: about 14 percent of gateway capacity was already down, Teams traffic was moved to the primary gateway that also serves Exchange Online at 02:07, load rose through the day, servers saturated, traffic redirection pushed the same defect onto the remaining servers, and within two hours more than 80 percent of the gateway servers stopped responding; recovery was slow because restarted servers were re-saturated, automatic recovery was not built for a near-total fleet failure and the months-old defect could not be rolled back quickly. Exchange Online was hit hardest, while Teams, OneDrive, SharePoint and Office apps could leave the failing gateway. Inside IT reports that the outage also affected Swiss companies and institutions and that Aargau Grossrat Lukas Huber (GLP) planned to file an interpellation on 17 November asking the Regierungsrat how cantonal administration, schools and courts were affected, how effective the emergency measures were, which state tasks could not be performed during a multi-day outage of central Microsoft services, and what improvements it will examine. No attack is reported; IT-Connect says the report is labelled preliminary and differs from the explanation given while the outage was running.
