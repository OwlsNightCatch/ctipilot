    extended_notes: |
      Delta against the covered entry: new unpatched pre-auth RCE class in the current AK-SM 800A firmware, strict session control shown insufficient, persistence and bricking risk, and BSI v1.1 (17 November). The previous run's changelog (15 November) cites neither Midnight Blue nor the CCB.
      Conflict to surface: CCB (12 November) says no patch available; the Security Hub (16 November) says vendor firmware updates are available; heise attributes a 5.4.0 build of 12 November to BSI. Danfoss's own advisory index, fetched this run, lists no November 2026 AK-SM 800A advisory.
      Exposure check (Midnight Blue, BSI): management web interface reachable from the internet, including through a 4G/5G modem (CCB: a modem alone is not a security measure). Hardening: VPN, private APN or highly restrictive IP allow-lists. Post-compromise: BSI says change all credentials and verify the connected refrigeration devices for correct operation; Midnight Blue and CCB warn of persistence that may survive a factory reset or firmware update.
