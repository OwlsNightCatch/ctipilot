      - { url: "https://calif.io/java4shell", publisher: "Calif (discoverer)", date: "2026-11-17", role: "primary" }
      - { url: "https://www.oracle.com/security-alerts/cspunov2026.html", publisher: "Oracle", date: "2026-11-17", role: "corroborating" }
      - { url: "https://www.heise.de/news/Java-RCE-mit-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA-11528561.html", publisher: "heise online", date: "2026-11-18", role: "corroborating" }
      - { url: "https://www.heise.de/news/Java4Shell-Gefaehrlicher-Bug-in-Java-11528499.html", publisher: "heise online", date: "2026-11-17", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-ch-focus, URL https://www.bacs.admin.ch/de/im-fokus (card dated 18 November 2026) -> primary: BACS warning page, URL https://www.bacs.admin.ch/de/warnung-java-de -> pivot: NCSC.ch Cyber Security Hub post 13198 via `ncsc-csh post 13198` (also seen in `ncsc-csh recent 25`), URL https://security-hub.ncsc.admin.ch/#/posts/13198 -> primary: OpenJDK advisory, URL https://openjdk.org/groups/vulnerability/advisories/2026-11-17 -> primary: discoverer write-up, URL https://calif.io/java4shell -> corroborating: Oracle CSPU URL https://www.oracle.com/security-alerts/cspunov2026.html and heise (heise-sec feed) URLs above"
    summary: |
      The OpenJDK advisory of 2026-11-17 lists CVE-2026-114938 (hotspot/compiler, CVSS 3.1 8.1) as affecting the 17, 21, 25 and 27 families up to 17.0.21.0.3, 21.0.13.0.3, 25.0.5.0.3 and 27.0.1.0.3; the same release fixes nine more OpenJDK CVEs (CVE-2026-114939 to CVE-2026-114947) and CVE-2026-86144 in OpenJFX, and Oracle's November Critical Security Patch Update carries the Java SE fixes. The discoverer, Calif, calls it Java4Shell and rates it CVSS 4.0 9.2: in the hand-written assembly Base64 decoder that uses AVX-512 VBMI instructions on supported x86-64 CPUs, a 65-character input (64 'A' plus '=', 128 'A' on older 17 builds) makes the routine compute a negative output length and write 62 bytes past a 50-byte array. Calif reports it demonstrated pre-authentication code execution in default configurations of Keycloak, Atlassian Jira and Confluence, JFrog Artifactory, Jenkins and PingFederate, authenticated code execution in Kafka broker, Solr, Elasticsearch, Gerrit and Spinnaker, and sample Struts and Spring Boot applications; a researcher also supplied a client-side path in which a Java program opening a TLS connection to a malicious server is compromised. There is no universal exploit: each target needs its own chain (Calif: depending on how Base64 is used 'different steps may be required'), and heise notes Calif published no proof-of-concept for Jira or Keycloak. The flaw needs an AVX-512 VBMI CPU (heise names Intel Ice Lake, Sapphire Rapids, Emerald Rapids and Granite Rapids and AMD Zen 4 and newer); the Swiss hub states ARM64 is not affected by this CVE. Exploitation in the wild is not reported (Cyber Security Hub: UNKNOWN; heise: none known). NCSC.ch/BACS issued a pre-announcement on 17 November and on 18 November a public warning that asks operators to prioritise internet-reachable applications, central login services and business-critical systems, restart Java processes after the update, rebuild containers and check that the running application really uses the fixed runtime, and notes that an update does not remove an existing compromise; its hub advisory carries the Oracle fixed builds (17.0.21.1, 21.0.13.1, 25.0.5.1, 27.0.1.1), the Calif-documented interim JVM options and the caveat that WAF rules are only partial protection. Calif also lists an Oracle Java 8 performance build, 8u511b33-perf, in the affected set (per the hub).
    region_nexus: "Switzerland: NCSC.ch/BACS public warning plus Security Hub advisory; BACS says banking software and other sector solutions may also be affected and that operators must clarify this with suppliers. No source names a Swiss deployment."
    primary_sector_nexus: "direct (BACS addresses operators and administrations; Keycloak, Jira, Confluence, Jenkins and Artifactory are the products BACS names; Swiss public-sector use is not stated by the sources)"
