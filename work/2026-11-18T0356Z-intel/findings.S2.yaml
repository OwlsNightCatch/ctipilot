        attribution: "BACS (NCSC.ch)"
        source_url: "https://www.bacs.admin.ch/de/warnung-java-de"
      - quote: "Ein Sicherheits-Update beseitigt keine bereits erfolgte Kompromittierung."
        attribution: "BACS (NCSC.ch)"
        source_url: "https://www.bacs.admin.ch/de/warnung-java-de"
      - quote: "The affected versions are 27.0.1.0.3, 25.0.5.0.3, 21.0.13.0.3, 17.0.21.0.3, 11.0.33, 8u512, and earlier."
        attribution: "OpenJDK Vulnerability Group"
        source_url: "https://openjdk.org/groups/vulnerability/advisories/2026-11-17"
      - quote: "To speed up Base64 decoding, OpenJDK uses specialized AVX-512 VBMI instructions on supported x86-64 processors."
        attribution: "Calif"
        source_url: "https://calif.io/java4shell"
      - quote: "A Java program that opens a TLS connection to a malicious server can be compromised, even if it exposes no service of its own."
        attribution: "Calif"
        source_url: "https://calif.io/java4shell"
      - quote: "The published research demonstrates exploitation; it does not establish malicious exploitation in operational environments."
        attribution: "NCSC.ch Cyber Security Hub"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/13198"
      - quote: "Bislang sind keine Java4Shell-Angriffe in freier Wildbahn bekannt geworden."
        attribution: "heise online"
        source_url: "https://www.heise.de/news/Java-RCE-mit-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA-11528561.html"
    extended_notes: |
      Exposure: the hub tells operators to record the Java distribution, the exact running build, the processor capabilities and the responsible supplier, to cover standalone runtimes, application-bundled Java, containers, appliances and externally managed services, and to check internal as well as public systems. Affected distributions named by the hub: Oracle Java SE, Oracle OpenJDK, Oracle GraalVM for JDK, Amazon Corretto, Eclipse Temurin, Microsoft Build of OpenJDK, Azul Zulu, BellSoft Liberica, SAP SapMachine, Red Hat OpenJDK; other vendors may use different build numbers.
      Interim measure (hub, citing Calif): start the JVM with -XX:-UseBASE64Intrinsics, or on x86-64 only -XX:UseAVX=2 (on ARM the second option can stop the JVM from starting); the hub states WAF rules or request buffering are not a complete mitigation (IONIX WAF examples for Cloudflare, AWS WAF and Akamai give partial protection).
      Detection concept: unexpected JVM crashes on internet-facing Java applications, unexpected child processes of the application server, and unusual authentication or administrative activity on identity, build and artefact platforms (BACS: ungewöhnliche Abstürze, unerwartete Prozesse und verdächtige Aktivitäten). Calif's published trigger shape is a Base64 field with a very long run of 'A' followed by '=' (real exploits will differ).
      Single-vendor caveat: the Oracle page carries a pre-release blanket statement (11 Java SE patches remotely exploitable without credentials) that BACS and the hub relay; OpenJDK's own CVSS 3.1 for CVE-2026-114938 is 8.1, Calif's CVSS 4.0 is 9.2.
      Deeper pivots on the named products' own advisories (Keycloak, Atlassian, Jenkins, JFrog, Ping) were not fetched; S1 owns the vendor-advisory sweep. Suggested Admiralty: reliability A, credibility 1.
    priority_hint: "high to critical for the constituency: pre-auth RCE chain demonstrated in identity, build and wiki platforms; patch exists; no exploitation reported yet"

