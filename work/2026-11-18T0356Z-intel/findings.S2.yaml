  - title: "Google Project Zero moves to a fixed 'Full X' disclosure policy: details published 90 days after the report from 13 November, 60 days from 2 February 2027 and 30 days from 3 January 2028, with no patch soak period, because attackers can derive exploits from a patch almost at once"
    sources:
      - { url: "https://projectzero.google/2026/11/disclosure-policy.html", publisher: "Google Project Zero", date: "2026-11-13", role: "primary" }
      - { url: "https://www.heise.de/news/Googles-Project-Zero-reduziert-Zeitraum-bis-zur-Veroeffentlichung-von-Luecken-11527956.html", publisher: "heise online", date: "2026-11-17", role: "corroborating" }
    discovery_trace: "first seen at: heise-sec, URL https://www.heise.de/security/feed.xml (item 'Googles Project Zero reduziert Zeitraum bis zur Veröffentlichung von Lücken', 17 Nov) -> read with `extract` on https://www.heise.de/news/Googles-Project-Zero-reduziert-Zeitraum-bis-zur-Veroeffentlichung-von-Luecken-11527956.html -> primary: Project Zero post, URL https://projectzero.google/2026/11/disclosure-policy.html"
    summary: |
      Project Zero's post of 13 November replaces its '90+30' policy (up to 90 days to fix plus 30 days of soak time for patch rollout) with 'Full X': vulnerabilities are disclosed X days after being reported to the vendor, 'Full 90' from that day, 'Full 60' on 2 February 2027 and 'Full 30' on 3 January 2028. Grace periods and the variant policy are removed; the exceptions are actively exploited flaws (handled under Google's application-security disclosure policy, which heise says allows 7 days), flaws already public, and vendor requests for earlier publication. Project Zero's reasoning, in its own words: LLMs have shortened the time attackers need to find and exploit flaws and to reverse a patch, so 'zero patch-to-exploitation time is a reasonable, though imperfect, model of attacker behavior', patch soak time is no longer meaningful, and vendors must reduce the patch gap between a fix being released and users installing it. For defenders the practical reading is that technical details of Project Zero-reported flaws will reach the public sooner and that the window between patch release and working exploits should be planned as near zero.
    region_nexus: "global; no Swiss nexus stated"
    primary_sector_nexus: "indirect (patch-SLA planning for any organisation running Google, Apple, Microsoft or open-source components that Project Zero reports against)"
    sector: "cross-sector"
    cves: []
    techniques: []
    affected_products: []
    entity_keys: []
    new_entities:
      - { key: "policy:project-zero-full-x-disclosure-policy-2026", type: policy, name: "Project Zero 'Full X' disclosure policy (November 2026)", aliases: ["Policy and Disclosure: 2026 Edition"], summary: "Google Project Zero policy announced 2026-11-13: disclosure X days after report, 90 now, 60 from 2027-02-02, 30 from 2028-01-03, no soak time or grace period (Project Zero)." }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    borderline: true
    borderline_reason: "global ecosystem policy, not Swiss or sector-specific; it changes how fast defenders should expect details of reported flaws to appear and so what patch SLAs make sense; S3 (research) may carry it; a decision for the main agent whether a policy change with no obligation counts"
    evidence:
      - quote: "Patch soak time is no longer meaningful in a world where attackers can almost immediately determine bug details from a patch, and can put users at risk by creating a false sense of secrecy."
        attribution: "Google Project Zero"
        source_url: "https://projectzero.google/2026/11/disclosure-policy.html"
      - quote: "zero patch-to-exploitation time is a reasonable, though imperfect, model of attacker behavior"
        attribution: "Google Project Zero"
        source_url: "https://projectzero.google/2026/11/disclosure-policy.html"
    extended_notes: |
      The 7-day figure for actively exploited vulnerabilities is heise's reading of Google's general policy page (not fetched here); Project Zero's post only says such flaws follow Google's application-security disclosure policy.

