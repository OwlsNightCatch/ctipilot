    summary: |
      The Zurich Regierungsrat fixed the canton's Cloud-Strategie on 28 October 2026 (RRB 1155/2026, published 5 November; Inside IT and Netzwoche reported it on 16 and 17 November). It sorts cloud services into four levels by the legal order that applies to provider and delivery: level 1 global cloud (providers or delivery subject to foreign law with possible extraterritorial access, where the strategy says adequate control and data-protection level cannot be guaranteed by legal means alone), level 2 regulated cloud (one legal order with data protection comparable to Switzerland's), level 3 Swiss cloud, level 4 cantonal cloud, plus 'no cloud'. A matrix maps information categories (public, internal, confidential and secret factual data; personal data; special categories of personal data) to the levels: per Netzwoche, global clouds are not excluded even for special-category personal data but with increased protection requirements, confidential data and special-category personal data carry increased requirements at all four levels, and for secret factual data global and regulated clouds are excluded (only Swiss or cantonal clouds or non-cloud solutions). The strategy is a long-term target picture, says some prerequisites are not yet met, ties itself to the new ICT ordinance of 21 October 2026 (IKTV) and leaves the 'normal' and 'increased' protection-level requirements to be worked out under its Basis impact area; Netzwoche notes the administration still has to specify the technical and organisational safeguards and that no concrete targets for reducing dependence on foreign providers are set. The cantonal IT office (AFI) is responsible, with one temporary full-time post from 1 January 2027 (CHF 175,000 a year).
