  - title: "Java4Shell (CVE-2026-114938): a memory-corruption flaw in OpenJDK's AVX-512 Base64 decoder gives pre-authentication code execution in Keycloak, Jira, Confluence, Artifactory, Jenkins and PingFederate; NCSC.ch/BACS warns and the 17 November Oracle and OpenJDK updates fix it together with ten other Java flaws"
    sources:
      - { url: "https://www.bacs.admin.ch/de/warnung-java-de", publisher: "BACS (NCSC.ch)", date: "2026-11-18", role: "primary" }
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/13198", publisher: "NCSC.ch Cyber Security Hub", date: "2026-11-17", role: "primary" }
