  - claim_id: 1bdc7daf69
    entry: 2026-11-18/cold-relic-stolen-pretext-cloud-identity-persistence
    surface: "summary"
    kind: frontmatter
    text: "Mandiant reports that COLD RELIC, the name Google Threat Intelligence Group now uses for the group formerly tracked as COLDRIVER and UNC4057 (Star Blizzard), reused the staff directory and identities stolen from one US organisation in late 2025 to impersonate a contact when approaching a second in 2026. In both cases it took over cloud identities through push-notification fatigue or Entra ID phishing and kept access with enrolled passkeys, MFA backup codes and rogue MFA devices that survived password and session resets, then exported whole tenants. GTIG names government officials, defense contractors and NGOs in Europe and North America as targets and says new phishing operations continued into November 2026."
  - claim_id: eb2b82da9b
    entry: 2026-11-18/cold-relic-stolen-pretext-cloud-identity-persistence
    surface: "actions[0]"
    kind: frontmatter
    text: "In every Google Workspace and Entra ID tenant you run, search the administrator and sign-in logs for passkey, backup-code and MFA-device enrolments on privileged accounts and for tenant-wide Customer Takeout exports, and when you remediate a compromised account revoke all sessions, refresh tokens and OAuth grants and remove every enrolled passkey, backup code and MFA device along with the password reset, because COLD RELIC's enrolled authenticators survived password and session resets."
  - claim_id: 245fccd70e
