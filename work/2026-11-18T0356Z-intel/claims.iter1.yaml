    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "summary"
    kind: frontmatter
    text: "CISA added CVE-2026-115731 to its Known Exploited Vulnerabilities catalog on 2026-11-17 on evidence of active exploitation it does not describe. A client holding any CA-signed agent certificate can run code on a Puppet Enterprise server as its service user by sending a crafted report, and where the CA autosigns requests without strong verification an unauthenticated attacker can first obtain that certificate; a trigger event has been public since 2026-11-03, and Puppet Enterprise 2023.8.13, 2025.12.1 and 2026.0.1 carry the fix."
  - claim_id: ca78844264
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every Puppet Enterprise server to 2023.8.13, 2025.12.1 or 2026.0.1 (OpenVox Server to 9.2.0 or 8.18.0; open-source Puppet gets no fix) and, until the upgrade is in, stop the CA from autosigning certificate requests without strong verification, because CISA lists the flaw as exploited and any holder of a CA-signed agent certificate reaches code execution on the server."
