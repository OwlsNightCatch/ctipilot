  - claim_id: 05d21de0b4
    entry: 2026-11-17/optimjack-poisoned-vendor-scripts-skimmer-iphone-router
    surface: "headline"
    kind: frontmatter
    text: "OptimJack: Optimizely confirms an exploited flaw behind poisoned scripts on 178 sites; iPhone kits, card skimmer"
  - claim_id: 7d0904d119
    entry: 2026-11-17/optimjack-poisoned-vendor-scripts-skimmer-iphone-router
    surface: "summary"
    kind: frontmatter
    text: "Optimizely says an unauthorized party exploited a vulnerability in its Experimentation product to add malicious JavaScript to some customer projects, and Report URI counts 178 organisations that served the code on 2026-11-16, among them a crypto clipper and card skimmer in the Optimizely files. Ohey reports that scripts served by Kissmetrics and StorifyMe gained a loader from 2026-11-13 that routes iPhones to the Coruna and DarkSword exploit-kit stages and that minute-ly's loader was replaced outright; Hudson Rock names 21 web properties, among them the University of Basel's StorifyMe widget, and calls the iPhone stages delivery observations, not confirmed compromises. How the Kissmetrics, StorifyMe and minute-ly files were altered is unknown."
  - claim_id: 55899d1f5d
    entry: 2026-11-17/optimjack-poisoned-vendor-scripts-skimmer-iphone-router
    surface: "actions[0]"
    kind: frontmatter
    text: "List every page of your organisation's sites, and of the agencies that build them, that has loaded Optimizely project JavaScript since 2026-11-16, or Kissmetrics i.js, a StorifyMe widget or the minute-ly loader since 2026-11-13, capture the bytes the browser receives and compare them with the provider's own project content (a search for the loader's host name misses the variant that hides it in base64), and where a file carries the injected loader remove it, keep the response bytes as evidence and treat the payment, login and form pages that loaded an affected Optimizely file as exposed to card and session theft."
  - claim_id: 8c0a69a1e2
