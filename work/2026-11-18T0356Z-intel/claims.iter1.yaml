    kind: cited
    text: "**Defender takeaway:** move administrators and exposed staff to FIDO2 or WebAuthn hardware keys, which GTIG says cannot be approved through fatigue or intercepted by reverse proxies, require existing-administrator or out-of-band approval for new MFA devices and passkeys, and write session and OAuth revocation into compromise playbooks ("
