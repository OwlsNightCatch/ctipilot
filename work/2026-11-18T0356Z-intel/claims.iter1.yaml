    surface: "section 2026-11-18T05:12:35Z"
    kind: cited
    text: "N-able released N-central 2026.4 Hotfix 3, build 2026.4.1.39, on 2026-11-16 as a critical security update that builds on and supersedes Hotfix 2; it fixes 17 further CVE ids, adds missing authentication and permission checks to server operations, hardens how Agents and Probes authenticate with the server, adds validation to file publishing, path and XML import handling, and permanently blocks the legacy APIs ("
