    kind: cited
    text: "**Detection:** child processes of the AWV service, new files in the component's upload paths and unauthenticated requests to conferencing endpoints that carry shell metacharacters or XML payloads, which follow from the command-injection, upload and XML-injection mechanisms the advisory names ("
    urls: ["https://www.mitel.com/support/security-advisories/mitel-product-security-advisory-misa-2026-0012"]
  - claim_id: b74f1d13fa
    entry: 2026-11-18/mitel-micollab-misa-2026-0012-awv-unauth-command-injection
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** apply the patch now; where that waits, restrict external access to the AWV component, the mitigation Mitel names ("
    urls: ["https://www.mitel.com/support/security-advisories/mitel-product-security-advisory-misa-2026-0012"]
  - claim_id: 50081db780
    entry: 2026-11-18/microsoft-agent-framework-pypi-credential-stealer-pth-hook
    surface: "headline"
    kind: frontmatter
    text: "Microsoft's agent-framework on PyPI carried a Python-startup credential stealer in 1.26.1 and 1.26.2; pin 1.26.0"
  - claim_id: 32307d7e7d
    entry: 2026-11-18/microsoft-agent-framework-pypi-credential-stealer-pth-hook
    surface: "summary"
    kind: frontmatter
    text: "Socket and SafeDep report that versions 1.26.1 and 1.26.2 of Microsoft's official agent-framework metapackage were published to PyPI on 2026-11-17, about 33 minutes apart, with a .pth file that runs a credential stealer whenever Python starts, so a pip install in a CI job is enough. It collects environment secrets and credential files and requests Azure managed-identity, Azure DevOps and, in 1.26.2, GitHub Actions OIDC tokens. Both versions were removed from PyPI and 1.26.0 is the last clean release; how the attacker obtained publishing access is not known."
  - claim_id: fb214373df
