  - claim_id: d8b18c2369
    entry: 2026-11-12/cve-2026-119618-apache-httpd-mod-http2-assign-headers-rce
    surface: "headline"
    kind: frontmatter
    text: "Apache httpd mod_http2 RCE: update to 2.4.71 or drop h2/h2c; Axis devices affected, no fix yet; Linux distros fixed"
  - claim_id: 64bc42e014
    entry: 2026-11-12/cve-2026-119618-apache-httpd-mod-http2-assign-headers-rce
    surface: "summary"
    kind: frontmatter
    text: "The Apache HTTP Server project released 2.4.71 on 2026-11-11 to fix CVE-2026-119618, a race in mod_http2 that it rates critical and says can lead to remote code execution in versions 2.4.55 through 2.4.70; Red Hat adds that it is unauthenticated, affects only servers with HTTP/2 enabled through the Protocols directive, and that public research has demonstrated a reliable exploit, while no source reports exploitation. Red Hat has fixed RHEL 9 and 10, Debian bookworm and trixie, Alpine and SUSE Linux Enterprise 15 SP7 ship 2.4.71 packages, Ubuntu has shipped backported fixes, while a researcher's public test reproduces crashes on 2.4.70 and, per Wordfence, does not show code execution. Axis says AXIS OS version 6.50.5.10 and higher is affected, has no fixed release yet and gives a workaround that turns off HTTP/2 on the device."
  - claim_id: 4d46a36276
    entry: 2026-11-12/cve-2026-119618-apache-httpd-mod-http2-assign-headers-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "On every internet-facing Apache HTTP Server that loads mod_http2, update to 2.4.71 or to your distribution's fixed package (Debian bookworm 2.4.71-1~deb12u1, trixie 2.4.71-1~deb13u1 or forky and sid 2.4.71-1, Ubuntu per USN-9090-1, Alpine 2.4.71-r0, RHEL 9 mod_http2 2.0.26-7.el9_9.1, RHEL 10 mod_http2 2.0.29-5.el10_3.1) and restart it; update SUSE Linux Enterprise 15 SP7 to apache2 2.4.71-150700.4.30.1; where no fixed package exists yet, as on the SUSE products still in progress, remove h2 and h2c from the Protocols directive until one does, because Red Hat reports an unauthenticated code-execution path and a public exploit, though it rates its RHEL 9 and 10 packages Important rather than Critical for their harder exploitation."
  - claim_id: c9a520f0ff
    entry: 2026-11-12/cve-2026-119618-apache-httpd-mod-http2-assign-headers-rce
    surface: "actions[1]"
    kind: frontmatter
    text: "On every Axis network device on AXIS OS version 6.50.5.10 or higher, set System.HTTP2.AllowH2 and System.HTTP2.AllowH2c to no through param.cgi now (Axis Device Manager mass-deploys it) and install the service release when Axis ships it, then revert the settings, because Axis says an unauthenticated attacker could gain administrator access and has released no fixed AXIS OS."
  - claim_id: 43a6ea6f93
    entry: 2026-11-12/cve-2026-119618-apache-httpd-mod-http2-assign-headers-rce
    surface: "cves[CVE-2026-119618]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-119618\", \"cvss\": \"9.8 (CVSS 3.1, Red Hat and SUSE; CISA ADP scores it 8.1 with high attack complexity; the Apache project publishes none)\", \"status\": [\"patch-available\", \"mitigation-only\"], \"affected\": \"Apache HTTP Server 2.4.55 through 2.4.70 with mod_http2 and HTTP/2 enabled; standalone mod_h2 2.0.8 through 2.0.42; AXIS OS version 6.50.5.10 and higher (Axis states CVSS 9.8)\", \"fixed\": \"Apache HTTP Server 2.4.71; Debian bookworm apache2 2.4.71-1~deb12u1, trixie 2.4.71-1~deb13u1 and forky and sid 2.4.71-1; Ubuntu per USN-9090-1 for 22.04 LTS to 26.10 and 20.04 LTS through ESM; Alpine 2.4.71-r0 (3.21 to 3.24); RHEL 9 mod_http2 2.0.26-7.el9_9.1 and RHEL 10 mod_http2 2.0.29-5.el10_3.1; SUSE Linux Enterprise 15 SP7 apache2 2.4.71-150700.4.30.1 (SUSE-SU-2026:5231-1), with further SUSE products per SUSE's CVE page; mod_h2 2.0.43 per the researcher's repository, none named by the project; AXIS OS none yet, a service release for all affected tracks is promised within a couple of weeks and a workaround sets System.HTTP2.AllowH2 and System.HTTP2.AllowH2c to no\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 86f2dc382e
    entry: 2026-11-12/cve-2026-119618-apache-httpd-mod-http2-assign-headers-rce
    surface: "body"
    kind: cited
    text: "Apache HTTP Server 2.4.71, released on 2026-11-11, fixes CVE-2026-119618, a race in mod_http2's assign_headers() that the project rates critical and says can lead to remote code execution, in versions 2.4.55 through 2.4.70 ("
    urls: ["https://httpd.apache.org/security/vulnerabilities_24.html"]
