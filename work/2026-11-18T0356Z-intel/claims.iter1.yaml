  - claim_id: ff91c63127
    entry: 2026-11-18/typo3-core-security-releases-2026-11-17-installer-chain
    surface: "summary"
    kind: frontmatter
    text: "TYPO3 published ten core advisories on 2026-11-17 for 10.0.0 to 14.3.11, fixed in 14.3.12 LTS, 13.4.40 LTS, 12.4.52 ELTS, 11.5.57 ELTS and 10.4.63 ELTS. The one rated Critical (SA-027) lets a file named FIRST_INSTALL placed in the web root re-enable the installer without authentication, which creates an administrator and leads to remote code execution, and SA-026 lets any low-privileged backend user create such a file. TYPO3 states that SA-029, a Medium information disclosure in the Form Framework that can become cross-site scripting through uploaded HTML, is known to be actively exploited, naming no actor or victim."
  - claim_id: dc0976ac63
    entry: 2026-11-18/typo3-core-security-releases-2026-11-17-installer-chain
    surface: "actions[0]"
    kind: frontmatter
    text: "Update every TYPO3 instance to 14.3.12, 13.4.40, 12.4.52 ELTS, 11.5.57 ELTS or 10.4.63 ELTS now, and on 14.x configure HTTP/allowed_hosts/dashboard_rss; until then check the public web root and the project root for unexpected files whose name starts with FIRST_INSTALL and the backend for administrator or system maintainer accounts nobody created, because a low-privileged backend user can re-enable the installer and TYPO3 states that one flaw in the same release is actively exploited."
