    entry: 2026-11-18/mitel-micollab-misa-2026-0012-awv-unauth-command-injection
    surface: "headline"
    kind: frontmatter
    text: "Mitel MiCollab: unauthenticated CVSS 10.0 command injection in the conferencing component; patch KB000129195"
  - claim_id: 7f28644dd0
    entry: 2026-11-18/mitel-micollab-misa-2026-0012-awv-unauth-command-injection
    surface: "summary"
    kind: frontmatter
    text: "Mitel's advisory MISA-2026-0012 of 2026-11-16 covers five flaws in the Audio, Web and Video Conferencing (AWV) component of MiCollab 10.3 (10.3.0.18) and earlier, led by an unauthenticated blind command injection scored CVSS 3.1 10.0 and an unauthenticated XML injection scored 9.0 that could run commands. CVE ids have been requested but not assigned, Mitel offers a patch through its portal (KB000129195) and says restricting external access to the AWV component reduces the risk, and neither Mitel nor any national authority states exploitation. The 10.3.0.18 release that Mitel named as the fix for its July advisory is itself in the affected range."
  - claim_id: 031a1e58d4
    entry: 2026-11-18/mitel-micollab-misa-2026-0012-awv-unauth-command-injection
    surface: "actions[0]"
    kind: frontmatter
    text: "Apply Mitel's patch KB000129195 to every MiCollab on 10.3 (10.3.0.18) or earlier, including systems already moved to 10.3.0.18 for the July advisory, and until it is in, restrict external access to the Audio, Web and Video Conferencing component, because Mitel scores one unauthenticated flaw CVSS 10.0 and says the five flaws together amplify the impact."
  - claim_id: c9256e764c
    entry: 2026-11-18/mitel-micollab-misa-2026-0012-awv-unauth-command-injection
    surface: "body"
    kind: cited
    text: "Mitel's advisory MISA-2026-0012, first issued on 2026-11-16, covers five flaws in the Audio, Web and Video Conferencing (AWV) component of MiCollab 10.3 (10.3.0.18) and earlier; Mitel tracks them by internal ids because the CVE identifiers it requested are not yet assigned ("
    urls: ["https://www.mitel.com/support/security-advisories/mitel-product-security-advisory-misa-2026-0012"]
  - claim_id: 5687d4f2e2
    entry: 2026-11-18/mitel-micollab-misa-2026-0012-awv-unauth-command-injection
    surface: "body"
    kind: cited
    text: "MTLVULN-1864 lets an unauthenticated attacker conduct a blind command injection through insufficient parameter sanitization and is scored CVSS 3.1 10.0 with changed scope; MTLVULN-1862 lets an unauthenticated attacker leverage pre-staged malicious content for an XML injection that could run arbitrary commands, scored 9.0 with high attack complexity ("
    urls: ["https://www.mitel.com/support/security-advisories/mitel-product-security-advisory-misa-2026-0012"]
  - claim_id: 4847e8f84f
    entry: 2026-11-18/mitel-micollab-misa-2026-0012-awv-unauth-command-injection
    surface: "body"
    kind: cited
    text: "Three further flaws are rated Medium: an unauthenticated arbitrary file upload through weak file-type validation (MTLVULN-1861, 5.3), unauthorized access that needs a system-generated random identifier or pre-staged content (MTLVULN-1863, 5.9) and an authentication bypass (MTLVULN-1877, 5.3) ("
    urls: ["https://www.mitel.com/support/security-advisories/mitel-product-security-advisory-misa-2026-0012"]
  - claim_id: 5775c0ca6c
    entry: 2026-11-18/mitel-micollab-misa-2026-0012-awv-unauth-command-injection
    surface: "body"
    kind: cited
    text: "Mitel says exploiting them together can significantly amplify their impact ("
    urls: ["https://www.mitel.com/support/security-advisories/mitel-product-security-advisory-misa-2026-0012"]
  - claim_id: 8ba980c6f4
    entry: 2026-11-18/mitel-micollab-misa-2026-0012-awv-unauth-command-injection
    surface: "body"
    kind: cited
    text: "The fix is a patch for release 10.3 (10.3.0.18), delivered through knowledge-base article KB000129195 on Mitel's customer portal, or an upgrade to a later release that Mitel does not name; Mitel's partners can supply it to customers without portal access ("
    urls: ["https://www.mitel.com/support/security-advisories/mitel-product-security-advisory-misa-2026-0012"]
  - claim_id: 93a5d40fb3
    entry: 2026-11-18/mitel-micollab-misa-2026-0012-awv-unauth-command-injection
    surface: "body"
    kind: cited
    text: "Mitel's July advisory named 10.3 (10.3.0.18) as the release that fixed its earlier AWV command injection, so a system moved there in July is inside the new affected range ("
    urls: ["https://www.mitel.com/support/security-advisories/mitel-product-security-advisory-misa-2026-0006"]
  - claim_id: a69dc36225
    entry: 2026-11-18/mitel-micollab-misa-2026-0012-awv-unauth-command-injection
    surface: "body"
    kind: cited
    text: "CERT-FR lists the advisory on 2026-11-17 and BSI rates it high, describing a remote anonymous attacker who can manipulate files, run code with the service's rights and bypass security measures ("
    urls: ["https://www.cert.cyber.gouv.fr/avis/CERTFR-2026-AVI-1547/", "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-4608"]
  - claim_id: 6a7a2511ef
    entry: 2026-11-18/mitel-micollab-misa-2026-0012-awv-unauth-command-injection
    surface: "body"
    kind: cited
    text: "**Exposure:** MiCollab 10.3 (10.3.0.18) and earlier whose AWV component external users can reach; Mitel assesses only supported versions and states no branch before 10.3 ("
    urls: ["https://www.mitel.com/support/security-advisories/mitel-product-security-advisory-misa-2026-0012"]
  - claim_id: 7709f46f75
    entry: 2026-11-18/mitel-micollab-misa-2026-0012-awv-unauth-command-injection
