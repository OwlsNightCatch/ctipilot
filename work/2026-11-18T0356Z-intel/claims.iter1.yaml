    surface: "actions[0]"
    kind: frontmatter
    text: "Search lockfiles, build caches and CI job logs for agent-framework 1.26.1 or 1.26.2 installed since 2026-11-17 20:35 UTC, and on every host or job that ran Python after installing either, treat the environment variables, local credential files, Azure managed-identity and Azure DevOps tokens and, for 1.26.2, GitHub Actions OIDC tokens as stolen and rotate them, then pin agent-framework to 1.26.0 or earlier."
