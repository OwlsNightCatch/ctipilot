    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "headline"
    kind: frontmatter
    text: "Java4Shell: OpenJDK Base64 heap overflow chained to pre-auth RCE in Jira and Keycloak; update Java, no attacks yet"
  - claim_id: 3f5b39d368
    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "summary"
    kind: frontmatter
    text: "Oracle's Critical Security Patch Update and the OpenJDK advisory of 2026-11-17 fix CVE-2026-114938, an out-of-bounds write in the AVX-512 Base64 decoder that Calif, its discoverer, scores CVSS 4.0 9.2 and says it turned into pre-authentication code execution in the default configurations of Keycloak, Jira, Confluence, Artifactory, Jenkins and PingFederate; Oracle scores it CVSS 3.1 8.1 with high attack complexity. Only x86-64 hosts with AVX-512 VBMI are affected, a trigger proof of concept is public, Calif withholds its product chains, and no source reports attacks. NCSC.ch and BACS warn operators to update internet-reachable Java applications and identity services first."
  - claim_id: 64799dbf9c
    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "On every x86-64 host with an AVX-512 VBMI processor that runs Java 17, 21, 25 or 27, update the JDK to 17.0.21.1, 21.0.13.1, 25.0.5.1 or 27.0.1.1 (Oracle builds; other distributions use their own build numbers) or 8u513-perf, then restart the Java processes and rebuild containers, internet-reachable applications and the identity, build and artifact servers Calif names (Keycloak, Jira, Confluence, Artifactory, Jenkins, PingFederate) first; where that waits, start the JVM with -XX:-UseBASE64Intrinsics, or with -XX:UseAVX=2 on x86-64 hosts only."
  - claim_id: 059235288e
    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "cves[CVE-2026-114938]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-114938\", \"cvss\": \"8.1\", \"status\": [\"poc-public\", \"patch-available\"], \"affected\": \"OpenJDK 17.0.6 and later, 21, 25 and 27 up to 17.0.21.0.3, 21.0.13.0.3, 25.0.5.0.3 and 27.0.1.0.3 on x86-64 with AVX-512 VBMI; Oracle Java SE 8u511b33-perf\", \"fixed\": \"Oracle builds 17.0.21.1, 21.0.13.1, 25.0.5.1, 27.0.1.1 and 8u513-perf\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: a33731800f
    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "body"
    kind: cited
    text: "Oracle's Critical Security Patch Update and the OpenJDK advisory of 2026-11-17 list CVE-2026-114938 in the hotspot compiler component, which Oracle rates CVSS 3.1 8.1 with high attack complexity ("
    urls: ["https://www.oracle.com/security-alerts/cspunov2026.html", "https://openjdk.org/groups/vulnerability/advisories/2026-11-17"]
  - claim_id: 13bdb713f0
    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "body"
    kind: cited
    text: "Calif, which found it, says HotSpot's x86-64 Base64 intrinsic, which uses AVX-512 VBMI instructions, calculates a negative output length for a short padded input and that length becomes a full 64-byte write that sends 62 bytes past the end of the array; only the landing position of the write is controllable, a misplaced write can crash the JVM and each target needs its own chain ("
    urls: ["https://calif.io/java4shell"]
  - claim_id: cd7aec42fd
    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "body"
    kind: cited
    text: "It scores the flaw CVSS 4.0 9.2 and reports pre-authentication code execution in the default configurations of Keycloak, Jira, Confluence, Artifactory, Jenkins and PingFederate, authenticated execution in several further server products, and a client-side path in which a Java program that opens a TLS connection to a malicious server is compromised ("
    urls: ["https://calif.io/java4shell"]
  - claim_id: c4f162a947
    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "body"
    kind: cited
    text: "Calif publishes a trigger proof of concept and withholds the product exploits ("
    urls: ["https://calif.io/java4shell"]
  - claim_id: 38b8f53334
    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "body"
    kind: cited
    text: "Upwind reproduced the overflow and says Basic-auth handling in Spring Security, Tomcat and Jetty 12, and Auth0's java-jwt, pass attacker-supplied tokens straight to the vulnerable decoder ("
