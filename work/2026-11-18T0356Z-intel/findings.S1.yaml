    summary: |
      Facts: Oracle's CSPU of 2026-11-17 and the OpenJDK advisory list CVE-2026-114938 (hotspot/compiler, CVSS 3.1 8.1 AV:N/AC:H/PR:N/UI:N, component Compiler, protocols Multiple) as affecting
      OpenJDK 17, 21, 25 and 27 and Oracle Java SE 8u511b33-perf, 17.0.21.0.3, 21.0.13.0.3, 25.0.5.0.3, 27.0.1.0.3 (plus GraalVM for JDK 17 and 21, GraalVM Enterprise 21.3.20.0.3); standard Java 8 and 11 are not
      listed. The discoverer (Calif, Quang Luong) names the bug Java4Shell and scores it 9.2 under CVSS 4.0. Root cause per Calif and Endor Labs: the hand-written AVX-512 VBMI assembly in HotSpot's Base64 decoder miscomputes the
      store mask for a padded tail; for a 65-character input (64 x A then =; 129 characters on 17.x because the vector path starts at 128 bytes) it writes 62 bytes past the 50-byte output array, after which Java throws
      IllegalArgumentException; the overwritten bytes are a constant, the attacker controls where, not what. Only x86-64 hosts with AVX-512 VBMI are affected (Intel Ice Lake, Sapphire Rapids, Emerald Rapids, Granite Rapids; AMD
      Zen 4 or newer); ARM64 is not. The vulnerable decoder shipped from OpenJDK 17.0.6 and is in all distributions built from OpenJDK (Corretto, Temurin, Microsoft Build, Zulu, Liberica, SapMachine, Red Hat, Oracle).
      Claims by Calif (discoverer, telemetry holder for its own tests): by remote heap grooming the overwrite becomes a heap leak ("JavaBleed") and code execution; pre-auth RCE was achieved in default configurations of Keycloak, Atlassian
      Jira, Atlassian Confluence, JFrog Artifactory, Jenkins and PingFederate, post-auth RCE in Kafka broker, Solr, Elasticsearch, Gerrit and Spinnaker, plus sample Struts and Spring Boot applications, and a Java client that opens TLS to a
      malicious server (credited to samczsun). Calif states there is no universal exploit (each target needs its own decoder route, writable buffer, readable feedback channel, heap layout) and that the weaponized per-product chains are being held
      back and will be published later; a bounded, self-contained trigger PoC (200,000 warm-up decodes, then the malformed input into a 4096-byte array) is public in the write-up. Exploitation status: NCSC-CH writes that the research demonstrates
      exploitation but does not establish malicious exploitation; Tenable and Endor Labs report no attacks in the wild as of 2026-11-17; CISA ADP SSVC at 2026-11-17 21:53Z is Exploitation none, Automatable no, Technical Impact total; CISA's alert does not
      say exploited. NCSC-NL rates probability medium (multiple prerequisites) and damage high.
      Fix: Oracle ships 17.0.21.1, 21.0.13.1, 25.0.5.1, 27.0.1.1 (NCSC-CH, JFrog) and Amazon Corretto 17.0.21.1.2; the upstream fix is JDK-8393212 ("Base64 optimization improvements", about four lines, in OpenJDK 27.0.1.1 and mainline; Endor Labs saw
      the jdk17u, jdk21u and jdk25u update repositories without it on 2026-11-17). Other distributions publish on their own schedules (Endor Labs: do not infer fixed builds from Oracle's numbering; verify the fix commit). Mitigation without patching:
      start the JVM with -XX:-UseBASE64Intrinsics or -XX:UseAVX=2 (x86-64 only; ARM JVMs refuse -XX:UseAVX=2 and fail to start); NCSC-CH and Calif state request buffering and WAF rules are not complete mitigations.
    region_nexus: "global; Java (Keycloak, Jenkins, Atlassian, Artifactory, PingFederate) is ubiquitous in Swiss federal, cantonal and communal identity, build and collaboration stacks; NCSC-CH published its own advisory the same day"
    primary_sector_nexus: "direct (shared runtime under identity, CI/CD and collaboration platforms the public sector runs)"
