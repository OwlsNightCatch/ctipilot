    summary: |
      TYPO3's Security Team published ten core advisories on 2026-11-17 (about 11:00 UTC, as pre-announced on 2026-11-16 with the sentence that one is critical and exploitable by low-privileged backend users). Affected in every case:
      10.0.0-10.4.62, 11.0.0-11.5.56, 12.0.0-12.4.51, 13.0.0-13.4.39, 14.0.0-14.3.11 (SA-034 only 14.0.0-14.3.11); fixed in 10.4.63 ELTS, 11.5.57 ELTS, 12.4.52 ELTS, 13.4.40 LTS, 14.3.12 LTS. TYPO3 Suggested CVSS values are 4.0 vectors, severity labels as published:
      SA-025 CVE-2026-119621 Import/Export (ext:impexp) path traversal, High: the file hash values of imported T3D or XML files are used unvalidated to build a temporary file path, so a crafted import file writes arbitrary content to any web-server-writable location (for example a PHP file in the public web root) and gives RCE; needs an administrator backend user, or a non-admin user for whom options.impexp.enableImportForNonAdminUser is set.
      SA-026 CVE-2026-119622 Backend missing authorization, High: the online-media endpoint (YouTube, Vimeo) accepts a target folder in the fallback storage (storage uid 0, the public web root), where file mount and permission checks are not applied, so any authenticated low-privileged backend user, even without file mounts or module access, can create online-media files with a partially controllable file name in the web root.
      SA-027 CVE-2026-119623 Installer (ext:install) missing authentication, Critical (CVSS 4.0 vector AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H, the same vector scored 9.4 in the Perforce CVE record above): placing a file whose name starts with FIRST_INSTALL in the public web root or project root re-enables the installer on a configured instance without authentication, allowing database-connection changes and creation of a new administrator and system maintainer account, hence RCE. With SA-026 the marker file can be created by that low-privileged backend user. Fixed versions keep the installer off via a new SYS/isInstalling setting and accept only the exact names FIRST_INSTALL and FIRST_INSTALL.txt. TYPO3 advises checking the web root and project root for unexpected FIRST_INSTALL* files and reviewing administrator and system-maintainer accounts for unknown entries.
      SA-028 CVE-2026-125159 Image processing, High: TYPO3 chooses the ImageMagick or GraphicsMagick coder from content-sniffed MIME type, so an MVG file uploaded with a .png extension is processed by the MVG coder, whose instructions read local files into the output image served publicly; needs a way to upload without a MIME check (for example SA-032, giving unauthenticated exploitation), ImageMagick, and a default policy that allows the MVG coder. After updating, formats outside the default raster list (psd, ppm) must be added to SYS/FileInfo/fileExtensionToMimeType.
      SA-029 CVE-2026-125160 Form Framework information disclosure, Medium (vector carries E:A): the raw storage error message (for example a too-long file name) discloses the unguessable upload sub-folder and temp path, letting an attacker derive the public URL of a file they uploaded; with an upload element that accepts browser-executable files (HTML) this becomes XSS where the web server does not apply TYPO3's recommended Content-Security-Policy to the upload folder. The advisory states "This vulnerability is known to be actively exploited"; no actor, victim count or telemetry is given.
      SA-032 CVE-2026-125163 Form Framework unrestricted upload, Medium: an empty allowedMimeTypes list was treated as unrestricted, so unauthenticated visitors can upload HTML or SVG to the (public by default) upload folder; after the update an empty list refuses uploads (breaking change, toggle security.form.allowUnrestrictedFileUploadMimeTypes restores the old behaviour, not recommended).
      Others: SA-030 CVE-2026-125161 open redirect (incomplete fix of SA-2026-009), Medium; SA-031 CVE-2026-125162 page-cache flooding DoS via an array cHash when FE/cacheHash/enforceValidation is off (default on only for new installs since v12), High; SA-033 CVE-2026-125164 eID=dumpFile token reuse lets unauthenticated visitors fetch file references or processed files with the same uid from non-public storage, Medium; SA-034 CVE-2026-125165 Dashboard RSS-widget SSRF to internal hosts and cloud metadata for backend users, 14.x only, Medium, and updating alone does not mitigate it (HTTP/allowed_hosts/dashboard_rss must be configured).
      No source states a public PoC. BSI rates the bundle kritisch; the TYPO3 pre-announcement text says one issue is "critical" and can be exploited by low-privileged backend users, which is SA-027 chained through SA-026.
