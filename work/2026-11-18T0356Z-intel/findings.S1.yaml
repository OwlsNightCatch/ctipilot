    summary: |
      Socket and SafeDep (independent detectors) report that Microsoft's official Python metapackage agent-framework was compromised on 2026-11-17: versions 1.26.1 and 1.26.2 ship a single wheel that installs a .pth file, so the stealer runs every time Python starts, without the package being imported (a pip install in a CI job is enough).
      1.26.1 routes through agent_framework_meta.pth to an appended initializer hook and _telemetry module; after it was removed, 1.26.2 shipped the same stealer under af_runtime_diag.pth with the legitimate initializer restored, and adds GitHub Actions OIDC token requests. The code forks and detaches, collects environment variables matching about 31 name substrings, up to 60 credential files (Azure CLI, pip, npm, git, Docker, Hugging Face, Azure DevOps agent credentials),
      up to 300 /proc/PID/environ files, and actively requests fresh Azure DevOps federation, Azure managed-identity and GitHub OIDC tokens, then POSTs a compressed, base64-encoded blob to a webhook.site endpoint. SafeDep flagged 1.26.1 22 minutes after publication and 1.26.2 4 minutes after upload; the package gets about 192,000 downloads a month, the number of installs of the bad versions is unknown, and how the attacker obtained publishing access is not known.
      SafeDep notes this is the second Microsoft PyPI package with rogue releases in six months (durabletask in May, stolen API token) but finds no link. Affected: only 1.26.1 and 1.26.2; remove them and rotate credentials in any environment that installed them. No Microsoft statement was read.
