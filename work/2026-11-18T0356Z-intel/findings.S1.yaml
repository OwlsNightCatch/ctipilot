      Detection concept: files named FIRST_INSTALL* (or similar) appearing in the web root or project root, and unexpected requests to /typo3/install.php or the installer entry; new administrator or system-maintainer accounts and changes to LocalConfiguration database settings; backend-user requests to the online-media add endpoint with a storage 0 target folder; uploads with image extensions whose content starts with MVG instructions; error responses from Form Framework upload elements that leak storage paths; web-server access logs for processed-image URLs that return non-image content.
