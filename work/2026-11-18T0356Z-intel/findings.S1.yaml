    extended_notes: |
      Exposure: version in the Puppet Enterprise console or `puppetserver --version`; the sink is the report endpoint on the Puppet Server (default port 8140) that every agent already talks to, so the
      precondition is a CA-signed agent certificate (any node the server already trusts, a stolen agent key, or autosign). Check `autosign` configuration (autosign.conf, policy-based or naive `*`) and whether
      CSR submission is reachable from untrusted networks.
      Detection concept: the puppetserver JVM (service user puppet) spawning a shell or any unusual child process during report processing; PUT /puppet/v3/report bodies whose resource_statuses events carry
      an `__ptype` that is not a standard Puppet event type (Object[{...}] definitions with RubyMethod annotations); a new or unexpected certificate signed by the CA (`puppetserver ca list --all`, CA signed/
      directory timestamps); agent certificates with names that extend or shorten real hostnames (CVE-2026-115732 pattern). Post-patch compromise check: because the CA key sits on the same host, rotate or audit
      the CA and re-issue if any unexplained signing or shell activity is found; patching does not revoke certificates already minted.
      Triage: legitimate agent reports carry only standard event structures; a report with an Object-type definition containing code annotations has no benign source. Autosign installations see CSRs from
      unknown hostnames routinely, so the discriminator is the report content, not the CSR.
      Perforce vendor page could not be read (Salesforce SPA returns only a loading shell on extract, jina reader pool exhausted, WebFetch); every Perforce statement above comes from the KEV, EUVD, Red Hat and
      OpenVox records. The CVE.org record (read through the CVE services JSON, not cited) adds that the fix bundles puppet-agent 8.22.2 or 9.1.3 and that the Puppet Server must be restarted to load it.
      Related: CISA KEV also lists, since 2026-11-10 to 2026-11-13, products already carrying borderline-drop dispositions (BroadWorks, Openwave, UnrealIRCd, GPUStack); no other KEV row dated 2026-11-17 or later.
    classification_suggestion: "A / credibility 1 for the KEV listing itself (CISA primary, ENISA corroborates the flag); the basis of the exploitation claim is not stated, so 'exploited' rests on CISA's assertion"
