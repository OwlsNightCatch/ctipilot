    discovery_trace: "first seen at: cisa-kev bridge `python3 tools/fetch_source.py cisa-kev` (catalogVersion 2026.11.17, CVE-2026-115731 dateAdded 2026-11-17) and work/<run-id>/kev-window.txt -> CISA alert URL https://www.cisa.gov/news-events/alerts/2026/11/17/cisa-adds-one-known-exploited-vulnerability-catalog (WebFetch) -> vendor advisory https://portal.perforce.com/s/cve/a91Qi000003IaHpIAK/report-deserialization-code-execution (Salesforce SPA, shell only on extract, jina and WebFetch; content taken from the KEV record, EUVD record and the OpenVox advisory) -> WebSearch (\"CVE-2026-115731 Puppet Server report deserialization code execution Perforce\") -> OpenVox GHSA https://github.com/OpenVoxProject/openvox/security/advisories/GHSA-ffr6-rwpm-p5wq -> Red Hat https://access.redhat.com/security/cve/CVE-2026-115731 -> ENISA EUVD https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-116495"
    summary: |
      Facts (Perforce CNA text carried by the KEV record, EUVD and Red Hat): the report-processing code of Puppet, as used by Puppet Server, deserializes
      untrusted data; a client holding any CA-signed agent certificate can execute arbitrary code on the Puppet Server as its service user by sending a PUT
      request carrying a report with a crafted rich-data type, and where the CA autosigns requests without strong verification an unauthenticated network
      attacker can first obtain such a certificate. CWE-502 and CWE-94; CVSS 4.0 9.4 (AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H), Red Hat and NVD
      score 9.9 under CVSS 3.1 (Scope:Changed). Affected per the CNA record (as read through EUVD and SmartScope): Puppet Enterprise 2023.8.0 up to before 2023.8.13,
      2025.0.0 up to before 2025.12.1, 2026.0.0 up to before 2026.0.1; fixed in 2023.8.13, 2025.12.1 and 2026.0.1. The OpenVox fork is affected too (OpenVox Server 9.1.0 and
      earlier or 8.17.0 and earlier, fixed 9.2.0 and 8.18.0; OpenVox Agent 9.2.0 and earlier or 8.31.1 and earlier, fixed 9.3.0 and 8.32.0).
      Mechanism per the OpenVox advisory: agents report events through PUT /puppet/v3/report; the JSON event reaches Puppet::Pops::Serialization::FromDataConverter.convert,
      which resolves the attacker-chosen __ptype and ends in RubyGenerator create_class and cls.class_eval, giving code execution at compile or evaluation time on the server.
      The advisory ships a complete malicious report (a Notify resource whose event carries a crafted Object type) and notes that code execution as the puppet user
      gives access to the CA signing key, so an attacker can mint certificates with serverAuth and clientAuth and, where orchestration is configured, reach other hosts.
      Exploitation status: CISA lists it in KEV (added 2026-11-17, due date 2026-12-01 for federal agencies, ransomware use Unknown) and states the listing is
      based on evidence of active exploitation; ENISA EUVD carries exploitedSince 2026-11-17. No source read names an actor, victim, campaign or telemetry behind that
      claim, and CISA ADP SSVC records Exploitation active, Automatable no, Technical Impact total. The OpenVox advisory (2026-11-03) has carried the working report since
      disclosure, so a public PoC predates the KEV listing by 14 days. Daily Security Review wrote on 2026-11-04 that no exploitation had been confirmed.
      Not covered by the KEV row: the companion CVE-2026-115732 (CVSS 4.0 9.0, certificate-name matching in trapperkeeper-authorization lets a certificate whose name extends or
      shortens an authorized hostname be authorized as that host; in Puppet Enterprise it reaches CA administration and remote command execution on managed nodes); it is not
      in KEV as of catalogVersion 2026.11.17 and no exploitation is stated for it. EPSS 0.00366 (FIRST, 2026-11-17).
    region_nexus: "global; Puppet Server runs the configuration-management plane of Linux and mixed fleets in public-sector data centres (assessment, no source in this run names Swiss users)"
