  reason: CISA-confirmed exploitation of a management-plane RCE with a public payload; precondition of a CA-signed agent certificate limits reach unless autosign is on; not critical because no actor, victim
    or scanning evidence
- item: 2
  short: Apache Roller CVE-2026-129448
  priority_suggestion: routine or drop
  reason: CNA-stated exploitation but niche product
- item: 3
  short: Java4Shell CVE-2026-114938
  priority_suggestion: high; escalate to critical if the withheld weaponized chains are published or exploitation is reported
  reason: public trigger PoC, pre-auth RCE demonstrated in six products common in public-sector identity and CI/CD estates, fixes and a flag available, CISA and NCSC-CH alerts, no ITW yet; hardware precondition
    (AVX-512 VBMI) narrows exposure
- item: 4
  short: Drupal core PSA-2026-11-16
  priority_suggestion: high (time-boxed heads-up; update the entry after 2026-11-18 21:00 UTC)
  reason: anonymous-exploitable critical flaw with proof-of-concept rating and a stated hours-to-days exploit timeline on a core public-sector CMS
- item: 5
