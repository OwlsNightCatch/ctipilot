      - quote: "Exploitability is reported to depend on the host CPU supporting AVX-512 VBMI"
        attribution: "Red Hat Product Security"
        source_url: "https://access.redhat.com/security/cve/CVE-2026-114938"
    extended_notes: |
      Exposure: the host must be x86-64 with avx512f, avx512bw, avx512vbmi and bmi2 flags (Linux: grep the cpuinfo flags line); the JVM must be 17.0.6+, 21, 25 or 27 and the Base64 intrinsic live (UseAVX above 2 and UseBASE64Intrinsics true, check with the same JDK and
      options as the service; the stub is used after the decoder is hot). Bundled JREs inside appliances, containers and vendor products count; ARM64 and older CPUs do not. Exploit reach needs an application path that passes attacker-controlled Base64 to
      java.util.Base64 decoder (authentication headers, file uploads, tokens, TLS client side).
      Detection concept (Endor Labs, Calif; behaviour only): request fields ending in = or == whose length is not a multiple of 4, as short as 65 characters on 21/25/27 and 129 on 17; bursts of IllegalArgumentException from java.util.Base64 in request handlers; high-rate paced decode traffic from
      one source (heap grooming); oversized or binary-looking responses from endpoints that echo decoded input (JavaBleed channel); repeated hs_err crashes with SIGSEGV in a GC copy routine and a compiled Base64$Decoder.decode0 frame; unexpected child processes
      of JVMs (shell, curl) and rogue runtimes (CISA). Post-patch: updating does not remove an existing compromise (NCSC-CH); review JVM crashes, new admin accounts or webshell-like files on the six named products since 2026-11-17.
      Hardening: restart every JVM after the update and verify the running build, rebuild containers, take the vendor's fixed build per distribution; interim -XX:-UseBASE64Intrinsics or -XX:UseAVX=2.
      Time sensitivity: weaponized chains for Keycloak, Jira, Confluence, Artifactory, Jenkins and PingFederate are stated to exist and to be published later; treat the public trigger plus six named pre-auth targets as imminent-exploitation profile.
      Related same-day entries: the Oracle CSPU item below carries the other ten Java SE rows (all CVSS 7.5 or lower).
    classification_suggestion: "A (OpenJDK/Oracle/CISA/NCSC-CH primaries) / credibility 2 for RCE-in-products (discoverer claim, no independent reproduction named), 1 for the flaw and fixes"
