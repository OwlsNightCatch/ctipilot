      Take Control audit-log tampering without authentication (-129278); user enumeration (-129279); view-only users can set DeviceExecute configuration (-129281); sendmail argument injection (-129282); custom-service-import XXE (-129283); Report Manager and Data Export SSRF (-129284); XMPP action response origin validation (-129285); SIS GenericFiles path traversal leading to RCE (-129286); SIS repository parser XXE (-129287).
