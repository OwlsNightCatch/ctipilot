coverage_gaps:
- source_id: perforce-portal
  reason: 'portal.perforce.com CVE page (CVE-2026-115731) is a Salesforce SPA; extract returned the page chrome, WebFetch and the jina reader returned only "Loading / CSS Error" (jina key pool: ten keys
    answered HTTP 402). Content taken from the KEV, EUVD, Red Hat and OpenVox records instead.'
- source_id: juniper-support-portal
  reason: supportportal.juniper.net bulletin JSA119568 is the same Salesforce SPA shell on extract and WebFetch; CERT-FR relay used.
- source_id: asus-security-advisory
  reason: https://www.asus.com/security-advisory/ fetched with extract and url --direct but the Control Center section did not render; fixed versions unknown.
- source_id: drupal-org
  reason: 'extract of https://www.drupal.org/psa-2026-11-16 returns a Fastly client-challenge page; WebFetch reads it. Recipe note: use WebFetch for drupal.org (security listing and PSA).'
- source_id: msrc-update-guide
  reason: 'recipe change: `url --direct` and `msrc recent`/`msrc release` are 403 or uninformative for revised CVEs; the working read is the Python helper `fetch_source._msrc_fetch_strict_json` with `$filter=latestRevisionDate
    ge <ISO> and isMariner eq false`, `$orderby=latestRevisionDate desc`, `$top=100`, paged with `$skip`, and NO `$select` (a `$select` clause returned HTTP 403).'
- source_id: calif-io
  reason: 'recipe note: `extract` of https://calif.io/java4shell/ returns only the blog-style summary; the technical write-up (Limitations, PoC, Affected products, Recommendations) is in the raw HTML (`url
    --direct`, strip tags). Calif is in sources.json as calif-codex (blog.calif.io) but the PHP2Shell and Java4Shell write-ups live on calif.io.'
- source_id: oss-security
  reason: 'recipe note: message numbers in the day index (https://www.openwall.com/lists/oss-security/2026/11/17/) are the ordinal in listing order; the extract of the index prints them as relative links,
    so /N was derived from list position and then verified by content (/5 Roller, /14 Mosquitto, /31 Java4Shell).'
recipe_notes:
- 'ncsc-ch-security-hub: `ncsc-csh recent 25` post 13198 was created 2026-11-17 11:53Z as the Oracle CSPU pre-release advisory and edited three times into the Java4Shell advisory; the `history[].reason`
  strings show the edits and `content` holds the newest update first.'
- 'cisa-advisories: WebFetch of https://www.cisa.gov/news-events/cybersecurity-advisories returned 10 of 20 requested rows with titles, dates and hrefs; `cisa csaf-recent` output is long (25 items) and
  the changes.csv at raw.githubusercontent.com/cisagov/CSAF can be read with fetch_source.fetch for titles and CVEs of every ICSA released on a date.'
- 'bsi-de: `bsi-rss` returns RSS XML (not JSON); filter [NEU] with hoch, kritisch or UNGEPATCHT, then `bsi-csaf WID-SEC-2026-NNNN` for CVEs and vendor references.'
- 'anssi-fr: `cert-fr avis-recent 25` lists CERTFR-2026-AVI items; extract of each avis returns risks, affected versions and the vendor bulletin links.'
