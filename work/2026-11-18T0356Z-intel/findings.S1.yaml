    discovery_trace: "first seen at: oss-security index https://www.openwall.com/lists/oss-security/2026/11/17/ (fetched while following the Java4Shell post) -> primary: https://www.openwall.com/lists/oss-security/2026/11/17/5 (Apache announcement) -> https://lists.apache.org/thread/cc0jck13nb9vvcmzxzwotr6n16mx28z9 (earlier CVE-2026-82384 thread, read through the jina reader)"
    summary: |
      The Apache Roller project announced on 2026-11-17 CVE-2026-129448 (CVSS 3.1 9.8): the XML-RPC endpoint accepts vendor extension types and deserializes them before authenticating the
      requester, so an unauthenticated remote attacker can execute code. The announcement lists 4.0.0 before 6.1.5 as affected (text: 4.0.0 through 6.1.4) and says this is the same
      vulnerability as CVE-2026-82384, which had listed only 6.1.5 as affected, so 6.1.5 is vulnerable as well; it states "This issue is being actively exploited." Fixed in Roller 6.1.6 or later, which disables the extension types and
      rejects XML-RPC requests when the feature is off. Workaround: set enabledForExtensions to false in WEB-INF/web.xml or remove the /roller-services/xmlrpc servlet mapping and restart; switching XML-RPC off
      in the administration UI does not help because older versions deserialize the request before checking that setting. Single-source claim: no sponsor of the exploitation statement (who saw it, how many victims) is
      given, and CISA ADP SSVC on the CVE record shows Exploitation none at 2026-11-17 11:26Z; not in KEV.
    region_nexus: "global; Apache Roller is a niche multi-user blog server, no source ties it to Swiss public-sector use"
