      MTLVULN-1864 blind command injection from insufficient parameter sanitization, unauthenticated, CVSS 3.1 10.0 (AV:N/AC:L/PR:N/UI:N/S:C/C:N/I:H/A:H); MTLVULN-1862 XML injection that lets an unauthenticated attacker leverage pre-staged malicious content to execute commands, 9.0 (AV:N/AC:H, S:C);
