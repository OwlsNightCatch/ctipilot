  - quote: Reports call it remote code execution, but the decoder, not the attacker, chooses the bytes written, and the realistic outcome is a JVM crash.
    attribution: Equixly
    source_url: https://equixly.com/blog/2026/11/17/cve-2026-114938-pre-auth-heap-overflow-in-java-17-21-and-25/
  - quote: This Critical Security Patch Update contains 11 new security patches for Oracle Java SE.
    attribution: Oracle
    source_url: https://www.oracle.com/security-alerts/cspunov2026.html
  extended_notes: 'Exposure check (vendor-documented): on Linux `grep -c avx512vbmi /proc/cpuinfo` greater than 0 identifies hosts with the instruction set (Equixly); inventory JVM versions including bundled JDKs and container base images; prioritise internet-facing services that Base64-decode client input with java.util.Base64 basic or URL decoders (the MIME decoder and libraries with their own decoders such as Jackson, JJWT, Nimbus and Commons Codec are reported not to use the intrinsic). The intrinsic only takes over after JIT compilation, which on a busy server happens within seconds.

    Detection (telemetry classes): JVM crash logs and unexpected restarts of Java services on AVX-512 hosts, web and API access logs with malformed Base64 in request fields (Talos ships network signatures for this), application-server parent processes spawning shells (post-exploitation if RCE is real).

    Discrepancy to carry: Oracle''s own matrix rates it 8.1 with high attack complexity while Talos quotes CVSS 4.0 9.2; Talos and Calif.io frame RCE while Equixly and Upwind (source readers, no reproduction on AVX-512 hardware reported) expect a crash. The fixed-build list above comes from THN''s reading of ops.java and is marked unconfirmed; check Oracle''s release notes before quoting fixed versions.'
  borderline: true
  borderline_reason: S1-domain vulnerability returned as a cross-domain lead; impact (RCE vs crash) is contested, no exploitation, PoC or CVE record yet. Included because Java is ubiquitous and the item is critical-class if RCE is confirmed.
- title: 'Microsoft research: device-code phishing against GitHub Copilot CLI could let an attacker steer an enabled remote session, plant memory entries, read synced sessions and reach private repositories after one approved code (lab proof of concept, not seen in the wild)'
  sources:
  - url: https://www.microsoft.com/en-us/security/blog/2026/11/17/the-risks-of-device-code-authentication-for-ai-coding-agents/
    publisher: Microsoft Security Research
    date: '2026-11-17'
    role: primary
  discovery_trace: 'first seen at: Standing majors check, Microsoft Security blog via `msft-secblog recent 12 threat-intelligence` (2026-11-17 15:00Z) -> primary (no pivot needed): https://www.microsoft.com/en-us/security/blog/2026/11/17/the-risks-of-device-code-authentication-for-ai-coding-agents/'
  summary: Microsoft Security Research (2026-11-17) demonstrates in a controlled lab that an attacker who starts an OAuth device-flow request with the public GitHub Copilot CLI client and persuades a user to approve the code on github.com's genuine verification page can, within the account's permissions and the organisation's policy, steer an active Copilot CLI session that has remote control enabled (running commands on the user's machine subject to local approval prompts), add misleading entries to Copilot Memory, read cloud-synced CLI sessions and access private repositories through the repo scope the attacker chose. Microsoft stresses these are proof-of-concept results of features working as designed, not observed in the wild or in the EvilTokens, Storm-2372 or April 2026 campaigns it cites; the technique applies to any public client that supports the device flow. Microsoft names two Defender XDR detections that correlate email or Teams lures with GitHub OAuth token creation (requires the GitHub Enterprise Cloud connector in Defender for Cloud Apps) and a disruption action for GitHub Enterprise Managed Users.
  region_nexus: global; relevant only to public-sector developers using GitHub Copilot CLI with remote control or cloud session sync enabled
  primary_sector_nexus: indirect
  sector: technology
  cves: []
  techniques:
  - T1528
  - T1566.002
  - T1078.004
  affected_products:
  - GitHub Copilot CLI
  - GitHub
  entity_keys:
  - product:github-copilot
  new_entities: []
  relation_suggestions: []
  verification: SINGLE-SOURCE-OTHER
  single_source_name: Microsoft Security Research (first-party lab research)
  confidence: HIGH
  classification_hint: B2
  novelty: new
  evidence:
  - quote: These are proof-of-concept results showing how existing features, working as designed, could be abused after a phished authorization; they are not attacks we have observed in the wild.
    attribution: Microsoft Security Research
    source_url: https://www.microsoft.com/en-us/security/blog/2026/11/17/the-risks-of-device-code-authentication-for-ai-coding-agents/
  - quote: any public client that supports the device flow can be abused the same way, and the attacker chooses the requested scopes when starting the flow.
    attribution: Microsoft Security Research
    source_url: https://www.microsoft.com/en-us/security/blog/2026/11/17/the-risks-of-device-code-authentication-for-ai-coding-agents/
  extended_notes: 'Hardening levers Microsoft names: GitHub''s ''Store local sessions in the Cloud'' policy and remote-control setting (least permissive that fits the workflow), Copilot Memory administration (disabling memory does not delete stored entries), reviewing and revoking authorised OAuth applications, repository roles that limit blast radius, Safe Links for email and Teams, and the user rule ''enter a device code only for a sign-in you initiated''. Detection concept: GitHub audit or Defender for Cloud Apps events for OAuth token creation or regeneration for the Copilot CLI client shortly after an email or Teams message with a short code and the github.com/login/device link; device-flow authorisations from a client or IP the user did not start. Why borderline: lab PoC with no in-the-wild activity, and the store already carries M365 device-code phishing entries (Vaud, Huntress Teams-booking kit); the new part is the agent-session abuse surface.'
  borderline: true
  borderline_reason: Lab proof of concept, explicitly not observed in the wild; adds the coding-agent abuse surface to device-code phishing already covered in the store.
- title: 'Enea: SilentAir, a newly identified state-level actor, runs SS7 and Diameter attacks from compromised operator nodes to intercept SMS and calls (including 2FA codes), and LIMINAL PANDA''s GTPDoor v3 now hides in GTP-U, which 5G also uses'
  sources:
  - url: https://www.enea.com/insights/the-enemy-within-tracking-liminal-panda-and-silentair-through-mobile-networks/
    publisher: Enea Threat Intelligence Unit
    date: '2026-11-11'
    role: primary
  - url: https://securityaffairs.com/203099/apt/silentair-and-liminal-panda-target-telecom-networks-to-spy-on-subscribers.html
    publisher: Security Affairs
    date: '2026-11-16'
    role: corroborating
  discovery_trace: 'first seen at: risky-biz-news feed https://news.risky.biz/rss/ (Risky Bulletin 2026-11-13 ''Chinese APT uses SS7, Diameter attacks to spy on targets'', https://news.risky.biz/risky-bulletin-chinese-apt-uses-ss7-diameter-attacks-to-spy-on-targets/) and hackernews feed (2026-11-13 ''SilentAir Hijacks Asian Telecom Networks'', https://thehackernews.com/2026/11/silentair-hijacks-asian-telecom.html) -> pivot: securityaffairs feed page 2 https://securityaffairs.com/203099/apt/silentair-and-liminal-panda-target-telecom-networks-to-spy-on-subscribers.html -> primary: https://www.enea.com/insights/the-enemy-within-tracking-liminal-panda-and-silentair-through-mobile-networks/'
  summary: 'Enea (2026-11-11, key takeaways added 2026-11-12), a telecom-security vendor with GTP and signalling firewalls at operators, reports two actors inside mobile networks. LIMINAL PANDA (CrowdStrike-tracked; Palo Alto''s CL-STA-0969 overlaps) continues to use the GTPDoor implant: Enea saw several hundred attempted covert GTP-C sessions blocked at customers since Q1 2026, suspects 5 to 10 infected operators and perhaps several dozen worldwide, mostly in Asia, Africa and Latin America, and found a new GTPDoor v3 that hides in GTP-U (also carried on 5G); Enea says GTP-U traffic is far larger in volume and harder to inspect than GTP-C, which makes covert traffic easier to hide. SilentAir, which Enea assesses with high confidence to be a state-level actor and with low confidence China-nexus (Taiwan focus, UTC+8 hours), launches SS7 and Diameter location-update attacks from compromised nodes in at least six Asian countries to redirect a target''s calls and texts through an operator-controlled node; for some targets 2FA codes arrived right after interception. Enea says targets also included European subscribers at times, and that it could not confirm a link between the two actors.'
  region_nexus: Asia, Africa, Latin America operators; Taiwan primary target; European subscribers targeted 'at times'; POST Luxembourg reported a GTPDoor detection in July 2026; no Swiss case reported
  primary_sector_nexus: 'indirect: telecom operators are not in the constituency; the exposure for public bodies is SMS-based 2FA and voice for officials'
  sector: telecommunications
  cves: []
  techniques:
  - T1557
  - T1111
  - T1071
  - T1205
  - T1090
  affected_products: []
  entity_keys: []
  new_entities:
  - key: actor:silentair
    type: actor
    name: SilentAir
    aliases: []
    summary: Enea's name for a state-level actor that compromises mobile network operators, mostly in Asia, and launches SS7 and Diameter interception and location attacks against subscribers, primarily Taiwanese; Enea assesses with low confidence a China nexus (Enea, 2026-11-11).
  - key: actor:liminal-panda
    type: actor
    name: LIMINAL PANDA
    aliases:
    - CL-STA-0969
    summary: Telecom-targeting actor tracked by CrowdStrike (low-confidence China nexus) that Enea says is still active in 2026 with a new GTPDoor v3 hiding in GTP-U (Enea, 2026-11-11). Alias CL-STA-0969 per Palo Alto overlap as described by Enea.
  relation_suggestions:
  - subject: actor:silentair
    object: actor:liminal-panda
    basis: 'Enea: ''Links between the two are possible but unconfirmed'' (timing overlap in the same operators and matching targeting, but different tooling and working hours)'
  verification: SINGLE-SOURCE-OTHER
  single_source_name: Enea Threat Intelligence Unit (vendor telemetry from its own GTP and signalling firewalls); Security Affairs and The Hacker News relay it
  confidence: MEDIUM
  classification_hint: B2
  novelty: new
  lookback: true
  evidence:
  - quote: Enea observed intercepted two-factor authentication codes immediately after interception for some targets, suggesting attempts to access other accounts.
    attribution: Enea
    source_url: https://www.enea.com/insights/the-enemy-within-tracking-liminal-panda-and-silentair-through-mobile-networks/
  extended_notes: 'Defender relevance for a public-sector SOC is narrow: SMS and voice are interceptable at the signalling layer by state actors, so SMS one-time codes are not an acceptable second factor for officials, VIPs and administrators; phishing-resistant authenticators remove the exposure. Operator-side detection (GTP-C/GTP-U firewalls sharing intelligence with SS7 and Diameter screening, monitoring of internal network traffic, treating IPX as untrusted) is relevant to the Swiss telecom supply chain, not to the constituency''s own estate. Why borderline: constituency is not telecom, victims are Asian, and the actionable content for SGE reduces to a known principle (avoid SMS 2FA for high-value accounts).'
  borderline: true
  borderline_reason: Telecom-operator tradecraft with Asian victims; for the constituency it only reinforces avoiding SMS 2FA for officials. Return for awareness, drop if the brief is crowded.
