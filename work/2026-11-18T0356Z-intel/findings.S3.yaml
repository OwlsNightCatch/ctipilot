  discovery_trace: 'first seen at: Standing majors check, kaspersky-securelist feed https://securelist.com/feed/ (two items 2026-11-17 08:00Z); Part 2 read via extract https://securelist.com/operation-shadowcloud-graphdoor/122005/ ; Part 1 extract failed (connection reset, jina balance exhausted), re-read with `url --direct` https://securelist.com/operation-shadowcloud-gitdoor/122004/ -> pivot: Part 1 introduction links Sophos (''In a recent brief, Sophos touched on a fragment of this campaign'') -> corroborating: https://www.sophos.com/en-us/blog/bronze-sandcastle-deploys-modified-meterpreter-shells . Also relayed by The Hacker News https://thehackernews.com/2026/11/new-gitdoor-and-graphdoor-backdoors.html (rewrite, not cited).'
  summary: 'Kaspersky GReAT (2026-11-17, two parts) describes Operation ShadowCloud, first identified in early 2026: the operator abuses the legitimate MeshCentral MeshAgent to drop a trusted executable, a malicious loader DLL and an encrypted config.ini, and the in-memory backdoors hide their command channel in cloud services. GitDoor takes commands and plug-ins from a public GitHub repository and returns results to a private one through the REST API using a GitHub personal access token, opening one issue per session and labelling and unlabelling it ''bug'' in a loop while it polls; GraphDoor authenticates an attacker-registered application to login.microsoftonline.com with the client-credentials grant (''the malicious application, not a user'') and reads and writes files and list items in a named SharePoint site (tenant given in the report, ownership not stated) through Microsoft Graph, naming files like JavaScript source maps; modified Erfrp and Ably plug-ins proxy traffic. The shellcode set (mostly COFF objects) covers process injection, keylogging, screenshot, cookie theft, Mimikatz, WhatsApp key extraction and PetitPotam-style EFSRPC coercion. Kaspersky found victims in Asia and Africa, primarily government, could not identify the initial entry point at the Taiwanese organisation it examined (it suspects reuse of an earlier infection) and says it lacks the information to attribute definitively, but sees staging-directory and timing overlaps with FamousSparrow and CopperTurtle implants. Sophos CTU (2026-10-20) independently tracks matching sideloading (Sandboxie, javaw.exe, Krita, NVDA, bginfo and others), the same GitHub account and Ably/gofile use as BRONZE SANDCASTLE, a China-based group active in UTC+8 hours, with victims between August 2025 and August 2026 in the Philippines, Taiwan, Afghanistan, Namibia and likely South Korea, and a payload that copies ntds.dit after a Volume Shadow Copy.'
  region_nexus: Asia and Africa (Taiwan, Philippines, Afghanistan, Namibia, probably South Korea); no European or Swiss victim reported; relevance is transferable China-nexus government-targeting tradecraft
  primary_sector_nexus: 'indirect: government networks are the stated primary victim class; the cloud-C2 and sideloading behaviours transfer to any tenant'
