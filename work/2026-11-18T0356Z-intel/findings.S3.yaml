- title: 'ARTEX delta: Amazon''s decoy sensors capture agents'' own campaign records (AI-credential theft at scale from LLM gateways and AI app builders; some operator instructions exclude government domains), Cloudflare counts 50+ copycat frameworks, 30x traffic growth and identity-chained CI/CD token abuse, and Talos finds ARTEX run beside VShell, GoPhish and AdaptixC2'
