    attribution: Sophos CTU
    source_url: https://www.sophos.com/en-us/blog/bronze-sandcastle-deploys-modified-meterpreter-shells
  extended_notes: 'Exposure: Windows estates where MeshCentral agents are not an approved tool, where non-browser processes may reach api.github.com, graph.microsoft.com, tenant SharePoint hosts or Ably, and where signed third-party binaries (Sandboxie, Java, Python, ZoomIt, Krita, NVDA, bginfo) can run from system or ProgramData paths. Government networks in Asia and Africa are the reported victims; no European case is reported.

    Detection (telemetry classes): software inventory and process-creation events for MeshAgent and its WebSocket session to /agent.ashx on 443; image-load events for an unsigned or mismatched DLL loaded by a renamed trusted binary with an adjacent config.ini; proxy or DNS logs for non-browser processes calling api.github.com with a fixed Chrome 122 User-Agent, creating issues and toggling a ''bug'' label, or POSTing a client-credentials token request to login.microsoftonline.com for an application the organisation does not own followed by Graph calls to a SharePoint host outside its tenant (files named main.<8 characters>.js.map); Ably realtime or Pusher-compatible WebSocket traffic from non-browser processes; named pipes and shared-memory objects keyed by process ID; reflective PE loading and COFF plug-in execution in memory (Sophos''s recommended memory-telemetry focus); vssadmin shadow copy followed by ntds.dit copy.

    Hardening: allow-list remote-management agents; Microsoft Entra tenant restrictions v2 and egress policy so that Graph and SharePoint traffic can only reach the organisation''s own tenants; block non-browser GitHub API access where developers do not need it; application control that stops signed binaries loading DLLs from their own directory (WDAC / AppLocker DLL rules); EDR memory scanning for position-independent loaders.

    Triage: GitHub, Graph and SharePoint API calls are normal for developer tools, Office and sync clients. Discriminators are the calling process (javaw.exe, pythonw.exe, Start.exe or ZoomIt running from system32 or ProgramData rather than the application''s install path), an application ID or tenant that is not the organisation''s, issue and label churn at polling cadence, and an adjacent encrypted config.ini.

    Attribution handling: Kaspersky (infrastructure/staging overlap with FamousSparrow and CopperTurtle implants within one day, a FamousSparrow RC4 key found in a sideloaded loader) declines a definitive attribution; Sophos (victimology, UTC+8 activity, bespoke loaders) assigns a separate cluster, BRONZE SANDCASTLE. Both telemetry sets overlap, so the two naming schemes probably describe the same or a closely related operator; the alternative is a shared developer or access provider supplying several Chinese-speaking groups, which Kaspersky itself leaves open.'
