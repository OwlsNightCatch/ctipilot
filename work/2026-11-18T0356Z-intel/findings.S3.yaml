  extended_notes: 'Delta for the existing ARTEX entry (one entry per finding): first-hand sensor and IR evidence that the operators'' own instructions exist in two shapes (credential-and-model theft; fraud), the product list of the AI-gateway playbook, the ecosystem growth numbers, and the static-CI/CD-token pivot. Exposure: internal or pilot LLM gateways and AI app builders reachable from the internet with default master keys or unclaimed first-run setup; provider keys in client-side bundles, repositories and container layers; static, non-expiring, un-IP-restricted API tokens in CI/CD.

    Detection (telemetry classes): web-server and reverse-proxy logs for fingerprinting of AI gateway admin and provider-configuration endpoints and for the isCliRequest header on One API-family servers; cloud audit logs for new resources with machine-generated or tool-named identifiers (Cloudflare saw Workers named artex-*) and bursts of 60+ requests a minute from one token; billing and model-usage anomalies (unexpected spend on managed model services); token-use from a source outside the CI runner''s network.

    Hardening (all three sources agree on hygiene over novelty): remove default or hardcoded credentials, bring AI gateways and inference endpoints under production controls, restrict API tokens by IP and lifetime, scan code, artefacts and container layers for keys. The two CVE ids in `cves` (CVE-2025-3248 Langflow, CVE-2026-28797 RAGFlow) are references in Amazon''s captured playbook, not new findings; keep them out of any new vulnerability entry. Caution: Amazon''s ''government domains excluded'' is a sample instruction in some captured records from disparate groups and says nothing about other operators; the FBI FLASH and earlier entries already list government among targeted sectors. Cloudflare''s ''Modern Security Model'' is a vendor product pitch layered on first-hand IR observations; only the observations are carried here.'
