  - quote: selecting proxies that geolocate to the same approximate location as their victim users, thereby avoiding impossible travel or other heuristic-based alerting mechanisms
    attribution: Google Threat Intelligence Group / Mandiant
    source_url: https://cloud.google.com/blog/topics/threat-intelligence/cold-relic-a-case-study-in-impersonation-and-compromise/
  extended_notes: 'Exposure: any M365 or Google Workspace tenant where admin and user accounts can enrol passkeys, backup codes or new MFA devices without an out-of-band approval, where push-style MFA is allowed, and where federated SSO (Entra ID in front of Workspace) is used; victims named as targets are government officials, defense contractors and NGOs in Europe and North America.

    Detection (telemetry classes): identity-provider sign-in logs (Super Admin logins from consumer-ISP or residential-proxy ASNs, bursts of denied or unanswered push prompts then one approval), authentication-method and device-registration audit events (a device model new to the tenant, passkey or backup-code creation, MFA device added to a privileged account), Workspace Admin audit logs (CUSTOMER_TAKEOUT_CREATED, Alert Center alert deletion or modification, directory user-list download), Drive audit (bulk sharing to external or free-mail addresses), OAuth token grants (broad mail scope to an unapproved or native desktop mail client such as Thunderbird or Proton Mail). GTIG lists matching Google SecOps rule names: MFA Fatigue Attack, Customer Takeout Initiated, Alert Center Alert Deletion, Directory User List Download, Drive Bulk External or Freemail File Sharing, Device or Passkey Enrollment Following MFA Fatigue, OAuth Broad Mail Scope Granted to Unapproved Client.

    Post-compromise check: GTIG records a victim that reset passwords but did not revoke sessions, so the actor kept access; remediation has to revoke all sessions and refresh tokens, third-party OAuth authorisations, passkeys, backup codes and unrecognised MFA devices in both Workspace and Entra ID, not only the password.

    Triage: an admin-initiated Customer Takeout or bulk external share is a legitimate feature (migration, legal hold); the discriminators in this case are the preceding MFA-fatigue burst, a first-ever device model and passkey enrolment on the same account, a residential-proxy source ASN and an Alert Center deletion in the same session.

    Hardening named by GTIG: phishing-resistant FIDO2/WebAuthn keys, restricting and auditing passkey registration, requiring administrator or out-of-band approval for new MFA devices, enriching sign-in logs with residential-proxy reputation, blocking or alerting on admin logons from consumer ISPs and proxy ASNs, DLP rules on cloud storage for credentials, rosters and .pst files, and mandatory session and OAuth revocation in BEC playbooks.

    Attribution handling: GTIG owns the group naming and cites the DOJ for the FSB link; the two reported intrusions are tied to each other by GTIG''s reading of URL parameters and impersonation pretexts (''likely''), not by shared infrastructure.'
- title: 'Operation ShadowCloud: Kaspersky and Sophos both document a China-nexus toolset whose GitDoor backdoor takes commands through the GitHub API, GraphDoor through Microsoft Graph with app-only tokens against a SharePoint tenant, and Ably relays, delivered by an abused MeshCentral agent and side-loaded Sandboxie, Java and Python binaries against government networks in Asia and Africa'
