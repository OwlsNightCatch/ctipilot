- title: 'COLD RELIC (COLDRIVER, Star Blizzard): Mandiant details how a Russian FSB-nexus group turns one cloud tenant compromise into the impersonation pretext for the next, using residential proxies in the victim''s region, MFA push fatigue, attacker-enrolled passkeys and backup codes that survive password and session resets, and Google Workspace Customer Takeout'
  sources:
  - url: https://cloud.google.com/blog/topics/threat-intelligence/cold-relic-a-case-study-in-impersonation-and-compromise/
    publisher: Google Threat Intelligence Group / Mandiant
    date: '2026-11-17'
    role: primary
  discovery_trace: 'first seen at: Standing majors check, mandiant-gtig feed https://feeds.feedburner.com/threatintelligence/pvexyqv7v0v (newest item 2026-11-17 14:00Z) -> primary (no pivot needed): https://cloud.google.com/blog/topics/threat-intelligence/cold-relic-a-case-study-in-impersonation-and-compromise/ . Corroboration attempt: WebSearch ("COLD RELIC Mandiant COLDRIVER Google Workspace passkeys residential proxies Customer Takeout impersonation") returned only 2025 LOSTKEYS-era COLDRIVER items, no independent report of these two intrusions.'
  summary: Mandiant and GTIG (2026-11-17) report a series of linked incident-response cases in which COLD RELIC, the name GTIG now uses for the group formerly tracked as COLDRIVER and UNC4057 (also Star Blizzard, Callisto, Gossamer Bear; GTIG cites a US Department of Justice assessment that it operates within the FSB), reused data stolen in one US organisation as the pretext for the next. In a late-2025 Google Workspace intrusion the operators logged in with a stolen Super Admin credential from a residential proxy located near the victim, kept pushing MFA prompts until a user approved one, registered a device model never before seen in the tenant, and then held access for months with attacker-enrolled passkeys, MFA backup codes and rogue MFA devices; they mass-shared and downloaded Drive content, queried the Admin security investigation and email audit logs, viewed, modified and deleted Alert Center notifications, exported the employee list, ran a domain-wide Customer Takeout export, synced inboxes to external mail clients over OAuth, and re-authenticated with passkeys that survived password and session resets. In a 2026 intrusion at a second US organisation (Entra ID as federated SSO for Google Workspace), Mandiant says the actor opened a conversation on an encrypted messaging app while impersonating an employee of the first victim, shared links that harvested Entra ID credentials and tokens before redirecting to document lures, registered a new MFA device in the SSO and bulk-downloaded the user's drive. GTIG assesses that the first victim's data likely enabled the second approach, says the group's targets include government officials, defense contractors and NGOs across Europe and North America, and reports new phishing operations as recently as November 2026. The evidence is first-hand Mandiant incident response plus GTIG telemetry; no independent public corroboration of these two cases was found.
  region_nexus: Europe and North America per GTIG (government officials named as a target class); both reported victims are US organisations; no Swiss victim reported
  primary_sector_nexus: 'direct: government officials, defense contractors and NGOs are the stated target classes; the identity-plane techniques apply to any M365 / Google Workspace tenant'
