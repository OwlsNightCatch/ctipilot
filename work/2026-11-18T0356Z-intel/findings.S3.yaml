  summary: Optimizely's own status entry (posted 2026-11-17 01:02 UTC) says an unauthorized party exploited a vulnerability in Experimentation to add malicious JavaScript to some customer projects, that the vulnerability is fixed, the injected code removed and affected accounts secured; this settles the open question in the existing entry, because Report URI had said it did not know how the attacker obtained write access. Report URI (the discoverer) reports 178 organisations served the code on 2026-11-16, an attacker script written into each project's Project JavaScript field (so the file still came from cdn.optimizely.com, including customer-domain copies), the first injection seen at 04:21 UTC in the BBC snippet, 26 rebuilds of the payload during the day, mass clean-up between about 20:40 and 21:10 UTC, and one snippet re-infected after a first clean-up. The payload swapped wallet addresses in page text, form fields, clipboard and outgoing requests, skimmed Luhn-valid card numbers typed into a site's own form fields (hosted payment iframes were out of reach), sent non-HttpOnly cookies and an html2canvas screenshot to the attacker, and on iOS 18.6 or earlier reloaded the page every 60 seconds to retry the exploit. Report URI counted about USD 7,040 in the attacker's wallets by 19:25 UTC and saw the same actor's injector on Turkish sites from 17 September; the iOS kit's own comments say iOS 18.7.3 and later and 26.3 and later are patched.
