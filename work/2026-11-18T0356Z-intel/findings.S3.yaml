  summary: 'Three independent telemetry holders add to the ARTEX picture. Amazon Threat Intelligence (2026-11-13) says its MadPot decoy sensors, set up to look like LLM chat-completion APIs, received requests from ARTEX-style agents between 2026-10-03 and 2026-11-05 that carried the agents'' own persistent task context, so the records show the operators'' standing instructions: one campaign hunts AI-provider keys and cloud credentials in internet-exposed LLM gateways and AI app builders (One API family, LiteLLM, Dify, FastGPT, Langflow, RAGFlow, Open WebUI, LobeChat, Ollama) using a codified playbook of default master keys, claimable uninitialised installs, anonymous admin endpoints, an isCliRequest header bypass, SSRF to cloud metadata and secrets left in client-side files, grading each credential L1 to L3; another targets two cryptocurrency exchanges'' KYC with deepfakes. Amazon assesses with moderate confidence both ARTEX use and disparate Chinese-nexus operators (simplified-Chinese prompts, China time zone), notes that sample instructions exclude mainland-China targets and government domains and force traffic through proxies, and says it cannot verify the outcomes the agents reported. Cloudflare (2026-11-13) reports more than 50 framework families scanning its customers in three days, requests for AI pentest tooling up 30x since 2026-10-01, ARTEX and forks at over 60% of known orchestrators and more than 12,000 repositories since the original was removed on 2026-10-08, and incident-response cases in which static, non-expiring CI/CD tokens let attackers pivot from a hyperscaler environment into the customer''s Cloudflare account, one with Worker scripts named artex-*, over 69 requests a minute and 400 database-dump requests in an hour. Talos (2026-11-13) adds that ARTEX has no built-in C2 and has been seen deployed beside VShell, GoPhish and AdaptixC2, and counts more than 700 reachable PentAGI instances.'
  region_nexus: global; ARTEX activity named against government and ministries in earlier entries; Amazon's government-domain exclusion is one operator group's instruction, not a guarantee
