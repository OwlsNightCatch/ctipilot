  summary: 'Oracle''s Critical Security Patch Update for Java SE (2026-11-17) lists 11 flaws, all remotely exploitable without authentication, among them CVE-2026-114938 in the Compiler component at CVSS 3.1 8.1 (credited to Calif.io), affecting 17.0.21.0.3, 21.0.13.0.3, 25.0.5.0.3 and 27.0.1.0.3 plus 8u511-perf and the GraalVM lines. Cisco Talos (2026-11-18) says the OpenJDK flaw, rated CVSS 4.0 9.2, is triggered by malformed Base64 input, needs x86-64 with AVX-512 VBMI (common Intel and AMD parts), affects OpenJDK 17.0.6 and later, may lead to unauthenticated RCE, and that it has not observed exploitation yet; its stopgap is starting the JVM with -XX:UseAVX=2 (x86-64 only). Equixly and Upwind, reading the OpenJDK source, place the bug in the AVX-512 decoder intrinsic behind the basic and URL decoders of java.util.Base64 (Equixly, citing Oligo research as summarised by Mallory, says a crafted 65-byte input writes 62 bytes past the output buffer), find the written bytes fixed rather than attacker-chosen so a JVM crash is the realistic outcome, say standard Java 8 and 11 and ARM or pre-AVX-512 x86 hosts are not affected (Oracle''s matrix does list Java 8 Performance Pack builds, which Equixly does not address), report no public PoC or exploitation, and name -XX:UseAVX=2 or -XX:-UseBASE64Intrinsics as stopgaps. Impact is therefore contested: RCE is claimed by Talos and reported by Calif.io, a crash is what the independent source reading supports.'
