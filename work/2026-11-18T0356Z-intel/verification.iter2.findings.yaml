- code: F3
  category: claim-not-supported
  section: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce (Exposure)
  item: "Java4Shell: Pre-authentication reach depends on the application decoding attacker-controlled Base64 with the basic decoder before it authenticates the caller"
  url_or_quote: "https://www.upwind.io/blog/java4shell-what-we-know-now-and-what-comes-next/"
  summary: "Upwind: 'Untrusted Base64 reaching Base64.getDecoder() or getUrlDecoder()'; Equixly (cited in the same entry): 'only the basic and URL decoders of java.util.Base64 reach it'. The entry's own Upwind-cited java-jwt path decodes JWT segments with the URL-safe decoder, so 'the basic decoder' wrongly narrows the exposure. Say 'the basic or URL decoder of java.util.Base64'."
- code: F3
  category: claim-not-supported
  section: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce (body, summary, sourcing_note)
  item: "(low confidence) Tenable adds that Immersive's Kevin Breen claims a working exploit ... which has not been released; summary: 'a second researcher claims an unreleased working exploit'; sourcing_note: 'Tenable relays a second researcher's unreleased claim'"
