  - claim_id: e765f8fe4b
    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "summary"
    kind: frontmatter
    text: "Oracle's Critical Security Patch Update and the OpenJDK advisory of 2026-11-17 fix CVE-2026-114938, an out-of-bounds write in the AVX-512 Base64 decoder that Calif, its discoverer, scores CVSS 4.0 9.2 and says it turned into pre-authentication code execution in the default configurations of Keycloak, Jira, Confluence, Artifactory, Jenkins and PingFederate; Oracle scores it CVSS 3.1 8.1 with high attack complexity. Only x86-64 hosts with AVX-512 VBMI are affected, a trigger proof of concept is public, Calif withholds its product chains, a second researcher claims a working exploit with no release stated, and no source reports attacks. NCSC.ch and BACS warn operators to update internet-reachable Java applications and identity services first."
  - claim_id: d5a4d69806
    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "body"
    kind: cited
    text: "Calif, which found it, says HotSpot's x86-64 Base64 intrinsic, which uses AVX-512 VBMI instructions, calculates a negative output length for a short padded input and that length becomes a full 64-byte write that sends 62 bytes past the end of the array; only the landing position of the write is controllable, a misplaced write can crash the JVM ("
    urls: ["https://calif.io/java4shell"]
