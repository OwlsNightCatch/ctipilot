  - title: "Unit 42: OpenClaw AI agent marketplace (ClawHub) hosts persistent malicious skills deploying macOS infostealers and agentic financial fraud"
    sources:
      - url: "https://unit42.paloaltonetworks.com/openclaw-ai-supply-chain-risk/"
        publisher: "Unit 42 (Palo Alto Networks)"
        date: "2026-06-23"
        role: "primary"
      - url: "https://www.bitdefender.com/en_us/blog/labs/helpful-skills-or-hidden-payloads-bitdefender-labs-dives-deep-into-the-openclaw-malicious-skill-trap"
        publisher: "Bitdefender Labs"
        date: "2026-06-23"
        role: "corroborating"
    discovery_trace: "first seen at: unit42 listing page, URL https://unit42.paloaltonetworks.com/unit-42-all-articles/ → primary: Unit 42, URL https://unit42.paloaltonetworks.com/openclaw-ai-supply-chain-risk/"
    summary: |
      Unit 42 identified five persistent malicious skills on ClawHub (OpenClaw's third-party skill marketplace) between February and May 2026 that evaded automated security scanners. Two skills deployed the "cluw" macOS infostealer (linked to Atomic macOS Stealer/AMOS) via Base64-encoded curl-pipe-bash droppers using paste-site redirects (rentry[.]co, glot[.]io) as payload staging. A third skill (omnicogg) used 22 MB file-padding to exceed ClawScan and VirusTotal scanner thresholds, demonstrating that scanners not analyzing content beyond standard thresholds will miss padded payloads. Two additional skills introduced novel agentic attack classes: runtime affiliate injection (money-radar — dynamically overwriting financial recommendation referrals via remote JSON updates) and a Solana front-running pump-and-dump scheme (letssendit — pooling cryptocurrency across a coordinated AI botnet). Attack prerequisites are minimal: a skill on ClawHub with any published description installs with broad local system access, and "installation results in complete control over the agent's identity," bypassing traditional exploit requirements. Defenders should audit all installed OpenClaw/ClawHub skills line-by-line, monitor agent network traffic for connections to paste-site redirectors and anomalous C2 infrastructure, and validate publisher provenance before installation.
    ch_eu_nexus: "global; EU/CH organizations using OpenClaw or similar AI agent frameworks for development or automation are directly in scope"
    public_sector_nexus: "indirect — AI agent platforms increasingly adopted in public-sector IT automation"
    sector: "technology, public-sector"
    cves: []
    actors_campaigns_malware: ["ClawHavoc", "cluw", "Atomic macOS Stealer", "krajekisbtc"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "installation results in complete control over the agent's identity"
        attribution: "Unit 42"
