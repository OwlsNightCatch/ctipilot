  - title: "Ubiquiti UniFi OS triple CVSS-10.0 chain KEV-listed — Mirai actively exploiting CVE-2026-34908/09/10 to root"
    sources:
      - { url: "https://nvd.nist.gov/vuln/detail/CVE-2026-34910", publisher: "NVD/MITRE", date: "2026-06-23", role: "primary" }
      - { url: "https://nvd.nist.gov/vuln/detail/CVE-2026-34909", publisher: "NVD/MITRE", date: "2026-06-23", role: "primary" }
      - { url: "https://nvd.nist.gov/vuln/detail/CVE-2026-34908", publisher: "NVD/MITRE", date: "2026-06-23", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/ubiquiti-patches-three-max-severity-unifi-os-vulnerabilities/", publisher: "BleepingComputer", date: "2026-05-22", role: "corroborating" }
      - { url: "https://www.pwndefend.com/2026/06/09/cve-2026-34910-exploitation-itw-building-a-botnet-mirai/", publisher: "PwnDefend", date: "2026-06-09", role: "corroborating" }
    discovery_trace: "first seen at: cisa-kev bridge, 2026-06-23 KEV additions → CVE-2026-34908/09/10 all dateAdded 2026-06-23 → NVD per-CVE pages fetched → pwndefend.com exploitation-in-wild report cited in NVD references (HTTP 503 on direct fetch, CISA-ADP NVD annotation confirmed) → BleepingComputer product detail article"
    summary: |
      Three Ubiquiti UniFi OS vulnerabilities — CVE-2026-34908 (CWE-284, improper access control), CVE-2026-34909 (CWE-22, path traversal), and CVE-2026-34910 (CWE-20, improper input validation / command injection) — each carry CVSS v3.1 10.0 (AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H). CISA added all three to the KEV catalog on 2026-06-23 with a 72-hour remediation deadline of 2026-06-26. The documented in-the-wild exploitation chain: CVE-2026-34908 (access-control bypass granting localhost-equivalent context to the package-update endpoint) → CVE-2026-34909 (path traversal used to leak credential material that seeds the next step) → CVE-2026-34910 (command injection via unsanitised `pkg_name` parameter, achieves OS command execution as root). PwnDefend documented active Mirai botnet use ("zok" loader) of the CVE-2026-34910 step as of 2026-06-09. Affected hardware spans the entire UniFi OS portfolio: UDM, UDM-Pro, UDM-SE, UDM-Pro-Max (< 5.1.12), UDM-Beast (< 5.1.11), UDR, UDR7, UDR-5G, Express 7, UNVR, EFG, UDW (all < 5.1.12), and UniFi OS Server (< 5.0.8). The remediation deadline is 2026-06-26, which is past for federal agencies at publication time. Ubiquiti Security Advisory Bulletin 064 is the vendor document. Detection: Sysmon EID 1 (parent: UniFi OS webserver) spawning shell children; outbound connections from network-appliance hosts to Mirai C2 patterns; process tree rooted in the UniFi web process executing curl or wget.
    ch_eu_nexus: "global; UniFi OS is widely deployed in Swiss and EU public-sector networks, schools, hospitals and SME environments for campus/office networking. KEV-deadline applies to US federal but EU SOCs should treat 2026-06-26 as the operational urgency anchor."
    public_sector_nexus: "direct — UniFi OS widely deployed in European public institutions"
    sector: "all sectors, heavy concentration in education, healthcare, local government"
    cves: [CVE-2026-34908, CVE-2026-34909, CVE-2026-34910]
    actors_campaigns_malware: ["Mirai (zok variant)"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "A network-accessible attacker could leverage an input validation flaw in UniFi OS to inject and execute arbitrary commands."
        attribution: "NVD (CISA-ADP annotation)"
        source_url: "https://nvd.nist.gov/vuln/detail/CVE-2026-34910"
      - quote: "Listed in CISA's Known Exploited Vulnerabilities Catalog with active exploitation confirmed."
        attribution: "NVD/MITRE"
        source_url: "https://nvd.nist.gov/vuln/detail/CVE-2026-34910"
    extended_notes: |
      The three-flaw chain makes this particularly dangerous: CVE-2026-34908 alone does not provide code execution, but it changes the trust boundary in the package-update flow that CVE-2026-34910 then exploits. If CVE-2026-34908 is not patched, even a version that only updates to a UniFi OS Server release fixing CVE-2026-34910 may still be exploitable via the access-control bypass. Defenders should confirm the full UniFi OS version (5.0.8 / 5.1.11 / 5.1.12 depending on hardware) is applied, not partial updates. Additional CVEs in Bulletin 064 include CVE-2026-33000 (command injection, critical) and CVE-2026-34911 (information disclosure, high).

  - title: "Lantronix EDS5000 serial-to-IP converter: BRIDGE:BREAK username-injection OS command execution to root (CVE-2025-67038) — KEV-listed"
    sources:
      - { url: "https://nvd.nist.gov/vuln/detail/CVE-2025-67038", publisher: "NVD/MITRE", date: "2026-06-23", role: "primary" }
      - { url: "https://thehackernews.com/2026/04/22-bridgebreak-flaws-expose-20000.html", publisher: "The Hacker News", date: "2026-04-22", role: "corroborating" }
    discovery_trace: "first seen at: cisa-kev bridge, 2026-06-23 KEV additions — CVE-2025-67038 dateAdded 2026-06-23 → NVD per-CVE page fetched → CISA advisory ICSA-26-069-02 (403 on bridge) → WebSearch confirmed Forescout BRIDGE:BREAK research and KEV listing"
    summary: |
      CVE-2025-67038 (CVSS v3.1 9.8 CRITICAL, CWE-94/CWE-78) affects the Lantronix EDS5000 series serial-to-IP device converters (EDS5008, EDS5016, EDS5032) running firmware 2.1.0.0R3. The HTTP RPC module executes a shell command to write authentication-failure logs; the username parameter is concatenated directly into the shell command without sanitisation, allowing an unauthenticated remote attacker to inject arbitrary OS commands that execute as root. Lantronix recommends upgrading to firmware 2.2.0.0R1. CISA added CVE-2025-67038 to KEV on 2026-06-23 with a due date of 2026-06-26, confirming active exploitation. Context: Forescout Research Vedere Labs disclosed 22 vulnerabilities collectively named BRIDGE:BREAK in Lantronix and Silex serial-to-IP converters (CVE-2025-67034 through CVE-2026-32965) in April 2026; this vulnerability is from that batch. EDS5000 devices bridge legacy OT/ICS serial equipment (PLCs, relays, meters) onto IP networks and are common in industrial and facility-management environments — compromise gives direct access to connected OT field devices. Detection: network-scan hits against port 80/443 of Lantronix device management interface from unexpected hosts; auth-failure log entries with abnormal username field content (shell metacharacters, whitespace, semicolons).
    ch_eu_nexus: "OT/ICS environments across EU including utilities, building management, manufacturing; Lantronix EDS-series is deployed in Swiss industrial facilities."
    public_sector_nexus: "indirect — OT/ICS serial-bridge risk for utilities and public infrastructure operators"
    sector: "energy, manufacturing, OT/ICS, building management"
