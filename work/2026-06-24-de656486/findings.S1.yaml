  - title: "macOS ClickFix evolution: silent hdiutil DMG mounting drops AMOS infostealer without Finder display"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/security/new-macos-clickfix-attack-silently-mounts-dmgs-to-push-infostealer/", publisher: "BleepingComputer", date: "2026-06-23", role: "primary" }
    discovery_trace: "first seen at: BleepingComputer feed (bleepingcomputer.com/feed/) 2026-06-23 'New macOS ClickFix attack silently mounts DMGs to push infostealer' → BleepingComputer article fetched → Unit42 attribution confirmed via WebSearch → multiple corroborating sources confirmed via WebSearch but no direct-fetch of Unit42 article (Unit42 landing page listed no specific macOS ClickFix article from June 23)"
    summary: |
      Palo Alto Networks Unit 42 (via BleepingComputer, 2026-06-23) documented a new iteration of macOS ClickFix attacks. Prior iterations directed users to install a visible DMG; the new technique instructs users (via fake CAPTCHA Terminal prompt) to paste a curl command that uses `hdiutil attach -nobrowse` to silently mount the DMG without it appearing in Finder or on the desktop. The mounted application (`NNApp.app`, self-signed) is then launched via `open` command. Payload is Atomic macOS Stealer (AMOS): presents a fake System Preferences authentication dialog, collects the entered password, then steals browser credentials (8 Chromium-based: Chrome, Edge, Brave, Opera, Arc, Vivaldi, CocCoc, Yandex; Firefox-derived: LibreWolf, Tor Browser, Zen Browser), cryptocurrency wallet data (Exodus, Electrum, Atomic, Ledger Live, Trezor, 14 others), Keychain data, and documents. C2: `svs-verificationdate[.]beer` and `196.251.107.171`. MITRE ATT&CK: T1204.001 (user execution — malicious link), T1105 (ingress tool transfer), T1056.004 (credential API hooking), T1555 (credentials from password stores). Detection on macOS: `hdiutil attach -nobrowse` invocations by non-admin shell processes; Terminal.app executing pasted commands referencing external download URLs; `NNApp.app` in `/Volumes/` mount paths; suspicious network connections from mounted-application processes to `.beer` TLDs; macOS Unified Log event for fake System Preferences prompts. Hardening: enforce System Integrity Protection; monitor for Terminal commands with encoded/piped download patterns; user awareness that CAPTCHA pages do not require Terminal input.
    ch_eu_nexus: "macOS is prevalent in Swiss and EU public-sector professional environments (design, communications, executive). AMOS credential theft directly targets browser-stored credentials and MFA-backed wallet data."
    public_sector_nexus: "indirect — macOS endpoint risk"
    sector: "all sectors — macOS endpoint users"
