    discovery_trace: "first seen at: THN feed 2026-06-23 'FortiBleed Targeted FortiGate Firewalls in 110 Million-Credential Harvesting Operation' → THN article fetched → SOCRadar whitepaper URL surfaced (PDF fetch failed — size limit) → SecurityWeek article fetched → SpyCloud blog fetched → WebSearch confirmed SOCRadar NATO contractor claim"
    summary: |
      UPDATE (originally covered 2026-06-18, last delta 2026-06-23 tool-chain disclosure). SOCRadar published its full "Dismantling FortiBleed" threat intelligence report on 2026-06-23, providing the most comprehensive operational picture to date. Key new elements: (1) Scale expanded to >430,000 FortiGate firewalls targeted (prior: 86,644 confirmed-compromised devices) and >110 million credentials harvested across 659+ collection cycles — comprising 14.8M RADIUS credentials, 924K NTLM hashes, 130K Kerberos hashes, 89M MySQL tokens. (2) On 2026-06-15, attackers successfully offline-cracked Kerberos hashes and immediately exfiltrated DFS backup data from a confirmed NATO-aligned defense contractor — the first public attribution of a high-value victim. (3) The five-stage operation (Masscan/GeoSplit recon → SSH brute with FortiProbe-fast and a 16-dictionary FortiGate-specific wordlist → FortigateSniffer deployment via SSH capturing 24-protocol traffic → Hashmat/Hashtopolis GPU-cracking → HASHBOT Telegram bot orchestrating exfiltration) operates in 300-minute cycles with 1,000 simultaneous threads, geofenced to avoid home ranges and time-bounded to 07:00-18:00 Moscow Time. (4) SpyCloud analysis found a parallel Synology NAS (336K devices), Sophos (247K), and MSSQL (163K) targeting campaign running from the same infrastructure. Attribution: Russian-speaking IAB, financial motivation, possible collaboration with state-sponsored groups; CyberStrike open-source offensive platform used. 19,000+ devices remain under active sniffing as of publication. This UPDATE adds the NATO contractor DFS exfiltration and the scale expansion from prior coverage.
