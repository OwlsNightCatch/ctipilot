  - title: "PostCSS npm typosquats deliver multi-stage Windows RAT with Chrome credential theft and registry persistence (JFrog XRAY-1002983)"
    sources:
      - { url: "https://research.jfrog.com/post/from-postcss-typosquat-to-windows-rat/", publisher: "JFrog Security Research", date: "2026-06-22", role: "primary" }
      - { url: "https://thehackernews.com/2026/06/malicious-npm-packages-pose-as-postcss.html", publisher: "The Hacker News", date: "2026-06-23", role: "corroborating" }
    discovery_trace: "first seen at: THN feed (feeds.feedburner.com/TheHackersNews) 2026-06-23 item 'Malicious npm Packages Pose as PostCSS Tools to Deliver Windows RAT' → THN article fetched → JFrog primary fetched"
    summary: |
      JFrog Security Research (report 2026-06-22) documented three malicious npm packages published by the account `abdrizak`: `postcss-minify-selector-parser` (XRAY-1002983, 615 downloads), `postcss-minify-selector` (XRAY-1003986, 256 downloads), and `aes-decode-runner-pro` (XRAY-989675, 145 downloads). The packages impersonate the legitimate `postcss-selector-parser` (150M+ weekly downloads). Execution flow: package `index.js` loads an AES-256-GCM encrypted blob, decrypts it, executes a JavaScript dropper that writes and runs `settings.ps1`; PowerShell downloads a ZIP from `nvidiadriver[.]net/verv1432/winpatch-xd7d.win` using `curl.exe -k`; a VBScript (`update.vbs`) extracted from the archive executes `chost.exe loader.py`; Nuitka-compiled Python extension modules (`.pyd` files) activate the RAT. RAT capabilities: remote shell execution, file upload/download via RC4/ARC4-encrypted HTTP POST to C2 `95.216.92.207:8080`, Chrome credential theft via DPAPI/NCrypt/ChaCha20_Poly1305 bypass of app-bound encryption (`auto.pyd`), Chrome extension data exfiltration, WMI-based host profiling and VM detection, registry persistence via `HKCU\Software\Microsoft\Windows\CurrentVersion\Run\csshost`. MITRE ATT&CK: T1195.001 (Supply Chain Compromise), T1036 (Masquerading), T1027 (Obfuscated Files — AES + Nuitka), T1059.001 (PowerShell), T1547.001 (Registry Run Key), T1555.003 (Credentials from Password Stores — Chrome), T1176 (Browser Extensions). Detection: `chost.exe` spawned from `node.exe`/`npm.exe` parent; Python `.pyd` files loaded from `%TEMP%\winPatch\`; `HKCU\...\Run\csshost` registry entry; network connections from npm/node processes to IP `95.216.92.207:8080`.
    ch_eu_nexus: "npm supply-chain risk affects any development team or CI/CD pipeline installing packages without integrity verification — directly relevant to Swiss public-sector software projects and DevSecOps environments."
