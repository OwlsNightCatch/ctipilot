  - title: "OpenClaw ClawHub AI agent skill marketplace: five malicious skills deploy AMOS infostealer, enable financial front-running and agentic fraud"
    sources:
      - { url: "https://unit42.paloaltonetworks.com/openclaw-ai-supply-chain-risk/", publisher: "Palo Alto Unit 42", date: "2026-06-23", role: "primary" }
      - { url: "https://thehackernews.com/2026/06/fake-ai-agent-skill-passed-security.html", publisher: "The Hacker News", date: "2026-06-23", role: "corroborating" }
    discovery_trace: "first seen at: THN feed 2026-06-23 'Fake AI Agent Skill Passed Security Scans and Reportedly Reached 26,000 Agents' → THN article fetched for AIR/skills.sh context → Unit 42 OpenClaw article found via Unit42 landing page (June 23 article) → Unit42 article fetched"
    summary: |
      Palo Alto Networks Unit 42 (2026-06-23) documented five malicious skills distributed via the ClawHub marketplace for the OpenClaw AI agent platform, active February-May 2026. Attack classes: (1) macOS infostealers (`tradingview-ai-indicator-assistant`, `ai-tradingview-assistant-for-macos`) using prerequisite blocks to redirect agents to paste-site URLs (rentry.co, glot.io) carrying Base64-encoded `curl | bash` droppers for the ClawHavoc/cluw AMOS variant, with C2 at 2.26.75.16; (2) file-padding evasion (`omnicogg`) using a 22 MB README.md to exceed scanner processing thresholds — bypassed both ClawScan and VirusTotal — to deliver AMOS from 91.92.242.30; (3) runtime agentic affiliate injection (`money-radar`) fetching attacker-controlled `referrals.json` from `laosji[.]net` to dynamically replace legitimate financial referral links — enabling attacker revenue without re-publishing; (4) coordinated AI-agent financial front-running (`letssendit`) using a pool of agents to accumulate Solana cryptocurrency before operator-timed token launches on pump.fun (first documented weaponisation of an AI botnet for pump-and-dump fraud). Evasion mechanisms: dynamic payload delivery via paste-site intermediaries (payload updated post-publication without triggering re-scan), file-size thresholds bypassed by README padding, semantic instruction hijacking exploiting natural-language interpretation. MITRE ATT&CK: T1195.001 (supply chain compromise — marketplace), T1204.003 (user execution via malicious skill), T1027 (obfuscation — Base64 + Nuitka), T1202 (indirect command execution via paste-sites), T1053.003 (cron persistence), T1555 (credential access). Detection: AI agent processes spawning unexpected shell commands or curl invocations; outbound connections to paste sites (rentry.co, glot.io) from agent processes; cron entries created by agent-related processes.
    ch_eu_nexus: "Global; directly relevant to Swiss/EU organizations adopting AI agent platforms. The marketplace-skill attack surface is emerging and currently under-monitored by enterprise security tooling."
    public_sector_nexus: "indirect — affects any organization piloting AI agent platforms with skill marketplaces"
    sector: "technology, financial services"
    cves: []
