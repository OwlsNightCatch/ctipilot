    extended_notes: |
      The SINGLE-SOURCE flag applies because the Unit42 primary blog post was not fetched directly (article not found on the Unit42 landing page as of this run — possibly still the BleepingComputer piece itself cited Unit42 without a direct link). Multiple independent news outlets (Infosecurity Magazine, Malwarebytes, Any.run) corroborate the hdiutil technique but are all derivative of the same Unit42 research. If the main agent can locate and fetch the Unit42 primary URL for this specific article, the confidence should be upgraded to MULTI-SOURCE.

