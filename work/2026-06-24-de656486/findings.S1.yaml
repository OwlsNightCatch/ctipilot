  - title: "Cisco Unified CM WebDialer SSRF to arbitrary file write (CVE-2026-20230): reconnaissance-phase exploitation observed, PoC public"
    sources:
      - { url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-cucm-ssrf-cXPnHcW", publisher: "Cisco PSIRT", date: "2026-06-03", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/cisco-unified-cm-sme-flaw-cve-2026-20230-now-exploited-in-attacks/", publisher: "BleepingComputer", date: "2026-06-23", role: "corroborating" }
      - { url: "https://nvd.nist.gov/vuln/detail/CVE-2026-20230", publisher: "NVD/MITRE", date: "2026-06-23", role: "corroborating" }
    discovery_trace: "first seen at: BleepingComputer feed (https://www.bleepingcomputer.com/feed/) 2026-06-23 title 'Cisco Unified CM flaw CVE-2026-20230 now exploited in attacks' → BleepingComputer article (HTTP 404 on first URL attempt, corrected URL resolved) → Cisco PSIRT advisory fetched → NVD CVE page fetched"
    summary: |
      CVE-2026-20230 (CVSS v3.1 8.6 HIGH, CWE-918 SSRF) affects the WebDialer service in Cisco Unified Communications Manager (Unified CM) releases 14 and 15. The WebDialer component fails to properly validate HTTP requests, allowing an unauthenticated remote attacker to send crafted HTTP requests using `file://` URL payloads to write arbitrary files to the underlying OS. These written files can subsequently be used to escalate to root, making the effective impact code execution. The WebDialer service is disabled by default; exposure requires active enablement. Cisco PSIRT published the advisory on 2026-06-03 with patches to 14SU6 (Release 14) and a COP interim fix for Release 15 (15SU5 not due until September 2026). SSD Secure Disclosure published a full technical write-up and PoC shortly after. Threat intelligence firm Defused observed exploitation activity "over the weekend" (approximately 2026-06-21/22) from a single IP address, using properly constructed `file://` payloads to write test files (`/tmp/cve-2026-20230-test.txt`) — a reconnaissance pattern. Not yet KEV-listed at the time of source publication (2026-06-23). MITRE ATT&CK: T1190 Exploit Public-Facing Application, T1222.002 File and Directory Permissions Modification (file write step), T1068 Exploitation for Privilege Escalation. Detection: WebDialer access logs for unusual `file://` URIs; web-server process spawning unexpected child processes; file creation events outside normal WebDialer operating paths (Sysmon EID 11 / auditd `CREATE`). Hardening: disable the WebDialer service if not required (`Cisco Unified CM Administration → System → Service Parameters → Cisco WebDialer Web Service → disabled`).
    ch_eu_nexus: "Cisco Unified CM is widely deployed in Swiss and European enterprise telephony. Public-sector UCaaS environments are a deployment target."
    public_sector_nexus: "indirect — enterprise telephony infrastructure"
    sector: "all sectors — enterprise telephony"
    cves: [CVE-2026-20230]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "A successful exploit could allow the attacker to write files to the underlying operating system that could be used later to elevate to root."
        attribution: "Cisco PSIRT"
        source_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-cucm-ssrf-cXPnHcW"
      - quote: "Exploitation appears reconnaissance-focused, writing test files like '/tmp/cve-2026-20230-test.txt'"
        attribution: "BleepingComputer (citing Defused threat intelligence)"
        source_url: "https://www.bleepingcomputer.com/news/security/cisco-unified-cm-sme-flaw-cve-2026-20230-now-exploited-in-attacks/"
    extended_notes: |
      The pre-exploitation reconnaissance pattern (writing `/tmp/cve-2026-20230-test.txt`) is a mass-scanner fingerprinting technique that historically precedes targeted exploitation waves. Defenders with internet-facing Unified CM instances should check for this file as a hunt indicator, without relying on it as a reliable absence indicator (an attacker could clean it up). The fact that 15-train has no full patch until September 2026 makes the COP interim fix important to deploy.

  - title: "WhatsApp VBScript campaign deploys ManageEngine Endpoint Central RMM for persistent access — possible Chinese-speaking operator"
    sources:
      - { url: "https://securelist.com/whatsapp-vbs-rmm-campaign/120290/", publisher: "Kaspersky Securelist", date: "2026-06-22", role: "primary" }
      - { url: "https://thehackernews.com/2026/06/whatsapp-vbscript-campaign-uses-fake.html", publisher: "The Hacker News", date: "2026-06-23", role: "corroborating" }
    discovery_trace: "first seen at: THN feed (feeds.feedburner.com/TheHackersNews) 2026-06-23 item 'WhatsApp VBScript Campaign Uses Fake Documents to Install ManageEngine RMM Tool' → THN article fetched → Kaspersky Securelist primary fetched"
    summary: |
      Kaspersky documented an active campaign (report published 2026-06-22) where an unattributed actor distributes heavily obfuscated VBScript files through WhatsApp direct messages. Lures are financial-themed document names in multiple languages (Portuguese, French, German, Malay). The infection chain is three-stage: Stage 1 VBScript creates randomised working directories under `C:\Users\Public\Documents\`, downloads secondary payloads using curl, bitsadmin, certutil or PowerShell. Stage 2 comprises two scripts: one disables UAC consent prompts by writing `ConsentPromptBehaviorAdmin=0` to `HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System` via repeated `ShellExecute` calls with the `runas` verb, the other downloads a ZIP archive and removes Zone.Identifier alternate data streams. Stage 3 silently installs ManageEngine Endpoint Central (RMM platform) via `msiexec.exe` with silent flags, giving the attacker full remote-management capability over the host. Simplified Chinese characters in code comments and infrastructure overlap with C2 IPs (202.61.160.x range) previously associated with ValleyRAT and Gh0st RAT families suggest a Chinese-speaking operator, but confidence is low and attribution is not definitive. Geographic spread: 80% Malaysia, with Brazil, India, Mexico, Singapore, UK, Spain, Taiwan, Australia, Russia, and Vietnam. MITRE ATT&CK: T1566.001 (Phishing — spearphishing attachment), T1059.005 (VBScript), T1112 (Modify Registry), T1548.004 (UAC bypass), T1219 (Remote Access Software abuse), T1105 (Ingress Tool Transfer), T1027 (Obfuscated Files), T1140 (Deobfuscation). Detection: Sysmon EID 1 `msiexec.exe /quiet` invoked by `wscript.exe` or `cscript.exe`; registry write to `HKLM\...\Policies\System\ConsentPromptBehaviorAdmin` by a non-admin process parent; `bitsadmin` or `certutil -decode` in VBScript context; ManageEngine Endpoint Central agent processes (`DCAgentService.exe`) started without IT-documented provisioning events.
    ch_eu_nexus: "UK is named as one of the affected countries; EU/CH exposure is plausible via the same WhatsApp distribution vector. RMM-abuse is a known precursor to follow-on ransomware deployment."
    public_sector_nexus: "indirect — campaign currently targets consumer/individual accounts but RMM-abuse technique is directly transferable to enterprise/public-sector targets"
    sector: "all sectors — social-engineering via consumer messaging platform"
    cves: []
    actors_campaigns_malware: ["ValleyRAT (infrastructure overlap)", "Gh0st RAT (infrastructure overlap)", "ManageEngine Endpoint Central (abused)"]
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Russian cybersecurity company said it found infrastructure overlaps with prior activity linked to Gh0st RAT and ValleyRAT"
        attribution: "Kaspersky Securelist"
        source_url: "https://securelist.com/whatsapp-vbs-rmm-campaign/120290/"
      - quote: "Stage 2 modifies UAC registry key HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\ConsentPromptBehaviorAdmin to value 0, disabling consent prompts"
        attribution: "Kaspersky Securelist"
