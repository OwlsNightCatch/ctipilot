      - quote: "Xsolis contained the attack within approximately 48 hours"
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/healthcare-ai-firm-xsolis-data-breach-affects-14-million-patients/"
    extended_notes: |
      Defender takeaway: HIPAA Business Associates with access to multi-tenant patient-data repositories
      represent single points of compromise for their entire covered-entity client base. Detection
      focus should be on anomalous access patterns in shared data repositories (unusual query volumes,
      bulk exports, off-hours access) from service/API accounts. Phishing-to-limited-environment suggests
      MFA bypass or MFA not enforced on the compromised account. GDPR Article 28 processor audit
      obligations are the EU equivalent. Swiss DSG equivalents require processor agreements and
      notification within 72 hours of a processor discovering a breach.

  - title: "8X8 Inc SEC 8-K Item 1.05 discloses Klue/Icarus-linked Salesforce data exfiltration (UPDATE on Klue/Icarus campaign)"
    sources:
      - url: "https://www.sec.gov/Archives/edgar/data/0001023731/000102373126000084/eght-20260617.htm"
        publisher: "SEC EDGAR (8X8 Inc filing)"
        date: "2026-06-23"
        role: "primary"
    discovery_trace: >
      first seen at: sec-edgar bridge subcommand `sec-edgar 8k 2026-06-20 2026-06-24 1.05` →
      found filing eght-20260617.htm for 8X8 Inc (ticker EGHT, CIK 0001023731), filed 2026-06-23 →
      primary: SEC EDGAR filing https://www.sec.gov/Archives/edgar/data/0001023731/000102373126000084/eght-20260617.htm
    summary: |
      8X8 Inc (NASDAQ: EGHT), a US cloud-communications provider, filed an Item 1.05 Form 8-K on
      June 23, 2026 disclosing a material cybersecurity incident. On June 11-12, 2026, an unauthorised
      party gained access to 8X8's Salesforce environment via a third-party integration — specifically
      through Klue, a competitive-intelligence SaaS platform. The Icarus extortion group has claimed
      responsibility for the broader Klue campaign. Exfiltrated data includes contract information,
      internal sales notes, and customer contact data (names, business email addresses, business phone
      numbers, business mailing addresses). 8X8 states no customer communications data, voice/video
      recordings, or financial data was accessed. The 8-K confirms 8X8 as a named Klue-integration
      victim alongside others already covered. The SEC mandatory disclosure under Regulation S-K Item
      1.05 (material cybersecurity incidents) represents the formal public confirmation for a publicly
      listed company, triggering investor notification obligations within four business days.
    ch_eu_nexus: "8X8 has EU customers and EU operations; Icarus/Klue campaign affects any organisation using Klue's Salesforce OAuth integration globally including EU public-sector commercial tooling users"
    public_sector_nexus: "indirect — 8X8 provides UCaaS/CCaaS to public-sector clients; Salesforce/Klue OAuth integration gap is directly relevant to any EU public-sector org using similar competitive-intel SaaS integrations"
    sector: "telco, technology"
    cves: []
    actors_campaigns_malware: ["Icarus extortion group"]
    verification: "SINGLE-SOURCE-SEC-FILING"
    confidence: HIGH
    novelty: update-to-prior:2026-06-19
    evidence:
      - quote: "On June 11 and 12, 2026, an unauthorized party accessed certain data in 8x8's Salesforce environment via a third-party integration"
        attribution: "SEC EDGAR / 8X8 Inc Form 8-K Item 1.05"
        source_url: "https://www.sec.gov/Archives/edgar/data/0001023731/000102373126000084/eght-20260617.htm"
      - quote: "The data accessed includes contract information, internal sales notes, and customer contact information including business names, business email addresses, business phone numbers, and business mailing addresses"
        attribution: "SEC EDGAR / 8X8 Inc Form 8-K Item 1.05"
        source_url: "https://www.sec.gov/Archives/edgar/data/0001023731/000102373126000084/eght-20260617.htm"
    extended_notes: |
      Defender takeaway: This filing confirms Icarus's MO of OAuth token abuse against Salesforce via
      third-party SaaS integrations (Klue as the vector). Any org using SaaS-to-Salesforce integrations
      via OAuth should audit the Connected Apps list in Salesforce Setup > App Manager for unexpected
      or stale OAuth grants, review OAuth token event logs (EventType=OAuthToken in Salesforce Event
      Monitoring), and apply the principle of least-privilege to connected app scopes. Salesforce
      Event Log File Browser or the Event Monitoring streaming API are the primary telemetry sources.
      The 4-business-day SEC filing clock (Item 1.05) makes material incidents legally mandatory to
      disclose — 8X8 filed June 23 for a June 11-12 incident (~11 calendar days), within the 4-BD window.

