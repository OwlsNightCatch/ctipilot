  - title: "Xsolis healthcare AI vendor breach exposes 1.4 million patients across seven US health systems"
    sources:
      - url: "https://www.hipaajournal.com/xsolis-data-breach/"
        publisher: "HIPAA Journal"
        date: "2026-06-23"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/security/healthcare-ai-firm-xsolis-data-breach-affects-14-million-patients/"
        publisher: "BleepingComputer"
        date: "2026-06-23"
        role: "corroborating"
      - url: "https://securityaffairs.com/194067/cyber-crime/xsolis-data-breach-impacts-1-4-million-people.html"
        publisher: "Security Affairs"
        date: "2026-06-23"
        role: "corroborating"
    discovery_trace: >
      first seen at: databreaches-net rss feed via bridge (feed https://www.databreaches.net/feed/),
      item title "Xsolis Data Breach Affects 1.4 Million People" →
      pivot: WebSearch "Xsolis data breach 2026 HIPAA" →
      primary: HIPAA Journal https://www.hipaajournal.com/xsolis-data-breach/ (2026-06-23) →
      corroborating: BleepingComputer https://www.bleepingcomputer.com/news/security/healthcare-ai-firm-xsolis-data-breach-affects-14-million-patients/ (2026-06-23) →
      corroborating: Security Affairs https://securityaffairs.com/194067/cyber-crime/xsolis-data-breach-impacts-1-4-million-people.html (2026-06-23)
    summary: |
      Xsolis, a Tennessee-based healthcare AI vendor providing utilization-management and clinical-decision
      software to hospitals, disclosed on June 5 2026 (via PR Newswire) that a phishing attack on
      January 20-22, 2026 resulted in unauthorised access to a limited environment. The incident affected
      1,396,519 patients across at least seven US health systems. Exfiltrated data includes patient names,
      dates of birth, dates of service, medical record numbers, treatment/diagnosis codes, and health plan
      details. Social Security numbers and financial data were not confirmed as compromised. Xsolis
      contained the attack within approximately 48 hours of detection. The 5-month gap between incident
      (January 2026) and broad notification (June 2026) reflects HIPAA's 60-day-from-discovery notification
      clock, with Xsolis serving as a HIPAA Business Associate — the downstream health systems are covered
      entities with their own notification obligations. Phishing-to-limited-environment access suggests
      credential compromise of a service account or employee account with access to a shared data repository.
      No ransomware or encryption was reported; the attacker priority appears to have been data exfiltration.
      The affected population spans multiple health systems, illustrating the third-party vendor supply-chain
      risk in healthcare: a single business-associate compromise propagates notification obligations across all
      covered-entity clients.
    ch_eu_nexus: "US-only victim and data subjects; relevant as a HIPAA-equivalent GDPR third-party processor breach pattern for EU health sector risk modeling"
    public_sector_nexus: "indirect — hospitals are healthcare not public sector; relevant as a third-party vendor supply-chain breach model"
    sector: "healthcare"
    cves: []
