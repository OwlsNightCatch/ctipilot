      with the group's established MO of abusing OAuth integrations to third-party SaaS platforms (see
      Klue/Icarus campaign). GMS provides SS7 and Diameter signalling, roaming, and messaging services to
      mobile operators; a confirmed breach of GMS could carry signals-intelligence implications for telco
      infrastructure. GMS has not issued any public statement confirming or denying the claim. This item
      rests on a single aggregator citing the Icarus leak site and must be treated as unconfirmed until
