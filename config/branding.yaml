# ─────────────────────────────────────────────────────────────────────────────
# Branding profile — the single customization point for the PUBLISHED SITE.
#
# WHAT THIS IS
#   Everything visual / identity / analytics about the static site lives here:
#   the site name and wordmark, taglines and footer copy, logos and favicon,
#   theme colors and fonts, chart palettes, RSS feed identity, sector feed
#   slices, trend cohorts, and the analytics (Umami) integration.
#
#   The RESEARCH-side parameterization (org mission, watchlists, triage,
#   deployment visibility) lives in config/org-profile.yaml — not here.
#   Together the two files are the complete downstream-fork surface: a fork
#   customizes ONLY config/*.yaml + site/branding/* and merges upstream
#   freely. See docs/customization.md for the full fork/rebrand guide.
#
# HOW IT REACHES THE SITE
#   `site/build.py` loads this file at import time. Identity values (name,
#   taglines, footer copy, analytics) are used directly. Theme values are
#   an OVERRIDE LAYER: every empty string below means "inherit the upstream
#   design default from site/assets/css/styles.css" — the recommended state,
#   because it keeps a fork current with upstream design improvements. Set a
#   value to pin/override it; the build then emits assets/css/branding.css
#   after styles.css so your values win without ever editing styles.css.
#   Arbitrary CSS (including @font-face for corporate fonts) goes in
#   site/branding/custom.css — loaded last when present.
#
# SYNTAX (same strict YAML subset as config/org-profile.yaml)
#   - 2-space indentation, no tabs, no flow style except the empty list `[]`.
#   - Full-line comments only (a `#` line); no trailing comments after values.
#   - Multi-line text uses block scalars (`key: |`).
#   Run `python3 site/build.py` to validate — it fails loud on unknown keys.
# ─────────────────────────────────────────────────────────────────────────────

branding_version: 1

# ─────────────────────────────────────────────────────────────────────────────
# Site identity — names, taglines, and standing copy on every page.
# ─────────────────────────────────────────────────────────────────────────────

site:
  # Canonical site name — page-title suffix, og:site_name, RSS channel
  # titles, copyright line, outbound User-Agent of the build's metadata
  # fetches.
  name: "CTIPilot"
  # Header wordmark, split into the strong part and the accent part
  # (rendered <strong>CTI</strong><em>Pilot</em> — the accent colour sits
  # on the second half).
  wordmark_strong: "CTI"
  wordmark_accent: "Pilot"
  # Editorial tagline — home <title>, RSS daily channel title. It follows
  # the site name, so it says what the site IS, never the name again.
  tagline: "Swiss public-sector cyber threat intelligence"
  # Home-page hero lede (one line, plain text).
  lede: "CTIPilot is continuous cyber threat intelligence for Swiss government entities: national, cantonal and communal administrations, emergency services, police and armed forces. Published the hour it is verified; source-linked, IOC-free, autonomously generated by an LLM."
  # Home-page <meta name="description"> / og:description.
  meta_description: "CTIPilot is a continuous cyber threat intelligence (CTI) pipeline for Swiss government entities (national, cantonal and communal administration, emergency services, police, armed forces): per-finding entries, a time-window brief, source-linked, IOC-free, autonomously generated by an LLM."
  # The small line beside the copyright in the footer. The site name is the
  # brand now, so this carries the canonical domain.
  footer_tagline: "ctipilot.ch"
  # NOT RENDERED by the current single-row footer (v4.5 replaced the footer
  # brand block with one line). Kept so a fork that restores a taller footer
  # has the key; editing it changes nothing today.
  footer_lede: |
    Continuous cyber threat intelligence autonomously generated by an LLM.
  # Copyright line, rendered as `© <year> <site name> · <copyright_note>`.
  copyright_note: |
    published under the MIT License.
    Made in Switzerland.
  # Canonical site URL. The SITE_URL environment variable still overrides
  # this at build time (used by CI). Keep in sync with
  # config/org-profile.yaml `deployment.site_url` (the routine's publish
  # poll) — they serve different consumers.
  url: "https://ctipilot.ch/"
  # GitHub repository (owner/name) — header GitHub link, footer source
  # link, 404 issue link, security.txt contact. The GITHUB_REPO
  # environment variable still overrides this at build time.
  github_repo: "OwlsNightCatch/ctipilot"
  # <html lang> and og:locale.
  lang: "en"
  locale: "en_US"
  # Topbar segment labels for the three reading views. Empty → the
  # built-in "Live" / "Daily" / "Changes". (Live is the landing page —
  # the rolling brief renders at the site root.)
  nav_live: ""
  nav_daily: ""
  nav_changes: ""
  # Home hero copy: the mono eyebrow, the headline, and the lede paragraph
  # under it. This block is POSITIONING, so it renders at the FOOT of the
  # landing page, below the findings. Empty → the built-in defaults:
  #   hero_eyebrow: "Continuous cyber threat intelligence"
  #   hero_title:   "Read the signal, not the noise."
  #   hero_subtitle: (inherits site.lede above)
  hero_eyebrow: ""
  hero_title: ""
  hero_subtitle: ""
  # The landing page's own <h1> at the top: what the reader is looking at,
  # not the pitch. Empty → "Live threat brief".
  live_title: ""
  # Dismissible AI-provenance strip under the topbar. `ai_bar_html` may
  # carry inline HTML (e.g. a <b>…</b> lead-in); it is injected verbatim,
  # so keep it operator-trusted. Empty → the built-in copy:
  #   "<b>AI-generated · no human review</b> — verify operationally
  #    critical claims against the linked primary source."
  #   ai_bar_link_label: "how it works →"  (links to the About page)
  ai_bar_html: ""
  ai_bar_link_label: ""

# ─────────────────────────────────────────────────────────────────────────────
# Logos and favicon.
#
# File values are paths RELATIVE TO site/branding/ (svg, png, ico, webp).
# Files are copied into the built site under /branding/ and cache-busted.
# Empty string → the built-in default (inline SVG mark / generated favicon).
# ─────────────────────────────────────────────────────────────────────────────

logo:
  # Header logo next to the wordmark. Empty → built-in concentric-arc
  # "signal" mark. E.g. `header_mark: "logo.svg"`.
  header_mark: ""
  # Footer square mark. Empty file → the text below in the accent square.
  footer_mark: ""
  footer_mark_text: "CTI"
  # Favicon. Empty file → an SVG favicon is generated from the three
  # values below (rounded square, monospace text).
  favicon: ""
  favicon_text: "CTI"
  favicon_bg: "#e85d75"
  favicon_fg: "#0e1116"

# ─────────────────────────────────────────────────────────────────────────────
# Theme — colors and fonts. OVERRIDE LAYER over site/assets/css/styles.css.
#
# Every value is a raw CSS value. Empty string → inherit the upstream design
# default (recommended). Set any value and the build emits
# assets/css/branding.css after styles.css so it wins by cascade order —
# styles.css itself is never edited, which is what keeps upstream merges
# conflict-free. The upstream defaults are noted per token for reference.
#
# Anything beyond tokens (layout, spacing, @font-face for corporate fonts,
# hiding elements) goes in site/branding/custom.css — loaded after
# branding.css when the file exists.
#
# NOTE: overriding `accent` / `info` with a hex ALSO auto-derives the
# matching `--accent-rgb` / `--info-rgb` CSS variables (the translucent
# rgba() fills on badges, focus rings, callouts and the ACT NOW card), so a
# rebrand's accent propagates everywhere from the single `accent` value.
# ─────────────────────────────────────────────────────────────────────────────

theme:
  # Font stacks (raw CSS font-family lists). Upstream defaults are refined
  # system stacks — serif display headlines, sans body, mono metadata.
  # For a corporate webfont: place the files under site/branding/fonts/,
  # declare @font-face in site/branding/custom.css, then name the family
  # here (e.g. sans: "'Corporate Sans', system-ui, sans-serif").
  fonts:
    sans: ""
    serif: ""
    mono: ""
  # Theme-independent tokens.
  # radius: "6px" · radius_lg: "10px" · topbar_h: "56px"
  tokens:
    radius: ""
    radius_lg: ""
    topbar_h: ""
  # Dark palette (the site default). Upstream values for reference:
  #   bg "#0e1116" · bg_elev "#161b22" · bg_elev_2 "#1d242c"
  #   border "#2a313a" · border_soft "#1f252d"
  #   text "#e6edf3" · text_soft "#b1bac4" · text_muted "#7d8590"
  #   link "#79c0ff" · link_hover "#a5d6ff"
  #   accent "#e85d75" · accent_soft "#ff7a8c" · accent_fg "#0e1116"
  #   warn "#ffd866" · crit "#ff6b6b" · ok "#56d364" · info "#79c0ff"
  #   kbd_bg "#21262d" · selection "#264f78"
  #   topbar_bg "rgba(14, 17, 22, 0.92)"
  #   shadow "0 1px 0 rgba(0, 0, 0, 0.25), 0 8px 24px rgba(0, 0, 0, 0.35)"
  dark:
    bg: ""
    bg_elev: ""
    bg_elev_2: ""
    border: ""
    border_soft: ""
    text: ""
    text_soft: ""
    text_muted: ""
    link: ""
    link_hover: ""
    accent: ""
    accent_soft: ""
    accent_fg: ""
    warn: ""
    crit: ""
    ok: ""
    info: ""
    kbd_bg: ""
    selection: ""
    topbar_bg: ""
    shadow: ""
  # Light palette. Upstream values for reference:
  #   bg "#fafbfc" · bg_elev "#ffffff" · bg_elev_2 "#f4f6f8"
  #   border "#d8dee4" · border_soft "#eaeef2"
  #   text "#1c2128" · text_soft "#4d555e" · text_muted "#69707a"
  #   link "#0969da" · link_hover "#0550ae"
  #   accent "#b62b46" · accent_soft "#d8425f" · accent_fg "#ffffff"
  #   warn "" · crit "" · ok "" · info ""
  #   kbd_bg "#f0f3f6" · selection "#b6e3ff"
  #   topbar_bg "rgba(255, 255, 255, 0.92)"
  #   shadow "0 1px 0 rgba(27, 31, 35, 0.04), 0 8px 24px rgba(140, 149, 159, 0.2)"
  light:
    bg: ""
    bg_elev: ""
    bg_elev_2: ""
    border: ""
    border_soft: ""
    text: ""
    text_soft: ""
    text_muted: ""
    link: ""
    link_hover: ""
    accent: ""
    accent_soft: ""
    accent_fg: ""
    warn: ""
    crit: ""
    ok: ""
    info: ""
    kbd_bg: ""
    selection: ""
    topbar_bg: ""
    shadow: ""

# ─────────────────────────────────────────────────────────────────────────────
# Chart palettes — the build-generated SVG charts (Ops dashboard, Trends,
# entity timelines) use these. Empty / [] → upstream defaults.
# ─────────────────────────────────────────────────────────────────────────────

charts:
  # "R,G,B" triple used for translucent accent fills in sparklines and
  # heatmaps. Upstream default "232,93,117" (the dark accent #e85d75).
  accent_rgb: ""
  # "R,G,B" triple for translucent info fills. Upstream default "121,192,255".
  info_rgb: ""
  # Categorical palette for per-model colors on the Ops dashboard.
  # Upstream default:
  #   ["#e85d75", "#79c0ff", "#56d364", "#ffd866", "#d2a8ff",
  #    "#ff9b6b", "#56b3d3", "#bd9bff", "#9bdc4d"]
  model_palette: []
  # Categorical palette for entity timeline strips (12 colors upstream).
  entity_palette: []
  # Source-reliability donut colors on the Ops dashboard.
  # Upstream: high "#56d364" · medium "#ffd866" · low "#e85d75"
  reliability_high: ""
  reliability_medium: ""
  reliability_low: ""

# ─────────────────────────────────────────────────────────────────────────────
# Analytics — reader analytics on the published site.
#
# provider: "umami" → the Umami snippet below is injected on every page and
#           the CSP allows exactly its two hosts. See docs/analytics.md.
#           "none"  → NO analytics: no snippet, no third-party host in the
#           CSP. This is the one-line off switch.
# ─────────────────────────────────────────────────────────────────────────────

analytics:
  provider: "umami"
  umami:
    website_id: "abe09860-85be-4b06-8383-002f2e598061"
    # script_host serves script.js (CSP script-src); beacon_host receives
    # the /api/send pageview POSTs (CSP connect-src). They are DIFFERENT
    # hosts on Umami Cloud — re-derive beacon_host from the live script
    # before changing it (see docs/analytics.md, maintainer note).
    script_host: "https://cloud.umami.is"
    beacon_host: "https://gateway.umami.is"

# ─────────────────────────────────────────────────────────────────────────────
# RSS feeds — channel identity. Channel titles derive from site.name +
# site.tagline; the descriptions are set here.
# ─────────────────────────────────────────────────────────────────────────────

feeds:
  daily_description: "CTIPilot day-by-day cyber threat intelligence coverage for Swiss government entities: autonomously generated, source-linked, IOC-free."
  items_description: "CTIPilot intelligence entries as they are verified and published (threats, incidents, vulnerabilities, research, deep dives), plus one item per update or correction appended to a published entry. pubDate is the discovery moment, or the update's timestamp."
  # Sector feed slices — one filtered per-item RSS feed each. This list is
  # the COMPLETE set: there is no in-code default and no fallback — the
  # site builds exactly the slices defined here (an empty list builds
  # none). `sectors` / `tags` values must exist in site/taxonomy.yaml.
  sector_slices:
    - filename: "feed-public-sector.xml"
      title_suffix: "Public sector"
      description: "Items affecting public-sector environments (national / cantonal / communal administration, emergency services, police, armed forces, public-sector technology suppliers)."
      sectors:
        - "public-sector"

# ─────────────────────────────────────────────────────────────────────────────
# STIX 2.1 export — the /stix/ bundle endpoints. Object ids are uuid5 under
# a project namespace: id_namespace when set (a UUID string — pin it before
# first publish if you fork; changing it later re-mints every object id for
# consumers), else derived from site.url. publisher_name is the STIX
# identity SDO's name; empty → site.name.
# ─────────────────────────────────────────────────────────────────────────────

stix:
  id_namespace: ""
  publisher_name: ""

# ─────────────────────────────────────────────────────────────────────────────
# Trends dashboard — the /trends/ cohort tiles. This list is the COMPLETE
# set: there is no in-code default and no fallback — the dashboard shows
# exactly the cohorts defined here (an empty list shows none). Values must
# exist in site/taxonomy.yaml. `match: "all"` requires every listed tag on
# an item; "any" requires one. Never silently rename a cohort key — the
# tile history restarts.
# ─────────────────────────────────────────────────────────────────────────────

trends:
  cohorts:
    - key: "ransomware"
      title: "Ransomware items / week"
      match: "any"
      tags:
        - "ransomware"
    - key: "actively-exploited"
      title: "Actively-exploited vulnerabilities / week"
      match: "all"
      tags:
        - "actively-exploited"
        - "vulnerabilities"
    - key: "public-sector"
      title: "Public-sector items / week"
      match: "any"
      sectors:
        - "public-sector"
    - key: "supply-chain"
      title: "Supply-chain items / week"
      match: "any"
      tags:
        - "supply-chain"
    - key: "ai-abuse"
      title: "AI-abuse items / week"
      match: "any"
      tags:
        - "ai-abuse"
    - key: "ch-eu"
      title: "Switzerland + Europe items / week"
      match: "any"
      regions:
        - "switzerland"
        - "dach"
        - "europe"
    - key: "nation-state"
      title: "Nation-state items / week"
      match: "any"
      tags:
        - "nation-state"
        - "espionage"
        - "china-nexus"
        - "russia-nexus"
        - "north-korea-nexus"
        - "iran-nexus"
