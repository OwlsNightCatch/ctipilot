# ─────────────────────────────────────────────────────────────────────────────
# Organization profile — the single parameterization point for this deployment.
#
# NOTE: the values shipped here are an EXAMPLE / proof-of-concept demo profile
#   ("Swiss Government Entities" — a generic lens over Swiss government
#   organizations at the national, cantonal and communal level). They disclose
#   no information about any real organization's estate (the watchlists are
#   intentionally empty) and do not represent any specific organization.
#
# WHAT THIS IS
#   Everything organization-specific about the CTI routines lives here: who the
#   briefs are for, which sector/region lens the research agents apply, which
#   products and suppliers deserve a dedicated watchlist sweep, how the
#   organization categorizes vulnerabilities (so briefs carry an immediate
#   org-triage rating on CVE items), and how every item is classified (the
#   NATO Admiralty code for intelligence, org-triage for vulnerabilities).
#
# HOW IT REACHES THE AGENTS
#   `python3 tools/compose_prompts.py --write` renders this file into the
#   ORG-PROFILE managed blocks inside:
#     - prompts/cti-run.md
#     - prompts/verification.md
#     - .claude/agents/cti-research.md
#     - .claude/agents/cti-verification.md
#   The compose-profile GitHub Action (.github/workflows/compose-profile.yml)
#   re-composes on push. NEVER hand-edit the generated blocks — edit this file.
#   Editing only the VALUES here does not require a prompt-version bump; the
#   templates and policy text around the blocks live in the prompts and follow
#   the normal versioning rule.
#
# SYNTAX (strict subset of YAML — parsed by a stdlib-only parser)
#   - 2-space indentation, no tabs, no flow style except the empty list `[]`.
#   - Full-line comments only (a `#` line); no trailing comments after values.
#   - Multi-line text uses block scalars (`key: |`).
#   - `sector` / `additional_sectors` must be values from site/taxonomy.yaml
#     `sectors:`; `home_region` must be a `regions:` value.
#   Run `python3 tools/compose_prompts.py --check` to validate.
# ─────────────────────────────────────────────────────────────────────────────

profile_version: 1

organization:
  # Display name used in the composed mission statements and (short form) in
  # the rendered "Org triage (<short_name>):" label.
  name: "Swiss Government Entities"
  short_name: "SGE"
  # Primary sector lens — MUST be a site/taxonomy.yaml `sectors:` value.
  sector: "public-sector"
  # Optional additional sectors (taxonomy values) the org also cares about.
  # This deployment defends the Swiss public sector only — no additional
  # verticals. Sector tags on entries remain full taxonomy values (an item
  # touching another sector is still tagged with it); this list only steers
  # what the research agents hunt for.
  additional_sectors: []
  # Free-text geographic focus used in mission statements.
  region_focus: "Switzerland, with the Swiss public sector — federal, cantonal and communal — at the centre"
  # Home region for ranking — MUST be a site/taxonomy.yaml `regions:` value.
  home_region: "switzerland"
  # One-to-three-sentence description of the constituency the briefs defend.
  description: |
    Swiss public-sector critical infrastructure: the national (federal),
    cantonal and communal administrations, Swiss emergency services (national
    and cantonal police, fire and rescue, emergency medical services), the
    Swiss Armed Forces and civil protection, and the public institutions and
    technology suppliers that keep these organizations running. The briefs
    serve the defenders working inside these organizations who need exactly
    the information relevant to defending them
  # The reader the briefs are written for. Sets the technical register of
  # every agent in the workflow.
  audience: |
    highly technical SOC / IR professionals. Tier 2/3 IR, threat hunters
    writing their own SIEM/EDR detections, detection engineers, malware
    reversers, red-team-aware defenders, SOC managers from analyst rotations.
    Fluent in MITRE ATT&CK, offensive-tooling terminology, Windows/Linux/AD
    privilege-escalation primitives, identity-protocol abuse (Kerberos, OAuth,
    SAML), endpoint-evasion classes (driver abuse, in-process tampering,
    LOLBins, code-injection), kernel-callback techniques. Write to that level.

# ─────────────────────────────────────────────────────────────────────────────
# Watchlists — organization-specific sharpening on top of general coverage.
# Empty lists are valid (the sweeps become no-ops; nothing else changes).
# The general threat landscape for the sector/region above ALWAYS remains the
# primary mission — watchlist policy (anti-overshoot rules, tagging, sweep
# ownership) lives in the prompts, not here.
#
# products:  estate technologies the research agents sweep for advisories,
#            exploitation reporting, and KEV/EUVD additions every run.
#   - name: "Windows Server"
#     vendor: "Microsoft"
#     exposure: "internal"
#     criticality: "high"
#     notes: "AD domain controllers and file services"
#   - name: "Windows 11"
#     vendor: "Microsoft"
#     exposure: "endpoint"
#     criticality: "high"
#     notes: "managed client fleet"
#   Allowed `exposure` values: internet-facing | internal | endpoint |
#   cloud-saas | ot. Allowed `criticality` values: high | medium | low.
#
# suppliers: companies / service providers the research agents sweep for
#            breach disclosures, incident reports, and compromise claims.
#   - name: "Example Hosting AG"
#     relationship: "managed service provider"
#     criticality: "high"
#     notes: "hosts the citizen-portal estate"
#
# interests: optional standing free-text intelligence topics that get the same
#            relevance boost as a watchlist match.
#   - "e-government identity / eIDAS ecosystem abuse"

watchlist:
  products: []
  suppliers: []
  interests: []

# ─────────────────────────────────────────────────────────────────────────────
# Vulnerability triage — how THIS organization categorizes vulnerabilities.
# When categories are defined, every CVE-typed item in the briefs carries a
# bold `**Org triage (<short_name>):**` line mapping the item's cited facts
# (exposure, auth prerequisite, exploitation status, watchlist membership)
# onto one of these categories. Leave `categories: []` to disable the line
# entirely (the default keeps briefs byte-identical to the pre-profile era).
#
# Example scheme:
#
# vulnerability_triage:
#   intro: |
#     Patch-priority classes per our vulnerability-management directive.
#   default_category: "P3"
#   categories:
#     - id: "P1"
#       name: "Emergency"
#       criteria: |
#         Actively exploited AND (internet-facing estate product OR pre-auth
#         on a widely deployed perimeter technology).
#       response: "Out-of-band patch / mitigate within 24 h; page on-call."
#     - id: "P2"
#       name: "Urgent"
#       criteria: |
#         Actively exploited elsewhere but not internet-facing for us, OR
#         public PoC on an internet-facing estate product without confirmed
#         exploitation.
#       response: "Patch within 7 days; add hunt query."
#     - id: "P3"
#       name: "Scheduled"
#       criteria: |
#         Everything else that clears the brief's inclusion gates but matches
#         neither P1 nor P2.
#       response: "Next regular patch window."

vulnerability_triage:
  intro: ""
  default_category: ""
  categories: []

# ─────────────────────────────────────────────────────────────────────────────
# Classification — how every published item is classified. Two schemes ship,
# and every entry carries exactly one of them:
#
#   1. Intelligence classification (the DEFAULT for every entry) — the NATO /
#      Admiralty code: an independently-assessed source-reliability LETTER
#      (A–F) and information-credibility NUMBER (1–6), written into each
#      entry's `classification:` frontmatter and rendered as e.g. "B2".
#   2. Vulnerability triage (see `vulnerability_triage` above) — used INSTEAD
#      of the Admiralty code for the entry kinds listed in `triage_kinds`,
#      because a reliability/credibility rating does not fit a CVE. Those
#      entries carry `org_triage` instead of `classification`.
#
# Fully customizable: rename the code tokens, rewrite the definitions, or add
# entry kinds to `triage_kinds`. Code tokens must be short (≤4 chars) and are
# the values that appear in each entry's `classification:` frontmatter; the
# gate (tools/check_run.py) FAILs any entry whose reliability/credibility code
# is not defined here. Leave `intel_classification.reliability: []` (and
# `credibility: []`) to disable the intelligence-classification requirement
# entirely — then no entry carries `classification` and the gate does not ask
# for one.

classification:
  # Entry kinds classified with the vulnerability-triage scheme (org_triage)
  # instead of the Admiralty code. Everything else uses intel_classification.
  triage_kinds:
    - "vulnerability"
  # NATO / Admiralty intelligence classification. `reliability` rates the
  # SOURCE (its authority / track record); `credibility` rates the ITEM (its
  # truth given corroboration). Assessed independently — a reliable source
  # never by itself lifts the credibility of the report.
  intel_classification:
    name: "NATO Admiralty code"
    # Conservative fallback when an item genuinely cannot be assessed further.
    # Must be one reliability code followed by one credibility code.
    default: "C3"
    reliability:
      - code: "A"
        definition: "Completely reliable — authoritative primary / first-party source (a national CERT for its own jurisdiction, a vendor PSIRT for its own products); no history of error."
      - code: "B"
        definition: "Usually reliable — original research or reporting with consistent editorial standards and only minor, infrequent issues (most reputable research labs; large corroborating outlets)."
      - code: "C"
        definition: "Fairly reliable — some doubt about consistency, OR the source mainly aggregates / re-reports rather than originates. Corroboration recommended."
      - code: "D"
        definition: "Not usually reliable — significant doubt; carries unverified claims but has occasionally been valid."
      - code: "E"
        definition: "Unreliable — history of invalid information or propaganda."
      - code: "F"
        definition: "Reliability cannot be judged — no track record to evaluate."
    credibility:
      - code: "1"
        definition: "Confirmed — corroborated by other independent sources; logical in itself; consistent with other information on the subject."
      - code: "2"
        definition: "Probably true — not independently confirmed; logical in itself; consistent with other information."
      - code: "3"
        definition: "Possibly true — not confirmed; reasonably logical; agrees with some other information."
      - code: "4"
        definition: "Doubtful — not confirmed; possible but not logical; uncorroborated."
      - code: "5"
        definition: "Improbable — not logical in itself; contradicted by other information."
      - code: "6"
        definition: "Truth cannot be judged — no basis exists to evaluate the information."

# ─────────────────────────────────────────────────────────────────────────────
# National-CERT single-source carve-out — the national CERTs / government
# cybersecurity authorities THIS organization trusts as a single source when
# they are the primary disclosing party for their own jurisdiction or an
# advisory they own. Rendered into the research agent, both verifier agents,
# and prompts/verification.md. REQUIRED key — there is no in-code default;
# this list is the complete set. An explicit empty list `[]` disables the
# carve-out (two-source verification everywhere, no exceptions).

national_certs:
  - "NCSC-CH"
  - "GovCERT.ch"
  - "CERT-EU"
  - "ENISA"
  - "BSI"
  - "ANSSI/CERT-FR"
  - "NCSC-UK"
  - "NCSC-NL"
  - "CISA"
  - "CCN-CERT"
  - "AGID-CSIRT-IT"
  - "CERT.at"
  - "CERT-PL"

# ─────────────────────────────────────────────────────────────────────────────
# Policy & regulatory watch — the regulators, directives, and policy sources
# whose developments change THIS organization's obligations. Composed into
# prompts/cti-run.md as the standing policy / regulatory watch that the intel
# run's S2 (home region & sector) sub-agent sweeps every fire; an item enters
# only when it clears the relevance gate (a `policy`-kind entry or a changelog
# record on the entry it develops). REQUIRED key — there is no in-code
# default; this list is the complete set. An explicit empty list `[]`
# disables the sweep.

policy_watch:
  - "NCSC.ch announcements (use `tools/fetch_source.py` — direct WebFetch 403s)"
  - "Swiss Information Security Act (ISG) and its federal / cantonal implementation developments"
  - "EU NIS2 / CRA developments (transposition steps, implementation deadlines) where they touch public administration"
  - "Swiss e-government / digital public services security developments (e-ID, citizen portals, cantonal digitalization programmes)"
  - "Council of Europe cybercrime convention items"
  - "sanctions and law-enforcement actions affecting publicly-known threat-actor infrastructure"

# ─────────────────────────────────────────────────────────────────────────────
# Deployment — where the built site lives.
#
# site_url:   URL the routine polls in its publish-verification phase to
#             confirm the site rebuilt. REQUIRED key — there is no in-code
#             default. Set to "" to skip site polling (typical for
#             locally-hosted deployments where the web server pulls and
#             rebuilds on its own schedule).
#
# There is NO visibility / TLP gate. This pipeline never filters on TLP or a
# public/private flag: everything the agents can read — including every file
# under intel/ — is fair game to process into entries and reports. Provenance
# is still recorded (closed_sources citations), but nothing is withheld on the
# basis of a TLP marking. Only place material in the repo / intel/ that you
# are willing to have published wherever this deployment renders.

deployment:
  site_url: "https://ctipilot.ch/"
