name: Deploy GitHub Pages site

# Builds the static reader site under site/ and publishes it to the
# `gh-pages` branch. GitHub Pages then serves it (configure once:
# Settings → Pages → Build and deployment → Source: Deploy from a branch
# → Branch: gh-pages, Folder: / (root)).
#
# This workflow is shell-only — no third-party Actions — because the
# org's policy restricts Actions to OwlsNightCatch. The work that
# actions/upload-pages-artifact and actions/deploy-pages would do is
# replaced by a direct force-push of site/_site/ to the gh-pages branch.
#
# Triggers only when the inputs to the build change, so it doesn't run
# on every Claude Code routine commit (most of which only rotate state
# files).

on:
  # Direct push to main (manual commits or external pushes that don't go
  # through the auto-merge chain).
  push:
    branches: [main]
    paths:
      - "briefs/**"
      - "state/**"
      - "sources/**"
      - "docs/**"
      - "README.md"
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  # Routine pushes go through auto-merge-claude.yml, whose `git push origin
  # main` uses GITHUB_TOKEN — and pushes by GITHUB_TOKEN do not retrigger
  # other workflows. Chain explicitly via workflow_run instead.
  # No `branches:` filter — that would scope to the auto-merge run's branch
  # (claude/*), but we want any successful auto-merge to trigger us; the
  # job-level `if:` gates on conclusion=success.
  workflow_run:
    workflows:
      - "Auto-merge claude/* branches to main"
      - "Sync engagement metrics"
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

# Pages allows only one in-flight deploy at a time. Cancel pending runs
# in favour of the newest commit so the live site converges on `main`.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # When chained from auto-merge, only deploy if that run succeeded.
    # All other triggers (push, workflow_dispatch) always run.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Clone repo (shell-only, no Actions)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git fetch --no-tags --depth=1 origin main
          git checkout -B main origin/main

      - name: Build site bundle
        run: python3 site/build.py

      - name: Publish to gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Stage the build output in a fresh tree, then force-push it
          # as a single orphan commit on `gh-pages`. The branch is a
          # publishing target, not a history — full diff lives in main.
          cd site/_site
          git init -q .
          git checkout --orphan gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA::7}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git push --force origin gh-pages
          echo "Pushed site/_site/ → origin/gh-pages."
          echo "If this is the first deploy, set Settings → Pages → Source"
          echo "to 'Deploy from a branch' → 'gh-pages' → '/ (root)'."
