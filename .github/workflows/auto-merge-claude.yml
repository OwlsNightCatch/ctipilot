name: Auto-merge claude/* branches to main

# Background:
# The Claude Code routine container that runs the daily and weekly CTI
# brief workflows always checks out a `claude/<adjective>-<name>-<id>`
# branch on session start. The prompt's Phase 6 first attempts to push
# the brief directly to `main` via `git push origin HEAD:main`. If that
# is rejected (e.g., per-routine "Allow unrestricted branch pushes" is
# off, or branch protection blocks the direct push), the prompt falls
# back to pushing the current `claude/...` branch as-is.
#
# This workflow catches that fallback case. On any push to a `claude/**`
# branch, it fast-forwards `main` from the feature branch, then deletes
# the feature branch. End state in all cases: the brief is on `main`.
#
# This workflow is shell-only — no third-party Actions — because the
# org's policy restricts Actions to the OwlsNightCatch org. The work
# `actions/checkout` would do is replaced with a manual `git init` +
# `git remote add` + `git fetch` using the default GITHUB_TOKEN.

on:
  push:
    branches:
      - "claude/**"
  # Allow manual triggering for branches pushed before this workflow
  # existed, or when an automatic run needs to be re-attempted.
  workflow_dispatch:
    inputs:
      branch:
        description: "Feature branch to merge into main (e.g. claude/determined-hypatia-PCpxM)"
        required: true
        type: string

permissions:
  contents: write

# Avoid simultaneous merges from racing each other on a fast-moving feed.
concurrency:
  group: auto-merge-claude
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo (shell-only, no Actions)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          # Full history of main is needed so `merge-base --is-ancestor`
          # can decide if origin/<feature> is a strict descendant of main.
          git fetch --no-tags origin main
          git checkout -B main origin/main
          git config user.name  "Claude Code"
          git config user.email "noreply@anthropic.com"

      - name: Determine source branch
        id: branch
        # Untrusted inputs (`github.event.inputs.branch`, `github.ref_name`)
        # are read via env vars, NOT interpolated directly into the shell
        # body. A branch named e.g. `claude/foo$(curl evil)` would otherwise
        # let a workflow_dispatch caller — or a push of a pathological branch
        # name — execute arbitrary shell here.
        env:
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
          REF_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_BRANCH:-}" ]; then
            BRANCH="$INPUT_BRANCH"
          else
            BRANCH="$REF_BRANCH"
          fi
          # Strict allowlist for the branch name — must be `claude/<token>`
          # where token is alphanumeric + `-` `_` `.` `/`. Anything else
          # is rejected loudly. This is defence-in-depth: branch names with
          # shell metacharacters cannot have come from the routine, but a
          # workflow_dispatch caller could attempt one.
          case "$BRANCH" in
            claude/*) ;;
            *)
              echo "refused: branch '$BRANCH' is not under claude/" >&2
              exit 1
              ;;
          esac
          if printf '%s' "$BRANCH" | grep -qE '[^A-Za-z0-9._/-]'; then
            echo "refused: branch '$BRANCH' contains disallowed characters" >&2
            exit 1
          fi
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Fast-forward main from feature branch
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail

          # Pull the feature branch into local refs. The strict allowlist
          # in the previous step guarantees `$BRANCH` cannot start with `-`.
          git fetch origin "$BRANCH"

          # Only merge if it is a strict descendant of main.
          # Anything else means a human pushed conflicting work to main
          # while the routine ran; skip and let a human resolve it.
          if git merge-base --is-ancestor main "origin/$BRANCH"; then
            echo "origin/$BRANCH fast-forwards from main; merging."
            git merge --ff-only "origin/$BRANCH"
            git push origin main
            git push origin --delete "$BRANCH" || true
            echo "Merged $BRANCH into main and deleted the feature branch."
          else
            echo "origin/$BRANCH is not a strict descendant of main."
            echo "main may have advanced since the routine started."
            echo "Skipping auto-merge; resolve manually."
            exit 0
          fi
