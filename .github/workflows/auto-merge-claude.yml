name: Auto-merge claude/* branches to main

# Background:
# The Claude Code routine container that runs the daily and weekly CTI
# brief workflows always checks out a `claude/<adjective>-<name>-<id>`
# branch on session start. The prompt's Phase 6 first attempts to push
# the brief directly to `main` via `git push origin HEAD:main`. If that
# is rejected (e.g., per-routine "Allow unrestricted branch pushes" is
# off, or branch protection blocks the direct push), the prompt falls
# back to pushing the current `claude/...` branch as-is.
#
# This workflow catches that fallback case. On any push to a `claude/**`
# branch, it merges the feature branch into `main` and deletes the
# feature branch. End state in all cases: the brief is on `main`.
#
# Three cases are handled:
#   1. Fast-forward — the feature branch is a strict descendant of main
#      (the common case when no other work landed on main during the
#      routine's run). Fast-forward main; delete the feature branch.
#   2. Already merged — the feature branch is an ancestor of main
#      (e.g. PR-merged via the GitHub UI without deleting the branch,
#      or a re-push of work that already landed). Just delete the
#      feature branch.
#   3. Main advanced — main moved forward with non-conflicting work
#      while the routine ran. Create a regular merge commit, push
#      main; delete the feature branch.
#
# Conflict (a real overlap between feature branch and main) is the
# only failure mode and surfaces as a workflow failure (`exit 1` +
# `::error::` annotation) so the operator notices and resolves.
# Earlier versions of this workflow exited 0 on the "main advanced"
# path, which produced a silent skip — main never updated and the
# Actions UI showed Success. That has been fixed.
#
# This workflow is shell-only — no third-party Actions — because the
# org's policy restricts Actions to the OwlsNightCatch org. The work
# `actions/checkout` would do is replaced with a manual `git init` +
# `git remote add` + `git fetch` using the default GITHUB_TOKEN.

on:
  push:
    branches:
      - "claude/**"
  # Allow manual triggering for branches pushed before this workflow
  # existed, or when an automatic run needs to be re-attempted.
  workflow_dispatch:
    inputs:
      branch:
        description: "Feature branch to merge into main (e.g. claude/determined-hypatia-PCpxM)"
        required: true
        type: string

permissions:
  contents: write

# Avoid simultaneous merges from racing each other on a fast-moving feed.
concurrency:
  group: auto-merge-claude
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo (shell-only, no Actions)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          # Full history of main is needed so `merge-base --is-ancestor`
          # can decide if origin/<feature> is a strict descendant of main.
          git fetch --no-tags origin main
          git checkout -B main origin/main
          git config user.name  "Claude Code"
          git config user.email "noreply@anthropic.com"

      - name: Determine source branch
        id: branch
        # Untrusted inputs (`github.event.inputs.branch`, `github.ref_name`)
        # are read via env vars, NOT interpolated directly into the shell
        # body. A branch named e.g. `claude/foo$(curl evil)` would otherwise
        # let a workflow_dispatch caller — or a push of a pathological branch
        # name — execute arbitrary shell here.
        env:
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
          REF_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_BRANCH:-}" ]; then
            BRANCH="$INPUT_BRANCH"
          else
            BRANCH="$REF_BRANCH"
          fi
          # Strict allowlist for the branch name — must be `claude/<token>`
          # where token is alphanumeric + `-` `_` `.` `/`. Anything else
          # is rejected loudly. This is defence-in-depth: branch names with
          # shell metacharacters cannot have come from the routine, but a
          # workflow_dispatch caller could attempt one.
          case "$BRANCH" in
            claude/*) ;;
            *)
              echo "refused: branch '$BRANCH' is not under claude/" >&2
              exit 1
              ;;
          esac
          if printf '%s' "$BRANCH" | grep -qE '[^A-Za-z0-9._/-]'; then
            echo "refused: branch '$BRANCH' contains disallowed characters" >&2
            exit 1
          fi
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Merge feature branch into main
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail

          # Pull the feature branch into local refs. The strict allowlist
          # in the previous step guarantees `$BRANCH` cannot start with `-`.
          git fetch origin "$BRANCH"

          # Case 1 — fast-forward. Feature branch is a strict descendant
          # of main. This is the common path when no other work landed
          # on main during the routine's run.
          if git merge-base --is-ancestor main "origin/$BRANCH"; then
            echo "::notice::origin/$BRANCH fast-forwards from main; FF merge."
            git merge --ff-only "origin/$BRANCH"
            git push origin main
            git push origin --delete "$BRANCH" || true
            echo "Merged $BRANCH into main (fast-forward); deleted feature branch."
            exit 0
          fi

          # Case 2 — already merged. Feature branch tip is an ancestor
          # of main (e.g. PR-merged via the GitHub UI without deleting
          # the branch, or a re-push of already-landed work). Just
          # delete the feature branch.
          if git merge-base --is-ancestor "origin/$BRANCH" main; then
            echo "::notice::origin/$BRANCH is already in main; deleting feature branch."
            git push origin --delete "$BRANCH" || true
            echo "Deleted feature branch $BRANCH (already merged)."
            exit 0
          fi

          # Case 3 — main advanced. Both branches have unique commits.
          # Try a regular merge (creates a merge commit). Most routine
          # runs touch disjoint paths (briefs/YYYY-MM-DD.md is unique
          # per-day; state JSON appends are usually at non-overlapping
          # positions), so git's auto-merge resolves cleanly.
          echo "::warning::main advanced since $BRANCH was created; attempting merge commit."
          if git merge --no-edit -m "Auto-merge $BRANCH into main" "origin/$BRANCH"; then
            git push origin main
            git push origin --delete "$BRANCH" || true
            echo "Merged $BRANCH into main (merge commit); deleted feature branch."
            exit 0
          fi

          # Conflict — fail loudly so the operator notices. The previous
          # version of this workflow exited 0 here, producing a silent
          # skip; that hid the failure from the Actions UI and let stale
          # claude/* branches accumulate.
          echo "::error::Merge conflict between $BRANCH and main; resolve manually."
          git diff --name-only --diff-filter=U || true
          git merge --abort || true
          exit 1
