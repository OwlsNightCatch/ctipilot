name: Sync engagement metrics

# Pulls aggregate page-view counts from the GitHub Repo Traffic API into
# state/engagement.json. The Traffic API is fully aggregate — no IPs, no
# sessions, no cookies — and is computed by GitHub from server logs of
# the GitHub Pages domain. We never see individual visitors.
#
# Window: 14 days, top 10 paths (the API's hard ceiling). The action
# accumulates a per-day snapshot in `history` so longer-horizon trend
# analysis is possible even though the live API window stays at 14 days.
#
# Trigger: every 6 hours, plus manual dispatch. Six hours is a comfortable
# cadence given the Traffic API's caching of ~24 hours behind real time.
#
# Auth note: the GitHub Repo Traffic API requires `Administration: read`
# on a fine-grained PAT (or `repo` scope on a classic PAT). The default
# GITHUB_TOKEN that workflows get cannot request `administration` — that
# permission isn't in the workflow `permissions:` keyword's allowlist.
# So this workflow needs a separately-issued PAT, stored as the
# `TRAFFIC_PAT` repo secret.
#
# One-time operator setup:
#   1. Go to https://github.com/settings/tokens?type=beta
#   2. Generate a fine-grained PAT scoped to ONLY this repo, with
#      "Administration" repository permissions set to Read.
#   3. https://github.com/<owner>/security-newsletter/settings/secrets/actions
#      → New repository secret → name `TRAFFIC_PAT`, paste the token.
#
# If the secret is missing, the workflow exits cleanly with a message
# rather than failing the run, so the rest of the pipeline keeps working.

on:
  schedule:
    - cron: "11 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-engagement
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo (shell-only, no Actions)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git fetch --no-tags --depth=1 origin main
          git checkout -B main origin/main

      - name: Check for TRAFFIC_PAT
        id: token
        env:
          PAT: ${{ secrets.TRAFFIC_PAT }}
        run: |
          if [ -n "$PAT" ]; then
            echo "available=true"  >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TRAFFIC_PAT secret is not set; skipping engagement sync."
            echo "Set it once via Settings → Secrets and variables → Actions."
            echo "Fine-grained PAT, this repo only, Administration: read."
          fi

      - name: Pull traffic and update state/engagement.json
        if: steps.token.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p state

          # All four endpoints in the Repo Traffic API are pulled. The
          # popular/paths endpoint caps at top-10 paths over 14 days, but
          # we accumulate by_brief and popular_paths across runs so that a
          # path falling out of the top-10 doesn't lose its last-known
          # count. Documented:
          # https://docs.github.com/en/rest/metrics/traffic
          gh api "repos/${REPO}/traffic/popular/paths"      > /tmp/paths.json     || echo '[]' > /tmp/paths.json
          gh api "repos/${REPO}/traffic/views"              > /tmp/views.json     || echo '{}' > /tmp/views.json
          gh api "repos/${REPO}/traffic/popular/referrers"  > /tmp/referrers.json || echo '[]' > /tmp/referrers.json
          gh api "repos/${REPO}/traffic/clones"             > /tmp/clones.json    || echo '{}' > /tmp/clones.json

          python3 - <<'PY'
          import json, re, datetime
          from pathlib import Path

          paths     = json.loads(Path('/tmp/paths.json').read_text()     or '[]')
          views     = json.loads(Path('/tmp/views.json').read_text()     or '{}')
          referrers = json.loads(Path('/tmp/referrers.json').read_text() or '[]')
          clones    = json.loads(Path('/tmp/clones.json').read_text()    or '{}')

          state_path = Path('state/engagement.json')
          try:
              existing = json.loads(state_path.read_text()) if state_path.exists() else {}
          except Exception:
              existing = {}

          today = datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')
          today_date = today[:10]

          # ── Brief mapping. Repo Traffic exposes github.com paths only —
          # see docs/security-review.md § 4.1.1. The regex matches the
          # brief filename anywhere in the path so /<owner>/<repo>/blob/.../briefs/X.md,
          # /<owner>/<repo>/raw/.../briefs/X.md, and direct /briefs/X.md
          # are all picked up. Pages-site SPA visitors are NOT visible here.
          BRIEF_RE = re.compile(r'briefs/(?:weekly/)?(?P<name>\d{4}-\d{2}-\d{2}|\d{4}-W\d{2})\.md')

          by_brief = {}
          for entry in paths:
              path = entry.get('path', '')
              m = BRIEF_RE.search(path)
              if not m:
                  continue
              key = m.group('name')
              # If the same brief shows on multiple paths (blob + raw, etc.)
              # take the highest count rather than overwriting.
              prev = by_brief.get(key, {})
              cur_views = entry.get('count', 0)
              if cur_views >= prev.get('views_14d', 0):
                  by_brief[key] = {
                      'name': key,
                      'path': path,
                      'title': entry.get('title', ''),
                      'views_14d':   cur_views,
                      'uniques_14d': entry.get('uniques', 0),
                      'last_in_top10': today_date,
                  }

          # Carry forward last-known counts when a brief drops out of the
          # live top-10 (the API's ceiling).
          prev_by_name = {b['name']: b for b in (existing.get('by_brief') or [])}
          for name, prev in prev_by_name.items():
              if name not in by_brief:
                  by_brief[name] = prev
          merged_briefs = sorted(by_brief.values(), key=lambda b: b.get('views_14d', 0), reverse=True)

          # ── Persist ALL popular paths (not just briefs), with same
          # carry-forward semantics. Useful for the operator to see whether
          # the README, file tree, or specific advisories are getting
          # attention beyond what we attributed to briefs.
          popular_paths = []
          live = {}
          for entry in paths:
              p = entry.get('path', '')
              live[p] = {
                  'path': p,
                  'title': entry.get('title', ''),
                  'views_14d':   entry.get('count', 0),
                  'uniques_14d': entry.get('uniques', 0),
                  'last_in_top10': today_date,
                  'brief_name': (BRIEF_RE.search(p).group('name') if BRIEF_RE.search(p) else None),
              }
          prev_paths = {p['path']: p for p in (existing.get('popular_paths') or [])}
          for p, prev in prev_paths.items():
              if p not in live:
                  live[p] = prev
          popular_paths = sorted(live.values(), key=lambda x: x.get('views_14d', 0), reverse=True)

          # ── Referrers — top 10 over 14 days. Carry forward similarly.
          live_refs = {r.get('referrer'): {
                  'referrer': r.get('referrer'),
                  'count':   r.get('count', 0),
                  'uniques': r.get('uniques', 0),
                  'last_seen': today_date,
              } for r in referrers}
          prev_refs = {r['referrer']: r for r in (existing.get('referrers') or [])}
          for k, prev in prev_refs.items():
              if k not in live_refs:
                  live_refs[k] = prev
          merged_refs = sorted(live_refs.values(), key=lambda r: r.get('count', 0), reverse=True)

          # ── Daily snapshot — keep up to 180 days for trend analysis.
          history = [h for h in (existing.get('history') or [])
                     if not h.get('snapshot_at', '').startswith(today_date)]
          history.append({
              'snapshot_at':           today,
              'window_views_14d':      views.get('count', 0),
              'window_uniques_14d':    views.get('uniques', 0),
              'window_clones_14d':     clones.get('count', 0),
              'window_clone_uniques_14d': clones.get('uniques', 0),
              'top_paths': [{'path': p['path'], 'count': p['views_14d']} for p in popular_paths[:10]],
              'top_referrers': [{'referrer': r['referrer'], 'count': r['count']} for r in merged_refs[:10]],
          })
          history = history[-180:]

          out = {
              'schema_version': 2,
              'updated_at': today,
              'window_days': 14,
              'scope': (
                  "github.com repository traffic. NOT GitHub Pages site traffic — "
                  "the Pages site's visit logs are not exposed by any public API. "
                  "Brief-level counts here reflect readers who opened the markdown "
                  "files directly on github.com (blob view, raw view, file tree)."
              ),
              'totals_14d': {
                  'views':   {'count': views.get('count', 0),  'uniques': views.get('uniques', 0)},
                  'clones':  {'count': clones.get('count', 0), 'uniques': clones.get('uniques', 0)},
              },
              'by_brief': merged_briefs,
              'popular_paths': popular_paths,
              'referrers': merged_refs,
              'history': history,
              'privacy_notice': (
                  "Aggregate counts only — no IP addresses, no session identifiers, "
                  "no cookies, no fingerprints. Source: GitHub Repo Traffic API "
                  "(https://docs.github.com/en/rest/metrics/traffic). The API "
                  "exposes github.com repo traffic only; visits to the deployed "
                  "GitHub Pages site are not separately surfaced by GitHub. "
                  "See docs/security-review.md § 4 for the full posture."
              ),
          }
          state_path.write_text(json.dumps(out, indent=2) + '\n')
          print(
              f"engagement v{out['schema_version']}: "
              f"briefs={len(merged_briefs)} · "
              f"paths={len(popular_paths)} · "
              f"referrers={len(merged_refs)} · "
              f"views_14d={views.get('count', 0)} ({views.get('uniques', 0)} unique) · "
              f"clones_14d={clones.get('count', 0)}"
          )
          PY

      - name: Commit changes (if any)
        if: steps.token.outputs.available == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet -- state/engagement.json; then
            echo "no changes"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/engagement.json
          git commit -m "engagement: sync $(date -u +%Y-%m-%dT%H:%MZ)

          Aggregate-only counts pulled from GitHub Repo Traffic API. No PII.
          See docs/security-review.md (Engagement metrics) for details."
          git push origin HEAD:main
